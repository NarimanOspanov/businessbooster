<!doctype html>
<html lang="kk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Суфлёр</title>
<style>
:root{--bg:#0b0f1a;--fg:#fff;--acc:#ffd43b;--mut:rgba(255,255,255,.5)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}#src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}#res{position:absolute;left:14px;bottom:-22px;font:600 11px ui-monospace,monospace;color:rgba(255,255,255,.35)}
.top{position:fixed;left:0;right:0;top:0;height:52vh;padding:calc(8px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.7) 80%,rgba(0,0,0,0));overflow:hidden}
#clock{position:absolute;right:14px;top:calc(8px + env(safe-area-inset-top));font:600 13px ui-monospace,monospace;color:var(--mut);z-index:2}
#script{position:relative;transition:transform .35s ease;padding-top:4px}
.ln{font-size:clamp(20px,5.6vw,30px);font-weight:700;line-height:1.28;color:var(--mut);margin:0 0 12px;transition:color .2s,font-size .2s}
.ln.done{color:rgba(255,255,255,.28)}
.ln.cur{color:#fff;font-size:clamp(25px,7vw,38px);font-weight:800}
.ln .w{border-radius:6px;padding:0 2px}
.ln.cur .w.said{color:var(--acc)}
.ln.cur .w.now{background:var(--acc);color:#111}
.ln .t{display:block;font:600 11px ui-monospace,monospace;color:rgba(255,255,255,.35);margin-bottom:2px}
#big{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;font-weight:900;color:var(--acc);text-shadow:0 0 30px #000;pointer-events:none;z-index:5}
.panel{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85) 30%);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:600 16px system-ui,sans-serif;border:0;border-radius:14px;padding:14px 16px;background:#1f2740;color:#fff}
button.main{background:var(--acc);color:#111;flex:1}button.red{background:#e2453c}
select{flex:1}
.hint{font-size:13px;color:var(--mut);line-height:1.4}
#takes{display:flex;gap:6px;flex-wrap:wrap}#takes button{padding:9px 12px;font-size:14px}
body.recording .panel{display:none}#live{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:6}body.recording #live{display:flex}#live button{flex:1;padding:16px;font-size:17px;background:rgba(20,26,45,.85)}#live #redo{background:rgba(255,212,59,.92);color:#111}
#view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#view video{flex:1;width:100%;min-height:0;background:#000}
#view .row{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#vtitle{padding:calc(10px + env(safe-area-inset-top)) 16px 6px;color:var(--mut);font-size:14px}
</style></head><body>
<video id="src" playsinline autoplay muted></video><canvas id="cam" width="1080" height="1920"></canvas>
<div class="top"><div id="clock">0,0 с</div><div id="res"></div><div id="script"></div></div>
<div id="big"></div>
<div class="panel">
  <div class="row"><select id="part">
    <option value="hook">1. Хук (0–2,6 с) — в комнате</option>
    <option value="main">2. Объяснение (2,6–45,5 с) — ровный фон</option>
    <option value="all">Всё подряд (0–45,5 с)</option>
  </select></div>
  <div class="row"><button class="main" id="rec">● Запись</button><button id="try">Без записи</button></div>
  <div id="takes"></div>
  <div class="hint">Отсчёт 3-2-1, дальше подсвечивается слово, которое пора говорить. Следующие строки видно заранее: если закончил раньше — можно сразу читать дальше, тайминг подгоню при монтаже.</div>
</div>
<div id="live"><button id="redo">↺ Заново</button><button id="abort">■ Стоп</button></div>
<div id="view"><div id="vtitle"></div><video id="play" controls playsinline></video>
  <div id="upst" style="padding:0 16px;color:#ffd43b;font-size:14px;min-height:1.2em"></div><div class="row"><button class="main" id="up">⬆ Отправить Нариману</button><button id="share">Поделиться</button><button id="save">Скачать</button><button class="red" id="again">Ещё дубль</button><button id="close">✕</button></div></div>
<script>
// [начало, конец, текст]; время в секундах как в референсе
const L = [
  [0.0, 2.6, 'Синусты мектепте былай түсіндіру керек еді.'],
  [2.6, 4.4, 'Қабырғаға сүйеулі баспалдақты елестет.'],
  [4.4, 6.5, 'Синус дегеніміз —'],
  [6.5, 9.1, 'баспалдақтың қаншалықты биікке жеткені.'],
  [9.1, 11.5, 'Яғни биіктікті'],
  [11.5, 14.1, 'баспалдақтың ұзындығына бөлеміз.'],
  [14.1, 16.5, 'Баспалдақ жерде жатса,'],
  [16.5, 19.1, 'биіктік нөл — синус та нөл.'],
  [19.1, 21.5, 'Отыз градусқа көтерейік.'],
  [21.5, 24.1, 'Отыз градуста синус — екіден бір.'],
  [24.1, 26.5, 'Төрт метрлік баспалдақ екі метрге жетеді.'],
  [26.5, 29.1, 'Енді баспалдақты тік қоямыз.'],
  [29.1, 31.5, 'Биіктік — төрт, ұзындық — төрт.'],
  [31.5, 34.1, 'Тоқсан градуста'],
  [34.1, 36.5, 'синус бірге тең.'],
  [36.5, 39.1, 'Сондықтан синус бірден үлкен болмайды:'],
  [39.1, 41.5, 'баспалдақ өз ұзындығынан жоғары жетпейді.'],
  [41.5, 45.5, 'Ал сегіз метрлік баспалдақ отыз градуста қанша метрге жетеді? Пікірге жаз!'],
];
const $ = id => document.getElementById(id);
const fmt = s => s.toFixed(1).replace('.', ',');
const TAIL = 2.5; // запас записи после последней фразы, с
let lastRec = true, gen = 0, stream = null, rec = null, chunks = [], raf = 0, running = false, view = null;
const takes = [];

// разметка текста: каждое слово со своим окном времени (пропорционально длине)
const W = L.map(([a, b, txt]) => { const ws = txt.split(/\s+/).filter(Boolean), sp = 0.88 * (b - a); const tot = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0; return ws.map(w => { const st = a + sp * acc / tot; acc += w.length + 2; return { w, st, en: a + sp * acc / tot }; }); });
function build() {
  const [a, b] = range();
  $('script').innerHTML = L.map(([s, e], i) => s >= a && s < b ? `<p class="ln" data-i="${i}"><span class="t">${fmt(s)} с</span>${W[i].map((x, k) => `<span class="w" data-k="${k}">${x.w}</span>`).join(' ')}</p>` : '').join('');
  show(0);
}
function range() { const p = $('part').value; return p === 'hook' ? [0, 2.6] : p === 'main' ? [2.6, 45.5] : [0, 45.5]; }
let lastI = -2;
function show(t) {
  const [a, b] = range(), tt = a + t; $('clock').textContent = tt < b ? fmt(tt) + ' с' : 'запас ' + fmt(Math.max(0, b + TAIL - tt)) + ' с';
  const i = L.findIndex(x => tt >= x[0] && tt < x[1]);
  const lines = [...document.querySelectorAll('.ln')];
  lines.forEach(p => { const j = +p.dataset.i; p.classList.toggle('cur', j === i && tt < b); p.classList.toggle('done', j < i || tt >= b); });
  const cur = lines.find(p => +p.dataset.i === i);
  document.querySelectorAll('.ln:not(.cur) .w.now, .ln:not(.cur) .w.said').forEach(s => s.classList.remove('now', 'said'));
  if (cur) cur.querySelectorAll('.w').forEach(s => { const x = W[i][+s.dataset.k]; s.classList.toggle('said', tt >= x.en); s.classList.toggle('now', tt >= x.st && tt < x.en); });
  if (i !== lastI) { lastI = i; const target = cur || lines[0]; if (target) { const prev = target.previousElementSibling; const off = prev ? prev.offsetTop + prev.offsetHeight * .35 : target.offsetTop; $('script').style.transform = `translateY(${-Math.max(0, off - 4)}px)`; } }
}
// камера отдаёт кадр в своём формате (часто горизонтальном) — рисуем его на холст 1080×1920 с обрезкой по центру и пишем уже холст: всегда вертикально 9:16
let recStream = null;
async function cam() {
  if (recStream) return recStream;
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } }, audio: { echoCancellation: true, noiseSuppression: true } });
  const v = $('src'); v.srcObject = stream; await v.play().catch(() => {});
  await new Promise(r => v.videoWidth ? r() : v.addEventListener('loadedmetadata', r, { once: true }));
  const c = $('cam'), g = c.getContext('2d');
  const draw = () => { const vw = v.videoWidth, vh = v.videoHeight; if (vw && vh) { const k = Math.max(1080 / vw, 1920 / vh), w = vw * k, h = vh * k; g.drawImage(v, (1080 - w) / 2, (1920 - h) / 2, w, h); $('res').textContent = 'камера ' + vw + '×' + vh + ' → видео 1080×1920'; } requestAnimationFrame(draw); };
  draw();
  recStream = c.captureStream(30); stream.getAudioTracks().forEach(t => recStream.addTrack(t));
  return recStream;
}
let ac; function beep(f = 880, d = .12) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = .15; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {} }
async function countdown(my) { const b = $('big'); b.style.display = 'flex'; for (const n of [3, 2, 1]) { if (my !== gen) break; b.textContent = n; beep(660); await new Promise(r => setTimeout(r, 1000)); } b.style.display = 'none'; if (my === gen) beep(990, .2); }
async function run(record) {
  if (running) return; running = true; closeView(); const my = ++gen; lastRec = record;
  try { await cam(); } catch (e) { alert('Нет доступа к камере: ' + e.message); running = false; return; }
  build(); document.body.classList.add('recording');
  if (record) {
    chunks = []; const types = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const mt = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
    const r = rec = new MediaRecorder(recStream, mt ? { mimeType: mt, videoBitsPerSecond: 8e6 } : {});
    const part = $('part').value, mine = chunks;
    r.ondataavailable = e => e.data && e.data.size && mine.push(e.data);
    r.onstop = () => { // r — свой рекордер этого дубля (глобальный rec к этому моменту уже обнулён)
      if (r.discard) return; // дубль прерван кнопкой
      try {
        const blob = new Blob(mine, { type: r.mimeType || mt || 'video/mp4' });
        if (!blob.size) { alert('Запись пустая — попробуй ещё раз (открой ссылку в Safari или Chrome, не внутри Instagram/Telegram).'); return; }
        takes.push({ blob, part, n: takes.length + 1, url: URL.createObjectURL(blob) }); paintTakes(); openView(takes[takes.length - 1]);
      } catch (e) { alert('Не получилось сохранить дубль: ' + e.message); }
    };
    r.onerror = e => alert('Ошибка записи: ' + ((e.error && e.error.message) || e.message || 'неизвестно'));
    r.start(500); // пишем уже с отсчёта — лишнее вырежу при монтаже
  }
  await countdown(my);
  if (my !== gen) return;
  const [a, b] = range(), t0 = performance.now(), dur = b - a + TAIL;
  const tick = () => { if (my !== gen) return; const t = (performance.now() - t0) / 1000; show(t); if (t < dur) raf = requestAnimationFrame(tick); else { running = false; document.body.classList.remove('recording'); if (rec && rec.state === 'recording') rec.stop(); rec = null; beep(440, .25); } };
  tick();
}
const PN = { hook: 'хук', main: 'объяснение', all: 'всё' };
function paintTakes() { $('takes').innerHTML = takes.map((x, i) => `<button data-i="${i}">▶ Дубль ${x.n} · ${PN[x.part]}${x.sent ? " ✓" : ""}</button>`).join(''); }
$('takes').onclick = e => { const b = e.target.closest('button'); if (b) openView(takes[+b.dataset.i]); };
function openView(x) { view = x; $('upst').textContent = x.sent ? 'Этот дубль уже отправлен ✓' : ''; $('vtitle').textContent = `Дубль ${x.n} · ${PN[x.part]} — проверь звук и картинку`; $('play').src = x.url; $('view').style.display = 'flex'; $('play').play().catch(() => {}); }
function upload(x) {
  if (x.sent) { $('upst').textContent = 'Этот дубль уже отправлен ✓'; return; }
  const xhr = new XMLHttpRequest(); xhr.open('POST', '/api/rec/upload?n=' + encodeURIComponent(fname(x)));
  xhr.setRequestHeader('Content-Type', (x.blob.type || 'video/mp4').split(';')[0]);
  xhr.upload.onprogress = e => { if (e.lengthComputable) $('upst').textContent = 'Отправляю… ' + Math.round(e.loaded / e.total * 100) + '% (' + (e.total / 1e6).toFixed(0) + ' МБ)'; };
  xhr.onload = () => { let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {} if (xhr.status === 200 && j.ok) { x.sent = true; $('upst').textContent = 'Отправлено ✓ Можно писать следующий дубль.'; paintTakes(); } else $('upst').textContent = 'Не отправилось: ' + (j.error || xhr.status) + '. Попробуй ещё раз.'; };
  xhr.onerror = () => { $('upst').textContent = 'Нет связи — попробуй ещё раз (лучше по Wi-Fi).'; };
  $('upst').textContent = 'Отправляю…'; xhr.send(x.blob);
}
$('up').onclick = () => upload(view);
function closeView() { $('play').pause(); $('view').style.display = 'none'; }
function fname(x) { const ext = /mp4/.test(x.blob.type) ? 'mp4' : 'webm'; return `arman_${x.part}_dubl${x.n}.${ext}`; }
$('rec').onclick = () => run(true);
$('try').onclick = () => run(false);
$('again').onclick = () => run(true);
$('close').onclick = closeView;
function cancel() { gen++; cancelAnimationFrame(raf); if (rec && rec.state === 'recording') { rec.discard = true; rec.stop(); } rec = null; running = false; document.body.classList.remove('recording'); $('big').style.display = 'none'; build(); }
$('abort').onclick = cancel;
$('redo').onclick = () => { const again = rec !== null || running; cancel(); if (again) setTimeout(() => run(lastRec), 150); };
$('part').onchange = build;
$('save').onclick = () => { const a = document.createElement('a'); a.href = view.url; a.download = fname(view); a.click(); };
$('share').onclick = async () => { const f = new File([view.blob], fname(view), { type: view.blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: 'Арман — дубль ' + view.n }); } catch (e) {} } else $('save').onclick(); };
build();
</script>
</body></html>
