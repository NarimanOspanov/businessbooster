<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 8 класс: сокращение алгебраических дробей, сложение, вычитание, умножение и деление дробей, уравнения и неравенства с модулем.">
<title>Алгебраические дроби и модуль</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.termbtns{display:grid;gap:6px;margin-top:8px}
.termbtns div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 8px}
.termbtns b{font:500 14px/1 var(--font-mono);min-width:44px}
.termbtns span{font-size:12.5px;color:var(--muted);flex:1}
.termbtns button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.termbtns button:disabled{opacity:.35;cursor:default}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--font-mono);font-size:.92em;line-height:1.25;margin:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.qz{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 13px;margin:0 0 10px}
.qz.ok{border-color:var(--ok)}
.qz .qn{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:8px}
.qz.ok .qn{color:var(--ok)}
.qz p{margin:0 0 10px;line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts button{min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:500 14px/1.3 var(--font-mono);color:var(--fg);cursor:pointer}
.opts button:hover{border-color:var(--muted)}
.opts button.good{border-color:var(--ok);color:var(--ok)}
.opts button.bad{border-color:var(--warn);color:var(--warn)}
.qz .fb{margin-top:8px;font-size:13.5px;line-height:1.45}
.qz .fb.good{color:var(--ok)}
.qz .fb.bad{color:var(--warn)}
@media (max-width:600px){.tools button{min-height:40px}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: дробь из блоков-множителей, две дроби с дополнительными множителями, числовая прямая для уравнений и неравенств с модулем. Элементы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff', CYAN = '#72d4e8';
// number with a Russian decimal comma and a real minus sign
const fmt = v => { const r = Math.round(v * 100) / 100; return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ','); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;

// ================= lesson 1: reducing a fraction =================
// every polynomial lists the factoring methods that work for it and the factors it splits into
const METHODS = { common: 'За скобки', sq: 'a² − b²', full: '(a ± b)²', trin: 'Трёхчлен' };
const METHOD_ERR = {
  common: 'Общего множителя у всех членов нет (кроме 1).',
  sq: 'Это не разность двух квадратов.',
  full: 'Это не полный квадрат a² ± 2ab + b².',
  trin: 'Это не квадратный трёхчлен с одной переменной.',
};
const EX1 = [
  { name: 'Задание', num: { s: 'a² − 8a + 16', ok: ['full', 'trin'], f: [['a-4', '(a − 4)'], ['a-4', '(a − 4)']] },
    den: { s: 'ax − 4x', ok: ['common'], f: [['x', 'x'], ['a-4', '(a − 4)']] }, odz: 'a ≠ 4, x ≠ 0',
    val: { q: 'a = −5, x = −3', opts: [-3, -2, 2, 3], ans: 3 } },

// ================= lesson 2: operations with fractions =================
// factors of numerators and denominators: string + polynomial in x (low degree first)
const FAC = {
  '2': { s: '2', n: 2 }, '3': { s: '3', n: 3 }, x: { s: 'x', p: [0, 1] },
  'x+1': { s: '(x + 1)', p: [1, 1] }, 'x+3': { s: '(x + 3)', p: [3, 1] }, 'x-3': { s: '(x − 3)', p: [-3, 1] },
  'x+2': { s: '(x + 2)', p: [2, 1] }, 'x-2': { s: '(x − 2)', p: [-2, 1] },
};
const FKEYS = Object.keys(FAC);
const EX2 = [
  { name: 'Задание', orig: [['1', '2x + 2'], ['1', '3x² + 6x + 3']], op: '−',
    A: { n: [], d: ['2', 'x+1'] }, B: { n: [], d: ['3', 'x+1', 'x+1'] }, pal: ['2', '3', 'x', 'x+1'],
    opts: [['5', '6(x + 1)²'], ['5x', '6(x + 1)²'], ['3x + 1', '6(x + 1)²'], ['x − 5', '6(x + 1)²']], ans: 2 },
  { name: '2/(x+3) − …', orig: [['2', 'x + 3'], ['1', 'x² + 6x + 9']], op: '−',
    A: { n: ['2'], d: ['x+3'] }, B: { n: [], d: ['x+3', 'x+3'] }, pal: ['2', 'x+3', 'x-3'] },
  { name: 'x/(x−2) + …', orig: [['x', 'x − 2'], ['2', 'x + 2']], op: '+',
    A: { n: ['x'], d: ['x-2'] }, B: { n: ['2'], d: ['x+2'] }, pal: ['x', 'x-2', 'x+2'] },
];
const pmul = (a, b) => { const r = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { r[i + j] += x * y; })); return r; };
const facPoly = list => list.reduce((p, k) => pmul(p, FAC[k].p || [FAC[k].n]), [1]);
function pstr(p) { // polynomial in x, highest degree first
  const parts = [];
  for (let d = p.length - 1; d >= 0; d--) {
    const c = p[d]; if (!c) continue;
    const ab = Math.abs(c), v = d === 0 ? '' : d === 1 ? 'x' : 'x²';
    parts.push({ neg: c < 0, body: v ? (ab === 1 ? v : ab + v) : String(ab) });
  }
  if (!parts.length) return '0';
  return parts.map((q, i) => i === 0 ? (q.neg ? '−' : '') + q.body : (q.neg ? ' − ' : ' + ') + q.body).join('');
}
// product of factors in a short form: 6(x + 1)², x(x + 2), 1
function prodStr(list) {
  let c = 1; const cnt = {}, order = [];
  list.forEach(k => { if (FAC[k].n) c *= FAC[k].n; else { if (!(k in cnt)) { cnt[k] = 0; order.push(k); } cnt[k]++; } });
  order.sort((a, b) => FKEYS.indexOf(a) - FKEYS.indexOf(b));
  const sym = order.map(k => FAC[k].s + (cnt[k] > 1 ? '²³⁴'[cnt[k] - 2] : '')).join('');
  if (!order.length) return String(c);
  return (c === 1 ? '' : c) + sym;
}
const multiset = list => { let c = 1; const m = {}; list.forEach(k => { if (FAC[k].n) c *= FAC[k].n; else m[k] = (m[k] || 0) + 1; }); return { c, m }; };
const sameDen = (a, b) => { const A = multiset(a), B = multiset(b); if (A.c !== B.c) return false; const ks = new Set([...Object.keys(A.m), ...Object.keys(B.m)]); for (const k of ks) if ((A.m[k] || 0) !== (B.m[k] || 0)) return false; return true; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function lcdOf(e) {
  const A = multiset(e.A.d), B = multiset(e.B.d), m = {};
  new Set([...Object.keys(A.m), ...Object.keys(B.m)]).forEach(k => { m[k] = Math.max(A.m[k] || 0, B.m[k] || 0); });
  return { c: A.c * B.c / gcd(A.c, B.c), m };
}
const isLcd = (list, L) => { const X = multiset(list); if (X.c !== L.c) return false; const ks = new Set([...Object.keys(X.m), ...Object.keys(L.m)]); for (const k of ks) if ((X.m[k] || 0) !== (L.m[k] || 0)) return false; return true; };

// ================= lesson 3: equations k·|p·x + q| + c = r =================
const EX3 = [
  { name: 'Задание', v: 'x', k: 0.5, p: 2, q: -5, c: -8, r: -6.5, s: '0,5·|2x − 5| − 8 = −6,5', mod: '|2x − 5|', lo: -2, hi: 7, st: 0.5, lab: 1 },
  { name: '|m| + 3 = 12', v: 'm', k: 1, p: 1, q: 0, c: 3, r: 12, s: '|m| + 3 = 12', mod: '|m|', lo: -12, hi: 12, st: 1, lab: 3 },

];
const modR = e => (e.r - e.c) / e.k;              // value of the modulus after isolating it
const roots3 = e => { const R = modR(e); if (R < 0) return []; const a = (R - e.q) / e.p, b = (-R - e.q) / e.p; return R === 0 ? [a] : [a, b].sort((x, y) => x - y); };
const lhs3 = (e, x) => e.k * Math.abs(e.p * x + e.q) + e.c;

// ================= lesson 4: inequalities |x − a| ∨ b =================
const EX4 = [
  { name: '|x + 1| ≤ 4', a: -1, op: '≤', b: 4, mod: '|x + 1|' },
  { name: '|x + 1| > 1', a: -1, op: '>', b: 1, mod: '|x + 1|' },
  { name: '|x + 6| > 0', a: -6, op: '>', b: 0, mod: '|x + 6|' },
  { name: '|x| < 5', a: 0, op: '<', b: 5, mod: '|x|' },
];
const LO4 = -8, HI4 = 6;
const truth4 = (e, x) => { const d = Math.abs(x - e.a); return e.op === '<' ? d < e.b : e.op === '≤' ? d <= e.b : e.op === '>' ? d > e.b : d >= e.b; };
function inSet4(x) {
  const { A, B, sh, pt } = S;
  if (x < A) return sh[0];
  if (x === A) return pt[0];
  if (x < B) return sh[1];
  if (x === B) return A === B ? pt[0] : pt[1];
  return sh[2];
}
function setStr4() {
  const { A, B, sh, pt } = S, items = [{ lo: -Infinity, hi: A, inc: sh[0] }, { at: A, inc: pt[0] }];
  if (B > A) items.push({ lo: A, hi: B, inc: sh[1] }, { at: B, inc: pt[1] });
  items.push({ lo: B, hi: Infinity, inc: sh[2] });
  const out = []; let cur = null;
  items.forEach(it => {
    if (it.inc) { if (!cur) cur = it.at !== undefined ? { a: it.at, ac: true } : { a: it.lo, ac: false }; return; }
    if (!cur) return;
    if (it.at !== undefined) out.push({ ...cur, b: it.at, bc: false }); else out.push({ ...cur, b: it.lo, bc: true });
    cur = null;
  });
  if (cur) out.push({ ...cur, b: Infinity, bc: false });
  if (!out.length) return '∅ (ничего не закрашено)';
  const n = v => v === -Infinity ? '−∞' : v === Infinity ? '+∞' : fmt(v);
  if (out.length === 2 && out[0].a === -Infinity && out[1].b === Infinity && out[0].b === out[1].a && !out[0].bc && !out[1].ac) return `x ≠ ${fmt(out[0].b)}`;
  return out.map(o => o.a === o.b ? `{${fmt(o.a)}}` : `${o.ac ? '[' : '('}${n(o.a)}; ${n(o.b)}${o.bc ? ']' : ')'}`).join(' ∪ ');
}
function correct4() {
  const e = EX4[S.ex4];
  for (let x = LO4; x <= HI4 + 1e-9; x += 0.25) if (inSet4(x) !== truth4(e, x)) return false;
  return true;
}

const KEY = 'luch-math-algfrac';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null, qa: {},
            ex1: 0, F: null, sel: null, val: null,
            ex2: 0, fsel: 'A', ext: { A: [], B: [] }, ans: null,
            ex3: 0, iso: false, pts: [], none: false, probe: 0,
            ex4: 0, A: -1, B: 2, sh: [false, false, false], pt: [false, false], graph: false };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID();
  if (id === 'reduce') {
    const e = EX1[S.ex1], F = S.F, polys = [...F.num, ...F.den].filter(t => t.poly).length;
    const live = side => F[side].filter(t => !t.poly && !t.cut);
    const nk = live('num').map(t => t.k), dk = live('den').map(t => t.k);
    const common = nk.filter(k => dk.includes(k)).length;
    const cut = F.num.filter(t => t.cut).length;
    const show = side => { const L = F[side].filter(t => !t.cut); if (!L.length) return '1'; if (L.length === 1 && L[0].poly) return L[0].poly.s; return L.map(t => t.poly ? '(' + t.poly.s + ')' : t.s).join(''); };
    return { kind: id, ex: S.ex1, e, polys, common, cut, reduced: !polys && !common, num: show('num'), den: show('den'), val: S.val };
  }
  if (id === 'ops') {
    const e = EX2[S.ex2], dA = [...e.A.d, ...S.ext.A], dB = [...e.B.d, ...S.ext.B], nA = [...e.A.n, ...S.ext.A], nB = [...e.B.n, ...S.ext.B];
    const L = lcdOf(e), same = sameDen(dA, dB), lcdOk = same && isLcd(dA, L);
    const pA = facPoly(nA), pB = facPoly(nB), res = pA.map((v, i) => v + (e.op === '−' ? -1 : 1) * (pB[i] || 0)).concat(pB.slice(pA.length).map(v => (e.op === '−' ? -1 : 1) * v));
    return { kind: id, ex: S.ex2, e, dA, dB, nA, nB, same, lcdOk, numS: `${prodStr(nA)} ${e.op} ${prodStr(nB)}`, resS: pstr(res), ans: S.ans };
  }
  if (id === 'abseq') {
    const e = EX3[S.ex3], R = modR(e), rts = roots3(e), pts = S.pts.slice().sort((a, b) => a - b);
    const good = pts.filter(x => Math.abs(lhs3(e, x) - e.r) < 1e-9).length;
    const solved = rts.length ? pts.length === rts.length && good === rts.length : S.none;
    return { kind: id, ex: S.ex3, e, R, rts, pts, good, solved, iso: S.iso, none: S.none };
  }
  const e = EX4[S.ex4];
  return { kind: 'absineq', ex: S.ex4, e, A: S.A, B: S.B, ans: setStr4(), correct: correct4(), any: S.sh.some(Boolean) || S.pt.some(Boolean) };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
const CW = 0.6; // monospace advance in em
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 20, w, 40, 'transparent')}${R(x, y - 15, w, 30, on ? (col || FG) : '#1a2438', `rx="8" stroke="${on ? (col || FG) : '#33405c'}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, 12, label, on ? '#0b1019' : FG, 'middle', 'font-weight="500"')}</g>`;
}
// fraction drawn in svg: numerator over a bar over denominator, centred at x, bar at y
function fracSVG(x, y, n, d, col = FG, fs = 15) {
  const w = Math.max(n.length, d.length) * fs * CW + 10;
  return T(x, y - 7, fs, n, col, 'middle', 'font-weight="500"') + L(x - w / 2, y, x + w / 2, y, col, 1.4) + T(x, y + fs + 3, fs, d, col, 'middle', 'font-weight="500"');
}
const exChips = (list, cur, pre, y = 90) => { const n = list.length, w = n > 3 ? 108 : 124, gap = 8, x0 = 260 - (n * w + (n - 1) * gap) / 2; return list.map((e, i) => chip(x0 + i * (w + gap), y, w, e.name, cur === i, pre + i, i === 0 && S.done[LID()] ? GREEN : null)).join(''); };

// ---------- lesson 1 ----------
const ROW = { num: 150, den: 214 }, BH = 40;
function rowLayout(side) {
  const items = S.F[side], fs = 15, gap = 14;
  const ws = items.map(t => (t.poly ? t.poly.s : t.s).length * fs * CW + 22);
  const tot = ws.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
  let x = 260 - tot / 2;
  return items.map((t, i) => { const r = { t, i, x, w: ws[i] }; x += ws[i] + gap; return r; });
}
function reduceSVG(m) {
  let h = exChips(EX1, S.ex1, 'e1-');
  const lay = { num: rowLayout('num'), den: rowLayout('den') };
  const left = Math.min(lay.num[0].x, lay.den[0].x) - 10, right = Math.max(...['num', 'den'].map(s => { const l = lay[s][lay[s].length - 1]; return l.x + l.w; })) + 10;
  h += L(Math.min(left, 150), 202, Math.max(right, 370), 202, FG, 2);
  ['num', 'den'].forEach(side => {
    lay[side].forEach((r, j) => {
      const t = r.t, y = ROW[side], sel = S.sel && S.sel.side === side && S.sel.i === r.i;
      const col = t.poly ? BLUE : FCOL[t.k] || VIOL;
      h += `<g data-it="${side}:${r.i}" style="cursor:pointer">` + R(r.x - 4, y - 6, r.w + 8, BH + 12, 'transparent');
      if (t.poly) h += R(r.x, y, r.w, BH, '#1a2438', `rx="9" stroke="${sel ? FG : col}" stroke-width="${sel ? 2.6 : 1.4}" ${sel ? '' : 'stroke-dasharray="5 3"'}`) + T(r.x + r.w / 2, y + 25, 15, t.poly.s, FG, 'middle', 'font-weight="500"');
      else h += R(r.x, y, r.w, BH, col, `rx="9" opacity="${t.cut ? .25 : .95}" stroke="${sel ? FG : INK}" stroke-width="${sel ? 2.8 : 1.4}"`) + T(r.x + r.w / 2, y + 25, 15, t.s, t.cut ? MUTED : INK, 'middle', 'font-weight="500"') +
        (t.cut ? L(r.x + 4, y + BH - 4, r.x + r.w - 4, y + 4, RED, 2.4) : '');
      h += '</g>';
      if (j) h += T(r.x - 7, y + 25, 15, '·', MUTED);
    });
  });
  // result
  if (m.reduced) {
    h += T(150, 296, 13, 'Получилось:', GREEN, 'end') + fracSVG(220, 292, m.num, m.den, GREEN, 15) + T(300, 296, 12, `ОДЗ: ${m.e.odz}`, MUTED, 'start');
  } else h += T(260, 296, 12.5, m.polys ? `Разложите на множители: осталось многочленов — ${m.polys}` : 'Ищите одинаковые множители сверху и снизу', MUTED);
  if (m.e.val) {
    h += T(260, 336, 12.5, `Значение при ${m.e.val.q}:`, m.reduced ? FG : '#5d6880');
    m.e.val.opts.forEach((v, i) => { h += chip(92 + i * 88, 368, 72, fmt(v), S.val === v, 'val-' + v, S.done.reduce && S.val === v ? GREEN : null); });
  } else if (m.reduced) h += T(260, 350, 12.5, 'Это тренировка. Задание — первая дробь.', MUTED);
  return h;
}

// ---------- lesson 2 ----------
const FX2 = { A: 140, B: 380 };
function opsSVG(m) {
  const e = m.e;
  let h = exChips(EX2, S.ex2, 'e2-');
  ['A', 'B'].forEach((k, i) => {
    const cx = FX2[k], sel = S.fsel === k;
    const ns = (e[k].n.length ? e[k].n.map(f => FAC[f].s).join('·') : '1') + S.ext[k].map(f => ' · ' + FAC[f].s).join('');
    const ds = prodStr(e[k].d) + S.ext[k].map(f => ' · ' + FAC[f].s).join('');
    const w = Math.max(ns.length, ds.length) * 14 * CW + 24;
    h += T(cx, 126, 11.5, `${e.orig[i][0]}/(${e.orig[i][1]})`, '#6b7690');
    h += `<g data-fr="${k}" style="cursor:pointer">` + R(cx - Math.max(w, 150) / 2, 136, Math.max(w, 150), 100, sel ? 'rgba(114,212,232,.07)' : 'rgba(26,36,56,.45)', `rx="12" stroke="${sel ? CYAN : '#33405c'}" stroke-width="${sel ? 2 : 1.2}"`);
    h += T(cx, 170, 14, ns, FG, 'middle', 'font-weight="500"') + L(cx - w / 2 + 8, 180, cx + w / 2 - 8, 180, FG, 1.4) + T(cx, 200, 14, ds, FG, 'middle', 'font-weight="500"');
    const dl = k === 'A' ? m.dA : m.dB, ok = m.lcdOk;
    h += T(cx, 225, 12, `знам. = ${prodStr(dl)}`, ok ? GREEN : m.same ? ORANGE : MUTED) + '</g>';
  });
  h += T(260, 192, 22, e.op, FG, 'middle', 'font-weight="500"');
  h += T(24, 270, 12, `Домножить ${S.fsel === 'A' ? 'первую' : 'вторую'} на:`, MUTED, 'start');
  e.pal.forEach((f, i) => { const on = S.ext[S.fsel].includes(f); h += chip(190 + i * 78, 266, 70, FAC[f].s, on, 'pal-' + f, CYAN); });
  if (m.lcdOk) {
    h += T(30, 318, 12.5, 'Общий знаменатель:', GREEN, 'start') + fracSVG(330, 314, m.numS, prodStr(m.dA), GREEN, 14);
    if (!e.opts) h += T(30, 376, 12.5, 'Приводим подобные:', GREEN, 'start') + fracSVG(330, 372, m.resS, prodStr(m.dA), GREEN, 14);
  } else h += T(260, 316, 12.5, m.same ? 'Знаменатели равны, но это не наименьший общий — уберите лишнее' : 'Знаменатели пока разные', m.same ? ORANGE : MUTED);
  if (e.opts) {
    e.opts.forEach((o, i) => {
      const x = 20 + i * 122, on = S.ans === i, col = on ? (S.done.ops ? GREEN : FG) : null;
      h += `<g data-pick="ans-${i}" style="cursor:pointer">${R(x, 342, 114, 58, on ? col : '#1a2438', `rx="9" stroke="${on ? col : '#33405c'}" stroke-width="1.3"`)}${fracSVG(x + 57, 370, o[0], o[1], on ? '#0b1019' : (m.lcdOk ? FG : '#6b7690'), 12)}</g>`;
    });
  }
  return h;
}

// ---------- lesson 3 ----------
const NX0 = 40, NX1 = 480, NY = 262;
const nx3 = (e, v) => NX0 + (v - e.lo) / (e.hi - e.lo) * (NX1 - NX0);
function abseqSVG(m) {
  const e = m.e;
  let h = exChips(EX3, S.ex3, 'e3-');
  h += T(260, 136, 18, e.s, m.solved ? GREEN : FG, 'middle', 'font-weight="500"');
  if (m.iso) {
    const R0 = m.R;
    h += T(260, 164, 14, `${e.mod} = ${fmt(R0)}`, R0 < 0 ? RED : CYAN, 'middle', 'font-weight="500"') +
      T(260, 184, 11.5, R0 < 0 ? 'модуль не бывает отрицательным' : `модуль равен нулю при ${e.v} = ${fmt(-e.q / e.p)}`, MUTED);
  } else h += T(260, 168, 12, 'первый шаг — уединить модуль (кнопка внизу)', '#5d6880');
  // number line
  h += `<g data-line="1" style="cursor:pointer">${R(NX0 - 14, NY - 40, NX1 - NX0 + 28, 74, 'transparent')}`;
  h += L(NX0 - 10, NY, NX1 + 12, NY, '#8b96ad', 1.6) + `<path d="M${NX1 + 12} ${NY - 5}l8 5-8 5" fill="none" stroke="#8b96ad" stroke-width="1.6"/>`;
  for (let v = e.lo; v <= e.hi + 1e-9; v += e.st) {
    const x = nx3(e, v), major = Math.abs(v / e.lab - Math.round(v / e.lab)) < 1e-9;
    h += L(x, NY - (major ? 6 : 3), x, NY + (major ? 6 : 3), major ? '#8b96ad' : '#4a5670', 1.2);
    if (major) h += T(x, NY + 22, 11, fmt(v), v === 0 ? FG : '#8b96ad');
  }
  h += T(NX1 + 18, NY + 22, 12, e.v, FG);
  h += '</g>';
  if (m.iso && m.R >= 0) { const cx = nx3(e, -e.q / e.p); h += `<path d="M${cx} ${NY - 7}l6 7-6 7-6-7z" fill="${CYAN}" pointer-events="none"/>`; }
  m.pts.forEach(v => {
    const x = nx3(e, v), ok = Math.abs(lhs3(e, v) - e.r) < 1e-9, col = ok ? GREEN : RED;
    h += `<g data-pt="${v}" style="cursor:pointer">${R(x - 18, NY - 50, 36, 66, 'transparent')}<circle cx="${x}" cy="${NY}" r="8" fill="${col}" stroke="${INK}" stroke-width="1.4"/>` +
      T(x, NY - 16, 12.5, fmt(v), col, 'middle', 'font-weight="500"') + '</g>';
  });
  // left side values under the line
  m.pts.forEach((v, i) => {
    const ok = Math.abs(lhs3(e, v) - e.r) < 1e-9;
    h += T(260, 318 + i * 18, 12, `${e.v} = ${fmt(v)}: левая часть = ${fmt(lhs3(e, v))} ${ok ? '= ' + fmt(e.r) + ' ✓' : '≠ ' + fmt(e.r)}`, ok ? GREEN : RED);
  });
  if (!m.pts.length) h += T(260, 322, 12, S.none ? 'Вы ответили: корней нет' : 'Тап по прямой — поставить точку-кандидат', S.none ? (m.solved ? GREEN : ORANGE) : '#5d6880');
  return h;
}

// ---------- lesson 4 ----------
const LY = 300;
const nx4 = v => NX0 + (v - LO4) / (HI4 - LO4) * (NX1 - NX0);
const vx4 = x => clamp(Math.round(LO4 + (x - NX0) / (NX1 - NX0) * (HI4 - LO4)), LO4, HI4);
function absineqSVG(m) {
  const e = m.e;
  let h = exChips(EX4, S.ex4, 'e4-');
  h += T(260, 134, 18, e.name, m.correct ? GREEN : FG, 'middle', 'font-weight="500"');
  if (S.graph) {
    const gy0 = 262, sc = Math.min(14, 112 / Math.max(Math.abs(LO4 - e.a), Math.abs(HI4 - e.a))), f = x => gy0 - Math.abs(x - e.a) * sc;
    let d = ''; for (let x = LO4; x <= HI4 + 1e-9; x += 0.5) d += (d ? 'L' : 'M') + nx4(x).toFixed(1) + ' ' + f(x).toFixed(1);
    h += L(NX0, gy0, NX1, gy0, '#33405c', 1) + `<path d="${d}" fill="none" stroke="${VIOL}" stroke-width="2"/>` +
      L(NX0, gy0 - e.b * sc, NX1, gy0 - e.b * sc, ORANGE, 1.4, 'stroke-dasharray="6 4"') +
      T(NX1, gy0 - e.b * sc - 5, 11, `y = ${e.b}`, ORANGE, 'end') + T(nx4(e.a) + 8, gy0 - 100, 11, `y = ${e.mod}`, VIOL, 'start');
  }
  const xa = nx4(m.A), xb = nx4(m.B);
  // regions (tap to shade)
  const regs = [[NX0 - 10, xa], [xa, xb], [xb, NX1 + 10]];
  regs.forEach(([a, b], i) => {
    if (b - a < 1) return;
    h += `<g data-reg="${i}" style="cursor:pointer">${R(a, LY - 22, b - a, 44, 'transparent')}`;
    if (S.sh[i]) h += L(a, LY, b, LY, BLUE, 7, 'stroke-linecap="butt"');
    h += '</g>';
  });
  h += L(NX0 - 10, LY, NX1 + 12, LY, '#8b96ad', 1.4, 'pointer-events="none"') + `<path d="M${NX1 + 12} ${LY - 5}l8 5-8 5" fill="none" stroke="#8b96ad" stroke-width="1.4" pointer-events="none"/>`;
  for (let v = LO4; v <= HI4; v++) { const x = nx4(v); h += L(x, LY - 4, x, LY + 4, '#6b7690', 1, 'pointer-events="none"') + T(x, LY + 18, 10.5, fmt(v), v === 0 ? FG : '#6b7690', 'middle', 'pointer-events="none"'); }
  if (S.sh[0]) h += `<path d="M${NX0 - 18} ${LY - 6}l-8 6 8 6" fill="none" stroke="${BLUE}" stroke-width="2.4" pointer-events="none"/>`;
  if (S.sh[2]) h += `<path d="M${NX1 + 22} ${LY - 6}l8 6-8 6" fill="none" stroke="${BLUE}" stroke-width="2.4" pointer-events="none"/>`;
  // endpoints
  const ends = m.A === m.B ? [[xa, 0]] : [[xa, 0], [xb, 1]];
  ends.forEach(([x, i]) => {
    h += `<g data-end="${i}" style="cursor:pointer">${R(x - 15, LY - 22, 30, 36, 'transparent')}<circle cx="${x}" cy="${LY}" r="7" fill="${S.pt[i] ? BLUE : '#0e1520'}" stroke="${BLUE}" stroke-width="2.2"/></g>`;
  });
  // knobs (drag)
  [['A', xa, m.A], ['B', xb, m.B]].forEach(([k, x, v], i) => {
    const off = m.A === m.B ? (i ? 16 : -16) : 0, kx = x + off;
    h += `<g data-drag="${k}" style="cursor:grab">${R(kx - 20, LY + 24, 40, 46, 'transparent')}` +
      `<path d="M${kx} ${LY + 28}l11 11-11 11-11-11z" fill="${drag && drag.k === k ? FG : ORANGE}" stroke="${INK}" stroke-width="1.3"/>` +
      T(kx, LY + 43, 11, k, INK, 'middle', 'font-weight="600"') + T(kx, LY + 66, 11, fmt(v), ORANGE) + '</g>';
  });
  h += T(260, 396, 13.5, `Ваш ответ: ${m.ans}`, m.correct ? GREEN : FG, 'middle', 'font-weight="500"');
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'reduce') return { chips: [60, 70, 400, 40], num: [40, 140, 440, 58], den: [40, 206, 440, 58], result: [20, 278, 480, 28], value: [80, 320, 360, 70] }[id];
  if (lid === 'ops') return { chips: [60, 70, 400, 40], fracs: [16, 112, 488, 130], pal: [16, 244, 488, 42], common: [16, 292, 488, 44], answers: [14, 336, 492, 68] }[id];
  if (lid === 'abseq') return { chips: [60, 70, 400, 40], eq: [40, 116, 440, 76], line: [24, NY - 44, 480, 80], pts: [24, NY - 44, 480, 80], lhs: [60, 300, 400, 60] }[id];
  return { chips: [20, 70, 480, 40], ineq: [80, 112, 360, 32], graph: [30, 130, 460, 140], line: [20, LY - 24, 490, 48], knobs: [20, LY + 24, 490, 52], answer: [40, 378, 440, 26] }[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  if (id === 'reduce') h += reduceSVG(m);
  else if (id === 'ops') h += opsSVG(m);
  else if (id === 'abseq') h += abseqSVG(m);
  else h += absineqSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
let drag = null, dirty = true;
// The shared task card (with the lab-shell «how to» button) covers the top-left of the stage on wide
// screens; if it reaches the content, the content is shrunk a little and moved to the right of the card.
const taskCard = $('#stage .task');
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 520, hh / 410, 1.45);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 408 - VB.h;
  const cr = taskCard && taskCard.getBoundingClientRect();
  if (cr && cr.width && w > 600) {
    const R0 = cr.right - rc.left + 8, B0 = cr.bottom - rc.top + 6;
    const ru = VB.x + R0 / s, bu = VB.y + B0 / s;
    if ((bu > 112 && ru > 22) || (bu > 70 && ru > 60)) {
      const s1 = Math.min((w - R0) / 500, hh / 410, 1.45);
      if (s1 >= s * 0.66) { s = s1; VB = { w: w / s, h: hh / s }; VB.x = 14 - R0 / s; VB.y = 408 - VB.h; }
    }
  }
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);
if (taskCard) new ResizeObserver(fit).observe(taskCard);

// ---------- actions ----------
function setEx(lid, i) {
  if (lid === 'reduce') { S.ex1 = i; S.F = fresh1(i); S.sel = null; S.val = null; }
  if (lid === 'ops') { S.ex2 = i; S.ext = { A: [], B: [] }; S.fsel = 'A'; S.ans = null; }
  if (lid === 'abseq') { S.ex3 = i; S.iso = false; S.pts = []; S.none = false; S.probe = 0; }
  if (lid === 'absineq') { S.ex4 = i; S.A = -1; S.B = 2; S.sh = [false, false, false]; S.pt = [false, false]; }
  update(); if (S.tab === 'scheme') buildScheme(), updateScheme(model());
}
// lesson 1
function tapItem(side, i) {
  const t = S.F[side][i]; if (!t) return;
  if (t.cut) { toast('Этот множитель уже сокращён.'); return; }
  const sel = S.sel, st = sel && S.F[sel.side][sel.i];
  if (t.poly) { S.sel = sel && sel.side === side && sel.i === i ? null : { side, i }; update(); return; }
  if (st && !st.poly && !st.cut && sel.side !== side) {
    if (st.k === t.k) { st.cut = true; t.cut = true; S.sel = null; toast(`Сократили на ${t.s} — при условии, что ${t.s} ≠ 0.`); }
    else { S.sel = { side, i }; toast('Сокращать можно только одинаковые множители.'); }
  } else S.sel = sel && sel.side === side && sel.i === i ? null : { side, i };
  update();
}
function applyMethod(mk) {
  const sel = S.sel, t = sel && S.F[sel.side][sel.i];
  if (!t || !t.poly) { toast('Сначала нажмите на многочлен, который хотите разложить.'); return; }
  if (!t.poly.ok.includes(mk)) { toast(METHOD_ERR[mk]); return; }
  const fs = t.poly.f.map(([k, s]) => ({ k, s }));
  S.F[sel.side].splice(sel.i, 1, ...fs); S.sel = null;
  toast(`${t.poly.s} = ${fs.map(f => f.s).join('')}`);
  update();
}
function pickVal(v) {
  const m = model();
  if (!m.reduced) { toast('Сначала сократите дробь до конца — подставлять удобнее в короткую.'); return; }
  S.val = v;
  if (v !== m.e.val.ans) toast(`Подставьте a и x в ${m.num}/${m.den} и аккуратно проследите за знаками.`);
  update();
}
// lesson 2
function togglePal(f) {
  const L0 = S.ext[S.fsel], j = L0.indexOf(f);
  if (j >= 0) L0.splice(j, 1); else { if (L0.length >= 3) { toast('Слишком много множителей: уберите лишние.'); return; } L0.push(f); }
  S.ans = null;
  const m = model();
  if (m.lcdOk) toast(`Знаменатели равны и это НОЗ. Теперь ${m.e.op === '+' ? 'сложите' : 'вычтите'} числители.`);
  update();
}
function pickAns(i) {
  const m = model();
  if (!m.lcdOk) { toast('Сначала приведите дроби к наименьшему общему знаменателю.'); return; }
  S.ans = i;
  if (i !== m.e.ans) toast(`Раскройте скобки в числителе ${m.numS} и приведите подобные.`);
  update();
}
// lesson 3
function tapLine(x) {
  const e = EX3[S.ex3];
  let v = e.lo + (x - NX0) / (NX1 - NX0) * (e.hi - e.lo);
  v = clamp(Math.round(v / e.st) * e.st, e.lo, e.hi);
  addPt(v);
}
function addPt(v) {
  v = Math.round(v * 100) / 100;
  if (S.pts.some(p => Math.abs(p - v) < 1e-9)) { S.pts = S.pts.filter(p => Math.abs(p - v) > 1e-9); update(); return; }
  if (S.pts.length >= 4) { toast('Точек уже 4 — уберите лишние (тап по точке).'); return; }
  S.pts.push(v); S.none = false;
  const e = EX3[S.ex3], ok = Math.abs(lhs3(e, v) - e.r) < 1e-9;
  if (!ok && S.iso && modR(e) >= 0) { const c = -e.q / e.p, d = Math.abs(v - c); toast(`Расстояние от ${fmt(v)} до ${fmt(c)} равно ${fmt(d)} — не подходит.`); }
  update();
}
function sayNone() {
  const e = EX3[S.ex3];
  if (roots3(e).length) { toast('Корни есть: попробуйте уединить модуль и посмотреть на знак правой части.'); S.none = false; update(); return; }
  S.none = true; S.pts = []; toast('Верно: модуль не может равняться отрицательному числу.'); update();
}
// lesson 4
function moveKnob(k, v) {
  v = clamp(v, LO4, HI4);
  if (k === 'A') S.A = Math.min(v, S.B); else S.B = Math.max(v, S.A);
  update();
}
function togReg(i) { S.sh[i] = !S.sh[i]; update(); }
function togEnd(i) { S.pt[i] = !S.pt[i]; update(); }

function pick(p) {
  const [k, v] = [p.slice(0, p.indexOf('-')), p.slice(p.indexOf('-') + 1)];
  if (k === 'e1') setEx('reduce', +v);
  else if (k === 'e2') setEx('ops', +v);
  else if (k === 'e3') setEx('abseq', +v);
  else if (k === 'e4') setEx('absineq', +v);
  else if (k === 'val') pickVal(+v);
  else if (k === 'pal') togglePal(v);
  else if (k === 'ans') pickAns(+v);
}

// ---------- pointer ----------
const toSvg = e => { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const c = scene.getScreenCTM(); return c ? p.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const id = LID();
  const pk = e.target.closest('[data-pick]'); if (pk) { e.preventDefault(); pick(pk.dataset.pick); return; }
  if (id === 'reduce') { const it = e.target.closest('[data-it]'); if (it) { e.preventDefault(); const [s, i] = it.dataset.it.split(':'); tapItem(s, +i); } return; }
  if (id === 'ops') { const f = e.target.closest('[data-fr]'); if (f) { e.preventDefault(); S.fsel = f.dataset.fr; update(); } return; }
  if (id === 'abseq') {
    const pt = e.target.closest('[data-pt]'); if (pt) { e.preventDefault(); addPt(+pt.dataset.pt); return; }
    if (e.target.closest('[data-line]')) { e.preventDefault(); tapLine(toSvg(e).x); }
    return;
  }
  const kn = e.target.closest('[data-drag]');
  if (kn) { e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {} scene.classList.add('grabbing'); drag = { k: kn.dataset.drag }; dirty = true; return; }
  const en = e.target.closest('[data-end]'); if (en) { e.preventDefault(); togEnd(+en.dataset.end); return; }
  const rg = e.target.closest('[data-reg]'); if (rg) { e.preventDefault(); togReg(+rg.dataset.reg); }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const v = vx4(toSvg(e).x);
  if ((drag.k === 'A' ? S.A : S.B) !== v) moveKnob(drag.k, v);
});
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function syncTools() {
  const tb = $('#tools');
  tb.querySelectorAll('[data-a="selA"],[data-a="selB"]').forEach(b => b.setAttribute('aria-pressed', S.fsel === b.dataset.a.slice(3)));
  const g = tb.querySelector('[data-a="graph"]'); if (g) g.setAttribute('aria-pressed', S.graph);
  const i = tb.querySelector('[data-a="iso"]'); if (i) i.setAttribute('aria-pressed', S.iso);

function act(a) {
  const id = LID();
  if (a.startsWith('m-')) return applyMethod(a.slice(2));
  if (a === 'reset') { setEx(id, { reduce: S.ex1, ops: S.ex2, abseq: S.ex3, absineq: S.ex4 }[id]); return; }
  if (a === 'selA' || a === 'selB') { S.fsel = a.slice(3); update(); return; }
  if (a === 'iso') {
    const e = EX3[S.ex3]; S.iso = true;
    toast(`Уединили модуль: ${e.mod} = ${fmt(modR(e))}`); update(); return;
  }
  if (a === 'none') return sayNone();
  if (a === 'A-' || a === 'A+') return moveKnob('A', S.A + (a === 'A-' ? -1 : 1));
  if (a === 'B-' || a === 'B+') return moveKnob('B', S.B + (a === 'B-' ? -1 : 1));
  if (a === 'graph') { S.graph = !S.graph; update(); }
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };

  else if (m.kind === 'ops') { set('#r1', prodStr(m.dA)); set('#r2', prodStr(m.dB)); set('#r3', m.lcdOk ? 'да ✓' : m.same ? 'не наим.' : 'нет'); }
  else if (m.kind === 'abseq') { set('#r1', m.iso ? fmt(m.R) : '?'); set('#r2', m.pts.length); set('#r3', m.good); set('#inPO', fmt(S.probe)); val('#inP', S.probe); }
  else { set('#r1', fmt(m.A)); set('#r2', fmt(m.B)); set('#r3', m.ans); set('#inAO', fmt(m.A)); set('#inBO', fmt(m.B)); val('#inA', m.A); val('#inB', m.B); }
  el.querySelectorAll('[data-p]').forEach(b => { const [k, v] = b.dataset.p.split('-'); b.setAttribute('aria-pressed', +v === { e1: S.ex1, e2: S.ex2, e3: S.ex3, e4: S.ex4 }[k]); });

}

      ok: '5x² + x − 4 = (x + 1)(5x − 4), x² + x = x(x + 1).', no: 'Разложите числитель по корням трёхчлена: один корень равен −1.' },
    { q: `При каком значении переменной дробь ${fr('a(a − 4)', 'a + 15')} равна нулю?`, o: ['0; 4', '0; −15', '4; −15', '−15'], a: 0,
      ok: 'Числитель равен нулю при a = 0 и a = 4, знаменатель при этом не ноль.', no: 'Дробь равна нулю, когда нулю равен числитель, а знаменатель — нет.' },
    { q: `Вычислите ${fr('a² − 8a + 16', 'ax − 4x')} при a = −5, x = −3.`, o: ['2', '3', '−2', '−3'], a: 1,
      ok: 'Дробь равна (a − 4)/x = −9/(−3) = 3.', no: 'Сначала сократите дробь, потом подставляйте; минус на минус даёт плюс.' },
  ],
  ops: [
    { q: `Выполните сложение: ${fr('a + b', 'x + a')} + ${fr('a − b', 'x + a')}.`, o: [fr('2a', 'x + a'), fr('a', 'x + a'), fr('a + b', 'x + a'), fr('2b', 'x + a')], a: 0,
      ok: 'Знаменатели одинаковые: (a + b + a − b)/(x + a) = 2a/(x + a).', no: 'Сложите числители, знаменатель оставьте; b и −b взаимно уничтожаются.' },
    { q: `Упростите: x − ${fr('x² − y²', 'x − y')}.`, o: ['−y', 'x − y', '2x + y', '2x − y'], a: 0,
      ok: '(x² − y²)/(x − y) = x + y, x − (x + y) = −y.', no: 'Сначала сократите дробь по формуле разности квадратов, потом раскройте скобки со знаком минус.' },
    { q: `Выполните вычитание: ${fr('2', 'x + 3')} − ${fr('1', 'x² + 6x + 9')}.`, o: [fr('2x + 5', '(x + 3)²'), fr('2x + 7', '(x + 3)²'), fr('1', 'x + 3'), fr('2x + 5', 'x + 3')], a: 0,
      ok: 'НОЗ = (x + 3)²: (2(x + 3) − 1)/(x + 3)² = (2x + 5)/(x + 3)².', no: 'x² + 6x + 9 = (x + 3)². Первую дробь домножьте на (x + 3).' },
  ],
  abseq: [
    { q: 'Решите уравнение |m| + 3 = 12.', o: ['15; −15', '−14; 14', '−9; 9', '10'], a: 2,
      ok: '|m| = 9, значит m = ±9.', no: 'Сначала уедините модуль: перенесите 3 вправо.' },
    { q: 'Найдите сумму корней уравнения |3x + 1| = 5.', o: ['−2/3', '2/3', '4/3', '−2'], a: 0,
      ok: '3x + 1 = 5 → x = 4/3; 3x + 1 = −5 → x = −2. Сумма −2/3.', no: 'Рассмотрите оба случая: 3x + 1 = 5 и 3x + 1 = −5, затем сложите корни.' },
    { q: 'Решите уравнение |x − 2| = 2x − 1.', o: ['1', '−1', '−1; 1', 'нет корней'], a: 0,
      ok: 'Случаи дают x = −1 и x = 1, но при x = −1 правая часть отрицательна — посторонний корень.', no: 'Найдите корни обоих случаев и проверьте: правая часть 2x − 1 должна быть ≥ 0.' },
  ],
  absineq: [
    { q: 'Решите неравенство |x − 3| ≤ 2.', o: ['[1; 5]', '(1; 5)', '(−∞; 1] ∪ [5; +∞)', '[−5; 1]'], a: 0,
      ok: '−2 ≤ x − 3 ≤ 2, то есть 1 ≤ x ≤ 5.', no: '«≤» — точки не дальше 2 от числа 3, концы входят.' },
    { q: 'Решите неравенство |2x − 1| > 3.', o: ['(−1; 2)', '(−∞; −1) ∪ (2; +∞)', '(−∞; −2) ∪ (1; +∞)', '(2; +∞)'], a: 1,
      ok: '2x − 1 > 3 → x > 2 или 2x − 1 < −3 → x < −1.', no: '«>» даёт два луча: 2x − 1 > 3 или 2x − 1 < −3.' },
    { q: 'Решите неравенство |x| + |x − 1| ≤ 1.', o: ['[0; 1]', '[1; +∞)', '(−∞; 1]', '(0; 1)'], a: 0,
      ok: 'Сумма расстояний от x до 0 и до 1 не меньше 1 и равна 1 только на отрезке [0; 1].', no: '|x| + |x − 1| — сумма расстояний от x до точек 0 и 1. Когда она минимальна?' },
  ],
};

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') {
    const el = $('#pane-calc');
    el.innerHTML = calcHTML(m);
    el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const [qi, oi] = b.dataset.q.split(':').map(Number); S.qa[Ls.id + qi] = oi; renderPanes(model()); });
  }
}

function quizHTML(id) {
  return `<h3>Задачи как на ЕНТ</h3>` + QZ[id].map((z, qi) => {
    const ch = S.qa[id + qi], ans = ch !== undefined, ok = ans && ch === z.a;
    return `<div class="qz ${ok ? 'ok' : ''}"><div class="qn">Задача ${qi + 1}${ok ? ' · решено ✓' : ''}</div><p>${z.q}</p><div class="opts">` +
      z.o.map((o, oi) => `<button data-q="${qi}:${oi}" class="${ans && ch === oi ? (ok ? 'good' : 'bad') : ''}">${o}</button>`).join('') + `</div>` +
      (ans ? `<div class="fb ${ok ? 'good' : 'bad'}">${ok ? '✓ Верно. ' + z.ok : '✗ Неверно. Подсказка: ' + z.no}</div>` : '') + `</div>`;
  }).join('');
}

function calcHTML(m) {
  const id = LID();
  let h = '';
  if (id === 'reduce') {
    const e = m.e;
    h = `<h2>Сокращаем по шагам</h2><div class="formula">${fr(e.num.s, e.den.s)}</div><div class="steps">` +
      step('1. числитель', m.polys && S.F.num.some(t => t.poly) ? 'разложите на множители' : S.F.num.map(t => t.s).join('')) +
      step('2. знаменатель', S.F.den.some(t => t.poly) ? 'разложите на множители' : S.F.den.map(t => t.s).join('')) +
      step('3. ОДЗ', e.odz) +
      step('4. результат', m.reduced ? `${m.num}/${m.den}` : 'сократите общие множители', 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Сокращают множители, а не слагаемые: (a + 5)/(a + 3) ≠ 5/3.</p>`;
  } else if (id === 'ops') {
    h = `<h2>Приводим к общему знаменателю</h2><div class="steps">` +
      step('знаменатель 1', prodStr(m.dA)) + step('знаменатель 2', prodStr(m.dB)) +
      step('НОЗ', m.lcdOk ? prodStr(m.dA) : 'каждый множитель в наибольшей степени') +
      step('числитель', m.lcdOk ? m.numS : '—', 'sum') + `</div>` +
      `<h3>Умножение и деление</h3><div class="steps">` + step('правило', 'a/b · c/d = ac/(bd)') + step('деление', 'a/b : c/d = a/b · d/c') +
      step('пример', '(x² − 9)/(2x) · 4x²/(x + 3) = 2x(x − 3)', 'sum') + `</div>`;
  } else if (id === 'abseq') {
    const e = m.e;
    h = `<h2>Схема решения</h2><div class="formula">${e.s}</div><div class="steps">` +
      step('1. уединить модуль', m.iso ? `${e.mod} = ${fmt(m.R)}` : 'нажмите «Уединить модуль»') +
      step('2. знак правой части', m.iso ? (m.R < 0 ? 'отрицательная → корней нет' : m.R === 0 ? 'ноль → один случай' : 'положительная → два случая') : '—') +
      step('3. найти корни', 'отметьте точки на прямой') +
      step('найдено', `${m.good} ${m.solved ? '✓' : ''}`, 'sum') + `</div>`;
  } else {
    h = `<h2>Правила</h2><div class="steps">` + step('|x − a| < b', 'a − b < x < a + b') + step('|x − a| > b', 'x < a − b или x > a + b') +
      step('≤, ≥', 'концы входят: [ ]') + step('|f| < отриц.', 'решений нет') + step('|f| > 0', 'все x, кроме нуля модуля', 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Сейчас на прямой: ${m.ans}.</p>`;
  }
  return h + quizHTML(id);
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'reduce') el.innerHTML = `<div class="k">Дробь</div><div class="v ${m.reduced ? 'ok' : ''}">${m.reduced ? esc(m.num + '/' + m.den) : '…'}</div><div class="lr"><span>многочл.</span><span>${m.polys}</span></div><div class="lr"><span>сокращ.</span><span>${m.cut}</span></div>`;
  else if (id === 'ops') el.innerHTML = `<div class="k">Знаменатели</div><div class="v ${m.lcdOk ? 'ok' : ''}" style="${m.same && !m.lcdOk ? 'color:var(--force)' : ''}">${m.lcdOk ? 'НОЗ ✓' : m.same ? 'равны' : 'разные'}</div><div class="lr"><span>доп. 1</span><span>${S.ext.A.length}</span></div><div class="lr"><span>доп. 2</span><span>${S.ext.B.length}</span></div>`;
  else if (id === 'abseq') el.innerHTML = `<div class="k">Модуль равен</div><div class="v ${m.solved ? 'ok' : ''}">${m.iso ? fmt(m.R) : '?'}</div><div class="lr"><span>точек</span><span>${m.pts.length}</span></div><div class="lr"><span>подходят</span><span>${m.good}</span></div>`;
  else el.innerHTML = `<div class="k">Граница A · B</div><div class="v ${m.correct ? 'ok' : ''}">${fmt(m.A)} · ${fmt(m.B)}</div><div class="lr"><span>ответ</span><span>${m.correct ? 'верно' : '…'}</span></div>`;
  if (ok) el.querySelector('.v').classList.add('ok');
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Дроби и модули покорены!'), 900);
  }
  renderMeter(m); syncTools();
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.ex1 = 0; S.F = fresh1(0); S.sel = null; S.val = null;
  S.ex2 = 0; S.ext = { A: [], B: [] }; S.fsel = 'A'; S.ans = null;
  S.ex3 = 0; S.iso = false; S.pts = []; S.none = false; S.probe = 0;
  S.ex4 = 0; S.A = -1; S.B = 2; S.sh = [false, false, false]; S.pt = [false, false]; S.graph = false;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

    now = `Пример: ${m.e.orig[0][0]}/(${m.e.orig[0][1]}) ${m.e.op} ${m.e.orig[1][0]}/(${m.e.orig[1][1]})${m.ex ? ' (тренировка)' : ' (задание)'}. Дополнительные множители: у первой дроби ${S.ext.A.map(f => FAC[f].s).join(', ') || 'нет'}, у второй ${S.ext.B.map(f => FAC[f].s).join(', ') || 'нет'}. Знаменатели: ${prodStr(m.dA)} и ${prodStr(m.dB)} — ${m.lcdOk ? 'это наименьший общий знаменатель, числитель ' + m.numS : m.same ? 'равны, но не наименьший общий' : 'пока разные'}. ` +
      (m.e.opts ? `Выбранный ответ: ${m.ans === null ? 'нет' : m.e.opts[m.ans][0] + '/' + m.e.opts[m.ans][1] + (m.ans === m.e.ans ? ' (верно)' : ' (неверно)')}.` : '');
  }

    now = `Уравнение ${m.e.s}${m.ex ? ' (тренировка)' : ' (задание)'}. Модуль ${m.iso ? `уединён: ${m.e.mod} = ${fmt(m.R)}` : 'ещё не уединён'}. Точки на прямой: ${m.pts.length ? m.pts.map(v => fmt(v) + (Math.abs(lhs3(m.e, v) - m.e.r) < 1e-9 ? ' (подходит)' : ' (не подходит)')).join(', ') : 'нет'}. ${S.none ? 'Ученик ответил «корней нет».' : ''} ${m.solved ? 'Уравнение решено.' : 'Уравнение ещё не решено.'}`;
  }
  if (id === 'absineq') {
    scheme = 'На схеме — неравенство с модулем и числовая прямая от −8 до 6. Под прямой два оранжевых ромбика — границы A и B; их перетаскивают пальцем или двигают кнопками «◀ A», «A ▶», «◀ B», «B ▶». Тап по промежутку (левее A, между A и B, правее B) закрашивает его синим, тап по точке-границе делает её закрашенной (входит) или выколотой (не входит). Внизу автоматически пишется ответ ученика промежутками. Кнопка «График» показывает «галочку» y = |x − a| и прямую y = b. Переключатель вверху: «|x + 1| ≤ 4» (задание) и тренировочные |x + 1| > 1, |x + 6| > 0, |x| < 5.';
    now = `Неравенство ${m.e.name}${m.ex ? ' (тренировка)' : ' (задание)'}. Границы: A = ${fmt(m.A)}, B = ${fmt(m.B)}. Закрашено: ${['левее A', 'между A и B', 'правее B'].filter((x, i) => S.sh[i]).join(', ') || 'ничего'}; концы: A ${S.pt[0] ? 'входит' : 'выколот'}, B ${S.pt[1] ? 'входит' : 'выколот'}. Ответ ученика: ${m.ans} — ${m.correct ? 'верный' : 'пока неверный'}. График ${S.graph ? 'показан' : 'скрыт'}.`;
  }
  return [
    `Раздел: математика, 8 класс, алгебра, тема «Алгебраические дроби и модуль». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `На схеме: ${scheme}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Во вкладке «Расчёты» — задачи как на ЕНТ: ${QZ[id].map(z => z.q.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ')).join(' | ')}.`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Для тьютора: не называй ответ (результат сокращения, значение дроби, общий знаменатель и ответ, корни уравнения, промежутки неравенства): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    reduce: 'Почему нельзя сокращать слагаемые?', ops: 'Как найти наименьший общий знаменатель?',
    abseq: 'Почему |x| = −2 не имеет корней?', absineq: 'Чем отличается |x| < 5 от |x| > 5?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
