<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 7 класс: бактерии, грибы и лишайники, вирусы, микробы и здоровье.">
<title>Бактерии, грибы, вирусы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="7" y="20" width="20" height="10" rx="5" fill="rgba(180,140,255,.25)" stroke="#b48cff" stroke-width="1.3"/><path d="M7 25q-2-3-4 0" stroke="#b48cff" stroke-width="1.1" fill="none"/><circle cx="27" cy="13" r="5" fill="none" stroke="var(--warn)" stroke-width="1.3"/><path d="M27 6v2M27 18v2M20 13h2M32 13h2M22 8l1.4 1.4M30.6 16.6L32 18M22 18l1.4-1.4M30.6 9.4L32 8" stroke="var(--force)" stroke-width="1.2"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Биология · Бактерии, грибы, вирусы</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Микробы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-micro';
const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

// ---------- lesson 1: bacteria growth ----------
// divisions per hour: best at 37 °C (one division in 20 min), none in the cold, death from 60 °C
function rate(T, salt) {
  let r;
  if (T < 5) r = 0;
  else if (T <= 37) r = 3 * Math.pow((T - 5) / 32, 1.5);
  else if (T < 47) r = 3 * (47 - T) / 10;
  else if (T < 60) r = 0;
  else r = -(T - 55) / 5;
  if (salt && r > 0) r = 0;
  return r;
}
const SHAPES = { rod: 'Палочки (бациллы)', coc: 'Шарики (кокки)', vib: 'Запятые (вибрионы)', spi: 'Спирали (спириллы)' };
const SHK = ['rod', 'coc', 'vib', 'spi'];
const PRESETS = [[4, 'Холодильник'], [22, 'Комната'], [37, 'Тело'], [100, 'Кипячение']];

// ---------- lesson 2: fungi and lichens ----------
const FL = {
  cap: { name: 'Шляпка', c: '#d9a066' },
  tube: { name: 'Трубочки со спорами', c: '#e9d84f' },
  stem: { name: 'Ножка', c: '#e8e4da' },
  myc: { name: 'Грибница', c: '#c9a8ef' },
  mycor: { name: 'Микориза', c: '#72d4e8' },
  alga: { name: 'Клетки водоросли', c: '#86e0a8' },
  hypha: { name: 'Гифы гриба', c: '#ff8a73' },
};
const FLK = ['cap', 'tube', 'stem', 'myc', 'mycor', 'alga', 'hypha'];
const IX = 440, IY = 150, IR = 64;
const FP = [
  { x: 236, y: 160, name: 'Верх над землёй', ans: 'cap' },
  { x: 262, y: 194, name: 'Под шляпкой', ans: 'tube' },
  { x: 236, y: 228, name: 'Опора шляпки', ans: 'stem' },
  { x: 300, y: 302, name: 'Белые нити в почве', ans: 'myc' },
  { x: 150, y: 338, name: 'Кончик корня берёзы', ans: 'mycor' },
  { x: IX - 24, y: IY - 20, name: 'Лишайник: зелёный слой', ans: 'alga' },
  { x: IX + 22, y: IY + 24, name: 'Лишайник: нити', ans: 'hypha' },
];
const FP_SEEN = [
  'коричневый купол над землёй, на нём сверху ничего не созревает',
  'губчатый слой из множества тонких трубочек, из них сыплется мелкая пыль',
  'плотная белая опора с тёмными чешуйками, держит купол над землёй',
  'тонкие белые нити, ветвятся в почве во все стороны от основания гриба',
  'нити гриба плотным чехлом оплетают кончик корня дерева',
  'круглые зелёные клетки слоем под верхней коркой',
  'переплетённые бесцветные нити, между ними и над ними',
];

// ---------- lesson 3: virus cycle ----------
const STAGES = [
  { name: 'Прикрепление', d: 'Шипы вируса цепляются за рецепторы на мембране клетки, как ключ входит в замок.' },
  { name: 'Проникновение', d: 'Клетка втягивает вирус внутрь в пузырьке. Оболочка вируса раскрывается, и его РНК выходит в цитоплазму.' },
  { name: 'Копирование', d: 'РНК вируса попадает в ядро. Клетка по ней делает сотни копий РНК, а рибосомы собирают белки вируса — вместо своих.' },
  { name: 'Сборка', d: 'Новые РНК и белки идут к мембране, и там собираются новые вирусы.' },
  { name: 'Выход', d: 'Новые вирусы отпочковываются от клетки и заражают соседние клетки. Заражённая клетка истощается и гибнет.' },
];
const VCELLS = [

function resetLesson() {
  const L = LESSONS[S.lesson];

// ---------- models ----------
function bact() {
  const r = rate(S.T, S.salt), n = r * S.t, N = Math.pow(2, n);
  let st;
  if (r > 0) st = 'grow';
  else if (r < 0) st = 'die';
  else if (S.salt && rate(S.T, false) > 0) st = 'salt';
  else st = S.T < 5 ? 'cold' : 'hot';
  return { r, n, N, st };
}
function model() {
  const id = LID();
  if (id === 'bact') { const b = bact(); return { kind: 'bact', ...b, big: S.big, small: S.small }; }
  if (id === 'fungi') { let n = 0, r = 0; S.pa.forEach((a, i) => { if (a) { n++; if (a === FP[i].ans) r++; } }); return { kind: 'fungi', placed: n, right: r }; }
  if (id === 'virus') return { kind: 'virus', ph: S.vph, total: Math.pow(S.n, S.k) };
  let n = 0, r = 0; S.bin.forEach((b, i) => { if (b >= 0) { n++; if (BINS[b].k === CARDS[i].ans) r++; } });
  return { kind: 'sort', placed: n, right: r };
}
const fmtN = N => {
  if (N < 0.5) return '0';
  if (N < 1e6) return Math.round(N).toLocaleString('ru-RU');
  if (N < 1e9) return (N / 1e6).toFixed(1).replace('.', ',') + ' млн';
  return (N / 1e9).toFixed(1).replace('.', ',') + ' млрд';
};

// ---------- actions ----------
function setT(T) { S.T = clamp(Math.round(T), 0, 100); update(); renderTools(); }
function setTime(t) { S.t = clamp(Math.round(t * 2) / 2, 0, 8); update(); renderTools(); }
function pickPoint(i) { S.cur = i; S.curT = performance.now(); renderTools(); update(); }
function assign(k) {
  if (S.cur < 0) { toast('Сначала нажмите на точку.'); return; }
  S.pa[S.cur] = k;
  const m = model();
  if (m.placed === FP.length && m.right < FP.length) toast(`Все точки подписаны. Верно ${m.right} из 7 — проверьте красные.`);
  else if (m.placed < FP.length) {
    for (let d = 1; d <= FP.length; d++) { const j = (S.cur + d) % FP.length; if (!S.pa[j]) { S.cur = j; S.curT = performance.now(); break; } }
  }
  renderTools(); update();
}
function dropVirus(i) {
  S.vsel = false;
  if (i < 0) { update(); return; }
  S.tried[i] = true;
  if (i !== 1) { toast(VCELLS[i].why); update(); return; }
  S.vph = 1; S.vT = performance.now();
  toast('Шипы подошли к рецепторам — вирус прикрепился.');
  renderTools(); update();
}
function stepVirus(d) {
  if (S.vph === 0 && d > 0) { toast('Сначала перетащите вирус к клетке, к которой он подходит.'); return; }
  S.vph = clamp(S.vph + d, 0, 5); S.vT = performance.now();
  renderTools(); update();
}
function drop(c, b) {
  S.bin[c] = b; S.sel = -1; S.look = c;
  const m = model();
  if (m.placed === CARDS.length && m.right < CARDS.length) toast(`Все карточки разложены. Верно ${m.right} из 10 — красные переложите.`);
  update();
}

}

    h += `</g>`;
  }
  for (let c = 0; c < CARDS.length; c++) {
    if (S.bin[c] >= 0 || (drag && drag.c === c && drag.moved)) continue;
    const [x, y] = homeXY(c); h += cardSVG(c, x, y, S.sel === c);
  }
  if (drag && drag.c >= 0 && drag.moved) h += cardSVG(drag.c, drag.px + drag.dx, drag.py + drag.dy, true);
  return h;
}

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 510, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}

// ---------- pointer: taps, dragging cards and the virus ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

const cellAt = p => VCELLS.findIndex(c => p.x > c.box[0] && p.x < c.box[0] + c.box[2] && p.y > c.box[1] - 10 && p.y < c.box[1] + c.box[3]);
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag === 'v') {
    drag = { v: true, c: -1, dx: VX0 - p.x, dy: VY0 - p.y, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing');
  } else if (el.dataset.drag) {
    const c = +el.dataset.drag.slice(1);
    let dx = -CW / 2, dy = -CH / 2;
    if (S.bin[c] < 0) { const [x, y] = homeXY(c); dx = x - p.x; dy = y - p.y; }
    drag = { c, dx, dy, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false };

});
function endDrag(cancel) {
  if (!drag) return;

    if (!d.moved) { S.vsel = !S.vsel; update(); return; }

}

  for (let t = 0; t <= 8.001; t += .25) pts += `${pts ? 'L' : 'M'}${f(X(t))} ${f(Y(Math.log10(Math.pow(2, r * t))))}`;
  let h = `<svg class="diag" viewBox="0 0 120 64" role="img" aria-label="Рост числа бактерий со временем">`;
  for (let lg = 0; lg <= 8; lg += 2) h += `<path d="M14 ${f(Y(lg))}H114" stroke="#26324a" stroke-width=".4"/><text x="12" y="${f(Y(lg) + 1.3)}" font-size="3.4" fill="#8b96ad" text-anchor="end">10${lg ? '<tspan dy="-1.4" font-size="2.6">' + lg + '</tspan>' : '⁰'}</text>`;

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'bact') {
    set('#inTO', S.T + ' °C'); val('#inT', S.T); set('#inTimeO', String(S.t).replace('.', ',') + ' ч'); val('#inTime', S.t);
    set('#r1', fmtN(m.N)); set('#r2', f(m.r).replace('.', ',')); set('#r3', f(m.n).replace('.', ','));
    el.querySelectorAll('#saltChips button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.v === '1') === S.salt));
    el.querySelectorAll('#shChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.shape));
    const d = el.querySelector('#gDiag'); if (d) d.innerHTML = growthChart();
  } else if (m.kind === 'fungi') {
    set('#r1', S.cur >= 0 ? String(S.cur + 1) : '—'); set('#r2', `${m.placed} из 7`); set('#r3', m.placed === 7 ? `${m.right} из 7` : '—');
    el.querySelectorAll('#ptChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === S.cur));
    el.querySelectorAll('#fChips button').forEach(b => b.setAttribute('aria-pressed', S.cur >= 0 && S.pa[S.cur] === b.dataset.k));
  } else if (m.kind === 'virus') {
    set('#inNO', String(S.n)); val('#inN', S.n); set('#inKO', String(S.k)); val('#inK', S.k);
    set('#r1', m.ph ? `${m.ph} из 5` : 'вне клетки'); set('#r2', String(S.n)); set('#r3', fmtN(m.total));
    const sl = el.querySelector('#stList');
    if (sl) sl.innerHTML = STAGES.map((s, i) => step(`${i + 1}. ${s.name}`, m.ph > i + 1 ? 'пройден' : m.ph === i + 1 ? 'сейчас' : '—', m.ph === i + 1 ? 'sum' : '')).join('');
  } else {
    set('#r1', `${m.placed} из 10`); set('#r2', m.placed === 10 ? `${m.right} из 10` : '—'); set('#r3', S.look >= 0 ? CARDS[S.look].short : '—');
    const bl = el.querySelector('#binList');
    if (bl) bl.innerHTML = BINS.map((B, b) => step(B.name, CARDS.filter((_, c) => S.bin[c] === b).map(s => s.short).join(', ') || '—')).join('');
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${L.id === 'health' ? 'Коробки' : 'Что на столе'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'bact') h += `<h3>Формы бактерий</h3><div class="feat">` + SHK.map(k => `<div style="border-left-color:#b48cff"><b>${SHAPES[k]}</b>${{ rod: 'Кишечная палочка, сенная палочка, палочка Коха.', coc: 'Стрептококки (ангина), стафилококки.', vib: 'Холерный вибрион.', spi: 'Спириллы живут в стоячей воде.' }[k]}</div>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      S.hl = { id: b.dataset.id, t: performance.now() };
      if (b.dataset.id === 'spores') S.sporeT = performance.now();
      dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID(), c = x => String(x).replace('.', ',');
  if (id === 'bact') {
    let h = `<h2>Сколько станет бактерий</h2><div class="formula">N = N₀ · 2ⁿ,  n = t · (делений в час)</div><div class="steps">` +
      step('Начальное число N₀', '1') + step('Температура', `${S.T} °C`) + step('Соль', S.salt ? 'есть' : 'нет') + step('Время t', `${c(S.t)} ч`);
    if (m.r > 0) h += step('Одно деление', `каждые ${Math.round(60 / m.r)} мин`) + step('Делений в час', `60 : ${Math.round(60 / m.r)} ≈ ${c(f(m.r))}`) + step('n = t · делений в час', `${c(S.t)} · ${c(f(m.r))} ≈ ${c(f(m.n))}`) + step('N = 1 · 2ⁿ', `2^${c(f(m.n))} ≈ ${fmtN(m.N)}`, 'sum');
    else if (m.r === 0) h += step('Делений', '0 — ' + ST_TXT[m.st]) + step('N', '1 (не размножаются)', 'sum');
    else h += step('Живых становится вдвое меньше', `каждые ${Math.round(60 / -m.r)} мин`) + step('N = 1 · 2ⁿ', `2^${c(f(m.n))} ≈ ${fmtN(m.N)}`, 'sum');
    h += `</div><h3>Почему так</h3><p>При 37 °C — температуре нашего тела — многие бактерии делятся каждые 20 минут: 3 раза в час. За 4 часа это 12 делений, а 2¹² = 4096. В холодильнике (около 4 °C) деление почти останавливается, но бактерии не погибают. Соль и сахар вытягивают воду из клеток — поэтому соленья и варенье хранятся долго. При кипячении (100 °C) гибнут почти все бактерии, кроме спор.</p>`;
    h += `<p class="note">Модель упрощённая: у разных бактерий свои любимые температуры. Цифры похожи на бактерии, которые живут в организме человека.</p>`;
    return h;
  }
  if (id === 'fungi') {
    const all = m.placed === 7;
    let h = `<h2>Как рассуждать</h2><div class="formula">над землёй — плодовое тело, в почве — грибница</div><div class="steps">` +
      step('Купол сверху', 'защищает слой со спорами') + step('Слой под шляпкой', 'в нём созревают споры') + step('Опора', 'поднимает шляпку') +
      step('Нити в почве', 'питают гриб') + step('Нити на корне дерева', 'союз гриба и дерева') + step('Зелёные клетки лишайника', 'делают органические вещества') + step('Нити лишайника', 'держат воду и соли') + `</div>`;
    h += `<h3>Кто что даёт партнёру</h3><div class="steps">` + step('Гриб → дереву', 'вода, минеральные соли') + step('Дерево → грибу', 'сахар') + step('Гриб → водоросли', 'вода, соли, защита') + step('Водоросль → грибу', 'органические вещества') + `</div>`;
    if (S.cur >= 0) h += `<h3>Точка ${S.cur + 1}: что видно</h3><p>${FP_SEEN[S.cur][0].toUpperCase() + FP_SEEN[S.cur].slice(1)}.</p>`;
    h += `<h3>Ваши ответы</h3><div class="steps">` + FP.map((p, i) => step(`${i + 1}. ${p.name}`, S.pa[i] ? FL[S.pa[i]].name + (all ? (S.pa[i] === p.ans ? ' ✓' : ' ✗') : '') : '—')).join('') +
      step('итого', all ? `верно ${m.right} из 7` : `подписано ${m.placed} из 7`, 'sum') + `</div>`;
    if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 7 точек будут подписаны.</p>`;
    return h;
  }
  if (id === 'virus') {
    let h = `<h2>Насколько мал вирус</h2><div class="formula">1 мкм = 0,001 мм,  вирус гриппа ≈ 0,1 мкм</div><div class="steps">` +
      step('Клетка человека ≈ 20 мкм', '20 : 0,1 = 200 вирусов в ряд') + step('Бактерия ≈ 2 мкм', '2 : 0,1 = 20 вирусов в ряд') + step('Толщина волоса ≈ 70 мкм', '70 : 0,1 = 700 вирусов') + `</div>`;
    h += `<h2 style="margin-top:22px">Как быстро растёт число вирусов</h2><div class="formula">после k циклов: n · n · … · n = nᵏ</div><div class="steps">` +
      step('Из одной клетки выходит n', String(S.n)) + step('Циклов k', String(S.k));
    let v = 1; for (let i = 1; i <= S.k; i++) { v *= S.n; h += step(`после ${i}-го цикла`, fmtN(v)); }
    h += step('итого заражённых частиц', fmtN(m.total), 'sum') + `</div><p class="note" style="margin-top:8px">Так считают, если каждый новый вирус заражает новую клетку. На деле многие вирусы погибают или их уничтожает иммунитет — но рост всё равно огромный.</p>`;
    if (m.ph) h += `<h3>Сейчас: этап ${m.ph}</h3><p>${STAGES[m.ph - 1].d}</p>`;
    return h;
  }
  const all = m.placed === 10;
  let h = `<h2>Как рассуждать</h2><div class="formula">лечит антибиотик → бактерия;  только прививка и иммунитет → вирус</div><div class="steps">` +
    step('1. Помогает антибиотик?', 'бактерии') + step('2. Размножается только в клетках?', 'вирусы') + step('3. Плесень, дрожжи, грибок?', 'грибы') + `</div>`;
  h += `<h3>Сейчас</h3><div class="steps">` + CARDS.map((s, c) => step(s.short, S.bin[c] < 0 ? '—' : BINS[S.bin[c]].name + (all ? (BINS[S.bin[c]].k === s.ans ? ' ✓' : ' ✗') : ''))).join('') +
    step('итого', all ? `верно ${m.right} из 10` : `разложено ${m.placed} из 10`, 'sum') + `</div>`;
  if (all) h += `<h3>Объяснение</h3><div class="feat">` + CARDS.map(s => `<div style="border-left-color:${BINS.find(B => B.k === s.ans).c}"><b>${s.short}</b>${s.fact}</div>`).join('') + `</div>`;
  else h += `<p class="note" style="margin-top:10px">Проверка и объяснения появятся, когда все 10 карточек будут в коробках.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'bact') {
    el.innerHTML = `<div class="k">Бактерий</div><div class="v ${m.st === 'grow' ? 'ok' : m.st === 'die' ? 'bad' : ''}">${fmtN(m.N)}</div>
      <div class="gauge"><b style="width:${(clamp(Math.log10(Math.max(m.N, 1)) / 7, 0, 1) * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>t</span><span>${String(S.t).replace('.', ',')} ч</span></div><div class="lr"><span>делений</span><span>${m.r > 0 ? f(m.n).replace('.', ',') : '—'}</span></div>`;
  } else if (m.kind === 'fungi') {
    el.innerHTML = `<div class="k">Подписано</div><div class="v ${S.done.fungi ? 'ok' : ''}">${m.placed} / 7</div>
      <div class="gauge"><b style="width:${(m.placed / 7 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>верно</span><span>${m.placed === 7 ? m.right + ' из 7' : '—'}</span></div>`;
  } else if (m.kind === 'virus') {
    el.innerHTML = `<div class="k">${m.ph ? 'Этап ' + m.ph + ' из 5' : 'Вирус гриппа'}</div><div class="v ${m.ph === 5 ? 'bad' : ''}">${m.ph ? STAGES[m.ph - 1].name : '≈ 0,1 мкм'}</div>
      <div class="gauge"><b style="width:${(m.ph / 5 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>${m.ph ? 'клетка' : 'вне клетки'}</span><span>${m.ph ? 'дыхат. путей' : 'не размнож.'}</span></div>`;
  } else {
    const c = S.look;
    el.innerHTML = c >= 0 ? `<div class="k">${CARDS[c].good ? 'Помощник' : 'Болезнь'}</div><div class="v">${CARDS[c].short}</div><div class="lr" style="display:block;line-height:1.35">${CARDS[c].clue}</div>`
      : `<div class="k">Разложено</div><div class="v ${S.done.health ? 'ok' : ''}">${m.placed} / 10</div><div class="gauge"><b style="width:${(m.placed / 10 * 100).toFixed(1)}%"></b></div><div class="lr"><span>верно</span><span>${m.placed === 10 ? m.right + ' из 10' : '—'}</span></div>`;
  }
}

function update() {
  const L = LESSONS[S.lesson];
  if (L.id === 'bact' && S.t === 4) { const b = bact(); if (b.N > 4000) S.big = true; if (b.N < 10) S.small = true; }
  const m = model();
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий микробиолог!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'bact') {
    now = `Слева — строение бактерии-палочки (капсула, клеточная стенка, мембрана, нуклеоид, рибосомы, жгутик). Справа — бульон под микроскопом, в начале одна бактерия, форма: ${SHAPES[S.shape].toLowerCase()}. Температура ${S.T} °C, соль: ${S.salt ? 'есть' : 'нет'}, время ${S.t} ч. ` +
      `Делений в час: ${f(m.r)}, всего делений: ${f(m.n)}, бактерий сейчас: ${fmtN(m.N)} (${ST_TXT[m.st]}). Часть «больше 4000 за 4 ч»: ${m.big ? 'выполнена' : 'нет'}; часть «меньше 10 за 4 ч»: ${m.small ? 'выполнена' : 'нет'}.`;
    guide = 'Не называй сразу нужную температуру. Спрашивай, при какой температуре живёт наш организм, что делают с продуктами, чтобы они не портились, и помогай считать 2 в степени n.';
  }
  if (id === 'fungi') {
    now = `Лесная сцена: берёза, подберёзовик с грибницей в почве, камень с лишайниками и срез лишайника под микроскопом. 7 точек: ${FP.map((p, i) => `${i + 1}) ${p.name} — ответ ученика: ${S.pa[i] ? FL[S.pa[i]].name.toLowerCase() : 'нет'}`).join('; ')}. ` +
      (S.cur >= 0 ? `Выбрана точка ${S.cur + 1}: там видно ${FP_SEEN[S.cur]}. ` : '') + (m.placed === 7 ? `Все подписаны, верно ${m.right} из 7.` : `Подписано ${m.placed} из 7, проверка появится, когда подписаны все.`);
    guide = 'Не называй, что в какой точке. Спрашивай, где созревают споры, какая часть гриба главная и живёт в почве, кто в лишайнике делает органические вещества на свету.';
  }
  if (id === 'virus') {
    now = m.ph === 0 ? `Вирус гриппа вне клетки. Внизу три клетки: клетка кожи (рецепторы-треугольники), клетка дыхательных путей (рецепторы-чашечки, реснички), бактерия (без таких рецепторов). Уже пробовали: ${Object.keys(S.tried).map(i => VCELLS[i].name).join(', ') || 'ничего'}.`
      : `Вирус прикрепился к клетке дыхательных путей. Этап ${m.ph} из 5: ${STAGES[m.ph - 1].name} — ${STAGES[m.ph - 1].d}`;
    now += ` В «Схеме»: из одной клетки выходит ${S.n} вирусов, циклов ${S.k}, итого ${fmtN(m.total)}.`;
    guide = 'Не говори сразу, какая клетка подходит. Спрашивай, чем шипы вируса похожи на рецепторы клеток и где человек заболевает гриппом — в носу и горле или на коже.';
  }
  if (id === 'health') {
    now = `10 карточек: ${CARDS.map((s, c) => `${s.short} (${s.good ? 'польза' : 'болезнь'}) — ${S.bin[c] < 0 ? 'не разложена' : 'в коробке «' + BINS[S.bin[c]].name + '»'}`).join('; ')}. Коробки: бактерии, вирусы, грибы. ` +
      (m.placed === 10 ? `Все разложены, верно ${m.right} из 10.` : `Разложено ${m.placed} из 10.`) + (S.look >= 0 ? ` Выбрана карточка «${CARDS[S.look].short}», подсказка: ${CARDS[S.look].clue}` : '');
    guide = 'Не говори, в какую коробку класть карточку. Подводи вопросами: помогает ли антибиотик, кто такие дрожжи и плесень, размножается ли возбудитель вне клеток.';
  }
  return [
    `Раздел: биология, 7 класс, тема «Бактерии, грибы, вирусы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    bact: 'Почему продукты в холодильнике портятся медленнее?', fungi: 'Зачем грибу дерево, а дереву гриб?',
    virus: 'Почему вирус нельзя назвать клеткой?', health: 'Почему грипп не лечат антибиотиками?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
