<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 10 класс: спирты и водородные связи, качественные реакции альдегидов, уксусная кислота и сода, сложные эфиры и жиры.">
<title>Спирты, альдегиды, кислоты</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene.rot{cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.goals{display:grid;gap:6px;margin-top:10px}
.goals div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 11px;font-size:13.5px}
.goals span{font:500 13px var(--font-mono);color:var(--muted)}
.goals .on span{color:var(--ok)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1500px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-oxyorg';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fml = (c, h, o) => low('C' + (c > 1 ? c : '') + 'H' + (h > 1 ? h : '') + (o ? 'O' + (o > 1 ? o : '') : ''));
const C_COL = '#4f586d', H_COL = '#eef2f8', O_COL = '#e5604f';

// ---------- lesson 1: alcohols. oh = which carbons carry –OH; alk = alkane with a close molar mass ----------
const ALC = [
  { name: 'Метанол', f: 'CH₃OH', cond: 'CH₃–OH', oh: [1], at: [1, 4, 1], bp: 64.7, mix: 'неограниченно', poly: false, alk: ['этан', 30, -88.6] },
  { name: 'Этанол', f: 'C₂H₅OH', cond: 'CH₃–CH₂–OH', oh: [0, 1], at: [2, 6, 1], bp: 78.4, mix: 'неограниченно', poly: false, alk: ['пропан', 44, -42.1] },
  { name: 'Пропанол-1', f: 'C₃H₇OH', cond: 'CH₃–CH₂–CH₂–OH', oh: [0, 0, 1], at: [3, 8, 1], bp: 97.2, mix: 'неограниченно', poly: false, alk: ['бутан', 58, -0.5] },
  { name: 'Бутанол-1', f: 'C₄H₉OH', cond: 'CH₃–(CH₂)₂–CH₂–OH', oh: [0, 0, 0, 1], at: [4, 10, 1], bp: 117.7, mix: 'около 7,7 г на 100 г воды', poly: false, alk: ['пентан', 72, 36.1] },
  { name: 'Пентанол-1', f: 'C₅H₁₁OH', cond: 'CH₃–(CH₂)₃–CH₂–OH', oh: [0, 0, 0, 0, 1], at: [5, 12, 1], bp: 138.0, mix: 'около 2,2 г на 100 г воды', poly: false, alk: ['гексан', 86, 68.7] },
  { name: 'Этиленгликоль', f: 'C₂H₄(OH)₂', cond: 'HO–CH₂–CH₂–OH', oh: [1, 1], at: [2, 6, 2], bp: 197.3, mix: 'неограниченно', poly: true, alk: ['бутан', 58, -0.5] },
  { name: 'Глицерин', f: 'C₃H₅(OH)₃', cond: 'HO–CH₂–CH(OH)–CH₂–OH', oh: [1, 1, 1], at: [3, 8, 3], bp: 290, mix: 'неограниченно', poly: true, alk: ['гексан', 86, 68.7] },
];
const molM = a => a[0] * 12 + a[1] + a[2] * 16;
const layered = i => i === 3 || i === 4;
const G1 = [['bp', 'первый одноатомный спирт, кипящий выше 100 °C'], ['layers', 'спирт, не смешивающийся с водой'], ['blue', 'многоатомный спирт']];

// ---------- lesson 2: unknown tubes ----------
const SUB = ['этанол', 'глицерин', 'этаналь'];
const RG = { cu: 'Cu(OH)₂', cut: 'Cu(OH)₂ + t', ag: 'Ag₂O (NH₃) + t' };

// ---------- lesson 3: vinegar 9 % + baking soda ----------
const W_AC = 0.09, M_AC = 60, M_SODA = 84, VM = 22.4;

// ---------- lesson 4: esters and fats ----------
const ACID = [
  { name: 'муравьиная', f: 'HCOOH', rest: 'HCOO', part: 'формиат', at: [1, 2] },
  { name: 'уксусная', f: 'CH₃COOH', rest: 'CH₃COO', part: 'ацетат', at: [2, 4] },
  { name: 'масляная', f: 'C₃H₇COOH', rest: 'C₃H₇COO', part: 'бутират', at: [4, 8] },
];
const ALK = [
  { name: 'метанол', f: 'CH₃OH', rad: 'CH₃', pre: 'метил', at: [1, 4] },
  { name: 'этанол', f: 'C₂H₅OH', rad: 'C₂H₅', pre: 'этил', at: [2, 6] },
  { name: 'бутанол-1', f: 'C₄H₉OH', rad: 'C₄H₉', pre: 'бутил', at: [4, 10] },
  { name: 'изоамиловый спирт', f: 'C₅H₁₁OH', rad: 'C₅H₁₁', pre: 'изоамил', at: [5, 12] },
];
const SMELL = [
  ['резкий эфирный', 'ром', 'фруктовый', 'фруктовый'],
  ['растворитель, клей', 'жидкость для снятия лака', 'растворитель красок', 'банан, груша'],
  ['яблоко', 'ананас', 'ананас', 'фруктовый'],

// ---------- model ----------
function esterOf(a, b) {
  const A = ACID[a], B = ALK[b], C = A.at[0] + B.at[0], H = A.at[1] + B.at[1] - 2;
  return { A, B, C, H, M: C * 12 + H + 32, f: A.rest + B.rad, name: B.pre + A.part, smell: SMELL[a][b],
           sys: (B.pre === 'изоамил' ? 'изоамиловый' : B.pre + 'овый') + ' эфир ' + { муравьиная: 'муравьиной', уксусная: 'уксусной', масляная: 'масляной' }[A.name] + ' кислоты' };
}
function fatOf(fa) {
  const acids = fa.map(i => FA[i]), C = 3 + acids.reduce((s, x) => s + x.C, 0), H = 5 + acids.reduce((s, x) => s + x.H - 1, 0);
  const uns = acids.filter(x => x.db > 0).length;
  return { acids, C, H, M: C * 12 + H + 96, f: fml(C, H, 6), uns, liquid: uns >= 2 };
}
function model() {
  const id = LID();
  if (id === 'alcohols') {
    const A = ALC[S.alc];
    return { kind: 'alc', A, M: molM(A.at), got: G1.filter(([k]) => S.got[k]).length, boiling: S.act === 'heat' && S.T >= A.bp };
  }
  if (id === 'aldehydes') {
    const right = [0, 1, 2].filter(i => S.lab[i] === S.perm[i]).length, labelled = Object.keys(S.lab).length;
    return { kind: 'ald', right, labelled };
  }
  if (id === 'acids') {
    const mAc = S.mv * W_AC, nA = mAc / M_AC, nS = S.ms / M_SODA, nR = Math.min(nA, nS), mEq = nA * M_SODA;
    const p = S.mix === null ? 0 : S.mix;
    return { kind: 'acid', mAc, nA, nS, nR, mEq, V: nR * VM, Vnow: nR * VM * p, exA: (nA - nR) * M_AC, exS: (nS - nR) * M_SODA,
             mixed: S.mix !== null && S.mix >= 1, ok: S.mix !== null && S.mix >= 1 && Math.abs(S.ms - mEq) <= 0.15 + 1e-9 };
  }
  return { kind: 'est', E: esterOf(S.ac, S.al), F: fatOf(S.fa), got: G4.filter(([k]) => S.got[k]).length };
}

// ---------- drawing helpers ----------
const scene = $('#scene');
const atomSVG = (x, y, r, fill, label, fs, tc, ring) =>
  `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r + 1.6).toFixed(1)}" fill="${INK}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="${ring || 'rgba(255,255,255,.18)'}" stroke-width="${ring ? 2.6 : 1.2}"/>` +
  `<ellipse cx="${(x - r * 0.33).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" rx="${(r * 0.32).toFixed(1)}" ry="${(r * 0.2).toFixed(1)}" fill="#fff" opacity=".14"/>` +
  `<text x="${x.toFixed(1)}" y="${(y + fs * 0.36).toFixed(1)}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="500">${label}</text>`;
const line = (p, q, col, w) => `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.4}" stroke-linecap="round"/><path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
const txt = (x, y, s, size, col, anchor = 'middle', w = 400) => `<text x="${x}" y="${y}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-weight="${w}">${s}</text>`;
function boardBg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#8d96a3"/><stop offset=".45" stop-color="#eef1f5"/><stop offset="1" stop-color="#9aa3af"/></linearGradient></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/><path d="M-2000 395H2520" stroke="#26324a" stroke-width="2"/>`;
}
// a test tube; layers from the bottom up: {f: share of height, col, op}
function tubeSVG(id, x, y, w, h, layers, extra, ring) {
  const r = w / 2, yb = y + h, path = `M${x} ${y}V${yb - r}A${r} ${r} 0 0 0 ${x + w} ${yb - r}V${y}`;
  let s = `<clipPath id="${id}"><path d="${path}Z"/></clipPath><path d="${path}Z" fill="rgba(160,190,230,.05)"/><g clip-path="url(#${id})">`;
  let acc = yb;
  for (const L of layers) { const hh = L.f * h; acc -= hh; s += `<rect x="${x}" y="${acc.toFixed(1)}" width="${w}" height="${(hh + 0.6).toFixed(1)}" fill="${L.col}" opacity="${L.op === undefined ? 0.85 : L.op}"/>`; }
  s += (extra || '') + '</g>';
  s += `<path d="${path}" fill="none" stroke="${ring || '#c8d1e2'}" stroke-opacity="${ring ? 1 : 0.75}" stroke-width="${ring ? 2.6 : 2}"/><path d="M${x - 4} ${y}h${w + 8}" stroke="${ring || '#c8d1e2'}" stroke-width="2.4" stroke-linecap="round"/>`;
  s += `<path d="M${x + 6} ${y + 10}V${yb - r - 4}" stroke="#fff" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>`;
  return s;
}
function burner(cx, y, on, t) {
  const fl = reduce ? 0 : Math.sin(t / 90) * 2.5 + Math.sin(t / 37) * 1.2;
  let s = `<rect x="${cx - 20}" y="${y + 12}" width="40" height="26" rx="8" fill="#2a3550" stroke="#56627d" stroke-width="1.5"/><rect x="${cx - 4}" y="${y + 4}" width="8" height="9" fill="#56627d"/>`;
  if (on) s += `<path d="M${cx - 8} ${y + 4}Q${cx - 6} ${y - 14 + fl} ${cx} ${y - 26 + fl}Q${cx + 6} ${y - 14 - fl} ${cx + 8} ${y + 4}Z" fill="#ffb547" opacity=".85"/><path d="M${cx - 4} ${y + 4}Q${cx} ${y - 12 + fl} ${cx + 4} ${y + 4}Z" fill="#72d4e8" opacity=".8"/>`;
  return s;
}
function bubbles(x, w, yb, hgt, t, n, col) {
  let s = '';
  for (let k = 0; k < n; k++) {
    const bx = x + 6 + ((k * 37) % Math.max(8, w - 12)), by = yb - 4 - (((t / 9) + k * 29) % Math.max(10, hgt - 6)), r = 1.6 + (k % 3);
    s += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${r}" fill="none" stroke="${col || '#e8ecf4'}" stroke-opacity=".7" stroke-width="1.2"/>`;
  }
  return s;
}

function alcGeom() {
  const A = ALC[S.alc], n = A.oh.length, x0 = 160 - (n - 1) * 22, C = [], O = [], H = [];

  A.oh.forEach((o, i) => { if (!o) return; const up = i % 2 === 1 || n === 1, oy = C[i][1] + (up ? -54 : 54); O.push([C[i][0], oy, i]); H.push([C[i][0] + 25, oy + (up ? -8 : 8)]); });
  return { A, n, C, O, H };
}

  h += txt(160, 322, A.cond, 14, '#e8ecf4', 'middle', 500) + txt(160, 344, A.poly ? `групп –OH: ${A.oh.filter(x => x).length}` : 'одноатомный спирт', 11.5, '#8b96ad');
  // the tube

  else if (S.act === 'cu') layers = A.poly ? [{ f: 0.46, col: '#2563eb', op: 0.9 }] : [{ f: 0.07, col: '#6cb8ea', op: 0.95 }, { f: 0.39, col: '#bfe0f4', op: 0.3 }];
  else layers = [{ f: 0.34, col: '#d7ecf7', op: 0.28 }];
  if (S.act === 'water' && layered(S.alc)) extra = `<path d="M${tx} ${(ty + th * 0.7).toFixed(1)}h${tw}" stroke="#e8ecf4" stroke-width="1.4" stroke-dasharray="3 2"/>`;

function tap(p) {
  const id = LID();
  if (id === 'alcohols') { if (p.x < 320 && p.y > 120 && p.y < 360) setAlc(S.alc + 1); return; }
  if (id === 'aldehydes') { RACK_X.forEach((x, i) => { if (p.x > x - 14 && p.x < x + 54 && p.y > 140 && p.y < 365) pickTube(i); }); return; }

let drag = null, dirty = true, liveT = 0;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (id === 'alcohols' && S.act === 'heat') {
    const bp = ALC[S.alc].bp;
    if (S.T < bp) { S.T = Math.min(bp, S.T + Math.max(60, (bp - 20) / 2.4) * dt); live(); if (S.T >= bp) boiled(); }
    anim = true;
  }
  if (id === 'aldehydes' && S.rg && S.ph < 1) { S.ph = Math.min(1, S.ph + dt / 2.2); anim = true; if (S.ph >= 1) update(); }
  if (id === 'acids' && S.mix !== null && S.mix < 1) { S.mix = Math.min(1, S.mix + dt / 1.8); anim = true; live(); if (S.mix >= 1) mixDone(); }
  if (id === 'esters' && S.mode === 'ester' && S.syn !== null && S.syn < 1) { S.syn = Math.min(1, S.syn + dt / 1.6); anim = true; if (S.syn >= 1) synDone(); }
  if (id === 'esters' && S.mode === 'fat' && S.built && !S.soap && fatOf(S.fa).liquid && !reduce) anim = true;
  if (S.hl) anim = true;

}

  el.querySelectorAll('#alChips button').forEach(b => b.onclick = () => { S.al = +b.dataset.i; S.syn = null; update(); });
  el.querySelectorAll('.fac').forEach(c => c.querySelectorAll('button').forEach(b => b.onclick = () => { S.fa[+c.dataset.r] = +b.dataset.i; S.built = false; S.soap = false; update(); }));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', fn(b)));
  if (id === 'alcohols') {
    set('#r1', m.M); set('#r2', S.seen[S.alc] ? fmt(m.A.bp, 1) + ' °C' : '?'); set('#r3', S.act === 'heat' ? fmt(S.T, 0) + ' °C' : { none: '—', water: 'вода', cu: 'Cu(OH)₂' }[S.act] || '—');
    const g = el.querySelector('#goalBox'); if (g) g.innerHTML = goalsHTML(G1, 'goals1');
  }
  if (id === 'aldehydes') {
    press('#rChips button', b => S.rg === b.dataset.k); press('#lChips button', b => S.lab[S.sel] === +b.dataset.k);
    const li = el.querySelector('#obsList');
    if (li) li.innerHTML = [0, 1, 2].map(i => { const ks = Object.keys(S.obs[i]); return `<div class="${S.sel === i ? 'on' : ''}">${'ABC'[i]}${S.lab[i] !== undefined ? ' · ' + SUB[S.lab[i]] : ''}<span>${ks.length ? ks.map(k => RG[k] + ': ' + sampleLayers(S.perm[i], k, 1).txt.toLowerCase()).join('; ') : 'опытов не было'}</span></div>`; }).join('');
  }
  if (id === 'acids') {
    set('#inMvO', S.mv + ' г'); set('#inMsO', fmt(S.ms, 1) + ' г'); val('#inMv', S.mv); val('#inMs', S.ms);
    set('#r1', fmt(m.nA, 4)); set('#r2', fmt(m.nS, 4)); set('#r3', m.mixed ? fmt(m.V, 2) + ' л' : '—');
  }
  if (id === 'esters') {
    if (S.mode === 'ester') { set('#r1', m.E.name); set('#r2', m.E.M); set('#r3', fml(m.E.C, m.E.H, 2)); press('#acChips button', b => S.ac === +b.dataset.i); press('#alChips button', b => S.al === +b.dataset.i); }
    else { set('#r1', m.F.f); set('#r2', m.F.M); set('#r3', S.built ? (m.F.liquid ? 'жидкий' : 'твёрдый') : '—'); el.querySelectorAll('.fac').forEach(c => c.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', S.fa[+c.dataset.r] === +b.dataset.i))); }
    const g = el.querySelector('#goalBox'); if (g) g.innerHTML = goalsHTML(G4, 'goals4');
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали опыта</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'alcohols') {
    const A = m.A, [c, hh, o] = A.at, seen = S.seen[S.alc], alk = A.alk;
    let h = `<h2>${A.name} ${A.f}</h2><div class="formula">M = n(C)·12 + n(H)·1 + n(O)·16</div><div class="steps">` +
      step('атомов C / H / O', `${c} / ${hh} / ${o}`) + step('M', `${c}·12 + ${hh}·1 + ${o}·16 = ${m.M} г/моль`, 'sum');
    if (!A.poly) h += step('проверка по ряду: M = 14n + 18', `14·${c} + 18 = ${14 * c + 18}`);
    h += `</div><h3>Спирт и алкан с близкой массой</h3><div class="steps">` +
      step(`${alk[0]}, M = ${alk[1]} г/моль`, `t кип ${fmt(alk[2], 1)} °C`) +
      step(`${A.name.toLowerCase()}, M = ${m.M} г/моль`, seen ? `t кип ${fmt(A.bp, 1)} °C` : 'нагрейте пробирку') +
      step('разница', seen ? `${fmt(A.bp - alk[2], 1)} °C` : '?', 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Массы почти равны, а спирт кипит намного выше: чтобы его молекулы улетели в пар, нужно разорвать водородные связи O–H···O между ними. У алкана таких связей нет.</p>` +
      `<h3>Растворимость в воде</h3><div class="steps">${step(A.name, S.mixSeen[S.alc] ? A.mix : 'добавьте воду')}</div>`;
    return h;
  }
  if (id === 'aldehydes') {
    let h = `<h2>Как рассуждать</h2><div class="steps">` +
      step('1. Cu(OH)₂ без нагрева: ярко-синий раствор', 'многоатомный спирт') +
      step('2. Серебряное зеркало или красный осадок при t', 'альдегид') +
      step('3. Нет ни того, ни другого', 'одноатомный спирт') + `</div>`;
    h += `<h3>Ваши наблюдения</h3><div class="steps">` + [0, 1, 2].map(i => { const ks = Object.keys(S.obs[i]); return step(`Пробирка ${'ABC'[i]}`, ks.length ? ks.map(k => RG[k] + ' → ' + sampleLayers(S.perm[i], k, 1).txt.toLowerCase()).join('<br>') : 'опытов нет'); }).join('') + `</div>`;
    h += `<h3>Уравнения качественных реакций</h3><div class="steps">` +
      step('серебряное зеркало (NH₃, t)', 'CH₃CHO + Ag₂O → CH₃COOH + 2Ag↓') +
      step('с гидроксидом меди(II), t', 'CH₃CHO + 2Cu(OH)₂ → CH₃COOH + Cu₂O↓ + 2H₂O') +
      step('Cu(OH)₂ при нагревании без альдегида', 'Cu(OH)₂ → CuO + H₂O') + `</div>` +
      `<p class="note" style="margin-top:10px">В обеих реакциях альдегид окисляется до кислоты, а серебро и медь восстанавливаются. Подписано пробирок: ${m.labelled} из 3.</p>`;
    return h;
  }
  if (id === 'acids') {
    const p = (x, n) => fmt(x, n);
    let h = `<h2>Уксус ${S.mv} г + сода ${p(S.ms, 1)} г</h2><div class="formula">CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂↑</div><div class="steps">` +
      step('m(кислоты) = m(уксуса) · 0,09', `${S.mv} · 0,09 = ${p(m.mAc, 2)} г`) +
      step('n(кислоты) = m / M, M = 60 г/моль', `${p(m.mAc, 2)} / 60 = ${p(m.nA, 4)} моль`) +
      step('n(соды) = m / M, M = 84 г/моль', `${p(S.ms, 1)} / 84 = ${p(m.nS, 4)} моль`) +
      step('по уравнению 1 : 1, соды нужно', `${p(m.nA, 4)} · 84 = ${p(m.mEq, 2)} г`, 'sum') +
      step('прореагирует (меньшее из двух)', `${p(m.nR, 4)} моль`) +
      step('V(CO₂) = n · 22,4 л/моль', `${p(m.nR, 4)} · 22,4 = ${p(m.V, 2)} л`) +
      step('останется', m.exA > 0.005 ? `кислоты ${p(m.exA, 2)} г` : m.exS > 0.005 ? `соды ${p(m.exS, 2)} г` : 'ничего') + `</div>`;
    h += `<p class="note" style="margin-top:10px">${m.mixed ? (m.ok ? 'Смешано точно: прореагировали оба вещества.' : 'Смешано, но с остатком. Нажмите «Заново» и поправьте массу соды.') : 'Ещё не смешано: нажмите «Смешать».'} Объём CO₂ указан для нормальных условий; в тёплой кухне газа по объёму будет чуть больше.</p>`;
    return h;
  }
  if (S.mode === 'ester') {
    const E = m.E, mA = E.A.at[0] * 12 + E.A.at[1] + 32, mB = E.B.at[0] * 12 + E.B.at[1] + 16;
    return `<h2>${E.name}</h2><div class="formula">R–COOH + HO–R′ ⇄ R–COO–R′ + H₂O</div><div class="steps">` +
      step('кислота', `${E.A.f}, M = ${mA} г/моль`) + step('спирт', `${E.B.f}, M = ${mB} г/моль`) +
      step('эфир', `${E.f} = ${fml(E.C, E.H, 2)}`) + step('M(эфира)', `${E.C}·12 + ${E.H} + 2·16 = ${E.M} г/моль`) +
      step('проверка массы', `${mA} + ${mB} = ${E.M} + 18`) + step('название', E.sys, 'sum') + `</div>` +
      `<h3>Сколько эфира из 10 г кислоты</h3><div class="steps">${step('n(кислоты)', `10 / ${mA} = ${fmt(10 / mA, 3)} моль`)}${step('m(эфира) теоретически', `${fmt(10 / mA, 3)} · ${E.M} = ${fmt(10 / mA * E.M, 1)} г`, 'sum')}</div>` +
      `<p class="note" style="margin-top:10px">На практике эфира получается меньше: реакция обратима. Выход повышают избытком спирта или отгонкой эфира.</p>` +
      `<h3>Получено</h3><div class="steps">${Object.entries(S.made).map(([n, s]) => step(n, s)).join('') || step('пока ничего', '—')}</div>`;
  }
  const F = m.F, sum = F.acids.reduce((s, x) => s + x.C * 12 + x.H + 32, 0), naoh = 100 / F.M * 3 * 40, gl = 100 / F.M * 92;
  return `<h2>Триглицерид ${F.f}</h2><div class="formula">C₃H₅(OH)₃ + 3 R–COOH → жир + 3H₂O</div><div class="steps">` +
    F.acids.map((x, i) => step(`кислота ${i + 1}`, `${x.f}${x.db ? ', C=C: ' + x.db : ''}`)).join('') +
    step('C = 3 + сумма C кислот', `${F.C}`) + step('H = 5 + сумма (H кислот − 1)', `${F.H}`) +
    step('M(жира)', `92 + ${sum} − 3·18 = ${F.M} г/моль`, 'sum') + `</div>` +
    `<h3>Омыление 100 г жира</h3><div class="formula" style="font-size:14px">жир + 3NaOH → C₃H₅(OH)₃ + 3 R–COONa</div><div class="steps">` +
    step('n(жира)', `100 / ${F.M} = ${fmt(100 / F.M, 4)} моль`) + step('m(NaOH) = 3 · n · 40', `${fmt(naoh, 1)} г`) + step('m(глицерина) = n · 92', `${fmt(gl, 1)} г`) +
    step('мыло', F.acids.map(x => x.salt).filter((v, i, a) => a.indexOf(v) === i).map(s => s + ' натрия').join(', '), 'sum') + `</div>` +
    `<p class="note" style="margin-top:10px">Непредельных остатков: ${F.uns}. Жиры с двумя-тремя остатками олеиновой или линолевой кислоты при 20 °C жидкие — это растительные масла. Мыловары как раз так и считают, сколько щёлочи нужно на свой жир.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID();
  if (id === 'alcohols') {
    el.innerHTML = `<div class="k">${m.A.name}</div><div class="v ${m.boiling ? 'ok' : ''}">${S.act === 'heat' ? fmt(S.T, 0) + ' °C' : 'M ' + m.M}</div><div class="lr"><span>t кип</span><span>${S.seen[S.alc] ? fmt(m.A.bp, 1) + ' °C' : '?'}</span></div><div class="lr"><span>целей</span><span>${m.got}/3</span></div><div class="gauge"><b style="width:${(m.got / 3 * 100).toFixed(1)}%"></b></div>`;
  } else if (id === 'aldehydes') {
    el.innerHTML = `<div class="k">Пробирка ${'ABC'[S.sel]}</div><div class="v">${S.lab[S.sel] !== undefined ? SUB[S.lab[S.sel]] : 'без подписи'}</div><div class="lr"><span>подписано</span><span>${m.labelled}/3</span></div><div class="lr"><span>опытов</span><span>${S.obs.reduce((s, o) => s + Object.keys(o).length, 0)}</span></div>`;
  } else if (id === 'acids') {
    el.innerHTML = `<div class="k">CO₂ в шарике</div><div class="v ${m.ok ? 'ok' : ''}">${fmt(m.Vnow, 2)} л</div><div class="lr"><span>кислота</span><span>${fmt(m.nA, 3)}</span></div><div class="lr"><span>сода</span><span>${fmt(m.nS, 3)}</span></div><div class="gauge"><b style="width:${clamp(m.nS / Math.max(m.nA, 1e-9) * 50, 0, 100).toFixed(1)}%"></b></div>`;
  } else {
    el.innerHTML = S.mode === 'ester'
      ? `<div class="k">Эфир</div><div class="v ${S.syn !== null && S.syn >= 1 ? 'ok' : ''}">${m.E.name}</div><div class="lr"><span>M</span><span>${m.E.M}</span></div><div class="lr"><span>целей</span><span>${m.got}/4</span></div>`
      : `<div class="k">Жир</div><div class="v ${S.built && m.F.liquid ? 'ok' : ''}">${S.built ? (m.F.liquid ? 'масло' : 'твёрдый') : 'не собран'}</div><div class="lr"><span>C=C хвостов</span><span>${m.F.uns}</span></div><div class="lr"><span>целей</span><span>${m.got}/4</span></div>`;
  }
}

function update() {
  const L = LESSONS[S.lesson], m = model();
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Спирты, альдегиды и кислоты освоены!'), 1600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  alcohols: '<path d="M8 20l10-7 10 7 10-7" stroke="#c8d1e2" stroke-width="1.5" fill="none"/><g fill="#4f586d"><circle cx="8" cy="20" r="3.6"/><circle cx="18" cy="13" r="3.6"/><circle cx="28" cy="20" r="3.6"/></g><circle cx="38" cy="13" r="3.4" fill="#e5604f"/><circle cx="45" cy="9" r="2.2" fill="#eef2f8"/><path d="M54 6v16a3 3 0 0 0 6 0V6" fill="none" stroke="#c8d1e2"/><rect x="54.5" y="15" width="5" height="9" fill="#2563eb"/>',
  aldehydes: '<path d="M8 6v16a3 3 0 0 0 6 0V6M20 6v16a3 3 0 0 0 6 0V6M32 6v16a3 3 0 0 0 6 0V6" fill="none" stroke="#c8d1e2"/><rect x="20.5" y="9" width="5" height="15" fill="#d6dbe2"/><rect x="32.5" y="19" width="5" height="4" fill="#b5442c"/><text x="52" y="20" font-size="9" fill="#e8ecf4" text-anchor="middle" font-family="monospace">CHO</text>',
  acids: '<path d="M26 10V14L18 26H40L32 14V10" fill="none" stroke="#c8d1e2"/><path d="M21 22H37L39.5 25.5H18.5Z" fill="#e8d9a8" opacity=".6"/><ellipse cx="29" cy="6" rx="5" ry="5" fill="#ff8a73" opacity=".8"/><path d="M48 24q6 -8 12 0" fill="#f4f6fa"/>',
  esters: '<path d="M8 6v20" stroke="#c8d1e2" stroke-width="1.5"/><g fill="#4f586d"><circle cx="8" cy="6" r="2.8"/><circle cx="8" cy="15" r="2.8"/><circle cx="8" cy="24" r="2.8"/></g><path d="M12 6h50M12 15l6 0 4-3 4 3 4-3 4 3 6-4 6-4 6-3M12 24h50" fill="none" stroke="#c8d1e2" stroke-width="1.2"/><path d="M40 14l6-4" stroke="#72d4e8" stroke-width="2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function shuffle3() { const a = [0, 1, 2]; for (let i = 2; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.alc = 1; S.act = 'none'; S.T = 20; S.seen = {}; S.mixSeen = {}; S.got = {};
  S.perm = shuffle3(); S.sel = 0; S.rg = null; S.ph = 1; S.lab = {}; S.obs = [{}, {}, {}];
  S.mv = 50; S.ms = 3; S.mix = null;
  S.mode = 'ester'; S.ac = 1; S.al = 1; S.syn = null; S.made = {}; S.fa = [1, 1, 1]; S.built = false; S.soap = false;
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'alcohols') {
    const A = m.A;
    now = `Выбран спирт: ${A.name} ${A.f} (${A.cond}), M = ${m.M} г/моль, ${A.poly ? 'многоатомный' : 'одноатомный'}. Опыт: ${{ none: 'пока не выбран', heat: m.boiling ? `нагрев — спирт кипит при ${fmt(A.bp, 1)} °C` : `нагрев, сейчас ${fmt(S.T, 0)} °C`, water: layered(S.alc) ? 'добавлена вода — два слоя' : 'добавлена вода — один слой', cu: A.poly ? 'добавлен Cu(OH)₂ — ярко-синий раствор' : 'добавлен Cu(OH)₂ — голубой осадок не изменился' }[S.act]}. ` +
      `Уже измерены температуры кипения: ${Object.keys(S.seen).map(i => `${ALC[i].name} ${fmt(ALC[i].bp, 1)} °C`).join(', ') || 'пока ни одной'}. Достигнутые цели: ${G1.filter(([k]) => S.got[k]).map(([, n]) => n).join('; ') || 'пока ни одной'}. Не называй спирт, который нужен для невыполненной цели, — спрашивай, как меняется температура кипения и растворимость с длиной цепи.`;
  }
  if (id === 'aldehydes') {
    now = `Три пробирки A, B, C с этанолом, глицерином и этаналем в неизвестном порядке. Выбрана пробирка ${'ABC'[S.sel]}. ` +
      `Наблюдения ученика: ${[0, 1, 2].map(i => { const ks = Object.keys(S.obs[i]); return `${'ABC'[i]}: ${ks.length ? ks.map(k => RG[k] + ' → ' + sampleLayers(S.perm[i], k, 1).txt.toLowerCase()).join('; ') : 'опытов нет'}`; }).join('. ')}. ` +
      `Подписи: ${[0, 1, 2].map(i => `${'ABC'[i]} — ${S.lab[i] !== undefined ? SUB[S.lab[i]] : 'нет'}`).join(', ')}; верных: ${m.labelled === 3 ? m.right : 'станет известно, когда подписаны все три'}. Не говори, что в какой пробирке, — помогай делать вывод из наблюдений.`;
  }
  if (id === 'acids') now = `Колба: ${S.mv} г столового уксуса (9 %, кислоты ${fmt(m.mAc, 2)} г, ${fmt(m.nA, 4)} моль). Сода: ${fmt(S.ms, 1)} г (${fmt(m.nS, 4)} моль). ${m.mixed ? `Смешано: CO₂ ${fmt(m.V, 2)} л, ${m.ok ? 'всё прореагировало точно' : m.exA > 0.005 ? `осталось ${fmt(m.exA, 2)} г кислоты` : `осталось ${fmt(m.exS, 2)} г соды`}.` : 'Ещё не смешано.'} Нужно, чтобы масса соды совпала с эквивалентной с точностью 0,1 г. Не называй нужную массу соды сразу — веди через количество вещества.`;
  if (id === 'esters') {
    now = S.mode === 'ester'
      ? `Режим «Эфиры»: выбраны ${m.E.A.name} кислота ${m.E.A.f} и ${m.E.B.name} ${m.E.B.f}, эфир ${m.E.f} (${m.E.name}), ${S.syn !== null && S.syn >= 1 ? `синтезирован, запах — ${m.E.smell}` : 'ещё не синтезирован'}. Уже получены: ${Object.entries(S.made).map(([n, s]) => `${n} (${s})`).join(', ') || 'ничего'}.`
      : `Режим «Жиры»: триглицерид из остатков ${m.F.acids.map(x => x.name).join(', ')}, ${m.F.f}, M = ${m.F.M}, непредельных остатков ${m.F.uns}. ${S.built ? (m.F.liquid ? 'Собран: жидкий при 20 °C.' : 'Собран: твёрдый при 20 °C.') : 'Ещё не собран.'} ${S.soap ? 'Омылён щёлочью.' : ''}`;
    now += ` Цели: ${G4.map(([k, n]) => `${n} — ${S.got[k] ? 'есть' : 'нет'}`).join('; ')}. Не называй готовые пары кислота+спирт для запахов — подсказывай через названия эфиров.`;
  }
  return [
    `Предмет: химия, 10 класс. Тема «Спирты, альдегиды, кислоты». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    alcohols: 'Почему спирты кипят выше, чем алканы той же массы?', aldehydes: 'Почему альдегид окисляется, а спирт в этих опытах нет?',
    acids: 'Почему уксусная кислота слабая, а реагирует с содой?', esters: 'Почему масло жидкое, а говяжий жир твёрдый?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
