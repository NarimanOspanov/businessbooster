<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8 класс: простейшие, черви, моллюски, членистоногие и насекомые.">
<title>Беспозвоночные</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="13" rx="4" ry="4" fill="rgba(255,181,71,.3)" stroke="var(--force)" stroke-width="1.2"/><ellipse cx="20" cy="20" rx="4.5" ry="4" fill="rgba(255,181,71,.3)" stroke="var(--force)" stroke-width="1.2"/><ellipse cx="20" cy="28" rx="5" ry="6" fill="rgba(255,181,71,.3)" stroke="var(--force)" stroke-width="1.2"/><path d="M16 18l-6-3M16 20h-7M16 22l-6 4M24 18l6-3M24 20h7M24 22l6 4M18 10l-3-5M22 10l3-5" stroke="var(--arm)" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Беспозвоночные</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f1 = x => (Math.round(x * 10) / 10).toString().replace('.', ',');

const INK = '#04070d';
const KEY = 'luch-bio-inverts';

};

];
const XS_SEEN = {

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function makeCells() {
  const r = rng(41), cells = [];
  const put = (kind, k, x0, x1) => { for (let i = 0; i < k; i++) {
    let x, y; do { x = x0 + r() * (x1 - x0); y = DY + (r() - .5) * 2 * RY * .8; } while (((x - DX) / (RX - 30)) ** 2 + ((y - DY) / (RY - 30)) ** 2 > 1);
    cells.push({ kind, x, y, a: r() * 6.28, ph: r() * 6.28 });
  } };
  put('amoeba', 3, 120, 420); put('para', 5, 220, 460); put('eug', 5, 300, 460);
  return cells;
}
function resetLesson() {
  const L = LESSONS[S.lesson];
  S.cells = makeCells(); S.sel = -1; S.named = {}; S.light = !!L.light; S.salt = !!L.salt; S.pause = false; S.lightOk = false; S.saltOk = false; S.simT = 0;
  S.bin = Array(WORMS.length).fill(-1); S.wsel = -1; S.look = -1;
  S.n = L.n === undefined ? 2 : L.n; S.hours = 0; S.running = false; S.last = null; S.mus = -1;
  S.parts = L.parts || 3; S.legs = L.legs || 8; S.ant = L.ant || 0; S.wings = L.wings || 0; S.built = {}; S.chgT = -1e9;
}

// ---------- models ----------
function arthClass() {
  const { parts, legs, ant, wings } = S;
  if (parts === 2 && legs === 10 && ant === 2 && wings === 0) return { cls: 'crust' };
  if (parts === 2 && legs === 8 && ant === 0 && wings === 0) return { cls: 'spider' };
  if (parts === 3 && legs === 6 && ant === 1) return { cls: 'insect' };
  let why;
  if (wings > 0 && parts === 2) why = 'Крылья бывают только у насекомых, а у них три отдела тела.';
  else if (parts === 3 && legs !== 6) why = 'Тело из трёх отделов — у насекомых, а у них ног меньше.';
  else if (parts === 3) why = 'Посчитайте усики: у насекомых их одна пара.';
  else if (legs === 6) why = 'Шесть ног бывает у насекомых, а у них тело из трёх отделов.';
  else if (legs === 8) why = 'У животного с восемью ногами и головогрудью не бывает усиков.';
  else why = 'У животного с пятью парами ног и головогрудью другое число усиков.';
  return { cls: null, why };
}
function model() {
  const id = LID();
  if (id === 'proto') {
    const eu = S.cells.filter(c => c.kind === 'eug'), pa = S.cells.filter(c => c.kind === 'para');
    const inL = eu.filter(c => c.x < LZ).length, far = pa.filter(c => Math.hypot(c.x - SX, c.y - SY) > SR).length;
    return { kind: 'proto', named: PKK.filter(k => S.named[k]).length, inL, far, lightOk: S.lightOk, saltOk: S.saltOk };
  }
  if (id === 'worms') { let n = 0, r = 0; S.bin.forEach((b, i) => { if (b >= 0) { n++; if (WTK[b] === WORMS[i].ans) r++; } }); return { kind: 'sort', placed: n, right: r }; }
  if (id === 'mollusc') {
    const C = turb(S.n, S.hours);
    return { kind: 'mol', n: S.n, hours: S.hours, C, finished: !!S.last && S.last.n === S.n && S.hours >= HMAX, filt: S.n * Q * S.hours, perH: S.n * Q / V };
  }
  const c = arthClass();
  return { kind: 'arth', cls: c.cls, why: c.why, built: TARGETS.filter(t => S.built[t.id]).length };
}

// ---------- lesson 1: simulation ----------
function sim(dt) {
  if (S.pause) return;
  S.simT += dt;
  for (const c of S.cells) {
    let sp;
    c.a += (Math.random() - .5) * (c.kind === 'amoeba' ? 1.5 : 3) * Math.sqrt(dt) * 2;
    const dS = Math.hypot(c.x - SX, c.y - SY);
    if (c.kind === 'eug') {
      const lit = S.light && c.x < LZ;
      if (S.light) c.a += adiff(c.a, Math.PI) * 2.2 * dt;
      sp = lit ? 8 : S.light ? 62 : 32;
    } else if (c.kind === 'para') {
      sp = 48;
      if (S.salt && dS < SR + 50) { c.a += adiff(c.a, Math.atan2(c.y - SY, c.x - SX)) * 6 * dt; sp = 95; }
    } else {
      sp = 5;
      if (S.salt && dS < SR) { c.a += adiff(c.a, Math.atan2(c.y - SY, c.x - SX)) * 1.5 * dt; sp = 9; }
    }
    c.x += Math.cos(c.a) * sp * dt; c.y += Math.sin(c.a) * sp * dt; c.ph += dt * (c.kind === 'eug' ? 14 : 2);
    const e = ((c.x - DX) / (RX - 16)) ** 2 + ((c.y - DY) / (RY - 16)) ** 2;
    if (e > 1) { const k = 1 / Math.sqrt(e); c.x = DX + (c.x - DX) * k; c.y = DY + (c.y - DY) * k; c.a = Math.atan2(DY - c.y, DX - c.x) + (Math.random() - .5) * 2.2; }
  }
  const m = model();
  let ch = false;
  if (S.light && m.inL >= 4 && !S.lightOk) { S.lightOk = true; ch = true; toast('Опыт со светом удался: эвглены собрались у лампы.'); }
  if (S.salt && m.far === 5 && !S.saltOk) { S.saltOk = true; ch = true; toast('Опыт с солью удался: инфузории уплыли от кристалла.'); }
  if (ch || Math.floor(S.simT * 4) !== Math.floor((S.simT - dt) * 4)) update(!ch);
}
function nameCell(k) {
  if (S.sel < 0) { toast('Сначала нажмите на клетку в капле.'); return; }
  const c = S.cells[S.sel];
  if (c.kind === k) {
    if (!S.named[k]) toast(`Верно: это ${PK[k].full.toLowerCase()}. Двигается: ${PK[k].move}.`);
    S.named[k] = true;
  } else toast('Не то. Посмотрите внимательнее, чем эта клетка двигается.');
  renderTools(); update();
}

// ---------- lesson 2 actions ----------
function drop(c, b) {
  S.bin[c] = b; S.wsel = -1; S.look = c;
  const m = model();
  if (m.placed === WORMS.length && m.right < WORMS.length) toast(`Все черви разложены. Верно ${m.right} из 9 — красные переложите.`);
  update();
}

// ---------- lesson 3 actions ----------
function setN(n) { S.n = clamp(n, 0, 10); S.hours = 0; S.running = false; S.last = null; renderTools(); update(); }
function runMussels() {
  if (S.n === 0) { toast('В аквариуме нет беззубок — вода сама не очистится. Добавьте их.'); }
  S.hours = 0; S.last = { n: S.n }; S.running = true;
  if (reduce) { S.hours = HMAX; finishRun(); }
  renderTools(); update();
}
function finishRun() {
  S.running = false; S.hours = HMAX;
  const C = turb(S.n, HMAX);
  if (C > GOAL) toast(`Через 12 ч мутность ${f1(C)} % — выше 20 %. Беззубок не хватило.`);
  else if (S.n > 5) toast(`Вода чистая (${f1(C)} %), но можно обойтись меньшим числом беззубок.`);
  else toast(`Через 12 ч мутность ${f1(C)} %. Цель достигнута!`);
  renderTools(); update();
}

// ---------- lesson 4 actions ----------
function setTrait(k, v) {
  S[k] = v; S.chgT = performance.now();
  const c = arthClass();
  if (c.cls) {
    const t = c.cls === 'crust' ? 'rak' : c.cls === 'spider' ? 'pauk' : S.wings === 2 ? 'bee' : null;
    if (t && !S.built[t]) { S.built[t] = true; toast(`Получилось: ${TARGETS.find(x => x.id === t).name.toLowerCase()} — ${AK[c.cls].name.toLowerCase()}.`); }
    else if (!t) toast(S.wings === 0 ? 'Это насекомое без крыльев, как блоха. У пчелы крылья есть.' : 'Это насекомое с одной парой крыльев, как муха или комар. А у пчелы?');
  }
  renderTools(); update();
}
const cycle = k => { const o = OPT[k]; setTrait(k, o[(o.indexOf(S[k]) + 1) % o.length]); };

// ---------- drawing helpers ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}

// ---------- protozoa pictures, local coords, front = +x ----------
function amoebaSVG(ph) {
  let d = '';
  for (let k = 0; k <= 36; k++) {
    const t = k / 36 * 6.2832, r = 15 + 4.5 * Math.sin(3 * t + ph) + 3 * Math.sin(5 * t - ph * 1.3) + 2 * Math.cos(2 * t + ph * .7);
    d += (k ? 'L' : 'M') + f(r * Math.cos(t)) + ' ' + f(r * Math.sin(t) * .9);
  }
  return `<path d="${d}Z" fill="rgba(200,180,235,.55)" stroke="#a88cc4" stroke-width="1"/><path d="${d}Z" fill="none" stroke="rgba(230,220,250,.35)" stroke-width="3" transform="scale(.82)"/>
    <circle cx="-3" cy="1" r="4.2" fill="#7d58aa"/><circle cx="6" cy="-4" r="2.2" fill="#e8dcc0" stroke="#a88cc4" stroke-width=".5"/><circle cx="4" cy="5" r="1.6" fill="#e8dcc0" stroke="#a88cc4" stroke-width=".5"/><circle cx="-9" cy="-4" r="2.4" fill="rgba(160,210,240,.7)"/>`;
}
function paraSVG(ph) {
  const d = 'M17 0Q17 -6 9 -6.5Q0 -7 -9 -5Q-17 -3 -17 1Q-16 6 -8 6.5Q-2 6.8 2 4.2Q6 2 9 5Q17 6 17 0Z';
  return `<path d="${d}" fill="none" stroke="#e8dcc0" stroke-width="4.4" stroke-dasharray=".6 1.4" stroke-dashoffset="${f(ph * 3)}" opacity=".8"/>

function hlBoxes(id) {
  const L = LID();
  if (L === 'proto') {
    if (id === 'drop') return [[DX - RX - 6, DY - RY - 6, 2 * RX + 12, 2 * RY + 12]];
    if (id === 'lamp') return [[6, DY - 26, 48, 58]];
    if (id === 'salt') return [[SX - SR, SY - SR, 2 * SR, 2 * SR]];
    if (id === 'cell' && S.sel >= 0) { const c = S.cells[S.sel]; return [[c.x - 26, c.y - 26, 52, 52]]; }
    return null;
  }
  if (L === 'worms') { const b = WTK.indexOf(id); if (b >= 0) { const [x, y] = binXY(b); return [[x - 4, y - 4, BW + 8, BH + 8]]; } return null; }
  if (L === 'mollusc') {
    if (id === 'tank') return [[TX0 - 4, TY0 - 4, TX1 - TX0 + 8, TY1 - TY0 + 8]];
    if (id === 'mus') return S.n ? [[musX(0) - 24, SAND - 34, musX(S.n - 1) - musX(0) + 48, 40]] : null;
    if (id === 'water') return [[TX0 + 4, WY + 2, TX1 - TX0 - 8, SAND - WY - 6]];
    if (id === 'clock') return [[TX0 - 4, 136, 420, 20]];
    return null;
  }
  const g = arthGeom(), seg = s => [AX - s.rx * 1.1 - 6, s.cy - s.ry - 6, s.rx * 2.2 + 12, s.ry * 2 + 12];
  const S0 = g.segs.find(s => s.id === id);
  if (S0) return [seg(S0)];
  if (id === 'legs') { const L2 = g.legSeg; return [[AX - L2.rx - 66, L2.cy - L2.ry - 30, 2 * L2.rx + 132, 2 * L2.ry + 70]]; }
  if (id === 'ant') return [[AX - 76, g.front.cy - g.front.ry - 50, 152, 54]];
  if (id === 'wings') { const w = g.three ? g.segs[1] : g.front; return [[AX - 80, w.cy, 160, 100]]; }
  return null;
}

const scene = $('#scene');

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const binAt = p => { for (let b = 0; b < 3; b++) { const [x, y] = binXY(b); if (p.x > x - 6 && p.x < x + BW + 6 && p.y > y - 10 && p.y < y + BH + 6) return b; } return -1; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) { if (LID() === 'mollusc' && S.mus >= 0) { S.mus = -1; update(); } return; }
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) {
    const c = +el.dataset.drag.slice(1), p = toSvg(e);
    let dx = -CW / 2, dy = -CH / 2;
    if (S.bin[c] < 0) { const [x, y] = homeXY(c); dx = x - p.x; dy = y - p.y; }
    drag = { c, dx, dy, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing');
  } else drag = { c: -1, hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };

scene.addEventListener('pointermove', e => {
  if (!drag) return;

function endDrag(cancel) {
  if (!drag) return;

  if (cancel) { dirty = true; return; }

    drop(d.c, binAt({ x: d.px, y: d.py }));

}
scene.addEventListener('pointerup', () => endDrag(false));

function tap(id) {

  if (L === 'worms' && id.startsWith('bin')) {
    if (S.wsel >= 0) drop(S.wsel, +id.slice(3)); else toast('Сначала нажмите на карточку с червём, потом на коробку.');
  }
  if (L === 'mollusc' && id.startsWith('m')) { const i = +id.slice(1); S.mus = S.mus === i ? -1 : i; update(); }
}

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = clamp((t - (lastT || t)) / 1000, 0, .05); lastT = t;
  let anim = false;
  const id = LID();
  if (id === 'proto') { sim(dt); anim = true; }
  if (id === 'mollusc' && S.running) {
    S.hours = Math.min(HMAX, S.hours + dt * 3);
    if (S.hours >= HMAX) finishRun(); else if (Math.floor(S.hours * 2) !== Math.floor((S.hours - dt * 3) * 2)) update(true);
    anim = true;
  }
  if (id === 'arthro' && !reduce) anim = t - S.chgT < 450;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

      <div class="row"><button class="ghostbtn" data-a="run">Запустить 12 ч</button><button class="ghostbtn" data-a="reset">Сбросить</button></div>`;

      [['parts', 'Отделы тела', ['2: головогрудь + брюшко', '3: голова + грудь + брюшко']], ['legs', 'Ходильные ноги', ['6', '8', '10']], ['ant', 'Усики', ['нет', '1 пара', '2 пары']], ['wings', 'Крылья', ['нет', '1 пара', '2 пары']]]
        .map(([k, lbl, labels]) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips" data-k="${k}">${OPT[k].map((v, i) => `<button data-v="${v}">${labels[i]}</button>`).join('')}</div></div>`).join('') +
      `<dl class="reads"><div><dt>Класс</dt><dd id="r1"></dd></div><div><dt>Собрано</dt><dd id="r2"></dd></div><div><dt>Ног</dt><dd id="r3"></dd></div></dl>`;
  el.innerHTML = h;
  const inp = el.querySelector('#inN'); if (inp) inp.addEventListener('input', e => setN(+e.target.value));
  el.querySelectorAll('#nChips button').forEach(b => b.onclick = () => nameCell(b.dataset.k));
  el.querySelectorAll('#xChips button, .row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
  el.querySelectorAll('.chips[data-k] button').forEach(b => b.onclick = () => setTrait(b.parentNode.dataset.k, +b.dataset.v));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'proto') {
    set('#r1', S.light ? `${m.inL} из 5` : 'свет выкл.'); set('#r2', S.salt ? `${m.far} из 5` : 'соли нет'); set('#r3', `${m.named} из 3`);
    el.querySelectorAll('#nChips button').forEach(b => b.setAttribute('aria-pressed', S.sel >= 0 && !!S.named[b.dataset.k] && S.cells[S.sel].kind === b.dataset.k));
    el.querySelectorAll('#xChips button').forEach(b => b.setAttribute('aria-pressed', !!S[b.dataset.a]));
  } else if (m.kind === 'sort') {
    set('#r1', `${m.placed} из 9`); set('#r2', m.placed === 9 ? `${m.right} из 9` : '—'); set('#r3', S.look >= 0 ? WORMS[S.look].short : '—');
    const bl = el.querySelector('#binList');
    if (bl) bl.innerHTML = WTK.map((k, b) => step(WT[k].name, WORMS.filter((_, c) => S.bin[c] === b).map(s => s.short).join(', ') || '—')).join('');
  } else if (m.kind === 'mol') {
    set('#inNO', String(S.n)); val('#inN', S.n);
    const d = el.querySelector('#tChart'); if (d) d.innerHTML = turbChart();
    set('#r1', `${f1(m.hours)} ч`); set('#r2', `${f1(m.C)} %`); set('#r3', `${f1(m.filt)} л`);
  } else {
    set('#r1', m.cls ? AK[m.cls].name : 'нет'); set('#r2', `${m.built} из 3`); set('#r3', String(S.legs));
    el.querySelectorAll('.chips[data-k]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === S[g.dataset.k])));
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'proto') {
    let h = `<h2>Как узнать простейшее</h2><div class="formula">чем двигается → кто это</div><div class="steps">` +
      step('1. Выросты, форма всё время меняется?', 'ложноножки') + step('2. Всё тело в коротких волосках?', 'реснички') + step('3. Один длинный волосок спереди?', 'жгутик') + `</div>`;
    if (S.sel >= 0) { const c = S.cells[S.sel]; h += `<h3>Выбранная клетка: что видно</h3><p>${PK[c.kind].seen[0].toUpperCase() + PK[c.kind].seen.slice(1)}.</p>`; }
    h += `<h3>Названо</h3><div class="steps">` + PKK.map(k => step(S.named[k] ? PK[k].full : 'вид ' + (PKK.indexOf(k) + 1), S.named[k] ? PK[k].move + ' ✓' : '—')).join('') + `</div>`;
    h += `<h3>Опыты</h3><div class="steps">` +
      step('Свет: эвглен в светлой зоне', S.light ? `${m.inL} из 5 (нужно 4)` : 'лампа выключена') +
      step('Соль: инфузорий дальше зоны соли', S.salt ? `${m.far} из 5 (нужно 5)` : 'соли нет') +
      step('Вывод', m.lightOk && m.saltOk ? 'простейшие раздражимы' : 'опыт не закончен', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Движение к раздражителю или от него называют таксисом. Эвглене свет нужен для фотосинтеза, а солёная вода вредна инфузории.</p>`;
    return h;
  }
  if (id === 'worms') {
    const all = m.placed === 9;
    let h = `<h2>Как рассуждать</h2><div class="formula">полость тела: нет → плоские, первичная → круглые, вторичная + сегменты → кольчатые</div><div class="steps">` +
      step('1. Тело плоское, полости нет?', 'плоские') + step('2. Круглое, гладкое, полость с жидкостью?', 'круглые') + step('3. Кольца-сегменты, есть кровеносные сосуды?', 'кольчатые') + `</div>`;
    if (S.look >= 0) h += `<h3>${WORMS[S.look].short}: срез</h3><p>${XS_SEEN[WORMS[S.look].ans][0].toUpperCase() + XS_SEEN[WORMS[S.look].ans].slice(1)}. Образ жизни: ${WORMS[S.look].life}.</p>`;
    h += `<h3>Сейчас</h3><div class="steps">` + WORMS.map((w, c) => step(w.short, S.bin[c] < 0 ? '—' : WT[WTK[S.bin[c]]].name + (all ? (WTK[S.bin[c]] === w.ans ? ' ✓' : ' ✗') : ''))).join('') +
      step('итого', all ? `верно ${m.right} из 9` : `разложено ${m.placed} из 9`, 'sum') + `</div>`;
    if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 9 карточек будут в коробках.</p>`;
    return h;
  }
  if (id === 'mollusc') {
    const per = S.n * Q, frac = per / V, keep = 1 - frac, C12 = turb(S.n, HMAX);
    let h = `<h2>Сколько мути останется</h2><div class="formula">мутность через t ч = 100 % · (1 − n·q / V)<sup>t</sup></div><div class="steps">` +
      step('число беззубок n', String(S.n)) + step('одна беззубка q', '1,5 л/ч') + step('объём воды V', '50 л') +
      step('за час процежено n·q', `${S.n} · 1,5 = ${f1(per)} л`) + step('доля воды за час n·q / V', `${f1(per)} / 50 = ${(Math.round(frac * 100) / 100).toString().replace('.', ',')}`) +
      step('мути остаётся за час', `1 − ${(Math.round(frac * 100) / 100).toString().replace('.', ',')} = ${(Math.round(keep * 100) / 100).toString().replace('.', ',')}`) +
      step('через 12 ч', `100 % · ${(Math.round(keep * 100) / 100).toString().replace('.', ',')}<sup>12</sup> = ${f1(C12)} %`) +
      step('цель ≤ 20 %', C12 <= GOAL ? 'достигнута' : 'не достигнута', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Каждый час беззубки процеживают одну и ту же долю воды, поэтому мутность падает не на одинаковую величину, а в одно и то же число раз. Сейчас на часах ${f1(S.hours)} ч, мутность ${f1(m.C)} %.</p>`;
    return h;
  }
  const c = arthClass();
  let h = `<h2>Определяем класс</h2><div class="formula">отделы → ноги → усики → крылья → класс</div><div class="steps">` +
    step('1. Отделы тела', S.parts === 3 ? 'голова, грудь, брюшко' : 'головогрудь, брюшко') + step('2. Ходильные ноги', `${S.legs} (${S.legs / 2} пары)`.replace('5 пары', '5 пар')) +
    step('3. Усики', S.ant ? S.ant + ' пар' + (S.ant === 1 ? 'а' : 'ы') : 'нет') + step('4. Крылья', S.wings ? S.wings + ' пар' + (S.wings === 1 ? 'а' : 'ы') : 'нет') +
    step('вывод', c.cls ? AK[c.cls].name : 'такого класса нет', 'sum') + `</div>`;
  if (!c.cls) h += `<p class="note" style="margin-top:10px">${c.why}</p>`;
  h += `<h3>Признаки классов</h3><div class="steps">` + step('Ракообразные', '2 отдела · 10 ног · 2 пары усиков') + step('Паукообразные', '2 отдела · 8 ног · усиков нет') + step('Насекомые', '3 отдела · 6 ног · 1 пара усиков · крылья') + `</div>`;
  h += `<h3>Собрано</h3><div class="steps">` + TARGETS.map(t => step(t.name, S.built[t.id] ? '✓' : '—')).join('') + `</div>`;
  return h;
}

function renderMeter(m) {

    el.innerHTML = `<div class="k">Капля</div><div class="v ${S.done.proto ? 'ok' : ''}">названо ${m.named}/3</div>
      <div class="lr"><span>у света</span><span>${S.light ? m.inL + '/5' : '—'}</span></div><div class="lr"><span>вдали от соли</span><span>${S.salt ? m.far + '/5' : '—'}</span></div>

    el.innerHTML = `<div class="k">${c >= 0 ? 'Поперечный срез' : 'Разложено'}</div><div class="v ${S.done.worms ? 'ok' : ''}">${c >= 0 ? WORMS[c].short : m.placed + ' / 9'}</div>` +
      (c >= 0 ? `<svg viewBox="-26 -26 52 52" aria-hidden="true">${XS[WORMS[c].ans]()}</svg>` : `<div class="gauge"><b style="width:${(m.placed / 9 * 100).toFixed(1)}%"></b></div>`) +

  } else if (m.kind === 'mol') {

    el.innerHTML = `<div class="k">Класс</div><div class="v ${m.cls ? 'ok' : 'bad'}">${m.cls ? AK[m.cls].name : 'нет такого'}</div>
      <div class="lr"><span>ног</span><span>${S.legs}</span></div><div class="lr"><span>собрано</span><span>${m.built}/3</span></div>`;
  }
}

function update(light) {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий зоолог!');
    light = false;
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  if (!light || S.tab === 'scheme' || S.tab === 'calc') renderPanes(m);
  if (!light) {
    const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
    $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  }
  dirty = true;
}

      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage; $('#hint').hidden = L.id === 'worms';
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'proto') {
    now = `Капля прудовой воды под микроскопом (×150), в ней 13 одноклеточных трёх видов, они плавают. ` +
      `Ученик уже правильно назвал: ${PKK.filter(k => S.named[k]).map(k => PK[k].full).join(', ') || 'пока никого'}. ` +
      (S.sel >= 0 ? `Выбрана клетка: ${PK[S.cells[S.sel].kind].seen}. ` : 'Клетка не выбрана. ') +
      `Лампа слева ${S.light ? 'включена, эвглен в светлой зоне ' + m.inL + ' из 5' : 'выключена'}. Соль ${S.salt ? 'брошена справа, инфузорий вне солёной зоны ' + m.far + ' из 5' : 'не брошена'}. ` +
      `Опыт со светом ${m.lightOk ? 'удался' : 'не сделан'}, опыт с солью ${m.saltOk ? 'удался' : 'не сделан'}.${S.pause ? ' Движение на паузе.' : ''}`;
    guide = 'Не называй, как зовут выбранную клетку. Спрашивай, чем она двигается и что у неё внутри. Про опыты спрашивай, что нужно эвглене на свету и почему инфузории уплывают от соли.';
  }
  if (id === 'worms') {
    now = `9 карточек с червями: ${WORMS.map((w, c) => `${w.short} — ${S.bin[c] < 0 ? 'не разложена' : 'в коробке «' + WT[WTK[S.bin[c]]].name + '»'}`).join('; ')}. Коробки: плоские, круглые, кольчатые черви. ` +
      (m.placed === 9 ? `Все разложены, верно ${m.right} из 9.` : `Разложено ${m.placed} из 9.`) + (S.look >= 0 ? ` Показан поперечный срез червя «${WORMS[S.look].short}»: ${XS_SEEN[WORMS[S.look].ans]}.` : '');
    guide = 'Не говори, в какую коробку класть червя. Подводи вопросами: есть ли полость тела, какая она, есть ли кольца-сегменты, сквозной ли кишечник.';
  }
  if (id === 'mollusc') {
    now = `Аквариум 50 л с мутной водой, на дне беззубок: ${S.n}. Одна беззубка процеживает 1,5 л в час. Время опыта ${f1(S.hours)} ч из 12${S.running ? ' (опыт идёт)' : ''}, мутность сейчас ${f1(m.C)} %. ` +
      (S.last && S.hours >= HMAX ? `Опыт закончен: через 12 ч мутность ${f1(m.C)} %.` : 'Опыт с этим числом беззубок ещё не закончен.') + (S.mus >= 0 ? ' Показано строение беззубки: раковина, мантия, жабры, нога, сифоны.' : '');
    guide = 'Не называй нужное число беззубок. Помоги посчитать долю воды, которую беззубки процеживают за час, и как мутность меняется за 12 часов.';
  }
  if (id === 'arthro') {
    const c = arthClass();
    now = `Конструктор членистоногого. Сейчас: отделов тела ${S.parts} (${S.parts === 3 ? 'голова, грудь, брюшко' : 'головогрудь и брюшко'}), ходильных ног ${S.legs}, усиков: ${['нет', '1 пара', '2 пары'][S.ant]}, крыльев: ${['нет', '1 пара', '2 пары'][S.wings]}. ` +
      `Результат: ${c.cls ? 'класс ' + AK[c.cls].name : 'такого членистоногого нет'}. Собраны: ${TARGETS.filter(t => S.built[t.id]).map(t => t.name).join(', ') || 'никто'}; нужно собрать речного рака, паука-крестовика и медоносную пчелу.`;
    guide = 'Не называй готовый набор признаков. Спрашивай, сколько у этого животного отделов тела, ног, усиков и крыльев, вспоминая, как оно выглядит.';
  }
  return [
    `Раздел: биология, 8 класс, тема «Беспозвоночные». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    proto: 'Почему эвглену называют и растением, и животным?', worms: 'Как не заразиться червями-паразитами?',
    mollusc: 'Как беззубка очищает воду?', arthro: 'Чем паук отличается от насекомого?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
