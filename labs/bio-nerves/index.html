<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 9 класс: нейрон и рефлекторная дуга, отделы головного мозга, зрение и слух, сон и память.">
<title>Мозг и чувства</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M12 27C7 26 6 20 9 17C8 12 13 9 17 10C19 7 25 7 27 10C31 10 34 14 32 18C35 21 33 27 28 27C26 30 21 30 20 28C18 30 14 29 12 27Z" fill="rgba(217,163,168,.28)" stroke="#d9a3a8" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 11V28M14 16q3 2 6 1M26 15q-3 3-6 2M13 22q4 1 7-1M27 22q-3 1-7-1" fill="none" stroke="#d9a3a8" stroke-width="1.2" stroke-linecap="round"/><path d="M29 6l-3 6h4l-3 6" fill="none" stroke="var(--force)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Мозг</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f3 = x => (Math.round(x * 1000) / 1000).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-nerves';
const BRAIN = '#d9a3a8';

// ---------- lesson 1: reflex arc ----------
const AP = {
  rec: { name: 'Рецептор', c: '#ffb547', job: 'чувствительное окончание в коже пальца: превращает жар в нервный импульс' },
  sen: { name: 'Чувствительный нейрон', c: '#72d4e8', job: 'несёт импульс от рецептора в спинной мозг; его тело лежит в спинномозговом узле рядом со спинным мозгом' },
  int: { name: 'Вставочный нейрон', c: '#b48cff', job: 'лежит в сером веществе спинного мозга и передаёт импульс с чувствительного нейрона на двигательный' },
  mot: { name: 'Двигательный нейрон', c: '#86e0a8', job: 'тело лежит в передних рогах серого вещества, длинный аксон идёт к мышце' },
  eff: { name: 'Рабочий орган', c: '#ff8a73', job: 'мышца-сгибатель: сокращается и отдёргивает руку' },
};
const APK = ['rec', 'sen', 'int', 'mot', 'eff'];
// slots in arc order; letters are scrambled on purpose
const SLOTS = [
  { k: 'rec', x: 142, y: 262, bx: 160, by: 282, L: 'В', where: 'в коже кончика пальца, над пламенем' },
  { k: 'sen', x: 300, y: 176, bx: 300, by: 154, L: 'Д', where: 'в узелке на нерве у задней стороны спинного мозга' },
  { k: 'int', x: 376, y: 232, bx: 400, by: 222, L: 'Б', where: 'в середине серого вещества спинного мозга' },
  { k: 'mot', x: 366, y: 264, bx: 384, by: 284, L: 'Г', where: 'в переднем роге серого вещества, откуда отросток выходит к руке' },
  { k: 'eff', x: 64, y: 214, bx: 64, by: 190, L: 'А', where: 'на предплечье, это мышца' },
];
const ARC = [[142, 262], [176, 236], [222, 204], [262, 186], [300, 176], [330, 186], [356, 200], [364, 208], [376, 232], [372, 250], [366, 264], [352, 274], [322, 290], [280, 300], [220, 304], [160, 288], [118, 252], [88, 226], [64, 214]];
const SLOT_I = [0, 4, 8, 10, 18];
const SU = (() => {
  const c = [0]; for (let i = 1; i < ARC.length; i++) c.push(c[i - 1] + Math.hypot(ARC[i][0] - ARC[i - 1][0], ARC[i][1] - ARC[i - 1][1]));
  return SLOT_I.map(i => c[i] / c[c.length - 1]);
})();
const LETTERS = SLOTS.map((s, i) => [s.L, i]).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
const NPARTS = {
  dend: { name: 'Дендриты', spec: 'Короткие ветвистые отростки. Принимают сигналы и несут их к телу нейрона.' },
  body: { name: 'Тело нейрона', spec: 'Содержит ядро. Скопления тел нейронов — это серое вещество мозга и нервные узлы.' },
  axon: { name: 'Аксон', spec: 'Один длинный отросток (у двигательных нейронов — до 1 м). Несёт импульс от тела к другим клеткам.' },
  myel: { name: 'Миелиновая оболочка', spec: 'Белая жировая «изоляция» аксона. Импульс перескакивает между перехватами и бежит до 120 м/с. Пучки таких аксонов — белое вещество.' },
  syn: { name: 'Синапс', spec: 'Место контакта нейрона с другой клеткой. Импульс передаётся химически — медиатором, с задержкой около 0,5 мс.' },
};

// ---------- lesson 2: brain ----------

// ---------- models ----------
function eyeOpt() {
  const E = EYES[S.eye], O = OBJS[S.obj], P = 60 + S.acc + S.gl, need = 1 / O.d + E.inv, mis = P - need;
  const vi = P - 1 / O.d, di = vi > 0 ? 1000 / vi : 999;
  return { E, O, P, need, mis, sharp: Math.abs(mis) <= 0.3, di, dr: 1000 / E.inv };
}
function stageAt(min) {
  const k = Math.floor(min / 90), x = min - k * 90, n3 = Math.max(0, 40 - 12 * k), rem = Math.min(30, 8 + 6 * k), n2b = 90 - 5 - 15 - n3 - rem;
  if (x < 5) return 'N1'; if (x < 20) return 'N2'; if (x < 20 + n3) return 'N3'; if (x < 20 + n3 + n2b) return 'N2'; return 'R';
}
function memModel() {
  const h = S.sleep, q = h >= 8 ? 1 + 0.03 * (h - 8) : 1 - 0.12 * (8 - h);
  const reps = [...S.reps].sort((a, b) => a - b);
  const seg = [{ t0: 0, S: q }], steps = [];
  for (const d of reps) {
    const c = seg[seg.length - 1], R = Math.exp(-(d - c.t0) / c.S), Sn = c.S * (1.5 + 2 * (1 - R)) * q;
    steps.push({ d, R, S0: c.S, S: Sn }); seg.push({ t0: d, S: Sn });
  }
  const R = t => { let c = seg[0]; for (const s of seg) if (s.t0 <= t) c = s; return Math.exp(-(t - c.t0) / c.S); };
  return { q, reps, seg, steps, R, R7: R(7) };
}
function model() {
  const id = LID();
  if (id === 'arc') {
    let n = 0, r = 0; S.lab.forEach((a, i) => { if (a) { n++; if (a === SLOTS[i].k) r++; } });
    const tc = S.len / S.v * 1000, ts = 3 * 0.5;
    return { kind: 'arc', placed: n, right: r, fired: S.fired, tc, ts, t: tc + ts };
  }
  if (id === 'brain') { const pct = 1.35 / S.mass * 100, W = S.kcal * 0.2 * 4186 / 86400; return { kind: 'brain', solved: S.q, miss: S.miss, pct, W }; }
  if (id === 'sense') {
    const o = eyeOpt(), pos = cochPos(S.fq), earNow = Math.abs(pos - TPOS) <= 0.025;
    const nearNow = S.eye === 'norm' && S.obj === 'book' && S.gl === 0 && o.sharp, myoNow = S.eye === 'myo' && S.obj === 'sign' && o.sharp;
    return { kind: 'sense', o, pos, earNow, nearNow, myoNow, near: S.got.near || nearNow, myo: S.got.myo || myoNow, ear: S.got.ear || earNow };
  }
  const M = memModel(), wake = S.bed + S.sleep;
  return { kind: 'sleep', M, h: S.sleep, wake, wakeOk: wake <= 31 + 1e-9, R7: M.R7, wst: stageAt(S.sleep * 60) };
}

  else toast('Все звенья названы. Нажмите «Коснуться огня» и проверьте дугу.');

}
function fire() {
  if (S.fire && S.fire.run) return;
  const bad = SLOTS.findIndex((s, i) => S.lab[i] !== s.k);
  S.fired = false;
  S.fire = { t0: performance.now(), stop: bad < 0 ? 1 : SU[bad], ok: bad < 0, bad, run: true, u: 0 };

  const F = S.fire; F.run = false; F.u = F.stop;

}

function sleepScene() {

  // hypnogram
  h += lbl(HX1, 100, `Ночь: отбой ${clock(S.bed)}, подъём ${clock(m.wake)} · ${ru(S.sleep, 1)} ч`, 11.5, m.wakeOk ? '#e8ecf4' : '#ff8a73', 'end', 'font-weight="600"');

  for (const k of ['W', 'R', 'N1', 'N2', 'N3']) h += `<text x="${HX0 - 10}" y="${HLV[k] + 3}" font-size="8.5" fill="#8b96ad" text-anchor="end">${k === 'W' ? 'бодр.' : k === 'R' ? 'БДГ' : k === 'N3' ? 'глуб.' : k}</text>`;
  h += `</g>`;
  const tot = S.sleep * 60;
  let d = `M${HX0} ${HLV.W}`, prev = 'W', rem = '';

  }

  for (const r of [0.5, 1]) h += `<path d="M${MX0} ${f(my(r))}H${MX1}" stroke="#26324a" stroke-dasharray="2 4"/><text x="${MX0 - 8}" y="${f(my(r) + 3)}" font-size="8.5" fill="#8b96ad" text-anchor="end">${r * 100}%</text>`;
  h += `</g>`;

  let c = '';

  h += `<path d="M${MX0} ${MY0}H${MX1}" stroke="#8b96ad" stroke-width="1.2"/>`;
  for (let dd = 0; dd <= 7; dd++) h += `<text x="${f(mx(dd))}" y="${MY0 + 13}" font-size="8.5" fill="#8b96ad" text-anchor="middle">${dd === 0 ? 'выучил' : dd === 7 ? 'к/р' : 'д.' + dd}</text>`;
  h += `<g data-hit="exam"><path d="M${MX1} ${MY1 - 4}V${MY0}" stroke="#ff8a73" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="${MX1}" cy="${f(my(M.R7))}" r="4.5" fill="${M.R7 >= 0.8 ? '#86e0a8' : '#ff8a73'}" stroke="${INK}"/></g>`;

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) { drag = { key: el.dataset.drag, x: e.clientX, y: e.clientY, moved: false }; scene.classList.add('grabbing'); }
  else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;

  const p = toSvg(e), i = +drag.key.slice(3);

  dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (d.key && d.moved) update();
  if (cancel || d.moved || !d.hit) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));

  if (id === 'brain') h = `<h2>Мозг и энергия</h2><p class="note">Мозг тяжёлый не сам по себе — он очень «прожорливый». Посчитаем для вас.</p>` +
    slider('inMass', 'Масса тела, кг', 30, 100, 1, S.mass) + slider('inKcal', 'Энергия за сутки, ккал', 1500, 3500, 50, S.kcal) +
    `<dl class="reads"><div><dt>Мозг от массы</dt><dd id="r1"></dd></div><div><dt>Мощность мозга</dt><dd id="r2"></dd></div><div><dt>Разобрано</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Отдел</div><div class="chips" id="brChips">${BRK.map(k => `<button data-k="${k}">${BR[k].name}</button>`).join('')}</div></div>
    <div class="row"><button class="ghostbtn" data-a="names" id="namesBtn">Подписи</button></div>`;
  if (id === 'sense') {
    h = `<h2>${S.mode === 'eye' ? 'Оптика глаза' : 'Улитка'}</h2><div class="ctl"><div class="lbl">Режим</div><div class="chips" id="modeChips"><button data-k="eye">Глаз</button><button data-k="ear">Ухо</button></div></div>`;
    if (S.mode === 'eye') h += `<div class="ctl"><div class="lbl">Глаз</div><div class="chips" id="eyeChips">${EYK.map(k => `<button data-k="${k}">${EYES[k].name}</button>`).join('')}</div></div>
      <div class="ctl"><div class="lbl">Предмет</div><div class="chips" id="objChips"><button data-k="book">Книга 25 см</button><button data-k="sign">Вывеска 6 м</button></div></div>` +
      slider('inAcc', 'Аккомодация хрусталика, дптр', 0, 10, 0.5, S.acc) + slider('inGl', 'Очки, дптр', -4, 4, 1, S.gl) +
      `<dl class="reads"><div><dt>Сила глаза</dt><dd id="r1"></dd></div><div><dt>Нужно</dt><dd id="r2"></dd></div><div><dt>Резкость</dt><dd id="r3"></dd></div></dl>`;
    else h += slider('inFq', 'Частота звука', 1.3, 4.3, 0.01, Math.log10(S.fq)) +
      `<dl class="reads"><div><dt>Частота</dt><dd id="r1"></dd></div><div><dt>От начала</dt><dd id="r2"></dd></div><div><dt>Длина волны</dt><dd id="r3"></dd></div></dl>`;
  }
  if (id === 'sleep') h = `<h2>Режим и повторения</h2>` + slider('inSleep', 'Сон, часов', 5, 10, 0.5, S.sleep) +
    `<div class="ctl"><div class="lbl">Отбой</div><div class="chips" id="bedChips">${[21, 22, 23, 24].map(v => `<button data-v="${v}">${clock(v)}</button>`).join('')}</div></div>` +
    [0, 1, 2].map(i => slider('inRep' + i, `Повторение ${i + 1}, день`, 0.25, 6.75, 0.25, S.reps[i] ?? 1)).join('') +
    `<dl class="reads"><div><dt>Подъём</dt><dd id="r1"></dd></div><div><dt>Циклов сна</dt><dd id="r2"></dd></div><div><dt>К контрольной</dt><dd id="r3"></dd></div></dl>

  on('#inLen', v => { S.len = v; update(); });
  on('#inMass', v => { S.mass = v; update(); });
  on('#inKcal', v => { S.kcal = v; update(); });
  on('#inAcc', v => setAcc(v));
  on('#inGl', v => setGl(v));
  on('#inFq', v => setFq(Math.pow(10, v)));
  on('#inSleep', v => setSleep(v));
  [0, 1, 2].forEach(i => on('#inRep' + i, v => { while (S.reps.length <= i) S.reps.push(v); S.reps[i] = v; renderTools(); update(); }));
  el.querySelectorAll('#slChips button').forEach(b => b.onclick = () => pickSlot(+b.dataset.i));
  el.querySelectorAll('#apChips button').forEach(b => b.onclick = () => assign(b.dataset.k));
  el.querySelectorAll('#brChips button').forEach(b => b.onclick = () => pickRegion(b.dataset.k));
  el.querySelectorAll('#modeChips button').forEach(b => b.onclick = () => act('m-' + b.dataset.k));
  el.querySelectorAll('#eyeChips button').forEach(b => b.onclick = () => act('eye-' + b.dataset.k));
  el.querySelectorAll('#objChips button').forEach(b => b.onclick = () => act('ob-' + b.dataset.k));
  el.querySelectorAll('#bedChips button').forEach(b => b.onclick = () => { S.bed = +b.dataset.v; renderTools(); update(); });
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (s, fn) => el.querySelectorAll(s).forEach(b => b.setAttribute('aria-pressed', fn(b)));
  if (m.kind === 'arc') {
    set('#inVO', S.v + ' м/с'); val('#inV', S.v); set('#inLenO', ru(S.len, 1) + ' м'); val('#inLen', S.len);
    set('#r1', ru(m.tc, 1) + ' мс'); set('#r2', ru(m.ts, 1) + ' мс'); set('#r3', ru(m.t, 1) + ' мс');
    press('#slChips button', b => +b.dataset.i === S.cur);
    press('#apChips button', b => S.cur >= 0 && S.lab[S.cur] === b.dataset.k);
  } else if (m.kind === 'brain') {
    set('#inMassO', S.mass + ' кг'); val('#inMass', S.mass); set('#inKcalO', S.kcal + ' ккал'); val('#inKcal', S.kcal);
    set('#r1', ru(m.pct, 1) + ' %'); set('#r2', '≈ ' + Math.round(m.W) + ' Вт'); set('#r3', `${m.solved} из 6`);
    press('#brChips button', b => b.dataset.k === S.part);
    el.querySelectorAll('#namesBtn').forEach(b => b.setAttribute('aria-pressed', S.names));
  } else if (m.kind === 'sense') {
    press('#modeChips button', b => b.dataset.k === S.mode);
    if (S.mode === 'eye') {
      const o = m.o;
      press('#eyeChips button', b => b.dataset.k === S.eye); press('#objChips button', b => b.dataset.k === S.obj);
      set('#inAccO', '+' + ru(S.acc, 1)); val('#inAcc', S.acc); set('#inGlO', S.gl ? sg(S.gl) : 'без очков'); val('#inGl', S.gl);
      set('#r1', ru(o.P, 1) + ' дптр'); set('#r2', ru(o.need, 1) + ' дптр'); set('#r3', o.sharp ? 'чётко' : 'размыто');
    } else {
      set('#inFqO', hz(S.fq)); val('#inFq', Math.log10(S.fq));
      set('#r1', hz(S.fq)); set('#r2', ru(m.pos * 35, 1) + ' мм'); set('#r3', 340 / S.fq >= 1 ? ru(340 / S.fq, 2) + ' м' : Math.round(34000 / S.fq) + ' см');
    }
  } else {
    set('#inSleepO', ru(S.sleep, 1) + ' ч'); val('#inSleep', S.sleep);
    press('#bedChips button', b => +b.dataset.v === S.bed);
    [0, 1, 2].forEach(i => { set(`#inRep${i}O`, S.reps[i] !== undefined ? 'день ' + ru(S.reps[i], 2) : 'нет'); if (S.reps[i] !== undefined) val('#inRep' + i, S.reps[i]); });
    set('#r1', clock(m.wake)); set('#r2', ru(S.sleep / 1.5, 1)); set('#r3', Math.round(m.R7 * 100) + ' %');
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${{ arc: 'Дуга и нейрон', brain: 'Отделы мозга', sense: S.mode === 'eye' ? 'Строение глаза' : 'Строение уха', sleep: 'Что на графиках' }[L.id]}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'arc') h += `<h3>Два вида рефлексов</h3><div class="feat"><div style="border-left-color:#86e0a8"><b>Безусловные</b>Врождённые, одинаковые у всех людей: отдёргивание руки, коленный, мигательный, сосательный.</div><div style="border-left-color:#72d4e8"><b>Условные</b>Вырабатываются в течение жизни при участии коры (опыты И. П. Павлова): слюна при запахе любимой еды, реакция на школьный звонок.</div></div>`;
    if (L.id === 'sleep') h += `<h3>Виды памяти</h3><div class="feat"><div style="border-left-color:#ffb547"><b>Кратковременная</b>Секунды—минуты, около 7 ± 2 элементов (номер телефона, который сейчас набираете).</div><div style="border-left-color:#86e0a8"><b>Долговременная</b>Годы. Перенос туда идёт при повторении и во сне.</div></div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      S.hl = { id: b.dataset.id, t: performance.now() };
      if (L.id === 'brain' && BR[b.dataset.id]) S.part = b.dataset.id;
      dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'arc') {
    let h = `<h2>Сколько длится рефлекс</h2><div class="formula">t = L ÷ v + n · 0,5 мс</div><div class="steps">` +
      step('Путь импульса L', ru(S.len, 1) + ' м') + step('Скорость v', S.v + ' м/с') +
      step('Проведение по нервам', `${ru(S.len, 1)} ÷ ${S.v} = ${ru(m.tc / 1000, 4)} с = ${ru(m.tc, 1)} мс`) +
      step('Синапсов n', '3 (чувств. → вставочн. → двигат. → мышца)') + step('Задержка в синапсах', `3 × 0,5 = ${ru(m.ts, 1)} мс`) +
      step('Рефлекс до начала сокращения', `≈ ${ru(m.t, 1)} мс`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:8px">Толстые аксоны в миелине проводят импульс со скоростью до 120 м/с, тонкие без миелина — 0,5–2 м/с. Попробуйте поставить 1 м/с.</p>`;
    h += `<h3>Сравним с осознанной реакцией</h3><div class="steps">` + step('Рефлекс через спинной мозг', `≈ ${Math.round(m.t)} мс`) + step('Увидел — решил — нажал', '≈ 200–250 мс') + step('Почему медленнее', 'много синапсов в коре', 'sum') + `</div>`;
    h += `<h3>Ваши ответы</h3><div class="steps">` + LETTERS.map(([l, i]) => step(`Метка ${l}`, S.lab[i] ? AP[S.lab[i]].name : '—')).join('') +
      step('Проверка', S.fired ? 'дуга замкнута ✓' : S.fire && !S.fire.run && !S.fire.ok ? `обрыв у метки ${SLOTS[S.fire.bad].L}` : 'нажмите «Коснуться огня»', 'sum') + `</div>`;
    return h;
  }
  if (id === 'brain') {
    const E = S.kcal * 4186, W = m.W;
    return `<h2>Мозг: 2 % массы, 20 % энергии</h2><div class="steps">` +
      step('Масса мозга', '≈ 1,35 кг') + step('Масса тела', S.mass + ' кг') + step('Доля мозга', `1,35 ÷ ${S.mass} × 100 % ≈ ${ru(m.pct, 1)} %`) + `</div>` +
      `<h3>Мощность мозга</h3><div class="formula">P = 0,2 · E ÷ t</div><div class="steps">` +
      step('Энергия за сутки E', `${S.kcal} ккал = ${S.kcal} × 4186 ≈ ${ru(E / 1e6, 1)} МДж`) + step('Мозгу ≈ 20 %', `≈ ${ru(E * 0.2 / 1e6, 2)} МДж`) +
      step('Секунд в сутках t', '86 400 с') + step('Мощность', `≈ ${Math.round(W)} Вт`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Это как неяркая лампочка — и так круглые сутки, даже во сне. Нейронов в мозге около 86 млрд, у каждого — тысячи синапсов.</p>` +
      `<h3>Ход решения</h3><div class="steps">` + SIT.map((s, i) => step(`${i + 1}. ${s.a} ${s.b}`, i < S.q ? BR[s.r].name : '?')).join('') + step('Ошибок', String(S.miss), 'sum') + `</div>`;
  }
  if (id === 'sense') {
    let h = '';
    if (S.mode === 'eye') {
      const o = m.o;
      h += `<h2>Где получится изображение</h2><div class="formula">1/d + 1/f = D</div><div class="steps">` +
        step('Расстояние до предмета d', o.O.d < 1 ? `${o.O.d * 100} см = ${o.O.d} м` : `${o.O.d} м`) + step('1/d', `${ru(1 / o.O.d, 2)} дптр`) +
        step('Глубина глаза f (до сетчатки)', `${ru(o.dr, 1)} мм → 1/f = ${o.E.inv} дптр`) + step('Нужная сила D', `${ru(1 / o.O.d, 2)} + ${o.E.inv} = ${ru(o.need, 2)} дптр`) + `</div>` +
        `<h3>Что есть сейчас</h3><div class="steps">` + step('Глаз в покое', '60 дптр') + step('Аккомодация', '+' + ru(S.acc, 1) + ' дптр') + step('Очки', (S.gl ? sg(S.gl) : '0') + ' дптр') +
        step('Сумма', `${ru(o.P, 1)} дптр`) + step('Разница с нужной', `${o.mis >= 0 ? '+' : '−'}${ru(Math.abs(o.mis), 2)} дптр`) +
        step('Итог', o.sharp ? 'чётко (разница ≤ 0,3)' : o.mis > 0 ? 'фокус перед сетчаткой' : 'фокус за сетчаткой', 'sum') + `</div>` +
        `<p class="note" style="margin-top:8px">Модель упрощённая: глаз считаем одной линзой. ${EYES[S.eye].name}: ${EYES[S.eye].about}. Хрусталик может добавить только плюс, поэтому избыток силы глаза убирают минусовыми очками.</p>`;
    } else {
      h += `<h2>Звук ${hz(S.fq)}</h2><div class="formula">λ = v ÷ ν</div><div class="steps">` +
        step('Скорость звука в воздухе v', '340 м/с') + step('Частота ν', `${Math.round(S.fq)} Гц`) + step('Длина волны', `340 ÷ ${Math.round(S.fq)} ≈ ${ru(340 / S.fq, 3)} м`) + `</div>` +
        `<h3>Место в улитке</h3><div class="steps">` + step('Длина улитки', '≈ 35 мм') + step('Пик колебаний от начала', `≈ ${ru(m.pos * 35, 1)} мм`) +
        step('Отмеченное место', `≈ ${ru(TPOS * 35, 1)} мм`) + step('Попадание', m.earNow ? 'да ✓' : 'нет', 'sum') + `</div>` +
        `<p class="note" style="margin-top:8px">Человек слышит примерно от 20 Гц до 20 кГц. С возрастом и от громкой музыки первыми гибнут клетки в начале улитки — пропадают высокие звуки.</p>`;
    }
    h += `<h3>Опыты урока</h3><div class="steps">` + step('1. Книга в здоровом глазу', m.near ? 'резко ✓' : '—') + step('2. Очки близорукому', m.myo ? 'вывеска видна ✓' : '—') + step('3. Место в улитке', m.ear ? 'найдено ✓' : '—') + `</div>`;
    return h;
  }
  const M = m.M;
  let h = `<h2>Ночь</h2><div class="steps">` + step('Отбой', clock(S.bed)) + step('Сон', ru(S.sleep, 1) + ' ч') + step('Подъём', `${clock(m.wake)}${m.wakeOk ? '' : ' — опоздание!'}`) +
    step('Циклов по 90 мин', `${S.sleep * 60} ÷ 90 ≈ ${ru(S.sleep / 1.5, 1)}`) + step('Проснулись в фазе', STN[m.wst]) + step('Коэффициент сна k', ru(M.q, 2), 'sum') + `</div>`;
  h += `<h3>Память</h3><div class="formula">R = e^(−t / S)</div><div class="steps">` + step('Начальная прочность S', `1 сут × k = ${ru(M.q, 2)}`);
  M.steps.forEach((s, i) => { h += step(`Повтор ${i + 1}, день ${ru(s.d, 2)}`, `помнили ${Math.round(s.R * 100)} % → S = ${ru(s.S0, 2)} × (1,5 + 2 × ${ru(1 - s.R, 2)}) × k = ${ru(s.S, 2)}`); });
  const last = M.seg[M.seg.length - 1];
  h += step('К контрольной (день 7)', `e^(−${ru(7 - last.t0, 2)} / ${ru(last.S, 2)}) = ${Math.round(M.R7 * 100)} %`, 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:8px">Модель упрощённая, но главное в ней верно: прочность растёт сильнее, если повторить, когда уже немного забылось, а недосып ослабляет запоминание.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'arc') {
    el.innerHTML = `<div class="k">Рефлекторная дуга</div><div class="v ${S.done.arc ? 'ok' : ''}">${m.placed} / 5</div>
      <div class="gauge"><b style="width:${(m.placed / 5 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>импульс</span><span>${S.fire && S.fire.run ? 'бежит' : m.fired ? 'дошёл' : S.fire ? 'обрыв' : '—'}</span></div><div class="lr"><span>время</span><span>${ru(m.t, 1)} мс</span></div>`;
  } else if (m.kind === 'brain') {
    el.innerHTML = `<div class="k">Ситуации</div><div class="v ${S.done.brain ? 'ok' : ''}">${m.solved} / 6</div>
      <div class="gauge"><b style="width:${(m.solved / 6 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>ошибок</span><span>${m.miss}</span></div><div class="lr"><span>мозг</span><span>≈ ${Math.round(m.W)} Вт</span></div>`;
  } else if (m.kind === 'sense') {
    if (S.mode === 'eye') { const o = m.o; el.innerHTML = `<div class="k">${EYES[S.eye].name}</div><div class="v ${o.sharp ? 'ok' : 'bad'}">${o.sharp ? 'чётко' : 'размыто'}</div><div class="lr"><span>сила</span><span>${ru(o.P, 1)} дптр</span></div><div class="lr"><span>нужно</span><span>${ru(o.need, 1)}</span></div><div class="lr"><span>опыты</span><span>${m.near ? '✓' : '·'} ${m.myo ? '✓' : '·'} ${m.ear ? '✓' : '·'}</span></div>`; }
    else el.innerHTML = `<div class="k">Звук</div><div class="v ${m.earNow ? 'ok' : ''}">${hz(S.fq)}</div><div class="lr"><span>пик</span><span>${ru(m.pos * 35, 1)} мм</span></div><div class="lr"><span>опыты</span><span>${m.near ? '✓' : '·'} ${m.myo ? '✓' : '·'} ${m.ear ? '✓' : '·'}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">К контрольной</div><div class="v ${m.R7 >= 0.8 ? 'ok' : 'bad'}">${Math.round(m.R7 * 100)} %</div>
      <div class="gauge"><b style="width:${(m.R7 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>сон</span><span>${ru(m.h, 1)} ч</span></div><div class="lr"><span>подъём</span><span>${clock(m.wake)}</span></div><div class="lr"><span>повторов</span><span>${S.reps.length}</span></div>`;
  }
}

function update() {
  let m = model(); const L = LESSONS[S.lesson];
  if (m.kind === 'sense') {
    const was = { ...S.got };
    if (m.nearNow) S.got.near = true; if (m.myoNow) S.got.myo = true; if (m.earNow) S.got.ear = true;
    if (!S.done.sense) {
      if (S.got.near && !was.near) toast('Опыт 1 готов: хрусталик стал выпуклее, книга в фокусе.');
      else if (S.got.myo && !was.myo) toast('Опыт 2 готов: минусовые очки сдвинули фокус на сетчатку.');
      else if (S.got.ear && !was.ear) toast('Опыт 3 готов: это место улитки отвечает примерно на 1000 Гц.');
    }
  }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как работают мозг и чувства!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  arc: '<path d="M6 22L20 12L34 8L46 14L44 22L30 26L14 26" stroke="#c9d3e6" stroke-width="1.6" fill="none"/><circle cx="6" cy="22" r="3" fill="#ffb547"/><circle cx="34" cy="8" r="3" fill="#72d4e8"/><ellipse cx="50" cy="17" rx="10" ry="9" fill="#e9e1d4"/><circle cx="14" cy="26" r="3" fill="#ff8a73"/>',
  brain: '<path d="M14 18C12 10 20 5 32 5C46 5 54 10 54 18C54 24 48 26 40 25C34 27 24 27 18 24C15 22 14 20 14 18Z" fill="#d9a3a8"/><path d="M30 5L32 18M18 21L32 18L44 16" stroke="#7d5054" stroke-width="1.2" fill="none"/><ellipse cx="46" cy="25" rx="7" ry="3.5" fill="#ff8a73"/>',
  sense: '<ellipse cx="22" cy="15" rx="12" ry="10" fill="#f1ece4"/><ellipse cx="13" cy="15" rx="2" ry="6" fill="#e8ecf4" stroke="#56627d"/><path d="M33 9a12 10 0 0 1 0 12" stroke="#e0555d" stroke-width="2" fill="none"/><path d="M42 15h20" stroke="#3a4762" stroke-width="7"/><path d="M42 15q4 -4 8 0t8 0" stroke="#ffb547" stroke-width="1.4" fill="none"/>',
  sleep: '<path d="M4 6H10V12H14V20H24V12H30V6H34V14H40V20H48V8H56V6" stroke="#72d4e8" stroke-width="1.4" fill="none"/><path d="M4 28Q16 18 22 22T40 26Q48 26 62 24" stroke="#ffb547" stroke-width="1.4" fill="none"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'arc') {
    now = `Схема: рука над пламенем свечи, нервы идут к спинному мозгу в разрезе (серое вещество-бабочка внутри, белое снаружи). На дуге 5 меток с буквами: ` +
      SLOTS.map((s, i) => `метка ${s.L} — ${s.where}; ответ ученика: ${S.lab[i] ? AP[S.lab[i]].name.toLowerCase() : 'нет'}`).join('; ') +
      `. Названо ${m.placed} из 5. Импульс: ${S.fire && S.fire.run ? 'бежит по дуге' : m.fired ? 'прошёл всю дугу, рука отдёрнута' : S.fire ? 'оборвался у метки ' + SLOTS[S.fire.bad].L : 'ещё не запускали'}. Расчёт: путь ${ru(S.len, 1)} м, скорость ${S.v} м/с, время рефлекса ≈ ${ru(m.t, 1)} мс. Внизу нарисован нейрон: дендриты, тело, аксон в миелине, синапс.`;
    guide = 'Не называй, какое звено стоит у каждой буквы. Спрашивай, где лежит тело чувствительного нейрона, что находится в сером веществе, куда идёт отросток из передних рогов.';
  }
  if (id === 'brain') {
    now = `Схема головного мозга сбоку (лоб слева): лобная, теменная, височная, затылочная доли, мозжечок, ствол с продолговатым мозгом. Подписи ${S.names ? 'включены' : 'выключены'}. ` +
      (S.q < SIT.length ? `Сейчас ситуация ${S.q + 1} из 6: «${SIT[S.q].a} ${SIT[S.q].b}».` : 'Все 6 ситуаций разобраны.') + ` Разобрано ${S.q}, ошибок ${S.miss}. Расчёт: масса тела ${S.mass} кг, мозг ≈ ${ru(m.pct, 1)} % массы, мощность ≈ ${Math.round(m.W)} Вт при ${S.kcal} ккал в сутки.`;
    guide = 'Не называй отдел для текущей ситуации. Спрашивай, какое чувство или действие тут главное и какая зона коры (или не кора) за него отвечает.';
  }
  if (id === 'sense') {
    const o = m.o;
    now = S.mode === 'eye' ? `Режим «Глаз»: ${EYES[S.eye].name.toLowerCase()} (${EYES[S.eye].about}). Предмет: ${OBJS[S.obj].name.toLowerCase()} на ${S.obj === 'book' ? '25 см' : '6 м'}. Аккомодация хрусталика +${ru(S.acc, 1)} дптр, очки ${S.gl ? sg(S.gl) + ' дптр' : 'нет'}. Сила глаза ${ru(o.P, 1)} дптр, нужно ${ru(o.need, 2)} дптр, изображение ${o.sharp ? 'на сетчатке, чётко' : o.mis > 0 ? 'перед сетчаткой, размыто' : 'за сетчаткой, размыто'}.`
      : `Режим «Ухо»: наружное ухо, перепонка, косточки, развёрнутая улитка. Звук ${hz(S.fq)}, пик колебаний в ${ru(m.pos * 35, 1)} мм от начала улитки, отмеченное место — в ${ru(TPOS * 35, 1)} мм (${m.earNow ? 'попали' : 'не попали'}).`;
    now += ` Опыты: книга в здоровом глазу — ${m.near ? 'готово' : 'нет'}, очки близорукому для вывески — ${m.myo ? 'готово' : 'нет'}, место в улитке — ${m.ear ? 'готово' : 'нет'}.`;
    guide = 'Не называй готовые числа (сколько дптр или герц). Спрашивай: каким должен стать хрусталик для близкого предмета, где фокус у близорукого, какие звуки ловит начало и верхушка улитки.';
  }
  if (id === 'sleep') {
    const M = m.M;
    now = `Сверху гипнограмма ночи: отбой ${clock(S.bed)}, сон ${ru(S.sleep, 1)} ч, подъём ${clock(m.wake)} (${m.wakeOk ? 'успевает к 7:00' : 'позже 7:00'}), проснулся в фазе «${STN[m.wst]}», циклов ≈ ${ru(S.sleep / 1.5, 1)}. Снизу кривая забывания за 7 дней до контрольной. Повторения: ${M.reps.length ? M.reps.map(r => 'день ' + ru(r, 2)).join(', ') : 'нет'}. К контрольной помнит ${Math.round(M.R7 * 100)} % (нужно ≥ 80 %), коэффициент сна ${ru(M.q, 2)}.`;
    guide = 'Не называй готовые дни повторений. Спрашивай, когда забывание самое быстрое и почему повторения в один вечер слабее, чем через растущие промежутки. Напомни про норму сна подростка.';
  }
  return [
    `Раздел: биология, 9 класс, тема «Мозг и чувства» (Человек). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { arc: 'Почему рука отдёргивается раньше, чем становится больно?', brain: 'Почему при травме левого полушария слабеет правая рука?', sense: 'Почему близоруким нужны минусовые очки?', sleep: 'Зачем повторять через растущие промежутки?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
