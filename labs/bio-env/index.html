<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8 класс: факторы среды и закон оптимума, приспособления организмов к среде, суточные и сезонные биоритмы.">
<title>Организм и среда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="#ffd36b"/><path d="M13 4v3M13 19v3M4 13h3M19 13h3" stroke="#ffd36b" stroke-width="1.6"/><path d="M7 33Q14 24 22 28T34 26V33Z" fill="rgba(95,191,106,.4)" stroke="var(--leaf)" stroke-width="1.2"/><path d="M28 9v13" stroke="var(--warn)" stroke-width="2.4" stroke-linecap="round"/><circle cx="28" cy="23" r="3" fill="var(--warn)"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Биология · Организм и среда</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Среда</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-env';
const mix = (a, b, k) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(k, 0, 1)).toString(16).padStart(2, '0')).join(''); };
const T = (x, y, s, size, fill, extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const fc = x => f(x).replace('.', ',');

// ---------- biology data ----------
// Lesson 1: factors acting on a saiga, and the law of optimum for spring wheat
const FG = {
  abio: { name: 'Абиотические', c: '#72d4e8', feat: 'Неживая природа: свет, температура, вода, соли в почве, ветер, снег.' },
  bio: { name: 'Биотические', c: '#86e0a8', feat: 'Влияние других живых организмов: хищников, паразитов, возбудителей болезней, конкурентов.' },
  anth: { name: 'Антропогенные', c: '#ffb547', feat: 'Деятельность человека: распашка, охота, дороги и заборы, загрязнение.' },
};
const FGK = ['abio', 'bio', 'anth'];
const FACT = [
  { name: 'Джут: лёд на снегу', ans: 'abio', d: 'ледяная корка закрывает траву, сайгаки голодают' },
  { name: 'Волки', ans: 'bio', d: 'хищники ловят слабых и молодых сайгаков' },
  { name: 'Браконьеры', ans: 'anth', d: 'незаконная охота ради рогов самцов' },
  { name: 'Летняя засуха', ans: 'abio', d: 'трава выгорает, водопои пересыхают' },
  { name: 'Бактерии-возбудители', ans: 'bio', d: 'вызывают болезни и массовый падёж' },
  { name: 'Распашка степи', ans: 'anth', d: 'пастбища превращают в поля' },
  { name: 'Жара +45 °C', ans: 'abio', d: 'перегрев днём, животные ищут тень и отдыхают' },
  { name: 'Клещи и оводы', ans: 'bio', d: 'паразиты сосут кровь и ослабляют животных' },
  { name: 'Заборы вдоль дорог', ans: 'anth', d: 'перегораживают пути сезонных кочёвок' },
];
// tolerance curves of spring wheat (model numbers, rounded)
const fTf = t => t <= 4 || t >= 38 ? 0 : t < 18 ? (t - 4) / 14 * 100 : t <= 25 ? 100 : (38 - t) / 13 * 100;
const fWf = w => w <= 25 ? 0 : w < 60 ? (w - 25) / 35 * 100 : w <= 80 ? 100 : 100 - (w - 80) / 20 * 70;
// Lesson 2: a fox for the desert and for the tundra
const HAB = {
  desert: { name: 'Пустыня', sub: 'днём до +45 °C, горячий песок', c: '#e0b26b' },
  tundra: { name: 'Тундра', sub: 'зимой до −40 °C, снег полгода', c: '#bcd8ee' },
};
const HABK = ['desert', 'tundra'];
const TR = {
  ears: { name: 'Уши', opts: [['big', 'Большие'], ['mid', 'Средние'], ['small', 'Маленькие']], best: { desert: 'big', tundra: 'small' },
    why: { desert: 'большие уши с сетью сосудов отдают лишнее тепло', tundra: 'маленькие уши меньше теряют тепла и не обмораживаются' } },
  fur: { name: 'Мех', opts: [['thin', 'Короткий'], ['thick', 'Густой']], best: { desert: 'thin', tundra: 'thick' },
    why: { desert: 'короткий мех не мешает остывать', tundra: 'густой мех с подшёрстком держит тёплый воздух' } },
  col: { name: 'Окраска', opts: [['sand', 'Песочная'], ['white', 'Белая'], ['red', 'Рыжая']], best: { desert: 'sand', tundra: 'white' },
    why: { desert: 'песочный цвет сливается с песком', tundra: 'зимой белый цвет не виден на снегу' } },
  paw: { name: 'Подошвы', opts: [['bare', 'Голые'], ['furry', 'В шерсти']], best: { desert: 'furry', tundra: 'furry' },
    why: { desert: 'шерсть на подошвах спасает от горячего песка', tundra: 'шерсть на подошвах греет и не даёт скользить' } },
};
const TRK = ['ears', 'fur', 'col', 'paw'];
const START_FOX = { ears: 'mid', fur: 'thin', col: 'red', paw: 'bare' };
const FOXC = { sand: '#d9b77a', white: '#eef3f8', red: '#d9692e' };
// Lesson 3: who is active when; day length in Astana
const ORGS = [

const MDAY = [15, 46, 74, 105, 135, 166, 196, 227, 258, 288, 319, 349];
const LAT = 51.17;
const RAD = Math.PI / 180;
const decl = mi => 23.44 * Math.sin(2 * Math.PI * (284 + MDAY[mi]) / 365);
function cosHour(mi) { const d = decl(mi) * RAD, p = LAT * RAD; return (Math.sin(-0.833 * RAD) - Math.sin(p) * Math.sin(d)) / (Math.cos(p) * Math.cos(d)); }
const dayLen = mi => 2 * Math.acos(clamp(cosHour(mi), -1, 1)) / RAD / 15;

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  const L = LESSONS[S.lesson];
  S.mode = L.mode || '';
  S.bin = Array(FACT.length).fill(-1); S.csel = -1; S.look = -1;
  S.temp = L.temp || 30; S.wet = L.wet || 35;
  S.hab = 'desert'; S.tr = { desert: Object.assign({}, START_FOX), tundra: Object.assign({}, START_FOX) };
  S.hour = L.hour || 13; S.mark = Array(ORGS.length).fill(null); S.osel = -1;
  S.month = L.month === undefined ? 6 : L.month; S.lamp = L.lamp || 0;
}

// ---------- models ----------
const isOn = (o, h) => o.act.some(([a, b]) => h >= a && h < b);
function foxFit(h) { return TRK.filter(k => S.tr[h][k] === TR[k].best[h]).length; }
function heatState(h) {
  const t = S.tr[h], loss = { big: 2, mid: 1, small: 0 }[t.ears] + (t.fur === 'thin' ? 1 : 0);
  if (h === 'desert') return loss === 3 ? { ok: true, s: 'тепло в норме' } : { ok: false, s: loss === 2 ? 'слегка перегревается' : 'перегрев' };
  return loss === 0 ? { ok: true, s: 'тепло в норме' } : { ok: false, s: loss === 1 ? 'зябнет' : 'замерзает' };
}
function model() {
  const id = LID();
  if (id === 'factors') {
    let n = 0, r = 0; S.bin.forEach((b, i) => { if (b >= 0) { n++; if (FGK[b] === FACT[i].ans) r++; } });
    const fT = Math.round(fTf(S.temp)), fW = Math.round(fWf(S.wet)), V = Math.min(fT, fW);
    return { kind: 'factors', placed: n, right: r, fT, fW, V, lim: fT < fW ? 'temp' : fW < fT ? 'wet' : 'both' };
  }
  if (id === 'adapt') {
    const h = S.hab;
    return { kind: 'adapt', fitD: foxFit('desert'), fitT: foxFit('tundra'), fit: foxFit(h), heat: heatState(h), camo: S.tr[h].col === TR.col.best[h], paw: S.tr[h].paw === 'furry' };
  }
  let n = 0, r = 0; S.mark.forEach((k, i) => { if (k) { n++; if (k === ORGS[i].ans) r++; } });
  const nat = dayLen(S.month), total = Math.min(24, nat + S.lamp);
  const birch = total >= 14 ? 'grow' : total >= 12 ? 'yellow' : 'bare';
  const eggs = Math.round(6 * clamp((total - 9) / 5, 0, 1));
  return { kind: 'rhythm', placed: n, right: r, hour: S.hour, awake: ORGS.filter(o => isOn(o, S.hour)).length, month: S.month, nat, total, birch, eggs };
}

// ---------- lesson 1 actions ----------
function drop(c, b) {
  if (b < 0) { S.csel = -1; dirty = true; return; }
  S.bin[c] = b; S.csel = -1; S.look = c;
  const m = model();
  if (m.placed === FACT.length && m.right < FACT.length) toast(`Все факторы разложены. Верно ${m.right} из 9 — красные переложите.`);
  update();
}
function unplace(c) { S.bin[c] = -1; S.look = c; update(); }
function setTemp(v) { S.temp = clamp(Math.round(v), -5, 45); update(); }
function setWet(v) { S.wet = clamp(Math.round(v / 5) * 5, 0, 100); update(); }
function setMode(md) { S.mode = md; S.csel = -1; renderTools(); buildScheme(); update(); }

// ---------- lesson 2 actions ----------
function setHab(h) { S.hab = h; renderTools(); buildScheme(); update(); }
function setTrait(k, v) {
  S.tr[S.hab][k] = v;
  const m = model();
  if (m.fit === 4 && !(m.fitD === 4 && m.fitT === 4)) toast(`Лиса для среды «${HAB[S.hab].name}» готова. Теперь соберите лису для другой среды.`);
  update();
}
function cycleTrait(k) { const o = TR[k].opts.map(x => x[0]), i = o.indexOf(S.tr[S.hab][k]); setTrait(k, o[(i + 1) % o.length]); }

// ---------- lesson 3 actions ----------
function setHour(h) { S.hour = ((Math.round(h * 2) / 2) % 24 + 24) % 24; update(); }
function markOrg(i, v) {
  S.mark[i] = v; S.osel = i;
  const m = model();
  if (m.placed === ORGS.length && m.right < ORGS.length) toast(`Все отмечены. Верно ${m.right} из 6 — проверьте красные, покрутив часы.`);
  update();
}
function cycleMark(i) { const v = S.mark[i]; markOrg(i, v === null ? 'day' : v === 'day' ? 'night' : null); }
function setMonth(mi) {
  const old = S.month; S.month = clamp(Math.round(mi), 0, 11);
  if (S.month !== old) { const m = model(); if (m.birch === 'bare' && S.lamp === 0 && S.month >= 8) toast(`${MONF[S.month][0].toUpperCase() + MONF[S.month].slice(1)}: день ${fc(m.nat)} ч — берёза сбросила листья, хотя в теплице тепло.`); }
  update();
}
function setLamp(v) { S.lamp = clamp(Math.round(v), 0, 10); update(); }

// ---------- drawing helpers ----------
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}
const panel = (x, y, w, h, stroke) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="rgba(18,26,40,.88)" stroke="${stroke || '#26324a'}" stroke-width="1.4"/>`;

// ---------- lesson 1 scene A: sorting factors ----------
const CW = 164, CH = 34, BW = 164, BH = 148;
const homeXY = c => [8 + (c % 3) * 170, 114 + Math.floor(c / 3) * 42];
const binXY = b => [8 + b * 170, 252];
function cardSVG(c, x, y, sel) {
  return `<g data-drag="c${c}" transform="translate(${f(x)} ${f(y)})"><rect width="${CW}" height="${CH}" rx="9" fill="#1a2438" stroke="${sel ? '#ffb547' : '#56627d'}" stroke-width="${sel ? 2.4 : 1.4}"/>` +
    `<text class="lbl" x="${CW / 2}" y="${CH / 2 + 4}" font-size="11.5" font-weight="600" fill="#e8ecf4" text-anchor="middle">${FACT[c].name}</text></g>`;
}
function sortScene() {
  let h = bench();
  const full = S.bin.every(b => b >= 0);
  h += T(260, 104, 'Сайгак в степи Казахстана. Что на него влияет?', 11.5, '#8b96ad', 'text-anchor="middle"');
  for (let c = 0; c < FACT.length; c++) { const [x, y] = homeXY(c); h += `<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="9" fill="rgba(160,185,230,.03)" stroke="#26324a" stroke-dasharray="4 3"/>`; }
  FGK.forEach((k, b) => {
    const [x, y] = binXY(b), G = FG[k];
    h += `<g data-hit="bin${b}"><rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="10" fill="rgba(26,36,56,.85)" stroke="${G.c}" stroke-width="1.6"/>`;
    h += `<rect x="${x}" y="${y}" width="${BW}" height="22" rx="10" fill="${G.c}" opacity=".18"/><text class="lbl" x="${x + BW / 2}" y="${y + 15}" font-size="11" font-weight="600" fill="${G.c}" text-anchor="middle">${G.name}</text></g>`;
    const inBin = FACT.map((_, c) => c).filter(c => S.bin[c] === b && !(drag && drag.kind === 'c' + c && drag.moved));
    const st = inBin.length > 5 ? Math.min(24, (BH - 30) / inBin.length) : 24;
    inBin.forEach((c, j) => {
      const yy = y + 28 + j * st, ok = FGK[b] === FACT[c].ans, ch = st - 3, fs = Math.min(10.5, ch * .62);
      h += `<g data-hit="ret${c}"><rect x="${x + 6}" y="${f(yy)}" width="${BW - 12}" height="${f(ch)}" rx="5" fill="#121a28" stroke="${full ? (ok ? '#86e0a8' : '#ff8a73') : '#3a4762'}" stroke-width="1.2"/>`;
      h += `<text class="lbl" x="${x + 12}" y="${f(yy + ch / 2 + fs * .36)}" font-size="${f(fs)}" fill="#e8ecf4">${FACT[c].name}</text>`;
      if (full) h += `<text x="${x + BW - 16}" y="${f(yy + ch / 2 + fs * .38)}" font-size="${f(fs + 1)}" fill="${ok ? '#86e0a8' : '#ff8a73'}" text-anchor="middle">${ok ? '✓' : '✗'}</text>`;
      h += `</g>`;
    });
  });
  for (let c = 0; c < FACT.length; c++) {
    if (S.bin[c] >= 0 || (drag && drag.kind === 'c' + c && drag.moved)) continue;
    const [x, y] = homeXY(c); h += cardSVG(c, x, y, S.csel === c);
  }
  if (drag && drag.kind[0] === 'c' && drag.moved) { const c = +drag.kind.slice(1); h += cardSVG(c, drag.px + drag.dx, drag.py + drag.dy, true); }
  return h;
}

// ---------- lesson 1 scene B: law of optimum ----------
const CP = { x0: 26, x1: 316 };
const CURVES = {
  T: { y0: 108, lo: -5, hi: 45, fn: fTf, name: 'Температура воздуха', unit: ' °C', ticks: [0, 10, 20, 30, 40], get: () => S.temp },
  W: { y0: 262, lo: 0, hi: 100, fn: fWf, name: 'Влажность почвы', unit: '%', ticks: [0, 20, 40, 60, 80, 100], get: () => S.wet },
};
const cx2v = (C, x) => C.lo + (x - CP.x0) / (CP.x1 - CP.x0) * (C.hi - C.lo);
const cv2x = (C, v) => CP.x0 + (v - C.lo) / (C.hi - C.lo) * (CP.x1 - CP.x0);
function curvePanel(key, lim) {
  const C = CURVES[key], y0 = C.y0, base = y0 + 118, top = y0 + 34, hgt = base - top, v = C.get(), fv = C.fn(v);
  let h = panel(8, y0, 318, 140, lim ? '#ff8a73' : '#26324a');
  h += T(18, y0 + 18, C.name, 11.5, '#e8ecf4', 'font-weight="600"') + T(316, y0 + 18, `${v}${C.unit} → ${Math.round(fv)}%`, 11.5, fv >= 90 ? '#86e0a8' : fv > 0 ? '#ffb547' : '#ff8a73', 'text-anchor="end"');
  // zone bands
  const stp = (C.hi - C.lo) / 100;
  for (let i = 0; i < 100; i++) {
    const a = C.lo + i * stp, fa = C.fn(a + stp / 2), col = fa >= 90 ? 'rgba(134,224,168,.16)' : fa > 0 ? 'rgba(255,181,71,.09)' : 'rgba(255,138,115,.09)';
    h += `<rect x="${f(cv2x(C, a))}" y="${top}" width="${f((CP.x1 - CP.x0) / 100 + .4)}" height="${hgt}" fill="${col}"/>`;
  }
  let d = '';
  for (let i = 0; i <= 200; i++) { const a = C.lo + i * (C.hi - C.lo) / 200; d += `${i ? 'L' : 'M'}${f(cv2x(C, a))} ${f(base - C.fn(a) / 100 * hgt)}`; }
  h += `<path d="M${CP.x0} ${base}H${CP.x1}" stroke="#56627d" stroke-width="1"/>`;
  C.ticks.forEach(t => { const x = cv2x(C, t); h += `<path d="M${f(x)} ${base}v4" stroke="#56627d"/>` + T(x, base + 14, String(t), 9.5, '#8b96ad', 'text-anchor="middle"'); });
  h += `<path d="${d}" stroke="#ffb547" stroke-width="2" fill="none"/>`;
  // zone labels
  const opt = key === 'T' ? [16.6, 26.3] : [56.5, 82.9];
  h += T(cv2x(C, (opt[0] + opt[1]) / 2), top - 4, 'оптимум', 9.5, '#86e0a8', 'text-anchor="middle"');
  h += T(CP.x0 + 3, top + 12, 'гибель', 9, '#ff8a73') + T(CP.x1 - 3, top + 12, key === 'T' ? 'гибель' : 'угнетение', 9, key === 'T' ? '#ff8a73' : '#ffb547', 'text-anchor="end"');
  // handle
  const hx = cv2x(C, v), hy = base - fv / 100 * hgt;
  h += `<rect data-drag="h${key}" x="${CP.x0 - 8}" y="${top - 2}" width="${CP.x1 - CP.x0 + 16}" height="${hgt + 22}" fill="transparent"/>`;
  h += `<path d="M${f(hx)} ${base}V${f(hy)}" stroke="#72d4e8" stroke-width="1.6" stroke-dasharray="3 3" pointer-events="none"/><circle cx="${f(hx)}" cy="${f(hy)}" r="4.5" fill="#72d4e8" pointer-events="none"/>`;
  h += `<g data-drag="h${key}"><circle cx="${f(hx)}" cy="${base}" r="13" fill="transparent"/><circle cx="${f(hx)}" cy="${base}" r="8" fill="#72d4e8" stroke="${INK}" stroke-width="1.5"/><path d="M${f(hx - 3)} ${base}h6" stroke="${INK}" stroke-width="1.4"/></g>`;
  return h;
}
function wheat(x, base, V) {

  if (lampOn) h += `<path d="M404 158L380 220H468L444 158Z" fill="#72d4e8" opacity="${f(.06 + S.lamp * .012)}"/>`;
  h += T(424, 172, lampOn ? `лампа ${S.lamp} ч` : 'лампа выкл.', 9.5, lampOn ? '#72d4e8' : '#8b96ad', 'text-anchor="middle"');

function hlBox(id) {
  const L = LID();
  if (L === 'factors') {
    const b = FGK.indexOf(id); if (b >= 0) { const [x, y] = binXY(b); return [x - 4, y - 4, BW + 8, BH + 8]; }
    return { cards: [4, 108, 512, 128], pT: [4, 104, 326, 148], pW: [4, 258, 326, 148], field: [332, 104, 184, 302] }[id];
  }
  if (L === 'adapt') return { ears: [FX + 22, FY - 90, 54, 60], fur: [FX - 56, FY - 30, 112, 60], col: [FX - 110, FY - 26, 70, 56], paw: [FX - 40, FY + 14, 84, 40], hab: [6, 106, 296, 298], traits: [308, 106, 206, 298], status: [12, 352, 284, 48] }[id];
  return { clock: [8, 140, 240, 250], tiles: [250, 108, 262, 296], chart: [6, 106, 324, 298], birch: [350, 180, 86, 124], hen: [432, 230, 74, 84], lamp: [396, 144, 56, 34] }[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = id === 'factors' ? (S.mode === 'opt' ? optScene() : sortScene()) : id === 'adapt' ? adaptScene() : S.mode === 'year' ? yearScene() : clockScene();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) { S.hl = null; dirty = true; }
    else if (b) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 524, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true; placeHint();
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer: taps and dragging ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const binAt = p => { for (let b = 0; b < 3; b++) { const [x, y] = binXY(b); if (p.x > x - 4 && p.x < x + BW + 4 && p.y > y - 10 && p.y < y + BH + 6) return b; } return -1; };
function dragSet(kind, p) {
  if (kind === 'hT') setTemp(cx2v(CURVES.T, p.x));
  else if (kind === 'hW') setWet(cx2v(CURVES.W, p.x));
  else if (kind === 'hand') { let a = Math.atan2(p.x - CC[0], -(p.y - CC[1])); if (a < 0) a += 2 * Math.PI; setHour(a / (2 * Math.PI) * 24); }
  else if (kind === 'mon') setMonth((p.x - YC.x0) / (YC.x1 - YC.x0) * 12 - .5);
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag) {
    const kind = el.dataset.drag;
    drag = { kind, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false, dx: -CW / 2, dy: -CH / 2 };
    if (kind[0] === 'c') { const c = +kind.slice(1); const [x, y] = homeXY(c); drag.dx = x - p.x; drag.dy = y - p.y; }
    else dragSet(kind, p);
    scene.classList.add('grabbing');
  } else drag = { kind: 'hit', hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.kind === 'hit' || !drag.moved) return;
  const p = toSvg(e); drag.px = p.x; drag.py = p.y; dirty = true;
  if (drag.kind[0] !== 'c') dragSet(drag.kind, p);
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) { dirty = true; return; }
  const k = d.kind;
  if (k[0] === 'c') {
    const c = +k.slice(1);
    if (!d.moved) { S.csel = S.csel === c ? -1 : c; S.look = c; update(); return; }
    drop(c, binAt({ x: d.px, y: d.py }));
    return;
  }
  if (k !== 'hit') return;
  if (d.moved) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'factors') {
    if (id.startsWith('bin')) { if (S.csel >= 0) drop(S.csel, +id.slice(3)); else toast('Сначала нажмите на карточку с фактором, потом на коробку.'); }
    else if (id.startsWith('ret')) unplace(+id.slice(3));
    else if (id === 'field') toast(model().V >= 90 ? 'Пшеница в оптимуме по обоим факторам.' : 'Рост задаёт худший из факторов. Найдите, какая кривая ниже.');
  }
  if (L === 'adapt') {
    if (id.startsWith('hab-')) setHab(id.slice(4));
    else if (id.startsWith('tr-')) { const [, k, v] = id.split('-'); setTrait(k, v); }
    else if (id.startsWith('fx-')) cycleTrait({ 'fx-ears': 'ears', 'fx-fur': 'fur', 'fx-col': 'col', 'fx-paw': 'paw' }[id]);
  }
  if (L === 'rhythm') {
    if (id.startsWith('org')) { const i = +id.slice(3); cycleMark(i); }
    else if (id === 'house') toast('Свет в теплице = естественный день + лампа. Тепло здесь всегда.');
  }
}

function loop(t) {

function updateScheme(m) {

  el.querySelectorAll('#mChips button').forEach(b => b.setAttribute('aria-pressed', S.mode === b.dataset.k));

      const bl = el.querySelector('#binList');
      if (bl) bl.innerHTML = FGK.map((k, b) => step(FG[k].name, FACT.filter((_, c) => S.bin[c] === b).map(x => x.name).join(', ') || '—')).join('');
    }
  } else if (m.kind === 'adapt') {
    el.querySelectorAll('#hChips button').forEach(b => b.setAttribute('aria-pressed', S.hab === b.dataset.k));
    TRK.forEach(k => el.querySelectorAll('#t_' + k + ' button').forEach(b => b.setAttribute('aria-pressed', S.tr[S.hab][k] === b.dataset.k)));
    set('#r1', `${m.fitD} из 4`); set('#r2', `${m.fitT} из 4`); set('#r3', m.heat.ok ? 'норма' : m.heat.s);
  } else {
    if (S.mode === 'year') {
      set('#inMO', MONF[S.month]); val('#inM', S.month); set('#inLO', S.lamp + ' ч'); val('#inL', S.lamp);
      set('#r1', fc(m.nat) + ' ч'); set('#r2', fc(m.total) + ' ч'); set('#r3', String(m.eggs));

}

function calcHTML(m) {
  const id = LID();
  if (id === 'factors') {
    const all = m.placed === 9;
    const tw = S.temp <= 4 || S.temp >= 38 ? `${S.temp} °C — за пределом выносливости → 0%` : S.temp < 18 ? `(${S.temp} − 4) / (18 − 4) = ${m.fT}%` : S.temp <= 25 ? 'от 18 до 25 °C — оптимум → 100%' : `(38 − ${S.temp}) / (38 − 25) = ${m.fT}%`;
    const ww = S.wet <= 25 ? `${S.wet}% — растение засыхает → 0%` : S.wet < 60 ? `(${S.wet} − 25) / (60 − 25) = ${m.fW}%` : S.wet <= 80 ? 'от 60 до 80% — оптимум → 100%' : `100 − (${S.wet} − 80) / 20 × 70 = ${m.fW}%`;
    let h = `<h2>Закон оптимума</h2><div class="formula">рост = min( по теплу ; по влаге )</div><div class="steps">` +
      step('Температура', S.temp + ' °C') + step('По теплу', tw) + step('Влажность почвы', S.wet + '%') + step('По влаге', ww) +
      step('Рост', `min(${m.fT}% ; ${m.fW}%) = ${m.V}%`, 'sum') +
      step('Ограничивает', m.V >= 90 ? 'ничего: оба в оптимуме' : m.lim === 'temp' ? 'температура' : m.lim === 'wet' ? 'влажность почвы' : 'оба фактора одинаково') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Числа условные, но близки к правде: яровая пшеница прорастает от +4 °C, лучше всего растёт при +18…25 °C и влажности почвы 60–80% от полной.</p>`;
    h += `<h3>Как определить группу фактора</h3><div class="steps">` + step('1. Это живой организм?', 'биотический') + step('2. Это сделал человек?', 'антропогенный') + step('3. Иначе — неживая природа', 'абиотический') + `</div>`;
    h += `<h3>Карточки</h3><div class="steps">` + FACT.map((x, c) => step(x.name, S.bin[c] < 0 ? '—' : FG[FGK[S.bin[c]]].name + (all ? (FGK[S.bin[c]] === x.ans ? ' ✓' : ' ✗') : ''))).join('') +
      step('итого', all ? `верно ${m.right} из 9` : `разложено ${m.placed} из 9`, 'sum') + `</div>`;
    if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 9 карточек будут в коробках.</p>`;
    return h;
  }
  if (id === 'adapt') {
    const t = S.tr[S.hab];
    const tn = k => TR[k].opts.find(o => o[0] === t[k])[1].toLowerCase();
    let h = `<h2>Лиса для среды «${HAB[S.hab].name}»</h2><div class="formula">приспособленность = подходящих признаков / 4</div><div class="steps">` +
      TRK.map(k => step(TR[k].name + ': ' + tn(k), t[k] === TR[k].best[S.hab] ? 'подходит ✓' : 'не подходит')).join('') +
      step('Итого', `${m.fit} / 4`, 'sum') + `</div>`;
    const loss = { big: 2, mid: 1, small: 0 }[t.ears] + (t.fur === 'thin' ? 1 : 0);
    h += `<h3>Тепло</h3><div class="steps">` + step('Уши отдают тепла', { big: '2 балла', mid: '1 балл', small: '0 баллов' }[t.ears]) + step('Мех', t.fur === 'thin' ? 'короткий: +1 балл' : 'густой: 0 баллов') +
      step('Теплоотдача', `${loss} из 3`) + step('Нужно в среде', S.hab === 'desert' ? '3 из 3 — отдавать жар' : '0 из 3 — беречь тепло') + step('Итог', m.heat.s, 'sum') + `</div>`;
    h += `<h3>Почему</h3><div class="steps">` + TRK.filter(k => t[k] === TR[k].best[S.hab]).map(k => step(TR[k].name, TR[k].why[S.hab])).join('') + `</div>`;
    if (m.fit < 4) h += `<p class="note" style="margin-top:10px">Объяснения появятся для каждого признака, который вы подобрали верно.</p>`;
    h += `<p class="note" style="margin-top:10px">Баллы — условная модель. Зависимость «чем холоднее климат, тем меньше уши и хвост» называют правилом Аллена.</p>`;
    return h;
  }
  if (S.mode === 'year') {
    const d = decl(S.month), ch = cosHour(S.month);
    let h = `<h2>Сколько длится день</h2><div class="formula">cos H = (sin(−0,83°) − sin φ · sin δ) / (cos φ · cos δ)<br>день = 2H / 15° ч</div><div class="steps">` +
      step('Широта Астаны φ', '51,2°') + step(`Склонение Солнца δ (${MONF[S.month]}, середина)`, fc(d) + '°') +
      step('cos H', (Math.round(ch * 1000) / 1000).toString().replace('.', ',')) +
      step('H', fc(Math.acos(clamp(ch, -1, 1)) / RAD) + '°') + step('Естественный день', fc(m.nat) + ' ч') +
      step('Лампа', S.lamp + ' ч') + step('Всего света', `${fc(m.nat)} + ${S.lamp} = ${fc(m.total)} ч`, 'sum') + `</div>`;
    h += `<h3>Что делают организмы</h3><div class="steps">` +
      step('Берёза', m.birch === 'grow' ? '≥ 14 ч: растёт' : m.birch === 'yellow' ? '12–14 ч: готовится к зиме' : '< 12 ч: листопад, покой') +
      step('Куры', `6 × (${fc(m.total)} − 9) / 5 ≈ ${m.eggs} яиц в неделю`) + step('Цель: октябрь и ≥ 14 ч', m.month === 9 && m.total >= 14 ? 'да ✓' : 'пока нет') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Пороги 12 и 14 ч и формула для кур — условные числа модели. У разных растений и пород свои пороги. −0,83° учитывает преломление света в атмосфере.</p>`;
    return h;
  }
  const full = m.placed === 6;
  let h = `<h2>Кто когда активен</h2><div class="formula">${hhmm(S.hour)} · ${dayness(S.hour) >= 1 ? 'светло' : dayness(S.hour) > 0 ? 'сумерки' : 'темно'}</div><div class="steps">` +

  h += `<h3>Ваши отметки</h3><div class="steps">` + ORGS.map((o, i) => step(o.name, S.mark[i] ? (S.mark[i] === 'day' ? 'днём' : 'ночью') + (full ? (S.mark[i] === o.ans ? ' ✓' : ' ✗') : '') : '—')).join('') +
    step('итого', full ? `верно ${m.right} из 6` : `отмечено ${m.placed} из 6`, 'sum') + `</div>`;
  if (!full) h += `<p class="note" style="margin-top:10px">Как рассуждать: прокрутите стрелку через полдень и через полночь. Кто бодрствует в полдень — дневной, кто в полночь — ночной.</p>`;
  return h;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий эколог!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

    now = `Режим «${S.mode === 'opt' ? 'Закон оптимума' : 'Группы факторов'}». Карточки факторов, влияющих на сайгака: ${FACT.map((x, c) => `${x.name} — ${S.bin[c] < 0 ? 'не разложена' : 'в коробке «' + FG[FGK[S.bin[c]]].name + '»'}`).join('; ')}. ` +
      (m.placed === 9 ? `Все разложены, верно ${m.right} из 9. ` : `Разложено ${m.placed} из 9. `) +
      `Модель пшеницы: температура ${S.temp} °C (рост по теплу ${m.fT}%), влажность почвы ${S.wet}% (по влаге ${m.fW}%), итоговый рост ${m.V}% = минимум из двух. Оптимум модели: 18–25 °C и 60–80% влажности. Ограничивает: ${m.V >= 90 ? 'ничего' : m.lim === 'temp' ? 'температура' : m.lim === 'wet' ? 'влажность' : 'оба'}. Цель: все 9 карточек верно и рост не меньше 90%.`;
    guide = 'Не говори, в какую коробку класть конкретную карточку. Спрашивай: это живое, неживое или сделано человеком? Для оптимума спрашивай, какая из двух кривых сейчас ниже и почему рост определяет худший фактор.';
  }
  if (id === 'adapt') {
    const d = h => TRK.map(k => `${TR[k].name.toLowerCase()} — ${TR[k].opts.find(o => o[0] === S.tr[h][k])[1].toLowerCase()}`).join(', ');
    now = `Конструктор лисы. Выбрана среда «${HAB[S.hab].name}» (${HAB[S.hab].sub}). Лиса для пустыни: ${d('desert')} (подходит ${m.fitD} из 4). Лиса для тундры: ${d('tundra')} (подходит ${m.fitT} из 4). Сейчас на экране: ${m.heat.s}, ${m.camo ? 'незаметна' : 'заметна'}, ${m.paw ? 'лапы защищены' : 'лапы не защищены'}. Цель: обе лисы 4 из 4.`;
    guide = 'Не называй готовый набор признаков. Спрашивай, что грозит лисе в этой среде — перегрев или холод, зачем нужна окраска под цвет фона, по чему лиса ходит. Подсказка про подошвы: одна черта может быть полезна в обеих средах.';
  }
  if (id === 'rhythm') {
    now = `Режим «${S.mode === 'year' ? 'Год' : 'Сутки'}». Часы показывают ${hhmm(S.hour)} (июнь, светло примерно с 5 до 21 ч), сейчас активны ${m.awake} из 6 обитателей. Отметки ученика: ${ORGS.map((o, i) => `${o.name} — ${S.mark[i] === 'day' ? 'днём' : S.mark[i] === 'night' ? 'ночью' : 'не отмечен'}`).join('; ')}. ` +
      (m.placed === 6 ? `Все отмечены, верно ${m.right} из 6. ` : `Отмечено ${m.placed} из 6. `) +
      `Теплица (+20 °C круглый год): ${MONF[S.month]}, естественный день ${fc(m.nat)} ч, лампа ${S.lamp} ч, всего ${fc(m.total)} ч. Берёза: ${m.birch === 'grow' ? 'растёт' : m.birch === 'yellow' ? 'листья желтеют' : 'листопад'}, куры несут ${m.eggs} яиц в неделю. Цель: все 6 отметок верны, выбран октябрь и света не меньше 14 ч.`;
    guide = 'Не называй, кто дневной, а кто ночной. Предложи прокрутить часы на полдень и полночь и посмотреть, кто проснулся. Про теплицу спрашивай, почему дерево сбрасывает листья в тепле и сколько часов не хватает до 14.';
  }
  return [
    `Раздел: биология, 8 класс, тема «Организм и среда». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    factors: 'Почему пшеница растёт плохо, если только один фактор не в норме?', adapt: 'Почему у песца маленькие уши, а у фенека огромные?',
    rhythm: 'Почему дерево сбрасывает листья даже в тёплой теплице?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
