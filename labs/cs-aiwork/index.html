<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 8–11 класс: как ставить задачу ИИ-ассистенту, как проверять его ответы, как учиться с ИИ честно и как защищать данные.">
<link rel="icon" href="data:,">
<title>Работа с ИИ-ассистентами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /labs/cs-ai. The stage holds an HTML "assistant screen" (prompt builder, chat, answer cards) instead of an SVG bench.
   The task card sits top-left over the stage; fit() measures it and puts the screen beside it (wide stage) or below it (narrow stage). */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --paper:#eef1f6;
  --ink:#0b1019;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,185,230,.04) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(160,185,230,.04) 1.5px,transparent 1.5px);background-size:40px 40px;pointer-events:none}

.task{position:absolute;top:14px;left:14px;width:300px;max-width:min(300px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;font-size:12px;line-height:1.45;color:var(--muted);pointer-events:none;z-index:2}

/* ---------- the assistant screen ---------- */
.screen{position:absolute;left:14px;right:14px;top:120px;bottom:60px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;z-index:1;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.cols{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);align-items:start}
.screen.wide .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.bh{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bh em{font-style:normal;color:var(--force);letter-spacing:.06em}
.segs{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.segs button{flex:1 1 auto;background:none;border:0;border-radius:7px;padding:7px 10px;font:600 12px/1.1 var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.segs button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.segs button .ck{color:var(--ok)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

/* lesson 1: prompt builder */
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pl{font:600 12px/1.3 var(--font-body);color:var(--fg);padding-top:6px}
.pl small{display:block;font:400 11px/1.3 var(--font-body);color:var(--muted)}
.pch{display:flex;flex-direction:column;gap:5px}
.pchip{text-align:left;background:var(--bg);border:1px dashed #3a4762;border-radius:8px;padding:6px 9px;font:500 12.5px/1.35 var(--font-body);cursor:pointer;color:var(--muted)}
.pchip:hover{color:var(--fg);border-color:var(--muted)}
.pchip[aria-pressed="true"]{border-style:solid;border-color:var(--arm);color:var(--fg);background:rgba(114,212,232,.08)}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin-top:10px}
.ptext{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.ptext .base{color:var(--fg)}
.ptext .add{color:#bfe9f3}
.send{flex:none;background:var(--force);color:var(--ink);border:0;border-radius:9px;padding:8px 12px;font:600 13px/1 var(--font-body);cursor:pointer}
.send:disabled{opacity:.4;cursor:default}

.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.winbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font:500 11.5px/1 var(--font-mono);color:var(--muted)}
.winbar .dots{display:flex;gap:4px;flex:none}
.winbar .dots i{width:8px;height:8px;border-radius:50%;background:#3a4762}
.winbar .sim{margin-left:auto;font:600 9.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.winbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px}
.bub{max-width:92%;border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.bub.user{align-self:flex-end;background:#2a3a5c;border:1px solid #3a4f78;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .who{display:block;font:600 9.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.bub i.more{color:var(--muted)}
.bub p{margin:0 0 6px}
.bub p:last-child{margin-bottom:0}
.bub table{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0 6px}
.bub td,.bub th{border:1px solid #3a4762;padding:4px 5px;vertical-align:top;text-align:left}
.bub th{color:var(--muted);font-weight:600}
pre.code{margin:4px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:500 12px/1.5 var(--font-mono);white-space:pre;overflow-x:auto;overflow-wrap:normal;scrollbar-width:thin}
.rub{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.rub span{font:500 11px/1 var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.rub .y{color:var(--ok);border-color:rgba(134,224,168,.5)}
.rub .v{color:var(--force);border-color:rgba(255,181,71,.5)}
.rub .n{color:var(--warn);border-color:rgba(255,138,115,.45)}
.why{list-style:none;margin:7px 0 0;padding:0;font-size:12px;color:var(--muted);display:grid;gap:3px}
.why li::before{content:"— "}
.score{font:600 11px/1 var(--font-mono);margin-left:6px}

/* lesson 2: answer cards */
.q{font-size:13.5px}
.segt{display:inline;background:none;border:0;padding:1px 2px;margin:0 1px;border-radius:4px;text-align:left;font:inherit;line-height:1.6;cursor:pointer;color:inherit;border-bottom:1px dashed #56627d;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.segt:hover{background:rgba(114,212,232,.08)}
.segt.sel{background:rgba(114,212,232,.16);border-bottom-color:var(--arm)}
.segt.mark{background:rgba(255,138,115,.2);border-bottom:2px solid var(--warn)}
.segt.hit{background:rgba(134,224,168,.16);border-bottom:2px solid var(--ok)}
.segt.fp{background:rgba(255,181,71,.2);border-bottom:2px solid var(--force)}
pre.code .segt{display:block;width:100%;border-bottom-style:dotted;margin:0;font:500 12px/1.55 var(--font-mono);white-space:pre}
.detail .quote{font-size:13px;line-height:1.45;border-left:3px solid var(--arm);padding:2px 0 2px 9px;margin-bottom:9px;overflow-wrap:anywhere}
.chk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chk button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:600 12.5px/1.25 var(--font-body);cursor:pointer}
.chk button span{display:block;font:400 11.5px/1.3 var(--font-body);color:var(--muted);margin-top:2px}
.chk button[aria-pressed="true"]{border-color:var(--arm)}
.evs{display:grid;gap:6px;margin-top:9px}
.ev{font-size:12.5px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.ev b{display:block;font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ev.red{border-color:rgba(255,138,115,.6)}
.ev.red b{color:var(--warn)}
.ev.green{border-color:rgba(134,224,168,.45)}
.ev.green b{color:var(--ok)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:600 13px/1 var(--font-body);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.red{color:var(--warn);border-color:rgba(255,138,115,.55);background:rgba(255,138,115,.1)}
.btn.grn{color:var(--ok);border-color:rgba(134,224,168,.55);background:rgba(134,224,168,.1)}
.btn:disabled{opacity:.4;cursor:default}
.res{font-size:13px;line-height:1.45;margin-top:9px;padding:8px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.res.ok{border-color:rgba(134,224,168,.5);color:#c4f2d4}
.res.no{border-color:rgba(255,138,115,.5);color:#ffcabf}

/* lesson 3: requests and plan */
.reqs{display:grid;gap:6px}
.req{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.35;cursor:pointer}
.req:hover{border-color:var(--muted)}
.req[aria-current="true"]{border-color:var(--arm);background:rgba(114,212,232,.06)}
.req .n{flex:none;font:500 11px/1.4 var(--font-mono);color:var(--muted)}
.req .tg{margin-left:auto;flex:none;font:600 10px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 5px;border:1px solid var(--line);color:var(--muted)}
.req .tg.l{color:var(--ok);border-color:rgba(134,224,168,.5)}
.req .tg.c{color:var(--warn);border-color:rgba(255,138,115,.5)}
.req .tg.x{text-decoration:line-through}
.pool,.myplan{display:grid;gap:5px}
.stp{display:flex;gap:8px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1px dashed #3a4762;border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.35;cursor:pointer}
.stp:hover{border-color:var(--muted)}
.stp b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--font-mono);background:var(--surface-2);border:1px solid var(--line)}
.myplan .stp{border-style:solid}
.myplan .stp.ok b{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.myplan .stp.no b{background:var(--warn);color:var(--ink);border-color:var(--warn)}
.slot{border:1px dashed var(--line);border-radius:9px;padding:8px 9px;font-size:12px;color:var(--muted)}
.lbl2{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}

/* lesson 4: message, fakes, bias */
.msg{line-height:1.9;font-size:13.5px}
.msg .segt{border-bottom-style:dotted}
.msg .segt.red{background:#2b3346;color:transparent;border-bottom-color:transparent;text-shadow:none;border-radius:3px;position:relative}
.msg .segt.red::after{content:"скрыто";position:absolute;left:4px;top:0;color:var(--muted);font:500 11px/1.9 var(--font-mono)}
.media{display:grid;gap:8px}
.mcard{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.mcard[aria-current="true"]{border-color:var(--arm)}
.mcard svg{width:86px;height:64px;border-radius:7px;display:block}
.mcard .kd{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mcard .tt{display:block;font-size:12.5px;line-height:1.38;margin-top:4px}
.mcard .vd{display:inline-block;margin-top:5px;font:600 10.5px/1 var(--font-body);border-radius:5px;padding:4px 6px;border:1px solid}
.vd.t{color:var(--ok);border-color:rgba(134,224,168,.5)}
.vd.f{color:var(--warn);border-color:rgba(255,138,115,.5)}
.vd.w{color:var(--force);border-color:rgba(255,181,71,.5)}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.4;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt.ok{border-color:var(--ok);background:rgba(134,224,168,.1)}
.opt.no{border-color:var(--warn);background:rgba(255,138,115,.08)}

/* ---------- side panel ---------- */
.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.pbody ul.list{margin:0 0 12px;padding-left:18px;line-height:1.55;font-size:14px}
.pbody ul.list li{margin-bottom:5px}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tpl{font:500 13px/1.6 var(--font-mono);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.tpl b{color:var(--force);font-weight:500}
.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.bad span{color:var(--warn)}
.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:78vh;min-height:600px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  /* phone: no overlay — task, meter, screen and tools simply stack, the page scrolls */
  .stage{height:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
  .task,.meter,.tools,.screen{position:static!important;transform:none;max-width:none}
  .task{width:auto;padding:9px 11px}
  .task p{font-size:13px}
  .meter{width:auto;padding:8px 10px}
  .screen{overflow:visible}
  .tools{align-self:center;max-width:100%}
  .tools button{padding:6px 7px;font-size:12px}
  .hint{display:none}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .prow{grid-template-columns:minmax(0,1fr);gap:4px}
  .pl{padding-top:0}
  .chk{grid-template-columns:minmax(0,1fr)}
  .mcard{grid-template-columns:70px minmax(0,1fr)}
  .mcard svg{width:70px;height:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const card = CARDS[c], sg = card.segs[i], own = sg.ev && sg.ev[k];
  if (own) return { t: own, cls: sg.err ? 'red' : 'green' };
  if (k === 'run') return card.run ? { t: card.run, cls: 'red' } : { t: 'Это не код — запускать нечего. Выберите другую проверку.', cls: '' };
  if (sg.err) return { t: 'Эта проверка здесь ничего не показала. Попробуйте другую.', cls: '' };
  if (k === 'src') return { t: 'Ссылки нет, но это не ошибка: факт можно сверить самому.', cls: '' };
  if (k === 'est') return { t: /\d/.test(sg.t) ? 'Число правдоподобное — оценка не находит противоречий.' : 'Числа здесь нет — оценивать нечего.', cls: '' };
  return { t: 'Сверка с надёжным источником: совпадает.', cls: 'green' };
}

function scoreOf(i) {
  const sc = SCEN[i], pk = S.pk[i];
  const st = PARTS.map(p => pk[p.k] === undefined ? 'n' : sc.opts[p.k][pk[p.k]][1] ? 'y' : 'v');
  return { st, score: st.filter(x => x === 'y').length, used: st.filter(x => x !== 'n').length };

  if (id === 'prompt') {
    const cur = scoreOf(S.sc), last = S.thread.filter(x => x.who === 'bot').slice(-1)[0];
    return { kind: id, pairs: S.pairs.filter(p => p.v && p.f).length, cur, last };
  }
  if (id === 'verify') {
    const solved = S.res.filter(r => r && r.ok).length;
    const found = S.res.reduce((s, r) => s + (r ? r.found : 0), 0);
    return { kind: id, solved, found, nChecks: S.nChecks };
  }
  if (id === 'study') {
    const correct = REQS.filter(r => S.cls[r.id] === (r.copy ? 'copy' : 'learn')).length;
    const planOk = S.plan.length === PLAN.length && S.plan.every((p, i) => p === i);
    return { kind: id, correct, sorted: Object.keys(S.cls).length, planOk, planLen: S.plan.length };
  }
  const fakes = FAKES.filter(f => S.verd[f.id] !== undefined && S.verd[f.id] === !!f.fake).length;
  const biasOK = S.bias[0] === BIAS.q[0].ok && S.bias[1] === BIAS.q[1].ok;
  const msgOK = !!(S.msgRes && S.msgRes.ok);
  return { kind: id, msgOK, fakes, biasOK, parts: [msgOK, fakes === FAKES.length, biasOK].filter(Boolean).length };
}

const screen = $('#screen');
const win = (title, body, part) => `<div class="win"${part ? ` data-part="${part}"` : ''}><div class="winbar"><span class="dots"><i></i><i></i><i></i></span>${title}<span class="sim">симуляция</span></div><div class="winbody">${body}</div></div>`;
const bub = (who, html, extra = '') => `<div class="bub ${who}"><span class="who">${who === 'user' ? 'вы' : 'ассистент'}${extra}</span>${html}</div>`;
const segBar = (items, cur, act) => `<div class="segs" role="group">${items.map((x, i) => `<button data-a="${act}" data-i="${i}" aria-pressed="${i === cur}">${x}</button>`).join('')}</div>`;

function promptText(i) {
  const sc = SCEN[i], pk = S.pk[i];
  return `<span class="base">${esc(sc.base)}</span>` + PARTS.filter(p => pk[p.k] !== undefined).map(p => ` <span class="add">${esc(sc.opts[p.k][pk[p.k]][0])}</span>`).join('');
}
function screen1(m) {
  const sc = SCEN[S.sc], pk = S.pk[S.sc];
  const tabs = segBar(SCEN.map((x, i) => `${x.name}${S.pairs[i].v && S.pairs[i].f ? ' <span class="ck">✓</span>' : ''}`), S.sc, 'sc');
  let b = `<div class="box" data-part="builder"><div class="bh">Конструктор запроса <em>${m.cur.used} из 5 частей</em></div>${tabs}<div style="margin-top:8px">`;
  b += PARTS.map(p => `<div class="prow"><span class="pl">${p.name}<small>${p.sub}</small></span><div class="pch">${sc.opts[p.k].map((o, j) => `<button class="pchip" data-a="chip" data-k="${p.k}" data-j="${j}" aria-pressed="${pk[p.k] === j}">${esc(o[0])}</button>`).join('')}</div></div>`).join('');
  b += `</div><div class="composer" data-part="composer"><div class="ptext">${promptText(S.sc)}</div><button class="send" data-a="send">Отправить</button></div></div>`;
  const msgs = S.thread.slice(-4);
  const body = msgs.length ? msgs.map(x => x.who === 'user' ? bub('user', x.html) : bub('bot', x.html + rubric(x), ` · ${x.scen}`)).join('') : '<div class="empty">Здесь появятся запросы и ответы. Сравните ответ на расплывчатый и на точный запрос.</div>';
  const chat = win('ИИ-ассистент', body, 'chat');
  return `<div class="cols">${b}${chat}</div>`;
}
function rubric(x) {
  const lab = { y: '✓', v: '~', n: '✗' };
  let h = `<div class="rub" data-part="rubric">${PARTS.map((p, i) => `<span class="${x.st[i]}">${lab[x.st[i]]} ${p.name}</span>`).join('')}<span class="score">${x.score}/5</span></div>`;
  const why = PARTS.map((p, i) => x.st[i] === 'n' ? p.miss : x.st[i] === 'v' ? `${p.name}: «${x.vague[i]}» — слишком общо, ничего конкретного.` : '').filter(Boolean);
  if (why.length) h += `<ul class="why">${why.slice(0, 3).map(w => `<li>${esc(w)}</li>`).join('')}${why.length > 3 ? `<li>и ещё ${why.length - 3}…</li>` : ''}</ul>`;
  return h;
}

function screen2(m) {
  const c = S.c, card = CARDS[c], res = S.res[c];

    if (op.length) det += `<div class="evs">${op.map(j => `<div class="ev ${f.checks[j][2] ? 'red' : 'green'}"><b>${f.checks[j][0]}</b>${esc(f.checks[j][1])}</div>`).join('')}</div>`;

      if (a >= 0 && a !== q.ok) qs += `<div class="res no">${qi === 0 ? 'Посмотрите, у кого какая профессия. Не напоминает ли это расхожие стереотипы?' : 'Длина ответа и отказ от ассистента не убирают перекос. Что нужно сказать в запросе явно?'}</div>`;
    });
    if (m.biasOK) qs += '<div class="res ok">Верно. Модель учится на текстах, где врачи и пилоты чаще мужчины, а медсестра — женщина, и усиливает этот перекос. В рассказе это мелочь, а в отборе резюме — уже несправедливость.</div>';

function renderScreen() {
  const id = LID(), m = model(), st = screen.scrollTop;
  screen.innerHTML = id === 'prompt' ? screen1(m) : id === 'verify' ? screen2(m) : id === 'study' ? screen3(m) : screen4(m);
  screen.scrollTop = st;
  if (S.hl) {
    const el = screen.querySelector(`[data-part="${S.hl}"]`);
    if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    S.hl = null;
  }
}

// ---------- actions ----------
function send1() {
  const i = S.sc, sc = SCEN[i], r = scoreOf(i);
  const bucket = r.score <= 1 ? 0 : r.score < 5 ? 1 : 2;
  const vague = PARTS.map(p => S.pk[i][p.k] !== undefined ? sc.opts[p.k][S.pk[i][p.k]][0] : '');
  S.thread.push({ who: 'user', html: promptText(i) });
  S.thread.push({ who: 'bot', html: sc.ans[bucket], st: r.st, score: r.score, vague, scen: sc.name });
  S.thread = S.thread.slice(-8); S.sent++;
  if (r.score <= 1) S.pairs[i].v = true;
  if (r.score === 5) S.pairs[i].f = true;
  const p = S.pairs[i];
  if (r.score === 5 && !p.v) toast('Отличный запрос! Для сравнения отправьте и расплывчатый: снимите все фразы.');
  else if (r.score <= 1 && !p.f) toast('Видите, сколько ассистент додумал сам? Теперь соберите запрос из 5 конкретных частей.');
  else if (r.score > 1 && r.score < 5) toast(`Запрос ${r.score} из 5: ответ лучше, но ещё не тот. Смотрите, чего не хватает.`);
  else if (p.v && p.f && SCEN.filter((_, k) => S.pairs[k].v && S.pairs[k].f).length < 2) toast('Пара готова. Теперь возьмите другую задачу.');
  update();
  requestAnimationFrame(() => { const c = screen.querySelector('[data-part="chat"]'); if (c && screen.classList.contains('wide')) return; if (c) c.scrollIntoView({ block: 'end', behavior: 'smooth' }); });
}
function submit2() {
  const c = S.c, card = CARDS[c], mk = S.mk[c];
  const total = card.segs.filter(x => x.err).length, found = card.segs.filter((x, i) => x.err && mk[i]).length, fp = card.segs.filter((x, i) => !x.err && mk[i]).length;
  const ok = found === total && fp === 0;
  S.res[c] = { ok, found, total, fp, shown: true };
  toast(ok ? 'Все ошибки найдены!' : `Найдено ${found} из ${total}${fp ? `, лишних: ${fp}` : ''}.`);
  if (ok) { const nx = S.res.findIndex(r => !r || !r.ok); if (nx >= 0) setTimeout(() => { if (LID() === 'verify' && S.c === c) { S.c = nx; S.sel = -1; update(); } }, 1600); }
  update();
}
function send4() {
  const leaked = MSG.filter(x => x.risk && !S.red[x.id]), lost = MSG.filter(x => x.need && S.red[x.id]);
  let reply, note, ok = false;
  if (lost.length) {
    reply = 'Я не совсем понял, с чем помочь. Опишите, пожалуйста, задачу: что случилось и что вы видите на экране?';
    note = 'Вы скрыли то, что нужно для ответа: ' + lost.map(x => x.id === 'task' ? 'саму просьбу' : 'текст ошибки').join(' и ') + '. Скрывают только лишние личные данные.';
  } else {
    reply = 'Вот черновик: «Здравствуйте! С [дата] не могу войти на школьный портал: появляется «Ошибка 403 — доступ запрещён». Мой логин: [ваш логин]. Подскажите, пожалуйста, как восстановить доступ». Свои данные впишите сами. Пароль в письмо не пишите — поддержка его не спрашивает.';
    if (leaked.length) note = 'Ответ полезный, но на сервер ушло: ' + leaked.map(x => x.why).join(', ') + '. Этого уже не вернуть' + (leaked.some(x => x.id === 'pass') ? ' — пароль надо срочно сменить' : '') + '. Нажмите «Новое сообщение» и попробуйте снова.';
    else { ok = true; note = 'Ассистент помог, а лишних данных не получил: имя, адрес, телефон и пароль впишете сами, чужое фото осталось у вас.'; }
  }
  S.msgRes = { ok, reply, note };
  toast(ok ? 'Сообщение отправлено без лишних данных.' : lost.length ? 'Ассистенту не хватило информации.' : 'Утечка данных!');
  update();
}

screen.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, i = +b.dataset.i;
  if (a === 'sc') { S.sc = i; update(); return; }
  if (a === 'chip') { const k = b.dataset.k, j = +b.dataset.j; S.pk[S.sc][k] = S.pk[S.sc][k] === j ? undefined : j; update(); return; }
  if (a === 'send') return send1();
  if (a === 'card') { S.c = i; S.sel = -1; update(); return; }
  if (a === 'seg') { S.sel = S.sel === i ? -1 : i; update(); return; }
  if (a === 'check') { const u = S.ev[S.c][S.sel]; if (!u.includes(b.dataset.k)) { u.push(b.dataset.k); S.nChecks++; } update(); return; }
  if (a === 'mark') { S.mk[S.c][S.sel] = !S.mk[S.c][S.sel]; if (S.res[S.c]) S.res[S.c].shown = false; update(); return; }
  if (a === 'submit') return submit2();
  if (a === 'unmark') { S.mk[S.c] = S.mk[S.c].map(() => false); S.res[S.c] = null; update(); return; }
  if (a === 'req') { S.rq = i; update(); return; }
  if (a === 'cls') { const r = REQS[S.rq]; S.cls[r.id] = b.dataset.v; const ok = b.dataset.v === (r.copy ? 'copy' : 'learn'); toast(ok ? 'Верно.' : 'Подумайте ещё: после такого ответа вы будете уметь больше?'); update(); return; }
  if (a === 'plan') { S.plan.push(i); update(); if (S.plan.length === PLAN.length) toast(model().planOk ? 'План собран верно.' : 'Порядок не тот — красные шаги стоят не на месте.'); return; }
  if (a === 'unplan') { S.plan.splice(i, 1); update(); return; }
  if (a === 'p4') { S.p4 = ['msg', 'fake', 'bias'][i]; renderTools(); update(); screen.scrollTop = 0; return; }
  if (a === 'red') { const id = b.dataset.id; S.red[id] = !S.red[id]; if (S.msgRes && !S.msgRes.ok) S.msgRes = null; update(); return; }
  if (a === 'msgsend') return send4();
  if (a === 'msgreset') { S.red = {}; S.msgRes = null; update(); return; }
  if (a === 'fc') { S.fc = i; update(); return; }
  if (a === 'fopen') { const f = FAKES[S.fc], op = S.fopen[f.id] || (S.fopen[f.id] = []); const j = +b.dataset.j; if (!op.includes(j)) op.push(j); update(); return; }
  if (a === 'verd') {
    const f = FAKES[S.fc], v = b.dataset.v === '1'; S.verd[f.id] = v; const ok = v === !!f.fake;
    toast(ok ? 'Верно!' : 'Не совсем — посмотрите на улики.');
    if (ok) { const nx = FAKES.findIndex(x => S.verd[x.id] === undefined || S.verd[x.id] !== !!x.fake); if (nx >= 0) setTimeout(() => { if (LID() === 'privacy' && S.p4 === 'fake' && S.fc === FAKES.indexOf(f)) { S.fc = nx; update(); } }, 1400); }
    update(); return;
  }
  if (a === 'bias') { const q = +b.dataset.q, j = +b.dataset.j; S.bias[q] = j; if (q === 0 && j !== BIAS.q[0].ok) S.bias[1] = -1; update(); return; }
});

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  if (id === 'prompt') tb.innerHTML = B('send', 'Отправить') + B('vague', 'Снять все фразы') + sep + B('nextsc', 'Другая задача') + B('clear', 'Очистить чат');
  if (id === 'verify') tb.innerHTML = B('submit', 'Сдать ответ') + sep + CHECKS.map(k => B('t-' + k.k, k.name)).join('') + sep + B('nextcard', 'Следующий ответ');
  if (id === 'study') tb.innerHTML = B('learn', 'Помогает учиться') + B('copy', 'Делает за меня') + sep + B('nextreq', 'Следующий запрос') + B('planreset', 'Сбросить план');
  if (id === 'privacy') tb.innerHTML = B('p-msg', 'Сообщение', S.p4 === 'msg') + B('p-fake', 'Дипфейки', S.p4 === 'fake') + B('p-bias', 'Предвзятость', S.p4 === 'bias') + sep + B('reset4', 'Начать заново');
}
function act(a) {
  if (a === 'send') return send1();
  if (a === 'vague') { S.pk[S.sc] = {}; update(); return; }
  if (a === 'nextsc') { S.sc = (S.sc + 1) % SCEN.length; update(); return; }
  if (a === 'clear') { S.thread = []; update(); return; }
  if (a === 'submit') return submit2();
  if (a.startsWith('t-')) {
    if (S.sel < 0) { toast('Сначала нажмите на фразу в ответе.'); return; }
    const u = S.ev[S.c][S.sel], k = a.slice(2); if (!u.includes(k)) { u.push(k); S.nChecks++; } update(); return;
  }
  if (a === 'nextcard') { S.c = (S.c + 1) % CARDS.length; S.sel = -1; update(); return; }
  if (a === 'learn' || a === 'copy') {
    if (S.rq === null) { toast('Сначала выберите запрос.'); return; }
    const r = REQS[S.rq]; S.cls[r.id] = a; toast(a === (r.copy ? 'copy' : 'learn') ? 'Верно.' : 'Подумайте ещё: после такого ответа вы будете уметь больше?'); update(); return;
  }
  if (a === 'nextreq') { const nx = REQS.findIndex((r, i) => i > (S.rq === null ? -1 : S.rq) && !S.cls[r.id]); S.rq = nx >= 0 ? nx : ((S.rq === null ? -1 : S.rq) + 1) % REQS.length; update(); return; }
  if (a === 'planreset') { S.plan = []; update(); return; }
  if (a.startsWith('p-')) { S.p4 = a.slice(2); renderTools(); update(); screen.scrollTop = 0; return; }
  if (a === 'reset4') { S.red = {}; S.msgRes = null; S.fopen = {}; S.verd = {}; S.bias = [-1, -1]; S.fc = 0; update(); return; }
  if (a === 'restart') { const id = LID(); resetState(); if (id === 'privacy') renderTools(); update(); return; }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.a) act(b.dataset.a); });

function partsList() {

    { id: 'builder', name: 'Конструктор запроса', spec: 'Пять строк — пять частей хорошего запроса. В каждой одна фраза конкретная, другая расплывчатая. Какая есть какая — решаете вы.' },
    { id: 'composer', name: 'Строка ввода', spec: 'Здесь собирается текст запроса, который «увидит» ассистент. Больше он ничего о вас не знает.' },
    { id: 'chat', name: 'Окно ассистента', spec: 'Показывает последние два обмена: удобно сравнивать ответы. Ответы заранее подготовлены — настоящий ИИ здесь не вызывается.' },
    { id: 'rubric', name: 'Разбор запроса', spec: '✓ — часть есть и конкретна, ~ — есть, но расплывчата, ✗ — части нет. Ниже — что из-за этого пошло не так.' }];

function partTab(id) { return { msg: 'msg', fakes: 'fake', bias: 'bias' }[id]; }

function renderPanes(m) {

      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +

      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

  }
  if (S.tab === 'parts') {

    btns(['nextreq', 'Следующий запрос'], ['planreset', 'Сбросить план']);
  return `<h2>Три правила безопасности</h2><div class="steps">${step('Данные', 'не отправлять пароли, коды, адрес, чужое')}${step('Дипфейки', 'срочность + деньги = перезвонить')}${step('Предвзятость', 'замечать перекос, просить разнообразия')}</div>
    <dl class="reads"><div><dt>сообщение</dt><dd>${m.msgOK ? '✓' : '—'}</dd></div><div><dt>дипфейки</dt><dd>${m.fakes}/${FAKES.length}</dd></div><div><dt>bias</dt><dd>${m.biasOK ? '✓' : '—'}</dd></div></dl>
    <h3>Никогда не отправляйте ассистенту</h3><ul class="list"><li>Пароли, коды из СМС, ключи доступа.</li><li>Номера документов, банковских карт, счетов.</li><li>Адрес, телефон, точные данные о здоровье — свои и чужие.</li><li>Чужие фото и переписку без согласия.</li></ul>` +
    btns(['p-msg', 'Сообщение'], ['p-fake', 'Дипфейки'], ['p-bias', 'Предвзятость'], ['reset4', 'Начать заново']);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'prompt') {
    const sc = SCEN[S.sc], r = m.cur;
    let h = `<h2>Оценка запроса</h2><div class="formula">качество = число конкретных частей</div><p class="note">Каждая часть даёт 1 балл, только если сформулирована конкретно. Расплывчатая фраза («покороче», «красиво») — 0: ассистенту по-прежнему приходится угадывать.</p><h3>Задача «${sc.name}» сейчас</h3><div class="steps">`;
    PARTS.forEach((p, i) => { const j = S.pk[S.sc][p.k]; h += step(p.name, j === undefined ? 'нет → 0' : `«${esc(sc.opts[p.k][j][0].slice(0, 34))}${sc.opts[p.k][j][0].length > 34 ? '…' : ''}» → ${r.st[i] === 'y' ? 1 : 0}`, r.st[i] === 'y' ? 'okk' : j === undefined ? '' : 'bad'); });
    h += step('итого', `${r.score} из 5`, 'sum') + `</div><h3>Какой ответ получится</h3><div class="steps">${step('0–1 балл', 'ассистент угадывает почти всё')}${step('2–4 балла', 'ближе, но придётся уточнять')}${step('5 баллов', 'ответ можно сразу использовать')}</div>
      <h3>Сколько времени экономит точный запрос</h3><p class="note">Если каждое уточнение — это минута на чтение ответа и минута на новый запрос, то расплывчатый запрос с 3–4 уточнениями стоит 6–8 минут, а точный — 2. За день из 20 задач это разница около двух часов.</p><div class="steps">${step('расплывчато', '20 × 7 мин = 140 мин')}${step('точно', '20 × 2 мин = 40 мин')}${step('экономия', '≈ 100 мин в день', 'sum')}</div>`;
    return h;
  }
  if (id === 'verify') {
    let h = `<h2>Оценка в уме</h2><p class="note">Ассистент утверждает, что сердце за сутки бьётся 10 000 раз. Проверим порядок величины: берём средний пульс и считаем.</p><div class="formula">ударов в сутки = пульс × 60 × 24</div><div class="steps">${step('пульс', '≈ 70 уд/мин')}${step('в час', '70 × 60 = 4 200')}${step('в сутки', `4 200 × 24 = ${big(100800)}`)}${step('у ассистента', '10 000 — в 10 раз меньше', 'bad')}</div>
      <p class="note" style="margin-top:8px">Оценка ловит потерянные нули и неверные расчёты, но не ловит правдоподобные выдумки — для них нужна сверка с источником.</p><h3>Ваша разметка</h3><div class="steps">`;
    CARDS.forEach((c, i) => { const r = S.res[i]; h += step(c.name, r ? `найдено ${r.found}/${r.total}${r.fp ? `, лишних ${r.fp}` : ''}${r.ok ? ' ✓' : ''}` : `отмечено ${S.mk[i].filter(Boolean).length}, не сдано`, r && r.ok ? 'okk' : ''); });
    h += step('всего ошибок в ответах', `${m.found} из ${ERR_TOTAL} найдено`, 'sum') + `</div><p class="note" style="margin-top:8px">Проверок использовано: ${m.nChecks}. В реальной работе проверка занимает время — поэтому важные ответы проверяют всегда, а не «когда кажется подозрительным».</p>`;
    return h;
  }
  if (id === 'study') {
    const xs = [90, 100, 110, 120, 600], sum = xs.reduce((a, b) => a + b, 0);
    return `<h2>Среднее и медиана</h2><p class="note">Так ассистент-репетитор объясняет тему на вашем примере: расход воды пяти семей в день, литры.</p><div class="formula">среднее = сумма / количество</div><div class="steps">${step('сумма', xs.join(' + ') + ' = ' + sum)}${step('среднее', `${sum} / 5 = ${sum / 5} л`)}${step('медиана', 'середина ряда 90, 100, <b>110</b>, 120, 600 = 110 л', 'sum')}</div>
      <p class="note" style="margin-top:8px">Одна семья с протекающим краном «тянет» среднее вверх почти в 2 раза, а медиана почти не меняется. Поэтому для «типичной» семьи лучше медиана.</p>
      <h3>План на 2 недели</h3><div class="steps">${step('1. Вопрос исследования', '1 день')}${step('2. Сбор данных', '7 дней')}${step('3. Расчёты', '2 дня')}${step('4. Выводы', '2 дня')}${step('5. Отчёт', '2 дня')}${step('итого', '1 + 7 + 2 + 2 + 2 = 14 дней', 'sum')}</div>`;
  }
  const leaked = MSG.filter(x => x.risk && !S.red[x.id]);
  let h = `<h2>Что уйдёт на сервер</h2><p class="note">Всё, что не скрыто, окажется на сервере компании. Чем меньше личных данных, тем меньше риск утечки.</p><div class="steps">`;
  MSG.filter(x => x.risk || x.need).forEach(x => h += step(x.risk ? x.why : x.id === 'task' ? 'суть просьбы' : 'текст ошибки', x.risk ? (S.red[x.id] ? 'скрыто ✓' : 'уйдёт ✗') : (S.red[x.id] ? 'скрыто — ассистенту не хватит' : 'нужно, отправляем ✓'), x.risk ? (S.red[x.id] ? 'okk' : 'bad') : (S.red[x.id] ? 'bad' : 'okk')));
  h += step('лишних данных уйдёт', String(leaked.length), 'sum') + `</div><h3>Улики в материалах</h3><div class="steps">`;
  FAKES.forEach(f => { const op = S.fopen[f.id] || [], red = op.filter(j => f.checks[j][2]).length; h += step(f.kind, `открыто ${op.length}/4, тревожных ${red}`); });
  h += `</div><p class="note" style="margin-top:8px">Одна тревожная улика — повод проверить внимательнее, несколько — почти наверняка подделка. Нет улик и есть подтверждение из официальных источников — скорее всего, правда.</p>`;
  return h;
}

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  if (id === 'prompt') return `Готовых пар «расплывчато → точно»: ${m.pairs} из 2`;
  if (id === 'verify') return `Ответов разобрано без ошибок: ${m.solved} из ${CARDS.length}`;
  if (id === 'study') return `Запросы: верно ${m.correct} из ${REQS.length} · план: ${m.planOk ? 'готов ✓' : `${m.planLen} из 5`}`;
  return `Сообщение ${m.msgOK ? '✓' : '—'} · дипфейки ${m.fakes}/${FAKES.length} · предвзятость ${m.biasOK ? '✓' : '—'}`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'prompt') { const s = m.last ? m.last.score : 0; el.innerHTML = `<div class="k">Последний запрос</div><div class="v ${m.last && s === 5 ? 'ok' : ''}">${m.last ? s : '—'} / 5</div><div class="gauge"><b style="width:${s * 20}%"></b></div><div class="lr"><span>пар готово</span><span>${m.pairs} из 2</span></div>`; }
  if (id === 'verify') el.innerHTML = `<div class="k">Ответов разобрано</div><div class="v ${m.solved === CARDS.length ? 'ok' : ''}">${m.solved} из ${CARDS.length}</div><div class="gauge"><b style="width:${m.solved / CARDS.length * 100}%"></b></div><div class="lr"><span>ошибок найдено</span><span>${m.found}/${ERR_TOTAL}</span></div>`;
  if (id === 'study') el.innerHTML = `<div class="k">Запросы разобраны</div><div class="v ${m.correct === REQS.length ? 'ok' : ''}">${m.correct} из ${REQS.length} верно</div><div class="gauge"><b style="width:${m.correct / REQS.length * 100}%"></b></div><div class="lr"><span>план</span><span>${m.planOk ? 'готов ✓' : m.planLen + ' из 5'}</span></div>`;
  if (id === 'privacy') el.innerHTML = `<div class="k">Частей задания</div><div class="v ${m.parts === 3 ? 'ok' : ''}">${m.parts} из 3</div><div class="gauge"><b style="width:${m.parts / 3 * 100}%"></b></div><div class="lr"><span>дипфейки</span><span>${m.fakes}/${FAKES.length}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы умеете работать с ИИ-ассистентом осознанно!'), 900);
    if (window.LuchShell && window.LuchShell.prefetchQuiz) try { window.LuchShell.prefetchQuiz(); } catch (e) {}
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderScreen();
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
}

// ---------- layout: keep the screen clear of the task card ----------
const stage = $('#stage');
function fit() {
  const tb = $('#taskBox'), mt = $('#meter'), tl = $('#tools'), hint = $('#hint');
  if (getComputedStyle(screen).position === 'static') {    // phone: everything stacks
    mt.style.cssText = ''; screen.style.cssText = '';
    screen.classList.toggle('wide', false);
    return;
  }
  const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return;
  const tr = tb.getBoundingClientRect(), bottom = Math.round(r.bottom - tl.getBoundingClientRect().top + 8);
  const sideW = r.right - tr.right - 12 - 14;
  if (sideW >= 460) {
    // wide stage: task + meter + hint form a left column, the screen takes the rest
    mt.style.cssText = `top:${Math.round(tr.bottom - r.top + 8)}px;left:14px;right:auto;width:${Math.round(tr.width)}px`;
    const mr = mt.getBoundingClientRect();
    hint.style.cssText = `top:${Math.round(mr.bottom - r.top + 12)}px;left:16px;width:${Math.round(tr.width) - 4}px;display:block`;
    screen.style.cssText = `left:${Math.round(tr.right - r.left + 12)}px;top:14px;right:14px;bottom:${bottom}px`;
  } else {
    // narrow stage: task top-left, meter top-right, the screen below both
    mt.style.cssText = '';
    hint.style.cssText = 'display:none';
    const mr = mt.getBoundingClientRect();
    const top = Math.round(Math.max(tr.bottom, mr.bottom) - r.top + 8);
    screen.style.cssText = `left:14px;top:${top}px;right:14px;bottom:${bottom}px`;
  }
  screen.classList.toggle('wide', screen.clientWidth >= 640);
}
const ro = new ResizeObserver(() => fit());
[stage, $('#taskBox'), $('#tools')].forEach(x => ro.observe(x));

// ---------- lesson strip ----------
const MINI = {
  prompt: '<rect x="5" y="6" width="34" height="5" rx="2" fill="none" stroke="#72d4e8"/><rect x="5" y="13" width="26" height="5" rx="2" fill="none" stroke="#56627d" stroke-dasharray="2 2"/><rect x="5" y="20" width="30" height="5" rx="2" fill="none" stroke="#72d4e8"/><rect x="44" y="11" width="17" height="9" rx="3" fill="#ffb547"/>',
  verify: '<rect x="5" y="5" width="56" height="20" rx="4" fill="#1a2438"/><path d="M10 11h18" stroke="#e8ecf4" stroke-width="1.4"/><path d="M31 11h24" stroke="#ff8a73" stroke-width="3"/><path d="M10 18h34" stroke="#e8ecf4" stroke-width="1.4"/><path d="M48 16l3 3 6-6" fill="none" stroke="#86e0a8" stroke-width="1.6"/>',
  study: '<circle cx="11" cy="8" r="3" fill="#86e0a8"/><circle cx="11" cy="15" r="3" fill="#86e0a8"/><circle cx="11" cy="22" r="3" fill="none" stroke="#8b96ad"/><path d="M18 8h22M18 15h16M18 22h20" stroke="#e8ecf4" stroke-width="1.4"/><path d="M46 22l6-14 6 14" fill="none" stroke="#ffb547" stroke-width="1.6"/>',
  privacy: '<rect x="6" y="6" width="30" height="18" rx="4" fill="#1a2438"/><path d="M10 12h8" stroke="#e8ecf4" stroke-width="1.4"/><rect x="20" y="10" width="12" height="4" rx="1" fill="#3a4762"/><path d="M10 19h20" stroke="#e8ecf4" stroke-width="1.4"/><rect x="44" y="13" width="14" height="11" rx="2" fill="#ffb547"/><path d="M47 13v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#ffb547" stroke-width="1.8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetState();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  screen.scrollTop = 0;
  renderTools(); renderStrip(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons');
  if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'prompt') {
    const sc = SCEN[S.sc];
    now = `Конструктор запроса (симуляция, ответы ассистента заранее подготовлены). Задача «${sc.name}», базовый запрос «${sc.base}». Сейчас выбрано: ${PARTS.map((p, i) => `${p.name} — ${S.pk[S.sc][p.k] === undefined ? 'нет' : `«${sc.opts[p.k][S.pk[S.sc][p.k]][0]}» (${m.cur.st[i] === 'y' ? 'конкретно' : 'расплывчато'})`}`).join('; ')}. Оценка ${m.cur.score}/5. Отправлено запросов: ${S.sent}${m.last ? `, последний ${m.last.score}/5` : ''}. Пары «расплывчато → точно» готовы для задач: ${SCEN.filter((_, k) => S.pairs[k].v && S.pairs[k].f).map(x => x.name).join(', ') || 'ни одной'}. Не называй, какая фраза конкретная, — спрашивай: «отвечает ли эта фраза на вопрос "сколько?" или "для кого?"».`;
  }
  if (id === 'verify') {
    const c = CARDS[S.c];
    now = `Разметка ошибок в ответах ассистента (симуляция). Открыт ответ «${c.name}»: вопрос «${c.q}». Фразы: ${c.segs.map((s, i) => `${i + 1}) «${s.t.trim()}»${S.mk[S.c][i] ? ' [отмечена как ошибка]' : ''}`).join(' ')}. ${S.sel >= 0 ? `Выбрана фраза ${S.sel + 1}, проверки: ${S.ev[S.c][S.sel].map(k => CHECKS.find(x => x.k === k).name).join(', ') || 'нет'}.` : ''} Разобрано без ошибок: ${m.solved} из ${CARDS.length}. Не говори прямо, какие фразы ошибочны, — подсказывай, какую проверку из чек-листа (источник, оценка, сверка, тест кода) применить.`;
  }
  if (id === 'study') now = `8 запросов к ассистенту нужно разделить на «помогает учиться» и «делает за меня». Ответы ученика: ${REQS.map((r, i) => `${i + 1}) «${r.t}» — ${S.cls[r.id] ? (S.cls[r.id] === 'learn' ? 'учит' : 'за меня') : 'не разобран'}`).join('; ')}. Верно ${m.correct} из ${REQS.length}. План проекта «Вода дома»: ${S.plan.map((p, i) => `${i + 1}. ${PLAN[p]}`).join('; ') || 'пусто'}${m.planOk ? ' (верно)' : ''}. Не давай готовых ответов — спрашивай, что ученик будет уметь после такого ответа ассистента.`;
  if (id === 'privacy') now = `Три части. 1) Сообщение ассистенту: ${MSG.map(x => `«${x.t}»${S.red[x.id] ? ' [скрыто]' : ''}`).join(' ')}; ${S.msgRes ? (S.msgRes.ok ? 'отправлено без лишних данных' : 'отправлено с ошибкой: ' + S.msgRes.note) : 'не отправлено'}. 2) Дипфейки: ${FAKES.map(f => `${f.kind} «${f.title}» — ${S.verd[f.id] === undefined ? 'нет решения' : S.verd[f.id] ? 'ученик: дипфейк' : 'ученик: настоящее'}`).join('; ')}. 3) Предвзятость: ответ «${BIAS.answer}»; ${m.biasOK ? 'разобрано' : 'не разобрано'}. Сейчас открыта часть «${{ msg: 'Сообщение', fake: 'Дипфейки', bias: 'Предвзятость' }[S.p4]}».`;
  return [
    `Раздел: информатика, 8–11 класс, тема «Работа с ИИ-ассистентами». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}». Все ответы ассистента на экране — заранее подготовленные примеры, настоящий ИИ не вызывается.`,
    `Объяснение урока: ${Ls.text.join(' ').replace(/<[^>]+>/g, '')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { prompt: 'Чем конкретная формулировка лучше расплывчатой?', verify: 'Почему ИИ уверенно выдумывает факты?', study: 'Можно ли использовать ИИ для домашнего задания честно?', privacy: 'Как распознать дипфейк-звонок?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Как ИИ-ассистенты используют в профессиях?'];
};

resetState();
setLesson(S.lesson);
fit();
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
