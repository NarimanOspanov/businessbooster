<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: устройство глаза и аккомодация, очки при близорукости и дальнозоркости, фотоаппарат и проектор, микроскоп и телескоп.">
<title>Глаз и оптические приборы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.meter svg{display:block;width:64px;height:64px;margin:8px auto 0}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter svg{width:48px;height:48px}
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M5 20Q20 6 35 20Q20 34 5 20Z" fill="rgba(95,180,217,.12)" stroke="var(--fg)" stroke-width="1.8"/><circle cx="20" cy="20" r="6.5" fill="none" stroke="var(--liq)" stroke-width="2"/><circle cx="20" cy="20" r="2.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Глаз и приборы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов: модель глаза, очки, оптическая скамья с линзой, микроскоп и телескоп."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const sgn = (x, n = 2) => (x > 0 ? '+' : '') + fmt(x, n);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'eye', title: 'Как устроен глаз',
    text: ['Глаз похож на фотоаппарат. Свет проходит через прозрачную роговицу, зрачок — отверстие в радужке, хрусталик и стекловидное тело и попадает на сетчатку. Роговица и хрусталик вместе работают как собирающая линза с оптической силой около 60 дптр.',
           'На сетчатке получается действительное, уменьшенное и перевёрнутое изображение. Светочувствительные клетки — палочки и колбочки — превращают свет в нервные сигналы. По зрительному нерву они идут в мозг, и мозг «переворачивает» картинку обратно.',
           'Расстояние от хрусталика до сетчатки не меняется. Чтобы чётко видеть и далёкое, и близкое, ресничная мышца меняет выпуклость хрусталика. Это аккомодация. Вдаль глаз смотрит с расслабленной мышцей, а вблизи хрусталик становится выпуклее и сильнее. Расстояние наилучшего зрения нормального глаза — 25 см.'],
    why: 'Офтальмологи и оптометристы каждый день измеряют, как работает хрусталик и сетчатка: это основа их профессии. Водителям, пилотам и машинистам нужна справка о зрении — без неё не выдадут права и не возьмут на работу. Тем, кто долго сидит за компьютером (программисты, бухгалтеры, дизайнеры), врачи советуют правило 20-20-20: каждые 20 минут 20 секунд смотреть вдаль, чтобы ресничная мышца отдыхала.',
    task: 'Наведите глаз на резкость по очереди: на горы вдали, на плакат в 1 м и на книгу в 25 см.',
    hint: 'Выберите предмет кнопкой внизу. Кнопками «Мышца −» и «Мышца +» (или ползунком во вкладке «Схема») меняйте выпуклость хрусталика. Чётко — когда лучи сходятся точно на сетчатке.',
    stage: 'Тяните хрусталик вверх или вниз.',
    obj0: 'far', acc0: 2,
    check: m => m.got >= 3 },
  { id: 'glasses', title: 'Очки: минус и плюс',
    text: ['Близорукий человек хорошо видит вблизи и плохо вдаль. Обычно его глазное яблоко чуть длиннее нормы, и лучи от далёких предметов сходятся перед сетчаткой. Помогают рассеивающие линзы — с отрицательной оптической силой.',
           'Дальнозоркий человек плохо видит вблизи: даже напряжённый хрусталик не может собрать лучи от близкого предмета на сетчатке, фокус оказывается за ней. Помогают собирающие линзы — с положительной оптической силой. С возрастом хрусталик теряет упругость, поэтому после 40–45 лет почти всем нужны очки для чтения.',
           'Силу очков пишут в диоптриях: D = 1/F, где F — фокусное расстояние в метрах. «−2» в рецепте — рассеивающая линза с F = −0,5 м. Врач выписывает самую слабую линзу, с которой видно чётко: слишком сильная заставляет глаз всё время напрягаться.'],
    why: 'Подбором очков и контактных линз занимаются оптометристы в салонах оптики, а сами линзы шлифуют и вставляют в оправы мастера-оптики. Близорукость — самое частое нарушение зрения у школьников, поэтому проверка зрения входит в школьный медосмотр, а в поликлинике её делают бесплатно. Хирурги-офтальмологи делают лазерную коррекцию: меняют форму роговицы, и очки становятся не нужны.',
    task: 'Подберите очки двум пациентам: Асель должна чётко видеть горы вдали, а Данияр — читать книгу на 25 см. Выпишите каждому самую слабую подходящую линзу.',
    hint: 'Выберите пациента, двигайте ползунок «Очки» (или кнопки «−0,25» и «+0,25») и смотрите на картинку «Что видит глаз». Когда чётко — нажмите «Выписать рецепт». Формулы — во вкладке «Расчёты».',
    stage: 'Тяните очки вверх или вниз.',
    pat0: 'myo', obj0: 'far', G0: 0,
    check: m => m.rx >= 2 },

const LS_KEY = 'luch-phys-eye';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true, lastUpd = 0;

// ---------- physics ----------
// Eye: thin lens (cornea + crystalline lens) at a fixed distance from the retina. Optical power in dioptres.
const P0 = 1 / 0.017; // relaxed normal eye, retina 1.7 cm behind the lens: ≈ 58,8 дптр
const OBJ = {
  far: { name: 'Горы', d: Infinity, lab: 'далеко', short: 'горы' },
  m1: { name: 'Плакат', d: 1, lab: '1 м', short: 'плакат' },
  book: { name: 'Книга', d: 0.25, lab: '25 см', short: 'книга' },
};
const OBJ_KEYS = ['far', 'm1', 'book'];
const PATS = {
  norm: { name: 'Норма', who: 'нормальное зрение', L: 0.017, A: 10, card: 'Нормальный глаз: чётко видит от 25 см до бесконечности.' },
  myo: { name: 'Асель', who: 'близорукость', L: 1 / (P0 - 2), A: 8, rx: -2, card: 'Асель, 14 лет. Вдаль видит размыто. Дальняя точка ясного зрения — 50 см: дальше всё расплывается.' },
  hyp: { name: 'Данияр', who: 'дальнозоркость', L: 1 / (P0 + 1), A: 2, rx: 3, card: 'Данияр-ага, 50 лет. Газету отодвигает подальше. Ближняя точка ясного зрения — 1 м: ближе всё расплывается.' },
};
const vOf = k => 1 / OBJ[k].d; // dioptres of the object distance, 0 for far
// acc = manual accommodation (lesson 1); otherwise the eye focuses itself as well as it can
function eyeState(patK, objK, G, acc) {
  const p = PATS[patK], need = vOf(objK) + 1 / p.L - G;
  const P = acc == null ? clamp(need, P0, P0 + p.A) : P0 + acc;
  return { need, P, dP: P - need, acc: P - P0, sharp: Math.abs(P - need) <= 0.2 };
}
// Lens on the bench (lesson 3)
const FL = 10, AP = 8, HC = 3; // focal length cm, lens diameter cm, candle height cm
function bench() {
  const d = S.x, s = S.Lc - S.x;
  if (d <= FL + 1e-9) return { d, s, real: false, f: d === FL ? Infinity : d * FL / (d - FL), G: NaN, blur: Infinity, sharp: false };
  const f = d * FL / (d - FL), blur = AP * Math.abs(f - s) / f;
  return { d, s, real: true, f, G: f / d, blur, sharp: blur <= 0.3 };
}
// Microscope and telescope (lesson 4): vergence of the beam leaving the eyepiece, dioptres
const MF1 = 2, MF2 = 2.5, MT = 20; // microscope: objective F, eyepiece F, distance between lenses (cm)
const verg = (F2, s2) => Math.abs(s2) < 1e-6 ? Infinity : 100 * (1 / F2 - 1 / s2);
const vErr = V => !isFinite(V) ? 99 : V > 0.25 ? V - 0.25 : V < -4 ? -4 - V : 0; // a young eye copes with −4…0 дптр
const OBJECTIVES = [40, 60, 90], EYEPIECES = [2, 3, 5];
function micro() {
  const d1 = S.d1, f1 = d1 * MF1 / (d1 - MF1), s2 = MT - f1, V = verg(MF2, s2), e = vErr(V);
  return { d1, f1, s2, V, err: e, sharp: e === 0, Gob: f1 / d1, Gok: 25 / MF2, G: f1 / d1 * 25 / MF2 };
}
function tele() {
  const s2 = S.T - S.F1, V = verg(S.F2, s2), e = vErr(V);
  return { s2, V, err: e, sharp: e === 0, G: S.F1 / S.F2 };
}

function resetState() {
  const Ls = L();
  Object.assign(S, {
    obj: Ls.obj0 || 'far', acc: Ls.acc0 == null ? 0 : Ls.acc0, got: {},
    pat: Ls.pat0 || 'myo', G: Ls.G0 || 0, rx: {},
    x: Ls.x0 || 30, Lc: Ls.Lc0 || 60, found: {},
    mode: Ls.mode0 || 'micro', d1: Ls.d10 || 2.4, F1: Ls.F10 || 60, F2: Ls.F20 || 5, T: Ls.T0 || 50, ok: {}, teleMsg: '',
    hl: null,
  });
}

function model() {
  const id = LID();
  if (id === 'eye') { const e = eyeState('norm', S.obj, 0, S.acc); return { kind: id, e, got: OBJ_KEYS.filter(k => S.got[k]).length }; }
  if (id === 'glasses') return { kind: id, e: eyeState(S.pat, S.obj, S.G), far: eyeState(S.pat, 'far', S.G), near: eyeState(S.pat, 'book', S.G), rx: ['myo', 'hyp'].filter(k => S.rx[k]).length };
  if (id === 'camera') { const b = bench(); return Object.assign({ kind: id, found: ['small', 'big'].filter(k => S.found[k]).length }, b); }
  return { kind: id, mi: micro(), te: tele(), micro: !!S.ok.micro, tele: !!S.ok.tele };
}

function track() {
  const id = LID();
  if (id === 'eye') {
    const e = eyeState('norm', S.obj, 0, S.acc);
    if (e.sharp && !S.got[S.obj]) {
      S.got[S.obj] = true;
      const n = OBJ_KEYS.filter(k => S.got[k]).length;
      toast(`Чётко: ${OBJ[S.obj].short}! Хрусталик ${S.acc ? `сильнее на ${fmt(S.acc, 2)} дптр` : 'расслаблен'}. ${n < 3 ? `Готово ${n} из 3.` : 'Все 3 предмета!'}`);
    }
  }
  if (id === 'camera') {
    const b = bench();
    if (b.sharp) {
      const k = b.G < 0.95 ? 'small' : b.G > 1.05 ? 'big' : null;
      if (k && !S.found[k]) {
        S.found[k] = true;
        toast(k === 'small' ? `Резко! Изображение уменьшенное, Г ≈ ${fmt(b.G, 2)}. Так работает фотоаппарат.` : `Резко! Изображение увеличенное, Г ≈ ${fmt(b.G, 1)}. Так работает проектор.`);
      }
    }
  }
  if (id === 'scopes') {
    if (S.mode === 'micro') {
      const m = micro();
      if (m.sharp && !S.ok.micro) { S.ok.micro = true; toast(`Клетки чёткие! Увеличение микроскопа ≈ ${fmt(m.G, 0)}×.`); }
    } else {
      const t = tele();
      if (t.sharp) {
        if (Math.abs(t.G - 30) < 1e-9) { if (!S.ok.tele) { S.ok.tele = true; toast('Луна в резкости, увеличение 30×!'); } }
        else { const key = S.F1 + '/' + S.F2; if (S.teleMsg !== key) { S.teleMsg = key; toast(`Резко, но увеличение ${fmt(t.G, 1)}×. Нужно ровно 30×.`); } }
      }
    }
  }
}

// ---------- drawing helpers ----------
const f1 = x => (+x).toFixed(1);
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
const ln = (a, b, c, w = 1.5, extra = '') => `<path d="M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}" stroke="${c}" stroke-width="${w}" fill="none" ${extra}/>`;
const poly = (pts, c, w = 1.6, extra = '') => `<path d="M${pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L')}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linejoin="round" ${extra}/>`;
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
// thin lens shape: conv > 0 converging, < 0 diverging, 0 flat plate
function lensSVG(x, y, hh, conv, extra = '') {
  const w = 7;
  let d;
  if (conv > 0) d = `M${f1(x)} ${f1(y - hh)}Q${f1(x + 2.2 * w)} ${f1(y)} ${f1(x)} ${f1(y + hh)}Q${f1(x - 2.2 * w)} ${f1(y)} ${f1(x)} ${f1(y - hh)}Z`;
  else if (conv < 0) d = `M${f1(x - w)} ${f1(y - hh)}L${f1(x + w)} ${f1(y - hh)}Q${f1(x + 1)} ${f1(y)} ${f1(x + w)} ${f1(y + hh)}L${f1(x - w)} ${f1(y + hh)}Q${f1(x - 1)} ${f1(y)} ${f1(x - w)} ${f1(y - hh)}Z`;
  else d = `M${f1(x - 3)} ${f1(y - hh)}H${f1(x + 3)}V${f1(y + hh)}H${f1(x - 3)}Z`;
  return `<path d="${d}" fill="rgba(150,210,240,.22)" stroke="#9fd6ea" stroke-width="1.5" ${extra}/>`;
}
// paraxial ray tracing through thin lenses; units are cm, returns points
function trace(x0, y0, u, lenses, xEnd) {
  const pts = [[x0, y0]];
  let x = x0, y = y0;
  for (const l of lenses) { if (l.x <= x) continue; y += u * (l.x - x); x = l.x; pts.push([x, y]); u -= y / l.F; }
  y += u * (xEnd - x); pts.push([xEnd, y]);
  return pts;
}
// small picture "what the eye sees"
function viewSVG(kind, sd, x, y, w, h, round, mag) {
  const cx = x + w / 2, cy = y + h / 2;
  const clip = round ? `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(w / 2)}"/>` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>`;
  let bgc = '#22324d', c = '';
  if (kind === 'far') {
    c = `<circle cx="${x + w - 28}" cy="${y + 24}" r="9" fill="#ffd54a"/><path d="M${x} ${y + h}L${x + 22} ${y + 52}L${x + 40} ${y + 66}L${x + 70} ${y + 30}L${x + 98} ${y + 62}L${x + 120} ${y + 44}L${x + w} ${y + 70}V${y + h}Z" fill="#5d6a86"/><path d="M${x + 62} ${y + 40}L${x + 70} ${y + 30}L${x + 79} ${y + 41}L${x + 72} ${y + 38}Z" fill="#fff"/><path d="M${x + 114} ${y + 50}L${x + 120} ${y + 44}L${x + 128} ${y + 50}Z" fill="#fff"/><rect x="${x}" y="${y + h - 14}" width="${w}" height="14" fill="#2f5e3a"/>`;
  } else if (kind === 'm1') {
    bgc = '#3a4762';
    c = `<rect x="${cx - 46}" y="${y + 10}" width="92" height="${h - 20}" fill="#eef1f6"/>` + T(cx, y + 46, 26, '#111', 'Ш Б', 'middle', 'font-weight="700"') + T(cx, y + 70, 14, '#111', 'М Н К', 'middle', 'font-weight="700"') + T(cx, y + 84, 8, '#111', 'Ы М Б Ш');
  } else if (kind === 'book') {
    bgc = '#efe9dc';
    c = T(x + 10, y + 24, 13, '#222', 'Луч светит', 'start', 'font-weight="700"') + ['всем, кто хочет', 'понять, как устроен', 'мир вокруг нас.', 'Глава 8. Оптика'].map((t, i) => T(x + 10, y + 42 + i * 13, 9.5, '#333', t, 'start')).join('');
  } else if (kind === 'cells') {
    bgc = '#d6ead0';
    const k = mag / 78;
    [[0, 0, 26, 15, 20], [-34, -22, 20, 13, -30], [30, 24, 22, 12, 40], [-26, 30, 18, 11, 10], [38, -26, 19, 12, -15]].forEach(([dx, dy, rx, ry, r]) => {
      c += `<g transform="translate(${f1(cx + dx * k)} ${f1(cy + dy * k)}) rotate(${r}) scale(${f1(k)})"><ellipse rx="${rx}" ry="${ry}" fill="#a9d39a" stroke="#4f8a45" stroke-width="2"/><circle cx="${rx * 0.25}" cy="0" r="${ry * 0.38}" fill="#6e5aa6"/></g>`;
    });
  } else if (kind === 'moon') {
    bgc = '#05070c';
    const r = Math.min(160, 1.7 * mag);
    c = `<circle cx="${x + 14}" cy="${y + 18}" r="1" fill="#fff"/><circle cx="${x + w - 18}" cy="${y + h - 20}" r="1" fill="#fff"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="#d9d4c4"/>` +
      [[-0.3, -0.25, 0.22], [0.25, 0.1, 0.16], [-0.1, 0.35, 0.12], [0.35, -0.4, 0.1], [0.05, -0.05, 0.08]].map(([a, b, q]) => `<circle cx="${f1(cx + a * r)}" cy="${f1(cy + b * r)}" r="${f1(q * r)}" fill="#a9a393"/>`).join('');
  }
  const blur = sd > 0.05 ? `filter="url(#vblur)"` : '';
  return `<defs><clipPath id="vclip">${clip}</clipPath><filter id="vblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${sd.toFixed(2)}"/></filter></defs>
    <g clip-path="url(#vclip)"><rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" fill="${bgc}"/><g ${blur}>${c}</g></g>` +
    (round ? `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(w / 2)}" fill="none" stroke="#8b96ad" stroke-width="3"/>` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="#8b96ad" stroke-width="1.5"/>`);
}

// ---------- lessons 1-2: the eye ----------
const EYE = { cx: 370, cy: 210, R: 95, lx: 312, gx: 224, ox: 70 };
const eyeGeo = patK => { const rx = EYE.R + (PATS[patK].L - 0.017) * 20000, front = EYE.cx - EYE.R; return { rx, ecx: front + rx, xr: front + 2 * rx }; };
function objIcon(k) {
  const { ox, cy } = EYE;
  if (k === 'far') return `<path d="M${ox - 42} ${cy + 18}L${ox - 18} ${cy - 16}L${ox - 4} ${cy}L${ox + 16} ${cy - 28}L${ox + 44} ${cy + 18}Z" fill="#5d6a86" stroke="#8b96ad"/><path d="M${ox + 9} ${cy - 18}L${ox + 16} ${cy - 28}L${ox + 23} ${cy - 18}Z" fill="#fff"/>` + T(ox, cy + 36, 10, '#c8d0dd', 'горы · далеко', 'middle', halo);
  if (k === 'm1') return `<rect x="${ox - 20}" y="${cy - 26}" width="40" height="44" rx="2" fill="#eef1f6" stroke="#8b96ad"/>` + T(ox, cy - 3, 15, '#111', 'Ш Б', 'middle', 'font-weight="700"') + T(ox, cy + 12, 8, '#111', 'М Н К') + T(ox, cy + 36, 10, '#c8d0dd', 'плакат · 1 м', 'middle', halo);
  return `<path d="M${ox - 22} ${cy - 12}L${ox} ${cy - 8}L${ox + 22} ${cy - 12}V${cy + 12}L${ox} ${cy + 16}L${ox - 22} ${cy + 12}Z" fill="#efe9dc" stroke="#8b96ad"/><path d="M${ox} ${cy - 8}V${cy + 16}" stroke="#8b96ad"/>` +
    [-4, 1, 6].map(dy => ln([ox - 18, cy + dy], [ox - 4, cy + dy + 1], '#555', 1) + ln([ox + 4, cy + dy + 1], [ox + 18, cy + dy], '#555', 1)).join('') + T(ox, cy + 36, 10, '#c8d0dd', 'книга · 25 см', 'middle', halo);
}
const objTop = k => k === 'far' ? [EYE.ox + 16, EYE.cy - 28] : k === 'm1' ? [EYE.ox, EYE.cy - 26] : [EYE.ox, EYE.cy - 12];
function eyeScene(e, patK, G) {
  const { cx, cy, R, lx, gx } = EYE, { rx, ecx, xr } = eyeGeo(patK), acc = clamp(e.acc, 0, 10);
  const pr = 24; // pupil half-height in px
  let h = '';
  h += objIcon(S.obj);
  // eyeball
  h += `<ellipse cx="${f1(ecx)}" cy="${cy}" rx="${f1(rx)}" ry="${R}" fill="rgba(95,180,217,.07)" stroke="#c8d0dd" stroke-width="2.5"/>`;
  const ret = []; for (let t = -64; t <= 64; t += 4) { const a = t * Math.PI / 180; ret.push([ecx + (rx - 4) * Math.cos(a), cy + (R - 4) * Math.sin(a)]); }
  h += poly(ret, '#e0787a', 3.2, 'opacity=".9"');
  const na = 22 * Math.PI / 180, np = [ecx + rx * Math.cos(na), cy + R * Math.sin(na)];
  h += `<path d="M${f1(np[0] - 4)} ${f1(np[1] - 8)}L${f1(np[0] + 44)} ${f1(np[1] + 4)}L${f1(np[0] + 40)} ${f1(np[1] + 20)}L${f1(np[0] - 6)} ${f1(np[1] + 10)}Z" fill="#d8b58f" stroke="#a88560"/>`;
  h += `<ellipse cx="${f1(xr - 4)}" cy="${cy}" rx="3" ry="7" fill="#ffd54a"/>`;
  // cornea, iris, ciliary muscle, lens
  h += `<path d="M${cx - 80} ${cy - 50}Q${cx - 122} ${cy} ${cx - 80} ${cy + 50}" fill="rgba(95,180,217,.16)" stroke="#9fd6ea" stroke-width="2"/>`;
  h += ln([cx - 70, cy - 52], [cx - 70, cy - pr - 3], '#a0714a', 5, 'stroke-linecap="round"') + ln([cx - 70, cy + pr + 3], [cx - 70, cy + 52], '#a0714a', 5, 'stroke-linecap="round"');
  const crx = 6 + acc * 0.35;
  h += `<g data-drag="lens">` + [-1, 1].map(s => `<ellipse cx="${lx}" cy="${cy + s * 52}" rx="${f1(crx)}" ry="9" fill="#c47a7a" stroke="#e0a0a0"/>` + ln([lx, cy + s * 43], [lx, cy + s * 27], '#e0a0a0', 1, 'stroke-dasharray="2 2"')).join('');
  h += `<rect x="${lx - 26}" y="${cy - 40}" width="52" height="80" fill="transparent"/><ellipse cx="${lx}" cy="${cy}" rx="${f1(8 + acc * 1.1)}" ry="27" fill="rgba(255,226,170,.28)" stroke="#ffd9a0" stroke-width="1.8"/></g>`;
  // glasses
  if (G != null) {
    h += `<g data-drag="glasses"><rect x="${gx - 22}" y="${cy - 52}" width="44" height="104" fill="transparent"/>` + lensSVG(gx, cy, 42, G) + `</g>` + ln([gx, cy - 42], [gx + 40, cy - 56], '#8b96ad', 2) + T(gx, cy + 62, 10, '#e8ecf4', G === 0 ? 'без очков' : `очки ${sgn(G, 2)} дптр`, 'middle', halo);
  }
  // rays: object -> (glasses) -> eye lens -> focus
  const xf = clamp(xr - 22 * e.dP, lx + 30, xr + 75);
  const col = e.sharp ? '#86e0a8' : '#ff6a55';
  const src = S.obj === 'far' ? null : [EYE.ox + 26, cy];
  let spot = 0;
  for (const s of [-1, 1]) {
    const pts = [];
    const yg = pr * (1 + 0.045 * (G || 0));
    if (G != null) {
      pts.push(src ? src : [118, cy + s * yg]);
      pts.push([gx, cy + s * yg]);
    } else pts.push(src ? src : [118, cy + s * pr]);
    pts.push([lx, cy + s * pr]);
    h += poly(pts, '#ff6a55', 1.6, 'opacity=".9"');
    const yAt = X => cy + s * pr * (1 - (X - lx) / (xf - lx));
    const yr = yAt(xr - 3);
    spot = Math.abs(yr - cy);
    if (xf < xr) h += poly([[lx, cy + s * pr], [xf, cy], [xr - 3, yr]], col, 1.6);
    else { h += poly([[lx, cy + s * pr], [xr - 3, yr]], col, 1.6) + poly([[xr - 3, yr], [xf, cy]], col, 1.2, 'stroke-dasharray="4 4" opacity=".7"'); }
  }
  h += `<circle cx="${f1(xf)}" cy="${cy}" r="3" fill="${col}"/>` + (xf < xr - 24 ? T(xf, cy - 10, 9, col, 'фокус', 'middle', halo) : T(xf - 8, cy - 9, 9, col, 'фокус', 'end', halo));
  if (spot > 2) h += ln([xr - 3, cy - spot], [xr - 3, cy + spot], '#ff6a55', 5, 'opacity=".45" stroke-linecap="round"');
  // chief ray from the top of the object -> inverted image on the retina
  const tp = objTop(S.obj), yi = cy + (cy - tp[1]) * (xr - 3 - lx) / (lx - tp[0]);
  h += ln(tp, [lx, cy], '#ffd54a', 1, 'stroke-dasharray="3 3" opacity=".7"') + ln([lx, cy], [xr - 3, yi], '#ffd54a', 1, 'stroke-dasharray="3 3" opacity=".7"');
  h += ln([xr - 5, cy], [xr - 5, yi], e.sharp ? '#86e0a8' : '#ffb547', 3, 'stroke-linecap="round"');
  h += T(xr - 14, cy + 26, 9, '#c8d0dd', 'изображение', 'end', halo);
  h += T(lx, cy - 74, 9.5, '#ffd9a0', 'хрусталик', 'middle', halo) + T(xr - 16, cy - 72, 9.5, '#e0787a', 'сетчатка', 'end', halo);
  // view
  h += T(16, 296, 10, '#c8d0dd', 'что видит глаз', 'start', halo);
  h += viewSVG(S.obj, Math.min(8, Math.abs(e.dP) * 2.6), 16, 302, 150, 100, false);
  h += T(510, 418, 9, '#8b96ad', 'схема не в масштабе', 'end');
  return h;
}

// ---------- lesson 3: optical bench ----------
const BK = 6.6, BY = 245;
const bx = () => 260 - BK * S.Lc / 2;
const BX = x => bx() + BK * x, BYy = y => BY - BK * y;
function candleSVG(x0, k, op = 1, extra = '') { // x0 px at axis, k px per cm (negative = inverted)
  const y = c => f1(BY - k * c);
  const w = Math.abs(k) * 0.6;
  return `<g opacity="${op}" ${extra}><rect x="${f1(x0 - w)}" y="${k > 0 ? y(2.2) : y(0)}" width="${f1(2 * w)}" height="${f1(Math.abs(k) * 2.2)}" fill="#e8e0cc" stroke="#b8ae96"/><path d="M${f1(x0)} ${y(2.2)}V${y(2.4)}" stroke="#333" stroke-width="1.2"/><ellipse cx="${f1(x0)}" cy="${y(2.65)}" rx="${f1(Math.abs(k) * 0.28)}" ry="${f1(Math.abs(k) * 0.38)}" fill="#ffb547"/><ellipse cx="${f1(x0)}" cy="${y(2.6)}" rx="${f1(Math.abs(k) * 0.13)}" ry="${f1(Math.abs(k) * 0.2)}" fill="#fff3c4"/></g>`;
}
function benchScene() {
  const b = bench(), d = S.x, Lc = S.Lc, P = (x, y) => [BX(x), BYy(y)];
  let h = '';
  // rail with scale
  const ry = BY + 104;
  h += `<rect x="${f1(BX(-3))}" y="${ry}" width="${f1(BK * (Lc + 6))}" height="10" rx="3" fill="#2a3346" stroke="#3a4762"/>`;
  for (let c = 0; c <= Lc; c += 5) h += ln([BX(c), ry], [BX(c), ry + (c % 10 ? 4 : 7)], '#8b96ad', 1) + (c % 10 === 0 ? T(BX(c), ry + 22, 8.5, '#8b96ad', c) : '');
  h += T(BX(Lc) + 14, ry + 22, 8.5, '#8b96ad', 'см', 'start');
  h += ln([BX(-3), BY], [BX(Lc + 3), BY], '#3a4762', 1, 'stroke-dasharray="6 4"');
  // stands
  for (const x of [0, d, Lc]) h += ln([BX(x), BY + (x === d ? AP / 2 * BK : 0)], [BX(x), ry], '#3a4762', 2);
  // focal points
  for (const k of [-2, -1, 1, 2]) { const x = d + k * FL; if (x < -2 || x > Lc + 2) continue; h += `<circle cx="${f1(BX(x))}" cy="${BY}" r="2.6" fill="#72d4e8"/>` + T(BX(x), BY + 14, 9, '#72d4e8', (Math.abs(k) === 2 ? '2F' : 'F')); }
  // screen
  h += `<rect x="${f1(BX(Lc))}" y="${f1(BYy(14))}" width="6" height="${f1(BK * 28)}" fill="#c8d0dd" stroke="#8b96ad"/>` + T(BX(Lc) + 3, BYy(14) - 6, 9.5, '#c8d0dd', 'экран', 'middle', halo);
  // light cone and rays from the flame tip (0, HC)
  const top = [d, AP / 2], bot = [d, -AP / 2];
  const after = (yl, u) => { const u2 = u - yl / FL; return [Lc, yl + u2 * (Lc - d)]; };
  const sT = after(AP / 2, (AP / 2 - HC) / d), sB = after(-AP / 2, (-AP / 2 - HC) / d);
  h += `<path d="M${P(0, HC).map(f1).join(' ')}L${P(...top).map(f1).join(' ')}L${P(...sT).map(f1).join(' ')}L${P(...sB).map(f1).join(' ')}L${P(...bot).map(f1).join(' ')}Z" fill="rgba(255,213,74,.10)" fill-rule="nonzero"/>`;
  const r1 = [[0, HC], [d, HC], after(HC, 0)], r2 = [[0, HC], [d, 0], [Lc, HC - HC / d * Lc]];
  h += poly(r1.map(p => P(...p)), '#ff6a55', 1.6) + poly(r2.map(p => P(...p)), '#ffd54a', 1.6);
  if (b.real) {
    const yl = HC - HC / (d - FL) * d; // ray through the front focus hits the lens at the image height
    if (Math.abs(yl) <= AP / 2) h += poly([P(0, HC), P(d, yl), P(Lc, yl)], '#c58bff', 1.4);
  }
  // lens
  h += `<g data-drag="lens"><rect x="${f1(BX(d) - 18)}" y="${f1(BYy(AP / 2) - 6)}" width="36" height="${f1(BK * AP + 12)}" fill="transparent"/>` + lensSVG(BX(d), BY, BK * AP / 2, 1) + `</g>` + T(BX(d), BYy(AP / 2) - 8, 9.5, '#9fd6ea', 'линза', 'middle', halo);
  h += candleSVG(BX(0), BK) + T(BX(0), BYy(HC) - 12, 9.5, '#ffd54a', 'свеча', 'middle', halo);
  // image: where it really is (ghost) and what the screen shows
  if (b.real && isFinite(b.f)) {
    const xi = d + b.f;
    if (!b.sharp && xi < Lc + 30 && Math.abs(b.G) < 6) h += candleSVG(BX(xi), -BK * b.G, 0.45, 'stroke-dasharray="3 3"') + T(BX(xi), BY - 12 + BK * HC * b.G + 20, 8.5, '#c8d0dd', 'изображение', 'middle', halo);
    const sd = Math.min(9, b.blur * BK * 0.7);
    h += `<defs><filter id="sblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${sd.toFixed(2)}"/></filter></defs>`;
    if (b.sharp) h += candleSVG(BX(Lc) - 3, -BK * b.G);
    else { const yT = BYy(sT[1]), yB = BYy(sB[1]); h += `<rect x="${f1(BX(Lc) - 4)}" y="${f1(Math.min(yT, yB))}" width="5" height="${f1(Math.max(2, Math.abs(yT - yB)))}" fill="#ffd54a" opacity=".55" filter="url(#sblur)"/>`; }
  } else h += T(BX(Lc) - 8, BY - 40, 9.5, '#ffb547', 'd < F: изображение мнимое', 'end', halo);
  if (!drag && !S.found.small && !S.found.big && d === 30) h += T(BX(d), BY + 66, 9, '#ffb547', '↔ тяните', 'middle', halo);
  return h;
}

// ---------- lesson 4: microscope and telescope ----------
const MY = 200;
const MKX = 18, MKY = 400, MX0 = 40, MH = 0.02; // microscope drawing scales, object height 0.2 mm
const TKX = 4.2, TKY = 20, TX0 = 64, TH = 0.012; // telescope; TH = angle of incoming light, rad
function microScene() {
  const m = micro(), d1 = S.d1, x2 = d1 + MT, P = (x, y) => [MX0 + MKX * x, MY - MKY * y];
  const lenses = [{ x: d1, F: MF1 }, { x: x2, F: MF2 }];
  let h = '';
  h += `<rect x="${f1(P(d1, 0)[0])}" y="${f1(MY - MKY * 0.27)}" width="${f1(MKX * MT)}" height="${f1(MKY * 0.54)}" rx="6" fill="rgba(139,150,173,.06)" stroke="#3a4762" stroke-dasharray="5 4"/>` + T(P(d1 + MT / 2, 0)[0], MY - MKY * 0.27 - 8, 9.5, '#8b96ad', 'тубус 20 см', 'middle', halo);
  h += ln(P(-1, 0), P(x2 + 3, 0), '#3a4762', 1, 'stroke-dasharray="6 4"');
  // slide and specimen
  h += `<rect x="${f1(P(0, 0)[0] - 3)}" y="${MY - 70}" width="4" height="140" fill="rgba(170,215,235,.25)" stroke="#bfe3f2"/>` + ln(P(0, 0), P(0, MH), '#86e0a8', 2.4, 'stroke-linecap="round"') + T(P(0, 0)[0], MY + 86, 9, '#c8d0dd', 'предмет', 'middle', halo);
  // focal marks
  const fm = (x, lab) => `<circle cx="${f1(P(x, 0)[0])}" cy="${MY}" r="2.4" fill="#72d4e8"/>` + T(P(x, 0)[0], MY + 13, 8.5, '#72d4e8', lab);
  h += fm(d1 + MF1, 'F₁') + fm(x2 - MF2, 'F₂');
  // rays from the specimen tip
  const xe = x2 + 3;
  const rays = [trace(0, MH, 0, lenses, xe), trace(0, MH, -MH / d1, lenses, xe), trace(0, MH, (-0.08 - MH) / d1, lenses, xe)];
  const cols = ['#ff6a55', '#ffd54a', '#c58bff'];
  rays.forEach((r, i) => { h += poly(r.map(p => P(...p)), cols[i], 1.4, 'opacity=".9"'); });
  // intermediate image
  const xi = d1 + m.f1, hi = -MH * m.f1 / d1;
  if (xi < x2 + 4) h += ln(P(xi, 0), P(xi, hi), m.sharp ? '#86e0a8' : '#ffb547', 2.4, 'stroke-dasharray="4 3"') + T(P(xi, 0)[0], P(xi, hi)[1] + 14, 8.5, '#c8d0dd', 'изображение', 'middle', halo);
  h += `<g data-drag="obj">` + `<rect x="${f1(P(d1, 0)[0] - 14)}" y="${f1(MY - MKY * 0.12 - 4)}" width="28" height="${f1(MKY * 0.24 + 8)}" fill="transparent"/>` + lensSVG(P(d1, 0)[0], MY, MKY * 0.12, 1) + `</g>` + T(P(d1, 0)[0] + 4, MY + MKY * 0.12 + 16, 9.5, '#9fd6ea', 'объектив', 'start', halo);
  h += lensSVG(P(x2, 0)[0], MY, MKY * 0.25, 1) + T(P(x2, 0)[0], MY + MKY * 0.25 + 14, 9.5, '#9fd6ea', 'окуляр', 'middle', halo);
  h += T(P(x2 + 3, 0)[0], MY - 108, 9, '#8b96ad', 'к глазу →', 'end');
  h += T(200, 314, 10, '#c8d0dd', 'в окуляре', 'middle', halo) + viewSVG('cells', Math.min(8, m.err * 0.9), 155, 320, 90, 90, true, m.G);
  h += T(510, 418, 9, '#8b96ad', 'по высоте растянуто в 22 раза', 'end');
  return h;
}
function teleScene() {
  const t = tele(), P = (x, y) => [TX0 + TKX * x, MY - TKY * y], lenses = [{ x: 0, F: S.F1 }, { x: S.T, F: S.F2 }];
  let h = '';
  h += `<rect x="${TX0}" y="${MY - TKY * 2.7}" width="${f1(TKX * S.T)}" height="${f1(TKY * 5.4)}" rx="6" fill="rgba(139,150,173,.06)" stroke="#3a4762" stroke-dasharray="5 4"/>`;
  h += ln(P(-9, 0), P(S.T + 9, 0), '#3a4762', 1, 'stroke-dasharray="6 4"');
  const fm = (x, lab) => `<circle cx="${f1(P(x, 0)[0])}" cy="${MY}" r="2.4" fill="#72d4e8"/>` + T(P(x, 0)[0], MY + 13, 8.5, '#72d4e8', lab);
  h += fm(S.F1, 'F₁') + fm(S.T - S.F2, 'F₂');
  const xe = S.T + 8;
  [2, 0, -2].forEach((y0, i) => { const r = trace(-8, y0 + TH * 8, -TH, lenses, xe); h += poly(r.map(p => P(...p)), ['#ff6a55', '#ffd54a', '#c58bff'][i], 1.4, 'opacity=".9"'); });
  h += ln(P(S.F1, 0), P(S.F1, -TH * S.F1), t.sharp ? '#86e0a8' : '#ffb547', 2.4, 'stroke-dasharray="4 3"');
  h += lensSVG(P(0, 0)[0], MY, TKY * 2.5, 1) + T(P(0, 0)[0], MY + TKY * 2.5 + 16, 9.5, '#9fd6ea', `объектив F₁ = ${S.F1} см`, 'start', halo);
  h += `<g data-drag="eyep"><rect x="${f1(P(S.T, 0)[0] - 16)}" y="${MY - TKY * 1.4 - 4}" width="32" height="${TKY * 2.8 + 8}" fill="transparent"/>` + lensSVG(P(S.T, 0)[0], MY, TKY * 1.4, 1) + `</g>` + T(P(S.T, 0)[0], MY - TKY * 1.4 - 10, 9.5, '#9fd6ea', `окуляр F₂ = ${S.F2} см`, 'end', halo);
  h += T(P(-8, 0)[0], MY - 64, 9, '#8b96ad', 'свет Луны →', 'start');
  h += T(200, 314, 10, '#c8d0dd', 'в окуляре', 'middle', halo) + viewSVG('moon', Math.min(8, t.err * 0.6), 155, 320, 90, 90, true, t.G);
  h += T(510, 418, 9, '#8b96ad', 'по высоте растянуто в 5 раз', 'end');
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'eye' || lid === 'glasses') {
    const { cx, cy, lx, gx, ox } = EYE, g = eyeGeo(lid === 'eye' ? 'norm' : S.pat);
    return ({ cornea: [cx - 112, cy - 56, 44, 112], iris: [cx - 80, cy - 58, 20, 116], lens: [lx - 24, cy - 32, 48, 64], cil: [lx - 16, cy - 66, 32, 132], retina: [g.xr - 50, cy - 90, 60, 180], macula: [g.xr - 14, cy - 14, 22, 28], nerve: [g.xr - 20, cy + 20, 60, 50], vitreous: [lx + 10, cy - 80, g.xr - lx - 20, 160], glasses: [gx - 24, cy - 50, 48, 100], view: [10, 284, 162, 124], obj: [ox - 46, cy - 34, 92, 80] })[id];
  }
  if (lid === 'camera') {
    const b = bench();
    return ({ candle: [BX(0) - 16, BYy(HC) - 10, 32, BK * HC + 14], lens: [BX(S.x) - 16, BYy(AP / 2) - 6, 32, BK * AP + 12], F: [BX(S.x - 2 * FL) - 10, BY - 10, BK * 4 * FL + 20, 30], screen: [BX(S.Lc) - 10, BYy(14) - 8, 22, BK * 28 + 16], rays: [BX(0), BYy(AP / 2) - 8, BK * S.Lc, BK * AP + 16], image: b.real ? [BX(Math.min(S.Lc, S.x + b.f)) - 22, BY - 6, 44, Math.min(120, BK * HC * b.G + 14)] : null, rail: [BX(-3), BY + 96, BK * (S.Lc + 6), 34] })[id];
  }
  if (S.mode === 'micro') {
    const P = x => MX0 + MKX * x, m = micro();
    return ({ spec: [P(0) - 10, MY - 74, 20, 148], objective: [P(S.d1) - 14, MY - 54, 28, 108], tube: [P(S.d1), MY - 112, MKX * MT, 224], inter: [P(S.d1 + m.f1) - 14, MY - 4, 28, 80], eyepiece: [P(S.d1 + MT) - 14, MY - 104, 28, 208], view: [150, 300, 100, 114], focus: [P(S.d1 + MF1) - 10, MY - 10, 20, 30] })[id];
  }
  const P = x => TX0 + TKX * x;
  return ({ objective: [P(0) - 14, MY - 54, 28, 108], tube: [P(0), MY - 58, TKX * S.T, 116], inter: [P(S.F1) - 12, MY - 6, 24, 30], eyepiece: [P(S.T) - 14, MY - 34, 28, 68], view: [150, 300, 100, 114], focus: [P(S.F1) - 10, MY - 10, 20, 30] })[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = bg();
  if (id === 'eye') h += eyeScene(eyeState('norm', S.obj, 0, S.acc), 'norm', null);
  else if (id === 'glasses') h += eyeScene(eyeState(S.pat, S.obj, S.G), S.pat, S.G);
  else if (id === 'camera') h += benchScene();
  else h += S.mode === 'micro' ? microScene() : teleScene();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 440, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 430 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- setters ----------
const setAcc = v => { S.acc = clamp(Math.round(v * 4) / 4, 0, 10); dirty = true; };
const setG = v => { S.G = clamp(Math.round(v * 4) / 4, -5, 5); dirty = true; };
const setX = v => { S.x = clamp(Math.round(v * 10) / 10, 1, S.Lc - 1); dirty = true; };
const setLc = v => { S.Lc = clamp(Math.round(v), 30, 70); S.x = clamp(S.x, 1, S.Lc - 1); dirty = true; };
const setD1 = v => { S.d1 = clamp(Math.round(v * 1000) / 1000, 2.15, 2.6); dirty = true; };
const setT = v => { S.T = clamp(Math.round(v * 20) / 20, 30, 100); dirty = true; };

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const throttled = () => { const n = performance.now(); if (n - lastUpd > 100) { lastUpd = n; update(); } };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const p = toSvg(e);
  drag = { id: el.dataset.drag, x: p.x, y: p.y, acc: S.acc, G: S.G, lx: S.x, d1: S.d1, T: S.T };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSvg(e), dx = p.x - drag.x, dy = p.y - drag.y;
  if (drag.id === 'lens' && LID() === 'eye') setAcc(drag.acc - dy / 8);
  else if (drag.id === 'lens' && LID() === 'glasses') return;
  else if (drag.id === 'glasses') setG(drag.G - dy / 10);
  else if (drag.id === 'lens') setX(drag.lx + dx / BK);
  else if (drag.id === 'obj') setD1(drag.d1 + dx / MKX / 10);
  else if (drag.id === 'eyep') setT(drag.T + dx / TKX);
  throttled();
});
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); update(); };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed, cls) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}${cls ? ` class="${cls}"` : ''}>${label}</button>`;

function act(a) {
  const [k, v] = a.split(':');

  else if (k === 'acc') { setAcc(S.acc + +v); }
  else if (k === 'pat') { S.pat = v; }
  else if (k === 'objc') { S.obj = OBJ_KEYS[(OBJ_KEYS.indexOf(S.obj) + 1) % 3]; }
  else if (k === 'g') { setG(S.G + +v); }
  else if (k === 'gset') { setG(+v); }
  else if (k === 'rx') { prescribe(); }
  else if (k === 'mv') { setX(S.x + +v); }
  else if (k === 'mode') { S.mode = v; }
  else if (k === 'd1') { setD1(S.d1 + +v); }
  else if (k === 'T') { setT(S.T + +v); }
  else if (k === 'F1c') { S.F1 = OBJECTIVES[(OBJECTIVES.indexOf(S.F1) + 1) % 3]; }
  else if (k === 'F2c') { S.F2 = EYEPIECES[(EYEPIECES.indexOf(S.F2) + 1) % 3]; }

  else if (k === 'F2') { S.F2 = +v; }

}

  if (S.pat === 'myo') {

    else if (S.G < p.rx) toast('Горы чёткие, но линза сильнее нужной: глаз всё время напрягается. Нужна самая слабая линза, с которой вдаль чётко.');
    else if (!S.rx.myo) { S.rx.myo = true; toast('Рецепт Асель: −2 дптр, рассеивающие линзы. Вдаль чётко, и глаз не напрягается.'); }

    { id: 'objective', icon: ICON.conv, name: 'Объектив', spec: 'Длиннофокусная линза: 40, 60 или 90 см.' },
    { id: 'focus', icon: ICON.focus, name: 'Фокус объектива F₁', spec: 'Здесь объектив строит изображение Луны.' },
    { id: 'inter', icon: ICON.inter, name: 'Изображение Луны', spec: 'Маленькое, действительное, перевёрнутое.' },
    { id: 'tube', icon: ICON.tube, name: 'Труба', spec: 'Её длину меняют, чтобы навести резкость.' },
    { id: 'eyepiece', icon: ICON.conv, name: 'Окуляр', spec: 'Короткофокусная лупа: 2, 3 или 5 см.' },
    { id: 'view', icon: ICON.moon, name: 'Поле зрения', spec: 'Луна в окуляре. Чем больше увеличение, тем крупнее.' }];
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    let extra = '';
    if (Ls.id === 'glasses') extra = `<p class="note">${PATS.myo.card}<br>${PATS.hyp.card}</p>`;
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.id === 'scopes' ? `<div class="safe"><b>Безопасность</b>Никогда не смотрите в телескоп или бинокль на Солнце без специального солнечного фильтра: можно мгновенно и навсегда повредить сетчатку.</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div>${extra}<p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

const where = dP => Math.abs(dP) <= 0.2 ? 'на сетчатке — чётко' : dP > 0 ? 'перед сетчаткой — размыто' : 'за сетчаткой — размыто';
function calcHTML(m) {
  const id = LID();
  if (id === 'eye') {
    const e = m.e, d = OBJ[S.obj].d;
    return `<h2>Наводим глаз</h2><div class="formula">D = 1/d + 1/f</div><div class="steps">` +
      step('до предмета d', isFinite(d) ? `${fmt(d, 2)} м` : 'очень далеко') +
      step('1/d', isFinite(d) ? `1 / ${fmt(d, 2)} = ${fmt(1 / d, 1)} дптр` : '≈ 0 дптр') +
      step('до сетчатки f', '1,7 см = 0,017 м') + step('1/f', '1 / 0,017 ≈ 58,8 дптр') +
      step('нужно D = 1/d + 1/f', `${fmt(e.need, 1)} дптр`, 'sum') +
      step('сила глаза сейчас', `58,8 + ${fmt(S.acc, 2)} = ${fmt(e.P, 1)} дптр`) +
      step('разница', `${sgn(e.dP, 2)} дптр`) + step('фокус', where(e.dP), 'sum') + `</div>
      <h3>Аккомодация</h3><div class="steps">` + OBJ_KEYS.map(k => step(`${OBJ[k].short}, ${OBJ[k].lab}`, `+${fmt(vOf(k), 0)} дптр ${S.got[k] ? '✓' : ''}`)).join('') + `</div>
      <p class="note" style="margin-top:10px">Чем ближе предмет, тем больше 1/d — тем сильнее должен стать хрусталик. Ближе 25 см нормальному глазу смотреть долго тяжело.</p>`;
  }
  if (id === 'glasses') {
    const p = PATS[S.pat], fv = 1 / p.L;
    let h = `<h2>Очки для пациента</h2><p class="note">${p.card}</p><div class="formula">D = 1/d + 1/f − Dочков</div><div class="steps">` +
      step('глаз: расслабленный … напряжённый', `${fmt(P0, 1)} … ${fmt(P0 + p.A, 1)} дптр`) +
      step('1/f до сетчатки', `${fmt(fv, 1)} дптр`) + step('очки', `${sgn(S.G, 2)} дптр`) +
      step('вдаль: нужно от глаза', `0 + ${fmt(fv, 1)} − (${sgn(S.G, 2)}) = ${fmt(fv - S.G, 1)} → ${m.far.sharp ? 'чётко' : 'размыто'}`) +
      step('книга: нужно от глаза', `4 + ${fmt(fv, 1)} − (${sgn(S.G, 2)}) = ${fmt(4 + fv - S.G, 1)} → ${m.near.sharp ? 'чётко' : 'размыто'}`) + `</div>`;
    h += `<h3>Как врач считает рецепт</h3><div class="steps">` +
      step('близорукость: D = −1 / dдальн', 'dдальн — дальняя точка, м') +
      step('дальнозоркость: D = 1/0,25 − 1/dближн', 'dближн — ближняя точка, м') + `</div>`;
    h += `<h3>Рецепты</h3><div class="steps">` + step('Асель', S.rx.myo ? '−2 дптр ✓' : 'не выписан') + step('Данияр', S.rx.hyp ? '+3 дптр ✓' : 'не выписан') + `</div>
      <p class="note" style="margin-top:10px">Фокусное расстояние линзы F = 1/D. Например, очки −4 дптр — рассеивающая линза с F = −0,25 м.</p>`;
    return h;
  }
  if (id === 'camera') {
    const b = m;
    let h = `<h2>Формула тонкой линзы</h2><div class="formula">1/F = 1/d + 1/f</div><div class="steps">` +
      step('F', '10 см') + step('d — от свечи до линзы', `${fmt(b.d, 1)} см`) +
      step('1/f = 1/F − 1/d', `1/10 − 1/${fmt(b.d, 1)} = ${fmt(1 / FL - 1 / b.d, 4)}`);
    if (b.real) h += step('f — где изображение', `${fmt(b.f, 1)} см`, 'sum') + step('экран от линзы', `${fmt(b.s, 1)} см`) +
      step('нерезкость (пятно)', `${fmt(b.blur, 2)} см ${b.sharp ? '— резко' : ''}`) +
      step('увеличение Г = f/d', `${fmt(b.f, 1)} / ${fmt(b.d, 1)} = ${fmt(b.G, 2)}`) + step('высота изображения', `3 · ${fmt(b.G, 2)} = ${fmt(3 * b.G, 1)} см`, 'sum');
    else h += step('итог', '1/f ≤ 0: действительного изображения нет, линза — лупа', 'sum');
    h += `</div><h3>Какое получится изображение</h3><div class="steps">` +
      step('d > 2F', 'уменьшенное — фотоаппарат') + step('d = 2F', 'равное, f = 2F') + step('F < d < 2F', 'увеличенное — проектор') + step('d < F', 'мнимое — лупа') + `</div>
      <p class="note" style="margin-top:10px">${S.Lc < 4 * FL ? `Сейчас от свечи до экрана ${S.Lc} см — меньше 4F = 40 см. Чёткого изображения не будет ни при каком положении линзы.` : `От свечи до экрана ${S.Lc} см ≥ 4F, значит есть два положения линзы, где изображение резкое.`}</p>`;
    return h;
  }
  if (S.mode === 'micro') {
    const mi = m.mi;
    return `<h2>Микроскоп</h2><div class="formula">Г = (f₁ / d₁) · (25 см / F₂)</div><div class="steps">` +
      step('объектив от предмета d₁', `${fmt(S.d1, 3)} см`) +
      step('f₁ = d₁F₁ / (d₁ − F₁)', `${fmt(S.d1, 3)} · 2 / ${fmt(S.d1 - MF1, 3)} = ${fmt(mi.f1, 2)} см`) +
      step('изображение до окуляра', `20 − ${fmt(mi.f1, 2)} = ${fmt(mi.s2, 2)} см`) +
      step('нужно: у фокуса окуляра', '≈ 2,3 … 2,5 см') +
      step('пучок после окуляра', `${isFinite(mi.V) ? sgn(mi.V, 1) : '∞'} дптр → ${mi.sharp ? 'чётко' : 'размыто'}`, 'sum') +
      step('Г объектива = f₁ / d₁', fmt(mi.Gob, 1)) + step('Г окуляра = 25 / 2,5', '10') +
      step('Г микроскопа', `${fmt(mi.Gob, 1)} · 10 ≈ ${fmt(mi.G, 0)}×`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">25 см — расстояние наилучшего зрения. Школьные микроскопы увеличивают в 40–600 раз, сменяя объективы и окуляры.</p>`;
  }
  const te = m.te;
  return `<h2>Телескоп</h2><div class="formula">Г = F₁ / F₂</div><div class="steps">` +
    step('объектив F₁, окуляр F₂', `${S.F1} см и ${S.F2} см`) + step('увеличение', `${S.F1} / ${S.F2} = ${fmt(te.G, 1)}×`, 'sum') +
    step('изображение Луны', `в ${S.F1} см за объективом`) + step('до окуляра', `${fmt(S.T, 2)} − ${S.F1} = ${fmt(te.s2, 2)} см`) +
    step('пучок после окуляра', `${isFinite(te.V) ? sgn(te.V, 1) : '∞'} дптр → ${te.sharp ? 'чётко' : 'размыто'}`, 'sum') +
    step('длина трубы для резкости', 'F₁ + F₂') + `</div>
    <p class="note" style="margin-top:10px">Луна видна под углом около 0,5°. В телескоп 30× — под углом около 15°, как тарелка на расстоянии вытянутой руки.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const st = ok => `<span class="${ok ? 'ok' : 'bad'}">${ok ? 'чётко' : 'размыто'}</span>`;
  if (id === 'eye') {
    el.innerHTML = `<div class="k">Глаз · ${OBJ[S.obj].short}</div><div class="v ${m.e.sharp ? 'ok' : ''}">${fmt(m.e.P, 1)} дптр</div><div class="lr"><span>нужно</span><span>${fmt(m.e.need, 1)}</span></div>` +
      `<div class="lr"><span>резкость</span>${st(m.e.sharp)}</div><div class="lr"><span>готово</span><span class="${m.got === 3 ? 'ok' : ''}">${m.got}/3</span></div>`;
  } else if (id === 'glasses') {
    el.innerHTML = `<div class="k">${PATS[S.pat].name} · ${PATS[S.pat].who}</div><div class="v">очки ${sgn(S.G, 2)}</div><div class="lr"><span>вдаль</span>${st(m.far.sharp)}</div>` +
      `<div class="lr"><span>книга</span>${st(m.near.sharp)}</div><div class="lr"><span>рецепты</span><span class="${m.rx >= 2 ? 'ok' : ''}">${m.rx}/2</span></div>`;
  } else if (id === 'camera') {
    el.innerHTML = `<div class="k">Линза F = 10 см</div><div class="v ${m.sharp ? 'ok' : ''}">${m.sharp ? 'резко' : m.real ? 'нерезко' : 'мнимое'}</div><div class="lr"><span>d</span><span>${fmt(m.d, 1)} см</span></div>` +
      `<div class="lr"><span>Г</span><span>${m.real ? fmt(m.G, 2) : '—'}</span></div><div class="lr"><span>найдено</span><span class="${m.found >= 2 ? 'ok' : ''}">${m.found}/2</span></div>`;
  } else {
    const q = S.mode === 'micro' ? m.mi : m.te;
    el.innerHTML = `<div class="k">${S.mode === 'micro' ? 'Микроскоп' : 'Телескоп'}</div><div class="v ${q.sharp ? 'ok' : ''}">${fmt(q.G, S.mode === 'micro' ? 0 : 1)}×</div><div class="lr"><span>резкость</span>${st(q.sharp)}</div>` +
      `<div class="lr"><span>микроскоп</span><span class="${m.micro ? 'ok' : ''}">${m.micro ? '✓' : '—'}</span></div><div class="lr"><span>телескоп 30×</span><span class="${m.tele ? 'ok' : ''}">${m.tele ? '✓' : '—'}</span></div>`;
  }
}

function update() {
  track();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как глаз, очки и оптические приборы строят изображения!'), 1900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // centre the active card by scrolling the strip only (never the page)
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

  return [

    `Объяснение урока: ${Ls.text.join(' ')}`,

  ].join('\n');
};
