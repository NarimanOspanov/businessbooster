<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: источники света, прямолинейное распространение света, тень и полутень, солнечные и лунные затмения.">
<title>Свет и тени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.meter svg{display:block;width:64px;height:64px;margin:8px auto 0}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter svg{width:48px;height:48px}
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31C12 31 13 20 19 20S26 11 31 9" fill="none" stroke="var(--force)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 31L29 11" stroke="var(--arm)" stroke-width="2.2" stroke-linecap="round"/><path d="M33 8l-7 1.5 4.5 4.5z" fill="var(--arm)"/><circle cx="7" cy="31" r="3" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Свет</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов со светом и тенью. Карточки, экраны, диск и Луну можно перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sci = x => {
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x))), m = x / 10 ** e;
  if (e >= -2 && e <= 3) return fmt(x, e < 0 ? 3 : (x < 10 ? 1 : 0));
  return `${fmt(m, 2).replace(/(,d*?)0+$/, '$1').replace(/,$/, '')}·10${String(e).split('').map(c => SUP[c]).join('')}`;
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C_LIGHT = 3e8;

const LESSONS = [
  { id: 'src', title: 'Источники света',
    text: ['Источник света — тело, которое само излучает свет. Солнце, звёзды, пламя, молния, лампа, экран телефона светятся сами. А Луна, зеркало, снег и почти все предметы вокруг сами не светятся. Мы видим их, потому что они отражают свет источников.',
           'Источники бывают естественные (их создала природа: Солнце, молния, светлячок) и искусственные (их сделал человек: лампы, фонари, экраны). Одни светятся, потому что сильно нагреты: Солнце, пламя, нить лампы накаливания. Другие дают холодный свет: светодиод, светлячок.',
           'Если источник намного меньше расстояния до него, его считают точечным. Звезда огромна, но так далеко, что для нас это точка. Свет летит очень быстро: c = 300 000 км/с. И всё же от Солнца он идёт к нам больше 8 минут.'],
    why: 'Светотехники и электрики проектируют освещение школ, улиц, стадионов и теплиц: правильный свет бережёт глаза и экономит деньги. Города Казахстана меняют старые уличные лампы на светодиодные, потому что те дают столько же света при заметно меньших затратах электроэнергии. Фотографы и видеооператоры зарабатывают умением ставить свет. А катафот на рюкзаке спасает жизнь на тёмной дороге: сам он не светит, но возвращает свет фар водителю.',
    task: 'Разложите все 9 предметов по корзинам: естественные источники, искусственные источники и не источники света.',
    hint: 'Тащите карточку в корзину или нажмите на карточку, а потом на корзину. Сомневаетесь? Включите «Темноту»: в полной темноте видно только то, что светится само.',
    safe: 'Не смотрите прямо на Солнце, сварку и мощные фонари и не светите лазерной указкой в глаза: яркий свет повреждает сетчатку.',
    stage: 'Тащите карточки в корзины.',
    check: m => m.sorted === 9 },
  { id: 'line', title: 'Свет идёт по прямой',
    text: ['В однородной среде (в воздухе, воде, стекле) свет распространяется прямолинейно. Линию, вдоль которой идёт свет, называют лучом. Узкий пучок из щели или луч лазерной указки — хорошая модель луча.',
           'Проверим на опыте. Между лампой и глазом стоят три экрана с маленькими отверстиями. Лампу видно, только когда все отверстия лежат на одной прямой. Если сдвинуть хоть один экран, свет упирается в картон: обойти его по кривой свет не может.',
           'Прямолинейным распространением объясняются тени, камера-обскура и солнечные «столбы» в пыльной комнате. Так же столяр проверяет прямоту доски, глядя вдоль её края.'],
    why: 'Геодезисты и строители выставляют по лучу лазерного нивелира полы, стены и колонны: на стройках Астаны и Алматы без него не обходится ни один монолитный дом. Лазерный дальномер меряет комнату за секунду по времени полёта луча — им пользуются риелторы, мебельщики и замерщики окон. Стрелок совмещает прорезь, мушку и цель на одной прямой — это тот же опыт с тремя отверстиями.',
    task: 'Сдвиньте три экрана так, чтобы свет лампы прошёл через все отверстия и попал в глаз.',
    hint: 'Тащите экраны вверх-вниз. Кнопка «Нить» натягивает нитку от лампы к глазу — отверстия должны лечь на неё. Точные высоты можно задать на вкладке «Схема».',

function resetState() {

// ---------- lesson 2: three screens ----------
function beam2() {
  const x0 = G2.x0, y0 = S.ly;
  let lo = -0.7, hi = 0.7, passed = 0;
  const segs = [], spots = [];
  let xa = x0;
  for (let i = 0; i < 3; i++) {
    const x = G2.xs[i], dx = x - x0;
    segs.push({ xa, xb: x, lo, hi });
    spots.push({ x, y1: y0 + lo * dx, y2: y0 + hi * dx });
    const a = (S.hole[i] - G2.hw - y0) / dx, b = (S.hole[i] + G2.hw - y0) / dx;
    lo = Math.max(lo, a); hi = Math.min(hi, b);
    if (lo >= hi) return { segs, spots, passed, sees: false };
    passed++; xa = x;
  }
  const dxe = G2.xe - x0, pa = (G2.ye - G2.pup - y0) / dxe, pb = (G2.ye + G2.pup - y0) / dxe;
  segs.push({ xa, xb: G2.xe + 30, lo, hi });
  return { segs, spots, passed, sees: Math.max(lo, pa) < Math.min(hi, pb) };
}
const hcm = y => (G2.floor - y) / 10;
const needY = i => S.ly + (G2.ye - S.ly) * (G2.xs[i] - G2.x0) / (G2.xe - G2.x0);

// ---------- lesson 3: shadow ----------
const xp3 = () => G3.xs + S.l * 10;
function shadow3() {
  const h = L().h, Lc = L().L, l = S.l, D = S.D, r = Lc / l;
  return { H: h * r, umbra: h * r - D * (r - 1), pen: h * r + D * (r - 1), r };
}
function visFrac(y) {
  const h = L().h * 10, p1 = G3.yc - h / 2, p2 = G3.yc + h / 2, k = (xp3() - G3.xs) / (G3.xS - G3.xs);
  const s1 = G3.yc - S.D * 5, s2 = G3.yc + S.D * 5;
  const b1 = (p1 - y * k) / (1 - k), b2 = (p2 - y * k) / (1 - k);
  if (S.D === 0) return (G3.yc >= b1 && G3.yc <= b2) ? 0 : 1;
  const ov = Math.max(0, Math.min(s2, b2) - Math.max(s1, b1));
  return 1 - ov / (s2 - s1);
}
function setL(v) { S.l = clamp(Math.round(v * 2) / 2, 5, 35); dirty = true; }
function setD(v) { S.D = clamp(Math.round(v * 2) / 2, 0, 8); dirty = true; }

// ---------- lesson 4: eclipses ----------
const RAD = Math.PI / 180;
const norm = a => ((a % 360) + 360) % 360;
function moon4() { const a = S.lam * RAD; return { x: G4.ex + G4.R * Math.cos(a), y: G4.ey - G4.R * Math.sin(a), z: S.tilt ? G4.zmax * Math.sin((S.lam - S.node) * RAD) : 0 }; }
const age4 = () => norm(S.lam - 180) / 360 * MONTH;
const elong = () => Math.abs(180 - norm(S.lam));
function phaseName() {
  const a = age4();
  if (a < 1 || a > MONTH - 1) return 'новолуние';
  if (Math.abs(a - MONTH / 2) < 1) return 'полнолуние';
  if (Math.abs(a - MONTH / 4) < 1) return 'первая четверть';
  if (Math.abs(a - 3 * MONTH / 4) < 1) return 'последняя четверть';
  if (a < MONTH / 4) return 'растущий серп';
  if (a < MONTH / 2) return 'растущая Луна';
  if (a < 3 * MONTH / 4) return 'убывающая Луна';
  return 'убывающий серп';
}
function eclipse() {
  const M = moon4(), dy = M.y - G4.ey, off = Math.hypot(dy, M.z);
  if (M.x < G4.ex - G4.re) {
    const t = G4.ex - M.x - G4.re, um = G4.rm - G4.tan * t, pen = G4.rm + G4.tan * t;
    const type = off < G4.re && um > 0 ? 'total' : off < G4.re + pen ? 'partial' : 'none';
    return { side: 'day', type, off, um, pen, dy, z: M.z, t };
  }
  if (M.x > G4.ex + G4.re) {
    const t = M.x - G4.ex, um = G4.re - G4.tan * t, pen = G4.re + G4.tan * t;
    const type = off + G4.rm <= um ? 'total' : off - G4.rm < um ? 'partial' : off - G4.rm < pen ? 'pen' : 'none';
    return { side: 'night', type, off, um, pen, dy, z: M.z, t };
  }
  return { side: 'none', type: 'none', off, um: 0, pen: 0, dy, z: M.z, t: 0 };
}
const ecName = e => e.side === 'day' ? ({ total: 'полное солнечное', partial: 'частное солнечное', none: 'нет' })[e.type]
  : e.side === 'night' ? ({ total: 'полное лунное', partial: 'частное лунное', pen: 'полутеневое лунное', none: 'нет' })[e.type] : 'нет';
function setLam(v) { S.lam = norm(v); dirty = true; }

function model() {
  const id = LID();
  if (id === 'src') return { kind: id, sorted: sortedN() };
  if (id === 'line') { const b = beam2(); return { kind: id, sees: b.sees, passed: b.passed }; }
  if (id === 'shadow') { const s = shadow3(); return { kind: id, a: S.fa, b: S.fb, ...s }; }
  const e = eclipse(); return { kind: id, solar: S.sol, lunar: S.lun, e };
}
function track() {
  const id = LID();
  if (id === 'shadow') {
    const s = shadow3();
    if (!S.fa && S.D === 0 && Math.abs(s.H / (2 * L().h) - 1) <= 0.03) { S.fa = true; toast(`Опыт 1 готов: тень ${fmt(s.H, 1)} см — в 2 раза больше диска. Диск стоит ровно посередине между лампой и экраном.`); }
    if (!S.fb && S.D >= 4 && s.umbra <= 0) { S.fb = true; toast('Опыт 2 готов: полной тени нет. До любой точки экрана доходит свет хотя бы от края лампы.'); }
  }
  if (id === 'eclipse' && S.tilt) {
    const e = eclipse();
    if (!S.sol && e.side === 'day' && e.type !== 'none') { S.sol = true; S.solType = e.type; toast(`Есть ${e.type === 'total' ? 'полное' : 'частное'} солнечное затмение! Тень Луны легла на Землю.`); }
    if (!S.lun && e.side === 'night' && (e.type === 'total' || e.type === 'partial')) { S.lun = true; S.lunType = e.type; toast(`Есть ${e.type === 'total' ? 'полное' : 'частное'} лунное затмение! Луна вошла в тень Земли.`); }
  }
}

// ---------- lesson 3 scene ----------
function shadowScene() {
  const g = G3, xp = xp3(), hh = L().h * 5, p1 = g.yc - hh, p2 = g.yc + hh, s1 = g.yc - S.D * 5, s2 = g.yc + S.D * 5;
  const yAt = (s, p, x) => s + (p - s) * (x - g.xs) / (xp - g.xs);
  let h = '';
  // light cone
  h += poly([[g.xs, s1 - 2], [g.xS, g.top], [g.xS, g.bot], [g.xs, s2 + 2]], 'rgba(255,213,74,.07)');
  // penumbra + umbra regions
  const ou = yAt(s2, p1, g.xS), ol = yAt(s1, p2, g.xS);
  if (S.D > 0) h += poly([[xp, p1], [g.xS, clamp(ou, g.top, g.bot)], [g.xS, clamp(ol, g.top, g.bot)], [xp, p2]], 'rgba(8,12,20,.45)');
  let xe = g.xS;
  const ua = x => yAt(s1, p1, x), ub = x => yAt(s2, p2, x);
  if (ua(g.xS) > ub(g.xS)) { // umbra lines cross before the screen
    const k1 = (p1 - s1) / (xp - g.xs), k2 = (p2 - s2) / (xp - g.xs);
    xe = g.xs + (s2 - s1) / (k1 - k2);

  h += poly([[xp, p1], [xe, clamp(ua(xe), g.top, g.bot)], [xe, clamp(ub(xe), g.top, g.bot)], [xp, p2]], 'rgba(2,4,8,.8)');

  const ray = (s, p, c) => `<path d="M${g.xs} ${f1(s)}L${g.xS} ${f1(clamp(yAt(s, p, g.xS), g.top - 400, g.bot + 400))}" stroke="${c}" stroke-width="1" opacity=".55"/>`;
  h += ray(s1, p1, '#ffd54a') + ray(s2, p2, '#ffd54a');

  // screen with brightness
  h += `<rect x="${g.xS}" y="${g.top}" width="10" height="${g.bot - g.top}" fill="#3a4762"/>`;
  for (let y = g.top; y < g.bot; y += 4) {

    h += `<rect x="${g.xS - 3}" y="${y}" width="5" height="4.2" fill="rgb(${Math.round(40 + 215 * f)},${Math.round(44 + 196 * f)},${Math.round(56 + 140 * f)})"/>`;
  }
  h += `<path d="M${g.xS + 5} ${g.bot}V${g.floor}" stroke="#5d6a86" stroke-width="4"/>`;
  h += T(g.xS - 8, g.bot - 4, 9.5, '#c8d0dd', 'экран', 'end', halo);
  const sh = shadow3();
  if (sh.umbra > 0.05) h += T(g.xS - 10, g.yc + 4, 9, '#e8ecf4', 'тень', 'end', halo);
  if (S.D > 0) { const ym = clamp((ou + yAt(s1, p1, g.xS)) / 2, g.top + 10, g.yc - 14); h += T(g.xS - 10, ym + 3, 9, '#c8d0dd', 'полутень', 'end', halo); }
  h += ground(g.floor);
  // lamp
  h += `<path d="M${g.xs} ${g.yc + Math.max(6, S.D * 5)}V${g.floor}" stroke="#5d6a86" stroke-width="4"/><g data-click="lamp3"><circle cx="${g.xs}" cy="${g.yc}" r="${26 + S.D * 5}" fill="url(#glow)"/>` +
    (S.D === 0 ? `<circle cx="${g.xs}" cy="${g.yc}" r="4" fill="#fff2b8" stroke="#ffcf4a" stroke-width="1.5"/>` : `<circle cx="${g.xs}" cy="${g.yc}" r="${S.D * 5}" fill="rgba(255,242,184,.9)" stroke="#ffcf4a" stroke-width="1.5"/>`) + '</g>';
  h += T(g.xs, g.yc - Math.max(10, S.D * 5) - 10, 9.5, '#e8ecf4', S.D === 0 ? 'точечная лампа' : `плафон ${fmt(S.D, 1)} см`, 'middle', halo);
  // disk on a stand
  h += `<path d="M${f1(xp)} ${p2}V${g.floor}" stroke="#5d6a86" stroke-width="3"/><g data-drag="disk"><rect x="${f1(xp - 18)}" y="${p1 - 20}" width="36" height="${p2 - p1 + 40}" fill="transparent"/>
    <ellipse cx="${f1(xp)}" cy="${g.yc}" rx="4.5" ry="${hh}" fill="#3a4762" stroke="#8b96ad" stroke-width="1.4"/></g>`;
  h += T(xp, p1 - 10, 9.5, '#e8ecf4', `диск ${L().h} см`, 'middle', halo);

  h += `<path d="M${g.xs} 425H${g.xS}" stroke="#8b96ad" stroke-width="1" marker-start="url(#arM)" marker-end="url(#arM)"/>` + T((xp + g.xS) / 2, 422, 9, '#c8d0dd', `L = ${L().L} см`, 'middle', halo);

function hlBox(id) {

    return null;
  }
  if (lid === 'line') {
    const b = beam2();
    return ({ lamp: [G2.x0 - 16, S.ly - 16, 32, 32], screens: [G2.xs[0] - 14, 120, G2.xs[2] - G2.xs[0] + 28, 280], holes: [G2.xs[0] - 12, Math.min(...S.hole) - 12, G2.xs[2] - G2.xs[0] + 24, Math.max(...S.hole) - Math.min(...S.hole) + 24], eye: [G2.xe - 16, G2.ye - 16, 36, 32], beam: [G2.x0, Math.min(S.ly, ...S.hole) - 20, (b.passed ? G2.xs[Math.min(b.passed, 2)] : G2.xs[0]) - G2.x0, Math.abs(Math.max(S.ly, ...S.hole) - Math.min(S.ly, ...S.hole)) + 40], table: [0, G2.floor - 6, 520, 20] })[id];
  }
  if (lid === 'shadow') {

  }
  const M = moon4();
  return ({ sun: [G4.sx - 10, G4.ey - G4.sr, G4.sr + 50, 2 * G4.sr], earth: [G4.ex - 32, G4.ey - 32, 64, 64], moon: [M.x - 14, M.y - 14, 28, 28], orbit: [G4.ex - G4.R - 8, G4.ey - G4.R - 8, 2 * G4.R + 16, 2 * G4.R + 16], eshadow: [G4.ex + 20, G4.ey - 40, 200, 80], mshadow: [M.x, M.y - 24, 130, 48], side: [G4.scx - 98, G4.scy - 43, 196, 86] })[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();

  if (id === 'src') h += srcScene(t);

    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;

}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;

}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const throttled = () => { const n = performance.now(); if (n - lastUpd > 120) { lastUpd = n; update(); } };
const moonAt = p => setLam(Math.atan2(G4.ey - p.y, p.x - G4.ex) / RAD);
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');

  if (a.startsWith('pick:')) { const k = a.slice(5); toast(`${ITEMS[k].name}: ${ITEMS[k].note}`); S.sel = null; S.last = k; update(); return; }

      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +

function humanT(t) {
  if (t >= 60) return `${fmt(t, 0)} с ≈ ${Math.floor(t / 60)} мин ${Math.round(t % 60)} с`;
  if (t >= 0.1) return `${fmt(t, 2)} с`;
  if (t >= 1e-6) return `${fmt(t * 1e6, 1)} мкс`;
  return `${fmt(t * 1e9, 1)} нс`;
}
function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'src') {
    const k = S.sel || S.last || 'sun', it = ITEMS[k], t = it.d / C_LIGHT, known = !!S.sorted[k];
    return `<h2>Как узнать источник</h2><div class="steps">` +
      step('1. Светится ли сам, в полной темноте?', 'да → источник, нет → не источник') +
      step('2. Кто его создал?', 'природа → естественный, человек → искусственный') + `</div>
      <h3>${it.name}</h3><div class="steps">` +
      (known ? step('светится сам?', it.kind === 'none' ? 'нет, отражает свет' : 'да') + (it.kind !== 'none' ? step('создан', it.kind === 'nat' ? 'природой' : 'человеком') : '') + step('вывод', it.kind === 'none' ? 'не источник' : it.kind === 'nat' ? 'естественный источник' : 'искусственный источник', 'sum')
        : step('вывод', 'ответьте сами и положите в корзину', 'sum')) + `</div>
      <h3>Сколько летит свет от предмета до глаза</h3><div class="formula">t = s / c</div><div class="steps">` +
      step('расстояние s', `${it.dist} = ${sci(it.d)} м`) + step('скорость света c', '3·10⁸ м/с') +
      step('t = s / c', `${sci(it.d)} / 3·10⁸ = ${humanT(t)}`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Выберите другой предмет (нажмите на карточку), и расчёт сменится. Даже свет Солнца идёт к нам больше 8 минут: мы видим Солнце таким, каким оно было 8 минут назад.</p>`;
  }
  if (id === 'line') {
    const b = beam2(), Hl = hcm(S.ly), He = hcm(G2.ye);
    return `<h2>Где должна пройти прямая</h2><div class="formula">y = y<sub>л</sub> + (y<sub>г</sub> − y<sub>л</sub>) · x / 44</div>
      <p class="note">y — высота над столом, x — расстояние от лампы в сантиметрах. Лампа на x = 0, глаз на x = 44 см, экраны на 11, 22 и 33 см.</p>
      <h3>Прямая от лампы к глазу</h3><div class="steps">` + step('лампа y<sub>л</sub>', `${fmt(Hl, 1)} см`) + step('глаз y<sub>г</sub>', `${fmt(He, 1)} см`) +
      step('подъём на 1 см пути', `(${fmt(He, 1)} − ${fmt(Hl, 1)}) / 44 = ${fmt((He - Hl) / 44, 3)}`) + `</div>
      <h3>Экраны</h3><div class="steps">` +
      [0, 1, 2].map(i => { const x = (i + 1) * 11, need = Hl + (He - Hl) * x / 44, d = hcm(S.hole[i]) - need; return step(`экран ${i + 1}: x = ${x} см`, `нужно ${fmt(need, 1)} · есть ${fmt(hcm(S.hole[i]), 1)} · ${Math.abs(d) <= 0.5 ? 'на прямой ✓' : `мимо на ${fmt(Math.abs(d), 1)} см`}`); }).join('') +
      step('результат', b.sees ? 'все отверстия на одной прямой — глаз видит лампу' : `свет прошёл ${b.passed} из 3 экранов`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Отверстие диаметром 1 см пропускает луч, если прямая проходит не дальше 0,5 см от его центра.</p>`;
  }
  if (id === 'shadow') {
    const s = shadow3(), h = Ls.h, Lc = Ls.L;
    return `<h2>Размер тени</h2><div class="formula">H = h · L / l</div><p class="note">Из подобных треугольников: лучи от точечной лампы через края диска расходятся, и тень во столько раз больше диска, во сколько экран дальше диска от лампы.</p>
      <h3>Сейчас</h3><div class="steps">` + step('h, L, l', `${h} см, ${Lc} см, ${fmt(S.l, 1)} см`) + step('L / l', `${Lc} / ${fmt(S.l, 1)} = ${fmt(s.r, 2)}`) +
      step('тень от точечной лампы H', `${h} · ${fmt(s.r, 2)} = ${fmt(s.H, 1)} см`, S.D === 0 ? 'sum' : '') + step('H / h', `${fmt(s.H / h, 2)} раза`) + `</div>
      <h3>Протяжённая лампа, D = ${fmt(S.D, 1)} см</h3><div class="formula" style="font-size:15px">тень = H − D·(L/l − 1)<br>с полутенью = H + D·(L/l − 1)</div><div class="steps">` +
      step('D·(L/l − 1)', `${fmt(S.D, 1)} · (${fmt(s.r, 2)} − 1) = ${fmt(S.D * (s.r - 1), 1)} см`) +
      step('полная тень', s.umbra > 0 ? `${fmt(s.H, 1)} − ${fmt(S.D * (s.r - 1), 1)} = ${fmt(s.umbra, 1)} см` : `${fmt(s.H, 1)} − ${fmt(S.D * (s.r - 1), 1)} ≤ 0 → полной тени нет`) +
      step('тень с полутенью', `${fmt(s.H, 1)} + ${fmt(S.D * (s.r - 1), 1)} = ${fmt(s.pen, 1)} см`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Ширина полутени с каждой стороны — D·(L/l − 1) / 2. Чем больше лампа и чем ближе к ней диск, тем шире полутень.</p>`;
  }
  const e = m.e, M = moon4(), z = M.z;
  return `<h2>Будет ли затмение</h2><div class="steps">` + step('возраст Луны', `${fmt(age4(), 1)} сут из 29,5`) + step('фаза', phaseName()) +
    step('угол Солнце — Земля — Луна', `${fmt(elong(), 0)}°`) +
    step('Луна над плоскостью орбиты Земли', S.tilt ? `${fmt(z / G4.re, 2)} R⊕` : '0 (наклон выключен)') + `</div>
    <h3>${e.side === 'day' ? 'Луна перед Землёй: тень Луны' : e.side === 'night' ? 'Луна за Землёй: тень Земли' : 'Луна сбоку от линии Солнце — Земля'}</h3><div class="steps">` +
    (e.side === 'none' ? step('вывод', 'тени не попадают ни на Землю, ни на Луну', 'sum') :
      step('смещение от оси тени', `${fmt(e.off / G4.re, 2)} R⊕`) +
      step('радиус полной тени там', e.um > 0 ? `${fmt(e.um / G4.re, 2)} R⊕` : 'конус кончился') +
      step('радиус полутени там', `${fmt(e.pen / G4.re, 2)} R⊕`) +
      step('затмение', ecName(e), 'sum')) + `</div>
    <h3>Почему Луна закрывает Солнце целиком</h3><div class="steps">` +
    step('Солнце больше Луны', '1 392 000 / 3 474 ≈ 400 раз') + step('и дальше от нас', '150 000 000 / 384 000 ≈ 390 раз') +
    step('видимые размеры', 'почти равны — Луна закрывает Солнце «впритык»', 'sum') + `</div>
    <p class="note" style="margin-top:10px">R⊕ — радиус Земли, 6 371 км. В модели размеры, расстояния и наклон 5° изменены, чтобы всё поместилось на экране.</p>`;
}

function skySVG() {
  const e = eclipse(), r = 22;
  if (e.side === 'day' && e.type !== 'none') {
    const k = e.off / (G4.re + e.pen), d = Math.hypot(e.dy, e.z) || 1, ox = 32 + (e.dy / d) * k * 2 * r * 0.95, oy = 32 - (e.z / d) * k * 2 * r * 0.95;
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="${e.type === 'total' ? '#03050b' : '#1c2c48'}"/>${e.type === 'total' ? '<circle cx="32" cy="32" r="29" fill="rgba(220,235,255,.25)"/>' : ''}<circle cx="32" cy="32" r="${r}" fill="#ffd54a"/><circle cx="${f1(ox)}" cy="${f1(oy)}" r="${r + 0.5}" fill="#0a0f18"/></svg>`;
  }
  if (e.side === 'night' && e.type !== 'none') {
    const s = r / G4.rm, cx = 32 - e.dy * s, cy = 32 + e.z * s;
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="mclip"><circle cx="32" cy="32" r="${r}"/></clipPath></defs><rect width="64" height="64" rx="8" fill="#060912"/><circle cx="32" cy="32" r="${r}" fill="#e4e7ee"/>
      <g clip-path="url(#mclip)"><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(e.pen * s)}" fill="rgba(10,14,24,.35)"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(Math.max(0, e.um * s))}" fill="#8c3a20"/></g></svg>`;
  }
  // ordinary phase as seen from the Northern hemisphere
  const el = elong() * RAD, rx = Math.abs(Math.cos(el)) * r, wax = age4() < MONTH / 2;
  const lit = elong() < 2 ? '' : `<path d="M32 ${32 - r}A${r} ${r} 0 0 1 32 ${32 + r}A${f1(rx)} ${r} 0 0 ${elong() < 90 ? 0 : 1} 32 ${32 - r}z" fill="#e4e7ee" ${wax ? '' : 'transform="matrix(-1 0 0 1 64 0)"'}/>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="#0a1222"/><circle cx="32" cy="32" r="${r}" fill="#262b35"/>${lit}</svg>`;
}

  } else if (id === 'shadow') {
    el.innerHTML = `<div class="k">${S.D === 0 ? 'Тень H' : 'Полная тень'}</div><div class="v">${m.umbra > 0.05 ? fmt(m.umbra, 1) + ' см' : 'нет'}</div>` +
      `<div class="lr"><span>с полутенью</span><span>${fmt(m.pen, 1)} см</span></div><div class="lr"><span>H / h</span><span>${fmt(m.H / L().h, 2)}</span></div><div class="lr"><span>l</span><span>${fmt(S.l, 1)} см</span></div><div class="lr"><span>D</span><span>${fmt(S.D, 1)} см</span></div>`;
  } else {
    const e = m.e, label = e.side === 'day' ? 'Вид днём' : e.side === 'night' ? 'Вид ночью' : 'Луна с Земли';
    el.innerHTML = `<div class="k">${label}</div>${skySVG()}<div class="lr"><span>фаза</span><span>${phaseName()}</span></div><div class="lr"><span>затмение</span><span class="${e.type !== 'none' && e.type !== 'pen' ? 'ok' : ''}">${ecName(e)}</span></div>`;
  }
}

function update() {
  track();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы понимаете, откуда берутся тени и затмения!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  if (id === 'line') { const b = beam2(); now = `Лампа на высоте ${fmt(hcm(S.ly), 1)} см, глаз на высоте ${fmt(hcm(G2.ye), 1)} см в 44 см от лампы. Экраны с отверстиями 1 см на расстоянии 11, 22, 33 см; отверстия на высотах ${S.hole.map(y => fmt(hcm(y), 1)).join(', ')} см. Свет прошёл ${b.passed} из 3 экранов, глаз ${b.sees ? 'видит' : 'не видит'} лампу. Нить ${S.thread ? 'натянута' : 'не натянута'}. Не называй нужные высоты сразу — подскажи про прямую линию от лампы к глазу и пропорцию.`; }
  if (id === 'shadow') { const s = shadow3(); now = `Лампа ${S.D === 0 ? 'точечная' : `матовая, диаметр плафона ${fmt(S.D, 1)} см`}. Диск диаметром ${Ls.h} см на расстоянии l = ${fmt(S.l, 1)} см от лампы, экран на L = ${Ls.L} см. Тень от точечной лампы была бы H = ${fmt(s.H, 1)} см (${fmt(s.H / Ls.h, 2)}·h). Полная тень ${s.umbra > 0 ? fmt(s.umbra, 1) + ' см' : 'отсутствует'}, вместе с полутенью ${fmt(s.pen, 1)} см. Опыт 1 (точечная лампа, тень в 2 раза больше диска): ${S.fa ? 'выполнен' : 'не выполнен'}. Опыт 2 (лампа D ≥ 4 см, полной тени нет): ${S.fb ? 'выполнен' : 'не выполнен'}. Нужное l не называй — наведи на подобные треугольники и формулу H = h·L/l.`; }
  if (id === 'eclipse') { const e = m.e; now = `Вид сверху: Солнце слева, Земля, Луна на орбите. Возраст Луны ${fmt(age4(), 1)} сут, фаза: ${phaseName()}. Наклон орбиты ${S.tilt ? 'включён' : 'выключен'}, линия узлов повёрнута на ${S.node}°. Луна ${fmt(moon4().z / G4.re, 2)} радиуса Земли над плоскостью орбиты Земли. Сейчас затмение: ${ecName(e)}. Пойманы: солнечное ${S.sol ? 'да' : 'нет'}, лунное ${S.lun ? 'да' : 'нет'}. Не давай готовых положений — наведи: в какой фазе бывает каждое затмение и почему Луна должна быть рядом с узлом.`; }
  return [
    `Раздел: физика, 8 класс, тема «Свет и тени» (оптика). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { src: 'Почему Луна светит, если она не источник света?', line: 'Как доказать, что свет идёт по прямой?', shadow: 'Почему от большой лампы тень размытая?', eclipse: 'Почему затмения бывают не каждый месяц?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
