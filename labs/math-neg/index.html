<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 6 класс: положительные и отрицательные числа, модуль числа, координатная прямая, действия с числами разных знаков.">
<title>Рациональные числа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.meter .v .fr{font-size:1.15em}
.found{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.found span{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-mono)}
.found span.ok{border-color:var(--ok);color:var(--ok)}
.signtab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center;margin:4px 0 0}
.signtab div{background:var(--surface-2);border-radius:8px;padding:8px 4px;font:500 15px/1 var(--font-mono)}
.signtab .h{background:none;color:var(--muted);font:600 10px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:8px 2px}
.signtab .on{background:var(--force);color:var(--bg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Математика · Рациональные числа</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Числа ±</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: термометр и координатная прямая. Точки и карточки можно перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);                       // −4,5
const sg = v => v > 0 ? '+' + num(v) : num(v);      // +3 / −7 / 0
const pn = v => v < 0 ? `(${num(v)})` : num(v);     // brackets for negatives
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { n = Math.abs(n); const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const signWord = v => v > 0 ? 'положительное' : v < 0 ? 'отрицательное' : 'ноль — ни положительное, ни отрицательное';
const ratStr = (a, b) => {
  if (b === 0) return '—';
  const g = gcd(a, b); let n = a / g, d = b / g; if (d < 0) { n = -n; d = -d; }
  return d === 1 ? num(n) : `${n < 0 ? '−' : ''}${Math.abs(n)}/${d}`;
};
const OPS = { '+': '+', '-': '−', '*': '·', '/': ':' };
const CARDS = [{ k: 'A', v: -3.5, txt: '−3,5' }, { k: 'B', v: 2.5, txt: '2½' }, { k: 'C', v: -0.5, txt: '−½' }];

const LESSONS = [
  { id: 'signs', title: 'Положительные и отрицательные',
    text: ['Числа больше нуля называют положительными: 5, +3, 2,7, 1/2. Знак «+» перед ними можно не писать. Числа меньше нуля — отрицательные: −7, −0,5, −2½. Перед ними знак «−» пишут всегда.',
           'Ноль — граница. Он не положительный и не отрицательный. На термометре выше нуля — тепло, ниже — мороз: «8 градусов мороза» записывают как −8 °C.',
           'Числа 7 и −7 отличаются только знаком. Их называют противоположными. Целые числа и дроби, положительные и отрицательные, вместе с нулём — это рациональные числа.'],
    why: 'Синоптики Казгидромета каждый день пишут −25 °C и +35 °C — без отрицательных чисел зимний прогноз не записать. Бухгалтер ставит минус у расходов и убытков, банк — у долга по карте. Геодезист измеряет высоту от уровня моря: дно впадины Карагие в Мангистау — около −132 м. А в лифте торгового центра кнопка −2 ведёт на парковку.',
    task: 'Днём в Астане было +3 °C, а к ночи стало на 10 градусов холоднее. Установите на термометре ночную температуру.',
    hint: 'Холоднее — значит столбик идёт вниз. Отсчитайте 10 делений вниз от отметки «днём». Сколько делений до нуля, а сколько уже ниже нуля?',
    stage: 'Тащите столбик термометра вверх или вниз.',
    t: 3,
    check: m => m.t === -7 },
  { id: 'abs', title: 'Модуль числа',
    text: ['Модуль числа — это расстояние от точки на прямой до нуля, в единичных отрезках. Обозначают вертикальными чертами: |−4| = 4, |3| = 3, |0| = 0.',

           'Число, которое показывает положение точки, — её координата. Пишут A(−3,5): точка A стоит на 3,5 единичного отрезка левее нуля. Чтобы отметить дробь, делят единичный отрезок на равные части: половина — посередине.',

const KEY = 'luch-math-neg';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview',
            t: 3, a: 2, found: [], pos: { A: null, B: null, C: null }, op: '+', p: -6, q: -2, hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function opResult(op, a, b) {
  if (op === '+') return a + b;
  if (op === '-') return a - b;
  if (op === '*') return a * b;
  return b === 0 ? null : a / b;
}
function model() {
  const id = LID();
  if (id === 'signs') return { kind: id, t: S.t };
  if (id === 'abs') return { kind: id, a: S.a, abs: Math.abs(S.a), opp: -S.a, found: S.found.slice() };
  if (id === 'coord') {
    const pos = { ...S.pos }, placed = CARDS.filter(c => pos[c.k] !== null).length, right = CARDS.filter(c => pos[c.k] === c.v).length;
    return { kind: id, pos, placed, right };
  }
  return { kind: id, op: S.op, a: S.p, b: S.q, r: opResult(S.op, S.p, S.q) };
}

// ---------- geometry (SVG units, 520 × 405) ----------
const ty = t => 235 - t * 3.6;                 // lesson 1: thermometer, −30…+30
const X2 = v => 260 + v * 21, L2Y = 300;       // lesson 2: −10…10
const X3 = v => 260 + v * 42, L3Y = 270;       // lesson 3: −5…5
const L4Y = 300;                               // lesson 4: range depends on the action
const R4 = () => S.op === '+' || S.op === '-' ? 20 : S.op === '/' ? 10 : Math.abs(S.q) <= 1 ? 10 : Math.abs(S.q) <= 2 ? 20 : Math.abs(S.q) <= 5 ? 50 : 100;
const X4 = v => 260 + v * 210 / R4();
const TRAY = { A: [150, 362], B: [260, 362], C: [370, 362] };

const T = (x, y, s, txt, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const ol = (d, fill, stroke, w = 2.2) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
function arrow(x1, x2, y, col, w = 3, op = 1) {
  if (Math.abs(x2 - x1) < 3) return `<circle cx="${x1.toFixed(1)}" cy="${y}" r="3" fill="${col}" opacity="${op}"/>`;
  const dir = Math.sign(x2 - x1), hx = x2 - dir * 8;
  return `<g opacity="${op}"><path d="M${x1.toFixed(1)} ${y}H${hx.toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.4}" stroke-linecap="round"/><path d="M${x1.toFixed(1)} ${y}H${hx.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
    `<path d="M${x2.toFixed(1)} ${y}l${-dir * 10} -6v12z" fill="${col}" stroke="${INK}" stroke-width="1"/></g>`;
}
function axis(X, y, lo, hi, minor, label, opts = {}) {
  let h = `<path d="M${X(lo) - 12} ${y}H${X(hi) + 14}" stroke="#a9b4c9" stroke-width="2"/><path d="M${X(hi) + 16} ${y}l-8 -4.5v9z" fill="#a9b4c9"/>`;
  for (let v = lo; v <= hi + 1e-9; v += minor) {
    const big = Math.abs(v / label - Math.round(v / label)) < 1e-9, L = v === 0 ? 9 : big ? 6 : 3.5;
    h += `<path d="M${X(v).toFixed(1)} ${y - L}v${2 * L}" stroke="${v === 0 ? '#e8ecf4' : '#a9b4c9'}" stroke-width="${big ? 1.4 : .9}" opacity="${big ? 1 : .6}"/>`;
    if (big && !(opts.skip && opts.skip(v))) h += T(X(v), y + 22, opts.fs || 9.5, num(Math.round(v * 100) / 100), v === 0 ? '#e8ecf4' : '#8b96ad');
  }
  return h;
}
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a73" stop-opacity=".5"/><stop offset="1" stop-color="#ffb547" stop-opacity=".15"/></linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72d4e8" stop-opacity=".15"/><stop offset="1" stop-color="#5f8fd9" stop-opacity=".55"/></linearGradient></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}

// ---------- lesson 1: thermometer ----------
function sun(x, y) { let h = `<circle cx="${x}" cy="${y}" r="13" fill="#ffb547" stroke="${INK}" stroke-width="1.5"/>`; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; h += `<path d="M${(x + 18 * Math.cos(a)).toFixed(1)} ${(y + 18 * Math.sin(a)).toFixed(1)}L${(x + 25 * Math.cos(a)).toFixed(1)} ${(y + 25 * Math.sin(a)).toFixed(1)}" stroke="#ffb547" stroke-width="2.4" stroke-linecap="round"/>`; } return h; }
function flake(x, y) { let h = ''; for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3, c = Math.cos(a), s = Math.sin(a); h += `<path d="M${(x - 20 * c).toFixed(1)} ${(y - 20 * s).toFixed(1)}L${(x + 20 * c).toFixed(1)} ${(y + 20 * s).toFixed(1)}" stroke="#72d4e8" stroke-width="2.4" stroke-linecap="round"/>`; for (const k of [-1, 1]) { const ex = x + k * 13 * c, ey = y + k * 13 * s; h += `<path d="M${(ex - 6 * s + k * 5 * c).toFixed(1)} ${(ey + 6 * c + k * 5 * s).toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}L${(ex + 6 * s + k * 5 * c).toFixed(1)} ${(ey - 6 * c + k * 5 * s).toFixed(1)}" fill="none" stroke="#72d4e8" stroke-width="1.8" stroke-linecap="round"/>`; } } return h; }
function signsSVG(m) {
  const t = m.t, y0 = ty(0), yt = ty(t);
  let h = '';
  // zones
  h += `<rect x="146" y="${ty(30) - 4}" width="12" height="${(y0 - ty(30) + 4).toFixed(1)}" rx="3" fill="url(#warm)"/><rect x="146" y="${y0.toFixed(1)}" width="12" height="${(ty(-30) - y0 + 4).toFixed(1)}" rx="3" fill="url(#cold)"/>`;
  h += T(138, ty(17), 11, 'тепло', '#ffb547', 'end') + T(138, ty(17) + 15, 13, '+', '#ffb547', 'end', 'font-weight="500"');
  h += T(138, ty(-15), 11, 'мороз', '#72d4e8', 'end') + T(138, ty(-15) + 15, 13, '−', '#72d4e8', 'end', 'font-weight="500"');
  // zero line
  h += `<path d="M110 ${y0}H318" stroke="#e8ecf4" stroke-width="1.2" stroke-dasharray="4 4" opacity=".55"/>`;
  // tube and bulb
  h += ol(`M170 ${ty(30) - 10}a10 10 0 0 1 20 0V355a17 17 0 1 1 -20 0Z`, '#121a28', '#c9d3e3', 2);
  h += `<rect x="176" y="${yt.toFixed(1)}" width="8" height="${(372 - yt).toFixed(1)}" rx="3" fill="#ff6b5a"/><circle cx="180" cy="371" r="12" fill="#ff6b5a"/>`;
  h += `<path d="M171 ${yt.toFixed(1)}h18" stroke="#ffd0c8" stroke-width="2"/>`;
  // ticks
  for (let v = -30; v <= 30; v++) {
    const L = v % 10 === 0 ? 13 : v % 5 === 0 ? 8 : 4;
    h += `<path d="M194 ${ty(v).toFixed(1)}h${L}" stroke="${v === 0 ? '#e8ecf4' : '#a9b4c9'}" stroke-width="${v % 5 ? .8 : 1.3}" opacity="${v % 5 ? .6 : 1}"/>`;
    if (v % 10 === 0) h += T(213, ty(v) + 4, 10.5, sg(v), v === 0 ? '#e8ecf4' : '#8b96ad', 'start');
  }
  // day mark
  h += `<path d="M236 ${ty(3).toFixed(1)}h-26" stroke="#72d4e8" stroke-width="1.5" stroke-dasharray="3 2"/>` + `<rect x="238" y="${(ty(3) - 9).toFixed(1)}" width="58" height="18" rx="5" fill="#0e1520" stroke="#72d4e8" stroke-width="1.2"/>` + T(267, ty(3) + 4, 10.5, 'днём +3', '#72d4e8');
  // pointer handle
  h += `<g data-drag="merc"><circle cx="180" cy="${yt.toFixed(1)}" r="9" fill="#2a3348" stroke="#ffb547" stroke-width="2"/><path d="M180 ${(yt - 5).toFixed(1)}l-3 3h6zM180 ${(yt + 5).toFixed(1)}l-3 -3h6z" fill="#ffb547"/></g>`;
  // readout
  const col = t > 0 ? '#ffb547' : t < 0 ? '#72d4e8' : '#e8ecf4';
  h += T(410, 200, 36, `${sg(t)} °C`, col, 'middle', 'font-weight="500"');
  h += T(410, 226, 12, t > 0 ? 'выше нуля' : t < 0 ? 'ниже нуля' : 'ровно ноль', '#e8ecf4');
  if (t < 0) h += T(410, 243, 12, `${Math.abs(t)} ${plural(t, 'градус', 'градуса', 'градусов')} мороза`, '#72d4e8');
  h += T(410, t < 0 ? 262 : 244, 11, t === 0 ? 'ноль — ни «+», ни «−»' : `число ${signWord(t)}`, '#8b96ad');
  h += t > 0 ? sun(410, 310) : t < 0 ? flake(410, 310) : `<path d="M390 310h40" stroke="#e8ecf4" stroke-width="2.4" stroke-linecap="round"/>`;
  return h;
}

// ---------- lesson 2: modulus ----------
function absSVG(m) {
  const a = m.a, xa = X2(a), xo = X2(-a), x0 = X2(0);
  let h = axis(X2, L2Y, -10, 10, 0.5, 1, { fs: 9 });
  h += T(X2(10.9), L2Y - 10, 11, 'x', '#a9b4c9');
  // distance: highlighted run on the axis + brace
  if (a !== 0) {
    h += `<path d="M${x0} ${L2Y}H${xa.toFixed(1)}" stroke="#ffb547" stroke-width="5" opacity=".45" stroke-linecap="round"/>`;
    const yb = 250;
    h += `<path d="M${x0} ${yb + 8}V${yb}H${xa.toFixed(1)}V${yb + 8}" fill="none" stroke="#ffb547" stroke-width="1.6"/>`;
    for (let k = 1; k < Math.abs(a); k++) h += `<path d="M${X2(Math.sign(a) * k).toFixed(1)} ${yb - 3}v6" stroke="#ffb547" stroke-width="1"/>`;
    h += `<rect x="${((x0 + xa) / 2 - 42).toFixed(1)}" y="${yb - 26}" width="84" height="20" rx="6" fill="#0e1520" stroke="#ffb547" stroke-width="1.2"/>` + T((x0 + xa) / 2, yb - 12, 11.5, `|a| = ${num(m.abs)}`, '#ffb547', 'middle', 'font-weight="500"');
    // opposite (ghost)
    h += `<circle cx="${xo.toFixed(1)}" cy="${L2Y}" r="7.5" fill="none" stroke="#72d4e8" stroke-width="1.6" stroke-dasharray="3 2"/>` + T(xo, L2Y - 16, 10.5, `−a = ${num(-a)}`, '#72d4e8');
  } else h += T(x0, 252, 11.5, '|0| = 0: точка в начале отсчёта', '#ffb547');
  h += T(x0 - 8, L2Y - 10, 10.5, 'O', '#e8ecf4', 'end');
  // found pins
  m.found.forEach(v => {
    const x = X2(v);
    h += `<path d="M${x.toFixed(1)} ${L2Y + 8}V${L2Y + 52}" stroke="#86e0a8" stroke-width="1.4"/><path d="M${x.toFixed(1)} ${L2Y + 52}h18l-5 -6 5 -6h-18z" fill="#86e0a8" stroke="${INK}" stroke-width="1"/>` + T(x + 22, L2Y + 50, 10, num(v), '#86e0a8', 'start');
  });
  // the point
  h += `<g data-drag="pt"><rect x="${(xa - 18).toFixed(1)}" y="${L2Y - 40}" width="36" height="60" fill="transparent"/><circle cx="${xa.toFixed(1)}" cy="${L2Y}" r="9" fill="#ffb547" stroke="${INK}" stroke-width="2"/>` +
    `<rect x="${(xa - 30).toFixed(1)}" y="${L2Y - 44}" width="60" height="18" rx="6" fill="#ffb547" stroke="${INK}" stroke-width="1.4"/>` + T(xa, L2Y - 31, 11, `a = ${num(a)}`, '#0b1019', 'middle', 'font-weight="500"') + `</g>`;
  h += T(260, 140, 13, 'Модуль — расстояние от точки до нуля', '#e8ecf4', 'middle', 'font-weight="500"');
  h += T(260, 160, 11, `найдено чисел с модулем 4,5: ${m.found.length} из 2`, m.found.length === 2 ? '#86e0a8' : '#8b96ad');
  return h;
}

// ---------- lesson 3: coordinate line ----------
function cardXY(k) {
  if (drag && drag.kind === 'card' && drag.k === k) return [drag.x, drag.y];
  const v = S.pos[k]; if (v === null) return TRAY[k];
  const same = CARDS.filter(c => S.pos[c.k] === v && !(drag && drag.k === c.k)); const i = same.findIndex(c => c.k === k);
  return [X3(v), 206 - i * 40];
}
const nearLine = (x, y) => y >= 150 && y <= 338 && x >= X3(-5.6) && x <= X3(5.6);
const snap3 = x => clamp(Math.round((x - 260) / 42 * 2) / 2, -5, 5);
function cardSVG(c) {
  const [x, y] = cardXY(c.k), v = S.pos[c.k], held = drag && drag.k === c.k, ok = !held && v === c.v;
  const col = ok ? '#86e0a8' : '#ffb547';
  let h = '';
  if (!held && v !== null) h += `<path d="M${x.toFixed(1)} ${y + 17}V${L3Y - 7}" stroke="${col}" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="${X3(v).toFixed(1)}" cy="${L3Y}" r="6" fill="${col}" stroke="${INK}" stroke-width="1.6"/>`;
  h += `<g data-drag="${c.k}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-38" y="-17" width="76" height="34" rx="8" fill="#1a2438" stroke="${INK}" stroke-width="4"/><rect x="-38" y="-17" width="76" height="34" rx="8" fill="#1a2438" stroke="${col}" stroke-width="1.8"/>` +
    T(-24, 5, 14, c.k, col, 'middle', 'font-weight="500"') + `<path d="M-14 -11v22" stroke="#26324a" stroke-width="1.2"/>` + T(12, 5, 13.5, c.txt, '#e8ecf4', 'middle', 'font-weight="500"') + `</g>`;
  return h;
}
function coordSVG(m) {
  let h = '';
  // tray
  h += `<rect x="96" y="338" width="328" height="48" rx="12" fill="rgba(26,36,56,.55)" stroke="#26324a" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  // unit segment
  h += `<path d="M${X3(0)} ${L3Y - 18}h42" stroke="#72d4e8" stroke-width="3" stroke-linecap="round"/>` + T(X3(0.5), L3Y - 26, 10, '1 ед.', '#72d4e8');
  h += axis(X3, L3Y, -5, 5, 1, 1, { fs: 11 });
  h += T(X3(0) - 7, L3Y - 10, 11, 'O', '#e8ecf4', 'end');
  h += T(X3(5.6), L3Y - 12, 11, 'x', '#a9b4c9');
  h += T(X3(-2.75), L3Y + 44, 10.5, '← отрицательные', '#72d4e8') + T(X3(2.75), L3Y + 44, 10.5, 'положительные →', '#ffb547');
  // ghost while dragging
  if (drag && drag.kind === 'card' && nearLine(drag.x, drag.y)) {
    const v = snap3(drag.x);
    h += `<circle cx="${X3(v).toFixed(1)}" cy="${L3Y}" r="7" fill="none" stroke="#e8ecf4" stroke-width="1.8"/>` + T(X3(v), L3Y - 14, 11, num(v), '#e8ecf4', 'middle', 'font-weight="500"');
  }
  for (const c of CARDS) if (!(drag && drag.k === c.k)) h += cardSVG(c);
  const c = drag && drag.kind === 'card' && CARDS.find(x => x.k === drag.k); if (c) h += cardSVG(c);
  return h;
}

// ---------- lesson 4: operations ----------
function mulVis(X, step, k, y, colA, colB) {
  // k copies of the step from zero; for negative k: ghosts, then the mirrored result
  let h = '';
  const n = Math.abs(k);
  if (n === 0 || step === 0) return `<circle cx="${X(0).toFixed(1)}" cy="${y}" r="4" fill="${colA}"/>`;
  const yy = k < 0 ? y - 28 : y, op = k < 0 ? 0.35 : 1;
  for (let j = 0; j < n; j++) h += arrow(X(j * step), X((j + 1) * step), yy, j % 2 ? colB : colA, 2.6, op);
  if (k < 0) { h += arrow(X(0), X(step * k), y, '#86e0a8', 3); h += T(X(step * k / 2), y - 9, 9.5, 'знак меняется — отражение', '#86e0a8'); }

  } else {
    const sa = Math.sign(m.a), sb = Math.sign(m.b), mul = m.op === '*' || m.op === '/';
    const cell = (x, y, s) => `<div class="${mul && sa === x && sb === y ? 'on' : ''}">${s}</div>`;

    set('#inPO', num(m.a)); set('#inQO', num(m.b)); val('#inP', m.a); val('#inQ', m.b);
    el.querySelectorAll('#opChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.op === m.op));
  }
}

function addSteps(a, b) {
  // reasoning for a + b by the sign rules
  const A = Math.abs(a), Bm = Math.abs(b);
  if (a === 0 || b === 0) return step('одно из чисел — ноль', `${num(a)} + ${pn(b)} = ${num(a + b)}`, 'sum');
  if (Math.sign(a) === Math.sign(b)) return step('знаки одинаковые', 'складываем модули') + step('|a| + |b|', `${num(A)} + ${num(Bm)} = ${num(A + Bm)}`) + step('ставим общий знак', `${a > 0 ? '+' : '−'} → ${num(a + b)}`, 'sum');
  if (A === Bm) return step('числа противоположные', `сумма = 0`, 'sum');
  const big = A > Bm ? a : b;
  return step('знаки разные', 'из большего модуля вычитаем меньший') + step('модули', `${num(Math.max(A, Bm))} − ${num(Math.min(A, Bm))} = ${num(Math.abs(A - Bm))}`) +
    step(`знак числа ${num(big)}`, `${big > 0 ? '+' : '−'} → ${num(a + b)}`, 'sum');
}
function calcHTML(m) {
  const id = LID();
  if (id === 'signs') {
    const t = m.t, d = t - 3;
    return `<h2>Число на термометре</h2><div class="formula">${sg(t)} °C</div><h3>Читаем шкалу</h3><div class="steps">` +
      step('от нуля', t === 0 ? 'ровно на нуле' : `${Math.abs(t)} ${plural(t, 'деление', 'деления', 'делений')} ${t > 0 ? 'вверх' : 'вниз'}`) +
      step('знак', t > 0 ? '«+» — выше нуля' : t < 0 ? '«−» — ниже нуля' : 'нет знака') + step('вид числа', signWord(t), 'sum') +
      step('противоположное', `${sg(t)} и ${sg(-t)}`) + `</div>
      <h3>Сравним с дневной +3 °C</h3><div class="steps">` +
      step('разница', `${sg(t)} − (+3) = ${sg(d)}`) +
      step('вывод', d === 0 ? 'как днём' : d > 0 ? `теплее дня на ${d}°` : `холоднее дня на ${-d}°`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Проходя через ноль, считайте деления в два этапа: сначала до нуля, потом дальше вниз.</p>`;
  }
  if (id === 'abs') {
    const a = m.a;
    return `<h2>Модуль</h2><div class="formula" style="font-size:15px">|a| = a, если a ≥ 0<br>|a| = −a, если a &lt; 0</div><h3>Сейчас</h3><div class="steps">` +
      step('число', `a = ${num(a)}`) + step('знак', a > 0 ? 'положительное → |a| = a' : a < 0 ? 'отрицательное → |a| = −a' : 'ноль → |0| = 0') +
      step('модуль', a < 0 ? `|${num(a)}| = −(${num(a)}) = ${num(-a)}` : `|${num(a)}| = ${num(a)}`, 'sum') +
      step('противоположное', `−a = ${num(-a)}, |${num(-a)}| = ${num(Math.abs(a))}`) + `</div>
      <h3>Сравнение отрицательных</h3><p class="note">Из двух отрицательных чисел больше то, у которого модуль меньше: −2 > −7, потому что 2 &lt; 7. Точка −2 стоит правее.</p>
      <h3>Находки</h3><div class="steps">` + (m.found.length ? m.found.map(v => step(`|${num(v)}|`, '4,5 ✓')).join('') : step('пока нет', '—')) + `</div>`;
  }
  if (id === 'coord') {
    let h = `<h2>Координаты</h2><div class="formula">A(x)</div><p class="note">x — координата: на сколько единичных отрезков точка правее (x > 0) или левее (x &lt; 0) начала отсчёта.</p><h3>Карточки</h3><div class="steps">`;
    for (const c of CARDS) {
      const v = m.pos[c.k];
      h += step(`${c.k}(${c.txt})`, v === null ? 'ещё не на прямой' : `стоит в ${num(v)}: ${v === 0 ? 'в начале' : `${num(Math.abs(v))} ед. ${v > 0 ? 'вправо' : 'влево'}`}`);
    }
    h += `</div><h3>Дроби на прямой</h3><p class="note">½ = 0,5 — середина единичного отрезка. 2½ = 2,5: два целых шага и ещё половина. −½ = −0,5: полшага влево от нуля.</p>`;
    const pl = CARDS.filter(c => m.pos[c.k] !== null).sort((x, y) => m.pos[x.k] - m.pos[y.k]);
    if (pl.length > 1) h += `<h3>Слева направо</h3><div class="steps">` + step('порядок', pl.map(c => `${c.k}(${num(m.pos[c.k])})`).join(' &lt; '), 'sum') + `</div>`;
    return h;
  }
  const a = m.a, b = m.b;
  let h = `<h2>Действия со знаками</h2>`;
  if (m.op === '+') h += `<div class="formula">${num(a)} + ${pn(b)}</div><div class="steps">` + addSteps(a, b) + `</div>`;
  if (m.op === '-') h += `<div class="formula" style="font-size:15px">a − b = a + (−b)</div><div class="steps">` + step('заменяем', `${num(a)} − ${pn(b)} = ${num(a)} + ${pn(-b)}`) + addSteps(a, -b) + `</div>`;
  if (m.op === '*' || m.op === '/') {
    const s = m.op === '*' ? '·' : ':';
    h += `<div class="formula">${num(a)} ${s} ${pn(b)}</div><div class="steps">`;
    if (m.op === '/' && b === 0) h += step('делитель 0', 'на ноль делить нельзя', 'sum');
    else if (a === 0) h += step('a = 0', `${m.op === '*' ? 'произведение' : 'частное'} = 0`, 'sum');
    else if (b === 0) h += step('b = 0', 'произведение = 0', 'sum');
    else {
      const mod = m.op === '*' ? `${Math.abs(a)} · ${Math.abs(b)} = ${Math.abs(a * b)}` : `${Math.abs(a)} : ${Math.abs(b)} = ${ratStr(Math.abs(a), Math.abs(b))}`;
      h += step('модули', mod) + step('знаки', Math.sign(a) === Math.sign(b) ? 'одинаковые → «+»' : 'разные → «−»') + step('ответ', m.op === '*' ? num(a * b) : ratStr(a, b), 'sum');
    }
    h += `</div>`;
  }
  h += `<h3>Правила</h3><p class="note">Сложение: одинаковые знаки — складываем модули, разные — вычитаем меньший модуль из большего. Вычитание — сложение с противоположным. Умножение и деление: «+» на «+» и «−» на «−» дают «+», разные знаки — «−».</p>`;
  return h;
}

function update() {

    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Знаки вам больше не страшны!');

  renderMeter(m);

  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    signs: 'Почему ноль не положительный и не отрицательный?', abs: 'Почему модуль не бывает отрицательным?',
    coord: 'Как отметить на прямой число −2,5?', ops: 'Почему минус на минус даёт плюс?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
