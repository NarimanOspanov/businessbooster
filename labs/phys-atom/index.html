<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 9 класс: опыт Резерфорда, модель атома, линейчатые спектры.">
<title>Строение атома</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="6" fill="none" stroke="var(--arm)" stroke-width="1.8"/><ellipse cx="20" cy="20" rx="14" ry="6" fill="none" stroke="var(--arm)" stroke-width="1.8" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="6" fill="none" stroke="var(--arm)" stroke-width="1.8" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.4" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Атом</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов со строением атома. Пушку, частицы и электрон можно тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', CP = '#ffb547', OK = '#86e0a8', WARN = '#ff8a73', MUT = '#8b96ad', PRO = '#ff8a73', NEU = '#a9b4c9';

const LESSONS = [
  { id: 'rutherford', title: 'Опыт Резерфорда',
    text: ['В 1909–1911 годах Эрнест Резерфорд и его ученики обстреливали тонкую золотую фольгу альфа-частицами. Это тяжёлые положительные частицы, они летят со скоростью около 15 000 км/с. Вокруг фольги стоял экран: там, куда попадала частица, он вспыхивал.',
           'По модели Томсона атом — шар, по которому размазан положительный заряд, а внутри вкраплены электроны, как изюм в пудинге. Тогда все частицы пролетали бы почти прямо. Но некоторые отклонялись на большие углы, а примерно одна из 8000 отскакивала назад.',
           'Резерфорд понял: весь положительный заряд и почти вся масса атома собраны в крошечном ядре. Оно в десятки тысяч раз меньше самого атома. Частица, летящая почти точно в ядро, отталкивается и летит обратно. Остальные проходят сквозь пустоту.'],
    why: 'Рассеяние частиц — главный способ заглянуть внутрь вещества. Физики на ускорителях ЦЕРН и Дубны (там работают и учёные из Казахстана) так изучают ядра и элементарные частицы. В Институте ядерной физики в Алматы есть ускоритель и исследовательский реактор — там нужны физики и инженеры. Материаловеды по рассеянию ионов проверяют состав тонких плёнок в микросхемах и солнечных панелях.',
    task: 'Обстреляйте атом пучком в модели Томсона и в ядерной модели. Найдите, какая модель объясняет отскок назад. Потом одной частицей в ядерной модели добейтесь отклонения больше 90°.',
    hint: '«Пучок» выпускает 50 частиц. Для одной частицы тяните пушку вверх-вниз: так меняется прицельное расстояние b — насколько мимо центра атома летит частица.',
    stage: 'Выберите модель и нажмите «Пучок».',
    b0: 120,
    check: m => m.thom >= 20 && m.back >= 1 && m.aim },
  { id: 'model', title: 'Модель атома',
    text: ['Атом состоит из ядра и электронов. Ядро собрано из протонов и нейтронов. Протон заряжен положительно (+e), нейтрон заряда не имеет, электрон заряжен отрицательно (−e). Элементарный заряд e = 1,6 · 10⁻¹⁹ Кл.',
           'Число протонов Z — зарядовое число. Оно равно номеру элемента в таблице Менделеева и решает, какой это элемент. Массовое число A = Z + N, где N — число нейтронов. Атомы одного элемента с разным числом нейтронов называют изотопами.',
           'В нейтральном атоме электронов столько же, сколько протонов. Электроны располагаются вокруг ядра слоями: в первом слое не больше 2 электронов, во втором — не больше 8. Если отнять или добавить электрон, получится ион.'],
    why: 'Казахстан — первый в мире по добыче урана, и вся атомная отрасль работает с изотопами: на Ульбинском металлургическом заводе в Усть-Каменогорске делают топливо для АЭС, где важно, сколько в нём урана-235. Археологи по углероду-14 определяют возраст находок, например из сакских курганов. Врачи-радиологи вводят пациентам изотопы, чтобы увидеть опухоль на снимке.',
    task: 'Соберите нейтральные атомы гелия-4 и углерода-12. Затем превратите углерод-12 в его изотоп — углерод-14.',
    hint: 'Перетаскивайте частицы с лотка в атом или жмите кнопки + и −. Число после названия — массовое число A = Z + N. В нейтральном атоме электронов столько же, сколько протонов.',
    stage: 'Тяните протоны, нейтроны и электроны с лотка в атом.',
    targets: [{ Z: 2, A: 4, name: 'гелий-4' }, { Z: 6, A: 12, name: 'углерод-12' }, { Z: 6, A: 14, name: 'углерод-14' }],
    check: m => m.found >= 3 },

const A1 = { cx: 285, cy: 228, R: 150, ra: 100, d: 9, fm: 5, gx: 22, SPD: 230 }; // 1 unit = 5 фм; d — closest approach for a head-on hit (≈45 фм)

// wavelength (nm) → colour, after Dan Bruton
function wl(l) {
  let r = 0, g = 0, b = 0;
  if (l < 440) { r = -(l - 440) / 60; b = 1; } else if (l < 490) { g = (l - 440) / 50; b = 1; } else if (l < 510) { g = 1; b = -(l - 510) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; } else if (l < 645) { r = 1; g = -(l - 645) / 65; } else r = 1;
  let f = 1; if (l < 420) f = 0.35 + 0.65 * (l - 380) / 40; else if (l > 700) f = 0.35 + 0.65 * (750 - l) / 50;
  const c = v => Math.round(255 * Math.pow(clamp(v * f, 0, 1), 0.8));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
const colorName = l => l < 380 ? 'ультрафиолет' : l < 450 ? 'фиолетовый' : l < 485 ? 'синий' : l < 500 ? 'голубой' : l < 565 ? 'зелёный' : l < 590 ? 'жёлтый' : l < 625 ? 'оранжевый' : l <= 750 ? 'красный' : 'инфракрасный';
function rainbowDef() {
  let st = '';
  for (let l = 380; l <= 750; l += 10) st += `<stop offset="${((l - 380) / 370).toFixed(3)}" stop-color="${wl(l)}"/>`;
  return `<linearGradient id="rb" x1="0" x2="1" y1="0" y2="0">${st}</linearGradient>`;
}

// ---------- lesson 1: Rutherford scattering ----------
// alpha particle: m = 1, v0 = 1 unit/time; nuclear model: F = K1 / r² (head-on stop at r = d); Thomson model: weak field inside a uniform sphere
function trace(bu, mdl) {
  let x = -250, y = -bu, vx = 1, vy = 0, t = 0;
  const pts = [[x, y, 0]]; let lx = x, ly = y;
  for (let i = 0; i < 300000; i++) {
    const r = Math.hypot(x, y);
    let f = 0;
    if (mdl === 'nuc') f = K1 / (r * r * r);
    else if (r < A1.ra) f = KT / (A1.ra ** 3);
    const dt = mdl === 'nuc' ? clamp(r * 0.01, 0.01, 1) : 1;
    vx += f * x * dt; vy += f * y * dt; x += vx * dt; y += vy * dt; t += dt;
    if (Math.hypot(x - lx, y - ly) >= 3) { pts.push([x, y, t]); lx = x; ly = y; }
    if (x * vx + y * vy > 0 && Math.hypot(x, y) >= A1.R) { pts.push([x, y, t]); break; }
  }
  return { pts, th: Math.abs(Math.atan2(vy, vx)) * 180 / Math.PI, T: t, b: bu };
}
const thExact = bfm => bfm <= 0 ? 180 : 2 * Math.atan(A1.d * A1.fm / (2 * bfm)) * 180 / Math.PI;
const cls = th => th < 10 ? 's' : th < 90 ? 'm' : 'k';
const pathD = (pts, upto) => { let s = ''; const n = upto === undefined ? pts.length : upto; for (let i = 0; i < n; i++) s += (i ? 'L' : 'M') + (A1.cx + pts[i][0]).toFixed(1) + ' ' + (A1.cy + pts[i][1]).toFixed(1); return s; };
function posAt(p, tau) {
  const P = p.pts; if (tau <= 0) return { i: 0, x: P[0][0], y: P[0][1] };
  let lo = 0, hi = P.length - 1;
  if (tau >= P[hi][2]) return { i: hi, x: P[hi][0], y: P[hi][1] };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (P[mid][2] <= tau) lo = mid; else hi = mid; }
  const k = (tau - P[lo][2]) / (P[hi][2] - P[lo][2] || 1);
  return { i: lo + 1, x: P[lo][0] + (P[hi][0] - P[lo][0]) * k, y: P[lo][1] + (P[hi][1] - P[lo][1]) * k };
}
const gunY = () => A1.cy - S.b / A1.fm;

function rutherfordScene(t) {

    if (!p.done && tau > 0) h += `<circle cx="${(cx + q.x).toFixed(1)}" cy="${(cy + q.y).toFixed(1)}" r="4.5" fill="${CP}" stroke="${INK}" stroke-width="1.4"/>`;
    if (p.done) h += T(cx + q.x + (q.x < 0 ? -8 : 8), cy + q.y + (q.y < 0 ? -8 : 16), 10.5, cls(p.th) === 'k' ? OK : CP, `${fmt(p.th, 0)}°`, q.x < 0 ? 'end' : 'start', halo + ' font-weight="500"');

    const q = posAt(p, tau), i0 = Math.max(0, q.i - 8);

  }
  // gun
  h += `<g data-drag="gun"><rect x="${A1.gx - 6}" y="${(gy - 26).toFixed(1)}" width="60" height="52" fill="transparent"/>
    <rect x="${A1.gx}" y="${(gy - 13).toFixed(1)}" width="34" height="26" rx="5" fill="#5d6a86" stroke="${INK}" stroke-width="2"/>
    <rect x="${A1.gx + 34}" y="${(gy - 5).toFixed(1)}" width="12" height="10" rx="2" fill="#8b96ad" stroke="${INK}" stroke-width="1.6"/>
    <path d="M${A1.gx + 10} ${(gy - 4).toFixed(1)}h14M${A1.gx + 10} ${(gy + 4).toFixed(1)}h14" stroke="${INK}" stroke-width="1.4"/></g>`;
  h += T(A1.gx + 17, gy - 19, 9, MUT, 'α', 'middle', halo);
  h += `<path d="M${A1.gx + 17} ${(gy + 18).toFixed(1)}v10M${A1.gx + 13} ${(gy + 24).toFixed(1)}l4 5 4-5M${A1.gx + 17} ${(gy - 28).toFixed(1)}" stroke="${MUT}" stroke-width="1.2" fill="none"/>`;
  return h;
}
function fire(kind) {
  if (S.firing) return;
  S.fl = []; S.bt = 0; S.marks = S.marks.slice(-120);
  if (kind === 'beam') {
    S.aimPath = null; S.trails = [];
    const idx = Array.from({ length: 50 }, (_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    idx.forEach((k, j) => { const bu = -110 + (k + Math.random()) * 4.4; const p = trace(bu, S.mdl); p.delay = j * 0.07; S.fl.push(p); });
  } else {
    const p = trace(S.b / A1.fm, S.mdl); p.delay = 0; p.aim = true; S.aimPath = p; S.fl.push(p);
  }
  S.firing = true; renderTools();
  if (reduce) { S.bt = 1e6; stepFire(performance.now()); }
}
function stepFire(t) {
  let left = 0;
  for (const p of S.fl) {
    if (p.done) continue;
    if ((S.bt - p.delay) * A1.SPD >= p.T) {
      p.done = true;
      const c = cls(p.th), cc = S.cnt[S.mdl], e = p.pts[p.pts.length - 1], r = Math.hypot(e[0], e[1]);
      cc.n++; cc[c]++;
      S.marks.push({ x: A1.cx + e[0] / r * A1.R, y: A1.cy + e[1] / r * A1.R, c, t });
      if (!p.aim) S.trails.push(pathD(p.pts));
      if (p.aim) {
        S.lastAim = { b: S.b, th: p.th, mdl: S.mdl };
        if (S.mdl === 'nuc' && p.th > 90) { if (!S.aim) { S.aim = true; toast(`Отскок на ${fmt(p.th, 0)}°! Частица подлетела к ядру на ${S.b} фм и оттолкнулась назад.`); } }
        else if (S.mdl === 'nuc') toast(`Отклонение ${fmt(p.th, 0)}°. Чтобы частица отскочила назад, целиться нужно ближе к ядру.`);
        else toast(`Отклонение ${fmt(p.th, 1)}°. В «пудинге» заряд размазан, и сила слишком слабая, чтобы развернуть частицу.`);
      }
    } else left++;
  }
  if (!left) {
    S.firing = false;
    const beam = S.fl.length > 1;
    if (beam) {
      const k = S.fl.filter(p => cls(p.th) === 'k').length, m = S.fl.filter(p => cls(p.th) === 'm').length;
      if (S.mdl === 'thom') toast(`Томсон: все 50 частиц прошли почти прямо. Отскоков назад нет — а в опыте они были!`);
      else toast(`Ядерная модель: ${m} отклонились сильно, ${k} отскочили назад. Так и было в опыте.`);
    }
    renderTools(); update();
  }
}
function setB(v) { if (S.firing) return; v = clamp(Math.round(v / 5) * 5, 0, 300); if (v === S.b) return; S.b = v; if (S.aimPath && S.aimPath.done) S.aimPath = null; update(); }
function setMdl(md) { if (S.firing || md === S.mdl) return; S.mdl = md; S.trails = []; S.marks = []; S.aimPath = null; renderTools(); buildScheme(); update(); }

// ---------- lesson 2: build an atom ----------
const shellsOf = E => { const out = []; let left = E; for (const c of A2.cap) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; } return out; };
function nucleons() {
  const A = S.Z + S.N, out = [];
  for (let i = 0; i < A; i++) {
    const isP = Math.floor((i + 1) * S.Z / A) > Math.floor(i * S.Z / A);
    const r = A === 1 ? 0 : 5.4 * Math.sqrt(i + 0.5), a = i * 2.39996;
    out.push({ x: A2.cx + r * Math.cos(a), y: A2.cy + r * Math.sin(a), p: isP });
  }
  return out.reverse();
}
const ball = (x, y, r, col, lab) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="1.3"/>` + (lab ? T(x, y + 3.3, r > 6 ? 9 : 8, INK, lab, 'middle', 'font-weight="500"') : '');
function modelScene() {

  for (const q of nucleons()) h += ball(q.x, q.y, 6.2, q.p ? PRO : NEU, q.p ? '+' : '');
  sh.forEach((cnt, i) => {
    const r = A2.shells[i], sp = (0.5 / (i + 1)) * (i % 2 ? -1 : 1);
    for (let j = 0; j < cnt; j++) { const a = S.ph * sp + j * 2 * Math.PI / cnt + i * 0.4; h += ball(cx + r * Math.cos(a), cy + r * Math.sin(a), 4.6, C1, ''); }
    h += T(cx + r * Math.cos(-0.95) + 4, cy + r * Math.sin(-0.95) - 4, 9, '#a9e6f2', `${cnt}`, 'start', halo);
  });
  // tray
  const lab = [['p', PRO, 'протон', '+'], ['n', NEU, 'нейтрон', ''], ['e', C1, 'электрон', '']];
  h += `<rect x="${A2.tx - 34}" y="${A2.ty[0] - 34}" width="68" height="${A2.ty[2] - A2.ty[0] + 70}" rx="12" fill="#121a28" stroke="#26324a"/>`;

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'rutherford') return [t(m.thom >= 20, 'Пучок: Томсон'), t(m.back >= 1, 'отскок в ядерной'), t(m.aim, 'одна > 90°')].join(' · ');
  if (id === 'model') return L().targets.map(tg => t(S.found[tg.name], tg.name)).join(' · ');
  return `Видимых линий: ${m.vis} из 4 · ` + t(m.abs, 'поглощение');
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'rutherford') h = `<h2>Обстрел золотой фольги</h2>` +
    `<div class="ctl"><div class="lbl">Модель атома</div><div class="chips"><button data-a="thom" aria-pressed="${S.mdl === 'thom'}">Томсон</button><button data-a="nuc" aria-pressed="${S.mdl === 'nuc'}">ядерная</button></div></div>` +
    slider('inB', 'Прицельное расстояние b', 0, 300, 5, S.b) +
    `<dl class="reads"><div><dt>выпущено</dt><dd id="r1"></dd></div><div><dt>&lt;10°</dt><dd id="r2"></dd></div><div><dt>10–90°</dt><dd id="r3"></dd></div><div><dt>назад &gt;90°</dt><dd id="r4"></dd></div><div><dt>угол для b</dt><dd id="r5"></dd></div><div><dt>энергия α</dt><dd>5 МэВ</dd></div></dl>
    <div class="row"><button class="ghostbtn" data-a="beam">Пучок</button><button class="ghostbtn" data-a="one">Одна частица</button><button class="ghostbtn" data-a="reset">Сброс</button></div>
    <p class="note" style="margin-top:12px">Атом и ядро нарисованы крупно, а ядро сильно увеличено: на самом деле оно в десятки тысяч раз меньше атома. Поэтому в настоящем опыте назад отскакивала лишь одна частица из тысяч.</p>`;
  if (id === 'model') {
    const row = (k, name) => `<div class="ctl"><div class="lbl">${name} <output id="o${k}"></output></div><div class="chips"><button data-a="${k}-">−1</button><button data-a="${k}+">+1</button></div></div>`;
    h = `<h2>Конструктор атома</h2>` + row('Z', 'Протоны Z') + row('N', 'Нейтроны N') + row('E', 'Электроны') +
      `<dl class="reads"><div><dt>элемент</dt><dd id="r1"></dd></div><div><dt>A = Z + N</dt><dd id="r2"></dd></div><div><dt>заряд</dt><dd id="r3"></dd></div></dl>
      <div class="row"><button class="ghostbtn" data-a="reset">Сброс</button></div>
      <p class="note" style="margin-top:12px">Заряд показан в элементарных зарядах e. Слои электронов заполняются по 2, 8, 8, 2 — так у первых 20 элементов.</p>`;
  }
  if (id === 'spectra') h = `<h2>Атом водорода</h2>` +
    `<div class="ctl"><div class="lbl">Что смотрим</div><div class="chips"><button data-a="cont" aria-pressed="${S.mode === 'cont'}">сплошной</button><button data-a="emit" aria-pressed="${S.mode === 'emit'}">испускание</button><button data-a="abs" aria-pressed="${S.mode === 'abs'}">поглощение</button></div></div>` +
    `<div class="ctl"><div class="lbl">Перевести электрон на уровень</div><div class="chips">${[1, 2, 3, 4, 5, 6].map(k => `<button data-a="lv-${k}" aria-pressed="${S.n === k}">n = ${k}</button>`).join('')}</div></div>` +
    `<dl class="reads"><div><dt>уровень</dt><dd id="r1"></dd></div><div><dt>энергия</dt><dd id="r2"></dd></div><div><dt>последний λ</dt><dd id="r3"></dd></div></dl>
    <div class="row"><button class="ghostbtn" data-a="reset">Стереть линии</button></div>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inB', e => setB(+e.target.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a.startsWith('lv-')) { goLevel(+a.slice(3)); buildScheme(); updateScheme(model()); return; }
    act(a); if (/^(thom|nuc|cont|emit|abs)$/.test(a)) buildScheme();
    updateScheme(model());
  });
  updateScheme(model());
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'rutherford') { const c = S.cnt[S.mdl]; set('#inBO', S.b + ' фм'); val('#inB', S.b); set('#r1', c.n); set('#r2', c.s); set('#r3', c.m); set('#r4', c.k); set('#r5', S.mdl === 'nuc' ? fmt(thExact(S.b), 0) + '°' : '< 1°'); }
  if (id === 'model') { set('#oZ', S.Z); set('#oN', S.N); set('#oE', S.E); set('#r1', ELEM[S.Z][0]); set('#r2', m.A); set('#r3', (m.q > 0 ? '+' : '') + fmt(m.q, 0)); }
  if (id === 'spectra') { set('#r1', 'n = ' + S.n); set('#r2', fmt(EN(S.n), 2) + ' эВ'); set('#r3', S.last ? fmt(S.last.lam, 0) + ' нм' : '—'); el.querySelectorAll('[data-a^="lv-"]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.a.slice(3) === S.n)); }
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +

    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });

}

function calcHTML(m) {
  const id = LID();
  if (id === 'rutherford') {
    const th = thExact(S.b);
    return `<h2>Как близко к ядру</h2><div class="formula">r<sub>min</sub> = k · q<sub>α</sub> · Q / E</div><p class="note">Если частица летит точно в ядро, она тормозит, пока вся её кинетическая энергия не перейдёт в энергию отталкивания. Это и есть самое близкое расстояние.</p>
      <h3>Числа</h3><div class="steps">` + step('k', '9 · 10⁹ Н·м²/Кл²') + step('заряд частицы q<sub>α</sub>', '2e = 3,2 · 10⁻¹⁹ Кл') + step('заряд ядра золота Q', '79e = 1,26 · 10⁻¹⁷ Кл') + step('энергия E', '5 МэВ = 8,0 · 10⁻¹³ Дж') +
      step('r<sub>min</sub>', '9·10⁹ · 3,2·10⁻¹⁹ · 1,26·10⁻¹⁷ / 8,0·10⁻¹³ ≈ 4,5 · 10⁻¹⁴ м = 45 фм', 'sum') + `</div>
      <p class="note" style="margin-top:8px">1 фм (фемтометр) = 10⁻¹⁵ м. Радиус атома золота — около 1,4 · 10⁻¹⁰ м, то есть в 3000 раз больше r<sub>min</sub>. Значит, ядро действительно крошечное.</p>
      <h3>Угол для b = ${S.b} фм (ядерная модель)</h3><div class="formula">tg(θ/2) = r<sub>min</sub> / (2b)</div><div class="steps">` +
      (S.b > 0 ? step('r<sub>min</sub> / (2b)', `45 / (2 · ${S.b}) = ${fmt(45 / (2 * S.b), 3)}`) + step('θ/2', `${fmt(th / 2, 1)}°`) : step('b = 0', 'удар в лоб')) +
      step('угол отклонения θ', `${fmt(th, 1)}°`, 'sum') + step('назад, если θ > 90°', 'b < r<sub>min</sub> / 2 ≈ 22 фм') + `</div>
      <p class="note" style="margin-top:8px">Эту формулу Резерфорд вывел сам. В 9 классе её не учат наизусть — важен вывод: чем ближе к ядру, тем сильнее отклонение.</p>`;
  }
  if (id === 'model') {
    const el = ELEM[S.Z], sh = shellsOf(S.E);
    return `<h2>Состав атома</h2><div class="formula">A = Z + N</div>
      <h3>Сейчас: ${el[1]}-${m.A}</h3><div class="steps">` + step('протонов Z', `${S.Z} → элемент №${S.Z}, ${el[0]}`) + step('нейтронов N', `${S.N}`) + step('массовое число', `A = ${S.Z} + ${S.N} = ${m.A}`, 'sum') +
      step('заряд ядра', `+${S.Z}e = ${fmt(S.Z * 1.6, 1)} · 10⁻¹⁹ Кл`) + step('электронов', `${S.E}`) + step('заряд атома', `${S.Z} − ${S.E} = ${m.q > 0 ? '+' : ''}${fmt(m.q, 0)}e`, 'sum') +
      step('масса ядра', `≈ ${m.A} а. е. м. ≈ ${fmt(m.A * 1.66, 2)} · 10⁻²⁷ кг`) + step('электронные слои', sh.length ? sh.join(', ') : 'нет электронов') + `</div>
      <h3>Цели</h3><div class="steps">` + L().targets.map(tg => step(tg.name, `${tg.Z} p, ${tg.A - tg.Z} n, ${tg.Z} e ${S.found[tg.name] ? '✓' : ''}`)).join('') + `</div>`;
  }
  const l = S.last;
  let h = `<h2>Энергия фотона</h2><div class="formula">Eₙ = −13,6 / n² эВ</div><div class="formula">hν = Eₖ − Eₙ,&nbsp; λ = hc / ΔE</div><p class="note">h = 6,63 · 10⁻³⁴ Дж·с, c = 3 · 10⁸ м/с, 1 эВ = 1,6 · 10⁻¹⁹ Дж. Удобно помнить: λ (нм) ≈ 1240 / ΔE (эВ).</p>`;
  if (l) {
    const hi = Math.max(l.from, l.to), lo = Math.min(l.from, l.to);
    h += `<h3>Переход ${l.from} → ${l.to}</h3><div class="steps">` + step(`E${hi}`, `−13,6 / ${hi * hi} = ${fmt(EN(hi), 2)} эВ`) + step(`E${lo}`, `−13,6 / ${lo * lo} = ${fmt(EN(lo), 2)} эВ`) +
      step('ΔE', `${fmt(EN(hi), 2)} − (${fmt(EN(lo), 2)}) = ${fmt(l.dE, 2)} эВ`) + step('в джоулях', `${fmt(l.dE * 1.6, 2)} · 10⁻¹⁹ Дж`) + step('λ', `1240 / ${fmt(l.dE, 2)} ≈ ${fmt(l.lam, 0)} нм`, 'sum') + step('частота ν = c / λ', `${fmt(3e8 / (l.lam * 1e-9) / 1e14, 2)} · 10¹⁴ Гц`) +
      step(l.to < l.from ? 'атом испустил' : 'атом поглотил', colorName(l.lam)) + `</div>`;
  } else h += `<p class="note">Переведите электрон на другой уровень — здесь появится расчёт.</p>`;
  const vis = Object.keys(S.lines).map(k => S.lines[k]).filter(x => x.lam >= 380 && x.lam <= 750);
  h += `<h3>Найденные видимые линии</h3><div class="steps">` + (vis.length ? vis.sort((a, b) => b.lam - a.lam).map(x => step(`${x.from} → ${x.to}`, `${fmt(x.lam, 0)} нм`)).join('') : step('пока нет', '—')) + `</div>`;
  return h;
}

}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как устроен атом!'), 2000);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // centre the active card by scrolling only the strip, never the page
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

window.LUCH_CONTEXT = () => {

  if (id === 'rutherford') {
    const c = S.cnt;
    now = `Модель атома на экране: ${S.mdl === 'thom' ? 'Томсона («пудинг с изюмом»)' : 'ядерная (Резерфорда)'}. Альфа-частицы 5 МэВ летят на атом золота. Прицельное расстояние пушки b = ${S.b} фм. Счётчики — Томсон: выпущено ${c.thom.n}, прямо ${c.thom.s}, 10–90° ${c.thom.m}, назад ${c.thom.k}; ядерная: выпущено ${c.nuc.n}, прямо ${c.nuc.s}, 10–90° ${c.nuc.m}, назад ${c.nuc.k}. ${S.lastAim ? `Последняя одиночная частица: модель ${S.lastAim.mdl === 'nuc' ? 'ядерная' : 'Томсона'}, b = ${S.lastAim.b} фм, отклонение ${fmt(S.lastAim.th, 0)}°.` : 'Одиночных выстрелов ещё не было.'} Отклонение больше 90° одиночной частицей в ядерной модели ${S.aim ? 'получено' : 'не получено'}. Не называй нужное b — наводи вопросами о том, как сила отталкивания зависит от расстояния до ядра.`;
  }
  if (id === 'model') now = `Собран атом: ${S.Z} протонов, ${S.N} нейтронов, ${S.E} электронов. Это ${ELEM[S.Z][1]} (${ELEM[S.Z][0]}), A = ${m.A}, заряд ${m.q > 0 ? '+' : ''}${m.q}e (${m.q === 0 ? 'нейтральный атом' : 'ион'}). Слои электронов: ${shellsOf(S.E).join(', ') || 'нет'}. Цели: ${L().targets.map(tg => tg.name + (S.found[tg.name] ? ' — собран' : ' — не собран')).join('; ')}. Не диктуй готовый состав — спрашивай, сколько протонов у элемента и как найти число нейтронов по A.`;
  if (id === 'spectra') {
    const vis = Object.keys(S.lines).map(k => S.lines[k]).filter(l => l.lam >= 380 && l.lam <= 750).map(l => `${l.from}→${l.to} (${fmt(l.lam, 0)} нм)`);
    now = `Атом водорода, электрон на уровне n = ${S.n} (E = ${fmt(EN(S.n), 2)} эВ). Режим спектра: ${({ cont: 'сплошной', emit: 'испускание', abs: 'поглощение' })[S.mode]}. ${S.last ? `Последний переход ${S.last.from} → ${S.last.to}: ΔE = ${fmt(S.last.dE, 2)} эВ, λ = ${fmt(S.last.lam, 0)} нм.` : 'Переходов ещё не было.'} Найдено видимых линий: ${vis.length} из 4${vis.length ? ': ' + vis.join(', ') : ''}. Спектр поглощения ${S.abs ? 'уже открывали' : 'ещё не открывали'}. Не называй, на какой уровень нужны переходы, — наводи вопросами.`;
  }
  return [
    `Раздел: физика, 9 класс, «Атом и Вселенная», тема «Строение атома». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { rutherford: 'Почему большинство частиц пролетает сквозь золото?', model: 'Чем изотопы одного элемента отличаются друг от друга?', spectra: 'Почему водород светит только определёнными цветами?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
