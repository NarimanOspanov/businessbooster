<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 9 класс: создание сайтов — HTML, CSS, основы JavaScript и публикация сайта.">
<title>Создание сайтов</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag],.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .sans{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.big{font:600 15px/1 var(--font-mono);color:var(--fg);min-width:34px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.mtab span{background:var(--surface-2);border-radius:7px;padding:6px 7px;font:500 12.5px/1.2 var(--font-mono);display:flex;justify-content:space-between;gap:4px;min-width:0}
.mtab span b{font-weight:600;color:var(--fg)}
.mtab span i{font-style:normal;color:var(--force);letter-spacing:.06em}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mtab{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 180px);min-height:0}
}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.scene .pulse{animation:pulse 1.1s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="11" cy="20" r="3" fill="var(--force)"/><rect x="17" y="18" width="12" height="4" rx="2" fill="var(--arm)"/><circle cx="34" cy="20" r="1.6" fill="var(--fg)"/><path d="M8 11h24M8 29h24" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Сайты</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: код сайта, предпросмотр в браузере, сервер хостинга. Строки кода и файлы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const unesc = s => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
const INK = '#04070d';

const LESSONS = [
  { id: 'html', title: 'HTML: теги дают тексту смысл',
    text: ['Сайт — это набор файлов, которые браузер скачивает и показывает. Главный из них — HTML-файл, обычно index.html. HTML — язык разметки: он ничего не считает и не рисует, а объясняет браузеру, что есть что: где заголовок, где абзац, где список.',
           'Разметка делается тегами в угловых скобках. Открывающий тег &lt;h1&gt; и закрывающий &lt;/h1&gt; обрамляют содержимое — вместе это элемент. Теги вкладываются друг в друга: пункты списка &lt;li&gt; живут внутри &lt;ul&gt;, а всё видимое — внутри &lt;body&gt;.',
           'У тегов бывают атрибуты — дополнительные настройки. Ссылка &lt;a href="адрес"&gt; хранит в атрибуте href, куда вести. А текст без тегов браузер просто склеивает в одну строку — проверьте сами.'],
    why: 'Вёрстку на HTML знает каждый веб-разработчик: с неё начинают все фронтенд-разработчики, а сайты нужны всем — от кофейни до акимата. Многие школьники зарабатывают первые деньги, собирая простые сайты-визитки для знакомого бизнеса. Правильные теги помогают и людям с плохим зрением: экранный диктор читает заголовки и списки, а поисковики лучше находят такую страницу.',
    task: 'Разметьте страницу кофейни: название — главный заголовок, описание — абзац, три напитка — пункты списка, «Наш Instagram» — ссылка.',
    hint: 'Нажмите строку кода, затем тег на панели внизу. h1 — главный заголовок, p — абзац, li — пункт списка, a — ссылка, b — жирный текст.',
    stage: 'Нажмите строку кода, затем тег на панели.',
    frags: [
      { t: 'Кофейня «Арман»', want: 'h1' },
      { t: 'Лучший кофе в Шымкенте с 2015 года.', want: 'p' },
      { t: 'Капучино — 900 ₸', want: 'li' },
      { t: 'Латте — 1000 ₸', want: 'li' },
      { t: 'Чай с молоком — 500 ₸', want: 'li' },
      { t: 'Наш Instagram', want: 'a' }],
    check: m => m.correct === m.total },
  { id: 'css', title: 'CSS: оформляем по макету',
    text: ['HTML отвечает за смысл, CSS — за внешний вид: цвета, размеры, шрифты, отступы. Стили обычно лежат в отдельном файле style.css, а HTML подключает его строкой &lt;link rel="stylesheet" href="style.css"&gt;.',
           'CSS состоит из правил: селектор { свойство: значение; }. Селектор h1 выбирает все заголовки h1, body — всю страницу. Одно правило меняет сразу все подходящие элементы, хоть на ста страницах сайта.',
           'Цвет пишут шестнадцатеричным кодом #RRGGBB: по две цифры на красный, зелёный и синий, от 00 до ff (от 0 до 255). Размер шрифта задают в пикселях, например 32px.'],
    why: 'Верстальщики и фронтенд-разработчики переносят макет дизайнера в CSS «до пикселя» — за это платят и в IT-компаниях Алматы и Астаны, и на фрилансе. UI/UX-дизайнеру тоже нужно понимать CSS, чтобы его макет можно было собрать. А контраст текста и фона — не вкусовщина: бледный текст на светлом фоне трудно читать с телефона на солнце и людям со слабым зрением.',

  rows.push({ ind: 0, segs: [['</body>', C.tag]] });

}

}
function utf8Stats(s) {
  const st = { chars: 0, b1: 0, b2: 0, b3: 0, bytes: 0 };
  for (const ch of s) { const c = ch.codePointAt(0), n = c < 128 ? 1 : c < 2048 ? 2 : c < 65536 ? 3 : 4; st.chars++; st.bytes += n; if (n === 1) st.b1++; else if (n === 2) st.b2++; else st.b3++; }
  return st;
}

const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const lum = h => { const [r, g, b] = rgb(h).map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

// ---------- drawing ----------
const ol = (d, fill, stroke, w = 2.2) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round"/>`;
const rr = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
const LH = 13;

function codeBox(x, y, w, title, rows, fs = 8.8) {
  const hgt = 18 + rows.length * LH + 6;
  let h = ol(rr(x, y, w, hgt, 9), '#0e1520', '#3a4762', 1.3);
  h += `<path d="M${x + 1} ${y + 15}H${x + w - 1}" stroke="#26324a"/><circle cx="${x + 9}" cy="${y + 8}" r="2.4" fill="#ff8a73"/><circle cx="${x + 17}" cy="${y + 8}" r="2.4" fill="#ffb547"/><circle cx="${x + 25}" cy="${y + 8}" r="2.4" fill="#86e0a8"/>`;
  h += `<text x="${x + 34}" y="${y + 11}" font-size="8" fill="${C.mut}">${esc(title)}</text>`;
  rows.forEach((r, i) => {
    const ry = y + 18 + i * LH, tx = x + 22 + (r.ind || 0) * 12;
    let g = `<text x="${x + 6}" y="${ry + 9.5}" font-size="7" fill="#56627d">${i + 1}</text>`;
    if (r.sel) g += `<rect x="${x + 18}" y="${ry}" width="${w - 22}" height="${LH}" rx="3" fill="rgba(255,181,71,.13)" stroke="#ffb547" stroke-width="1"/>`;
    if (r.slot) { const sw = r.segs.reduce((s, q) => s + q[0].length, 0) * fs * 0.6 + 8; g += `<rect x="${tx - 4}" y="${ry + .5}" width="${sw.toFixed(1)}" height="${LH - 1}" rx="3" fill="${r.slotOk ? 'rgba(134,224,168,.08)' : 'rgba(255,181,71,.08)'}" stroke="${r.slotOk ? '#86e0a8' : '#ffb547'}" stroke-width="1" stroke-dasharray="3 2"/>`; }
    g += `<text x="${tx}" y="${ry + 9.5}" font-size="${fs}">` + r.segs.map(s => `<tspan fill="${s[1]}">${esc(s[0])}</tspan>`).join('') + `</text>`;
    if (r.bare) g += `<text x="${x + w - 6}" y="${ry + 9.5}" font-size="7" fill="#ff8a73" text-anchor="end" class="sans">без тега</text>`;
    if (r.hit) h += `<g data-hit="${r.hit}"><rect x="${x + 1}" y="${ry}" width="${w - 2}" height="${LH}" fill="transparent"/>${g}</g>`;
    else h += g;
  });
  return { svg: h, bottom: y + hgt };
}

// word-flow layout for the HTML preview
function flow(words, x0, y, maxW, size, lh, color) {
  const lines = [[]];
  let x = 0;
  for (const w of words) {
    const ww = w.t.length * size * 0.6 * (w.st === 'b' || w.bold ? 1.05 : 1), sp = size * 0.3;
    if (x > 0 && x + ww > maxW) { lines.push([]); x = 0; }
    lines[lines.length - 1].push(w); x += ww + sp;
  }
  let h = '';
  lines.forEach((ln, i) => {
    h += `<text x="${x0}" y="${(y + i * lh).toFixed(1)}" font-size="${size}" fill="${color}" class="sans">` + ln.map((w, j) => `<tspan${w.st === 'a' ? ' fill="#2563eb" text-decoration="underline"' : ''}${w.st === 'b' || w.bold ? ' font-weight="700"' : ''}>${esc(w.t)}</tspan>`).join(' ') + `</text>`;
  });
  return { svg: h, h: lines.length * lh };
}

function drawHtml(t) {
  const fr = L().frags;
  const cb = codeBox(8, 86, 344, 'index.html — содержимое <body>', htmlRows());
  let h = cb.svg;
  const py = cb.bottom + 8, ph = Math.max(80, 400 - py);
  h += ol(rr(8, py, 344, ph, 9), '#f4f6fa', '#56627d', 1.3);
  h += `<rect x="9" y="${py + 1}" width="342" height="15" rx="8" fill="#dfe4ee"/><rect x="9" y="${py + 9}" width="342" height="8" fill="#dfe4ee"/>`;
  h += `<rect x="40" y="${py + 3.5}" width="200" height="10" rx="5" fill="#fff"/><text x="46" y="${py + 11}" font-size="7" fill="#56627d">файл: index.html — так его видит браузер</text>`;
  h += `<clipPath id="pv"><rect x="9" y="${py + 17}" width="342" height="${ph - 18}"/></clipPath><g clip-path="url(#pv)">`;
  // blocks
  const blocks = [];
  fr.forEach((f, i) => {
    const tg = S.tags[i], words = f.t.split(' ');
    if (!tg || tg === 'a' || tg === 'b') {
      const ws = words.map(w => ({ t: w, st: tg || 'n' }));

    } else if (tg === 'li') {
      const lb = blocks[blocks.length - 1];
      if (lb && lb.type === 'ul') lb.items.push(words); else blocks.push({ type: 'ul', items: [words] });
    } else blocks.push({ type: tg, words: words.map(w => ({ t: w, st: 'n', bold: true })) });
  });
  let y = py + 22;
  const X = 18, W = 324;
  for (const b of blocks) {
    if (b.type === 'h1') { const r = flow(b.words, X, y + 15, W, 16, 19, '#111827'); h += r.svg; y += r.h + 8; }

    else if (b.type === 'p') { const r = flow(b.words.map(w => ({ t: w.t, st: 'n' })), X, y + 10, W, 9.5, 12.5, '#1f2937'); h += r.svg; y += r.h + 6; }
    else if (b.type === 'inl') { const r = flow(b.words, X, y + 10, W, 9.5, 12.5, '#1f2937'); h += r.svg; y += r.h + 4; }
    else if (b.type === 'ul') {
      y += 2;

      y += 6;
    }
  }
  h += `</g>`;
  return h;
}

  const ps = 8.8 * k, py = hy + 14 * k + ps;
  ['Лучший кофе в Шымкенте с 2015 года.', '• Капучино — 900 ₸', '• Латте — 1000 ₸', '• Чай с молоком — 500 ₸'].forEach((s, i) => {

  });
  if (label) h += `<text x="${x + w / 2}" y="${y - 5}" font-size="8" fill="${C.mut}" text-anchor="middle">${label}</text>`;

let P = {}, drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

scene.addEventListener('pointerdown', e => {

scene.addEventListener('pointermove', e => {

  if (!d.ok) return err('Сайт не найден: этот домен вам не принадлежит.', 'Выберите свободный домен.');
  if (ip === '—') return err('DNS не знает адрес сайта.', 'Нет записи A: домен → IP.');
  if (ip === '192.168.1.5') return err('Сервер не отвечает.', '192.168.1.x — адрес в домашней сети, из интернета его не видно.');
  if (ip === '127.0.0.1') return err('Телефон обратился сам к себе.', '127.0.0.1 — это «этот же компьютер».');
  if (!S.up['index.html']) return err('Ошибка 404: страница не найдена.', 'На сервере нет главной страницы index.html.');
  const lines = [];
  const styled = !!S.up['style.css'], script = !!S.up['script.js'], photo = !!S.up['photo.jpg'];
  if (!styled) lines.push(['Нет style.css — сайт без оформления.', '#b45309']);
  if (!photo) lines.push(['Нет photo.jpg — вместо фото пустая рамка.', '#b45309']);
  if (!script) lines.push(['Нет script.js — кнопка не работает.', '#b45309']);
  if (!S.https) lines.push(['Браузер: «Не защищено» — включите HTTPS.', '#b91c1c']);
  const ok = !lines.length;
  if (ok) lines.push(['Сайт открыт из интернета!', '#15803d'], ['Замочек: соединение шифруется.', '#374151'], [d.d + ' → ' + ip, '#374151']);
  S.res = { level: ok ? 'ok' : 'warn', url, lock: S.https, site: true, styled, script, photo, lines };
  toast(ok ? 'Сайт опубликован: его видит любой человек в интернете!' : 'Сайт открылся, но не всё в порядке. Смотрите на экран телефона.');
  update();
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  for (const [k, o] of Object.entries(P)) {
    if (drag && drag.id === k) continue;
    const nx = reduce ? o.rx : o.x + (o.rx - o.x) * Math.min(1, dt * 12), ny = reduce ? o.ry : o.y + (o.ry - o.y) * Math.min(1, dt * 12);
    if (Math.abs(o.rx - nx) + Math.abs(o.ry - ny) > 0.3) { o.x = nx; o.y = ny; anim = true; } else if (o.x !== o.rx || o.y !== o.ry) { o.x = o.rx; o.y = o.ry; anim = true; }
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

  if (S.tab === 'scheme' && !S.noScheme) renderScheme(m);
  if (S.tab === 'scheme' && S.noScheme) { const r = $('#pane-scheme .reads'); if (r) renderReadsOnly(m, r); }
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}
function renderReadsOnly(m, r) {
  const dd = r.querySelectorAll('dd');
  if (LID() === 'css' && dd.length === 3) { dd[0].textContent = `${m.match}/${m.total}`; dd[1].textContent = S.css.h1Size + 'px'; dd[2].textContent = f1(m.cP) + ':1'; }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'html') {
    const doc = htmlDoc(), st = utf8Stats(doc), tags = (doc.match(/<\/?[a-z][a-z0-9]*/gi) || []).length;
    let h = `<h2>Сколько весит страница</h2><div class="formula">байты = N₁·1 + N₂·2 + N₃·3</div><p class="note">Файл сохранён в кодировке UTF-8: латиница и знаки кода — 1 байт, русская буква и «ёлочки» — 2 байта, знак тенге ₸ и тире — 3 байта.</p><div class="steps">`;
    h += step('символов в файле', String(st.chars)) + step('по 1 байту (латиница, цифры, < > /)', `${st.b1} · 1 = ${st.b1}`) + step('по 2 байта (кириллица, « »)', `${st.b2} · 2 = ${st.b2 * 2}`) + step('по 3 байта (₸, —)', `${st.b3} · 3 = ${st.b3 * 3}`);
    h += step('размер файла', `${st.b1} + ${st.b2 * 2} + ${st.b3 * 3} = ${st.bytes} Б ≈ ${f1(st.bytes / 1024)} КБ`, 'sum') + `</div>`;
    h += `<h3>Теги</h3><div class="steps">` + step('тегов в файле (открывающих и закрывающих)', String(tags)) + step('элементов с разметкой в &lt;body&gt;', `${m.tagged} из ${m.total}`) + step('верно размечено', `${m.correct} из ${m.total}`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Каждый открывающий тег, кроме одиночных вроде &lt;meta&gt; и &lt;link&gt;, должен иметь пару — закрывающий тег со слешем.</p>`;
    return h;
  }
  if (id === 'css') {
    const k = PROPS.find(p => p.k === S.psel).type === 'color' ? S.psel : 'h1Color', hex = S.css[k], [r, g, b] = rgb(hex);
    const hx = [1, 3, 5].map(i => hex.slice(i, i + 2));
    let h = `<h2>Цвет и контраст</h2><div class="formula">${hex} → rgb(${r}, ${g}, ${b})</div><h3>Перевод из 16-ричной (${PROPS.find(p => p.k === k).sel} ${PROPS.find(p => p.k === k).prop})</h3><div class="steps">`;
    const dig = c => parseInt(c, 16);
    ['красный', 'зелёный', 'синий'].forEach((nm, i) => { const p = hx[i]; h += step(`${nm}: ${p}`, `${dig(p[0])}·16 + ${dig(p[1])} = ${dig(p[0]) * 16 + dig(p[1])}`); });
    h += `</div><h3>Контраст текста и фона</h3><div class="formula" style="font-size:15px">K = (L₁ + 0,05) / (L₂ + 0,05)</div><div class="steps">`;
    const Lb = lum(S.css.bodyBg), Lp = lum(S.css.pColor), Lh = lum(S.css.h1Color);
    h += step('яркость фона L', f2(Lb)) + step('яркость текста p', f2(Lp)) + step('контраст абзаца', `${f1(m.cP)} : 1 ${m.cP >= 4.5 ? '✓ читается' : '✗ мало'}`, 'sum') + step('яркость заголовка', f2(Lh)) + step('контраст заголовка', `${f1(m.cH)} : 1 ${m.cH >= 3 ? '✓' : '✗ мало'}`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">L — относительная яркость цвета от 0 (чёрный) до 1 (белый). Правило доступности WCAG: обычному тексту нужен контраст не меньше 4,5 : 1, крупным заголовкам — не меньше 3 : 1. Если цвет текста совпадает с фоном, K = 1 — текст невидим.</p>`;
    h += `<h3>Размер</h3><div class="steps">` + step('h1 { font-size }', `${S.css.h1Size}px`) + step('относительно текста 16px', `${S.css.h1Size} / 16 = ${f2(S.css.h1Size / 16)}`) + `</div>`;
    return h;
  }
  if (id === 'js') {
    const Ls = L();
    let h = `<h2>Трассировка программы</h2><div class="formula">count ← ${OPT_A[S.optA].includes('=') ? OPT_A[S.optA].split('=')[1].trim() : 'count (не меняется)'}</div><p class="note">Строка 4: ${esc(OPT_A[S.optA])}. Строка 5: ${esc(OPT_B[S.optB])}.</p>`;
    h += `<h3>Клики</h3>`;
    h += S.trace.length ? `<div class="steps">` + S.trace.slice(-8).map(r => step(`клик ${r.n}: count ${r.before} → ${r.after}`, `Итого «${esc(r.out)}»`)).join('') + `</div>` : `<p class="note">Нажмите «В корзину» — здесь появится каждое выполнение обработчика.</p>`;
    h += `<h3>Цель</h3><div class="steps">` + step('нужно', `${Ls.goal * Ls.price} ₸`) + step('чашек', `${Ls.goal * Ls.price} / ${Ls.price} = ${Ls.goal}`) + step('сейчас', `${S.count} · ${Ls.price} = ${S.count * Ls.price} ₸`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Если в строке 5 стоит count + price, при count = ${S.count} получится ${S.count + Ls.price}: сложение вместо умножения. А текст в кавычках — строка, она выводится как есть.</p>`;
    return h;
  }
  const kbit = m.kb * 8, t = kbit / (S.speed * 1000);
  let h = `<h2>Время загрузки</h2><div class="formula">t = объём / скорость</div><div class="steps">`;
  h += L().files.map(f => step(f.n + (S.up[f.n] ? ' ✓' : ''), `${f.kb} КБ`)).join('');
  h += step('загружено', `${m.kb} из ${m.totalKb} КБ`, 'sum') + `</div><h3>Расчёт для загруженного</h3><div class="steps">`;
  h += step('объём в битах', `${m.kb} КБ · 8 = ${kbit} Кбит`) + step('скорость', `${S.speed} Мбит/с = ${S.speed * 1000} Кбит/с`) + step('время', `${kbit} / ${S.speed * 1000} ≈ ${t < 0.1 ? t.toFixed(3).replace('.', ',') : f2(t)} с`, 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">Байт = 8 бит, поэтому КБ умножаем на 8. Расчёт примерный: 1 КБ = 1024 байта, а приставки скорости десятичные. Больше всего весит фото — перед публикацией картинки сжимают, чтобы сайт быстро открывался в мобильном интернете.</p>`;
  h += `<h3>Чек-лист</h3><div class="steps">` + step('файлы на сервере', `${m.nUp}/${m.nFiles}`) + step('домен', m.domain ? (m.domain.ok ? m.domain.d + ' ✓' : 'недопустим') : '—') + step('запись A', `${m.domain ? m.domain.d : 'домен'} → ${m.ip}${m.ip === L().serverIp ? ' ✓' : ''}`) + step('HTTPS', m.https ? 'вкл ✓' : 'выкл') + step('сайт открыт', m.live ? 'да ✓' : 'нет', 'sum') + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  const g = (v, label, r) => `<div class="gauge"><b style="width:${clamp(v * 100, 0, 100).toFixed(1)}%"></b></div><div class="lr"><span>${label}</span><span>${r}</span></div>`;
  if (m.kind === 'html') el.innerHTML = `<div class="k">Разметка</div><div class="v ${ok ? 'ok' : ''}">${m.correct} из ${m.total}</div>` + g(m.correct / m.total, 'верно', `${m.tagged} с тегом`);
  else if (m.kind === 'css') el.innerHTML = `<div class="k">Как в макете</div><div class="v ${ok ? 'ok' : ''}">${m.match} из ${m.total}</div>` + g(m.match / m.total, 'контраст p', f1(m.cP) + ':1');
  else if (m.kind === 'js') el.innerHTML = `<div class="k">Итого, ₸</div><div class="v ${ok ? 'ok' : ''}">${esc(m.out)}</div>` + g(clamp(m.count / L().goal, 0, 1), 'count', String(m.count));
  else el.innerHTML = `<div class="k">Публикация</div><div class="v ${ok ? 'ok' : ''}">${m.live ? 'онлайн' : m.res ? (m.res.level === 'warn' ? 'с ошибками' : 'не открыт') : 'офлайн'}</div>` + g((m.nUp / m.nFiles + (m.domain && m.domain.ok ? 1 : 0) + (m.ip === L().serverIp ? 1 : 0) + (m.https ? 1 : 0)) / 4, 'файлы', `${m.nUp}/${m.nFiles}`);
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  html: '<text x="5" y="13" font-size="8" fill="#72d4e8" font-family="monospace">&lt;h1&gt;</text><path d="M28 10h32" stroke="#e8ecf4" stroke-width="3"/><text x="5" y="25" font-size="8" fill="#72d4e8" font-family="monospace">&lt;p&gt;</text><path d="M24 22h30" stroke="#8b96ad" stroke-width="2"/>',
  css: '<rect x="4" y="4" width="58" height="22" rx="3" fill="#1d2940"/><path d="M18 12h30" stroke="#ffb547" stroke-width="3.4"/><path d="M12 20h40" stroke="#e8ecf4" stroke-width="1.6"/>',
  js: '<rect x="5" y="9" width="26" height="12" rx="3" fill="#ffb547"/><text x="40" y="19" font-size="9" fill="#86e0a8" font-family="monospace">+1</text>',
  pub: '<rect x="4" y="9" width="16" height="12" rx="2" fill="none" stroke="#e8ecf4"/><path d="M23 15h14m-4-3 4 3-4 3" fill="none" stroke="#8b96ad"/><rect x="42" y="5" width="12" height="20" rx="2" fill="#1d2940" stroke="#86e0a8"/><circle cx="51" cy="10" r="1.2" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function placeFiles() {
  P = {};
  const Ls = L(); if (!Ls.files) return;
  Ls.files.forEach((f, k) => { if (!S.up[f.n]) { const hm = fileHome(k); P['f' + f.n] = { x: hm.x, y: hm.y, rx: hm.x, ry: hm.y }; } });
}
// returning card: after upload removal, keep home targets in sync
function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetState();
  if (Ls.id === 'js') S.log = [['страница загружена', C.mut]];
  placeFiles();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '', guide = '';
  if (id === 'html') {
    now = `Код <body> страницы кофейни (6 фрагментов текста). Ученик выбирает тег для каждого фрагмента: ${Ls.frags.map((f, i) => `«${f.t}» — ${S.tags[i] ? '<' + S.tags[i] + '>' : 'без тега'}`).join('; ')}. Выбран фрагмент № ${S.fsel + 1}. Верно размечено ${m.correct} из ${m.total}. Пункты li автоматически оборачиваются в <ul>, у ссылки a появляется атрибут href. Предпросмотр показывает, как браузер рисует такую разметку (текст без тегов склеивается в одну строку).`;
    guide = 'Не называй тег для конкретного фрагмента: спроси, чем этот текст является на странице — заголовком, абзацем, пунктом перечня или ссылкой.';
  }
  if (id === 'css') {
    const T = Ls.target;
    now = `Файл style.css: body { background: ${S.css.bodyBg} } (${CN[S.css.bodyBg]}), h1 { color: ${S.css.h1Color} (${CN[S.css.h1Color]}); font-size: ${S.css.h1Size}px; text-align: ${S.css.h1Align} }, p { color: ${S.css.pColor} (${CN[S.css.pColor]}) }. Справа макет дизайнера: тёмно-синий фон, оранжевый заголовок крупно по центру, светлый текст. Совпало ${m.match} из ${m.total} свойств. Контраст абзаца с фоном ${f1(m.cP)}:1, заголовка ${f1(m.cH)}:1. Выбрано свойство ${PROPS.find(p => p.k === S.psel).sel} ${PROPS.find(p => p.k === S.psel).prop}.`;
    guide = `Макет ученик видит сам. Помогай сравнивать: спроси, какое свойство отвечает за цвет фона, за выравнивание, за размер. Точный размер заголовка (${T.h1Size}px) назван в задании.`;
  }
  if (id === 'js') {
    now = `script.js: let count = 0; const price = ${Ls.price}; по клику на кнопку «В корзину» выполняются строка 4: «${OPT_A[S.optA]}» и строка 5: «${OPT_B[S.optB]}», затем if (count >= 5) показывается «Печенье в подарок!». Сейчас count = ${S.count}, «Итого» показывает «${S.out}», кликов с последней перезагрузки ${S.clicks}. Любая правка кода перезагружает страницу (count снова 0). Код ${m.codeOk ? 'исправен' : 'содержит ошибки'}. Цель — «Итого» ровно ${Ls.goal * Ls.price}.`;
    guide = 'Не говори, какой вариант строки правильный: спроси, сохраняется ли результат в переменную, чем строка в кавычках отличается от выражения и какое действие даёт сумму за несколько чашек.';
  }
  if (id === 'pub') {
    now = `Публикация сайта. Файлы на ноутбуке: index.html, style.css, script.js, photo.jpg; на сервере хостинга (IP ${Ls.serverIp}) сейчас: ${Ls.files.filter(f => S.up[f.n]).map(f => f.n).join(', ') || 'ничего'}. Домен: ${m.domain ? m.domain.d + (m.domain.ok ? ' (свободен)' : ' (недопустим)') : 'не выбран'}; варианты: arman-coffee.kz, google.kz, «арман кофе.kz». Запись A в DNS указывает на ${m.ip}. HTTPS ${m.https ? 'включён' : 'выключен'}. ${m.res ? 'Последняя попытка открыть с телефона: ' + m.res.lines.map(l => l[0]).join(' ') : 'Сайт с телефона ещё не открывали.'}`;
    guide = 'Не выполняй шаги за ученика: спроси, чего не хватает в цепочке «файлы на сервере → домен → запись A → HTTPS», и почему адреса 192.168.x.x и 127.0.0.1 не годятся для сайта в интернете.';
  }
  return [
    `Раздел: информатика, 9 класс, тема «Создание сайтов». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${unesc(Ls.text.join(' '))}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    S.done[id] ? 'Задание уже выполнено — можно обсуждать свободно.' : guide,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = {
    html: 'Зачем нужны теги, если браузер и так покажет текст?',
    css: 'Почему цвет записывают как #ffb547?',
    js: 'Чем count = count + 1 отличается от count + 1?',
    pub: 'Зачем сайту домен, если есть IP-адрес?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
