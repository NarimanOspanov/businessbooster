<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 9 класс: линейные и квадратные неравенства, метод интервалов, системы неравенств.">
<title>Неравенства</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Математика · Неравенства</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: числовые прямые с ответами неравенств, парабола с перетаскиваемой вершиной, знаки интервалов и системы неравенств. Элементы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
const sd = (v, d = 3) => { if (isInt(v)) return ns(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && s !== '0' ? '−' : '') + s; };
const par = v => v < 0 ? '(' + ns(v) + ')' : String(v);
const fm = v => isInt(v) ? ns(Math.round(v)) : sd(v, 2);
const STRICT = { '<': true, '>': true, '≤': false, '≥': false };
const cmp = (op, a, b) => op === '<' ? a < b - 1e-9 : op === '>' ? a > b + 1e-9 : op === '≤' ? a <= b + 1e-9 : a >= b - 1e-9;
function poly(a, b, c, rhs = ' = 0') {
  let s = '';
  const term = (k, v) => { if (!k) return; const ak = Math.abs(k); s += (s ? (k < 0 ? ' − ' : ' + ') : (k < 0 ? '−' : '')) + (v && ak === 1 ? '' : ak) + v; };
  term(a, 'x²'); term(b, 'x'); term(c, '');
  return (s || '0') + rhs;
}
// solution set from points on a line: segments (between points) and the points themselves
function runsOf(pts, segIn, ptIn) {
  const els = [];
  for (let i = 0; i <= pts.length; i++) { els.push({ t: 's', i, on: !!segIn[i] }); if (i < pts.length) els.push({ t: 'p', i, on: !!ptIn[i] }); }
  const runs = []; let cur = null;
  els.forEach(e => { if (e.on) { if (!cur) cur = [e, e]; else cur[1] = e; } else if (cur) { runs.push(cur); cur = null; } });
  if (cur) runs.push(cur);
  return runs.map(([a, b]) => ({
    lo: a.t === 's' ? (a.i === 0 ? null : pts[a.i - 1]) : pts[a.i], loC: a.t === 'p',
    hi: b.t === 's' ? (b.i === pts.length ? null : pts[b.i]) : pts[b.i], hiC: b.t === 'p' }));
}
const isPoint = r => r.lo !== null && r.hi !== null && r.lo === r.hi;
function fmtRun(r) {
  if (isPoint(r)) return `{${fm(r.lo)}}`;
  return (r.lo === null ? '(−∞' : (r.loC ? '[' : '(') + fm(r.lo)) + '; ' + (r.hi === null ? '+∞)' : fm(r.hi) + (r.hiC ? ']' : ')'));
}
const fmtRuns = runs => runs.length ? runs.map(fmtRun).join(' ∪ ') : '∅';

// lesson 1: linear inequalities
const LIN = [
  { show: '3x − 5 < 7', l: x => 3 * x - 5, r: () => 7, op: '<', lt: 'левая 3x − 5', b: 4, dir: 'L', cl: false,
    steps: [['переносим −5 вправо', '3x < 7 + 5'], ['приводим', '3x < 12'], ['делим на 3 (> 0)', 'x < 4, знак тот же']] },
  { show: '−2x + 4 ≥ 10', l: x => -2 * x + 4, r: () => 10, op: '≥', lt: 'левая −2x + 4', b: -3, dir: 'L', cl: true,
    steps: [['переносим 4 вправо', '−2x ≥ 10 − 4'], ['приводим', '−2x ≥ 6'], ['делим на −2 (< 0)', 'x ≤ −3, знак меняется']] },
  { show: '1 − 2x < x − 8', l: x => 1 - 2 * x, r: x => x - 8, op: '<', lt: 'левая 1 − 2x', b: 3, dir: 'R', cl: false,
    steps: [['x влево, числа вправо', '−2x − x < −8 − 1'], ['приводим', '−3x < −9'], ['делим на −3 (< 0)', 'x > 3, знак меняется']] },
];
// lesson 3: method of intervals
const INT = [
  { show: '(x + 3)(x − 1)(x − 4) < 0', f: x => (x + 3) * (x - 1) * (x - 4), fs: '(x + 3)(x − 1)(x − 4)', op: '<', pts: [{ x: -3 }, { x: 1 }, { x: 4 }] },
  { show: '(x − 2) / (x + 1) ≥ 0', f: x => (x - 2) / (x + 1), fs: '(x − 2) / (x + 1)', op: '≥', pts: [{ x: -1, den: true }, { x: 2 }] },
  { show: '(x − 3)²(x + 2) ≤ 0', f: x => (x - 3) * (x - 3) * (x + 2), fs: '(x − 3)²(x + 2)', op: '≤', pts: [{ x: -2 }, { x: 3 }] },
];
const SGN = ['?', '+', '−'];
// lesson 4: systems (each solution is one interval; lo/hi null = infinity)
const SYS = [

const KEY = 'luch-math-ineq';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            li: 0, bd: 0, dir: 'R', cl: false, probe: 0, lsolved: {},
            a: 1, b: -2, c: -3, op: '<', seen: {},
            ii: 0, sg: [], pf: [], iok: {},
            si: 0, lo: -1, loC: false, hi: 1, hiC: false, none: false, ssolved: {} };

const LID = () => LESSONS[S.lesson].id;

function rootsOf(a, b, c) {
  const D = b * b - 4 * a * c;
  if (D < 0) return { D, n: 0, r: [] };
  if (D === 0) return { D, n: 1, r: [-b / (2 * a)] };
  const s = Math.sqrt(D), r1 = (-b - s) / (2 * a), r2 = (-b + s) / (2 * a);
  return { D, n: 2, r: [Math.min(r1, r2), Math.max(r1, r2)] };
}
const TYPES = { between: 'между корнями', outside: 'два луча', all: 'любое x', none: 'нет решений', point: 'одна точка', allbut: 'все, кроме точки' };
function quadType(a, n, op) {
  const same = (op === '>' || op === '≥') === (a > 0), strict = STRICT[op];
  if (n === 2) return same ? 'outside' : 'between';
  if (n === 1) return same ? (strict ? 'allbut' : 'all') : (strict ? 'none' : 'point');
  return same ? 'all' : 'none';
}
function testPts(pts) {
  const n = pts.length, out = [];
  for (let i = 0; i <= n; i++) {
    if (i === 0) out.push(Math.floor(pts[0]) - 1);
    else if (i === n) out.push(Math.ceil(pts[n - 1]) + 1);
    else { const a = pts[i - 1], b = pts[i], f = Math.floor((a + b) / 2); out.push(f > a && f < b ? f : (a + b) / 2); }
  }
  return out;
}
function intState(e, sg, pf) {
  const xs = e.pts.map(p => p.x), tp = testPts(xs);
  const right = tp.map(t => e.f(t) > 0 ? 1 : 2);
  const want = e.op === '<' || e.op === '≤' ? 2 : 1;
  const fillOK = e.pts.map(p => !STRICT[e.op] && !p.den);
  const all = sg.every(v => v > 0), signsOK = sg.every((v, i) => v === right[i]), ptsOK = pf.every((v, j) => v === fillOK[j]);
  const runs = all ? runsOf(xs, sg.map(v => v === want), pf) : null;
  return { xs, tp, right, want, fillOK, all, signsOK, ptsOK, ok: all && signsOK && ptsOK, runs };
}
function inter(A, B) {
  let lo, loC, hi, hiC;
  if (A.lo === null) { lo = B.lo; loC = B.loC; } else if (B.lo === null) { lo = A.lo; loC = A.loC; }
  else if (A.lo !== B.lo) { const P = A.lo > B.lo ? A : B; lo = P.lo; loC = P.loC; } else { lo = A.lo; loC = A.loC && B.loC; }
  if (A.hi === null) { hi = B.hi; hiC = B.hiC; } else if (B.hi === null) { hi = A.hi; hiC = A.hiC; }
  else if (A.hi !== B.hi) { const P = A.hi < B.hi ? A : B; hi = P.hi; hiC = P.hiC; } else { hi = A.hi; hiC = A.hiC && B.hiC; }
  if (lo !== null && hi !== null && (lo > hi || (lo === hi && !(loC && hiC)))) return null;
  return { lo, loC, hi, hiC };
}
const sameEnd = (v1, c1, v2, c2) => v1 === null ? v2 === null : v2 !== null && v1 === v2 && c1 === c2;
const linAns = () => ({ lo: S.dir === 'R' ? S.bd : null, loC: S.dir === 'R' && S.cl, hi: S.dir === 'L' ? S.bd : null, hiC: S.dir === 'L' && S.cl });
const linTxt = () => 'x ' + (S.dir === 'L' ? (S.cl ? '≤' : '<') : (S.cl ? '≥' : '>')) + ' ' + ns(S.bd);
const userRun = () => ({ lo: S.lo, loC: S.lo !== null && S.loC, hi: S.hi, hiC: S.hi !== null && S.hiC });

function model() {
  const id = LID();
  if (id === 'lin') {
    const e = LIN[S.li], lv = e.l(S.probe), rv = e.r(S.probe), truth = cmp(e.op, lv, rv);
    const match = S.bd === e.b && S.dir === e.dir && S.cl === e.cl;
    return { kind: id, e, li: S.li, lv, rv, truth, match, nSolved: LIN.filter((_, i) => S.lsolved[i]).length, solved: S.lsolved };
  }
  if (id === 'quad') {
    const { a, b, c, op } = S, R0 = rootsOf(a, b, c), f = x => a * x * x + b * x + c;
    const segIn = R0.r.length ? testPts(R0.r).map(t => cmp(op, f(t), 0)) : [cmp(op, f(0), 0)];
    const runs = runsOf(R0.r, segIn, R0.r.map(() => !STRICT[op]));
    return { kind: id, a, b, c, op, f, D: R0.D, n: R0.n, r: R0.r, runs, type: quadType(a, R0.n, op), vx: -b / (2 * a), vy: c - b * b / (4 * a), seen: S.seen };
  }
  if (id === 'interval') {
    const e = INT[S.ii], st = intState(e, S.sg[S.ii], S.pf[S.ii]);
    return { kind: id, ii: S.ii, e, sg: S.sg[S.ii], pf: S.pf[S.ii], st, nOK: INT.filter((_, i) => S.iok[i]).length, iok: S.iok };
  }
  const sy = SYS[S.si], ans = inter(sy.A, sy.B), u = userRun();
  const match = ans === null ? S.none : !S.none && sameEnd(u.lo, u.loC, ans.lo, ans.loC) && sameEnd(u.hi, u.hiC, ans.hi, ans.hiC);
  return { kind: 'system', si: S.si, sy, ans, u, none: S.none, match, nSolved: SYS.filter((_, i) => S.ssolved[i]).length, solved: S.ssolved };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col, fs = 12) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 14, w, 28, on ? (col || FG) : '#1a2438', `rx="8" stroke="${col || (on ? FG : '#33405c')}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, fs, label, on ? '#0b1019' : (col || FG), 'middle', 'font-weight="500"')}</g>`;
}
function curve(f, x0, x1, X, Y, ylo, yhi, n = 320) {

}
// number line −8 … 8
const NL = { x0: 40, k: 27.5, min: -8, max: 8 };
const XN = x => NL.x0 + (x - NL.min) * NL.k;
const iXN = px => (px - NL.x0) / NL.k + NL.min;
const EL = XN(-8.7), ER = XN(8.7);
function axisN(y, labels = true) {
  let h = L(EL, y, ER + 4, y, '#6b7690', 1.4) + `<path d="M${(ER + 11).toFixed(1)} ${y}l-8 -4v8z" fill="#6b7690"/>`;

  if (r.lo === null) h += `<path d="M${(a - 3).toFixed(1)} ${y}l10 -6.5v13z" fill="${col}"/>`;

const P2 = { x0: 30, x1: 490, y0: 144, y1: 318, xmin: -6, xmax: 6, ymin: -8, ymax: 8 };

const iY2 = py => (P2.y1 - py) / (P2.y1 - P2.y0) * (P2.ymax - P2.ymin) + P2.ymin;

  if (a === 'ihint') { toast('Возьмите любое x внутри интервала, подставьте в каждый множитель и перемножьте знаки.'); return; }
  if (/^(lo|hi)[-+]$/.test(a)) {
    const k = a.slice(0, 2), d = a[2] === '-' ? -1 : 1, cur = S[k];
    let v;
    if (cur === null) v = k === 'lo' ? (d > 0 ? NL.min : null) : (d < 0 ? NL.max : null);
    else { v = cur + d; if (k === 'lo' && v < NL.min) v = null; if (k === 'hi' && v > NL.max) v = null; }
    setEnd(k, v); return;
  }
  if (a === 'none') { S.none = !S.none; renderTools(); update(); }
}

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'lin') return `решено ${m.nSolved} из ${LIN.length} · ваш ответ ${linTxt()}`;

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const pbtn = (data, label, on) => `<button data-p="${data}" aria-pressed="${!!on}">${label}</button>`;
const reads3 = (a, b, c) => `<dl class="reads"><div><dt>${a}</dt><dd id="r1"></dd></div><div><dt>${b}</dt><dd id="r2"></dd></div><div><dt>${c}</dt><dd id="r3"></dd></div></dl>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'lin') h = `<h2>Линейное неравенство</h2><div class="chips">${LIN.map((e, i) => pbtn('li-' + i, e.show, S.li === i)).join('')}</div>` + reads3('Проба', 'Ответ', 'Решено') +
    slider('inP', 'пробная точка x', -8, 8, 1, S.probe) + slider('inB', 'граница ответа', -8, 8, 1, S.bd) +
    `<h3>Луч и точка</h3><div class="chips">${pbtn('dir-L', '← влево', S.dir === 'L')}${pbtn('dir-R', 'вправо →', S.dir === 'R')}<button data-x="cl" id="clBtn" aria-pressed="${S.cl}">закрашенная</button></div><div id="sDiag"></div>`;
  if (id === 'quad') h = `<h2>Квадратное неравенство</h2><div class="chips">${OPS.map((o, i) => pbtn('op-' + i, '… ' + o + ' 0', S.op === o)).join('')}</div>` + reads3('D', 'Корней', 'Вид') +
    slider('inA', 'a (не ноль)', -3, 3, 1, S.a) + slider('inBq', 'b', -12, 12, 1, S.b) + slider('inC', 'c', -12, 12, 1, S.c) + '<p class="note" id="sAns" style="margin-top:12px"></p><div id="sDiag"></div>';
  if (id === 'interval') h = `<h2>Метод интервалов</h2><div class="chips">${INT.map((e, i) => pbtn('ie-' + i, 'Неравенство ' + (i + 1), S.ii === i)).join('')}</div>` +
    `<p class="note" id="sEq" style="margin-top:12px"></p>` + reads3('Знаков', 'Точки', 'Решено') + `<h3>Знаки интервалов</h3><div class="chips" id="sSg"></div><h3>Точки</h3><div class="chips" id="sPt"></div><div id="sDiag"></div>`;
  if (id === 'system') h = `<h2>Система ${S.si + 1}</h2><div class="chips">${SYS.map((s, i) => pbtn('si-' + i, 'Система ' + (i + 1), S.si === i)).join('')}</div>` + reads3('1-е', '2-е', 'Ответ') +
    slider('inLo', 'левый конец (крайнее слева — −∞)', -9, 8, 1, S.lo === null ? -9 : S.lo) + slider('inHi', 'правый конец (крайнее справа — +∞)', -8, 9, 1, S.hi === null ? 9 : S.hi) +

  on('#inBq', 'input', e => setCoef('b', +e.target.value));
  on('#inC', 'input', e => setCoef('c', +e.target.value));
  on('#inLo', 'input', e => { const v = +e.target.value; setEnd('lo', v === -9 ? null : v); });

}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const pr = (s, v) => { const x = el.querySelector(s); if (x) x.setAttribute('aria-pressed', !!v); };
  if (!el.querySelector('#sDiag')) return;
  const press = (pre, cur) => el.querySelectorAll(`[data-p^="${pre}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.p === pre + cur));
  if (m.kind === 'lin') {
    set('#r1', m.truth ? 'верно' : 'неверно'); set('#r2', linTxt()); set('#r3', `${m.nSolved}/${LIN.length}`);
    set('#inPO', ns(S.probe)); set('#inBO', ns(S.bd)); val('#inP', S.probe); val('#inB', S.bd);
    press('li-', m.li); press('dir-', S.dir); pr('#clBtn', S.cl);
  } else if (m.kind === 'quad') {
    set('#r1', ns(m.D)); set('#r2', m.n); set('#r3', TYPES[m.type]);
    set('#inAO', ns(m.a)); set('#inBqO', ns(m.b)); set('#inCO', ns(m.c)); val('#inA', m.a); val('#inBq', m.b); val('#inC', m.c);
    press('op-', OPS.indexOf(m.op)); set('#sAns', poly(m.a, m.b, m.c, ' ' + m.op + ' 0') + ' → x ∈ ' + fmtRuns(m.runs));
  } else if (m.kind === 'interval') {
    set('#sEq', m.e.show); set('#r1', `${m.sg.filter(v => v).length}/${m.sg.length}`); set('#r2', m.pf.map(v => v ? '●' : '○').join(' ')); set('#r3', `${m.nOK}/${INT.length}`);
    press('ie-', m.ii);
    const xs = m.st.xs, nm = i => i === 0 ? `(−∞; ${ns(xs[0])})` : i === xs.length ? `(${ns(xs[i - 1])}; +∞)` : `(${ns(xs[i - 1])}; ${ns(xs[i])})`;
    const sg = el.querySelector('#sSg'), pt = el.querySelector('#sPt');
    sg.innerHTML = m.sg.map((v, i) => `<button data-s="${i}" aria-pressed="${v > 0}">${nm(i)}: ${SGN[v]}</button>`).join('');
    pt.innerHTML = m.e.pts.map((p, j) => `<button data-t="${j}" aria-pressed="${m.pf[j]}">x = ${ns(p.x)}: ${m.pf[j] ? 'закрашена' : 'выколота'}</button>`).join('');
    sg.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { cycleSign(+b.dataset.s); updateScheme(model()); });
    pt.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { togglePt(+b.dataset.t); updateScheme(model()); });
  } else {
    set('#r1', m.sy.sa[m.sy.sa.length - 1]); set('#r2', m.sy.sb[m.sy.sb.length - 1]); set('#r3', m.none ? '∅' : fmtRun(m.u));
    set('#inLoO', S.lo === null ? '−∞' : ns(S.lo)); set('#inHiO', S.hi === null ? '+∞' : ns(S.hi));
    val('#inLo', S.lo === null ? -9 : S.lo); val('#inHi', S.hi === null ? 9 : S.hi);
    press('si-', m.si); pr('[data-x="loC"]', S.loC); pr('[data-x="hiC"]', S.hiC); pr('[data-x="none"]', S.none);
  }
}

      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'lin') {
    const e = m.e;
    let h = `<h2>${e.show}</h2><div class="formula" style="font-size:15px">ax > b, a < 0 ⇒ x < b/a</div><h3>Пробная точка x = ${ns(S.probe)}</h3><div class="steps">` +
      step('левая часть', sd(m.lv, 2)) + step('правая часть', sd(m.rv, 2)) + step('сравнение', `${sd(m.lv, 2)} ${e.op} ${sd(m.rv, 2)} — ${m.truth ? 'верно' : 'неверно'}`, 'sum') + `</div>`;
    h += `<h3>Ваш ответ</h3><div class="steps">` + step('запись', linTxt()) + step('промежуток', fmtRun(linAns())) + step('совпадает', m.match ? 'да ✓' : 'пока нет', 'sum') + `</div>`;
    if (m.solved[m.li]) h += `<h3>Решение по шагам</h3><div class="steps">` + e.steps.map((s, i) => step(s[0], s[1], i === e.steps.length - 1 ? 'sum' : '')).join('') + `</div>`;
    else h += `<p class="note" style="margin-top:10px">Решение по шагам откроется, когда ответ совпадёт. Подсказка: проверьте пробной точкой саму границу и по одной точке слева и справа от неё.</p>`;
    return h;
  }
  if (id === 'quad') {
    const { a, b, c, D, op } = m;
    const wantUp = op === '>' || op === '≥';
    let h = `<h2>${poly(a, b, c, ' ' + op + ' 0')}</h2><div class="formula" style="font-size:15px">D = b² − 4ac</div><h3>Шаг 1. Корни</h3><div class="steps">` +
      step('коэффициенты', `a = ${ns(a)}, b = ${ns(b)}, c = ${ns(c)}`) + step('D', `${par(b)}² − 4·${par(a)}·${par(c)} = ${ns(D)}`);
    if (D < 0) h += step('корни', 'нет: D < 0', 'sum');
    else if (D === 0) h += step('x = −b / (2a)', `${ns(-b)} / ${ns(2 * a)} = ${fm(m.r[0])}`, 'sum');
    else { const sq = Math.sqrt(D), sr = isInt(sq) ? String(Math.round(sq)) : '√' + D; h += step('x = (−b ± √D) / (2a)', `(${ns(-b)} ± ${sr}) / ${par(2 * a)}`) + step('корни', `${fm(m.r[0])} и ${fm(m.r[1])}${isInt(m.r[0]) && isInt(m.r[1]) ? '' : ' (округлено)'}`, 'sum'); }
    h += `</div><h3>Шаг 2. Парабола</h3><div class="steps">` + step('a = ' + ns(a), a > 0 ? 'a > 0 — ветви вверх' : 'a < 0 — ветви вниз') +
      step('нужно', `y ${op} 0 — парабола ${wantUp ? 'выше' : 'ниже'} оси${STRICT[op] ? '' : ' или на ней'}`) +
      step('корни в ответе', m.n ? (STRICT[op] ? 'нет, знак строгий' : 'да, знак нестрогий') : 'корней нет', 'sum') + `</div>`;
    h += `<h3>Шаг 3. Ответ</h3><div class="steps">` + step('вид', TYPES[m.type]) + step('x ∈', fmtRuns(m.runs), 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Короткое правило для a > 0: «больше нуля — снаружи от корней, меньше нуля — между корнями». Для a < 0 наоборот.</p>`;
  }
  if (id === 'interval') {
    const e = m.e, st = m.st, xs = st.xs;
    const nm = i => i === 0 ? `(−∞; ${ns(xs[0])})` : i === xs.length ? `(${ns(xs[i - 1])}; +∞)` : `(${ns(xs[i - 1])}; ${ns(xs[i])})`;
    let h = `<h2>Неравенство ${m.ii + 1}</h2><div class="formula" style="font-size:15px">${e.show}</div><h3>Шаг 1. Нули</h3><div class="steps">` +
      e.pts.map(p => step(p.den ? 'нуль знаменателя' : 'нуль числителя', `x = ${ns(p.x)} → ${p.den ? 'всегда выколота' : STRICT[e.op] ? 'выколота (строгий знак)' : 'закрашена (нестрогий знак)'}`)).join('') + `</div>`;
    h += `<h3>Шаг 2. Знаки подстановкой</h3><div class="steps">`;
    st.tp.forEach((t, i) => {
      if (!m.sg[i]) h += step(nm(i), `возьмите x = ${ns(t)} и отметьте знак`);
      else { const v = e.f(t); h += step(nm(i), `x = ${ns(t)}: ${sd(v, 2)} → ${v > 0 ? '+' : '−'}${m.sg[i] === st.right[i] ? ' ✓' : ' (у вас ' + SGN[m.sg[i]] + ')'}`); }
    });
    h += `</div><h3>Шаг 3. Ответ</h3><div class="steps">` + step('нужен знак', st.want === 1 ? '+ (выражение больше нуля)' : '− (выражение меньше нуля)') +
      step('ваш ответ', st.runs ? fmtRuns(st.runs) : 'расставьте все знаки', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Множитель в квадрате неотрицателен: через его нуль знак не меняется. Поэтому у (x − 3)² змейка «отскакивает» от прямой.</p>`;
  }
  const sy = m.sy;
  let h = `<h2>Система ${m.si + 1}</h2><div class="formula" style="font-size:15px">{ ${sy.a} ; ${sy.b} }</div><h3>Первое: ${sy.a}</h3><div class="steps">` +
    sy.sa.map((s, i) => step(i === sy.sa.length - 1 ? 'ответ' : 'шаг ' + (i + 1), s, i === sy.sa.length - 1 ? 'sum' : '')).join('') + step('промежуток', fmtRun(sy.A)) + `</div>` +
    `<h3>Второе: ${sy.b}</h3><div class="steps">` + sy.sb.map((s, i) => step(i === sy.sb.length - 1 ? 'ответ' : 'шаг ' + (i + 1), s, i === sy.sb.length - 1 ? 'sum' : '')).join('') + step('промежуток', fmtRun(sy.B)) + `</div>`;
  h += `<h3>Пересечение</h3><div class="steps">` + step('ваш ответ', m.none ? '∅' : fmtRun(m.u));
  if (m.solved[m.si]) h += step('верно', m.ans ? fmtRun(m.ans) + ' ✓' : 'общих точек нет, ∅ ✓', 'sum');
  else h += step('совпадает', 'пока нет — найдите, где штриховки накладываются', 'sum');
  return h + `</div><p class="note" style="margin-top:10px">Левый конец ответа — больший из левых концов, правый — меньший из правых. Если левый оказался правее правого, решений нет.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'lin') el.innerHTML = `<div class="k">Пробная точка</div><div class="v ${m.truth ? 'ok' : ''}">x = ${ns(S.probe)}</div><div class="lr"><span>неравенство</span><span>${m.truth ? 'верно' : 'неверно'}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${LIN.length}</span></div>`;
  else if (id === 'quad') el.innerHTML = `<div class="k">Вид ответа</div><div class="v ${m.seen[m.type] ? 'ok' : ''}" style="font-size:13px">${TYPES[m.type]}</div><div class="lr"><span>D</span><span>${ns(m.D)}</span></div><div class="lr"><span>найдено</span><span>${MAIN.filter(k => m.seen[k]).length}/4</span></div>`;
  else if (id === 'interval') el.innerHTML = `<div class="k">Неравенство ${m.ii + 1}</div><div class="v ${m.iok[m.ii] ? 'ok' : ''}">${m.iok[m.ii] ? 'решено' : 'знаки ' + m.sg.filter(v => v).length + '/' + m.sg.length}</div><div class="lr"><span>точек</span><span>${m.e.pts.length}</span></div><div class="lr"><span>решено</span><span>${m.nOK}/${INT.length}</span></div>`;
  else el.innerHTML = `<div class="k">Система ${m.si + 1}</div><div class="v ${m.match ? 'ok' : ''}">${m.match ? 'решена' : 'ищем'}</div><div class="lr"><span>ответ</span><span>${m.none ? '∅' : 'промежуток'}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${SYS.length}</span></div>`;
}

function update() {
  const id = LID();
  if (id === 'lin') {
    const e = LIN[S.li];
    if (S.bd === e.b && S.dir === e.dir && S.cl === e.cl && !S.lsolved[S.li]) {
      S.lsolved[S.li] = true; toast(`${e.show}: ответ ${linTxt()}.`);
      const nx = LIN.findIndex((_, j) => !S.lsolved[j]); if (nx >= 0) setTimeout(() => { if (LID() === 'lin') { S.li = nx; update(); } }, 1400);
    }
  }
  if (id === 'system') {
    const m0 = model();
    if (m0.match && !S.ssolved[S.si]) {
      S.ssolved[S.si] = true; toast(`Система ${S.si + 1}: x ∈ ${m0.ans ? fmtRun(m0.ans) : '∅'}.`);
      const nx = SYS.findIndex((_, j) => !S.ssolved[j]); if (nx >= 0) setTimeout(() => { if (LID() === 'system') { S.si = nx; if (S.tab === 'scheme') buildScheme(); update(); } }, 1400);
    }
  }
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Неравенства покорены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  lin: '<path d="M4 20H62" stroke="#8b96ad"/><path d="M4 13H38" stroke="#ffb547" stroke-width="3"/><circle cx="40" cy="13" r="3.5" fill="#0b1019" stroke="#ffb547" stroke-width="2"/>',
  quad: '<path d="M10 3Q33 50 56 3" fill="none" stroke="#5fb4d9" stroke-width="1.6"/><path d="M4 18H62" stroke="#8b96ad"/><path d="M21 18H45" stroke="#86e0a8" stroke-width="3"/>',
  interval: '<path d="M4 18H62" stroke="#8b96ad"/><path d="M4 18Q13 4 22 18Q33 32 44 18Q53 4 62 18" fill="none" stroke="#b59cff" stroke-width="1.5"/><circle cx="22" cy="18" r="2.5" fill="#e8ecf4"/><circle cx="44" cy="18" r="2.5" fill="#e8ecf4"/>',
  system: '<path d="M4 22H62" stroke="#8b96ad"/><path d="M14 8H62" stroke="#5fb4d9" stroke-width="2.5"/><path d="M4 14H44" stroke="#b59cff" stroke-width="2.5"/><path d="M14 22H44" stroke="#ffb547" stroke-width="3"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  const L0 = LESSONS[0], L1 = LESSONS[1], L2 = LESSONS[2], L3 = LESSONS[3];
  S.li = L0.li; S.bd = L0.bd; S.dir = L0.dir; S.cl = L0.cl; S.probe = L0.probe; S.lsolved = {};
  S.a = L1.a; S.b = L1.b; S.c = L1.c; S.op = L1.op; S.seen = {};
  S.ii = L2.ii; S.sg = INT.map(e => e.pts.map(() => 0).concat([0])); S.pf = INT.map(e => e.pts.map(() => false)); S.iok = {};
  S.si = L3.si; S.lo = L3.lo; S.hi = L3.hi; S.loC = false; S.hiC = false; S.none = false; S.ssolved = {};
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (st.clientWidth - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'lin') now = `Неравенство ${m.e.show} (${m.li + 1} из ${LIN.length}). Пробная точка x = ${ns(S.probe)}: левая часть ${sd(m.lv, 2)}, правая ${sd(m.rv, 2)}, неравенство ${m.truth ? 'верно' : 'неверно'}. ` +
    `Ответ ученика на прямой: ${linTxt()}, то есть x ∈ ${fmtRun(linAns())}; ${m.match ? 'совпадает с решением' : 'пока не совпадает'}. Решено: ${LIN.map((e, i) => e.show + (m.solved[i] ? ' — да' : ' — нет')).join('; ')}.`;
  if (id === 'quad') now = `Неравенство ${poly(m.a, m.b, m.c, ' ' + m.op + ' 0')}. D = ${ns(m.D)}, ${rootTxt(m)}, ветви ${m.a > 0 ? 'вверх' : 'вниз'}. Ответ на экране: x ∈ ${fmtRuns(m.runs)} (вид «${TYPES[m.type]}»). ` +
    `Вершину параболы можно тянуть, знак неравенства — переключать. Уже собраны виды: ${MAIN.filter(k => m.seen[k]).map(k => TYPES[k]).join(', ') || 'пока ни одного'}; нужно собрать все четыре: ${MAIN.map(k => TYPES[k]).join(', ')}.`;
  if (id === 'interval') now = `Неравенство ${m.ii + 1}: ${m.e.show}. Нули: ${m.e.pts.map(p => ns(p.x) + (p.den ? ' (знаменатель)' : '')).join(', ')}. ` +
    `Знаки ученика по интервалам слева направо: ${m.sg.map(v => SGN[v]).join(', ')}; точки: ${m.e.pts.map((p, j) => `x = ${ns(p.x)} ${m.pf[j] ? 'закрашена' : 'выколота'}`).join(', ')}. ` +
    (m.st.all ? (m.st.ok ? 'Всё верно.' : m.st.signsOK ? 'Знаки верны, но точки отмечены неверно.' : 'Среди знаков есть ошибка.') : 'Не все знаки расставлены.') + ` Верно решено ${m.nOK} из ${INT.length}.`;
  if (id === 'system') now = `Система ${m.si + 1}: { ${m.sy.a} ; ${m.sy.b} }. Решение первого: ${fmtRun(m.sy.A)}, второго: ${fmtRun(m.sy.B)} (показаны штриховкой). ` +
    `Ответ ученика: ${m.none ? 'нет решений (∅)' : 'x ∈ ' + fmtRun(m.u)}; ${m.match ? 'верно' : 'пока неверно'}. Решено систем ${m.nSolved} из ${SYS.length}.`;
  return [
    `Раздел: математика, 9 класс, алгебра, тема «Неравенства». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (решения неравенств, знаки интервалов, ответы систем): веди ученика наводящими вопросами, предлагай проверить подстановкой и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    lin: 'Почему знак меняется при делении на отрицательное число?', quad: 'Как по параболе понять, где неравенство верно?',
    interval: 'Почему через (x − 3)² знак не меняется?', system: 'Чем ответ системы отличается от ответа совокупности?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
