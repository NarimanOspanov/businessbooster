<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 11 класс: метод координат в пространстве — координаты точки, векторы, скалярное произведение и угол, уравнение плоскости и расстояние от точки до плоскости.">
<title>Координаты и векторы в пространстве</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG 3D axes and cube in parallel projection) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene [data-drag]{cursor:move}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 290px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>

      <div class="prog" aria-label="Прогресс"><b>Коорд. 3D</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: прямоугольная система координат в пространстве и куб в параллельной проекции. Оси можно вращать, точки и концы векторов — перетаскивать, вершины куба — отмечать."></svg>
    <div class="task" id="taskCard" aria-live="polite">
      <div class="k" id="taskK">Задание</div>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>

      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const pn = v => v < 0 ? `(${num(v)})` : num(v);          // number in brackets when negative
const pt3 = p => `(${p.map(num).join('; ')})`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CY_ = '#72d4e8', VI = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', RD = '#ff8a73';
const DEG = Math.PI / 180;
const isSq = n => { const r = Math.round(Math.sqrt(n)); return r * r === n; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const root = n => isSq(n) ? num(Math.round(Math.sqrt(n))) : `√${n}`;
const rootL = n => isSq(n) ? num(Math.round(Math.sqrt(n))) : `√${n} ≈ ${fmt(Math.sqrt(n), 2)}`;

// ---------- 3D vectors ----------
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => mul(a, 1 / (len(a) || 1));
const same = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
const len2 = a => dot(a, a);

// ---------- lesson 1–2 data ----------
const GX = 4, ZLO = -3, ZHI = 4;               // points live in x, y ∈ [−4; 4], z ∈ [−3; 4]
const PA = [3, -2, 1], PB = [-1, 2, 3], PM = [1, 0, 2];
const VA = [2, -1, 1], VB = [-1, 2, 2], VP2 = [3, 0, 4];   // p = 2a + b

// ---------- the cube ABCDA1B1C1D1, edge 4, A at the origin ----------
const E = 4;
const VC = { A: [0, 0, 0], B: [4, 0, 0], C: [4, 4, 0], D: [0, 4, 0], A1: [0, 0, 4], B1: [4, 0, 4], C1: [4, 4, 4], D1: [0, 4, 4] };
const VN = Object.keys(VC);
const nm = k => k.replace('1', '₁');
const EDGES = [['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A'], ['A1', 'B1'], ['B1', 'C1'], ['C1', 'D1'], ['D1', 'A1'], ['A', 'A1'], ['B', 'B1'], ['C', 'C1'], ['D', 'D1']];
const eid = e => e[0] + '-' + e[1];
const FACES = [
  { n: [0, 0, -1], v: ['A', 'B', 'C', 'D'] }, { n: [0, 0, 1], v: ['A1', 'B1', 'C1', 'D1'] },
  { n: [0, -1, 0], v: ['A', 'B', 'B1', 'A1'] }, { n: [0, 1, 0], v: ['D', 'C', 'C1', 'D1'] },
  { n: [-1, 0, 0], v: ['A', 'D', 'D1', 'A1'] }, { n: [1, 0, 0], v: ['B', 'C', 'C1', 'B1'] }];
const EFACES = Object.fromEntries(EDGES.map(e => [eid(e), FACES.map((f, i) => f.v.includes(e[0]) && f.v.includes(e[1]) ? i : -1).filter(i => i >= 0)]));
const segKey = (p, q) => VN.indexOf(p) < VN.indexOf(q) ? p + '-' + q : q + '-' + p;
const segName = k => k.split('-').map(nm).join('');
const segDir = k => { const [p, q] = k.split('-'); return sub(VC[q], VC[p]); };
const DIAG = [4, 4, 4];                          // AC1
const segKind = k => { const d = segDir(k), z = d.filter(x => x === 0).length; return z === 2 ? 'ребро' : z === 1 ? 'диагональ грани' : 'диагональ куба'; };
const PERP3 = [];
for (let i = 0; i < VN.length; i++) for (let j = i + 1; j < VN.length; j++) { const k = VN[i] + '-' + VN[j]; if (dot(segDir(k), DIAG) === 0) PERP3.push(k); }
const ON_A1BD = ['A1', 'B', 'D'];

const LESSONS = [
  { id: 'point', title: 'Координаты точки в пространстве',
    text: ['Прямоугольная система координат в пространстве — три взаимно перпендикулярные оси Ox, Oy и Oz с общим началом O и одной единицей длины. Каждые две оси задают координатную плоскость: Oxy, Oyz и Oxz.',

const KEY = 'luch-math-space3d';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: Math.max(0, LESSONS.findIndex(l => l.id === saved.lesson)), done: saved.done || {}, tab: 'overview', hl: null,
            yaw: -110, pitch: 20, B: [3, 2, 0], M: [-3, 3, 0], box: true, p: [1, 1, 1], cons: false,
            segs: [], pend: null, last: null, n: [1, 0, 1], M0: 'B', Pk: null, mode: 'm0' };

// ---------- plane: equation, section of the cube ----------
function eq3(c, d) {   // a x + b y + c z + d = 0
  const parts = [];
  const term = (k, v) => { if (!k) return; const m = Math.abs(k); parts.push([k < 0 ? '−' : '+', (m === 1 && v ? '' : m) + v]); };
  term(c[0], 'x'); term(c[1], 'y'); term(c[2], 'z'); term(d, '');
  if (!parts.length) return '0 = 0';
  return parts.map(([s, t], i) => i === 0 ? (s === '−' ? '−' : '') + t : ` ${s} ${t}`).join('') + ' = 0';
}
function planeSection(n, d) {
  const poly = [];
  const sd = q => dot(n, q) + d;
  const addp = q => { if (!poly.some(r => len(sub(r, q)) < 1e-6)) poly.push(q); };
  for (const e of EDGES) {
    const u = VC[e[0]], v = VC[e[1]], su = sd(u), sv = sd(v), zu = Math.abs(su) < 1e-9, zv = Math.abs(sv) < 1e-9;
    if (zu) addp(u);
    if (zv) addp(v);
    if (!zu && !zv && su * sv < 0) addp(add(u, mul(sub(v, u), su / (su - sv))));
  }
  if (poly.length < 3) return null;
  const c = mul(poly.reduce((a, b) => add(a, b), [0, 0, 0]), 1 / poly.length);
  const e1 = unit(sub(poly[0], c)), e2 = unit(cross(n, e1));
  const an = q => Math.atan2(dot(sub(q, c), e2), dot(sub(q, c), e1));
  return poly.sort((a, b) => an(a) - an(b));
}
const frac = (p, q) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q) || 1; p /= g; q /= g; return q === 1 ? num(p) : `${p < 0 ? '−' : ''}${Math.abs(p)}/${q}`; };
const rhoTxt = (N, S2) => N === 0 ? '0' : isSq(S2) ? frac(Math.abs(N), Math.round(Math.sqrt(S2))) : `${Math.abs(N)}/√${S2} ≈ ${fmt(Math.abs(N) / Math.sqrt(S2), 2)}`;

function model() {
  const id = LID();
  if (id === 'point') {
    const ab = sub(S.B, PA);
    return { kind: id, B: S.B.slice(), M: S.M.slice(), AB2: len2(ab), ab, okB: same(S.B, PB), okM: same(S.M, PM), box: S.box,
             mid: mul(add(PA, S.B), 0.5) };
  }
  if (id === 'vec') {
    const p = S.p.slice();
    return { kind: id, p, L2: len2(p), ok: same(p, VP2), cons: S.cons };
  }
  if (id === 'dot') {
    const right = S.segs.filter(k => PERP3.includes(k)).length;
    let lr = null;
    if (S.last) { const d = mul(segDir(S.last), 1 / E), s = dot(d, [1, 1, 1]), n2 = len2(d); lr = { d, s, n2, ang: Math.acos(clamp(Math.abs(s) / Math.sqrt(n2 * 3), 0, 1)) / DEG }; }
    return { kind: id, segs: S.segs.slice(), pend: S.pend, last: S.last, lr, right, wrong: S.segs.length - right };
  }
  const n = S.n.slice(), zero = !n[0] && !n[1] && !n[2], m0 = VC[S.M0], d = -dot(n, m0), S2 = len2(n);
  const onPl = zero ? [] : VN.filter(k => dot(n, VC[k]) + d === 0);
  const okPlane = !zero && n[0] === n[1] && n[1] === n[2] && ON_A1BD.every(k => onPl.includes(k));
  let P = null;
  if (S.Pk && !zero) { const q = VC[S.Pk], N = dot(n, q) + d; P = { k: S.Pk, q, N, rho: Math.abs(N) / Math.sqrt(S2), H: sub(q, mul(n, N / S2)) }; }
  return { kind: id, n, zero, M0: S.M0, d, S2, onPl, okPlane, P, okP: S.Pk === 'C1', mode: S.mode, poly: zero ? null : planeSection(n, d) };
}

// ---------- projection (parallel, like in a school drawing) ----------
const CX = 260, CY = 205;
let VW = null;
const VIEWC = { point: { c: [0, 0, 1], K: 27 }, vec: { c: [0, 0, 1], K: 27 }, dot: { c: [2, 2, 2], K: 33 }, plane: { c: [2, 2, 2], K: 33 } };
function view() {
  const y = S.yaw * DEG, p = S.pitch * DEG, vc = VIEWC[LID()];
  VW = { c: Math.cos(y), s: Math.sin(y), cp: Math.cos(p), sp: Math.sin(p), o: vc.c, K: vc.K };
}
function P(q) {
  const x = q[0] - VW.o[0], y = q[1] - VW.o[1], z = q[2] - VW.o[2];
  const u = x * VW.c - y * VW.s, v = x * VW.s + y * VW.c;
  return { x: CX + u * VW.K, y: CY - (v * VW.sp + z * VW.cp) * VW.K, d: -v * VW.cp + z * VW.sp };
}
// screen point → model point on the horizontal plane z = zp
function unP(sx, sy, zp) {
  const u = (sx - CX) / VW.K, w = (CY - sy) / VW.K, z = zp - VW.o[2];
  const v = (w - z * VW.cp) / Math.max(VW.sp, 0.05);
  return [u * VW.c + v * VW.s + VW.o[0], -u * VW.s + v * VW.c + VW.o[1]];
}
// screen y → model z on the vertical line through (x; y)
function unZ(q, sy) {
  const x = q[0] - VW.o[0], y = q[1] - VW.o[1], v = x * VW.s + y * VW.c;
  return ((CY - sy) / VW.K - v * VW.sp) / VW.cp + VW.o[2];
}
const front = f => { const v = f.n[0] * VW.s + f.n[1] * VW.c; return -v * VW.cp + f.n[2] * VW.sp > 1e-9; };
let FS = 1;   // labels grow a little when the drawing has to be shrunk beside the task card
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${(s * FS).toFixed(1)}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const seg = (a, b, col, w = 1.6, extra = '') => { const A = P(a), B = P(b); return `<path d="M${A.x.toFixed(1)} ${A.y.toFixed(1)}L${B.x.toFixed(1)} ${B.y.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`; };
const segInk = (a, b, col, w) => seg(a, b, INK, w + 2.6) + seg(a, b, col, w);
const dash = (a, b, col, w = 1.1, op = 0.75) => seg(a, b, col, w, `stroke-dasharray="4 3" opacity="${op}"`);
const dot2 = (q, col, r = 4.5, sw = 2) => { const A = P(q); return `<circle cx="${A.x.toFixed(1)}" cy="${A.y.toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="${sw}"/>`; };
function labelAt(q, txt, col, size = 12.5, dist = 15) {
  const A = P(q), O = P(VW.o), dx = A.x - O.x, dy = A.y - O.y, L = Math.hypot(dx, dy) || 1;
  return T(A.x + dx / L * dist, A.y + dy / L * dist + 4, size, txt, col, 'middle', 'font-weight="500"');
}
const tagAt = (q, txt, col, dx = 10, dy = -10, anchor = 'start') => { const A = P(q); return T(A.x + dx, A.y + dy, 11.5, txt, col, anchor, 'font-weight="500" paint-order="stroke" stroke="#0b1019" stroke-width="3"'); };
// arrow between model points, drawn in screen space
function arrow3(a, b, col, w = 3, dashed = false) {
  const A = P(a), B = P(b), dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
  if (L < 1) return '';
  const ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.45), hw = hl * 0.45, ex = B.x - ux * hl, ey = B.y - uy * hl;
  const head = `<path d="M${B.x.toFixed(1)} ${B.y.toFixed(1)}L${(ex - uy * hw).toFixed(1)} ${(ey + ux * hw).toFixed(1)}L${(ex + uy * hw).toFixed(1)} ${(ey - ux * hw).toFixed(1)}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  const line = (c, ww, ex2) => `<path d="M${A.x.toFixed(1)} ${A.y.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${c}" stroke-width="${ww}" stroke-linecap="round" ${ex2 || ''}/>`;
  return dashed ? line(col, w - 0.6, 'stroke-dasharray="5 4"') + head : line(INK, w + 2.6) + line(col, w) + head;
}
function vecLabel(a, b, txt, col, side = 1) {
  const A = P(a), B = P(b), L = Math.hypot(B.x - A.x, B.y - A.y) || 1, nx = -(B.y - A.y) / L * side, ny = (B.x - A.x) / L * side;
  return T((A.x + B.x) / 2 + nx * 13, (A.y + B.y) / 2 + ny * 13 + 4, 13, txt, col, 'middle', 'font-weight="600" font-style="italic" paint-order="stroke" stroke="#0b1019" stroke-width="3"');
}
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
// axes with ticks; lo/hi per axis
function axesSVG(lim, labels = true) {
  let h = '';
  const AX = [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']];
  AX.forEach(([a, b, c, nmx], i) => {
    const [lo, hi] = lim[i], u = [a, b, c];
    h += seg(mul(u, lo), mul(u, hi), '#a9b4c9', 1.5);
    const A = P(mul(u, hi - 0.35)), B = P(mul(u, hi)), dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    h += `<path d="M${(B.x + ux * 4).toFixed(1)} ${(B.y + uy * 4).toFixed(1)}L${(B.x - ux * 5 - uy * 4).toFixed(1)} ${(B.y - uy * 5 + ux * 4).toFixed(1)}L${(B.x - ux * 5 + uy * 4).toFixed(1)} ${(B.y - uy * 5 - ux * 4).toFixed(1)}Z" fill="#a9b4c9"/>`;
    h += T(B.x + ux * 14, B.y + uy * 14 + 4, 13, nmx, FG, 'middle', 'font-weight="600" font-style="italic"');
    if (labels) for (let t = Math.ceil(lo); t <= Math.floor(hi - 0.5); t++) {
      if (!t) continue;
      const q = P(mul(u, t)), px = -uy * 3, py = ux * 3;
      h += `<path d="M${(q.x - px).toFixed(1)} ${(q.y - py).toFixed(1)}L${(q.x + px).toFixed(1)} ${(q.y + py).toFixed(1)}" stroke="#a9b4c9" stroke-width="1.2"/>`;
      if (t % 2 === 0) h += T(q.x + (i === 2 ? -9 : -uy * 11), q.y + (i === 2 ? 3 : ux * 11 + 3), 8.5, num(t), MU, i === 2 ? 'end' : 'middle');
    }
  });
  const O = P([0, 0, 0]);
  h += T(O.x - 8, O.y + 13, 10, 'O', FG, 'end');
  return h;
}
function gridSVG() {

// Fit the drawing into the part of the stage that the task card (top left) and the meter (top right) do not cover.
// The 3D picture rotates, so it is treated as a disc of radius R0 around (CX; CY), plus the caption strip below it.
// We look for the largest scale at which the disc and the caption avoid both cards, centred as close to the middle as possible.
let VBOX = { x: 0, y: 0, w: 520, h: 405 };
const R0 = 168, CAP = { x0: -172, x1: 172, y0: 166, y1: 198 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;

      if (!discOk(cx, cy, r) || !capOk(cx, cy, s)) continue;

// ---------- state changes ----------
const inXY = v => clamp(Math.round(v), -GX, GX), inZ = v => clamp(Math.round(v), ZLO, ZHI);
function setPt(k, q) {
  q = [inXY(q[0]), inXY(q[1]), inZ(q[2])];
  if (same(q, S[k])) return;
  if (k === 'p' && !q[0] && !q[1] && !q[2]) return;
  S[k] = q; update();
}
function setView(yaw, pitch) {
  S.yaw = ((yaw + 540) % 360) - 180; S.pitch = clamp(pitch, 8, 75);
  dirty = true; updateScheme();
}
function tapVertex(k) {
  const id = LID();
  if (id === 'dot') {
    if (!S.pend) { S.pend = k; update(); return; }
    if (S.pend === k) { S.pend = null; update(); return; }
    const key = segKey(S.pend, k);
    S.pend = null;
    if (key === 'A-C1') { toast('AC₁ — данная диагональ. Соедините другие вершины.'); update(); return; }
    const i = S.segs.indexOf(key);
    if (i >= 0) S.segs.splice(i, 1); else S.segs.push(key);
    S.last = key; update(); return;
  }
  if (id === 'plane') {

    update();
  }
}
function setN(i, v) { v = clamp(Math.round(v), -2, 2); if (v === S.n[i]) return; S.n = S.n.slice(); S.n[i] = v; renderTools(); update(); }

// ---------- pointer: drag points (lessons 1–2), drag empty space rotates, tap picks ----------
let ptr = null, dirty = true;
const toSvg = e => { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const c = scene.getScreenCTM(); return c ? p.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

  const id = LID(), out = [];

}

  if (h) { ptr = { mode: h[2], k: h[0], dx: h[1].x - p.x, dy: h[1].y - p.y, sx: p.x, sy: p.y }; return; }

  if (!ptr) return;

    if (!ptr.moved && Math.abs(dx) + Math.abs(dy) > 6) ptr.moved = true;
    if (ptr.moved) setView(ptr.yaw - dx * 0.45, ptr.pitch + dy * 0.35);
    return;
  }

const endPtr = e => {

scene.addEventListener('pointerup', endPtr);

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

  S.segs = []; S.pend = null; S.last = null; S.n = [1, 0, 1]; S.M0 = 'B'; S.Pk = null; S.mode = 'm0';
}
function act(a) {
  if (a === 'rl' || a === 'rr') { setView(S.yaw + (a === 'rl' ? -15 : 15), S.pitch); return; }
  if (a === 'view') { const Ls = LESSONS[S.lesson]; setView(Ls.yaw, Ls.pitch); return; }
  if (a === 'reset') { const y = S.yaw, p = S.pitch; resetLesson(); S.yaw = y; S.pitch = p; renderTools(); update(); return; }
  if (a === 'box') { S.box = !S.box; renderTools(); update(); return; }
  if (a === 'cons') { S.cons = !S.cons; renderTools(); update(); if (S.cons) toast('Пунктир: 2a и b, отложенный от конца 2a. Их сумма — диагональ параллелограмма.'); return; }
  if (a === 'clear') { S.segs = []; S.pend = null; S.last = null; update(); return; }
  if (a === 'm0' || a === 'pp') { S.mode = a === 'm0' ? 'm0' : 'p'; renderTools(); toast(a === 'm0' ? 'Нажмите на вершину, через которую пройдёт плоскость.' : 'Нажмите на вершину, до которой измерим расстояние.'); return; }
  if (/^n\d$/.test(a)) { const i = +a[1]; setN(i, S.n[i] >= 2 ? -2 : S.n[i] + 1); }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];

}

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (m.kind === 'point') return `B${pt3(m.B)} ${m.okB ? '✓' : ''} · M${pt3(m.M)} ${m.okM ? '✓' : ''}`;
  if (m.kind === 'vec') return `p${pt3(m.p)} · |p| = ${root(m.L2)}`;
  if (m.kind === 'dot') return `отрезков: ${m.segs.length} · перпендикулярных AC₁: ${m.right}`;
  return m.zero ? 'n = 0 — плоскость не задана' : `${eq3(m.n, m.d)}${m.P ? ' · P = ' + nm(m.P.k) : ''}`;
}

// ---------- Scheme tab ----------
function ctlSpec() {
  const id = LID();
  const v = [['sYaw', 'Поворот вокруг оси Oz, °', -180, 180, 1, () => Math.round(S.yaw), x => setView(x, S.pitch)],
             ['sPitch', 'Наклон взгляда сверху, °', 8, 75, 1, () => Math.round(S.pitch), x => setView(S.yaw, x)]];
  const xyz = (k, name) => ['x', 'y', 'z'].map((c, i) => ['s' + k + c, `${name}: ${c}`, i < 2 ? -GX : ZLO, i < 2 ? GX : ZHI, 1, () => S[k][i], x => { const q = S[k].slice(); q[i] = x; setPt(k, q); }]);
  if (id === 'point') return [...xyz('B', 'Точка B'), ...xyz('M', 'Точка M'), ...v];
  if (id === 'vec') return [...xyz('p', 'Конец вектора p'), ...v];
  if (id === 'plane') return [...['a', 'b', 'c'].map((c, i) => ['sN' + c, `Нормаль n: ${c}`, -2, 2, 1, () => S.n[i], x => setN(i, x)]), ...v];
  return v;
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  const title = { point: 'Точки A, B и M', vec: 'Вектор p = 2a + b', dot: 'Отрезки и диагональ AC₁', plane: 'Плоскость и расстояние' }[id];
  const heads = { point: ['B', 'M', 'AB'], vec: ['p', '|p|', 'p = 2a + b?'], dot: ['Отрезок', 'с AC₁', 'Угол'], plane: ['n', 'd', 'ρ(P)'] }[id];
  el.innerHTML = `<h2>${title}</h2><dl class="reads">${heads.map((t, i) => `<div><dt>${t}</dt><dd id="r${i + 1}"></dd></div>`).join('')}</dl>` +
    ctlSpec().map(([sid, label, mn, mx, st, get]) => `<div class="ctl"><label for="${sid}">${label} <output id="${sid}O"></output></label><input type="range" id="${sid}" min="${mn}" max="${mx}" step="${st}" value="${get()}"></div>`).join('') +
    `<p class="note" style="margin-top:12px">${id === 'point' || id === 'vec' ? 'Ползунки делают то же, что перетаскивание на рабочем поле. ' : ''}Повернуть вид можно и пальцем: тащите пустое место на рабочем поле.</p>`;
  ctlSpec().forEach(([sid, , , , , , set]) => el.querySelector('#' + sid).addEventListener('input', e => set(+e.target.value)));
  updateScheme();
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  m = m || model();
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  ctlSpec().forEach(([sid, , , , , get]) => { const x = el.querySelector('#' + sid); if (!x) return; set('#' + sid + 'O', num(get())); if (document.activeElement !== x) x.value = get(); });
  if (m.kind === 'point') { set('#r1', pt3(m.B)); set('#r2', pt3(m.M)); set('#r3', root(m.AB2)); }
  else if (m.kind === 'vec') { set('#r1', pt3(m.p)); set('#r2', root(m.L2)); set('#r3', m.ok ? 'да ✓' : 'нет'); }
  else if (m.kind === 'dot') { set('#r1', m.last ? segName(m.last) : '—'); set('#r2', m.lr ? 'a·b = ' + num(m.lr.s * 16) : '—'); set('#r3', m.lr ? trim(m.lr.ang, 1) + '°' : '—'); }
  else { set('#r1', pt3(m.n)); set('#r2', m.zero ? '—' : num(m.d)); set('#r3', m.P ? rhoTxt(m.P.N, m.S2) : '—'); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'point') {
    const d = m.ab, md = m.mid;
    let h = `<h2>Расстояние и середина</h2><div class="formula">AB = √(Δx² + Δy² + Δz²)</div><h3>Разности координат B − A</h3><div class="steps">` +
      step('Δx', `${pn(m.B[0])} − ${pn(PA[0])} = ${num(d[0])}`) + step('Δy', `${pn(m.B[1])} − ${pn(PA[1])} = ${num(d[1])}`) + step('Δz', `${pn(m.B[2])} − ${pn(PA[2])} = ${num(d[2])}`) +
      step('AB²', `${pn(d[0])}² + ${pn(d[1])}² + ${pn(d[2])}² = ${m.AB2}`) + step('AB', rootL(m.AB2), 'sum') + `</div>`;
    h += `<h3>Середина отрезка AB</h3><div class="steps">` +
      ['x', 'y', 'z'].map((c, i) => step(c + '<sub>M</sub>', `(${num(PA[i])} + ${pn(m.B[i])}) : 2 = ${num(md[i])}`)).join('') +
      step('середина сейчас', pt3(md)) + step('ваша точка M', `${pt3(m.M)} ${same(m.M, md) ? '✓' : '— не совпадает'}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Почему формула с тремя квадратами: сначала по Пифагору находят диагональ «пола» √(Δx² + Δy²), а затем — гипотенузу треугольника с катетами «пол» и Δz.</p>`;
  }
  if (m.kind === 'vec') {
    const a2 = mul(VA, 2), s = add(a2, VB);
    let h = `<h2>Действия с векторами</h2><div class="formula">2a + b = (2x₁ + x₂; 2y₁ + y₂; 2z₁ + z₂)</div><h3>Покоординатно</h3><div class="steps">` +
      step('2a', `2·(2; −1; 1) = ${pt3(a2)}`) +
      ['x', 'y', 'z'].map((c, i) => step(c, `${pn(a2[i])} + ${pn(VB[i])} = ${num(s[i])}`)).join('') +
      step('ваш p', `${pt3(m.p)} ${m.ok ? '✓' : ''}`, 'sum') + `</div>`;
    h += `<h3>Длины</h3><div class="steps">` + step('|a| = √(4 + 1 + 1)', rootL(6)) + step('|b| = √(1 + 4 + 4)', '3') +
      step('|p| = √(x² + y² + z²)', `√(${pn(m.p[0])}² + ${pn(m.p[1])}² + ${pn(m.p[2])}²) = ${rootL(m.L2)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Обратите внимание: |2a + b| не равно 2|a| + |b| ≈ 7,9. Длины складываются как векторы, только когда векторы сонаправлены.</p>`;
  }
  if (m.kind === 'dot') {
    let h = `<h2>Угол между прямыми</h2><div class="formula">cos φ = |a·b| : (|a|·|b|)</div>`;
    if (!m.last) h += `<p class="note">Соедините две вершины — здесь появится расчёт: направляющий вектор отрезка, скалярное произведение с AC₁ и угол.</p>`;
    else {
      const d = segDir(m.last), s = dot(d, DIAG), n2 = len2(d);
      h += `<h3>${segName(m.last)} и AC₁</h3><div class="steps">` +
        step('вид отрезка', segKind(m.last)) + step('a = ' + segName(m.last), pt3(d)) + step('b = AC₁', '(4; 4; 4)') +
        step('a·b', `${pn(d[0])}·4 + ${pn(d[1])}·4 + ${pn(d[2])}·4 = ${num(s)}`) +
        step('|a|·|b|', `${root(n2)}·√48 ≈ ${fmt(Math.sqrt(n2 * 48), 2)}`) +
        step('cos φ', `|${num(s)}| : ${fmt(Math.sqrt(n2 * 48), 2)} ≈ ${fmt(Math.abs(s) / Math.sqrt(n2 * 48), 3)}`) +
        step('φ', `${trim(m.lr.ang, 1)}°${s === 0 ? ' — перпендикулярны' : ''}`, 'sum') + `</div>`;
    }
    h += `<h3>Ваши отрезки</h3><div class="steps">` + (m.segs.length ? m.segs.map(k => step(segName(k), PERP3.includes(k) ? '⟂ AC₁ ✓' : `a·b = ${num(dot(segDir(k), DIAG))}`)).join('') : step('отрезков', 'пока нет')) + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Координаты вершин: A(0; 0; 0), B(4; 0; 0), C(4; 4; 0), D(0; 4; 0), а у A₁, B₁, C₁, D₁ те же x и y и z = 4.</p>`;
  }
  const n = m.n, m0 = VC[m.M0];
  let h = `<h2>Плоскость и расстояние</h2><div class="formula">a(x − x₀) + b(y − y₀) + c(z − z₀) = 0</div>`;
  if (m.zero) return h + `<p class="note">Нормаль n(0; 0; 0) не задаёт направления: плоскость не определена. Сделайте хотя бы одну координату n ненулевой.</p>`;
  h += `<h3>Уравнение</h3><div class="steps">` + step('нормаль n', pt3(n)) + step('M₀ = ' + nm(m.M0), pt3(m0)) +
    step('d = −(ax₀ + by₀ + cz₀)', `−(${pn(n[0])}·${pn(m0[0])} + ${pn(n[1])}·${pn(m0[1])} + ${pn(n[2])}·${pn(m0[2])}) = ${num(m.d)}`) +
    step('плоскость', eq3(n, m.d), 'sum') + `</div>`;
  h += `<h3>Проверка вершин A₁, B, D</h3><div class="steps">` + ON_A1BD.map(k => { const q = VC[k], v = dot(n, q) + m.d; return step(nm(k) + pt3(q), v === 0 ? 'лежит в плоскости ✓' : `ax + by + cz + d = ${num(v)}`); }).join('') + `</div>`;
  h += `<h3>Расстояние от P</h3>`;
  if (!m.P) h += `<p class="note">Включите режим «Точка P» и нажмите на вершину куба.</p>`;
  else {
    const q = m.P.q;
    h += `<div class="steps">` + step('P = ' + nm(m.P.k), pt3(q)) +
      step('ax₁ + by₁ + cz₁ + d', `${pn(n[0])}·${pn(q[0])} + ${pn(n[1])}·${pn(q[1])} + ${pn(n[2])}·${pn(q[2])} + ${pn(m.d)} = ${num(m.P.N)}`) +
      step('√(a² + b² + c²)', root(m.S2)) + step('ρ', rhoTxt(m.P.N, m.S2), 'sum') + `</div>`;
    h += `<h3>Все вершины</h3><div class="steps">` + VN.map(k => { const N = dot(n, VC[k]) + m.d; return step(nm(k), `ρ = ${rhoTxt(N, m.S2)}`); }).join('') + `</div>`;
  }
  return h + `<p class="note" style="margin-top:10px">Вершины по разные стороны от плоскости дают выражение ax + by + cz + d разных знаков. Самая далёкая — та, у которой модуль этого выражения наибольший.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'point') el.innerHTML = `<div class="k">Расстояние AB</div><div class="v ${ok ? 'ok' : ''}">${rootL(m.AB2)}</div><div class="lr"><span>B</span><span class="${m.okB ? 'ok' : ''}">${pt3(m.B)}</span></div><div class="lr"><span>M</span><span class="${m.okM ? 'ok' : ''}">${pt3(m.M)}</span></div>`;
  else if (m.kind === 'vec') el.innerHTML = `<div class="k">Длина |p|</div><div class="v ${ok ? 'ok' : ''}">${rootL(m.L2)}</div><div class="lr"><span>p</span><span class="${m.ok ? 'ok' : ''}">${pt3(m.p)}</span></div><div class="lr"><span>2a + b</span><span>${m.ok ? '✓' : '?'}</span></div>`;
  else if (m.kind === 'dot') el.innerHTML = `<div class="k">Последний отрезок</div><div class="v ${ok ? 'ok' : ''}">${m.last ? segName(m.last) : '—'}</div><div class="lr"><span>a·AC₁</span><span>${m.lr ? num(m.lr.s * 16) : '—'}</span></div><div class="lr"><span>угол</span><span class="${m.lr && m.lr.s === 0 ? 'ok' : ''}">${m.lr ? trim(m.lr.ang, 1) + '°' : '—'}</span></div>`;
  else el.innerHTML = `<div class="k">Расстояние ρ(P)</div><div class="v ${ok ? 'ok' : ''}">${m.P ? rhoTxt(m.P.N, m.S2) : '—'}</div><div class="lr"><span>n</span><span class="${m.okPlane ? 'ok' : ''}">${pt3(m.n)}</span></div><div class="lr"><span>M₀ · P</span><span>${nm(m.M0)} · ${m.P ? nm(m.P.k) : '—'}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Метод координат освоен!'), 700);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  point: '<path d="M22 20V3M22 20L12 28M22 20H52" stroke="#8b96ad" stroke-width="1.2" fill="none"/><path d="M40 8V17" stroke="#ffb547" stroke-dasharray="2 2"/><circle cx="40" cy="8" r="3" fill="#ffb547"/><path d="M40 14.5l2.5 2.5-2.5 2.5-2.5-2.5z" fill="none" stroke="#ffb547"/>',
  vec: '<path d="M22 20V3M22 20L12 28M22 20H52" stroke="#8b96ad" stroke-width="1.2" fill="none"/><path d="M22 20L44 8" stroke="#ffb547" stroke-width="2"/><path d="M22 20L34 24" stroke="#72d4e8" stroke-width="1.6"/><path d="M22 20L28 6" stroke="#b79cff" stroke-width="1.6"/>',
  dot: '<path d="M14 10H34V27H14ZM14 10L24 4H44L34 10M44 4V21L34 27" fill="none" stroke="#8b96ad" stroke-width="1.2"/><path d="M14 27L44 4" stroke="#ffb547" stroke-width="2"/><path d="M34 27L24 4" stroke="#86e0a8" stroke-width="2"/>',
  plane: '<path d="M14 10H34V27H14ZM14 10L24 4H44L34 10M44 4V21L34 27" fill="none" stroke="#8b96ad" stroke-width="1.2"/><path d="M14 10L34 27L44 4Z" fill="rgba(134,224,168,.3)" stroke="#86e0a8" stroke-width="1.2"/><path d="M30 14L38 8" stroke="#ffb547" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; ptr = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update(); requestAnimationFrame(fit);
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'point') now = `Прямоугольная система координат Oxyz, оси можно вращать. A(3; −2; 1) неподвижна. Ученик поставил B${pt3(m.B)} (${m.okB ? 'верно' : 'пока не там'}) и M${pt3(m.M)} (${m.okM ? 'середина AB' : 'не середина AB'}). Сейчас AB = ${rootL(m.AB2)}, середина AB для текущей B: ${pt3(m.mid)}.`;
  if (id === 'vec') now = `Векторы от начала координат: a(2; −1; 1), b(−1; 2; 2). Ученик построил p${pt3(m.p)}, |p| = ${rootL(m.L2)}. Это ${m.ok ? '' : 'ещё не '}вектор 2a + b. Режим «Построение» ${m.cons ? 'включён' : 'выключен'}.`;
  if (id === 'dot') now = `Куб ABCDA₁B₁C₁D₁ с ребром 4, A — начало координат, AB по Ox, AD по Oy, AA₁ по Oz; выделена диагональ AC₁(4; 4; 4). Ученик соединил: ${m.segs.length ? m.segs.map(segName).join(', ') : 'пока ничего'}. Перпендикулярных AC₁ среди них ${m.right}, неперпендикулярных ${m.wrong}. ` +
    (m.last ? `Последний отрезок ${segName(m.last)}: скалярное произведение с AC₁ = ${num(m.lr.s * 16)}, угол ${trim(m.lr.ang, 1)}°.` : '');
  if (id === 'plane') now = `Куб с ребром 4, A — начало координат. Нормаль n${pt3(m.n)}, точка M₀ = ${nm(m.M0)}, ` + (m.zero ? 'нормаль нулевая — плоскость не задана. ' : `плоскость ${eq3(m.n, m.d)}, в ней лежат вершины: ${m.onPl.map(nm).join(', ') || 'ни одной'}. `) +
    (m.P ? `Точка P = ${nm(m.P.k)}, расстояние до плоскости ${rhoTxt(m.P.N, m.S2)}.` : 'Точка P не выбрана.') + ` Режим: ${m.mode === 'm0' ? 'выбор M₀' : 'выбор P'}.`;
  return [
    `Раздел: математика, 11 класс, геометрия, тема «Метод координат в пространстве». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (координаты середины, координаты вектора 2a + b, какие диагонали перпендикулярны AC₁, уравнение плоскости A₁BD и самую далёкую вершину): веди ученика наводящими вопросами и проверяй его вычисления.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    point: 'Почему в формуле расстояния три квадрата, а не два?',
    vec: 'Почему длина 2a + b не равна 2|a| + |b|?',
    dot: 'Как скалярное произведение помогает ИИ искать похожие тексты?',
    plane: 'Как по уравнению плоскости найти её нормаль?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
