<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 5 класс: поиск информации, надёжные пароли, цифровой след, как распознать фейк.">
<title>Интернет и безопасность</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. The stage holds a small "device screen" (browser, password form, post editor, news feed) instead of an SVG bench: these lessons are about screens. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --paper:#eef1f6;
  --ink:#0b1019;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%);display:flex;flex-direction:column;gap:10px;padding:14px}
.stagetop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none}
.task{flex:1 1 auto;max-width:440px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{flex:none;width:180px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.screen{flex:1;min-height:0;overflow:auto;touch-action:manipulation;border-radius:12px}
.tools{flex:none;align-self:center;display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:100%}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}

/* the fake device window */
.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.winbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.winbar .dots{display:flex;gap:4px;flex:none}
.winbar .dots i{width:8px;height:8px;border-radius:50%;background:#3a4762}
.winbody{padding:12px}
.qbox{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:32px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:3px 10px}
.qbox .ph{color:var(--muted);font-size:13px}
.qw{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:2px 8px;font:500 12.5px/1.3 var(--font-body);cursor:pointer}
.qw.stop{color:var(--muted);text-decoration:line-through}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.kw button{background:var(--surface-2);border:1px dashed #3a4762;border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer}
.kw button[aria-pressed="true"]{border-style:solid;border-color:var(--force);color:var(--force)}
.found{font:500 11.5px/1.3 var(--font-mono);color:var(--muted);margin:0 0 8px}
.res{display:grid;gap:8px}
.ritem{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.ritem:hover{border-color:var(--muted)}
.ritem .site{font:500 11px/1.2 var(--font-mono);color:var(--ok);overflow-wrap:anywhere}
.ritem .tt{display:block;font-weight:600;font-size:14px;color:#9fd8ff;margin:3px 0 2px}
.ritem .sn{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.ritem.ad{border-color:rgba(255,181,71,.45)}
.adtag{display:inline-block;font:600 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;background:var(--force);color:var(--ink);border-radius:4px;padding:3px 5px;margin-right:6px}
.pageview{background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 16px}
.pageview h4{margin:0 0 4px;font:600 17px/1.3 var(--font-body)}
.pageview .site{font:500 11.5px var(--font-mono);color:#2c7a4b;margin-bottom:10px}
.pageview p{margin:0 0 8px;line-height:1.5;font-size:14px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.ansrow input,.pwin{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 15px var(--font-mono)}
.ansrow input{width:110px}

.profile{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.profile svg{width:40px;height:40px;flex:none}
.profile b{display:block;font-size:14px}
.profile span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.pwlbl{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pwin{width:100%;font-size:17px;letter-spacing:.04em}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keys button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:500 13px/1 var(--font-mono);cursor:pointer;min-width:44px}
.keys button:hover{border-color:var(--muted)}
.cls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cls span{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.cls span.on{border-color:var(--arm);color:var(--arm)}
.crit{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.ok::before{content:"✓ ";color:var(--ok)}
.crit li.no::before{content:"✗ ";color:var(--warn)}
.lockrow{display:flex;gap:14px;align-items:center;margin-top:12px}
.lockrow svg{width:64px;height:64px;flex:none}
.lockrow .big{font:500 18px/1.2 var(--font-mono)}
.lockrow .note{margin:2px 0 0}

.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.togs{display:grid;gap:6px}
.tog{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;line-height:1.35;cursor:pointer;width:100%}
.tog i{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);margin-top:1px;font-style:normal;font-size:11px;line-height:13px;text-align:center}
.tog[aria-pressed="true"] i{background:var(--arm);border-color:var(--arm);color:var(--ink)}
.tog[aria-pressed="true"] i::before{content:"✓"}
.tog .r{margin-left:auto;font:500 11px var(--font-mono);color:var(--warn);flex:none}
.post{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;align-self:start}
.post .ph{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px}
.post .ph i{width:26px;height:26px;border-radius:50%;background:#7b8cff;flex:none}
.post .ph small{display:block;color:#5a6478;font-size:11px}
.post svg{display:block;width:100%;height:auto}
.post .pt{padding:8px 10px 10px;font-size:13px;line-height:1.45}
.post .pt span{display:block}
.post .pt .risk{background:rgba(255,138,115,.25);border-radius:4px;padding:0 3px}
.post .empty{padding:18px 10px;color:#5a6478;font-size:13px;text-align:center}
.trail{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
.trail b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.trail ul{margin:0;padding-left:18px}
.audrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}

.news{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden}
.news .src{font:500 11.5px/1.3 var(--font-mono);color:#5a6478;padding:10px 12px 0}
.news h4{margin:4px 12px 8px;font:700 16px/1.3 var(--font-body)}
.news svg{display:block;width:100%;height:auto;max-height:150px}
.cards{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cards button{width:38px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font:500 13px var(--font-mono);cursor:pointer;position:relative}
.cards button[aria-current="true"]{border-color:var(--force)}
.cards button.t{background:rgba(134,224,168,.18);border-color:var(--ok)}
.cards button.f{background:rgba(255,138,115,.18);border-color:var(--warn)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.ck{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;cursor:pointer;line-height:1.35}
.ck b{display:block;font-weight:600}
.ck span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.ck.red{border-color:rgba(255,138,115,.6)}
.ck.red span{color:#ffb3a5}
.ck.green{border-color:rgba(134,224,168,.5)}
.ck.green span{color:#b8f0cc}
.verd{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.vbtn{border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid}
.vbtn.t{background:rgba(134,224,168,.14);border-color:var(--ok);color:var(--ok)}
.vbtn.f{background:rgba(255,138,115,.14);border-color:var(--warn);color:var(--warn)}
.verd .note{margin:0}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.bad span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{min-height:520px}
  .screen{overflow:visible}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .stage{padding:10px}
  .meter{width:128px;padding:8px}
  .meter .v{font-size:13px}
  .task{padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .editor{grid-template-columns:minmax(0,1fr)}
  .winbody{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

// ---------- lesson 2: password strength ----------
const PROFILE = { name: 'Айдар', cat: 'Барсик', year: '2014', team: 'Кайрат' };
const PERSONAL = ['айдар', 'aidar', 'ajdar', 'барсик', 'barsik', '2014', 'кайрат', 'kairat', 'kajrat'];
const COMMON = ['123', '321', 'qwerty', 'йцукен', 'password', 'пароль', 'parol', '111', '000', 'abc', 'asdf', 'qwe', 'love', 'admin'];
const CLASSES = [
  { id: 'lat', name: 'a–z', n: 26, re: /[a-z]/ }, { id: 'LAT', name: 'A–Z', n: 26, re: /[A-Z]/ },
  { id: 'cyr', name: 'а–я', n: 33, re: /[а-яё]/ }, { id: 'CYR', name: 'А–Я', n: 33, re: /[А-ЯЁ]/ },
  { id: 'dig', name: '0–9', n: 10, re: /[0-9]/ }, { id: 'sym', name: '!?#…', n: 33, re: /[^a-zA-Zа-яёА-ЯЁ0-9]/ }];
const SPEED_LG = 10; // 10^10 guesses per second: one strong computer working on a stolen password database
const YEAR_S = 31557600;
function pwModel(pw) {
  const chars = Array.from(pw), len = chars.length, low = pw.toLowerCase();
  const on = CLASSES.filter(c => c.re.test(pw)), N = on.reduce((s, c) => s + c.n, 0);
  const pers = PERSONAL.filter(t => low.includes(t)), com = COMMON.filter(t => low.includes(t));
  const lgComb = len && N ? len * Math.log10(N) : 0, lgSec = lgComb - SPEED_LG;
  const dict = pers.length > 0 || com.length > 0;
  const years = dict || !len ? 0 : 10 ** (lgSec - Math.log10(YEAR_S));
  return { kind: 'pass', pw, len, on, N, pers, com, dict, lgComb, lgSec, years };
}
function humanTime(lgSec) {
  if (lgSec < 0) return 'меньше секунды';
  const s = 10 ** lgSec;
  if (s < 60) { const n = Math.round(s); return `${n} ${plural(n, ['секунда', 'секунды', 'секунд'])}`; }
  if (s < 3600) { const n = Math.round(s / 60); return `${n} ${plural(n, ['минута', 'минуты', 'минут'])}`; }
  if (s < 86400) { const n = Math.round(s / 3600); return `${n} ${plural(n, ['час', 'часа', 'часов'])}`; }
  if (s < YEAR_S) { const n = Math.round(s / 86400); return `${n} ${plural(n, ['день', 'дня', 'дней'])}`; }
  const lgY = lgSec - Math.log10(YEAR_S);
  if (lgY < 3) { const n = Math.round(10 ** lgY); return `${n} ${plural(n, ['год', 'года', 'лет'])}`; }
  if (lgY < 6) return `${big(10 ** lgY / 1e3)} тыс. лет`;
  if (lgY < 9) return `${big(10 ** lgY / 1e6)} млн лет`;
  if (lgY < 12) return `${big(10 ** lgY / 1e9)} млрд лет`;
  return `≈ 10^${Math.floor(lgY)} лет`;
}
const sci = lg => lg < 15 ? big(10 ** lg) : `${fmt(10 ** (lg - Math.floor(lg)), 1)}·10^${Math.floor(lg)}`;
const RND = { lat: 'abcdefghijkmnpqrstuvwxyz', LAT: 'ABCDEFGHJKLMNPQRSTUVWXYZ', dig: '23456789', sym: '!?#%&*+-=@$' };

    $('#cards').querySelectorAll('button').forEach(b => b.onclick = () => { S.card = +b.dataset.c; update(); });
    const n = m.cur;
    $('#news').innerHTML = `<div class="src">${n.src}</div><h4>${n.head}</h4>${PIC[n.pic]}`;
    const op = S.opened[n.id] || {};
    $('#checks').innerHTML = CHECKS.map(c => { const o = op[c.id], cl = n.c[c.id]; return `<button class="ck ${o ? (cl[1] ? 'red' : 'green') : ''}" id="ck-${c.id}" data-k="${c.id}"><b>${c.name}</b>${o ? `<span>${cl[0]}</span>` : '<span>нажмите, чтобы проверить</span>'}</button>`; }).join('');
    $('#checks').querySelectorAll('.ck').forEach(b => b.onclick = () => { (S.opened[n.id] = S.opened[n.id] || {})[b.dataset.k] = true; update(); });
    const v = S.verdict[n.id];

}

// ---------- actions ----------
function toggleWord(w) {
  if (S.q.includes(w)) S.q = S.q.filter(x => x !== w);
  else {
    S.q = S.q.concat([w]);
    if (STOP.includes(w)) toast(`Слово «${w}» поисковик почти не учитывает — оно только занимает место в запросе.`);
  }
  S.open = null; update();
}
function openPage(id) {
  const m = searchModel(), p = pageById(id);
  S.open = id;
  if (id === 'ad') toast('Это реклама: сайт заплатил, чтобы стоять первым. Ответа тут нет.');
  else if (!p.rel) toast(id === 'forum' ? 'Форум: ответ написал случайный человек без источника. Можно ли ему верить?' : 'Это магазин или турфирма — они продают, а не отвечают на вопросы.');
  else if (p.ans) {
    const r = m.res.indexOf(p) + 1;
    if (r <= 3 && m.qLen <= 3) { S.goodOpen = true; toast(`Надёжный источник на ${r}-м месте. Найдите в тексте высоту.`); }
    else if (m.qLen > 3) toast('Источник надёжный, но в запросе больше 3 слов. Уберите лишние.');
    else toast(`Источник надёжный, но он только на ${r}-м месте. Уточните запрос, чтобы поднять его в тройку.`);
  } else toast('Надёжный сайт, но ответа на наш вопрос здесь нет.');
  update();
}
function checkAnswer() {
  const n = parseInt(String(S.ans).replace(/\D/g, ''), 10);
  if (!n) toast('Впишите число в метрах.');
  else if (n === 8000) toast('Так написано на форуме. А что говорит энциклопедия?');
  else if (n === 7010 && !S.goodOpen) toast('Число верное. Теперь подтвердите его: найдите надёжный источник в первой тройке и откройте его.');
  else if (n === 7010) toast('Верно: 7010 м.');
  else toast('Не совпадает с источником. Откройте надёжную страницу и перечитайте.');
  update();
}
function pwKey(k) {
  if (k === 'del') S.pw = Array.from(S.pw).slice(0, -1).join('');
  else if (k === 'rnd') {
    const sets = ['lat', 'LAT', 'dig', 'sym'], a = sets.map(s => pick(RND[s]));
    while (a.length < 14) a.push(pick(RND[sets[Math.floor(Math.random() * 4)]]));
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    S.pw = a.join(''); toast('Случайный пароль надёжен, но его трудно запомнить. Можно хранить в менеджере паролей.');
  } else S.pw += pick(RND[k]);
  update();
}
function publish() {
  S.posted = { on: Object.assign({}, S.on), aud: S.aud }; S.view = 'posted';
  ITEMS.forEach(i => { if (S.on[i.id] && i.risk) S.trail[i.id] = true; }); if (S.aud === 'all') S.trail.audAll = true;
  if (S.on.photo || S.on.text) S.trail[S.on.photo ? 'photo' : 'text'] = true;
  const m = traceModel();
  if (!m.postedFun) toast('Опубликовано, но без фото и подписи пост пустой. Верните их.');
  else if (m.postedRisk) toast(`Опубликовано с риском ${m.postedRisk}. За минуту пост увидели и сохранили — это уже в следе.`);
  else if (S.aud !== 'friends') toast('Риск 0? Почти: пост открыт всем. Выберите «Только друзья».');
  else toast('Опубликовано безопасно: друзья видят красоту Чарына, а незнакомцы — ничего лишнего.');
  update();
}
function delPost() {
  if (!S.posted) { toast('Удалять нечего: пост ещё не опубликован.'); return; }
  S.posted = null; S.view = 'draft'; toast('Пост удалён. Но копии и скриншоты, если их сделали, остались — след не стёрся.'); update();
}
function verdict(v) {
  const m = fakeModel(), n = m.cur;
  if (S.verdict[n.id] !== undefined) { toast('Эта новость уже проверена. Переходите к следующей.'); return; }
  if (m.opened.length < 2) { toast('Сначала откройте хотя бы 2 проверки.'); return; }
  if (v === n.truth) {
    S.verdict[n.id] = v; toast(v ? 'Верно: источники надёжные, тревожных признаков нет.' : `Верно, это фейк. Тревожных признаков: ${n.truth ? 0 : Object.values(n.c).filter(x => x[1]).length}.`);
    const next = NEWS.findIndex((x, i) => i > S.card && S.verdict[x.id] === undefined);
    const any = NEWS.findIndex(x => S.verdict[x.id] === undefined);
    const from = S.card;
    if (next >= 0 || any >= 0) setTimeout(() => { if (S.card !== from || LID() !== 'fake') return; S.card = next >= 0 ? next : any; update(); }, reduce ? 0 : 900);
  } else {
    S.miss++;
    toast(v ? 'Не спешите. Сколько красных улик вы нашли? Откройте остальные проверки.' : 'Подумайте: что тревожного в этой новости? Посмотрите на источник и другие сайты.');
  }
  update();
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function renderTools() {
  const id = LID(), B = (k, l) => `<button data-a="${k}">${l}</button>`, sep = '<span class="sep"></span>';
  $('#tools').innerHTML = id === 'search' ? B('qclear', 'Очистить запрос') + sep + B('reset', 'Заново')

    : id === 'trace' ? B('publish', 'Опубликовать') + B('view', 'Черновик / пост') + sep + B('reset', 'Заново')
    : B('prev', '‹ Новость') + B('next', 'Новость ›') + sep + B('reset', 'Заново');
}
function resetLessonState() {
  S.q = []; S.open = null; S.goodOpen = false; S.ans = '';
  S.pw = 'aidar2014';
  S.on = {}; ITEMS.forEach(i => S.on[i.id] = true); S.aud = 'all'; S.posted = null; S.trail = {}; S.view = 'draft';
  S.card = 0; S.verdict = {}; S.opened = {}; S.miss = 0;
  S.calcL = 8; S.calcC = { lat: true };
}
function act(a) {
  if (a === 'qclear') { S.q = []; S.open = null; update(); }
  if (a === 'reset') { resetLessonState(); buildScreen(); update(); }
  if (a === 'pwclear') { S.pw = ''; update(); }
  if (a === 'rnd') pwKey('rnd');
  if (a === 'publish') publish();
  if (a === 'view') { S.view = S.view === 'posted' && S.posted ? 'draft' : 'posted'; if (!S.posted) toast('Пост ещё не опубликован — показан черновик.'); update(); }
  if (a === 'prev' || a === 'next') { S.card = (S.card + (a === 'next' ? 1 : NEWS.length - 1)) % NEWS.length; update(); }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  if (S.done[LID()]) return '✓ Выполнено';

  if (m.kind === 'pass') return !m.len ? 'Пароль пуст' : m.dict ? 'Есть в словаре взломщика' : `Длина ${m.len} · перебор ${humanTime(m.lgSec)}`;
  if (m.kind === 'trace') return `Риск черновика ${m.risk} · ${m.posted ? `опубликован с риском ${m.postedRisk}` : 'не опубликован'}`;
  return `Верно отмечено ${m.correct} из ${m.total}` + (m.miss ? ` · ошибок ${m.miss}` : '');

function calcLab() {
  const N = CLASSES.filter(c => S.calcC[c.id]).reduce((s, c) => s + c.n, 0), lg = N ? S.calcL * Math.log10(N) : 0;
  return { N, lg, lgSec: lg - SPEED_LG };
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;

  if (m.kind === 'search') {

    const ix = el.querySelector('#sIndex');

  } else if (m.kind === 'pass') {
    const c = calcLab();
    set('#cLo', String(S.calcL)); set('#r1', String(c.N)); set('#r2', c.N ? `10^${Math.floor(c.lg)}` : '—'); set('#r3', c.N ? humanTime(c.lgSec) : '—');
    el.querySelectorAll('#cC button').forEach(b => b.setAttribute('aria-pressed', !!S.calcC[b.dataset.c]));
    set('#r4', String(m.len)); set('#r5', String(m.N)); set('#r6', !m.len ? '—' : m.dict ? 'словарь' : humanTime(m.lgSec));
  } else if (m.kind === 'trace') {
    set('#r1', String(m.risk)); set('#r2', m.aud === 'all' ? 'все' : 'друзья'); set('#r3', String(m.trail.length));
    el.querySelectorAll('#sItems button').forEach(b => b.setAttribute('aria-pressed', !!S.on[b.dataset.i]));
    el.querySelectorAll('#sAud button').forEach(b => b.setAttribute('aria-pressed', S.aud === b.dataset.a));
  } else {

    el.querySelectorAll('#sCards button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.c === S.card));
    const op = S.opened[m.cur.id] || {};
    el.querySelectorAll('#sChecks button').forEach(b => b.setAttribute('aria-pressed', !!op[b.dataset.k]));
  }
}

function calcHTML(m) {
  if (m.kind === 'search') {
    let h = `<h2>Разбор запроса</h2><div class="formula">${m.q.length ? m.q.map(w => STOP.includes(w) ? `<s>${w}</s>` : w).join(' + ') : '…'}</div><div class="steps">`;
    h += step('1. Слов в запросе', `${m.qLen} из 3 допустимых`, m.qLen > 3 ? 'bad' : '');
    h += step('2. Служебных (не учитываются)', String(m.qLen - m.words.length), m.qLen - m.words.length ? 'bad' : '');
    h += step('3. Страниц со всеми словами', m.words.length ? `${m.res.length} из ${m.total}` : '—');
    h += step('4. Реклама сверху', m.ad ? 'есть — пропускаем' : 'нет');
    h += step('5. Надёжный ответ в выдаче', m.goodRank ? `на ${m.goodRank}-м месте` : 'нет', m.goodRank && m.goodRank <= 3 ? 'okk' : 'bad');
    h += step('6. Открыт надёжный источник', m.goodOpen ? 'да' : 'нет', m.goodOpen ? 'okk' : '');
    h += step('7. Ответ записан', S.done.search ? '✓' : (S.ans ? 'проверьте' : '—'), S.done.search ? 'okk sum' : 'sum') + '</div>';
    h += `<h3>Как поисковик сортирует</h3><p class="note">Сначала страницы, где больше слов запроса стоит в заголовке, потом — более популярные. Поэтому популярная, но бесполезная страница может обогнать нужную, если запрос неточный.</p>`;
    return h;
  }
  if (m.kind === 'pass') {
    if (!m.len) return '<h2>Расчёт перебора</h2><p class="note">Введите пароль — здесь появится расчёт.</p>';
    let h = `<h2>Расчёт перебора</h2><div class="formula">t = N<sup>L</sup> ÷ 10<sup>10</sup> паролей/с</div>`;
    if (m.dict) h += `<div class="steps">${step('Найдено в словаре', [...m.pers, ...m.com].map(esc).join(', '), 'bad')}${step('Время взлома', 'секунды', 'bad sum')}</div><p class="note" style="margin-top:10px">Формула ниже верна только для случайных паролей. Пароль с личными данными или популярным сочетанием проверяют первым — перебор не нужен.</p>`;
    h += `<h3>Если бы пароль был случайным</h3><div class="steps">` +
      step('1. Виды символов', m.on.map(c => `${c.name}: ${c.n}`).join(' + ') || '—') +
      step('2. Алфавит N', `${m.on.map(c => c.n).join(' + ')} = ${m.N}`) +
      step('3. Длина L', String(m.len)) +
      step('4. Вариантов N^L', `${m.N}^${m.len} ≈ ${sci(m.lgComb)}`) +
      step('5. Секунд', `${sci(m.lgComb)} ÷ 10^10 ≈ ${m.lgSec < 0 ? 'меньше 1' : sci(m.lgSec)}`) +
      step('6. Время перебора', humanTime(m.lgSec), m.dict ? '' : m.years >= 100 ? 'okk sum' : 'sum') + `</div>`;
    const plus1 = (m.len + 1) * Math.log10(m.N) - SPEED_LG;
    h += `<h3>Что даст ещё один символ</h3><p class="note">Вариантов станет в ${m.N} раз больше: ${humanTime(m.lgSec)} → ${humanTime(plus1)}.</p>`;
    return h;
  }
  if (m.kind === 'trace') {
    let h = `<h2>Подсчёт риска</h2><div class="formula">риск = сумма баллов деталей + ${AUD_RISK}, если видят все</div><div class="steps">`;
    ITEMS.filter(i => i.risk).forEach(i => { h += step(i.name, S.on[i.id] ? `+${i.risk}` : '0', S.on[i.id] ? 'bad' : 'okk'); });
    h += step('Аудитория', S.aud === 'all' ? `все: +${AUD_RISK}` : 'друзья: 0', S.aud === 'all' ? 'bad' : 'okk');
    h += step('Риск черновика', `${m.risk} из ${m.maxRisk}`, m.risk ? 'bad sum' : 'okk sum') + `</div>`;
    h += `<h3>Как складывается картина</h3><p class="note">Каждая деталь по отдельности кажется безобидной. Но адрес + «уехали до воскресенья» = пустая квартира, а школа + фото = где тебя встретить. Мошенники собирают такие пазлы из нескольких постов.</p>`;
    h += `<h3>След</h3><p class="note">${m.trail.length ? `Уже в следе: ${m.trail.length} ${plural(m.trail.length, ['деталь', 'детали', 'деталей'])}. Кнопка «Заново» есть только в лаборатории — в жизни её нет.` : 'След пуст.'}</p>`;
    return h;
  }
  const n = m.cur, op = S.opened[n.id] || {};
  let h = `<h2>Новость ${S.card + 1}: улики</h2><div class="formula">тревожных признаков: ${m.red} из ${m.opened.length} открытых</div><div class="steps">`;
  CHECKS.forEach(c => { h += step(c.name, op[c.id] ? (n.c[c.id][1] ? 'тревожно' : 'в порядке') : 'не проверено', op[c.id] ? (n.c[c.id][1] ? 'bad' : 'okk') : ''); });
  h += `</div><h3>Правило</h3><div class="steps">${step('0 признаков', 'похоже на правду')}${step('1–2 признака', 'проверь ещё')}${step('3 и больше', 'почти наверняка фейк')}</div>`;
  h += `<h3>Итог</h3><div class="steps">${NEWS.map((x, i) => step(`№${i + 1}`, S.verdict[x.id] === undefined ? '—' : S.verdict[x.id] ? 'правда ✓' : 'фейк ✓', S.verdict[x.id] === undefined ? '' : 'okk')).join('')}</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'search') {
    el.innerHTML = `<div class="k">Нужная страница</div><div class="v ${ok ? 'ok' : ''}">${m.goodRank ? `место ${m.goodRank}` : 'нет в выдаче'}</div><div class="lr"><span>слов</span><span>${m.qLen}/3</span></div><div class="lr"><span>найдено</span><span>${m.words.length ? m.res.length : '—'}</span></div>`;
  } else if (m.kind === 'pass') {
    const k = !m.len || m.dict ? 0 : clamp(Math.log10(Math.max(m.years, 1e-12) * 1e12) / 14, 0, 1);
    el.innerHTML = `<div class="k">Взлом перебором</div><div class="v ${ok ? 'ok' : m.dict ? 'bad' : ''}">${!m.len ? '—' : m.dict ? 'секунды' : humanTime(m.lgSec)}</div><div class="gauge"><b style="width:${(k * 100).toFixed(1)}%;background:${k >= 1 ? 'var(--ok)' : 'var(--arm)'}"></b></div><div class="lr"><span>цель</span><span>≥ 100 лет</span></div>`;
  } else if (m.kind === 'trace') {
    el.innerHTML = `<div class="k">Риск поста</div><div class="v ${m.risk ? 'bad' : 'ok'}">${m.risk} / ${m.maxRisk}</div><div class="gauge"><b style="width:${(m.risk / m.maxRisk * 100).toFixed(1)}%;background:var(--warn)"></b></div><div class="lr"><span>в следе</span><span>${m.trail.length}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Проверено</div><div class="v ${ok ? 'ok' : ''}">${m.correct} / ${m.total}</div><div class="gauge"><b style="width:${(m.correct / m.total * 100).toFixed(1)}%"></b></div><div class="lr"><span>ошибок</span><span>${m.miss}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь в интернете тебя так просто не проведёшь!'), 900);
  }
  paintScreen(m);
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
}

    now = `Редактор поста о поездке на каньон Чарын. Включены детали: ${ITEMS.filter(i => S.on[i.id]).map(i => i.name).join('; ') || 'ничего'}. Аудитория: ${S.aud === 'all' ? 'все' : 'только друзья'}. Риск черновика ${m.risk} из ${m.maxRisk}. Незнакомец узнал бы: ${m.leaks.map(i => i.reveals).join('; ') || 'ничего лишнего'}. ${m.posted ? `Опубликован пост с риском ${m.postedRisk}.` : 'Пост ещё не опубликован.'} В цифровом следе уже: ${m.trail.length} деталей (удаление поста их не стирает). Помогай вопросами: что из этого поможет найти тебя или твой дом?`;
  }
  if (id === 'fake') {
    const op = S.opened[m.cur.id] || {};
    now = `Лента из 6 новостей, ученик проверяет каждую пятью проверками (источник, дата, другие источники, поиск по картинке, эмоции) и решает: правда или фейк. Сейчас открыта новость ${S.card + 1}: «${m.cur.head}» (${m.cur.src}). Открытые проверки: ${CHECKS.filter(c => op[c.id]).map(c => `${c.name} — ${m.cur.c[c.id][0]}`).join('; ') || 'пока ни одной'}. Верно отмечено ${m.correct} из 6, ошибок ${m.miss}. Не говори, правда это или фейк, — спрашивай, сколько тревожных признаков ученик нашёл и что они значат.`;
  }
  return [
    `Раздел: информатика, 5 класс, тема «Интернет и безопасность». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { search: 'Как выбрать ключевые слова для запроса?', pass: 'Почему длинный пароль надёжнее короткого?', trace: 'Почему нельзя удалить цифровой след?', fake: 'Как проверить фото через поиск по картинке?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
})();
</script>
