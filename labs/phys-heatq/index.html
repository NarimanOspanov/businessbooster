<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}

.scene [data-click]{cursor:pointer}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}

.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}

.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}

.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const big = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');   // 672 000
const kJ = x => `${fmt(x / 1000, x < 100000 ? 1 : 0)} кДж`;
const deg = (x, n = 0) => `${fmt(x, n)} °C`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'cap', title: 'Удельная теплоёмкость',
    text: ['Чтобы нагреть тело, ему надо передать энергию. Энергию, которую тело получает или отдаёт при теплопередаче, называют количеством теплоты Q. Её измеряют в джоулях (Дж).',
           'Сколько теплоты нужно, зависит от трёх вещей: от массы тела, от того, на сколько градусов его нагревают, и от вещества. Формула: Q = c·m·(t₂ − t₁).',
           'Буква c — удельная теплоёмкость. Она показывает, сколько джоулей нужно, чтобы нагреть 1 кг вещества на 1 °C. У воды c = 4200 Дж/(кг·°C) — больше, чем почти у всех веществ. Поэтому вода медленно нагревается и медленно остывает.'],
    why: 'Теплотехники по этой формуле рассчитывают отопление: в батареях течёт вода, потому что она запасает много тепла. Энергетики ТЭЦ в Экибастузе, Павлодаре и Алматы считают, сколько воды нагреть и сколько топлива на это уйдёт. Дома это видно в счёте за электричество: ванна горячей воды стоит дороже десятка чайников. А Балхаш и Каспий летом нагреваются медленнее суши, поэтому у воды днём прохладнее, а ночью теплее.',
    task: 'Налейте в оба стакана по 200 г: слева воду, справа подсолнечное масло. Включите обе плитки и нагрейте жидкости от 20 до 60 °C. Сравните, сколько теплоты получила каждая.',
    hint: 'Вещество меняют кнопки «Слева» и «Справа» или вкладка «Схема». Плитки одинаковые, по 500 Вт, и сами выключаются при 60 °C. Во сколько раз отличаются Q? Сравните это число с c.',
    safe: 'Масло, керосин и спирт горючие. На открытой плитке их не греют: в школьном опыте используют водяную баню и работают только при учителе.',
    stage: 'Нажмите на плитку, чтобы включить её.',
    subs: ['water', 'kero'], m0: 0.2, P: 500, t0: 20, tStop: 60, speed: 10,
    check: m => m.ok },
  { id: 'fuel', title: 'Сгорание топлива',
    text: ['Когда топливо горит, его вещество соединяется с кислородом воздуха, и выделяется энергия. Сколько теплоты выделится, зависит от массы топлива и от того, что это за топливо.',
           'Удельная теплота сгорания q показывает, сколько теплоты выделяется при полном сгорании 1 кг топлива. Формула: Q = q·m. У сухих дров q = 1,0·10⁷ Дж/кг, у природного газа 4,4·10⁷ Дж/кг — в 4,4 раза больше.',
           'В опыте считаем, что вся теплота от огня достаётся воде. На самом деле большая часть уходит в воздух, поэтому настоящему костру топлива нужно намного больше.'],
    why: 'Казахстан богат топливом: уголь Экибастуза, нефть и газ Тенгиза, Карачаганака и Кашагана. Инженеры-теплоэнергетики сравнивают топливо по q и цене, чтобы котельная грела город дешевле. Водители и логисты считают расход бензина на рейс. А семьи в посёлках, куда провели газ, обычно тратят на отопление меньше, чем на угле и дровах, и меньше дышат дымом.',
    task: 'Вскипятите 2 кг воды (она нагрета до 20 °C) сначала на дровах, а потом на природном газе. Положите топлива столько, чтобы хватило, но не больше чем на 15 % сверх нужного.',
    hint: 'Сначала посчитайте, сколько теплоты нужно воде: Q = c·m·(100 − 20). Потом найдите массу топлива: m = Q / q. Массу задайте кнопками ± или ползунком, вид топлива — кнопкой «Топливо».',

// ---------- physics ----------
// lesson 1: two identical 500 W plates, no losses
function stepCap(dt) {
  const Ls = L();
  S.on1.forEach((on, i) => {
    if (!on) return;
    const C = SUB[S.subs[i]].c * S.m, dQ = Ls.P * dt * Ls.speed;
    if (S.T1[i] + dQ / C >= Ls.tStop) {
      S.Q1[i] += (Ls.tStop - S.T1[i]) * C; S.T1[i] = Ls.tStop; S.on1[i] = false;
      toast(`${SUB[S.subs[i]].name[0].toUpperCase() + SUB[S.subs[i]].name.slice(1)}: 60 °C. Ушло ${kJ(S.Q1[i])}.`);
      renderTools(); checkCap(); update();
    } else { S.T1[i] += dQ / C; S.Q1[i] += dQ; }
  });
}
function checkCap() {
  const pair = S.subs.includes('water') && S.subs.includes('oil');
  if (!S.ok && pair && Math.abs(S.m - 0.2) < 1e-6 && S.T1.every(t => t >= L().tStop - 1e-9)) {
    const wi = S.subs.indexOf('water'), oi = S.subs.indexOf('oil');
    S.ok = true;
    setTimeout(() => toast(`Воде нужно в ${fmt(S.Q1[wi] / S.Q1[oi], 1)} раза больше теплоты, чем маслу: ${kJ(S.Q1[wi])} против ${kJ(S.Q1[oi])}.`), 3500);
  }
}
const time1 = i => S.Q1[i] / L().P;

// lesson 2: fuel burns at a fixed rate, all heat goes into the water
const needQ = () => CW * L().M * (100 - L().tw0);
function stepFuel(dt) {
  const Ls = L(), q = FUEL[S.fuel].q;
  let dm = Math.min(S.left, Ls.rate * dt / q * 1000);
  const dQ = dm / 1000 * q;
  S.left -= dm; S.Qrel += dQ;
  if (S.Tw2 < 100) {
    const dT = dQ / (CW * Ls.M);
    if (S.Tw2 + dT >= 100) { S.steam += (S.Tw2 + dT - 100) * CW * Ls.M; S.Tw2 = 100; S.boiled = true; }
    else S.Tw2 += dT;
  } else S.steam += dQ;
  if (S.left <= 1e-9) { S.left = 0; S.burning = false; finishFuel(); }
}
function finishFuel() {
  const Ls = L(), q = FUEL[S.fuel].q, need = needQ() / q * 1000;
  S.ran = true;
  const rec = { fuel: S.fuel, m: S.mf, boiled: S.boiled, T: S.Tw2, Q: S.Qrel };
  S.runs.unshift(rec); S.runs = S.runs.slice(0, 4);
  if (!S.boiled) toast(`Топливо сгорело, а вода нагрелась только до ${deg(S.Tw2)}. Нужно больше ${fn(S.fuel)}.`);
  else if (S.mf <= need * (1 + Ls.extra) + 1e-9) {
    toast(`Вода закипела, и почти ничего не ушло зря. ${fn(S.fuel)[0].toUpperCase() + fn(S.fuel).slice(1)}: ${nf(S.mf)} г.`);
    if (S.fuel === 'wood') S.wood = true;
    if (S.fuel === 'gas') S.gas = true;
  } else toast(`Вода закипела, но ${kJ(S.steam)} ушло лишь на испарение. Топлива было с большим запасом.`);
  renderTools(); update();
}
function ignite() {
  if (S.burning) return;
  if (S.ran || S.Qrel > 0) resetFuelRun();
  S.burning = true; renderTools(); update();
}

// lesson 3: calorimeter, ideal (no heat goes outside, the vessel's own heat capacity is neglected)
const theta = () => (S.mp > 0 ? (L().m1 * L().t1 + S.mp * L().t2) / (L().m1 + S.mp) : L().t1);
function pour(dm) {
  if (S.mode !== 'water') return;
  dm = Math.min(dm, S.jug); if (dm <= 0) return;
  S.jug -= dm; S.mp += dm; dirty = true;
}
function judgeMix() {
  const th = theta(), Ls = L();
  if (Math.abs(th - Ls.tNeed) <= 0.5) {
    if (!S.mix) { S.mix = true; toast(`Ровно ${deg(th, 1)}! Горячая вода отдала столько же, сколько получила холодная.`); }
  } else if (th > Ls.tNeed + 0.5) toast(`Стало ${deg(th, 1)} — горячей воды слишком много. Нажмите «Сброс».`);
  update();
}
function stepMetal(dt) {
  if (S.dropping) {
    S.drop = Math.min(1, S.drop + dt * (reduce ? 10 : 1.6));
    if (S.drop >= 1) { S.dropping = false; S.inW = true; toast('Брусок в воде. Следите за двумя термометрами.'); }
  }
  if (S.inW && !S.settled) {
    const Cw = CW * L().m1, Cb = MET[S.met].c * S.mb, th = (Cw * S.Tw3 + Cb * S.Tb) / (Cw + Cb);
    const d = (S.Tb - S.Tw3) * Math.exp(-P3.k * (1 / Cw + 1 / Cb) * dt);
    S.Tw3 = th - d * Cb / (Cw + Cb); S.Tb = th + d * Cw / (Cw + Cb);
    if (Math.abs(S.Tb - S.Tw3) < 0.05) {
      S.settled = true;
      if (!S.metal) { S.metal = true; }
      toast(`Сравнялись при ${deg(S.Tw3, 1)}: Q отд = Q пол = ${kJ(CW * L().m1 * (S.Tw3 - L().t1))}.`);
      update();
    }
  }
}
const Qpol3 = () => S.mode === 'water' ? CW * L().m1 * (theta() - L().t1) : CW * L().m1 * (S.Tw3 - L().t1);
const Qotd3 = () => S.mode === 'water' ? CW * S.mp * (L().t2 - theta()) : MET[S.met].c * S.mb * (L().tb0 - S.Tb);

function model() {
  const id = LID();
  if (id === 'cap') return { kind: id, ok: S.ok, T: S.T1.slice(), Q: S.Q1.slice() };
  if (id === 'fuel') return { kind: id, wood: S.wood, gas: S.gas, Tw: S.Tw2, Q: S.Qrel };
  return { kind: id, mix: S.mix, metal: S.metal, th: theta() };
}

  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 440, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 430 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);

}

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();

});

});
const endDrag = () => {

};

// ---------- state changes ----------
function resetCap(i) { (i === undefined ? [0, 1] : [i]).forEach(k => { S.T1[k] = L().t0; S.Q1[k] = 0; S.on1[k] = false; }); renderTools(); update(); }
function setSub(i, k) { if (S.subs[i] === k) return; S.subs[i] = k; resetCap(i); }
function setM(m) { m = clamp(Math.round(m * 20) / 20, 0.1, 0.5); if (Math.abs(m - S.m) < 1e-9) return; S.m = m; resetCap(); }
function plate(i, on) {
  if (LID() !== 'cap') return;
  if (on === undefined) on = !S.on1[i];
  if (on && S.T1[i] >= L().tStop - 1e-9) { S.T1[i] = L().t0; S.Q1[i] = 0; }
  S.on1[i] = on; renderTools(); update();
}
function resetFuelRun() { S.left = S.mf; S.burning = false; S.Tw2 = L().tw0; S.Qrel = 0; S.steam = 0; S.boiled = false; S.ran = false; }
function setMf(v) { if (S.burning) return; v = clamp(Math.round(v), 1, 150); S.mf = v; resetFuelRun(); renderTools(); update(); }
function setFuel(k) { if (S.burning || S.fuel === k) return; S.fuel = k; resetFuelRun(); renderTools(); update(); }
function resetBal() {
  const Ls = L();
  Object.assign(S, { mp: 0, jug: Ls.jug, tilt: 0, Tb: Ls.tb0, Tw3: Ls.t1, drop: 0, dropping: false, inW: false, settled: false });
  drag = null; renderTools(); update();
}
function setMode(m) { if (S.mode === m) return; S.mode = m; $('#hint').textContent = m === 'water' ? L().stage : 'Нажмите на брусок, чтобы опустить его в воду.'; resetBal(); }
function setMet(k) { if (S.met === k) return; S.met = k; resetBal(); }
function setMb(v) { v = clamp(Math.round(v * 10) / 10, 0.1, 1); if (Math.abs(v - S.mb) < 1e-9) return; S.mb = v; resetBal(); }
function dropBlock() { if (LID() !== 'bal' || S.mode !== 'metal' || S.inW || S.dropping) return; S.dropping = true; renderTools(); update(); }

let last = performance.now(), acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  if (id === 'cap') { if (S.on1.some(x => x)) { stepCap(dt); acc += dt; if (acc > 0.2) { acc = 0; update(); } dirty = true; } }
  if (id === 'fuel') { if (S.burning) { stepFuel(dt); acc += dt; if (acc > 0.2) { acc = 0; update(); } } dirty = true; }
  if (id === 'bal') {
    if (pouring()) { pour(0.16 * (S.tilt - 0.25) / 0.75 * dt); acc += dt; if (acc > 0.2) { acc = 0; update(); } }
    if (S.mode === 'metal' && (S.dropping || (S.inW && !S.settled))) { stepMetal(dt); acc += dt; if (acc > 0.2) { acc = 0; update(); } }
    dirty = true;
  }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function act(a) {
  const id = LID();

    if (id === 'fuel') { resetFuelRun(); renderTools(); update(); }
    if (id === 'bal') resetBal();
    buildScheme(); return;
  }
  if (a === 'p0' || a === 'p1') return plate(+a[1]);
  if (a === 's0' || a === 's1') { const i = +a[1]; setSub(i, SKEYS[(SKEYS.indexOf(S.subs[i]) + 1) % SKEYS.length]); buildScheme(); return; }
  if (/^sub\d-/.test(a)) { setSub(+a[3], a.slice(5)); buildScheme(); return; }
  if (a === 'both') { const on = !S.on1.every(x => x); plate(0, on); plate(1, on); return; }
  if (a === 'fcycle') { setFuel(FKEYS[(FKEYS.indexOf(S.fuel) + 1) % FKEYS.length]); buildScheme(); return; }
  if (/^fuel-/.test(a)) { setFuel(a.slice(5)); buildScheme(); return; }
  if (/^mf[+-]\d+$/.test(a)) { setMf(S.mf + (+a.slice(2))); return; }

  if (a === 'p10' || a === 'p50') { if (S.mode !== 'water' || S.jug <= 0) return; pour(+a.slice(1) / 1000); judgeMix(); return; }

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'cap') return `${sn(S.subs[0])} ${deg(S.T1[0])} · ${sn(S.subs[1])} ${deg(S.T1[1])} · по ${nf(S.m * 1000)} г`;
  if (id === 'fuel') return [t(S.wood, 'Дрова'), t(S.gas, 'Газ')].join(' · ');
  return [t(S.mix, 'Смесь 40 °C'), t(S.metal, 'Брусок')].join(' · ');
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const chips = (pre, keys, names, cur) => `<div class="chips">${keys.map(k => `<button data-a="${pre}${k}" aria-pressed="${cur === k}">${names(k)}</button>`).join('')}</div>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'cap') h = `<h2>Две одинаковые плитки</h2>` + slider('inM', 'Масса в каждом стакане', 0.1, 0.5, 0.05, S.m) +
      S.subs.map((k, i) => `<div class="ctl"><div class="lbl">${i ? 'Правый' : 'Левый'} стакан</div>${chips(`sub${i}-`, SKEYS, sn, k)}</div>`).join('') +
      `<dl class="reads"><div><dt>Q слева</dt><dd id="r1"></dd></div><div><dt>Q справа</dt><dd id="r2"></dd></div><div><dt>отношение</dt><dd id="r3"></dd></div></dl>
      <div class="row"><button class="ghostbtn" data-a="both">${S.on1.every(x => x) ? 'Выключить плитки' : 'Включить обе плитки'}</button><button class="ghostbtn" data-a="reset">Сброс: 20 °C</button></div>
      <p class="note" style="margin-top:12px">Мощность каждой плитки ${L().P} Вт: за 1 секунду она отдаёт жидкости ${L().P} Дж. Потерями тепла пренебрегаем. Время на площадке идёт в ${L().speed} раз быстрее.</p>`;
  if (id === 'fuel') h = `<h2>Топливо и вода</h2><div class="ctl"><div class="lbl">Топливо</div>${chips('fuel-', FKEYS, fn, S.fuel)}</div>` +
      slider('inMf', 'Масса топлива', 1, 150, 1, S.mf) +
      `<dl class="reads"><div><dt>вода</dt><dd id="r1"></dd></div><div><dt>выделилось</dt><dd id="r2"></dd></div><div><dt>q</dt><dd id="r3"></dd></div></dl>
      <div class="row"><button class="ghostbtn" data-a="burn">Поджечь</button><button class="ghostbtn" data-a="reset">Сброс</button></div>
      <p class="note" style="margin-top:12px">В кастрюле ${L().M} кг воды при ${L().tw0} °C. Считаем, что вся теплота от сгорания идёт воде. Когда вода закипит, лишняя теплота уходит на испарение, а не на нагрев.</p>`;
  if (id === 'bal') h = `<h2>Калориметр</h2><div class="ctl"><div class="lbl">Что добавляем</div><div class="chips"><button data-a="mode-water" aria-pressed="${S.mode === 'water'}">горячую воду ${L().t2} °C</button><button data-a="mode-metal" aria-pressed="${S.mode === 'metal'}">брусок ${L().tb0} °C</button></div></div>` +
      (S.mode === 'water'
        ? `<div class="row"><button class="ghostbtn" data-a="p10">Долить 10 г</button><button class="ghostbtn" data-a="p50">Долить 50 г</button></div>
           <dl class="reads"><div><dt>долили</dt><dd id="r1"></dd></div><div><dt>смесь</dt><dd id="r2"></dd></div><div><dt>в кувшине</dt><dd id="r3"></dd></div></dl>`
        : `<div class="ctl"><div class="lbl">Металл</div>${chips('met-', MKEYS, k => MET[k].name, S.met)}</div>` + slider('inMb', 'Масса бруска', 0.1, 1, 0.1, S.mb) +
          `<div class="row"><button class="ghostbtn" data-a="drop">Опустить брусок</button></div>
           <dl class="reads"><div><dt>вода</dt><dd id="r1"></dd></div><div><dt>брусок</dt><dd id="r2"></dd></div><div><dt>Q пол</dt><dd id="r3"></dd></div></dl>`) +
      `<div class="row"><button class="ghostbtn" data-a="reset">Сброс</button></div>
      <p class="note" style="margin-top:12px">В калориметре ${L().m1 * 1000} г воды при ${L().t1} °C. Калориметр идеальный: тепло наружу не уходит, теплоёмкостью самого сосуда пренебрегаем.</p>`;
  el.innerHTML = h;
  const on = (sel, fn2) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn2); };
  on('#inM', e => setM(+e.target.value));
  on('#inMf', e => setMf(+e.target.value));
  on('#inMb', e => setMb(+e.target.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { act(b.dataset.a); buildScheme(); });
  updateScheme(model());
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'cap') { set('#inMO', `${nf(S.m * 1000)} г`); val('#inM', S.m); set('#r1', kJ(S.Q1[0])); set('#r2', kJ(S.Q1[1])); set('#r3', S.Q1[1] > 0 && S.Q1[0] > 0 ? `${fmt(S.Q1[0] / S.Q1[1], 2)}` : '—'); }
  if (id === 'fuel') { set('#inMfO', `${S.mf} г`); val('#inMf', S.mf); set('#r1', deg(S.Tw2, 1)); set('#r2', kJ(S.Qrel)); set('#r3', `${fmt(FUEL[S.fuel].q / 1e7, 1)}·10⁷`); }
  if (id === 'bal') {
    if (S.mode === 'water') { set('#r1', `${nf(S.mp * 1000)} г`); set('#r2', deg(theta(), 1)); set('#r3', `${nf(S.jug * 1000)} г`); }
    else { set('#inMbO', `${nf(S.mb * 1000)} г`); val('#inMb', S.mb); set('#r1', deg(S.Tw3, 1)); set('#r2', deg(S.Tb, 1)); set('#r3', kJ(Qpol3())); }
  }
}

    { id: 'bar', icon: ICON.bar, name: 'Столбик Q', spec: 'Сколько теплоты выделило топливо. Пунктир — сколько нужно, чтобы довести воду до кипения.' },

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'cap') {
    const side = i => { const sb = SUB[S.subs[i]], dt = S.T1[i] - Ls.t0; return `<h3>${i ? 'Справа' : 'Слева'}: ${sb.name}</h3><div class="steps">` +
      step('c', `${sb.c} Дж/(кг·°C)`) + step('m', `${fmt(S.m, 2)} кг`) + step('Δt = t₂ − t₁', `${fmt(S.T1[i], 1)} − ${Ls.t0} = ${fmt(dt, 1)} °C`) +
      step('Q = c·m·Δt', `${sb.c} · ${fmt(S.m, 2)} · ${fmt(dt, 1)} = ${big(sb.c * S.m * dt)} Дж`, 'sum') +
      step('время нагрева = Q / P', `${big(S.Q1[i])} / ${Ls.P} = ${fmt(time1(i), 0)} с`) + `</div>`; };
    const both = S.Q1[0] > 0 && S.Q1[1] > 0;
    return `<h2>Сколько теплоты нужно</h2><div class="formula">Q = c · m · (t₂ − t₁)</div><p class="note">Q — количество теплоты (Дж), c — удельная теплоёмкость (Дж/(кг·°C)), m — масса (кг), t₁ и t₂ — начальная и конечная температура.</p>` +
      side(0) + side(1) +
      `<h3>Сравнение</h3><div class="steps">` + step('Q слева / Q справа', both ? fmt(S.Q1[0] / S.Q1[1], 2) : '—') + step('c слева / c справа', fmt(SUB[S.subs[0]].c / SUB[S.subs[1]].c, 2), 'sum') + `</div>
      <p class="note" style="margin-top:10px">Когда массы и Δt одинаковые, теплота отличается во столько же раз, во сколько отличаются c.</p>`;
  }
  if (id === 'fuel') {
    const f = FUEL[S.fuel], Q = f.q * S.mf / 1000, need = needQ();
    return `<h2>Теплота сгорания</h2><div class="formula">Q = q · m</div><p class="note">q — удельная теплота сгорания (Дж/кг), m — масса сгоревшего топлива (кг).</p>
      <h3>Сколько нужно воде</h3><div class="steps">` + step('Q = c·m·(t₂ − t₁)', `4200 · ${Ls.M} · (100 − ${Ls.tw0})`) + step('нужно', `${big(need)} Дж`, 'sum') + `</div>
      <h3>Сколько даст топливо</h3><div class="steps">` + step('топливо', f.name) + step('q', qStr(f.q)) + step('m', `${S.mf} г = ${fmt(S.mf / 1000, 3)} кг`) +
      step('Q = q·m', `${big(Q)} Дж`, 'sum') + step('сравнение', Q >= need ? `хватит, запас ${fmt((Q / need - 1) * 100, 0)} %` : `не хватит ${big(need - Q)} Дж`) + `</div>
      <h3>Опыт</h3><div class="steps">` + step('выделилось', `${big(S.Qrel)} Дж`) + step('вода', deg(S.Tw2, 1)) + step('ушло на испарение', S.steam > 0 ? `${kJ(S.steam)} ≈ ${fmt(S.steam / 2.3e6 * 1000, 0)} г пара` : '—') + `</div>` +
      (S.runs.length ? `<h3>Последние опыты</h3><div class="steps">` + S.runs.map(r => step(`${fn(r.fuel)}, ${r.m} г`, r.boiled ? 'закипела' : `только ${deg(r.T)}`)).join('') + `</div>` : '') +
      `<p class="note" style="margin-top:10px">Удельная теплота испарения воды 2,3·10⁶ Дж/кг: пар уносит много энергии, поэтому лишнее топливо тратится впустую.</p>`;
  }
  if (S.mode === 'water') {
    const th = theta(), m2 = S.mp;
    return `<h2>Уравнение теплового баланса</h2><div class="formula">Q отд = Q пол</div><p class="note">Горячая вода отдаёт тепло и остывает до θ, холодная получает его и нагревается до θ.</p>
      <h3>Сейчас</h3><div class="steps">` + step('холодная m₁, t₁', `${fmt(Ls.m1, 2)} кг, ${Ls.t1} °C`) + step('горячая m₂, t₂', `${fmt(m2, 3)} кг, ${Ls.t2} °C`) +
      step('θ = (m₁t₁ + m₂t₂) / (m₁ + m₂)', `(${fmt(Ls.m1, 2)}·${Ls.t1} + ${fmt(m2, 3)}·${Ls.t2}) / ${fmt(Ls.m1 + m2, 3)} = ${deg(th, 1)}`, 'sum') + `</div>
      <h3>Проверка баланса</h3><div class="steps">` + step('Q пол = c·m₁·(θ − t₁)', `4200 · ${fmt(Ls.m1, 2)} · ${fmt(th - Ls.t1, 1)} = ${big(Qpol3())} Дж`) +
      step('Q отд = c·m₂·(t₂ − θ)', `4200 · ${fmt(m2, 3)} · ${fmt(Ls.t2 - th, 1)} = ${big(Qotd3())} Дж`) + step('разница', `${big(Math.abs(Qpol3() - Qotd3()))} Дж`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Удельная теплоёмкость у обеих порций одна и та же — это вода, поэтому c сокращается.</p>`;
  }
  const mt = MET[S.met], Cw = CW * Ls.m1, Cb = mt.c * S.mb, thf = (Cw * Ls.t1 + Cb * Ls.tb0) / (Cw + Cb);
  return `<h2>Брусок в воде</h2><div class="formula">c₁m₁(θ − t₁) = c₂m₂(t₂ − θ)</div><p class="note">Слева — теплота, полученная водой, справа — отданная бруском.</p>
    <h3>Сейчас</h3><div class="steps">` + step('вода', `4200 Дж/(кг·°C), ${fmt(Ls.m1, 2)} кг, ${deg(S.Tw3, 1)}`) + step(`брусок: ${mt.name}`, `${mt.c} Дж/(кг·°C), ${fmt(S.mb, 1)} кг, ${deg(S.Tb, 1)}`) +
    step('Q пол = c₁m₁(t − t₁)', `${big(Qpol3())} Дж`) + step('Q отд = c₂m₂(t₂ − t)', `${big(Qotd3())} Дж`, 'sum') + `</div>
    <h3>Чем закончится</h3><div class="steps">` + step('θ = (c₁m₁t₁ + c₂m₂t₂) / (c₁m₁ + c₂m₂)', `(${big(Cw)}·${Ls.t1} + ${big(Cb)}·${Ls.tb0}) / ${big(Cw + Cb)} = ${deg(thf, 1)}`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">У металла c намного меньше, чем у воды, поэтому брусок сильно остывает, а вода нагревается совсем немного.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'cap') el.innerHTML = `<div class="k">Время ×${L().speed}</div>` + S.subs.map((k, i) => `<div class="lr"><span>${sn(k)}</span><span class="${S.T1[i] >= L().tStop ? 'ok' : ''}">${deg(S.T1[i])}</span></div><div class="lr"><span>Q</span><span>${kJ(S.Q1[i])}</span></div>`).join('');
  else if (id === 'fuel') el.innerHTML = `<div class="k">${fn(S.fuel)} · ${S.mf} г</div><div class="v ${S.Tw2 >= 100 ? 'ok' : ''}">${deg(S.Tw2, S.Tw2 >= 100 ? 0 : 1)}</div><div class="lr"><span>Q</span><span>${kJ(S.Qrel)}</span></div><div class="lr"><span>осталось</span><span>${fmt(S.left, 1)} г</span></div>`;
  else {
    const Tw = S.mode === 'water' ? theta() : S.Tw3;
    el.innerHTML = `<div class="k">Калориметр</div><div class="v ${S.mode === 'water' && Math.abs(Tw - L().tNeed) <= 0.5 ? 'ok' : ''}">${deg(Tw, 1)}</div>` +
      (S.mode === 'water' ? `<div class="lr"><span>долили</span><span>${nf(S.mp * 1000)} г</span></div>` : `<div class="lr"><span>брусок</span><span>${deg(S.Tb, 1)}</span></div>`) +
      `<div class="lr"><span>Q пол</span><span>${kJ(Qpol3())}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы умеете считать количество теплоты!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  fuel: '<rect x="20" y="3" width="26" height="12" fill="#5fb4d9" opacity=".6" stroke="#a9b4c9"/><path d="M33 26C30 22 31 20 33 16C35 20 36 22 33 26Z" fill="#ff8a3c"/><rect x="22" y="26" width="22" height="3" fill="#a87a4a"/><rect x="54" y="8" width="6" height="20" fill="#0e1520" stroke="#5d6a86"/><rect x="55" y="16" width="4" height="11" fill="#ffb547"/>',
  bal: '<rect x="30" y="8" width="30" height="21" rx="2" fill="#26324a"/><rect x="34" y="12" width="22" height="16" fill="#5fb4d9" opacity=".6"/><path d="M8 6h14l3-2-2 4v14H8z" fill="#ff8a73" opacity=".6" stroke="#a9d6e4"/><path d="M24 6q8 2 12 10" fill="none" stroke="#ff8a73" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'cap') now = `Две одинаковые электроплитки по ${Ls.P} Вт, на каждой стакан с жидкостью массой ${nf(S.m * 1000)} г. Слева ${SUB[S.subs[0]].name} (c = ${SUB[S.subs[0]].c} Дж/(кг·°C)): ${deg(S.T1[0], 1)}, получено ${kJ(S.Q1[0])}, плитка ${S.on1[0] ? 'включена' : 'выключена'}. Справа ${SUB[S.subs[1]].name} (c = ${SUB[S.subs[1]].c} Дж/(кг·°C)): ${deg(S.T1[1], 1)}, получено ${kJ(S.Q1[1])}, плитка ${S.on1[1] ? 'включена' : 'выключена'}. Плитки выключаются сами при ${Ls.tStop} °C. Время ускорено в ${Ls.speed} раз, потерь тепла нет. Задание (вода и подсолнечное масло по 200 г, обе до 60 °C) ${S.ok ? 'выполнено' : 'не выполнено'}.`;
  if (id === 'fuel') now = `Над топливом на весах стоит кастрюля с ${Ls.M} кг воды (вначале ${Ls.tw0} °C). Топливо: ${FUEL[S.fuel].name}, q = ${qStr(FUEL[S.fuel].q)}, положено ${S.mf} г, осталось ${fmt(S.left, 1)} г, ${S.burning ? 'горит' : 'не горит'}. Выделилось ${kJ(S.Qrel)}, вода ${deg(S.Tw2, 1)}${S.steam > 0 ? `, на испарение ушло ${kJ(S.steam)}` : ''}. Модель: вся теплота сгорания идёт воде, после 100 °C — на кипение. Экономно вскипятить (запас не больше 15 %) на дровах: ${S.wood ? 'сделано' : 'нет'}, на природном газе: ${S.gas ? 'сделано' : 'нет'}. Нужные массы топлива не называй — пусть ученик сам посчитает Q = c·m·Δt и m = Q/q.`;
  if (id === 'bal') now = S.mode === 'water'
    ? `Калориметр: ${Ls.m1 * 1000} г воды при ${Ls.t1} °C. Из кувшина (${Ls.t2} °C) долито ${nf(S.mp * 1000)} г, в кувшине осталось ${nf(S.jug * 1000)} г. Температура смеси ${deg(theta(), 1)}. Получение 40 °C (±0,5) ${S.mix ? 'выполнено' : 'не выполнено'}. Нужную массу горячей воды не называй — наводи на уравнение c·m₁·(θ − t₁) = c·m₂·(t₂ − θ).`
    : `Калориметр: ${Ls.m1 * 1000} г воды. Брусок: ${MET[S.met].name} (c = ${MET[S.met].c} Дж/(кг·°C)), ${nf(S.mb * 1000)} г, нагрет до ${Ls.tb0} °C. Сейчас брусок ${S.inW ? 'в воде' : S.dropping ? 'опускается' : 'висит над водой'}, вода ${deg(S.Tw3, 1)}, брусок ${deg(S.Tb, 1)}. Q пол водой ${kJ(Qpol3())}, Q отд бруском ${kJ(Qotd3())}. ${S.settled ? 'Температуры сравнялись.' : ''} Опыт со смесью воды до 40 °C ${S.mix ? 'выполнен' : 'не выполнен'}, опыт с бруском ${S.metal ? 'выполнен' : 'не выполнен'}.`;
  return [
    `Раздел: физика, 8 класс, тема «Количество теплоты». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { cap: 'Почему у моря летом ночью теплее, чем в степи?', fuel: 'Почему газом топить выгоднее, чем дровами?', bal: 'Как рассчитать, сколько горячей воды долить в ванну?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
