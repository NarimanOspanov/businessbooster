<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по электрохимии: ряд активности металлов, гальванический элемент и батарейка, электролиз и закон Фарадея, коррозия и защита металлов.">
<link rel="icon" href="data:,">
<title>Электрохимия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /optics. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.grid{width:100%;border-collapse:separate;border-spacing:3px;margin-top:10px;font:500 12px/1.2 var(--font-mono)}
.grid th{font-weight:500;color:var(--muted);padding:4px 2px;text-align:center}
.grid td{background:var(--surface-2);border-radius:6px;text-align:center;padding:7px 2px;color:var(--muted)}
.grid td.y{color:var(--ok)}
.grid td.own{opacity:.35}
.grid td.cur{outline:2px solid var(--force)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M8 16v16h10V16M22 16v16h10V16" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 22h8v9H9zM23 22h8v9h-8z" fill="var(--arm)" opacity=".55"/><path d="M11 12V27M29 12V27" stroke="var(--force)" stroke-width="2.4"/><path d="M11 12V7h18v5" fill="none" stroke="var(--fg)" stroke-width="1.6"/><path d="M15 20v-3h10v3" fill="none" stroke="var(--ok)" stroke-width="2"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Химия · Электрохимия</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#chem">Карта</a><a href="/physics/#chem">Химия</a><a href="/labs/chem-electro/" aria-current="page">Электрохимия</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Электрохимия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>

  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол: стаканы с растворами, пластинки металлов, гальванический элемент, электролизёр и пробирка с гвоздём. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>

  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const sgn = (x, n = 2) => (x > 1e-9 ? '+' : '') + fmt(x, n);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-electro';

// ---------- chemistry data ----------
// Standard electrode potentials E°(Mⁿ⁺/M), V, 25 °C
const MET = {
  Mg: { name: 'магний', gen: 'магния', E: -2.37, col: '#d4d9e1', ion: 'Mg²⁺', z: 2, M: 24, salt: 'MgSO₄', sol: '#dfe7ee', sa: 0.16 },
  Zn: { name: 'цинк', gen: 'цинка', E: -0.76, col: '#a7b4c3', ion: 'Zn²⁺', z: 2, M: 65, salt: 'ZnSO₄', sol: '#dfe7ee', sa: 0.16 },
  Fe: { name: 'железо', gen: 'железа', E: -0.44, col: '#6f7782', ion: 'Fe²⁺', z: 2, M: 56, salt: 'FeSO₄', sol: '#9fd08f', sa: 0.32 },
  Cu: { name: 'медь', gen: 'меди', E: 0.34, col: '#d9824f', ion: 'Cu²⁺', z: 2, M: 64, salt: 'CuSO₄', sol: '#2f86e0', sa: 0.5 },
  Ag: { name: 'серебро', gen: 'серебра', E: 0.80, col: '#e6e9ee', ion: 'Ag⁺', z: 1, M: 108, salt: 'AgNO₃', sol: '#dfe7ee', sa: 0.14 },
};
const ICOL = { Zn: '#dfe7ee', Fe: '#9fd08f', Cu: '#2f86e0', Ag: '#dfe7ee', H: '#dfe7ee' };
const SERIES = [['Li', -3.04], ['K', -2.93], ['Ca', -2.87], ['Na', -2.71], ['Mg', -2.37], ['Al', -1.66], ['Zn', -0.76], ['Fe', -0.44], ['Ni', -0.25], ['Sn', -0.14], ['Pb', -0.13], ['H', 0], ['Cu', 0.34], ['Hg', 0.79], ['Ag', 0.80], ['Pt', 1.19], ['Au', 1.50]];
// lesson 1: four plates × five solutions
const PLATES = ['Zn', 'Fe', 'Cu', 'Ag'];
const SOLS = [
  { id: 'ZnSO4', f: 'ZnSO₄', ion: 'Zn', E: -0.76, col: '#dfe7ee', a: 0.16 },
  { id: 'FeSO4', f: 'FeSO₄', ion: 'Fe', E: -0.44, col: '#9fd08f', a: 0.34 },
  { id: 'HCl', f: 'HCl', ion: 'H', E: 0, col: '#dfe7ee', a: 0.16 },
  { id: 'CuSO4', f: 'CuSO₄', ion: 'Cu', E: 0.34, col: '#2f86e0', a: 0.5 },
  { id: 'AgNO3', f: 'AgNO₃', ion: 'Ag', E: 0.80, col: '#dfe7ee', a: 0.14 },
];
const reacts = (p, s) => p !== s.ion && MET[p].E < s.E;
function eq1(p, s) {
  if (p === s.ion) return `${p} + ${s.f}: металл и ионы одни и те же — ничего не меняется`;
  if (!reacts(p, s)) return `${p} + ${s.f} → реакция не идёт`;
  if (s.ion === 'H') return `${p} + 2HCl → ${p}Cl₂ + H₂↑`;
  if (s.ion === 'Ag') return `${p} + 2AgNO₃ → ${p}(NO₃)₂ + 2Ag↓`;
  return `${p} + ${s.ion}SO₄ → ${p}SO₄ + ${s.ion}↓`;
}
// lesson 3: electrolysis with graphite electrodes
const F = 96500;
const ELY = [
  { id: 'CuSO4', f: 'CuSO₄', name: 'раствор CuSO₄', cat: 'Cu', an: 'O2', sol: '#2f86e0', a: 0.5,

const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID();
  if (id === 'series') {
    const s = S.at === null ? null : SOLS[S.at];
    const n = Object.keys(S.tested).filter(k => { const [p, si] = k.split('-'); return p !== SOLS[+si].ion; }).length;
    const found = Object.keys(S.tested).filter(k => { const [p, si] = k.split('-'); return reacts(p, SOLS[+si]); }).length;
    return { kind: 'series', p: S.plate, s, r: s ? reacts(S.plate, s) : false, n, found };
  }
  if (id === 'cell') {
    const eL = MET[S.L].E, eR = MET[S.R].E, emf = eR - eL;
    const E = S.bridge ? emf : 0, closed = S.bridge && S.sw && Math.abs(emf) > 1e-9;
    const an = emf > 1e-9 ? 'L' : emf < -1e-9 ? 'R' : null;
    return { kind: 'cell', eL, eR, emf, E, bridge: S.bridge, sw: S.sw, closed, an, glow: closed ? clamp(Math.abs(emf) / 1.5, 0, 1) : 0, n: S.n };
  }
  if (id === 'electrolysis') {
    const e = ELY.find(x => x.id === S.ely), q = S.I * S.t * 60, ne = q / F;
    const M = { Cu: 64, Na: 23 }[e.cat] || 0, z = { Cu: 2, Na: 1 }[e.cat] || 0;
    const mass = M ? M * ne / z : 0;
    const gc = e.cat === 'H2' ? ne / 2 : 0, ga = ne / GAS[e.an].z;
    return { kind: 'ely', e, cat: e.cat, I: S.I, t: S.t, q, ne, mass, M, z, Vc: gc * 22.4, Va: ga * 22.4, run: S.run };
  }
  const env = envOf(S.env);
  let f = 1, why = 'нет контакта с другим металлом';
  if (S.paint) { f = 0; why = 'краска не пускает воду и кислород к железу'; }
  else if (S.contact === 'zn') { f = 0; why = 'цинк активнее железа — он анод и растворяется вместо железа'; }
  else if (S.contact === 'cu') { f = 2; why = 'медь менее активна — анодом становится железо, оно ржавеет быстрее'; }
  const rate = env.rate * f, rust = Math.min(100, 2.5 * rate * S.days);
  const znLoss = S.contact === 'zn' ? Math.min(100, 2.5 * env.rate * 1.2 * S.days) : 0;
  return { kind: 'cor', env: S.env, E: env, contact: S.contact, paint: S.paint, days: S.days, f, rate, rust, znLoss, why, run: S.run };
}

const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const GLASS = 'rgba(200,225,255,.08)', GLASS_S = '#9fb3d1';
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const RND = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 120; i++) RND.push([r(), r(), r()]); }

function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="2360" fill="url(#tile)"/>
    <rect x="-2000" y="360" width="4520" height="1200" fill="#1a2232"/>
    <rect x="-2000" y="358" width="4520" height="4" fill="#2c3954"/>
    <rect x="-2000" y="362" width="4520" height="2" fill="${INK}" opacity=".6"/>`;
}
// a beaker: centre cx, half-width hw, top y0, bottom y1
function beaker(cx, hw, y0, y1, liqY, col, a, extra = '') {
  const x0 = cx - hw, x1 = cx + hw;
  let h = `<path d="M${x0 + 2} ${liqY}H${x1 - 2}V${y1 - 6}Q${x1 - 2} ${y1} ${x1 - 8} ${y1}H${x0 + 8}Q${x0 + 2} ${y1} ${x0 + 2} ${y1 - 6}Z" fill="${col}" opacity="${a}"/>`;
  h += `<rect x="${x0 + 2}" y="${liqY}" width="${2 * hw - 4}" height="2" fill="#fff" opacity=".28"/>` + extra;
  const d = `M${x0 - 5} ${y0}L${x0} ${y0 + 5}V${y1 - 6}Q${x0} ${y1 + 1} ${x0 + 7} ${y1 + 1}H${x1 - 7}Q${x1} ${y1 + 1} ${x1} ${y1 - 6}V${y0 + 5}L${x1 + 4} ${y0}`;
  h += `<path d="${d}Z" fill="${GLASS}"/>` + ol(d, 'none', GLASS_S, 2.2);
  h += `<path d="M${x0 + 7} ${y0 + 14}V${y1 - 12}" stroke="#fff" stroke-opacity=".13" stroke-width="4" stroke-linecap="round"/>`;
  return h;
}
const bubbles = (x, y0, y1, n, t, col, spread = 8, r = 2.2, seed = 0) => {
  let h = '';
  for (let i = 0; i < n; i++) {
    const R = RND[(i + seed) % RND.length], L = y0 - y1, y = y0 - ((t * 0.05 * (0.6 + R[2]) + R[0] * L) % L), xx = x + (R[1] - 0.5) * spread * 2 + (reduce ? 0 : Math.sin(t / 200 + i) * 1.2);
    h += `<circle cx="${xx.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * (0.6 + R[2] * 0.7)).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1" opacity=".85"/>`;
  }
  return h;
};

  h += ol('M-8 -118H8V0H-8Z', c, mix(c, '#ffffff', 0.35), 1.6);
  h += `<path d="M-4 -112V-6" stroke="#fff" stroke-opacity=".25" stroke-width="2.5"/>`;

  if (inSol) {

      <dl class="reads"><div><dt>Катод</dt><dd id="r1"></dd></div><div><dt>Анод</dt><dd id="r2"></dd></div><div><dt>Заряд</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Электролит</div>${chips('ely', ELY.map(e => [e.id, e.f]), S.ely)}</div>` +

      `<div class="row"><button class="ghostbtn" data-a="run">${S.run ? 'Пауза' : 'Пуск'}</button><button class="ghostbtn" data-a="reset">Заново</button></div>
      <dl class="reads"><div><dt>m на катоде</dt><dd id="r4"></dd></div><div><dt>V газа (катод)</dt><dd id="r5"></dd></div><div><dt>V газа (анод)</dt><dd id="r6"></dd></div></dl><p class="note">Объёмы газов — при нормальных условиях.</p>`;
  if (id === 'corrosion') h = `<h2>Ржавчина по дням</h2><div id="sDiag"></div><p class="note" style="margin-top:8px">Оранжевая линия — ваш гвоздь. Пунктиры — как пошло бы в этой же среде с медью, без контакта и с цинком.</p>
      <dl class="reads"><div><dt>Ржавчина</dt><dd id="r1"></dd></div><div><dt>Цинк съеден</dt><dd id="r2"></dd></div><div><dt>Скорость</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Среда</div>${chips('env', ENVS.map(e => [e.id, e.name]), S.env)}</div>

      slider('inD', 'Прошло дней', 0, 30, 1, S.days);
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inN', e => { S.n = +e.target.value; update(); });
  on('#inI', e => { S.I = +e.target.value; update(); });
  on('#inT', e => { S.t = +e.target.value; S.run = false; renderTools(); update(); });
  on('#inD', e => { S.days = +e.target.value; S.run = false; renderTools(); update(); });
  el.querySelectorAll('.chips[data-key] button').forEach(b => b.onclick = () => {
    const k = b.parentElement.dataset.key, v = b.dataset.v;
    if (k === 'plate') act('pl-' + v);

    else if (k === 'ely') setEly(v);
    else if (k === 'env') setEnv(v);
    else if (k === 'contact') setContact(v);
  });
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { act(b.dataset.a); buildScheme(); renderPanes(model()); });
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (key, cur) => el.querySelectorAll(`.chips[data-key="${key}"] button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cur));
  const d = el.querySelector('#sDiag');
  if (m.kind === 'series') {
    let g = `<table class="grid"><tr><th></th>${SOLS.map(s => `<th>${s.f}</th>`).join('')}</tr>`;
    for (const p of PLATES) g += `<tr><th>${p}</th>${SOLS.map((s, i) => { const own = p === s.ion, k = p + '-' + i, tst = S.tested[k], cur = p === S.plate && S.at === i; return `<td class="${own ? 'own' : tst && reacts(p, s) ? 'y' : ''}${cur ? ' cur' : ''}">${own ? '×' : tst ? (reacts(p, s) ? '✓' : '—') : '·'}</td>`; }).join('')}</tr>`;
    el.querySelector('#sGrid').innerHTML = g + '</table>';
    if (d) d.innerHTML = seriesSVG();
    press('plate', S.plate); press('dip', S.at === null ? '' : String(S.at));
  } else if (m.kind === 'cell') {
    if (d) d.innerHTML = seriesSVG();
    set('#r1', sgn(m.emf) + ' В'); set('#r2', m.an ? (m.an === 'L' ? S.L : S.R) : '—'); set('#r3', m.an ? (m.an === 'L' ? S.R : S.L) : '—');
    const one = Math.abs(m.emf), tot = one * S.n;
    set('#inNO', String(S.n)); val('#inN', S.n); set('#r4', fmt(one, 2) + ' В'); set('#r5', fmt(tot, 2) + ' В');
    set('#r6', tot >= 3 - 0.2 ? 'пульт, фонарик' : tot >= 1.3 ? 'часы, лампочку' : tot > 0 ? 'светодиод не зажжёт' : '—');
    press('L', S.L); press('R', S.R);
  } else if (m.kind === 'ely') {
    const e = m.e, gas = g => GAS[g].f;
    set('#r1', e.cat === 'H2' ? 'H₂' : e.cat); set('#r2', gas(e.an)); set('#r3', Math.round(m.q).toLocaleString('ru-RU') + ' Кл');
    set('#inIO', fmt(S.I, 1) + ' А'); set('#inTO', S.t + ' мин'); val('#inI', S.I); val('#inT', S.t);
    set('#r4', e.cat === 'Cu' || e.cat === 'Na' ? fmt(m.mass, 3) + ' г' : '—'); set('#r5', e.cat === 'H2' ? fmt(m.Vc * 1000, 0) + ' мл' : '—'); set('#r6', fmt(m.Va * 1000, 0) + ' мл');
    press('ely', S.ely);
  } else {
    if (d) d.innerHTML = rustSVG(m);
    set('#r1', fmt(m.rust, 0) + ' %'); set('#r2', m.contact === 'zn' ? fmt(m.znLoss, 0) + ' %' : '—'); set('#r3', m.rate === 0 ? '0' : '×' + fmt(m.rate, 1));
    set('#inDO', S.days + ' дн.'); val('#inD', S.days);
    press('env', S.env); press('contact', S.contact);
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];

      L.text.map(p => `<p>${p}</p>`).join('') +

      `<div class="safe"><b>Безопасность</b>${L.safe}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'series') {
    let h = `<h2>Пойдёт ли реакция?</h2><div class="formula">Me + соль → ?</div><p class="note">Сравните E° металла пластинки и E° ионов в растворе. Если у пластинки E° меньше — она отдаёт электроны, реакция идёт.</p>`;
    if (!m.s) return h + `<p class="note">Опустите пластинку в стакан — здесь появится разбор.</p>`;
    const p = m.p, s = m.s, ep = MET[p].E, es = s.E;
    h += `<h3>${p} в ${s.f}</h3><div class="steps">` + step(`E°(${MET[p].ion}/${p})`, fmt(ep, 2) + ' В') + step(s.ion === 'H' ? 'E°(2H⁺/H₂)' : `E°(${MET[s.ion].ion}/${s.ion})`, fmt(es, 2) + ' В');
    if (p === s.ion) h += step('вывод', 'тот же металл — обмена нет', 'sum') + `</div>`;
    else {
      h += step('сравнение', `${fmt(ep, 2)} ${ep < es ? '<' : '>'} ${fmt(es, 2)}`) + step('вывод', m.r ? `${p} активнее — вытесняет ${s.ion === 'H' ? 'водород' : MET[s.ion].name}` : `${p} менее активен — реакции нет`, 'sum') + `</div>`;
      h += `<h3>Уравнение</h3><div class="steps">` + step('', eq1(p, s));
      if (m.r) {
        const zs = s.ion === 'H' ? 1 : MET[s.ion].z, k = 2 / zs;
        h += step('окисление', `${p}⁰ − 2e⁻ → ${p}²⁺`) + step('восстановление', s.ion === 'H' ? '2H⁺ + 2e⁻ → H₂⁰' : `${k > 1 ? k : ''}${MET[s.ion].ion} + 2e⁻ → ${k > 1 ? k : ''}${s.ion}⁰`);
        h += step('ЭДС пары', `${fmt(es, 2)} − (${fmt(ep, 2)}) = ${fmt(es - ep, 2)} В`, 'sum');
      }
      h += `</div>`;
    }
    return h;
  }
  if (id === 'cell') {
    const an = m.an === 'L' ? S.L : m.an === 'R' ? S.R : null, ca = m.an === 'L' ? S.R : m.an === 'R' ? S.L : null;
    let h = `<h2>ЭДС элемента</h2><div class="formula">ЭДС = E°(катод) − E°(анод)</div><p class="note">Анод — металл с меньшим E°. Вольтметр показывает E°(правой) − E°(левой) при опущенном мостике.</p><h3>Сейчас</h3><div class="steps">` +
      step(`E°(${S.L}), слева`, fmt(m.eL, 2) + ' В') + step(`E°(${S.R}), справа`, fmt(m.eR, 2) + ' В');
    if (!an) return h + step('вывод', 'металлы одинаковые — ЭДС 0, тока нет', 'sum') + `</div>`;
    const A = MET[an], C = MET[ca], k = 2 / C.z;
    h += step('анод (−)', `${an}: ${an} − ${A.z}e⁻ → ${A.ion}`) + step('катод (+)', `${ca}: ${C.ion} + ${C.z}e⁻ → ${ca}`) +
      step('ЭДС', `${fmt(C.E, 2)} − (${fmt(A.E, 2)}) = ${fmt(C.E - A.E, 2)} В`) + step('вольтметр (+ справа)', `${fmt(m.eR, 2)} − (${fmt(m.eL, 2)}) = ${sgn(m.emf)} В${m.bridge ? '' : ', но мостик поднят: 0 В'}`, 'sum') + `</div>`;
    h += `<h3>Суммарная реакция</h3><div class="steps">` + step('', `${an} + ${k > 1 ? k : ''}${C.ion} → ${A.ion} + ${k > 1 ? k : ''}${ca}`) + `</div>`;
    h += `<h3>Батарея</h3><div class="steps">` + step('элементов подряд', String(S.n)) + step('U = n · ЭДС', `${S.n} × ${fmt(Math.abs(m.emf), 2)} = ${fmt(S.n * Math.abs(m.emf), 2)} В`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Числа E° — для стандартных условий (растворы 1 моль/л, 25 °C). В настоящем опыте вольтметр покажет чуть меньше.</p>`;
  }
  if (id === 'electrolysis') {
    const e = m.e, ts = m.t * 60;
    let h = `<h2>Закон Фарадея</h2><div class="formula">m = M · I · t / (z · F)</div><p class="note">F = 96 500 Кл/моль. Время — в секундах. Объём газа: V = n · 22,4 л/моль.</p>`;
    h += `<h3>Что выделяется и почему</h3><div class="steps">` + step('катод (−)', e.hc) + step('анод (+)', e.ha) + step('итог', e.sum, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:8px">${e.why.join(' ')}</p>`;
    h += `<h3>Сейчас</h3><div class="steps">` + step('t', `${m.t} мин × 60 = ${ts} с`) + step('q = I · t', `${fmt(m.I, 1)} × ${ts} = ${Math.round(m.q).toLocaleString('ru-RU')} Кл`) + step('n(e⁻) = q / F', `${Math.round(m.q).toLocaleString('ru-RU')} / 96 500 = ${fmt(m.ne, 4)} моль`);
    if (m.M) h += step(`m(${e.cat}) = M · n(e⁻) / z`, `${m.M} × ${fmt(m.ne, 4)} / ${m.z} = ${fmt(m.mass, 3)} г`, 'sum');
    if (e.cat === 'H2') h += step('V(H₂) = n(e⁻)/2 · 22,4', `${fmt(m.Vc, 3)} л`, 'sum');
    h += step(`V(${GAS[e.an].f}) = n(e⁻)/${GAS[e.an].z} · 22,4`, `${fmt(m.Va, 3)} л`) + `</div>`;
    if (LID() === 'electrolysis' && !S.done.electrolysis) h += `<h3>Как выйти на задание</h3><p class="note">Выразите из формулы произведение I · t: I · t = m · z · F / M. Подставьте m = 0,64 г, z = 2, M = 64 и подберите ток и время.</p>`;
    return h;
  }
  const env = m.E;
  let h = `<h2>Ржавеет или нет</h2><div class="formula">4Fe + 3O₂ + 2nH₂O → 2Fe₂O₃·nH₂O</div><p class="note">Проверяем условия по шагам — как инженер-коррозионист.</p><div class="steps">` +
    step('вода есть?', env.water ? 'да' : 'нет — CaCl₂ всё высушил') + step('кислород есть?', env.o2 ? 'да' : 'почти нет — масло не пускает воздух') +
    step('электролит (соль)?', env.salt ? 'да — ток ионов идёт легче, ×2,5' : 'нет') +
    step('контакт / покрытие', m.why) + step('скорость (условно)', `${fmt(env.rate, 1)} × ${m.f} = ${fmt(m.rate, 1)}`) +
    step('ржавчина за ' + m.days + ' дн.', `${fmt(m.rust, 0)} % поверхности`, 'sum') + `</div>`;
  if (m.contact !== 'none' && !m.paint && env.water) {
    const a = m.contact === 'zn' ? 'Zn' : 'Fe', c = m.contact === 'zn' ? 'Fe' : 'Cu';
    h += `<h3>Гальваническая пара</h3><div class="steps">` + step(`E°(${a})`, fmt(MET[a].E, 2) + ' В — анод, растворяется') + step(`E°(${c})`, fmt(MET[c].E, 2) + ' В — катод, на нём O₂ берёт e⁻') +
      step('анод', `${a} − 2e⁻ → ${a}²⁺`) + step('катод', 'O₂ + 2H₂O + 4e⁻ → 4OH⁻', 'sum') + `</div>`;
  }
  return h + `<p class="note" style="margin-top:10px">Скорость в уроке условная: важен не точный процент, а то, что ускоряет коррозию и что её останавливает.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID(), ok = !!S.done[id];
  if (m.kind === 'series') {
    el.innerHTML = `<div class="k">Опыт</div><div class="v ${m.s && m.r ? 'ok' : ''}">${m.s ? `${m.p} + ${m.s.f}` : `${m.p} · вынута`}</div><div class="lr"><span>${m.s ? (m.p === m.s.ion ? 'своя соль' : m.r ? 'реакция идёт' : 'реакции нет') : 'в стакан'}</span><span>${m.n}/16</span></div>`;
  } else if (m.kind === 'cell') {
    el.innerHTML = `<div class="k">Вольтметр</div><div class="v ${m.E >= 1.5 - 1e-9 ? 'ok' : ''}">U = ${sgn(m.E)} В</div>
      <div class="gauge"><b style="width:${clamp(Math.max(0, m.E) / 3.5 * 100, 0, 100).toFixed(1)}%"></b><i style="left:${(1.5 / 3.5 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>${S.L} | ${S.R}</span><span>${m.glow > 0 ? 'лампа ✓' : 'лампа ✗'}</span></div>`;
  } else if (m.kind === 'ely') {
    const has = m.cat === 'Cu' || m.cat === 'Na';
    el.innerHTML = `<div class="k">На катоде</div><div class="v ${ok ? 'ok' : ''}">${has ? `${fmt(m.mass, 3)} г ${m.cat}` : 'H₂, металла нет'}</div>
      <div class="gauge"><b style="width:${clamp((m.cat === 'Cu' ? m.mass : 0) / 1.2 * 100, 0, 100).toFixed(1)}%"></b><i style="left:${(0.64 / 1.2 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>${fmt(m.I, 1)} А</span><span>${m.t} мин</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Ржавчина</div><div class="v ${m.rust === 0 && m.days >= 14 ? 'ok' : ''}">${fmt(m.rust, 0)} %</div>
      <div class="gauge"><b style="width:${m.rust.toFixed(1)}%;background:#c0652a"></b></div><div class="lr"><span>день ${m.days}</span><span>${m.contact === 'zn' ? 'Zn' : m.contact === 'cu' ? 'Cu' : '—'}${m.paint ? ' · краска' : ''}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Электрохимия пройдена!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  series: '<path d="M8 12v14h12V12M26 12v14h12V12M44 12v14h12V12" fill="none" stroke="#e8ecf4" stroke-width="1.1"/><rect x="9" y="17" width="10" height="9" fill="#9fd08f" opacity=".6"/><rect x="27" y="17" width="10" height="9" fill="#2f86e0" opacity=".7"/><rect x="45" y="17" width="10" height="9" fill="#dfe7ee" opacity=".4"/><rect x="30" y="3" width="4" height="21" fill="#a7b4c3"/><rect x="30" y="17" width="4" height="7" fill="#d9824f"/>',
  cell: '<path d="M4 14v13h22V14M40 14v13h22V14" fill="none" stroke="#e8ecf4" stroke-width="1.1"/><rect x="5" y="19" width="20" height="8" fill="#dfe7ee" opacity=".35"/><rect x="41" y="19" width="20" height="8" fill="#2f86e0" opacity=".6"/><path d="M11 24V4H55V24" fill="none" stroke="#c9a35a" stroke-width="1.1"/><rect x="9" y="12" width="4" height="13" fill="#a7b4c3"/><rect x="53" y="12" width="4" height="13" fill="#d9824f"/><path d="M20 26V16H46V26" fill="none" stroke="#c4d2e6" stroke-width="2.4"/><circle cx="33" cy="4" r="3.4" fill="#ffe08a"/>',
  electrolysis: '<path d="M14 10v17h38V10" fill="none" stroke="#e8ecf4" stroke-width="1.1"/><rect x="15" y="15" width="36" height="12" fill="#2f86e0" opacity=".55"/><rect x="23" y="5" width="4" height="20" fill="#3b4150"/><rect x="22" y="15" width="6" height="10" fill="#d9824f"/><rect x="39" y="5" width="4" height="20" fill="#3b4150"/><circle cx="41" cy="18" r="1.3" fill="none" stroke="#fff" stroke-width=".7"/><circle cx="42" cy="13" r="1" fill="none" stroke="#fff" stroke-width=".7"/><path d="M25 5V2H41V5" fill="none" stroke="#c9a35a" stroke-width="1"/>',
  corrosion: '<path d="M27 2v22q0 5 6 5t6-5V2" fill="none" stroke="#e8ecf4" stroke-width="1.1"/><path d="M28 11h10v13q0 4-5 4t-5-4z" fill="#cfe3f2" opacity=".4"/><path d="M31 4h4M33 4v20" stroke="#8a929c" stroke-width="2"/><circle cx="33" cy="16" r="1.4" fill="#c0652a"/><circle cx="33" cy="21" r="1.2" fill="#9a4a1c"/><rect x="10" y="10" width="4" height="16" fill="#a7b4c3"/><path d="M52 8q4 2 0 4t0 4t0 4" fill="none" stroke="#d9824f" stroke-width="1.4"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; acc = 0;
  Object.assign(S, JSON.parse(JSON.stringify(L.init)));
  save(); resetProps();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// ---------- for the AI tutor ----------
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'series') {
    const res = Object.keys(S.tested).map(k => { const [p, si] = k.split('-'); return `${p} в ${SOLS[+si].f} — ${reacts(p, SOLS[+si]) ? 'реакция' : 'нет'}`; });
    now = `Пластинки: Zn, Fe, Cu, Ag. Растворы: ZnSO₄, FeSO₄, HCl, CuSO₄, AgNO₃. Выбрана пластинка ${m.p}${m.s ? `, опущена в ${m.s.f}: ${m.p === m.s.ion ? 'своя соль, изменений нет' : m.r ? 'реакция идёт (' + eq1(m.p, m.s) + ')' : 'реакции нет'}` : ', сейчас вынута'}. Проведено опытов ${m.n} из 16, найдено реакций ${m.found}. Результаты: ${res.join('; ') || 'пока нет'}. Не называй, в каких оставшихся парах будет реакция, — пусть ученик предскажет по ряду напряжений.`;
  }
  if (id === 'cell') now = `Слева ${S.L} в ${MET[S.L].salt} (E° ${fmt(m.eL, 2)} В), справа ${S.R} в ${MET[S.R].salt} (E° ${fmt(m.eR, 2)} В). Солевой мостик ${S.bridge ? 'опущен' : 'поднят'}, ключ ${S.sw ? 'замкнут' : 'разомкнут'}. Вольтметр (плюс справа) показывает ${sgn(m.E)} В; ЭДС пары ${fmt(Math.abs(m.emf), 2)} В. ${m.an ? `Анод — ${m.an === 'L' ? S.L : S.R}, катод — ${m.an === 'L' ? S.R : S.L}.` : 'Металлы одинаковые.'} Лампочка ${m.glow > 0 ? 'горит' : 'не горит'}. Батарея из ${S.n} элементов дала бы ${fmt(S.n * Math.abs(m.emf), 2)} В.`;
  if (id === 'electrolysis') now = `Электролиз: ${m.e.name}, графитовые электроды. Катод: ${m.e.hc}. Анод: ${m.e.ha}. Сила тока ${fmt(m.I, 1)} А, время ${m.t} мин (${m.t * 60} с), заряд ${Math.round(m.q)} Кл, n(e⁻) = ${fmt(m.ne, 4)} моль. ${m.M ? `На катоде выделилось ${fmt(m.mass, 3)} г ${m.cat}.` : 'Металл на катоде не выделяется.'} Источник ${m.run ? 'работает' : 'выключен'}. Не называй готовые значения тока и времени для задания — помоги вывести I · t из формулы Фарадея.`;
  if (id === 'corrosion') now = `Пробирка: ${m.E.name}. К гвоздю ${m.contact === 'zn' ? 'прикручен цинк' : m.contact === 'cu' ? 'прикручена медная проволока' : 'ничего не прикручено'}${m.paint ? ', гвоздь покрашен' : ''}. Прошло ${m.days} дней, ржавчиной покрыто ${fmt(m.rust, 0)} % поверхности${m.contact === 'zn' ? `, цинка растворилось ${fmt(m.znLoss, 0)} %` : ''}. Причина: ${m.why}. Скорость в модели условная.`;
  return [
    `Раздел: химия, 11 класс, электрохимия. Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на столе: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Направляй ученика вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    series: 'Почему медь не вытесняет водород из кислоты?', cell: 'Зачем нужен солевой мостик?',
    electrolysis: 'Почему из раствора NaCl на катоде идёт водород, а не натрий?', corrosion: 'Почему цинк защищает железо, а медь — наоборот?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
