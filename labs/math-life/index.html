<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математической грамотности, 5–7 класс: закономерности и числовые ряды, бытовые расчёты, время и расписание, логические задачи — круги Эйлера, принцип Дирихле, взвешивания.">
<title>Логика и расчёты в жизни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.meter .v .fr{font-size:1.15em}
.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:4px 0 0;text-align:center}
.pv div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.pv small{display:block;font:600 9.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pv b{display:block;font:500 22px/1 var(--font-mono);margin-top:6px}
.pv .on b{color:var(--force)}
.calc-q{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.calc-q.ok{border-color:var(--ok)}
.calc-q .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:7px;display:flex;justify-content:space-between}
.calc-q.ok .k{color:var(--ok)}
.calc-q p{margin:0 0 10px;font-size:14px;line-height:1.5}
.calc-q .row{margin-top:0;flex-wrap:nowrap}
.calc-q input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--fg);font:500 16px var(--font-mono)}
.calc-q .ghostbtn{min-height:42px;white-space:nowrap}
.calc-q .fb{margin-top:8px;font-size:13.5px;line-height:1.45}
.calc-q .fb.bad{color:var(--warn)}
.calc-q .fb.good{color:var(--ok)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Логика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: числовые ряды, план комнаты, часы, круги Эйлера и весы. Элементы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const tg = n => Math.round(n).toLocaleString('ru-RU') + ' тг';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const hm = t => { t = ((t % 1440) + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

// ---------- lesson 1: three series with a missing number ----------
const SER = [
  { a: [5, 7, 12, 19, 31, null], ans: 50, rule: 'каждое число — сумма двух предыдущих',
    tip: 'Разности 2, 5, 7, 12 — да это же числа самого ряда. Включите лупу «Сумма двух».' },
  { a: [3, 6, 18, 21, 63, null], ans: 66, rule: 'действия чередуются: +3, ×3, +3, ×3, +3',
    tip: 'Одна лупа здесь не справится. Включите сразу «Разности» и «Частные» и посмотрите на стрелки по очереди.' },
  { a: [13, 19, 17, 15, 21, 19, 17, null, 21], ans: 23, rule: 'тройки чисел устроены одинаково: n; n + 6; n + 4',
    tip: 'Числа удобно разбить на группы. Включите «Тройки» и сравните, что происходит внутри каждой тройки.' },
];
const LENSES = [
  { id: 'diff', name: 'Разности', up: true }, { id: 'ratio', name: 'Частные', up: true },

const KEY = 'luch-math-life';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            cs: saved.cs || {}, // solved problems in «Расчёты»
            ser: [null, null, null], serOk: (saved.serOk || [false, false, false]).slice(0, 3), miss: [0, 0, 0], cur: 0, lens: { diff: true },
            packs: 0, t: 12 * 60,
            sub: 'euler', sd: Object.assign({ euler: false, box: false, scale: false }, saved.sd || {}), x: 0, nd: 1,
            cn: Array(9).fill(0), cand: [0, 1, 2, 3, 4, 5, 6, 7, 8], wh: [], last: null, guess: false, found: null, tilt: 0 };
while (S.serOk.length < 3) S.serOk.push(false);
S.serOk.forEach((ok, k) => { if (ok) S.ser[k] = SER[k].ans; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done, cs: S.cs, serOk: S.serOk, sd: S.sd })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function serVals(k) { const g = S.ser[k]; return SER[k].a.map(v => v === null ? g : v); }
function model() {
  const id = LID();
  if (id === 'pattern') { const s = SER[S.cur]; return { kind: id, k: S.cur, v: serVals(S.cur), unk: s.a.indexOf(null), g: S.ser[S.cur], ok: S.serOk[S.cur], solved: S.serOk.filter(Boolean).length }; }
  if (id === 'cost') { const bought = S.packs * ROOM.pack; return { kind: id, n: S.packs, bought, cov: Math.min(AREA, bought), lack: Math.max(0, AREA - bought), spare: Math.max(0, bought - AREA), cost: S.packs * ROOM.price }; }
  if (id === 'time') { const arr = S.t + TRIPM; return { kind: id, t: S.t, arr, gap: SHOW - arr }; }
  const only = { f: EU.f - S.x, c: EU.c - S.x };
  const worst = []; // worst case: everything that is not black first
  for (const b of BOX) if (b.n !== 'чёрных') for (let i = 0; i < b.k; i++) worst.push(b);
  for (let i = 0; i < BOX[2].k; i++) worst.push(BOX[2]);
  const drawn = worst.slice(0, S.nd);
  return { kind: id, sub: S.sub, x: S.x, fo: only.f, co: only.c, total: only.f + S.x + only.c + EU.none, nd: S.nd, drawn, black: drawn.some(b => b.n === 'чёрных'),
           onL: S.cn.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0), onR: S.cn.map((v, i) => v === 2 ? i : -1).filter(i => i >= 0), nw: S.wh.length };
}

// ---------- drawing helpers ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const T = (x, y, s, txt, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <clipPath id="roomClip"><rect x="${RM.x}" y="${RM.y}" width="${RM.w}" height="${RM.h}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}

// ===== lesson 1 =====
function cardGeo(n) { const g = 8, w = Math.min(70, (480 - (n - 1) * g) / n), x0 = 260 - (n * w + (n - 1) * g) / 2; return { g, w, x0, cx: i => x0 + i * (w + g) + w / 2, x: i => x0 + i * (w + g) }; }
const CARD = { y: 238, h: 56 };
const sgn = d => (d >= 0 ? '+' : '−') + Math.abs(d);
function ratioLbl(a, b) {
  if (a === 0) return '—';
  const r = b / a;
  if (Number.isInteger(r)) return '×' + r;
  if (b !== 0 && Number.isInteger(a / b)) return ':' + (a / b);
  return '×' + trim(r, 2);
}
function patternSVG(m) {
  const s = SER[m.k], v = m.v, n = v.length, G = cardGeo(n);
  const isG = i => i === m.unk, has = i => v[i] !== null && v[i] !== undefined;
  const gc = (...ii) => ii.some(isG) ? '#ffb547' : null;
  let h = '';
  // lens chips
  const cw = (480 - 4 * 6) / 5;
  LENSES.forEach((L, i) => {
    const on = !!S.lens[L.id], x = 20 + i * (cw + 6);
    h += `<g data-k="lens:${L.id}" style="cursor:pointer"><rect x="${x.toFixed(1)}" y="100" width="${cw.toFixed(1)}" height="56" rx="11" fill="${on ? '#e8ecf4' : '#1a2438'}" stroke="${on ? '#e8ecf4' : '#3a4866'}" stroke-width="1.4"/>` +
      T(x + cw / 2, 133, 12.5, L.name, on ? '#0b1019' : '#c3cbe0', 'middle', 'font-weight="500"') + `</g>`;
  });
  // arcs above: differences and ratios
  if (S.lens.diff || S.lens.ratio) for (let i = 0; i < n - 1; i++) {
    const a = G.cx(i) + 3, b = G.cx(i + 1) - 3, mid = (a + b) / 2;
    h += `<path d="M${a.toFixed(1)} ${CARD.y - 4}Q${mid.toFixed(1)} ${CARD.y - 26} ${b.toFixed(1)} ${CARD.y - 4}" fill="none" stroke="#56627d" stroke-width="1.4"/><path d="M${b.toFixed(1)} ${CARD.y - 4}l-5 -3.5l1 5z" fill="#56627d"/>`;
    const ok = has(i) && has(i + 1), col = gc(i, i + 1);
    const fs = n > 7 ? 11 : 12.5;
    if (S.lens.diff) h += T(mid, CARD.y - 22, fs, ok ? sgn(v[i + 1] - v[i]) : '?', col || '#ffd08a', 'middle', 'font-weight="500"');
    if (S.lens.ratio) h += T(mid, CARD.y - (S.lens.diff ? 38 : 22), fs, ok ? ratioLbl(v[i], v[i + 1]) : '?', col || '#72d4e8', 'middle', 'font-weight="500"');
  }
  // cards
  for (let i = 0; i < n; i++) {
    const x = G.x(i), u = isG(i), val = v[i];
    const fill = u ? (m.ok ? 'rgba(134,224,168,.16)' : 'rgba(255,181,71,.12)') : '#1a2438';
    const st = u ? (m.ok ? '#86e0a8' : '#ffb547') : '#56627d';
    h += `<rect x="${x.toFixed(1)}" y="${CARD.y}" width="${G.w.toFixed(1)}" height="${CARD.h}" rx="9" fill="${fill}" stroke="${st}" stroke-width="${u ? 2 : 1.4}" ${u && !m.ok ? 'stroke-dasharray="5 4"' : ''}/>`;
    const txt = u ? (val === null ? '?' : val) : val;
    h += T(G.cx(i), CARD.y + 35, n > 7 ? 19 : 22, txt, u ? (m.ok ? '#86e0a8' : '#ffb547') : '#e8ecf4', 'middle', 'font-weight="500"');
  }
  // below: skip, sum2, tri (one of them)
  const yb = CARD.y + CARD.h;
  if (S.lens.skip) for (let i = 0; i < n - 2; i++) {
    const a = G.cx(i), b = G.cx(i + 2), mid = (a + b) / 2, dep = i % 2 ? 46 : 24;
    h += `<path d="M${a.toFixed(1)} ${yb + 4}Q${mid.toFixed(1)} ${yb + 4 + dep * 1.6} ${b.toFixed(1)} ${yb + 4}" fill="none" stroke="${i % 2 ? '#3f5a7a' : '#56627d'}" stroke-width="1.3"/>`;
    const ok = has(i) && has(i + 2);
    h += `<rect x="${(mid - 17).toFixed(1)}" y="${(yb + dep - 4).toFixed(1)}" width="34" height="17" rx="5" fill="#0e1520"/>` + T(mid, yb + dep + 8.5, 11, ok ? sgn(v[i + 2] - v[i]) : '?', gc(i, i + 2) || (i % 2 ? '#a9c6ea' : '#ffd08a'), 'middle', 'font-weight="500"');
  }
  if (S.lens.sum2) for (let i = 2; i < n; i++) {
    const ok = has(i - 2) && has(i - 1), col = gc(i - 2, i - 1, i);
    const sum = ok ? v[i - 2] + v[i - 1] : null;
    h += T(G.cx(i), yb + 20, n > 7 ? 10 : 11.5, ok ? `${v[i - 2]}+${v[i - 1]}` : '?', col || '#c3cbe0');
    if (ok && has(i)) h += T(G.cx(i), yb + 38, 12, sum === v[i] ? '= ✓' : '≠', sum === v[i] ? '#86e0a8' : '#ff8a73', 'middle', 'font-weight="500"');
  }
  if (S.lens.tri) {
    if (n % 3) h += T(260, yb + 30, 12, 'В этом ряду числа не делятся на тройки поровну', '#8b96ad');
    else for (let gI = 0; gI < n / 3; gI++) {
      const a = G.x(gI * 3) + 2, b = G.x(gI * 3 + 2) + G.w - 2, ids = [gI * 3, gI * 3 + 1, gI * 3 + 2];
      h += `<path d="M${a.toFixed(1)} ${yb + 6}v8H${b.toFixed(1)}v-8" fill="none" stroke="#c9a6ff" stroke-width="1.6"/>`;
      const ok = ids.every(has), col = gc(...ids);
      h += T((a + b) / 2, yb + 32, 12, ok ? 'сумма ' + ids.reduce((s2, j) => s2 + v[j], 0) : 'сумма ?', col || '#c9a6ff', 'middle', 'font-weight="500"');
      h += T((a + b) / 2, yb + 48, 10.5, ok ? `${sgn(v[ids[1]] - v[ids[0]])}, ${sgn(v[ids[2]] - v[ids[1]])}` : '?', col || '#8b96ad');
    }
  }
  h += T(260, 396, 12, `Ряд ${m.k + 1} из 3 · решено рядов: ${m.solved}`, m.ok ? '#86e0a8' : '#8b96ad');
  return h;
}

// ===== lesson 2 =====
const RM = { x: 34, y: 168, s: 42 }; RM.w = ROOM.w * RM.s; RM.h = ROOM.h * RM.s;
const SHELF = { x: 268, y: 150, w: 226, h: 116 };
function costSVG(m) {
  let h = '';
  // room
  h += T(RM.x + RM.w / 2, RM.y - 12, 12, '4,5 м', '#e8ecf4', 'middle', 'font-weight="500"');
  h += T(RM.x - 10, RM.y + RM.h / 2, 12, '4 м', '#e8ecf4', 'middle', `font-weight="500" transform="rotate(-90 ${RM.x - 10} ${RM.y + RM.h / 2})"`);
  h += `<rect x="${RM.x}" y="${RM.y}" width="${RM.w}" height="${RM.h}" fill="#141c2b"/>`;
  // packs laid from the bottom; each pack is a band of 2,2 m² across the room
  const bh = ROOM.pack / ROOM.w * RM.s;
  h += `<g clip-path="url(#roomClip)">`;
  for (let k = 0; k < m.n; k++) {
    const y1 = RM.y + RM.h - k * bh, y0 = y1 - bh;
    if (y1 <= RM.y) break;
    h += `<rect x="${RM.x}" y="${y0.toFixed(1)}" width="${RM.w}" height="${bh.toFixed(1)}" fill="${k % 2 ? '#a7743f' : '#c08a4e'}"/>`;
    for (let j = 1; j < 9; j++) { const px = RM.x + j * RM.w / 9 + (k % 2 ? RM.w / 18 : 0); h += `<path d="M${px.toFixed(1)} ${y0.toFixed(1)}v${bh.toFixed(1)}" stroke="rgba(60,35,15,.45)" stroke-width="1"/>`; }
    h += `<path d="M${RM.x} ${y0.toFixed(1)}h${RM.w}" stroke="rgba(40,22,10,.7)" stroke-width="1.2"/>`;
    h += T(RM.x + 12, y0 + bh / 2 + 4, 10, k + 1, '#2b1a10', 'middle', 'font-weight="500"');
  }
  h += `</g>`;
  // 0,5 m grid
  for (let i = 1; i < ROOM.w * 2; i++) h += `<path d="M${RM.x + i * RM.s / 2} ${RM.y}v${RM.h}" stroke="rgba(160,185,230,${i % 2 ? .07 : .14})" stroke-width="1"/>`;
  for (let i = 1; i < ROOM.h * 2; i++) h += `<path d="M${RM.x} ${RM.y + i * RM.s / 2}h${RM.w}" stroke="rgba(160,185,230,${i % 2 ? .07 : .14})" stroke-width="1"/>`;
  h += `<rect x="${RM.x}" y="${RM.y}" width="${RM.w}" height="${RM.h}" fill="none" stroke="#c9d3e3" stroke-width="3"/>`;

function parseAns(s, time) {
  s = String(s).trim();
  if (time) { const mm = s.match(/(\d{1,2})\s*[:.,чh ]\s*(\d{1,2})/i); return mm ? (+mm[1] % 24) * 60 + +mm[2] : NaN; }
  s = s.replace(/[\s  ]/g, '').replace(/,/g, '.').replace(/−/g, '-');
  const f = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)/); if (f) return +f[1] / +f[2];
  const n = s.match(/^-?\d+(?:\.\d+)?/); return n ? +n[0] : NaN;
}
function checkCalc(i) {
  const id = LID(), P = CALC[id][i], box = $(`#pane-calc .calc-q[data-i="${i}"]`); if (!box) return;
  const inp = box.querySelector('input'), fb = box.querySelector('.fb');
  if (!inp.value.trim()) { fb.className = 'fb bad'; fb.textContent = 'Сначала впишите ответ.'; return; }
  const v = parseAns(inp.value, P.time), want = P.time ? parseAns(P.a, true) : P.a;
  if (isNaN(v)) { fb.className = 'fb bad'; fb.textContent = P.time ? 'Запишите время как чч:мм, например 07:05.' : 'Впишите число, например 12 или 2,5.'; return; }
  if (Math.abs(v - want) < 1e-6) {
    S.cs[id + i] = true; save(); box.classList.add('ok'); box.querySelector('.k span:last-child').textContent = '✓ решено';
    fb.className = 'fb good'; fb.textContent = 'Верно!';
  } else { fb.className = 'fb bad'; fb.textContent = 'Пока неверно. Подсказка: ' + P.hint; }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (L.id === 'logic') {
    const msg = { euler: 'Круги решены: пересечение посчитано верно.', box: 'Ящик решён: это наименьшее число, при котором чёрный будет наверняка.' };
    if (!S.sd.euler && m.total === EU.all) { S.sd.euler = true; save(); if (!L.check()) toast(msg.euler); }
    if (!S.sd.box && m.nd === 10) { S.sd.box = true; save(); if (!L.check()) toast(msg.box); }
  }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Логика и расчёты — ваши!');
  }
  renderTools();
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  time: '<circle cx="20" cy="15" r="11" fill="#f3efe4"/><path d="M20 15V7" stroke="#e0662f" stroke-width="1.8"/><path d="M20 15l5 2" stroke="#1b2333" stroke-width="2.2"/><rect x="36" y="12" width="7" height="6" fill="#86e0a8"/><rect x="43" y="12" width="12" height="6" fill="#72d4e8"/><path d="M60 8v14" stroke="#ff8a73" stroke-width="1.6"/>',

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.ser = SER.map((s, k) => S.serOk[k] ? s.ans : null); S.miss = [0, 0, 0]; S.cur = Math.max(0, S.serOk.findIndex(x => !x)); S.lens = { diff: true };
  S.packs = 0; S.t = 12 * 60;
  S.x = 0; S.nd = 1; S.sub = ['euler', 'box', 'scale'].find(k => !S.sd[k]) || 'euler';
  S.cn = Array(9).fill(0); S.cand = [0, 1, 2, 3, 4, 5, 6, 7, 8]; S.wh = []; S.last = null; S.guess = false; S.found = null; S.tilt = 0;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor and the lecture generator: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let scheme = '', now = '', tutor = '';
  if (id === 'pattern') {
    scheme = 'На схеме — три числовых ряда (переключаются кнопками «Ряд 1–3»), в каждом одна карточка «?». Ряд 1: 5; 7; 12; 19; 31; ?. Ряд 2: 3; 6; 18; 21; 63; ?. Ряд 3: 13; 19; 17; 15; 21; 19; 17; ?; 21. Над рядом — «лупы»: «Разности» и «Частные» подписывают стрелки между соседними числами (их можно включить вместе), «Через одно» показывает разность чисел через одно, «Сумма двух» пишет под числом сумму двух предыдущих и отмечает, совпала ли она, «Тройки» объединяет числа по три и пишет сумму и шаги внутри тройки. Число на месте «?» ставится кнопками −10, −1, +1, +10, затем «Проверить».';
    now = `Открыт ряд ${m.k + 1}: ${m.v.map(x => x === null ? '?' : x).join('; ')}. Включены лупы: ${LENSES.filter(x => S.lens[x.id]).map(x => x.name).join(', ') || 'нет'}. Решено рядов: ${m.solved} из 3 (${S.serOk.map((o, k) => `ряд ${k + 1} — ${o ? 'решён' : 'нет'}`).join(', ')}).`;
    tutor = 'Для тьютора: не называй пропущенные числа и не формулируй правило целиком. Подсказывай, какую лупу включить: ряд 1 — посмотреть на разности и заметить, что они совпадают с числами ряда (лупа «Сумма двух»); ряд 2 — включить «Разности» и «Частные» вместе и заметить чередование действий; ряд 3 — лупа «Тройки», сравнить шаги внутри троек.';
  } else if (id === 'cost') {
    scheme = 'На схеме — план комнаты 4,5 м × 4 м (вид сверху, сетка через 0,5 м), справа полка магазина с пачкой ламината (2,2 м² в пачке, 9 500 тг) и чек. Нажатие на пачку или кнопка «+ пачка» кладёт пачку на пол полосой площадью 2,2 м²; «− пачка» убирает. Непокрытая часть пола подписана красным, в чеке — число пачек, их площадь и стоимость.';
    now = `В корзине ${m.n} пачек: ${trim(m.bought, 2)} м², стоимость ${tg(m.cost)}. ${m.lack > 0 ? `Пол не покрыт: не хватает ${trim(m.lack, 2)} м².` : m.n ? `Пол покрыт, запас ${trim(m.spare, 2)} м²${m.spare >= ROOM.pack ? ' — одна пачка лишняя' : ''}.` : 'Корзина пуста.'}`;
    tutor = 'Для тьютора: не называй число пачек. Веди вопросами: какая площадь пола (длина × ширина)? Сколько раз 2,2 помещается в эту площадь? Хватит ли целой части, если есть остаток? Почему пачки округляем вверх, а не по правилам округления?';
  } else if (id === 'time') {
    scheme = 'На схеме — круглые часы: оранжевую минутную стрелку можно тащить, часовая идёт следом; кнопки «−1 ч», «+1 ч», «−5 мин», «+5 мин». Справа табло с временем выхода в 24-часовом формате и дорога по шагам: 12 мин пешком до метро, 28 мин в метро, 5 мин пешком до театра — с временем после каждого шага и числом минут до начала спектакля в 19:00. Внизу — лента времени от 16:30 до 19:30 с цветными участками дороги и красной чертой 19:00.';
    now = `Выход из дома в ${hm(m.t)}, в театре в ${hm(m.arr)}, ${m.gap >= 0 ? `до начала остаётся ${m.gap} мин` : `опоздание ${-m.gap} мин`}. Нужно, чтобы до начала оставалось 30 минут.`;
    tutor = 'Для тьютора: не называй время выхода. Веди вопросами: к какому времени нужно быть в театре? Сколько минут занимает вся дорога? Что получится, если отнять дорогу от этого времени? Напомни, что 60 минут = 1 час и считать удобно с конца.';
  } else {
    scheme = 'На схеме три задачи, переключаются кнопками «Круги», «Ящик», «Весы». «Круги»: прямоугольник — класс из 30 учеников, два круга — футбол (18) и шахматы (15), 5 учеников не ходят никуда; кнопки «Оба −1/+1» меняют число учеников в пересечении, в частях пишутся «только футбол», «оба», «только шахматы», внизу сумма всех частей сравнивается с 30. «Ящик»: 5 белых, 4 синих и 8 чёрных маркеров; кнопки «Достать −1/+1» задают, сколько маркеров достаём, справа показан худший случай (сначала все не чёрные) и есть ли среди них чёрный. «Весы»: 9 монет, одна фальшивая легче; нажатие на монету кладёт её на левую, потом на правую чашу, потом обратно; «Взвесить» показывает, какая чаша легче; весы отвечают так, чтобы подозреваемых осталось как можно больше (худший случай); «Указать фальшивую» и нажатие на монету — ответ; нужно уложиться в 2 взвешивания.';
    now = `Открыта задача «${m.sub === 'euler' ? 'Круги' : m.sub === 'box' ? 'Ящик' : 'Весы'}». ` +
      (m.sub === 'euler' ? `В оба кружка сейчас ${m.x}, только футбол ${m.fo}, только шахматы ${m.co}, никуда 5, сумма ${m.total} (в классе 30).` :
       m.sub === 'box' ? `Достаём ${m.nd}; в худшем случае ${m.black ? 'чёрный есть' : 'чёрного нет'}.` :
       `Взвешиваний: ${m.nw}${S.wh.length ? ' (' + S.wh.map((w, j) => `${j + 1}) ${w.L.map(i => i + 1).join(',')} против ${w.R.map(i => i + 1).join(',')}: ${w.r === '=' ? 'поровну' : w.r === 'L' ? 'левая легче' : 'правая легче'}`).join('; ') + ')' : ''}. На левой чаше: ${m.onL.map(i => i + 1).join(', ') || 'пусто'}, на правой: ${m.onR.map(i => i + 1).join(', ') || 'пусто'}.`) +
      ` Решено: круги — ${S.sd.euler ? 'да' : 'нет'}, ящик — ${S.sd.box ? 'да' : 'нет'}, весы — ${S.sd.scale ? 'да' : 'нет'}.`;
    tutor = 'Для тьютора: не называй ответы (число в пересечении, число маркеров, номер монеты). Подсказывай идеи: в сумме 18 + 15 кто-то посчитан дважды; худший случай — сначала достаются все не чёрные; весы дают три исхода, поэтому 9 монет делят на три кучки по 3.';
  }
  return [
    `Раздел: математика (математическая грамотность ЕНТ), 5–7 класс, тема «Логика и расчёты в жизни». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    scheme,
    `Задание: ${L.task} Подсказка на экране: ${L.hint} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Во вкладке «Расчёты» — задачи как на ЕНТ: ${CALC[id].map((P, i) => `${i + 1}) ${P.q}${S.cs[id + i] ? ' (решена)' : ''}`).join(' ')}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    tutor,
    'Не называй готовый ответ к заданию и задачам: веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    pattern: 'Как понять, какую лупу включать первой?', cost: 'Почему упаковки округляют вверх?',
    time: 'Как сложить время, если минут больше 60?', logic: 'Почему монеты делят на три кучки, а не на две?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
