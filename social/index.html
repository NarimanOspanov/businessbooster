<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Друзья и группы — Open Lab AI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#0b1019;--surface:#121a28;--surface-2:#1a2438;--line:#26324a;--fg:#e8ecf4;--muted:#8b96ad;--ok:#86e0a8;--accent:#ffb547;--warn:#ff8a73;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;--font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color-scheme:dark;
  --h0:#161f30;--h1:#1f4a33;--h2:#2f7a4f;--h3:#4fb377;--h4:#86e0a8;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
h2{font:700 24px/1.2 var(--font-display);margin:24px 0 4px}
.lead{color:var(--muted);margin:0 0 16px;font-size:14px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px}
nav.tabs a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#1b0b06;font:700 11px/18px var(--font-body);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font:600 12px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#3a4866}.btn.pri{background:var(--accent);color:#1b1206;border-color:var(--accent)}.btn.dan{color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;background:#ff9f1c;color:#1b1206;font:700 16px var(--font-display);overflow:hidden}
.av.lg{width:84px;height:84px;font-size:32px}
.who{flex:1;min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who a{text-decoration:none}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
input.f{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
input.f:focus{outline:2px solid var(--accent);border-color:transparent}
.inl{display:flex;gap:8px}
.chat{display:flex;flex-direction:column;height:min(70vh,640px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;position:relative}
.msg.me{align-self:flex-end;background:#3a2c12;border:1px solid #6b4f1c}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.msg .au{display:block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px;text-decoration:none}
.msg .rp{all:unset;cursor:pointer;position:absolute;right:-26px;top:6px;opacity:0;font-size:13px;color:var(--muted)}
.msg:hover .rp,.msg .rp:focus-visible{opacity:1}
.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.compose textarea{flex:1;resize:none;height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof h2{margin:0}.prof .sp{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 14px}.stat b{display:block;font:700 22px var(--font-display)}.stat span{color:var(--muted);font-size:12.5px}
.heat{overflow-x:auto}
.board .n{font:700 16px var(--font-display);width:28px;color:var(--muted)}
.board .sc{font:600 14px var(--font-mono);text-align:right}
.board .row.me{background:rgba(255,181,71,.07);border-radius:10px;padding-left:6px}
.code{font:700 22px/1 var(--font-mono);letter-spacing:.18em;color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.gate{text-align:center;padding:60px 20px}.gate h2{margin-bottom:10px}.gate p{color:var(--muted);max-width:520px;margin:0 auto 22px}
.feed .row{align-items:flex-start}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.msg{max-width:88%}.compose{padding-right:62px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/></svg>
      <div><h1>OPEN LAB AI</h1><small>Доступное образование для всех</small></div>
    </a>
  </header>
  <section id="gate" class="gate" hidden>
    <h2>Друзья и группы</h2>
    <p>Добавляй друзей, смотри, кто что прошёл, переписывайся и собирайся в группы с классом — с общим рейтингом и чатом.</p>
    <button class="btn pri" id="signIn" type="button">Войти через Google или почту</button>
  </section>
  <main id="app" hidden>
    <nav class="tabs" aria-label="Разделы">
      <a href="#feed" data-t="feed">Лента</a>
      <a href="#friends" data-t="friends">Друзья <span class="badge" id="bReq" hidden></span></a>
      <a href="#chat" data-t="chat">Сообщения <span class="badge" id="bMsg" hidden></span></a>
      <a href="#groups" data-t="groups">Группы</a>
      <a href="/me/">Мой кабинет</a>
    </nav>
    <div id="view"></div>
  </main>
  <p id="loading" class="empty" style="margin-top:40px">Загружаю…</p>
</div>
<script>
(() => {
const $ = s => document.querySelector(s), view = () => $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const when = d => { const x = new Date(d), now = new Date(), t = x.toTimeString().slice(0, 5); return x.toDateString() === now.toDateString() ? t : x.getDate() + ' ' + MON[x.getMonth()] + ' ' + t; };
const av = (u, lg) => u && u.image ? `<img class="av${lg ? ' lg' : ''}" src="${esc(u.image)}" alt="">` : `<span class="av${lg ? ' lg' : ''}">${esc(((u && u.name) || '•')[0])}</span>`;
const ICON = { task: '✅', quiz: '🧠', theory: '🎧', topic: '🏁' };
const topicName = p => ((window.LUCH_TOPIC_NAMES || {})[p] || p).split(' · ').pop();

async function api(path, body) {
  const t = await window.LuchAuth.token();
  const r = await fetch('/api/social/' + path, { method: body ? 'POST' : 'GET', headers: Object.assign({ Authorization: 'Bearer ' + t }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ ok: false, error: 'нет связи' }));
  if (!j.ok) throw new Error(j.error || 'ошибка');
  return j;
}
let poll = 0, me = null;
const stopPoll = () => { clearInterval(poll); poll = 0; };

async function counters() {
  try { me = await api('me'); const r = $('#bReq'), m = $('#bMsg'); r.textContent = me.requests; r.hidden = !me.requests; m.textContent = me.unread; m.hidden = !me.unread; } catch (e) {}
}

// ---------- кнопки по отношению к человеку ----------
function relBtns(u, rel) {
  const h = esc(u.handle);
  if (rel === 'self') return `<a class="btn" href="/me/">Мой кабинет</a>`;
  if (rel === 'blocked') return `<button class="btn" data-f="unblock" data-h="${h}">Разблокировать</button>`;
  const b = [];
  if (rel === 'friend') b.push(`<a class="btn pri" href="#chat/${h}">Написать</a>`, `<button class="btn" data-f="remove" data-h="${h}" data-ask="Удалить из друзей?">Удалить из друзей</button>`);
  if (rel === 'none') b.push(`<button class="btn pri" data-f="request" data-h="${h}">Добавить в друзья</button>`);
  if (rel === 'requested') b.push(`<button class="btn" data-f="cancel" data-h="${h}">Заявка отправлена · отменить</button>`);
  if (rel === 'incoming') b.push(`<button class="btn pri" data-f="accept" data-h="${h}">Принять заявку</button>`, `<button class="btn" data-f="decline" data-h="${h}">Отклонить</button>`);
  return b.join('');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  if (b.dataset.ask && !confirm(b.dataset.ask)) return;
  b.disabled = true;
  try { await api('friend', { handle: b.dataset.h, action: b.dataset.f }); counters(); route(); } catch (er) { alert(er.message); b.disabled = false; }
});

// ---------- профиль ----------
async function profile(h) {
  const j = await api('u/' + h), u = j.user, s = j.stats;
  let html = `<div class="card"><div class="prof">${av(u, 1)}<div><h2>${esc(u.name)}</h2><p class="lead" style="margin:4px 0 0">@${esc(u.handle)} · ${u.friends} ${plural(u.friends, 'друг', 'друга', 'друзей')}</p>${u.bio ? `<p style="margin:8px 0 0">${esc(u.bio)}</p>` : ''}</div><div class="sp"></div>
    <div class="acts">${relBtns(u, j.rel)}${j.rel !== 'self' && j.rel !== 'blocked' ? `<button class="btn dan" data-f="block" data-h="${esc(u.handle)}" data-ask="Заблокировать? Этот ученик не сможет вам писать и не увидит ваш профиль.">Заблокировать</button><button class="btn" id="rep">Пожаловаться</button>` : ''}</div></div>`;
  if (!j.open) html += `<p class="empty" style="margin-top:14px">Профиль открыт только друзьям. Добавьте в друзья, чтобы видеть прогресс.</p>`;
  else {
    html += `<div class="stats"><div class="stat"><b>${s.activeDays}</b><span>${plural(s.activeDays, 'день занятий', 'дня занятий', 'дней занятий')}</span></div><div class="stat"><b>${s.streak}</b><span>дней подряд${s.streak ? ' 🔥' : ''}</span></div><div class="stat"><b>${s.tasks}</b><span>${plural(s.tasks, 'задание', 'задания', 'заданий')}</span></div><div class="stat"><b>${s.quizzes}</b><span>${plural(s.quizzes, 'тест', 'теста', 'тестов')}</span></div></div>`;
    html += `<h3 style="margin-top:18px">Активность</h3><div class="heat">${heat(s.days)}</div>`;
    if (s.topics.length) html += `<h3 style="margin-top:18px">Темы</h3>${s.topics.map(t => `<div class="row"><span class="who"><a href="${esc(t.path)}"><b>${esc(topicName(t.path))}</b></a></span><small class="note">${t.done} ${plural(t.done, 'задание', 'задания', 'заданий')}</small></div>`).join('')}`;
  }
  view().innerHTML = html + '</div>';
  const rp = $('#rep'); if (rp) rp.onclick = async () => { const why = prompt('Что случилось? Мы проверим.'); if (why === null) return; try { await api('report', { handle: u.handle, reason: why }); alert('Спасибо, жалоба отправлена.'); } catch (er) { alert(er.message); } };
}
function heat(days) {
  const end = new Date(); end.setHours(0, 0, 0, 0); const start = new Date(end); start.setDate(start.getDate() - 181 - ((start.getDay() + 6) % 7));
  const C = 12, G = 3, weeks = Math.ceil(((end - start) / 864e5 + 1) / 7); let s = '';
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) { const x = new Date(start); x.setDate(start.getDate() + w * 7 + d); if (x > end) continue; const k = x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'), v = days[k] || 0, lv = !v ? 0 : v < 3 ? 1 : v < 7 ? 2 : v < 12 ? 3 : 4; s += `<rect x="${w * (C + G)}" y="${d * (C + G)}" width="${C}" height="${C}" rx="2.5" fill="var(--h${lv})"><title>${x.getDate()} ${MON[x.getMonth()]}</title></rect>`; }
  return `<svg width="${weeks * (C + G)}" height="${7 * (C + G)}" role="img" aria-label="Активность за полгода">${s}</svg>`;
}

// ---------- лента ----------
async function feed() {
  const j = await api('feed');
  view().innerHTML = `<div class="card feed"><h3>Что делают друзья</h3>${j.items.length ? j.items.map(x => `<div class="row">${av(x.user)}<span class="who"><a href="#u/${esc(x.user.handle)}"><b>${esc(x.user.name)}</b></a><span>${ICON[x.kind] || '•'} ${esc(x.title)}</span>${x.detail ? `<small>${esc(x.detail)}</small>` : ''}</span><small class="note">${when(x.at)}</small></div>`).join('')
    : '<p class="empty">Пока тихо. Добавь друзей — здесь появится, что они проходят и как сдают тесты.</p><p><a class="btn pri" href="#friends">Найти друзей</a></p>'}</div>`;
}

// ---------- друзья и поиск ----------
async function friends() {
  const j = await api('friends'), link = location.origin + '/social/#u/' + (me && me.handle);
  const li = (u, extra) => `<div class="row">${av(u)}<span class="who"><a href="#u/${esc(u.handle)}"><b>${esc(u.name)}</b><small>@${esc(u.handle)}</small></a></span><span class="acts">${extra}</span></div>`;
  view().innerHTML = `<div class="card"><h3>Найти по имени или адресу</h3><input class="f" id="q" placeholder="Например, Алия или aliya" autocomplete="off"><div id="res"></div>
      <p class="note" style="margin:12px 0 0">Или отправь другу ссылку на свой профиль: <a href="${esc(link)}" id="myLink">${esc(link)}</a> <button class="btn" id="copy" style="padding:4px 10px">Копировать</button></p></div>
    ${j.incoming.length ? `<div class="card"><h3>Заявки в друзья</h3>${j.incoming.map(u => li(u, relBtns(u, 'incoming'))).join('')}</div>` : ''}
    <div class="card"><h3>Друзья · ${j.friends.length}</h3>${j.friends.length ? j.friends.map(u => li(u, `<a class="btn" href="#chat/${esc(u.handle)}">Написать</a>`)).join('') : '<p class="empty">Пока никого. Найди одноклассников через поиск выше.</p>'}</div>
    ${j.outgoing.length ? `<div class="card"><h3>Ждут ответа</h3>${j.outgoing.map(u => li(u, relBtns(u, 'requested'))).join('')}</div>` : ''}
    ${j.blocked.length ? `<div class="card"><h3>Заблокированы</h3>${j.blocked.map(u => li(u, relBtns(u, 'blocked'))).join('')}</div>` : ''}`;
  $('#copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(link); $('#copy').textContent = 'Скопировано'; };
  let t = 0;
  $('#q').oninput = e => { clearTimeout(t); const q = e.target.value.trim(); t = setTimeout(async () => {
    if (q.length < 2) { $('#res').innerHTML = ''; return; }
    const r = await api('search?q=' + encodeURIComponent(q));
    $('#res').innerHTML = r.users.length ? r.users.map(u => li(u, relBtns(u, u.rel))).join('') : '<p class="empty" style="margin-top:10px">Никого не нашли.</p>';
  }, 300); };
}

// ---------- сообщения ----------
async function inbox() {
  const j = await api('inbox');
  view().innerHTML = `<div class="card"><h3>Переписки</h3>${j.chats.length ? j.chats.map(c => `<a class="row" href="#chat/${esc(c.user.handle)}" style="text-decoration:none">${av(c.user)}<span class="who"><b>${esc(c.user.name)}</b><small>${c.mine ? 'Вы: ' : ''}${esc(c.last)}</small></span><small class="note">${when(c.at)}</small>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</a>`).join('')
    : '<p class="empty">Писать можно друзьям. Открой друга в разделе «Друзья» и нажми «Написать».</p>'}</div>`;
}
async function chatView(kind, id) {
  // kind: 'dm' (личная переписка) или 'g' (чат группы)
  let last = 0, box, ta;
  const path = kind === 'dm' ? 'dm/' + id : 'g/' + id;
  const draw = (msgs, group) => {
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.insertAdjacentHTML('beforeend', msgs.map(m => `<div class="msg${m.mine ? ' me' : ''}">${group && !m.mine ? `<a class="au" href="#u/${esc(m.user.handle)}">${esc(m.user.name)}</a>` : ''}${esc(m.body)}<small>${when(m.at)}${m.mine && kind === 'dm' && m.read ? ' · прочитано' : ''}</small>${!m.mine ? `<button class="rp" data-m="${m.id}" title="Пожаловаться" aria-label="Пожаловаться на сообщение">⚑</button>` : ''}</div>`).join(''));
    if (msgs.length) last = msgs[msgs.length - 1].id;
    if (atBottom || msgs.some(m => m.mine)) box.scrollTop = box.scrollHeight;
  };
  return {
    mount(el, msgs, canWrite, group, why) {
      el.insertAdjacentHTML('beforeend', `<div class="chat"><div class="msgs" id="msgs"></div>${canWrite ? `<form class="compose" id="cmp"><textarea id="ta" maxlength="1000" placeholder="Сообщение…" aria-label="Сообщение"></textarea><button class="btn pri" type="submit">Отправить</button></form>` : `<p class="note">${why || ''}</p>`}</div>`);
      box = $('#msgs'); ta = $('#ta'); draw(msgs, group); box.scrollTop = box.scrollHeight;
      if (msgs.length === 0) box.innerHTML = '<p class="empty" style="margin:auto">Сообщений пока нет — напиши первым.</p>';
      box.addEventListener('click', async e => { const r = e.target.closest('.rp'); if (!r) return; const why2 = prompt('Что не так с сообщением?'); if (why2 === null) return; await api('report', { message: +r.dataset.m, reason: why2 }).catch(() => {}); alert('Спасибо, проверим.'); });
      if (ta) {
        const sendMsg = async () => { const v = ta.value.trim(); if (!v) return; ta.value = ''; try { const j = await api(path + '?after=' + last, { body: v }); if (box.querySelector('.empty')) box.innerHTML = ''; draw(j.messages, group); } catch (er) { alert(er.message); ta.value = v; } counters(); };
        $('#cmp').onsubmit = e => { e.preventDefault(); sendMsg(); };
        ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
        ta.focus();
      }
      stopPoll(); poll = setInterval(async () => { if (document.hidden) return; try { const j = await api(path + '?after=' + last); if (j.messages.length) { if (box.querySelector('.empty')) box.innerHTML = ''; draw(j.messages, group); } } catch (e) {} }, 5000);
    },
  };
}
async function dm(h) {
  const j = await api('dm/' + h);
  view().innerHTML = `<div class="card"><div class="row" style="border:0;padding-top:0"><a class="btn" href="#chat">‹</a>${av(j.user)}<span class="who"><a href="#u/${esc(j.user.handle)}"><b>${esc(j.user.name)}</b><small>@${esc(j.user.handle)}</small></a></span></div><div id="cv"></div></div>`;
  (await chatView('dm', h)).mount($('#cv'), j.messages, j.canWrite, false, j.rel === 'blocked' ? 'Вы заблокировали этого ученика.' : 'Писать можно только друзьям. Сначала отправьте заявку в друзья.');
  counters();
}

// ---------- группы ----------
async function groups() {
  const j = await api('groups');
  view().innerHTML = `<div class="card"><h3>Мои группы</h3>${j.groups.length ? j.groups.map(g => `<a class="row" href="#g/${g.code}" style="text-decoration:none"><span class="av" style="border-radius:12px;background:#72d4e8">${esc(g.name[0])}</span><span class="who"><b>${esc(g.name)}</b><small>${g.members} ${plural(g.members, 'участник', 'участника', 'участников')}${g.last ? ' · ' + esc(g.last) : ''}</small></span>${g.mine ? '<small class="note">вы создали</small>' : ''}</a>`).join('') : '<p class="empty">Ты пока не в группах. Создай группу для класса или друзей — или вступи по коду.</p>'}</div>
    <div class="card"><h3>Создать группу</h3><form class="inl" id="mk"><input class="f" id="gn" maxlength="80" placeholder="Например, 8 «Б» — физика"><button class="btn pri" type="submit">Создать</button></form><p class="note" style="margin:8px 0 0">В группе — общий рейтинг за неделю и чат. Вступают только по коду-приглашению.</p></div>
    <div class="card"><h3>Вступить по коду</h3><form class="inl" id="jn"><input class="f" id="gc" maxlength="8" placeholder="8 символов" style="text-transform:uppercase;letter-spacing:.12em"><button class="btn" type="submit">Вступить</button></form></div>`;
  $('#mk').onsubmit = async e => { e.preventDefault(); try { const r = await api('group', { action: 'create', name: $('#gn').value }); location.hash = 'g/' + r.code; } catch (er) { alert(er.message); } };
  $('#jn').onsubmit = async e => { e.preventDefault(); const c = $('#gc').value.trim().toUpperCase(); try { await api('group', { action: 'join', code: c }); location.hash = 'g/' + c; } catch (er) { alert(er.message); } };
}
async function group(code) {
  const j = await api('g/' + code), g = j.group, link = location.origin + '/social/#g/' + g.code;
  if (!j.member) { view().innerHTML = `<div class="card" style="text-align:center;padding:36px"><h2 style="margin:0 0 6px">${esc(g.name)}</h2><p class="lead">${g.members} ${plural(g.members, 'участник', 'участника', 'участников')}</p><button class="btn pri" id="join">Вступить в группу</button></div>`; $('#join').onclick = async () => { await api('group', { action: 'join', code: g.code }); route(); }; return; }
  view().innerHTML = `<div class="card"><div class="prof"><span class="av lg" style="border-radius:20px;background:#72d4e8">${esc(g.name[0])}</span><div><h2>${esc(g.name)}</h2><p class="lead" style="margin:4px 0 0">${g.members} ${plural(g.members, 'участник', 'участника', 'участников')}</p></div><div class="sp"></div>
      <div class="acts"><button class="btn" id="inv">Пригласить</button><button class="btn dan" id="leave">Выйти</button></div></div>
      <p class="note" id="invBox" hidden style="margin:12px 0 0">Код группы: <span class="code">${g.code}</span> · ссылка: <a href="${esc(link)}">${esc(link)}</a></p></div>
    <div class="card board"><h3>Рейтинг за неделю · выполненные задания</h3>${j.board.map((u, i) => `<div class="row${u.me ? ' me' : ''}"><span class="n">${i + 1}</span>${av(u)}<span class="who"><a href="#u/${esc(u.handle)}"><b>${esc(u.name)}${u.me ? ' (вы)' : ''}</b></a><small>всего ${u.total}</small></span><span class="sc">${u.week}</span>${j.owner && !u.me ? `<button class="btn" data-kick="${esc(u.handle)}" title="Убрать из группы" aria-label="Убрать из группы">✕</button>` : ''}</div>`).join('')}</div>
    <div class="card"><h3>Чат группы</h3><div id="cv"></div></div>`;
  $('#inv').onclick = () => { const b = $('#invBox'); b.hidden = !b.hidden; if (navigator.clipboard) navigator.clipboard.writeText(link); };
  $('#leave').onclick = async () => { if (!confirm('Выйти из группы?')) return; await api('group', { action: 'leave', code: g.code }); location.hash = 'groups'; };
  view().querySelectorAll('[data-kick]').forEach(b => b.onclick = async () => { if (!confirm('Убрать из группы?')) return; await api('group', { action: 'kick', code: g.code, handle: b.dataset.kick }); route(); });
  (await chatView('g', g.code)).mount($('#cv'), j.messages, true, true);
}

// ---------- маршруты ----------
async function route() {
  stopPoll();
  const h = (location.hash || '#feed').slice(1), [t, arg] = h.split('/');
  document.querySelectorAll('nav.tabs [data-t]').forEach(a => a.setAttribute('aria-current', a.dataset.t === (t === 'u' ? '' : t === 'g' ? 'groups' : t) ? 'page' : 'false'));
  view().innerHTML = '<p class="empty">Загружаю…</p>';
  try {
    if (t === 'u' && arg) await profile(arg);
    else if (t === 'chat' && arg) await dm(arg);
    else if (t === 'chat') await inbox();
    else if (t === 'friends') await friends();
    else if (t === 'g' && arg) await group(arg);
    else if (t === 'groups') await groups();
    else await feed();
  } catch (e) { view().innerHTML = `<div class="card"><p class="empty">${esc(e.message)}</p></div>`; }
}
addEventListener('hashchange', route);
let started = false;
function start() { if (started) return route(); started = true; $('#loading').hidden = true; $('#gate').hidden = true; $('#app').hidden = false; counters().then(route); setInterval(() => { if (!document.hidden) counters(); }, 30000); }
function gate() { started = false; stopPoll(); $('#loading').hidden = true; $('#app').hidden = true; $('#gate').hidden = false; }
$('#signIn').onclick = () => window.LuchAuth && window.LuchAuth.openSignIn();
document.addEventListener('luch-auth', e => { e.detail.user ? start() : gate(); });
(function wait() { const A = window.LuchAuth; if (!A || !A.ready) return setTimeout(wait, 150); A.user ? start() : gate(); })();
})();
</script>
<script src="/luch/topic-names.js"></script>
<script src="/luch/auth.js"></script>
<script src="/luch/tutor.js" defer></script>
</body>
