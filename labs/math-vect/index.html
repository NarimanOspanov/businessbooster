/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{

  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}

.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}

.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}

.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}

.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}

@media (max-width:600px){

  .brand h1{font-size:19px}

}

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const pt = (x, y) => `(${num(x)}; ${num(y)})`;
const pn = v => v < 0 ? `(${num(v)})` : num(v);        // number in brackets when negative
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CA_ = '#72d4e8', CB_ = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad';
const same = (p, q) => p[0] === q[0] && p[1] === q[1];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const isSq = n => { const r = Math.round(Math.sqrt(n)); return r * r === n; };
const root = n => isSq(n) ? num(Math.round(Math.sqrt(n))) : `√${n}`;
const rootL = n => isSq(n) ? num(Math.round(Math.sqrt(n))) : `√${n} ≈ ${fmt(Math.sqrt(n), 2)}`;
const d2 = (p, q) => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;

// task data
const VA = [4, 1], VBv = [-1, 3], A_T = [2, -6], B_T = [5, 1], M0 = [-4, -3];
const PA = [-3, -1], PB = [5, 3];
const CEN = [1, -2], RAD = 4, KP = [5, 0];

const LESSONS = [
  { id: 'vec', title: 'Векторы и их сумма',
    text: ['Вектор — это направленный отрезок: у него есть начало и конец. Обозначают его двумя буквами со стрелкой (AB) или одной маленькой буквой: a. Длину вектора называют модулем и пишут |a|.',
           'Координаты вектора — это разность координат конца и начала: x = x₂ − x₁, y = y₂ − y₁. Векторы равны, если равны их координаты. Поэтому вектор можно отложить от любой точки: при переносе он не меняется.',
           'Сумму a + b строят по правилу треугольника: от конца a откладывают b, и сумма идёт от начала a к концу b. В координатах ещё проще: x складывают с x, y — с y. Длина вектора: |a| = √(x² + y²).'],
    why: 'Пилот и авиадиспетчер в Алматы складывают векторы каждый рейс: скорость самолёта относительно земли = собственная скорость + ветер. Инженер-конструктор складывает силы, чтобы кран не опрокинулся. Программист игр двигает героя, прибавляя вектор скорости к координатам каждый кадр, а 3D-графика в кино и на телефоне — это миллионы операций с векторами. Это профессии с хорошими зарплатами, и начинаются они с этого урока.',
    task: 'Векторы a(4; 1) и b(−1; 3) уже на плоскости. Постройте вектор p = a + b, отложенный от точки M(−4; −3).',
    hint: 'Сложите векторы по координатам или включите «Правило треугольника». Тащите начало p — вектор переносится целиком. Тащите конец — меняется сам вектор.',
    stage: 'Начало p переносит вектор, конец p меняет его.',
    T: [-5, 5], H: [-3, 6],
    check: m => m.ok },
  { id: 'mid', title: 'Метод координат',
    text: ['Метод координат — способ решать геометрические задачи вычислениями. Точки заменяют парами чисел, а длины и середины считают по формулам. Линейка не нужна.',
           'Середина отрезка AB: x = (x₁ + x₂) : 2, y = (y₁ + y₂) : 2. Расстояние между точками — это теорема Пифагора на клетках: d = √((x₂ − x₁)² + (y₂ − y₁)²).',
           'Так доказывают, что треугольник равнобедренный или прямоугольный: считают длины сторон и сравнивают. Точка, равноудалённая от A и B, всегда лежит на серединном перпендикуляре к AB.'],
    why: 'Кадастровый инженер и геодезист в Казахстане описывают участок земли координатами углов и по ним считают длины границ и площадь — от этого зависят цена участка и налог. Навигатор и такси считают расстояние между двумя точками по тем же формулам. Робот-пылесос и складской робот строят маршрут на координатной сетке. Аналитик данных по формуле расстояния ищет похожих покупателей.',
    task: 'Даны A(−3; −1) и B(5; 3). Поставьте точку M в середину отрезка AB, а точку C — в узел сетки, где CA = CB = 5.',
    hint: 'Середина — среднее арифметическое координат концов. Расстояние: d = √(Δx² + Δy²). Точка C лежит на серединном перпендикуляре к AB — подойдёт любая из двух подходящих точек.',
    stage: 'Тащите точки M и C. Они встают в узлы сетки.',
    M: [-5, 5], C: [-5, -5],
    check: m => m.okM && m.okC },
  { id: 'circ', title: 'Уравнения окружности и прямой',
    text: ['Окружность — все точки, удалённые от центра (a; b) на R. Запишем это формулой расстояния — получим уравнение окружности: (x − a)² + (y − b)² = R². Точка лежит на окружности, если её координаты превращают уравнение в верное равенство.',
           'Любая прямая задаётся уравнением ax + by + c = 0. Если b ≠ 0, его переписывают как y = kx + m, где k — угловой коэффициент. Через две точки проходит ровно одна прямая.',
           'Прямая и окружность имеют две общие точки, одну или ни одной. Всё решает расстояние d от центра до прямой: d < R — две, d = R — одна (прямая — касательная), d > R — ни одной.'],
    why: 'Зона покрытия вышки сотовой связи — круг: инженер Kcell или Beeline по уравнению окружности проверяет, попадает ли село в зону. GPS-приёмник находит своё место как пересечение окружностей вокруг спутников. Оператор станка с ЧПУ задаёт дуги и прямые уравнениями, и станок режет деталь. В играх столкновение мяча со стеной — это проверка «расстояние до прямой меньше радиуса».',

    stage: 'Тащите центр, ручку радиуса и точки P, Q прямой.',

const KEY = 'luch-math-vect';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null, tri: false,
            T: [-5, 5], H: [-3, 6], M: [-5, 5], C: [-5, -5], c: [0, 0], R: 2, P: [-6, 5], Q: [-3, 6] };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

// line through two integer points: ax + by + c = 0, reduced, a > 0 (or a = 0, b > 0)
function lineOf(P, Q) {
  if (same(P, Q)) return null;
  let a = P[1] - Q[1], b = Q[0] - P[0], c = P[0] * Q[1] - Q[0] * P[1];
  const g = gcd(gcd(a, b), c) || 1; a /= g; b /= g; c /= g;
  if (a < 0 || (a === 0 && b < 0)) { a = -a; b = -b; c = -c; }
  return { a: a || 0, b: b || 0, c: c || 0 };
}
function lineEq(L) {
  const parts = [];
  const term = (k, v) => { if (!k) return; const m = Math.abs(k); parts.push([k < 0 ? '−' : '+', (m === 1 && v ? '' : m) + v]); };
  term(L.a, 'x'); term(L.b, 'y'); term(L.c, '');
  return parts.map(([s, t], i) => i === 0 ? (s === '−' ? '−' : '') + t : ` ${s} ${t}`).join('') + ' = 0';
}
const frac = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? num(n) : `${n < 0 ? '−' : ''}${Math.abs(n)}/${d}`; };
function slopeForm(L) {
  if (!L.b) return `x = ${frac(-L.c, L.a)}`;
  const kn = -L.a, mn = -L.c, d = L.b;
  let s = 'y = ';
  if (kn) { const k = frac(kn, d); s += (k === "1" ? "" : k === "−1" ? "−" : k.includes("/") ? k + "·" : k) + "x"; }
  if (mn || !kn) { const m = frac(mn, d); s += kn ? (m.startsWith('−') ? ` − ${m.slice(1)}` : ` + ${m}`) : m; }
  return s;
}
const eqx = (v, c) => c === 0 ? `${v}²` : `(${v} ${c > 0 ? '−' : '+'} ${Math.abs(c)})²`;
const circEq = (c, R) => `${eqx('x', c[0])} + ${eqx('y', c[1])} = ${R * R}`;

function model() {
  const id = LID();
  if (id === 'vec') {
    const v = [S.H[0] - S.T[0], S.H[1] - S.T[1]], sum = [VA[0] + VBv[0], VA[1] + VBv[1]];
    const okV = same(v, sum), okT = same(S.T, M0);
    return { kind: id, T: S.T.slice(), H: S.H.slice(), v, len2: v[0] ** 2 + v[1] ** 2, okV, okT, ok: okV && okT, tri: S.tri };
  }
  if (id === 'mid') {
    const ca = d2(S.C, PA), cb = d2(S.C, PB);
    return { kind: id, M: S.M.slice(), C: S.C.slice(), ca, cb, okM: same(S.M, [(PA[0] + PB[0]) / 2, (PA[1] + PB[1]) / 2]), okC: ca === 25 && cb === 25 };
  }
  const L = lineOf(S.P, S.Q);
  let n = null, N = 0, dd = null, onK = false;
  if (L) {
    N = L.a * S.c[0] + L.b * S.c[1] + L.c;
    const lhs = N * N, rhs = S.R * S.R * (L.a * L.a + L.b * L.b);
    n = lhs < rhs ? 2 : lhs === rhs ? 1 : 0;
    dd = Math.abs(N) / Math.hypot(L.a, L.b);
    onK = L.a * KP[0] + L.b * KP[1] + L.c === 0;
  }
  return { kind: id, c: S.c.slice(), R: S.R, P: S.P.slice(), Q: S.Q.slice(), L, N, n, d: dd, onK, okCirc: same(S.c, CEN) && S.R === RAD };
}

// ---------- geometry (SVG units, 520 × 405) ----------
const U = 20, OX = 260, OY = 205, G = 7;
const X = x => OX + x * U, Y = y => OY - y * U;
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const Ln = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const arrowHead = (x, y, dir) => dir === 'r' ? `<path d="M${x} ${y}l-8 -4.5v9z" fill="#a9b4c9"/>` : `<path d="M${x} ${y}l-4.5 8h9z" fill="#a9b4c9"/>`;
const tag = (x, y, txt, col) => { const w = txt.length * 6.7 + 12; return `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - 12).toFixed(1)}" width="${w.toFixed(1)}" height="18" rx="6" fill="${col}" stroke="${INK}" stroke-width="1.4"/>` + T(x, y + 1, 11, txt, '#0b1019', 'middle', 'font-weight="500"'); };
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <clipPath id="pl"><rect x="${X(-G)}" y="${Y(G)}" width="${2 * G * U}" height="${2 * G * U}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function planeSVG() {
  let h = `<rect x="${X(-G)}" y="${Y(G)}" width="${2 * G * U}" height="${2 * G * U}" fill="rgba(18,26,40,.55)"/>`;
  for (let v = -G; v <= G; v++) h += Ln(X(v), Y(G), X(v), Y(-G), 'rgba(160,185,230,.12)') + Ln(X(-G), Y(v), X(G), Y(v), 'rgba(160,185,230,.12)');
  h += Ln(X(-G - 0.4), Y(0), X(G + 0.5), Y(0), '#a9b4c9', 1.6) + arrowHead(X(G + 0.5) + 6, Y(0), 'r');
  h += Ln(X(0), Y(-G - 0.4), X(0), Y(G + 0.5), '#a9b4c9', 1.6) + arrowHead(X(0), Y(G + 0.5) - 6, 'u');
  for (let v = -G; v <= G; v++) {
    if (!v) continue;
    if (v % 2 === 0) h += T(X(v), Y(0) + 13, 8.5, num(v)) + T(X(0) - 5, Y(v) + 3, 8.5, num(v), MU, 'end');
  }
  h += T(X(0) - 5, Y(0) + 12, 9.5, 'O', FG, 'end') + T(X(G + 0.5) + 2, Y(0) - 8, 12, 'x', FG) + T(X(0) + 11, Y(G + 0.5) - 2, 12, 'y', FG);
  return h;
}
// vector arrow between grid points
function arrow(p, q, col, w = 3, dash = false) {
  const ax = X(p[0]), ay = Y(p[1]), bx = X(q[0]), by = Y(q[1]);
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.5), hw = hl * 0.45;
  const ex = bx - ux * hl, ey = by - uy * hl;
  const head = `<path d="M${bx.toFixed(1)} ${by.toFixed(1)}L${(ex - uy * hw).toFixed(1)} ${(ey + ux * hw).toFixed(1)}L${(ex + uy * hw).toFixed(1)} ${(ey - ux * hw).toFixed(1)}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  if (dash) return Ln(ax, ay, ex, ey, col, w - 0.6, 'stroke-dasharray="5 4" stroke-linecap="round"') + head;
  return Ln(ax, ay, ex, ey, INK, w + 2.6, 'stroke-linecap="round"') + Ln(ax, ay, ex, ey, col, w, 'stroke-linecap="round"') + head;
}
function vecLabel(p, q, txt, col, side = 1) {
  const ax = X(p[0]), ay = Y(p[1]), bx = X(q[0]), by = Y(q[1]), L = Math.hypot(bx - ax, by - ay) || 1;
  const nx = -(by - ay) / L * side, ny = (bx - ax) / L * side;
  return T((ax + bx) / 2 + nx * 13, (ay + by) / 2 + ny * 13 + 4, 13, txt, col, 'middle', 'font-weight="500" font-style="italic"');
}
const dot = (p, col, r = 5) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/>`;
const handle = (k, p, col, r = 7) => `<g data-drag="${k}"><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="17" fill="transparent"/><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r + 4}" fill="none" stroke="${col}" stroke-width="1" opacity=".55"/></g>`;
const lbl = (p, txt, col, dx = 9, dy = -9, anchor = 'start') => T(X(p[0]) + dx, Y(p[1]) + dy, 11.5, txt, col, anchor, 'font-weight="500"');

// ---------- lesson 1: vectors ----------
function vecSVG(m) {
  let h = planeSVG();
  h += dot(M0, FG, 4.5) + lbl(M0, 'M', FG, -8, 15, 'end');
  const aE = [A_T[0] + VA[0], A_T[1] + VA[1]], bE = [B_T[0] + VBv[0], B_T[1] + VBv[1]];
  h += arrow(A_T, aE, CA_) + vecLabel(A_T, aE, 'a', CA_, -1);
  h += arrow(B_T, bE, CB_) + vecLabel(B_T, bE, 'b', CB_, -1);
  if (m.tri) {
    const bS = aE, bF = [aE[0] + VBv[0], aE[1] + VBv[1]];
    h += arrow(bS, bF, CB_, 2.6, true) + vecLabel(bS, bF, 'b', CB_, -1);
    h += arrow(A_T, bF, FG, 2.6, true) + vecLabel(A_T, bF, 'a+b', FG, 1);
  }
  const col = m.ok ? GR : OR;
  h += arrow(m.T, m.H, col, 3.4) + vecLabel(m.T, m.H, 'p', col, 1);
  // coordinate steps of p (dashed legs)
  h += Ln(X(m.T[0]), Y(m.T[1]), X(m.H[0]), Y(m.T[1]), col, 1.1, 'stroke-dasharray="3 3" opacity=".7"') + Ln(X(m.H[0]), Y(m.T[1]), X(m.H[0]), Y(m.H[1]), col, 1.1, 'stroke-dasharray="3 3" opacity=".7"');
  h += handle('T', m.T, col, 6) + handle('H', m.H, FG, 5);
  h += T(OX, Y(-G) + 32, 12, `a(4; 1)  b(−1; 3)  p${pt(m.v[0], m.v[1])}  |p| = ${root(m.len2)}`, FG, 'middle', 'font-weight="500"');
  return h;
}
// ---------- lesson 2: midpoint and distance ----------
function midSVG(m) {
  let h = planeSVG();
  const cCol = m.okC ? GR : OR, mCol = m.okM ? GR : CA_;
  h += Ln(X(m.C[0]), Y(m.C[1]), X(PA[0]), Y(PA[1]), cCol, 1.6, 'stroke-dasharray="5 4"') + Ln(X(m.C[0]), Y(m.C[1]), X(PB[0]), Y(PB[1]), cCol, 1.6, 'stroke-dasharray="5 4"');
  const mid = (p, q) => [(X(p[0]) + X(q[0])) / 2, (Y(p[1]) + Y(q[1])) / 2];
  const [ax, ay] = mid(m.C, PA), [bx, by] = mid(m.C, PB);
  h += T(ax, ay - 6, 10.5, 'CA = ' + root(m.ca), cCol, 'middle', 'font-weight="500"') + T(bx, by - 6, 10.5, 'CB = ' + root(m.cb), cCol, 'middle', 'font-weight="500"');
  h += Ln(X(PA[0]), Y(PA[1]), X(PB[0]), Y(PB[1]), INK, 5) + Ln(X(PA[0]), Y(PA[1]), X(PB[0]), Y(PB[1]), CA_, 2.6);
  if (m.okM) {  // equal-halves ticks
    [[PA, m.M], [m.M, PB]].forEach(([p, q]) => { const [x, y] = mid(p, q); h += `<path d="M${x - 3} ${y - 6}L${x + 3} ${y + 6}" stroke="${GR}" stroke-width="2"/>`; });
  }
  h += dot(PA, CA_) + lbl(PA, 'A', CA_, -8, 16, 'end') + dot(PB, CA_) + lbl(PB, 'B', CA_, 8, -8);
  h += handle('M', m.M, mCol, 6) + lbl(m.M, 'M' + pt(m.M[0], m.M[1]), mCol, 10, 16);
  h += handle('C', m.C, cCol, 6) + lbl(m.C, 'C' + pt(m.C[0], m.C[1]), cCol, 10, -10);
  h += T(OX, Y(-G) + 32, 12, `нужно: M — середина AB, CA = CB = 5`, FG, 'middle', 'font-weight="500"');
  return h;
}
// ---------- lesson 3: circle and line ----------
const rHandle = () => S.c[0] + S.R <= G ? [S.c[0] + S.R, S.c[1]] : [S.c[0] - S.R, S.c[1]];
function circSVG(m) {
  let h = planeSVG();
  const cx = X(m.c[0]), cy = Y(m.c[1]), r = m.R * U, cCol = m.okCirc ? GR : CA_;
  h += `<g clip-path="url(#pl)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(114,212,232,.06)" stroke="${INK}" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cCol}" stroke-width="2.6"/>`;
  if (m.L) {
    const dx = m.Q[0] - m.P[0], dy = m.Q[1] - m.P[1], k = 40 / Math.hypot(dx, dy);
    const lCol = m.n === 1 && m.onK && m.okCirc ? GR : m.n === 1 ? FG : OR;
    h += Ln(X(m.P[0] - dx * k), Y(m.P[1] - dy * k), X(m.P[0] + dx * k), Y(m.P[1] + dy * k), lCol, 2.2);
    // common points: P + t·d on the circle
    const A2 = dx * dx + dy * dy, ex = m.P[0] - m.c[0], ey = m.P[1] - m.c[1], B2 = 2 * (dx * ex + dy * ey), C2 = ex * ex + ey * ey - m.R * m.R, disc = B2 * B2 - 4 * A2 * C2;
    if (disc >= 0) {
      const ts = disc === 0 ? [-B2 / (2 * A2)] : [(-B2 - Math.sqrt(disc)) / (2 * A2), (-B2 + Math.sqrt(disc)) / (2 * A2)];
      ts.forEach(t => { h += `<circle cx="${X(m.P[0] + t * dx).toFixed(1)}" cy="${Y(m.P[1] + t * dy).toFixed(1)}" r="5.5" fill="none" stroke="${disc === 0 ? GR : FG}" stroke-width="2.2"/>`; });
    }
  }
  h += `</g>`;
  const rh = rHandle();
  h += Ln(cx, cy, X(rh[0]), Y(rh[1]), cCol, 1.6, 'stroke-dasharray="4 3"') + T((cx + X(rh[0])) / 2, cy - 6, 10.5, 'R = ' + m.R, cCol, 'middle', 'font-weight="500"');
  h += dot(KP, '#ff8a73', 4.5) + lbl(KP, 'K', '#ff8a73', 8, -8);
  h += handle('c', m.c, cCol, 6) + handle('r', rh, cCol, 5);
  h += handle('P', m.P, OR, 6) + lbl(m.P, 'P', OR, -9, -9, 'end') + handle('Q', m.Q, OR, 6) + lbl(m.Q, 'Q', OR, 9, -9);
  h += T(OX, Y(-G) + 30, 11.5, 'окружность: ' + circEq(m.c, m.R), cCol, 'middle', 'font-weight="500"');
  h += T(OX, Y(-G) + 48, 11.5, 'прямая PQ: ' + (m.L ? lineEq(m.L) : 'P и Q совпали'), FG, 'middle', 'font-weight="500"');
  return h;
}

function bbox(pts, pad = 14) {
  const xs = pts.map(p => X(p[0])), ys = pts.map(p => Y(p[1]));
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return [x0, y0, Math.max(...xs) + pad - x0, Math.max(...ys) + pad - y0];
}
function hlBox(id) {
  const aE = [A_T[0] + VA[0], A_T[1] + VA[1]], bE = [B_T[0] + VBv[0], B_T[1] + VBv[1]];
  const B = {
    axes: [X(-G) - 6, Y(G) - 6, 2 * G * U + 12, 2 * G * U + 12],
    avec: bbox([A_T, aE]), bvec: bbox([B_T, bE]), pvec: bbox([S.T, S.H]), mpt: bbox([M0]),
    tri: bbox([A_T, aE, [aE[0] + VBv[0], aE[1] + VBv[1]]]),
    seg: bbox([PA, PB]), midp: bbox([S.M]), cpt: bbox([S.C]), dist: bbox([S.C, PA, PB]),
    circle: bbox([[S.c[0] - S.R, S.c[1] - S.R], [S.c[0] + S.R, S.c[1] + S.R]], 6), center: bbox([S.c]), radius: bbox([S.c, rHandle()]),
    line: bbox([S.P, S.Q]), kpt: bbox([KP]),
  };
  return B[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  h += id === 'vec' ? vecSVG(m) : id === 'mid' ? midSVG(m) : circSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VBOX = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 360, hh / 410, 1.7);
  VBOX = { w: w / s, h: hh / s }; VBOX.x = 260 - VBOX.w / 2; VBOX.y = 408 - VBOX.h;
  scene.setAttribute('viewBox', `${VBOX.x.toFixed(1)} ${VBOX.y.toFixed(1)} ${VBOX.w.toFixed(1)} ${VBOX.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- state changes ----------
const inG = v => clamp(Math.round(v), -G, G);
function moveT(g) {   // parallel transfer: the vector keeps its coordinates
  const v = [S.H[0] - S.T[0], S.H[1] - S.T[1]];
  const tx = clamp(g[0], -G - Math.min(0, v[0]), G - Math.max(0, v[0])), ty = clamp(g[1], -G - Math.min(0, v[1]), G - Math.max(0, v[1]));
  if (tx === S.T[0] && ty === S.T[1]) return;
  S.T = [tx, ty]; S.H = [tx + v[0], ty + v[1]]; update();
}
function setH(g) { g = [inG(g[0]), inG(g[1])]; if (same(g, S.T) || same(g, S.H)) return; S.H = g; update(); }
function setPt(k, g) {
  g = [inG(g[0]), inG(g[1])];
  if (same(g, S[k])) return;
  if ((k === 'P' && same(g, S.Q)) || (k === 'Q' && same(g, S.P))) return;
  S[k] = g; update();
}
function setR(r) { r = clamp(Math.round(r), 1, 6); if (r !== S.R) { S.R = r; update(); } }

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const c = scene.getScreenCTM(); return c ? p.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function handles() {
  const id = LID();
  if (id === 'vec') return [['H', S.H], ['T', S.T]];
  if (id === 'mid') return [['M', S.M], ['C', S.C]];
  return [['P', S.P], ['Q', S.Q], ['r', rHandle()], ['c', S.c]];
}
function applyDrag(k, p) {
  const g = [(p.x - OX) / U, (OY - p.y) / U];
  if (k === 'T') moveT([Math.round(g[0]), Math.round(g[1])]);
  else if (k === 'H') setH(g);
  else if (k === 'r') setR(Math.hypot(g[0] - S.c[0], g[1] - S.c[1]));
  else setPt(k, g);
}
scene.addEventListener('pointerdown', e => {
  const p = toSvg(e);
  let best = null, bd = 22;
  for (const [k, q] of handles()) { const d = Math.hypot(p.x - X(q[0]), p.y - Y(q[1])); if (d < bd) { bd = d; best = k; } }
  if (!best) return;
  e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const q = handles().find(h => h[0] === best)[1];
  drag = { k: best, dx: X(q[0]) - p.x, dy: Y(q[1]) - p.y };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSvg(e);
  applyDrag(drag.k, { x: p.x + drag.dx, y: p.y + drag.dy });
});
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

}

function ctlSpec() {

    ['sR', 'Радиус R', 1, 6, () => S.R, v => setR(v)],

    ['sPy', 'Точка P: y', -G, G, () => S.P[1], v => setPt('P', [S.P[0], v])],
    ['sQx', 'Точка Q: x', -G, G, () => S.Q[0], v => setPt('Q', [v, S.Q[1]])],

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  const title = { vec: 'Вектор p на плоскости', mid: 'Точки M и C', circ: 'Окружность и прямая' }[id];

  el.innerHTML = `<h2>${title}</h2><dl class="reads">${heads.map((t, i) => `<div><dt>${t}</dt><dd id="r${i + 1}"></dd></div>`).join('')}</dl>` +
    ctlSpec().map(([sid, label, mn, mx, get]) => `<div class="ctl"><label for="${sid}">${label} <output id="${sid}O"></output></label><input type="range" id="${sid}" min="${mn}" max="${mx}" step="1" value="${get()}"></div>`).join('') +
    `<p class="note" style="margin-top:12px">Ползунки делают то же, что перетаскивание точек на рабочем поле.</p>`;
  ctlSpec().forEach(([sid, , , , , set]) => el.querySelector('#' + sid).addEventListener('input', e => set(+e.target.value)));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;

  else if (m.kind === 'mid') { set('#r1', pt(m.M[0], m.M[1])); set('#r2', rootL(m.ca)); set('#r3', rootL(m.cb)); }
  else { set('#r1', pt(m.c[0], m.c[1])); set('#r2', m.R * m.R); set('#r3', m.n === null ? '—' : m.n); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +

      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }

function calcHTML(m) {
  if (m.kind === 'vec') {
    const [x, y] = m.v;
    let h = `<h2>Координаты и длина вектора</h2><div class="formula">p = (x₂ − x₁; y₂ − y₁)</div><h3>Ваш вектор p</h3><div class="steps">` +
      step('начало', pt(m.T[0], m.T[1])) + step('конец', pt(m.H[0], m.H[1])) +
      step('x = x₂ − x₁', `${num(m.H[0])} − ${pn(m.T[0])} = ${num(x)}`) + step('y = y₂ − y₁', `${num(m.H[1])} − ${pn(m.T[1])} = ${num(y)}`) +
      step('|p| = √(x² + y²)', `√(${pn(x)}² + ${pn(y)}²) = ${rootL(m.len2)}`, 'sum') + `</div>`;
    h += `<h3>Сумма по координатам</h3><div class="steps">` +
      step('a + b', `(4 + (−1); 1 + 3)`) + step('нужно', `p = a + b, начало в M(−4; −3)`) +
      step('координаты p', m.okV ? 'совпадают с a + b ✓' : 'пока не совпадают с a + b') + step('начало p', m.okT ? 'в точке M ✓' : `${pt(m.T[0], m.T[1])} — не M`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Конец вектора = начало + координаты: (x₁ + x; y₁ + y). Так из точки M находят, где закончится p.</p>`;
  }
  if (m.kind === 'mid') {
    const dA = [PA[0] - m.C[0], PA[1] - m.C[1]], dB = [PB[0] - m.C[0], PB[1] - m.C[1]];
    let h = `<h2>Середина и расстояние</h2><div class="formula">d = √((x₂ − x₁)² + (y₂ − y₁)²)</div><h3>Середина AB</h3><div class="steps">` +
      step('x = (x₁ + x₂) : 2', `(${num(PA[0])} + ${num(PB[0])}) : 2`) + step('y = (y₁ + y₂) : 2', `(${num(PA[1])} + ${num(PB[1])}) : 2`) +
      step('ваша M', `${pt(m.M[0], m.M[1])} ${m.okM ? '✓' : '✗'}`, 'sum') + `</div>`;
    h += `<h3>Расстояния от C${pt(m.C[0], m.C[1])}</h3><div class="steps">` +
      step('CA²', `${pn(dA[0])}² + ${pn(dA[1])}² = ${m.ca}`) + step('CA', rootL(m.ca)) +
      step('CB²', `${pn(dB[0])}² + ${pn(dB[1])}² = ${m.cb}`) + step('CB', rootL(m.cb)) +
      step('нужно', `CA² = CB² = 25 ${m.okC ? '✓' : ''}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Сравнивать удобно квадраты расстояний: корни можно не извлекать.</p>`;
  }
  let h = `<h2>Окружность и прямая</h2><div class="formula">(x − a)² + (y − b)² = R²</div><h3>Окружность</h3><div class="steps">` +
    step('центр (a; b)', pt(m.c[0], m.c[1])) + step('R² ', `${m.R}² = ${m.R * m.R}`) + step('уравнение', circEq(m.c, m.R), 'sum') + `</div>`;
  if (!m.L) return h + `<p class="note">Точки P и Q совпали — прямая не задана.</p>`;
  const L = m.L, s2 = L.a * L.a + L.b * L.b;
  h += `<h3>Прямая через P${pt(m.P[0], m.P[1])} и Q${pt(m.Q[0], m.Q[1])}</h3><div class="steps">` +
    step('направление Q − P', pt(m.Q[0] - m.P[0], m.Q[1] - m.P[1])) + step('уравнение', lineEq(L)) + step('через k', slopeForm(L)) +
    step('K(5; 0) на прямой?', `${L.a}·5 + ${pn(L.b)}·0 + ${pn(L.c)} = ${num(L.a * 5 + L.c)} → ${m.onK ? 'да' : 'нет'}`) + `</div>`;
  h += `<h3>Сколько общих точек</h3><div class="steps">` +
    step('d = |a·x₀ + b·y₀ + c| : √(a² + b²)', `|${num(m.N)}| : √${s2} ≈ ${fmt(m.d, 2)}`) +
    step('сравнить d и R', `${fmt(m.d, 2)} ${m.n === 2 ? '<' : m.n === 1 ? '=' : '>'} ${m.R}`) +
    step('вывод', m.n === 2 ? '2 точки — секущая' : m.n === 1 ? '1 точка — касательная' : 'общих точек нет', 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Без дробей: сравнивают (a·x₀ + b·y₀ + c)² = ${m.N * m.N} и R²·(a² + b²) = ${m.R * m.R * s2}.</p>`;
}

function renderMeter(m) {

  else el.innerHTML = `<div class="k">Общих точек</div><div class="v ${ok ? 'ok' : ''}">${m.n === null ? '—' : m.n}</div><div class="lr"><span>R</span><span>${m.R}</span></div><div class="lr"><span>d до прямой</span><span>${m.d === null ? '—' : fmt(m.d, 2)}</span></div>`;

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Векторы и координаты покорены!'), 700);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  vec: '<path d="M8 25L36 18" stroke="#72d4e8" stroke-width="1.6"/><path d="M36 18L31 5" stroke="#b79cff" stroke-width="1.6"/><path d="M8 25L31 5" stroke="#ffb547" stroke-width="1.6" stroke-dasharray="3 2"/><circle cx="31" cy="5" r="2" fill="#ffb547"/>',
  mid: '<path d="M10 24L56 6" stroke="#72d4e8" stroke-width="1.6"/><circle cx="33" cy="15" r="2.6" fill="#86e0a8"/><path d="M27 4L10 24M27 4L56 6" stroke="#ffb547" stroke-width="1" stroke-dasharray="2 2"/><circle cx="27" cy="4" r="2.2" fill="#ffb547"/>',
  circ: '<circle cx="28" cy="16" r="10" fill="none" stroke="#72d4e8" stroke-width="1.6"/><path d="M38 1V29" stroke="#e8ecf4" stroke-width="1.2"/><circle cx="38" cy="16" r="2.2" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.tri = false;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'vec') now = `Координатная плоскость −7…7. Закреплены вектор a(4; 1) (от точки (2; −6)) и вектор b(−1; 3) (от точки (5; 1)), отмечена точка M(−4; −3). Вектор ученика p: начало ${pt(m.T[0], m.T[1])}, конец ${pt(m.H[0], m.H[1])}, координаты ${pt(m.v[0], m.v[1])}, длина ${rootL(m.len2)}. Правило треугольника на экране: ${m.tri ? 'включено' : 'выключено'}. Координаты p ${m.okV ? 'совпадают' : 'не совпадают'} с a + b; начало p ${m.okT ? 'в точке M' : 'не в точке M'}.`;
  if (id === 'mid') now = `Координатная плоскость −7…7. Закреплены A(−3; −1) и B(5; 3). Ученик поставил M${pt(m.M[0], m.M[1])} (${m.okM ? 'это середина AB' : 'пока не середина AB'}) и C${pt(m.C[0], m.C[1])}: CA = ${rootL(m.ca)}, CB = ${rootL(m.cb)} (нужно CA = CB = 5).`;
  if (id === 'circ') now = `Координатная плоскость −7…7, отмечена точка K(5; 0). Окружность ученика: центр ${pt(m.c[0], m.c[1])}, R = ${m.R}, уравнение ${circEq(m.c, m.R)} (нужна (x − 1)² + (y + 2)² = 16 — ${m.okCirc ? 'построена верно' : 'пока не совпадает'}). Прямая через P${pt(m.P[0], m.P[1])} и Q${pt(m.Q[0], m.Q[1])}: ${m.L ? `${lineEq(m.L)}, ${slopeForm(m.L)}; расстояние от центра ≈ ${fmt(m.d, 2)}; общих точек с окружностью: ${m.n}; через K ${m.onK ? 'проходит' : 'не проходит'}` : 'не задана (P и Q совпали)'}.`;
  return [
    `Раздел: математика, 9 класс, геометрия, тема «Векторы и координаты». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (нужные координаты точек, вектора или уравнение касательной): веди ученика наводящими вопросами и проверяй его вычисления.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    vec: 'Почему при переносе вектор не меняется?', mid: 'Как формула расстояния связана с теоремой Пифагора?',
    circ: 'Как по уравнению окружности найти центр и радиус?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
