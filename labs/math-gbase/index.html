<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 7 класс: точки, прямые и отрезки, смежные и вертикальные углы, параллельные прямые и секущая, как строить доказательство.">
<title>Начала геометрии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="p"],.scene [data-drag="rot"],.scene [data-drag="lb"],.scene [data-drag="sec"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 14H34M6 28H34" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><path d="M13 34L27 6" stroke="var(--force)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="28" r="2" fill="var(--fg)"/><circle cx="23" cy="14" r="2" fill="var(--fg)"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Математика · Начала геометрии</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж. Точки, прямые и карточки можно двигать и нажимать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-math-gbase';
const fmt = v => String(Math.round(v * 100) / 100).replace('.', ',');
const RAD = Math.PI / 180;

const LESSONS = [
  { id: 'seg', title: 'Точки, прямые, отрезки',
    text: ['Точка, прямая и плоскость — основные фигуры геометрии. Их не определяют, а описывают свойствами. Главное свойство: через любые две точки проходит прямая, и притом только одна.',
           'Прямая бесконечна в обе стороны. Луч — часть прямой с началом в одной точке: луч AB идёт от A через B и дальше. Отрезок AB — часть прямой между точками A и B вместе с ними.',
           'Если точка C лежит на отрезке AB, то AC + CB = AB. Длину отрезка измеряют линейкой. Точка, которая делит отрезок пополам, — его середина.'],
    why: 'Каменщик натягивает шнур между двумя колышками — это прямая через две точки, по ней ровно ложится кладка. Геодезист отмечает на участке точки и отрезки, а строители ставят по ним фундамент. Столяр и швея размечают отрезки: «отступить 3 см, разделить пополам». А навигатор в 2ГИС складывает длины отрезков пути, когда считает, сколько ехать.',
    task: 'Сделайте отрезок AB длиной 9 см. Поставьте точку C между A и B так, чтобы AC было вдвое длиннее CB.',
    hint: 'AC + CB = AB. Если CB — одна часть, то AC — две части, а весь отрезок AB — три части.',
    stage: 'Тащите точки A, B и C вдоль прямой. Режим вверху: отрезок, луч или прямая.',
    A: 1, B: 5, C: 8,
    check: m => m.ab === 9 && m.between && m.ac === 2 * m.cb },
  { id: 'adj', title: 'Смежные и вертикальные углы',
    text: ['Две прямые пересекаются в точке O и дают четыре угла. Два угла смежные, если одна сторона у них общая, а две другие продолжают друг друга — вместе образуют прямую. Сумма смежных углов равна 180°.',
           'Два угла вертикальные, если стороны одного продолжают стороны другого за вершину. Вертикальные углы равны.',
           'Поэтому достаточно знать один угол из четырёх: соседний с ним равен 180° минус он, а противоположный — ему самому.'],
    why: 'Ножницы и плоскогубцы — это две пересекающиеся прямые: насколько раскрыты ручки, настолько и лезвия, ведь это вертикальные углы. Проектировщик дорог рассчитывает углы на перекрёстке, а плиточник по одному углу понимает три остальных, когда режет плитку под косой стык. Механик видит те же углы в шарнирах и рычагах.',
    task: 'Поверните прямую CD так, чтобы один из смежных углов был ровно в 4 раза больше другого.',
    hint: 'Смежные углы вместе — 180°. Пусть меньший угол x, тогда больший 4x. Составьте уравнение x + 4x = 180.',
    stage: 'Тащите оранжевую ручку D или C — прямая CD поворачивается вокруг O.',
    a: 60,
    check: m => m.a1 === 36 || m.a1 === 144 },
  { id: 'par', title: 'Параллельные прямые',
    text: ['Две прямые на плоскости параллельны, если они не пересекаются, сколько их ни продолжай. Пишут a ∥ b. Через точку вне прямой можно провести только одну прямую, параллельную данной, — это аксиома параллельных.',
           'Прямую, которая пересекает две другие, называют секущей. Она образует 8 углов. Между прямыми лежат внутренние углы: пары накрест лежащих (по разные стороны секущей) и односторонних (по одну сторону). Ещё есть соответственные углы — они расположены одинаково.',
           'Признаки параллельности: прямые параллельны, если накрест лежащие углы равны, или соответственные углы равны, или сумма односторонних углов равна 180°.'],
    why: 'Рельсы «Қазақстан темір жолы» — параллельные прямые: если зазор поплывёт, поезд сойдёт с пути. Дорожники размечают парковку параллельными линиями под одним углом к бордюру — это секущая и соответственные углы. Строители проверяют, что стены и балки параллельны, а чертёжник и архитектор строят параллели угольником, сдвигая его вдоль линейки.',
    task: 'Добейтесь, чтобы a ∥ b: сделайте накрест лежащие углы ∠3 и ∠5 равными. Потом поверните секущую и проверьте, что прямые остались параллельными.',
    hint: 'Поворачивайте прямую b, пока ∠5 не сравняется с ∠3. Затем двигайте ручку секущей c: углы меняются, но остаются ли они равными?',
    stage: 'Тащите ручку прямой b и ручку секущей c.',
    b: 10, g: 65,

  { id: 'proof', title: 'Как доказывать',
    text: ['Теорема — утверждение, которое доказывают. Её удобно записать как «если …, то …»: часть после «если» — условие (Дано), после «то» — заключение (Доказать).',
           'Доказательство — цепочка шагов. Каждый шаг опирается на определение, аксиому или уже доказанную теорему. Рисунок помогает думать, но «видно на рисунке» и «я измерил» — не доказательство: рисунок бывает неточным, а теорема верна для всех случаев.',
           'Чтобы опровергнуть утверждение, хватит одного контрпримера. Если поменять условие и заключение местами, получится обратная теорема — она бывает и неверной.'],
    why: 'Юрист строит позицию так же: каждый довод опирается на статью закона, а не на «мне кажется». Программист доказывает, что алгоритм не ошибётся ни на каких данных, — так проверяют банковский и авиационный софт. Аудитор и врач идут от фактов к выводу шаг за шагом. А в споре вы научитесь отличать довод от догадки.',
    task: 'Соберите доказательство теоремы «Вертикальные углы равны»: выбирайте шаги по порядку. Не все карточки годятся.',

const CARDS = [
  { id: 'c3', f: '∠1 + ∠2 = ∠3 + ∠2', r: 'обе суммы равны 180°', needs: ['c1', 'c2'] },
  { id: 'x1', f: '∠1 = ∠3', r: 'это видно на рисунке', bad: 'На глаз нельзя: рисунок бывает неточным. Каждый шаг должен опираться на свойство.' },
  { id: 'c1', f: '∠1 + ∠2 = 180°', r: '∠1 и ∠2 смежные', needs: [] },
  { id: 'c4', f: '∠1 = ∠3', r: 'вычли ∠2 из обеих частей', needs: ['c3'] },
  { id: 'x2', f: '∠1 = ∠3', r: 'я измерил транспортиром', bad: 'Измерение проверяет только этот рисунок. А теорема должна быть верна для любых пересекающихся прямых.' },
  { id: 'c2', f: '∠3 + ∠2 = 180°', r: '∠3 и ∠2 смежные', needs: [] },
];
const NEED_MSG = { c3: 'Откуда известно, что обе суммы равны 180°? Сначала запишите оба этих факта.', c4: 'Чтобы вычитать, нужно равенство, из которого вычитать. Его ещё нет.' };

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            A: 1, B: 5, C: 8, mode: 'seg',
            a: 60, pair: 'adj',
            pb: 10, pg: 65, parG: new Set(), ppair: 'cross',
            d: 55, proof: [] };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const PT = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * RAD), y: c.y - r * Math.sin(deg * RAD) });
const degOf = (c, p) => Math.atan2(c.y - p.y, p.x - c.x) / RAD;

// ---------- lesson 1: points on a line ----------
const RX0 = 50, RU = 35, RY = 140;
const X1 = v => RX0 + v * RU;
function setPt(k, v) { v = clamp(Math.round(v * 2) / 2, 0, 12); if (S[k] !== v) { S[k] = v; update(); } }

// ---------- lesson 2: two crossing lines ----------
const O2 = { x: 260, y: 160 }, R2 = 150;
function setA(v) { v = clamp(Math.round(v), 1, 179); if (v !== S.a) { S.a = v; update(); } }
function lineAng(c, p) { let t = degOf(c, p); if (t < 0) t += 180; if (t >= 180) t -= 180; return t; }

// ---------- lesson 3: parallel lines and a transversal ----------
const Q3 = { x: 260, y: 90 }, YB = 210;
const P3 = () => ({ x: Q3.x - (YB - Q3.y) / Math.tan(S.pg * RAD), y: YB });
function setPar(b, g) {
  b = clamp(Math.round(b), -15, 15); g = clamp(Math.round(g), 50, 130);
  if (b === S.pb && g === S.pg) return;
  S.pb = b; S.pg = g;
  if (b === 0) S.parG.add(g);
  update();
}
const PAIRS = { cross: { name: 'накрест лежащие', a: 3, b: 5 }, corr: { name: 'соответственные', a: 1, b: 5 }, side: { name: 'односторонние', a: 4, b: 5 } };

// ---------- lesson 4: proof ----------
const O4 = { x: 92, y: 84 };
function setD(v) { v = clamp(Math.round(v), 20, 160); if (v !== S.d) { S.d = v; update(); } }
function pick(id) {
  if (LID() !== 'proof' || S.proof.includes(id)) return;
  const c = CARDS.find(x => x.id === id); if (!c) return;
  if (c.bad) { toast(c.bad); return; }
  if (!c.needs.every(n => S.proof.includes(n))) { toast(NEED_MSG[id]); return; }
  S.proof.push(id);
  if (S.proof.length < 4) toast(id === 'c1' || id === 'c2' ? 'Верно: сумма смежных углов — 180°.' : 'Верно: если правые части равны, равны и левые.');
  update();
}

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'seg') {
    const { A, B, C } = S, lo = Math.min(A, B), hi = Math.max(A, B);
    return { kind: 'seg', A, B, C, ab: Math.abs(B - A), ac: Math.abs(C - A), cb: Math.abs(B - C), between: C > lo && C < hi, mode: S.mode, same: A === B };
  }
  if (id === 'adj') return { kind: 'adj', a1: S.a, a2: 180 - S.a, a3: S.a, a4: 180 - S.a, pair: S.pair };
  if (id === 'par') {
    const g = S.pg, b = S.pb;
    const ang = [null, g, 180 - g, g, 180 - g, g - b, 180 - g + b, g - b, 180 - g + b];
    return { kind: 'par', g, b, ang, par: b === 0, cnt: S.parG.size, pair: S.ppair };
  }
  return { kind: 'proof', placed: S.proof.slice(), n: S.proof.length, d: S.d };
}

// ---------- drawing ----------
const DIM = { seg: [520, 230], adj: [520, 320], par: [520, 320], proof: [380, 510] };
const scene = $('#scene');
const f1 = v => v.toFixed(1);
const txt = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" ${extra}>${s}</text>`;
const cap = (x, y, s) => `<text x="${x}" y="${y}" font-size="11" fill="#8b96ad" text-anchor="middle" font-family="Golos Text,sans-serif" letter-spacing=".5">${s}</text>`;
const line = (p, q, st, w, extra = '') => `<path d="M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
const sector = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(c.x)} ${f1(c.y)}L${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}Z`; };
const knob = (id, p, col, part) => `<g data-drag="${id}" data-part="${part}"><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="22" fill="transparent"/><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="9" fill="${col}" stroke="${INK}" stroke-width="2"/></g>`;
const PCOL = { A: '#e8ecf4', B: '#e8ecf4', C: '#ffb547' };

function drawSeg() {
  const m = model(), xa = X1(m.A), xb = X1(m.B), xc = X1(m.C);
  let h = `<g data-part="line" pointer-events="none">${line({ x: 4, y: RY }, { x: 516, y: RY }, '#3a4762', 1.4, 'stroke-dasharray="5 5"')}</g>`;
  // ruler
  let tk = '';
  for (let i = 0; i <= 120; i++) { const x = RX0 + i * RU / 10, len = i % 10 ? (i % 5 ? 4 : 8) : 13; tk += `M${f1(x)} ${RY + 14}V${RY + 14 + len}`; }
  h += `<g data-part="ruler" pointer-events="none"><rect x="${RX0 - 14}" y="${RY + 14}" width="${12 * RU + 28}" height="42" rx="4" fill="#1b2840" stroke="#3c6f80"/><path d="${tk}" stroke="#72d4e8" stroke-width="1"/>`;
  for (let i = 0; i <= 12; i++) h += txt(X1(i), RY + 50, i, 10.5, '#72d4e8');
  h += `<text x="${X1(12) + 10}" y="${RY + 50}" font-size="9" fill="#5d7f96">см</text></g>`;
  // the figure in the chosen mode
  if (!m.same) {
    let p = { x: xa, y: RY }, q = { x: xb, y: RY };
    if (m.mode === 'ray') q = { x: xb > xa ? 516 : 4, y: RY };
    if (m.mode === 'line') { p = { x: 4, y: RY }; q = { x: 516, y: RY }; }
    h += `<g data-part="shape" pointer-events="none">${line(p, q, '#ffb547', 3.2, 'stroke-linecap="round"')}`;
    if (m.mode !== 'seg') { const dir = q.x > p.x ? 1 : -1; h += `<path d="M${f1(q.x)} ${RY}l${-dir * 10} -6v12z" fill="#ffb547"/>`; if (m.mode === 'line') h += `<path d="M${f1(p.x)} ${RY}l${dir * 10} -6v12z" fill="#ffb547"/>`; }
    h += '</g>';
  } else h += txt(260, RY + 84, 'A и B совпали: через одну точку проходит сколько угодно прямых', 11, '#ff8a73', 'pointer-events="none"');
  // dimensions
  const dim = (v0, v1, y, label, col) => {
    if (v0 === v1) return '';
    const x0 = X1(Math.min(v0, v1)), x1 = X1(Math.max(v0, v1));
    return `<path d="M${f1(x0)} ${y}H${f1(x1)}M${f1(x0)} ${y - 5}V${y + 5}M${f1(x1)} ${y - 5}V${y + 5}" stroke="${col}" stroke-width="1.4"/>` + txt((x0 + x1) / 2, y - 6, label, 12, col, 'font-weight="500"');
  };
  h += '<g data-part="dims" pointer-events="none">';
  h += dim(m.A, m.B, RY - 76, `AB = ${fmt(m.ab)} см`, '#ffb547');
  h += dim(m.A, m.C, RY - 38, `AC = ${fmt(m.ac)}`, '#72d4e8');
  h += dim(m.C, m.B, m.between ? RY - 38 : RY - 112, `CB = ${fmt(m.cb)}`, '#86e0a8');
  h += '</g>';
  // points (C last, so it stays on top)
  for (const k of ['A', 'B', 'C']) {
    const x = X1(S[k]);
    h += `<g data-part="points" pointer-events="none">${txt(x, RY - 14, k, 15, PCOL[k], 'font-weight="600"')}</g>`;
    h += `<g data-drag="p${k}" data-part="points"><circle cx="${f1(x)}" cy="${RY}" r="22" fill="transparent"/><circle cx="${f1(x)}" cy="${RY}" r="${k === 'C' ? 7 : 6}" fill="${PCOL[k]}" stroke="${INK}" stroke-width="2"/></g>`;
  }
  return h;
}

function drawAdj() {
  const m = model(), a = m.a1, O = O2;
  const A = PT(O, R2, 180), B = PT(O, R2, 0), D = PT(O, R2, a), C = PT(O, R2, a + 180);
  const hiA = S.pair === 'adj', hiV = S.pair === 'vert';
  const op = n => (S.pair === null || (hiA && (n === 1 || n === 2)) || (hiV && (n === 1 || n === 3))) ? 1 : 0.28;
  const COL = ['', '#ffb547', '#72d4e8', '#ffb547', '#72d4e8'];
  const rng = [null, [0, a], [a, 180], [180, 180 + a], [180 + a, 360]];
  const val = [null, a, 180 - a, a, 180 - a];
  let h = '';
  for (let n = 1; n <= 4; n++) {
    const r = n % 2 ? 36 : 44, [a0, a1] = rng[n], mid = (a0 + a1) / 2, span = a1 - a0;
    const parts = 'ang' + n + (n <= 2 ? ' adjp' : '') + (n === 1 || n === 3 ? ' vertp' : '');
    const lp = PT(O, span < 26 ? 112 : 92, mid);
    h += `<g data-part="${parts}" opacity="${op(n)}" pointer-events="none"><path d="${sector(O, r, a0, a1)}" fill="${COL[n]}" fill-opacity=".16" stroke="${COL[n]}" stroke-width="1.6"/>` +
         txt(lp.x, lp.y + 5, `∠${n} = ${val[n]}°`, 12.5, COL[n], 'font-weight="500"') + '</g>';
  }
  h += `<g data-part="lines" pointer-events="none">${line(A, B, '#e8ecf4', 2.4, 'stroke-linecap="round"')}</g>`;
  h += `<g data-drag="rot" data-part="lines">${line(C, D, 'transparent', 22)}${line(C, D, '#ffb547', 2.4, 'stroke-linecap="round"')}</g>`;
  const lab = (p, s, deg, col) => { const q = PT(p, 18, deg); return txt(q.x, q.y + 5, s, 14, col, 'font-weight="600" pointer-events="none"'); };
  h += lab(A, 'A', 180, '#e8ecf4') + lab(B, 'B', 0, '#e8ecf4') + lab(D, 'D', a, '#ffb547') + lab(C, 'C', a + 180, '#ffb547');
  h += `<g data-part="vertex" pointer-events="none"><circle cx="${O.x}" cy="${O.y}" r="4.5" fill="#e8ecf4" stroke="${INK}" stroke-width="1.5"/>${txt(O.x - 12, O.y + 20, 'O', 13, '#e8ecf4', 'font-weight="600"')}</g>`;
  h += knob('rot', D, '#ffb547', 'knob') + knob('rot', C, '#ffb547', 'knob');

}

function drawPar() {
  const m = model(), g = m.g, b = m.b, Q = Q3, P = P3();
  const ua = { x: Math.cos(g * RAD), y: -Math.sin(g * RAD) }, ub = { x: Math.cos(b * RAD), y: -Math.sin(b * RAD) };
  const pr = PAIRS[m.pair];
  let h = cap(260, 310, m.par ? 'a ∥ b — ПРЯМЫЕ НЕ ПЕРЕСЕКАЮТСЯ' : 'a И b НЕ ПАРАЛЛЕЛЬНЫ — ГДЕ-ТО ОНИ ПЕРЕСЕКУТСЯ');
  const b0 = { x: 10, y: P.y + (10 - P.x) * ub.y / ub.x }, b1 = { x: 510, y: P.y + (510 - P.x) * ub.y / ub.x };
  h += `<g data-part="inner" pointer-events="none"><path d="M10 ${Q.y}H510L${f1(b1.x)} ${f1(b1.y)}L${f1(b0.x)} ${f1(b0.y)}Z" fill="rgba(114,212,232,.05)"/></g>`;
  // angle sectors of the chosen pair
  const rngA = [null, [0, g], [g, 180], [180, 180 + g], [180 + g, 360]];
  const rngB = [null, null, null, null, null, [b, g], [g, 180 + b], [180 + b, 180 + g], [180 + g, 360 + b]];
  const sec = n => { const c = n <= 4 ? Q : P, [a0, a1] = n <= 4 ? rngA[n] : rngB[n], col = n === pr.a ? '#ffb547' : '#c39bff', lp = PT(c, 54, (a0 + a1) / 2);
    return `<g data-part="pair" pointer-events="none"><path d="${sector(c, 30, a0, a1)}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="1.6"/>${txt(lp.x, lp.y + 5, m.ang[n] + '°', 12.5, col, 'font-weight="500"')}</g>`; };
  h += sec(pr.a) + sec(pr.b);
  // lines
  h += `<g data-part="la" pointer-events="none">${line({ x: 10, y: Q.y }, { x: 510, y: Q.y }, '#e8ecf4', 2.2)}${txt(498, Q.y - 8, 'a', 14, '#e8ecf4', 'font-weight="600"')}</g>`;
  h += `<g data-drag="lb" data-part="lb">${line(b0, b1, 'transparent', 20)}${line(b0, b1, m.par ? '#86e0a8' : '#72d4e8', 2.2)}</g>`;
  h += txt(498, b1.y - 9, 'b', 14, m.par ? '#86e0a8' : '#72d4e8', 'font-weight="600" pointer-events="none"');
  const s0 = { x: Q.x + 78 * ua.x, y: Q.y + 78 * ua.y }, s1 = { x: P.x - 70 * ua.x, y: P.y - 70 * ua.y };
  h += `<g data-drag="sec" data-part="sec">${line(s0, s1, 'transparent', 20)}${line(s0, s1, '#ffb547', 2.2)}</g>`;
  h += txt(s1.x + 14, s1.y + 4, 'c', 14, '#ffb547', 'font-weight="600" pointer-events="none"');
  // angle numbers
  h += '<g pointer-events="none">';
  for (let n = 1; n <= 8; n++) {
    const c = n <= 4 ? Q : P, [a0, a1] = n <= 4 ? rngA[n] : rngB[n], lp = PT(c, 19, (a0 + a1) / 2);
    h += txt(lp.x, lp.y + 4, n, 12, n === pr.a || n === pr.b ? '#e8ecf4' : '#6b7690');
  }
  h += `<circle cx="${Q.x}" cy="${Q.y}" r="3" fill="#e8ecf4"/><circle cx="${f1(P.x)}" cy="${P.y}" r="3" fill="#e8ecf4"/></g>`;
  // where do they meet?
  if (!m.par) {
    const right = b > 0, y = (Q.y + YB) / 2, x = right ? 500 : 20;
    h += `<g data-part="meet" pointer-events="none">${txt(x + (right ? -40 : 40), y + 4, right ? 'сойдутся →' : '← сойдутся', 11.5, '#ff8a73')}</g>`;
  }
  h += knob('lb', { x: P.x + 120 * ub.x, y: P.y + 120 * ub.y }, '#72d4e8', 'lb knob') + knob('sec', s0, '#ffb547', 'sec knob');
  return h;
}

const wrap = (x, y, lines, fs, fill, gap, extra = '') => lines.map((s, i) => `<text x="${x}" y="${y + i * gap}" font-size="${fs}" fill="${fill}" font-family="Golos Text,sans-serif" ${extra}>${s}</text>`).join('');
function drawProof() {
  const m = model(), d = m.d, O = O4, R = 78;
  let h = '<g data-part="fig">';
  const A = PT(O, R, 180), B = PT(O, R, 0), D = PT(O, R, d), C = PT(O, R, d + 180);

  h += line(A, B, '#e8ecf4', 2, 'pointer-events="none"');
  h += `<g data-drag="rot">${line(C, D, 'transparent', 20)}${line(C, D, '#ffb547', 2)}</g>`;
  const lab = (p, s, deg) => { const q = PT(p, 11, deg); return txt(q.x, q.y + 4, s, 11.5, '#8b96ad', 'pointer-events="none"'); };
  h += lab(A, 'A', 180) + lab(B, 'B', 0) + lab(D, 'D', d) + lab(C, 'C', d + 180) + `<circle cx="${O.x}" cy="${O.y}" r="3" fill="#e8ecf4" pointer-events="none"/>`;
  h += txt(O.x, 182, `на рисунке: ∠1 = ${d}°, ∠3 = ${d}°`, 10.5, '#6b7690', 'pointer-events="none"') + knob('rot', D, '#ffb547', 'fig') + '</g>';
  h += `<g data-part="given" pointer-events="none">${wrap(196, 30, ['ДАНО'], 10, '#8b96ad', 14, 'letter-spacing="1"')}${wrap(196, 48, ['Прямые AB и CD', 'пересекаются в точке O.', '∠1 и ∠3 — вертикальные.'], 12, '#e8ecf4', 16)}</g>`;
  h += `<g data-part="goal" pointer-events="none">${wrap(196, 116, ['ДОКАЗАТЬ'], 10, '#8b96ad', 14, 'letter-spacing="1"')}${wrap(196, 136, ['∠1 = ∠3'], 14, '#ffb547', 16, 'font-weight="600"')}</g>`;
  // the chain
  let y = 204;
  const card = (c, x, yy, kind, num) => {
    const st = kind === 'placed' ? '#86e0a8' : '#26324a', bg = kind === 'placed' ? 'rgba(134,224,168,.08)' : '#141d2d';
    return `<rect x="${x}" y="${yy}" width="360" height="34" rx="8" fill="${bg}" stroke="${st}" stroke-width="1.3"/>` +
      (num ? `<text x="${x + 14}" y="${yy + 22}" font-size="13" fill="#86e0a8" font-weight="600">${num}.</text>` : '') +
      `<text x="${x + 36}" y="${yy + 15}" font-size="13" fill="#e8ecf4" font-weight="500">${c.f}</text>` +
      `<text x="${x + 36}" y="${yy + 28}" font-size="10.5" fill="#8b96ad" font-family="Golos Text,sans-serif">${kind === 'placed' ? 'потому что ' : ''}${c.r}</text>`;
  };
  h += `<g data-part="chain" pointer-events="none">${wrap(10, y, ['ДОКАЗАТЕЛЬСТВО'], 10, '#8b96ad', 14, 'letter-spacing="1"')}`;
  y += 10;
  if (!m.n) { h += `<rect x="10" y="${y}" width="360" height="34" rx="8" fill="none" stroke="#26324a" stroke-dasharray="4 4"/>` + txt(190, y + 21, 'пока пусто — выберите первый шаг', 11.5, '#6b7690'); y += 38; }
  m.placed.forEach((id, i) => { h += card(CARDS.find(c => c.id === id), 10, y, 'placed', i + 1); y += 38; });
  if (m.n === 4) { h += txt(190, y + 12, 'Что и требовалось доказать ∎', 12.5, '#86e0a8', 'font-weight="600"'); y += 20; }
  h += '</g>';
  const pool = CARDS.filter(c => !S.proof.includes(c.id));
  if (pool.length) {
    y += 14;

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'seg' ? drawSeg() : id === 'adj' ? drawAdj() : id === 'par' ? drawPar() : drawProof();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);
      scene.insertAdjacentHTML('beforeend', `<rect x="${f1(bb.x0 - 6)}" y="${f1(bb.y0 - 6)}" width="${f1(bb.x1 - bb.x0 + 12)}" height="${f1(bb.y1 - bb.y0 + 12)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`); }

  const D = DIM[LID()], s = Math.min(W0 / (D[0] + 16), hh / (D[1] + 8), 1.8);

let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(id, p) {
  const L = LID();
  if (id[0] === 'p' && id.length === 2) setPt(id[1], (p.x - RX0) / RU);
  else if (id === 'rot' && L === 'adj') setA(lineAng(O2, p));
  else if (id === 'rot' && L === 'proof') setD(lineAng(O4, p));
  else if (id === 'lb') { const P = P3(); let t = degOf(P, p); if (p.x < P.x) t = t > 0 ? t - 180 : t + 180; setPar(t, S.pg); }
  else if (id === 'sec') setPar(S.pb, lineAng(Q3, p));
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  if (el.dataset.drag === 'card') { pick(el.dataset.c); return; }
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  drag = { id: el.dataset.drag };
  scene.classList.add('grabbing');
  dragTo(drag.id, toSvg(e));
});

scene.addEventListener('pointerup', endDrag);

  if (a === 'b-' || a === 'b+') { setPar(S.pb + (a === 'b+' ? 1 : -1), S.pg); return; }

}

}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на поле</h2><p class="note">Нажмите на пункт, чтобы найти его на поле.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'seg') {
    const lo = Math.min(m.A, m.B), hi = Math.max(m.A, m.B);
    let h = `<h2>Длины по линейке</h2><div class="formula">AC + CB = AB</div><div class="steps">` +
      step('AB = |B − A|', `|${fmt(m.B)} − ${fmt(m.A)}| = ${fmt(m.ab)} см`) +
      step('AC = |C − A|', `|${fmt(m.C)} − ${fmt(m.A)}| = ${fmt(m.ac)} см`) +
      step('CB = |B − C|', `|${fmt(m.B)} − ${fmt(m.C)}| = ${fmt(m.cb)} см`) +
      step('C лежит между A и B?', yn(m.between), 'sum') + `</div>`;
    h += `<h3>Проверка</h3><div class="steps">`;
    if (m.between) h += step('AC + CB', `${fmt(m.ac)} + ${fmt(m.cb)} = ${fmt(m.ac + m.cb)} = AB`) + step('AC : CB', m.cb ? `${fmt(m.ac)} : ${fmt(m.cb)}${m.ac === 2 * m.cb ? ' = 2 : 1' : ''}` : '—');
    else h += step('AC + CB', `${fmt(m.ac)} + ${fmt(m.cb)} = ${fmt(m.ac + m.cb)} ${m.ac + m.cb === m.ab ? '= AB' : '≠ AB'}`) + step('почему', m.C === m.A || m.C === m.B ? 'C совпала с концом' : 'C вне отрезка AB');
    h += step('середина AB', `${fmt((lo + hi) / 2)} см на линейке`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">Равенство AC + CB = AB верно, только когда C лежит на отрезке AB. Если C снаружи, то AC + CB больше AB.</p>`;
    return h;
  }
  if (m.kind === 'adj') {
    return `<h2>Углы при пересечении</h2><div class="formula">∠1 + ∠2 = 180°   ∠1 = ∠3</div><div class="steps">` +
      step('∠1 (дано)', `${m.a1}°`) + step('∠2 — смежный с ∠1', `180° − ${m.a1}° = ${m.a2}°`) +
      step('∠3 — вертикальный с ∠1', `${m.a3}°`) + step('∠4 — вертикальный с ∠2', `${m.a4}°`) +
      step('сумма всех четырёх', `${m.a1} + ${m.a2} + ${m.a3} + ${m.a4} = 360°`, 'sum') + `</div>` +
      `<h3>Отношение смежных углов</h3><div class="steps">` + step('больший : меньший', `${Math.max(m.a1, m.a2)} : ${Math.min(m.a1, m.a2)} ≈ ${fmt(Math.max(m.a1, m.a2) / Math.min(m.a1, m.a2))}`) + `</div>` +
      `<p class="note" style="margin-top:10px">${m.a1 === 90 ? 'Все четыре угла прямые — прямые перпендикулярны: AB ⊥ CD.' : 'Если один угол 90°, то и остальные по 90°, а прямые перпендикулярны.'}</p>`;
  }
  if (m.kind === 'par') {
    const pr = PAIRS[m.pair], A = m.ang[pr.a], Bv = m.ang[pr.b];
    let h = `<h2>Признак параллельности</h2><div class="formula">${m.pair === 'side' ? `∠${pr.a} + ∠${pr.b} = 180°` : `∠${pr.a} = ∠${pr.b}`} ⇒ a ∥ b</div><div class="steps">` +
      step('∠1 (секущая и a)', `${m.g}°`) +
      step('∠3 = ∠1 (вертикальные)', `${m.ang[3]}°`) + step('∠4 = 180° − ∠1 (смежные)', `${m.ang[4]}°`) +
      step('наклон b относительно a', `${m.b}°`) + step('∠5 = ∠1 − наклон', `${m.g} − ${m.b} = ${m.ang[5]}°`) + `</div><h3>Пара: ${pr.name}</h3><div class="steps">`;
    if (m.pair === 'side') h += step(`∠${pr.a} + ∠${pr.b}`, `${A} + ${Bv} = ${A + Bv}°`) + step('равно 180°?', yn(A + Bv === 180), 'sum');
    else h += step(`∠${pr.a} и ∠${pr.b}`, `${A}° и ${Bv}°`) + step('равны?', yn(A === Bv), 'sum');
    h += `</div><p class="note" style="margin-top:10px">${m.par ? 'Признак выполнен — значит, a ∥ b.' : 'Признак не выполнен — прямые пересекаются.'} Параллельность при повёрнутой секущей проверена ${m.cnt ? 'в ' + m.cnt + ' положениях' : 'пока ни разу'}.</p>`;
    return h;
  }
  const lines = m.placed.map((id, i) => { const c = CARDS.find(x => x.id === id); return step(`${i + 1}. ${c.f}`, c.r); }).join('');
  return `<h2>Ход доказательства</h2><div class="formula">Если углы вертикальные, то они равны</div>` +
    `<div class="steps">${step('Дано', 'AB ∩ CD = O; ∠1, ∠3 вертикальные')}${step('Доказать', '∠1 = ∠3')}${lines || step('шаги', 'пока нет')}${m.n === 4 ? step('Вывод', 'что и требовалось доказать', 'sum') : ''}</div>` +
    `<h3>Проверка на этом рисунке</h3><div class="steps">${step('∠2', `180° − ${m.d}° = ${180 - m.d}°`)}${step('∠1 = 180° − ∠2', `${m.d}°`)}${step('∠3 = 180° − ∠2', `${m.d}°`)}</div>` +
    `<p class="note" style="margin-top:10px">Обратное утверждение «если углы равны, то они вертикальные» неверно. Контрпример: два прямых угла у квадрата равны, но не вертикальные.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'seg') el.innerHTML = `<div class="k">Отрезок AB</div><div class="v ${ok ? 'ok' : ''}">${fmt(m.ab)} см</div><div class="lr"><span>AC</span><span>${fmt(m.ac)}</span></div><div class="lr"><span>CB</span><span>${fmt(m.cb)}</span></div><div class="lr"><span>C на AB</span><span>${m.between ? 'да' : 'нет'}</span></div>`;
  else if (m.kind === 'adj') el.innerHTML = `<div class="k">Смежные углы</div><div class="v ${ok ? 'ok' : ''}">${m.a1}° + ${m.a2}°</div><div class="lr"><span>сумма</span><span>180°</span></div><div class="gauge"><b style="width:${(m.a1 / 180 * 100).toFixed(0)}%;background:var(--force)"></b></div>`;
  else if (m.kind === 'par') el.innerHTML = `<div class="k">∠3 и ∠5</div><div class="v ${m.par ? 'ok' : ''}">${m.ang[3]}° · ${m.ang[5]}°</div><div class="lr"><span>a и b</span><span>${m.par ? '∥' : 'пересек.'}</span></div><div class="lr"><span>проверок</span><span>${Math.min(m.cnt, 2)}/2</span></div>`;
  else el.innerHTML = `<div class="k">Доказательство</div><div class="v ${ok ? 'ok' : ''}">${m.n} из 4</div><div class="gauge"><b style="width:${(m.n / 4 * 100).toFixed(0)}%"></b></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  seg: '<path d="M4 15H62" stroke="#3a4762" stroke-dasharray="3 3"/><path d="M14 15H50" stroke="#ffb547" stroke-width="2"/><circle cx="14" cy="15" r="2.6" fill="#e8ecf4"/><circle cx="50" cy="15" r="2.6" fill="#e8ecf4"/><circle cx="36" cy="15" r="2.6" fill="#ffb547"/>',
  adj: '<path d="M10 17H56" stroke="#e8ecf4" stroke-width="1.4"/><path d="M22 28L44 6" stroke="#ffb547" stroke-width="1.4"/><path d="M33 17h9A9 9 0 0 0 39.4 10.6Z" fill="rgba(255,181,71,.35)"/><path d="M33 17h-9A9 9 0 0 0 26.6 23.4Z" fill="rgba(255,181,71,.35)"/>',
  par: '<path d="M6 9H60M6 22H60" stroke="#86e0a8" stroke-width="1.4"/><path d="M24 29L42 2" stroke="#ffb547" stroke-width="1.4"/>',
  proof: '<rect x="12" y="4" width="42" height="6" rx="2" fill="none" stroke="#86e0a8"/><rect x="12" y="12" width="42" height="6" rx="2" fill="none" stroke="#86e0a8"/><rect x="12" y="20" width="42" height="6" rx="2" fill="none" stroke="#3a4762"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  if (L.id === 'seg') { S.A = L.A; S.B = L.B; S.C = L.C; S.mode = 'seg'; }
  if (L.id === 'adj') { S.a = L.a; S.pair = 'adj'; }
  if (L.id === 'par') { S.pb = L.b; S.pg = L.g; S.parG = new Set(); S.ppair = 'cross'; }
  if (L.id === 'proof') { S.d = L.d; S.proof = []; }
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  const MODE = { seg: 'отрезок AB', ray: 'луч AB', line: 'прямая AB' };
  let now = '';
  if (id === 'seg') now = `Прямая с линейкой в сантиметрах (0–12 см), на ней точки A = ${fmt(m.A)}, B = ${fmt(m.B)}, C = ${fmt(m.C)} см; показан ${MODE[m.mode]}. AB = ${fmt(m.ab)} см, AC = ${fmt(m.ac)} см, CB = ${fmt(m.cb)} см, C ${m.between ? 'лежит' : 'не лежит'} между A и B. Задание: AB = 9 см, C между A и B, AC вдвое больше CB. Не называй готовые координаты — наведи на мысль про три равные части.`;
  if (id === 'adj') now = `Прямые AB и CD пересекаются в точке O. ∠1 = ∠BOD = ${m.a1}°, ∠2 = ∠DOA = ${m.a2}°, ∠3 = ∠AOC = ${m.a3}°, ∠4 = ∠COB = ${m.a4}°. ∠1 и ∠2 смежные, ∠1 и ∠3 вертикальные. Задание: один из смежных углов в 4 раза больше другого. Не называй ответ — помоги составить уравнение x + 4x = 180.`;
  if (id === 'par') now = `Прямые a (горизонтальная) и b, секущая c. ∠1 = ${m.g}° (секущая с a), наклон b к a ${m.b}°. Углы у a: ∠1–∠4 = ${m.ang.slice(1, 5).join(', ')}°; у b: ∠5–∠8 = ${m.ang.slice(5).join(', ')}°. Накрест лежащие ∠3 и ∠5, соответственные ∠1 и ∠5, односторонние ∠4 и ∠5. Сейчас a ${m.par ? '∥' : 'не ∥'} b. Выбрана пара: ${PAIRS[m.pair].name}. Параллельность проверена при ${m.cnt} положениях секущей (нужно 2). Задание: сделать a ∥ b через равенство накрест лежащих углов, затем повернуть секущую.`;
  if (id === 'proof') now = `Теорема «Вертикальные углы равны». Рисунок: прямые AB и CD пересекаются в O, ∠1 = ${m.d}°, ∠2 = ${180 - m.d}°, ∠3 = ${m.d}°. Ученик собирает доказательство из карточек; уже выбрано ${m.n} из 4 шагов: ${m.placed.map(id => CARDS.find(c => c.id === id).f).join('; ') || 'пока ничего'}. Среди карточек есть ложные обоснования («видно на рисунке», «измерил транспортиром»). Не диктуй порядок — задавай наводящие вопросы про смежные углы.`;
  return [
    `Раздел: математика, 7 класс, геометрия, тема «Начала геометрии». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    seg: 'Чем луч отличается от отрезка и прямой?', adj: 'Почему вертикальные углы всегда равны?',
    par: 'Почему параллельные прямые не пересекаются?', proof: 'Почему нельзя доказать, просто измерив угол?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
