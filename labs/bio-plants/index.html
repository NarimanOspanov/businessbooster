<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 7 класс: корень, стебель и лист, цветок и плод, водоросли, мхи и папоротники, голосеменные и цветковые растения.">
<title>Растения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 33V14" stroke="var(--leaf)" stroke-width="2"/><path d="M20 22Q10 22 9 12Q19 12 20 22Z" fill="rgba(95,191,106,.35)" stroke="var(--leaf)" stroke-width="1.2"/><path d="M20 18Q29 18 31 8Q21 8 20 18Z" fill="rgba(95,191,106,.35)" stroke="var(--leaf)" stroke-width="1.2"/><circle cx="20" cy="11" r="3" fill="#ff9ecb"/><path d="M14 33h12" stroke="var(--force)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Растения</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-plants';
const pct = x => Math.round(x * 100) + '%';
const mix = (a, b, k) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(k, 0, 1)).toString(16).padStart(2, '0')).join(''); };
const wrap = (s, n) => { const out = []; let cur = ''; for (const w of s.split(' ')) { if (cur && (cur + ' ' + w).length > n) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; } if (cur) out.push(cur); return out; };

// ---------- biology data ----------
// Lesson 1: vegetative organs
const ORG = {
  root: { name: 'Корень', c: '#e8dcc0', lines: ['держит растение в почве', 'всасывает воду и соли', 'корневыми волосками', 'бывает запасающим:', 'морковь, свёкла'] },
  stem: { name: 'Стебель', c: '#4ea65a', lines: ['опора: выносит листья', 'к свету', 'вверх по сосудам —', 'вода и соли', 'вниз по ситовидным', 'трубкам — сахар'] },
  leaf: { name: 'Лист', c: '#5fbf6a', lines: ['фотосинтез: на свету', 'из CO₂ и воды —', 'сахар и кислород', 'через устьица —', 'испарение и газообмен'] },
};
const ORGK = ['root', 'stem', 'leaf'];
// Lesson 2: flower stages
const STG = ['Цветение', 'Опыление', 'Рост завязи', 'Зрелый плод'];
// Lesson 3: spore plants
const GR = {
  alg: { name: 'Водоросли', c: '#72d4e8', feat: 'Нет корней, стеблей и листьев: тело — слоевище. Одноклеточные, нитчатые или многоклеточные. Живут в воде.' },
  moss: { name: 'Мхи', c: '#86e0a8', feat: 'Есть стебель и листья, но нет корней — только нити-ризоиды. Нет настоящей проводящей ткани. Растут в сырых местах.' },
  fern: { name: 'Папоротники', c: '#ffb547', feat: 'Есть корни, стебель (часто корневище) и крупные листья-вайи с жилками — проводящей тканью. Споры — на нижней стороне листьев.' },
};
const GRK = ['alg', 'moss', 'fern'];
const SPEC = [
  { id: 'chlamy', name: ['Хламидо-', 'монада'], short: 'Хламидомонада', ans: 'alg', body: 'одна клетка с двумя жгутиками', hold: 'не крепится, плавает', home: 'лужи и пруды' },
  { id: 'spiro', name: ['Спирогира'], short: 'Спирогира', ans: 'alg', body: 'нить из одинаковых клеток, хлоропласт лентой-спиралью', hold: 'не крепится', home: 'пруды и канавы' },
  { id: 'lamin', name: ['Ламинария'], short: 'Ламинария', ans: 'alg', body: 'длинная пластина без листьев и стебля, без жилок', hold: 'присоски-ризоиды на камнях', home: 'холодное море' },
  { id: 'polytr', name: ['Кукушкин', 'лён'], short: 'Кукушкин лён', ans: 'moss', body: 'прямой стебель с мелкими листочками, коробочка на ножке', hold: 'тонкие нити-ризоиды', home: 'сырой лес, болото' },
  { id: 'sphag', name: ['Сфагнум'], short: 'Сфагнум', ans: 'moss', body: 'стебель с пучками веточек и листочков, впитывает воду как губка', hold: 'корней и ризоидов нет', home: 'верховое болото' },
  { id: 'dryop', name: ['Щитовник'], short: 'Щитовник', ans: 'fern', body: 'корневище и пучок крупных перистых листьев с жилками', hold: 'корни', home: 'тенистый лес' },
  { id: 'pter', name: ['Орляк'], short: 'Орляк', ans: 'fern', body: 'длинное подземное корневище, над землёй один большой перистый лист', hold: 'корни', home: 'сосновый лес, опушка' },
  { id: 'strau', name: ['Страусник'], short: 'Страусник', ans: 'fern', body: 'вайи растут воронкой, как перо страуса, с жилками', hold: 'корни', home: 'сырой лес у ручья' },
];
// Lesson 4: seed plants
const SG = { gym: { name: 'Голосеменное', c: '#72d4e8' }, ang: { name: 'Цветковое', c: '#ff9ecb' } };

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  const L = LESSONS[S.lesson];
  S.light = L.light || 30; S.water = L.water || 20; S.seen = {}; S.organ = null; S.pourT = -1e9;
  S.fert = 0; S.grains = 0; S.day = 0; S.tubes = []; S.sel = null;
  S.bin = Array(SPEC.length).fill(-1); S.csel = -1; S.look = -1;
  S.cur = 0; S.cut = {}; S.cls = Array(PLANTS.length).fill(null); S.cutT = -1e9;
}

// ---------- models ----------
function model() {
  const id = LID();
  if (id === 'veg') {
    const L = S.light, W = S.water, wf = clamp((W - 15) / 40, 0, 1), af = W > 85 ? 1 - (W - 85) / 15 * 0.6 : 1;
    return { kind: 'veg', L, W, wf, af, U: Math.round(100 * wf * af), P: Math.round(L * wf * af), droop: clamp((30 - W) / 25, 0, 1), rot: clamp((W - 85) / 15, 0, 1), seen: ORGK.filter(k => S.seen[k]).length };
  }
  if (id === 'flower') {
    const d = S.day, n = S.fert;
    const stage = n === 0 ? (d < 3 ? 0 : -1) : d < 3 ? 1 : d < 30 ? 2 : 3;
    const text = n === 0 ? (d < 3 ? 'цветок ждёт опыления' : d < 8 ? 'цветок вянет без опыления' : 'завязь засохла и опала — плода нет')
      : d < 3 ? 'пыльцевые трубки растут к семязачаткам' : d < 8 ? 'лепестки опадают, завязь растёт' : d < 20 ? 'завязь превращается в плод' : d < 30 ? 'плод наливается' : `плод созрел, в нём ${n} ${n === 1 ? 'семя' : n < 5 ? 'семени' : 'семян'}`;
    return { kind: 'flower', fert: n, grains: S.grains, day: d, stage, text };
  }
  if (id === 'spore') { let n = 0, r = 0; S.bin.forEach((b, i) => { if (b >= 0) { n++; if (GRK[b] === SPEC[i].ans) r++; } }); return { kind: 'sort', placed: n, right: r }; }
  let n = 0, r = 0; S.cls.forEach((c, i) => { if (c) { n++; if (c === PLANTS[i].ans) r++; } });
  return { kind: 'seed', placed: n, right: r, cuts: Object.keys(S.cut).length };
}

// ---------- lesson 1 actions ----------
function setLight(v) { S.light = clamp(Math.round(v / 5) * 5, 0, 100); update(); }
function setWater(v) { const w = clamp(Math.round(v / 5) * 5, 0, 100); if (w > S.water) S.pourT = performance.now(); S.water = w; const m = model(); if (m.rot > 0.3) toast('Почва залита водой: корням не хватает воздуха.'); update(); }
function pickOrgan(k) { S.organ = k; S.seen[k] = true; update(); }

// ---------- lesson 2 actions ----------
function pollinate() {
  if (S.day >= 3) { toast('Цветок уже отцвёл: рыльце засохло, пыльца не прорастёт.'); return; }
  S.grains++;
  if (S.fert < 6) { S.tubes.push({ t0: performance.now(), k: S.fert }); S.fert++; }
  else toast('Все 6 семязачатков уже оплодотворены. Лишняя пыльца не нужна.');
  update();
}
function setDay(d) {
  const old = S.day; S.day = clamp(Math.round(d), 0, 30);
  if (S.fert === 0 && S.day >= 8 && old < 8) toast('Без опыления завязь засохла — плода не будет. Вернитесь к 0-му дню и опылите цветок.');
  else if (S.fert > 0 && S.fert < 6 && S.day >= 30 && old < 30) toast(`Плод созрел, но семян только ${S.fert}: часть семязачатков осталась без пыльцы.`);
  update();
}

// ---------- lesson 3 actions ----------
function drop(c, b) {
  S.bin[c] = b; S.csel = -1; S.look = c;
  const m = model();
  if (m.placed === SPEC.length && m.right < SPEC.length) toast(`Все растения разложены. Верно ${m.right} из 8 — красные переложите.`);
  update();
}

// ---------- lesson 4 actions ----------
function pickPlant(i) { S.cur = i; renderTools(); update(); }
function cutIt() { if (!S.cut[S.cur]) { S.cut[S.cur] = true; S.cutT = performance.now(); } update(); }
function classify(k) {
  if (!S.cut[S.cur]) { toast('Сначала разрежьте шишку или плод — посмотрите, где лежат семена.'); return; }
  S.cls[S.cur] = k;
  const m = model();
  if (m.placed === PLANTS.length && m.right < PLANTS.length) toast(`Все растения определены. Верно ${m.right} из 6 — проверьте красные.`);
  else if (m.placed < PLANTS.length) { for (let d = 1; d <= PLANTS.length; d++) { const j = (S.cur + d) % PLANTS.length; if (!S.cls[j]) { S.cur = j; break; } } }
  renderTools(); update();
}

// ---------- drawing helpers ----------
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}
const T = (x, y, s, size, fill, extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
function along(pts, s) {
  const L = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(l); tot += l; }
  let d = s * tot;
  for (let i = 0; i < L.length; i++) { if (d <= L[i] || i === L.length - 1) { const k = L[i] ? clamp(d / L[i], 0, 1) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; } d -= L[i]; }
  return pts[pts.length - 1];
}

// ---------- lesson 1 scene: a plant at work ----------
const SUN0 = 40, SUN1 = 180, SUNY = 150;
const NODES = [{ t: .3, side: -1, len: 70 }, { t: .5, side: 1, len: 66 }, { t: .7, side: -1, len: 58 }, { t: .88, side: 1, len: 48 }];
function plantGeo(m) {
  const tx = 270 + 30 * m.droop, ty = 140 + 22 * m.droop;
  const q = t => [(1 - t) * (1 - t) * 270 + 2 * (1 - t) * t * 270 + t * t * tx, (1 - t) * (1 - t) * 292 + 2 * (1 - t) * t * 200 + t * t * ty];
  const leaves = NODES.map(n => {
    const [bx, by] = q(n.t), ang = (n.side > 0 ? -25 + 60 * m.droop : 205 - 60 * m.droop) * Math.PI / 180;
    return { bx, by, ang, len: n.len, tx: bx + n.len * Math.cos(ang), ty: by + n.len * Math.sin(ang), mx: bx + n.len * .55 * Math.cos(ang), my: by + n.len * .55 * Math.sin(ang) };
  });
  return { tx, ty, leaves };
}
function vegScene(t) {
  const m = model(), g = plantGeo(m);
  let h = bench();
  // sun track and sun
  const sx = SUN0 + (SUN1 - SUN0) * S.light / 100;
  h += `<path d="M${SUN0} ${SUNY}H${SUN1}" stroke="#26324a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>`;
  h += T(SUN0 - 6, SUNY + 40, 'темно', 10, '#8b96ad') + T(SUN1 + 6, SUNY + 40, 'ярко', 10, '#8b96ad', 'text-anchor="end"');
  if (S.light > 0) g.leaves.forEach(l => { h += `<path d="M${f(sx)} ${SUNY}L${f(l.mx)} ${f(l.my)}" stroke="#ffd36b" stroke-width="1.4" stroke-dasharray="3 5" opacity="${f(S.light / 100 * .6)}"/>`; });
  // soil
  const soil = mix('#6b5238', '#2b2018', S.water / 100);
  h += `<rect x="20" y="292" width="480" height="106" rx="12" fill="${soil}" stroke="${INK}" stroke-width="1.5"/><path d="M20 294H500" stroke="${mix('#8a6a48', '#4a3a2a', S.water / 100)}" stroke-width="3"/>`;
  h += T(490, 390, `влажность почвы ${S.water}%`, 10, '#c9b8a0', 'text-anchor="end"');
  if (m.rot > 0) for (let i = 0; i < 9; i++) h += `<rect x="${40 + i * 50}" y="${300 + (i % 3) * 22}" width="22" height="3" rx="1.5" fill="#5fb4d9" opacity="${f(m.rot * .7)}"/>`;
  // roots
  const rc = mix('#e8dcc0', '#6a4a2a', m.rot);
  h += `<g data-hit="org-root"><path d="M270 294C268 320 274 350 270 386M270 312Q240 322 222 346M270 312Q300 322 318 342M270 340Q248 350 236 374M270 340Q292 352 304 376" stroke="transparent" stroke-width="18" fill="none"/>`;
  h += `<path d="M270 294C268 320 274 350 270 386M270 312Q240 322 222 346M270 312Q300 322 318 342M270 340Q248 350 236 374M270 340Q292 352 304 376" stroke="${rc}" stroke-width="${S.organ === 'root' ? 3.4 : 2.4}" fill="none" stroke-linecap="round"/>`;
  [[270, 386], [222, 346], [318, 342], [236, 374], [304, 376]].forEach(([x, y]) => { h += `<path d="M${x - 5} ${y - 6}l-4 -1M${x + 5} ${y - 6}l4 -1M${x - 4} ${y - 11}l-4 -2M${x + 4} ${y - 11}l4 -2" stroke="${rc}" stroke-width=".8" opacity=".8"/>`; });
  h += `</g>`;
  // stem
  const sw = S.organ === 'stem' ? 7.5 : 6;
  h += `<g data-hit="org-stem"><path d="M270 292Q270 200 ${f(g.tx)} ${f(g.ty)}" stroke="transparent" stroke-width="20" fill="none"/><path d="M270 292Q270 200 ${f(g.tx)} ${f(g.ty)}" stroke="${INK}" stroke-width="${sw + 2.6}" fill="none" stroke-linecap="round"/><path d="M270 292Q270 200 ${f(g.tx)} ${f(g.ty)}" stroke="${mix('#4ea65a', '#9a9a4a', m.droop)}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  h += `<ellipse cx="${f(g.tx)}" cy="${f(g.ty - 5)}" rx="5" ry="8" fill="#86d07a" stroke="${INK}" stroke-width="1"/></g>`;
  // leaves
  const lc = mix('#5fbf6a', '#c9b04a', m.droop);
  h += `<g data-hit="org-leaf">`;
  g.leaves.forEach(l => {
    const nx = -Math.sin(l.ang), ny = Math.cos(l.ang), w = l.len * .26, cx = l.bx + (l.tx - l.bx) * .5, cy = l.by + (l.ty - l.by) * .5;
    const d = `M${f(l.bx)} ${f(l.by)}Q${f(cx + nx * w)} ${f(cy + ny * w)} ${f(l.tx)} ${f(l.ty)}Q${f(cx - nx * w)} ${f(cy - ny * w)} ${f(l.bx)} ${f(l.by)}Z`;
    h += `<path d="${d}" fill="${lc}" stroke="${S.organ === 'leaf' ? '#ffb547' : INK}" stroke-width="${S.organ === 'leaf' ? 2 : 1.2}"/><path d="M${f(l.bx)} ${f(l.by)}L${f(l.tx)} ${f(l.ty)}" stroke="${mix('#3f8f4c', '#8a7a30', m.droop)}" stroke-width="1"/>`;
  });
  h += `</g>`;
  // moving water (blue, up) and sugar (orange, down)
  const tt = reduce ? 0 : t;
  const nb = Math.round(m.U / 12), no = Math.round(m.P / 12);
  for (let i = 0; i < nb; i++) {
    const l = g.leaves[i % 4], tip = [[270, 386], [222, 346], [318, 342], [236, 374]][i % 4];
    const [x, y] = along([tip, [270, 296], [l.bx, l.by], [l.mx, l.my]], ((tt / 2600) + i / nb) % 1);
    h += `<circle cx="${f(x)}" cy="${f(y)}" r="2.6" fill="#5fb4d9" stroke="${INK}" stroke-width=".6" pointer-events="none"/>`;
  }
  for (let i = 0; i < no; i++) {
    const l = g.leaves[(i + 1) % 4];
    const [x, y] = along([[l.mx, l.my], [l.bx, l.by], [270, 296], [270, 372]], ((tt / 3000) + i / no) % 1);
    h += `<rect x="${f(x - 2.4)}" y="${f(y - 2.4)}" width="4.8" height="4.8" rx="1" fill="#ffb547" stroke="${INK}" stroke-width=".6" pointer-events="none"/>`;
  }

  if (m.kind === 'flower') return `Оплодотворено ${m.fert} из 6 · день ${m.day}`;
  if (m.kind === 'sort') return m.placed < 8 ? `Разложено ${m.placed} из 8` : `Верно ${m.right} из 8`;
  return m.placed < 6 ? `Определено ${m.placed} из 6` : `Верно ${m.right} из 6`;
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
// lesson 1 chart: photosynthesis vs soil water at the current light
function vegChart() {
  let h = `<svg class="diag" viewBox="0 0 120 64" role="img" aria-label="Фотосинтез при разной влажности почвы">`, d = '';
  for (let W = 0; W <= 100; W += 5) { const wf = clamp((W - 15) / 40, 0, 1), af = W > 85 ? 1 - (W - 85) / 15 * .6 : 1, P = S.light * wf * af; d += `${W ? 'L' : 'M'}${f(12 + W)} ${f(52 - P * .44)}`; }
  h += `<path d="M12 52H112M12 8V52" stroke="#26324a" stroke-width=".6"/><path d="M12 ${f(52 - 80 * .44)}H112" stroke="#86e0a8" stroke-width=".5" stroke-dasharray="2 2"/>`;
  h += `<path d="${d}" stroke="#ffb547" stroke-width="1.2" fill="none"/>`;
  const m = model(); h += `<circle cx="${f(12 + S.water)}" cy="${f(52 - m.P * .44)}" r="2.2" fill="#5fb4d9"/>`;
  h += `<text x="12" y="60" font-size="4" fill="#8b96ad">влажность почвы 0…100%</text><text x="14" y="${f(50 - 80 * .44)}" font-size="3.6" fill="#86e0a8">80%</text>`;
  return h + `</svg>`;
}

      <dl class="reads"><div><dt>Разложено</dt><dd id="r1"></dd></div><div><dt>Верно</dt><dd id="r2"></dd></div><div><dt>Выбрано</dt><dd id="r3"></dd></div></dl>

  if (id === 'seed') h = `<h2>Шишки и плоды</h2>
      <div class="ctl"><div class="lbl">Растение</div><div class="chips" id="plChips">${PLANTS.map((p, i) => `<button data-i="${i}">${p.name}</button>`).join('')}</div></div>

      <div class="ctl"><div class="lbl">Группа для выбранного растения</div><div class="chips" id="gChips">${SGK.map(k => `<button data-k="${k}">${SG[k].name}</button>`).join('')}</div></div>
      <div class="row"><button class="ghostbtn" data-a="cut">Разрезать</button><button class="ghostbtn" data-a="reset">Сбросить</button></div>`;
  el.innerHTML = h;
  const on = (s, fn) => { const x = el.querySelector(s); if (x) x.addEventListener('input', e => fn(+e.target.value)); };
  on('#inLight', setLight); on('#inWater', setWater); on('#inDay', setDay);

  el.querySelectorAll('#plChips button').forEach(b => b.onclick = () => pickPlant(+b.dataset.i));
  el.querySelectorAll('#gChips button').forEach(b => b.onclick = () => classify(b.dataset.k));

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'veg') {
    const d = el.querySelector('#vDiag'); if (d) d.innerHTML = vegChart();
    set('#inLightO', S.light + '%'); val('#inLight', S.light); set('#inWaterO', S.water + '%'); val('#inWater', S.water);
    set('#r1', m.P + '%'); set('#r2', m.U + '%'); set('#r3', m.seen + ' из 3');
    el.querySelectorAll('#oChips button').forEach(b => b.setAttribute('aria-pressed', S.organ === b.dataset.k));
  } else if (m.kind === 'flower') {
    set('#inDayO', String(S.day)); val('#inDay', S.day);
    set('#r1', String(m.grains)); set('#r2', `${m.fert} из 6`); set('#r3', m.day >= 8 && m.fert === 0 ? '0' : String(m.fert));
  } else if (m.kind === 'sort') {
    set('#r1', `${m.placed} из 8`); set('#r2', m.placed === 8 ? `${m.right} из 8` : '—'); set('#r3', S.look >= 0 ? SPEC[S.look].short : '—');
    const bl = el.querySelector('#binList');
    if (bl) bl.innerHTML = GRK.map((k, b) => step(GR[k].name, SPEC.filter((_, c) => S.bin[c] === b).map(s => s.short).join(', ') || '—')).join('');
  } else {
    set('#r1', `${m.cuts} из 6`); set('#r2', `${m.placed} из 6`); set('#r3', m.placed === 6 ? `${m.right} из 6` : '—');
    el.querySelectorAll('#plChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === S.cur));
    el.querySelectorAll('#gChips button').forEach(b => b.setAttribute('aria-pressed', S.cls[S.cur] === b.dataset.k));
  }
}

      (L.id === 'seed' ? `<p class="note" style="margin-top:12px">Осторожно: шишкоягоды казацкого можжевельника ядовиты. Не пробуйте незнакомые ягоды и семена.</p>` : '') +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {

function calcHTML(m) {
  const id = LID();
  if (id === 'veg') {
    let h = `<h2>Сколько сахара делает лист</h2><div class="formula">фотосинтез = свет × вода к листу × воздух корням</div><div class="steps">` +
      step('Свет', S.light + '%') + step('Влажность почвы', S.water + '%') +
      step('Вода к листу', m.W <= 15 ? '0 — корню нечего всасывать' : m.W >= 55 ? '100%' : `(${m.W} − 15) / 40 = ${pct(m.wf)}`) +
      step('Воздух корням', m.W > 85 ? `1 − (${m.W} − 85) / 15 × 0,6 = ${pct(m.af)}` : '100%') +
      step('Фотосинтез', `${S.light}% × ${pct(m.wf)} × ${pct(m.af)} = ${m.P}%`, 'sum') + `</div>`;
    h += `<h3>Путь веществ</h3><div class="steps">` + step('Вода и соли', 'волоски → сосуды корня → сосуды стебля → лист') + step('Сахар', 'лист → ситовидные трубки → корень, почки, плоды') + `</div>`;
    h += `<h3>Цель</h3><div class="steps">` + step('Фотосинтез ≥ 80%', m.P >= 80 ? 'да ✓' : 'пока нет') + step('Органы изучены', `${m.seen} из 3`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">Пороги 15%, 55% и 85% — условные числа модели. У кактуса и риса они совсем разные.</p>`;
    return h;
  }
  if (id === 'flower') {
    const left = 6 - m.fert, dead = m.fert === 0 && m.day >= 8;
    let h = `<h2>Сколько будет семян</h2><div class="formula">1 пыльцевое зерно → 1 семязачаток → 1 семя</div><div class="steps">` +
      step('Семязачатков в завязи', '6') + step('Пыльцы на рыльце', String(m.grains)) + step('Пыльцевых трубок', String(Math.min(m.grains, 6))) +
      step('Оплодотворено', `${m.fert} из 6`) + step('Осталось без пыльцы', String(left)) +
      step('Будет семян', dead ? '0 — завязь опала' : String(m.fert), 'sum') + `</div>`;
    h += `<h3>День ${m.day}</h3><p>${m.text[0].toUpperCase() + m.text.slice(1)}.</p>`;
    h += `<h3>Что во что превращается</h3><div class="steps">` + step('Завязь', 'плод') + step('Стенка завязи', 'околоплодник') + step('Семязачаток', 'семя') + step('Лепестки, тычинки', 'опадают') + `</div>`;
    return h;
  }
  if (id === 'spore') {
    const all = m.placed === 8;
    let h = `<h2>Как рассуждать</h2><div class="formula">стебель и листья? → корни и жилки?</div><div class="steps">` +
      step('1. Нет стебля и листьев, тело — слоевище', 'водоросль') + step('2. Стебель и листья есть, корней нет (ризоиды)', 'мох') + step('3. Корни, корневище, листья с жилками', 'папоротник') + `</div>`;
    if (S.look >= 0) { const s = SPEC[S.look]; h += `<h3>${s.short}: что видно</h3><div class="steps">` + step('Тело', s.body) + step('Чем крепится', s.hold) + step('Где живёт', s.home) + `</div>`; }
    h += `<h3>Сейчас</h3><div class="steps">` + SPEC.map((s, c) => step(s.short, S.bin[c] < 0 ? '—' : GR[GRK[S.bin[c]]].name + (all ? (GRK[S.bin[c]] === s.ans ? ' ✓' : ' ✗') : ''))).join('') +
      step('итого', all ? `верно ${m.right} из 8` : `разложено ${m.placed} из 8`, 'sum') + `</div>`;
    if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 8 карточек будут в коробках.</p>`;
    return h;
  }
  const all = m.placed === 6, p = PLANTS[S.cur];
  let h = `<h2>Как определить</h2><div class="formula">где лежат семена? на чешуе → голосеменное, в плоде → цветковое</div><div class="steps">` +
    step('1. Есть цветки?', 'нет → голосеменное') + step('2. Семена открыто на чешуях шишки?', 'голосеменное') + step('3. Семена внутри плода из завязи?', 'цветковое') + `</div>`;
  h += `<h3>${p.name}: что видно</h3><div class="steps">` + step('Листья', p.leaves) + (S.cut[S.cur] ? step('Орган', p.organ) + step('Семена', p.seeds) + step('Цветки', p.flowers) : step('Семена', 'разрежьте, чтобы увидеть')) + `</div>`;
  h += `<h3>Ваши ответы</h3><div class="steps">` + PLANTS.map((q, i) => step(q.name, S.cls[i] ? SG[S.cls[i]].name + (all ? (S.cls[i] === q.ans ? ' ✓' : ' ✗') : '') : '—')).join('') +
    step('итого', all ? `верно ${m.right} из 6` : `определено ${m.placed} из 6`, 'sum') + `</div>`;
  if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 6 растений будут определены.</p>`;
  return h;
}

  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий ботаник!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  veg: '<circle cx="10" cy="8" r="4" fill="#ffd36b"/><path d="M4 24h58" stroke="#6b4c36" stroke-width="3"/><path d="M33 24V6" stroke="#4ea65a" stroke-width="1.8"/><ellipse cx="27" cy="12" rx="6" ry="2.4" fill="#5fbf6a"/><ellipse cx="39" cy="16" rx="6" ry="2.4" fill="#5fbf6a"/><path d="M33 25v4M33 26l-4 3M33 26l4 3" stroke="#e8dcc0"/><circle cx="33" cy="18" r="1.4" fill="#5fb4d9"/>',
  flower: '<path d="M22 28V16" stroke="#4ea65a" stroke-width="1.6"/><path d="M22 16C14 14 10 6 12 2C17 4 21 10 22 16ZM22 16C30 14 34 6 32 2C27 4 23 10 22 16Z" fill="#ff9ecb"/><ellipse cx="22" cy="15" rx="3" ry="4" fill="#a7dc94"/><path d="M40 16h6" stroke="#8b96ad"/><circle cx="56" cy="16" r="7" fill="#e0574f"/><circle cx="54" cy="15" r="1.2" fill="#4a2c18"/><circle cx="58" cy="17" r="1.2" fill="#4a2c18"/>',
  spore: '<rect x="3" y="4" width="18" height="22" rx="3" fill="#173048"/><path d="M12 22Q8 12 12 6" stroke="#a07a3a" stroke-width="3"/><path d="M28 26V12M34 26V10M40 26V12" stroke="#6cc070" stroke-width="1.6"/><path d="M54 26Q50 14 46 6M54 26Q56 14 60 6" stroke="#5fbf6a" stroke-width="1.4" stroke-dasharray="1.5 1"/>',
  seed: '<ellipse cx="18" cy="15" rx="7" ry="11" fill="#8a5a32"/><path d="M13 9q5 -4 10 0M12 15q6 -4 12 0M13 21q5 -4 10 0" stroke="#5c3a1e" fill="none"/><path d="M48 6C54 2 62 8 60 16C58 26 50 28 48 26C46 28 38 26 36 16C34 8 42 2 48 6Z" fill="#d9473f"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'veg') {
    now = `Модель растения в почве: солнце, корень, стебель, четыре листа, лейка. Свет ${S.light}%, влажность почвы ${S.water}%. Вода доходит до листа на ${m.U}%, воздух корням ${pct(m.af)}, фотосинтез ${m.P}% (голубые точки — вода идёт вверх, оранжевые — сахар идёт вниз). ` +
      (m.droop > 0.2 ? 'Листья поникли и желтеют — воды мало. ' : '') + (m.rot > 0 ? 'Почва залита, корни темнеют — им не хватает воздуха. ' : '') +
      `Ученик изучил органы: ${ORGK.filter(k => S.seen[k]).map(k => ORG[k].name.toLowerCase()).join(', ') || 'пока ни одного'}. Цель: нажать на все три органа и добиться фотосинтеза не меньше 80%.`;
    guide = 'Не называй готовые значения ползунков. Спрашивай, что нужно листу для фотосинтеза, откуда берётся вода и почему корням вредно, когда почва залита.';
  }
  if (id === 'flower') {
    now = `Цветок в продольном разрезе: чашелистики, лепестки, 4 тычинки с пыльниками, пестик (рыльце, столбик, завязь с 6 семязачатками). День ${m.day}. Пыльцевых зёрен на рыльце: ${m.grains}, оплодотворено семязачатков: ${m.fert} из 6. Стадия: ${m.text}. Опылять можно только в первые 3 дня, пока цветок открыт.`;
    guide = 'Подводи вопросами: что такое опыление и оплодотворение, сколько пыльцевых зёрен нужно на 6 семязачатков, во что превращаются завязь и семязачаток.';
  }
  if (id === 'spore') {
    now = `8 карточек с растениями: ${SPEC.map((s, c) => `${s.short} — ${S.bin[c] < 0 ? 'не разложена' : 'в коробке «' + GR[GRK[S.bin[c]]].name + '»'}`).join('; ')}. Коробки: водоросли, мхи, папоротники. ` +
      (m.placed === 8 ? `Все разложены, верно ${m.right} из 8.` : `Разложено ${m.placed} из 8.`) + (S.look >= 0 ? ` Крупно показано растение «${SPEC[S.look].short}»: ${SPEC[S.look].body}; крепится: ${SPEC[S.look].hold}; живёт: ${SPEC[S.look].home}.` : '');
    guide = 'Не говори, в какую коробку класть карточку. Спрашивай: есть ли стебель и листья, есть ли корни и жилки, чем растение крепится.';
  }
  if (id === 'seed') {
    const p = PLANTS[S.cur];
    now = `6 растений: ${PLANTS.map((q, i) => `${q.name} — ${S.cut[i] ? 'разрезано' : 'не разрезано'}, ответ ученика: ${S.cls[i] ? SG[S.cls[i]].name.toLowerCase() : 'нет'}`).join('; ')}. На столе: ${p.name}${S.cut[S.cur] ? `, разрез показывает: ${p.organ}, семена — ${p.seeds}` : ', орган ещё не разрезан'}. ` +
      (m.placed === 6 ? `Все определены, верно ${m.right} из 6.` : `Определено ${m.placed} из 6, проверка появится, когда будут определены все.`);
    guide = 'Не называй группу для конкретного растения. Спрашивай, где лежат семена — открыто на чешуе или внутри плода, и есть ли у растения цветки.';
  }
  return [
    `Раздел: биология, 7 класс, тема «Растения». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    veg: 'Почему растение вянет, если его перелить?', flower: 'Чем опыление отличается от оплодотворения?',
    spore: 'Почему мхам и папоротникам нужна вода для размножения?', seed: 'Почему можжевельник — голосеменное, хотя у него «ягоды»?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
