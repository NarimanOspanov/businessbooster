<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 7 класс: длина, время и масса, цена деления прибора, погрешность измерений, система единиц СИ.">
<title>Измерения и единицы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="6" y="22" width="28" height="9" rx="1.5" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M10 22v4M14 22v2.5M18 22v4M22 22v2.5M26 22v4M30 22v2.5" stroke="var(--arm)" stroke-width="1.6"/><path d="M8 15h22" stroke="var(--force)" stroke-width="2.4" stroke-linecap="round"/><path d="M30 15l-4-3v6z" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Физика · Измерения</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Измерения</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с измерительными приборами. Приборы можно двигать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'units', title: 'Длина, время, масса',
    text: ['Измерить величину — значит сравнить её с эталоном, который принят за единицу. Длину сравнивают с метром, время — с секундой, массу — с килограммом.',
           'Для каждой величины свой прибор: длину меряют линейкой, время — секундомером, массу — весами. Ноль линейки ставят точно у края предмета, иначе ответ будет неверным.',
           'Одно качание маятника длится всего пару секунд, его трудно поймать точно. Поэтому засекают время 10 полных колебаний и делят на 10.'],
    why: 'Закройщик в ателье меряет ткань до миллиметра, тренер засекает время бегуна на стометровке, продавец на базаре взвешивает яблоки на весах. Плиточник ошибся на сантиметр — и кафель не лёг в ряд, переделка стоит денег из его же кармана.',
    task: 'Измерьте длину карандаша, время 10 колебаний маятника и массу яблока.',
    hint: 'Приборы переключаются кнопками внизу. Линейку тащите, пока её ноль не совпадёт с концом карандаша, а показание читайте в лупу. Весы уравновесьте гирями из ящика.',
    stage: 'Выберите прибор внизу: длина, время или масса.',
    obj: { name: 'карандаш', gen: 'карандаша', mm: 126.3 }, price: 1, pend: 1, apple: 167, weights: [100, 50, 20, 20, 10, 5, 2, 2, 1],
    check: m => m.len && m.time && m.mass },
  { id: 'scale', title: 'Цена деления прибора',
    text: ['Между числами на шкале нанесены штрихи. Промежуток между соседними штрихами — деление. Цена деления показывает, сколько единиц приходится на одно деление.',
           'Как её найти: возьмите два соседних подписанных штриха, из большего числа вычтите меньшее и разделите на число делений между ними. Например, (20 − 10) / 5 = 2.',
           'Зная цену деления, можно прочитать любое показание: от ближайшего подписанного штриха отсчитайте нужное число делений.'],
    why: 'Медсестра набирает лекарство шприцем по делениям: ошибка в одно деление может навредить больному. Водитель держит стрелку спидометра у разрешённых 60 км/ч, чтобы не получить штраф с камеры. Повар отмеряет молоко мерным стаканом, а лаборант — реактив мензуркой.',
    task: 'Только по шкалам, без цифрового табло: налейте 135 мл воды, нагрейте воду до 36 °C и разгоните машину до 85 км/ч.',
    hint: 'Сначала найдите цену деления каждой шкалы. Тяните уровень воды, столбик или стрелку пальцем, а точно доводите кнопками ▼ ▲.',
    stage: 'Тяните воду, столбик или стрелку. Кнопки ▼ ▲ — шаг на одну единицу.',
    insts: [
      { id: 'cyl', name: 'Мензурка', unit: 'мл', min: 0, max: 200, label: 50, div: 10, target: 135, start: 0, what: 'уровень воды' },
      { id: 'thermo', name: 'Термометр', unit: '°C', min: -20, max: 50, label: 10, div: 5, target: 36, start: 20, what: 'столбик' },
      { id: 'speed', name: 'Спидометр', unit: 'км/ч', min: 0, max: 160, label: 20, div: 4, target: 85, start: 0, what: 'стрелка' },
    ],
    check: m => m.n === 3 },
  { id: 'error', title: 'Погрешность измерений',
    text: ['Абсолютно точных измерений не бывает. Конец предмета почти никогда не попадает ровно на штрих, и мы записываем ближайший.',
           'В школе погрешность измерения линейкой принимают равной половине цены деления. Результат пишут так: L = 4 ± 0,5 см. Это значит, что настоящая длина лежит где-то между 3,5 и 4,5 см.',
           'Чем меньше цена деления, тем меньше погрешность и тем точнее прибор.'],
    why: 'Токарь вытачивает вал с допуском в сотые доли миллиметра — иначе подшипник не сядет и деталь уйдёт в брак. Метролог проверяет весы в магазинах и колонки на заправках: если погрешность больше нормы, прибор запрещают. А дома, покупая шкаф в нишу, учитывай погрешность рулетки — иначе он не влезет.',
    task: 'Измерьте болт двумя линейками — с ценой деления 1 см и 1 мм — и запишите оба результата.',

const LS_KEY = 'luch-phys-measure';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- geometry (SVG units; the bench top is y = 360) ----------
const K = 3, X0 = 40, RY = 308;             // 3 units per mm; object's left end; ruler top edge
const RULER_MM = 150;
const T_P = 2 * Math.PI * Math.sqrt(1 / 9.81); // period of a 1 m pendulum, s
const PIV = { x: 262, y: 56 }, PLEN = 250, AMP = 9 * Math.PI / 180;
const BAL = { x: 260, y: 150, arm: 150, hang: 120 };
const fmtF = f => f >= 1 ? String(f) : fmt(f, f < 0.01 ? 3 : 2);

function resetState() {
  Object.assign(S, {
    st: 'len', rul: 'cm', rx: X0 + 37, read: 0, rec: {}, pan: [], got: {},
    sw: { run: false, t0: 0, el: 0, first: 0 }, tRec: null, rel: performance.now(), tilt: 0,
    inst: 'cyl', val: {}, hit: {}, card: 0, solved: {}, hl: null,
  });
  if (LID() === 'scale') for (const I of L().insts) S.val[I.id] = I.start;
}
resetState();

const price = () => LID() === 'error' ? L().rulers[S.rul] : 1;          // ruler's division value, mm
const aligned = () => Math.abs(S.rx - X0) < 0.01;
const elapsed = (t = performance.now()) => S.sw.run ? S.sw.el + (t - S.sw.t0) / 1000 : S.sw.el;
const swings = (t = performance.now()) => {
  if (!S.sw.first) return 0;
  const end = S.sw.run ? t : S.sw.t0 + 0; // when stopped, t0 holds the stop moment
  return Math.max(0, Math.floor((end - S.rel) / 1000 / T_P) - Math.floor((S.sw.first - S.rel) / 1000 / T_P));
};
const panMass = () => S.pan.reduce((s, i) => s + L().weights[i], 0);
const INST = () => L().insts.find(I => I.id === S.inst);
const priceOf = I => I.label / I.div;

function model() {
  const id = LID();
  if (id === 'units') { const mR = panMass(); return { kind: 'units', aligned: aligned(), len: S.rec.len != null, time: S.tRec != null, mass: !!S.got.mass, mR, mL: L().apple, t: elapsed() }; }
  if (id === 'scale') { const I = INST(); return { kind: 'scale', I, v: S.val[I.id], c: priceOf(I), n: Object.keys(S.hit).length }; }
  if (id === 'error') return { kind: 'error', aligned: aligned(), c: price(), cm: S.rec.cm != null, mm: S.rec.mm != null };
  return { kind: 'si', n: Object.keys(S.solved).length, card: L().cards[S.card] };
}

// ---------- drawing helpers ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const GLASS = 'rgba(200,225,255,.08)', GLASS_S = '#9fb3d1';

function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="2360" fill="url(#tile)"/>
    <rect x="-2000" y="360" width="4520" height="1200" fill="#1a2232"/>
    <rect x="-2000" y="358" width="4520" height="4" fill="#2c3954"/>
    <rect x="-2000" y="362" width="4520" height="2" fill="${INK}" opacity=".6"/>`;
}

// a round magnifier: shows `inner` around (fx, fy) enlarged Z times
function lens(id, cx, cy, r, fx, fy, Z, inner) {
  const dx = fx - cx, dy = fy - cy, d = Math.hypot(dx, dy) || 1;
  return `<g pointer-events="none"><path d="M${fx} ${fy}L${(cx + dx / d * r).toFixed(1)} ${(cy + dy / d * r).toFixed(1)}" stroke="#72d4e8" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="3 3"/>
    <clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r}" fill="#0e1520"/>
    <g clip-path="url(#${id})"><g transform="translate(${cx} ${cy}) scale(${Z}) translate(${-fx} ${-fy})">${inner}</g></g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK}" stroke-width="6"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#9fb3d1" stroke-width="3"/>
    <circle cx="${fx}" cy="${fy}" r="5" fill="none" stroke="#72d4e8" stroke-width="1.2"/><text x="${cx}" y="${cy + r + 14}" font-size="9" fill="#8b96ad" text-anchor="middle">лупа ×${Z}</text></g>`;
}

function objectSVG(o) {
  const xe = X0 + o.mm * K;
  if (o.name === 'карандаш') {
    const xb = xe - 18 * K;
    return `<g><rect x="${X0}" y="287" width="24" height="18" rx="3" fill="#f29bb0" stroke="${INK}" stroke-width="1.4"/>
      <rect x="${X0 + 22}" y="286" width="14" height="20" fill="#c8d1e2" stroke="${INK}" stroke-width="1.4"/>
      <path d="M${X0 + 36} 287H${xb}V305H${X0 + 36}Z" fill="#f2b134" stroke="${INK}" stroke-width="1.4"/>
      <path d="M${X0 + 36} 293H${xb}M${X0 + 36} 299H${xb}" stroke="#c98a12" stroke-width="1"/>
      <path d="M${xb} 287L${xe} 296L${xb} 305Z" fill="#e8c99a" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M${xe - 6 * K} 293.3L${xe} 296L${xe - 6 * K} 298.7Z" fill="#2b2f3a"/>
      <text x="${(X0 + xb) / 2 + 18}" y="299.5" font-size="8" fill="#5a3d05" text-anchor="middle">HB</text></g>`;
  }
  let h = `<g><path d="M${X0} 283H${X0 + 24}V307H${X0}Z" fill="#aab4c6" stroke="${INK}" stroke-width="1.4"/><path d="M${X0} 291H${X0 + 24}M${X0} 299H${X0 + 24}" stroke="#7e889c" stroke-width="1"/>
    <path d="M${X0 + 24} 288H${xe}V302H${X0 + 24}Z" fill="#c3cbd9" stroke="${INK}" stroke-width="1.4"/>`;
  for (let x = X0 + 28; x < xe - 2; x += 4.5) h += `<path d="M${x.toFixed(1)} 288.5L${(x + 2.5).toFixed(1)} 301.5" stroke="#7e889c" stroke-width=".9"/>`;
  return h + `</g>`;
}

function rulerSVG(c) {
  const x = S.rx;
  let h = `<rect x="${x - 10}" y="${RY}" width="${RULER_MM * K + 20}" height="44" rx="3" fill="#e7dcb8" stroke="${INK}" stroke-width="1.6"/>`;
  for (let i = 0; i <= RULER_MM; i += c) {
    const L2 = i % 10 === 0 ? 16 : i % 5 === 0 ? 11 : 7, xi = x + i * K;
    h += `<path d="M${xi.toFixed(1)} ${RY}v${L2}" stroke="#1d2433" stroke-width="${i % 10 === 0 ? 1 : 0.7}"/>`;
    if (i % 10 === 0) h += `<text x="${xi.toFixed(1)}" y="${RY + 28}" font-size="9" fill="#1d2433" text-anchor="middle">${i / 10}</text>`;
  }
  h += `<text x="${x + RULER_MM * K + 6}" y="${RY + 40}" font-size="7" fill="#5b6478" text-anchor="end">см · цена деления 1 ${c === 10 ? 'см' : 'мм'}</text>`;
  return `<g data-drag="ruler">${h}</g>`;
}

function lengthScene() {
  const o = L().obj, c = price(), xe = X0 + o.mm * K, inner = objectSVG(o) + rulerSVG(c);
  let h = '';
  // zero marker
  const al = aligned();
  h += `<path d="M${X0} 270V282" stroke="${al ? '#86e0a8' : '#ff8a73'}" stroke-width="1.4" stroke-dasharray="3 2"/><text x="${X0}" y="265" font-size="9" fill="${al ? '#86e0a8' : '#ff8a73'}" text-anchor="middle">${al ? 'ноль совпал' : 'ноль?'}</text>`;
  // recorded intervals (lesson 3)
  if (LID() === 'error') {
    const band = (rec, cc, y, col, lab) => {
      if (rec == null) return '';
      const a = X0 + (rec - cc / 2) * K, b = X0 + (rec + cc / 2) * K;
      return `<path d="M${a.toFixed(1)} ${y + 5}v-5H${b.toFixed(1)}v5" fill="none" stroke="${col}" stroke-width="2"/><text x="${((a + b) / 2).toFixed(1)}" y="${y - 4}" font-size="8.5" fill="${col}" text-anchor="middle">${lab}</text>`;
    };
    h += band(S.rec.cm, 10, 238, '#ffb547', 'линейка в см') + band(S.rec.mm, 1, 258, '#86e0a8', 'в мм');
  }
  h += objectSVG(o) + rulerSVG(c);
  const cx = LID() === 'error' ? xe + 170 : clamp(xe, 120, 420);
  h += lens('lensL', cx, 150, 62, xe, 304, 5, inner);
  return h;
}

function timeScene(t) {
  const th = AMP * Math.cos(2 * Math.PI * ((t - S.rel) / 1000) / T_P);
  const bx = PIV.x + PLEN * Math.sin(th), by = PIV.y + PLEN * Math.cos(th);
  let h = '';
  h += ol('M96 350h110v10H96z', '#2a3348', '#3a4762', 1.6);
  h += ol('M140 350V36', 'none', '#a9b4c9', 4.5);
  h += ol(`M140 48H${PIV.x + 6}`, 'none', '#8a96b0', 4);
  const ex = PLEN * Math.sin(AMP), ey = PLEN * Math.cos(AMP);
  h += `<path d="M${(PIV.x - ex).toFixed(1)} ${(PIV.y + ey).toFixed(1)}A${PLEN} ${PLEN} 0 0 0 ${(PIV.x + ex).toFixed(1)} ${(PIV.y + ey).toFixed(1)}" fill="none" stroke="#8b96ad" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>`;
  h += `<text x="${(PIV.x + ex + 6).toFixed(1)}" y="${(PIV.y + ey + 4).toFixed(1)}" font-size="8" fill="#8b96ad">край</text>`;
  h += `<path d="M${PIV.x} ${PIV.y}L${bx.toFixed(1)} ${by.toFixed(1)}" stroke="#e8ecf4" stroke-width="1.3"/><circle cx="${PIV.x}" cy="${PIV.y}" r="3.5" fill="#c8d1e2" stroke="${INK}"/>`;
  h += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="13" fill="#ffb547" stroke="${INK}" stroke-width="2.4"/><circle cx="${(bx - 4).toFixed(1)}" cy="${(by - 4).toFixed(1)}" r="3.5" fill="#fff" opacity=".45"/>`;
  h += `<text x="${PIV.x - 18}" y="${PIV.y + 130}" font-size="8.5" fill="#8b96ad" text-anchor="end">нить 1 м</text>`;
  // stopwatch
  const run = S.sw.run, el = elapsed(t);
  h += `<g data-click="sw"><rect x="${410 - 14}" y="160" width="28" height="16" rx="3" fill="${run ? '#86e0a8' : '#ffb547'}" stroke="${INK}" stroke-width="1.6"/>`;
  h += ol('M420 176v8', 'none', '#a9b4c9', 3);
  h += `<circle cx="420" cy="242" r="58" fill="#1a2438" stroke="${INK}" stroke-width="5"/><circle cx="420" cy="242" r="58" fill="none" stroke="#a9b4c9" stroke-width="2.4"/>`;
  h += `<rect x="380" y="226" width="80" height="30" rx="4" fill="#0d1a14" stroke="${INK}"/><text x="452" y="247" font-size="17" fill="#86e0a8" text-anchor="end">${fmt(el, 2)}</text>`;
  h += `<text x="420" y="272" font-size="8.5" fill="#8b96ad" text-anchor="middle">секунды</text><text x="420" y="210" font-size="8" fill="#8b96ad" text-anchor="middle">${run ? 'идёт' : 'нажмите кнопку'}</text></g>`;
  if (S.sw.first) h += `<text x="420" y="322" font-size="10" fill="#e8ecf4" text-anchor="middle">полных колебаний: ${swings(t)}</text>`;
  return h;
}

function weightSVG(m, x, yb, id) {
  const w = 10 + 3 * Math.log2(m), hh = w * 0.9;
  return `<g data-click="${id}"><rect x="${(x - w / 2 - 3).toFixed(1)}" y="${(yb - hh - 8).toFixed(1)}" width="${(w + 6).toFixed(1)}" height="${(hh + 10).toFixed(1)}" fill="transparent"/>
    <rect x="${(x - 2.5).toFixed(1)}" y="${(yb - hh - 5).toFixed(1)}" width="5" height="6" rx="2" fill="#b8932e" stroke="${INK}" stroke-width="1"/>
    <rect x="${(x - w / 2).toFixed(1)}" y="${(yb - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="#d4b257" stroke="${INK}" stroke-width="1.4"/>
    <text x="${x.toFixed(1)}" y="${(yb - hh / 2 + 3).toFixed(1)}" font-size="${m >= 100 ? 7.5 : 8}" fill="#3a2a05" text-anchor="middle">${m}</text></g>`;
}

function massScene() {
  const W = L().weights, th = S.tilt * Math.PI / 180;
  const lx = BAL.x - BAL.arm * Math.cos(th), ly = BAL.y - BAL.arm * Math.sin(th);
  const rx = BAL.x + BAL.arm * Math.cos(th), ry = BAL.y + BAL.arm * Math.sin(th);
  const lp = ly + BAL.hang, rp = ry + BAL.hang;
  let h = '';
  h += ol('M200 350h120v10H200z', '#2a3348', '#3a4762', 1.6);
  h += ol(`M255 350V${BAL.y}h10V350z`, '#3a4762', '#56627d', 1.4);
  // pointer scale
  h += `<path d="M232 236A90 90 0 0 0 288 236" fill="none" stroke="#8b96ad" stroke-width="1"/>`;
  for (let k = -3; k <= 3; k++) { const a = k * 6 * Math.PI / 180; h += `<path d="M${(BAL.x + 86 * Math.sin(a)).toFixed(1)} ${(BAL.y + 86 * Math.cos(a)).toFixed(1)}L${(BAL.x + 94 * Math.sin(a)).toFixed(1)} ${(BAL.y + 94 * Math.cos(a)).toFixed(1)}" stroke="${k ? '#8b96ad' : '#86e0a8'}" stroke-width="${k ? 1 : 2}"/>`; }
  // beam + needle (rotate together)
  h += `<g transform="rotate(${S.tilt.toFixed(2)} ${BAL.x} ${BAL.y})">` + ol(`M${BAL.x - BAL.arm} ${BAL.y}H${BAL.x + BAL.arm}`, 'none', '#a9b4c9', 5) +
       `<path d="M${BAL.x} ${BAL.y}V${BAL.y + 92}" stroke="#ffb547" stroke-width="2"/></g>`;
  h += `<circle cx="${BAL.x}" cy="${BAL.y}" r="6" fill="#c8d1e2" stroke="${INK}" stroke-width="1.6"/>`;
  // pans
  const pan = (x, y, top, yp) => `<path d="M${x.toFixed(1)} ${top.toFixed(1)}L${(x - 46).toFixed(1)} ${yp.toFixed(1)}M${x.toFixed(1)} ${top.toFixed(1)}L${(x + 46).toFixed(1)} ${yp.toFixed(1)}" stroke="#8b96ad" stroke-width="1.1"/>` +
    ol(`M${(x - 52).toFixed(1)} ${yp.toFixed(1)}Q${x.toFixed(1)} ${(yp + 18).toFixed(1)} ${(x + 52).toFixed(1)} ${yp.toFixed(1)}Z`, '#56627d', '#a9b4c9', 1.6);
  h += pan(lx, 0, ly, lp) + pan(rx, 0, ry, rp);
  // apple on the left pan
  const ay = lp - 16;
  h += `<g><path d="M${lx - 2} ${ay - 20}q-2 -8 3 -12" fill="none" stroke="#6b4a2a" stroke-width="2"/><path d="M${lx + 1} ${ay - 26}q9 -6 14 1q-8 4 -14 -1z" fill="#5fae5a" stroke="${INK}"/>`;
  h += `<path d="M${lx} ${ay - 18}q-12 -8 -21 2q-9 12 0 26q9 11 21 4q12 7 21 -4q9 -14 0 -26q-9 -10 -21 -2z" fill="#d9473a" stroke="${INK}" stroke-width="2"/><ellipse cx="${lx - 9}" cy="${ay - 8}" rx="4" ry="6" fill="#fff" opacity=".25"/></g>`;
  // weights on the right pan, in rows
  let cx = rx - 44, row = 0, base = rp - 1;
  const onPan = S.pan.slice().sort((a, b) => W[b] - W[a]);
  for (const i of onPan) {
    const w = 10 + 3 * Math.log2(W[i]);
    if (cx + w > rx + 46) { row++; cx = rx - 44; base = rp - 1 - row * 30; }
    h += weightSVG(W[i], cx + w / 2, base, 'w' + i); cx += w + 3;
  }
  // tray on the table front
  h += `<rect x="20" y="366" width="480" height="36" rx="6" fill="#121a28" stroke="#26324a" stroke-width="1.4"/><text x="26" y="376" font-size="7" fill="#8b96ad">набор гирь, г</text>`;
  W.forEach((m, i) => {
    const x = 50 + i * 52;
    if (S.pan.includes(i)) h += `<rect x="${x - 10}" y="388" width="20" height="5" rx="2" fill="#0b1019"/>`;
    else h += weightSVG(m, x, 398, 'w' + i);
  });
  return h;
}

// ---------- lesson 2: three instruments ----------
const cylY = v => 340 - v * 1.3;
const thY = v => 290 - (v + 20) * 3.4;
const SP = { x: 260, y: 215, R: 130 };
const spA = v => (210 - v / 160 * 240) * Math.PI / 180;

function cylSVG(v) {
  const I = L().insts[0], c = priceOf(I);

  const yl = cylY(v);

  for (let x = 0; x <= I.max; x += c) {
    const y = cylY(x), big = x % I.label === 0;
    h += `<path d="M217 ${y.toFixed(1)}h${big ? 24 : 12}" stroke="#e8ecf4" stroke-width="${big ? 1.3 : 0.8}" opacity=".85"/>`;
    if (big && x > 0) h += `<text x="246" y="${(y + 3.2).toFixed(1)}" font-size="10" fill="#e8ecf4">${x}</text>`;
  }
  const d = 'M209 64L215 70V340H305V70L311 64';
  h += `<path d="M215 70V340H305V70Z" fill="${GLASS}"/>` + ol(d, 'none', GLASS_S, 2.4);
  h += ol('M200 340h120v10q0 6-6 6H206q-6 0-6-6z', '#3a4762', '#56627d', 1.6);
  h += `<path d="M292 80V330" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/><text x="296" y="84" font-size="9" fill="#8b96ad" text-anchor="end">мл</text>`;
  return h;
}
function thermoSVG(v) {
  const I = L().insts[1], c = priceOf(I);
  let h = `<rect x="214" y="38" width="92" height="262" rx="8" fill="#e7dcb8" stroke="${INK}" stroke-width="1.6"/>`;
  for (let x = I.min; x <= I.max; x += c) {

const scene = $('#scene');

// fit the scene: 520 × 405 units, centred, bench at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {

  const s = Math.min(w / 500, hh / 410, 1.7);

// ---------- pointer: drag the ruler, drag a scale pointer, tap things ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const cl = e.target.closest('[data-click]');
  if (cl) { e.preventDefault(); drag = { click: cl.dataset.click, x: e.clientX, y: e.clientY, moved: false }; return; }
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const id = el.dataset.drag; e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const p = toSvg(e);
  if (id === 'ruler') drag = { id, dx: S.rx - p.x, x: e.clientX, y: e.clientY, moved: false };
  else if (id === 'lvl') { drag = { id, moved: true }; setFromPointer(p); }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.click) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true; return; }
  const p = toSvg(e);
  if (drag.id === 'ruler') {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 3) drag.moved = true;
    if (!drag.moved) return;
    setRuler(p.x + drag.dx);
  } else if (drag.id === 'lvl') setFromPointer(p);
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (!cancel && d.click && !d.moved) tap(d.click);
  dirty = true;
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function setRuler(x) {
  let rx = clamp(x, X0 - 25 * K, X0 + 25 * K);
  if (Math.abs(rx - X0) < 2.5) rx = X0;
  if (rx !== S.rx) { const was = aligned(); S.rx = rx; if (!was && aligned()) toast('Ноль линейки совпал с концом предмета.'); update(); }
}
function setFromPointer(p) {
  const I = INST(); let v;
  if (I.id === 'cyl') v = (340 - p.y) / 1.3;
  else if (I.id === 'thermo') v = (290 - p.y) / 3.4 - 20;
  else { let a = Math.atan2(SP.y - p.y, p.x - SP.x) * 180 / Math.PI; if (a < -90) a += 360; v = (210 - a) / 240 * 160; }
  v = Math.round(clamp(v, I.min, I.max));
  const c = priceOf(I), nt = Math.round(v / c) * c;
  if (c >= 5 && Math.abs(v - nt) <= 1) v = nt;
  setVal(v);
}
function setVal(v) {
  const I = INST(); v = clamp(v, I.min, I.max);
  if (v === S.val[I.id]) return;
  S.val[I.id] = v;
  if (v === I.target && !S.hit[I.id]) { S.hit[I.id] = true; if (Object.keys(S.hit).length < 3) toast(`${I.name}: точно ${I.target} ${I.unit}. Отлично!`); }
  update();
}

function tap(id) {
  if (id === 'sw') return act('sw');
  if (id[0] === 'w') {
    const i = +id.slice(1), k = S.pan.indexOf(i);
    if (k >= 0) S.pan.splice(k, 1); else S.pan.push(i);
    if (panMass() === L().apple && !S.got.mass) { S.got.mass = true; toast(`Равновесие! Масса яблока равна массе гирь: ${L().apple} г.`); }
    update(); return;
  }
  if (id.startsWith('card')) { S.card = +id.slice(4); update(); }
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = !!S.hl;
  if (LID() === 'units' && S.st === 'time') anim = true;            // the pendulum is the experiment itself
  if (LID() === 'units' && S.st === 'mass') {
    const target = -clamp((L().apple - panMass()) / 40, -1, 1) * 9;
    const nt = reduce ? target : S.tilt + (target - S.tilt) * Math.min(1, dt * 5);
    if (Math.abs(nt - S.tilt) > 0.01) { anim = true; S.tilt = nt; } else S.tilt = target;
  }
  if (S.sw.run && t - lastMeter > 60) { renderMeter(model()); lastMeter = t; }
  if (dirty || anim) { drawScene(t); dirty = false; }
}
let lastMeter = 0;

// ---------- UI ----------
let toastT = 0;

  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed, cls) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}${cls ? ` class="${cls}"` : ''}>${label}</button>`;

    if (S.st === 'time') h += B('sw', S.sw.run ? 'Стоп' : 'Старт') + B('swReset', 'Сброс') + B('recTime', 'Записать', undefined, 'rec');
    if (S.st === 'mass') h += B('panClear', 'Снять все гири');
  }
  if (id === 'scale') h = L().insts.map(I => B('in-' + I.id, I.name + (S.hit[I.id] ? ' ✓' : ''), S.inst === I.id)).join('') + sep + B('v-1', '▼') + B('v+1', '▲');

function act(a) {
  const id = LID();
  if (a.startsWith('st-')) { S.st = a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('rd')) {
    const step = a === 'rd-' ? -price() : a === 'rd+' ? price() : +a.slice(2);
    S.read = clamp(Math.round((S.read + step) / price()) * price(), 0, RULER_MM); update(); return;
  }
  if (a === 'recLen' || a === 'recErr') return record();
  if (a === 'sw') {
    const now = performance.now();
    if (S.sw.run) { S.sw.el += (now - S.sw.t0) / 1000; S.sw.run = false; S.sw.t0 = now; }
    else { if (!S.sw.first) S.sw.first = now; S.sw.run = true; S.sw.t0 = now; }
    renderTools(); buildScheme(); update(); return;
  }
  if (a === 'swReset') { S.sw = { run: false, t0: 0, el: 0, first: 0 }; renderTools(); buildScheme(); update(); return; }
  if (a === 'recTime') {
    if (S.sw.run) { toast('Сначала остановите секундомер.'); return; }
    if (!S.sw.el) { toast('Секундомер ещё не запускали.'); return; }
    if (Math.abs(S.sw.el - 10 * T_P) > 0.5) { toast('Это не 10 полных колебаний. Нажмите «Сброс» и запускайте секундомер, когда шарик в крайнем положении.'); return; }
    S.tRec = S.sw.el; toast(`Записано: 10 колебаний за ${fmt(S.tRec, 2)} с.`); renderTools(); update(); return;
  }
  if (a === 'panClear') { S.pan = []; update(); return; }
  if (a.startsWith('in-')) { S.inst = a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 'v-1' || a === 'v+1') return setVal(S.val[S.inst] + (a === 'v-1' ? -1 : 1));
  if (a.startsWith('ru-')) { S.rul = a.slice(3); S.read = Math.round(S.read / price()) * price(); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('f-')) {
    const f = +a.slice(2), c = L().cards[S.card];
    if (S.solved[S.card]) { toast('Эта карточка уже переведена. Выберите другую.'); return; }
    if (Math.abs(f - c.f) < 1e-12) {
      S.solved[S.card] = true;
      const nx = L().cards.findIndex((k, i) => !S.solved[i]);
      if (nx >= 0) { toast(`Верно: ${num(c.v)} ${c.u} = ${num(c.v * c.f)} ${c.to}.`); }
      update();
      if (nx >= 0) setTimeout(() => { if (LID() === 'si' && S.solved[S.card]) { S.card = nx; update(); } }, reduce ? 0 : 900);
    } else toast('Не тот множитель. ' + c.q);
    return;
  }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

function record() {
  const o = L().obj, c = price();

  if (S.read === 0) { toast('Выставьте показание кнопками − и +.'); return; }

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'units') return [t(m.len, 'Длина'), t(m.time, 'Время'), t(m.mass, 'Масса')].join(' · ');
  if (id === 'scale') return L().insts.map(I => t(S.hit[I.id], I.name)).join(' · ');
  if (id === 'error') return [t(m.cm, 'Линейка в см'), t(m.mm, 'в мм')].join(' · ');
  return `Переведено ${m.n} из ${L().cards.length}`;
}

// Scheme tab: built once per lesson/station, then values refreshed (sliders keep focus while dragging)
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  const lenCtl = () => slider('inShift', 'Сдвиг нуля линейки', -25, 25, 0.5, (S.rx - X0) / K) + slider('inRead', 'Ваше показание', 0, RULER_MM, price(), S.read) +
    `<div class="row"><button class="ghostbtn" data-a="${id === 'units' ? 'recLen' : 'recErr'}">Записать</button></div>`;
  if (id === 'units') {
    h = `<h2>Три прибора — три величины</h2><div class="ctl"><div class="lbl">Прибор</div><div class="chips" id="stChips">${[['len', 'Линейка'], ['time', 'Секундомер'], ['mass', 'Весы']].map(([k, n]) => `<button data-s="${k}" aria-pressed="${S.st === k}">${n}</button>`).join('')}</div></div>`;
    if (S.st === 'len') h += `<dl class="reads"><div><dt>ноль</dt><dd id="r1"></dd></div><div><dt>показание</dt><dd id="r2"></dd></div><div><dt>цена дел.</dt><dd>1 мм</dd></div></dl>` + lenCtl();
    if (S.st === 'time') h += `<dl class="reads"><div><dt>t</dt><dd id="r1"></dd></div><div><dt>колебаний</dt><dd id="r2"></dd></div><div><dt>записано</dt><dd id="r3"></dd></div></dl>
      <div class="row"><button class="ghostbtn" data-a="sw">${S.sw.run ? 'Стоп' : 'Старт'}</button><button class="ghostbtn" data-a="swReset">Сброс</button><button class="ghostbtn" data-a="recTime">Записать</button></div>
      <p class="note" style="margin-top:12px">Запускайте секундомер, когда шарик в крайнем положении, и останавливайте, когда он вернётся туда в десятый раз.</p>`;
    if (S.st === 'mass') h += `<dl class="reads"><div><dt>гири</dt><dd id="r1"></dd></div><div><dt>весы</dt><dd id="r2"></dd></div><div><dt>гирь</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Гири (нажмите, чтобы положить или снять)</div><div class="chips" id="wChips">${L().weights.map((w, i) => `<button data-i="${i}">${w} г</button>`).join('')}</div></div>`;
  }
  if (id === 'scale') h = `<h2>Шкала прибора</h2><div class="ctl"><div class="lbl">Прибор</div><div class="chips" id="inChips">${L().insts.map(I => `<button data-s="${I.id}">${I.name}</button>`).join('')}</div></div>
      <dl class="reads"><div><dt>подписи через</dt><dd id="r1"></dd></div><div><dt>делений</dt><dd id="r2"></dd></div><div><dt>цель</dt><dd id="r3"></dd></div></dl>
      <div class="row"><button class="ghostbtn" data-a="v-1">▼ на 1</button><button class="ghostbtn" data-a="v+1">▲ на 1</button></div>
      <p class="note" style="margin-top:12px">Цифрового табло нет: показание читают только по шкале. Цену деления можно проверить на вкладке «Расчёты».</p>`;
  if (id === 'error') h = `<h2>Две линейки</h2><div class="ctl"><div class="lbl">Линейка</div><div class="chips" id="ruChips"><button data-s="cm">Цена деления 1 см</button><button data-s="mm">Цена деления 1 мм</button></div></div>
      <dl class="reads"><div><dt>ноль</dt><dd id="r1"></dd></div><div><dt>показание</dt><dd id="r2"></dd></div><div><dt>погрешность</dt><dd id="r3"></dd></div></dl>` + lenCtl();
  if (id === 'si') h = `<h2>Карточки</h2><div class="ctl"><div class="lbl">Величина</div><div class="chips" id="cardChips">${L().cards.map((c, i) => `<button data-i="${i}">${num(c.v)} ${c.u}</button>`).join('')}</div></div>
      <div class="ctl"><div class="lbl">Множитель</div><div class="chips" id="fChips">${L().factors.map(f => `<button data-a="f-${f}">× ${fmtF(f)}</button>`).join('')}</div></div>
      <dl class="reads"><div><dt>величина</dt><dd id="r1"></dd></div><div><dt>в СИ</dt><dd id="r2"></dd></div><div><dt>готово</dt><dd id="r3"></dd></div></dl>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inShift', e => setRuler(X0 + +e.target.value * K));
  on('#inRead', e => { S.read = +e.target.value; update(); });
  el.querySelectorAll('#stChips button').forEach(b => b.onclick = () => act('st-' + b.dataset.s));
  el.querySelectorAll('#inChips button').forEach(b => b.onclick = () => act('in-' + b.dataset.s));
  el.querySelectorAll('#ruChips button').forEach(b => b.onclick = () => act('ru-' + b.dataset.s));
  el.querySelectorAll('#wChips button').forEach(b => b.onclick = () => tap('w' + b.dataset.i));
  el.querySelectorAll('#cardChips button').forEach(b => b.onclick = () => tap('card' + b.dataset.i));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const lenUpd = () => {
    set('#r1', m.aligned ? 'совпал' : 'сдвинут'); set('#r2', cmText(S.read));
    set('#inShiftO', fmt((S.rx - X0) / K, 1) + ' мм'); set('#inReadO', cmText(S.read)); val('#inShift', (S.rx - X0) / K); val('#inRead', S.read);
  };
  if (id === 'units') {
    if (S.st === 'len') lenUpd();
    if (S.st === 'time') { set('#r1', fmt(m.t, 2) + ' с'); set('#r2', String(swings())); set('#r3', S.tRec != null ? fmt(S.tRec, 2) + ' с' : '—'); }
    if (S.st === 'mass') {
      set('#r1', m.mR + ' г'); set('#r2', m.mR === m.mL ? 'равновесие' : m.mR < m.mL ? 'тяжелее яблоко' : 'тяжелее гири'); set('#r3', String(S.pan.length));
      el.querySelectorAll('#wChips button').forEach(b => b.setAttribute('aria-pressed', S.pan.includes(+b.dataset.i)));
    }
  }
  if (id === 'scale') {
    const I = m.I; set('#r1', `${I.label} ${I.unit}`); set('#r2', String(I.div)); set('#r3', `${I.target} ${I.unit}${S.hit[I.id] ? ' ✓' : ''}`);
    el.querySelectorAll('#inChips button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.s === S.inst); const J = L().insts.find(x => x.id === b.dataset.s); b.textContent = J.name + (S.hit[J.id] ? ' ✓' : ''); });
  }
  if (id === 'error') {
    lenUpd(); set('#r3', S.rul === 'cm' ? '± 0,5 см' : '± 0,05 см');
    el.querySelectorAll('#ruChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === S.rul));
    const r = el.querySelector('#inRead'); if (r && +r.step !== price()) { r.step = price(); }
  }
  if (id === 'si') {
    const c = m.card; set('#r1', `${num(c.v)} ${c.u}`); set('#r2', S.solved[S.card] ? `${num(c.v * c.f)} ${c.to}` : `? ${c.to}`); set('#r3', `${m.n} / ${L().cards.length}`);
    el.querySelectorAll('#cardChips button').forEach(b => { const i = +b.dataset.i; b.setAttribute('aria-pressed', i === S.card); b.textContent = `${num(L().cards[i].v)} ${L().cards[i].u}${S.solved[i] ? ' ✓' : ''}`; });
  }
}

  const id = LID();

  const len = () => [
    { id: 'ruler', icon: ICON.ruler, name: id === 'error' ? (S.rul === 'cm' ? 'Линейка с ценой деления 1 см' : 'Линейка с ценой деления 1 мм') : 'Линейка', spec: 'Длиной 15 см. Ноль стоит не у самого края — край линейки стирается, поэтому отсчёт начинают от штриха «0».' },
    { id: 'obj', icon: o.name === 'карандаш' ? ICON.pencil : ICON.bolt, name: o.name === 'карандаш' ? 'Карандаш' : 'Болт', spec: 'Длину измеряют от одного конца до другого. Ноль линейки — точно напротив левого конца.' },
    { id: 'lens', icon: ICON.lens, name: 'Лупа', spec: 'Увеличивает место у правого конца предмета, чтобы найти ближайший штрих. Смотреть на шкалу нужно прямо, а не сбоку.' }];
  if (id === 'units') {

    if (S.st === 'time') return [
      { id: 'pend', icon: ICON.pend, name: 'Маятник', spec: 'Шарик на нити длиной 1 м. Полное колебание — путь от крайнего положения туда и обратно.' },
      { id: 'stand', icon: ICON.stand, name: 'Штатив', spec: 'Держит нить неподвижно, чтобы точка подвеса не качалась.' },
      { id: 'sw', icon: ICON.sw, name: 'Секундомер', spec: 'Показывает время с точностью до 0,01 с, но наша реакция — около 0,2 с. Поэтому меряют сразу 10 колебаний.' }];
    return [
      { id: 'balance', icon: ICON.balance, name: 'Рычажные весы', spec: 'Коромысло с двумя чашами. Когда массы на чашах равны, стрелка стоит на нуле.' },
      { id: 'apple', icon: ICON.apple, name: 'Яблоко', spec: 'Взвешиваемое тело кладут на левую чашу, гири — на правую.' },
      { id: 'weights', icon: ICON.weights, name: 'Набор гирь', spec: `${L().weights.join(', ')} г. Начинают с крупной гири и спускаются к мелким.` }];
  }
  if (id === 'scale') {
    const I = INST();
    return [
      { id: 'inst', icon: ICON[I.id], name: I.name, spec: { cyl: 'Стеклянный цилиндр со шкалой, мерит объём жидкости до 200 мл. Уровень читают по нижнему краю вогнутой поверхности воды.', thermo: 'Жидкостный термометр от −20 до 50 °C. Столбик подкрашенной жидкости растёт при нагревании.', speed: 'Стрелочный прибор, показывает скорость машины от 0 до 160 км/ч.' }[I.id] },
      { id: 'labels', icon: ICON.labels, name: 'Подписанные штрихи', spec: `Подписи идут через каждые ${I.label} ${I.unit}.` },
      { id: 'ptr', icon: ICON.ptr, name: I.id === 'cyl' ? 'Уровень воды' : I.id === 'thermo' ? 'Столбик' : 'Стрелка', spec: 'По нему читают показание. Тяните его или жмите ▼ ▲.' }];
  }
  if (id === 'error') return len().concat([{ id: 'band', icon: ICON.band, name: 'Интервалы', spec: 'После записи над болтом появляется отрезок «показание ± погрешность». Настоящая длина лежит где-то внутри.' }]);
  return [
    { id: 'prefix', icon: ICON.prefix, name: 'Приставки', spec: 'кило- (к) = 1000, санти- (с) = 0,01, милли- (м) = 0,001. Приставка — просто множитель.' },
    { id: 'base', icon: ICON.base, name: 'Основные единицы', spec: 'Метр (м), килограмм (кг), секунда (с). Обрати внимание: основная единица массы уже с приставкой «кило».' },
    { id: 'card', icon: ICON.card, name: 'Карточка', spec: 'Величина, которую надо перевести в СИ.' },
    { id: 'deck', icon: ICON.deck, name: 'Колода', spec: 'Шесть величин. Готовые отмечены зелёной галочкой.' }];
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на столе</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'units') {
    let h = `<h2>Как считать</h2>`;
    if (S.st === 'len') {
      h += `<div class="formula">L = отметка конца − отметка начала</div><h3>Сейчас</h3><div class="steps">` +
        step('начало (ноль линейки)', m.aligned ? '0 см' : 'ноль сдвинут — подвиньте линейку') + step('ваше показание', cmText(S.read)) +
        step('L', m.aligned ? `${cmText(S.read)} − 0 = ${cmText(S.read)}` : '—', 'sum') + `</div>`;
      if (S.rec.len != null) h += `<p class="note" style="margin-top:10px">В СИ: ${fmt(S.rec.len / 10, 1)} см = ${fmt(S.rec.len / 1000, 4)} м.</p>`;
    }
    if (S.st === 'time') {
      const t = S.tRec != null ? S.tRec : m.t;
      h += `<div class="formula">T = t / N</div><p class="note">T — период, время одного полного колебания; N — число колебаний.</p><h3>${S.tRec != null ? 'Записано' : 'Сейчас на секундомере'}</h3><div class="steps">` +
        step('t', fmt(t, 2) + ' с') + step('N', '10') + step('T', `${fmt(t, 2)} / 10 = ${fmt(t / 10, 3)} с`, 'sum') + `</div>
        <p class="note" style="margin-top:10px">Ошибка реакции около 0,2 с делится на 10 — так 10 колебаний дают в 10 раз точнее, чем одно.</p>`;
    }
    if (S.st === 'mass') {
      const W = S.pan.map(i => L().weights[i]).sort((a, b) => b - a);
      h += `<div class="formula">m(тела) = сумма масс гирь</div><p class="note">Работает, только когда весы в равновесии.</p><h3>На правой чаше</h3><div class="steps">` +
        step('гири', W.length ? W.join(' + ') + ' г' : 'пусто') + step('сумма', m.mR + ' г') +
        step('весы', m.mR === m.mL ? `равновесие: m = ${m.mR} г = ${fmt(m.mR / 1000, 3)} кг` : m.mR < m.mL ? 'тяжелее яблоко — добавьте гирю' : 'тяжелее гири — снимите лишнюю', 'sum') + `</div>`;
    }
    return h + `<h3>Единицы СИ</h3><div class="steps">` + step('длина', 'метр, м') + step('время', 'секунда, с') + step('масса', 'килограмм, кг') + `</div>`;
  }
  if (id === 'scale') {
    const I = m.I, c = m.c, a = Math.floor(I.target / I.label) * I.label, k = (I.target - a) / c;
    return `<h2>Цена деления</h2><div class="formula">c = (b − a) / n</div><p class="note">a и b — соседние подписанные штрихи, n — число делений между ними.</p><h3>${I.name}</h3><div class="steps">` +
      step('a и b', `${a < 0 ? '−' + -a : a} и ${a + I.label} ${I.unit}`) + step('n', `${I.div} делений`) + step('c', `(${a + I.label} − ${a < 0 ? '(−' + -a + ')' : a}) / ${I.div} = ${c} ${I.unit}`, 'sum') + `</div>
      <h3>Как попасть в цель</h3><div class="steps">` + step('ближайшая подпись снизу', `${a} ${I.unit}`) + step('ещё делений', `(${I.target} − ${a}) / ${c} = ${k}`) + step('цель', `${a} + ${k} × ${c} = ${I.target} ${I.unit}`, 'sum') + `</div>`;
  }
  if (id === 'error') {
    const row = (k, cc, d) => S.rec[k] == null ? step(cc === 10 ? 'линейка в см' : 'линейка в мм', 'ещё не записано') :
      step(cc === 10 ? 'в см' : 'в мм', `L = ${cc === 10 ? fmt(S.rec[k] / 10, 0) : fmt(S.rec[k] / 10, 1)} ± ${d} см`) +
      step('интервал', `от ${fmt((S.rec[k] - cc / 2) / 10, 2)} до ${fmt((S.rec[k] + cc / 2) / 10, 2)} см`) +
      step('отн. погрешность', `${d} / ${fmt(S.rec[k] / 10, cc === 10 ? 0 : 1)} × 100 % ≈ ${fmt(cc / 2 / S.rec[k] * 100, 1)} %`, 'sum');
    return `<h2>Погрешность</h2><div class="formula">L = a ± Δ,  Δ = c / 2</div><p class="note">a — показание, c — цена деления, Δ — абсолютная погрешность. Относительная погрешность ε = Δ / a · 100 %.</p>
      <h3>Сейчас</h3><div class="steps">` + step('цена деления c', S.rul === 'cm' ? '1 см' : '1 мм = 0,1 см') + step('Δ = c / 2', S.rul === 'cm' ? '0,5 см' : '0,05 см') + step('показание a', cmText(S.read)) + `</div>
      <h3>Результаты</h3><div class="steps">` + row('cm', 10, '0,5') + row('mm', 1, '0,05') + `</div>
      <p class="note" style="margin-top:10px">Миллиметровая линейка в 10 раз точнее: её интервал в 10 раз короче.</p>`;
  }
  const c = m.card, ok = S.solved[S.card];
  return `<h2>Перевод в СИ</h2><div class="formula">величина × множитель</div><h3>${num(c.v)} ${c.u} → ${c.to}</h3><div class="steps">` +
    (ok ? step('множитель', `1 ${c.u} = ${fmtF(c.f).replace('.', ',')} ${c.to}`) + step('результат', `${num(c.v)} × ${fmtF(c.f)} = ${num(c.v * c.f)} ${c.to}`, 'sum')
        : step('подсказка', c.q) + step('результат', 'выберите множитель', 'sum')) + `</div>
    <h3>Шпаргалка</h3><div class="steps">` + step('1 км', '1000 м') + step('1 см', '0,01 м') + step('1 мм', '0,001 м') + step('1 г', '0,001 кг') + step('1 т', '1000 кг') + step('1 мин', '60 с') + step('1 ч', '3600 с') + `</div>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'units' && S.st === 'len' || id === 'error') {
    const o = L().obj, rec = id === 'units' ? S.rec.len != null : S.rec[S.rul] != null;
    el.innerHTML = `<div class="k">Длина ${o.gen}</div><div class="v ${rec ? 'ok' : ''}">L = ${id === 'error' ? cmText(S.read).replace(' см', '') + (S.rul === 'cm' ? ' ± 0,5' : ' ± 0,05') + ' см' : cmText(S.read)}</div>
      <div class="lr"><span>ноль</span><span class="${m.aligned ? 'ok' : 'bad'}">${m.aligned ? 'совпал' : 'сдвинут'}</span></div>`;
  } else if (id === 'units' && S.st === 'time') {
    el.innerHTML = `<div class="k">Секундомер</div><div class="v ${S.tRec != null ? 'ok' : ''}">t = ${fmt(m.t, 2)} с</div><div class="lr"><span>колебаний</span><span>${swings()}</span></div>`;
  } else if (id === 'units') {
    const st = m.mR === m.mL ? ['равновесие', 'ok'] : m.mR < m.mL ? ['тяжелее яблоко', 'bad'] : ['тяжелее гири', 'bad'];
    el.innerHTML = `<div class="k">Гири на чаше</div><div class="v ${m.mass ? 'ok' : ''}">${m.mR} г</div><div class="lr"><span>весы</span><span class="${st[1]}">${st[0]}</span></div>`;
  } else if (id === 'scale') {
    el.innerHTML = `<div class="k">${m.I.name}</div><div class="v ${S.hit[m.I.id] ? 'ok' : ''}">цель ${m.I.target} ${m.I.unit}</div><div class="lr"><span>табло</span><span>нет</span></div><div class="lr"><span>готово</span><span>${m.n}/3</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Перевод в СИ</div><div class="v ${m.n === 6 ? 'ok' : ''}">${m.n} / 6</div><div class="lr"><span>карточка</span><span>${num(m.card.v)} ${m.card.u}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы умеете измерять!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  units: '<rect x="4" y="17" width="26" height="8" rx="1" fill="#e7dcb8"/><path d="M7 17v3M11 17v2M15 17v3M19 17v2M23 17v3M27 17v2" stroke="#1d2433" stroke-width=".8"/><circle cx="40" cy="15" r="7" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><path d="M40 15v-4" stroke="#86e0a8" stroke-width="1.3"/><path d="M50 10h12M56 10v12M52 22h8" stroke="#e8ecf4" stroke-width="1.1"/><path d="M48 15q2 3 4 0M60 15q2 3 4 0" fill="none" stroke="#ffb547" stroke-width="1.1"/>',
  scale: '<path d="M20 4v22h12V4" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><rect x="21" y="14" width="10" height="12" fill="#5fb4d9" opacity=".5"/><path d="M21 6h5M21 9h3M21 12h3M21 15h5M21 18h3M21 21h3M21 24h5" stroke="#e8ecf4" stroke-width=".6"/><path d="M38 24A10 10 0 1 1 58 24" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><path d="M48 23l5-7" stroke="#ff8a73" stroke-width="1.5"/>',
  error: '<rect x="4" y="18" width="58" height="8" rx="1" fill="#e7dcb8"/><path d="M8 18v4M18 18v4M28 18v4M38 18v4M48 18v4M58 18v4" stroke="#1d2433" stroke-width=".8"/><rect x="8" y="11" width="31" height="5" fill="#c3cbd9"/><path d="M33 8v-3h12v3" fill="none" stroke="#ffb547" stroke-width="1.2"/>',
  si: '<rect x="6" y="7" width="22" height="16" rx="3" fill="none" stroke="#ffb547" stroke-width="1.2"/><text x="17" y="18" font-size="7" fill="#e8ecf4" text-anchor="middle" font-family="monospace">см</text><path d="M31 15h6m-2-2l2 2-2 2" stroke="#8b96ad" fill="none"/><rect x="40" y="7" width="22" height="16" rx="3" fill="none" stroke="#86e0a8" stroke-width="1.2"/><text x="51" y="18" font-size="7" fill="#e8ecf4" text-anchor="middle" font-family="monospace">м</text>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'units') {
    const o = Ls.obj;
    const len = S.rec.len != null ? `длина ${o.gen} записана: ${cmText(S.rec.len)}` : `длина ${o.gen} ещё не записана (ноль линейки ${m.aligned ? 'совмещён с концом' : 'не совмещён с концом карандаша'}, выставленное показание ${cmText(S.read)}; верное ли оно — не говори, пусть ученик проверит в лупу)`;
    const tm = S.tRec != null ? `время 10 колебаний записано: ${fmt(S.tRec, 2)} с, период ${fmt(S.tRec / 10, 3)} с` : `время ещё не записано (на секундомере ${fmt(m.t, 2)} с, ${S.sw.run ? 'идёт' : 'стоит'}; маятник с нитью 1 м)`;
    const ms = S.got.mass ? `масса яблока найдена: ${Ls.apple} г` : `масса не найдена: на правой чаше гири ${m.mR} г, ${m.mR < m.mL ? 'перевешивает яблоко' : 'перевешивают гири'} (массу яблока не называй)`;
    now = `Открыт прибор: ${({ len: 'линейка', time: 'секундомер и маятник', mass: 'рычажные весы' })[S.st]}. ${len}; ${tm}; ${ms}.`;
  }
  if (id === 'scale') now = Ls.insts.map(I => { const v = S.val[I.id], c = priceOf(I), d = (v - I.target) / c; return `${I.name}: подписи через ${I.label} ${I.unit}, ${I.div} делений между ними (цена деления ${c} ${I.unit}), цель ${I.target} ${I.unit}, ${S.hit[I.id] ? 'цель достигнута' : `указатель сейчас ${Math.abs(d) < 1e-9 ? 'на цели' : d < 0 ? 'ниже цели' : 'выше цели'} примерно на ${fmt(Math.abs(d), 1)} дел.`}`; }).join('; ') + `. Открыт: ${INST().name}. Цифрового табло нет — ученик читает шкалу сам; точное текущее показание не называй.`;
  if (id === 'error') now = `Болт измеряют линейками с ценой деления 1 см и 1 мм. Сейчас линейка ${S.rul === 'cm' ? 'в см' : 'в мм'}, ноль ${m.aligned ? 'совмещён' : 'не совмещён'} с концом болта, выставлено ${cmText(S.read)}. Записано: ${S.rec.cm != null ? `в см ${fmt(S.rec.cm / 10, 0)} ± 0,5 см` : 'линейкой в см — нет'}; ${S.rec.mm != null ? `в мм ${fmt(S.rec.mm / 10, 1)} ± 0,05 см` : 'линейкой в мм — нет'}. Настоящую длину болта не называй.`;
  if (id === 'si') now = `Карточки: ${Ls.cards.map((c, i) => `${num(c.v)} ${c.u} → ${c.to} (${S.solved[i] ? 'переведено' : 'не переведено'})`).join('; ')}. Выбрана: ${num(m.card.v)} ${m.card.u}. Множители на выбор: ${Ls.factors.map(f => '×' + fmtF(f)).join(', ')}. Правильный множитель не называй, наводи вопросами.`;
  return [
    `Раздел: физика, 7 класс, тема «Измерения и единицы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на столе: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { units: 'Зачем засекать 10 колебаний, а не одно?', scale: 'Как найти цену деления?', error: 'Почему погрешность — половина цены деления?', si: 'Почему основная единица массы — килограмм, а не грамм?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
