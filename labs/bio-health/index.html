<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 9 класс: первая помощь при кровотечениях, вред курения, гигиена и режим дня.">
<title>Здоровье и первая помощь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M16 9h8v7h7v8h-7v7h-8v-7H9v-8h7Z" fill="rgba(255,138,115,.2)" stroke="var(--warn)" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 20h4l2-4 2 8 2-4h4" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Биология · Здоровье и первая помощь</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#bio">Карта</a><a href="/physics/#bio">Биология</a><a href="/labs/bio-health/" aria-current="page">Здоровье</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Здоровье</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">

    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const money = x => Math.round(x).toLocaleString('ru-RU');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-health';

// ---------- lesson 1: bleeding ----------
const BT = {
  art: { name: 'Артериальное', c: '#ff3030', rate: 5, look: 'ярко-алая кровь бьёт пульсирующей струёй, толчками в такт сердцу' },
  ven: { name: 'Венозное', c: '#7a1424', rate: 1, look: 'тёмно-вишнёвая кровь вытекает ровной непрерывной струёй' },
  cap: { name: 'Капиллярное', c: '#c8343a', rate: 0.05, look: 'кровь мелкими каплями сочится по всей поверхности ссадины' },
};
const CASES = [
  { k: 'ven', x: 372, story: 'Порезал руку осколком стекла', place: 'предплечье' },
  { k: 'art', x: 205, story: 'Глубокая рана пилой на даче', place: 'плечо' },
  { k: 'cap', x: 470, story: 'Упал с самоката, ссадина', place: 'ладонь' },
];
const ARM = { y: 236, sh: 74, el: 292, wr: 440 };
const xToCm = x => x <= ARM.el ? (x - ARM.sh) / (ARM.el - ARM.sh) * 30 : 30 + (x - ARM.el) / (ARM.wr - ARM.el) * 25;
const cmToX = c => c <= 30 ? ARM.sh + c / 30 * (ARM.el - ARM.sh) : ARM.el + (c - 30) / 25 * (ARM.wr - ARM.el);

// ---------- lesson 2: smoking ----------
const TL = [
  { t: '20 минут', d: 'пульс и давление снижаются' },
  { t: '12 часов', d: 'угарный газ в крови возвращается к норме' },
  { t: '2–12 недель', d: 'улучшаются кровообращение и работа лёгких' },
  { t: '1–9 месяцев', d: 'меньше кашля и одышки, реснички бронхов снова чистят лёгкие' },
  { t: '1 год', d: 'риск болезней сердца вдвое ниже, чем у курящего' },
  { t: '5–15 лет', d: 'риск инсульта как у некурящего' },
  { t: '10 лет', d: 'риск рака лёгких примерно вдвое ниже, чем у курящего' },
  { t: '15 лет', d: 'риск болезней сердца как у некурящего' },
];
const TLX0 = 46, TLX1 = 482, TLY = 372;
const tlx = i => TLX0 + i / (TL.length - 1) * (TLX1 - TLX0);
const SPECK = Array.from({ length: 70 }, (_, i) => { const a = Math.sin(i * 12.9898) * 43758.5453, b = Math.sin(i * 78.233) * 12543.123; return [a - Math.floor(a), b - Math.floor(b)]; });

// ---------- lesson 3: day routine ----------
const ACT = {
  sleep: { n: 'Сон', c: '#6a7dff' }, eat: { n: 'Еда', c: '#ffb547' }, hyg: { n: 'Гигиена', c: '#72d4e8' }, sport: { n: 'Движение', c: '#86e0a8' },
  home: { n: 'Уроки', c: '#b48cff' }, screen: { n: 'Экран', c: '#ff8a73' }, rest: { n: 'Отдых', c: '#46536f' }, school: { n: 'Школа', c: '#c9d3e6' },
};
const BRUSH = ['sleep', 'eat', 'hyg', 'sport', 'home', 'screen', 'rest'];
const DAYS = {
  bad: 'screen*2,sleep*12,hyg*1,rest*1,school*12,eat*1,screen*5,home*6,eat*1,screen*7',
};
const parseDay = s => s.split(',').flatMap(p => { const [k, n] = p.split('*'); return Array(+n).fill(k); });
const RC = { x: 165, y: 262, r0: 88, r1: 144 };
const hhmm = i => `${String(Math.floor(((i % 48) + 48) % 48 / 2)).padStart(2, '0')}:${i % 2 ? '30' : '00'}`;

const LESSONS = [
  { id: 'aid', title: 'Первая помощь при кровотечении',
    text: ['Первая помощь — то, что делает любой человек рядом до приезда скорой. Сначала убедитесь, что вам ничего не угрожает, потом звоните 103 (скорая) или 112 и помогайте пострадавшему. При сильном кровотечении счёт идёт на минуты: потеря трети крови опасна для жизни.',
           'Вид кровотечения узнают по цвету и по тому, как течёт кровь. Артериальное: ярко-алая кровь бьёт толчками в такт сердцу. Венозное: тёмно-вишнёвая кровь течёт ровно. Капиллярное: кровь сочится по всей поверхности ссадины и обычно скоро останавливается сама.',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetCase() {
  S.idn = false; S.tq = null; S.press = false; S.band = false; S.anti = false; S.note = null; S.call = false; S.loss = 0; S.tqP = null;
}
function resetLesson() {
  const L = LESSONS[S.lesson];
  S.mass = L.mass || 60; S.ci = 0; S.solved = [false, false, false]; S.err = 0; resetCase();
  S.cig = L.cig || 10; S.years = L.years || 1; S.price = L.price || 1000; S.quit = false; S.qi = 0; S.ansOk = false; S.ans = null;
  S.day = parseDay(DAYS[L.day || 'bad']); S.brush = 'sleep'; S.bed = 22.5; S.wake = 7; S.lastPaint = -1;
}

// ---------- models ----------
const curCase = () => CASES[Math.min(S.ci, CASES.length - 1)];
function flow() {
  const c = curCase();
  if (S.solved[S.ci] || S.ci >= CASES.length) return 0;
  if (c.k === 'art') return S.tq !== null && S.tq < c.x - 8 ? 0 : S.press ? 0.1 : 1;
  if (c.k === 'ven') return S.band ? 0 : 1;
  return S.anti ? 0 : 1;
}
const bloodV = () => S.mass * 70;
const times = n => n + (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? ' раза' : ' раз');
const hours = k => S.day.filter(x => x === k).length / 2;
function groups(k) { let n = 0; for (let i = 0; i < 48; i++) if (S.day[i] === k && S.day[(i + 47) % 48] !== k) n++; if (n === 0 && S.day.every(x => x === k)) n = 1; return n; }
function rules() {
  const h = {}; for (const k of Object.keys(ACT)) h[k] = hours(k);
  return [
    { k: 'sleep', t: 'Сон 8–10 ч', v: ru(h.sleep) + ' ч', ok: h.sleep >= 8 && h.sleep <= 10 },
    { k: 'bed', t: 'Отбой до 23:00', v: S.day[46] === 'sleep' ? 'да' : 'нет', ok: S.day[46] === 'sleep' },
    { k: 'sport', t: 'Движение ≥ 1 ч', v: ru(h.sport) + ' ч', ok: h.sport >= 1 },
    { k: 'screen', t: 'Экран ≤ 2 ч', v: ru(h.screen) + ' ч', ok: h.screen <= 2 },
    { k: 'eat', t: 'Еда 4–5 раз', v: times(groups('eat')), ok: groups('eat') >= 4 && groups('eat') <= 5 },
    { k: 'hyg', t: 'Гигиена 2 раза', v: times(groups('hyg')), ok: groups('hyg') >= 2 },
    { k: 'home', t: 'Уроки 1–3,5 ч', v: ru(h.home) + ' ч', ok: h.home >= 1 && h.home <= 3.5 },
  ];
}
const spent = () => S.cig / 20 * S.price * 365 * S.years;
const cigsTotal = () => S.cig * 365 * S.years;
const coSmoke = () => 1 + 0.45 * S.cig;
const coNow = () => !S.quit ? coSmoke() : S.qi === 0 ? 1 + 0.45 * S.cig * 0.9 : 1;
const tarDark = () => { const d = Math.min(1, S.cig / 20 * S.years / 15); return S.quit ? d * (1 - 0.3 * Math.min(1, S.qi / 5)) : d; };
function model() {
  const id = LID();
  if (id === 'aid') return { kind: 'aid', solvedN: S.solved.filter(Boolean).length, flow: flow(), loss: S.loss, pct: S.loss / bloodV() * 100 };
  if (id === 'habits') return { kind: 'habits', money: spent(), co: coNow(), ansOk: S.ansOk, quit: S.quit, qi: S.qi, tar: cigsTotal() * 10 / 1000 };
  const R = rules();
  return { kind: 'routine', R, okN: R.filter(r => r.ok).length, allOk: R.every(r => r.ok) };
}

// ---------- lesson 1 actions ----------
function identify(k) {
  const c = curCase();
  if (S.idn) return;
  if (k === c.k) { S.idn = true; toast(`Верно: ${BT[k].name.toLowerCase()} кровотечение — ${BT[k].look}.`); }
  else { S.err++; toast('Не похоже. Посмотрите ещё раз: какого цвета кровь и бьёт ли она толчками?'); }
  renderTools(); update();
}
function needId() { if (!S.idn) { toast('Сначала определите вид кровотечения.'); return true; } if (S.solved[S.ci]) { toast('Здесь помощь уже оказана. Переходите к следующему случаю.'); return true; } return false; }
function aid(a) {
  if (needId()) return;
  const c = curCase();
  if (a === 'press') {
    if (c.k === 'art') { S.press = true; toast('Артерия прижата пальцем выше раны — кровь почти остановилась. Но держать долго не получится: нужен жгут.'); }
    else { S.err++; toast('Прижимать пальцем нужно только артерию. Здесь есть способ проще.'); }
  }
  if (a === 'band') {
    if (c.k === 'ven') { S.band = true; toast('Давящая повязка прижала вену — кровотечение остановлено. Руку стоит приподнять.'); }
    else if (c.k === 'art') { S.err++; toast('Повязка не удержит артериальную струю на плече. Прижмите артерию и наложите жгут выше раны.'); }
    else { S.err++; toast('Тугая давящая повязка тут не нужна: из капилляров кровь едва сочится.'); }
  }
  if (a === 'anti') {
    if (c.k === 'cap') { S.anti = true; toast('Края ссадины обработаны, чистая повязка наложена. Капиллярное кровотечение остановлено.'); }
    else { S.err++; toast(c.k === 'art' ? 'Пока вы обрабатываете края, теряется много крови. Сначала остановите струю.' : 'Обработать края можно, но кровь из вены так не остановить. Нужна давящая повязка.'); }
  }
  if (a === 'note') {
    if (S.tq === null) { S.err++; toast('Записку кладут под жгут, а жгута пока нет.'); }
    else { const d = new Date(); S.note = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; toast(`Записка: «Жгут наложен в ${S.note}». Врач поймёт, сколько он уже держится.`); }
  }
  if (a === 'call') { S.call = true; toast('Звонок 103: что случилось, адрес, сколько пострадавших, что уже сделано.'); }
  if (a === 'untq') { S.tq = null; S.note = null; }
  afterAid();
}
function applyTq(x) {
  if (needId()) { S.tq = null; dirty = true; return; }
  const c = curCase();
  if (x > ARM.wr) { toast('Жгут на кисть не накладывают — только на плечо, предплечье, бедро или голень.'); return; }
  if (c.k !== 'art') { S.err++; toast(c.k === 'ven' ? 'Жгут при венозном кровотечении не нужен: он пережмёт и артерию. Хватит давящей повязки.' : 'Жгут из-за ссадины — опасная ошибка: рука останется без крови.'); return; }
  S.tq = x;
  if (x < c.x - 8) toast('Жгут выше раны — кровь остановилась. Не забудьте записку со временем и звонок 103.');
  else { S.err++; toast('Ниже раны жгут не поможет: по артерии кровь идёт от сердца, она приходит в рану сверху.'); }
  afterAid();
}
function afterAid() {
  const c = curCase();
  if (!S.solved[S.ci]) {
    const ok = c.k === 'art' ? S.tq !== null && S.tq < c.x - 8 && S.note && S.call : c.k === 'ven' ? S.band : S.anti;
    if (ok) { S.solved[S.ci] = true; if (S.ci < CASES.length - 1) setTimeout(() => toast(`Случай ${S.ci + 1} решён. Нажмите «Следующий случай».`), 1600); }
  }
  renderTools(); update();
}
function nextCase() { if (S.ci < CASES.length - 1 && S.solved[S.ci]) { S.ci++; resetCase(); renderTools(); buildScheme(); update(); } }

// ---------- lesson 2 actions ----------
function answer() {
  if (S.cig !== 10 || S.price !== 1000) { toast('Поставьте 10 сигарет в день и пачку за 1000 ₸ (цена — на вкладке «Схема»).'); return; }
  const m = spent();
  if (m <= 1e6) { toast(`За ${S.years} ${yrs(S.years)} — ${money(m)} ₸. Это ещё меньше миллиона.`); return; }
  if (S.cig / 20 * S.price * 365 * (S.years - 1) > 1e6) { toast('Миллион здесь уже превышен, но, может быть, это случилось раньше? Найдите наименьшее число лет.'); return; }
  S.ansOk = true; toast(`Да: за ${S.years} лет — ${money(m)} ₸. Курильщик буквально сжигает миллион.`); update();
}
const yrs = n => (n % 10 === 1 && n % 100 !== 11) ? 'год' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'года' : 'лет';
function setQi(i) { S.qi = clamp(i, 0, TL.length - 1); update(); }

// ---------- lesson 3 actions ----------
let schoolToastT = 0;
function paint(i) {
  if (S.day[i] === 'school') { if (performance.now() - schoolToastT > 2500) { schoolToastT = performance.now(); toast('С 8:00 до 14:00 — школа, её время не меняем.'); } return; }
  if (S.day[i] === S.brush) return;
  S.day[i] = S.brush; update();
}
function setSleep() {
  for (let i = 0; i < 48; i++) if (S.day[i] === 'sleep') S.day[i] = 'rest';
  const b = Math.round(S.bed * 2) % 48, w = Math.round(S.wake * 2);
  for (let i = b; i % 48 !== w; i++) { const j = i % 48; if (S.day[j] !== 'school') S.day[j] = 'sleep'; }
  update();
}

// ---------- drawing helpers ----------
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}
const lbl = (x, y, s, size = 10.5, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const mix = (a, b, k) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };

// ---------- lesson 1 scene ----------
const armHalf = x => x <= ARM.el ? 24 - (x - ARM.sh) / (ARM.el - ARM.sh) * 4 : 20 - (x - ARM.el) / (ARM.wr - ARM.el) * 5;
function aidScene(t) {
  let h = bench();
  const c = curCase(), fl = flow(), skin = '#b98a6e', skinD = '#8f6550';
  const fin = S.ci >= CASES.length - 1 && S.solved[CASES.length - 1];
  h += lbl(260, 112, fin ? 'Все три пострадавших получили помощь' : `Случай ${S.ci + 1} из 3: ${c.story.toLowerCase()} (${c.place})`, 12, fin ? '#86e0a8' : '#e8ecf4', 'middle', 'font-weight="600"');
  // torso and arm
  h += `<g data-hit="arm"><path d="M-60 150Q-10 140 40 156Q78 168 84 206L86 276Q70 300 40 304L40 430H-60Z" fill="#2a3550" stroke="#3a4866" stroke-width="2"/>`;
  const top = [], bot = [];
  for (let x = ARM.sh; x <= ARM.wr; x += 8) { top.push(`${x} ${f(ARM.y - armHalf(x))}`); bot.unshift(`${x} ${f(ARM.y + armHalf(x))}`); }
  h += `<path d="M${top.join('L')}L${ARM.wr + 4} ${ARM.y - 15}L${ARM.wr + 4} ${ARM.y + 15}L${bot.join('L')}Z" fill="${skin}" stroke="${skinD}" stroke-width="1.5"/>`;
  h += `<ellipse cx="476" cy="${ARM.y + 2}" rx="36" ry="19" fill="${skin}" stroke="${skinD}" stroke-width="1.5"/><path d="M458 ${ARM.y - 14}q8 -14 20 -12" stroke="${skinD}" stroke-width="9" stroke-linecap="round" fill="none"/>`;
  h += `<path d="M76 ${ARM.y - 26}L124 ${ARM.y - 24}L124 ${ARM.y + 24}L76 ${ARM.y + 26}Z" fill="#2f3c5c" stroke="#3a4866" stroke-width="2"/>`;
  h += `<path d="M124 ${ARM.y + 5}L${ARM.wr} ${ARM.y + 7}" stroke="#ff3030" stroke-width="3" opacity=".22"/><path d="M124 ${ARM.y - 9}L${ARM.wr} ${ARM.y - 7}" stroke="#6aa8ff" stroke-width="3" opacity=".22"/></g>`;
  h += `<path d="M150 170H112l7 -5M112 170l7 5" stroke="#8b96ad" stroke-width="1.4" fill="none"/>` + lbl(156, 174, 'к сердцу', 10.5, '#8b96ad', 'start');
  // wound
  const wx = c.x, wy = ARM.y - 4, bc = BT[c.k].c;
  if (c.k === 'cap') h += `<g data-hit="wound"><ellipse cx="${wx}" cy="${wy + 4}" rx="20" ry="9" fill="#a8474a" stroke="#d8635f" stroke-width="1"/>` + [[-10, 2], [-3, 6], [5, 1], [12, 5], [0, -1]].map(([dx, dy]) => `<circle cx="${wx + dx}" cy="${wy + dy + 2}" r="1.8" fill="${bc}"/>`).join('') + `</g>`;
  else h += `<g data-hit="wound"><ellipse cx="${wx}" cy="${wy}" rx="11" ry="4.5" fill="#4a0b14" stroke="#ff6b6b" stroke-width="1.2"/><rect x="${wx - 20}" y="${wy - 14}" width="40" height="28" fill="transparent"/></g>`;
  // puddle
  if (S.loss > 0.5) { const r = Math.min(120, 6 + Math.sqrt(S.loss) * 2.4); h += `<ellipse cx="${wx + 16}" cy="398" rx="${f(r)}" ry="${f(r * 0.16)}" fill="${bc}" opacity=".8"/>`; }
  // flow
  if (fl > 0) {
    const T = reduce ? 400 : t;
    if (c.k === 'art') {
      const beat = Math.max(0, Math.sin(T / 833 * 2 * Math.PI)), amp = fl * (0.55 + 0.45 * beat);
      for (let i = 0; i < 12; i++) { const s = ((T / 650) + i / 12) % 1; h += `<circle cx="${f(wx + s * 80 * amp)}" cy="${f(wy - s * 95 * amp + s * s * 150 * amp)}" r="${f(3.4 - s * 1.2)}" fill="${bc}"/>`; }

function placeHint() {
  const hn = $('#hint'), st = $('#stage').getBoundingClientRect(), tb = $('#tools').getBoundingClientRect();
  hn.style.visibility = LID() !== 'routine' || tb.left - st.left < st.width * 0.19 + 30 ? 'hidden' : '';
}
addEventListener('resize', placeHint);
function act(a) {
  if (!a) return;
  if (a.startsWith('id-')) return identify(a.slice(3));
  if (['press', 'band', 'anti', 'note', 'call', 'untq'].includes(a)) return aid(a);
  if (a === 'next') return nextCase();
  if (a === 'restart') { resetLesson(); renderTools(); buildScheme(); update(); return; }
  if (a === 'tqset') { const v = +($('#inTq') || {}).value || 15; if (needId()) return; return applyTq(cmToX(v)); }
  if (a === 'c-' || a === 'c+') { S.cig = clamp(S.cig + (a === 'c+' ? 1 : -1), 0, 20); update(); return; }
  if (a === 'y-' || a === 'y+') { S.years = clamp(S.years + (a === 'y+' ? 1 : -1), 0, 40); update(); return; }
  if (a === 'ans') return answer();
  if (a === 'quit') { S.quit = !S.quit; S.qi = 0; if (S.quit) toast(`${TL[0].t} без сигарет: ${TL[0].d}.`); renderTools(); update(); return; }
  if (a === 'q-' || a === 'q+') { if (S.quit) setQi(S.qi + (a === 'q+' ? 1 : -1)); return; }
  if (a.startsWith('b-')) { S.brush = a.slice(2); renderTools(); update(); return; }
  if (a === 'sleepset') return setSleep();
  if (a === 'reset') { resetLesson(); renderTools(); buildScheme(); update(); return; }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;
const dot = c => IC(`<circle cx="17" cy="17" r="11" fill="${c}" opacity=".85"/><circle cx="17" cy="17" r="4" fill="#0b1019"/>`);
const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'aid') return `Помощь оказана: ${m.solvedN} из 3 · потеря крови ${Math.round(m.loss)} мл`;
  if (m.kind === 'habits') return `Ответ про миллион: ${m.ansOk ? '✓' : '—'} · бросил курить: ${m.quit ? '✓' : '—'} · риск сердца вдвое ниже: ${m.quit && m.qi >= 4 ? '✓' : '—'}`;
  return `Выполнено норм: ${m.okN} из ${m.R.length}`;
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'aid') h = `<h2>Пострадавший и аптечка</h2>` + slider('inMass', 'Масса тела, кг', 30, 100, 1, S.mass) +
    `<dl class="reads"><div><dt>Крови в теле</dt><dd id="r1"></dd></div><div><dt>Потеряно</dt><dd id="r2"></dd></div><div><dt>Доля</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Вид кровотечения</div><div class="chips" id="idChips">${['art', 'ven', 'cap'].map(k => `<button data-k="${k}">${BT[k].name}</button>`).join('')}</div></div>
    <div class="ctl"><div class="lbl">Помощь</div><div class="chips" id="aidChips"><button data-a="press">Прижать пальцем</button><button data-a="band">Давящая повязка</button><button data-a="anti">Обработать и забинтовать</button><button data-a="note">Записка</button><button data-a="call">Позвонить 103</button><button data-a="untq">Снять жгут</button></div></div>` +
    slider('inTq', 'Жгут: место на руке, см от плечевого сустава', 2, 52, 1, S.tq !== null ? Math.round(xToCm(S.tq)) : 10) +
    `<p class="note">Рана сейчас в ${Math.round(xToCm(curCase().x))} см от плечевого сустава. Локоть — 30 см.</p>
    <div class="row"><button class="ghostbtn" data-a="tqset">Наложить жгут сюда</button><button class="ghostbtn" data-a="next">Следующий случай</button></div>`;
  if (id === 'habits') h = `<h2>Модель курильщика</h2>` + slider('inCig', 'Сигарет в день', 0, 20, 1, S.cig) + slider('inYears', 'Сколько лет курит', 0, 40, 1, S.years) + slider('inPrice', 'Цена пачки (20 шт.), ₸', 500, 2000, 50, S.price) +
    `<dl class="reads"><div><dt>Потрачено</dt><dd id="r1"></dd></div><div><dt>Смолы</dt><dd id="r2"></dd></div><div><dt>CO в крови</dt><dd id="r3"></dd></div></dl>
    <div class="row"><button class="ghostbtn" data-a="ans">Это ответ</button><button class="ghostbtn" data-a="quit">Бросить / снова курить</button></div>` +
    slider('inQi', 'Без сигарет (шаг шкалы)', 0, TL.length - 1, 1, S.qi) + `<p class="note" id="qiNote"></p>`;
  if (id === 'routine') h = `<h2>Режим дня</h2>
    <div class="ctl"><div class="lbl">Кисть</div><div class="chips" id="brChips">${BRUSH.map(k => `<button data-k="${k}">${ACT[k].n}</button>`).join('')}</div></div>
    <h3>Быстро поставить сон</h3>` + slider('inBed', 'Отбой', 20, 25, 0.5, S.bed) + slider('inWake', 'Подъём', 5, 8, 0.5, S.wake) +
    `<div class="row"><button class="ghostbtn" data-a="sleepset">Поставить сон</button><button class="ghostbtn" data-a="reset">Вернуть исходный день</button></div>
    <dl class="reads"><div><dt>Сон</dt><dd id="r1"></dd></div><div><dt>Экран</dt><dd id="r2"></dd></div><div><dt>Движение</dt><dd id="r3"></dd></div></dl>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', e => fn(+e.target.value)); };
  on('#inMass', v => { S.mass = v; update(); });
  on('#inTq', v => { const o = el.querySelector('#inTqO'); if (o) o.textContent = v + ' см'; });
  on('#inCig', v => { S.cig = v; update(); });
  on('#inYears', v => { S.years = v; update(); });
  on('#inPrice', v => { S.price = v; update(); });
  on('#inQi', v => { if (!S.quit) { toast('Сначала нажмите «Бросить курить».'); el.querySelector('#inQi').value = 0; return; } setQi(v); });
  on('#inBed', v => { S.bed = v; updateScheme(model()); });
  on('#inWake', v => { S.wake = v; updateScheme(model()); });
  el.querySelectorAll('#idChips button').forEach(b => b.onclick = () => identify(b.dataset.k));
  el.querySelectorAll('#aidChips button').forEach(b => b.onclick = () => aid(b.dataset.a));
  el.querySelectorAll('#brChips button').forEach(b => b.onclick = () => act('b-' + b.dataset.k));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (s, fn) => el.querySelectorAll(s).forEach(b => b.setAttribute('aria-pressed', fn(b)));
  if (m.kind === 'aid') {
    set('#inMassO', S.mass + ' кг'); val('#inMass', S.mass);
    const tq = el.querySelector('#inTq'); if (tq) set('#inTqO', tq.value + ' см');
    set('#r1', money(bloodV()) + ' мл'); set('#r2', Math.round(m.loss) + ' мл'); set('#r3', ru(m.pct) + ' %');
    press('#idChips button', b => S.idn && b.dataset.k === curCase().k);
    press('#aidChips button', b => ({ press: S.press, band: S.band, anti: S.anti, note: !!S.note, call: S.call, untq: false })[b.dataset.a]);
  } else if (m.kind === 'habits') {
    set('#inCigO', S.cig + ' шт.'); val('#inCig', S.cig); set('#inYearsO', S.years + ' ' + yrs(S.years)); val('#inYears', S.years); set('#inPriceO', money(S.price) + ' ₸'); val('#inPrice', S.price);
    set('#inQiO', S.quit ? TL[S.qi].t : 'курит'); val('#inQi', S.quit ? S.qi : 0);
    set('#qiNote', S.quit ? `${TL[S.qi].t} без сигарет: ${TL[S.qi].d}.` : 'Шкала откроется, когда человек бросит курить.');
    set('#r1', money(m.money) + ' ₸'); set('#r2', money(m.tar) + ' г'); set('#r3', ru(m.co) + ' %');
  } else {
    set('#inBedO', hhmm(Math.round(S.bed * 2))); val('#inBed', S.bed); set('#inWakeO', hhmm(Math.round(S.wake * 2))); val('#inWake', S.wake);
    set('#r1', ru(hours('sleep')) + ' ч'); set('#r2', ru(hours('screen')) + ' ч'); set('#r3', ru(hours('sport')) + ' ч');
    press('#brChips button', b => b.dataset.k === S.brush);
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${{ aid: 'Что на столе', habits: 'Что на столе', routine: 'Что на циферблате' }[L.id]}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'aid') h += `<h3>Три вида кровотечений</h3><div class="feat"><div style="border-left-color:#ff3030"><b>Артериальное</b>Алая кровь, бьёт толчками. Прижать артерию пальцем, жгут выше раны, записка, 103.</div><div style="border-left-color:#7a1424"><b>Венозное</b>Тёмная кровь, течёт ровно. Давящая повязка, конечность приподнять.</div><div style="border-left-color:#c8343a"><b>Капиллярное</b>Кровь сочится по всей ране. Обработать края антисептиком, чистая повязка.</div></div><h3>Если человек без сознания</h3><div class="feat"><div style="border-left-color:#72d4e8"><b>Проверить дыхание</b>Запрокинуть голову, 10 секунд смотреть, слушать, чувствовать дыхание.</div><div style="border-left-color:#ffb547"><b>Дышит</b>Устойчивое положение на боку, звонок 103, следить за дыханием.</div><div style="border-left-color:#ff8a73"><b>Не дышит</b>Звонок 103 и непрямой массаж сердца: 30 нажатий на центр груди, 100–120 в минуту.</div></div>`;
    if (L.id === 'habits') h += `<h3>Чем вредят</h3><div class="feat"><div style="border-left-color:#ffb547"><b>Никотин</b>Сужает сосуды, учащает пульс, вызывает зависимость за несколько недель.</div><div style="border-left-color:#5a4a44"><b>Смолы</b>Содержат вещества, вызывающие рак лёгких, гортани, полости рта.</div><div style="border-left-color:#7d8597"><b>Угарный газ</b>Занимает гемоглобин, ткани получают меньше кислорода, падает выносливость.</div><div style="border-left-color:#b48cff"><b>Алкоголь</b>Разрушает клетки печени и мозга, мешает памяти и учёбе, вызывает зависимость.</div></div>`;
    if (L.id === 'routine') h += `<h3>Правила гигиены</h3><div class="feat"><div style="border-left-color:#72d4e8"><b>Руки</b>С мылом не меньше 20 секунд: после улицы, туалета и перед едой.</div><div style="border-left-color:#86e0a8"><b>Зубы</b>Утром и вечером по 2 минуты, к стоматологу — раз в полгода.</div><div style="border-left-color:#ff8a73"><b>Глаза и экран</b>Правило 20–20–20: каждые 20 минут смотреть 20 секунд вдаль, на 6 метров.</div><div style="border-left-color:#6a7dff"><b>Сон</b>Спальня прохладная и тёмная, телефон — за час до сна в сторону.</div></div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'aid') {
    const c = curCase(), V = bloodV(), r = S.idn ? BT[c.k].rate * 60 : null, fl = flow(), rNow = r !== null ? r * fl : null;
    let h = `<h2>Сколько крови теряется</h2><div class="formula">V = масса × 70 мл/кг</div><div class="steps">` +
      step('Масса тела', S.mass + ' кг') + step('Объём крови', `${S.mass} × 70 = ${money(V)} мл`) +
      step('Опасная потеря (30 %)', `${money(V)} × 0,3 = ${money(V * 0.3)} мл`, 'sum') + `</div>`;
    h += `<h3>Случай ${S.ci + 1}: сейчас</h3><div class="steps">` +
      step('Вид', S.idn ? BT[c.k].name : 'ещё не определён') +
      step('Скорость в модели', r === null ? 'определите вид' : `${money(r)} мл/мин${fl < 1 ? ` × ${ru(fl)} = ${ru(rNow)} мл/мин` : ''}`) +
      step('Уже потеряно', `${Math.round(S.loss)} мл = ${ru(S.loss / V * 100)} %`) +
      step('До опасной потери', rNow ? `(${money(V * 0.3)} − ${Math.round(S.loss)}) ÷ ${ru(rNow)} ≈ ${ru(Math.max(0, V * 0.3 - S.loss) / rNow)} мин` : fl === 0 && S.idn ? 'кровь остановлена' : '—', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:8px">Скорости в модели условные: в жизни при ранении крупной артерии опасная потеря наступает за несколько минут. Поэтому сначала — остановить кровь, потом всё остальное.</p>`;
    if (S.idn && c.k === 'art') h += `<h3>Жгут</h3><div class="steps">` + step('Рана', `${Math.round(xToCm(c.x))} см от плечевого сустава`) + step('Жгут', S.tq === null ? 'не наложен' : `${Math.round(xToCm(S.tq))} см — ${S.tq < c.x - 8 ? 'выше раны ✓' : 'ниже раны ✗'}`) +
      step('Записка', S.note ? `наложен в ${S.note}` : 'нет') + step('Снять не позже', S.note ? 'через 1–2 часа (в холод — раньше)' : '—', 'sum') + `</div>`;
    h += `<h3>Все случаи</h3><div class="steps">` + CASES.map((x, i) => step(`${i + 1}. ${x.story}`, S.solved[i] ? `${BT[x.k].name.toLowerCase()} ✓` : i === S.ci ? 'сейчас' : '—')).join('') + step('Ошибок по ходу', String(S.err), 'sum') + `</div>`;
    return h;
  }
  if (id === 'habits') {
    const day = S.cig / 20 * S.price;
    let h = `<h2>Сколько стоит курение</h2><div class="formula">деньги = сиг./день ÷ 20 × цена × 365 × лет</div><div class="steps">` +
      step('Одна сигарета', `${money(S.price)} ÷ 20 = ${ru(S.price / 20)} ₸`) + step('В день', `${S.cig} × ${ru(S.price / 20)} = ${money(day)} ₸`) +
      step('В год', `${money(day)} × 365 = ${money(day * 365)} ₸`) + step(`За ${S.years} ${yrs(S.years)}`, `${money(day * 365)} × ${S.years} = ${money(m.money)} ₸`, 'sum') + `</div>`;
    h += `<h3>Что попадает в организм</h3><div class="steps">` + step('Сигарет всего', `${S.cig} × 365 × ${S.years} = ${money(cigsTotal())}`) +
      step('Смолы (до 10 мг в сигарете)', `${money(cigsTotal())} × 10 мг ≈ ${money(m.tar)} г`) + step('Никотин (до 1 мг)', `≈ ${money(cigsTotal() / 1000)} г`) +
      step('CO в гемоглобине', `${S.quit ? 'после отказа ' : ''}≈ ${ru(m.co)} % (у некурящего ≈ 1 %)`) +
      step('Минус жизни (≥ 11 мин на сигарету)', `${money(cigsTotal())} × 11 мин ≈ ${money(cigsTotal() * 11 / 60 / 24)} дней`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:8px">10 мг смол, 1 мг никотина — предел для одной сигареты по техрегламенту ЕАЭС. «11 минут жизни на сигарету» — оценка учёных; новые исследования дают даже около 20 минут.</p>`;
    h += `<h3>Ваш ответ</h3><div class="steps">` + step('Про миллион', S.ansOk ? 'найден ✓' : 'ещё нет') + step('После отказа', S.quit ? `${TL[S.qi].t}: ${TL[S.qi].d}` : 'ещё курит', 'sum') + `</div>`;
    return h;
  }
  const order = ['sleep', 'school', 'home', 'sport', 'eat', 'hyg', 'screen', 'rest'];
  let h = `<h2>Ваши сутки</h2><div class="steps">` + order.map(k => step(ACT[k].n, `${S.day.filter(x => x === k).length} × 0,5 = ${ru(hours(k))} ч`)).join('') + step('Всего', '48 × 0,5 = 24 ч', 'sum') + `</div>`;
  h += `<h3>Проверка норм</h3><div class="steps">` + m.R.map(r => step(r.t, `${r.v} ${r.ok ? '✓' : '✗'}`)).join('') + step('Выполнено', `${m.okN} из ${m.R.length}`, 'sum') + `</div>`;
  const runs = dayRuns().filter(r => r.k === 'sleep');
  if (runs.length) h += `<p class="note" style="margin-top:8px">Сон: ${runs.map(r => `${hhmm(r.a)}–${hhmm(r.b)}`).join(', ')}. Ложиться и вставать лучше в одно и то же время и в выходные — разница не больше часа.</p>`;
  return h;
}
function dayRuns() {
  let st = 0; while (st < 48 && S.day[st] === S.day[(st + 47) % 48]) st++;
  if (st === 48) return [{ k: S.day[0], a: 0, b: 48 }];
  const out = []; let a = st;
  for (let i = 1; i <= 48; i++) { const j = (st + i) % 48; if (i === 48 || S.day[j] !== S.day[a % 48]) { out.push({ k: S.day[a % 48], a: a % 48, b: (st + i) % 48 }); a = st + i; } }
  return out;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'aid') {
    el.innerHTML = `<div class="k">Потеря крови</div><div class="v ${m.pct > 15 ? 'bad' : S.done.aid ? 'ok' : ''}">${Math.round(m.loss)} мл</div>
      <div class="gauge"><b style="width:${Math.min(100, m.pct / 30 * 100).toFixed(1)}%;background:${m.pct > 15 ? 'var(--warn)' : 'var(--arm)'}"></b></div>
      <div class="lr"><span>от объёма</span><span>${ru(m.pct)} %</span></div><div class="lr"><span>кровь</span><span>${m.flow > 0 && S.ci < CASES.length && !S.solved[S.ci] ? 'течёт' : 'стоп'}</span></div><div class="lr"><span>случай</span><span>${Math.min(S.ci + 1, 3)} / 3</span></div>`;
  } else if (m.kind === 'habits') {
    el.innerHTML = `<div class="k">Потрачено</div><div class="v ${m.money > 1e6 ? 'bad' : ''}">${money(m.money)} ₸</div>
      <div class="lr"><span>в день</span><span>${S.cig} сиг.</span></div><div class="lr"><span>лет</span><span>${S.years}</span></div><div class="lr"><span>CO</span><span>${ru(m.co)} %</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Здоровый день</div><div class="v ${m.allOk ? 'ok' : ''}">${m.okN} / ${m.R.length} норм</div>
      <div class="gauge"><b style="width:${(m.okN / m.R.length * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>сон</span><span>${ru(hours('sleep'))} ч</span></div><div class="lr"><span>экран</span><span>${ru(hours('screen'))} ч</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы умеете беречь своё здоровье и помогать другим!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  aid: '<path d="M4 15H52" stroke="#b98a6e" stroke-width="9" stroke-linecap="round"/><rect x="24" y="8" width="5" height="14" rx="1.5" fill="#ff6a3d"/><circle cx="40" cy="14" r="2.5" fill="#ff3030"/><circle cx="46" cy="9" r="1.5" fill="#ff3030"/><path d="M58 9v12M52 15h12" stroke="#ff8a73" stroke-width="2.5"/>',
  habits: '<path d="M14 6Q6 8 5 18Q5 26 13 25Q16 18 15 9Z" fill="#7a5a58"/><path d="M20 6Q28 8 29 18Q29 26 21 25Q18 18 19 9Z" fill="#7a5a58"/><rect x="36" y="18" width="24" height="5" rx="1" fill="#e8ecf4"/><rect x="36" y="18" width="6" height="5" fill="#ffb547"/><path d="M60 15q2 -4 0 -8" stroke="#8b96ad" fill="none"/>',
  routine: '<circle cx="33" cy="15" r="12" fill="none" stroke="#6a7dff" stroke-width="5" stroke-dasharray="20 8 6 4 10 28"/><path d="M33 15V8M33 15l5 3" stroke="#e8ecf4" stroke-width="1.5" stroke-linecap="round"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'aid') {
    const c = curCase();
    now = `Рука пострадавшего, случай ${S.ci + 1} из 3: «${c.story}», рана — ${c.place}, ${Math.round(xToCm(c.x))} см от плечевого сустава. На ране видно: ${BT[c.k].look}. ` +
      (S.idn ? `Ученик верно определил: ${BT[c.k].name.toLowerCase()} кровотечение. ` : 'Ученик ещё не определил вид кровотечения. ') +
      `Сделано: прижатие пальцем — ${S.press ? 'да' : 'нет'}, давящая повязка — ${S.band ? 'да' : 'нет'}, обработка и повязка — ${S.anti ? 'да' : 'нет'}, жгут — ${S.tq === null ? 'нет' : Math.round(xToCm(S.tq)) + ' см от плеча'}, записка — ${S.note ? 'да' : 'нет'}, звонок 103 — ${S.call ? 'да' : 'нет'}. ` +
      `Кровь ${m.flow > 0 && !S.solved[S.ci] ? 'течёт' : 'остановлена'}, потеряно ${Math.round(m.loss)} мл (${ru(m.pct)} % от ${money(bloodV())} мл при массе ${S.mass} кг). Решено случаев: ${m.solvedN} из 3, ошибок ${S.err}.`;
    guide = 'Не называй вид кровотечения, пока ученик его не определил: спроси, какого цвета кровь и течёт ли она толчками. Про жгут спроси, откуда течёт кровь в артерии и где сердце. Говори о безопасности: перчатки, звонок 103.';
  }
  if (id === 'habits') {
    now = `Модель курильщика: ${S.cig} сигарет в день, ${S.years} ${yrs(S.years)}, пачка ${money(S.price)} ₸. Потрачено ${money(m.money)} ₸, сигарет всего ${money(cigsTotal())}, смол через лёгкие ≈ ${money(m.tar)} г, угарный газ занял ${ru(m.co)} % гемоглобина. ` +
      `Лёгкие на рисунке ${tarDark() > 0.5 ? 'сильно потемнели' : tarDark() > 0.15 ? 'потемнели' : 'почти розовые'}. Ответ про миллион ${S.ansOk ? 'найден' : 'ещё не найден'}. ` +
      (S.quit ? `Человек бросил курить, маркер на шкале: «${TL[S.qi].t} — ${TL[S.qi].d}».` : 'Человек пока курит, шкала восстановления закрыта.');
    guide = 'Не называй число лет для миллиона: помоги посчитать траты за один год и сравнить с миллионом. Говори без запугивания и без морали — на фактах и деньгах.';
  }
  if (id === 'routine') {
    now = `Циферблат суток из 48 получасовых клеток. Распорядок ученика: ${dayRuns().map(r => `${hhmm(r.a)}–${hhmm(r.b)} ${ACT[r.k].n.toLowerCase()}`).join('; ')}. Кисть: ${ACT[S.brush].n.toLowerCase()}. ` +
      `Нормы: ${m.R.map(r => `${r.t} — ${r.v} ${r.ok ? '(выполнено)' : '(не выполнено)'}`).join('; ')}.`;
    guide = 'Не расписывай готовый день за ученика. Спроси, какая норма ещё не выполнена и откуда можно взять для неё время — например, из экрана.';
  }
  return [
    `Раздел: биология, 9 класс, тема «Здоровье и первая помощь» (Человек). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { aid: 'Почему жгут кладут выше раны, а не ниже?', habits: 'Почему от курения падает выносливость в спорте?', routine: 'Почему вредно сидеть в телефоне перед сном?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
