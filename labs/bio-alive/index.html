<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 7 класс: признаки живого — обмен веществ, рост и развитие, размножение, уровни организации жизни.">
<title>Признаки живого</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lvcard{background:var(--surface-2);border-radius:12px;padding:12px 13px;margin-top:12px}
.lvcard b{display:block;font:500 15px/1.3 var(--font-display)}
.lvcard span{display:block;font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.45}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 33V17" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/><path d="M20 22q-9 0-10-9q9 0 10 9z" fill="var(--leaf)"/><path d="M20 18q8-1 9-9q-8 0-9 9z" fill="var(--ok)"/><circle cx="20" cy="33" r="1.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Биология · Признаки живого</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Живое</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const KEY = 'luch-bio-alive';

// ---------- biology data ----------
// Lesson 1 (Priestley's bell jar): gas exchange per model minute, in % of the jar's air
const AIR = { o2: 21, co2: 0.04, mouse: 0.30, plantResp: 0.05, photoMax: 0.60, photoK: 0.5, o2Min: 16, co2Max: 4, maxMin: 180 };
// Lesson 2 (bean): developmental days at the optimum needed for each stage
const STAGES = [
  { d: -1, name: 'сухое семя' }, { d: 0, name: 'семя набухло' }, { d: 3, name: 'появился корешок' }, { d: 6, name: 'росток пробивает землю' },
  { d: 8, name: 'раскрылись семядоли' }, { d: 14, name: 'первые настоящие листья' }, { d: 25, name: 'растёт и ветвится' }, { d: 38, name: 'появились бутоны' }, { d: 45, name: 'цветение' },
];
const FLOWER = 45;
// Lesson 3: rabbit traits
const TRAITS = {
  fur: { name: 'окраска', v: { grey: 'серая', red: 'рыжая' } },
  ears: { name: 'уши', v: { up: 'стоячие', lop: 'висячие' } },
  spot: { name: 'пятно', v: { no: 'нет', yes: 'белое' } },
};
const MOM = { fur: 'grey', ears: 'up', spot: 'no' }, DAD = { fur: 'red', ears: 'lop', spot: 'yes' };
// Lesson 4: levels of organisation, from the smallest
const LEVELS = [
  { id: 'mol', name: 'Молекулы', full: 'Молекулярный', ex: 'ДНК и белки в клетке сердца сайгака', size: '≈ 2 нм', what: 'Вещества, из которых построено живое. Одна молекула сама по себе не живая.', c: '#b48cff' },
  { id: 'cell', name: 'Клетка', full: 'Клеточный', ex: 'клетка сердечной мышцы', size: '≈ 0,1 мм', what: 'Самая маленькая единица живого: питается, дышит, растёт, делится.', c: '#72d4e8' },
  { id: 'tissue', name: 'Ткань', full: 'Тканевый', ex: 'сердечная мышечная ткань', size: 'миллиметры', what: 'Группа похожих клеток, которые выполняют общую работу.', c: '#5fb4d9' },
  { id: 'organ', name: 'Орган', full: 'Органный', ex: 'сердце сайгака', size: 'сантиметры', what: 'Часть тела из нескольких тканей со своей работой: сердце качает кровь.', c: '#ff8a73' },
  { id: 'organism', name: 'Организм', full: 'Организменный', ex: 'один сайгак', size: '≈ 1,3 м', what: 'Отдельное живое существо: все его органы работают вместе.', c: '#ffb547' },
  { id: 'pop', name: 'Популяция', full: 'Популяционно-видовой', ex: 'сайгаки Бетпакдалы', size: 'сотни км', what: 'Особи одного вида, которые долго живут на одной территории и размножаются между собой.', c: '#e9e21f' },
  { id: 'eco', name: 'Экосистема', full: 'Экосистемный (биогеоценоз)', ex: 'степь: ковыль, полынь, сайгаки, волки, почва', size: 'тысячи км', what: 'Популяции разных видов вместе с почвой, водой и воздухом. Их связывают цепи питания.', c: '#86e0a8' },
  { id: 'bios', name: 'Биосфера', full: 'Биосферный', ex: 'вся живая оболочка Земли', size: '≈ 40 000 км вокруг Земли', what: 'Все живые организмы планеты и та часть воды, суши и воздуха, где они живут.', c: '#33a84f' },
];

const LESSONS = [
  { id: 'metab', title: 'Обмен веществ',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  const L = LESSONS[S.lesson];
  // lesson 1
  S.plant = L.plant || false; S.mouse = L.mouse !== undefined ? L.mouse : true; S.light = L.light !== undefined ? L.light : true;
  S.closed = false; S.o2 = AIR.o2; S.co2 = AIR.co2; S.min = 0; S.mouseMin = 0; S.lift = 80; S.airTrace = [[0, AIR.o2, AIR.co2]];
  // lesson 2
  S.water = L.water || false; S.temp = L.temp !== undefined ? L.temp : 20; S.glight = L.glight || false;
  S.day = 0; S.dev = 0; S.swollen = false; S.h = 0; S.darkDays = 0; S.dryDays = 0; S.dead = null; S.etio = false; S.playing = false; S.growTrace = [[0, 0]];
  // lesson 3
  S.cells = 1; S.divT = -1e9; S.kids = null; S.kidsT = -1e9; S.answer = null;
  // lesson 4
  S.slots = Array(8).fill(-1); S.slotOf = Array(8).fill(-1); S.sel = -1; S.cpos = null;
  acc = 0;
}

// ---------- models ----------
function rates() {
  const photo = S.plant && S.light ? AIR.photoMax * S.co2 / (S.co2 + AIR.photoK) : 0;
  const rp = S.plant ? AIR.plantResp : 0, rm = S.mouse ? AIR.mouse : 0;
  return { photo, rp, rm, dO2: photo - rp - rm, dCO2: rp + rm - photo };
}
const tempRate = T => T < 10 ? 0 : T <= 25 ? (T - 10) / 15 : T <= 32 ? 1 : 0.4;
const hGreen = d => d < 6 ? 0 : 45 / (1 + Math.exp(-(d - 24) / 5));
function stageIdx() {
  if (!S.swollen) return 0;
  let k = 1; for (let i = 2; i < STAGES.length; i++) if (S.dev >= STAGES[i].d) k = i;
  return k;
}
const trifol = () => S.dev < 18 ? 0 : Math.min(8, Math.floor((S.dev - 14) / 4));
const leafCount = () => { const st = stageIdx(); if (st < 4) return 0; return (S.dev < 25 ? 2 : 0) + (st >= 5 ? 2 : 0) + trifol(); };
function placedRight() { let r = 0, n = 0; for (let i = 0; i < 8; i++) if (S.slots[i] >= 0) { n++; if (S.slots[i] === i) r++; } return { r, n }; }

function model() {
  const id = LID();
  if (id === 'metab') return Object.assign({ kind: 'air', o2: S.o2, co2: S.co2, min: S.min, mouseMin: S.mouseMin, closed: S.closed }, rates());
  if (id === 'grow') { const st = stageIdx(); return { kind: 'grow', stage: st, stageName: S.dead ? (S.dead === 'dry' ? 'засох без воды' : 'истощился без света') : STAGES[st].name, dead: S.dead, day: S.day, dev: S.dev, h: S.h, rate: tempRate(S.temp), leaves: leafCount() }; }
  if (id === 'repro') return { kind: 'repro', cells: S.cells, gen: Math.round(Math.log2(S.cells)), kids: !!S.kids, answer: S.answer };
  const p = placedRight();
  return { kind: 'lev', placed: p.n, right: p.r };
}

// ---------- lesson 1: air steps ----------
function airStep() {
  const r = rates();
  S.o2 = clamp(S.o2 + r.dO2, 0, 30); S.co2 = clamp(S.co2 + r.dCO2, 0, 30);
  S.min++; if (S.mouse) S.mouseMin++;
  S.airTrace.push([S.min, S.o2, S.co2]);
  if (S.mouse && (S.o2 < AIR.o2Min || S.co2 > AIR.co2Max)) {
    openJar(true);
    toast(S.o2 < AIR.o2Min ? 'Мышке душно: кислорода мало. Банку открыли и проветрили.' : 'Мышке душно: слишком много углекислого газа. Банку открыли.');
    return false;
  }
  if (S.min >= AIR.maxMin) { S.closed = false; toast('Опыт закончен. Откройте банку, чтобы начать заново.'); renderTools(); update(); return false; }
  return true;
}
function openJar(alarm) {
  S.closed = false; S.o2 = AIR.o2; S.co2 = AIR.co2; S.min = 0; S.mouseMin = 0; S.airTrace = [[0, AIR.o2, AIR.co2]];
  if (!alarm) toast('Банку открыли: внутри снова обычный воздух.');
  renderTools(); update();
}
function closeJar() {
  if (!S.plant && !S.mouse) { toast('Под колпаком пусто — сначала поставьте растение или мышь.'); return; }
  S.closed = true; S.o2 = AIR.o2; S.co2 = AIR.co2; S.min = 0; S.mouseMin = 0; S.airTrace = [[0, AIR.o2, AIR.co2]]; acc = 0;
  update();
}
function toggleThing(k) {
  if (S.closed) { toast('Банка закрыта. Сначала откройте её.'); return; }
  S[k] = !S[k]; update();
}
function skipMin(n) {
  if (!S.closed) { toast('Сначала закройте банку.'); return; }
  for (let i = 0; i < n; i++) if (!S.closed || !airStep()) break;
  update();
}

// ---------- lesson 2: one day ----------
function dayStep() {
  if (S.dead) { toast('Растение погибло. Нажмите «Посадить заново».'); S.playing = false; return false; }
  if (S.day >= 120) { toast('Прошло 120 дней. Нажмите «Посадить заново».'); S.playing = false; return false; }
  if (stageIdx() === STAGES.length - 1) { S.playing = false; }
  S.day++;
  if (!S.water) {
    if (S.dev >= 3) { S.dryDays++; if (S.dryDays >= 4) { S.dead = 'dry'; S.playing = false; toast('Без воды росток засох. Нажмите «Посадить заново».'); } }
  } else {
    S.dryDays = 0; S.swollen = true;
    const r = tempRate(S.temp);
    if (S.dev >= 6 && !S.glight) {
      S.dev = Math.min(Math.max(S.dev, 10), S.dev + r); S.etio = r > 0 || S.etio;
      if (r > 0) S.h = Math.min(25, Math.max(S.h, hGreen(S.dev)) + 1.5);
      S.darkDays++;
      if (S.darkDays >= 10) { S.dead = 'dark'; S.playing = false; toast('В темноте запасы семени кончились, и росток погиб. Посадите заново.'); }
    } else {
      S.dev += r; S.darkDays = 0; S.etio = false;
      S.h = Math.max(S.h, hGreen(S.dev));
    }
  }
  S.growTrace.push([S.day, S.h]);
  return true;
}
function days(n) { for (let i = 0; i < n; i++) { if (!dayStep()) break; if (stageIdx() === STAGES.length - 1) break; } update(); }

// ---------- lesson 3 ----------
function divide() {
  if (S.cells >= LESSONS[2].maxCells) { toast('Чашка заполнена: дальше бактериям не хватит места и еды.'); return; }
  S.cells *= 2; S.divT = performance.now(); update();
}
function cross() {
  const pick = () => { const k = {}; for (const t of Object.keys(TRAITS)) k[t] = Math.random() < 0.5 ? MOM[t] : DAD[t]; return k; };
  const same = (a, b) => Object.keys(TRAITS).every(t => a[t] === b[t]);
  let kids;
  do { kids = [pick(), pick(), pick(), pick()]; } while (kids.every(k => same(k, kids[0])));
  S.kids = kids; S.kidsT = performance.now(); update();
}
function answer(a) {
  if (S.cells < 64 || !S.kids) { toast(S.cells < 64 ? 'Сначала вырастите хотя бы 64 бактерии.' : 'Сначала получите крольчат.'); return; }
  S.answer = a;
  if (a !== 'bact') toast('Посмотрите ещё раз: крольчата похожи друг на друга? А бактерии?');
  update();
}

// ---------- lesson 4: ladder geometry ----------
const CW = 124, CH = 25;
const slotXY = i => [198, 330 - i * 29];
const homeXY = j => [j < 4 ? 30 : 366, 152 + (j % 4) * 46];
function cardTarget(c) {
  const s = S.slotOf[c]; if (s >= 0) return slotXY(s);
  return homeXY(LESSONS[3].order.indexOf(c));
}
function initCards() { S.cpos = LEVELS.map((_, c) => { const [x, y] = cardTarget(c); return { x, y }; }); }
function place(c, s) {
  const prev = S.slotOf[c];
  if (s >= 0) {
    const other = S.slots[s];
    if (other >= 0 && other !== c) { S.slotOf[other] = prev; if (prev >= 0) S.slots[prev] = other; }
    else if (prev >= 0) S.slots[prev] = -1;
    S.slots[s] = c; S.slotOf[c] = s;
  } else if (prev >= 0) { S.slots[prev] = -1; S.slotOf[c] = -1; }
  S.sel = -1;
  const p = placedRight();
  if (p.n === 8 && p.r < 8) toast(`Все карточки на лестнице. На своём месте ${p.r} из 8 — красные поменяйте.`);
  update();
}

// ---------- drawing helpers ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const GLASS = 'rgba(200,225,255,.08)', GLASS_S = '#9fb3d1';
const DOTS = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 120; i++) DOTS.push({ u: r(), v: r(), p: r() * 6.28 }); }

function bench(withTop) {
  let h = `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="${withTop ? 2360 : 4000}" fill="url(#tile)"/>`;
  if (withTop) h += `<rect x="-2000" y="360" width="4520" height="1200" fill="#1a2232"/><rect x="-2000" y="358" width="4520" height="4" fill="#2c3954"/><rect x="-2000" y="362" width="4520" height="2" fill="${INK}" opacity=".6"/>`;
  return h;
}
function lampSVG(x, on) {
  let h = '';
  if (on) h += `<path d="M${x - 24} 64L${x + 24} 64L${x + 150} 350L${x - 150} 350Z" fill="#ffe9a8" opacity=".06"/>`;
  h += `<g data-hit="lamp"><rect x="${x - 34}" y="20" width="68" height="56" fill="transparent"/>`;
  h += ol(`M${x} -400V40`, 'none', '#56627d', 2);
  h += ol(`M${x - 26} 64L${x - 12} 40H${x + 12}L${x + 26} 64Z`, '#3a4762', '#56627d', 1.6);
  h += `<ellipse cx="${x}" cy="66" rx="10" ry="5" fill="${on ? '#ffe9a8' : '#56627d'}" stroke="${INK}" stroke-width="1.2"/>`;
  if (on) h += `<ellipse cx="${x}" cy="68" rx="22" ry="9" fill="#ffe9a8" opacity=".18"/>`;
  return h + `</g>`;
}
const dark = () => `<rect x="-2000" y="-2000" width="4520" height="4000" fill="#000" opacity=".42" pointer-events="none"/>`;

// mint in a pot; (x, y) = pot bottom centre
function mintSVG(x, y) {
  let h = `<g data-hit="plant"><rect x="${x - 40}" y="${y - 104}" width="80" height="106" fill="transparent"/>`;
  const stems = [[-10, -92, -16], [2, -100, 4], [12, -84, 18]];
  for (const [bx, top, tx] of stems) {
    h += `<path d="M${x + bx * 0.3} ${y - 24}Q${x + bx} ${y - 60} ${x + tx} ${y + top}" stroke="#3f8f4c" stroke-width="2.2" fill="none"/>`;
    for (let k = 0; k < 4; k++) {
      const f = 0.3 + k * 0.22, ly = y - 24 + (top + 24) * f, lx = x + bx * 0.3 + (tx - bx * 0.3) * f * f, s = 1 - k * 0.15;
      h += `<ellipse cx="${(lx - 7 * s).toFixed(1)}" cy="${ly.toFixed(1)}" rx="${(7 * s).toFixed(1)}" ry="${(3.6 * s).toFixed(1)}" fill="#5fbf6a" stroke="${INK}" stroke-width=".9" transform="rotate(-20 ${(lx - 7 * s).toFixed(1)} ${ly.toFixed(1)})"/>`;
      h += `<ellipse cx="${(lx + 7 * s).toFixed(1)}" cy="${ly.toFixed(1)}" rx="${(7 * s).toFixed(1)}" ry="${(3.6 * s).toFixed(1)}" fill="#6fcf78" stroke="${INK}" stroke-width=".9" transform="rotate(20 ${(lx + 7 * s).toFixed(1)} ${ly.toFixed(1)})"/>`;
    }
  }
  h += ol(`M${x - 20} ${y - 26}h40l-5 26h-30z`, '#b0623f', '#c97a55', 1.6);
  h += `<rect x="${x - 21}" y="${y - 29}" width="42" height="5" rx="1.5" fill="#c97a55" stroke="${INK}" stroke-width="1"/>`;
  return h + `</g>`;
}
// mouse facing left; (x, y) = paws on the floor
function mouseSVG(x, y, t, stress) {
  const br = reduce ? 0 : Math.sin(t / (stress ? 90 : 260)) * (stress ? 0.08 : 0.04);
  let h = `<g data-hit="mouse"><rect x="${x - 36}" y="${y - 30}" width="80" height="32" fill="transparent"/>`;
  h += `<path d="M${x + 18} ${y - 7}Q${x + 34} ${y - 2} ${x + 42} ${y - 12}" stroke="#d9a3a8" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  h += `<ellipse cx="${x}" cy="${y - 11}" rx="20" ry="${(11 * (1 + br)).toFixed(2)}" fill="#b9bfcc" stroke="${INK}" stroke-width="1.4"/>`;
  h += `<ellipse cx="${x - 19}" cy="${y - 13}" rx="11" ry="8" fill="#c4c9d5" stroke="${INK}" stroke-width="1.4"/>`;
  h += `<circle cx="${x - 14}" cy="${y - 22}" r="5.5" fill="#c4c9d5" stroke="${INK}" stroke-width="1.2"/><circle cx="${x - 14}" cy="${y - 22}" r="3" fill="#e6a8b4"/>`;
  h += `<circle cx="${x - 23}" cy="${y - 15}" r="1.6" fill="${INK}"/><circle cx="${x - 30}" cy="${y - 12}" r="1.8" fill="#e68a9a"/>`;
  h += `<path d="M${x - 12} ${y}h4M${x + 8} ${y}h4" stroke="#e6a8b4" stroke-width="2" stroke-linecap="round"/>`;
  return h + `</g>`;
}

function airScene(t) {
  let h = bench(true);
  const ly = -S.lift;
  // plate
  h += ol('M128 350h264v8q0 3-3 3H131q-3 0-3-3z', '#3a4762', '#56627d', 1.6);
  // contents
  h += mintSVG(S.plant ? 212 : 62, S.plant ? 350 : 360);
  h += mouseSVG(S.mouse ? 318 : 466, S.mouse ? 350 : 360, t, S.closed && (S.o2 < 18 || S.co2 > 2.5));
  // air particles under the jar
  if (S.closed) {
    const nO = Math.round(clamp(S.o2 - 10, 0, 14) * 1.6), nC = Math.min(46, Math.round(S.co2 * 8));
    for (let i = 0; i < nO + nC; i++) {
      const d = DOTS[i % DOTS.length], dx = reduce ? 0 : Math.sin(t / 900 + d.p) * 5, dy = reduce ? 0 : Math.cos(t / 1100 + d.p * 1.4) * 4;
      const x = 166 + d.u * 188 + dx, y = 140 + ((d.v + i * 0.137) % 1) * 196 + dy;
      h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3" fill="${i < nO ? '#72d4e8' : '#ffb547'}" opacity=".85"/>`;
    }
  }
  // bell jar
  const d = `M150 ${350 + ly}V${176 + ly}Q150 ${112 + ly} 260 ${112 + ly}Q370 ${112 + ly} 370 ${176 + ly}V${350 + ly}`;

  if (L === 'repro') { if (id === 'dish') divide(); else if (id === 'pair') cross(); return; }
  if (L === 'levels' && id.startsWith('slot')) {
    const s = +id.slice(4);
    if (S.sel >= 0) place(S.sel, s); else toast('Сначала нажмите на карточку, потом на ступеньку.');
  }
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (id === 'metab') {
    const target = S.closed ? 0 : 80, nl = reduce ? target : S.lift + (target - S.lift) * Math.min(1, dt * 8);
    if (Math.abs(nl - S.lift) > 0.05) anim = true; S.lift = Math.abs(nl - target) < 0.05 ? target : nl;
    if (S.closed) { anim = true; acc += dt; let ch = false; while (acc >= 0.2) { acc -= 0.2; ch = true; if (!airStep()) { acc = 0; break; } } if (ch) update(); }
  }
  if (id === 'grow') {
    if (S.playing) { acc += dt; let ch = false; while (acc >= 0.3) { acc -= 0.3; ch = true; if (!dayStep() || stageIdx() === STAGES.length - 1) { S.playing = false; renderTools(); acc = 0; break; } } if (ch) update(); }
    anim = !reduce && (S.water || S.dev >= 8);
  }
  if (id === 'repro') anim = t - S.divT < 500 || t - S.kidsT < 550;
  if (id === 'levels' && S.cpos) {
    for (let c = 0; c < 8; c++) {
      if (drag && drag.id === 'card' + c && drag.moved) continue;
      const o = S.cpos[c], [tx, ty] = cardTarget(c), k = reduce ? 1 : Math.min(1, dt * 12);
      const nx = o.x + (tx - o.x) * k, ny = o.y + (ty - o.y) * k;
      if (Math.abs(nx - o.x) + Math.abs(ny - o.y) > 0.05) anim = true;
      o.x = Math.abs(nx - tx) < 0.05 ? tx : nx; o.y = Math.abs(ny - ty) < 0.05 ? ty : ny;
    }
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    metab: B('plant', 'Растение', S.plant) + B('mouse', 'Мышь', S.mouse) + B('light', 'Свет', S.light) + sep + B('jar', S.closed ? 'Открыть банку' : 'Закрыть банку') + B('skip', '+10 мин'),
    grow: B('water', 'Полив', S.water) + B('cold', '−5 °C') + B('warm', '+5 °C') + B('glight', 'Свет', S.glight) + sep + B('day1', '+1 день') + B('day7', '+7 дней') + B('play', S.playing ? '❚❚' : '▶') + sep + B('replant', 'Посадить заново'),
    repro: B('divide', 'Деление') + B('cross', 'Потомство') + sep + B('ans-bact', 'Одинаковые у бактерий', S.answer === 'bact') + B('ans-rab', 'у кроликов', S.answer === 'rab') + sep + B('again', 'Заново'),
    levels: B('shuffle', 'Убрать все карточки'),
  }[id];
}
function act(a) {
  if (a === 'plant' || a === 'mouse') { toggleThing(a); renderTools(); return; }
  if (a === 'light') { S.light = !S.light; renderTools(); update(); return; }
  if (a === 'jar') { S.closed ? openJar() : closeJar(); renderTools(); return; }
  if (a === 'skip') { skipMin(10); renderTools(); return; }
  if (a === 'water') { S.water = !S.water; renderTools(); update(); return; }
  if (a === 'glight') { S.glight = !S.glight; renderTools(); update(); return; }
  if (a === 'cold' || a === 'warm') { S.temp = clamp(S.temp + (a === 'warm' ? 5 : -5), 0, 35); buildScheme(); update(); return; }
  if (a === 'day1') return days(1);
  if (a === 'day7') return days(7);
  if (a === 'play') { S.playing = !S.playing; acc = 0; renderTools(); return; }
  if (a === 'replant') { const w = S.water, T = S.temp, g = S.glight; resetLesson(); S.water = w; S.temp = T; S.glight = g; renderTools(); update(); return; }
  if (a === 'divide') return divide();
  if (a === 'cross') return cross();
  if (a === 'ans-bact') { answer('bact'); renderTools(); return; }
  if (a === 'ans-rab') { answer('rab'); renderTools(); return; }
  if (a === 'again') { S.cells = 1; S.kids = null; S.answer = null; renderTools(); update(); return; }
  if (a === 'shuffle') { S.slots.fill(-1); S.slotOf.fill(-1); S.sel = -1; update(); return; }
}

    { id: 'seed', icon: ICON.seed, name: 'Семя фасоли', spec: 'Под кожурой — зародыш и две семядоли с запасом питательных веществ. Сначала семя набухает от воды.' },
    { id: 'root', icon: ICON.root, name: 'Корень', spec: 'Появляется первым, держит растение в почве и всасывает воду.' },
    { id: 'stem', icon: ICON.stem, name: 'Стебель', spec: 'Выносит листья к свету. В темноте вытягивается, бледнеет и становится тонким.' },
    { id: 'leaves', icon: ICON.leaves, name: 'Листья', spec: 'Сначала пара простых листьев, потом тройчатые. В них идёт фотосинтез.' },
    { id: 'flowers', icon: ICON.flowers, name: 'Цветки', spec: 'Появляются примерно через 40–50 дней. Из них потом разовьются бобы с семенами.' },
    { id: 'can', icon: ICON.can, name: 'Лейка', spec: 'Без воды семя не набухнет, а росток засохнет.' },
    { id: 'thermo', icon: ICON.thermo, name: 'Градусник', spec: 'Фасоль прорастает выше 10 °C, лучше всего при 25–30 °C.' },
    { id: 'lamp', icon: ICON.lamp, name: 'Лампа', spec: 'Свет нужен с того дня, как росток вышел из земли.' }];
  if (id === 'repro') return [
    { id: 'dish', icon: ICON.dish, name: 'Чашка Петри с питательной средой', spec: 'Здесь бактерии получают пищу. Каждая делится надвое примерно раз в 20 минут.' },
    { id: 'parents', icon: ICON.parents, name: 'Кролики-родители', spec: 'Мама серая, с прямыми ушами, без пятна. Папа рыжий, вислоухий, с белым пятном.' },
    { id: 'kids', icon: ICON.kids, name: 'Крольчата', spec: 'Каждый получает часть признаков от мамы, часть от папы.' }];
  return LEVELS.map(L => ({ id: L.id, icon: lvIcon(L), name: L.full + ' уровень', spec: `${L.ex}. ${L.what}` }));
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>${L.id === 'levels' ? 'Уровни' : 'Что на столе'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'metab') {
    let h = `<h2>Обмен газов</h2><div class="formula">Дыхание: сахар + O₂ → CO₂ + вода + энергия<br>Фотосинтез (свет): CO₂ + вода → сахар + O₂</div><h3>За одну минуту сейчас</h3><div class="steps">` +
      step('мышь забирает O₂', S.mouse ? '−0,30 %' : 'мыши нет') + step('растение дышит', S.plant ? '−0,05 %' : 'растения нет') +
      step('фотосинтез даёт O₂', S.plant ? (S.light ? '+' + fmt(m.photo, 2) + ' %' : '0 — темно') : 'растения нет') +
      step('итого O₂ за минуту', (m.dO2 >= 0 ? '+' : '') + fmt(m.dO2, 2) + ' %', 'sum') + `</div>`;
    if (S.mouse && m.dO2 < -0.01) h += `<h3>Прогноз</h3><div class="steps">` + step('до опасных 16 % осталось', `${fmt(S.o2, 1)} − 16 = ${fmt(S.o2 - 16, 1)} %`) + step('хватит примерно на', `${fmt(S.o2 - 16, 1)} / ${fmt(-m.dO2, 2)} ≈ ${Math.max(0, Math.floor((S.o2 - 16) / -m.dO2))} мин`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Чем больше в банке CO₂, тем быстрее идёт фотосинтез: у растения больше «сырья». Поэтому вместе с мышью воздух приходит в равновесие.</p>`;
    return h;
  }
  if (id === 'grow') {
    const r = m.rate, left = FLOWER - S.dev;
    let h = `<h2>Условия и стадии</h2><div class="formula">прорастание = вода + тепло + воздух<br>дальнейший рост = ещё и свет</div><h3>Проверка условий</h3><div class="steps">` +
      step('вода', S.water ? 'есть ✓' : 'нет ✗') + step('тепло', `${S.temp} °C · ${r > 0 ? 'достаточно ✓' : 'холодно ✗'}`) + step('свет', S.glight ? 'есть ✓' : S.dev >= 6 ? 'нет ✗ — росток уже над землёй' : 'нет · пока не нужен') + `</div>`;
    h += `<h3>Скорость развития</h3><div class="steps">` + step('при этой температуре', r === 0 ? '0 — развитие стоит' : `${fmt(r * 100, 0)} % от лучшей`) +
      step('пройдено «полных» дней развития', `${fmt(S.dev, 1)} из ${FLOWER}`) +
      step('до цветения при таких условиях', r > 0 && left > 0 ? `${fmt(left, 1)} / ${fmt(r, 2)} ≈ ${Math.ceil(left / r - 1e-9)} дн.` : left <= 0 ? 'уже цветёт' : 'не дождаться', 'sum') + `</div>`;
    h += `<h3>Стадии фасоли</h3><div class="steps">` + STAGES.slice(1).map((s, i) => step(s.name, `${s.d === 0 ? 'после полива' : 'с ' + s.d + '-го дня'}${stageIdx() === i + 1 ? ' ←' : ''}`)).join('') + `</div>
      <p class="note" style="margin-top:10px">Дни указаны при лучшей температуре 25–30 °C. В холоде всё идёт медленнее.</p>`;
    return h;
  }
  if (id === 'repro') {
    const g = m.gen;
    let h = `<h2>Сколько потомков</h2><div class="formula">N = 2ⁿ, где n — число делений</div><h3>Бактерии сейчас</h3><div class="steps">` +
      step('делений', `${g} · по 20 мин = ${g * 20} мин`) + step('N', `2${g === 1 ? '' : '^' + g} = ${S.cells}`, 'sum') + `</div>
      <h3>Для задания</h3><div class="steps">` + step('64 = 2 · 2 · 2 · 2 · 2 · 2', '2⁶') + step('нужно делений', '6 → 120 мин', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Если бы еды хватало всегда, за сутки (72 деления) получилось бы число с 22 цифрами. В природе бактерий останавливают нехватка пищи и места.</p>
      <h3>Как отличить способ размножения</h3><div class="steps">` +
      step('сколько родителей?', 'один → бесполое; два → половое') + step('есть половые клетки?', 'нет → бесполое; да → половое') + step('потомки — копии родителя?', 'да → бесполое; нет → половое') + `</div>`;
    if (S.kids) h += `<h3>Крольчата</h3><div class="steps">` + S.kids.map((k, i) => step(`№ ${i + 1}`, Object.keys(TRAITS).map(t => TRAITS[t].v[k[t]]).join(', '))).join('') + `</div><p class="note" style="margin-top:10px">Три признака, у каждого 2 варианта: 2 · 2 · 2 = 8 разных сочетаний. На самом деле признаки наследуются по особым правилам — их изучает генетика в 9 классе.</p>`;
    return h;
  }
  const p = placedRight();
  let h = `<h2>Как рассуждать</h2><div class="formula">каждый уровень состоит из предыдущего</div><div class="steps">` +
    step('1. Что не живое само по себе?', 'с него и начинаем') + step('2. Что самое маленькое живое?', 'следующая ступень') +
    step('3. Из чего состоит орган? А организм?', 'ткани → органы → организм') + step('4. Что больше одного организма?', 'группа одного вида, потом много видов, потом вся Земля') + `</div>`;
  h += `<h3>Лестница сейчас (снизу вверх)</h3><div class="steps">` + S.slots.map((c, i) => step(`ступень ${i + 1}`, c < 0 ? '—' : LEVELS[c].name + (p.n === 8 ? (c === i ? ' ✓' : ' ✗') : ''))).join('') + `</div>`;
  if (p.n < 8) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 8 карточек будут на лестнице.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'air') {
    const low = S.o2 < 18;
    el.innerHTML = `<div class="k">Воздух в банке</div><div class="v ${low ? 'bad' : S.done.metab ? 'ok' : ''}">O₂ ${fmt(S.o2, 1)} %</div>
      <div class="gauge"><b style="width:${clamp((S.o2 - 10) / 12 * 100, 0, 100).toFixed(1)}%"></b><i style="left:${((AIR.o2Min - 10) / 12 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>CO₂</span><span>${fmt(S.co2, 2)} %</span></div><div class="lr"><span>мышь</span><span>${S.closed && S.mouse ? S.mouseMin + ' мин' : '—'}</span></div>`;
  } else if (m.kind === 'grow') {
    el.innerHTML = `<div class="k">Фасоль</div><div class="v ${m.dead ? 'bad' : m.stage === STAGES.length - 1 ? 'ok' : ''}">${m.stageName}</div>
      <div class="gauge"><b style="width:${clamp(S.dev / FLOWER * 100, 0, 100).toFixed(1)}%;background:var(--leaf)"></b></div>
      <div class="lr"><span>день</span><span>${S.day}</span></div><div class="lr"><span>высота</span><span>${fmt(S.h, 1)} см</span></div>`;
  } else if (m.kind === 'repro') {
    el.innerHTML = `<div class="k">Потомство</div><div class="v ${S.cells >= 64 ? 'ok' : ''}">${S.cells} ${plural(S.cells, 'бактерия', 'бактерии', 'бактерий')}</div>
      <div class="gauge"><b style="width:${(Math.log2(S.cells) / 7 * 100).toFixed(1)}%"></b><i style="left:${(6 / 7 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>крольчат</span><span>${S.kids ? 4 : 0}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Лестница</div><div class="v ${m.right === 8 ? 'ok' : ''}">${m.placed} / 8</div>
      <div class="gauge"><b style="width:${(m.placed / 8 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>верно</span><span>${m.placed === 8 ? m.right + ' из 8' : '—'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий биолог!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  metab: '<path d="M22 27V12q0-8 11-8t11 8v15" fill="none" stroke="#9fb3d1" stroke-width="1.3"/><circle cx="28" cy="12" r="1.4" fill="#72d4e8"/><circle cx="37" cy="10" r="1.4" fill="#72d4e8"/><circle cx="33" cy="17" r="1.4" fill="#ffb547"/><path d="M28 27V20" stroke="#4ea65a" stroke-width="1.2"/><ellipse cx="26" cy="21" rx="2.6" ry="1.4" fill="#5fbf6a"/><ellipse cx="39" cy="24" rx="4" ry="2.6" fill="#b9bfcc"/><path d="M18 27h30" stroke="#56627d" stroke-width="1.4"/>',
  grow: '<path d="M10 24h46" stroke="#6b4c36" stroke-width="3"/><ellipse cx="14" cy="22" rx="3" ry="2" fill="#ece0c8"/><path d="M26 23v-5" stroke="#4ea65a" stroke-width="1.2"/><ellipse cx="24" cy="17" rx="2.2" ry="1.4" fill="#c9d98a"/><ellipse cx="28" cy="17" rx="2.2" ry="1.4" fill="#c9d98a"/><path d="M40 23V9" stroke="#4ea65a" stroke-width="1.3"/><path d="M40 15q-6-3-7 1q4 2 7-1zM40 12q6-3 7 1q-4 2-7-1z" fill="#5fbf6a"/><circle cx="52" cy="10" r="2.4" fill="#f3eefc"/><path d="M52 12v11" stroke="#4ea65a" stroke-width="1.2"/>',
  repro: '<circle cx="18" cy="15" r="11" fill="none" stroke="#9fb3d1" stroke-width="1.1"/><rect x="11" y="10" width="5" height="2.4" rx="1.2" fill="#86e0a8"/><rect x="19" y="13" width="5" height="2.4" rx="1.2" fill="#86e0a8"/><rect x="13" y="18" width="5" height="2.4" rx="1.2" fill="#86e0a8"/><circle cx="42" cy="12" r="4" fill="#9aa3b5"/><circle cx="54" cy="12" r="4" fill="#d08a4e"/><circle cx="40" cy="23" r="2.6" fill="#d08a4e"/><circle cx="48" cy="23" r="2.6" fill="#9aa3b5"/><circle cx="56" cy="23" r="2.6" fill="#d08a4e"/>',
  levels: LEVELS.map((L, i) => `<rect x="${8 + i * 6.4}" y="${25 - i * 2.7}" width="5" height="${3 + i * 2.7}" rx="1" fill="${L.c}"/>`).join(''),
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson(); initCards();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'metab') {
    now = `Модель опыта Пристли. Под стеклянным колпаком: ${[S.plant ? 'веточка мяты' : '', S.mouse ? 'мышь' : ''].filter(Boolean).join(' и ') || 'никого'}. Лампа ${S.light ? 'включена' : 'выключена'}. Банка ${S.closed ? `закрыта ${S.min} мин` : 'открыта'}. Кислород ${fmt(S.o2, 1)} %, углекислый газ ${fmt(S.co2, 2)} %. За минуту: мышь −0,30 % O₂, дыхание растения −0,05 %, фотосинтез +${fmt(m.photo, 2)} %, итог ${fmt(m.dO2, 2)} %/мин. Если O₂ ниже 16 % или CO₂ выше 4 %, банку автоматически открывают. Мышь провела в закрытой банке ${S.mouseMin} мин из нужных 60.`;
    guide = 'Не говори сразу решение (растение под колпак и свет включён) — подводи вопросами: кто выделяет кислород, что ему нужно.';
  }
  if (id === 'grow') {
    now = `Фасоль в горшке. Полив ${S.water ? 'включён' : 'выключен'}, температура ${S.temp} °C (скорость развития ${fmt(m.rate * 100, 0)} % от лучшей; ниже 10 °C — ноль), лампа ${S.glight ? 'включена' : 'выключена'}. Прошло дней: ${S.day}. Стадия: ${m.stageName}. Высота ${fmt(S.h, 1)} см, листьев ${m.leaves}. Накоплено ${fmt(S.dev, 1)} из ${FLOWER} дней развития до цветения.${S.etio ? ' Росток растёт в темноте: бледный и вытянутый.' : ''}`;
    guide = 'Помогай понять, какие условия нужны для прорастания и для роста, задавая вопросы, а не перечисляя готовые настройки.';
  }
  if (id === 'repro') {
    now = `Слева чашка Петри: ${S.cells} бактерий (${m.gen} делений по 20 мин), все одинаковые. Справа кролики: мама серая, со стоячими ушами, без пятна; папа рыжий, вислоухий, с белым пятном. ${S.kids ? 'Крольчата: ' + S.kids.map((k, i) => `№${i + 1} — ` + Object.keys(TRAITS).map(t => TRAITS[t].v[k[t]]).join(', ')).join('; ') + '.' : 'Крольчат пока нет.'} Вопрос задания: у кого потомки одинаковые? Ответ ученика: ${S.answer ? (S.answer === 'bact' ? 'бактерии' : 'кролики') : 'ещё не выбран'}.`;
    guide = 'Не называй правильный ответ на вопрос задания — попроси сравнить потомков между собой и с родителями.';
  }
  if (id === 'levels') {
    now = `Ученик строит лестницу уровней организации жизни (8 карточек: ${LEVELS.map(l => l.name).join(', ')} — перечислены не по порядку для ученика). На лестнице снизу вверх: ${S.slots.map((c, i) => `${i + 1}) ${c < 0 ? 'пусто' : LEVELS[c].name}`).join('; ')}. Ещё не размещено: ${8 - m.placed}. ${m.placed === 8 ? `На своём месте ${m.right} из 8.` : ''}`;
    guide = 'Не выдавай готовый порядок. Подсказывай вопросами «из чего это состоит?» и «что больше?».';
  }
  return [
    `Раздел: биология, 7 класс, тема «Признаки живого». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    metab: 'Почему мышь в банке с растением не задыхается?', grow: 'Чем рост отличается от развития?',
    repro: 'Почему бактерии все одинаковые, а крольчата разные?', levels: 'Чем популяция отличается от экосистемы?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
