<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: пищевые цепи и правило 10%, круговорот углерода, устойчивость экосистем.">
<title>Экосистемы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="#ffd36b"/><path d="M12 4v2.5M12 17.5v2.5M4 12h2.5M17.5 12h2.5" stroke="#ffd36b" stroke-width="1.5"/><path d="M26 7a10 10 0 0 1 6 13" stroke="var(--arm)" stroke-width="1.8" fill="none"/><path d="M33 17l-1 4l-3.4-2.2" stroke="var(--arm)" stroke-width="1.6" fill="none"/><path d="M6 33Q14 25 22 29T34 27V33Z" fill="rgba(95,191,106,.4)" stroke="var(--leaf)" stroke-width="1.2"/><circle cx="27" cy="24" r="2.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Экосистемы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-ecosys';
const T = (x, y, s, size, fill, extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const fmtN = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const cap = s => s[0].toUpperCase() + s.slice(1);

// ---------- biology data ----------
// Lesson 1: who eats whom in the Kazakh steppe (simplified, real diets are wider)
const ORG = [
  { id: 'kovyl', name: 'Ковыль', prod: true, eats: [], d: 'злак степи, продуцент' },
  { id: 'polyn', name: 'Полынь', prod: true, eats: [], d: 'полукустарник сухой степи, продуцент' },
  { id: 'sar', name: 'Саранча', eats: ['kovyl', 'polyn'], d: 'ест листья и стебли трав' },
  { id: 'sus', name: 'Суслик', eats: ['kovyl', 'polyn', 'sar'], d: 'ест траву и семена, иногда насекомых' },
  { id: 'zhav', name: 'Жаворонок', eats: ['kovyl', 'sar'], d: 'клюёт семена злаков и насекомых' },
  { id: 'gad', name: 'Степная гадюка', eats: ['sar', 'zhav'], d: 'ловит саранчу, ящериц, птенцов' },
  { id: 'kors', name: 'Корсак', eats: ['sus', 'zhav', 'sar'], d: 'степная лисица: грызуны, птицы, насекомые' },
  { id: 'orel', name: 'Степной орёл', eats: ['sus', 'zhav'], d: 'охотится в основном на сусликов' },
  { id: 'zmee', name: 'Змееяд', eats: ['gad'], d: 'хищная птица, ловит змей' },
];
const OI = id => ORG.findIndex(o => o.id === id);
const LVS = ['Продуцент', 'Консумент I', 'Консумент II', 'Консумент III'];
const TOP_GOAL = 30;

// Lesson 2: the carbon cycle
const NODES = {
  air: { x: 260, y: 124, w: 170, h: 46, name: 'Воздух', sub: 'CO₂ в атмосфере', c: '#72d4e8', stay: 'в среднем несколько лет, потом его снова поглощают растения или океан' },
  plant: { x: 72, y: 226, w: 128, h: 46, name: 'Растения', sub: 'продуценты', c: '#5fbf6a', stay: 'у травы — месяцы, в стволе дерева — до сотен лет' },
  animal: { x: 112, y: 318, w: 128, h: 46, name: 'Животные', sub: 'консументы', c: '#ffb547', stay: 'от дней до нескольких лет' },
  dead: { x: 408, y: 318, w: 150, h: 46, name: 'Мёртвая органика', sub: 'опад, трупы, помёт', c: '#c79a62', stay: 'листья гниют за 1–3 года, гумус почвы — сотни лет' },
  decomp: { x: 450, y: 226, w: 128, h: 46, name: 'Редуценты', sub: 'бактерии и грибы', c: '#c99ae8', stay: 'дни: редуценты быстро «сжигают» органику при дыхании' },
  fossil: { x: 180, y: 384, w: 124, h: 36, name: 'Уголь, нефть', sub: 'в недрах', c: '#9aa6bd', stay: 'миллионы лет' },
};
const NK = ['air', 'plant', 'animal', 'dead', 'decomp', 'fossil'];
const PROCS = [
  { id: 'photo', a: 'air', b: 'plant', name: 'Фотосинтез', bend: 18, say: 'Лист поглотил CO₂ и на свету построил из него глюкозу. Углерод теперь в органическом веществе.' },
  { id: 'respP', a: 'plant', b: 'air', name: 'Дыхание', bend: 18, say: 'Растение тоже дышит: часть органики окисляется, и CO₂ уходит обратно в воздух.' },
  { id: 'eat', a: 'plant', b: 'animal', name: 'Питание', bend: 0, say: 'Растение съели. Углерод перешёл в тело животного по пищевой цепи.' },
  { id: 'dieP', a: 'plant', b: 'dead', name: 'Опад', bend: 10, say: 'Лист опал, трава засохла. Углерод теперь в мёртвой органике.' },

function resetLesson() {

// ---------- models ----------
function webState(w) {
  const W = WEB[w], off = S.off[w], alive = {};
  W.sp.forEach(s => { alive[s.id] = !off[s.id]; });
  let ch = true;
  while (ch) { ch = false; W.sp.forEach(s => { if (alive[s.id] && !s.prod && !s.eats.some(e => alive[e])) { alive[s.id] = false; ch = true; } }); }
  const st = {};
  W.sp.forEach(s => {
    const preds = W.sp.filter(p => p.eats && p.eats.includes(s.id));
    st[s.id] = off[s.id] ? 'off' : !alive[s.id] ? 'dead' : (s.row === 1 && preds.length && !preds.some(p => alive[p.id])) ? 'boom' : 'ok';
  });
  const an = W.sp.filter(s => !s.prod), offP = W.sp.filter(s => s.prod && off[s.id]).length;
  const aliveAn = an.filter(s => alive[s.id]).length, offAn = an.filter(s => off[s.id]).length;
  const links = W.sp.reduce((n, s) => n + (s.eats ? s.eats.filter(e => alive[e] && alive[s.id]).length : 0), 0);
  const links0 = W.sp.reduce((n, s) => n + (s.eats ? s.eats.length : 0), 0);
  return { alive, st, offP, nAn: an.length, aliveAn, offAn, dead: an.filter(s => st[s.id] === 'dead').length, boom: W.sp.filter(s => st[s.id] === 'boom').length, links, links0 };
}
function model() {
  const id = LID();
  if (id === 'chain') {
    const filled = S.slot.filter(x => x >= 0).length;
    const links = [0, 1, 2].map(i => S.slot[i] >= 0 && S.slot[i + 1] >= 0 ? ORG[S.slot[i + 1]].eats.includes(ORG[S.slot[i]].id) : null);
    const prodOk = S.slot[0] >= 0 ? !!ORG[S.slot[0]].prod : null;
    const E = [0, 1, 2, 3].map(i => S.E / Math.pow(10, i));
    return { kind: 'chain', filled, links, prodOk, chainOk: filled === 4 && prodOk === true && links.every(x => x === true), E, top: E[3] };
  }
  if (id === 'cycle') return { kind: 'cycle', at: S.at, steps: S.log.length, cycles: S.cycles, cycleOk: S.cycleOk, decOn: S.decOn, trip: S.trip };
  const ws = webState('steppe'), wf = webState('field');
  return { kind: 'web', ws, wf, cur: S.web === 'steppe' ? ws : wf, offPS: ws.offP, offPF: wf.offP, ans: S.ans, ready: ws.offP >= 2 && wf.offP >= 2 };
}

// ---------- lesson 1 actions ----------
function place(c, i) {
  if (i < 0) { S.csel = -1; dirty = true; return; }
  const prev = S.slot.indexOf(c); if (prev >= 0) S.slot[prev] = -1;
  S.slot[i] = c; S.csel = -1; S.look = c;
  const m = model();
  if (i === 0 && !ORG[c].prod) toast('Цепь начинается с продуцента — растения, которое само создаёт органику.');
  else {
    const bad = m.links.findIndex(x => x === false);
    if (bad >= 0 && (bad === i || bad === i - 1)) toast(`${ORG[S.slot[bad + 1]].name} не ест ${ORG[S.slot[bad]].name.toLowerCase()}. Ищите другое звено.`);
    else if (m.chainOk && m.top !== TOP_GOAL) toast(`Цепь верная! Наверху ${fmtN(m.top)} кДж. Теперь подберите энергию растений.`);
  }
  update();
}
function unslot(i) { if (S.slot[i] >= 0) { S.look = S.slot[i]; S.slot[i] = -1; update(); } }
function setE(v) { S.E = clamp(Math.round(v / 5000) * 5000, 5000, 100000); update(); }

// ---------- lesson 2 actions ----------
const avail = p => p.a === S.at && (p.id !== 'decay' || S.decOn);
function doProc(id) {
  const p = PI(id); if (!p || S.anim) return;
  if (p.a !== S.at) { toast(`Атом сейчас в узле «${NODES[S.at].name}». Выберите стрелку, которая выходит оттуда.`); return; }
  if (id === 'decay' && !S.decOn) { toast('Редуцентов нет — остатки не гниют и копятся. Верните редуцентов кнопкой внизу.'); return; }
  S.anim = { p, t0: performance.now() };
  if (reduce) finishMove();
  dirty = true;
}
function finishMove() {
  const p = S.anim.p; S.anim = null;
  S.at = p.b; S.log.push(p.id);
  if (S.at === 'air') {
    const tr = S.trip.concat('air'), ok = ['plant', 'animal', 'decomp'].every(k => tr.includes(k));
    S.cycles++;
    if (ok && !S.cycleOk) S.cycleOk = true;
    toast(ok ? 'Полный круг: воздух → растение → животное → редуценты → воздух!' : p.id === 'burn' ? PI('burn').say : `Атом снова в воздухе, но по пути не побывал: ${['plant', 'animal', 'decomp'].filter(k => !tr.includes(k)).map(k => NODES[k].name.toLowerCase()).join(', ')}.`);
    S.trip = ['air'];
  } else { S.trip.push(p.b); toast(p.say); }
  update();
}
function setDec(on) { S.decOn = on; if (!on) toast('Редуценты исчезли. Посмотрите, куда теперь может уйти мёртвая органика.'); renderTools(); buildScheme(); update(); }

function setWeb(w) { S.web = w; S.nsel = null; renderTools(); buildScheme(); update(); }
function toggleSp(id) {
  const off = S.off[S.web], before = webState(S.web);
  off[id] = !off[id]; S.nsel = id;
  const after = webState(S.web), sp = WEB[S.web].sp.find(s => s.id === id);
  if (off[id]) {
    const died = WEB[S.web].sp.filter(s => before.st[s.id] !== 'dead' && after.st[s.id] === 'dead').map(s => s.name);
    const boom = WEB[S.web].sp.filter(s => before.st[s.id] !== 'boom' && after.st[s.id] === 'boom').map(s => s.name);
    toast(died.length ? `${sp.name} исчез — без корма вымерли: ${died.join(', ')}.` : boom.length ? `${sp.name} исчез — у вида «${boom.join(', ')}» не осталось врагов: вспышка численности!` : `${sp.name} исчез, но остальные нашли другой корм.`);
  }
  const m = model();

}

}

// ---------- lesson 2 scene: carbon cycle ----------
function edgePt(n, tx, ty) {
  const dx = tx - n.x, dy = ty - n.y, k = Math.min(Math.abs(dx) > 1e-6 ? (n.w / 2 + 4) / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? (n.h / 2 + 4) / Math.abs(dy) : 1e9);
  return [n.x + dx * k, n.y + dy * k];
}
function procGeom(p) {
  const A = NODES[p.a], B = NODES[p.b], L = Math.hypot(B.x - A.x, B.y - A.y), nx = -(B.y - A.y) / L, ny = (B.x - A.x) / L;
  const cx = (A.x + B.x) / 2 + nx * p.bend * 1.6, cy = (A.y + B.y) / 2 + ny * p.bend * 1.6;
  const P0 = edgePt(A, cx, cy), P1 = edgePt(B, cx, cy);
  return { P0, C: [cx, cy], P1, at: t => [(1 - t) * (1 - t) * P0[0] + 2 * t * (1 - t) * cx + t * t * P1[0], (1 - t) * (1 - t) * P0[1] + 2 * t * (1 - t) * cy + t * t * P1[1]] };
}
function cycleScene(now) {
  let h = bench();
  // arrows
  PROCS.forEach(p => {
    const g = procGeom(p), on = !S.anim && avail(p), blocked = p.id === 'decay' && !S.decOn, col = on ? '#ffd36b' : blocked ? '#ff8a73' : '#3a4762';
    h += `<path d="M${f(g.P0[0])} ${f(g.P0[1])}Q${f(g.C[0])} ${f(g.C[1])} ${f(g.P1[0])} ${f(g.P1[1])}" stroke="${col}" stroke-width="${on ? 2.4 : 1.5}" fill="none" ${blocked ? 'stroke-dasharray="5 4"' : ''}/>`;
    h += arrowHead(g.P1[0], g.P1[1], Math.atan2(g.P1[1] - g.C[1], g.P1[0] - g.C[0]), col, on ? 9 : 7);
  });
  // nodes
  NK.forEach(k => {
    const n = NODES[k], here = S.at === k && !S.anim, off = k === 'decomp' && !S.decOn;
    h += `<g data-hit="n-${k}"><rect x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="11" fill="${k === 'fossil' ? '#141a24' : '#1a2438'}" stroke="${here ? '#ffd36b' : n.c}" stroke-width="${here ? 2.6 : 1.5}" ${off ? 'stroke-dasharray="4 4" opacity=".45"' : ''}/>`;
    h += T(n.x, n.y - 3, n.name, 12, n.c, 'text-anchor="middle" font-weight="600"') + T(n.x, n.y + 13, off ? 'убраны из опыта' : n.sub, 9.5, '#8b96ad', 'text-anchor="middle"') + `</g>`;
    if (k === 'air') h += `<circle cx="${n.x + n.w / 2 + 18}" cy="${n.y - 8}" r="11" fill="#ffd36b" opacity=".85"/>`;
  });
  // labels (tappable)
  PROCS.forEach(p => {
    const g = procGeom(p), [lx, ly] = g.at(.5), on = !S.anim && avail(p), blocked = p.id === 'decay' && !S.decOn, w = p.name.length * 6.4 + 16;
    h += `<g data-hit="p-${p.id}"><rect x="${f(lx - w / 2)}" y="${f(ly - 10)}" width="${f(w)}" height="20" rx="10" fill="${on ? '#ffd36b' : '#121a28'}" stroke="${on ? '#ffd36b' : blocked ? '#ff8a73' : '#3a4762'}"/>`;
    h += T(lx, ly + 4, p.name, 10.5, on ? INK : blocked ? '#ff8a73' : '#8b96ad', 'text-anchor="middle" font-weight="600"') + `</g>`;
  });
  // atom
  let ax, ay;
  if (S.anim) {
    const k = clamp((now - S.anim.t0) / 900, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    [ax, ay] = procGeom(S.anim.p).at(e);
  } else { const n = NODES[S.at]; ax = n.x - n.w / 2 + 2; ay = n.y - n.h / 2 + 2; }
  h += `<circle cx="${f(ax)}" cy="${f(ay)}" r="17" fill="url(#glow)" opacity=".7" pointer-events="none"/><circle cx="${f(ax)}" cy="${f(ay)}" r="9" fill="#1b1404" stroke="#ffd36b" stroke-width="2" pointer-events="none"/>` +
    `<text x="${f(ax)}" y="${f(ay + 4)}" font-size="11" font-weight="600" fill="#ffd36b" text-anchor="middle" pointer-events="none">C</text>`;
  if (!S.decOn) {
    const n = NODES.dead;
    for (let i = 0; i < 5; i++) h += `<ellipse cx="${n.x - 40 + i * 20}" cy="${n.y + 30}" rx="10" ry="4" fill="#7a5a36" opacity=".8"/>`;
    h += T(n.x, n.y + 46, 'остатки копятся', 9.5, '#ff8a73', 'text-anchor="middle"');
  }
  return h;
}

// ---------- lesson 3 scene: food web stress test ----------

  W.sp.forEach(s => {
    if (!s.eats) return;
    const [x1, y1] = webXY(w, s);
    s.eats.forEach(e => {
      const fd = W.sp.find(z => z.id === e), [x0, y0] = webXY(w, fd), live = ws.alive[e] && ws.alive[s.id];
      const sx = x0, sy = fd.row === s.row ? y0 : y0 - NH / 2, ex = x1, ey = fd.row === s.row ? y1 : y1 + NH / 2;

      } else {

      }
    });
  });
  W.sp.forEach(s => {
    const [x, y] = webXY(w, s), st = ws.st[s.id], sel = S.nsel === s.id;
    const stroke = st === 'off' ? '#56627d' : st === 'dead' ? '#ff8a73' : st === 'boom' ? '#ffb547' : ROWC[s.row];
    h += `<g data-hit="sp-${s.id}"><rect x="${f(x - NW / 2)}" y="${f(y - NH / 2)}" width="${NW}" height="${NH}" rx="8" fill="${st === 'off' || st === 'dead' ? '#10151f' : '#1a2438'}" stroke="${stroke}" stroke-width="${sel ? 2.6 : 1.6}" ${st === 'off' || st === 'dead' ? 'stroke-dasharray="4 3"' : ''}/>`;
    h += T(x, y + 4, s.name, s.name.length > 13 ? 9.5 : 11, st === 'off' ? '#56627d' : st === 'dead' ? '#ff8a73' : '#e8ecf4', `text-anchor="middle" font-weight="600" ${st === 'off' ? 'text-decoration="line-through"' : ''}`);
    if (st !== 'ok') {
      const tag = st === 'off' ? 'убран' : st === 'dead' ? 'вымер' : 'вспышка ▲', tw = tag.length * 5.6 + 10, tc = st === 'off' ? '#8b96ad' : st === 'dead' ? '#ff8a73' : '#ffb547';
      h += `<rect x="${f(x + NW / 2 - tw + 4)}" y="${f(y - NH / 2 - 9)}" width="${f(tw)}" height="14" rx="7" fill="#0b1019" stroke="${tc}"/>` + T(x + NW / 2 - tw / 2 + 4, y - NH / 2 + 1.5, tag, 8.5, tc, 'text-anchor="middle"');

  h += T(14, 404, `животных выжило: ${ws.aliveAn} из ${ws.nAn} · связей: ${ws.links} из ${ws.links0}`, 10, ws.aliveAn === ws.nAn ? '#86e0a8' : '#ffb547');

}

function hlBox(id) {
  const L = LID();
  if (L === 'chain') return { pool: [4, 106, 512, 132], slots: [4, 242, 512, 72], arrows: [116, 254, 290, 28], pyr: [14, 330, 492, 74] }[id];
  if (L === 'cycle') { if (id === 'atom') id = S.at; const n = NODES[id]; if (n) return [n.x - n.w / 2 - 6, n.y - n.h / 2 - 6, n.w + 12, n.h + 12]; return null; }
  const r = { top: 3, pred: 2, herb: 1, plants: 0 }[id];
  if (r !== undefined) return [4, ROWY[r] - 22, 512, 44];

const scene = $('#scene');
function drawScene(t) {
  const id = LID();

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 524, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true; placeHint();
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer: taps and dragging ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const slotAt = p => { for (let i = 0; i < 4; i++) { const x = slotX(i); if (p.x > x - 8 && p.x < x + SW + 8 && p.y > SY - 14 && p.y < SY + SH + 14) return i; } return -1; };

  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag) {
    const kind = el.dataset.drag;
    drag = { kind, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false, dx: -CW / 2, dy: -CH / 2 };
    const c = +kind.slice(1); const [x, y] = homeXY(c); drag.dx = x - p.x; drag.dy = y - p.y;
    scene.classList.add('grabbing');
  } else drag = { kind: 'hit', hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.kind === 'hit' || !drag.moved) return;
  const p = toSvg(e); drag.px = p.x; drag.py = p.y; dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) { dirty = true; return; }
  const k = d.kind;
  if (k[0] === 'c') {
    const c = +k.slice(1);
    if (!d.moved) { S.csel = S.csel === c ? -1 : c; S.look = c; update(); return; }
    place(c, slotAt({ x: d.px, y: d.py }));
    return;
  }
  if (d.moved) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'chain' && id.startsWith('slot')) {
    const i = +id.slice(4);
    if (S.csel >= 0) place(S.csel, i); else if (S.slot[i] >= 0) unslot(i); else toast('Сначала нажмите на организм, потом на ячейку цепи.');
  }
  if (L === 'cycle') {
    if (id.startsWith('p-')) doProc(id.slice(2));
    else if (id.startsWith('n-')) { const k = id.slice(2); toast(`${NODES[k].name}: углерод здесь задерживается ${NODES[k].stay}.`); }
  }
  if (L === 'stable' && id.startsWith('sp-')) toggleSp(id.slice(3));
}

function loop(t) {
  requestAnimationFrame(loop);
  if (S.anim && t - S.anim.t0 >= 900) finishMove();
  if (dirty || S.hl || S.anim) { drawScene(t); dirty = false; }
}

  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'chain') {
    h = `<h2>Цепь и энергия</h2>` + slider('inE', 'Энергия в растениях', 5000, 100000, 5000, S.E) +
      `<dl class="reads"><div><dt>Звеньев</dt><dd id="r1"></dd></div><div><dt>Связи</dt><dd id="r2"></dd></div><div><dt>Вершина</dt><dd id="r3"></dd></div></dl>` +
      `<h3>Ваша цепь</h3><div class="steps" id="chainList"></div>` +
      `<h3>Кто что ест</h3><div class="steps">` + ORG.map(o => step(o.name, o.prod ? 'продуцент: фотосинтез' : o.eats.map(e => ORG[OI(e)].name.toLowerCase()).join(', '))).join('') + `</div>` +
      `<div class="row"><button class="ghostbtn" data-a="reset">Очистить цепь</button></div>`;
  }
  if (id === 'cycle') {
    h = `<h2>Путь атома углерода</h2>` + chips('decChips', [['on', 'есть'], ['off', 'нет']], 'Редуценты') +
      `<dl class="reads"><div><dt>Атом</dt><dd id="r1"></dd></div><div><dt>Шагов</dt><dd id="r2"></dd></div><div><dt>Кругов</dt><dd id="r3"></dd></div></dl>` +
      `<h3>Куда можно отсюда</h3><div class="chips" id="procChips"></div>` +
      `<div class="row"><button class="ghostbtn" data-a="reset">Вернуть атом в воздух</button></div>`;
  }
  if (id === 'stable') {
    h = `<h2>Стресс-тест сообществ</h2>` + chips('wChips', WK.map(k => [k, WEB[k].name]), 'Сообщество') +
      `<dl class="reads"><div><dt>Убрано растений</dt><dd id="r1"></dd></div><div><dt>Животных живо</dt><dd id="r2"></dd></div><div><dt>Связей</dt><dd id="r3"></dd></div></dl>` +
      `<h3>Виды (нажмите, чтобы убрать или вернуть)</h3><div class="chips" id="spChips"></div>` +
      chips('aChips', [['steppe', 'Степь'], ['field', 'Поле пшеницы']], 'Что устойчивее?') +
      `<div class="row"><button class="ghostbtn" data-a="reset">Вернуть всех</button></div>`;
  }
  el.innerHTML = h;
  const on = (s, fn) => { const x = el.querySelector(s); if (x) x.addEventListener('input', e => fn(+e.target.value)); };
  on('#inE', setE);
  el.querySelectorAll('#decChips button').forEach(b => b.onclick = () => setDec(b.dataset.k === 'on'));
  el.querySelectorAll('#wChips button').forEach(b => b.onclick = () => setWeb(b.dataset.k));
  el.querySelectorAll('#aChips button').forEach(b => b.onclick = () => answer(b.dataset.k));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'chain') {
    set('#inEO', fmtN(S.E) + ' кДж'); val('#inE', S.E);
    set('#r1', `${m.filled} из 4`); set('#r2', `${m.links.filter(x => x === true).length} из 3 верно`); set('#r3', fmtN(m.top) + ' кДж');
    const cl = el.querySelector('#chainList');
    if (cl) cl.innerHTML = [0, 1, 2, 3].map(i => step(`${i + 1}. ${LVS[i]}`, S.slot[i] >= 0 ? ORG[S.slot[i]].name : '—')).join('');
  } else if (m.kind === 'cycle') {
    el.querySelectorAll('#decChips button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.k === 'on') === S.decOn));
    set('#r1', NODES[m.at].name); set('#r2', String(m.steps)); set('#r3', String(m.cycles));
    const pc = el.querySelector('#procChips');
    if (pc) {
      pc.innerHTML = PROCS.filter(p => p.a === S.at).map(p => `<button data-p="${p.id}" ${p.id === 'decay' && !S.decOn ? 'disabled' : ''}>${p.name} → ${NODES[p.b].name.toLowerCase()}</button>`).join('');
      pc.querySelectorAll('button').forEach(b => b.onclick = () => doProc(b.dataset.p));
    }
  } else {
    el.querySelectorAll('#wChips button').forEach(b => b.setAttribute('aria-pressed', S.web === b.dataset.k));
    el.querySelectorAll('#aChips button').forEach(b => { b.setAttribute('aria-pressed', S.ans === b.dataset.k); b.disabled = !m.ready; });
    const c = m.cur;
    set('#r1', String(c.offP)); set('#r2', `${c.aliveAn} из ${c.nAn}`); set('#r3', `${c.links} из ${c.links0}`);
    const sc = el.querySelector('#spChips');
    if (sc) {
      sc.innerHTML = WEB[S.web].sp.map(s => `<button data-s="${s.id}" aria-pressed="${!!S.off[S.web][s.id]}">${S.off[S.web][s.id] ? '✗ ' : ''}${s.name}</button>`).join('');
      sc.querySelectorAll('button').forEach(b => b.onclick = () => toggleSp(b.dataset.s));
    }
  }
}

function partsList() {
  const id = LID();
  if (id === 'chain') return [
    { id: 'pool', icon: ICON.pool, name: 'Обитатели степи', spec: 'Девять видов. Зелёная точка — продуцент (растение), серая — консумент.' },
    { id: 'slots', icon: ICON.slots, name: 'Звенья цепи', spec: 'Четыре ячейки: продуцент и консументы I, II, III порядка. Зелёная рамка — связь верна, красная — ошибка.' },
    { id: 'arrows', icon: ICON.arrows, name: 'Стрелки', spec: 'Идут от пищи к тому, кто её ест, — по направлению потока энергии.' },
    { id: 'pyr', icon: ICON.pyr, name: 'Пирамида энергии', spec: 'Сколько энергии на каждом уровне. Каждая ступень в 10 раз меньше предыдущей.' }];
  if (id === 'cycle') return [{ id: 'atom', icon: ICON.atom, name: 'Атом углерода', spec: 'Жёлтый шарик «C». Двигается только по стрелкам-процессам.' }]
    .concat(NK.map(k => ({ id: k, icon: box(NODES[k].c, ''), name: NODES[k].name, spec: `${cap(NODES[k].sub)}. Углерод здесь задерживается ${NODES[k].stay}.` })));
  return [
    { id: 'plants', icon: ICON.plants, name: 'Продуценты', spec: 'Нижний ряд. Растения — основа всей сети: только они создают органику из CO₂ и воды.' },
    { id: 'herb', icon: ICON.herb, name: 'Консументы I порядка', spec: 'Растительноядные. Оранжевая метка «вспышка» — у вида не осталось врагов.' },
    { id: 'pred', icon: ICON.pred, name: 'Консументы II порядка', spec: 'Хищники. Вымирают, если исчезла вся их добыча.' },
    { id: 'top', icon: ICON.top, name: 'Консументы III порядка', spec: 'Змееяд в степи — хищник, который ест хищника.' },
    { id: 'sum', icon: ICON.sum, name: 'Итог', spec: 'Сколько животных выжило и сколько пищевых связей осталось.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    const h = `<h2>${L.id === 'cycle' ? 'Узлы круговорота' : L.id === 'stable' ? 'Пищевая сеть' : 'Что на столе'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'chain') {
    let h = `<h2>Правило 10%</h2><div class="formula">E(n+1) = E(n) × 0,1</div><div class="steps">` +
      step(`${LVS[0]}${S.slot[0] >= 0 ? ' · ' + ORG[S.slot[0]].name : ''}`, fmtN(m.E[0]) + ' кДж');
    for (let i = 1; i < 4; i++) h += step(`${LVS[i]}${S.slot[i] >= 0 ? ' · ' + ORG[S.slot[i]].name : ''}`, `${fmtN(m.E[i - 1])} × 0,1 = ${fmtN(m.E[i])} кДж`);
    h += step('Дошло до вершины', `${fmtN(m.top)} кДж = ${fmtN(m.E[0])} × 0,1³`, 'sum') + step('Цель', `${TOP_GOAL} кДж ${m.top === TOP_GOAL ? '✓' : m.top > TOP_GOAL ? '— больше, уменьшите' : '— меньше, увеличьте'}`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">Обратная задача: чтобы узнать, сколько энергии нужно растениям, энергию вершины делят на 0,1 столько раз, сколько переходов в цепи: E₁ = E₄ / 0,1³. В природе на следующий уровень переходит от 5 до 20%, 10% — среднее.</p>`;
    h += `<h3>Проверка связей</h3><div class="steps">` +
      step('1. Начало — продуцент?', m.prodOk === null ? '—' : m.prodOk ? 'да ✓' : 'нет ✗') +
      [0, 1, 2].map(i => step(`${i + 2}. ${S.slot[i + 1] >= 0 ? ORG[S.slot[i + 1]].name : '?'} ест ${S.slot[i] >= 0 ? ORG[S.slot[i]].name.toLowerCase() : '?'}?`, m.links[i] === null ? '—' : m.links[i] ? 'да ✓' : 'нет ✗')).join('') +
      step('Цепь', m.chainOk ? 'верна ✓' : m.filled < 4 ? `заполнено ${m.filled} из 4` : 'есть ошибки', 'sum') + `</div>`;
    h += `<h3>Куда уходят 90%</h3><div class="steps">` + step('Дыхание: энергия → тепло', 'большая часть') + step('Движение, поддержание тела', 'тоже на дыхание') + step('Несъеденное и непереваренное', 'к редуцентам') + `</div>`;
    return h;
  }
  if (id === 'cycle') {
    let h = `<h2>Уравнения процессов</h2><div class="formula">Фотосинтез: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂<br>Дыхание: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</div>`;
    h += `<p class="note">Фотосинтез идёт на свету и запасает энергию в глюкозе. Дыхание идёт всегда и у всех: у растений, животных, грибов и бактерий.</p>`;
    h += `<h3>Путь атома</h3><div class="steps">` + (S.log.length ? S.log.slice(-12).map((pid, i, arr) => { const p = PI(pid); return step(`${S.log.length - arr.length + i + 1}. ${p.name}`, `${NODES[p.a].name.toLowerCase()} → ${NODES[p.b].name.toLowerCase()}`); }).join('') : step('Атом ещё не двигался', 'воздух')) +
      step('Сейчас', NODES[S.at].name, 'sum') + `</div>`;
    const tr = S.trip;
    h += `<h3>Текущий круг</h3><div class="steps">` + ['plant', 'animal', 'decomp'].map(k => step(NODES[k].name, tr.includes(k) ? 'пройдено ✓' : '—')).join('') +
      step('Задание', S.cycleOk ? 'полный круг пройден ✓' : 'вернитесь в воздух, пройдя все три', 'sum') + `</div>`;
    h += `<h3>Сколько углерод задерживается</h3><div class="steps">` + NK.map(k => step(NODES[k].name, NODES[k].stay)).join('') + `</div>`;
    return h;
  }
  const W = WEB[S.web], c = m.cur;
  let h = `<h2>${W.name}: кто выжил</h2><div class="formula">животное живо, если осталась хоть одна его пища</div><div class="steps">`;
  W.sp.filter(s => !s.prod).forEach(s => {
    const n = s.eats.filter(e => c.alive[e]).length, st = c.st[s.id];
    h += step(`${s.name}: корм ${n} из ${s.eats.length}`, st === 'off' ? 'убран' : st === 'dead' ? 'вымер ✗' : st === 'boom' ? 'жив, нет врагов ▲' : 'жив ✓');
  });
  h += step('Выжило животных', `${c.aliveAn} из ${c.nAn} = ${Math.round(c.aliveAn / c.nAn * 100)}%`, 'sum') + `</div>`;
  h += `<h3>Сравнение</h3><div class="steps">` + WK.map(k => { const s = k === 'steppe' ? m.ws : m.wf; return step(WEB[k].name, `убрано растений ${s.offP}, живо животных ${s.aliveAn}/${s.nAn}`); }).join('') +
    step('Средний корм на животное', WK.map(k => { const sp = WEB[k].sp.filter(s => !s.prod); return `${WEB[k].name.split(' ')[0].toLowerCase()} ${(sp.reduce((a, s) => a + s.eats.length, 0) / sp.length).toFixed(1).replace('.', ',')}`; }).join(' · ')) + `</div>`;
  if (!m.ready) h += `<p class="note" style="margin-top:10px">Сравнение будет честным, когда в обоих сообществах уберёте по 2 вида растений.</p>`;
  h += `<p class="note" style="margin-top:10px">Модель упрощена: в ней вид исчезает, только когда пропал весь корм. В природе численность падает и раньше, а вспышка грызунов или саранчи выедает растения.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'chain') {
    const lk = S.look >= 0 ? ORG[S.look] : null;
    el.innerHTML = `<div class="k">На вершине</div><div class="v ${m.top === TOP_GOAL && m.chainOk ? 'ok' : ''}">${fmtN(m.top)} кДж</div>
      <div class="gauge"><b style="width:${(m.filled / 4 * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>растения</span><span>${fmtN(S.E)}</span></div>` + (lk ? `<div class="lr"><span>${lk.name}: ${lk.d}</span></div>` : `<div class="lr"><span>звеньев</span><span>${m.filled}/4</span></div>`);
  } else if (m.kind === 'cycle') {
    el.innerHTML = `<div class="k">Атом углерода</div><div class="v">${S.anim ? 'в пути…' : NODES[m.at].name}</div>
      <div class="gauge"><b style="width:${(['plant', 'animal', 'decomp'].filter(k => m.trip.includes(k)).length / 3 * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>шагов</span><span>${m.steps}</span></div><div class="lr"><span>кругов</span><span>${m.cycles}</span></div>`;
  } else {
    const c = m.cur;
    el.innerHTML = `<div class="k">${WEB[S.web].name}</div><div class="v ${c.aliveAn === c.nAn ? 'ok' : c.aliveAn === 0 ? 'bad' : ''}">${c.aliveAn} / ${c.nAn}</div>
      <div class="gauge"><b style="width:${(c.aliveAn / c.nAn * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>вымерло</span><span>${c.dead}</span></div><div class="lr"><span>вспышки</span><span>${c.boom}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий эколог!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

      `Цепь ученика: ${[0, 1, 2, 3].map(i => `${LVS[i]} — ${S.slot[i] >= 0 ? ORG[S.slot[i]].name : 'пусто'}`).join('; ')}. ` +
      `Начало — продуцент: ${m.prodOk === null ? 'не выбрано' : m.prodOk ? 'да' : 'нет'}. Связи: ${m.links.map((x, i) => `${i + 1}→${i + 2}: ${x === null ? 'не заполнено' : x ? 'верно' : 'неверно'}`).join(', ')}. Цепь ${m.chainOk ? 'верна' : 'не готова'}. ` +

  }
  if (id === 'cycle') {
    now = `Схема круговорота углерода: воздух (CO₂), растения, животные, мёртвая органика, редуценты, уголь и нефть в недрах; стрелки — процессы (фотосинтез, дыхание, питание, опад, смерть и помёт, разложение, захоронение, сжигание). Редуценты ${S.decOn ? 'есть' : 'убраны из опыта (разложение невозможно)'}. ` +
      `Атом углерода сейчас: ${NODES[S.at].name.toLowerCase()}. Отсюда можно: ${PROCS.filter(avail).map(p => `${p.name.toLowerCase()} → ${NODES[p.b].name.toLowerCase()}`).join(', ') || 'никуда'}. ` +
      `Пройденный путь: ${S.log.length ? S.log.map(p => PI(p).name.toLowerCase()).join(' → ') : 'пока нет'}. В текущем круге атом побывал: ${S.trip.map(k => NODES[k].name.toLowerCase()).join(', ')}. Полных кругов: ${S.cycles}. Цель: вернуть атом из воздуха в воздух через растение, животное и редуцентов.`;
    guide = 'Не называй всю последовательность процессов. Спрашивай, как углерод из воздуха попадает в растение, как он может перейти к животному и что происходит с телом животного после смерти. Объясни роль редуцентов, если ученик застрял.';
  }
  if (id === 'stable') {
    const desc = w => { const s = webState(w); return `${WEB[w].name}: ${WEB[w].sp.map(x => `${x.name} — ${{ ok: 'живёт', off: 'убран учеником', dead: 'вымер без корма', boom: 'вспышка численности' }[s.st[x.id]]}`).join('; ')}. Убрано растений ${s.offP}, живо животных ${s.aliveAn} из ${s.nAn}`; };
    now = `Модель пищевых сетей: животное вымирает, если исчезла вся его пища. На экране: ${WEB[S.web].name}. ${desc('steppe')}. ${desc('field')}. ` +
      `Стресс-тест ${m.ready ? 'проведён в обоих сообществах' : 'не завершён (нужно убрать по 2 растения в каждом)'}. Ответ ученика: ${S.ans ? (S.ans === 'steppe' ? 'степь устойчивее' : 'поле устойчивее') : 'нет'}.`;
    guide = 'Не говори сразу, какое сообщество устойчивее. Попроси сравнить, сколько животных выжило, и посчитать, сколько видов корма у суслика в степи и у клопа-черепашки в поле. Подведи к мысли: чем больше видов и связей, тем устойчивее.';
  }
  return [
    `Раздел: биология, 10 класс, раздел «Экология», тема «Экосистемы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    chain: 'Почему в пищевой цепи редко бывает больше 5 звеньев?', cycle: 'Что случилось бы на Земле, если бы исчезли все редуценты?',
    stable: 'Почему поле пшеницы без человека быстро зарастает сорняками?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
