<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 9 класс: линейный и бинарный поиск, сортировки, сложность алгоритма, рекурсия.">
<title>Алгоритмы обработки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag="plot"]{cursor:ew-resize}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .val{font:500 12px var(--font-mono);color:var(--fg);padding:0 4px;white-space:nowrap}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing.code{white-space:pre;overflow-x:auto;overflow-wrap:normal;font-size:12.5px}
.listing .cur{color:var(--force)}
.listing .bad{color:var(--warn)}
.listing .cm{color:var(--muted)}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}
.step.cur{outline:1px solid var(--force)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 360px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="8" y="24" width="5" height="8" rx="1" fill="var(--arm)"/><rect x="15" y="19" width="5" height="13" rx="1" fill="var(--arm)"/><rect x="22" y="14" width="5" height="18" rx="1" fill="var(--force)"/><circle cx="26" cy="12" r="5" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M29.5 15.5l4 4" stroke="var(--fg)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Информатика · Алгоритмы обработки</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Обработка</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена с данными и алгоритмом"></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const big = n => Math.round(n).toLocaleString('ru-RU');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'search', title: 'Поиск: линейный и бинарный',
    text: ['Поиск — одна из самых частых задач компьютера: найти контакт в телефоне, товар в каталоге, слово в словаре. Данные обычно лежат в списке, и у каждого элемента есть номер — индекс. В Python индексы начинаются с 0.',
           'Линейный поиск проверяет элементы по очереди, от начала до конца. Он работает с любым списком, но в худшем случае делает столько сравнений, сколько в списке элементов.',
           'Если список упорядочен, можно искать гораздо быстрее. Бинарный поиск смотрит на средний элемент. Он меньше искомого — отбрасываем всю левую половину, больше — правую. Каждое сравнение делит зону поиска пополам.'],
    why: 'Базы данных банков, интернет-магазинов и eGov ищут нужную запись среди миллионов по тому же принципу «отбрасывай лишнее»: упорядоченные индексы позволяют найти строку за десятки сравнений, а не за миллионы. Бэкенд-разработчик, который это понимает, пишет сервисы, которые не тормозят, — такие специалисты нужны IT-компаниям Казахстана, в том числе резидентам Astana Hub. В жизни тот же приём помогает найти слово в бумажном словаре: открываешь посередине, а не листаешь с первой страницы.',
    task: 'Числа на 15 карточках упорядочены по возрастанию. Найдите карточку с загаданным числом, открыв не больше 4 карточек.',
    hint: 'Откройте среднюю карточку зоны поиска и сравните её число с загаданным — половина ряда отпадёт. Не уложились в 4 — «Новый ряд». Кнопка «Линейный поиск» покажет, как ищут перебором.',
    stage: 'Нажимайте на карточки, чтобы открыть их. Тусклые карточки уже вне зоны поиска.',
    n: 15, maxOpen: 4, seed: 3,
    check: m => m.found && m.opens <= m.max },
  { id: 'sort', title: 'Сортировки',
    text: ['Сортировка — это расстановка элементов по порядку: по возрастанию цены, по алфавиту, по дате. Отсортированные данные легче читать, и только в них работает быстрый бинарный поиск.',
           'Сортировка пузырьком сравнивает соседей и меняет их местами, если левый больше правого. За один проход самый большой элемент «всплывает» в конец, как пузырёк. Сортировка выбором ищет минимум среди неотсортированных и ставит его в начало.',
           'Инверсия — это пара элементов, в которой больший стоит левее меньшего. Обмен соседей, стоящих не по порядку, убирает ровно одну инверсию. Поэтому пузырёк делает столько обменов, сколько в массиве инверсий.'],
    why: 'Сортировка работает каждый раз, когда в интернет-магазине выбираешь «сначала дешёвые» или смотришь рейтинг по баллам ЕНТ. Аналитик данных в банке или торговой сети сортирует миллионы строк, чтобы найти крупнейших клиентов и самые ходовые товары. Встроенная функция sorted() в Python работает намного быстрее пузырька, но в основе та же идея: сравнения и перестановки.',
    task: 'Расставьте столбики по возрастанию слева направо, меняя местами только соседей. Ни одного лишнего обмена: каждый обмен должен исправлять беспорядок.',

// ---------- seeded random ----------
const RNG = seed => { let x = (seed * 48271 + 11) % 2147483647; if (x <= 0) x += 2147483646; const r = () => (x = (x * 16807) % 2147483647) / 2147483647; r(); r(); return r; };

// ---------- lesson 1: search ----------
const N1 = 15;
function makeRow(seed) {
  const r = RNG(seed), pool = [];
  for (let v = 10; v <= 99; v++) pool.push(v);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const arr = pool.slice(0, N1).sort((a, b) => a - b), ti = Math.floor(r() * N1);
  return { arr, ti, x: arr[ti] };
}
function zone() {
  let lo = 0, hi = N1 - 1;
  for (const i of S.opened) { const v = S.arr[i]; if (v < S.x) lo = Math.max(lo, i + 1); else if (v > S.x) hi = Math.min(hi, i - 1); }
  return [lo, hi];
}
// ---------- lesson 2: sort ----------
const inversions = a => { let c = 0; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) c++; return c; };
const isSorted = a => a.every((v, i) => i === 0 || a[i - 1] <= v);
function shuffleBars(seed) {
  const r = RNG(seed);
  for (let k = 0; k < 200; k++) {
    const a = [1, 2, 3, 4, 5, 6, 7, 8];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    const v = inversions(a); if (v >= 10 && v <= 18) return a;
  }
  return LESSONS[1].start.slice();
}
function sortPlan(a0, kind) {
  const a = a0.slice(), ev = [];
  if (kind === 'bubble') {
    for (let i = 0; i < a.length - 1; i++) for (let j = 0; j < a.length - 1 - i; j++) {
      ev.push({ t: 'cmp', i: j, j: j + 1 });
      if (a[j] > a[j + 1]) { [a[j], a[j + 1]] = [a[j + 1], a[j]]; ev.push({ t: 'swap', i: j, j: j + 1 }); }
    }
  } else {
    for (let i = 0; i < a.length - 1; i++) {
      let mi = i;
      for (let j = i + 1; j < a.length; j++) { ev.push({ t: 'cmp', i: mi, j }); if (a[j] < a[mi]) mi = j; }
      if (mi !== i) { [a[i], a[mi]] = [a[mi], a[i]]; ev.push({ t: 'swap', i, j: mi }); }
      ev.push({ t: 'fix', i });
    }
  }
  return ev;
}
// ---------- lesson 3: complexity ----------
const fLin = n => n, fBin = n => Math.floor(Math.log2(n)) + 1, fBub = n => n * (n - 1) / 2;
// ---------- lesson 4: Hanoi ----------
const RN = 'ABC';
function hanoiPlan(n) {
  const out = [], st = [];
  (function h(k, a, c, b) {
    if (k === 0) return;
    st.push({ k, a, c, b });
    h(k - 1, a, b, c);
    out.push({ from: a, to: c, stack: st.slice() });
    h(k - 1, b, c, a);
    st.pop();
  })(n, 0, 2, 1);
  return out;
}
const callName = f => `hanoi(${f.k}, '${RN[f.a]}', '${RN[f.c]}', '${RN[f.b]}')`;

function resetSearch(seed) {
  const r = makeRow(seed); S.seed = seed; S.arr = r.arr; S.ti = r.ti; S.x = r.x; S.opened = []; S.lin = null; S.linRes = null; S.flip = null;
}
function resetSort(arr) { S.bars = arr.slice(); S.inv0 = inversions(arr); S.swaps = 0; S.extra = 0; S.sAuto = null; S.sAutoRes = null; S.autoUsed = false; S.cmp = null; S.lastSwap = null; }
function resetHanoi(n) { S.hn = n; S.rods = [[], [], []]; for (let k = n; k >= 1; k--) S.rods[0].push(k); S.held = null; S.moves = 0; S.hAuto = null; S.hAutoUsed = false; S.stack = []; S.hBad = null; }

function model() {
  const id = LID();

    return { kind: 'search', x: S.x, opens: S.opened.length, max: L().maxOpen, lo, hi, found, lin: S.lin, linRes: S.linRes };
  }
  if (id === 'sort') {
    return { kind: 'sort', a: S.bars, inv: inversions(S.bars), inv0: S.inv0, swaps: S.swaps, extra: S.extra, sorted: isSorted(S.bars), auto: S.autoUsed, running: !!S.sAuto, res: S.sAutoRes };
  }
  if (id === 'cx') {
    const n = S.cn;
    return { kind: 'cx', n, lin: fLin(n), bin: fBin(n), bub: fBub(n), limit: L().limit };
  }
  return { kind: 'rec', n: S.hn, moves: S.moves, min: 2 ** S.hn - 1, onC: S.rods[2].length, auto: S.hAutoUsed, running: !!S.hAuto, held: S.held };
}

function diskRect(rod, level, k) {

function hlBoxes(id) {
  const id0 = LID();
  if (id0 === 'search') {
    const w = CW(), y = CY(), hh = CH(), [lo, hi] = zone();

    if (id === 'zone') return lo <= hi ? [[CX(lo) - 4, y - 28, CX(hi) + w - CX(lo) + 8, hh + 32]] : [];
    if (id === 'mid') { const m = (lo + hi) >> 1; return lo <= hi ? [[CX(m) - 4, y - 4, w + 8, hh + 22]] : []; }
    if (id === 'log') return [[CX(0) - 4, LOGY() - 14, NAR ? 296 : 330, 100]];

  }
  if (id0 === 'sort') {

    if (id === 'swap') { const r = NAR ? 12 : 13; return [[HX(0) - r - 4, HY() - r - 4, HX(6) - HX(0) + 2 * r + 8, 2 * r + 8]]; }

    if (id === 'marker') { const x = PXn(S.cn); return [[x - 8, p.y1 - 8, 16, p.y0 - p.y1 + 12]]; }

function drawScene(t) {
  const id = LID();

// fit the scene under the task box when there is room
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;

// ---------- pointer ----------
let dirty = true, drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

// ---------- actions ----------
function openCard(i) {

  if (S.opened.includes(i)) return;
  if (i < lo || i > hi) { toast(`Карточка ${i} уже вне зоны поиска: ясно, что там число ${i < lo ? 'меньше' : 'больше'} ${S.x}. Открывать её незачем.`); return; }
  if (S.opened.length >= L().maxOpen) { toast(`Попытки кончились: уже ${L().maxOpen} карточки. Нажмите «Новый ряд».`); return; }
  S.opened.push(i); S.flip = { i, t: performance.now() };
  const v = S.arr[i];
  if (v === S.x) toast(`Нашли! a[${i}] = ${S.x}. Открыто карточек: ${S.opened.length}.`);
  else if (S.opened.length >= L().maxOpen) toast(`Это была ${L().maxOpen}-я карточка, а число не найдено. «Новый ряд» — и открывайте середину.`);

}
function startLinear() {
  if (S.lin) return;
  resetSearch(S.seed); S.lin = { i: 0, t: performance.now() }; update();
}
const LSTEP = () => reduce ? 90 : 300;
function tickLinear(t) {

    return;

    toast(`Линейный поиск нашёл ${S.x} за ${c} ${plural(c, 'сравнение', 'сравнения', 'сравнений')}. Бинарному хватит 4. Ваш ход — новый ряд.`);

}

function swapAt(i) {

function startSort(kind) {

const SSTEP = () => reduce ? 90 : 330;
function tickSort(t) {

    toast(`${A.kind === 'bubble' ? 'Пузырёк' : 'Выбором'}: ${A.comps} ${plural(A.comps, 'сравнение', 'сравнения', 'сравнений')}, ${A.swaps} ${plural(A.swaps, 'обмен', 'обмена', 'обменов')}.`);

function setN(n) { S.cn = clamp(Math.round(n), 1, L().nMax); update(); }

function tapRod(r) {

  if (S.held === null) {
    if (!S.rods[r].length) { toast(`На стержне ${RN[r]} нет дисков.`); return; }
    S.held = r; update(); return;

}

const HSTEP = () => reduce ? 220 : 750;
function tickHanoi(t) {

  A.t = t;

function act(a) {

  if (a === 'd-') setDisks(S.hn - 1);
  if (a === 'd+') setDisks(S.hn + 1);
  if (/^d[1-5]$/.test(a)) setDisks(+a[1]);
  if (a === 'auto') startHanoi();
  if (a === 'reset' && !S.hAuto) { resetHanoi(S.hn); update(); }
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;

function taskState(m) {
  if (S.done[LID()]) return '✓ Выполнено';
  if (m.kind === 'search') {
    if (m.lin) return `Линейный поиск: проверено ${m.lin.i + 1}`;
    if (m.found) return `Найдено · открыто ${m.opens}`;
    if (m.opens >= m.max) return 'Попытки кончились — «Новый ряд»';
    return `Открыто ${m.opens} из ${m.max} · зона [${m.lo}; ${m.hi}]`;
  }
  if (m.kind === 'sort') {
    if (m.running) return `${S.sAuto.kind === 'bubble' ? 'Пузырёк' : 'Выбором'}: сравнений ${S.sAuto.comps}, обменов ${S.sAuto.swaps}`;
    if (m.auto) return 'Сортировал автомат — «Перемешать» и сами';
    if (m.sorted) return `Отсортировано, лишних обменов ${m.extra} — «Перемешать»`;
    return `Инверсий ${m.inv} · обменов ${m.swaps}` + (m.extra ? ` · лишних ${m.extra}` : '');
  }
  if (m.kind === 'cx') return `n = ${m.n} · пузырёк: ${big(m.bub)} ${plural(m.bub, 'сравнение', 'сравнения', 'сравнений')}` + (m.bub > m.limit ? ' — больше 1000' : '');
  if (m.running) return `Авто: ход ${S.hAuto.k} из ${S.hAuto.plan.length}`;
  if (m.auto) return 'Переносил автомат — «Заново» и сами';
  if (m.n !== 4) return `Дисков ${m.n} · для задания нужно 4`;
  if (m.onC === m.n) return `Башня на C за ${m.moves} · можно за 15 — «Заново»`;
  return `Ходов ${m.moves} · на C ${m.onC} из ${m.n}` + (m.moves > 15 ? ' — уже больше 15' : '');
}

const CODE = {
  search: ['def bin_search(a, x):', '    L, R = 0, len(a) - 1', '    while L <= R:', '        m = (L + R) // 2', '        if a[m] == x:', '            return m', '        if a[m] < x:', '            L = m + 1', '        else:', '            R = m - 1', '    return -1'],
  sort: ['def bubble(a):', '    n = len(a)', '    for i in range(n - 1):', '        for j in range(n - 1 - i):', '            if a[j] > a[j + 1]:', '                a[j], a[j + 1] = a[j + 1], a[j]'],
  cx: [],
  rec: ['def hanoi(n, a, c, b):', '    if n == 0:          # базовый случай', '        return', '    hanoi(n - 1, a, b, c)', '    print(a, \'→\', c)', '    hanoi(n - 1, b, c, a)', '', 'hanoi(4, \'A\', \'C\', \'B\')'],
};
const codeHTML = id => CODE[id].map(s => { const i = s.indexOf('#'); return i > 0 ? esc(s.slice(0, i)) + `<span class="cm">${esc(s.slice(i))}</span>` : esc(s); }).join('\n');

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const lst = el.querySelector('#lst');
  if (m.kind === 'search') {
    set('#r1', String(m.x)); set('#r2', `${m.opens}/${m.max}`); set('#r3', m.found ? 'найдено' : `[${m.lo}; ${m.hi}]`);
    el.querySelectorAll('[data-a]').forEach(b => b.disabled = !!S.lin);
  } else if (m.kind === 'sort') {
    set('#r1', String(m.inv)); set('#r2', String(m.swaps)); set('#r3', String(m.extra));
    el.querySelectorAll('button').forEach(b => b.disabled = !!S.sAuto);
  } else if (m.kind === 'cx') {
    set('#r1', String(m.lin)); set('#r2', String(m.bin)); set('#r3', big(m.bub)); set('#inNO', String(m.n));
    const inN = el.querySelector('#inN'); if (inN && document.activeElement !== inN) inN.value = m.n;
    if (lst) lst.innerHTML = [1, 2, 4, 8].map(k => { const n = m.n * k; return `<div${k === 1 ? ' class="cur"' : ''}>n = ${n}: ${n} · ${fBin(n)} · ${big(fBub(n))}</div>`; }).join('') + '<div class="cm" style="color:var(--muted)">линейный · бинарный · пузырёк</div>';
  } else {
    set('#r1', String(m.n)); set('#r2', String(m.moves)); set('#r3', String(m.min));
    el.querySelectorAll('[data-a]').forEach(b => { b.disabled = !!S.hAuto; if (/^d\d$/.test(b.dataset.a)) b.setAttribute('aria-pressed', +b.dataset.a[1] === m.n); });

  }
}

function calcHTML(m) {
  if (m.kind === 'search') {
    let h = `<h2>Бинарный поиск по шагам</h2><div class="formula">m = (L + R) // 2</div><p class="note">L и R — границы зоны поиска. Если a[m] &lt; x, то L = m + 1; если a[m] &gt; x, то R = m − 1.</p><div class="steps">`;
    let lo = 0, hi = N1 - 1;
    h += step('старт', `L = 0, R = ${N1 - 1}`);
    S.opened.forEach((i, k) => {
      const v = S.arr[i], mm = (lo + hi) >> 1;
      const rel = v === S.x ? `= ${S.x} → нашли` : v < S.x ? `< ${S.x} → L = ${i + 1}` : `> ${S.x} → R = ${i - 1}`;
      h += step(`${k + 1}. середина ${mm}${i !== mm ? `, открыли ${i}` : ''}`, `a[${i}] = ${v} ${rel}`, v === S.x ? 'okk' : '');
      if (v < S.x) lo = Math.max(lo, i + 1); else if (v > S.x) hi = Math.min(hi, i - 1);
    });
    if (!m.found && m.opens < m.max && !S.lin) h += step('сейчас', `L = ${m.lo}, R = ${m.hi}, m = (${m.lo} + ${m.hi}) // 2 = ${(m.lo + m.hi) >> 1}`, 'cur');
    h += `</div><h3>Сколько сравнений в худшем случае</h3><div class="steps">` +
      step('линейный поиск, n = 15', 'до 15') + step('бинарный: зона 15 → 7 → 3 → 1', '4 сравнения') +
      step('формула', '⌊log₂ 15⌋ + 1 = 3 + 1 = 4', 'sum') + step('для 1 000 000 элементов', 'линейный до 10⁶, бинарный 20') + `</div>`;
    if (m.linRes) h += `<p class="note" style="margin-top:10px">Линейный поиск в прошлом ряду: ${m.linRes} ${plural(m.linRes, 'сравнение', 'сравнения', 'сравнений')}.</p>`;
    return h;
  }
  if (m.kind === 'sort') {
    let h = `<h2>Сравнения и обмены</h2><div class="formula">сравнений = n(n − 1) / 2</div><div class="steps">` +
      step('элементов n', '8') + step('сравнений у пузырька', '8 · 7 / 2 = 28') + step('сравнений у выбора', '7 + 6 + … + 1 = 28') +
      step('инверсий в начале', String(m.inv0), 'sum') + step('инверсий сейчас', String(m.inv), m.inv === 0 ? 'okk' : '') +
      step('обменов сделано', String(m.swaps)) + step('лишних обменов', String(m.extra), m.extra ? 'badd' : '') +
      step('нужно обменов соседей', `${m.inv0} — по одному на инверсию`, 'sum') + `</div>`;
    if (m.res) h += `<h3>Последний запуск автомата</h3><div class="steps">` + step(m.res.kind === 'bubble' ? 'пузырёк' : 'выбором', `${m.res.comps} сравн., ${m.res.swaps} обм.`) + `</div><p class="note" style="margin-top:10px">Сравнений у обоих по 28. Пузырёк меняет только соседей — обменов столько, сколько инверсий. Выбор переставляет далёких, поэтому обменов не больше 7.</p>`;
    return h;
  }
  if (m.kind === 'cx') {
    const n = m.n, n1 = n + 1;
    let h = `<h2>Считаем для n = ${n}</h2><div class="formula">C(n) = n · (n − 1) / 2</div><div class="steps">` +
      step('линейный поиск, O(n)', `${n}`) +
      step('бинарный, O(log n)', `⌊log₂ ${n}⌋ + 1 = ${fBin(n)}`) +
      step('пузырёк, O(n²)', `${n} · ${n - 1} / 2 = ${big(m.bub)}`, m.bub <= m.limit ? 'okk' : 'badd') +
      step('уложились в 1000?', m.bub <= m.limit ? 'да' : 'нет', 'sum') +
      step(`а при n = ${n1}`, `${n1} · ${n} / 2 = ${big(fBub(n1))}`) + `</div>`;
    h += `<h3>А если n = 1 000 000?</h3><p class="note">Пусть компьютер делает около 100 миллионов (10⁸) сравнений в секунду.</p><div class="steps">` +
      step('бинарный', '20 сравнений — мгновенно', 'okk') + step('линейный', '10⁶ — сотая доля секунды') +
      step('пузырёк', '≈ 5 · 10¹¹ — около 5000 с', 'badd') + step('это', '≈ 83 минуты', 'sum') + `</div>`;
    return h;
  }
  let h = `<h2>Сколько нужно ходов</h2><div class="formula">T(n) = 2 · T(n − 1) + 1<br>T(0) = 0</div><p class="note">Перенести n − 1 дисков, переложить большой, снова перенести n − 1 дисков.</p><div class="steps">`;
  let T = 0;
  for (let k = 1; k <= 5; k++) { const p = T; T = 2 * T + 1; h += step(`T(${k})`, `2 · ${p} + 1 = ${T}`, k === m.n ? 'cur' : ''); }
  h += step('у вас ходов', `${m.moves} из минимума ${m.min}`, m.onC === m.n && m.moves === m.min ? 'okk sum' : 'sum') + `</div>`;
  h += `<h3>Ещё пример: факториал</h3><div class="formula">n! = n · (n − 1)!,  0! = 1</div><div class="steps">`;
  const f = k => k <= 1 ? 1 : k * f(k - 1);
  for (let k = m.n; k >= 1; k--) h += step(`${k}!`, k === 1 ? '1 · 0! = 1' : `${k} · ${k - 1}! = ${f(k)}`);
  h += `</div><p class="note" style="margin-top:10px">Вызовы спускаются до базового случая 0! = 1, а потом результаты собираются обратно — снизу вверх.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'search') el.innerHTML = `<div class="k">Ищем</div><div class="v ${ok || m.found ? 'ok' : ''}">x = ${m.x}</div><div class="gauge"><b style="width:${(m.opens / m.max * 100).toFixed(1)}%"></b></div><div class="lr"><span>открыто</span><span>${m.opens}/${m.max}</span></div><div class="lr"><span>зона</span><span>${m.found ? 'найдено' : m.lin ? '—' : `${m.hi - m.lo + 1} шт.`}</span></div>`;
  else if (m.kind === 'sort') el.innerHTML = `<div class="k">Массив</div><div class="v ${m.sorted ? 'ok' : ''}">${m.sorted ? 'по порядку' : `инверсий ${m.inv}`}</div><div class="lr"><span>обменов</span><span>${S.sAuto ? S.sAuto.swaps : m.swaps}</span></div><div class="lr"><span>сравнений</span><span>${S.sAuto ? S.sAuto.comps : m.res ? m.res.comps : '—'}</span></div>`;
  else if (m.kind === 'cx') el.innerHTML = `<div class="k">Сравнений при n = ${m.n}</div><div class="v ${m.bub > m.limit ? 'bad' : ''}">${big(m.bub)}</div><div class="lr"><span>пузырёк</span><span>O(n²)</span></div><div class="lr"><span>линейный</span><span>${m.lin}</span></div><div class="lr"><span>бинарный</span><span>${m.bin}</span></div>`;
  else el.innerHTML = `<div class="k">Ходов</div><div class="v ${ok ? 'ok' : m.moves > m.min ? 'bad' : ''}">${m.moves}</div><div class="gauge"><b style="width:${Math.min(100, m.moves / m.min * 100).toFixed(1)}%"></b></div><div class="lr"><span>минимум</span><span>${m.min}</span></div><div class="lr"><span>на C</span><span>${m.onC}/${m.n}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены: поиск, сортировки, сложность и рекурсия!'), 1300);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderTools();
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  search: '<rect x="4" y="9" width="8" height="13" rx="1.5" fill="#1a2438" stroke="#3a4762"/><rect x="14" y="9" width="8" height="13" rx="1.5" fill="#1a2438" stroke="#3a4762"/><rect x="24" y="9" width="8" height="13" rx="1.5" fill="#e8ecf4"/><rect x="34" y="9" width="8" height="13" rx="1.5" fill="#1a2438" stroke="#3a4762"/><rect x="44" y="9" width="8" height="13" rx="1.5" fill="#86e0a8"/><path d="M24 6V4h28v2" fill="none" stroke="#72d4e8"/>',
  sort: '<rect x="6" y="18" width="7" height="8" fill="#72d4e8"/><rect x="16" y="12" width="7" height="14" fill="#72d4e8"/><rect x="26" y="8" width="7" height="18" fill="#ffb547"/><rect x="36" y="15" width="7" height="11" fill="#ffb547"/><rect x="46" y="4" width="7" height="22" fill="#72d4e8"/>',
  cx: '<path d="M6 26H62M6 26V3" stroke="#56627d"/><path d="M6 26L60 10" stroke="#72d4e8" stroke-width="1.5"/><path d="M6 24Q14 19 60 18" fill="none" stroke="#86e0a8" stroke-width="1.5"/><path d="M6 26Q30 26 40 3" fill="none" stroke="#ffb547" stroke-width="1.5"/>',
  rec: '<path d="M4 26h58" stroke="#56627d" stroke-width="2"/><path d="M14 8v18M33 8v18M52 8v18" stroke="#3a4762" stroke-width="2"/><rect x="5" y="21" width="18" height="4" rx="2" fill="#c3a6ff"/><rect x="8" y="16" width="12" height="4" rx="2" fill="#ffb547"/><rect x="47" y="21" width="10" height="4" rx="2" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetSearch(LESSONS[0].seed);
  S.shSeed = 1; resetSort(LESSONS[1].start);
  S.cn = LESSONS[2].n0;
  resetHanoi(LESSONS[3].disks);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}
window.addEventListener('resize', () => requestAnimationFrame(fit));

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'search') {
    now = `15 карточек с числами по возрастанию, индексы 0…14, числа скрыты. Загадано x = ${m.x}. Можно открыть не больше ${m.max} карточек. ` +
      (m.lin ? `Сейчас идёт показ линейного поиска (проверено ${m.lin.i + 1} элементов). ` : '') +
      `Открыто: ${S.opened.map(i => `a[${i}] = ${S.arr[i]}`).join(', ') || 'ничего'}. ${m.found ? 'Число найдено.' : `Зона поиска сейчас [${m.lo}; ${m.hi}] (${m.hi - m.lo + 1} карточек).`} ` +
      (m.linRes ? `Линейный поиск в прошлом ряду сделал ${m.linRes} сравнений. ` : '') +
      `Не называй индекс загаданного числа и не говори, какая карточка «правильная», — спрашивай, какой элемент стоит в середине зоны и что следует из сравнения.`;
  }
  if (id === 'sort') {
    now = `Список a = [${S.bars.join(', ')}] (столбики, высота = значение). Ученик меняет местами только соседей кнопками ⇄. Инверсий в начале: ${m.inv0}, сейчас: ${m.inv}. Обменов сделано: ${m.swaps}, из них лишних (поменяли пару, стоявшую по порядку): ${m.extra}. ` +
      (m.running ? `Сейчас работает автомат: ${S.sAuto.kind === 'bubble' ? 'пузырёк' : 'сортировка выбором'}. ` : '') +
      (m.res ? `Последний запуск автомата (${m.res.kind === 'bubble' ? 'пузырёк' : 'выбором'}): ${m.res.comps} сравнений, ${m.res.swaps} обменов. ` : '') +
      (m.auto ? 'Массив сортировал автомат — для зачёта нужно нажать «Перемешать» и отсортировать самому. ' : '') +
      `Цель: отсортировать по возрастанию без единого лишнего обмена. Не диктуй последовательность обменов — помогай находить пары, где левый больше правого.`;
  }
  if (id === 'cx') {
    now = `График числа сравнений от n: линейный поиск n, бинарный ⌊log₂ n⌋ + 1, пузырёк n(n − 1)/2; пунктир — лимит 1000. Сейчас n = ${m.n}: линейный ${m.lin}, бинарный ${m.bin}, пузырёк ${m.bub} (${m.bub <= m.limit ? 'укладывается' : 'не укладывается'} в 1000). Задание: найти наибольшее n, при котором пузырёк укладывается в 1000 сравнений. Не называй ответ — предложи составить неравенство n(n − 1)/2 ≤ 1000 и проверить соседние значения n.`;
  }
  if (id === 'rec') {
    now = `Ханойская башня, ${m.n} ${plural(m.n, 'диск', 'диска', 'дисков')}, стержни A (откуда), B (запасной), C (куда). Сейчас: A = [${S.rods[0].join(', ')}], B = [${S.rods[1].join(', ')}], C = [${S.rods[2].join(', ')}] (снизу вверх, числа — размеры). ${m.held !== null ? `В руке верхний диск со стержня ${RN[m.held]}. ` : ''}Сделано ходов: ${m.moves}, минимум ${m.min}. ` +
      (m.running ? `Работает «Авто» (рекурсивное решение), стек вызовов: ${S.stack.map(callName).join(' → ') || 'пуст'}. ` : '') +
      (m.auto && !m.running ? 'Башню переносил автомат — для зачёта нужно «Заново» и перенести самому. ' : '') +
      `Задание: 4 диска с A на C ровно за 15 ходов. Не диктуй ходы целиком — наводи на рекурсивную идею: куда сначала нужно убрать три верхних диска?`;
  }
  return [
    `Раздел: информатика, 9 класс, тема «Алгоритмы обработки» (раздел «Алгоритмы и программирование», язык Python). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { search: 'Почему бинарный поиск работает только в упорядоченном списке?', sort: 'Чем пузырёк отличается от сортировки выбором?', cx: 'Что значит O(n²) простыми словами?', rec: 'Зачем рекурсии базовый случай?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
