<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре и началам анализа, 11 класс: корень n-й степени, показательная функция, логарифмы, показательные и логарифмические уравнения.">
<title>Степени и логарифмы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.formula{font:500 17px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 31Q24 31 33 7" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/><path d="M6 20H34" stroke="var(--force)" stroke-width="2" stroke-linecap="round"/><circle cx="27.6" cy="20" r="3" fill="var(--arm)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: графики степенной, показательной и логарифмической функций. Прямую, точки и ползунки можно перетаскивать, варианты ответа — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const sd = (v, d = 3) => { if (Math.abs(v - Math.round(v)) < 1e-9) return ns(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && s !== '0' ? '−' : '') + s; };
const par = (v, d = 3) => v < 0 ? '(' + sd(v, d) + ')' : sd(v, d);
const snap = (v, st) => Math.round(v / st) * st;
const SUPC = { '−': '⁻', '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = v => String(v).split('').map(ch => SUPC[ch] || ch).join('');
// plain-text power: 2³, 3⁻², 4^0,5
const pwT = (b, c) => Number.isInteger(c) ? b + sup(ns(c)) : b + '^' + sd(c);
// SVG power with a raised exponent
const pwS = (b, e, fs) => `${b}<tspan dy="${(-fs * 0.42).toFixed(1)}" font-size="${(fs * 0.72).toFixed(1)}">${e}</tspan><tspan dy="${(fs * 0.42).toFixed(1)}"> </tspan>`;
// exact value as integer or 1/k, otherwise ≈ decimal
function nice(v) {
  if (!isFinite(v)) return { s: '—', ex: false };
  if (Math.abs(v - Math.round(v)) < 1e-9) return { s: sd(Math.round(v)), ex: true };
  if (v > 0 && Math.abs(1 / v - Math.round(1 / v)) < 1e-9) return { s: '1/' + Math.round(1 / v), ex: true };
  return { s: sd(v, 3), ex: false };
}
const eqv = v => { const n = nice(v); return (n.ex ? '= ' : '≈ ') + n.s; };
const rt = n => n === 2 ? '√' : n === 3 ? '∛' : n === 4 ? '∜' : sup(n) + '√';

// lesson 1: x^n = a
const RT = [
  { n: 3, a: -27, eq: 'x³ = −27', opts: ['x = −3', 'x = ±3', 'нет корней'], ok: 0, why: '∛(−27) = −3, ведь (−3)³ = −27. Корень нечётной степени из отрицательного числа существует.' },
  { n: 4, a: 16, eq: 'x⁴ = 16', opts: ['x = 2', 'x = ±2', 'x = ±4'], ok: 1, why: '∜16 = 2, но у уравнения x⁴ = 16 два корня: 2 и −2.' },
  { n: 4, a: -16, eq: 'x⁴ = −16', opts: ['x = −2', 'x = ±2', 'нет корней'], ok: 2, why: 'Чётная степень не бывает отрицательной: x⁴ ≥ 0. Корней нет, ∜(−16) не существует.' },
  { n: 5, a: 32, eq: 'x⁵ = 32', opts: ['x = 2', 'x = ±2', 'x = 6,4'], ok: 0, why: '⁵√32 = 2, ведь 2⁵ = 32. При нечётной степени корень один.' },
];
function rootsOf(n, a) {
  if (n % 2 === 0) { if (a < 0) return []; if (a === 0) return [0]; const r = Math.pow(a, 1 / n); return [-r, r]; }
  return [Math.sign(a) * Math.pow(Math.abs(a), 1 / n)];
}
// lesson 2: points the graph of a^x must pass through
const G2 = [{ x: 2, y: 9, ai: 30, lbl: 'A(2; 9)' }, { x: -2, y: 4, ai: 5, lbl: 'B(−2; 4)' }, { x: -1, y: 5, ai: 2, lbl: 'C(−1; 5)' }];
// lesson 3: log_a b = c
const LG = [
  { a: 2, as: '2', ap: '2', b: 8, bs: '8', c: 3, name: 'log₂ 8' },
  { a: 3, as: '3', ap: '3', b: 1 / 9, bs: '1/9', c: -2, name: 'log₃ (1/9)' },
  { a: 5, as: '5', ap: '5', b: 1, bs: '1', c: 0, name: 'log₅ 1' },
  { a: 0.5, as: '1/2', ap: '(1/2)', b: 4, bs: '4', c: -2, name: 'log₁/₂ 4' },
  { a: 4, as: '4', ap: '4', b: 2, bs: '2', c: 0.5, name: 'log₄ 2' },
];
// lesson 4: equations solved step by step
const L3 = Math.log(3);
const EQ = [
  { s: '2ˣ⁺¹ = 8', short: '2ˣ⁺¹ = 8', f: x => 2 ** (x + 1), g: () => 8, fl: 'y = 2ˣ⁺¹', gl: 'y = 8', xr: [-3, 3.5], yr: [-1, 12], odz: null, roots: [2], fake: [],
    steps: [
      { t: 'Приведите обе части к одному основанию', o: ['2ˣ⁺¹ = 2³', '2ˣ⁺¹ = 2⁴', '2ˣ⁺¹ = 4²'], ok: 0, tip: '8 = 2·2·2. Какая это степень двойки?' },
      { t: 'Основания равны — приравняйте показатели', o: ['x + 1 = 8', 'x + 1 = 3', '(x + 1)·2 = 3'], ok: 1, tip: 'Если 2ᵐ = 2ᵏ, то m = k: показательная функция монотонна.' },
      { t: 'Найдите x', o: ['x = 2', 'x = 4', 'x = 7'], ok: 0, tip: 'Перенесите 1 в правую часть.' }] },
  { s: '9ˣ − 4·3ˣ + 3 = 0', short: '9ˣ − 4·3ˣ + 3', f: x => 9 ** x - 4 * 3 ** x + 3, g: () => 0, fl: 'y = 9ˣ − 4·3ˣ + 3', gl: 'y = 0', xr: [-1.5, 1.8], yr: [-1.6, 4], odz: null, roots: [0, 1], fake: [],
    steps: [

function model() {
  const id = LID();

    const E = RT[S.ei], a = S.a1, roots = rootsOf(E.n, a), pk = S.picks1[S.ei];

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
const C = (x, y, r, fill, extra = '') => `<circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="${r}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="rgba(255,138,115,.22)" stroke-width="2"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col, fs = 12, hgt = 28) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - hgt / 2, w, hgt, on ? (col || FG) : '#1a2438', `rx="8" stroke="${col || (on ? FG : '#33405c')}" stroke-width="1.3"`)}${T(x + w / 2, y + fs * 0.38, fs, label, on ? '#0b1019' : (col || FG), 'middle', 'font-weight="500"')}</g>`;
}
function curve(f, x0, x1, X, Y, ylo, yhi, n = 360) {
  let d = '', pen = false;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = f(x);
    if (!isFinite(y) || y < ylo || y > yhi) { pen = false; continue; }
    d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true;
  }
  return d;
}
const clip = (id, x, y, w, h) => `<defs><clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath></defs>`;
const HALO = 'stroke="#0e1520" stroke-width="3.5" paint-order="stroke"';
const frame = (x, y, w, h) => R(x, y, w, h, 'rgba(10,15,24,.5)', 'stroke="#26324a" rx="4"');
// generic plot box: maps and axes
function box(P) {
  const X = x => P.x0 + (x - P.xmin) / (P.xmax - P.xmin) * (P.x1 - P.x0);
  const Y = y => P.y1 - (y - P.ymin) / (P.ymax - P.ymin) * (P.y1 - P.y0);
  const iX = px => P.xmin + (px - P.x0) / (P.x1 - P.x0) * (P.xmax - P.xmin);
  const iY = py => P.ymin + (P.y1 - py) / (P.y1 - P.y0) * (P.ymax - P.ymin);
  return { X, Y, iX, iY };
}
function axes(P, B, xs, ys, id) {
  const { X, Y } = B;
  let h = clip(id, P.x0, P.y0, P.x1 - P.x0, P.y1 - P.y0) + frame(P.x0, P.y0, P.x1 - P.x0, P.y1 - P.y0);
  xs.forEach(x => { h += L(X(x), P.y0, X(x), P.y1, 'rgba(160,185,230,.07)'); });
  ys.forEach(y => { h += L(P.x0, Y(y), P.x1, Y(y), 'rgba(160,185,230,.07)'); });
  if (P.ymin < 0 && P.ymax > 0) h += L(P.x0, Y(0), P.x1, Y(0), '#6b7690', 1.3);
  if (P.xmin < 0 && P.xmax > 0) h += L(X(0), P.y0, X(0), P.y1, '#6b7690', 1.1);
  const ax = P.ymin < 0 && P.ymax > 0 ? Y(0) : P.y1, ay = P.xmin < 0 && P.xmax > 0 ? X(0) : P.x0;
  xs.forEach(x => { if (x) h += T(X(x), ax + 13, 9.5, ns(x), '#6b7690'); });
  ys.forEach(y => { if (y) h += T(ay - 5, Y(y) + 3.5, 9.5, ns(y), '#6b7690', 'end'); });
  return h;
}

// ---------- lesson 1: y = x^n and y = a ----------
const P1 = { x0: 40, x1: 490, y0: 106, y1: 300, xmin: -3.4, xmax: 3.4, ymin: -36, ymax: 36 };

function rootSVG(m) {
  const { X, Y } = B1, E = m.E;
  let h = '';
  RT.forEach((r, i) => { const ok = !!m.solved[i]; h += chip(24 + i * 120, 84, 112, (ok ? '✓ ' : '') + r.eq, m.ei === i, 'eq-' + i, ok ? GREEN : null, 12); });
  h += axes(P1, B1, [-3, -2, -1, 1, 2, 3], [-32, -16, 16, 32], 'clp1');
  h += `<rect x="${P1.x0}" y="${P1.y0}" width="${P1.x1 - P1.x0}" height="${P1.y1 - P1.y0}" fill="transparent" data-drag="aline"/>`;
  h += `<path d="${curve(x => x ** m.n, P1.xmin, P1.xmax, X, Y, P1.ymin - 5, P1.ymax + 5)}" fill="none" stroke="${BLUE}" stroke-width="2.4" clip-path="url(#clp1)" pointer-events="none"/>`;
  h += T(P1.x1 - 8, P1.y1 - 10, 11, pwS('y = x', m.n, 11) + (m.n % 2 ? ' · n нечётное' : ' · n чётное'), BLUE, 'end', 'font-weight="500" ' + HALO);
  // target level hint
  h += L(P1.x0, Y(E.a), P1.x0 + 12, Y(E.a), VIOL, 2) + T(P1.x0 + 15, Y(E.a) + 3.5, 9.5, 'a = ' + ns(E.a), VIOL, 'start', HALO);
  // line y = a
  const lc = m.match ? GREEN : ORANGE;
  h += `<g data-drag="aline">${R(P1.x0, Y(m.a) - 12, P1.x1 - P1.x0, 24, 'transparent')}${L(P1.x0, Y(m.a), P1.x1, Y(m.a), lc, 2.2)}</g>`;
  h += `<g data-drag="aline">${C(P1.x1 - 16, Y(m.a), 9, lc, `stroke="${INK}" stroke-width="1.5"`)}</g>`;
  h += T(P1.x1 - 30, Y(m.a) + (m.a > 26 ? 16 : -7), 11, 'y = ' + ns(m.a), lc, 'end', 'font-weight="500" ' + HALO);
  // intersections
  m.roots.forEach(r => {
    h += L(X(r), Y(m.a), X(r), Y(0), GREEN, 1.2, 'stroke-dasharray="3 3" pointer-events="none"');
    h += C(X(r), Y(m.a), 5.5, GREEN, `stroke="${INK}" stroke-width="1.4" pointer-events="none"`);
    h += T(X(r), Y(0) + (m.a >= 0 ? 24 : -14), 10.5, 'x ' + (nice(r).ex ? '= ' : '≈ ') + nice(r).s, GREEN, 'middle', 'font-weight="500" ' + HALO);
  });
  let st, sc = MUTED;
  if (!m.roots.length) { st = `прямая y = ${ns(m.a)} не пересекает график`; sc = RED; }
  else st = `пересечений: ${m.roots.length}`;
  h += T(260, 320, 12, `${E.eq}:  ${m.match ? st : 'поставьте прямую на уровень a = ' + ns(E.a)}`, m.match ? (m.roots.length ? GREEN : RED) : MUTED, 'middle', 'font-weight="500"');
  E.opts.forEach((o, j) => { const on = m.pick === j; h += chip(24 + j * 160, 350, 152, o, on, 'op-' + j, on ? (j === E.ok ? GREEN : RED) : null, 12); });
  const msg = m.pick < 0 ? 'выберите ответ, когда прямая на месте' : m.right ? E.why.split('.')[0] : 'не совпадает с пересечениями — посчитайте точки ещё раз';
  h += T(260, 384, 11, msg, m.pick < 0 ? MUTED : m.right ? GREEN : RED, 'middle', 'font-weight="500"');
  h += T(260, 401, 11, `решено: ${m.nSolved} из ${RT.length}`, m.nSolved === RT.length ? GREEN : MUTED);
  return h;
}

// ---------- lesson 2: y = a^x ----------
const P2 = { x0: 40, x1: 490, y0: 98, y1: 306, xmin: -3.2, xmax: 3.2, ymin: -0.8, ymax: 10.5 };
const B2 = box(P2);
const AS = { x0: 60, x1: 460, y: 338 };
const aX = i => AS.x0 + (i - 1) / 39 * (AS.x1 - AS.x0);
function expSVG(m) {

  let h = axes(P2, B2, [-3, -2, -1, 1, 2, 3], [2, 4, 6, 8, 10], 'clp2');

// ---------- lesson 3: log as a missing exponent ----------
const P3 = { x0: 40, x1: 490, y0: 104, y1: 300, xmin: -3.6, xmax: 3.6, ymin: -0.7, ymax: 9.6 };

// ---------- lesson 4: equations ----------
const P4 = { x0: 40, x1: 490, y0: 120, y1: 254 };

const scene = $('#scene');
function drawScene(t) {

let dirty = true;
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;

}
new ResizeObserver(fit).observe(scene);

// ---------- actions ----------
function setA1(v) { v = clamp(Math.round(v), -32, 32); if (S.a1 === v) return; S.a1 = v; update(); }
function setEi(i) { S.ei = clamp(i, 0, RT.length - 1); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function pickRoot(j) {
  const E = RT[S.ei];
  if (S.a1 !== E.a) { toast(`Сначала поставьте прямую y = a на уровень ${ns(E.a)} и посмотрите на пересечения.`); return; }
  S.picks1[S.ei] = j;
  if (j === E.ok) { if (!S.solved1[S.ei]) { S.solved1[S.ei] = true; toast(E.why); } }
  else toast('Сравните с картинкой: сколько точек пересечения у прямой и графика?');
  update();
}
function setAi(i) {
  i = clamp(Math.round(i), 1, 40); if (S.ai === i) return; S.ai = i;
  const g = G2.findIndex(G => G.ai === i);
  if (g >= 0 && !S.got[g]) { S.got[g] = true; toast(['a = 3: 3² = 9 — график прошёл через A.', 'a = 0,5: 0,5⁻² = 2² = 4 — график прошёл через B.', 'a = 0,2: 0,2⁻¹ = 5 — график прошёл через C.'][g]); }

}
function setPx2(x) { x = +clamp(snap(x, 0.1), -3, 3).toFixed(1); if (S.px2 === x) return; S.px2 = x; update(); }
function setCi(i) {
  i = clamp(Math.round(i), -7, 7); if (S.ci === i) return; S.ci = i;
  const Lg = LG[S.li];
  if (i / 2 === Lg.c && !S.solved3[S.li]) { S.solved3[S.li] = true; toast(`${Lg.name} = ${sd(Lg.c)}, потому что ${pwT(Lg.ap, Lg.c)} = ${Lg.bs}.`); }

}
function setLi(i) { S.li = clamp(i, 0, LG.length - 1); S.ci = 2; update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function setQi(i) { S.qi = clamp(i, 0, EQ.length - 1); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }

    S.qst[S.qi] = k + 1;
    if (k + 1 === Q.steps.length) { S.solved4[S.qi] = true; toast(`Уравнение ${Q.s} решено: ${s.o[s.ok]}.`); }
    else toast('Верно: ' + s.o[s.ok]);

}
function pick(p) {
  if (p.startsWith('eq-')) setEi(+p.slice(3));
  else if (p.startsWith('op-')) pickRoot(+p.slice(3));
  else if (p.startsWith('lg-')) setLi(+p.slice(3));
  else if (p.startsWith('qe-')) setQi(+p.slice(3));

// ---------- pointer ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

function act(a) {

  if (a === 'q-' || a === 'q+') return setQi((S.qi + (a === 'q-' ? EQ.length - 1 : 1)) % EQ.length);
}

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'root') return `a = ${ns(m.a)} · решено ${m.nSolved} из ${RT.length}`;

  return `шаг ${Math.min(m.st + 1, m.Q.steps.length)}/${m.Q.steps.length} · решено ${m.nSolved} из ${EQ.length}`;

function updateScheme(m) {

  } else if (m.kind === 'expf') {
    set('#r1', sd(m.a)); set('#r2', sd(m.x)); set('#r3', sd(m.y, 3)); set('#inAiO', sd(m.a)); set('#inXO', sd(m.x)); val('#inAi', m.ai); val('#inX', m.x);
    el.querySelectorAll('[data-p="mir"]').forEach(b => b.setAttribute('aria-pressed', S.mir));
  } else if (m.kind === 'log') {
    set('#r1', sd(m.c)); set('#r2', nice(m.v).s); set('#r3', m.Lg.bs); set('#inCO', sd(m.c)); val('#inC', S.ci); press('lg-', m.li);
  } else {
    set('#r1', sd(m.x, 2)); set('#r2', isFinite(m.fx) ? sd(m.fx, 3) : 'не опр.'); set('#r3', sd(m.gx)); set('#inPxO', sd(m.x, 2)); val('#inPx', m.x); press('qe-', m.qi);
    const sb = el.querySelector('#sSteps');
    if (m.fin) { set('#sStepH', 'Решено'); sb.innerHTML = m.Q.steps.map(s => `<button aria-pressed="true" disabled>${s.o[s.ok]}</button>`).join(''); }
    else {

      sb.innerHTML = m.Q.steps[m.st].o.map((o, j) => `<button data-s="${j}" aria-pressed="false">${o}</button>`).join('');
      sb.querySelectorAll('[data-s]').forEach(b => b.onclick = () => pickStep(+b.dataset.s));
    }
  }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +

      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +

    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }

function calcHTML(m) {
  const id = LID();
  if (id === 'root') {
    const n = m.n, a = m.a;
    let r = `<h2>x<sup>${n}</sup> = ${ns(a)}</h2><div class="formula" style="font-size:15px">ⁿ√a = b  ⇔  bⁿ = a</div><h3>Сейчас: n = ${n}, a = ${ns(a)}</h3><div class="steps">` +
      step('n', n % 2 ? 'нечётное: корень один при любом a' : 'чётное: xⁿ ≥ 0, корни только при a ≥ 0');
    if (!m.roots.length) r += step('a < 0', `x<sup>${n}</sup> ≥ 0 > ${ns(a)}`) + step('корни', 'нет', 'sum');
    else if (n % 2) r += step(`${rt(n)}${par(a, 0)}`, nice(m.roots[0]).ex ? sd(m.roots[0]) : '≈ ' + sd(m.roots[0], 3)) + step('проверка', `${par(m.roots[0], 3)}<sup>${n}</sup> ≈ ${ns(a)}`) + step('корень', 'x = ' + sd(m.roots[0], 3), 'sum');
    else if (a === 0) r += step(`${rt(n)}0`, '0') + step('корень', 'x = 0', 'sum');
    else r += step(`${rt(n)}${ns(a)}`, nice(m.roots[1]).ex ? sd(m.roots[1]) : '≈ ' + sd(m.roots[1], 3)) + step('проверка', `(±${sd(m.roots[1], 3)})<sup>${n}</sup> ≈ ${ns(a)}`) + step('корни', a === 0 ? 'x = 0' : 'x = ±' + sd(m.roots[1], 3), 'sum');
    r += `</div><h3>Свойства корня</h3><div class="steps">` +
      step('ⁿ√(ab) = ⁿ√a · ⁿ√b', '∛(8·27) = 2·3 = 6') + step('ⁿ√(a/b) = ⁿ√a / ⁿ√b', '∜(81/16) = 3/2') +
      step('ⁿ√(aᵏ) = (ⁿ√a)ᵏ', '∛(8²) = 2² = 4') + step('a^(m/n) = ⁿ√(aᵐ)', '27^(2/3) = (∛27)² = 9', 'sum') + `</div>`;
    return r + `<p class="note" style="margin-top:10px">Корень чётной степени извлекают только из неотрицательного числа, и сам он неотрицательный: √9 = 3, а не ±3.</p>`;
  }
  if (id === 'expf') {
    const a = m.a;
    let r = `<h2>y = ${sd(a)}<sup>x</sup></h2><div class="formula" style="font-size:15px">a⁰ = 1,  a⁻ⁿ = 1/aⁿ,  aᵐ·aⁿ = aᵐ⁺ⁿ</div><h3>Таблица значений</h3><div class="steps">`;
    [-2, -1, 0, 1, 2].forEach(x => { r += step('x = ' + ns(x), `${sd(a)}<sup>${ns(x)}</sup> = ${sd(Math.pow(a, x), 4)}`); });
    r += step('x = ' + sd(m.x), `${sd(a)}<sup>${sd(m.x)}</sup> ≈ ${sd(m.y, 4)}`, 'sum') + `</div><h3>Поведение</h3><div class="steps">` +
      step('a', m.ai === 10 ? 'a = 1 — исключено' : a > 1 ? 'a > 1 → возрастает' : '0 < a < 1 → убывает') + step('значения', 'y > 0 при любом x') + step('асимптота', 'y = 0', 'sum') + `</div><h3>Точки</h3><div class="steps">`;
    const sol = ['a² = 9 → a = 3 (a > 0)', 'a⁻² = 4 → a² = 1/4 → a = 0,5', 'a⁻¹ = 5 → a = 1/5 = 0,2'];
    G2.forEach((G, i) => { r += step(G.lbl, m.got[i] ? sol[i] : 'подставьте в y = aˣ', i === 2 ? 'sum' : ''); });
    return r + `</div>`;
  }
  if (id === 'log') {
    const Lg = m.Lg;
    let r = `<h2>${Lg.name} = ?</h2><div class="formula" style="font-size:15px">logₐ b = c  ⇔  aᶜ = b</div><h3>Сейчас c = ${sd(m.c)}</h3><div class="steps">` +
      step('aᶜ', `${Lg.ap}<sup>${sd(m.c)}</sup> ${eqv(m.v)}`) + step('b', Lg.bs) + step('сравнение', m.hit ? 'aᶜ = b ✓' : m.v > Lg.b ? 'aᶜ > b' : 'aᶜ < b', 'sum') + `</div>`;
    if (m.solved[m.li]) r += `<h3>Ответ</h3><div class="steps">` + step(Lg.name, `${sd(Lg.c)}, так как ${Lg.ap}<sup>${sd(Lg.c)}</sup> = ${Lg.bs}`, 'sum') + `</div>`;
    r += `<h3>Свойства логарифмов</h3><div class="steps">` +
      step('logₐ(bc) = logₐ b + logₐ c', 'log₆ 4 + log₆ 9 = log₆ 36 = 2') + step('logₐ(b/c) = logₐ b − logₐ c', 'lg 500 − lg 5 = lg 100 = 2') +
      step('logₐ bᵏ = k·logₐ b', 'log₃ 9⁵ = 5·2 = 10') + step('logₐ b = ln b / ln a', 'log₇ 50 ≈ 3,912 / 1,946 ≈ 2,01', 'sum') + `</div>`;
    return r + `<p class="note" style="margin-top:10px">Основание a > 0 и a ≠ 1, число b > 0. Логарифм отрицательного числа и нуля не существует.</p>`;
  }
  const Q = m.Q;
  let r = `<h2>${Q.s}</h2>`;
  if (Q.odz !== null) r += `<div class="formula" style="font-size:15px">ОДЗ: под логарифмом > 0</div>`;
  r += `<h3>Ход решения</h3><div class="steps">`;
  Q.steps.forEach((s, k) => { r += step(`${k + 1}. ${s.t}`, k < m.st ? s.o[s.ok] : k === m.st ? 'сейчас' : '…', k === Q.steps.length - 1 && m.fin ? 'sum' : ''); });
  r += `</div><h3>Зонд: x = ${sd(m.x, 2)}</h3><div class="steps">` +
    step('левая часть', isFinite(m.fx) ? sd(m.fx, 3) : 'не определена (вне ОДЗ)') + step('правая часть', sd(m.gx)) +
    step('разность', isFinite(m.fx) ? sd(m.fx - m.gx, 3) : '—', 'sum') + `</div>`;
  if (m.fin) r += `<h3>Проверка подстановкой</h3><div class="steps">` + Q.roots.map(x => step('x = ' + ns(x), `левая = ${sd(Q.f(x), 6)}, правая = ${sd(Q.g(x))} ✓`)).join('') +
    Q.fake.map(x => step('x = ' + ns(x), 'log₃(−1) не существует — посторонний', 'sum')).join('') + `</div>`;
  return r + `<p class="note" style="margin-top:10px">Корень уравнения — такое x, при котором левая и правая части равны: разность равна нулю.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'root') el.innerHTML = `<div class="k">Пересечения</div><div class="v ${m.match ? 'ok' : ''}">${m.roots.length ? m.roots.length + ' шт.' : 'нет'}</div><div class="lr"><span>a</span><span>${ns(m.a)}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${RT.length}</span></div>`;
  else if (id === 'expf') el.innerHTML = `<div class="k">Основание</div><div class="v ${m.ai === 10 ? '' : ''}" style="${m.ai === 10 ? 'color:var(--warn)' : ''}">a = ${sd(m.a)}</div><div class="lr"><span>${m.ai === 10 ? 'a = 1' : m.a > 1 ? 'растёт' : 'убывает'}</span><span>${m.ai === 10 ? '✗' : m.a > 1 ? '↗' : '↘'}</span></div><div class="lr"><span>точки</span><span>${m.nGot}/3</span></div>`;
  else if (id === 'log') el.innerHTML = `<div class="k">Высота aᶜ</div><div class="v ${m.hit ? 'ok' : ''}">${nice(m.v).s}</div><div class="lr"><span>c</span><span>${sd(m.c)}</span></div><div class="lr"><span>найдено</span><span>${m.nSolved}/${LG.length}</span></div>`;
  else el.innerHTML = `<div class="k">Шаг решения</div><div class="v ${m.fin ? 'ok' : ''}">${m.fin ? 'решено' : (m.st + 1) + ' из ' + m.Q.steps.length}</div><div class="lr"><span>x</span><span>${sd(m.x, 2)}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${EQ.length}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Степени и логарифмы освоены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  root: '<path d="M10 28C24 2 42 30 56 3" fill="none" stroke="#5fb4d9" stroke-width="1.5"/><path d="M4 15H62" stroke="#ffb547" stroke-width="1.3"/><circle cx="33" cy="15" r="2.6" fill="#86e0a8"/>',
  expf: '<path d="M4 27Q36 27 62 3" fill="none" stroke="#5fb4d9" stroke-width="1.5"/><path d="M4 3Q30 27 62 27" fill="none" stroke="#8b96ad" stroke-width="1.2" stroke-dasharray="3 2"/>',
  log: '<text x="33" y="20" font-size="11" fill="#e8ecf4" text-anchor="middle" font-family="monospace">logₐb</text>',
  eqs: '<path d="M4 27Q36 27 62 3" fill="none" stroke="#5fb4d9" stroke-width="1.5"/><path d="M4 12H62" stroke="#b59cff" stroke-width="1.3"/><circle cx="47" cy="12" r="2.6" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  S.ei = LESSONS[0].ei; S.a1 = LESSONS[0].a; S.picks1 = RT.map(() => -1); S.solved1 = {};
  S.ai = LESSONS[1].ai; S.px2 = LESSONS[1].px; S.mir = false; S.got = [false, false, false];
  S.li = LESSONS[2].li; S.ci = LESSONS[2].ci; S.solved3 = {};
  S.qi = LESSONS[3].qi; S.qst = EQ.map(() => 0); S.px4 = EQ.map(q => (q.xr[0] + q.xr[1]) / 2); S.solved4 = {};
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'root') now = `Уравнение ${m.ei + 1} из ${RT.length}: ${m.E.eq}. На поле график y = x^${m.n} и прямая y = ${ns(m.a)} (нужный уровень a = ${ns(m.E.a)}, прямая ${m.match ? 'стоит на нём' : 'ещё не на нём'}). Пересечений сейчас: ${m.roots.length}${m.roots.length ? ' при x ≈ ' + m.roots.map(r => sd(r, 3)).join(' и ') : ''}. ` +
    `Варианты ответа: ${m.E.opts.join('; ')}. Ученик ${m.pick < 0 ? 'ещё не выбрал ответ' : `выбрал «${m.E.opts[m.pick]}» — ${m.right ? 'верно' : 'неверно'}`}. Решено ${m.nSolved} из ${RT.length}: ${RT.map((r, i) => r.eq + (m.solved[i] ? ' — решено' : ' — нет')).join('; ')}.`;
  if (id === 'expf') now = `График y = ${sd(m.a)}^x (основание a = ${sd(m.a)}${m.ai === 10 ? ', это запретное a = 1' : m.a > 1 ? ', функция возрастает' : ', функция убывает'}). Зонд в точке x = ${sd(m.x)}, y = ${sd(m.y, 3)}. Зеркальный график y = (1/a)^x ${m.mir ? 'показан' : 'скрыт'}. ` +
    `Цели: ${G2.map((G, i) => G.lbl + (m.got[i] ? ' — пройдена' : ' — не пройдена')).join('; ')}.`;
  if (id === 'log') now = `Карточка ${m.li + 1} из ${LG.length}: найти ${m.Lg.name}. На поле график y = ${m.Lg.ap}^x и уровень y = ${m.Lg.bs}. Ученик поставил показатель c = ${sd(m.c)}, высота графика ${m.Lg.ap}^${sd(m.c)} ${eqv(m.v)} — ${m.hit ? 'совпадает с b' : m.v > m.Lg.b ? 'больше b' : 'меньше b'}. ` +
    `Найдено ${m.nSolved} из ${LG.length}: ${LG.map((g, i) => g.name + (m.solved[i] ? ' — найден' : ' — нет')).join('; ')}.`;
  if (id === 'eqs') now = `Уравнение ${m.qi + 1} из ${EQ.length}: ${m.Q.s}. ${m.fin ? 'Оно решено.' : `Сейчас шаг ${m.st + 1} из ${m.Q.steps.length}: «${m.Q.steps[m.st].t}», варианты: ${m.Q.steps[m.st].o.join('; ')}.`} ` +
    `Принятые шаги: ${m.st ? m.Q.steps.slice(0, m.st).map(s => s.o[s.ok]).join(' → ') : 'пока нет'}. Графики левой и правой частей на поле; зонд при x = ${sd(m.x, 2)}: левая часть ${isFinite(m.fx) ? sd(m.fx, 3) : 'не определена'}, правая ${sd(m.gx)}. ` +
    `Решено ${m.nSolved} из ${EQ.length}.`;
  return [
    `Раздел: математика, 11 класс, алгебра и начала анализа, тема «Степени и логарифмы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (корни уравнений, нужное основание a, значения логарифмов, верный шаг решения): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    root: 'Почему у x⁴ = 16 два корня, а ∜16 — одно число?', expf: 'Почему основание a не может быть равно 1?',
    log: 'Что такое логарифм простыми словами?', eqs: 'Зачем находить ОДЗ в логарифмических уравнениях?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где логарифмы и степени нужны в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
