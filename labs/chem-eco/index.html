<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 11 класс: очищаем воздух и воду города, моделируем парниковый эффект и сравниваем атомную экономию промышленных синтезов.">
<title>Химия и экология</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .bad{color:var(--warn)}
.meter .lr .good{color:var(--ok)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1.2 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 16px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:124px;padding:8px}
  .meter .v{font-size:13px}
  .meter .lr{font-size:10px}
  .task{max-width:calc(100% - 152px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 240px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Экология</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Модель">
    <svg class="scene" id="scene" role="img" aria-label="Модель города, атмосферы или химического реактора. На объекты можно нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-eco';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fx = (v, d = 1) => v.toFixed(d).replace('.', ',');
const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * clamp(k, 0, 1)).toString(16).padStart(2, '0')).join(''); };

// ---------- lesson 1: city air and water ----------
const BUDGET = 13;
const MEAS = [
  { k: 'scrub', name: 'Сероочистка', obj: 'ТЭЦ', cost: 3, real: true, tip: 'Сероочистка: известняк связывает SO₂ — 2CaCO₃ + 2SO₂ + O₂ → 2CaSO₄ + 2CO₂. Получается гипс, выброс SO₂ падает в 10 раз.' },
  { k: 'filter', name: 'Электрофильтр', obj: 'ТЭЦ', cost: 2, real: true, tip: 'Электрофильтр: заряженные пластины притягивают частицы золы и сажи. Улавливает до 99 % пыли.' },
  { k: 'stack', name: 'Высокая труба', obj: 'ТЭЦ', cost: 2, real: false, tip: 'Труба выше — над городом дым реже. Но выбросы те же: ветер уносит SO₂ к соседям, и там он выпадает кислотным дождём.' },
  { k: 'gas', name: 'Газ в дома', obj: 'частный сектор', cost: 3, real: true, tip: 'Газ вместо угля: CH₄ + 2O₂ → CO₂ + 2H₂O. Метан горит почти без сажи и без SO₂.' },
  { k: 'cat', name: 'Нейтрализатор', obj: 'автомобили', cost: 2, real: true, tip: 'Каталитический нейтрализатор: на платине и родии 2CO + 2NO → 2CO₂ + N₂. Выброс оксидов азота падает в 5 раз.' },
  { k: 'treat', name: 'Очистка стоков', obj: 'завод', cost: 3, real: true, tip: 'Известковое молоко нейтрализует кислоту и осаждает медь: Cu²⁺ + 2OH⁻ → Cu(OH)₂↓. Осадок отделяют.' },
  { k: 'dilute', name: 'Разбавить сток', obj: 'завод', cost: 2, real: false, tip: 'Сток разбавили водой: концентрация ниже, но масса меди и кислоты в реке та же. Норма сброса считается по массе.' },
];
const MK = k => MEAS.find(x => x.k === k);

// ---------- lesson 2: greenhouse effect ----------
const C0 = 280, M0 = 722, LAMBDA = 0.8, T0 = 14;
const PRESETS = [
  { k: '1750', name: '1750 год', c: 280, m: 722 },
  { k: '1960', name: '1960 год', c: 315, m: 1250 },
  { k: 'now', name: 'Сегодня', c: 420, m: 1900 },
  { k: '2100', name: '2100, если не сокращать', c: 800, m: 2600 },
];
const forcing = (c, m) => { const fc = 5.35 * Math.log(c / C0), fm = 0.036 * (Math.sqrt(m) - Math.sqrt(M0)); return { fc, fm, f: fc + fm, dT: LAMBDA * (fc + fm) }; };

// ---------- lesson 3: atom economy ----------
const MR = { C2H4: 28, H2O: 18, C2H5OH: 46, C2H5Cl: 64.5, NaOH: 40, NaCl: 58.5, Cl2: 71, 'Ca(OH)2': 74, C2H4O: 44, CaCl2: 111, O2: 32, CH3COOH: 60, CH3OH: 32, CO: 28 };
const TGT = [
  { id: 'eth', name: 'этанол', f: 'C2H5OH', best: 0, routes: [
    { name: 'Гидратация этилена', re: [[1, 'C2H4'], [1, 'H2O']], pr: [1, 'C2H5OH'], ws: [], cond: 'катализатор H₃PO₄, 300 °C, 7 МПа' },
    { name: 'Хлорэтан + щёлочь', re: [[1, 'C2H5Cl'], [1, 'NaOH']], pr: [1, 'C2H5OH'], ws: [[1, 'NaCl']], cond: 'водный раствор щёлочи, нагревание' } ] },
  { id: 'eo', name: 'оксид этилена', f: 'C2H4O', best: 1, routes: [
    { name: 'Хлоргидринный способ', re: [[1, 'C2H4'], [1, 'Cl2'], [1, 'Ca(OH)2']], pr: [1, 'C2H4O'], ws: [[1, 'CaCl2'], [1, 'H2O']], cond: 'хлор, затем гашёная известь' },
    { name: 'Прямое окисление', re: [[2, 'C2H4'], [1, 'O2']], pr: [2, 'C2H4O'], ws: [], cond: 'серебряный катализатор, 250 °C' } ] },
  { id: 'ac', name: 'уксусная кислота', f: 'CH3COOH', best: 1, routes: [
    { name: 'Окисление этанола', re: [[1, 'C2H5OH'], [1, 'O2']], pr: [1, 'CH3COOH'], ws: [[1, 'H2O']], cond: 'уксуснокислые бактерии или катализатор' },

    return { kind: 'pol', src, so2, no2, pm, cu, ph, spent, rain, ind, good, ok: good === 5 };

  const T = TGT[S.tgt], R = T.routes[S.route], mr = massOf(R.re), mp = massOf([R.pr]), mw = massOf(R.ws);

}

const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function gcSVG(m, t) {
  let h = '';

  h += `<g data-drag="o-waste"><rect x="${WB.x}" y="${WB.y}" width="${WB.w}" height="${WB.h}" rx="12" fill="rgba(139,150,173,.06)" stroke="#8b96ad" stroke-width="1.4"/><text x="${WB.x + 8}" y="${WB.y + 14}" font-size="9" fill="#8b96ad">ОТХОДЫ</text>${R.ws.length ? '' : `<text x="${WB.x + WB.w / 2}" y="${WB.y + 44}" font-size="9" fill="#5a6580" text-anchor="middle">${p >= 1 ? 'пусто ✓' : ''}</text>`}</g>`;
  // reagents column
  h += `<text x="64" y="${190 - 4}" font-size="9" fill="#8b96ad" text-anchor="middle">РЕАГЕНТЫ</text>`;

}

const scene = $('#scene');
function drawScene(t) {

}

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 420, 1.7);
  const vw = w / s, vh = hh / s;
  scene.setAttribute('viewBox', `${(260 - vw / 2).toFixed(1)} ${(412 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);

function tap(id) {
  if (id.startsWith('m-')) return toggleMeas(id.slice(2));
  if (id === 'flask') return runRoute();
  if (id === 'pick') return pickRoute();
  if (id.startsWith('o-')) { const k = id.slice(2); S.hl = { id: k, t: performance.now() }; S.info = k; if (INFO[k]) toast(INFO[k]); dirty = true; }
}

function toggleMeas(k) {
  const M = MK(k); if (!M) return false;
  if (S.meas[k]) { delete S.meas[k]; update(); return true; }
  const spent = model().spent;
  if (spent + M.cost > BUDGET) { toast(`Не хватает бюджета: потрачено ${spent} из ${BUDGET} ед., мера стоит ${M.cost}. Отключите менее полезную меру.`); return false; }
  S.meas[k] = true; toast(M.tip); update(); return true;
}
function setGas(c, m) {
  S.co2 = clamp(Math.round(c / 5) * 5, 250, 1000); S.ch4 = clamp(Math.round(m / 50) * 50, 700, 3000);
  if (S.co2 >= 415 && S.co2 <= 425 && S.ch4 >= 1850 && S.ch4 <= 1950 && !S.seen) { S.seen = true; const F = forcing(S.co2, S.ch4); toast(`Сегодняшний состав: равновесное потепление +${fx(F.dT, 2)} °C. Теперь уменьшайте CO₂.`); }
  update();
}
function setTgt(i) { S.tgt = clamp(i, 0, TGT.length - 1); S.route = 0; S.anim = null; renderTools(); buildScheme(); update(); }
function setRoute(i) { S.route = clamp(i, 0, 1); S.anim = null; renderTools(); update(); }
function runRoute() {
  const key = TGT[S.tgt].id + S.route;
  if (S.anim) return false;
  S.anim = { key, t: performance.now() };
  if (reduce) { S.anim = null; finishRun(key); }
  dirty = true; return true;
}
function finishRun(key) {
  const first = !S.ran[key]; S.ran[key] = true;
  const R = TGT[S.tgt].routes[S.route];
  if (first) toast(`Атомная экономия: ${fx(aeOf(R))} %. ${R.ws.length ? 'Побочные вещества: ' + R.ws.map(sp).join(', ') + '.' : 'Все атомы реагентов в продукте!'}`);
  update();
}
function pickRoute() {
  const T = TGT[S.tgt];

  if (S.pick[T.id] !== undefined) return true;
  if (S.route !== T.best) { S.wrong++; toast(`У этого пути атомная экономия ${fx(aeOf(T.routes[S.route]))} %, а у другого — ${fx(aeOf(T.routes[1 - S.route]))} %. Сравните ещё раз.`); update(); return false; }
  S.pick[T.id] = S.route; toast(`Верно: ${T.routes[S.route].name} — ${fx(aeOf(T.routes[S.route]))} %, без лишних отходов.`); update(); return true;
}

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);

}

  const sep = '<span class="sep"></span>';

    green: TGT.map((T, i) => B('t-' + i, T.name, S.tgt === i)).join('') + sep + B('r-0', 'Путь 1', S.route === 0) + B('r-1', 'Путь 2', S.route === 1) + sep + B('run', 'Запустить'),

function act(a) {

  if (a.startsWith('pre-')) { const p = PRESETS.find(x => x.k === a.slice(4)); return setGas(p.c, p.m); }

  if (a === 'm-' || a === 'm+') return setGas(S.co2, S.ch4 + (a === 'm+' ? 50 : -50));
  if (a.startsWith('t-')) return setTgt(+a.slice(2));
  if (a.startsWith('r-')) return setRoute(+a.slice(2));
  if (a === 'run') return runRoute();

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'pollution') return `В норме ${m.good} из 5 · бюджет ${m.spent}/${BUDGET} ед.`;
  if (L.id === 'greenhouse') return `${m.seen ? 'Сегодняшний состав ✓' : 'Сначала — сегодняшний состав'} · ΔT = +${fx(m.dT, 2)} °C`;
  return `Выбрано зелёных путей: ${TGT.filter(t => S.pick[t.id] !== undefined).length} из 3`;
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'pollution') h = `<h2>Пульт эколога</h2>
      <dl class="reads"><div><dt>Бюджет</dt><dd id="r1"></dd></div><div><dt>В норме</dt><dd id="r2"></dd></div><div><dt>Дождь pH</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Меры</div><div class="chips" id="mChips">${MEAS.map(x => `<button data-k="${x.k}">${x.name} · ${x.cost}</button>`).join('')}</div></div>
      <h3>Выбросы и сброс (× норма)</h3><div class="steps" id="iList"></div>`;
  if (id === 'greenhouse') h = `<h2>Состав атмосферы</h2>
      <dl class="reads"><div><dt>ΔF, Вт/м²</dt><dd id="r1"></dd></div><div><dt>ΔT</dt><dd id="r2"></dd></div><div><dt>T Земли</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><label for="sC">CO₂, ppm <output id="oC"></output></label><input type="range" id="sC" min="250" max="1000" step="5"></div>
      <div class="ctl"><label for="sM">CH₄, ppb <output id="oM"></output></label><input type="range" id="sM" min="700" max="3000" step="50"></div>
      <div class="ctl"><div class="lbl">Эпохи</div><div class="chips" id="pChips">${PRESETS.map(p => `<button data-k="${p.k}">${p.name}</button>`).join('')}</div></div>
      <p class="note" style="margin-top:12px">ppm — молекул на миллион молекул воздуха, ppb — на миллиард.</p>`;
  if (id === 'green') h = `<h2>Выбор пути синтеза</h2>
      <dl class="reads"><div><dt>АЭ</dt><dd id="r1"></dd></div><div><dt>E-фактор</dt><dd id="r2"></dd></div><div><dt>Выбрано</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Продукт</div><div class="chips" id="tChips">${TGT.map((T, i) => `<button data-i="${i}">${T.name}</button>`).join('')}</div></div>
      <div class="ctl"><div class="lbl">Путь</div><div class="chips" id="rChips">${[0, 1].map(i => `<button data-i="${i}">Путь ${i + 1}: ${TGT[S.tgt].routes[i].name}</button>`).join('')}</div></div>
      <div class="row"><button class="ghostbtn" id="bRun">Запустить реакцию</button><button class="ghostbtn" id="bPick">Этот путь зеленее</button></div>`;
  el.innerHTML = h;
  el.querySelectorAll('#mChips button').forEach(b => b.onclick = () => toggleMeas(b.dataset.k));
  const sC = el.querySelector('#sC'), sM = el.querySelector('#sM');
  if (sC) { sC.value = S.co2; sM.value = S.ch4; sC.oninput = () => setGas(+sC.value, S.ch4); sM.oninput = () => setGas(S.co2, +sM.value); }
  el.querySelectorAll('#pChips button').forEach(b => b.onclick = () => { const p = PRESETS.find(x => x.k === b.dataset.k); setGas(p.c, p.m); });
  el.querySelectorAll('#tChips button').forEach(b => b.onclick = () => setTgt(+b.dataset.i));
  el.querySelectorAll('#rChips button').forEach(b => b.onclick = () => { setRoute(+b.dataset.i); });
  const bR = el.querySelector('#bRun'), bP = el.querySelector('#bPick');
  if (bR) { bR.onclick = runRoute; bP.onclick = pickRoute; }
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  if (m.kind === 'pol') {
    set('#r1', `${m.spent}/${BUDGET}`); set('#r2', `${m.good} из 5`); set('#r3', fx(m.rain));
    el.querySelectorAll('#mChips button').forEach(b => b.setAttribute('aria-pressed', !!S.meas[b.dataset.k]));
    const li = el.querySelector('#iList'); if (li) li.innerHTML = m.ind.map(([n, v]) => step(n, `${fx(v, 2)} ${v <= 1.0001 ? '✓' : '✗'}`)).join('') + step('pH стока (норма 6,5–8,5)', `${fx(m.ph)} ${m.ph >= 6.5 && m.ph <= 8.5 ? '✓' : '✗'}`);
  } else if (m.kind === 'gh') {
    set('#r1', '+' + fx(m.f, 2)); set('#r2', '+' + fx(m.dT, 2) + '°'); set('#r3', fx(m.T) + '°');
    set('#oC', String(m.co2)); set('#oM', String(m.ch4));
    const sC = el.querySelector('#sC'), sM = el.querySelector('#sM');
    if (sC && +sC.value !== m.co2) sC.value = m.co2; if (sM && +sM.value !== m.ch4) sM.value = m.ch4;
    el.querySelectorAll('#pChips button').forEach(b => { const p = PRESETS.find(x => x.k === b.dataset.k); b.setAttribute('aria-pressed', p.c === m.co2 && p.m === m.ch4); });
  } else {
    const ran = !!S.ran[m.T.id + S.route];
    set('#r1', ran ? fx(m.ae) + ' %' : '?'); set('#r2', ran ? fx(m.ef, 2) : '?'); set('#r3', `${TGT.filter(t => S.pick[t.id] !== undefined).length} из 3`);
    el.querySelectorAll('#tChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === S.tgt));
    el.querySelectorAll('#rChips button').forEach(b => { b.setAttribute('aria-pressed', +b.dataset.i === S.route); b.textContent = `Путь ${+b.dataset.i + 1}: ${m.T.routes[+b.dataset.i].name}`; });
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на сцене.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'pol') {
    const on = S.meas;
    let h = `<h2>Баланс выбросов</h2><div class="formula">показатель = выброс : норма<br>в норме, если ≤ 1</div><h3>Воздух</h3><div class="steps">` +
      step('SO₂: ТЭЦ', `2,4${on.scrub ? ' × 0,1' : ''} = ${fx(m.so2, 2)}`) +
      step('NO₂: ТЭЦ + машины', `0,6 + 1,2${on.cat ? ' × 0,2' : ''} = ${fx(m.no2, 2)}`) +
      step('пыль: ТЭЦ + печи', `1,0${on.filter ? ' × 0,05' : ''} + 1,5${on.gas ? ' × 0,1' : ''} = ${fx(m.pm, 2)}`) + `</div>`;
    h += `<h3>Вода</h3><div class="steps">` + step('Cu²⁺: завод', `3,0${on.treat ? ' × 0,05' : ''} = ${fx(m.cu, 2)}`) +
      step('pH стока', on.treat ? 'нейтрализован: 7,5' : on.dilute ? '2,8 → 3,3 (разбавили, кислота та же)' : '2,8 — сильно кислый') + `</div>`;
    h += `<h3>Кислотный дождь (модель)</h3><div class="steps">` + step('кислотность a = 0,9·SO₂ + 0,4·NO₂', fx(0.9 * m.so2 + 0.4 * m.no2, 2)) + step('pH = 5,6 − lg(1 + 3a)', fx(m.rain, 2), 'sum') + `</div>`;
    h += `<h3>Бюджет</h3><div class="steps">` + MEAS.filter(x => on[x.k]).map(x => step(x.name, x.cost + ' ед.')).join('') + step('итого', `${m.spent} из ${BUDGET} ед.`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Чистый дождь тоже слегка кислый, pH ≈ 5,6: в нём растворён CO₂ из воздуха. Кислотным считают дождь с pH ниже 5,6.</p>`;
    return h;
  }
  if (m.kind === 'gh') {
    let h = `<h2>Расчёт потепления</h2><div class="formula">ΔF = 5,35·ln(C/280) + 0,036·(√M − √722)<br>ΔT = 0,8 · ΔF</div><h3>Сейчас</h3><div class="steps">` +
      step('вклад CO₂', `5,35·ln(${m.co2}/280) = ${fx(m.fc, 2)} Вт/м²`) +
      step('вклад CH₄', `0,036·(√${m.ch4} − √722) = ${fx(m.fm, 2)} Вт/м²`) +
      step('ΔF всего', `${fx(m.f, 2)} Вт/м²`) +
      step('ΔT = 0,8 · ΔF', `+${fx(m.dT, 2)} °C`) +
      step('T Земли = 14 + ΔT', `${fx(m.T, 1)} °C`, 'sum') + `</div>`;
    h += `<h3>Ориентиры</h3><div class="steps">${step('без парниковых газов', '−18 °C')}${step('цель Парижского соглашения', '≤ 1,5–2 °C')}${step('удвоение CO₂ (560 ppm)', '≈ +3 °C')}</div>`;
    h += `<p class="note" style="margin-top:10px">ΔF — радиационное воздействие: сколько ватт на каждый квадратный метр Земли «задерживает» добавка газа. Модель даёт равновесное потепление. Реально пока измерено около +1,2–1,3 °C: океан прогревается медленно, а аэрозоли немного охлаждают.</p>`;
    return h;
  }
  const T = m.T, R = m.R, ran = !!S.ran[T.id + S.route];
  let h = `<h2>${T.name}: путь ${S.route + 1}</h2><div class="formula">${eqOf(R)}</div><h3>Массы по уравнению</h3><div class="steps">` +
    R.re.map(r => step(sp(r), `${r[0] > 1 ? r[0] + ' · ' : ''}${fx(MR[r[1]], MR[r[1]] % 1 ? 1 : 0)} = ${fx(r[0] * MR[r[1]], (r[0] * MR[r[1]]) % 1 ? 1 : 0)} г`)).join('') +
    step('Σ реагентов', fx(m.mr, m.mr % 1 ? 1 : 0) + ' г') + step('продукт ' + sp(R.pr), fx(m.mp, 0) + ' г') + step('побочные', R.ws.length ? fx(m.mw, m.mw % 1 ? 1 : 0) + ' г' : '0 г') + `</div>`;
  h += `<h3>Атомная экономия</h3><div class="steps">` +
    step('АЭ = m(продукта) : Σm · 100 %', ran ? `${fx(m.mp, 0)} : ${fx(m.mr, m.mr % 1 ? 1 : 0)} · 100 = ${fx(m.ae)} %` : 'запустите реакцию') +
    step('E-фактор = m(отходов) : m(продукта)', ran ? fx(m.ef, 2) : '?', 'sum') + `</div>`;
  h += `<h3>Сравнение</h3><div class="steps">` + TGT.map(t => step(t.name, [0, 1].map(i => S.ran[t.id + i] ? fx(aeOf(t.routes[i])) + '%' : '—').join(' / ') + (S.pick[t.id] !== undefined ? ' ✓' : ''))).join('') + `</div>`;
  h += `<p class="note" style="margin-top:10px">Атомная экономия — не единственный критерий. Важны и выход реакции, температура, ядовитость веществ, возобновляемость сырья. Например, уксус для еды получают брожением спирта — это безопасно и из растительного сырья.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'pol') {
    el.innerHTML = `<div class="k">Город · × норма</div>` + m.ind.map(([n, v]) => `<div class="lr"><span>${n}</span><span class="${v <= 1.0001 ? 'good' : 'bad'}">${fx(v, 2)}</span></div>`).join('') +
      `<div class="lr"><span>pH стока</span><span class="${m.ph >= 6.5 && m.ph <= 8.5 ? 'good' : 'bad'}">${fx(m.ph)}</span></div><div class="gauge"><b style="width:${(m.spent / BUDGET * 100).toFixed(1)}%;background:${m.spent === BUDGET ? 'var(--force)' : 'var(--liq)'}"></b></div><div class="lr"><span>бюджет</span><span>${m.spent}/${BUDGET}</span></div>`;
  } else if (m.kind === 'gh') {
    el.innerHTML = `<div class="k">Потепление</div><div class="v ${m.dT <= 1.5 ? 'ok' : ''}">+${fx(m.dT, 2)} °C</div><div class="lr"><span>CO₂</span><span>${m.co2} ppm</span></div><div class="lr"><span>CH₄</span><span>${m.ch4} ppb</span></div><div class="lr"><span>ΔF</span><span>${fx(m.f, 2)} Вт/м²</span></div>`;
  } else {
    const ran = !!S.ran[m.T.id + S.route];
    el.innerHTML = `<div class="k">Атомная экономия</div><div class="v ${ran && m.ae > 99 ? 'ok' : ''}">${ran ? fx(m.ae) + ' %' : '?'}</div><div class="gauge"><b style="width:${ran ? m.ae.toFixed(1) : 0}%;background:var(--ok)"></b></div><div class="lr"><span>E-фактор</span><span>${ran ? fx(m.ef, 2) : '?'}</span></div><div class="lr"><span>выбрано</span><span>${TGT.filter(t => S.pick[t.id] !== undefined).length} из 3</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Тема «Химия и экология» пройдена!'), 1400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; press = null;
  S.meas = {}; S.info = null; S.co2 = 280; S.ch4 = 722; S.seen = false; S.tgt = 0; S.route = 0; S.ran = {}; S.pick = {}; S.wrong = 0; S.anim = null; PH.list = [];
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'pollution') now = `Модель города: ТЭЦ на угле, частный сектор с печами, дорога с машинами, медный завод со стоком в реку. Меры (название, цена): ${MEAS.map(x => `${x.name} ${x.cost}`).join(', ')}; бюджет ${BUDGET} ед. Включены: ${MEAS.filter(x => S.meas[x.k]).map(x => x.name).join(', ') || 'ничего'}, потрачено ${m.spent}. Показатели (выброс/норма): SO₂ ${fx(m.so2, 2)}, NO₂ ${fx(m.no2, 2)}, пыль ${fx(m.pm, 2)}, Cu²⁺ ${fx(m.cu, 2)}; pH стока ${fx(m.ph)}; pH дождя по модели ${fx(m.rain)}. В норме ${m.good} из 5. Не говори прямо, какие меры бесполезны — спрашивай, уменьшает ли мера массу выброса или только разносит/разбавляет его.`;
  if (id === 'greenhouse') now = `Модель парникового эффекта: CO₂ ${m.co2} ppm, CH₄ ${m.ch4} ppb. ΔF(CO₂) = ${fx(m.fc, 2)}, ΔF(CH₄) = ${fx(m.fm, 2)}, всего ${fx(m.f, 2)} Вт/м²; равновесное потепление ΔT = 0,8·ΔF = ${fx(m.dT, 2)} °C, температура ${fx(m.T)} °C. Сегодняшний состав ${m.seen ? 'уже устанавливался' : 'ещё не устанавливался'}. Задача: при метане 1850–1950 ppb найти CO₂, при котором ΔT 1,4–1,5 °C. Не называй ответ — подскажи, как считать через формулу или подбирать кнопками.`;
  if (id === 'green') { const T = m.T; now = `Сравнение путей синтеза. Продукт: ${T.name}. Путь ${S.route + 1}: ${T.routes[S.route].name}, уравнение ${eqOf(T.routes[S.route]).replace(/[₀-₉]/g, d => '₀₁₂₃₄₅₆₇₈₉'.indexOf(d))}. ${S.ran[T.id + S.route] ? `Атомная экономия ${fx(m.ae)} %, E-фактор ${fx(m.ef, 2)}.` : 'Реакция ещё не запущена.'} Уже выбраны зелёные пути для: ${TGT.filter(t => S.pick[t.id] !== undefined).map(t => t.name).join(', ') || 'ничего'}. Ошибок выбора: ${S.wrong}. Не говори, какой путь зеленее, пока ученик не запустил оба — помоги посчитать атомную экономию.`; }
  return [
    `Предмет: химия, 11 класс. Тема «Химия и экология». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { pollution: 'Почему высокая труба не решает проблему кислотных дождей?', greenhouse: 'Почему метан опаснее CO₂, если его в воздухе меньше?', green: 'Почему реакции присоединения дают 100 % атомной экономии?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
