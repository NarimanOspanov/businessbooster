<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 8 класс: квадратные уравнения, дискриминант, теорема Виета, дробно-рациональные уравнения, задачи на движение и работу.">
<title>Квадратные уравнения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Математика · Квадратные уравнения</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: парабола с перетаскиваемой вершиной, корни на числовой прямой, графики дробных уравнений, лодка на реке и две бригады. Элементы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const dec = (v, d) => { const s = Math.abs(v).toFixed(d).replace('.', ','); return (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + s; };
const sd = (v, d = 3) => { if (Math.abs(v - Math.round(v)) < 1e-9) return ns(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && s !== '0' ? '−' : '') + s; };
const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
const approx = (v, d = 2) => isInt(v) ? ns(Math.round(v)) : '≈ ' + dec(v, d);
const par = v => v < 0 ? '(' + ns(v) + ')' : String(v);
const fac = r => r === 0 ? 'x' : r < 0 ? `(x + ${-r})` : `(x − ${r})`;
// ax² + bx + c = 0 written the school way
function poly(a, b, c, rhs = ' = 0') {
  let s = '';
  const term = (k, v) => { if (!k) return; const ak = Math.abs(k); s += (s ? (k < 0 ? ' − ' : ' + ') : (k < 0 ? '−' : '')) + (v && ak === 1 ? '' : ak) + v; };
  term(a, 'x²'); term(b, 'x'); term(c, '');
  return (s || '0') + rhs;
}

// lesson 2: target equations x² + px + q = 0
const TGT = [{ p: -7, q: 12 }, { p: 2, q: -15 }, { p: -2, q: -24 }];
// lesson 3: fractional equations
const EQS = [
  { show: '(x² − 5x + 6) / (x − 3) = 0', odz: [3], holes: [3], asym: [], xr: [-1, 5],
    lines: ['ОДЗ: x ≠ 3', '× (x − 3):', 'x² − 5x + 6 = 0', 'D = 1 → x = 2 или x = 3'],
    cand: [2, 3], good: [true, false], f: x => x - 2,
    den: x => `x − 3 = ${ns(x - 3)}` },
  { show: '12/x − 12/(x + 1) = 1', odz: [0, -1], holes: [], asym: [0, -1], xr: [-6, 5],
    lines: ['ОДЗ: x ≠ 0, x ≠ −1', '× x(x + 1):', '12(x + 1) − 12x = x(x + 1)', 'x² + x − 12 = 0', 'D = 49 → x = 3 или x = −4'],
    cand: [3, -4], good: [true, true], f: x => 12 / x - 12 / (x + 1) - 1,
    den: x => `x = ${ns(x)}, x + 1 = ${ns(x + 1)}` },
  { show: 'x/(x + 2) + (x + 2)/(x − 2) = 8/(x² − 4)', odz: [2, -2], holes: [-2], asym: [2], xr: [-4, 4],
    lines: ['ОДЗ: x ≠ 2, x ≠ −2', '× (x − 2)(x + 2):', 'x(x − 2) + (x + 2)² = 8', '2x² + 2x − 4 = 0 | : 2', 'x² + x − 2 = 0 → 1 и −2'],
    cand: [1, -2], good: [true, false], f: x => 2 * (x - 1) / (x - 2),
    den: x => `x + 2 = ${ns(x + 2)}, x − 2 = ${ns(x - 2)}` },
];
const CLS = ['?', 'корень', 'посторонний'];
// lesson 4: river and brigades
const RIVER = { s: 24, u: 2, T: 5, vmin: 2.5, vmax: 20 };
const WORK = { d: 6, k: 5, xmin: 1, xmax: 30 };

const LESSONS = [
  { id: 'disc', title: 'Дискриминант: сколько корней?',
    text: ['Квадратное уравнение — это ax² + bx + c = 0, где a ≠ 0. Его график y = ax² + bx + c — парабола. Корни уравнения — точки, где парабола пересекает ось x.',
           'Сколько корней, подсказывает дискриминант D = b² − 4ac. D > 0 — два корня. D = 0 — один корень: парабола касается оси вершиной. D < 0 — действительных корней нет, парабола не достаёт до оси.',
           'Корни находят по формуле x = (−b ± √D) / (2a). Если b чётное, удобнее D₁ = (b/2)² − ac и x = (−b/2 ± √D₁) / a — числа получаются меньше.'],
    why: 'По этой формуле считают траектории: инженер-баллистик и разработчик игр находят момент, когда брошенный мяч упадёт на землю. Экономист ищет цену, при которой выручка покрывает затраты, — часто это квадратное уравнение. А на ЕНТ по математике дискриминант нужен почти в каждом варианте.',
    task: 'Соберите уравнения всех трёх типов: с двумя корнями (D > 0), с одним корнем (D = 0) и без корней (D < 0).',

const KEY = 'luch-math-quad';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            a: 1, b: -2, c: -3, seen: {},
            x1: 1, x2: 2, tg: 0, solved: {},
            ei: 0, cls: [[0, 0], [0, 0], [0, 0]], fok: {},
            mv: 'boat', v: 6, wx: 4, boatOK: false, workOK: false };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function rootsOf(a, b, c) {
  const D = b * b - 4 * a * c;
  if (D < 0) return { D, n: 0, r: [] };
  if (D === 0) return { D, n: 1, r: [-b / (2 * a)] };
  const s = Math.sqrt(D), r1 = (-b - s) / (2 * a), r2 = (-b + s) / (2 * a);
  return { D, n: 2, r: [Math.min(r1, r2), Math.max(r1, r2)] };
}
const caseOf = D => D > 0 ? 'pos' : D === 0 ? 'zero' : 'neg';

function model() {
  const id = LID();
  if (id === 'disc') {
    const { a, b, c } = S, R0 = rootsOf(a, b, c);
    return { kind: id, a, b, c, D: R0.D, n: R0.n, r: R0.r, vx: -b / (2 * a), vy: c - b * b / (4 * a), cs: caseOf(R0.D), seen: S.seen };
  }
  if (id === 'vieta') {
    const { x1, x2 } = S, p = -(x1 + x2), q = x1 * x2, t = TGT[S.tg];
    const nSolved = TGT.filter((_, i) => S.solved[i]).length;
    return { kind: id, x1, x2, p, q, tg: S.tg, t, sumOK: -t.p === x1 + x2, prodOK: t.q === q, match: TGT.findIndex(T0 => T0.p === p && T0.q === q), nSolved, solved: S.solved };
  }
  if (id === 'frac') {
    const e = EQS[S.ei], cl = S.cls[S.ei];
    const all = cl.every(v => v > 0), right = cl.every((v, i) => v === (e.good[i] ? 1 : 2));
    return { kind: id, ei: S.ei, e, cl, all, right, nOK: EQS.filter((_, i) => S.fok[i]).length, fok: S.fok };
  }
  const v = S.v, t1 = RIVER.s / (v + RIVER.u), t2 = RIVER.s / (v - RIVER.u), x = S.wx, f1 = WORK.d / x, f2 = WORK.d / (x + WORK.k);
  return { kind: 'move', mv: S.mv, v, t1, t2, tt: t1 + t2, x, f1, f2, part: f1 + f2, boatOK: S.boatOK, workOK: S.workOK };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col, fs = 12) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 14, w, 28, on ? (col || FG) : '#1a2438', `rx="8" stroke="${col || (on ? FG : '#33405c')}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, fs, label, on ? '#0b1019' : (col || FG), 'middle', 'font-weight="500"')}</g>`;
}
function curve(f, x0, x1, X, Y, ylo, yhi, breaks = [], n = 320) {
  let d = '', pen = false, px = null;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = f(x);
    const cross = px !== null && breaks.some(b => (px - b) * (x - b) <= 0);
    if (!isFinite(y) || y < ylo || y > yhi || cross) { pen = false; px = x; continue; }
    d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true; px = x;
  }
  return d;
}

// ---------- lesson 1: parabola and discriminant ----------
const P1 = { x0: 30, x1: 490, y0: 112, y1: 330, xmin: -6, xmax: 6, ymin: -9, ymax: 9 };
const X1 = x => P1.x0 + (x - P1.xmin) / (P1.xmax - P1.xmin) * (P1.x1 - P1.x0);
const Y1 = y => P1.y1 - (y - P1.ymin) / (P1.ymax - P1.ymin) * (P1.y1 - P1.y0);
const iX1 = px => (px - P1.x0) / (P1.x1 - P1.x0) * (P1.xmax - P1.xmin) + P1.xmin;
const iY1 = py => (P1.y1 - py) / (P1.y1 - P1.y0) * (P1.ymax - P1.ymin) + P1.ymin;
const CASES = [['pos', 'D > 0 · 2 корня'], ['zero', 'D = 0 · 1 корень'], ['neg', 'D < 0 · нет корней']];
function rootTxt(m) {
  if (m.n === 0) return 'действительных корней нет';
  if (m.n === 1) return `один корень: x = ${sd(m.r[0], 3)}`;
  return `x₁ ${isInt(m.r[0]) ? '= ' + ns(Math.round(m.r[0])) : approx(m.r[0])}, x₂ ${isInt(m.r[1]) ? '= ' + ns(Math.round(m.r[1])) : approx(m.r[1])}`;
}
function discSVG(m) {
  let h = '';
  CASES.forEach(([k, lbl], i) => {
    const x = 24 + i * 160, on = !!m.seen[k], cur = m.cs === k;
    h += R(x, 74, 152, 28, on ? 'rgba(134,224,168,.16)' : '#1a2438', `rx="8" stroke="${cur ? ORANGE : on ? GREEN : '#33405c'}" stroke-width="${cur ? 2 : 1.3}"`);
    h += T(x + 76, 92.5, 11.5, (on ? '✓ ' : '') + lbl, on ? GREEN : cur ? FG : MUTED, 'middle', 'font-weight="500"');
  });
  h += `<defs><clipPath id="clp1"><rect x="${P1.x0}" y="${P1.y0}" width="${P1.x1 - P1.x0}" height="${P1.y1 - P1.y0}"/></clipPath></defs>`;
  h += R(P1.x0, P1.y0, P1.x1 - P1.x0, P1.y1 - P1.y0, 'rgba(10,15,24,.5)', 'stroke="#26324a" rx="4"');
  for (let x = P1.xmin + 1; x < P1.xmax; x++) { h += L(X1(x), P1.y0, X1(x), P1.y1, 'rgba(160,185,230,.08)'); if (x && !(x % 2)) h += T(X1(x), Y1(0) + 14, 9.5, ns(x), '#6b7690'); }
  for (let y = -6; y <= 6; y += 3) if (y) { h += L(P1.x0, Y1(y), P1.x1, Y1(y), 'rgba(160,185,230,.08)'); h += T(X1(0) - 5, Y1(y) + 3.5, 9.5, ns(y), '#6b7690', 'end'); }
  h += L(P1.x0, Y1(0), P1.x1, Y1(0), '#6b7690', 1.3) + L(X1(0), P1.y0, X1(0), P1.y1, '#6b7690', 1.1);
  h += T(P1.x1 - 6, Y1(0) - 6, 10, 'x', MUTED, 'end') + T(X1(0) + 6, P1.y0 + 12, 10, 'y', MUTED, 'start');
  const col = m.cs === 'pos' ? BLUE : m.cs === 'zero' ? GREEN : VIOL;
  const d = curve(x => m.a * x * x + m.b * x + m.c, P1.xmin, P1.xmax, X1, Y1, P1.ymin - 2, P1.ymax + 2);
  h += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" clip-path="url(#clp1)"/>`;
  m.r.forEach((r, i) => {
    if (r < P1.xmin || r > P1.xmax) return;
    h += `<circle cx="${X1(r).toFixed(1)}" cy="${Y1(0).toFixed(1)}" r="5.5" fill="${GREEN}" stroke="${INK}" stroke-width="1.4"/>`;
    h += T(X1(r), Y1(0) + (m.a > 0 ? -12 : 24), 10.5, m.n === 1 ? 'x = ' + sd(r, 2) : (i ? 'x₂' : 'x₁'), GREEN, 'middle', 'font-weight="500"');
  });
  // vertex handle
  const hx = clamp(X1(m.vx), P1.x0 + 6, P1.x1 - 6), hy = clamp(Y1(m.vy), P1.y0 + 6, P1.y1 - 6), out = hx !== X1(m.vx) || hy !== Y1(m.vy);
  h += `<g data-drag="vtx"><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="22" fill="transparent"/><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="8.5" fill="${ORANGE}" stroke="${INK}" stroke-width="1.6"${out ? ' stroke-dasharray="3 2"' : ''}/></g>`;
  h += T(hx + (hx > 400 ? -14 : 14), hy + (m.a > 0 ? 18 : -10), 10, `вершина (${sd(m.vx, 2)}; ${sd(m.vy, 2)})`, ORANGE, hx > 400 ? 'end' : 'start');
  // formula
  h += T(260, 356, 16, poly(m.a, m.b, m.c), FG, 'middle', 'font-weight="500"');
  h += T(260, 378, 12, `D = ${par(m.b)}² − 4·${par(m.a)}·${par(m.c)} = ${ns(m.D)}`, m.cs === 'pos' ? BLUE : m.cs === 'zero' ? GREEN : VIOL, 'middle', 'font-weight="500"');
  h += T(260, 398, 11.5, rootTxt(m), MUTED);
  return h;
}

// ---------- lesson 2: Vieta ----------
const NL2 = { x0: 40, k: 27.5, y: 318, min: -8, max: 8 };
const X2 = x => NL2.x0 + (x - NL2.min) * NL2.k;
function vietaSVG(m) {
  let h = '';
  TGT.forEach((t, i) => {
    const sv = !!m.solved[i];
    h += chip(24 + i * 160, 88, 152, (sv ? '✓ ' : '') + poly(1, t.p, t.q), m.tg === i, 'tg-' + i, sv ? GREEN : null, 11.5);
  });
  const mt = m.match >= 0;
  h += T(260, 122, 12.5, 'ваше: ' + fac(m.x1) + (m.x1 === 0 || m.x2 === 0 ? ' · ' : '') + fac(m.x2) + ' = ' + poly(1, m.p, m.q), mt ? GREEN : FG, 'middle', 'font-weight="500"');
  // parabola y = (x − x1)(x − x2)
  const half = Math.abs(m.x1 - m.x2) / 2, lo = -Math.max(4, half * half) * 1.2, hi = -lo * 0.75;
  const PY0 = 134, PY1 = 286, Y2 = y => PY1 - (y - lo) / (hi - lo) * (PY1 - PY0);
  h += `<defs><clipPath id="clp2"><rect x="${X2(-8.4)}" y="${PY0}" width="${X2(8.4) - X2(-8.4)}" height="${PY1 - PY0}"/></clipPath></defs>`;
  h += L(X2(-8.4), Y2(0), X2(8.4), Y2(0), '#6b7690', 1.2) + L(X2(0), PY0, X2(0), PY1, 'rgba(160,185,230,.2)', 1);
  h += `<path d="${curve(x => (x - m.x1) * (x - m.x2), -8.4, 8.4, X2, Y2, lo - 5, hi + 5)}" fill="none" stroke="${mt ? GREEN : BLUE}" stroke-width="2.2" clip-path="url(#clp2)"/>`;
  [m.x1, m.x2].forEach((x, i) => { h += L(X2(x), Y2(0), X2(x), NL2.y - 10, i ? BLUE : ORANGE, 1, 'stroke-dasharray="3 4" opacity=".7"'); });
  // number line
  h += L(X2(-8.4), NL2.y, X2(8.4), NL2.y, '#6b7690', 1.4);
  for (let x = NL2.min; x <= NL2.max; x++) { h += L(X2(x), NL2.y - (x % 2 ? 3 : 6), X2(x), NL2.y + (x % 2 ? 3 : 6), '#6b7690', 1); if (!(x % 2)) h += T(X2(x), NL2.y + 30, 9.5, ns(x), '#6b7690'); }
  h += `<rect x="${X2(-8.4)}" y="${NL2.y - 22}" width="${X2(8.4) - X2(-8.4)}" height="44" fill="transparent" data-drag="line"/>`;
  const same = m.x1 === m.x2;
  [['x1', m.x1, ORANGE, 'x₁'], ['x2', m.x2, BLUE, 'x₂']].forEach(([k, x, c, lbl], i) => {
    const dy = same ? (i ? 7 : -7) : 0;
    h += `<g data-drag="${k}"><circle cx="${X2(x).toFixed(1)}" cy="${NL2.y + dy}" r="20" fill="transparent"/><circle cx="${X2(x).toFixed(1)}" cy="${NL2.y + dy}" r="8" fill="${c}" stroke="${INK}" stroke-width="1.5"/></g>`;
    h += T(X2(x) + (same ? (i ? 12 : -12) : 0), NL2.y - 14, 11, `${lbl}=${ns(x)}`, c, same ? (i ? 'start' : 'end') : 'middle', 'font-weight="500"');
  });
  const t = m.t;
  h += T(40, 370, 12.5, `x₁ + x₂ = ${ns(m.x1 + m.x2)}`, m.sumOK ? GREEN : FG, 'start', 'font-weight="500"') + T(170, 370, 11, m.sumOK ? `= −p ✓` : `нужно −p = ${ns(-t.p)}`, m.sumOK ? GREEN : MUTED, 'start');
  h += T(290, 370, 12.5, `x₁ · x₂ = ${ns(m.q)}`, m.prodOK ? GREEN : FG, 'start', 'font-weight="500"') + T(410, 370, 11, m.prodOK ? '= q ✓' : `нужно q = ${ns(t.q)}`, m.prodOK ? GREEN : MUTED, 'start');
  h += T(260, 396, 11.5, `решено уравнений: ${m.nSolved} из ${TGT.length}` + (m.solved[m.tg] ? ' · выберите следующее уравнение вверху' : ''), m.nSolved === TGT.length ? GREEN : MUTED);
  return h;
}

// ---------- lesson 3: fractional equations ----------
const G3 = { x0: 24, x1: 250, y0: 150, y1: 330, ylo: -5, yhi: 5 };
function fracSVG(m) {
  let h = '';
  EQS.forEach((e, i) => { const ok = !!m.fok[i]; h += chip(24 + i * 116, 88, 108, (ok ? '✓ ' : '') + 'Уравнение ' + (i + 1), m.ei === i, 'eq-' + i, ok ? GREEN : null, 11.5); });
  const e = m.e;
  h += T(260, 126, 15, e.show, FG, 'middle', 'font-weight="500"');
  // graph of (left − right)
  const X = x => G3.x0 + (x - e.xr[0]) / (e.xr[1] - e.xr[0]) * (G3.x1 - G3.x0);
  const Y = y => G3.y1 - (y - G3.ylo) / (G3.yhi - G3.ylo) * (G3.y1 - G3.y0);
  h += R(G3.x0, G3.y0, G3.x1 - G3.x0, G3.y1 - G3.y0, 'rgba(10,15,24,.5)', 'stroke="#26324a" rx="4"');
  for (let x = Math.ceil(e.xr[0]); x <= e.xr[1]; x++) h += L(X(x), Y(0) - 3, X(x), Y(0) + 3, '#6b7690', 1);
  h += L(G3.x0, Y(0), G3.x1, Y(0), '#6b7690', 1.3);
  if (e.xr[0] < 0 && e.xr[1] > 0) h += L(X(0), G3.y0, X(0), G3.y1, 'rgba(160,185,230,.25)', 1);

let dirty = true;
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;

// ---------- actions ----------
function markSeen() {
  const k = caseOf(S.b * S.b - 4 * S.a * S.c);
  if (!S.seen[k]) { S.seen[k] = true; toast({ pos: 'Найдено: D > 0 — парабола пересекает ось x дважды.', zero: 'Найдено: D = 0 — вершина лежит на оси x, корень один.', neg: 'Найдено: D < 0 — парабола не достаёт до оси, корней нет.' }[k]); }
}
function setCoef(k, v) {
  if (k === 'a') { v = clamp(Math.round(v), -3, 3); if (v === 0) v = S.a > 0 ? -1 : 1; }
  else v = clamp(Math.round(v), -12, 12);
  if (S[k] === v) return;
  S[k] = v; markSeen(); update();
}
function setRoot(k, v) { v = clamp(Math.round(v), NL2.min, NL2.max); if (S[k] === v) return; S[k] = v; update(); }
function setV(v) { v = clamp(Math.round(v * 2) / 2, RIVER.vmin, RIVER.vmax); if (S.v === v) return; S.v = v; update(); }
function setW(x) { x = clamp(Math.round(x), WORK.xmin, WORK.xmax); if (S.wx === x) return; S.wx = x; update(); }
function setMv(mv) { S.mv = mv; renderTools(); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function cycle(i) {
  const e = EQS[S.ei], cl = S.cls[S.ei];
  cl[i] = (cl[i] + 1) % 3;
  if (cl.every(v => v > 0)) {
    const right = cl.every((v, j) => v === (e.good[j] ? 1 : 2));
    if (right && !S.fok[S.ei]) { S.fok[S.ei] = true; toast(`Уравнение ${S.ei + 1} решено верно.`); }
    else if (!right) toast('Не сходится. Подставьте кандидата в знаменатели: не получается ли нуль?');
  }
  update();
}
function pick(p) {
  if (p.startsWith('tg-')) { S.tg = +p.slice(3); update(); }
  else if (p.startsWith('eq-')) { S.ei = +p.slice(3); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
  else if (p.startsWith('cl-')) cycle(+p.slice(3));
  else if (p.startsWith('mv-')) setMv(p.slice(3));
}

// ---------- pointer ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(id, p) {
  if (id === 'vtx') {
    const x = iX1(p.x), y = iY1(p.y), a = S.a;
    const b = clamp(Math.round(-2 * a * x), -12, 12), c = clamp(Math.round(y + b * b / (4 * a)), -12, 12);
    if (b !== S.b || c !== S.c) { S.b = b; S.c = c; markSeen(); update(); }
  } else if (id === 'x1' || id === 'x2') setRoot(id, (p.x - NL2.x0) / NL2.k + NL2.min);
  else if (id === 'sl') { if (S.mv === 'boat') setV(RIVER.vmin + (p.x - SL.x0) / (SL.x1 - SL.x0) * (RIVER.vmax - RIVER.vmin)); else setW(WORK.xmin + (p.x - SL.x0) / (SL.x1 - SL.x0) * (WORK.xmax - WORK.xmin)); }
}

  if (id === 'line') { const x = (p.x - NL2.x0) / NL2.k + NL2.min; id = Math.abs(x - S.x1) <= Math.abs(x - S.x2) ? 'x1' : 'x2'; dragTo(id, p); }

  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'disc') return `D = ${ns(m.D)} · найдено: ${['pos', 'zero', 'neg'].filter(k => m.seen[k]).length} из 3 типов`;
  if (Ls.id === 'vieta') return `решено ${m.nSolved} из ${TGT.length} · сейчас ${poly(1, m.p, m.q)}`;
  if (Ls.id === 'frac') return `верно решено ${m.nOK} из ${EQS.length} уравнений`;
  return `лодка: ${m.boatOK ? 'найдено ✓' : 'ищем'} · бригады: ${m.workOK ? 'найдено ✓' : 'ищем'}`;
}

// ---------- Scheme tab ----------
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const pbtn = (data, label, on) => `<button data-p="${data}" aria-pressed="${!!on}">${label}</button>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'disc') h = `<h2>Коэффициенты</h2><dl class="reads"><div><dt>D</dt><dd id="r1"></dd></div><div><dt>Корней</dt><dd id="r2"></dd></div><div><dt>Вершина</dt><dd id="r3"></dd></div></dl>` +
    slider('inA', 'a (не ноль)', -3, 3, 1, S.a) + slider('inB', 'b', -12, 12, 1, S.b) + slider('inC', 'c', -12, 12, 1, S.c) + '<p class="note" id="sRoots" style="margin-top:12px"></p><div id="sDiag"></div>';
  if (id === 'vieta') h = `<h2>Подбор корней</h2><div class="chips">${TGT.map((t, i) => pbtn('tg-' + i, poly(1, t.p, t.q), S.tg === i)).join('')}</div>` +
    `<dl class="reads"><div><dt>x₁ + x₂</dt><dd id="r1"></dd></div><div><dt>x₁ · x₂</dt><dd id="r2"></dd></div><div><dt>Совпало</dt><dd id="r3"></dd></div></dl>` +
    slider('inX1', 'x₁', -8, 8, 1, S.x1) + slider('inX2', 'x₂', -8, 8, 1, S.x2) + '<div id="sDiag"></div>';
  if (id === 'frac') h = `<h2>Проверка корней</h2><div class="chips">${EQS.map((e, i) => pbtn('eq-' + i, 'Уравнение ' + (i + 1), S.ei === i)).join('')}</div>` +
    `<p class="note" id="sEq" style="margin-top:12px"></p><dl class="reads"><div><dt>ОДЗ</dt><dd id="r1"></dd></div><div><dt>Отмечено</dt><dd id="r2"></dd></div><div><dt>Решено</dt><dd id="r3"></dd></div></dl>` +
    `<h3>Кандидаты</h3><div class="chips" id="sCands"></div><div id="sDiag"></div>`;
  if (id === 'move') h = `<h2>${S.mv === 'boat' ? 'Лодка на реке' : 'Две бригады'}</h2><div class="chips">${pbtn('mv-boat', 'Лодка', S.mv === 'boat')}${pbtn('mv-work', 'Бригады', S.mv === 'work')}</div>` +
    (S.mv === 'boat' ? `<dl class="reads"><div><dt>По теч.</dt><dd id="r1"></dd></div><div><dt>Против</dt><dd id="r2"></dd></div><div><dt>Всего</dt><dd id="r3"></dd></div></dl>` + slider('inV', 'собственная скорость v, км/ч', RIVER.vmin, RIVER.vmax, 0.5, S.v)
      : `<dl class="reads"><div><dt>1-я за 6 дн.</dt><dd id="r1"></dd></div><div><dt>2-я за 6 дн.</dt><dd id="r2"></dd></div><div><dt>Вместе</dt><dd id="r3"></dd></div></dl>` + slider('inW', 'x — дней 1-й бригаде', WORK.xmin, WORK.xmax, 1, S.wx)) + '<div id="sDiag"></div>';
  el.innerHTML = h;
  const on = (sel, ev, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener(ev, fn); };
  on('#inA', 'input', e => { let v = +e.target.value; if (v === 0) { v = S.a > 0 ? -1 : 1; e.target.value = v; } setCoef('a', v); });
  on('#inB', 'input', e => setCoef('b', +e.target.value));
  on('#inC', 'input', e => setCoef('c', +e.target.value));
  on('#inX1', 'input', e => setRoot('x1', +e.target.value));
  on('#inX2', 'input', e => setRoot('x2', +e.target.value));
  on('#inV', 'input', e => setV(+e.target.value));
  on('#inW', 'input', e => setW(+e.target.value));
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pick(b.dataset.p); updateScheme(model()); });
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (!el.querySelector('#sDiag')) return;
  const press = (pre, cur) => el.querySelectorAll(`[data-p^="${pre}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.p === pre + cur));
  if (m.kind === 'disc') {
    set('#r1', ns(m.D)); set('#r2', m.n); set('#r3', `(${sd(m.vx, 1)}; ${sd(m.vy, 1)})`);
    set('#inAO', ns(m.a)); set('#inBO', ns(m.b)); set('#inCO', ns(m.c)); val('#inA', m.a); val('#inB', m.b); val('#inC', m.c);
    set('#sRoots', poly(m.a, m.b, m.c) + ': ' + rootTxt(m));
  } else if (m.kind === 'vieta') {
    set('#r1', ns(m.x1 + m.x2)); set('#r2', ns(m.q)); set('#r3', m.match >= 0 ? 'да' : 'нет');
    set('#inX1O', ns(m.x1)); set('#inX2O', ns(m.x2)); val('#inX1', m.x1); val('#inX2', m.x2); press('tg-', m.tg);
  } else if (m.kind === 'frac') {
    set('#sEq', m.e.show); set('#r1', 'x ≠ ' + m.e.odz.map(ns).join('; ')); set('#r2', `${m.cl.filter(v => v > 0).length}/2`); set('#r3', `${m.nOK}/${EQS.length}`);
    press('eq-', m.ei);
    const box = el.querySelector('#sCands');
    box.innerHTML = m.e.cand.map((c, i) => `<button data-c="${i}" aria-pressed="${m.cl[i] > 0}">x = ${ns(c)}: ${CLS[m.cl[i]]}</button>`).join('');
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => cycle(+b.dataset.c));
  } else {
    press('mv-', m.mv);
    if (m.mv === 'boat') { set('#r1', sd(m.t1, 2) + ' ч'); set('#r2', sd(m.t2, 2) + ' ч'); set('#r3', sd(m.tt, 2) + ' ч'); set('#inVO', dec(m.v, 1).replace(',0', '')); val('#inV', m.v); }
    else { set('#r1', sd(m.f1, 3)); set('#r2', sd(m.f2, 3)); set('#r3', sd(m.part, 3)); set('#inWO', m.x); val('#inW', m.x); }
  }
}

      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }

function calcHTML(m) {
  const id = LID();
  if (id === 'disc') {
    const { a, b, c, D } = m;
    let h = `<h2>Решаем ${poly(a, b, c)}</h2><div class="formula">D = b² − 4ac</div><h3>Дискриминант</h3><div class="steps">` +
      step('коэффициенты', `a = ${ns(a)}, b = ${ns(b)}, c = ${ns(c)}`) + step('b²', `${par(b)}² = ${b * b}`) + step('4ac', `4 · ${par(a)} · ${par(c)} = ${ns(4 * a * c)}`) +
      step('D', `${b * b} − ${par(4 * a * c)} = ${ns(D)}`, 'sum') + `</div><h3>Корни</h3><div class="steps">`;
    if (D < 0) h += step('D < 0', 'корней нет: √D не существует', 'sum');
    else if (D === 0) h += step('x = −b / (2a)', `${ns(-b)} / ${ns(2 * a)} = ${sd(-b / (2 * a), 3)}`, 'sum');
    else {
      const sq = Math.sqrt(D), exact = isInt(sq), sr = exact ? String(Math.round(sq)) : '√' + D;
      h += step('√D', exact ? `√${D} = ${sr}` : `√${D} ≈ ${dec(sq, 3)}`);
      h += step('x₁', `(${ns(-b)} − ${sr}) / ${par(2 * a)} ${approx((-b - sq) / (2 * a), 3)}`);
      h += step('x₂', `(${ns(-b)} + ${sr}) / ${par(2 * a)} ${approx((-b + sq) / (2 * a), 3)}`, 'sum');
    }
    h += `</div>`;
    if (b % 2 === 0) { const k = b / 2, D1 = k * k - a * c; h += `<h3>Через D₁ (b чётное)</h3><div class="steps">` + step('D₁ = (b/2)² − ac', `${par(k)}² − ${par(a)}·${par(c)} = ${ns(D1)}`) + step('проверка', `D = 4·D₁ = ${ns(4 * D1)}`, 'sum') + `</div>`; }
    if (m.n === 2) h += `<h3>Проверка по Виета</h3><div class="steps">` + step('x₁ + x₂ = −b/a', `${sd(m.r[0] + m.r[1], 3)} = ${sd(-b / a, 3)}`) + step('x₁ · x₂ = c/a', `${sd(m.r[0] * m.r[1], 3)} = ${sd(c / a, 3)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">При D = 0 формула даёт два одинаковых корня: говорят, что корень один.</p>`;
  }
  if (id === 'vieta') {
    const t = m.t;
    let h = `<h2>Ваши корни: ${ns(m.x1)} и ${ns(m.x2)}</h2><div class="formula">x₁ + x₂ = −p, x₁ · x₂ = q</div><h3>Собираем уравнение</h3><div class="steps">` +
      step('множители', `${fac(m.x1)} · ${fac(m.x2)}`) + step('сумма', `${par(m.x1)} + ${par(m.x2)} = ${ns(m.x1 + m.x2)} → p = ${ns(m.p)}`) +
      step('произведение', `${par(m.x1)} · ${par(m.x2)} = ${ns(m.q)} → q = ${ns(m.q)}`) + step('уравнение', poly(1, m.p, m.q), 'sum') + `</div>`;
    h += `<h3>Цель: ${poly(1, t.p, t.q)}</h3><div class="steps">` + step('нужная сумма −p', `${ns(-t.p)} ${m.sumOK ? '✓' : `(у вас ${ns(m.x1 + m.x2)})`}`) +
      step('нужное произведение q', `${ns(t.q)} ${m.prodOK ? '✓' : `(у вас ${ns(m.q)})`}`) + step('знаки корней', t.q > 0 ? 'q > 0 — одного знака' : 'q < 0 — разных знаков', 'sum') + `</div>`;
    if (m.solved[m.tg]) { const D = t.p * t.p - 4 * t.q; h += `<h3>Проверка через D</h3><div class="steps">` + step('D', `${par(t.p)}² − 4·${par(t.q)} = ${D}`) + step('x', `(${ns(-t.p)} ± ${Math.round(Math.sqrt(D))}) / 2`, 'sum') + `</div>`; }
    return h + `<p class="note" style="margin-top:10px">Для ax² + bx + c = 0: x₁ + x₂ = −b/a, x₁ · x₂ = c/a.</p>`;
  }
  if (id === 'frac') {
    const e = m.e;
    let h = `<h2>Уравнение ${m.ei + 1}</h2><div class="formula" style="font-size:15px">${e.show}</div><h3>Ход решения</h3><div class="steps">` +
      e.lines.map((s, i) => step(['ОДЗ', 'умножаем', 'получаем', 'решаем', 'корни'][i] || '', s.replace(/^ОДЗ: /, ''), i === e.lines.length - 1 ? 'sum' : '')).join('') + `</div><h3>Проверка кандидатов</h3><div class="steps">`;
    e.cand.forEach((c, i) => {
      if (m.cl[i] === 0) h += step(`x = ${ns(c)}`, 'отметьте кандидата — появится подстановка');
      else h += step(`x = ${ns(c)}`, `${e.den(c)} → ${e.odz.includes(c) ? 'знаменатель 0, посторонний' : 'знаменатели не 0, подходит'}`, i === 1 ? 'sum' : '');
    });
    return h + `</div><p class="note" style="margin-top:10px">Сначала ОДЗ, потом решение, в конце — сверка корней с ОДЗ. Без последнего шага ответ может оказаться неверным.</p>`;
  }
  if (m.mv === 'boat') {
    let h = `<h2>Лодка на реке</h2><div class="formula" style="font-size:15px">24/(v + 2) + 24/(v − 2) = 5</div><h3>При v = ${dec(m.v, 1).replace(',0', '')} км/ч</h3><div class="steps">` +
      step('по течению', `24 / ${sd(m.v + 2, 1)} = ${sd(m.t1, 3)} ч`) + step('против течения', `24 / ${sd(m.v - 2, 1)} = ${sd(m.t2, 3)} ч`) + step('всего', `${sd(m.tt, 3)} ч ${Math.abs(m.tt - 5) < 1e-9 ? '= 5 ✓' : '≠ 5'}`, 'sum') + `</div>`;
    if (m.boatOK) h += `<h3>Решение уравнения</h3><div class="steps">` + step('× (v + 2)(v − 2)', '24(v − 2) + 24(v + 2) = 5(v² − 4)') + step('упрощаем', '48v = 5v² − 20') + step('квадратное', '5v² − 48v − 20 = 0') +
      step('D', '48² + 4·5·20 = 2704 = 52²') + step('корни', 'v = (48 ± 52) / 10 → 10 или −0,4') + step('ответ', '−0,4 не подходит; v = 10 км/ч', 'sum') + `</div>`;
    else h += `<p class="note" style="margin-top:10px">Решение уравнения откроется, когда подберёте скорость. Условие по смыслу: v > 2, иначе лодка не поплывёт против течения.</p>`;
    return h;
  }
  let h = `<h2>Две бригады</h2><div class="formula" style="font-size:15px">6/x + 6/(x + 5) = 1</div><h3>При x = ${m.x}</h3><div class="steps">` +
    step('1-я за день', `1/${m.x}, за 6 дней ${sd(m.f1, 3)}`) + step('2-я за день', `1/${m.x + 5}, за 6 дней ${sd(m.f2, 3)}`) + step('вместе', `${sd(m.part, 3)} ${Math.abs(m.part - 1) < 1e-9 ? '= 1 ✓' : '≠ 1'}`, 'sum') + `</div>`;
  if (m.workOK) h += `<h3>Решение уравнения</h3><div class="steps">` + step('× x(x + 5)', '6(x + 5) + 6x = x(x + 5)') + step('квадратное', 'x² − 7x − 30 = 0') + step('D', '49 + 120 = 169 = 13²') +
    step('корни', 'x = (7 ± 13) / 2 → 10 или −3') + step('ответ', '−3 не подходит; 10 и 15 дней', 'sum') + `</div>`;
  else h += `<p class="note" style="margin-top:10px">Решение уравнения откроется, когда подберёте x. По смыслу x > 0.</p>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'disc') el.innerHTML = `<div class="k">Дискриминант</div><div class="v ${m.cs === 'zero' ? 'ok' : ''}">D = ${ns(m.D)}</div><div class="lr"><span>a, b, c</span><span>${ns(m.a)}, ${ns(m.b)}, ${ns(m.c)}</span></div><div class="lr"><span>корней</span><span>${m.n}</span></div>`;
  else if (id === 'vieta') el.innerHTML = `<div class="k">Сумма · произв.</div><div class="v ${m.match >= 0 ? 'ok' : ''}">${ns(m.x1 + m.x2)} · ${ns(m.q)}</div><div class="lr"><span>нужно</span><span>${ns(-m.t.p)} · ${ns(m.t.q)}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${TGT.length}</span></div>`;
  else if (id === 'frac') el.innerHTML = `<div class="k">Уравнение ${m.ei + 1}</div><div class="v ${m.fok[m.ei] ? 'ok' : ''}">${m.fok[m.ei] ? 'решено' : 'проверяем'}</div><div class="lr"><span>ОДЗ</span><span>x ≠ ${m.e.odz.map(ns).join('; ')}</span></div><div class="lr"><span>решено</span><span>${m.nOK}/${EQS.length}</span></div>`;
  else if (m.mv === 'boat') el.innerHTML = `<div class="k">Время в пути</div><div class="v ${Math.abs(m.tt - 5) < 1e-9 ? 'ok' : ''}">${sd(m.tt, 2)} ч</div><div class="lr"><span>цель</span><span>5 ч</span></div><div class="gauge"><b style="width:${clamp(m.tt / 10 * 100, 0, 100).toFixed(1)}%;background:${m.tt > 5 ? 'var(--warn)' : 'var(--liq)'}"></b><i style="left:50%"></i></div>`;
  else el.innerHTML = `<div class="k">Сделано за 6 дн.</div><div class="v ${Math.abs(m.part - 1) < 1e-9 ? 'ok' : ''}">${sd(m.part, 3)}</div><div class="lr"><span>цель</span><span>1</span></div><div class="gauge"><b style="width:${clamp(m.part / 2 * 100, 0, 100).toFixed(1)}%;background:${m.part > 1 ? 'var(--warn)' : 'var(--liq)'}"></b><i style="left:50%"></i></div>`;
}

function update() {
  const id = LID();
  if (id === 'vieta') {
    const p = -(S.x1 + S.x2), q = S.x1 * S.x2, i = TGT.findIndex(t => t.p === p && t.q === q);
    if (i >= 0 && !S.solved[i]) {
      S.solved[i] = true;
      const nx = TGT.findIndex((_, j) => !S.solved[j]);
      toast(`${poly(1, TGT[i].p, TGT[i].q)}: корни ${ns(Math.min(S.x1, S.x2))} и ${ns(Math.max(S.x1, S.x2))}.`);
      S.tg = nx >= 0 ? nx : i;
    }
  }
  if (id === 'move') {
    if (S.mv === 'boat' && S.v === 10 && !S.boatOK) { S.boatOK = true; toast('24/12 + 24/8 = 2 + 3 = 5 ч. Скорость лодки найдена.'); }
    if (S.mv === 'work' && S.wx === 10 && !S.workOK) { S.workOK = true; toast('6/10 + 6/15 = 0,6 + 0,4 = 1. Время бригад найдено.'); }
  }
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Квадратные уравнения покорены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  disc: '<path d="M10 3Q33 50 56 3" fill="none" stroke="#5fb4d9" stroke-width="1.6"/><path d="M4 18H62" stroke="#8b96ad"/><circle cx="21" cy="18" r="2.5" fill="#86e0a8"/><circle cx="45" cy="18" r="2.5" fill="#86e0a8"/>',
  vieta: '<path d="M4 18H62" stroke="#8b96ad"/><circle cx="24" cy="18" r="4" fill="#ffb547"/><circle cx="42" cy="18" r="4" fill="#5fb4d9"/><text x="33" y="10" font-size="8" fill="#e8ecf4" text-anchor="middle" font-family="monospace">+ ·</text>',
  frac: '<path d="M4 26Q20 24 26 3M36 28Q38 10 62 8" fill="none" stroke="#5fb4d9" stroke-width="1.5"/><path d="M31 2V28" stroke="#ff8a73" stroke-dasharray="2 2"/><circle cx="16" cy="22" r="2.6" fill="#0b1019" stroke="#5fb4d9" stroke-width="1.3"/>',
  move: '<rect x="2" y="10" width="62" height="14" rx="2" fill="rgba(95,180,217,.3)"/><path d="M22 15h18l-4 5h-10z" fill="#e8ecf4"/><rect x="28" y="10" width="6" height="5" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  S.a = LESSONS[0].a; S.b = LESSONS[0].b; S.c = LESSONS[0].c; S.seen = {};
  S.x1 = LESSONS[1].x1; S.x2 = LESSONS[1].x2; S.tg = 0; S.solved = {};
  S.ei = LESSONS[2].ei; S.cls = EQS.map(() => [0, 0]); S.fok = {};
  S.mv = LESSONS[3].mv; S.v = LESSONS[3].v; S.wx = LESSONS[3].wx; S.boatOK = false; S.workOK = false;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'disc') now = `Парабола y = ${poly(m.a, m.b, m.c, '')}, уравнение ${poly(m.a, m.b, m.c)}. a = ${ns(m.a)}, b = ${ns(m.b)}, c = ${ns(m.c)}, D = ${ns(m.D)}, ${rootTxt(m)}. Вершина (${sd(m.vx, 2)}; ${sd(m.vy, 2)}), её можно тянуть мышью. ` +
    `Уже собраны типы: ${['pos', 'zero', 'neg'].filter(k => m.seen[k]).map(k => ({ pos: 'D > 0', zero: 'D = 0', neg: 'D < 0' })[k]).join(', ') || 'пока ни одного'}.`;
  if (id === 'vieta') now = `Ученик выбрал корни x₁ = ${ns(m.x1)}, x₂ = ${ns(m.x2)}; получилось ${poly(1, m.p, m.q)}. Целевое уравнение: ${poly(1, m.t.p, m.t.q)} (сумма ${m.sumOK ? 'совпала' : 'не совпала'}, произведение ${m.prodOK ? 'совпало' : 'не совпало'}). ` +
    `Решено ${m.nSolved} из ${TGT.length}: ${TGT.map((t, i) => poly(1, t.p, t.q) + (m.solved[i] ? ' — решено' : ' — не решено')).join('; ')}.`;
  if (id === 'frac') now = `Уравнение ${m.ei + 1}: ${m.e.show}. ОДЗ: x ≠ ${m.e.odz.map(ns).join(', ')}. После умножения на общий знаменатель кандидаты в корни: ${m.e.cand.map(ns).join(' и ')}. ` +
    `Отметки ученика: ${m.e.cand.map((c, i) => `x = ${ns(c)} — ${CLS[m.cl[i]]}`).join('; ')}${m.all ? (m.right ? ' (верно)' : ' (есть ошибка)') : ''}. Верно решено уравнений: ${m.nOK} из ${EQS.length}.`;
  if (id === 'move') now = m.mv === 'boat'
    ? `Задача о лодке: 24 км по течению и 24 км против, течение 2 км/ч, весь путь 5 ч. Ученик поставил v = ${dec(m.v, 1)} км/ч: по течению ${sd(m.t1, 2)} ч, против ${sd(m.t2, 2)} ч, всего ${sd(m.tt, 2)} ч. Лодка ${m.boatOK ? 'решена' : 'не решена'}, бригады ${m.workOK ? 'решены' : 'не решены'}.`
    : `Задача о бригадах: вместе за 6 дней, первая одна на 5 дней быстрее второй. Ученик поставил x = ${m.x} дней: за 6 дней первая делает ${sd(m.f1, 3)}, вторая ${sd(m.f2, 3)}, вместе ${sd(m.part, 3)} работы. Лодка ${m.boatOK ? 'решена' : 'не решена'}, бригады ${m.workOK ? 'решены' : 'не решены'}.`;
  return [
    `Раздел: математика, 8 класс, алгебра, тема «Квадратные уравнения». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (корни целевых уравнений, какой кандидат посторонний, скорость лодки, число дней): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    disc: 'Почему при D < 0 у уравнения нет корней?', vieta: 'Как быстро подобрать корни по теореме Виета?',
    frac: 'Откуда берутся посторонние корни?', move: 'Как составить уравнение по условию задачи?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
