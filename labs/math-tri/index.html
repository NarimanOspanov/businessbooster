<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 7 класс: признаки равенства треугольников, равнобедренный треугольник, сумма углов треугольника, построения циркулем.">
<title>Треугольники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag="apex"],.scene [data-drag="c3"],.scene [data-drag="pen"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31L20 8L33 31Z" fill="rgba(114,212,232,.12)" stroke="var(--arm)" stroke-width="1.8" stroke-linejoin="round"/><path d="M20 8V31" stroke="var(--force)" stroke-width="1.6" stroke-dasharray="3 2"/><circle cx="20" cy="8" r="2" fill="var(--fg)"/><circle cx="7" cy="31" r="2" fill="var(--fg)"/><circle cx="33" cy="31" r="2" fill="var(--fg)"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Математика · Треугольники</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж. Элементы треугольника можно нажимать, вершины и циркуль — двигать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-math-tri';
const fmt = v => String(Math.round(v * 100) / 100).replace('.', ',');
const f1c = v => String(Math.round(v * 10) / 10).replace('.', ',');
const RAD = Math.PI / 180;

const LESSONS = [
  { id: 'eq', title: 'Признаки равенства',
    text: ['Два треугольника равны, если их можно совместить наложением. Тогда у них равны все шесть элементов: три стороны и три угла. Пишут △ABC = △A₁B₁C₁.',
           'Проверять все шесть не нужно. I признак (СУС): две стороны и угол между ними. II признак (УСУ): сторона и два прилежащих к ней угла. III признак (ССС): три стороны. Если эти три элемента у двух треугольников равны, то равны и сами треугольники.',
           'Не любая тройка подходит. По трём углам можно собрать треугольники разного размера. По двум сторонам и углу не между ними иногда получаются два разных треугольника.'],
    why: 'Мостостроитель и монтажник собирают фермы из треугольников: треугольник с заданными тремя сторонами нельзя перекосить (III признак). Поэтому на треугольниках стоят краны, опоры ЛЭП и стропила крыш. Плотник по двум сторонам и углу между ними вырезает точную копию детали. Геодезист по стороне и двум углам при ней находит расстояние через реку, не переходя её.',
    task: 'Нажимайте стороны и углы треугольника ABC, по три элемента. Найдите все три тройки, которые задают треугольник однозначно, — три признака равенства.',
    hint: 'Попробуйте две стороны и угол между ними, сторону и два угла при ней, три стороны. А что выйдет из трёх углов?',
    stage: 'Нажимайте стороны и углы слева. Справа — треугольник, собранный только по выбранным элементам.',
    check: m => m.found >= 3 },
  { id: 'iso', title: 'Равнобедренный треугольник',
    text: ['Треугольник равнобедренный, если две его стороны равны. Равные стороны называют боковыми, третью — основанием. Углы, прилежащие к основанию, — углы при основании.',
           'Свойство 1: в равнобедренном треугольнике углы при основании равны. Свойство 2: биссектриса, проведённая к основанию, — это одновременно медиана и высота.',
           'Медиана идёт из вершины в середину противоположной стороны. Биссектриса делит угол пополам. Высота — перпендикуляр из вершины к прямой, на которой лежит сторона. Если равны все три стороны, треугольник равносторонний.'],
    why: 'Двускатная крыша — равнобедренный треугольник: скаты одинаковые, конёк ровно над серединой дома, и нагрузка ложится на стены поровну. Плотник ставит стойку из конька в середину балки — она же и высота, и медиана. Портной складывает ткань пополам, чтобы вырезать симметричную деталь. Так же устроены фронтоны, арки и опоры мостов.',
    task: 'Сделайте треугольник равнобедренным (AC = BC) с углом при вершине C, равным 80°. Посмотрите, что стало с медианой, биссектрисой и высотой.',
    hint: 'Поставьте C ровно над серединой AB — тогда AC = BC. Потом двигайте C вверх и вниз: чем выше вершина, тем острее угол C.',
    stage: 'Тащите вершину C. Кнопки внизу включают медиану, биссектрису и высоту.',
    u: 1.2, h: 2.6,
    check: m => m.iso && Math.round(m.aC) === 80 },
  { id: 'sum', title: 'Сумма углов треугольника',
    text: ['Сумма углов любого треугольника равна 180°. Неважно, большой он или маленький, острый или тупой.',
           'Доказательство: проведём через вершину C прямую, параллельную AB. Накрест лежащие углы при параллельных прямых равны, поэтому у вершины C получаются копии ∠A и ∠B. Вместе с ∠C они составляют развёрнутый угол — 180°.',
           'Следствия. В треугольнике не может быть двух прямых или тупых углов. Внешний угол (смежный с углом треугольника) равен сумме двух углов треугольника, не смежных с ним.'],

let saved = {};

const LID = () => LESSONS[S.lesson].id;
const PT = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * RAD), y: c.y - r * Math.sin(deg * RAD) });
const degOf = (c, p) => Math.atan2(c.y - p.y, p.x - c.x) / RAD;
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

// ---------- lesson 1: congruence criteria ----------
const T0 = { A: { x: 0, y: 0 }, B: { x: 7, y: 0 }, C: { x: 5 * Math.cos(50 * RAD), y: 5 * Math.sin(50 * RAD) } };
const SIDE = { a: ['B', 'C'], b: ['A', 'C'], c: ['A', 'B'] };
const ELN = { a: 'BC', b: 'AC', c: 'AB', A: '∠A', B: '∠B', C: '∠C' };
const EL_ALL = ['c', 'b', 'a', 'A', 'B', 'C'];
function angAt(P, V) {
  const [U, W] = ['A', 'B', 'C'].filter(k => k !== V).map(k => P[k]), O = P[V];
  let d = Math.abs(Math.atan2(U.y - O.y, U.x - O.x) - Math.atan2(W.y - O.y, W.x - O.x)) / RAD;
  return d > 180 ? 360 - d : d;
}
const elVal = (P, e) => SIDE[e] ? dist(P[SIDE[e][0]], P[SIDE[e][1]]) : angAt(P, e);
const elStr = (P, e) => SIDE[e] ? f1c(elVal(P, e)) + ' см' : Math.round(elVal(P, e)) + '°';
function classify(sel) {
  const P = T0, cp = q => ({ A: { ...q.A }, B: { ...q.B }, C: { ...q.C } });
  if (sel.length < 3) return { kind: 'few', P: null };
  const sd = sel.filter(e => SIDE[e]), an = sel.filter(e => !SIDE[e]);
  if (sd.length === 3) return { kind: 'sss', P: cp(P) };
  if (an.length === 3) { const Q = cp(P); for (const k of ['A', 'B', 'C']) { Q[k].x *= 0.68; Q[k].y *= 0.68; } return { kind: 'aaa', P: Q }; }
  if (sd.length === 2) {
    const X = an[0];
    if (!sd.includes(X.toLowerCase())) return { kind: 'sas', P: cp(P) };
    const adj = sd.find(e => e !== X.toLowerCase()), W = adj.toUpperCase();
    const s = elVal(P, adj), t = dist(P[X], P[W]), t2 = 2 * s * Math.cos(angAt(P, X) * RAD) - t;
    if (t2 > 0.3 && Math.abs(t2 - t) > 0.3) {
      const Q = cp(P); Q[W] = { x: P[X].x + (P[W].x - P[X].x) * t2 / t, y: P[X].y + (P[W].y - P[X].y) * t2 / t };
      return { kind: 'ssa', P: Q, X, W };
    }
    return { kind: 'ssa1', P: cp(P), X };
  }
  const s = sd[0];
  return { kind: an.includes(s.toUpperCase()) ? 'aas' : 'asa', P: cp(P) };
}
function toggleEl(e) {

  const c = classify(S.sel);
  if (KIND[c.kind].crit && !S.found.has(c.kind)) { S.found.add(c.kind); toast('Найден ' + KIND[c.kind].n + '!'); }
  else if (c.kind === 'ssa' || c.kind === 'aaa') toast('Контрпример: по этим данным выходит другой треугольник.');
  update();
}

// ---------- lesson 2: isosceles ----------
const O2 = { x: 260, y: 252 }, SC2 = 40;

// ---------- lesson 3: angle sum ----------
function setAB(a, b) {
  a = clamp(Math.round(a), 10, 160); b = clamp(Math.round(b), 10, 170 - a);
  if (a !== S.tA || b !== S.tB) { S.tA = a; S.tB = b; update(); }
}
function sumGeo() {
  const A = S.tA, B = S.tB, AC = 7 * Math.sin(B * RAD) / Math.sin((A + B) * RAD);
  const Cu = { x: AC * Math.cos(A * RAD), y: AC * Math.sin(A * RAD) };
  let s, ox;
  if (S.fix3) ({ s, ox } = S.fix3);
  else { const mn = Math.min(0, Cu.x), mx = Math.max(7, Cu.x); s = Math.min(50, 440 / (mx - mn), 200 / Cu.y); ox = 260 - s * (mn + mx) / 2; }
  const oy = 262, sp = p => ({ x: ox + p.x * s, y: oy - p.y * s });
  return { A: sp({ x: 0, y: 0 }), B: sp({ x: 7, y: 0 }), C: sp(Cu), s, ox, oy };
}

// ---------- lesson 4: compass ----------
const SC4 = 34, A4 = { x: 120, y: 300 }, B4 = { x: 120 + 6 * SC4, y: 300 };
const GIVEN = { a: 5, b: 4, d: 1.5 };
const near = (x, y) => Math.abs(x - y) < 0.05;
const CTR = () => S.cc === 'A' ? A4 : B4;
function setR(r) { r = clamp(Math.round(r * 10) / 10, 0.5, 6.5); if (r !== S.r) { S.r = r; update(); } }
function setCenter(c) { S.cc = c; S.cang = c === 'A' ? 60 : 120; update(); }
function lastArc(c) { for (let i = S.arcs.length - 1; i >= 0; i--) if (S.arcs[i].c === c) return S.arcs[i]; return null; }
function inter() {
  const a = lastArc('A'), b = lastArc('B'); if (!a || !b) return null;
  const x = (a.r * a.r - b.r * b.r + 36) / 12, y2 = a.r * a.r - x * x;
  return y2 > 1e-4 ? { x, y: Math.sqrt(y2) } : null;
}
function drawArc() {
  S.arcs.push({ c: S.cc, r: S.r }); if (S.arcs.length > 6) S.arcs.shift();
  S.joined = false;
  const a = lastArc('A'), b = lastArc('B');
  if (a && b && !inter()) toast(`Дуги не пересеклись: из отрезков ${f1c(a.r)}, ${f1c(b.r)} и 6 см треугольник не построить — большая сторона не меньше суммы двух других.`);

}

  const C = inter();

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'eq') { const cls = classify(S.sel); return { kind: 'eq', sel: S.sel.slice(), cls, found: S.found.size, over: S.over }; }
  if (id === 'iso') {
    const u = S.u, h = S.h, A = { x: -3, y: 0 }, B = { x: 3, y: 0 }, C = { x: u, y: h };
    const AC = dist(A, C), BC = dist(B, C), aA = Math.atan2(h, u + 3) / RAD, aB = Math.atan2(h, 3 - u) / RAD;
    return { kind: 'iso', u, h, AC, BC, aA, aB, aC: 180 - aA - aB, iso: u === 0, bd: -3 + 6 * AC / (AC + BC) };
  }
  if (id === 'sum') return { kind: 'sum', aA: S.tA, aB: S.tB, aC: 180 - S.tA - S.tB, par: S.par3, ext: S.ext, parSeen: S.parSeen };
  const a = lastArc('A'), b = lastArc('B'), C = inter(), joined = S.joined && !!C;
  const ok = joined && ((near(a.r, 4) && near(b.r, 5)) || (near(a.r, 5) && near(b.r, 4)));
  return { kind: 'cmp', cc: S.cc, r: S.r, rA: a ? a.r : null, rB: b ? b.r : null, C, joined, ok, n: S.arcs.length };
}

// ---------- drawing ----------
const DIM = { eq: [520, 290], iso: [520, 290], sum: [520, 290], cmp: [520, 330] };
const scene = $('#scene');
const f1 = v => v.toFixed(1);
const txt = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" ${extra}>${s}</text>`;
const cap = (x, y, s) => `<text x="${x}" y="${y}" font-size="11" fill="#8b96ad" text-anchor="middle" font-family="Golos Text,sans-serif" letter-spacing=".5">${s}</text>`;
const say = (x, y, s, fs, fill, extra = '') => `<text x="${x}" y="${y}" font-size="${fs}" fill="${fill}" text-anchor="middle" font-family="Golos Text,sans-serif" ${extra}>${s}</text>`;
const line = (p, q, st, w, extra = '') => `<path d="M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
const sector = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(c.x)} ${f1(c.y)}L${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}Z`; };
const knob = (id, p, col, part) => `<g data-drag="${id}" data-part="${part}"><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="22" fill="transparent"/><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="9" fill="${col}" stroke="${INK}" stroke-width="2"/></g>`;
// inner angle at V between rays to U and W, as [a0, span]
function angSpan(V, U, W) { let a0 = degOf(V, U), d = (((degOf(V, W) - a0) % 360) + 360) % 360; if (d > 180) { a0 = degOf(V, W); d = 360 - d; } return [a0, d]; }
const tick = (p, q, n, col) => { let h = ''; const m = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 }, L = dist(p, q) || 1, ux = (q.x - p.x) / L, uy = (q.y - p.y) / L;
  for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 5, c = { x: m.x + ux * o, y: m.y + uy * o }; h += line({ x: c.x - uy * 6, y: c.y + ux * 6 }, { x: c.x + uy * 6, y: c.y - ux * 6 }, col, 1.6); } return h; };

function triSVG(P, o, s, opt) {
  const V = {}; for (const k of ['A', 'B', 'C']) V[k] = { x: o.x + P[k].x * s, y: o.y - P[k].y * s };
  const G = { x: (V.A.x + V.B.x + V.C.x) / 3, y: (V.A.y + V.B.y + V.C.y) / 3 };
  const on = e => opt.sel.includes(e), clk = e => opt.click ? `data-drag="el" data-e="${e}"` : 'pointer-events="none"';
  let h = `<g data-part="${opt.part}" pointer-events="none"><path d="M${f1(V.A.x)} ${f1(V.A.y)}L${f1(V.B.x)} ${f1(V.B.y)}L${f1(V.C.x)} ${f1(V.C.y)}Z" fill="${opt.fill}"/></g>`;
  for (const e of ['a', 'b', 'c']) {
    const [p, q] = SIDE[e].map(k => V[k]), mid = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
    const dx = mid.x - G.x, dy = mid.y - G.y, L = Math.hypot(dx, dy) || 1, lp = { x: mid.x + dx / L * 15, y: mid.y + dy / L * 15 };
    h += `<g ${clk(e)} data-part="${opt.part} els">${opt.click ? line(p, q, 'transparent', 20) : ''}${line(p, q, on(e) ? '#ffb547' : opt.col, on(e) ? 3.4 : 2, 'stroke-linecap="round"')}${txt(lp.x, lp.y + 4, f1c(elVal(P, e)), 11.5, on(e) ? '#ffb547' : '#8b96ad', on(e) ? 'font-weight="600"' : '')}</g>`;
  }
  for (const k of ['A', 'B', 'C']) {
    const [u, w] = ['A', 'B', 'C'].filter(q => q !== k), [a0, d] = angSpan(V[k], V[u], V[w]);
    const r = opt.click ? 28 : 20, lp = PT(V[k], d < 30 ? r + 22 : r + 14, a0 + d / 2), col = on(k) ? '#ffb547' : '#5d6a85';
    h += `<g ${clk(k)} data-part="${opt.part} els"><path d="${sector(V[k], r, a0, a0 + d)}" fill="${col}" fill-opacity="${on(k) ? 0.3 : 0.1}" stroke="${col}" stroke-width="1.3"/>${txt(lp.x, lp.y + 4, Math.round(elVal(P, k)) + '°', 10.5, on(k) ? '#ffb547' : '#8b96ad', on(k) ? 'font-weight="600"' : '')}</g>`;
    const vl = { x: V[k].x + (V[k].x - G.x) / (dist(V[k], G) || 1) * 13, y: V[k].y + (V[k].y - G.y) / (dist(V[k], G) || 1) * 13 };
    h += txt(vl.x, vl.y + 5, k + (opt.sub || ''), 13.5, '#e8ecf4', 'font-weight="600" pointer-events="none"');
  }
  return h;
}
const O1a = { x: 30, y: 210 }, O1b = { x: 288, y: 210 }, SC1 = 30;

function drawIso() {

  lp = PT(C, 34, ca0 + cd / 2 + 180); h += txt(lp.x, lp.y - 2, Math.round(m.aC) + '°', 11.5, '#c39bff', 'font-weight="500"') + '</g>';

function drawSum() {

  if (m.ext) h += `<g data-part="ext" pointer-events="none">${line(B, { x: B.x + 80, y: B.y }, '#8b96ad', 1.6, 'stroke-dasharray="5 4"')}</g>`;

  h += sec(A, 30, 0, a, SA, a + '°', 'angs3') + sec(B, 30, 180 - b, 180, SB, b + '°', 'angs3');
  h += sec(C, 26, 180 + a, 360 - b, SCc, m.aC + '°', 'angs3', m.aC < 30 ? 46 : 42);
  if (m.par) h += sec(C, 34, 180, 180 + a, SA, a + '°', 'par3', 52) + sec(C, 34, 360 - b, 360, SB, b + '°', 'par3', 52);

function drawCmp() {
  const m = model(), C0 = CTR();
  let h = '<g data-part="given">';
  [['a', 18, '#72d4e8'], ['b', 46, '#ffb547'], ['d', 74, '#ff8a73']].forEach(([k, y, col]) => {
    const L = GIVEN[k] * SC4, act = near(S.r, GIVEN[k]);
    h += `<g data-drag="take" data-s="${k}" style="cursor:pointer"><rect x="6" y="${y - 12}" width="${L + 110}" height="24" rx="6" fill="${act ? 'rgba(255,255,255,.05)' : 'transparent'}" stroke="${act ? col : 'transparent'}"/>` +
      `<text x="14" y="${y + 4}" font-size="12" fill="${col}" font-weight="600">${k} = ${f1c(GIVEN[k])} см</text>` +
      `<path d="M96 ${y}H${96 + L}M96 ${y - 5}V${y + 5}M${96 + L} ${y - 5}V${y + 5}" stroke="${col}" stroke-width="2"/></g>`;
  });
  h += '</g>';
  // arcs
  const la = lastArc('A'), lb = lastArc('B');
  h += '<g data-part="arcs" pointer-events="none">';
  S.arcs.forEach(arc => {
    const c = arc.c === 'A' ? A4 : B4, R = arc.r * SC4, [d0, d1] = arc.c === 'A' ? [2, 118] : [62, 178];
    const p = PT(c, R, d0), q = PT(c, R, d1), cur = arc === la || arc === lb, col = arc.c === 'A' ? '#ffb547' : '#72d4e8';
    h += `<path d="M${f1(p.x)} ${f1(p.y)}A${f1(R)} ${f1(R)} 0 0 0 ${f1(q.x)} ${f1(q.y)}" fill="none" stroke="${col}" stroke-width="${cur ? 1.8 : 1}" opacity="${cur ? 1 : 0.3}"/>`;
  });
  h += '</g>';
  // base AB
  h += `<g data-part="ab" pointer-events="none">${line(A4, B4, '#e8ecf4', 2.4, 'stroke-linecap="round"')}${txt((A4.x + B4.x) / 2, A4.y + 20, 'c = AB = 6 см', 11.5, '#8b96ad')}</g>`;
  // triangle
  let Cs = null;
  if (m.C) {
    Cs = { x: A4.x + m.C.x * SC4, y: A4.y - m.C.y * SC4 };
    if (m.joined) h += `<g data-part="tri4" pointer-events="none">${line(A4, Cs, m.ok ? '#86e0a8' : '#ff8a73', 2.4, 'stroke-linecap="round"')}${line(B4, Cs, m.ok ? '#86e0a8' : '#ff8a73', 2.4, 'stroke-linecap="round"')}` +
      txt((A4.x + Cs.x) / 2 - 22, (A4.y + Cs.y) / 2, f1c(m.rA), 12, '#ffb547') + txt((B4.x + Cs.x) / 2 + 22, (B4.y + Cs.y) / 2, f1c(m.rB), 12, '#72d4e8') + '</g>';

  }
  // centres A, B

    const on = S.cc === k;
    h += `<g data-drag="ctr" data-c="${k}" data-part="ab" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="20" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="${on ? 6 : 5}" fill="${on ? '#ffb547' : '#e8ecf4'}" stroke="${INK}" stroke-width="1.5"/></g>`;
    h += txt(p.x + (k === 'A' ? -14 : 14), p.y + 18, k, 14, '#e8ecf4', 'font-weight="600" pointer-events="none"');
  }
  // compass
  const P = PT(C0, S.r * SC4, S.cang), mid = { x: (C0.x + P.x) / 2, y: (C0.y + P.y) / 2 }, d = dist(C0, P), Lg = 130;
  const hh = Math.sqrt(Math.max(0, Lg * Lg - d * d / 4));
  let nx = -(P.y - C0.y) / (d || 1), ny = (P.x - C0.x) / (d || 1); if (ny > 0) { nx = -nx; ny = -ny; }
  const Hg = { x: mid.x + nx * hh, y: mid.y + ny * hh };
  h += `<g data-part="comp" pointer-events="none">${line(C0, P, '#8b96ad', 1, 'stroke-dasharray="3 4"')}${m.joined ? '' : txt(mid.x - nx * 12, mid.y - ny * 12 + 4, 'r = ' + f1c(S.r), 11.5, '#e8ecf4')}` +
    `${line(Hg, C0, '#b8c2d6', 3.2, 'stroke-linecap="round"')}${line(Hg, P, '#b8c2d6', 3.2, 'stroke-linecap="round"')}<circle cx="${f1(Hg.x)}" cy="${f1(Hg.y)}" r="6" fill="#26324a" stroke="#b8c2d6" stroke-width="2"/>` +
    `<path d="M${f1(Hg.x)} ${f1(Hg.y - 6)}v-12" stroke="#b8c2d6" stroke-width="3" stroke-linecap="round"/></g>`;
  h += `<g data-drag="pen" data-part="comp"><circle cx="${f1(P.x)}" cy="${f1(P.y)}" r="22" fill="transparent"/><circle cx="${f1(P.x)}" cy="${f1(P.y)}" r="7" fill="#ffb547" stroke="${INK}" stroke-width="2"/></g>`;
  return h;
}

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'eq' ? drawEq() : id === 'iso' ? drawIso() : id === 'sum' ? drawSum() : drawCmp();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);
      scene.insertAdjacentHTML('beforeend', `<rect x="${f1(bb.x0 - 6)}" y="${f1(bb.y0 - 6)}" width="${f1(bb.x1 - bb.x0 + 12)}" height="${f1(bb.y1 - bb.y0 + 12)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`); }
    else { S.hl = null; toast('Сейчас этого нет на поле — включите его кнопкой внизу.'); }
  }
}

let VB = { x: 0, y: 0, w: 520, h: 300 }, dirty = true;
function fit() {
  const st = $('#stage'), W0 = st.clientWidth, H0 = st.clientHeight; if (!W0 || !H0) return;
  const top = Math.max($('#taskBox').offsetHeight, $('#meter').offsetHeight) + 24, hh = Math.max(140, H0 - top - 54);
  scene.style.top = top + 'px'; scene.style.height = hh + 'px';
  const D = DIM[LID()], s = Math.min(W0 / (D[0] + 16), hh / (D[1] + 8), 1.8);
  VB = { w: W0 / s, h: hh / s }; VB.x = D[0] / 2 - VB.w / 2; VB.y = D[1] / 2 - VB.h / 2;
  scene.setAttribute('viewBox', `${f1(VB.x)} ${f1(VB.y)} ${f1(VB.w)} ${f1(VB.h)}`);

}
const ro = new ResizeObserver(fit);
ro.observe($('#stage')); ro.observe($('#taskBox')); ro.observe($('#meter'));

// ---------- pointer ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(id, p) {
  if (id === 'apex') setApex((p.x - O2.x) / SC2, (O2.y - p.y) / SC2);
  else if (id === 'c3' && S.fix3) {
    const f = S.fix3, px = (p.x - f.ox) / f.s, py = Math.max(0.05, (f.oy - p.y) / f.s);
    setAB(Math.atan2(py, px) / RAD, Math.atan2(py, 7 - px) / RAD);
  } else if (id === 'pen') { const C0 = CTR(); S.cang = degOf(C0, p); const r0 = S.r; setR(dist(C0, p) / SC4); if (r0 === S.r) dirty = true; }
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  const k = el.dataset.drag;
  if (k === 'el') { toggleEl(el.dataset.e); return; }
  if (k === 'take') { setR(GIVEN[el.dataset.s]); toast(`Раствор циркуля = ${el.dataset.s} = ${f1c(GIVEN[el.dataset.s])} см`); return; }
  if (k === 'ctr') { setCenter(el.dataset.c); return; }
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  drag = { id: k };
  if (k === 'c3') { const g = sumGeo(); S.fix3 = { s: g.s, ox: g.ox, oy: g.oy }; }
  scene.classList.add('grabbing');
  dragTo(k, toSvg(e));
});
scene.addEventListener('pointermove', e => { if (drag) dragTo(drag.id, toSvg(e)); });
const endDrag = () => { if (!drag) return; drag = null; S.fix3 = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {

  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    eq: B('clear', 'Сбросить выбор') + sep + B('over', 'Наложить на ABC', S.over),
    iso: B('med', 'Медиана', S.show.med) + B('bis', 'Биссектриса', S.show.bis) + B('alt', 'Высота', S.show.alt) + sep + B('u0', 'C над серединой'),
    sum: B('A-', '∠A −1') + B('A+', '∠A +1') + B('B-', '∠B −1') + B('B+', '∠B +1') + sep + B('par', 'Параллельная через C', S.par3) + B('ext', 'Внешний угол', S.ext),
    cmp: B('cA', 'Ножка в A', S.cc === 'A') + B('cB', 'Ножка в B', S.cc === 'B') + sep + B('arc', 'Провести дугу') + B('join', 'Соединить') + B('erase', 'Стереть'),
  }[id];
}
function act(a) {
  let mm;
  if (a === 'clear') { S.sel = []; update(); return; }
  if (a === 'over') { S.over = !S.over; renderTools(); update(); return; }
  if (/^(med|bis|alt)$/.test(a)) { S.show[a] = !S.show[a]; renderTools(); update(); return; }
  if (a === 'u0') { setApex(0, S.h); return; }
  if ((mm = a.match(/^([AB])([+-])$/))) { const d = mm[2] === '+' ? 1 : -1; if (mm[1] === 'A') setAB(S.tA + d, S.tB); else setAB(S.tA, S.tB + d); return; }
  if (a === 'par') { S.par3 = !S.par3; if (S.par3) S.parSeen = true; renderTools(); update(); return; }
  if (a === 'ext') { S.ext = !S.ext; renderTools(); update(); return; }
  if (a === 'cA' || a === 'cB') { setCenter(a[1]); renderTools(); return; }
  if ((mm = a.match(/^take-([abd])$/))) { setR(GIVEN[mm[1]]); return; }
  if (a === 'arc') { drawArc(); return; }
  if (a === 'join') { joinPts(); return; }
  if (a === 'erase') { S.arcs = []; S.joined = false; update(); return; }
}

  angs3: IC(TRI('var(--muted)') + '<path d="M5 28L12 28A7 7 0 0 0 8.4 22Z" fill="rgba(255,181,71,.5)"/><path d="M29 28L22 28A7 7 0 0 1 25.6 22Z" fill="rgba(114,212,232,.5)"/><path d="M17 6L14.3 11A6 6 0 0 0 19.7 11Z" fill="rgba(134,224,168,.6)"/>'),
  apex3: IC(TRI('var(--muted)') + '<circle cx="17" cy="6" r="4" fill="var(--force)"/>'),

  comp: IC('<path d="M17 4L8 30M17 4L26 30" stroke="#b8c2d6" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="6" r="3" fill="#26324a" stroke="#b8c2d6" stroke-width="1.6"/>'),
  arcs: IC('<path d="M6 30A20 20 0 0 1 22 10" stroke="var(--force)" stroke-width="1.6" fill="none"/><path d="M28 30A18 18 0 0 0 10 12" stroke="var(--arm)" stroke-width="1.6" fill="none"/>'),

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const yn = v => v ? '<span class="yes">да</span>' : '<span class="no">нет</span>';

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'eq') return `признаков найдено: ${m.found} из 3 · выбрано ${m.sel.length}/3`;
  if (m.kind === 'iso') return `AC = ${fmt(m.AC)} · BC = ${fmt(m.BC)} · ∠C = ${Math.round(m.aC)}°`;
  if (m.kind === 'sum') return `∠A = ${m.aA}° · ∠B = ${m.aB}° · ∠C = ${m.aC}°${m.parSeen ? '' : ' · параллельная не включалась'}`;
  return m.C ? (m.joined ? `стороны ${f1c(m.rA)}, ${f1c(m.rB)}, 6 см` : 'точка C есть — соедините') : `дуг: ${m.n} · раствор ${f1c(m.r)} см`;
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'eq') h = `<h2>Выбор элементов</h2><dl class="reads"><div><dt>Выбрано</dt><dd id="r1"></dd></div><div><dt>Тройка</dt><dd id="r2"></dd></div><div><dt>Признаков</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Стороны и углы △ABC</div><div class="chips" id="elChips">${EL_ALL.map(e => `<button data-e="${e}">${ELN[e]} = ${elStr(T0, e)}</button>`).join('')}</div></div>
      <div class="ctl"><div class="lbl">Проверка</div><div class="chips" id="ovChips"><button data-o="1">Наложить копию на ABC</button></div></div>
      <h3>Найденные признаки</h3><div class="steps" id="foundList"></div>`;
  if (id === 'iso') h = `<h2>Треугольник ABC</h2><dl class="reads"><div><dt>AC</dt><dd id="r1"></dd></div><div><dt>BC</dt><dd id="r2"></dd></div><div><dt>∠C</dt><dd id="r3"></dd></div></dl>
      ${slider('inU', 'Сдвиг C от середины AB, см', -4, 4, 0.1, S.u)}${slider('inH', 'Высота вершины C, см', 0.8, 5, 0.05, S.h)}
      <div class="ctl"><div class="lbl">Показать отрезки из C</div><div class="chips" id="showChips"><button data-s="med">Медиана</button><button data-s="bis">Биссектриса</button><button data-s="alt">Высота</button></div></div>`;
  if (id === 'sum') h = `<h2>Углы треугольника</h2><dl class="reads"><div><dt>∠A</dt><dd id="r1"></dd></div><div><dt>∠B</dt><dd id="r2"></dd></div><div><dt>∠C</dt><dd id="r3"></dd></div></dl>
      ${slider('inTA', '∠A', 10, 160, 1, S.tA)}${slider('inTB', '∠B', 10, 160, 1, S.tB)}
      <div class="ctl"><div class="lbl">Показать</div><div class="chips" id="sumChips"><button data-s="par">Параллельная через C</button><button data-s="ext">Внешний угол при B</button></div></div>`;
  if (id === 'cmp') h = `<h2>Циркуль</h2><dl class="reads"><div><dt>Раствор</dt><dd id="r1"></dd></div><div><dt>Дуга из A</dt><dd id="r2"></dd></div><div><dt>Дуга из B</dt><dd id="r3"></dd></div></dl>
      ${slider('inR', 'Раствор циркуля, см', 0.5, 6.5, 0.1, S.r)}
      <div class="ctl"><div class="lbl">Ножка циркуля</div><div class="chips" id="ctrChips"><button data-c="A">в точке A</button><button data-c="B">в точке B</button></div></div>
      <div class="ctl"><div class="lbl">Снять раствор с отрезка</div><div class="chips" id="takeChips"><button data-t="a">a = 5 см</button><button data-t="b">b = 4 см</button><button data-t="d">d = 1,5 см</button></div></div>
      <div class="row"><button class="ghostbtn" data-a="arc">Провести дугу</button><button class="ghostbtn" data-a="join">Соединить</button><button class="ghostbtn" data-a="erase">Стереть</button></div>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inU', e => setApex(+e.target.value, S.h));
  on('#inH', e => setApex(S.u, +e.target.value));
  on('#inTA', e => setAB(+e.target.value, S.tB));
  on('#inTB', e => setAB(S.tA, +e.target.value));
  on('#inR', e => setR(+e.target.value));
  el.querySelectorAll('#elChips button').forEach(b => b.onclick = () => toggleEl(b.dataset.e));
  el.querySelectorAll('#ovChips button').forEach(b => b.onclick = () => act('over'));
  el.querySelectorAll('#showChips button, #sumChips button').forEach(b => b.onclick = () => act(b.dataset.s));
  el.querySelectorAll('#ctrChips button').forEach(b => b.onclick = () => act('c' + b.dataset.c));
  el.querySelectorAll('#takeChips button').forEach(b => b.onclick = () => act('take-' + b.dataset.t));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.innerHTML = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'eq') {
    set('#r1', m.sel.length + ' из 3'); set('#r2', m.cls.kind === 'few' ? '—' : m.cls.kind.slice(0, 3).toUpperCase().replace(/S/g, 'С').replace(/A/g, 'У')); set('#r3', m.found + ' из 3');
    el.querySelectorAll('#elChips button').forEach(b => b.setAttribute('aria-pressed', m.sel.includes(b.dataset.e)));
    el.querySelectorAll('#ovChips button').forEach(b => b.setAttribute('aria-pressed', S.over));
    set('#foundList', ['sas', 'asa', 'sss'].map(k => step(KIND[k].n, S.found.has(k) ? '<span class="yes">найден</span>' : '<span class="no">ещё нет</span>')).join(''));
  }
  if (m.kind === 'iso') {
    set('#r1', fmt(m.AC) + ' см'); set('#r2', fmt(m.BC) + ' см'); set('#r3', Math.round(m.aC) + '°');
    set('#inUO', fmt(m.u)); set('#inHO', fmt(m.h)); val('#inU', m.u); val('#inH', m.h);
    el.querySelectorAll('#showChips button').forEach(b => b.setAttribute('aria-pressed', !!S.show[b.dataset.s]));
  }
  if (m.kind === 'sum') {
    set('#r1', m.aA + '°'); set('#r2', m.aB + '°'); set('#r3', m.aC + '°'); set('#inTAO', m.aA + '°'); set('#inTBO', m.aB + '°'); val('#inTA', m.aA); val('#inTB', m.aB);
    el.querySelectorAll('#sumChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === 'par' ? S.par3 : S.ext));
  }
  if (m.kind === 'cmp') {
    set('#r1', f1c(m.r) + ' см'); set('#r2', m.rA ? f1c(m.rA) + ' см' : '—'); set('#r3', m.rB ? f1c(m.rB) + ' см' : '—'); set('#inRO', f1c(m.r)); val('#inR', m.r);
    el.querySelectorAll('#ctrChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === S.cc));
    el.querySelectorAll('#takeChips button').forEach(b => b.setAttribute('aria-pressed', near(S.r, GIVEN[b.dataset.t])));
  }
}

function partsList() {
  const id = LID();
  if (id === 'eq') return [
    { id: 'orig', name: 'Исходный △ABC', spec: 'Стороны 7, 5 и 5,4 см, углы 50°, 45° и 85°. Его элементы можно нажимать.' },
    { id: 'els', name: 'Шесть элементов', spec: 'Три стороны и три угла. Выбранные подсвечены оранжевым, выбрать можно три.' },
    { id: 'copy', name: 'Собранный △A₁B₁C₁', spec: 'Построен только по выбранным элементам. Зелёный — совпал с ABC, красный — вышел другой.' },
    { id: 'over', name: 'Наложение', spec: 'Пунктир — копия, наложенная на ABC. Равные треугольники совпадают полностью.' },
    { id: 'verdict', name: 'Вывод', spec: 'Какой это признак — или почему эта тройка не признак.' }];

    { id: 'angs', name: 'Углы при основании', spec: '∠A и ∠B. В равнобедренном треугольнике они равны.' },
    { id: 'apex', name: 'Вершина C и угол при ней', spec: 'Её можно тащить. Угол при вершине — фиолетовый.' },
    { id: 'med', name: 'Медиана CM', spec: 'Ведёт в середину AB (точка M).' },
    { id: 'bis', name: 'Биссектриса CD', spec: 'Делит ∠C пополам.' },
    { id: 'alt', name: 'Высота CH', spec: 'Перпендикуляр из C к прямой AB.' }];
  if (id === 'sum') return [
    { id: 'tri', name: 'Треугольник ABC', spec: 'Сторона AB неподвижна, C двигается.' },
    { id: 'angs3', name: 'Углы A, B, C', spec: 'Оранжевый, голубой и зелёный. Их сумма внизу.' },
    { id: 'apex3', name: 'Ручка вершины C', spec: 'Тащите — углы меняются, сумма нет.' },
    { id: 'par3', name: 'Параллельная через C', spec: 'Прямая ∥ AB. Накрест лежащие углы — копии ∠A и ∠B у вершины C.' },
    { id: 'ext', name: 'Внешний угол при B', spec: 'Смежен с ∠B. Равен ∠A + ∠C.' }];
  return [
    { id: 'given', name: 'Данные отрезки a, b, d', spec: 'Нажмите отрезок — циркуль снимет его длину.' },
    { id: 'ab', name: 'Отрезок AB = c', spec: 'Уже отложен. Нажмите A или B, чтобы поставить туда ножку циркуля.' },
    { id: 'comp', name: 'Циркуль', spec: 'Ножка с иглой в центре, грифель на расстоянии r. Грифель можно тащить.' },
    { id: 'arcs', name: 'Дуги', spec: 'Оранжевые — из A, голубые — из B. Яркие — последние.' },
    { id: 'pt', name: 'Точка C', spec: 'Пересечение последних дуг из A и из B.' },
    { id: 'tri4', name: 'Построенный треугольник', spec: 'Появится после «Соединить».' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на поле</h2><p class="note">Нажмите на пункт, чтобы найти его на поле.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'eq') {
    const c = m.cls;
    let h = `<h2>Сравнение элементов</h2><div class="formula">${c.kind === 'few' ? 'выбрано ' + m.sel.length + ' из 3' : m.sel.map(e => ELN[e]).join(', ')}</div>`;
    if (!c.P) return h + `<p class="note">Выберите три элемента — по ним соберём треугольник и сравним с ABC.</p>`;
    h += `<div class="steps">` + EL_ALL.map(e => { const v0 = elVal(T0, e), v1 = elVal(c.P, e), eqv = SIDE[e] ? Math.abs(v0 - v1) < 0.05 : Math.abs(v0 - v1) < 0.5;
      return step(`${ELN[e]}${m.sel.includes(e) ? ' · дано' : ''}`, `${elStr(T0, e)} → ${elStr(c.P, e).replace(/ см/, '')} ${eqv ? '<span class="yes">=</span>' : '<span class="no">≠</span>'}`); }).join('');
    h += step('Вывод', KIND[c.kind].crit ? '<span class="yes">' + KIND[c.kind].n + '</span>' : KIND[c.kind].ok ? 'совпал, но не признак' : '<span class="no">не признак</span>', 'sum') + `</div>`;
    const why = {
      sss: 'Из трёх отрезков треугольник складывается только одним способом — его нельзя «перекосить».',
      sas: 'Угол между сторонами фиксирует, куда они направлены, а длины — где концы. Третья сторона уже определена.',
      asa: 'Из концов стороны лучи идут под заданными углами. Две прямые пересекаются в одной точке — это вершина.',
      aas: 'Третий угол = 180° − два известных (урок 3). Тогда сторона и оба угла при ней известны — II признак.',
      ssa: `Сторона ${ELN[c.W ? c.W.toLowerCase() : 'a']} может принять два значения — и оба треугольника подходят под условие.`,
      ssa1: 'Здесь против данного угла лежит бо́льшая из двух сторон, поэтому вариант один. Но в общем случае их может быть два.',
      aaa: 'Подобные треугольники — одной формы, но разного размера. Углы равны, стороны нет.',
    }[c.kind];
    return h + `<p class="note" style="margin-top:10px">${why}</p><h3>Найдено</h3><div class="steps">${['sas', 'asa', 'sss'].map(k => step(KIND[k].n, yn(S.found.has(k)))).join('')}</div>`;
  }
  if (m.kind === 'iso') {
    return `<h2>Равнобедренный?</h2><div class="formula">AC = BC ⇒ ∠A = ∠B</div><div class="steps">` +
      step('AC', fmt(m.AC) + ' см') + step('BC', fmt(m.BC) + ' см') + step('AC = BC?', yn(m.iso), 'sum') +
      step('∠A', Math.round(m.aA) + '°') + step('∠B', Math.round(m.aB) + '°') + step('∠C = 180° − ∠A − ∠B', `${Math.round(m.aC)}°`) + `</div>` +
      `<h3>Где отрезки из C встречают AB</h3><div class="steps">` +
      step('AM (медиана)', '3 см — середина') + step('AD (биссектриса)', `6 · AC/(AC+BC) = ${fmt(m.bd + 3)} см`) + step('AH (высота)', `${fmt(m.u + 3)} см`) +
      step('совпали?', yn(m.iso), 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">${m.iso ? `Углы при основании равны: (180° − ${Math.round(m.aC)}°) : 2 = ${fmt((180 - Math.round(m.aC)) / 2)}°. M, D и H — одна точка.` : 'Биссектриса делит AB в отношении AC : BC. Середина получится, только если AC = BC.'}</p>`;
  }
  if (m.kind === 'sum') {
    return `<h2>Сумма углов</h2><div class="formula">∠A + ∠B + ∠C = 180°</div><div class="steps">` +
      step('∠A', m.aA + '°') + step('∠B', m.aB + '°') + step('∠C = 180° − ∠A − ∠B', `180 − ${m.aA} − ${m.aB} = ${m.aC}°`) +
      step('проверка', `${m.aA} + ${m.aB} + ${m.aC} = 180°`, 'sum') + `</div>` +
      `<h3>Доказательство через параллельную</h3><div class="steps">` +
      step('1. Прямая через C ∥ AB', 'аксиома параллельных') + step('2. левый угол у C = ∠A', 'накрест лежащие') + step('3. правый угол у C = ∠B', 'накрест лежащие') +
      step('4. ∠A + ∠C + ∠B', 'развёрнутый угол = 180°', 'sum') + `</div>` +
      `<h3>Внешний угол при B</h3><div class="steps">` + step('180° − ∠B', `180 − ${m.aB} = ${180 - m.aB}°`) + step('∠A + ∠C', `${m.aA} + ${m.aC} = ${m.aA + m.aC}°`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Вид треугольника: ${m.aA > 90 || m.aB > 90 || m.aC > 90 ? 'тупоугольный' : m.aA === 90 || m.aB === 90 || m.aC === 90 ? 'прямоугольный' : 'остроугольный'}.</p>`;
  }
  const sides = (m.rA && m.rB) ? [m.rA, m.rB, 6].sort((p, q) => q - p) : null;
  let h = `<h2>Треугольник по трём сторонам</h2><div class="formula">a = 5 · b = 4 · c = 6 см</div><div class="steps">` +
    step('1. Отрезок AB = c', '6 см — готов') + step('2. Дуга из A', m.rA ? `r = ${f1c(m.rA)} см ${near(m.rA, 4) || near(m.rA, 5) ? '<span class="yes">✓</span>' : ''}` : 'ещё нет') +
    step('3. Дуга из B', m.rB ? `r = ${f1c(m.rB)} см ${near(m.rB, 4) || near(m.rB, 5) ? '<span class="yes">✓</span>' : ''}` : 'ещё нет') +
    step('4. Точка C', m.C ? 'дуги пересеклись' : 'нет') + step('5. Соединить', m.joined ? (m.ok ? '<span class="yes">готово</span>' : '<span class="no">не те стороны</span>') : 'ещё нет', 'sum') + `</div>`;
  if (sides) h += `<h3>Неравенство треугольника</h3><div class="steps">` + step('бо́льшая сторона', f1c(sides[0]) + ' см') + step('сумма двух других', `${f1c(sides[1])} + ${f1c(sides[2])} = ${f1c(sides[1] + sides[2])} см`) +
    step('бо́льшая < суммы?', yn(sides[0] < sides[1] + sides[2] - 1e-9), 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Циркуль не измеряет — он переносит длину. Поэтому построение точное без всякой линейки с делениями.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'eq') el.innerHTML = `<div class="k">Признаки</div><div class="v ${ok ? 'ok' : ''}">${m.found} из 3</div>${['sas', 'asa', 'sss'].map(k => `<div class="lr"><span>${KIND[k].n.split(' ')[0]} · ${KIND[k].n.match(/\((.+)\)/)[1]}</span><span>${S.found.has(k) ? '✓' : '·'}</span></div>`).join('')}`;
  else if (m.kind === 'iso') el.innerHTML = `<div class="k">Боковые стороны</div><div class="v ${m.iso ? 'ok' : ''}">${fmt(m.AC)} · ${fmt(m.BC)}</div><div class="lr"><span>∠A · ∠B</span><span>${Math.round(m.aA)}° · ${Math.round(m.aB)}°</span></div><div class="lr"><span>∠C</span><span>${Math.round(m.aC)}°</span></div>`;
  else if (m.kind === 'sum') el.innerHTML = `<div class="k">Сумма углов</div><div class="v ok">180°</div><div class="gauge" style="display:flex;overflow:hidden"><b style="position:static;width:${(m.aA / 1.8).toFixed(1)}%;background:#ffb547;border-radius:0"></b><b style="position:static;width:${(m.aC / 1.8).toFixed(1)}%;background:#86e0a8;border-radius:0"></b><b style="position:static;width:${(m.aB / 1.8).toFixed(1)}%;background:#72d4e8;border-radius:0"></b></div><div class="lr"><span>A · C · B</span><span>${m.aA}·${m.aC}·${m.aB}</span></div>`;
  else el.innerHTML = `<div class="k">Циркуль</div><div class="v ${ok ? 'ok' : ''}">r = ${f1c(m.r)} см</div><div class="lr"><span>ножка</span><span>в ${m.cc}</span></div><div class="lr"><span>из A · из B</span><span>${m.rA ? f1c(m.rA) : '—'} · ${m.rB ? f1c(m.rB) : '—'}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  eq: '<path d="M4 25L14 7L26 25Z" fill="none" stroke="#e8ecf4" stroke-width="1.3"/><path d="M38 25L48 7L60 25Z" fill="rgba(134,224,168,.15)" stroke="#86e0a8" stroke-width="1.3"/><path d="M29 14h6M29 18h6" stroke="#ffb547" stroke-width="1.4"/>',
  iso: '<path d="M14 26L33 4L52 26Z" fill="none" stroke="#86e0a8" stroke-width="1.4"/><path d="M33 4V26" stroke="#ffb547" stroke-width="1.2" stroke-dasharray="2 2"/>',
  sum: '<path d="M8 26L50 26L22 6Z" fill="none" stroke="#e8ecf4" stroke-width="1.3"/><path d="M2 6H62" stroke="#72d4e8" stroke-dasharray="3 2"/><circle cx="22" cy="6" r="2.4" fill="#86e0a8"/>',
  cmp: '<path d="M14 26H48" stroke="#e8ecf4" stroke-width="1.4"/><path d="M38 26A24 24 0 0 0 20 8" stroke="#ffb547" fill="none"/><path d="M22 26A22 22 0 0 1 42 8" stroke="#72d4e8" fill="none"/><circle cx="31" cy="11" r="2.4" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.fix3 = null;
  if (L.id === 'eq') { S.sel = []; S.found = new Set(); S.over = false; }
  if (L.id === 'iso') { S.u = L.u; S.h = L.h; S.show = { med: true, bis: true, alt: true }; }
  if (L.id === 'sum') { S.tA = L.A; S.tB = L.B; S.par3 = false; S.ext = false; S.parSeen = false; }
  if (L.id === 'cmp') { S.r = L.r; S.cc = 'A'; S.cang = 60; S.arcs = []; S.joined = false; }
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'eq') now = `Слева исходный △ABC: AB = 7 см, AC = 5 см, BC ≈ 5,4 см, ∠A = 50°, ∠B ≈ 45°, ∠C ≈ 85°. Ученик выбирает три элемента, справа строится треугольник только по ним. Выбрано: ${m.sel.map(e => ELN[e]).join(', ') || 'ничего'}. Результат: ${m.cls.kind === 'few' ? 'пока мало элементов' : KIND[m.cls.kind].n + (KIND[m.cls.kind].ok ? ' — треугольник совпал с ABC' : ' — получился другой треугольник')}. Найдено признаков: ${m.found} из 3 (${[...S.found].map(k => KIND[k].n).join(', ') || 'ни одного'}). Наложение ${m.over ? 'включено' : 'выключено'}. Не называй готовые тройки — спрашивай, какие элементы связаны друг с другом (угол между сторонами, углы при стороне).`;
  if (id === 'iso') now = `Основание AB = 6 см, вершину C тащат. Сейчас C сдвинута от середины AB на ${fmt(m.u)} см, высота ${fmt(m.h)} см. AC = ${fmt(m.AC)} см, BC = ${fmt(m.BC)} см, ∠A = ${Math.round(m.aA)}°, ∠B = ${Math.round(m.aB)}°, ∠C = ${Math.round(m.aC)}°. Треугольник ${m.iso ? 'равнобедренный' : 'не равнобедренный'}. Показаны: ${['med', 'bis', 'alt'].filter(k => S.show[k]).map(k => ({ med: 'медиана', bis: 'биссектриса', alt: 'высота' })[k]).join(', ') || 'ничего'}; основания отрезков на AB: медиана 3 см от A, биссектриса ${fmt(m.bd + 3)} см, высота ${fmt(m.u + 3)} см. Задание: AC = BC и ∠C = 80°. Наводи вопросами, где должна стоять вершина.`;
  if (id === 'sum') now = `Треугольник ABC, AB неподвижна. ∠A = ${m.aA}°, ∠B = ${m.aB}°, ∠C = ${m.aC}°. Параллельная через C ${m.par ? 'показана (видно копии ∠A и ∠B у вершины C)' : 'скрыта'}, включалась: ${m.parSeen ? 'да' : 'нет'}. Внешний угол при B ${m.ext ? 'показан (' + (180 - m.aB) + '°)' : 'скрыт'}. Задание: ∠C = 90°, ∠A = 35°, и включить параллельную. Не называй ∠B — помоги вычислить.`;
  if (id === 'cmp') now = `Построение треугольника по трём сторонам: AB = c = 6 см отложен, даны отрезки a = 5 см, b = 4 см и d = 1,5 см (d — ловушка: 1,5 + 4 < 6). Ножка циркуля в ${m.cc}, раствор ${f1c(m.r)} см. Последняя дуга из A: ${m.rA ? f1c(m.rA) + ' см' : 'нет'}, из B: ${m.rB ? f1c(m.rB) + ' см' : 'нет'}. Точка пересечения C ${m.C ? 'есть' : 'нет'}; ${m.joined ? 'точки соединены' : 'не соединены'}. Задание: дуга из A радиусом b, из B радиусом a, соединить. Объясняй, почему циркуль переносит длину без измерения.`;
  return [
    `Раздел: математика, 7 класс, геометрия, тема «Треугольники». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    eq: 'Почему три угла не задают треугольник?', iso: 'Почему у равнобедренного треугольника углы при основании равны?',
    sum: 'Может ли в треугольнике быть два тупых угла?', cmp: 'Почему из отрезков 1,5, 4 и 6 см треугольник не сложить?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
