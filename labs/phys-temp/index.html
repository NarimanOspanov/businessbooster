<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: температура и внутренняя энергия, теплопроводность, конвекция и излучение.">
<title>Температура и теплопередача</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31C12 31 13 20 19 20S26 11 31 9" fill="none" stroke="var(--force)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 31L29 11" stroke="var(--arm)" stroke-width="2.2" stroke-linecap="round"/><path d="M33 8l-7 1.5 4.5 4.5z" fill="var(--arm)"/><circle cx="7" cy="31" r="3" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Тепло</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с теплом. Предметы можно тянуть и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const deg = x => `${fmt(x, 0)} °C`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'inner', title: 'Внутренняя энергия',
    text: ['Всё вещество состоит из частиц, которые непрерывно движутся. Чем выше температура, тем быстрее они движутся. Энергию движения и взаимодействия всех частиц тела называют внутренней энергией.',
           'Внутреннюю энергию можно изменить двумя способами. Первый — совершить работу: сжать газ поршнем, потереть, ударить. Второй — теплопередача: тело получает энергию от более горячего тела, например от пламени, без всякой работы.',
           'Температуру по шкале Цельсия t переводят в шкалу Кельвина: T = t + 273. При 0 К (−273 °C) движение частиц было бы самым слабым — холоднее не бывает.'],
    why: 'В дизельном двигателе нет свечи зажигания: воздух в цилиндре так сильно сжимают поршнем, что он нагревается до 500–700 °C и топливо вспыхивает само. На этом работают грузовики, комбайны на целинных полях и тепловозы «Қазақстан темір жолы» — их обслуживают мотористы и механики. Каждый, кто накачивал велосипедную шину, замечал, что насос греется: это тоже работа, ставшая внутренней энергией.',
    task: 'Нагрейте газ с 20 °C до 70 °C двумя способами. Сначала только поршнем, не включая горелку. Затем нажмите «Сброс» и нагрейте только горелкой, не трогая поршень.',
    hint: 'Поршень тяните за ручку вниз. Сжимайте быстро: газ не успевает отдать тепло стенкам. А теперь сожмите сильно-сильно и посмотрите на вату на дне.',
    safe: 'Горелку и спиртовку зажигают только при учителе. Горячий цилиндр не трогают руками, над пламенем не наклоняются.',
    stage: 'Тяните ручку поршня вниз или включите горелку.',
    t0: 20, tNeed: 70, burn: 6, cool: 0.03,
    check: m => m.byA && m.byQ },
  { id: 'cond', title: 'Теплопроводность',
    text: ['Если нагреть один конец металлического стержня, скоро нагреется и другой. Частицы у горячего конца колеблются сильнее и толкают соседей. Так энергия передаётся по цепочке, а само вещество никуда не перемещается. Это теплопроводность.',
           'Лучше всех проводят тепло металлы, особенно медь, алюминий и серебро. Стекло, дерево, пластик проводят тепло плохо. Хуже всего — воздух и вещества с порами, где много воздуха: вата, пенопласт, мех.',
           'Классический опыт: к стержню прилепляют кнопки воском. Где воск растаял, кнопка падает. По тому, как быстро падают кнопки, видно, какой стержень проводит тепло лучше.'],
    why: 'Строители в Астане, где зимой бывает −35 °C, утепляют стены минватой и пенополистиролом: чем хуже утеплитель проводит тепло, тем меньше счёт за отопление. Повара выбирают сковородки с толстым алюминиевым или медным дном, чтобы еда не пригорала пятнами. Инженеры-электронщики ставят на процессоры алюминиевые и медные радиаторы, иначе компьютер перегреется.',
    task: 'Сравните медь и сталь: поставьте их на два стержня, включите нагрев и дождитесь, пока на медном стержне упадут все 5 кнопок.',
    hint: 'Материал стержня меняется кнопками «Верх» и «Низ». Время на площадке идёт в 10 раз быстрее. Посчитайте, сколько кнопок успеет упасть со стального стержня. Потом попробуйте стекло и дерево.',
    safe: 'Нагретый металл выглядит так же, как холодный. Стержни после опыта берут только щипцами или прихваткой.',
    stage: 'Выберите материалы и нажмите «Нагреть».',
    mats: ['al', 'glass'], hot: 300, melt: 60, speed: 10,
    check: m => m.ok },
  { id: 'conv', title: 'Конвекция',
    text: ['Тёплый воздух легче холодного: при нагревании он расширяется, и его плотность становится меньше. Поэтому тёплый воздух поднимается вверх, а холодный опускается на его место.',
           'Так возникают потоки, которые переносят тепло. Это конвекция: энергию переносит само движущееся вещество — жидкость или газ. В твёрдых телах конвекции нет.',
           'Чтобы конвекция работала, жидкость или газ нагревают снизу, а охлаждают сверху. Если нагревать сверху, тёплый слой так и останется наверху, а внизу будет холодно.'],
    why: 'Монтажники отопления ставят батареи внизу, под окнами: тёплый поток поднимается вдоль холодного стекла и не даёт сквозняку стечь на пол. Кондиционер, наоборот, вешают под потолок: холодный воздух сам опускается вниз. Горячая вода от ТЭЦ Алматы и Астаны отапливает кварталы, а метеорологи по восходящим потокам предсказывают грозы и ветер, например бриз на Капшагае и Балхаше.',
    task: 'Зима, на улице −15 °C, в комнате +12 °C. Включите батарею внизу и прогрейте воздух у пола до 20 °C. Затем перевесьте батарею под потолок и продержите её включённой не меньше 30 минут.',
    hint: 'Следите за точками: это частицы воздуха. Время идёт быстро: 1 секунда — 2 минуты. Сравните температуру у пола и под потолком в двух опытах.',
    stage: 'Выберите, где висит батарея, и включите её.',
    t0: 12, tOut: -15, tRad: 60, tNeed: 20, highMin: 30,
    check: m => m.lowOk && m.highOk },
  { id: 'rad', title: 'Излучение',
    text: ['Солнце греет Землю через 150 миллионов километров пустоты. Там нет ни вещества для теплопроводности, ни воздуха для конвекции. Энергию переносит излучение — невидимые инфракрасные лучи и свет.',
           'Излучают все тела, и чем горячее тело, тем сильнее. Тёмные тела хорошо поглощают излучение и сильно нагреваются. Светлые и блестящие отражают большую часть лучей и греются слабее.',
           'Чем дальше от источника, тем слабее излучение. Если отодвинуться в 2 раза дальше, на ту же площадь попадёт в 4 раза меньше энергии.'],
    why: 'Под Шымкентом, Туркестаном и Капшагаем работают солнечные электростанции, а солнечные водонагреватели делают с тёмными трубками — так они лучше поглощают лучи. Энергоаудиторы и пожарные смотрят на дома в тепловизор: он видит инфракрасное излучение и показывает, где из окон уходит тепло. Летом в жару светлая одежда и белые крыши спасают от перегрева.',
    task: 'Поставьте чёрную и белую банки с водой по обе стороны от лампы, включите лампу и добейтесь, чтобы чёрная банка нагрелась до 40 °C.',
    hint: 'Тяните банку, чтобы изменить расстояние до лампы: обе банки двигаются одинаково. Если чёрная никак не доходит до 40 °C, подумайте, что надо сделать с расстоянием.',
    safe: 'Мощная лампа сильно нагревается: не трогайте колбу и не ставьте рядом бумагу и ткань.',
    stage: 'Тяните банку, чтобы изменить расстояние, и включите лампу.',
    cans: ['black', 'foil'], d0: 0.5, tNeed: 40,
    check: m => m.ok },
];

const LS_KEY = 'luch-phys-temp';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// deterministic pseudo-random for particle layouts
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ---------- materials ----------
// thermal diffusivity a (m²/s) drives the simulation, conductivity λ (Вт/(м·°C)) is shown to students
const MAT = {
  cu: { name: 'медь', a: 1.11e-4, lam: 390, col: '#d98a4e' },
  al: { name: 'алюминий', a: 9.7e-5, lam: 210, col: '#b8c2d1' },
  st: { name: 'сталь', a: 1.4e-5, lam: 50, col: '#7d8798' },
  glass: { name: 'стекло', a: 3.4e-7, lam: 0.8, col: '#9fd6dc' },
  wood: { name: 'дерево', a: 1.5e-7, lam: 0.15, col: '#a87a4a' },
};
const MKEYS = Object.keys(MAT);
const CAN = {
  black: { name: 'чёрная', alpha: 0.95, fill: '#1c2029', hi: '#3a404e' },
  white: { name: 'белая', alpha: 0.3, fill: '#e8ecf4', hi: '#ffffff' },
  foil: { name: 'блестящая', alpha: 0.1, fill: '#aab4c4', hi: '#eef3fa' },
};
const CKEYS = Object.keys(CAN);

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const C1 = { xl: 180, xr: 300, yb: 340, hMax: 190, gy: 392 };                 // lesson 1: cylinder
const yP = V => C1.yb - C1.hMax * V;                                           // piston bottom
const R2 = { x0: 150, x1: 450, y: [200, 292], N: 50, Lm: 0.25, pins: [10, 20, 30, 40, 50] }; // lesson 2: rods 25 cm
const xr2 = i => R2.x0 + (R2.x1 - R2.x0) * i / R2.N;
const K3 = { xl: 80, xr: 440, yc: 130, yf: 370, n: 8 };                         // lesson 3: room, 8 air layers
const ly3 = i => K3.yf - (i + 1) * (K3.yf - K3.yc) / K3.n;
const P3 = { e: 0.08, cw: 0.3, h: 0.1, kw: 0.014, kc: 0.03, kf: 0.04, tg: 10, kd: 0.12, speed: 2 };
const G4 = { gy: 370, lx: 260, ly: 236, k: 230, off: 40, cw: 44, ch: 64 };     // lesson 4: lamp and cans
const canX = (side, d) => G4.lx + side * (G4.off + G4.k * d);

function makeDots(n) { const a = []; for (let i = 0; i < n; i++) { const ang = rnd() * Math.PI * 2; a.push({ x: C1.xl + 8 + rnd() * (C1.xr - C1.xl - 16), y: 0.15 + rnd() * 0.8, dx: Math.cos(ang), dy: Math.sin(ang) }); } return a; }
function makeTracers(n) { const a = []; for (let i = 0; i < n; i++) a.push({ u: rnd(), o: rnd(), j: rnd() * 6.28 }); return a; }

function resetState() {
  const Ls = L();
  seed = 7;
  Object.assign(S, {
    // lesson 1
    t: Ls.t0 !== undefined ? Ls.t0 : 20, V: 1, burner: false, usedA: false, usedQ: false, byA: false, byQ: false, fire: false, dots: makeDots(22),
    // lesson 2
    rods: (Ls.mats || ['al', 'glass']).map(k => ({ mat: k, T: new Float64Array(R2.N + 1).fill(20), fell: R2.pins.map(() => null) })), heat: false, ts: 0, ok: false,
    // lesson 3
    room: Array(K3.n).fill(Ls.t0 !== undefined ? Ls.t0 : 12), pos: 'low', on: false, tm: 0, highTime: 0, lowOk: false, highOk: false, w: 0, trc: makeTracers(46), lowRec: null, highRec: null,
    // lesson 4
    cans: (Ls.cans || ['black', 'foil']).slice(), d: Ls.d0 || 0.5, lamp: false, T4: [20, 20], t4: 0,
    hl: null,
  });
}

// ---------- physics ----------
const TK = t => t + 273;
const vMol = t => 502 * Math.sqrt(TK(t) / 293);                                // rms speed of air molecules, м/с
function setV(V) {
  if (LID() !== 'inner') return;
  V = clamp(Math.round(V * 100) / 100, 0.1, 1); if (V === S.V) return;
  S.t = TK(S.t) * Math.pow(S.V / V, 0.4) - 273;                                  // fast (adiabatic) compression of air
  S.V = V; S.usedA = true; checkInner(); update();
}
function checkInner() {
  const Ls = L();
  if (S.t >= Ls.tNeed) {
    if (S.usedA && !S.usedQ && !S.byA) { S.byA = true; toast(`Работой: газ сжали в ${fmt(1 / S.V, 1)} раза — и он нагрелся до ${deg(S.t)}.`); }
    if (S.usedQ && !S.usedA && !S.byQ) { S.byQ = true; toast(`Теплопередачей: горелка нагрела газ до ${deg(S.t)}, поршень не двигался.`); }
  }
  if (S.t >= 400 && !S.fire) { S.fire = true; toast('Вата вспыхнула от сжатого воздуха — как топливо в дизеле!'); }
}
function stepInner(dt) {
  const Ls = L();
  S.t += ((S.burner ? Ls.burn : 0) - Ls.cool * (S.t - 20)) * dt;
  if (S.burner) checkInner();
}

function rodStep(rod, dts) {
  const a = MAT[rod.mat].a, dx = R2.Lm / R2.N, T = rod.T, N = R2.N;
  const sub = Math.min(0.1, 0.4 * dx * dx / a), n = Math.ceil(dts / sub), h = dts / n, r = a * h / (dx * dx);
  const tmp = new Float64Array(N + 1);
  for (let k = 0; k < n; k++) {
    T[0] = L().hot;
    for (let i = 1; i < N; i++) tmp[i] = T[i] + r * (T[i - 1] - 2 * T[i] + T[i + 1]);
    tmp[N] = T[N] + 2 * r * (T[N - 1] - T[N]);                                   // far end is insulated
    for (let i = 1; i <= N; i++) T[i] = tmp[i];
  }
}
function stepCond(dt) {
  const Ls = L(), dts = dt * Ls.speed;
  S.ts += dts;
  S.rods.forEach((rod, ri) => {
    rodStep(rod, dts);
    R2.pins.forEach((p, k) => {
      if (rod.fell[k] === null && rod.T[p] >= Ls.melt) {
        rod.fell[k] = { ts: S.ts, at: performance.now() };
      }
    });
  });
  const cu = S.rods.find(r => r.mat === 'cu'), st = S.rods.find(r => r.mat === 'st');
  if (!S.ok && cu && st && cu.fell.every(f => f)) {
    S.ok = true;
    toast(`Медь: все 5 кнопок за ${fmt(S.ts, 0)} с. Сталь за это время: ${st.fell.filter(f => f).length} из 5.`);
  }
}

function stepRoom(dtm) {
  const Ls = L(), T = S.room, n = K3.n, d = Array(n).fill(0);
  S.w = 0;
  if (S.on && S.pos === 'low') {
    const Tp = T[0] + (Ls.tRad - T[0]) * P3.e;                                  // warm plume rises from the radiator
    S.w = P3.cw * Math.sqrt(Math.max(0, Ls.tRad - T[0]));
    d[n - 1] += S.w * (Tp - T[n - 1]);
    for (let i = 0; i < n - 1; i++) d[i] += S.w * (T[i + 1] - T[i]);            // cooler air sinks layer by layer
  } else if (S.on) d[n - 1] += P3.h * (Ls.tRad - T[n - 1]);
  for (let i = 0; i < n; i++) d[i] -= P3.kw * (T[i] - Ls.tOut);
  d[n - 1] -= P3.kc * (T[n - 1] - Ls.tOut);
  d[0] -= P3.kf * (T[0] - P3.tg);
  for (let i = 0; i < n - 1; i++) { const f = P3.kd * (T[i] - T[i + 1]); d[i] -= f; d[i + 1] += f; }
  for (let i = 0; i < n; i++) T[i] += d[i] * dtm;
  for (let k = 0; k < 3; k++) for (let i = 0; i < n - 1; i++) if (T[i] > T[i + 1]) { const a = (T[i] + T[i + 1]) / 2; T[i] = a; T[i + 1] = a; } // warm air below always rises
  S.tm += dtm;
  if (S.on && S.pos === 'high') S.highTime += dtm;
  if (!S.lowOk && S.on && S.pos === 'low' && T[0] >= Ls.tNeed) { S.lowOk = true; S.lowRec = { f: T[0], c: T[n - 1], tm: S.tm }; toast(`У пола ${deg(T[0])} за ${fmt(S.tm, 0)} мин. Теперь повесьте батарею под потолок.`); }
  if (!S.highOk && S.pos === 'high' && S.highTime >= Ls.highMin) { S.highOk = true; S.highRec = { f: T[0], c: T[n - 1] }; toast(`Под потолком ${deg(T[n - 1])}, а у пола всего ${deg(T[0])}. Конвекции нет!`); }
}
function stepRoomDt(dt) { const tot = dt * P3.speed, n = Math.ceil(tot / 0.05); for (let i = 0; i < n; i++) stepRoom(tot / n); }

const I4 = d => Math.pow(0.3 / d, 2);                                           // relative intensity, 1 at 30 cm
function stepRad(dtm) {
  const Ls = L(), I = I4(S.d);
  S.cans.forEach((c, i) => { S.T4[i] += ((S.lamp ? 6 * CAN[c].alpha * I : 0) - 0.12 * (S.T4[i] - 20)) * dtm; });
  S.t4 += S.lamp ? dtm : 0;
  const bi = S.cans.indexOf('black');
  if (!S.ok && S.lamp && S.cans.includes('black') && S.cans.includes('white') && S.T4[bi] >= Ls.tNeed) {
    S.ok = true; toast(`Чёрная банка: ${deg(S.T4[bi])}, белая: всего ${deg(S.T4[1 - bi])}.`);
  }
}

function model() {
  const id = LID();
  if (id === 'inner') return { kind: id, t: S.t, V: S.V, byA: S.byA, byQ: S.byQ };
  if (id === 'cond') return { kind: id, ok: S.ok };
  if (id === 'conv') return { kind: id, floor: S.room[0], ceil: S.room[K3.n - 1], lowOk: S.lowOk, highOk: S.highOk };
  return { kind: id, I: I4(S.d), ok: S.ok };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#2e3b57" stroke-width="3"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const ground = y => `<rect x="-2000" y="${y}" width="4520" height="1200" fill="#151e2e"/><rect x="-2000" y="${y}" width="4520" height="12" fill="url(#hatch)"/><path d="M-2000 ${y}H2520" stroke="#3a4762" stroke-width="2"/>`;
// temperature → colour: blue (cold) → cyan → amber → red (hot)
const STOPS = [[74, 143, 224], [114, 212, 232], [255, 181, 71], [255, 90, 60]];
function tcol(t, lo, hi) {
  const u = clamp((t - lo) / (hi - lo), 0, 1) * (STOPS.length - 1), i = Math.min(STOPS.length - 2, Math.floor(u)), f = u - i;
  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function flame(x, y, s, t) {
  const k = reduce ? 1 : 1 + 0.08 * Math.sin(t / 90) + 0.05 * Math.sin(t / 37);
  const hgt = 30 * s * k;
  return `<path d="M${x - 9 * s} ${y}C${x - 10 * s} ${y - hgt * .5} ${x - 3 * s} ${y - hgt * .7} ${x} ${y - hgt}C${x + 3 * s} ${y - hgt * .7} ${x + 10 * s} ${y - hgt * .5} ${x + 9 * s} ${y}Z" fill="#ff8a3c" opacity=".9"/>
    <path d="M${x - 4.5 * s} ${y}C${x - 5 * s} ${y - hgt * .35} ${x - 1 * s} ${y - hgt * .45} ${x} ${y - hgt * .62}C${x + 1 * s} ${y - hgt * .45} ${x + 5 * s} ${y - hgt * .35} ${x + 4.5 * s} ${y}Z" fill="#7fc4ff" opacity=".85"/>`;
}
function burnerSVG(x, gy, on, t) {
  return `<rect x="${x - 16}" y="${gy - 22}" width="32" height="22" rx="4" fill="#4a5876" stroke="${INK}" stroke-width="1.6"/><rect x="${x - 4}" y="${gy - 30}" width="8" height="9" fill="#8b96ad" stroke="${INK}"/>` + (on ? flame(x, gy - 30, 1, t) : '');
}
function thermo(x, ytop, ybot, t, lo, hi, col) {
  const yv = ybot - (ybot - ytop) * clamp((t - lo) / (hi - lo), 0, 1);
  return `<rect x="${x - 6}" y="${ytop - 6}" width="12" height="${ybot - ytop + 6}" rx="6" fill="#0e1520" stroke="#a9b4c9" stroke-width="1.4"/>
    <circle cx="${x}" cy="${ybot + 7}" r="9" fill="${col}" stroke="#a9b4c9" stroke-width="1.4"/><rect x="${x - 2.5}" y="${yv.toFixed(1)}" width="5" height="${(ybot + 2 - yv).toFixed(1)}" fill="${col}"/>`;
}

// ---------- lesson 1: cylinder with piston ----------
function innerScene(tm) {
  const Ls = L(), yp = yP(S.V), gy = C1.gy, cx = (C1.xl + C1.xr) / 2;
  let h = ground(gy);
  // stand and burner
  h += `<path d="M${C1.xl + 6} ${C1.yb + 6}L${C1.xl - 6} ${gy}M${C1.xr - 6} ${C1.yb + 6}L${C1.xr + 6} ${gy}" stroke="#4a5876" stroke-width="4" stroke-linecap="round"/>`;
  h += burnerSVG(cx, gy, S.burner, tm);
  // gas
  h += `<rect x="${C1.xl}" y="${yp.toFixed(1)}" width="${C1.xr - C1.xl}" height="${(C1.yb - yp).toFixed(1)}" fill="${tcol(S.t, 0, 450)}" opacity=".16"/>`;
  const sp = Math.sqrt(TK(S.t) / 293);
  for (const p of S.dots) {
    const y = yp + 4 + p.y * (C1.yb - yp - 8);
    h += `<circle cx="${p.x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="${tcol(S.t, 0, 450)}" stroke="${INK}" stroke-width=".8"/>`;
    if (!reduce) h += `<path d="M${p.x.toFixed(1)} ${y.toFixed(1)}l${(-p.dx * 7 * sp).toFixed(1)} ${(-p.dy * 7 * sp).toFixed(1)}" stroke="${tcol(S.t, 0, 450)}" stroke-width="1.2" opacity=".45"/>`;
  }
  // cotton at the bottom
  h += `<path d="M${cx - 14} ${C1.yb}c2-9 9-10 14-6c5-6 13-2 13 6z" fill="#f2efe6" stroke="${INK}" stroke-width="1"/>`;
  if (S.fire && S.t > 120) h += flame(cx, C1.yb, 0.9, tm);
  // cylinder walls (glass)
  h += `<rect x="${C1.xl - 6}" y="${C1.yb - C1.hMax - 30}" width="6" height="${C1.hMax + 36}" fill="#3a4762" stroke="#a9d6e4" stroke-width="1" opacity=".9"/><rect x="${C1.xr}" y="${C1.yb - C1.hMax - 30}" width="6" height="${C1.hMax + 36}" fill="#3a4762" stroke="#a9d6e4" stroke-width="1" opacity=".9"/><rect x="${C1.xl - 6}" y="${C1.yb}" width="${C1.xr - C1.xl + 12}" height="7" fill="#4a5876" stroke="${INK}"/>`;
  // piston + rod + handle
  h += `<g data-drag="piston"><rect x="${C1.xl - 30}" y="${(yp - 120).toFixed(1)}" width="${C1.xr - C1.xl + 60}" height="132" fill="transparent"/>
    <rect x="${C1.xl}" y="${(yp - 14).toFixed(1)}" width="${C1.xr - C1.xl}" height="14" fill="#8b96ad" stroke="${INK}" stroke-width="1.8"/>
    <rect x="${cx - 4}" y="${(yp - 86).toFixed(1)}" width="8" height="72" fill="#a9b4c9" stroke="${INK}" stroke-width="1.2"/>
    <rect x="${cx - 34}" y="${(yp - 100).toFixed(1)}" width="68" height="16" rx="8" fill="#ffb547" stroke="${INK}" stroke-width="1.8"/>
    ${T(cx, yp - 88.5, 9, INK, 'тянуть ↓', 'middle', 'font-weight="500"')}</g>`;
  // volume scale
  for (let k = 0; k <= 10; k++) { const yy = C1.yb - C1.hMax * k / 10; h += `<path d="M${C1.xl - 6} ${yy}h${k % 5 ? -5 : -9}" stroke="#8b96ad" stroke-width="1.2"/>` + (k % 5 ? '' : T(C1.xl - 18, yy + 3, 9, '#8b96ad', k / 10 === 1 ? 'V₀' : k ? 'V₀/2' : '0', 'end')); }
  // thermometer
  const tx = C1.xr + 54;
  h += thermo(tx, 150, 320, S.t, 0, 500, tcol(S.t, 0, 450));
  for (let k = 0; k <= 500; k += 100) { const yy = 320 - 170 * k / 500; h += `<path d="M${tx + 7} ${yy}h6" stroke="#8b96ad"/>` + T(tx + 16, yy + 3, 8.5, '#8b96ad', k, 'start'); }
  h += T(tx, 132, 13, S.t >= Ls.tNeed ? '#86e0a8' : '#e8ecf4', deg(S.t), 'middle', 'font-weight="500" ' + halo);
  h += `<path d="M${tx - 9} ${320 - 170 * Ls.tNeed / 500}h18" stroke="#86e0a8" stroke-width="1.6" stroke-dasharray="3 2"/>`;
  // method labels

function setD(d) {

}
function setBurner(on) { if (S.burner === on) return; S.burner = on; if (on) S.usedQ = true; renderTools(); update(); }
function resetInner() { S.t = L().t0; S.V = 1; S.burner = false; S.usedA = false; S.usedQ = false; S.fire = false; renderTools(); update(); }
function resetCond(keepMats) { S.rods.forEach(r => { r.T.fill(20); r.fell = R2.pins.map(() => null); }); S.ts = 0; S.heat = false; renderTools(); update(); }
function setMat(ri, k) { if (S.rods[ri].mat === k) return; S.rods[ri].mat = k; resetCond(); }

let last = performance.now(), acc = 0;

  const id = LID();

    if (S.burner || Math.abs(S.t - 20) > 0.05) { stepInner(dt); acc += dt; if (acc > 0.2) { acc = 0; update(); } }
    if (!reduce) {
      const sp = 0.55 * Math.sqrt(TK(S.t) / 293) * dt;
      for (const p of S.dots) {
        p.x += p.dx * sp * 110; p.y += p.dy * sp * 190 / Math.max(30, C1.yb - yP(S.V)) ;
        if (p.x < C1.xl + 5) { p.x = C1.xl + 5; p.dx = Math.abs(p.dx); } if (p.x > C1.xr - 5) { p.x = C1.xr - 5; p.dx = -Math.abs(p.dx); }
        if (p.y < 0) { p.y = 0; p.dy = Math.abs(p.dy); } if (p.y > 1) { p.y = 1; p.dy = -Math.abs(p.dy); }
      }
    }

  }

  if (id === 'conv') {
    const cool = S.room.some(v => Math.abs(v - L().t0) > 0.01);
    if (S.on || (cool && S.tm > 0)) { stepRoomDt(dt); acc += dt; if (acc > 0.25) { acc = 0; update(); } }
    const v = S.pos === 'low' ? S.w : 0;

    dirty = true;
  }

}

  if (/^mat\d-/.test(a)) { setMat(+a[3], a.slice(5)); buildScheme(); return; }
  if (a === 'heat') { S.heat = !S.heat; renderTools(); update(); return; }
  if (a === 'pos-low' || a === 'pos-high') { setPos(a.slice(4)); buildScheme(); return; }
  if (a === 'on') { if (id !== 'conv') return; S.on = !S.on; renderTools(); update(); return; }
  if (a === 'c0' || a === 'c1') { const i = +a[1]; setCan(i, CKEYS[(CKEYS.indexOf(S.cans[i]) + 1) % CKEYS.length]); buildScheme(); return; }
  if (/^can\d-/.test(a)) { setCan(+a[3], a.slice(5)); buildScheme(); return; }
  if (a === 'lamp') { if (id !== 'rad') return; S.lamp = !S.lamp; renderTools(); update(); return; }
}

      step('у пола', deg(m.floor)) + step('под потолком', deg(m.ceil)) + step('разница', `${fmt(m.ceil - m.floor, 0)} °C`, 'sum') + `</div>
      <h3>Опыты</h3><div class="steps">` + step('батарея внизу', lr ? `пол ${deg(lr.f)}, потолок ${deg(lr.c)} за ${fmt(lr.tm, 0)} мин` : 'ещё не было') +
      step('батарея вверху', hr ? `пол ${deg(hr.f)}, потолок ${deg(hr.c)}` : `${fmt(S.highTime, 0)} из 30 мин`) + `</div>
      <p class="note" style="margin-top:10px">Когда батарея внизу, точки ходят по кругу: вверх у батареи, вниз у дальней стены. Это и есть перенос тепла самим воздухом.</p>`;
  }
  const Ivar = m.I;
  return `<h2>Излучение и расстояние</h2><div class="formula">в 2 раза дальше → в 4 раза слабее</div><p class="note">Мощность излучения на банке считаем относительно расстояния 30 см: (30 / d)².</p>
    <h3>Сейчас</h3><div class="steps">` + step('расстояние d', `${fmt(S.d * 100, 0)} см`) + step('излучение', `(30 / ${fmt(S.d * 100, 0)})² = ${fmt(Ivar, 2)}`, 'sum') + `</div>
    <h3>Поглощают</h3><div class="steps">` + S.cans.map((c, i) => step(`${i ? 'справа' : 'слева'}: ${CAN[c].name}`, `${fmt(CAN[c].alpha * 100, 0)} % лучей · ${deg(S.T4[i])}`)).join('') + `</div>
    <p class="note" style="margin-top:10px">Остальные лучи банка отражает. Пока банка холоднее предела, она нагревается; чем горячее она становится, тем больше тепла отдаёт воздуху, и рост замедляется.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'inner') el.innerHTML = `<div class="k">Газ</div><div class="v ${S.t >= L().tNeed ? 'ok' : ''}">t = ${deg(S.t)}</div><div class="lr"><span>T</span><span>${fmt(TK(S.t), 0)} К</span></div><div class="lr"><span>v частиц</span><span>${fmt(vMol(S.t), 0)} м/с</span></div>`;
  else if (id === 'cond') el.innerHTML = `<div class="k">Время ×${L().speed}</div><div class="v ${S.ok ? 'ok' : ''}">${fmt(S.ts, 0)} с</div>` + S.rods.map(r => `<div class="lr"><span>${MAT[r.mat].name}</span><span>${r.fell.filter(f => f).length}/5</span></div>`).join('');
  else if (id === 'conv') el.innerHTML = `<div class="k">Комната</div><div class="v ${S.room[0] >= L().tNeed ? 'ok' : ''}">пол ${deg(m.floor)}</div><div class="lr"><span>потолок</span><span>${deg(m.ceil)}</span></div><div class="lr"><span>время</span><span>${fmt(S.tm, 0)} мин</span></div>`;
  else el.innerHTML = `<div class="k">Банки · ${fmt(S.d * 100, 0)} см</div>` + S.cans.map((c, i) => `<div class="lr"><span>${CAN[c].name}</span><span class="${c === 'black' && S.T4[i] >= L().tNeed ? 'ok' : ''}">${deg(S.T4[i])}</span></div>`).join('') + `<div class="lr"><span>лампа</span><span>${S.lamp ? 'вкл' : 'выкл'}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете все три вида теплопередачи!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  inner: '<path d="M22 6v22M44 6v22M22 28h22" stroke="#5d6a86" stroke-width="2"/><rect x="23" y="12" width="20" height="4" fill="#8b96ad"/><path d="M33 12V3" stroke="#a9b4c9" stroke-width="2"/><circle cx="28" cy="21" r="2" fill="#ffb547"/><circle cx="37" cy="24" r="2" fill="#ffb547"/><circle cx="34" cy="19" r="2" fill="#ffb547"/>',
  cond: '<rect x="4" y="6" width="8" height="20" fill="#ffb547"/><rect x="12" y="12" width="50" height="5" rx="2" fill="#d98a4e"/><path d="M24 17v6M36 17v6M48 17v6" stroke="#c8d0dd" stroke-width="1.6"/><circle cx="24" cy="24" r="2" fill="#ff8a73"/><circle cx="36" cy="24" r="2" fill="#ff8a73"/><circle cx="48" cy="24" r="2" fill="#ff8a73"/>',
  conv: '<path d="M6 28V3h54v25" fill="none" stroke="#5d6a86" stroke-width="2"/><rect x="9" y="19" width="10" height="8" fill="#ff8a73"/><path d="M14 17V8h38v18H22" fill="none" stroke="#ffb547" stroke-width="1.4" stroke-dasharray="3 2"/>',
  rad: '<circle cx="33" cy="12" r="6" fill="#ffe2a0"/><rect x="6" y="14" width="11" height="14" fill="#1c2029" stroke="#8b96ad"/><rect x="49" y="14" width="11" height="14" fill="#e8ecf4"/><path d="M26 14q-2 3-4 2t-4 2M40 14q2 3 4 2t4 2" fill="none" stroke="#ff8a3c" stroke-width="1.4"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'inner') now = `Цилиндр с воздухом под поршнем, внизу кусочек ваты и горелка. Объём газа ${fmt(S.V, 2)} от начального (сжат в ${fmt(1 / S.V, 1)} раза), температура ${deg(S.t)} (${fmt(TK(S.t), 0)} К), средняя скорость частиц ≈ ${fmt(vMol(S.t), 0)} м/с. Горелка ${S.burner ? 'включена' : 'выключена'}. С последнего сброса поршень ${S.usedA ? 'двигали' : 'не двигали'}, горелку ${S.usedQ ? 'включали' : 'не включали'}. ${S.fire ? 'Вата вспыхнула от сжатия.' : ''} Нагрев до 70 °C работой ${S.byA ? 'получен' : 'ещё не получен'}, теплопередачей ${S.byQ ? 'получен' : 'ещё не получен'}. Модель: быстрое сжатие без теплообмена, потом цилиндр медленно остывает.`;
  if (id === 'cond') now = `Два стержня по 25 см, левые концы касаются бруска ${Ls.hot} °C. Верхний: ${MAT[S.rods[0].mat].name}, нижний: ${MAT[S.rods[1].mat].name}. Кнопки на воске через 5 см, воск плавится при ${Ls.melt} °C. Нагрев ${S.heat ? 'идёт' : 'выключен'}, прошло ${fmt(S.ts, 0)} с (время ускорено в 10 раз). Упало кнопок: ${S.rods.map(r => `${MAT[r.mat].name} ${r.fell.filter(f => f).length}/5`).join(', ')}. Задание (медь против стали, все 5 кнопок на меди) ${S.ok ? 'выполнено' : 'не выполнено'}.`;
  if (id === 'conv') now = `Комната зимой, на улице ${Ls.tOut} °C, воздух разбит на 8 слоёв. Батарея ${S.pos === 'low' ? 'внизу под окном' : 'под потолком'}, ${S.on ? 'включена' : 'выключена'}. Время ${fmt(S.tm, 0)} мин. У пола ${deg(m.floor)}, под потолком ${deg(m.ceil)}. ${S.pos === 'low' && S.on ? 'Видна циркуляция воздуха по кругу.' : 'Циркуляции нет.'} Пол 20 °C с батареей внизу: ${S.lowOk ? 'получено' : 'нет'}; батарея под потолком проработала ${fmt(S.highTime, 0)} из 30 мин.`;
  if (id === 'rad') now = `Лампа накаливания ${S.lamp ? 'включена' : 'выключена'}, по бокам две одинаковые банки с водой на расстоянии ${fmt(S.d * 100, 0)} см: слева ${CAN[S.cans[0]].name} (${deg(S.T4[0])}), справа ${CAN[S.cans[1]].name} (${deg(S.T4[1])}). Прошло ${fmt(S.t4, 1)} мин. Излучение относительно 30 см: ${fmt(m.I, 2)}. Чёрная поглощает около 95 % лучей, белая около 30 %, блестящая около 10 %. Цель: чёрная и белая банки, чёрная нагрета до 40 °C; ${S.ok ? 'выполнено' : 'не выполнено'}. Нужное расстояние не называй — наводи на мысль, что ближе к лампе излучение сильнее.`;
  return [
    `Раздел: физика, 8 класс, тема «Температура и теплопередача». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { inner: 'Почему газ нагревается, если его быстро сжать?', cond: 'Почему металлическая скамейка зимой кажется холоднее деревянной?', conv: 'Почему батареи ставят под окнами?', rad: 'Почему летом лучше носить светлую одежду?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
