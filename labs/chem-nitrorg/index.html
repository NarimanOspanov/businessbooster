<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 10–11 класс: амины как органические основания, анилин и красители, амидная связь в белках, лекарствах, нейлоне и кевларе, конструктор молекул.">
<title>Азотсодержащие органические вещества</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene.rot{cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.goals{display:grid;gap:6px;margin-top:10px}
.goals div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 11px;font-size:13.5px}
.goals span{font:500 13px var(--font-mono);color:var(--muted)}
.goals .on span{color:var(--ok)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1500px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const fmt = (x, n = 1) => {

const C_COL = '#4f586d', H_COL = '#eef2f8', O_COL = '#e5604f', N_COL = '#3d6fe0', BR_COL = '#a8432f';

];

const UI = [[4, '#e8553a'], [5, '#f08a3a'], [6, '#f2c94c'], [7, '#7cc35a'], [8, '#36a88a'], [9, '#2f86c8'], [10, '#3d5fc4'], [11, '#5b45b0'], [12, '#7a3aa0'], [13, '#6a2a80']];

function chainInfo(ch) {
  const n = ch.length, conn = i => (i > 0) + (i < n - 1);
  let free = 0; const at = { C: 0, H: 0, N: 0, O: 0 };
  ch.forEach((k, i) => { const F = FR[k]; free += Math.max(0, F.t - conn(i)); for (const e in F.at) at[e] += F.at[e]; });
  const M = at.C * 12 + at.H + at.N * 14 + at.O * 16;
  const f = n ? low(['C', 'H', 'N', 'O'].filter(e => at[e]).map(e => e + (at[e] > 1 ? at[e] : '')).join('')) : '—';
  let amide = 0; for (let i = 0; i + 1 < n; i++) { const a = ch[i], b = ch[i + 1]; if ((a === 'co' && (b === 'nh' || b === 'nh2')) || (b === 'co' && (a === 'nh' || a === 'nh2'))) amide++; }
  const ends = n >= 2 && FR[ch[0]].t === 1 && FR[ch[n - 1]].t === 1;
  const open = n >= 2 && FR[ch[0]].t === 2 && FR[ch[n - 1]].t === 2;
  let known = null, poly = null;
  if (ends) known = MOLS[canon(ch)] || null;
  if (open) for (const P of POLY) if (P.seq.length === n) {
    for (let r = 0; r < n && !poly; r++) { const rot = P.seq.slice(r).concat(P.seq.slice(0, r)); if (rot.join('.') === ch.join('.') || rot.slice().reverse().join('.') === ch.join('.')) poly = P; }
  }
  // in a polymer unit the bond to the next unit (last fragment → first fragment of the next unit) is one more amide bond
  if (poly && ((ch[0] === 'co' && ch[n - 1] === 'nh') || (ch[0] === 'nh' && ch[n - 1] === 'co'))) amide++;
  return { n, free, at, M, f, amide, complete: ends, open, known, poly };
}

}

// ---------- actions: lesson 1 ----------
function setBase(i) { S.base = (i + BASES.length) % BASES.length; S.prot = false; S.pr = null; S.ind = false; S.acid = null; renderTools(); buildScheme(); update(); }

}

}

function addAcid(k) {

    else if (!S.got.salt) { S.got.salt = true; toast(`Есть: ${B.f} + HCl → ${B.salt}, ${B.saltName}.${S.ind ? ' Малиновый цвет исчез.' : ''}`); }

function resetTube() { S.ind = false; S.acid = null; S.prot = false; S.pr = null; renderTools(); update(); }

// ---------- actions: lesson 2 ----------

function rankTube(i) {

  S.mph[i] = true;
  if (S.got.rank) { toast(`${cap(PHB[i].name)}: pH ${fmt(phOf(PHB[i].Kb), 1)}.`); update(); return; }
  if (S.rank.includes(i)) { toast(`${cap(PHB[i].name)} уже в ряду. «Заново» — начать ряд сначала.`); return; }

function pickBr(i) { S.brSel = i; renderTools(); buildScheme(); update(); }

// ---------- actions: lesson 3 ----------
function addFrag(k) {
  const ch = S.chain, n = ch.length;
  if (n >= MAXF) { toast(`Не больше ${MAXF} фрагментов в цепи.`); return; }
  if (n >= 2 && FR[ch[n - 1]].t === 1) {
    const F = FR[ch[n - 1]];
    toast(`Цепь закончена: у атома ${F.el} в группе ${F.lab} заняты все связи (${F.val} из ${F.val}). Уберите её, чтобы продолжить.`);

function cutAt(i) { S.chain = S.chain.slice(0, i); afterChain(true); }
function afterChain(quiet) {

function tap(p) {
  const id = LID();
  if (id === 'amines') {
    if (Math.abs(p.x - NX) < 26 && p.y > NY - 74 && p.y < NY - 22 && !S.prot) return protonate();
    if (p.x > 50 && p.x < 260 && p.y > 160 && p.y < 345) return setBase(S.base + 1);
    if (p.y > 228 && p.y < 330) { if (p.x > 398 && p.x < 436) return addInd(); if (p.x > 436 && p.x < 471) return addAcid('hcl'); if (p.x > 471 && p.x < 512) return addAcid('lemon'); }
    return;
  }
  if (id === 'aniline') {
    if (S.mode2 === 'ph') { PH_X.forEach((x, i) => { if (p.x > x - 12 && p.x < x + 56 && p.y > 160 && p.y < 380) rankTube(i); }); return; }
    if (S.mode2 === 'br') { BR_X.forEach((x, i) => { if (p.x > x - 12 && p.x < x + 58 && p.y > 160 && p.y < 370) pickBr(i); }); return; }
    if (p.y > 186 && p.y < 360) { if (p.x > 26 && p.x < 108) cycle2('raw'); else if (p.x > 128 && p.x < 210) cycle2('rg'); else if (p.x > 250 && p.x < 350) synth(); }
    return;
  }
  if (p.y > CY - 90 && p.y < CY + 90) { const i = L3HIT.findIndex(([a, b]) => p.x >= a && p.x <= b); if (i >= 0) cutAt(i); }

let drag = null, dirty = true, liveT = 0;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => { e.preventDefault(); drag = { x: e.clientX, y: e.clientY, moved: false }; });
scene.addEventListener('pointermove', e => { if (drag && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true; });
scene.addEventListener('pointerup', e => { if (!drag) return; const d = drag; drag = null; if (!d.moved) tap(toSvg(e)); });
scene.addEventListener('pointercancel', () => { drag = null; });

function live() { const t = performance.now(); if (t - liveT < 90) return; liveT = t; renderMeter(model()); }

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (id === 'amines') {
    if (S.pr !== null && !S.prot) { S.pr = Math.min(1, S.pr + dt / 1.1); anim = true; if (S.pr >= 1) protDone(); }
    if (!S.acid && !reduce) anim = true;
  }
  if (id === 'aniline') {
    if (S.mode2 === 'br') [0, 1].forEach(i => { const q = S.brw[i]; if (q !== null && q < 1) { S.brw[i] = Math.min(1, q + dt / 1.8); anim = true; live(); if (S.brw[i] >= 1) brDone(i); } });
    if (S.mode2 === 'syn' && S.syn !== null && S.syn < 1) { S.syn = Math.min(1, S.syn + dt / 1.8); anim = true; if (S.syn >= 1) synDone(); }
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

  if (id === 'amines') h = B('prev', '‹') + `<button disabled>${BASES[S.base].name}</button>` + B('next', '›') + sep + B('proton', '+ H⁺', S.prot) + B('ind', 'Фенолфталеин', S.ind) + B('hcl', '+ HCl', S.acid === 'hcl') + B('lemon', '+ лимон', S.acid === 'lemon') + B('reset', 'Заново');

    h = B('m-ph', 'pH', S.mode2 === 'ph') + B('m-br', 'Br₂', S.mode2 === 'br') + B('m-syn', 'Синтез', S.mode2 === 'syn') + sep;
    if (S.mode2 === 'ph') h += B('ui', '+ индикатор', S.ui) + PHB.map((x, i) => B('p' + i, cap(x.name), S.rank.includes(i))).join('') + B('rank0', 'Заново');
    if (S.mode2 === 'br') h += BRS.map((x, i) => B('b' + i, cap(x.name), S.brSel === i)).join('') + B('brw', '+ бромная вода') + B('br0', 'Заново');
    if (S.mode2 === 'syn') h += B('raw', 'Сырьё ›') + B('rg', 'Реагент ›') + B('syn', 'Провести реакцию');
  }
  if (id === 'amides') h = B('tgt', 'Цель ›') + sep + PAL.map(k => B('f-' + k, FR[k].lab)).join('') + sep + B('back', '⌫') + B('clear', 'Очистить');
  tb.innerHTML = h;
}
function act(a) {
  if (a === 'prev' || a === 'next') return setBase(S.base + (a === 'next' ? 1 : -1));
  if (a === 'proton') return protonate();
  if (a === 'ind') return addInd();
  if (a === 'hcl' || a === 'lemon') return addAcid(a);
  if (a === 'reset') return resetTube();
  if (a === 'm-ph') return setMode2('ph');
  if (a === 'm-br') return setMode2('br');
  if (a === 'm-syn') return setMode2('syn');
  if (a === 'ui') return addUI();
  if (/^p\d$/.test(a)) return rankTube(+a[1]);
  if (a === 'rank0') { S.rank = []; renderTools(); update(); return; }
  if (/^b\d$/.test(a)) return pickBr(+a[1]);
  if (a === 'brw') return addBr();
  if (a === 'br0') { S.brw = [null, null]; renderTools(); update(); return; }
  if (a === 'raw' || a === 'rg') return cycle2(a);
  if (a === 'syn') return synth();
  if (a === 'tgt') { S.tgt = (S.tgt + 1) % TG.length; toast(`Цель: ${TG[S.tgt].name} — ${TG[S.tgt].what}.`); buildScheme(); update(); return; }
  if (a.startsWith('f-')) return addFrag(a.slice(2));
  if (a === 'back') { if (S.chain.length) cutAt(S.chain.length - 1); return; }
  if (a === 'clear') return cutAt(0);
}

    { id: 'badge', icon: ICON.badge, name: 'Счётчик связей', spec: 'Сколько связей занято у главного атома фрагмента: у C — 4, у N — 3, у O — 2. Зелёный — все заняты.' },
    { id: 'target', icon: ICON.target, name: 'Цель', spec: 'Какое вещество собрать и его брутто-формула. Кнопка «Цель ›» меняет цель и даёт подсказку.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали опыта</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'amines') {
    const B = m.B, n = 10 / B.M;
    let h = `<h2>${B.name} ${B.f}</h2><div class="formula">R–NH₂ + H₂O ⇄ R–NH₃⁺ + OH⁻</div><h3>Сила оснований в воде</h3><div class="steps">` +
      BASES.map(x => step(`${x.name} ${x.f}`, `pKb ${fmt(x.pKb, 2)}`, x === B ? 'sum' : '')).join('') + `</div>` +
      `<p class="note" style="margin-top:10px">Чем меньше pKb, тем сильнее основание. Группы CH₃ подают электроны на азот, и амины сильнее аммиака. Триметиламин в воде немного слабее метиламина: его ион хуже «окружают» молекулы воды.</p>` +
      `<h3>Сколько HCl свяжет 10 г ${B.name.toLowerCase()}а</h3><div class="steps">` +
      step('n(основания) = m / M', `10 / ${B.M} = ${fmt(n, 3)} моль`) +
      step('по уравнению 1 : 1, n(HCl)', `${fmt(n, 3)} моль`) +
      step('m(HCl) = n · 36,5', `${fmt(n * 36.5, 2)} г`, 'sum') +
      step('m(соли) = m(основания) + m(HCl)', `10 + ${fmt(n * 36.5, 2)} = ${fmt(10 + n * 36.5, 2)} г`) + `</div>` +
      `<p class="note" style="margin-top:10px">Соль ${B.saltName} — ионное вещество: она не летучая, поэтому и не пахнет. Те же расчёты делают фармацевты, когда переводят лекарство-амин в гидрохлорид.</p>`;
    return h;
  }
  if (id === 'aniline') {
    if (S.mode2 === 'ph') {
      return `<h2>pH растворов 0,1 моль/л</h2><div class="formula">[OH⁻] ≈ √(Kb · c), pH = 14 − pOH</div>` +
        PHB.map(B => { const oh = ohOf(B.Kb), ph = phOf(B.Kb); return `<h3>${cap(B.name)} ${B.f}</h3><div class="steps">` + step('Kb', B.Kb.toExponential(1).replace('.', ',').replace('e-', '·10^−')) + step('[OH⁻], моль/л', oh.toExponential(1).replace('.', ',').replace('e-', '·10^−')) + step('pOH = −lg[OH⁻]', fmt(14 - ph, 2)) + step('pH', fmt(ph, 1), 'sum') + `</div>`; }).join('') +
        `<p class="note" style="margin-top:10px">Kb анилина в миллион раз меньше, чем у метиламина: пара азота «занята» кольцом. Поэтому анилин не окрашивает фенолфталеин (он меняет цвет только при pH выше 8,2), а с сильными кислотами всё же даёт соли — например, хлорид фениламмония.</p>`;
    }
    if (S.mode2 === 'br') {
      return `<h2>Бромирование анилина</h2><div class="formula" style="font-size:15px">C₆H₅NH₂ + 3Br₂ → C₆H₂Br₃NH₂↓ + 3HBr</div><div class="steps">` +
        step('M(C₆H₅NH₂)', '6·12 + 7 + 14 = 93 г/моль') + step('M(C₆H₂Br₃NH₂)', '72 + 4 + 3·80 + 14 = 330 г/моль') +
        step('из 9,3 г анилина: n', '9,3 / 93 = 0,1 моль') + step('нужно брома: 3 · 0,1 · 160', '48 г Br₂') + step('масса осадка: 0,1 · 330', '33 г', 'sum') + `</div>` +
        `<p class="note" style="margin-top:10px">Бром встаёт в положения 2, 4 и 6 — рядом с NH₂ и напротив неё. Именно туда аминогруппа «подаёт» электроны. Бензол без катализатора с бромной водой не реагирует.</p>`;
    }
    const P = m.P;
    return `<h2>${cap(P.name)}</h2><div class="steps">` + step('сырьё', `${RAW[S.raw].f}, M = ${RAW[S.raw].M} г/моль`) + step('реагент', RGT[S.rg].f) + step('продукт', P.f, 'sum') + `</div>` +
      `<h3>Парацетамол на таблетку 500 мг</h3><div class="formula" style="font-size:14px">HOC₆H₄NH₂ + (CH₃CO)₂O → HOC₆H₄NHCOCH₃ + CH₃COOH</div><div class="steps">` +
      step('проверка масс: 109 + 102', '= 151 + 60 = 211') + step('n(парацетамола) = 0,5 / 151', `${fmt(0.5 / 151 * 1000, 2)} ммоль`) +
      step('нужно 4-аминофенола: n · 109', `${fmt(0.5 / 151 * 109 * 1000, 0)} мг`, 'sum') + step('нужно ангидрида: n · 102', `${fmt(0.5 / 151 * 102 * 1000, 0)} мг`) + `</div>` +
      `<p class="note" style="margin-top:10px">Ацетанилид из анилина (M = 135) тоже снимает жар, но в организме частично снова даёт анилин — отсюда вред для крови. Группа –OH в парацетамоле меняет путь его превращений. На заводе выход меньше 100 %, и химик-технолог рассчитывает сырьё с запасом.</p>`;
  }
  const I = m.I, ch = S.chain;
  if (!ch.length) return `<h2>Цепь пуста</h2><p class="note">Добавьте фрагменты кнопками внизу стола.</p>`;
  let h = `<h2>${I.f}${I.complete && I.known ? ' · ' + I.known.name : I.poly ? ' · ' + I.poly.name : ''}</h2><div class="steps">` +
    ch.map((k, i) => step(`${i + 1}. ${FR[k].lab}`, low(['C', 'H', 'N', 'O'].filter(e => FR[k].at[e]).map(e => e + (FR[k].at[e] > 1 ? FR[k].at[e] : '')).join('')))).join('') +
    step('сумма', I.f, 'sum') + step('M = 12·C + 1·H + 14·N + 16·O', `12·${I.at.C} + ${I.at.H} + 14·${I.at.N} + 16·${I.at.O} = ${I.M} г/моль`) + step('свободных валентностей', I.free) + step('амидных связей', I.amide) + `</div>`;
  h += `<h3>Конденсация: где вода?</h3><div class="steps">` + step('2 глицина: 2 · 75', '150 г/моль') + step('минус H₂O при пептидной связи', '150 − 18 = 132 г/моль', 'sum') +
    step('кевлар: C₆H₄(NH₂)₂ + C₆H₄(COOH)₂', '108 + 166 − 2·18 = 238 г/моль на звено') + `</div>` +
    `<p class="note" style="margin-top:10px">Каждая амидная связь из –COOH и H₂N– отщепляет одну молекулу воды. В промышленности для кевлара вместо кислоты берут её хлорангидрид — тогда отщепляется HCl, и реакция идёт быстрее.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID();
  if (id === 'amines') {
    el.innerHTML = `<div class="k">${m.B.name}</div><div class="v ${S.ind && !S.acid ? 'ok' : ''}">${S.ind ? (S.acid ? 'нейтральная' : 'щелочная') : S.acid ? 'соль' : 'среда ?'}</div><div class="lr"><span>pKb</span><span>${fmt(m.B.pKb, 2)}</span></div><div class="lr"><span>целей</span><span>${m.got}/4</span></div><div class="gauge"><b style="width:${(m.got / 4 * 100).toFixed(1)}%"></b></div>`;
  } else if (id === 'aniline') {
    const v = S.mode2 === 'ph' ? `ряд ${S.rank.length}/3` : S.mode2 === 'br' ? BRS[S.brSel].name : m.synDone ? m.P.name : RAW[S.raw].name;
    el.innerHTML = `<div class="k">${{ ph: 'Сила оснований', br: 'Бромная вода', syn: 'Синтез' }[S.mode2]}</div><div class="v">${v}</div><div class="lr"><span>целей</span><span>${m.got}/4</span></div><div class="gauge"><b style="width:${(m.got / 4 * 100).toFixed(1)}%"></b></div>`;
  } else {
    const ok = (m.I.complete && m.I.known) || m.I.poly;
    el.innerHTML = `<div class="k">Молекула</div><div class="v ${ok ? 'ok' : ''}">${m.I.f}</div><div class="lr"><span>M</span><span>${m.I.n ? m.I.M : '—'}</span></div><div class="lr"><span>свободно</span><span>${m.I.free}</span></div><div class="lr"><span>собрано</span><span>${m.got}/3</span></div>`;
  }
}

function update() {
  const L = LESSONS[S.lesson], m = model();
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Азотсодержащие вещества освоены!'), 1600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null; S.got = {};
  S.base = 1; S.prot = false; S.pr = null; S.ind = false; S.acid = null;
  S.mode2 = 'ph'; S.ui = false; S.rank = []; S.mph = {}; S.brSel = 1; S.brw = [null, null]; S.raw = 0; S.rg = 0; S.syn = null; S.made = {};
  S.chain = []; S.tgt = 0; S.built = {};
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

window.LUCH_REAL = () => {
  const id = LID(), m = model(), base = { module: 'chem-nitrorg' };

    return { ...base, scene: 'nitro-amine', help: 'Модель — следующее вещество, кнопка H⁺ — протонировать, склянки и лимон — в пробирку',
      i: S.base, name: B.name, f: B.f, sub: B.sub, ion: B.ion, prot: S.prot || (S.pr !== null), ind: S.ind, acid: S.acid, smell: m.smelly ? B.smell : null, fish: B.fish || S.base === 2,
      got: G1.map(([k]) => !!S.got[k]) }; }
  if (id === 'aniline') {
    const d = { ...base, scene: 'nitro-anil', mode: S.mode2, got: G2.map(([k]) => !!S.got[k]),
      help: { ph: 'Склянка — индикатор, пробирки — в ряд от слабого к сильному, таблички спереди — режим', br: 'Пробирка — выбрать, склянка с бромной водой — добавить, таблички спереди — режим', syn: 'Склянки — сменить сырьё и реагент, колба — провести реакцию, таблички спереди — режим' }[S.mode2] };
    if (S.mode2 === 'ph') Object.assign(d, { ui: S.ui, rank: S.rank.slice(), tubes: PHB.map((B, i) => ({ name: B.name, f: B.f, col: S.ui ? uiCol(phOf(B.Kb)) : null, ph: S.mph[i] ? fmt(phOf(B.Kb), 1) : null })) });
    if (S.mode2 === 'br') Object.assign(d, { sel: S.brSel, st: S.brw.map(q => q === null ? 'none' : q < 1 ? 'run' : 'done') });
    if (S.mode2 === 'syn') { const P = m.P; Object.assign(d, { raw: RAW[S.raw].name, rawF: RAW[S.raw].f, rg: RGT[S.rg].f, rgN: RGT[S.rg].name, ox: S.rg === 0, st: S.syn === null ? 'none' : S.syn < 1 ? 'run' : 'done', prod: P.name, pk: P.k, pcol: P.col, dyed: !!S.made.dye }); }

};

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'amines') {
    const B = m.B;
    now = `Выбрано вещество: ${B.name} ${B.f} (${B.kind}), pKb ${fmt(B.pKb, 2)}. Азот ${S.prot ? `присоединил H⁺ — ${B.ion}` : 'с неподелённой парой'}. Пробирка: ${S.ind ? 'добавлен фенолфталеин, ' : ''}${S.acid === 'hcl' ? 'добавлена HCl — соль ' + B.salt : S.acid === 'lemon' ? 'добавлен лимонный сок — соль, запаха нет' : 'кислоты нет'}${S.ind ? (S.acid ? ', индикатор бесцветный' : ', индикатор малиновый') : ''}. ` +
      `Достигнутые цели: ${G1.filter(([k]) => S.got[k]).map(([, n]) => n).join('; ') || 'пока ни одной'}. Не выполняй цели за ученика — спрашивай, что делает неподелённая пара азота и почему кислота убирает запах.`;
  }
  if (id === 'aniline') {
    if (S.mode2 === 'ph') now = `Режим «pH»: растворы аммиака, анилина и метиламина 0,1 моль/л${S.ui ? ' с универсальным индикатором' : ', индикатор ещё не добавлен'}. Ученик поставил в ряд: ${S.rank.map(i => PHB[i].name).join(' < ') || 'пока ничего'}. Измерены pH: ${Object.keys(S.mph).map(i => `${PHB[i].name} ${fmt(phOf(PHB[i].Kb), 1)}`).join(', ') || 'нет'}. Не называй правильный порядок — спрашивай про влияние кольца и группы CH₃ на пару азота.`;
    else if (S.mode2 === 'br') now = `Режим «Br₂»: выбрана пробирка ${BRS[S.brSel].name}. Бензол: ${S.brw[0] === null ? 'бромную воду не добавляли' : 'реакции нет, бром перешёл в слой бензола'}. Анилин: ${S.brw[1] === null ? 'бромную воду не добавляли' : 'белый осадок 2,4,6-триброманилина'}.`;
    else now = `Режим «Синтез»: сырьё ${RAW[S.raw].name} ${RAW[S.raw].f}, реагент ${RGT[S.rg].name} ${RGT[S.rg].f}. ${m.synDone ? `Получено: ${m.P.name} (${m.P.note}).` : 'Реакцию ещё не проводили.'} Уже получены: ${Object.keys(S.made).map(k => ({ dye: 'мовеин', acet: 'ацетанилид', tar: 'смола', drug: 'парацетамол' }[k])).join(', ') || 'ничего'}. Не называй готовую пару «сырьё + реагент» — подсказывай через то, что делает окислитель и что делает ацетилирование.`;
    now += ` Цели: ${G2.map(([k, n]) => `${n} — ${S.got[k] ? 'есть' : 'нет'}`).join('; ')}.`;
  }
  if (id === 'amides') {
    const I = m.I;
    now = `Конструктор молекул. Цепь: ${S.chain.map(k => FR[k].lab).join(' ') || 'пусто'}; формула ${I.f}, M = ${I.M}, свободных валентностей ${I.free}, амидных связей ${I.amide}${I.complete && I.known ? `, это ${I.known.name}` : I.poly ? `, это ${I.poly.name}` : ''}. Текущая цель: ${TG[S.tgt].name} (${TG[S.tgt].f}). Собрано: ${TG.filter(x => S.got[x.k]).map(x => x.name).join(', ') || 'ничего'}. Не диктуй последовательность фрагментов — помогай рассуждать от брутто-формулы и валентностей.`;
  }
  return [
    `Предмет: химия, 10–11 класс. Тема «Азотсодержащие органические вещества». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    amines: 'Почему лимон убирает запах рыбы?', aniline: 'Почему анилин — более слабое основание, чем аммиак?',
    amides: 'Чем кевлар похож на белок?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
