<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: хромосомная теория и генетика человека — наследование пола, признаки, сцепленные с полом, кроссинговер, родословные и группы крови.">
<title>Хромосомная теория и генетика человека</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Генетика человека</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Генетический стенд: хромосомы, решётка Пеннета, мухи-дрозофилы, родословные. Предметы можно нажимать и перетаскивать."></svg>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>

</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-heredity';
const OK = '#86e0a8', WARN = '#ff8a73', ORA = '#ffb547', CY = '#72d4e8', VIO = '#b48cff', PINK = '#ff8fb8', BLUE = '#6aa8ff', MUT = '#8b96ad', DIM = '#56627d', LT = '#c9d3e6';
const SUP = { A: 'ᴬ', B: 'ᴮ', D: 'ᴰ', H: 'ᴴ', a: 'ᵃ', b: 'ᵇ', d: 'ᵈ', h: 'ʰ' };
const sup = (s, svg) => svg ? `<tspan baseline-shift="super" font-size="70%">${s}</tspan>` : `<sup>${s}</sup>`;

// ---------- lesson 2: X-linked traits ----------
const TRAIT = { cb: { name: 'Дальтонизм', ch: 'D', sick: 'дальтонизм', full: 'нарушение различения красного и зелёного' }, hemo: { name: 'Гемофилия', ch: 'H', sick: 'гемофилия', full: 'кровь плохо свёртывается' } };
const MOPT = ['AA', 'Aa', 'aa'], FOPT = ['A', 'a'];
const XGOALS = [
  { k: 'a', t: 'У здоровых родителей может родиться сын с признаком' },
  { k: 'b', t: 'Может родиться дочь с признаком' },
  { k: 'c', t: 'Отец с признаком, а все дети без признака' }];

// ---------- lesson 3: linkage, Morgan's flies ----------
const GB = 18, GV = 35, RF = 0.17;
const cmX = c => 200 + c * 5;
const mapX = c => 200 + c * 7.5;
const FLY = { BV: { n: 'серая, нормальные крылья', s: 'серая · норм.', g: true, w: true }, Bv: { n: 'серая, зачаточные крылья', s: 'серая · зачат.', g: true, w: false },
  bV: { n: 'чёрная, нормальные крылья', s: 'чёрная · норм.', g: false, w: true }, bv: { n: 'чёрная, зачаточные крылья', s: 'чёрная · зачат.', g: false, w: false } };
const FK = ['BV', 'Bv', 'bV', 'bv'];

// ---------- lesson 4: pedigrees and blood groups ----------
const GEN_Y = [138, 213, 288];
const fam = (sx, aff, gts) => ({
  people: [['a', 0, 345, true], ['b', 0, 415, false], ['c', 1, 305, sx.c], ['d', 1, 375, sx.d], ['e', 1, 445, sx.e], ['s', 1, 240, true], ['g', 2, 225, sx.g], ['h', 2, 275, sx.h], ['i', 2, 325, sx.i]]
    .map(([id, g, x, m]) => ({ id, g, x, m, a: aff.includes(id), gt: gts[id] })),
  fams: [['a', 'b', ['c', 'd', 'e']], ['s', 'c', ['g', 'h', 'i']]] });
const PED = {

  if (id === 'linkage') { const fl = S.fl, rec = fl ? fl.c.Bv + fl.c.bV : 0; return { kind: 'link', fl, rec, rf: fl ? rec / fl.n * 100 : null, ch: chromatids() }; }
  const k = aboKids(), gs = [...new Set(k.map(x => x.grp))].sort((a, b) => GORD.indexOf(a) - GORD.indexOf(b));
  return { kind: 'ped', mode: S.pm, kids: k, gs, neg: rhKids(), solved: ['p1', 'p2', 'p3'].filter(p => S.pok[p]).length };
}

// ---------- lesson 1 actions ----------
function placeChr(id, slot) {
  if (S.sl[slot]) { toast('Эта гамета уже занята: в гамету попадает только одна половая хромосома.'); return; }
  const was = slotOf(id); if (was) S.sl[was] = null;
  S.sl[slot] = id;
  if (Object.values(S.sl).filter(Boolean).length === 4) toast('Гаметы готовы. Яйцеклетки обе с X, сперматозоиды — с X и с Y. Решётка заполнилась.');
  update();
}
function tapChr(id) {
  const who = CHR[id].who, free = Object.keys(SLOT).find(k => SLOT[k].who === who && !S.sl[k]);
  if (slotOf(id)) return;
  if (free) placeChr(id, free);
}
function dropChr(id, p) {
  let best = null, bd = 34;
  for (const k in SLOT) { const d = Math.hypot(SLOT[k].p[0] - p.x, SLOT[k].p[1] - p.y); if (d < bd) { bd = d; best = k; } }
  if (!best) return;
  if (SLOT[best].who !== CHR[id].who) { toast(CHR[id].who === 'm' ? 'Хромосомы матери попадают в яйцеклетки — кружки слева от решётки.' : 'Хромосомы отца попадают в сперматозоиды — кружки над решёткой.'); return; }
  placeChr(id, best);
}
function births(n) {
  if (Object.values(S.sl).filter(Boolean).length < 4) { toast('Сначала разложите хромосомы по всем четырём гаметам.'); return; }
  const b = S.br;
  for (let i = 0; i < n; i++) { const girl = Math.random() < 0.5; if (girl) b.g++; else b.b++; b.n++; if (b.list.length >= 60) b.list.shift(); b.list.push(girl); }
  S.fresh = performance.now();
  if (b.n >= 100 && b.n - n < 100) toast(`Родилось ${b.n} детей: девочек ${b.g}, мальчиков ${b.b}. Близко к 1 : 1.`);
  update();
}
function answer1(a) {
  if (Object.values(S.sl).filter(Boolean).length < 4) { toast('Сначала заполните решётку — по ней и ответим.'); return; }
  if (a === 'm') { toast('Посмотрите на яйцеклетки: обе несут X. Что бы ни дала мать, пол от этого не меняется.'); return; }
  if (S.ans1 !== 'f') { S.ans1 = 'f'; toast('Верно: пол определяет сперматозоид отца — с X будет девочка, с Y мальчик.'); }
  update();
}

}
function chrY(x, y, h, col, op = 1) {

}
const chrG = (t, x, y, h, col, op) => t === 'X' ? chrX(x, y, h, col, op) : chrY(x, y, h, col, op);
const chrCol = id => CHR[id].who === 'm' ? PINK : BLUE;
function sym(x, y, r, fem, st, sel) {

// The shared task card (with the lab-shell «how to» button and lesson formulas) covers the top-left
// of the stage. Scenes keep x < 185 empty above y ≈ 190 and x ≥ 185 empty above y ≈ 108; if the card
// still reaches the content, the scene is shrunk a little and moved to the right of the card.
let VB = { x: 0, y: 0, w: 520, h: 405 };
let drag = null, dirty = true;
const taskCard = $('#stage .task');
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 524, hh / 312, 1.6);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 408 - VB.h;
  const cr = taskCard && taskCard.getBoundingClientRect();
  if (cr && cr.width && w > 600) {
    const R0 = cr.right - rc.left + 8, B0 = cr.bottom - rc.top + 6;
    const ru2 = VB.x + R0 / s, bu = VB.y + B0 / s;
    if ((bu > 190 && ru2 > 8) || (bu > 108 && ru2 > 186)) {
      const s1 = Math.min((w - R0) / 510, hh / 312, 1.6);
      if (s1 >= s * 0.6) { s = s1; VB = { w: w / s, h: hh / s }; VB.x = 8 - R0 / s; VB.y = 408 - VB.h; }
    }
  }
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);
if (taskCard) new ResizeObserver(fit).observe(taskCard);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(key, p) { if (key === 'cx') setCx((p.x - 200) / 5); if (key === 'map') setMap((p.x - 200) / 7.5); }
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) {
    const key = el.dataset.drag;
    if (key.startsWith('chr:')) drag = { chr: key.slice(4), x: e.clientX, y: e.clientY, moved: false, p: toSvg(e) };
    else { drag = { key, x: e.clientX, y: e.clientY, moved: true }; dragTo(key, toSvg(e)); scene.classList.add('grabbing'); }
  } else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5 && !drag.moved) { drag.moved = true; if (drag.chr) scene.classList.add('grabbing'); }
  if (drag.chr) { drag.p = toSvg(e); dirty = true; }
  if (drag.key) dragTo(drag.key, toSvg(e));
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.chr) { if (d.moved) dropChr(d.chr, d.p); else tapChr(d.chr); return; }
  if (d.key || d.moved || !d.hit) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', e => { if (drag && drag.chr) drag.p = toSvg(e); endDrag(false); });
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'sex') {
    if (id.startsWith('sl:')) { const k = id.slice(3); if (S.sl[k]) { S.sl[k] = null; S.ans1 = S.ans1; update(); } else toast(SLOT[k].who === 'm' ? 'Это яйцеклетка: перетащите сюда X-хромосому матери.' : 'Это сперматозоид: перетащите сюда X или Y отца.'); }
    else if (id === 'ans:m' || id === 'ans:f') answer1(id.slice(4));
    else if (id === 'cell-m') toast('Клетка матери: 22 пары аутосом и две X-хромосомы. Здесь показаны только половые хромосомы.');
    else if (id === 'cell-f') toast('Клетка отца: 22 пары аутосом, X и Y. Y-хромосома маленькая, но в ней есть ген SRY.');
  }
  if (L === 'xlinked') {
    if (id === 'mom') cycleX('m');
    if (id === 'dad') cycleX('f');
    if (id === 'xy') toast('Ген лежит в X-хромосоме. В Y его нет, поэтому у мужчины одна копия: какая аллель на X — так и проявится.');
  }
  if (L === 'linkage') {
    if (id === 'flies') toast('Морган отличал мух по окраске тела и форме крыльев. Рекомбинанты — серые с зачаточными и чёрные с нормальными крыльями.');
    if (id === 'cross') toast('Самку-дигибрида Морган получил от серой мухи с нормальными крыльями и чёрной с зачаточными: в одной её хромосоме B и V, в другой — b и v.');
  }
  if (L === 'pedigree') {
    if (id.startsWith('pp:')) tapPerson(id.slice(3));
    if (id.startsWith('pa:')) answerPed(id.slice(3));
    if (id === 'abo-m' || id === 'abo-f') cycleAbo(id.slice(4));
    if (id === 'rh-m' || id === 'rh-f') cycleRh(id.slice(3));
  }
}

function act(a) {
  if (!a) return;
  if (a.startsWith('born-')) return births(+a.slice(5));
  if (a.startsWith('fly-')) return flies(+a.slice(4));
  if (a.startsWith('t-')) return setTrait(a.slice(2));
  if (a === 'mom') return cycleX('m');
  if (a === 'dad') return cycleX('f');
  if (a.startsWith('m-')) return setMode4(a.slice(2));
  if (a.startsWith('ans-')) return answer1(a.slice(4));
  if (a.startsWith('pa-')) return answerPed(a.slice(3));
  if (a.startsWith('xm-')) { S.xg.m = a.slice(3); return update(); }
  if (a.startsWith('xf-')) { S.xg.f = a.slice(3); return update(); }
  if (a.startsWith('am-')) { S.abo.m = a.slice(3); return update(); }
  if (a.startsWith('af-')) { S.abo.f = a.slice(3); return update(); }
  if (a.startsWith('rm-')) { S.rh.m = a.slice(3); return update(); }
  if (a.startsWith('rf-')) { S.rh.f = a.slice(3); return update(); }
  if (a === 'auto1') { ['m0', 'm1', 'f0', 'f1'].forEach(tapChr); return; }
  if (a === 'reset') {
    if (LID() === 'sex') { S.sl = { e0: null, e1: null, s0: null, s1: null }; S.br = { n: 0, g: 0, b: 0, list: [] }; }
    else if (LID() === 'linkage') { S.cx = null; S.fl = null; S.mapV = null; }
    update();
  }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });
$('#pane-scheme').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a); });
$('#pane-scheme').addEventListener('input', e => {

});

function calcHTML(m) {
  const id = LID();
  if (id === 'sex') {
    let h = `<h2>Схема скрещивания</h2><div class="formula">P: ♀ XX × ♂ XY</div><div class="steps">` +
      step('Гаметы ♀', 'X, X — один тип') + step('Гаметы ♂', 'X и Y — по ½') + step('F₁', 'XX : XY = 1 : 1') + step('P(девочка)', '1 × ½ = ½', 'sum') + `</div>`;
    if (m.n) {
      const sd = Math.sqrt(m.n * 0.25);
      h += `<h3>Опыт: ${m.n} детей</h3><div class="steps">` + step('Девочек', `${m.g} · ${ru(m.g / m.n * 100)} %`) + step('Мальчиков', `${m.b} · ${ru(m.b / m.n * 100)} %`) + step('Ожидали', `${ru(m.n / 2, 0)} и ${ru(m.n / 2, 0)}`) +
        step('Обычный разброс √(n·½·½)', `± ${ru(sd)}`, 'sum') + `</div><p class="note" style="margin-top:8px">Чем больше детей, тем ближе доли к ½. В реальной статистике мальчиков рождается чуть больше — около 105 на 100 девочек.</p>`;
    } else h += `<p class="note" style="margin-top:8px">«Родите» детей — здесь появится сравнение с теорией.</p>`;
    return h;
  }
  if (id === 'xlinked') {
    const k = m.kids, T = TRAIT[S.trait];
    let h = `<h2>${T.name}: решётка Пеннета</h2><div class="formula">P(ребёнок) = ½ × ½ = ¼</div><div class="steps">` +
      step('Мать', `${xgt(S.xg.m, false)} → гаметы ${[...new Set(S.xg.m.split(''))].map(c => xch(c, false)).join(', ')}`) + step('Отец', `${xgt(S.xg.f + 'Y', false)} → гаметы ${xch(S.xg.f, false)}, Y`);
    k.forEach(kd => { h += step(`${xch(kd.a, false)} + ${xch(kd.b, false)}`, `${xgt(kd.gt, false)} · ${kd.fem ? 'дочь' : 'сын'} · ${stW(kd.st, kd.fem)}`); });
    h += step('Сыновья с признаком', `${m.sickSons} из 2 = ${m.sickSons * 50} %`, 'sum') + step('Дочери с признаком', `${m.sickDau} из 2 = ${m.sickDau * 50} %`) + `</div>`;
    h += `<h3>Почему мужчины чаще</h3><div class="steps">` + step('Доля аллели d в популяции', 'q ≈ 0,08') + step('Мужчины с признаком (одна X)', 'q ≈ 8 %') + step('Женщины с признаком (нужны две)', 'q² ≈ 0,64 %', 'sum') + `</div><p class="note" style="margin-top:8px">Примерные цифры для дальтонизма в европейских популяциях. Для гемофилии q гораздо меньше, и почти все люди с гемофилией — мужчины.</p>`;
    return h;
  }
  if (id === 'linkage') {
    const fl = m.fl;
    let h = `<h2>Частота рекомбинации</h2><div class="formula">rf = (Bv + bV) ÷ n × 100 %</div>`;
    if (!fl) h += `<p class="note">Получите мух — здесь появится расчёт.</p>`;
    else {
      h += `<div class="steps">` + FK.map(k => step(`${k} — ${FLY[k].n}`, fl.c[k])).join('') + step('Рекомбинанты Bv + bV', `${fl.c.Bv} + ${fl.c.bV} = ${m.rec}`) + step('Всего n', fl.n) +
        step('rf', S.okMap ? `${m.rec} ÷ ${fl.n} × 100 = ${ru(m.rf)} % → ${ru(m.rf)} сМ` : `${m.rec} ÷ ${fl.n} × 100 = ? (посчитайте и отметьте на карте)`, 'sum') + `</div>`;
    }
    h += `<h3>Если бы гены были в разных хромосомах</h3><div class="steps">` + step('Каждый из 4 классов', '25 %') + step('Рекомбинантов', '50 %', 'sum') + `</div>`;
    h += `<h3>Гаметы самки при расстоянии 17 сМ</h3><div class="steps">` + step('Родительские BV и bv', '(100 − 17) ÷ 2 = 41,5 % каждая') + step('Рекомбинантные Bv и bV', '17 ÷ 2 = 8,5 % каждая', 'sum') + `</div>
      <p class="note" style="margin-top:8px">Один перекрёст делает рекомбинантными только две хроматиды из четырёх. Поэтому даже у очень далёких генов рекомбинантов не больше 50 %, и правило «1 % = 1 сМ» точно работает для близких генов.</p>`;
    return h;
  }
  if (S.pm !== 'abo') {
    const P = PED[S.pm];
    let h = `<h2>Как читать родословную</h2><div class="steps">` +
      step('1. Есть ли ребёнок с признаком у родителей без признака?', 'да → рецессивный') + step('2. Признак в каждом поколении, у каждого «больного» — «больной» родитель?', 'да → доминантный') +
      step('3. Признак почти только у мужчин, через здоровых матерей?', 'да → сцеплен с X') + step('4. Отец передал признак сыну?', 'да → не сцеплен с X', 'sum') + `</div>`;
    if (S.pok[S.pm]) h += `<h3>Ответ: ${PANS[P.ans]}</h3><p class="note">${P.why}</p><div class="steps">` + P.people.slice().sort((a, b) => a.g - b.g || a.x - b.x).map(p => step(numOf(P, p), p.gt)).join('') + `</div>`;
    else h += `<p class="note" style="margin-top:10px">Когда определите тип, здесь появятся генотипы всех членов семьи.</p>`;
    return h;
  }
  const k = m.kids, cnt = {}; k.forEach(x => { cnt[x.grp] = (cnt[x.grp] || 0) + 1; });
  let h = `<h2>Группы крови детей</h2><div class="formula">P(группа и резус) = P(группа) × P(резус)</div><div class="steps">` +
    step('Мать', `${aboTxt(S.abo.m, false)} → гаметы ${[...new Set(S.abo.m.split(''))].map(c => aboTxt(c, false)).join(', ')}`) + step('Отец', `${aboTxt(S.abo.f, false)} → гаметы ${[...new Set(S.abo.f.split(''))].map(c => aboTxt(c, false)).join(', ')}`) +
    GORD.filter(G => cnt[G]).map(G => step(GRN[G], `${cnt[G]} из 4 = ${cnt[G] * 25} %`)).join('') + `</div>`;
  const neg = m.neg;
  h += `<h3>Резус</h3><div class="steps">` + step('Мать × отец', `${S.rh.m} × ${S.rh.f}`) + step('Rh− (dd)', `${neg} из 4 = ${neg * 25} %`) + step('Rh+', `${(4 - neg) * 25} %`, 'sum') + `</div>`;
  if (cnt.I && neg) h += `<p class="note" style="margin-top:8px">Например, ребёнок I группы Rh−: ${cnt.I * 25} % × ${neg * 25} % = ${ru(cnt.I * neg * 6.25, 2)} %.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), dn = S.done[LID()];
  if (m.kind === 'sex') {
    el.innerHTML = `<div class="k">Дети</div><div class="v ${dn ? 'ok' : ''}">${m.n ? `♀ ${m.g} : ♂ ${m.b}` : '—'}</div>
      <div class="lr"><span>девочек</span><span>${m.n ? ru(m.g / m.n * 100) + ' %' : '—'}</span></div><div class="lr"><span>гаметы</span><span>${m.filled} из 4</span></div>
      <div class="gauge"><b style="width:${m.n ? m.g / m.n * 100 : 0}%;background:${PINK}"></b></div>`;
  } else if (m.kind === 'x') {
    el.innerHTML = `<div class="k">${TRAIT[S.trait].name}</div><div class="v ${m.sickSons || m.sickDau ? 'bad' : 'ok'}">сыновья ${m.sickSons * 50} %</div>
      <div class="lr"><span>дочери</span><span>${m.sickDau * 50} %</span></div><div class="lr"><span>носительницы</span><span>${m.carDau * 50} %</span></div>
      <div class="gauge"><b style="width:${m.goals / 3 * 100}%;${dn ? 'background:var(--ok)' : ''}"></b></div>`;
  } else if (m.kind === 'link') {
    el.innerHTML = `<div class="k">Мухи</div><div class="v ${dn ? 'ok' : ''}">n = ${m.fl ? m.fl.n : 0}</div>
      <div class="lr"><span>рекомбинанты</span><span>${m.fl ? m.rec : '—'}</span></div><div class="lr"><span>ген V</span><span>${S.mapV === null ? '—' : ru(S.mapV) + ' сМ'}</span></div>
      <div class="gauge"><b style="width:${m.fl ? Math.min(100, m.fl.n / 10) : 0}%;${dn ? 'background:var(--ok)' : ''}"></b></div>`;
  } else if (S.pm === 'abo') {
    el.innerHTML = `<div class="k">Дети</div><div class="v">${m.gs.join(', ')}</div><div class="lr"><span>Rh−</span><span>${m.neg * 25} %</span></div><div class="lr"><span>цели</span><span>${(S.g4.abo ? 1 : 0) + (S.g4.rh ? 1 : 0)} из 2</span></div>`;
  } else {
    el.innerHTML = `<div class="k">${MODES4[S.pm]}</div><div class="v ${S.pok[S.pm] ? 'ok' : ''}">${S.pok[S.pm] ? 'решена ✓' : 'тип: ?'}</div><div class="lr"><span>решено</span><span>${m.solved} из 3</span></div><div class="lr"><span>кровь</span><span>${(S.g4.abo ? 1 : 0) + (S.g4.rh ? 1 : 0)} из 2</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (m.kind === 'x') {
    const msgs = { a: 'Семья 1: мать — здоровая носительница, отец здоров. Каждый их сын с шансом ½ получит X с рецессивной аллелью.', b: 'Семья 2: отец с признаком и мать с рецессивной аллелью — дочь может получить её от обоих.', c: 'Семья 3: отец передаёт свою X только дочерям — все они носительницы, а сыновья получают Y и здоровы.' };
    const now = { a: S.xg.m === 'Aa' && S.xg.f === 'A', b: S.xg.m.includes('a') && S.xg.f === 'a', c: S.xg.f === 'a' && S.xg.m === 'AA' };
    for (const g of XGOALS) if (now[g.k] && !S.g2[g.k]) { S.g2[g.k] = true; toast(msgs[g.k]); }
  }
  if (m.kind === 'link' && m.fl && m.fl.n >= 1000 && S.mapV !== null && !S.okMap && Math.abs(S.mapV - m.rf) <= 1.5) { S.okMap = true; toast(`Верно! Рекомбинантов ${ru(m.rf)} % — ген V примерно в ${ru(m.rf)} сМ от B. У Моргана вышло 17 %.`); }
  if (m.kind === 'ped' && S.pm === 'abo') {
    const pg = [grp(S.abo.m), grp(S.abo.f)].sort().join();
    if (!S.g4.abo && pg === 'II,III' && m.gs.length === 4) { S.g4.abo = true; toast('Iᴬi × Iᴮi: у детей возможны все четыре группы, каждая с шансом ¼. Сочетание I и IV у детей одной пары — норма.'); }
    if (!S.g4.rh && rhPlus(S.rh.m) && rhPlus(S.rh.f) && m.neg) { S.g4.rh = true; toast('Оба родителя Rh+, но оба Dd — каждый их ребёнок с шансом ¼ будет Rh− (dd).'); }
  }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы читаете хромосомы, родословные и группы крови, как генетик!'), 2400);
  }
  if (LID() === 'pedigree') renderTools();
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  sex: `<path d="M8 9l7 12M15 9l-7 12" stroke="${PINK}" stroke-width="2.6" stroke-linecap="round"/><path d="M19 9l7 12M26 9l-7 12" stroke="${PINK}" stroke-width="2.6" stroke-linecap="round"/><path d="M40 9l7 12M47 9l-7 12" stroke="${BLUE}" stroke-width="2.6" stroke-linecap="round"/><path d="M53 10l3 5 3-5M56 15v6" stroke="${BLUE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`,
  xlinked: `<circle cx="14" cy="9" r="5" fill="#1a2438" stroke="${LT}"/><circle cx="14" cy="9" r="1.7" fill="${ORA}"/><rect x="45" y="4" width="10" height="10" fill="#1a2438" stroke="${LT}"/><path d="M19 9H45M32 9V17M22 17H46M22 17V20M46 17V20" stroke="${DIM}"/><rect x="17" y="20" width="9" height="9" fill="${WARN}"/><circle cx="46" cy="25" r="4.5" fill="#1a2438" stroke="${LT}"/><circle cx="46" cy="25" r="1.5" fill="${ORA}"/>`,
  linkage: `<rect x="6" y="7" width="54" height="5" rx="2.5" fill="${ORA}"/><rect x="6" y="18" width="54" height="5" rx="2.5" fill="${CY}"/><rect x="36" y="7" width="24" height="5" rx="2.5" fill="${CY}"/><rect x="36" y="18" width="24" height="5" rx="2.5" fill="${ORA}"/><path d="M32 9l6 12M38 9l-6 12" stroke="#ffffff" stroke-width="1.2"/>`,
  pedigree: `<rect x="5" y="4" width="9" height="9" fill="${WARN}"/><circle cx="25" cy="8.5" r="4.5" fill="#1a2438" stroke="${LT}"/><path d="M14 8.5H20M17 8.5V16M10 16H24M10 16V19M24 16V19" stroke="${DIM}"/><circle cx="10" cy="24" r="4" fill="${WARN}"/><rect x="20" y="20" width="8" height="8" fill="#1a2438" stroke="${LT}"/><rect x="36" y="9" width="11" height="12" rx="6" fill="${ORA}"/><rect x="50" y="9" width="11" height="12" rx="6" fill="${CY}"/>`,
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); update();
  const ls = $('#lessons'), cur = ls.querySelector('.lesson[aria-current="true"]');
  if (cur) { const a = ls.getBoundingClientRect(), b = cur.getBoundingClientRect(); ls.scrollLeft += b.left - a.left - (a.width - b.width) / 2; }
  fit();
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'sex') {
    now = `Клетки родителей: мать XX, отец XY. Гаметы разложены: ${Object.keys(S.sl).map(k => `${k[0] === 'e' ? 'яйцеклетка' : 'сперматозоид'} ${k[1] === '0' ? 1 : 2}: ${S.sl[k] ? CHR[S.sl[k]].t : 'пусто'}`).join(', ')}. Родилось детей: ${m.n} (девочек ${m.g}, мальчиков ${m.b}). Ответ на вопрос «чья гамета определяет пол»: ${S.ans1 === 'f' ? 'дан верно' : 'ещё не дан'}.`;
    guide = 'Не говори сразу, чья гамета определяет пол. Спрашивай: какие хромосомы бывают в яйцеклетках, а какие в сперматозоидах, от чего зависит, будет ли в зиготе Y. Если ученик говорит про «вину» матери — мягко объясни, что это предрассудок.';
  }
  if (id === 'xlinked') {
    now = `Признак: ${TRAIT[S.trait].name.toLowerCase()} (рецессивный, ген в X). Мать ${xgt(S.xg.m, false).replace(/<\/?sup>/g, '')} (${stW(m.ms, true)}), отец ${xgt(S.xg.f + 'Y', false).replace(/<\/?sup>/g, '')} (${stW(m.fs, false)}). Дети: ${m.kids.map(k => (k.fem ? 'дочь ' : 'сын ') + stW(k.st, k.fem)).join(', ')}. Собраны семьи: ${XGOALS.map((g, i) => `${i + 1}) ${S.g2[g.k] ? 'да' : 'нет'}`).join(', ')}.`;
    guide = 'Не называй нужные генотипы. Спрашивай: сколько X у мужчины, от кого сын получает X, может ли здоровая женщина передать аллель. Говори бережно: тема может касаться семьи ученика.';
  }
  if (id === 'linkage') {
    const ch = m.ch;
    now = `Гены B (серое тело) на ${GB} сМ и V (нормальные крылья) на ${GV} сМ одной хромосомы дрозофилы; истинное расстояние 17 сМ. Место кроссинговера: ${S.cx === null ? 'не задано' : S.cx + ' сМ'}; гаметы этого мейоза: ${ch.map(c => c.key + (c.rec ? ' (рекомбинантная)' : '')).join(', ')}. Перекрёст между генами уже делали: ${S.rec ? 'да' : 'нет'}. Мух: ${m.fl ? m.fl.n + ' — ' + FK.map(k => k + ' ' + m.fl.c[k]).join(', ') : 'нет'}. Ген V на карте: ${S.mapV === null ? 'не отмечен' : S.mapV + ' сМ'}; карта верна: ${S.okMap ? 'да' : 'нет'}.`;
    guide = 'Не называй готовую частоту рекомбинации. Помоги понять, какие мухи рекомбинантные, как сложить их и поделить на всех мух, почему частота показывает расстояние.';
  }
  if (id === 'pedigree') {
    if (S.pm === 'abo') now = `Группы крови: мать ${aboTxt(S.abo.m, false)} (${GRN[grp(S.abo.m)]}), ${S.rh.m}; отец ${aboTxt(S.abo.f, false)} (${GRN[grp(S.abo.f)]}), ${S.rh.f}. Возможные группы детей: ${m.gs.join(', ')}; Rh− у детей ${m.neg * 25} %.`;
    else { const P = PED[S.pm]; now = `${MODES4[S.pm]}: ` + P.people.slice().sort((a, b) => a.g - b.g || a.x - b.x).map(p => `${numOf(P, p)} ${p.m ? 'мужчина' : 'женщина'}${p.a ? ' с признаком' : ''}`).join('; ') + `. Браки: I-1 × I-2 → дети II-2, II-3, II-4; II-1 × II-2 → дети III-1, III-2, III-3. Решена: ${S.pok[S.pm] ? 'да' : 'нет'}.`; }
    now += ` Решено родословных: ${m.solved} из 3; все четыре группы: ${S.g4.abo ? 'да' : 'нет'}; Rh− у Rh+ родителей: ${S.g4.rh ? 'да' : 'нет'}.`;
    guide = 'Не называй тип наследования и нужные генотипы. Спрашивай: есть ли признак у родителей ребёнка с признаком, встречается ли он у женщин, передаётся ли от отца к сыну; для групп крови — какие аллели должен дать каждый родитель, чтобы у ребёнка была I группа. Не используй группы крови как «доказательство» родства.';
  }
  return [
    `Раздел: биология, 10 класс, тема «Хромосомная теория и генетика человека» (продолжение законов Менделя). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}. Подсказка на экране: ${taskState(m)}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { sex: 'Почему пол ребёнка определяет отец?', xlinked: 'Почему дальтонизм чаще бывает у мужчин?', linkage: 'Как по частоте кроссинговера найти расстояние между генами?', pedigree: 'Как по родословной понять тип наследования?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Кем работают генетики в эпоху ИИ?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
