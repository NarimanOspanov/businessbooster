<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 10 класс: единичная окружность, радианы, синус, косинус и тангенс, основные тригонометрические формулы, графики синуса и косинуса, простейшие тригонометрические уравнения.">
<title>Тригонометрия</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.pbody h3 .m,.meter .k .m{text-transform:none;letter-spacing:.02em}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 290px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Тригонометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: единичная окружность или графики тригонометрических функций. Точки можно перетаскивать и отмечать касанием."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => { let s = fmt(x, n); if (s.includes(',')) s = s.replace(/0+$/, '').replace(/,$/, ''); return s === '−0' ? '0' : s; };
const num = v => trim(v, 2);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CY_ = '#72d4e8', VI = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', RD = '#ff8a73';
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const RAD = Math.PI / 180;
const norm = d => ((d % 360) + 360) % 360;
const near = (a, b) => Math.abs(a - b) < 1e-9;
const S3 = Math.sqrt(3), S2 = Math.sqrt(2);

// angle in degrees → radians as a fraction of π (for multiples of 15°)
function radStr(deg) {
  if (Math.abs(deg - Math.round(deg)) > 1e-9 || Math.round(deg) % 15) return '≈ ' + fmt(deg * RAD, 2);
  let n = Math.round(deg) / 15, d = 12;
  if (!n) return '0';
  const g = gcd(n, d); n /= g; d /= g;
  const sg = n < 0 ? '−' : '', a = Math.abs(n);
  return sg + (a === 1 ? '' : a) + 'π' + (d === 1 ? '' : '/' + d);
}
const degStr = d => Math.abs(d - Math.round(d)) < 1e-9 ? num(d) + '°' : '≈ ' + fmt(d, 2) + '°';
// value of sin/cos: exact form when it is a known one
function valStr(v) {
  const a = Math.abs(v), sg = v < -1e-12 ? '−' : '';
  for (const [x, s] of [[0, '0'], [0.5, '1/2'], [S2 / 2, '√2/2'], [S3 / 2, '√3/2'], [1, '1']]) if (Math.abs(a - x) < 1e-9) return x ? sg + s : '0';
  if (Math.abs(a * 1000 - Math.round(a * 1000)) < 1e-6) return trim(v, 3);
  return '≈ ' + fmt(v, 3);
}
function tgStr(s, c) {
  if (Math.abs(c) < 1e-9) return 'не существует';
  const v = s / c, a = Math.abs(v), sg = v < -1e-12 ? '−' : '';
  for (const [x, t] of [[0, '0'], [1 / S3, '√3/3'], [1, '1'], [S3, '√3'], [4 / 3, '4/3'], [0.75, '3/4']]) if (Math.abs(a - x) < 1e-9) return x ? sg + t : '0';
  return '≈ ' + fmt(v, 3);
}
const sinD = d => { const r = Math.sin(d * RAD); return Math.abs(r) < 1e-12 ? 0 : r; };
const cosD = d => { const r = Math.cos(d * RAD); return Math.abs(r) < 1e-12 ? 0 : r; };
function quarter(d) {
  const r = norm(d);
  if ([0, 90, 180, 270].some(q => near(r, q))) return 'на оси';
  return r < 90 ? 'I' : r < 180 ? 'II' : r < 270 ? 'III' : 'IV';
}

// lesson 2: snap points — every 15° plus the points with cos, sin = ±0,6 / ±0,8
const EGY = [];
[[0.8, 0.6], [0.6, 0.8]].forEach(([c, s]) => [[1, 1], [-1, 1], [-1, -1], [1, -1]].forEach(([p, q]) => EGY.push(norm(Math.atan2(q * s, p * c) / RAD))));
const CAND = [...Array.from({ length: 24 }, (_, i) => i * 15), ...EGY].sort((a, b) => a - b);
const MODES = {
  neg:  { b: '−α',     f: a => -a,     fs: ['sin(−α) = −sin α', 'cos(−α) = cos α'] },
  pmA:  { b: 'π − α',  f: a => 180 - a, fs: ['sin(π − α) = sin α', 'cos(π − α) = −cos α'] },
  ppA:  { b: 'π + α',  f: a => 180 + a, fs: ['sin(π + α) = −sin α', 'cos(π + α) = −cos α'] },
  hpmA: { b: 'π/2 − α', f: a => 90 - a, fs: ['sin(π/2 − α) = cos α', 'cos(π/2 − α) = sin α'] },
  dbl:  { b: '2α',     f: a => 2 * a,  fs: ['sin 2α = 2 sin α cos α', 'cos 2α = cos²α − sin²α'] },
};
// lesson 3: target y = 2·cos 2x − 1
const TGT = { fn: 'cos', A: 2, k: 2, b: -1 };
// lesson 4: values of a
const AV = [[-1.2, '−1,2'], [-1, '−1'], [-S3 / 2, '−√3/2'], [-S2 / 2, '−√2/2'], [-0.5, '−1/2'], [0, '0'], [0.5, '1/2'], [S2 / 2, '√2/2'], [S3 / 2, '√3/2'], [1, '1'], [1.2, '1,2']];

const LESSONS = [
  { id: 'unit', title: 'Единичная окружность',
    text: ['Единичная окружность — окружность радиуса 1 с центром в начале координат. Угол α откладывают от луча Ox: против часовой стрелки — положительный, по часовой — отрицательный. Радиус поворачивается и приходит в точку Pα.',
           'Косинус угла — абсцисса точки Pα, синус — её ордината: Pα(cos α; sin α). Поэтому оба лежат от −1 до 1, а знаки зависят от четверти. Тангенс tg α = sin α : cos α — это ордината точки на линии тангенсов x = 1.',
           'Углы измеряют и в радианах: π рад = 180°, значит 1° = π/180 рад. Полный оборот — 2π. После ещё одного оборота точка вернётся на место: sin(α + 2πn) = sin α, cos(α + 2πn) = cos α.'],
    why: 'Инженер-электрик описывает переменный ток в розетке (220 В, 50 Гц) синусом угла, который делает 50 оборотов в секунду. Штурман, пилот и геодезист переводят курс и азимут в координаты через cos и sin. Программист игр поворачивает героя и камеру по формулам x = r·cos α, y = r·sin α. Робототехник на заводе так считает, куда дотянется рука манипулятора.',

const KEY = 'luch-math-trig';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            a1: 30, tgl: false, a2: 30, mode: 'pmA', fn: 'sin', A: 1, k: 1, b: 0, ti: 4, eq: 'sin', ai: 6, marks: [] };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

const fval = (fn, A, k, b, x) => A * (fn === 'sin' ? Math.sin(k * x) : Math.cos(k * x)) + b;
function rootsOf(eq, a) {
  if (Math.abs(a) > 1 + 1e-9) return [];
  const base = Math.round((eq === 'sin' ? Math.asin(clamp(a, -1, 1)) : Math.acos(clamp(a, -1, 1))) / RAD);
  const r = eq === 'sin' ? [norm(base), norm(180 - base)] : [norm(base), norm(-base)];
  return [...new Set(r)].sort((p, q) => p - q);
}

function model() {
  const id = LID();
  if (id === 'unit') { const a = S.a1; return { kind: id, a, s: sinD(a), c: cosD(a), tgl: S.tgl }; }
  if (id === 'form') {
    const a = S.a2, M = MODES[S.mode], bA = M.f(a);
    return { kind: id, a, s: sinD(a), c: cosD(a), mode: S.mode, bA, bs: sinD(bA), bc: cosD(bA) };
  }
  if (id === 'graph') {
    let mx = 0;
    for (let i = 0; i <= 96; i++) { const x = -2 * Math.PI + i * Math.PI / 24; mx = Math.max(mx, Math.abs(fval(S.fn, S.A, S.k, S.b, x) - fval(TGT.fn, TGT.A, TGT.k, TGT.b, x))); }
    const x0 = S.ti * Math.PI / 12;
    return { kind: id, fn: S.fn, A: S.A, k: S.k, b: S.b, ti: S.ti, x0, y0: fval(S.fn, S.A, S.k, S.b, x0), match: mx < 1e-6, diff: mx };
  }
  const a = AV[S.ai][0], roots = rootsOf(S.eq, a), marks = S.marks.slice().sort((p, q) => p - q);
  const need = rootsOf('sin', -0.5);
  const setOk = S.eq === 'sin' && near(a, -0.5);
  const marksOk = marks.length === need.length && marks.every((v, i) => v === need[i]);
  return { kind: id, eq: S.eq, a, aS: AV[S.ai][1], roots, marks, setOk, marksOk,
           good: marks.filter(v => roots.includes(v)).length, bad: marks.filter(v => !roots.includes(v)).length };
}

// ---------- geometry (SVG units, 520 × 405) ----------
const CX = 260, CY = 218, R = 122;
const PX = d => CX + R * cosD(d), PY = d => CY - R * sinD(d);
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const Ln = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const thick = (x1, y1, x2, y2, col, w = 3.4) => Ln(x1, y1, x2, y2, INK, w + 2.6, 'stroke-linecap="round"') + Ln(x1, y1, x2, y2, col, w, 'stroke-linecap="round"');
const handle = (x, y, col, r = 7) => `<g data-drag="1"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r + 4}" fill="none" stroke="${col}" stroke-width="1" opacity=".55"/></g>`;
const dot = (x, y, col, r = 4.5) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <clipPath id="gclip"><rect x="${GX(-2 * Math.PI) - 4}" y="${GY(5.2)}" width="${GX(2 * Math.PI) - GX(-2 * Math.PI) + 8}" height="${GY(-5.2) - GY(5.2)}"/></clipPath>
    <clipPath id="cclip"><rect x="0" y="40" width="520" height="350"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const arrowR = (x, y) => `<path d="M${x} ${y}l-8 -4.5v9z" fill="#a9b4c9"/>`, arrowU = (x, y) => `<path d="M${x} ${y}l-4.5 8h9z" fill="#a9b4c9"/>`;
function circleBase(opts = {}) {
  let h = Ln(CX - R - 24, CY, CX + R + 30, CY, '#a9b4c9', 1.5) + arrowR(CX + R + 36, CY);
  h += Ln(CX, CY + R + 22, CX, CY - R - 28, '#a9b4c9', 1.5) + arrowU(CX, CY - R - 34);
  h += T(CX + R + 34, CY - 8, 12, 'x', FG) + T(CX + 11, CY - R - 30, 12, 'y', FG);
  h += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="rgba(18,26,40,.55)" stroke="${INK}" stroke-width="5"/><circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#a9b4c9" stroke-width="1.8"/>`;
  for (let d = 0; d < 360; d += 15) {
    const big = d % 90 === 0, mid = d % 30 === 0 || d % 45 === 0, l = big ? 0 : mid ? 7 : 4;
    if (!big) h += Ln(CX + (R - l) * cosD(d), CY - (R - l) * sinD(d), CX + (R + l) * cosD(d), CY - (R + l) * sinD(d), 'rgba(169,180,201,.6)', mid ? 1.3 : 1);
  }
  h += T(CX + R + 6, CY + 14, 10, '1', MU, 'start') + T(CX - R - 6, CY + 14, 10, '−1', MU, 'end') + T(CX - 6, CY - R - 5, 10, '1', MU, 'end') + T(CX - 6, CY + R + 13, 10, '−1', MU, 'end');
  if (opts.quarters) [['I', 45], ['II', 135], ['III', 225], ['IV', 315]].forEach(([q, d]) => { h += T(CX + R * 0.62 * cosD(d), CY - R * 0.62 * sinD(d) + 4, 12, q, 'rgba(139,150,173,.55)', 'middle', 'font-weight="500"'); });
  return h;
}
// spiral arc from 0 to a (degrees), several turns allowed
function spiral(a, col) {
  if (Math.abs(a) < 1e-9) return '';
  const n = Math.max(8, Math.ceil(Math.abs(a) / 4)), pts = [];
  for (let i = 0; i <= n; i++) { const t = a * i / n, r = 24 + 9 * Math.abs(t) / 360; pts.push([CX + r * cosD(t), CY - r * sinD(t)]); }
  const [ex, ey] = pts[n], [px, py] = pts[n - 1], L = Math.hypot(ex - px, ey - py) || 1, ux = (ex - px) / L, uy = (ey - py) / L;
  const head = `<path d="M${(ex + ux * 5).toFixed(1)} ${(ey + uy * 5).toFixed(1)}L${(ex - ux * 4 - uy * 4).toFixed(1)} ${(ey - uy * 4 + ux * 4).toFixed(1)}L${(ex - ux * 4 + uy * 4).toFixed(1)} ${(ey - uy * 4 - ux * 4).toFixed(1)}Z" fill="${col}"/>`;
  return `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}" fill="none" stroke="${col}" stroke-width="1.8"/>` + head;
}
// point on the circle with cos/sin projections
function projections(d, cCol, sCol, dash = false) {
  const x = PX(d), y = PY(d);
  let h = Ln(x, y, x, CY, cCol, 1.1, 'stroke-dasharray="3 3" opacity=".8"') + Ln(x, y, CX, y, sCol, 1.1, 'stroke-dasharray="3 3" opacity=".8"');
  if (dash) h += Ln(CX, CY, x, CY, cCol, 2.6, 'stroke-dasharray="6 4"') + Ln(CX, CY, CX, y, sCol, 2.6, 'stroke-dasharray="6 4"');
  else { if (Math.abs(x - CX) > 0.5) h += thick(CX, CY, x, CY, cCol); if (Math.abs(y - CY) > 0.5) h += thick(CX, CY, CX, y, sCol); }
  return h;
}

// ---------- lesson 1 ----------
function unitSVG(m) {
  let h = `<g clip-path="url(#cclip)">` + circleBase({ quarters: true });
  [[0, '0'], [90, 'π/2'], [180, 'π'], [270, '3π/2']].forEach(([d, s]) => { h += T(CX + (R + 16) * cosD(d) + (d === 0 ? 4 : d === 180 ? -4 : 12), CY - (R + 16) * sinD(d) + (d === 90 ? -2 : d === 270 ? 10 : -6), 10.5, s, FG, d === 180 ? 'end' : 'start'); });
  const ok = !!S.done.unit || near(m.a, 480), col = ok ? GR : OR;
  if (m.tgl) {
    h += Ln(CX + R, CY - R * 1.45, CX + R, CY + R * 1.45, 'rgba(232,236,244,.5)', 1.3) + T(CX + R + 5, CY - R * 1.45 + 10, 10, 'x = 1', MU, 'start');
    if (Math.abs(m.c) > 1e-9) {
      const ty = CY - R * m.s / m.c;
      if (Math.abs(ty - CY) < R * 1.45) {
        h += Ln(CX, CY, CX + R, ty, OR, 1.2, 'stroke-dasharray="4 3"') + thick(CX + R, CY, CX + R, ty, RD, 3) + dot(CX + R, ty, RD, 4) + T(CX + R + 8, ty + 4, 11, 'tg', RD, 'start', 'font-weight="500"');
      } else h += Ln(CX, CY, CX + R * 1.45 * Math.sign(m.c), CY - R * 1.45 * m.s / Math.abs(m.c), OR, 1.2, 'stroke-dasharray="4 3"');
    }
  }
  h += projections(m.a, CY_, VI) + spiral(m.a, col);
  h += Ln(CX, CY, PX(m.a), PY(m.a), FG, 1.8);
  h += T(CX + (PX(m.a) - CX) / 2, CY + (Math.abs(m.s) > 0.2 ? 15 * Math.sign(m.s) : 15) + 3, 10.5, 'cos', CY_, 'middle', 'font-weight="500"');
  h += T(CX + (m.c >= 0 ? -6 : 6), (CY + PY(m.a)) / 2 + 4, 10.5, 'sin', VI, m.c >= 0 ? 'end' : 'start', 'font-weight="500"');
  h += handle(PX(m.a), PY(m.a), col, 7) + T(PX(m.a) + 13 * cosD(m.a) , PY(m.a) - 13 * sinD(m.a) + 4, 12, 'P', col, cosD(m.a) >= 0 ? 'start' : 'end', 'font-weight="500"');
  h += `</g>` + T(CX, 384, 12.5, `α = ${num(m.a)}° = ${radStr(m.a)}`, FG, 'middle', 'font-weight="500"');
  return h;
}
// ---------- lesson 2 ----------
function formSVG(m) {
  let h = circleBase({ quarters: true });
  const M = MODES[m.mode], ax = PX(m.a), ay = PY(m.a), bx = PX(m.bA), by = PY(m.bA);
  // the right triangle of the identity
  h += `<path d="M${CX} ${CY}L${ax.toFixed(1)} ${CY}L${ax.toFixed(1)} ${ay.toFixed(1)}Z" fill="rgba(255,181,71,.16)"/>`;
  h += projections(m.bA, CY_, VI, true) + Ln(CX, CY, bx, by, GR, 1.6, 'stroke-dasharray="5 4"');
  if (m.mode !== 'dbl') h += Ln(ax, ay, bx, by, 'rgba(134,224,168,.35)', 1, 'stroke-dasharray="2 4"');
  h += projections(m.a, CY_, VI) + Ln(CX, CY, ax, ay, FG, 1.8);
  h += dot(bx, by, GR, 5.5) + T(bx + 12 * cosD(m.bA), by - 12 * sinD(m.bA) + 4, 11.5, M.b, GR, cosD(m.bA) >= 0 ? 'start' : 'end', 'font-weight="500"');
  const ok = near(m.c, -0.6) && m.s > 0, col = ok ? GR : OR;
  h += handle(ax, ay, col, 7) + T(ax + 13 * cosD(m.a), ay - 13 * sinD(m.a) + 4, 12, 'α', col, cosD(m.a) >= 0 ? 'start' : 'end', 'font-weight="500" font-style="italic"');
  h += T(CX, 372, 11.5, `sin²α + cos²α = ${trim(m.s * m.s, 4)} + ${trim(m.c * m.c, 4)} = 1`, OR, 'middle', 'font-weight="500"');
  h += T(CX, 391, 11.5, M.fs.join(' · '), GR, 'middle', 'font-weight="500"');
  return h;
}
// ---------- lesson 3 ----------
const KX = 170 / (2 * Math.PI), KY = 23, GOX = 260, GOY = 222;
const GX = x => GOX + x * KX, GY = y => GOY - y * KY;
function curve(fn, A, k, b) {
  let d = '';
  for (let i = 0; i <= 480; i++) { const x = -2 * Math.PI + i * 4 * Math.PI / 480; d += (i ? 'L' : 'M') + GX(x).toFixed(1) + ' ' + GY(fval(fn, A, k, b, x)).toFixed(1); }
  return d;
}
const fnStr = (fn, A, k, b) => {
  if (!A) return 'y = ' + num(b);
  let s = 'y = ' + (A === 1 ? '' : A === -1 ? '−' : num(A) + '·') + fn + ' ' + (k === 1 ? '' : num(k)) + 'x';
  if (b) s += (b > 0 ? ' + ' : ' − ') + num(Math.abs(b));
  return s;
};
function periodStr(k) { let n = 4, d = Math.round(k * 2); const g = gcd(n, d); n /= g; d /= g; return (n === 1 ? '' : n) + 'π' + (d === 1 ? '' : '/' + d); }
function graphSVG(m) {
  let h = '';
  const x0 = GX(-2 * Math.PI), x1 = GX(2 * Math.PI);
  h += `<rect x="${x0 - 4}" y="${GY(5.2)}" width="${x1 - x0 + 8}" height="${GY(-5.2) - GY(5.2)}" fill="rgba(18,26,40,.55)"/>`;
  for (let i = -8; i <= 8; i++) h += Ln(GX(i * Math.PI / 4 * 1), GY(5.2), GX(i * Math.PI / 4), GY(-5.2), i % 2 ? 'rgba(160,185,230,.06)' : 'rgba(160,185,230,.13)');
  for (let y = -5; y <= 5; y++) h += Ln(x0 - 4, GY(y), x1 + 4, GY(y), y ? 'rgba(160,185,230,.10)' : 'rgba(0,0,0,0)');
  // value range band of the student's function
  const lo = m.b - Math.abs(m.A), hi = m.b + Math.abs(m.A);
  h += `<rect x="${x0 - 4}" y="${GY(hi).toFixed(1)}" width="${x1 - x0 + 8}" height="${Math.max(1, GY(lo) - GY(hi)).toFixed(1)}" fill="rgba(114,212,232,.06)"/>`;

  else if (m.kind === 'form') { set('#r1', valStr(m.s)); set('#r2', valStr(m.c)); set('#r3', tgStr(m.s, m.c)); }
  else if (m.kind === 'graph') { set('#r1', periodStr(m.k)); set('#r2', num(m.b - Math.abs(m.A))); set('#r3', num(m.b + Math.abs(m.A))); }
  else { set('#r1', m.aS); set('#r2', m.roots.length); set('#r3', m.marks.length); }
}

function partsList() {
  const id = LID();
  if (id === 'unit') return [
    { id: 'circle', icon: ICON.circle, name: 'Единичная окружность', spec: 'Радиус 1, центр в начале координат. Римские цифры — четверти.' },
    { id: 'pt', icon: ICON.pt, name: 'Точка P', spec: 'Конец повёрнутого радиуса. Её координаты — (cos α; sin α).' },
    { id: 'cosp', icon: ICON.cosp, name: 'Косинус', spec: 'Голубой отрезок на оси x: абсцисса точки P.' },
    { id: 'sinp', icon: ICON.sinp, name: 'Синус', spec: 'Фиолетовый отрезок на оси y: ордината точки P.' },
    { id: 'arc', icon: ICON.arc, name: 'Дуга угла α', spec: 'Спираль показывает, сколько раз и в какую сторону повернулся радиус.' },
    { id: 'tgline', icon: ICON.tgline, name: 'Линия тангенсов', spec: 'Прямая x = 1. Включается кнопкой внизу. Где на неё падает луч OP — там tg α.' }];
  if (id === 'form') return [
    { id: 'pt', icon: ICON.pt, name: 'Точка α', spec: 'Её можно тащить. Прилипает через 15° и к точкам с cos, sin = ±0,6 и ±0,8.' },
    { id: 'tri', icon: ICON.tri, name: 'Прямоугольный треугольник', spec: 'Катеты |cos α| и |sin α|, гипотенуза 1 — отсюда sin²α + cos²α = 1.' },
    { id: 'ptB', icon: ICON.ptB, name: 'Вторая точка', spec: 'Строится по выбранной формуле: −α, π − α, π + α, π/2 − α или 2α. Её проекции — пунктиром.' },
    { id: 'formula', icon: ICON.formula, name: 'Формулы под окружностью', spec: 'Тождество с числами и формула для второй точки.' },
    { id: 'circle', icon: ICON.circle, name: 'Единичная окружность', spec: 'Точки, симметричные относительно осей, дают формулы приведения.' }];
  if (id === 'graph') return [
    { id: 'target', icon: ICON.target, name: 'Пунктирный график', spec: 'Цель. Ваш график должен лечь на него целиком.' },
    { id: 'band', icon: ICON.band, name: 'Полоса значений', spec: 'От b − |A| до b + |A|: область значений вашей функции.' },
    { id: 'period', icon: ICON.period, name: 'Период T', spec: 'Скобка сверху: от x = 0 до x = 2π : k.' },
    { id: 'tracer', icon: ICON.tracer, name: 'Точка на графике', spec: 'Тащите вдоль оси x — видно значение функции. Шаг π/12.' },
    { id: 'gaxes', icon: ICON.axes, name: 'Оси', spec: 'x от −2π до 2π, y от −5 до 5.' }];
  return [
    { id: 'line', icon: ICON.line, name: 'Прямая y = a или x = a', spec: 'Для sin x = a — горизонтальная, для cos x = a — вертикальная.' },
    { id: 'roots', icon: ICON.roots, name: 'Пересечения', spec: 'Пунктирные кольца: здесь прямая пересекает окружность.' },
    { id: 'marks', icon: ICON.marks, name: 'Ваши отметки', spec: 'Зелёная — корень, красная — лишняя. Касание ставит или убирает отметку.' },
    { id: 'circle', icon: ICON.circle, name: 'Окружность с делениями', spec: 'Маленькие точки через 15° — места, куда можно поставить отметку.' }];
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'unit') {
    const r = norm(m.a), n = Math.round((m.a - r) / 360);
    let h = `<h2>Угол и его синус, косинус</h2><div class="formula">Pα(cos α; sin α)</div><h3>Градусы → радианы</h3><div class="steps">` +
      step('α', num(m.a) + '°') + step('α · π/180', `${num(m.a)} · π/180 = ${radStr(m.a)}`) +
      step('α = 360°·n + r', `n = ${num(n)}, r = ${num(r)}°`) + step('четверть', quarter(m.a), 'sum') + `</div>`;
    h += `<h3>Координаты точки <span class="m">P</span></h3><div class="steps">` +
      step('cos α = x', valStr(m.c)) + step('sin α = y', valStr(m.s)) +
      step('tg α = sin α : cos α', tgStr(m.s, m.c)) +
      step('sin²α + cos²α', `${trim(m.s * m.s, 4)} + ${trim(m.c * m.c, 4)} = 1`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Углы α и r = α − 360°·n дают одну и ту же точку P, поэтому sin α = sin ${num(r)}°, cos α = cos ${num(r)}°.</p>`;
  }
  if (m.kind === 'form') {
    const M = MODES[m.mode], s = m.s, c = m.c;
    let h = `<h2>Тождество и формулы</h2><div class="formula">sin²α + cos²α = 1</div><h3>Угол <span class="m">α = ${degStr(m.a)}</span>, ${quarter(m.a)} четверть</h3><div class="steps">` +
      step('cos α', valStr(c)) + step('sin²α = 1 − cos²α', `1 − ${trim(c * c, 4)} = ${trim(s * s, 4)}`) +
      step('sin α = ±√(1 − cos²α)', `${s >= 0 ? '+' : '−'} (знак по четверти) → ${valStr(s)}`) +
      step('tg α = sin α : cos α', tgStr(s, c)) +
      (Math.abs(c) > 1e-9 ? step('1 + tg²α = 1 : cos²α', `${trim(1 + (s / c) ** 2, 4)} = 1 : ${trim(c * c, 4)}`) : '') + `</div>`;
    h += `<h3>Вторая точка: <span class="m">${M.b}</span></h3><div class="steps">`;
    if (m.mode === 'dbl') {
      h += step('sin 2α = 2 sin α cos α', `2 · ${br(valStr(s))} · ${br(valStr(c))} = ${valStr(2 * s * c)}`) +
        step('cos 2α = cos²α − sin²α', `${trim(c * c, 4)} − ${trim(s * s, 4)} = ${valStr(c * c - s * s)}`);
    } else {
      h += step(M.fs[0], valStr(m.bs)) + step(M.fs[1], valStr(m.bc));
    }
    h += step('угол второй точки', `${degStr(norm(m.bA))}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Пунктирные проекции второй точки сравните с проекциями точки α: длины те же, меняются знаки или местами sin и cos.</p>`;
  }
  if (m.kind === 'graph') {
    const k = m.k, x0 = m.x0, arg = k * x0, fv = m.fn === 'sin' ? Math.sin(arg) : Math.cos(arg);
    let h = `<h2>Свойства функции</h2><div class="formula">${fnStr(m.fn, m.A, m.k, m.b)}</div><h3>Период и значения</h3><div class="steps">` +
      step('T = 2π : k', `2π : ${num(k)} = ${periodStr(k)}`) + step('амплитуда |A|', num(Math.abs(m.A))) +
      step('E(y) = [b − |A|; b + |A|]', `[${num(m.b - Math.abs(m.A))}; ${num(m.b + Math.abs(m.A))}]`) +
      step('чётность', m.b === 0 || m.fn === 'cos' ? (m.fn === 'cos' ? 'чётная' : 'нечётная') : 'ни чётная, ни нечётная', 'sum') + `</div>`;
    h += `<h3>Значение в точке <span class="m">x = ${radStr(m.ti * 15)}</span></h3><div class="steps">` +
      step('kx', `${num(k)} · ${radStr(m.ti * 15)} = ${radStr(k * m.ti * 15)}`) +
      step(`${m.fn} kx`, valStr(fv)) +
      step('y = A · ' + m.fn + ' kx + b', `${num(m.A)} · ${br(valStr(fv))} + ${m.b < 0 ? '(' + num(m.b) + ')' : num(m.b)} = ${valStr(m.y0)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">${m.match ? 'Графики совпали во всех точках.' : 'Наибольшее расхождение с пунктиром: ' + fmt(m.diff, 2) + '.'}</p>`;
  }
  const a = m.a;
  let h = `<h2>Решение уравнения</h2><div class="formula">${m.eq} x = ${m.aS}</div><div class="steps">`;
  if (Math.abs(a) > 1) h += step('|a| > 1', `|${m.aS}| > 1`) + step('вывод', 'решений нет', 'sum');
  else {
    const fn = m.eq === 'sin' ? 'arcsin' : 'arccos', base = Math.round((m.eq === 'sin' ? Math.asin(a) : Math.acos(a)) / RAD);
    let gen;
    if (m.eq === 'sin') gen = near(a, 0) ? 'x = πn' : near(a, 1) ? 'x = π/2 + 2πn' : near(a, -1) ? 'x = −π/2 + 2πn' : `x = (−1)ⁿ · ${base < 0 ? '(' + radStr(base) + ')' : radStr(base)} + πn`;
    else gen = near(a, 0) ? 'x = π/2 + πn' : near(a, 1) ? 'x = 2πn' : near(a, -1) ? 'x = π + 2πn' : `x = ±${radStr(base)} + 2πn`;
    h += step(`${fn}(${m.aS})`, radStr(base)) + step('общее решение, n ∈ Z', gen) + step('корни на [0; 2π)', m.roots.map(radStr).join('; '), 'sum');
  }
  h += `</div><h3>Ваши отметки</h3><div class="steps">` +
    step('отмечено', m.marks.length ? m.marks.map(radStr).join('; ') : '—') +
    step('корни / лишние', `${m.good} / ${m.bad}`, 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Чтобы получить корни на [0; 2π), подставляют в общее решение n = 0, 1, 2… и оставляют подходящие.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'unit') el.innerHTML = `<div class="k">Угол <span class="m">α</span></div><div class="v ${ok ? 'ok' : ''}">${radStr(m.a)}</div><div class="lr"><span>cos α</span><span>${valStr(m.c)}</span></div><div class="lr"><span>sin α</span><span>${valStr(m.s)}</span></div>`;
  else if (m.kind === 'form') el.innerHTML = `<div class="k">Точка <span class="m">α</span></div><div class="v ${ok ? 'ok' : ''}">${degStr(m.a)}</div><div class="lr"><span>cos α</span><span>${valStr(m.c)}</span></div><div class="lr"><span>sin α</span><span>${valStr(m.s)}</span></div>`;
  else if (m.kind === 'graph') el.innerHTML = `<div class="k">Ваш график</div><div class="v ${m.match ? 'ok' : ''}">${m.match ? 'совпал' : 'не совпал'}</div><div class="lr"><span>T</span><span>${periodStr(m.k)}</span></div><div class="lr"><span>E(y)</span><span>[${num(m.b - Math.abs(m.A))}; ${num(m.b + Math.abs(m.A))}]</span></div>`;
  else el.innerHTML = `<div class="k">Корней на <span class="m">[0; 2π)</span></div><div class="v ${ok ? 'ok' : ''}">${m.roots.length}</div><div class="lr"><span>отмечено</span><span>${m.marks.length}</span></div><div class="lr"><span>лишних</span><span class="${m.bad ? '' : 'ok'}">${m.bad}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Тригонометрия покорена!'), 700);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  unit: '<circle cx="22" cy="15" r="11" fill="none" stroke="#a9b4c9" stroke-width="1.2"/><path d="M22 15L30 7" stroke="#e8ecf4" stroke-width="1.4"/><path d="M22 15H30" stroke="#72d4e8" stroke-width="2"/><path d="M22 15V7" stroke="#b79cff" stroke-width="2"/><circle cx="30" cy="7" r="2.2" fill="#ffb547"/>',
  form: '<circle cx="22" cy="15" r="11" fill="none" stroke="#a9b4c9" stroke-width="1.2"/><path d="M22 15H29V6Z" fill="rgba(255,181,71,.3)" stroke="#ffb547" stroke-width="1"/><circle cx="15" cy="6" r="2.2" fill="#86e0a8"/><text x="48" y="19" font-size="9" fill="#86e0a8" text-anchor="middle" font-family="monospace">2α</text>',
  graph: '<path d="M2 15C7 3 12 3 17 15S27 27 32 15S42 3 47 15S57 27 64 15" fill="none" stroke="#72d4e8" stroke-width="1.6"/><path d="M2 15H64" stroke="#3a4660" stroke-width="1"/>',
  eq: '<circle cx="33" cy="15" r="11" fill="none" stroke="#a9b4c9" stroke-width="1.2"/><path d="M14 20H52" stroke="#ffb547" stroke-width="1.4"/><circle cx="23.5" cy="20" r="2.4" fill="#86e0a8"/><circle cx="42.5" cy="20" r="2.4" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'unit') now = `Единичная окружность. Радиус повёрнут на угол α = ${num(m.a)}° = ${radStr(m.a)} (${m.a >= 0 ? 'против часовой стрелки' : 'по часовой стрелке'}), четверть: ${quarter(m.a)}. Точка P(${valStr(m.c)}; ${valStr(m.s)}): cos α = ${valStr(m.c)}, sin α = ${valStr(m.s)}, tg α = ${tgStr(m.s, m.c)}. Линия тангенсов ${m.tgl ? 'включена' : 'выключена'}.`;
  if (id === 'form') now = `Единичная окружность. Точка α = ${degStr(m.a)} (${quarter(m.a)} четверть): cos α = ${valStr(m.c)}, sin α = ${valStr(m.s)}, tg α = ${tgStr(m.s, m.c)}. Выбрана формула для второй точки: ${MODES[m.mode].b} (${MODES[m.mode].fs.join('; ')}); вторая точка: угол ${degStr(norm(m.bA))}, sin = ${valStr(m.bs)}, cos = ${valStr(m.bc)}.`;
  if (id === 'graph') now = `Координатная плоскость, x от −2π до 2π. Пунктиром нарисован целевой график (его формулу ученик должен найти сам: максимум 1, минимум −3, период π — эти свойства видны на экране). График ученика: ${fnStr(m.fn, m.A, m.k, m.b)}, период ${periodStr(m.k)}, область значений [${num(m.b - Math.abs(m.A))}; ${num(m.b + Math.abs(m.A))}]; ${m.match ? 'совпадает с пунктиром' : 'не совпадает с пунктиром'}. Точка на графике: x = ${radStr(m.ti * 15)}, y = ${valStr(m.y0)}.`;
  if (id === 'eq') now = `Единичная окружность с делениями через 15°. Ученик настроил уравнение ${m.eq} x = ${m.aS} (${m.setOk ? 'верно сведено' : 'пока не то простейшее уравнение, к которому сводится 2 sin x + 1 = 0'}); у этого уравнения на [0; 2π) корней: ${m.roots.length}. Отмечено точек: ${m.marks.length}, из них корней настроенного уравнения ${m.good}, лишних ${m.bad}.`;
  return [
    `Раздел: математика, 10 класс, функции и анализ, тема «Тригонометрия». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (нужный угол, значение синуса, параметры A, k, b или корни уравнения): веди ученика наводящими вопросами и проверяй его вычисления.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    unit: 'Почему синус и косинус не бывают больше 1?', form: 'Как выбрать знак синуса, если известен косинус?',
    graph: 'Чем график косинуса отличается от графика синуса?', eq: 'Почему у sin x = a обычно два корня на одном обороте?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
