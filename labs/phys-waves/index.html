<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 9 класс: маятник, период и частота, резонанс, механические волны, звук.">
<title>Колебания и волны</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.reslist{display:grid;gap:4px;margin-top:10px;font:500 12.5px/1.3 var(--font-mono);color:var(--muted)}
.reslist .ok{color:var(--ok)}
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M5 20q4.5-11 9 0t9 0 9 0 4 0" fill="none" stroke="var(--arm)" stroke-width="2.4" stroke-linecap="round"/><path d="M12 6h16" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/><path d="M20 6l6 22" stroke="var(--fg)" stroke-width="1.4"/><circle cx="26" cy="29" r="4" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Колебания</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с колебаниями и волнами. Груз маятника и скалу можно тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : (Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? 1 : 2));
const big = x => Math.round(x).toLocaleString('ru-RU').replace('-', '−');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', C2 = '#c3a8ff', CP = '#ffb547', OK = '#86e0a8', RED = '#ff8a73', MUT = '#8b96ad';
const G = 9.81, DEG = Math.PI / 180;

const LESSONS = [
  { id: 'pendulum', title: 'Маятник: качели энергии',
    text: ['Колебания — это движение, которое повторяется через равные промежутки времени. Груз на нити качается около положения равновесия — точки, где он висел бы в покое.',
           'Наибольшее отклонение от положения равновесия называют амплитудой. В крайней точке груз на миг останавливается, а через положение равновесия пролетает быстрее всего.',
           'Энергия при этом переходит из одного вида в другой. В крайней точке у груза только потенциальная энергия Eп = mgh, внизу — только кинетическая Eк = mv²/2. Если трения нет, их сумма постоянна.'],
    why: 'Маятник — основа механических часов: мастер по ремонту часов регулирует ход, меняя длину маятника. Сейсмографы в Алматы, которые ловят землетрясения, тоже устроены как маятник. А сменять кинетическую энергию на потенциальную умеют все, кто качался на качелях: вы приседаете внизу и выпрямляетесь вверху, подкачивая энергию.',
    task: 'Отклоните груз хотя бы на 10° и отпустите. Поймайте стоп-кадром два момента: когда почти вся энергия кинетическая и когда почти вся потенциальная.',
    hint: 'Тяните груз мышкой или пальцем либо нажмите «Отклонить 30°». «Стоп-кадр» замораживает маятник, «Шаг» двигает его на восьмую часть периода. Почти вся — это не меньше 90 %.',
    stage: 'Тяните груз в сторону и отпустите.',
    m: 0.5, l: 1,
    check: m => m.snapK && m.snapP },
  { id: 'period', title: 'Период и частота',
    text: ['Период T — время одного полного колебания: туда и обратно. Его измеряют так: засекают время t нескольких колебаний N и делят: T = t / N. Чем больше колебаний, тем точнее.',
           'Частота ν (ню) — число колебаний за секунду: ν = N / t = 1 / T. Единица частоты — герц: 1 Гц — одно колебание в секунду.',
           'Период нитяного маятника при малых отклонениях зависит только от длины нити и ускорения свободного падения: T = 2π√(l / g). От массы груза и от амплитуды он не зависит.'],
    why: 'В старинных часах «секундный» маятник длиной около метра делает один размах за секунду. Врач считает пульс за 15 секунд и умножает на 4 — это измерение частоты. Частота нужна и электрику: в розетках Казахстана ток меняет направление с частотой 50 Гц. А вибродиагносты на заводах и ТЭЦ по частоте дрожания насоса находят поломку раньше, чем он сломается.',
    task: 'Подберите длину нити так, чтобы частота была 1 Гц, и проверьте секундомером. Потом получите частоту 0,5 Гц.',
    hint: 'Секундомер засекает 10 полных колебаний, ν = 10 / t. Длину меняйте кнопками «l −», «l +», ползунком или тяните груз вверх-вниз. Подумайте: во сколько раз изменится период, если длину увеличить в 4 раза?',
    stage: 'Тяните груз вверх-вниз — меняется длина нити.',
    l0: 0.6, amp: 10,
    check: m => m.hit1 && m.hit05 },
  { id: 'resonance', title: 'Резонанс',
    text: ['Колебания груза на пружине, которого толкнули и отпустили, называют свободными. Они идут с собственной частотой системы ν₀. Наша система — груз 0,5 кг на пружине жёсткостью 12,6 Н/м.',
           'Если точку подвеса двигать вверх-вниз мотором, колебания станут вынужденными: груз качается с частотой мотора, а не со своей.',

const LS_KEY = 'luch-phys-waves';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const P1 = { x: 260, y: 40, k: 210 };            // lesson 1: pivot, 1 m = 210 units
const P2 = { x: 260, y: 40, k: 140 };            // lesson 2: 1 m = 140 units
const R3 = { x: 130, wy: 150, sy: 190, my: 272, k: 400, px: [280, 492], py: [318, 128] };  // lesson 3: 1 m = 400 units (1 cm = 4)
const W4 = { x0: 52, k: 72, y: 205 };            // lesson 4: 1 m = 72 units
const E5 = { x0: 52, k: 1.35, gy: 372 };         // lesson 5: echo, 1 m = 1.35 units

function resetState() {
  const Ls = L();
  Object.assign(S, {
    // lesson 1
    th: 0, om: 0, run: false, paused: false, tRun: 0, amp: 0, snapK: false, snapP: false,
    // lesson 2
    l: Ls.l0 || 0.6, mass: 0.2, meas: null, results: [], hit1: false, hit05: false, speed: 1,
    // lesson 3
    x: 0, v: 0, ph: 0, t: 0, nu: Ls.nuStart || 1, tChange: 0, hist: [], pts: {},
    // lesson 4
    med: 'soft', mode: 'trans', wt: 0, sawLong: false, hitsL: {},
    // lesson 5
    fi: Ls.fi0 || 6, vol: 60, d: Ls.d0 || 100, pulse: null, echoT: null, lam: false, echo: false,
    hl: null,
  });
  if (Ls.id === 'period') { S.th = Ls.amp * DEG; }
}
resetState();

// ---------- physics ----------
function pendStep(dt, l) {                       // θ'' = −(g/l)·sin θ, symplectic Euler
  const n = Math.max(1, Math.ceil(dt / 0.001)), h = dt / n;
  for (let i = 0; i < n; i++) { S.om += -G / l * Math.sin(S.th) * h; S.th += S.om * h; }
}
const T0 = l => 2 * Math.PI * Math.sqrt(l / G);
const E1 = () => { const Ls = LESSONS[0], h = Ls.l * (1 - Math.cos(S.th)), v = Ls.l * S.om; return { h, v, Ep: Ls.m * G * h, Ek: Ls.m * v * v / 2 }; };

const RZ = () => LESSONS[2];
const w0 = () => Math.sqrt(RZ().k / RZ().m);
const nu0 = () => w0() / (2 * Math.PI);
function Ass(nu) { const R = RZ(), w = 2 * Math.PI * nu, W = w0(); return W * W * R.a / Math.hypot(W * W - w * w, 2 * R.beta * w); }
function resStep(dt) {
  const R = RZ(), W2 = w0() ** 2, w = 2 * Math.PI * S.nu;
  const n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
  for (let i = 0; i < n; i++) {
    S.ph += w * h;
    const xs = R.a * Math.cos(S.ph);
    S.v += (-W2 * (S.x - xs) - 2 * R.beta * S.v) * h; S.x += S.v * h; S.t += h;
  }
  S.hist.push([S.t, Math.abs(S.x)]);
  while (S.hist.length && S.hist[0][0] < S.t - 6) S.hist.shift();
}
function env() {
  if (reduce) return Ass(S.nu);
  const win = Math.max(1 / S.nu, 0.5) * 1.1; let mx = 0;
  for (const [t, a] of S.hist) if (t >= S.t - win) mx = Math.max(mx, a);
  return mx;
}
function settled() {
  if (reduce) return true;
  const A = Ass(S.nu), since = S.t - S.tChange;
  return since > Math.max(3, 1.2 / S.nu) && Math.abs(env() - A) / A < 0.06;
}

const v4 = () => L().media ? L().media[S.med] : 2;
const lam4 = () => v4() / S.nu;
const f5 = () => LESSONS[4].freqs[S.fi];
const lam5 = () => LESSONS[4].v / f5();

function model() {
  const id = LID();
  if (id === 'pendulum') { const e = E1(); return { kind: id, th: S.th / DEG, amp: S.amp / DEG, ...e, E: e.Ep + e.Ek, snapK: S.snapK, snapP: S.snapP }; }
  if (id === 'period') { const r = S.results[S.results.length - 1] || null; return { kind: id, l: S.l, T: T0(S.l), last: r, hit1: S.hit1, hit05: S.hit05 }; }
  if (id === 'resonance') return { kind: id, nu: S.nu, nu0: nu0(), A: env(), Ass: Ass(S.nu), set: settled(), pts: Object.keys(S.pts).length, peak: S.pts['0.80'] !== undefined };
  if (id === 'waves') return { kind: id, v: v4(), nu: S.nu, lam: lam4(), T: 1 / S.nu, media: Object.keys(S.hitsL).length, long: S.sawLong };
  return { kind: id, nu: f5(), lam: lam5(), d: S.d, tE: 2 * S.d / LESSONS[4].v, echoT: S.echoT, lamOK: S.lam, echo: S.echo };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function arrow(x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L2 = Math.hypot(x2 - x1, y2 - y1); if (L2 < 1) return '';
  const hl = Math.min(12, L2 * 0.8), hx = x2 - hl * Math.cos(a), hy = y2 - hl * Math.sin(a);
  const p1 = `${(hx + 6 * Math.sin(a)).toFixed(1)} ${(hy - 6 * Math.cos(a)).toFixed(1)}`, p2 = `${(hx - 6 * Math.sin(a)).toFixed(1)} ${(hy + 6 * Math.cos(a)).toFixed(1)}`;
  return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linecap="round"/><path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1}L${p2}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
}
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#2e3b57" stroke-width="3"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const ceiling = (x1, x2, y) => `<rect x="${x1}" y="${y - 12}" width="${x2 - x1}" height="12" fill="url(#hatch)"/><path d="M${x1} ${y}H${x2}" stroke="#4a5876" stroke-width="2.4"/>`;
const ground = y => `<rect x="-2000" y="${y}" width="4520" height="1200" fill="#151e2e"/><rect x="-2000" y="${y}" width="4520" height="12" fill="url(#hatch)"/><path d="M-2000 ${y}H2520" stroke="#3a4762" stroke-width="2"/>`;
const bob = (x, y, r, col, drag) => `<g ${drag ? `data-drag="${drag}"` : ''}><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r + 14}" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2.2"/><circle cx="${(x - r * 0.35).toFixed(1)}" cy="${(y - r * 0.35).toFixed(1)}" r="${(r * 0.28).toFixed(1)}" fill="#fff" opacity=".35"/></g>`;
const panel = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#121a28" stroke="#26324a"/>`;

// ---------- lesson 1: pendulum and energy ----------
function pendulumScene() {
  const Ls = L(), k = P1.k, Lu = Ls.l * k, bx = P1.x + Lu * Math.sin(S.th), by = P1.y + Lu * Math.cos(S.th), e = E1(), E = e.Ep + e.Ek;
  let h = ceiling(200, 320, P1.y);
  h += `<path d="M${P1.x} ${P1.y}V${P1.y + Lu + 34}" stroke="#3a4762" stroke-dasharray="4 5"/>` + T(P1.x + 6, P1.y + Lu + 46, 9, MUT, 'положение равновесия', 'middle');
  if (S.amp > 0.5 * DEG) {
    const a = S.amp, x1 = P1.x - Lu * Math.sin(a), y1 = P1.y + Lu * Math.cos(a), x2 = P1.x + Lu * Math.sin(a);
    h += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${Lu} ${Lu} 0 0 0 ${x2.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${C2}" stroke-width="1.4" stroke-dasharray="3 5" opacity=".8"/>`;
    h += T(x2 + 8, y1 - 6, 10, C2, `${fmt(a / DEG, 0)}°`, 'start', halo);
  }
  // height above the lowest point
  if (Math.abs(S.th) > 2 * DEG) {
    const ly = P1.y + Lu, hx = bx + (S.th > 0 ? 26 : -26);
    h += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)}H${hx.toFixed(1)}M${P1.x} ${ly}H${hx.toFixed(1)}" stroke="${CP}" stroke-width="1" stroke-dasharray="2 3"/>` + `<path d="M${hx.toFixed(1)} ${by.toFixed(1)}V${ly}" stroke="${CP}" stroke-width="1.6"/>`;
    h += T(hx + (S.th > 0 ? 6 : -6), (by + ly) / 2 + 4, 10, CP, `h = ${fmt(e.h * 100, 0)} см`, S.th > 0 ? 'start' : 'end', halo);
  }
  h += `<path d="M${P1.x} ${P1.y}L${bx.toFixed(1)} ${by.toFixed(1)}" stroke="#c9d1e0" stroke-width="1.6"/><circle cx="${P1.x}" cy="${P1.y}" r="3.5" fill="#c9d1e0"/>`;
  // velocity (tangent)
  const vs = e.v * 26;
  if (Math.abs(vs) > 2) h += arrow(bx, by, bx + vs * Math.cos(S.th), by - vs * Math.sin(S.th), C1, 2.6);
  h += bob(bx, by, 16, '#d6dbe6', 'bob1');
  // energy bars
  const py = 290, Em = 1.5, kx = 300 / Em, x0 = 130;
  h += panel(24, py, 472, 108);
  const row = (y, lab, val, col) => `${T(40, y + 9, 10.5, col, lab, 'start')}<rect x="${x0}" y="${y}" width="300" height="11" rx="3" fill="#1a2438"/>` + (val > 1e-4 ? `<rect x="${x0}" y="${y}" width="${(val * kx).toFixed(1)}" height="11" rx="3" fill="${col}"/>` : '') + T(482, y + 9, 10, col, `${fmt(val, 2)} Дж`, 'end');
  h += row(py + 14, 'Eп = mgh', e.Ep, CP) + row(py + 36, 'Eк = mv²/2', e.Ek, C1) + row(py + 58, 'E = Eп + Eк', E, OK);
  const share = E > 1e-6 ? Math.round(e.Ek / E * 100) : 0;
  h += T(40, py + 94, 10, MUT, E > 1e-6 ? `кинетическая ${share} % · потенциальная ${100 - share} %${S.paused ? ' · стоп-кадр' : ''}` : 'груз висит неподвижно: энергии колебаний нет', 'start');
  return h;
}

// ---------- lesson 2: period and frequency ----------
function periodScene() {
  const Lu = S.l * P2.k, bx = P2.x + Lu * Math.sin(S.th), by = P2.y + Lu * Math.cos(S.th), r = 8 + S.mass * 22;

  h += `<path d="M${rx - 4} ${(P2.y + Lu).toFixed(1)}h-${(rx - 4 - P2.x - 22).toFixed(1)}" stroke="${CP}" stroke-dasharray="3 4"/>` + T(rx - 6, P2.y + Lu - 5, 10, CP, `l = ${fmt(S.l, 2)} м`, 'end', halo);
  h += `<path d="M${P2.x} ${P2.y}L${bx.toFixed(1)} ${by.toFixed(1)}" stroke="#c9d1e0" stroke-width="1.6"/><circle cx="${P2.x}" cy="${P2.y}" r="3.5" fill="#c9d1e0"/>`;
  h += bob(bx, by, r, '#d6dbe6', 'bob2') + T(bx, by + 3.5, 9, INK, `${fmt(S.mass * 1000, 0)} г`, 'middle', 'font-weight="500" pointer-events="none"');

  const tt = mt ? mt.t : (S.results.length ? S.results[S.results.length - 1].t10 : 0), ang = tt / 60 * 2 * Math.PI;
  h += `<path d="M${sx + 30} ${sy + 40}L${(sx + 30 + 16 * Math.sin(ang)).toFixed(1)} ${(sy + 40 - 16 * Math.cos(ang)).toFixed(1)}" stroke="${CP}" stroke-width="2"/>`;
  h += T(sx + 60, sy + 34, 17, mt ? CP : '#e8ecf4', `${fmt(tt, 2)} с`, 'start', 'font-weight="500"');
  h += T(sx + 60, sy + 52, 10, MUT, mt ? `колебаний ${mt.n} из 10` : (S.results.length ? '10 колебаний' : 'секундомер'), 'start');
  const last = S.results[S.results.length - 1];
  h += T(sx + 12, sy + 80, 10.5, last && !mt ? OK : MUT, last && !mt ? `ν = 10 / ${fmt(last.t10, 2)} = ${fmt(last.nu, 3)} Гц` : (mt ? 'считаем…' : 'нажмите «Секундомер»'), 'start');
  // results
  h += panel(300, 330, 196, 68) + T(312, 346, 9.5, MUT, 'последние замеры', 'start');
  S.results.slice(-3).reverse().forEach((r, i) => { h += T(312, 362 + i * 13, 10, i ? MUT : '#e8ecf4', `l ${fmt(r.l, 2)} м → ν ${fmt(r.nu, 3)} Гц`, 'start'); });
  return h;
}

// ---------- lesson 3: resonance ----------
function spring(x, y1, y2, w = 12, n = 10) {
  let d = `M${x} ${y1}v6`; const st = (y2 - y1 - 12) / n;
  for (let i = 0; i < n; i++) d += `L${x + (i % 2 ? -w : w)} ${(y1 + 6 + st * (i + 0.5)).toFixed(1)}`;
  d += `L${x} ${(y2 - 6).toFixed(1)}V${y2.toFixed(1)}`;
  return `<path d="${d}" fill="none" stroke="#c9d1e0" stroke-width="1.8" stroke-linejoin="round"/>`;
}
function resonanceScene() {
  const R = L(), k = R3.k, xs = R.a * Math.cos(S.ph), cx = R3.x;
  let h = '';
  // motor with Scotch yoke
  const wy = R3.wy, pinX = cx + R.a * k * Math.sin(S.ph), pinY = wy + R.a * k * Math.cos(S.ph);

}

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'pendulum') {
    const th = S.th / DEG;
    return `<h2>Энергия маятника</h2><div class="formula">E = Eп + Eк = const</div><p class="note">m = 0,5 кг, l = 1 м, g = 9,81 м/с². Высоту h считаем от самой нижней точки.</p>
      <h3>Сейчас</h3><div class="steps">` + step('угол', `${fmt(th, 1)}°`) + step('высота', `h = l(1 − cos θ) = ${fmt(m.h, 3)} м`) + step('Eп', `0,5 × 9,81 × ${fmt(m.h, 3)} = ${fmt(m.Ep, 3)} Дж`) +
      step('скорость', `v = ${fmt(Math.abs(m.v), 2)} м/с`) + step('Eк', `0,5 × ${fmt(Math.abs(m.v), 2)}² / 2 = ${fmt(m.Ek, 3)} Дж`) + step('сумма', `E = ${fmt(m.E, 3)} Дж`, 'sum') + `</div>` +
      (S.amp > 0 ? `<h3>Скорость внизу</h3><div class="steps">` + step('высота в крайней точке', `h₀ = ${fmt(LESSONS[0].l * (1 - Math.cos(S.amp)), 3)} м`) + step('Eп = Eк', 'mgh₀ = mv²/2') + step('v = √(2gh₀)', `${fmt(Math.sqrt(2 * G * LESSONS[0].l * (1 - Math.cos(S.amp))), 2)} м/с`, 'sum') + `</div>` : '');
  }
  if (id === 'period') {
    const r = m.last;
    return `<h2>Период и частота</h2><div class="formula">T = t / N   ν = 1 / T</div><div class="formula">T = 2π√(l / g)</div><p class="note">Формула верна для малых углов. Масса груза в неё не входит.</p>` +
      (r ? `<h3>Последний замер</h3><div class="steps">` + step('длина', `l = ${fmt(r.l, 2)} м`) + step('время 10 колебаний', `t = ${fmt(r.t10, 2)} с`) + step('период', `T = ${fmt(r.t10, 2)} / 10 = ${fmt(r.T, 3)} с`) + step('частота', `ν = 1 / ${fmt(r.T, 3)} = ${fmt(r.nu, 3)} Гц`, 'sum') + `</div>` : '<p class="note">Нажмите «Секундомер», и здесь появится расчёт по замеру.</p>') +
      `<h3>По формуле для l = ${fmt(S.l, 2)} м</h3><div class="steps">` + step('√(l / g)', `√(${fmt(S.l, 2)} / 9,81) = ${fmt(Math.sqrt(S.l / G), 3)} с`) + step('T = 2π · …', `${fmt(m.T, 3)} с`) + step('ν = 1 / T', `${fmt(1 / m.T, 3)} Гц`, 'sum') + `</div>
      <h3>Как подобрать длину</h3><p class="note">Из T = 2π√(l / g) следует l = g·T² / (4π²). Период растёт как корень из длины: длина в 4 раза больше — период в 2 раза больше.</p>`;
  }
  if (id === 'resonance') {
    const R = Ls, W = w0();
    return `<h2>Резонанс</h2><div class="formula">ν₀ = (1 / 2π) · √(k / m)</div><p class="note">Собственная частота зависит только от пружины и груза.</p>
      <h3>Собственная частота</h3><div class="steps">` + step('k / m', `${nf(R.k)} / ${nf(R.m)} = ${fmt(R.k / R.m, 1)} 1/с²`) + step('√(k / m)', `${fmt(W, 2)} рад/с`) + step('ν₀', `${fmt(W, 2)} / 6,28 = ${fmt(nu0(), 2)} Гц`, 'sum') + `</div>
      <h3>Сейчас</h3><div class="steps">` + step('частота мотора', `${fmt(S.nu, 2)} Гц`) + step('отношение ν / ν₀', fmt(S.nu / nu0(), 2)) + step('размах груза', `${fmt(m.A * 100, 1)} см`) + step('размах подвеса', '2 см') + step('усиление', `${fmt(m.A / R.a, 1)} раза`, 'sum') + `</div>` +
      (Object.keys(S.pts).length ? `<h3>Записанные точки</h3><div class="steps">` + Object.keys(S.pts).sort().map(k => step(`${fmt(+k, 2)} Гц`, `${fmt(S.pts[k] * 100, 1)} см`)).join('') + `</div>` : '') +
      `<p class="note" style="margin-top:10px">Чем меньше трение, тем выше и острее пик резонанса.</p>`;
  }
  if (id === 'waves') return `<h2>Длина волны</h2><div class="formula">λ = v · T = v / ν</div><p class="note">За один период T волна проходит ровно одну длину волны.</p>
    <h3>Сейчас</h3><div class="steps">` + step('скорость волны', `v = ${nf(m.v)} м/с (${S.med === 'soft' ? 'мягкий' : 'тугой'} шнур)`) + step('частота', `ν = ${nf(S.nu)} Гц`) + step('период', `T = 1 / ${nf(S.nu)} = ${nf(m.T)} с`) + step('длина волны', `λ = ${nf(m.v)} / ${nf(S.nu)} = ${nf(m.lam)} м`, 'sum') + `</div>
    <h3>Цель λ = 1 м</h3><div class="steps">` + step('нужная частота', 'ν = v / λ = ?') + Object.keys(S.hitsL).map(k => step(k === 'soft' ? 'мягкий шнур' : 'тугой шнур', 'найдено ✓')).join('') + `</div>`;
  const tE = m.tE;
  return `<h2>Звук</h2><div class="formula">λ = v / ν</div><div class="formula">s = v · t / 2</div><p class="note">v ≈ 340 м/с — скорость звука в воздухе.</p>
    <h3>Генератор</h3><div class="steps">` + step('частота', `ν = ${big(m.nu)} Гц`) + step('период', `T = 1 / ν = ${m.nu >= 1000 ? fmt(1000 / m.nu, 3) + ' мс' : fmt(1 / m.nu * 1000, 1) + ' мс'}`) + step('длина волны', `λ = 340 / ${big(m.nu)} = ${nf(m.lam)} м`, 'sum') + `</div>
    <h3>Эхо</h3><div class="steps">` + step('путь звука', `2s = 2 × ${S.d} = ${2 * S.d} м`) + step('время', `t = 2s / v = ${2 * S.d} / 340 = ${fmt(tE, 2)} с`, 'sum') + step('обратная задача', 's = v · t / 2 = ?') + `</div>`;
}

  else if (id === 'period') el.innerHTML = `<div class="k">Последний замер</div><div class="v ${m.last && (Math.abs(m.last.nu - 1) < 0.01 || Math.abs(m.last.nu - 0.5) < 0.005) ? 'ok' : ''}">ν = ${m.last ? fmt(m.last.nu, 3) : '—'} Гц</div><div class="lr"><span>T</span><span>${m.last ? fmt(m.last.T, 3) + ' с' : '—'}</span></div><div class="lr"><span>l</span><span>${fmt(S.l, 2)} м</span></div>`;
  else if (id === 'resonance') el.innerHTML = `<div class="k">Размах груза</div><div class="v ${m.set ? 'ok' : ''}">${fmt(m.A * 100, 1)} см</div><div class="lr"><span>ν</span><span>${fmt(S.nu, 2)} Гц</span></div><div class="lr"><span>точек</span><span>${m.pts}</span></div>`;
  else if (id === 'waves') el.innerHTML = `<div class="k">Волна</div><div class="v ${Math.abs(m.lam - 1) < 1e-9 ? 'ok' : ''}">λ = ${nf(m.lam)} м</div><div class="lr"><span>v</span><span>${nf(m.v)} м/с</span></div><div class="lr"><span>ν</span><span>${nf(S.nu)} Гц</span></div>`;
  else el.innerHTML = `<div class="k">Звук</div><div class="v ${m.nu === 680 ? 'ok' : ''}">λ = ${nf(m.lam)} м</div><div class="lr"><span>ν</span><span>${big(m.nu)} Гц</span></div><div class="lr"><span>эхо</span><span>${S.echoT !== null ? fmt(S.echoT, 2) + ' с' : '—'}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как колебания становятся волнами и звуком!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  if (LID() === 'waves' && reduce) S.wt = 30;
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // centre the active card by scrolling only the strip, never the page
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

  if (id === 'period') now = `Нитяной маятник с отклонением 10°, длина нити ${fmt(S.l, 2)} м, масса груза ${fmt(S.mass * 1000, 0)} г. ${S.meas ? `Идёт замер 10 колебаний: ${fmt(S.meas.t, 1)} с, колебаний ${S.meas.n}.` : ''} Замеры: ${S.results.length ? S.results.slice(-4).map(r => `l = ${fmt(r.l, 2)} м → ν = ${fmt(r.nu, 3)} Гц`).join('; ') : 'пока не было'}. Частота 1 Гц ${S.hit1 ? 'получена' : 'не получена'}, 0,5 Гц ${S.hit05 ? 'получена' : 'не получена'}. Нужные длины не называй — наводи вопросами про T = 2π√(l/g) и про то, как период зависит от длины.`;
  if (id === 'resonance') now = `Груз 0,5 кг на пружине 12,6 Н/м, мотор двигает подвес на ±2 см с частотой ${fmt(S.nu, 2)} Гц. Размах груза сейчас ${fmt(m.A * 100, 1)} см, колебания ${m.set ? 'установились' : 'ещё меняются'}. Записанные точки резонансной кривой: ${Object.keys(S.pts).length ? Object.keys(S.pts).sort().map(k => `${fmt(+k, 2)} Гц → ${fmt(S.pts[k] * 100, 1)} см`).join('; ') : 'нет'}. Резонансная точка ${m.peak ? 'записана' : 'не записана'}. Собственную частоту прямо не называй — подскажи, что её можно посчитать по формуле ν₀ = √(k/m)/2π или найти по самому большому размаху.`;
  if (id === 'waves') now = `Волна на ${S.med === 'soft' ? 'мягком шнуре (2 м/с)' : 'тугом шнуре (4 м/с)'}, вид — ${S.mode === 'trans' ? 'поперечная' : 'продольная'}, частота вибратора ${nf(S.nu)} Гц, длина волны ${nf(m.lam)} м. λ = 1 м получена на шнурах: ${Object.keys(S.hitsL).length ? Object.keys(S.hitsL).map(k => k === 'soft' ? 'мягком' : 'тугом').join(', ') : 'пока ни на одном'}; продольную волну ${S.sawLong ? 'смотрели' : 'ещё не смотрели'}. Нужные частоты не называй — наводи вопросами про λ = v/ν.`;
  if (id === 'sound') now = `Генератор звука: частота ${big(m.nu)} Гц, громкость ${S.vol} %, длина волны в воздухе ${nf(m.lam)} м. Скала на расстоянии ${S.d} м, ${S.echoT !== null ? `последнее эхо пришло через ${fmt(S.echoT, 2)} с` : 'хлопка ещё не было'}. λ = 0,5 м ${S.lam ? 'получена' : 'не получена'}, эхо через 1 с ${S.echo ? 'получено' : 'не получено'}. Готовые числа (частоту и расстояние) не называй — наводи вопросами про λ = v/ν и путь звука туда и обратно.`;
  return [
    `Раздел: физика, 9 класс, механика, тема «Колебания и волны». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { pendulum: 'Почему маятник не останавливается внизу, где у него нет высоты?', period: 'Почему период не зависит от массы груза?', resonance: 'Почему мост может разрушиться от резонанса?', waves: 'Чем поперечная волна отличается от продольной?', sound: 'Почему в космосе не слышно звуков?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
