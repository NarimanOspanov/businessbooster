<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 10 класс: словари и множества, классы и объекты, работа с файлами в Python.">
<title>Структуры данных и ООП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="c-"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .val{font:500 12px var(--font-mono);color:var(--fg);padding:0 4px;white-space:nowrap}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing .cur{color:var(--force)}
.listing .bad{color:var(--warn)}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 340px);min-height:0}
  .stage.tall{height:calc(80vw + 430px)}
  .stage.tall2{height:calc(80vw + 520px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M15 9c-4 0-4 3-4 6s-1 5-4 5c3 0 4 2 4 5s0 6 4 6" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/><path d="M25 9c4 0 4 3 4 6s1 5 4 5c-3 0-4 2-4 5s0 6-4 6" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="16" r="2.6" fill="var(--force)"/><circle cx="20" cy="24" r="2.6" fill="var(--arm)"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Информатика · Структуры данных и ООП</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>ООП</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: код на Python и его результат"></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Управление" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'dict', title: 'Словари и множества',
    text: ['Словарь (dict) хранит пары «ключ — значение». Значение находят сразу по ключу, без перебора всего списка: counts[\'чай\'] — и ответ готов. Ключи в словаре не повторяются, а значения могут быть любыми.',
           'Метод get(w, 0) возвращает значение по ключу, а если такого ключа ещё нет — 0. Поэтому строка counts[w] = counts.get(w, 0) + 1 — классический способ посчитать, сколько раз встречается каждый элемент.',
           'Множество (set) — набор без повторов и без определённого порядка. Проверка «x in seen» работает очень быстро. Для множеств есть операции: | — объединение, & — пересечение, - — разность.'],
    why: 'Словари и множества — рабочие инструменты аналитика данных и backend-разработчика. Маркетплейсы и сети магазинов в Казахстане считают продажи именно так: товар — ключ, количество — значение. Множества находят общих клиентов двух филиалов или убирают дубли из базы телефонов. Python-разработчики и аналитики данных — одни из самых востребованных IT-специалистов, а начать можно с таких маленьких скриптов для своего же магазина или кружка.',
    task: 'Обработайте все 10 заказов, нажмите в словаре на самый популярный товар, а затем найдите товары, которые покупали и вчера, и сегодня.',
    hint: 'Кнопка «Шаг» выполняет одну итерацию цикла. Подумайте, какая операция оставляет только общие элементы двух множеств.',
    stage: 'Нажимайте «Шаг» — цикл возьмёт следующий заказ.',
    nOrders: 10,
    check: m => m.di === m.total && m.pick === m.maxKey && m.op === '&' },
  { id: 'cls', title: 'Классы и объекты',
    text: ['Класс — это чертёж. Он описывает, какие данные (атрибуты) и какие действия (методы) будут у объектов. Объект — конкретный экземпляр, созданный по чертежу: r1 = Robot(\'Алу\').',
           'Метод __init__ вызывается при создании объекта и задаёт начальные атрибуты. Параметр self — это «сам объект»: self.x у робота Алу и self.x у робота Бота — разные переменные.',
           'Метод меняет состояние только своего объекта. Вызов r1.charge() заряжает Алу, а у других роботов энергия не меняется. Поэтому программа даже из тысяч объектов остаётся понятной.'],
    why: 'На классах построены почти все крупные программы. В игре каждый персонаж — объект со здоровьем и методами «атаковать» и «лечиться». В банковском приложении счёт — объект с балансом и методами «пополнить» и «снять». В службе доставки курьер, заказ и маршрут — тоже объекты. Разработчики игр, мобильных приложений и серверов пользуются ООП каждый день, и на собеседовании junior-разработчика о нём спрашивают почти всегда.',
    task: 'Создайте двух роботов и доведите обоих до финиша x = 12. Энергии на старте хватает только на 5 шагов.',
    hint: 'Нажмите на дорожку, чтобы выбрать робота: методы вызываются у выбранного объекта. Шаг стоит 10 единиц энергии. Когда энергии мало, вызовите charge().',
    stage: 'Нажмите на дорожку, чтобы выбрать объект.',
    finish: 12, e0: 50, cost: 10, maxObj: 3,
    check: m => m.atFinish >= 2 },
  { id: 'files', title: 'Работа с файлами',
    text: ['Переменные живут, пока работает программа. Чтобы данные сохранились, их записывают в файл. Функция open(имя, режим) открывает файл и возвращает файловый объект.',
           'Режим решает многое: \'r\' — чтение, \'w\' — запись с нуля (старое содержимое стирается сразу при открытии!), \'a\' — дозапись в конец файла. Если открыть файл не в том режиме, Python остановится с ошибкой.',

function dictState() {
  const counts = new Map();
  for (const w of ORDERS.slice(0, S.di)) counts.set(w, (counts.get(w) || 0) + 1);
  let maxKey = null, mx = 0;
  for (const [k, v] of counts) if (v > mx) { mx = v; maxKey = k; }
  return { counts, keys: [...counts.keys()], maxKey, mx };
}
function opResult(op, seen) {
  if (op === '|') return seen.concat(YEST.filter(w => !seen.includes(w)));
  if (op === '&') return seen.filter(w => YEST.includes(w));
  if (op === '-') return seen.filter(w => !YEST.includes(w));

}

function buildTrace() {
  let marks = S.marks.slice(), report = S.report.slice(), total, count, avg;
  const ev = [];
  const snap = (line, x) => ev.push(Object.assign({ line, total, count, avg, marks: marks.slice(), report: report.slice(), cur: -1 }, x || {}));
  total = 0; snap(0);
  count = 0; snap(1);
  if (S.mR === 'w') marks = [];
  snap(2, { note: S.mR === 'w' ? 'marks.txt открыт в режиме w — всё содержимое стёрто' : S.mR === 'r' ? 'marks.txt открыт для чтения' : 'marks.txt открыт для дозаписи' });
  if (S.mR !== 'r') { snap(3, { err: 'io.UnsupportedOperation: not readable', note: 'файл открыт не для чтения' }); return ev; }
  marks.forEach((ln, i) => {
    const p = ln.split(' ');
    snap(3, { cur: i, note: `line = '${ln}'` });
    snap(4, { cur: i, note: `name = '${p[0]}', mark = '${p[1]}'` });
    total += +p[1]; snap(5, { cur: i, note: `total = ${total - p[1]} + ${p[1]} = ${total}` });
    count += 1; snap(6, { cur: i, note: `count = ${count}` });
  });
  if (!marks.length) snap(3, { note: 'файл пуст — цикл не выполнился ни разу' });
  if (count === 0) { snap(7, { err: 'ZeroDivisionError: division by zero', note: 'делить на count = 0 нельзя' }); return ev; }
  avg = total / count; snap(7, { note: `avg = ${total} / ${count} = ${avg}` });
  if (S.mW === 'w') report = [];
  snap(8, { note: S.mW === 'w' ? 'report.txt открыт в режиме w — старый текст стёрт' : S.mW === 'a' ? 'report.txt открыт для дозаписи в конец' : 'report.txt открыт только для чтения' });
  if (S.mW === 'r') { snap(9, { err: 'io.UnsupportedOperation: not writable', note: 'в файл, открытый для чтения, писать нельзя' }); return ev; }
  report.push('Средний балл: ' + avg.toFixed(1)); snap(9, { note: `записано: Средний балл: ${avg.toFixed(1)}` });
  return ev;
}

function fileCard(R, name, lines, part, opts) {

  h += `<text x="${R.x + 9}" y="${R.y + 14}" font-size="9" fill="#e8ecf4" font-weight="500">${name}</text>`;

}
function drawFiles() {

  h += fileCard(FR, 'report.txt', S.report, 'report', { lit: S.run && v && v.line >= 8, mode: S.run && v && v.line >= 8 ? S.mW : '', fresh: v && v.line === 9 && !v.err });

}

function hlBoxes(id) {
  const id0 = LID(), c = CODE(), lineBox = (a, b) => { const r1 = CLINE(a), r2 = CLINE(b); return [c.x, r1.y - 2, c.w, r2.y + r2.h - r1.y + 4]; };
  if (id0 === 'dict') {
    if (id === 'orders') { const a = CHIP(0), b = CHIP(ORDERS.length - 1); return [[a.x - 4, a.y - 4, (NAR ? 302 : b.x + b.w - a.x) + 8, b.y + b.h - a.y + 8]]; }
    if (id === 'dict') { const D = DBOX(); return [[D.x, D.y, D.w, D.h]]; }
    if (id === 'key') { const D = DBOX(); return [[D.x + 8, D.y + 22, NAR ? 110 : 100, Math.max(1, dictState().keys.length) * D.rh + 6]]; }
    if (id === 'seen') { const V = VENN(); return [[V.a - V.r - 4, V.cy - V.r - 20, V.r * 2 + 8, V.r * 2 + 24]]; }
    if (id === 'ops') { const V = VENN(); return [[NAR ? 0 : 258, V.ry - 14, NAR ? 302 : 258, 36]]; }
    if (id === 'loop') return [lineBox(2, 4)];
    return [];
  }
  if (id0 === 'cls') {
    if (id === 'class') return [[c.x, c.y, c.w, c.h]];
    if (id === 'init') return [lineBox(1, 4)];
    if (id === 'method') return [lineBox(6, 11), lineBox(13, 14)];
    if (id === 'object') return S.objs.map((o, k) => { const R = LANE(k); return [R.x - 3, R.y - 3, R.w + 6, R.h + 6]; });
    if (id === 'attr') return S.objs.map((o, k) => { const R = LANE(k); return [R.x + 4, R.y + R.h - 20, R.w - 80, 18]; });
    if (id === 'self') return [lineBox(2, 4)];
    return [];
  }
  if (id === 'open') return [lineBox(2, 2), lineBox(8, 8)];
  if (id === 'loop') return [lineBox(3, 6)];
  if (id === 'marks') { const R = FMARKS(); return [[R.x - 4, R.y - 4, R.w + 8, R.h + 8]]; }
  if (id === 'report') { const R = FREP(); return [[R.x - 4, R.y - 4, R.w + 8, R.h + 8]]; }
  if (id === 'write') return [lineBox(9, 9)];
  if (id === 'with') return [lineBox(2, 2), lineBox(8, 8)];
  return [];
}

function drawScene(t) {
  const id = LID();

}

// fit the scene under the task box when there is room
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const nar = w < 560; if (nar !== NAR) { NAR = nar; }
  $('#stage').classList.toggle('tall2', NAR && LID() !== 'files');
  const B = BOUNDS(), cw = B.x1 - B.x0 + 8, ch = B.y1 - 80 + 4;
  const tb = $('#taskBox').getBoundingClientRect(), mt = $('#meter').getBoundingClientRect();
  const topPx = Math.max(tb.bottom, mt.bottom) - rc.top + 8;
  const s = Math.min(w / cw, Math.max((hh - topPx) / ch, hh / (ch * 1.6)), 1.5);
  VB = { w: w / s, h: hh / s }; VB.x = (B.x0 + B.x1) / 2 - VB.w / 2;
  VB.y = 80 - topPx / s;
  const slack = VB.y + VB.h - (B.y1 + 2);
  VB.y = slack < 0 ? B.y1 + 2 - VB.h : VB.y - slack / 2;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer: taps on dict keys, set items, lanes, mode tokens ----------
let dirty = true, tap = null;
scene.addEventListener('pointerdown', e => {

});
scene.addEventListener('pointerup', e => {

  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12) return;
  const kind = d.tag.slice(0, 2), arg = d.tag.slice(2);

  if (kind === 's-') { const inS = dictState().keys.includes(arg); toast(`'${arg}' in seen → ${inS ? 'True' : 'False'}`); }
  if (kind === 'o-') { S.sel = +arg; toast(`Выбран объект r${+arg + 1} (${S.objs[+arg].name}). Теперь методы вызываются у него.`); update(); }
  if (kind === 'n-') createObj();
  if (kind === 'x-') toast('Сначала создайте предыдущий объект.');

scene.addEventListener('pointercancel', () => { tap = null; });

// ---------- actions ----------
function stepDict(all) {
  if (S.di >= ORDERS.length) { toast('Все заказы уже обработаны. Цикл for закончился.'); return; }
  if (all) S.di = ORDERS.length; else S.di++;
  S.flashLine = performance.now();
  const w = ORDERS[S.di - 1], c = dictState().counts.get(w);
  if (!all) toast(c === 1 ? `'${w}' — новый ключ: get вернул 0, стало 1. seen.add добавил '${w}'.` : `'${w}' уже есть: ${c - 1} + 1 = ${c}. Во множестве повтор не появится.`);
  else toast('Цикл прошёл по всем заказам.');
  update();
}
function pickKey(k) {
  if (S.di < ORDERS.length) { toast('Сначала обработайте все заказы — пока словарь неполный.'); return; }
  S.pick = k; const d = dictState();
  toast(k === d.maxKey ? `counts['${k}'] = ${d.counts.get(k)} — больше всех. Это max(counts, key=counts.get).` : `counts['${k}'] = ${d.counts.get(k)}. Есть товар, который заказывали чаще.`);
  update();
}
function setOp(op) {
  S.op = op; const r = opResult(op, dictState().keys);
  toast(`seen ${op} yest — ${OPS[op]}: ${r.length} эл.`);
  update();
}
function createObj() {
  const Ls = L();
  if (S.objs.length >= Ls.maxObj) { toast(`Мест для объектов только ${Ls.maxObj}.`); return; }
  const k = S.objs.length;
  S.objs.push({ name: NAMES[k], x: 0, vx: 0, energy: Ls.e0 });
  S.sel = k; S.call = { m: 'init', k };
  S.log.push({ t: `r${k + 1} = Robot('${NAMES[k]}')` });
  toast(`Создан объект r${k + 1}. __init__ задал name = '${NAMES[k]}', x = 0, energy = ${Ls.e0}.`);
  update();
}
function callMove(n) {
  const Ls = L(), o = S.objs[S.sel];
  if (!o) { toast('Сначала создайте объект: нажмите «+ объект».'); return; }
  const before = { x: o.x, energy: o.energy }, ok = o.energy >= Ls.cost * n;
  S.log.push({ t: `r${S.sel + 1}.move(${n})` });
  if (ok) { o.x = Math.min(o.x + n, Ls.finish); o.energy -= Ls.cost * n; }
  else S.log.push({ t: `${o.name} мало энергии`, out: true });
  S.call = { m: 'move', k: S.sel, n, ok, before, after: { x: o.x, energy: o.energy } };
  if (!ok) toast(`Нужно ${Ls.cost * n}, а у ${o.name} только ${o.energy}. Сработала ветка else.`);
  else if (o.x === Ls.finish) toast(`${o.name} на финише!`);
  update();
}
function callCharge() {
  const o = S.objs[S.sel];
  if (!o) { toast('Сначала создайте объект: нажмите «+ объект».'); return; }
  const before = { x: o.x, energy: o.energy };
  o.energy = 100; S.log.push({ t: `r${S.sel + 1}.charge()` });
  S.call = { m: 'charge', k: S.sel, before, after: { x: o.x, energy: 100 } };
  toast(`self.energy = 100 — только у ${o.name}. У других объектов энергия прежняя.`);
  update();
}
function cycleMode(ln) {
  if (S.run) return;
  if (ln === 2) S.mR = MODE_NEXT_R[S.mR]; else S.mW = MODE_NEXT_W[S.mW];
  const md = ln === 2 ? S.mR : S.mW;
  toast(`${ln === 2 ? 'marks.txt' : 'report.txt'}: режим '${md}' — ${MODE_W[md]}.`);
  update();
}
function runFiles() {
  if (S.run) { // second press: finish instantly
    while (S.run) applyEv();
    return;
  }
  S.run = { ev: buildTrace(), i: 0, t: 0 }; S.view = null; applyEv();
}
function applyEv() {
  const r = S.run; if (!r) return;
  const e = r.ev[r.i]; r.i++; r.t = performance.now();
  S.view = e; S.marks = e.marks; S.report = e.report;
  if (e.err || r.i >= r.ev.length) {
    S.run = null; S.fRuns++; S.fLast = { err: e.err || null, mR: S.mR, mW: S.mW, line: e.line };
    if (e.err) toast(`Ошибка в строке ${e.line + 1}: ${e.err}`);
    else toast(S.report.length === 1 ? 'Готово: в report.txt одна строка.' : `Готово, но в report.txt уже ${S.report.length} строки. Старый текст остался.`);
  }
  update();
}
function restoreFiles() {
  if (S.run) return;
  S.marks = MARKS0.slice(); S.report = REPORT0.slice(); S.view = null; S.fLast = null;
  toast('Файлы вернулись в исходное состояние.'); update();
}
const STEP = () => reduce ? 60 : 230;

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (id === 'dict' && S.flashLine && t - S.flashLine < 1000) anim = true;
  if (id === 'cls') for (const o of S.objs) {
    if (Math.abs(o.vx - o.x) > 0.01) { o.vx = reduce ? o.x : o.vx + (o.x - o.vx) * Math.min(1, dt * 8); anim = true; } else o.vx = o.x;
  }
  if (id === 'files' && S.run && t - S.run.t >= STEP()) applyEv();
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

    B('|', 'seen | yest', 'Объединение') + B('&', 'seen &amp; yest', 'Пересечение') + B('-', 'seen - yest', 'Разность') + sep + B('reset', 'Заново');

function act(a) {
  const id = LID();
  if (id === 'dict') {
    if (a === 'step') stepDict(false);
    if (a === 'all') stepDict(true);
    if (a === '|' || a === '&' || a === '-') setOp(a);
    if (a === 'reset') { S.di = 0; S.pick = null; S.op = null; S.flashLine = 0; update(); }
    return;
  }
  if (id === 'cls') {
    if (a === 'new') createObj();
    if (a === 'm1' || a === 'm2' || a === 'm3') callMove(+a[1]);
    if (a === 'ch') callCharge();
    if (a.startsWith('sel')) { const k = +a.slice(3); if (S.objs[k]) { S.sel = k; update(); } }
    if (a === 'reset') { S.objs = []; S.sel = -1; S.log = []; S.call = null; update(); }
    return;
  }
  if (a === 'mr') cycleMode(2);
  if (a === 'mw') cycleMode(8);
  if (a.startsWith('setR') && !S.run) { S.mR = a.slice(4); update(); }
  if (a.startsWith('setW') && !S.run) { S.mW = a.slice(4); update(); }
  if (a === 'run') runFiles();
  if (a === 'restore') restoreFiles();
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;

function taskState(m) {
  if (S.done[LID()]) return '✓ Выполнено';
  if (m.kind === 'dict') {
    if (m.di < m.total) return `Обработано заказов: ${m.di} из ${m.total}`;
    if (!m.pick) return 'Цикл закончен · выберите товар в словаре';
    if (m.pick !== m.maxKey) return `Выбран '${m.pick}' — есть товар популярнее`;
    return m.op ? `Товар найден · сейчас: seen ${m.op} yest` : 'Товар найден · примените операцию к множествам';
  }
  if (m.kind === 'cls') return `Объектов: ${m.n} · на финише: ${m.atFinish} из 2`;
  if (m.running) return `Выполняется строка ${m.view.line + 1}`;
  if (!m.last) return `Режимы: '${m.mR}' и '${m.mW}' · программу ещё не запускали`;
  if (m.last.err) return `Ошибка в строке ${m.last.line + 1}` + (m.marksOk ? '' : ' · marks.txt испорчен');
  return `Строк в report.txt: ${m.report.length}` + (m.marksOk ? '' : ' · marks.txt испорчен');
}

// Scheme tab: built once per lesson, values refreshed on update
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'dict') h = `<h2>Пульт цикла</h2><p class="note">Каждый шаг — одна итерация цикла for: берём следующий заказ w и обновляем словарь и множество.</p>
    <dl class="reads"><div><dt>Шагов</dt><dd id="r1"></dd></div><div><dt>len(counts)</dt><dd id="r2"></dd></div><div><dt>len(seen)</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Цикл</div><div class="chips"><button data-a="step">Шаг</button><button data-a="all">Все</button><button data-a="reset">Заново</button></div></div>
    <div class="ctl"><div class="lbl">Операции над множествами</div><div class="chips"><button data-a="|">seen | yest</button><button data-a="&amp;">seen &amp; yest</button><button data-a="-">seen - yest</button></div></div>
    <h3>print(counts)</h3><div class="listing" id="lst"></div><h3>print(seen)</h3><div class="listing" id="lst2"></div>`;
  if (id === 'cls') h = `<h2>Пульт объектов</h2><p class="note">Методы вызываются у выбранного объекта: r1.move(2) двигает только r1.</p>
    <dl class="reads"><div><dt>Объектов</dt><dd id="r1"></dd></div><div><dt>Выбран</dt><dd id="r2"></dd></div><div><dt>На финише</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Создать и выбрать</div><div class="chips" id="selChips"></div></div>
    <div class="ctl"><div class="lbl">Вызвать метод</div><div class="chips"><button data-a="m1">move(1)</button><button data-a="m2">move(2)</button><button data-a="m3">move(3)</button><button data-a="ch">charge()</button><button data-a="reset">Заново</button></div></div>
    <h3>Атрибуты объектов</h3><div class="listing" id="lst"></div>`;
  if (id === 'files') h = `<h2>Режимы открытия</h2><p class="note">Режим — второй аргумент open(). Его можно менять и прямо в коде на сцене.</p>
    <dl class="reads"><div><dt>total</dt><dd id="r1"></dd></div><div><dt>count</dt><dd id="r2"></dd></div><div><dt>avg</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">marks.txt <output id="oR"></output></div><div class="chips"><button data-a="setRr">'r'</button><button data-a="setRw">'w'</button><button data-a="setRa">'a'</button></div></div>
    <div class="ctl"><div class="lbl">report.txt <output id="oW"></output></div><div class="chips"><button data-a="setWw">'w'</button><button data-a="setWa">'a'</button><button data-a="setWr">'r'</button></div></div>
    <div class="ctl"><div class="chips"><button data-a="run">Пуск</button><button data-a="restore">Вернуть файлы</button></div></div>
    <h3>Содержимое report.txt</h3><div class="listing" id="lst"></div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const lst = el.querySelector('#lst');
  if (m.kind === 'dict') {
    set('#r1', `${m.di}/${m.total}`); set('#r2', String(m.keys.length)); set('#r3', String(m.keys.length));
    if (lst) lst.textContent = '{' + m.keys.map(k => `'${k}': ${m.counts.get(k)}`).join(', ') + '}';
    set('#lst2', pySet(m.keys));
  } else if (m.kind === 'cls') {
    set('#r1', `${m.n}/${L().maxObj}`); set('#r2', S.sel >= 0 ? `r${S.sel + 1}` : '—'); set('#r3', String(m.atFinish));
    const sc = el.querySelector('#selChips');
    if (sc) {
      sc.innerHTML = S.objs.map((o, k) => `<button data-a="sel${k}"${k === S.sel ? ' style="border-color:var(--force)"' : ''}>r${k + 1} · ${o.name}</button>`).join('') + (S.objs.length < L().maxObj ? '<button data-a="new">+ объект</button>' : '');
      sc.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
    }
    if (lst) lst.innerHTML = S.objs.length ? S.objs.map((o, k) => `<div${k === S.sel ? ' class="cur"' : ''}>r${k + 1}: name='${esc(o.name)}', x=${o.x}, energy=${o.energy}</div>`).join('') : '<span class="note">Объектов пока нет. Класс есть, а роботов нет.</span>';
  } else {
    const v = m.view;
    set('#r1', v && v.total !== undefined ? String(v.total) : '—'); set('#r2', v && v.count !== undefined ? String(v.count) : '—'); set('#r3', v && v.avg !== undefined ? String(v.avg) : '—');
    set('#oR', `'${S.mR}' · ${MODE_W[S.mR]}`); set('#oW', `'${S.mW}' · ${MODE_W[S.mW]}`);
    if (lst) lst.innerHTML = S.report.length ? S.report.map(s => `<div>${esc(s)}</div>`).join('') : '<span class="note">Файл пуст.</span>';
    el.querySelectorAll('[data-a]').forEach(b => { if (b.dataset.a !== 'run') b.disabled = !!S.run; });
  }
}

function flashEl(sel) { const el = $(sel); if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${esc(p)}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${esc(taskState(m))}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    const head = { dict: ['Из чего состоит подсчёт', 'Нажмите на пункт, чтобы найти его на сцене.'], cls: ['Класс, объекты, атрибуты', 'Нажмите на пункт, чтобы найти его на сцене.'], files: ['Как программа работает с файлом', 'Нажмите на пункт, чтобы найти его на сцене.'] }[Ls.id];
    $('#pane-parts').innerHTML = `<h2>${head[0]}</h2><p class="note">${head[1]}</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${esc(p.name)}</b><span>${esc(p.spec)}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true;
      if (b.dataset.id === 'object' && !S.objs.length) toast('Объектов пока нет — создайте их кнопкой «+ объект».');
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'dict') {
    let h = `<h2>Как цикл заполняет словарь</h2><div class="formula">counts[w] = counts.get(w, 0) + 1</div><p class="note">get(w, 0) отдаёт текущее число, а для нового ключа — 0.</p><div class="steps">`;
    const seen = new Map();
    ORDERS.slice(0, m.di).forEach((w, i) => { const p = seen.get(w) || 0; seen.set(w, p + 1); h += step(`${i + 1}. w = '${w}'`, `${p} + 1 = ${p + 1}${p ? '' : ' (новый ключ)'}`); });
    if (!m.di) h += step('цикл', 'ещё не запускали');
    h += step('итого', `len(orders) = ${m.di} · len(counts) = ${m.keys.length}`, 'sum') + `</div>`;
    h += `<h3>Множества</h3><div class="steps">` + step('seen', esc(pySet(m.keys))) + step('yest', esc(pySet(YEST)));
    if (m.op) h += step(`seen ${esc(m.op)} yest`, esc(pySet(m.res)), 'sum');
    h += `</div><p class="note" style="margin-top:10px">Порядок элементов множества Python не гарантирует — при печати он может быть другим.</p>`;
    h += `<h3>Проверка задания</h3><div class="steps">` + step('все заказы обработаны', m.di === m.total ? 'да' : `${m.di} из ${m.total}`, m.di === m.total ? 'okk' : '') +
      step('выбран товар', m.pick ? `'${m.pick}' = ${m.counts.get(m.pick)}` : 'нет', m.pick && m.pick === m.maxKey ? 'okk' : m.pick ? 'badd' : '') +
      step('операция', m.op ? `seen ${esc(m.op)} yest` : 'нет', S.done.dict ? 'okk' : '') + `</div>`;
    return h;
  }
  if (m.kind === 'cls') {
    const c = m.call, Ls = L();
    let h = `<h2>Что сделал последний вызов</h2>`;
    if (!c) h += `<p class="note">Пока ничего. Создайте объект кнопкой «+ объект».</p>`;
    else if (c.m === 'init') h += `<div class="formula">r${c.k + 1} = Robot('${NAMES[c.k]}')</div><div class="steps">` + step('self.name', `'${NAMES[c.k]}'`) + step('self.x', '0') + step('self.energy', String(Ls.e0)) + `</div>`;
    else if (c.m === 'move') {
      const nm = S.objs[c.k].name;
      h += `<div class="formula">r${c.k + 1}.move(${c.n})</div><div class="steps">` + step('self', `r${c.k + 1} (${nm})`) + step('условие', `${c.before.energy} >= ${Ls.cost} · ${c.n} = ${Ls.cost * c.n} → ${c.ok ? 'True' : 'False'}`, c.ok ? 'okk' : 'badd');
      if (c.ok) h += step('self.x', `min(${c.before.x} + ${c.n}, ${Ls.finish}) = ${c.after.x}`) + step('self.energy', `${c.before.energy} − ${Ls.cost * c.n} = ${c.after.energy}`, 'sum');
      else h += step('ветка else', `print → «${nm} мало энергии»`, 'badd') + step('атрибуты', 'не изменились', 'sum');
      h += `</div>`;
    } else h += `<div class="formula">r${c.k + 1}.charge()</div><div class="steps">` + step('self', `r${c.k + 1} (${S.objs[c.k].name})`) + step('self.energy', `${c.before.energy} → 100`, 'sum') + `</div>`;
    h += `<h3>Сколько энергии на путь</h3><div class="steps">` + step('до финиша', `${Ls.finish} шагов · ${Ls.cost} ед. за шаг`) + step('нужно всего', `${Ls.finish} · ${Ls.cost} = ${Ls.finish * Ls.cost}`) +
      step('на старте', `${Ls.e0} → хватит на ${Ls.e0 / Ls.cost} шагов`, 'sum') + `</div>`;
    h += `<h3>Объекты</h3><div class="steps">` + (S.objs.length ? S.objs.map((o, k) => step(`r${k + 1} · ${esc(o.name)}`, `x = ${o.x}, energy = ${o.energy}`, o.x === Ls.finish ? 'okk' : '')).join('') : step('объектов', '0')) + `</div>`;
    return h;
  }
  const v = m.view, ev = S.run ? null : null;
  let h = `<h2>Трассировка программы</h2><div class="formula">avg = total / count</div><div class="steps">`;
  const marks = m.marksOk ? MARKS0 : S.marks;
  if (m.marksOk) {
    const nums = MARKS0.map(s => +s.split(' ')[1]), tot = nums.reduce((a, b) => a + b, 0);
    MARKS0.forEach((s, i) => h += step(`строка ${i + 1}: «${s}»`, `mark = ${nums[i]}`));
    h += step('total', `${nums.join(' + ')} = ${tot}`) + step('count', String(nums.length)) + step('avg', `${tot} / ${nums.length} = ${tot / nums.length} → «${(tot / nums.length).toFixed(1)}»`, 'sum');
  } else h += step('marks.txt', marks.length ? 'изменён' : 'пуст — его стёрли режимом \'w\'', 'badd') + step('count', '0 → деление на ноль', 'badd');
  h += `</div><p class="note" style="margin-top:10px">Это расчёт для правильного чтения файла. Что получится на самом деле, зависит от режимов.</p>`;
  h += `<h3>Ваши режимы</h3><div class="steps">` +
    step(`open('marks.txt', '${m.mR}')`, m.mR === 'r' ? 'читаем — верно' : m.mR === 'w' ? 'файл стирается при открытии' : 'читать нельзя: not readable', m.mR === 'r' ? 'okk' : 'badd') +
    step(`open('report.txt', '${m.mW}')`, m.mW === 'w' ? 'старый текст стирается, пишем заново' : m.mW === 'a' ? 'старые строки остаются, новая — в конец' : 'писать нельзя: not writable', m.mW === 'r' ? 'badd' : '') + `</div>`;
  h += `<h3>Проверка задания</h3><div class="steps">` + step('marks.txt цел', m.marksOk ? 'да' : 'нет — «Вернуть файлы»', m.marksOk ? 'okk' : 'badd') +
    step('последний запуск', !m.last ? 'не было' : m.last.err ? `ошибка в строке ${m.last.line + 1}` : 'без ошибок', m.last && !m.last.err ? 'okk' : m.last ? 'badd' : '') +
    step('строк в report.txt', String(m.report.length), m.ok ? 'okk' : '') + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'dict') el.innerHTML = `<div class="k">Цикл по заказам</div><div class="v ${ok ? 'ok' : ''}">${m.di} / ${m.total}</div><div class="gauge"><b style="width:${(m.di / m.total * 100).toFixed(1)}%"></b></div><div class="lr"><span>ключей</span><span>${m.keys.length}</span></div><div class="lr"><span>операция</span><span>${m.op ? esc(m.op) : '—'}</span></div>`;
  else if (m.kind === 'cls') { const o = S.objs[S.sel]; el.innerHTML = `<div class="k">Объект ${o ? 'r' + (S.sel + 1) : ''}</div><div class="v ${ok ? 'ok' : ''}">${o ? esc(o.name) : 'нет'}</div><div class="lr"><span>x</span><span>${o ? o.x : '—'}</span></div><div class="lr"><span>energy</span><span>${o ? o.energy : '—'}</span></div><div class="lr"><span>финиш</span><span>${m.atFinish}/2</span></div>`; }
  else el.innerHTML = `<div class="k">report.txt</div><div class="v ${m.ok || ok ? 'ok' : m.last && m.last.err ? 'bad' : ''}">${m.report.length} стр.</div><div class="lr"><span>чтение</span><span>'${m.mR}'</span></div><div class="lr"><span>запись</span><span>'${m.mW}'</span></div><div class="lr"><span>marks</span><span>${m.marksOk ? 'цел' : 'испорчен'}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Словари, классы и файлы — ваши инструменты!'), 1200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderTools();
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  dict: '<text x="6" y="12" font-size="8" fill="#86e0a8" font-family="monospace">\'чай\':4</text><text x="6" y="24" font-size="8" fill="#86e0a8" font-family="monospace">\'сыр\':1</text><circle cx="46" cy="15" r="9" fill="none" stroke="#72d4e8" stroke-width="1.2"/><circle cx="55" cy="15" r="9" fill="none" stroke="#c3a6ff" stroke-width="1.2"/>',
  cls: '<rect x="4" y="4" width="20" height="22" rx="2" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><path d="M8 10h12M8 15h9M8 20h11" stroke="#72d4e8" stroke-width="1.2"/><path d="M27 15h6" stroke="#8b96ad" marker-end="url(#ar)"/><g transform="translate(44 18) scale(.45)">' + robot(0, 0, 1) + '</g><g transform="translate(57 18) scale(.45)">' + robot(0, 0, 1, '#86e0a8') + '</g>',
  files: '<path d="M6 4h12l5 5v18H6z" fill="none" stroke="#72d4e8" stroke-width="1.2"/><path d="M9 13h10M9 17h10M9 21h7" stroke="#72d4e8"/><path d="M27 15h8" stroke="#ffb547" stroke-width="1.4"/><path d="M33 12l3 3-3 3" fill="none" stroke="#ffb547" stroke-width="1.4"/><path d="M42 4h12l5 5v18H42z" fill="none" stroke="#86e0a8" stroke-width="1.2"/><path d="M45 15h10" stroke="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; tap = null;
  S.di = 0; S.pick = null; S.op = null; S.flashLine = 0;
  S.objs = []; S.sel = -1; S.log = []; S.call = null;
  S.mR = LESSONS[2].mR0; S.mW = LESSONS[2].mW0; S.marks = MARKS0.slice(); S.report = REPORT0.slice(); S.run = null; S.view = null; S.fLast = null; S.fRuns = 0;
  save();
  $('#stage').classList.add('tall');
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}
window.addEventListener('resize', () => requestAnimationFrame(fit));

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'dict') {
    now = `Код на Python: counts = {}; seen = set(); for w in orders: counts[w] = counts.get(w, 0) + 1; seen.add(w). Список orders (10 заказов магазина): ${ORDERS.join(', ')}. Ученик выполняет цикл по шагам: обработано ${m.di} из ${m.total}. Сейчас counts = {${m.keys.map(k => `'${k}': ${m.counts.get(k)}`).join(', ')}}, seen = ${pySet(m.keys)}. Вчерашнее множество yest = ${pySet(YEST)}. Выбранный в словаре товар: ${m.pick ? `'${m.pick}'` : 'нет'}${m.pick ? (m.pick === m.maxKey ? ' (это самый частый)' : ' (не самый частый)') : ''}. Последняя операция над множествами: ${m.op ? `seen ${m.op} yest = ${pySet(m.res)}` : 'не применялась'}. Задание: обработать все заказы, выбрать самый частый товар и найти товары, которые брали и вчера, и сегодня (нужна операция пересечения &). Не называй сразу нужную операцию и товар — спрашивай, что делает каждая операция, и проси сравнить числа в словаре.`;
  }
  if (id === 'cls') {
    now = `На экране класс Robot: __init__(self, name) задаёт self.name, self.x = 0, self.energy = 50; move(self, steps): если self.energy >= 10 * steps, то self.x = min(self.x + steps, 12) и self.energy -= 10 * steps, иначе print(self.name, 'мало энергии'); charge(self): self.energy = 100. Финиш на x = 12. Объекты: ${S.objs.length ? S.objs.map((o, k) => `r${k + 1} = Robot('${o.name}'): x = ${o.x}, energy = ${o.energy}`).join('; ') : 'пока не созданы'}. Выбран: ${S.sel >= 0 ? 'r' + (S.sel + 1) : 'никто'}. Последние вызовы в консоли: ${S.log.slice(-4).map(s => s.t).join(' | ') || 'нет'}. На финише ${m.atFinish} из 2 нужных. Наводи вопросами: сколько энергии нужно на 12 шагов, когда вызвать charge(), почему вызов у одного объекта не меняет другой. Не диктуй готовую последовательность вызовов.`;
  }
  if (id === 'files') {
    const v = m.view;
    now = `Программа на Python читает marks.txt (строки: ${MARKS0.join('; ')}) в цикле for line in f, делит строку через split(), суммирует оценки в total, считает count, вычисляет avg = total / count и пишет f'Средний балл: {avg:.1f}' в report.txt. Режимы открытия ученик выбирает сам: сейчас open('marks.txt', '${m.mR}') и open('report.txt', '${m.mW}'). Сейчас marks.txt: ${S.marks.length ? S.marks.join('; ') : 'пуст (стёрт)'}; report.txt: ${S.report.length ? S.report.join('; ') : 'пуст'} (изначально в нём старая строка «Средний балл: 3.9»). ${m.running ? `Программа выполняется, строка ${v.line + 1}.` : m.last ? (m.last.err ? `Последний запуск упал с ошибкой ${m.last.err} в строке ${m.last.line + 1}.` : 'Последний запуск прошёл без ошибок.') : 'Программу ещё не запускали.'} Цель: в report.txt ровно одна строка с правильным средним, marks.txt не испорчен. Не называй нужные режимы прямо — спрашивай, что каждый режим делает со старым содержимым файла.`;
  }
  return [
    `Раздел: информатика, 10 класс, тема «Структуры данных и ООП» (язык Python). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { dict: 'Чем словарь отличается от списка?', cls: 'Зачем в методах нужен self?', files: 'Чем режим «w» отличается от «a»?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
