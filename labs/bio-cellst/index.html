<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 7 класс: строение клетки — мембрана и клеточная стенка, ядро, органоиды, клетки растений и животных.">
<title>Строение клетки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene text.b{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}
.ghostbtn:disabled{opacity:.35;cursor:default}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="/luch/splash.js"></script>
<div class="app">
  <header>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);

};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const KEY = 'luch-bio-cellst';
const pc = v => fmt(v * 100, 0) + ' %';

  { id: 'mito', text: 'Митохондрии', short: 'митохондрии', z: 'both', q: 'Кому нужна энергия — только животным или всем живым?', why: 'есть у обеих: всем клеткам нужна энергия' },
  { id: 'glyc', text: 'Запасает гликоген', short: 'запас: гликоген', z: 'animal', q: 'Где у человека хранится запас углеводов? А что запасает клубень картофеля?', why: 'только у животных (и у грибов); у растений запас — крахмал' },
  { id: 'chlo', text: 'Хлоропласты', short: 'хлоропласты', z: 'plant', q: 'Кто из них умеет сам делать сахар на свету?', why: 'только у растений, и то в зелёных частях' },

function osm() {
  const o = OSM[S.cell], free = o.inert + (1 - o.inert) * o.cin / Math.max(S.c, 0.05);
  const target = S.cell === 'blood' ? Math.min(2.0, free) : Math.min(1, free);
  const press = S.cell === 'onion' && free > 1 ? Math.min(1, (free - 1) / 2.5) : 0;
  const flow = S.burst ? 0 : target - S.V;
  let state;
  if (S.cell === 'blood') state = S.burst ? 'лопнула' : S.V > 1.12 ? 'набухает' : S.V < 0.88 ? 'сморщилась' : 'нормальная форма';
  else state = S.V < 0.97 ? 'мембрана отошла от стенки' : press > 0.04 ? 'набухла, стенка держит' : 'нормальная';
  return { o, free, target, press, flow, state };
}
const segArea = h => { const R = AMO.R; h = clamp(h, -R, R); return R * R * Math.acos(h / R) - h * Math.sqrt(R * R - h * h); };

function model() {
  const id = LID();
  if (id === 'membrane') return Object.assign({ kind: 'osm', obs: S.obs }, osm());
  if (id === 'nucleus') return { kind: 'amo', seen: S.seen, day: S.day, cut: S.cut, f: cutFrac(S.cutX) };
  if (id === 'organelles') {
    const prod = 12 * S.light / 100, use = 4;
    return { kind: 'org', matched: Object.keys(S.matched).length, prod, use, net: prod - use };
  }
  const placed = Object.keys(S.placed).length;
  return { kind: 'cmp', placed, miss: S.miss, cur: S.deck.length ? FEAT[S.deck[0]] : null };
}

const f1 = v => v.toFixed(1);
function smooth(pts) {

  const pts = [], n = 22, tt = reduce ? 0 : t;

  S.pieces.forEach(p => p.hist.push(p.nuc ? 'ok' : 'weak'));
  S.cut = true; S.day = 0; S.log = ['Сутки 0: амёбу разрезали на две части.'];
  toast('Разрезано. Теперь листайте сутки и следите за обеими частями.');
  renderTools(); buildScheme(); renderParts(); update();
}
function advance(n) {
  if (!S.cut) { toast('Сначала разрежьте амёбу.'); return; }
  if (S.day >= AMO.days) { toast('Опыт окончен. Нажмите «Заново», чтобы повторить.'); return; }
  for (let k = 0; k < n && S.day < AMO.days; k++) {
    S.day++;
    for (const p of S.pieces) {
      if (p.dead) { p.hist.push('dead'); continue; }
      if (p.nuc) {
        p.area = Math.min(1, p.area * AMO.grow);
        if (p.area >= 1 && S.day - p.last >= 1 && p.count < 16) { p.count *= 2; p.area = 0.5; p.divs++; p.last = S.day; S.log.push(`Сутки ${S.day}: ${p.trans ? 'спасённая часть' : 'часть с ядром'} разделилась, амёб ${p.count}.`); }
        if (p.trans && p.divs >= 1 && !S.seen.rescue) { S.seen.rescue = true; toast('Спасена! С новым ядром клетка снова питается, растёт и делится.'); }
        p.hist.push('ok');
      } else {
        p.area *= 0.9;
        if (S.day >= AMO.life) { p.dead = true; p.hist.push('dead'); S.log.push(`Сутки ${S.day}: часть без ядра погибла.`); if (!S.seen.death) { S.seen.death = true; toast('Часть без ядра погибла: она не могла питаться, расти и восстанавливаться.'); } }
        else { p.hist.push('weak'); if (S.day === 2) S.log.push('Сутки 2: часть без ядра округлилась и не ловит пищу.'); }
      }
    }
  }
  update();
}
function transplant() {
  const p = S.pieces.find(q => !q.nuc && !q.dead);
  if (!S.cut || !p) { toast(S.cut ? 'Пересаживать некому: безъядерной живой части нет.' : 'Сначала разрежьте амёбу.'); return; }
  if (S.day > AMO.rescue) { toast('Поздно: клетка без ядра уже слишком ослабла. Начните заново и пересадите ядро раньше.'); return; }
  p.nuc = true; p.trans = true; p.last = S.day; p.transDay = S.day;
  S.log.push(`Сутки ${S.day}: в часть без ядра пересадили ядро другой амёбы.`);
  toast('Ядро пересажено. Листайте сутки и смотрите, что будет.');
  renderTools(); update();
}
function resetAmoeba() { S.cut = false; S.day = 0; S.pieces = []; S.log = []; P.pip.x = P.pip.rx; P.pip.y = P.pip.ry; renderTools(); buildScheme(); renderParts(); update(); }

function tryJob(jid, x, y) {
  const o = orgAt(x, y);
  if (!o) return false;
  if (S.matched[jid]) return true;
  if (o === jid) {
    S.matched[jid] = true; S.sel = null;
    const left = 6 - Object.keys(S.matched).length;
    toast(`Верно: это ${ORG[jid].name.toLowerCase()}.${left ? ` Осталось ${left}.` : ''}`);
    update();
  } else { S.sel = null; toast(`Это ${o === 'cyt' ? 'цитоплазма' : ORG[o].name.toLowerCase()}. Подумайте ещё раз, кто делает эту работу.`); dirty = true; }
  return true;
}
function placeFeat(z) {
  const cur = S.deck.length ? FEAT[S.deck[0]] : null; if (!cur || !z) return;
  S.sel4 = false;
  if (cur.z === z) {
    S.placed[cur.id] = z; S.deck.shift(); S.lastWrong = null;
    toast(`Верно: ${cur.text.toLowerCase()} — ${ZN[z]}.`);
  } else {
    S.miss++; S.lastWrong = cur.id;
    toast(`Не совсем. ${cur.q}`);
  }
  P.card.x = P.card.rx; P.card.y = P.card.ry;
  update();
}
function skipCard() { if (S.deck.length > 1) { S.deck.push(S.deck.shift()); S.sel4 = false; update(); } }

// ---------- dragging ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const id = el.dataset.drag; e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const p = toSvg(e);
  drag = { id, x: e.clientX, y: e.clientY, moved: false, p0: p };
  if (id === 'salt') { setSalt((TRACK.y0 - p.y) / (TRACK.y0 - TRACK.y1) * SALT_MAX); return; }
  if (id === 'knife') { drag.dx = S.cutX - p.x; return; }
  const o = id === 'pip' ? P.pip : id === 'card' ? P.card : P[id];
  if (o) { drag.dx = o.x - p.x; drag.dy = o.y - p.y; }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  const p = toSvg(e), id = drag.id;
  if (id === 'salt') { setSalt((TRACK.y0 - p.y) / (TRACK.y0 - TRACK.y1) * SALT_MAX); return; }
  if (!drag.moved) return;
  if (id === 'knife') { S.cutX = Math.round(clamp(p.x + drag.dx, AMO.cx - AMO.R + 10, AMO.cx + AMO.R - 10)); update(); return; }
  const o = id === 'pip' ? P.pip : id === 'card' ? P.card : P[id];
  if (o && drag.dx !== undefined) { o.x = clamp(p.x + drag.dx, VB.x + 4, VB.x + VB.w - 40); o.y = clamp(p.y + drag.dy, VB.y + 4, 400); dirty = true; }
});
const endDrag = (cancel, e) => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) { if (P[d.id]) { P[d.id].x = P[d.id].rx; P[d.id].y = P[d.id].ry; } return; }
  const p = e ? toSvg(e) : d.p0, id = d.id;
  if (id === 'knife') { if (!d.moved) doCut(); return; }
  if (id === 'pip') {
    if (!d.moved) { transplant(); return; }
    const tgt = S.pieces.find(q => !q.nuc && !q.dead);
    const c = tgt ? pieceCenters(tgt)[0] : null, tip = { x: P.pip.x, y: P.pip.y + 18 };
    P.pip.x = P.pip.rx; P.pip.y = P.pip.ry;
    if (c && Math.hypot(tip.x - c[0], tip.y - c[1]) < pieceR(tgt) + 24) transplant();
    else if (c) toast('Поднесите пипетку к части без ядра.');
    return;
  }
  if (id.startsWith('piece')) {
    const q = S.pieces[+id.slice(5)];
    if (q && !d.moved) toast(q.dead ? 'Эта часть погибла.' : q.nuc ? 'Часть с ядром: питается, растёт и делится.' : S.day < 2 ? 'Часть без ядра пока двигается.' : 'Часть без ядра ослабла и не ловит пищу.');
    return;
  }
  if (id === 'whole') { if (!d.moved) toast('Амёба: ядро — оранжевое, светлый пузырёк — сократительная вакуоль, зелёное — съеденные водоросли.'); return; }
  if (id.startsWith('j_')) {
    const jid = id.slice(2), o = P[id];
    if (!d.moved) { S.sel = S.sel === jid ? null : jid; dirty = true; return; }
    o.x = o.rx; o.y = o.ry;
    if (!tryJob(jid, p.x, p.y)) toast('Отпустите карточку прямо на части клетки.');
    return;
  }
  if (id === 'cell3') { if (S.sel && !d.moved) tryJob(S.sel, p.x, p.y); else if (!d.moved) toast('Сначала выберите карточку с работой.'); return; }
  if (id === 'card') {
    if (!d.moved) { S.sel4 = !S.sel4; dirty = true; return; }
    const z = zoneAt(p.x, p.y);
    if (z) placeFeat(z); else { P.card.x = P.card.rx; P.card.y = P.card.ry; toast('Отпустите карточку внутри диаграммы.'); }
    return;
  }
  if (id === 'venn') { if (S.sel4 && !d.moved) placeFeat(zoneAt(p.x, p.y)); else if (!d.moved) toast('Сначала нажмите на карточку внизу.'); }
};
scene.addEventListener('pointerup', e => endDrag(false, e));
scene.addEventListener('pointercancel', () => endDrag(true));

// ---------- animation loop ----------
let last = performance.now(), lastDraw = 0, sig = '';
function stepOsm(dt) {
  if (S.burst) return;
  const m = osm(), tg = m.target, nv = reduce ? tg : S.V + (tg - S.V) * Math.min(1, dt * 1.5);
  if (Math.abs(nv - S.V) > 1e-4) { S.V = nv; dirty = true; }
  if (S.cell === 'blood' && S.V > BURST) { S.burst = true; S.obs.lysis = true; toast('Клетка крови лопнула: вода вошла внутрь, а стенки, которая удержала бы её, нет.'); }
  const settled = Math.abs(tg - S.V) < 0.02;
  if (S.cell === 'onion' && settled && S.c <= 0.3 && !S.obs.turgor) { S.obs.turgor = true; toast('Клетка лука набухла, но стенка не дала ей лопнуть. Это тургор.'); }
  if (S.cell === 'onion' && S.V < 0.8 && !S.obs.plasm) { S.obs.plasm = true; toast('Мембрана отошла от стенки: вода ушла из клетки. Это плазмолиз.'); }
  if (S.cell === 'blood' && S.V < 0.85 && !S.obs.cren) { S.obs.cren = true; toast('Клетка крови сморщилась: вода вышла в солёный раствор.'); }
  const s = `${S.cell}|${S.c}|${Math.round(S.V * 50)}|${S.burst}|${Object.keys(S.obs).join()}`;
  if (s !== sig) { sig = s; update(); }
}
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  if (id === 'membrane') stepOsm(dt);
  if (!drag) {
    for (const [k, o] of Object.entries(P)) {
      if (o.rx === undefined) continue;
      const nx = reduce ? o.rx : o.x + (o.rx - o.x) * Math.min(1, dt * 10), ny = reduce ? o.ry : o.y + (o.ry - o.y) * Math.min(1, dt * 10);
      if (Math.abs(nx - o.x) + Math.abs(ny - o.y) > 0.05) dirty = true;
      o.x = nx; o.y = ny;
    }
  }
  if (S.hl) dirty = true;
  const drift = !reduce && t - lastDraw > 40;
  if (dirty || drift) { drawScene(t); dirty = false; lastDraw = t; }
}

function osmDiag(m) {
  const cin = m.o.cin, W = v => clamp(v / SALT_MAX, 0, 1) * 80;
  let h = `<svg class="diag" viewBox="0 0 120 46" role="img" aria-label="Соли внутри и снаружи клетки">`;
  h += `<text x="3" y="11" font-size="3.8" fill="#8b96ad">внутри</text><rect x="22" y="7" width="80" height="5" rx="1" fill="#1a2438"/><rect x="22" y="7" width="${W(cin).toFixed(2)}" height="5" rx="1" fill="#ffb547"/><text x="104" y="11" font-size="3.6" fill="#e8ecf4">${fmt(cin, 1)} %</text>`;
  h += `<text x="3" y="21" font-size="3.8" fill="#8b96ad">снаружи</text><rect x="22" y="17" width="80" height="5" rx="1" fill="#1a2438"/><rect x="22" y="17" width="${W(S.c).toFixed(2)}" height="5" rx="1" fill="#ffb547"/><text x="104" y="21" font-size="3.6" fill="#e8ecf4">${fmt(S.c, 1)} %</text>`;
  const dir = S.burst ? 'клетка лопнула' : Math.abs(m.flow) < 0.015 ? (m.press > 0.04 ? 'равновесие: стенка давит обратно' : 'равновесие') : m.flow > 0 ? 'вода → в клетку' : 'вода → из клетки';
  h += `<text x="60" y="34" font-size="4.4" fill="#5fb4d9" text-anchor="middle">${dir}</text>`;
  h += `<text x="60" y="42" font-size="3.6" fill="#8b96ad" text-anchor="middle">${OSM[S.cell].name.toLowerCase()} · ${m.state}</text>`;
  return h + `</svg>`;
}
function amoDiag() {
  const D = AMO.days, cw = 7;
  let h = `<svg class="diag" viewBox="0 0 120 ${S.cut ? 40 : 22}" role="img" aria-label="Состояние частей амёбы по суткам">`;
  for (let d = 0; d <= D; d++) h += `<text x="${(24 + d * cw + cw / 2).toFixed(1)}" y="6" font-size="3" fill="#8b96ad" text-anchor="middle">${d}</text>`;
  if (!S.cut) return h + `<text x="60" y="15" font-size="3.8" fill="#8b96ad" text-anchor="middle">амёба ещё не разрезана</text></svg>`;
  S.pieces.forEach((p, i) => {
    const y = 10 + i * 14;
    h += `<text x="2" y="${y + 5}" font-size="3.4" fill="#e8ecf4">${p.side === 'L' ? 'левая' : 'правая'}</text><text x="2" y="${y + 9.5}" font-size="2.9" fill="#8b96ad">${p.trans ? 'пересадка' : p.hist[0] === 'ok' ? 'с ядром' : 'без ядра'}</text>`;
    p.hist.forEach((s, d) => { h += `<rect x="${(24 + d * cw + 0.4).toFixed(1)}" y="${y}" width="${(cw - 0.8).toFixed(1)}" height="9" rx="1" fill="${s === 'ok' ? '#3fa34d' : s === 'weak' ? '#c99a2e' : '#4a4f5c'}"/>`; });
  });
  return h + `</svg>`;
}
function orgDiag(m) {
  let h = `<svg class="diag" viewBox="0 0 120 34" role="img" aria-label="Баланс сахара в клетке">`;
  const X = v => 60 + v * 4;
  h += `<path d="M60 4V28" stroke="#26324a" stroke-width=".5"/>`;
  h += `<text x="3" y="9" font-size="3.6" fill="#8b96ad">делает</text><rect x="60" y="5" width="${(m.prod * 4).toFixed(2)}" height="5" fill="#3fa34d"/>`;
  h += `<text x="3" y="17" font-size="3.6" fill="#8b96ad">тратит</text><rect x="${X(-m.use).toFixed(2)}" y="13" width="${(m.use * 4).toFixed(2)}" height="5" fill="#ff8a73"/>`;
  h += `<text x="3" y="25" font-size="3.6" fill="#8b96ad">итог</text><rect x="${Math.min(60, X(m.net)).toFixed(2)}" y="21" width="${Math.abs(m.net * 4).toFixed(2)}" height="5" fill="${m.net >= 0 ? '#86e0a8' : '#ffb547'}"/>`;
  return h + `<text x="117" y="31.5" font-size="3" fill="#8b96ad" text-anchor="end">условных единиц сахара в минуту</text></svg>`;
}
function cmpDiag() {
  const c = { plant: 0, both: 0, animal: 0 }, tot = { plant: 0, both: 0, animal: 0 };
  FEAT.forEach(f => { tot[f.z]++; if (S.placed[f.id]) c[f.z]++; });
  let h = `<svg class="diag" viewBox="0 0 120 30" role="img" aria-label="Сколько признаков разложено в каждую часть">`;
  [['plant', 'растит.', '#c9b36a'], ['both', 'обе', '#72d4e8'], ['animal', 'животн.', '#ef7a80']].forEach(([k, n, col], i) => {
    const x = 6 + i * 38;
    h += `<text x="${x}" y="9" font-size="3.8" fill="#8b96ad">${n}</text><text x="${x + 32}" y="9" font-size="3.8" fill="#e8ecf4" text-anchor="end">${c[k]}</text>`;
    for (let j = 0; j < 5; j++) h += `<rect x="${x + j * 6.5}" y="14" width="5.5" height="9" rx="1" fill="${j < c[k] ? col : '#1a2438'}"/>`;
  });
  return h + `</svg>`;
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };

  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'membrane') {
    const cin = m.o.cin, more = S.c > cin + 0.05 ? 'снаружи' : S.c < cin - 0.05 ? 'внутри клетки' : 'поровну';
    const way = S.burst ? '—' : Math.abs(m.flow) < 0.015 ? (m.press > 0.04 ? 'не идёт: стенка давит в ответ' : 'туда и обратно поровну') : m.flow > 0 ? 'в клетку' : 'из клетки';
    let h = `<h2>Куда пойдёт вода</h2><div class="formula">вода → туда, где солей больше</div><p class="note">Мембрана пропускает воду, но задерживает соли. Поэтому выравнивать солёность приходится воде. Это осмос.</p><h3>Сейчас</h3><div class="steps">` +
      step('солей внутри клетки', `≈ ${fmt(cin, 1)} %`) + step('солей снаружи', `${fmt(S.c, 1)} %`) + step('где солей больше', more) + step('вода идёт', way) +
      step(S.cell === 'onion' ? 'объём содержимого' : 'объём клетки', S.burst ? 'клетка разрушена' : pc(S.V)) + step('итог', m.state, 'sum') + `</div>`;
    h += `<h3>Три случая</h3><div class="steps">` +
      step('вода чище, чем в клетке', 'клетка набухает') + step('животная клетка', 'нет стенки → может лопнуть') + step('растительная клетка', 'стенка держит → тургор') +
      step('раствор солонее клетки', 'вода уходит, клетка сжимается') + step('у растения', 'мембрана отходит от стенки → плазмолиз', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Плазмолиз обратим: если вернуть клетку лука в чистую воду, она снова набухнет. Лопнувший эритроцит уже не восстановится.</p>`;
    return h;
  }
  if (id === 'nucleus') {
    let h = `<h2>Что показал опыт</h2><div class="formula">ядро → ДНК → белки → жизнь клетки</div><p class="note">Чтобы питаться, расти и делиться, клетке всё время нужны новые белки. Инструкции для них хранятся в ядре.</p><h3>Разрез</h3><div class="steps">`;
    const f = S.cut ? { L: S.pieces[0].frac, R: S.pieces[1].frac } : m.f;
    h += step('левая часть', pc(f.L)) + step('правая часть', pc(f.R)) + step('ядро', `в ${AMO.nx < S.cutX ? 'левой' : 'правой'} части`, 'sum') + `</div>`;
    if (S.cut) {
      h += `<h3>Сутки ${S.day}</h3><div class="steps">`;
      S.pieces.forEach(p => {
        const name = (p.side === 'L' ? 'левая' : 'правая') + (p.trans ? ' (пересадка)' : '');
        const st = p.dead ? 'погибла' : p.nuc ? `${p.count > 1 ? p.count + ' амёб, ' : ''}размер ${pc(p.area)}` : `не питается, размер ${pc(p.area)}`;
        h += step(name, st);
      });
      h += `</div><h3>Дневник</h3><div class="steps">` + S.log.slice(-6).map(s => step(s.split(':')[0], s.split(':').slice(1).join(':').trim())).join('') + `</div>`;
    }
    h += `<h3>Вывод</h3><div class="steps">` + step('с ядром', 'питается, растёт, делится') + step('без ядра', 'живёт за счёт запасов ≈ неделю') + step('ядро вернули вовремя', 'клетка восстанавливается', 'sum') + `</div>`;
    return h;
  }
  if (id === 'organelles') {
    let h = `<h2>Как органоиды работают вместе</h2><div class="formula">хлоропласт: CO₂ + вода → сахар + O₂<br>митохондрия: сахар + O₂ → CO₂ + вода + энергия</div><h3>Сейчас, свет ${S.light} %</h3><div class="steps">` +
      step('хлоропласты делают', `12 × ${fmt(S.light / 100, 2)} = ${fmt(m.prod, 1)} ед./мин`) + step('митохондрии тратят', `${fmt(m.use, 1)} ед./мин`) +
      step('итог', `${fmt(m.prod, 1)} − ${fmt(m.use, 1)} = ${(m.net > 0 ? '+' : '') + fmt(m.net, 1)} ед./мин`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">${m.net > 0 ? 'Сахара делается больше, чем тратится: лишний клетка отложит про запас в виде крахмала.' : m.net < 0 ? 'Света мало: клетка тратит больше, чем делает, и расходует запасы крахмала. Так бывает ночью.' : 'Сколько сделали, столько и потратили.'}</p>`;
    const done = JOBS.filter(j => S.matched[j.id]);
    h += `<h3>Найдено ${done.length} из 6</h3>` + (done.length ? `<div class="steps">` + done.map(j => step(ORG[j.id].name, j.lines.join(' '))).join('') + `</div>` : `<p class="note">Здесь появятся пары «органоид — работа».</p>`);
    return h;
  }
  const by = z => FEAT.filter(f => S.placed[f.id] === z);
  let h = `<h2>Сравнение клеток</h2><p class="note">Здесь собираются признаки, которые вы уже разложили, и почему они там.</p>`;
  for (const z of ['plant', 'both', 'animal']) {
    const list = by(z);
    h += `<h3>${ZN[z][0].toUpperCase() + ZN[z].slice(1)} · ${list.length}</h3>` + (list.length ? `<div class="steps">` + list.map(f => step(f.text, f.why)).join('') + `</div>` : `<p class="note">Пока пусто.</p>`);
  }
  return h;
}

    el.innerHTML = `<div class="k">Сутки опыта</div><div class="v">${S.day} из ${AMO.days}</div>
      <div class="gauge"><b style="width:${(S.day / AMO.days * 100).toFixed(1)}%"></b><i style="left:${(AMO.rescue / AMO.days * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>живых</span><span>${S.cut ? alive : 1}</span></div>`;
  } else if (id === 'organelles') {
    el.innerHTML = `<div class="k">Органоиды</div><div class="v ${m.matched === 6 ? 'ok' : ''}">${m.matched} из 6</div>
      <div class="gauge"><b style="width:${(m.matched / 6 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>свет</span><span>${S.light} %</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Признаки</div><div class="v ${m.placed === FEAT.length ? 'ok' : ''}">${m.placed} из ${FEAT.length}</div>
      <div class="gauge"><b style="width:${(m.placed / FEAT.length * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>ошибок</span><span>${m.miss}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как устроена клетка!'), 1600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  if (LID() === 'nucleus' || LID() === 'compare') renderTools();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  membrane: '<circle cx="20" cy="15" r="9" fill="#cf3a44"/><circle cx="20" cy="15" r="3.6" fill="#f0a3a8"/><rect x="36" y="6" width="22" height="18" rx="3" fill="none" stroke="#c9b36a" stroke-width="2.4"/><rect x="41" y="10" width="12" height="10" rx="4" fill="#9b4fb8" opacity=".7"/>',
  nucleus: '<path d="M8 16q-1-8 7-9t12 3q4 6-1 10t-12 3q-5-1-6-7z" fill="#c7d9c4" opacity=".4" stroke="#a9d7b0"/><circle cx="20" cy="14" r="3" fill="#ffb547"/><path d="M33 3v24" stroke="#e8ecf4" stroke-dasharray="2 2"/><path d="M40 16q0-6 7-7t10 3q3 5-1 8t-10 2q-6-1-6-6z" fill="#6b6250" opacity=".6"/>',
  organelles: '<rect x="12" y="3" width="42" height="24" rx="5" fill="none" stroke="#c9b36a" stroke-width="2"/><ellipse cx="38" cy="16" rx="9" ry="7" fill="#8f7fd8" opacity=".5"/><circle cx="21" cy="11" r="4" fill="#ffb547"/><ellipse cx="20" cy="21" rx="4" ry="2" fill="#3fa34d"/><ellipse cx="48" cy="8" rx="3.5" ry="1.8" fill="#ff8a73"/>',
  compare: '<ellipse cx="25" cy="15" rx="15" ry="11" fill="none" stroke="#c9b36a" stroke-width="2"/><ellipse cx="41" cy="15" rx="15" ry="11" fill="none" stroke="#ef7a80" stroke-width="1.4"/><circle cx="33" cy="15" r="2.4" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; sig = '';
  resetLesson(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildOverview(); buildScheme(); renderParts(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'membrane') {
    now = `Под микроскопом ${OSM[S.cell].name.toLowerCase()} в солевом растворе ${fmt(S.c, 1)} % (внутри клетки около ${fmt(m.o.cin, 1)} % солей). ${S.burst ? 'Клетка лопнула (гемолиз).' : `Объём ${S.cell === 'onion' ? 'содержимого клетки' : 'клетки'} ${pc(S.V)} от нормального, вода ${Math.abs(m.flow) < 0.015 ? 'в равновесии' : m.flow > 0 ? 'входит в клетку' : 'выходит из клетки'}. Состояние: ${m.state}.`} Уже получено: клетка крови лопнула — ${S.obs.lysis ? 'да' : 'нет'}, клетка лука набухла (тургор) — ${S.obs.turgor ? 'да' : 'нет'}, плазмолиз у клетки лука — ${S.obs.plasm ? 'да' : 'нет'}. Модель: эритроцит лопается при растворе ниже примерно 0,4 % соли; плазмолиз у лука заметен примерно с 1,5 %.`;
    guide = 'Не называй готовые значения солёности — спрашивай, куда пойдёт вода, если снаружи солей меньше или больше, чем внутри, и чем клетка лука отличается от клетки крови.';
  }
  if (id === 'nucleus') {
    now = S.cut ? `Амёба разрезана: левая часть ${pc(S.pieces[0].frac)}, правая ${pc(S.pieces[1].frac)}. Сутки ${S.day} из ${AMO.days}. ` + S.pieces.map(p => `${p.side === 'L' ? 'Левая' : 'Правая'} часть: ${p.trans ? `ядро пересажено на ${p.transDay}-е сутки` : p.hist[0] === 'ok' ? 'с ядром' : 'без ядра'}, ${p.dead ? 'погибла' : p.nuc ? `живёт, амёб ${p.count}` : 'не питается, слабеет'}`).join('; ') + `. В модели безъядерная часть гибнет на ${AMO.life}-е сутки, ядро можно пересадить до ${AMO.rescue}-х суток.` : `Целая амёба, скальпель стоит так, что слева будет ${pc(m.f.L)}, справа ${pc(m.f.R)}. Ядро немного правее середины.`;
    now += ` Уже наблюдали гибель безъядерной части: ${S.seen.death ? 'да' : 'нет'}; спасение пересадкой ядра: ${S.seen.rescue ? 'да' : 'нет'}.`;
    guide = 'Помогай рассуждать: почему без ядра клетка не может питаться и делиться. Не пересказывай заранее, чем кончится опыт, если ученик его ещё не провёл.';
  }
  if (id === 'organelles') {
    now = `Растительная клетка с ядром, вакуолью, хлоропластами, митохондриями, рибосомами и цитоплазмой. Ученик сопоставляет 6 карточек с работами (${JOBS.map(j => '«' + j.lines.join(' ') + '»').join(', ')}) с частями клетки. Уже сопоставлено ${m.matched} из 6: ${JOBS.filter(j => S.matched[j.id]).map(j => ORG[j.id].name).join(', ') || 'пока ничего'}. Свет ${S.light} %: хлоропласты делают ${fmt(m.prod, 1)} ед. сахара в минуту, митохондрии тратят ${fmt(m.use, 1)}.`;
    guide = 'Не называй, какая карточка к какому органоиду относится, — наводи вопросами о том, как выглядит органоид и что ему для работы нужно.';
  }
  if (id === 'compare') {
    now = `Диаграмма из двух кругов: растительная клетка, животная, общая часть. Разложено ${m.placed} из ${FEAT.length}, ошибок ${m.miss}. Текущая карточка: ${m.cur ? '«' + m.cur.text + '»' : 'нет'}. Уже разложено: ${FEAT.filter(f => S.placed[f.id]).map(f => `${f.text} — ${ZN[S.placed[f.id]]}`).join('; ') || 'ничего'}.`;
    guide = 'Не говори, куда класть текущую карточку. Спрашивай, видел ли ученик это у клетки лука, у клетки крови, у амёбы, и зачем это клетке.';
  }
  return [
    `Раздел: биология, 7 класс, тема «Строение клетки». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    membrane: 'Почему клетка лука не лопается в чистой воде?', nucleus: 'Почему часть амёбы без ядра погибает?',
    organelles: 'Как связаны хлоропласты и митохондрии?', compare: 'Почему у животных клеток нет клеточной стенки?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
