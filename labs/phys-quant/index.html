<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 11 класс: фотоэффект, фотон, лазер, волны и частицы.">
<title>Кванты и свет</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.knobhit{cursor:grab}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 20q2.5-6 5 0t5 0 5 0" fill="none" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><path d="M22 20h7" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><circle cx="31" cy="20" r="3.4" fill="var(--force)"/><path d="M9 30h22" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/><path d="M9 10h22" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round" opacity=".5"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>

      <div class="prog" aria-label="Прогресс"><b>Кванты</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с квантами света. Ручки на шкалах можно тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const SUPD = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = e => String(e).split('').map(c => SUPD[c] || c).join('');
const sci = (x, n = 2) => {
  if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))), m = x / 10 ** e;
  if (Math.abs(+m.toFixed(n)) >= 10) { m /= 10; e += 1; }
  return fmt(m, n) + '·10' + sup(e);
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', CP = '#ffb547', OK = '#86e0a8', WARN = '#ff8a73', MUT = '#8b96ad';

// ---------- physics constants ----------
const H = 6.626e-34, C = 2.998e8, QE = 1.602e-19, ME = 9.109e-31, HC = 1239.8;   // HC — в эВ·нм
const METALS = {
  Cs: { name: 'цезий', gen: 'цезия', A: 1.9, col: '#e0c77a' },
  Na: { name: 'натрий', gen: 'натрия', A: 2.3, col: '#c9ced8' },
  Zn: { name: 'цинк', gen: 'цинка', A: 4.2, col: '#93a6bd' },
};
const LAS = { G: 40, tcM: 0.25, tcN: 0.02, beta: 0.002, Wmax: 5, Pk: 200, need: 30 };  // модель лазера: время жизни τ = 1 с (замедлено)
const WV = { d: 0.5, a: 0.1, L: 0.5, half: 400, bins: 60 };                         // щели: мкм, мкм; экран: м, ±мкм

const LESSONS = [
  { id: 'photo', title: 'Фотоэффект',
    text: ['Свет умеет выбивать электроны из металла — это фотоэффект. Его заметил Генрих Герц в 1887 году, а подробно изучил Александр Столетов. В вакуумной лампе стоят металлический катод и анод. Свет падает на катод, и в цепи идёт ток.',
           'Волновая теория обещала: яркий свет любого цвета рано или поздно выбьет электроны. Опыт сказал другое. Есть красная граница λкр: если волна длиннее, электронов нет при любой яркости. А скорость вылетевших электронов зависит от частоты света, а не от яркости.',
           'Эйнштейн в 1905 году объяснил это квантами. Один квант hν отдаёт энергию одному электрону: hν = A + Eк. Часть уходит на работу выхода A, остаток — кинетическая энергия. Если на анод подать «минус», поле тормозит электроны. Ток пропадает при задерживающем напряжении Uз, когда eUз = Eк max.'],
    why: 'Фотоэффект работает в каждом датчике света: в турникетах метро, в автоматических дверях, в фотоэлектронных умножителях медицинских томографов, которые ловят отдельные фотоны. Родственный внутренний фотоэффект в полупроводниках — основа камер телефонов и солнечных панелей. Солнечные станции в Казахстане строят в Туркестанской, Жамбылской и Карагандинской областях: им нужны инженеры-энергетики, монтажники и наладчики.',
    safe: 'Ультрафиолетовые лампы обжигают глаза и кожу, как сварка. В свет УФ-лампы не смотрят, работают в защитных очках.',
    task: 'Освещайте натрий светом 400 нм и найдите задерживающее напряжение: подберите U, при котором ток только-только пропадает.',
    hint: 'Выберите натрий и λ = 400 нм. Тяните ручку U влево, в минус. Ток стал 0 — шагните на 0,05 В обратно: если ток вернулся, вы на месте.',
    stage: 'Тяните ручки U и λ. Голубые точки — электроны, вылетевшие из катода.',
    init: { metal: 'Na', lam1: 500, flux: 60, U: 0 },

  { id: 'photon', title: 'Фотон',

const LS_KEY = 'luch-phys-quant';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            metal: 'Na', lam1: 500, flux: 60, U: 0, lam2: 450, lv: 2, mirrors: false, pump: 50, n2: 0, q: 0, okT: 0,
            U4: 150, slits: 2, det: false, fast: false };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- models ----------
function photoModel() {
  const mt = METALS[S.metal], Eph = HC / S.lam1, Ek = Eph - mt.A, lamR = HC / mt.A;
  const Isat = Ek > 0 ? S.flux / 100 * 0.8 : 0;                 // мкА
  let I = 0;
  if (Isat > 0) I = S.U >= 0 ? Isat * (1 - 0.3 * Math.exp(-S.U / 0.5)) : Isat * 0.7 * Math.max(0, 1 + S.U / Ek);
  if (I < 1e-9) I = 0;
  return { kind: 'photo', metal: S.metal, mt, lam: S.lam1, flux: S.flux, U: S.U, Eph, Ek, Uz: Math.max(0, Ek), lamR, Isat, I,
           v: Ek > 0 ? Math.sqrt(2 * Ek * QE / ME) : 0 };
}
function photonModel() {
  const lam = S.lam2, E = HC / lam, EJ = E * QE;
  return { kind: 'photon', lam, E, EJ, p: H / (lam * 1e-9), nu: C / (lam * 1e-9), N: 1 / EJ, mass: EJ / (C * C) };
}
function laserModel() {
  const tc = S.mirrors ? LAS.tcM : LAS.tcN, nth = 0.5 + 1 / (2 * LAS.G * tc), W = S.pump / 100 * LAS.Wmax;
  return { kind: 'laser', lv: S.lv, mirrors: S.mirrors, pump: S.pump, W, n2: S.n2, n1: 1 - S.n2, D: 2 * S.n2 - 1, q: S.q,
           P: S.mirrors ? LAS.Pk * S.q : 0, nth, okT: S.okT, tc };
}
const deBroglie = U => H / Math.sqrt(2 * ME * QE * U) * 1e9;     // нм
function waveModel() {
  const lam = deBroglie(S.U4), dx = lam * 1e-9 * WV.L / (WV.d * 1e-6) * 1e6;  // мкм
  return { kind: 'wave', U: S.U4, lam, dx, v: Math.sqrt(2 * QE * S.U4 / ME), p: Math.sqrt(2 * ME * QE * S.U4), slits: S.slits, det: S.det, n: hits.n, fast: S.fast };
}
function model() { return { photo: photoModel, photon: photonModel, laser: laserModel, wave: waveModel }[LID()](); }

// interference: probability density on the screen, max 1
function pattern(y) {
  const lam = deBroglie(S.U4) * 1e-9, k = Math.PI * y * 1e-6 / (lam * WV.L);
  const al = k * WV.a * 1e-6, be = k * WV.d * 1e-6, sinc = Math.abs(al) < 1e-9 ? 1 : Math.sin(al) / al;
  return (S.slits === 2 && !S.det ? Math.cos(be) ** 2 : 1) * sinc * sinc;
}

// ---------- colours ----------
function wlColor(nm) {
  if (nm < 380) return '#8c7ae0';
  if (nm > 780) return '#7a3030';
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else r = 1;
  const f = nm < 420 ? 0.35 + 0.65 * (nm - 380) / 40 : nm > 700 ? 0.35 + 0.65 * (780 - nm) / 80 : 1;
  return '#' + [r, g, b].map(v => Math.round(255 * Math.pow(v * f, 0.8)).toString(16).padStart(2, '0')).join('');
}
const rangeName = nm => nm < 380 ? 'ультрафиолет' : nm < 450 ? 'фиолетовый' : nm < 485 ? 'синий' : nm < 500 ? 'голубой' : nm < 565 ? 'зелёный' : nm < 590 ? 'жёлтый' : nm < 625 ? 'оранжевый' : nm <= 780 ? 'красный' : 'инфракрасный';

// ---------- on-stage knobs ----------
const KN = {
  photo: [{ k: 'U', x0: 150, x1: 410, y: 368, min: -3, max: 3, step: 0.05, lab: () => `U = ${fmt(S.U, 2)} В`, ends: ['−3 В', '+3 В'] },
          { k: 'lam1', x0: 150, x1: 410, y: 394, min: 200, max: 700, step: 5, lab: () => `λ = ${S.lam1} нм`, ends: ['200', '700 нм'], spec: true }],
  photon: [{ k: 'lam2', x0: 40, x1: 480, y: 360, min: 100, max: 1000, step: 1, lab: () => `λ = ${S.lam2} нм · ${rangeName(S.lam2)}`, ends: ['100', '1000 нм'], spec: true }],
  laser: [{ k: 'pump', x0: 120, x1: 400, y: 372, min: 0, max: 100, step: 1, lab: () => `Накачка ${S.pump} %`, ends: ['0', '100 %'] }],
  wave: [{ k: 'U4', x0: 60, x1: 380, y: 388, min: 50, max: 1000, step: 1, lab: () => `U = ${S.U4} В`, ends: ['50 В', '1000 В'] }],
};
const kx = (o, v) => o.x0 + (v - o.min) / (o.max - o.min) * (o.x1 - o.x0);
function knobsSVG() {
  let h = '';
  KN[LID()].forEach((o, i) => {
    if (o.spec) {
      let st = ''; for (let j = 0; j <= 24; j++) { const nm = o.min + (o.max - o.min) * j / 24; st += `<stop offset="${(j / 24).toFixed(3)}" stop-color="${wlColor(nm)}"/>`; }
      h += `<defs><linearGradient id="spg${i}" x1="0" x2="1">${st}</linearGradient></defs><rect x="${o.x0}" y="${o.y - 3}" width="${o.x1 - o.x0}" height="6" rx="3" fill="url(#spg${i})"/>`;
    } else h += `<rect x="${o.x0}" y="${o.y - 2}" width="${o.x1 - o.x0}" height="4" rx="2" fill="#26324a"/>`;
    if (o.k === 'U') h += `<path d="M${kx(o, 0)} ${o.y - 7}v14" stroke="${MUT}" stroke-width="1.2"/>`;
    const x = kx(o, S[o.k]);
    h += `<text x="${o.x0}" y="${o.y - 10}" font-size="10" fill="#e8ecf4">${o.lab()}</text><text x="${o.x1}" y="${o.y - 10}" font-size="8" fill="${MUT}" text-anchor="end">${o.ends[0]} … ${o.ends[1]}</text>`;
    h += `<rect class="knobhit" data-drag="knob${i}" x="${o.x0 - 12}" y="${o.y - 14}" width="${o.x1 - o.x0 + 24}" height="28" fill="transparent"/>`;
    h += `<circle data-drag="knob${i}" class="knobhit" cx="${x.toFixed(1)}" cy="${o.y}" r="8.5" fill="${CP}" stroke="${INK}" stroke-width="2"/><circle cx="${x.toFixed(1)}" cy="${o.y}" r="3" fill="${INK}" pointer-events="none"/>`;
  });
  return h;
}
function setVal(k, v) {
  const o = Object.values(KN).flat().find(x => x.k === k);
  if (o) { v = clamp(Math.round(v / o.step) * o.step, o.min, o.max); v = +v.toFixed(2); }
  if (S[k] === v) return;
  S[k] = v;
  if (k === 'U4') clearHits();
  update();
}

// ---------- particles (visual) ----------
let elec = [], phot = [], spawnE = 0, spawnP = 0;
const hits = { n: 0, pts: [], bins: new Array(WV.bins).fill(0), acc: 0, fl: [] };
function clearHits() { hits.n = 0; hits.pts = []; hits.bins = new Array(WV.bins).fill(0); hits.acc = 0; hits.fl = []; }
function sampleY() {
  for (let i = 0; i < 200; i++) { const y = (Math.random() * 2 - 1) * WV.half; if (Math.random() < pattern(y)) return y; }
  return 0;
}
function addHit(y) {
  if (hits.n >= 8000) return false;
  hits.n++;
  const sy = 250 - y * 0.275, sx = 408 + Math.random() * 54;
  hits.pts.push(sx, sy); if (hits.pts.length > 6000) hits.pts.splice(0, 2);
  const b = Math.min(WV.bins - 1, Math.floor((y + WV.half) / (2 * WV.half) * WV.bins)); hits.bins[b]++;
  return true;
}

// ---------- scene ----------
const GLASS = 'rgba(200,225,255,.07)', GLASS_S = '#9fb3d1';
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
function back() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function lampSVG(x, y, col, on, label) {
  let h = ol(`M${x} ${y - 20}h46q6 0 6 6v28q0 6-6 6H${x}q-6 0-6-6v-28q0-6 6-6z`, '#2a3348', '#56627d', 1.8);
  h += `<circle cx="${x + 54}" cy="${y}" r="9" fill="${on ? col : '#3a4762'}" stroke="${INK}" stroke-width="2" opacity="${on ? 0.95 : 1}"/>`;
  h += `<text x="${x + 20}" y="${y + 4}" font-size="9" fill="#e8ecf4" text-anchor="middle">${label}</text>`;
  return h;
}

function photoScene(t) {
  const m = photoModel(), col = wlColor(S.lam1), uv = S.lam1 < 380;
  let h = lampSVG(20, 232, col, S.flux > 0, 'лампа');
  h += `<text x="44" y="200" font-size="10" fill="${MUT}" text-anchor="middle">${uv ? 'УФ, невидим' : rangeName(S.lam1)}</text>`;
  if (S.flux > 0) h += `<path d="M80 226L80 238L188 266L188 198Z" fill="${col}" opacity="${(0.08 + 0.3 * S.flux / 100).toFixed(2)}"${uv ? ' stroke="#8c7ae0" stroke-dasharray="4 4" stroke-width="1"' : ''}/>`;
  // tube
  h += `<rect x="150" y="178" width="252" height="124" rx="56" fill="${GLASS}"/>` + ol('M206 178H346A56 56 0 0 1 346 302H206A56 56 0 0 1 206 178Z', 'none', GLASS_S, 2.2);
  h += `<path d="M190 202Q201 240 190 278" fill="none" stroke="${INK}" stroke-width="11" stroke-linecap="round"/><path d="M190 202Q201 240 190 278" fill="none" stroke="${m.mt.col}" stroke-width="7" stroke-linecap="round"/>`;
  h += `<rect x="372" y="212" width="9" height="56" rx="2" fill="#a9b4c9" stroke="${INK}" stroke-width="2"/>`;
  h += `<text x="212" y="198" font-size="10" fill="#e8ecf4" text-anchor="middle">К · ${S.metal}</text><text x="377" y="206" font-size="10" fill="#e8ecf4" text-anchor="middle">А</text>`;
  const pa = S.U >= 0 ? '+' : '−', pk = S.U >= 0 ? '−' : '+';
  if (Math.abs(S.U) > 0.001) h += `<text x="392" y="226" font-size="13" fill="${S.U >= 0 ? WARN : C1}">${pa}</text><text x="170" y="226" font-size="13" fill="${S.U >= 0 ? C1 : WARN}">${pk}</text>`;
  // photons into the cathode
  for (const p of phot) { const k = p.x; const x = 82 + k * 104, y = 232 + p.o * (1 + k * 2.6), wv = 3; h += `<path d="M${(x - 8).toFixed(1)} ${y.toFixed(1)}q2 -${wv} 4 0t4 0t4 0t4 0" fill="none" stroke="${uv ? '#c9bcff' : col}" stroke-width="1.6"/>`; }
  for (const e of elec) h += `<circle cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="2.6" fill="${C1}" stroke="${INK}" stroke-width=".8"/>`;
  // circuit
  h += ol('M190 302V340H252M290 340H330M358 340H378V302', 'none', '#56627d', 2);
  h += `<path d="M262 328v24M270 334v12M278 328v24M286 334v12" stroke="#e8ecf4" stroke-width="2"/>`;
  h += `<text x="271" y="322" font-size="9" fill="${MUT}" text-anchor="middle">источник</text>`;
  h += `<circle cx="344" cy="340" r="14" fill="#1a2438" stroke="#a9b4c9" stroke-width="2"/><text x="344" y="344" font-size="10" fill="${m.I > 0 ? OK : MUT}" text-anchor="middle">мкА</text>`;
  h += `<text x="344" y="318" font-size="10" fill="${m.I > 0 ? OK : '#e8ecf4'}" text-anchor="middle">${fmt(m.I, 3)}</text>`;
  return h + knobsSVG();
}

function photonScene(t) {
  const m = photonModel(), col = wlColor(S.lam2);
  let h = lampSVG(20, 228, col, true, '1 Вт');
  h += `<path d="M80 228H398" stroke="#26324a" stroke-width="1" stroke-dasharray="3 5"/>`;
  const lp = clamp(S.lam2 / 12, 8, 84);
  for (const p of phot) {
    const x = p.x, n = Math.max(2, Math.round(28 / lp * 2) / 2 + 1.5);
    let d = '', L = lp * 2.2;
    for (let s = 0; s <= 40; s++) { const u = s / 40, xx = x - L / 2 + u * L, env = Math.sin(Math.PI * u), yy = 228 - 11 * env * Math.sin(2 * Math.PI * (xx - x) / lp); d += (s ? 'L' : 'M') + xx.toFixed(1) + ' ' + yy.toFixed(1); }
    h += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
  }
  // detector
  h += ol('M400 192h72v72h-72z', '#1a2438', '#56627d', 2);
  h += `<text x="436" y="210" font-size="8.5" fill="${MUT}" text-anchor="middle">счётчик</text><text x="436" y="234" font-size="12" fill="${OK}" text-anchor="middle">${sci(m.N, 2)}</text><text x="436" y="250" font-size="8.5" fill="${MUT}" text-anchor="middle">фотонов/с</text>`;
  // energy bar: 0…12,4 эВ
  const bx = 80, bw = 300, ex = bx + Math.min(1, m.E / 12.4) * bw;
  h += `<text x="${bx}" y="276" font-size="10" fill="#e8ecf4">энергия фотона E = ${fmt(m.E, 2)} эВ</text>`;
  h += `<rect x="${bx}" y="283" width="${bw}" height="8" rx="2" fill="#1a2438"/><rect x="${bx}" y="283" width="${(ex - bx).toFixed(1)}" height="8" rx="2" fill="${CP}"/>`;
  h += `<text x="${bx}" y="310" font-size="10" fill="#e8ecf4">импульс p = ${sci(m.p, 2)} кг·м/с</text>`;
  h += `<rect x="${bx}" y="317" width="${bw}" height="8" rx="2" fill="#1a2438"/><rect x="${bx}" y="317" width="${(Math.min(1, m.p / 6.63e-27) * bw).toFixed(1)}" height="8" rx="2" fill="${C1}"/>`;

// laser: 42 atoms in the rod, a fixed shuffled order decides which ones are excited

// ---------- simulation loop ----------
function laserStep(dt) {
  const W = S.pump / 100 * LAS.Wmax, tc = S.mirrors ? LAS.tcM : LAS.tcN, hstep = 0.002, n = Math.ceil(dt / hstep), h = dt / n;
  let a = S.n2, q = S.q;

    const da = W * (1 - a) - (S.lv === 2 ? W * a : 0) - a - LAS.G * q * D;
    const dq = LAS.G * q * D - q / tc + LAS.beta * a;

  }

}
let last = performance.now(), lastDraw = 0, lastUpd = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  let anim = !!S.hl, light = false;
  if (id === 'photo') {
    const m = photoModel();
    spawnP += dt * S.flux / 100 * 14;
    while (spawnP >= 1) { spawnP -= 1; phot.push({ x: 0, o: (Math.random() * 2 - 1) * 5 }); }
    phot.forEach(p => p.x += dt * 1.6);
    const arrived = phot.filter(p => p.x >= 1).length; phot = phot.filter(p => p.x < 1);
    if (m.Ek > 0) for (let i = 0; i < arrived; i++) if (Math.random() < 0.8) elec.push({ x: 194, y: 206 + Math.random() * 68, v: 150 * Math.sqrt(Math.max(0.03, Math.random() * m.Ek)) });
    const D = 186, s = 150, acc = s * s * S.U / (2 * D);
    for (const e of elec) { e.v += acc * dt; e.x += e.v * dt; }
    elec = elec.filter(e => e.x < 371 && e.x > 192).slice(-400);
    anim = true;
  } else if (id === 'photon') {
    const m = photonModel();
    spawnP += dt * m.N / 1e18 * 0.9;
    while (spawnP >= 1) { spawnP -= 1; phot.push({ x: 84 }); }
    phot.forEach(p => p.x += dt * 120); phot = phot.filter(p => p.x < 396);
    anim = true;
  } else if (id === 'laser') {
    laserStep(dt); anim = true;
    if (t - lastUpd > 150) { lastUpd = t; light = true; }
  } else if (id === 'wave') {
    if (S.fast) {
      hits.acc += dt * 260;
      while (hits.acc >= 1) { hits.acc -= 1; if (!addHit(sampleY())) { hits.acc = 0; break; } }
      anim = true;
    } else {
      hits.acc += dt * 2.5;
      if (hits.acc >= 1) { hits.acc = 0; hits.fl.push({ t0: t, y: sampleY() }); }
      for (const f of hits.fl) if (t - f.t0 >= 900) addHit(f.y);
      hits.fl = hits.fl.filter(f => t - f.t0 < 900);
      anim = true;
    }
    if (t - lastUpd > 150) { lastUpd = t; light = true; }
  }
  if (light) update(true);
  if (dirty || (anim && t - lastDraw > 33)) { drawScene(t); dirty = false; lastDraw = t; }
}

function taskState(m) {
  const Ls = L();
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'photo') {
    if (S.metal !== 'Na') return `Сейчас катод из ${METALS[S.metal].gen}, а нужен натрий`;
    if (S.lam1 !== 400) return `λ = ${S.lam1} нм, нужно 400 нм · I = ${fmt(m.I, 3)} мкА`;
    if (S.flux === 0) return 'Лампа выключена — прибавьте яркость';
    if (m.I > 0) return `U = ${fmt(S.U, 2)} В · ток ещё идёт: ${fmt(m.I, 3)} мкА`;
    return `U = ${fmt(S.U, 2)} В · тока нет, но, может быть, вы ушли слишком далеко`;

  if (Ls.id === 'photon') return `λ = ${S.lam2} нм · ${sci(m.N, 2)} фотонов/с`;

    if (S.lv === 2) return `Два уровня · возбуждено ${Math.round(m.n2 * 100)} %`;

}

      step('энергия кванта', `1240 / ${S.lam1} = ${fmt(m.Eph, 3)} эВ`) + step('работа выхода A', `${fmt(m.mt.A, 1)} эВ`) +
      step('красная граница λкр = hc/A', `1240 / ${fmt(m.mt.A, 1)} = ${fmt(m.lamR, 0)} нм`);
    if (m.Ek > 0) h += step('Eк max = hν − A', `${fmt(m.Eph, 3)} − ${fmt(m.mt.A, 1)} = ${fmt(m.Ek, 3)} эВ`) + step('v max = √(2Eк/m)', `${sci(m.v, 2)} м/с`) + step('Uз = Eк max / e', `${fmt(m.Ek, 3)} В`, 'sum');
    else h += step('итог', `${S.lam1} нм > ${fmt(m.lamR, 0)} нм — электроны не вылетают`, 'sum');
    h += `</div><h3>Ток сейчас</h3><div class="steps">` + step('U', `${fmt(S.U, 2)} В`) + step('I', `${fmt(m.I, 3)} мкА`) + step('ток насыщения', `${fmt(m.Isat, 3)} мкА`) + `</div>
      <p class="note" style="margin-top:10px">Ярче свет — больше фотонов — больше электронов и выше ток насыщения. Но Uз от яркости не зависит: каждый электрон получает энергию от одного фотона.</p>`;
    return h;
  }
  if (id === 'photon') {
    return `<h2>Энергия, импульс, число фотонов</h2><div class="formula">E = hc/λ &nbsp; p = h/λ &nbsp; N = P/E</div><h3>λ = ${S.lam2} нм</h3><div class="steps">` +
      step('частота ν = c/λ', `${sci(C, 3)} / ${sci(S.lam2 * 1e-9, 2)} = ${sci(m.nu, 3)} Гц`) +
      step('E = hν', `${sci(m.EJ, 3)} Дж = ${fmt(m.E, 3)} эВ`) +
      step('p = h/λ', `${sci(m.p, 3)} кг·м/с`) +
      step('m = E/c² (масса «на ходу»)', `${sci(m.mass, 2)} кг`) +
      step('N = P/E при P = 1 Вт', `1 / ${sci(m.EJ, 3)} = ${sci(m.N, 3)} 1/с`, 'sum') + `</div>
      <h3>Как найти λ по числу фотонов</h3><div class="steps">` + step('N = P/E = Pλ/(hc)', 'λ = N·h·c / P') + step('подставьте N', 'h·c = 1,986·10⁻²⁵ Дж·м') + `</div>
      <p class="note" style="margin-top:10px">Сравните: масса электрона 9,1·10⁻³¹ кг. Фотон видимого света «весит» в сотни тысяч раз меньше.</p>`;
  }
  if (id === 'laser') {
    const W = m.W;
    let h = `<h2>Когда лазер начинает светить</h2><div class="formula">усиление &gt; потери</div><p class="note">Модель: время жизни на уровне 2 принято за 1 с (в рубине — около 3 мс, мы замедлили время). Накачка W — доля невозбуждённых атомов, которые лампа поднимает за это время.</p><h3>Сейчас</h3><div class="steps">` +
      step('W = накачка × 5', `${S.pump} % → ${fmt(W, 2)}`) + step('на уровне 2 / на уровне 1', `${Math.round(m.n2 * 100)} % / ${Math.round(m.n1 * 100)} %`) +
      step('инверсия n₂ − n₁', `${fmt(m.D * 100, 0)} %`);
    if (S.lv === 2) h += step('предел двух уровней', `n₂ = W/(2W + 1) = ${Math.round(W / (2 * W + 1) * 100)} % &lt; 50 %`, 'sum');
    else h += step('без генерации n₂ = W/(W + 1)', `${Math.round(W / (W + 1) * 100)} %`);
    h += step('порог', m.nth < 1 ? `n₂ &gt; ${Math.round(m.nth * 100)} %` : 'недостижим: без зеркал фотоны сразу улетают') +
      step('луч', `${fmt(m.P, m.P < 1 ? 2 : 1)} мВт`, S.lv === 3 ? 'sum' : '') + `</div>`;
    if (S.lv === 3 && m.nth < 1) { const Wth = m.nth / (1 - m.nth); h += `<h3>Порог накачки</h3><div class="steps">` + step('W пор = n пор / (1 − n пор)', `${fmt(m.nth, 2)} / ${fmt(1 - m.nth, 2)} = ${fmt(Wth, 2)}`) + step('накачка', `≈ ${Math.round(Wth / LAS.Wmax * 100)} %`, 'sum') + `</div><p class="note" style="margin-top:10px">Выше порога лишние возбуждённые атомы сразу превращаются в фотоны луча: n₂ остаётся у порога, а мощность растёт с накачкой.</p>`; }
    h += `<h3>Фотон рубина</h3><div class="steps">` + step('E = 1240 / 694', `${fmt(HC / 694.3, 2)} эВ`) + `</div>`;
    return h;
  }
  return `<h2>Волна де Бройля</h2><div class="formula">λ = h/p = h/√(2meU)</div><h3>U = ${S.U4} В</h3><div class="steps">` +
    step('энергия eU', `${sci(QE * S.U4, 3)} Дж`) + step('скорость v = √(2eU/m)', `${sci(m.v, 3)} м/с`) +
    step('импульс p = √(2meU)', `${sci(m.p, 3)} кг·м/с`) + step('λ = h/p', `${sci(m.lam * 1e-9, 3)} м = ${fmt(m.lam, 4)} нм`, 'sum') + `</div>
    <h3>Полосы на экране</h3><div class="steps">` + step('Δx = λL/d', `${sci(m.lam * 1e-9, 3)} × 0,5 / ${sci(5e-7, 1)}`) + step('расстояние между полосами', `${fmt(m.dx, 1)} мкм`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Короче волна — теснее полосы. Удобная формула для электрона: λ ≈ 1,226 / √U нм (U в вольтах).</p>`;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'photo') {
    el.innerHTML = `<div class="k">Фототок</div><div class="v ${m.I > 0 ? 'ok' : ''}">${fmt(m.I, 3)} мкА</div>
      <div class="gauge"><b style="width:${clamp(m.I / 0.8 * 100, 0, 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>hν</span><span>${fmt(m.Eph, 2)} эВ</span></div><div class="lr"><span>A</span><span>${fmt(m.mt.A, 1)} эВ</span></div>`;
  } else if (m.kind === 'photon') {
    el.innerHTML = `<div class="k">Один фотон</div><div class="v">${fmt(m.E, 2)} эВ</div><div class="swatch" style="background:${wlColor(m.lam)}"></div>
      <div class="lr"><span>N/с</span><span>${sci(m.N, 2)}</span></div>`;
  } else if (m.kind === 'laser') {
    el.innerHTML = `<div class="k">Луч лазера</div><div class="v ${m.P >= LAS.need ? 'ok' : ''}">${fmt(m.P, m.P < 1 ? 2 : 1)} мВт</div>
      <div class="gauge"><b style="width:${clamp(m.n2 * 100, 0, 100).toFixed(1)}%;background:var(--force)"></b>${m.nth < 1 ? `<i style="left:${(m.nth * 100).toFixed(1)}%;background:var(--fg)"></i>` : ''}</div>
      <div class="lr"><span>уровень 2</span><span>${Math.round(m.n2 * 100)} %</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Электроны</div><div class="v">${m.n}</div><div class="lr"><span>λ</span><span>${fmt(m.lam, 4)} нм</span></div><div class="lr"><span>Δx</span><span>${S.slits === 2 && !S.det ? fmt(m.dx, 0) + ' мкм' : '—'}</span></div>`;
  }
}

function update(light) {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip(); light = false;
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Квантовая физика покорена!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  if (light) {
    const ov = $('#ovState'); if (ov && S.tab === 'overview') ov.textContent = taskState(m);
    if (S.tab === 'scheme') updateScheme(m);
    if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
  } else renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  photo: '<path d="M6 8l14 7" stroke="#8c7ae0" stroke-width="2"/><path d="M22 6q4 9 0 18" stroke="#c9ced8" stroke-width="3" fill="none"/><circle cx="32" cy="12" r="1.8" fill="#72d4e8"/><circle cx="40" cy="17" r="1.8" fill="#72d4e8"/><circle cx="48" cy="13" r="1.8" fill="#72d4e8"/><path d="M56 7v16" stroke="#a9b4c9" stroke-width="2.4"/>',
  photon: '<path d="M6 15q2-8 4 0t4 0 4 0" fill="none" stroke="#ff4d4d" stroke-width="1.6"/><path d="M30 15q1-8 2 0t2 0 2 0 2 0 2 0 2 0" fill="none" stroke="#8c7ae0" stroke-width="1.6"/><rect x="52" y="8" width="9" height="14" rx="1" fill="none" stroke="#e8ecf4" stroke-width="1.2"/>',
  laser: '<rect x="12" y="9" width="36" height="12" rx="2" fill="rgba(255,90,110,.25)" stroke="#d97a8a"/><rect x="8" y="6" width="3" height="18" fill="#c8d1e2"/><rect x="49" y="6" width="3" height="18" fill="#c8d1e2" opacity=".6"/><circle cx="20" cy="15" r="2" fill="#ffb547"/><circle cx="30" cy="15" r="2" fill="#ffb547"/><circle cx="40" cy="15" r="2" fill="#3a4762"/><rect x="52" y="14" width="14" height="2" fill="#ff4d4d"/>',
  wave: '<rect x="4" y="12" width="9" height="6" fill="#a9b4c9"/><path d="M24 3v10M24 15v0M24 17v10" stroke="#a9b4c9" stroke-width="2"/><path d="M44 4h8M44 8h8M44 12h8M44 16h8M44 20h8M44 24h8" stroke="#72d4e8" stroke-width="1.4" stroke-dasharray="1 1.5"/><path d="M54 6h6M54 10h3M54 14h8M54 18h3M54 22h6" stroke="#ffb547" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null; S.hl = null;
  Object.assign(S, L().init); S.n2 = 0; S.q = 0; S.okT = 0;
  elec = []; phot = []; spawnE = 0; spawnP = 0; clearHits();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'photo') now = `Фотоэлемент. Катод: ${m.mt.name}, работа выхода ${fmt(m.mt.A, 1)} эВ, красная граница ${fmt(m.lamR, 0)} нм. Свет λ = ${S.lam1} нм (${rangeName(S.lam1)}), энергия кванта ${fmt(m.Eph, 2)} эВ, яркость ${S.flux} %. ${m.Ek > 0 ? `Электроны вылетают, Eк max = ${fmt(m.Ek, 2)} эВ.` : 'Электроны не вылетают: λ больше красной границы.'} Напряжение на аноде U = ${fmt(S.U, 2)} В, фототок ${fmt(m.I, 3)} мкА (ток насыщения ${fmt(m.Isat, 3)} мкА).`;
  if (id === 'photon') now = `Лампа мощностью 1 Вт, длина волны ${S.lam2} нм (${rangeName(S.lam2)}). Энергия фотона ${fmt(m.E, 3)} эВ = ${sci(m.EJ, 3)} Дж, импульс ${sci(m.p, 3)} кг·м/с, частота ${sci(m.nu, 3)} Гц. Лампа испускает ${sci(m.N, 3)} фотонов в секунду. Цель задания — 3·10¹⁸ фотонов в секунду.`;
  if (id === 'laser') now = `Модель лазера (как рубиновый), время замедлено. Схема: ${S.lv} уровня. Зеркала: ${S.mirrors ? 'стоят (100 % и 95 %)' : 'сняты'}. Накачка ${S.pump} %. На верхнем лазерном уровне ${Math.round(m.n2 * 100)} % атомов, инверсия ${fmt(m.D * 100, 0)} %. Порог генерации: ${m.nth < 1 ? 'n₂ > ' + Math.round(m.nth * 100) + ' %' : 'недостижим без зеркал'}. Мощность луча ${fmt(m.P, 2)} мВт, нужно ≥ 30 мВт устойчиво.`;
  if (id === 'wave') now = `Опыт с электронами и щелями. U = ${S.U4} В, длина волны де Бройля ${fmt(m.lam, 4)} нм. Щелей: ${S.slits}, датчик у щелей ${S.det ? 'включён (полос нет)' : 'выключен'}. Режим: ${S.fast ? 'быстро' : 'по одному'}. На экране ${m.n} электронов. Расстояние между полосами по расчёту ${fmt(m.dx, 1)} мкм (d = 0,5 мкм, L = 0,5 м).`;
  return [
    `Раздел: физика, 11 класс, «Атом и Вселенная», тема «Кванты и свет». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовый ответ задания не называй.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { photo: 'Почему яркость не меняет задерживающее напряжение?', photon: 'Почему красных фотонов в лампе больше, чем синих?', laser: 'Зачем лазеру три уровня, а не два?', wave: 'Как одна частица может дать интерференцию?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
