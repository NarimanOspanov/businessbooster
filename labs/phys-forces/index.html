<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 7 класс: масса и плотность, сила тяжести, сила упругости и закон Гука, трение, динамометр.">
<title>Силы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

table.dens{width:100%;border-collapse:collapse;font-size:13px}
table.dens td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.dens td:last-child{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 5v5" stroke="var(--muted)" stroke-width="2"/><path d="M20 10l-5 2.5 10 2.5-10 2.5 10 2.5-5 2.5" fill="none" stroke="var(--arm)" stroke-width="2" stroke-linejoin="round"/><rect x="13" y="23" width="14" height="9" rx="2" fill="var(--fg)"/><path d="M20 27v9" stroke="var(--force)" stroke-width="2.4"/><path d="M16 33l4 5 4-5z" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Силы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с силами. Предметы можно тянуть и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? 1 : 2);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'density', title: 'Масса и плотность',
    text: ['Масса показывает, насколько тело инертно: чем больше масса, тем труднее изменить его скорость. Массу измеряют весами, в СИ — в килограммах (кг).',
           'Плотность показывает, какая масса вещества приходится на единицу объёма: ρ = m / V. Её измеряют в кг/м³ или г/см³; 1 г/см³ = 1000 кг/м³. У каждого вещества своя плотность, поэтому по ней можно узнать, из чего сделано тело.',
           'Объём тела сложной формы находят мензуркой: опускают тело в воду и смотрят, на сколько поднялся уровень. 1 мл = 1 см³.'],
    why: 'Ювелиры и сотрудники ломбардов проверяют золото по плотности: подделку из латуни выдаёт плотность меньше. Геологи по плотности образцов узнают руду — так ищут медь под Жезказганом и железо в Костанайской области. Инженеры-строители считают массу бетонной плиты по её объёму и плотности, чтобы подобрать кран.',
    task: 'Узнайте, из какого металла брусок X: измерьте его массу на весах, объём — мензуркой, найдите плотность и выберите металл.',
    hint: 'Перетащите брусок X на весы, потом в мензурку (или жмите кнопки внизу). Объём бруска — на сколько миллилитров поднялась вода.',
    stage: 'Тяните бруски на весы и в мензурку.',
    water: 60,
    bodies: [
      { id: 'A', name: 'Брусок A', V: 20, m: 54, col: '#c9d1dc', mat: 'алюминий' },
      { id: 'B', name: 'Брусок B', V: 10, m: 78, col: '#8f9aab', mat: 'сталь' },
      { id: 'X', name: 'Брусок X', V: 20, m: 178, col: '#c98a5e', mat: '' }],
    mats: ['алюминий', 'сталь', 'медь', 'свинец'], answer: 'медь',
    check: m => m.xm && m.xv && m.ans },
  { id: 'gravity', title: 'Сила тяжести',
    text: ['Сила — мера действия одного тела на другое. У силы есть величина, направление и точка приложения. Её измеряют в ньютонах (Н) и рисуют стрелкой.',
           'Планета притягивает к себе все тела. Эта сила — сила тяжести. Она направлена вертикально вниз, к центру планеты: Fтяж = m · g.',
           'Число g показывает, с какой силой планета тянет каждый килограмм. На Земле g ≈ 9,8 Н/кг, на Луне — 1,6 Н/кг. Масса тела на Луне та же, а сила тяжести примерно в 6 раз меньше.'],
    why: 'Инженеры Байконура рассчитывают, какую силу тяжести ракета должна преодолеть на старте. Крановщики и стропальщики знают: груз в 1 тонну тянет вниз с силой почти 10 000 Н, и берут тросы с запасом прочности. Конструкторы луноходов и скафандров учитывают, что на Луне всё «легче» в 6 раз, хотя масса та же.',
    task: 'Подберите массу груза, чтобы на Луне сила тяжести была 8 Н. Затем перенесите этот же груз на Землю и узнайте силу тяжести там.',
    hint: 'Fтяж = m · g, значит m = F / g. Массу меняйте кнопками − и +, планету — кнопками внизу. Груз можно поднять и отпустить: посмотрите, как он падает.',
    stage: 'Выберите планету и массу. Поднимите груз и отпустите.',
    planets: [
      { id: 'earth', name: 'Земля', g: 9.8, col: '#2f6b4a', top: '#4c9a62' },
      { id: 'moon', name: 'Луна', g: 1.6, col: '#5b606c', top: '#8b909c' },
      { id: 'mars', name: 'Марс', g: 3.7, col: '#8a4430', top: '#c0664a' },
      { id: 'jup', name: 'Юпитер', g: 24.8, col: '#7a5f43', top: '#c9a37a' }],
    m0: 1, fMoon: 8,
    check: m => m.moon && m.earth },
  { id: 'hooke', title: 'Упругость и закон Гука',
    text: ['Когда тело растягивают, сжимают или изгибают, в нём возникает сила упругости. Она направлена против деформации и стремится вернуть телу прежнюю форму.',

    divOpts: [0.1, 0.2, 0.5, 1], divAns: 0.2, readOpts: [2.2, 2.4, 2.6, 3.4], readAns: 2.4,

const LS_KEY = 'luch-phys-forces';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
const GL = 10; // g ≈ 10 Н/кг for school weights in lessons 3–5

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const D1 = { scx: 105, pan: 318, ccx: 285, cw: 52, cb: 385, mlPx: 1.4, shelfY: 388, shelf: { A: 405, B: 452, X: 497 } };
const side = V => 34 * Math.cbrt(V / 20);
const D2 = { cx: 190, ground: 300, box: 56 };
const D3 = { tx: 180, ty: 112, nat: 48, cm: 7, rx: 248, tray: 306, base: 392, wh: 13, gx0: 352, gy0: 372, gw: 156, gh: 190 };
const g3x = cm => D3.gx0 + D3.gw * cm / 20, g3y = F => D3.gy0 - D3.gh * F / 5;
const D4 = { top: 300, bw: 70, bh: 44, rest: 255, pxN: 5, b0: 24, bMax: 190 };
const D5 = { hx: 190, top: 76, z: 106, pxN: 30, shelfY: 392, shelf: { w: 384, apple: 436, pen: 488 }, mx: 330, my: 176, mr: 62, mz: 3 };

function resetState() {
  const Ls = L();
  Object.assign(S, {
    hl: null,
    loc: { A: 'shelf', B: 'shelf', X: 'shelf' }, meas: { A: {}, B: {}, X: {} }, sel: 'X', ans: false, held: null, pp: null,
    planet: 'earth', mass: Ls.m0 || 1, h: 0, vy: 0, fall: false, moon: false, earth: false,
    spr: 'X', n: 0, disp: 0, vel: 0, pts: { A: [], B: [], X: [] }, kOk: false,
    surf: 'wood', bm: 1, b: D4.b0, str: 0, pull: false, slid: 0, rec: {}, ratio: false, auto: false, edge: false,
    hung: null, div: false, read: false,
  });
}
resetState();

// ---------- model ----------
const body = id => L().bodies.find(b => b.id === id);
const level1 = () => { const Ls = L(); const inC = Object.keys(S.loc).find(k => S.loc[k] === 'cyl'); return Ls.water + (inC ? body(inC).V : 0); };
const onScale = () => Object.keys(S.loc).find(k => S.loc[k] === 'scale') || null;
const planet = () => L().planets.find(p => p.id === S.planet);
const sprK = () => L().springs.find(s => s.id === S.spr).k;
const dl3 = () => S.n * 1 / sprK() * 100;                // cm
const surf = () => L().surfs.find(s => s.id === S.surf);
const fMax4 = () => surf().mu * S.bm * GL;
const F4 = () => S.str / D4.pxN;
const sliding4 = () => S.pull && S.slid > 0 && F4() >= fMax4() - 1e-9 && !S.edge;
const hungF = () => S.hung ? L().objs.find(o => o.id === S.hung).F : 0;

function model() {
  const id = LID();
  if (id === 'density') return { kind: id, xm: !!S.meas.X.m, xv: !!S.meas.X.V, ans: S.ans, level: level1(), scale: onScale() };
  if (id === 'gravity') { const p = planet(); return { kind: id, g: p.g, F: S.mass * p.g, moon: S.moon, earth: S.earth }; }
  if (id === 'hooke') return { kind: id, F: S.n, dl: dl3(), ptsX: new Set(S.pts.X).size, kOk: S.kOk };
  if (id === 'friction') return { kind: id, F: F4(), fmax: fMax4(), r1: !!S.rec.wood1, r2: !!S.rec.wood2, ratio: S.ratio };
  return { kind: id, F: hungF(), div: S.div, read: S.read };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function arrow(x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L2 = Math.hypot(x2 - x1, y2 - y1); if (L2 < 2) return '';
  const hl = Math.min(12, L2 * 0.6), hx = x2 - hl * Math.cos(a), hy = y2 - hl * Math.sin(a);
  const p1 = `${(hx + 6 * Math.sin(a)).toFixed(1)} ${(hy - 6 * Math.cos(a)).toFixed(1)}`, p2 = `${(hx - 6 * Math.sin(a)).toFixed(1)} ${(hy + 6 * Math.cos(a)).toFixed(1)}`;
  return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linecap="round"/><path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1}L${p2}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
}
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <clipPath id="lens"><circle cx="${D5.mx}" cy="${D5.my}" r="${D5.mr}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function cube(x, y, s, col, label) {   // x = centre, y = bottom
  const d = s * 0.32, x0 = x - s / 2, y0 = y - s;
  return `<path d="M${x0} ${y0}l${d} ${-d}h${s}l${-d} ${d}z" fill="${col}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round" opacity=".85"/>
    <path d="M${x0 + s} ${y0}l${d} ${-d}v${s}l${-d} ${d}z" fill="${col}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round" opacity=".6"/>
    <rect x="${x0}" y="${y0}" width="${s}" height="${s}" fill="${col}" stroke="${INK}" stroke-width="1.6"/>` + T(x, y - s / 2 + 4, 11, INK, label, 'middle', 'font-weight="600"');
}
function zigzag(x, y1, y2, coils, w) {
  const n = coils * 2, dy = (y2 - y1 - 12) / n;
  let d = `M${x} ${y1}v6`;
  for (let i = 0; i < n; i++) d += `L${(x + (i % 2 ? -w : w)).toFixed(1)} ${(y1 + 6 + dy * (i + 0.5)).toFixed(1)}`;
  return d + `L${x} ${(y2 - 6).toFixed(1)}V${y2.toFixed(1)}`;
}
function weight(x, y, lab) {   // x = centre, y = top
  return `<rect x="${x - 17}" y="${y}" width="34" height="${D3.wh - 1}" rx="3" fill="#9aa4b6" stroke="${INK}" stroke-width="1.4"/><path d="M${x - 17} ${y + 4}h34" stroke="#6c7689" stroke-width="1"/>` + (lab ? T(x, y + 10, 7.5, INK, lab) : '');
}

// ---------- lesson 1: scales + measuring cylinder ----------
function densityScene() {
  const Ls = L(), lv = level1(), cy = D1.cb - lv * D1.mlPx, cx = D1.ccx, cw = D1.cw;
  let h = `<rect x="-2000" y="${D1.shelfY}" width="4520" height="1200" fill="#151e2e"/><path d="M-2000 ${D1.shelfY}H2520" stroke="#3a4762" stroke-width="2"/>`;
  // scales
  const sc = onScale();
  h += `<rect x="${D1.scx - 70}" y="${D1.pan + 22}" width="140" height="48" rx="8" fill="#26324a" stroke="${INK}" stroke-width="1.6"/>`;
  h += `<rect x="${D1.scx - 40}" y="${D1.pan + 32}" width="80" height="26" rx="4" fill="#0c1a14" stroke="#3a4762"/>` + T(D1.scx, D1.pan + 51, 15, '#86e0a8', `${sc ? body(sc).m : 0} г`, 'middle', 'font-weight="500"');
  h += `<rect x="${D1.scx - 6}" y="${D1.pan + 4}" width="12" height="18" fill="#3a4762"/><rect x="${D1.scx - 60}" y="${D1.pan - 2}" width="120" height="8" rx="3" fill="#a9b4c9" stroke="${INK}" stroke-width="1.4"/>`;
  h += T(D1.scx, D1.pan + 84, 9.5, '#8b96ad', 'весы');
  // cylinder: water, then the body, then marks
  const top = D1.cb - 150 * D1.mlPx;
  h += `<rect x="${cx - cw / 2}" y="${cy.toFixed(1)}" width="${cw}" height="${(D1.cb - cy).toFixed(1)}" fill="rgba(95,180,217,.42)"/>`;
  h += `<path d="M${cx - cw / 2} ${cy.toFixed(1)}h${cw}" stroke="#9fd8f0" stroke-width="2"/>`;
  for (let ml = 0; ml <= 150; ml += 5) {
    const y = D1.cb - ml * D1.mlPx, big = ml % 10 === 0;
    h += `<path d="M${cx - cw / 2} ${y.toFixed(1)}h${big ? 12 : 7}" stroke="#c8d2e3" stroke-width="1"/>`;
    if (big && ml > 0) h += T(cx - cw / 2 - 5, y + 3, 8.5, '#8b96ad', ml, 'end');
  }
  h += `<path d="M${cx - cw / 2} ${top - 8}V${D1.cb}h${cw}V${top - 8}" fill="none" stroke="#c8d2e3" stroke-width="2.2" opacity=".85"/><path d="M${cx - cw / 2 - 18} ${D1.cb + 1}h${cw + 36}" stroke="#c8d2e3" stroke-width="3"/>`;
  h += T(cx, top - 16, 9.5, '#8b96ad', 'мл') + T(cx + cw / 2 + 6, cy + 4, 10, '#9fd8f0', `${lv} мл`, 'start', halo);
  // bodies
  for (const b of Ls.bodies) {
    const s = side(b.V), lc = S.loc[b.id];
    let x, y;
    if (S.held === b.id && S.pp) { x = S.pp.x; y = S.pp.y + s / 2; }
    else if (lc === 'scale') { x = D1.scx; y = D1.pan - 2; }
    else if (lc === 'cyl') { x = cx - 4; y = D1.cb; }
    else { x = D1.shelf[b.id]; y = D1.shelfY; }
    h += `<g data-drag="body-${b.id}"><rect x="${x - s / 2 - 10}" y="${y - s - 18}" width="${s + 26}" height="${s + 26}" fill="transparent"/>${cube(x, y, s, b.col, b.id)}</g>`;
    if (lc === 'cyl' && S.held !== b.id) h += `<rect x="${cx - cw / 2}" y="${(D1.cb - s).toFixed(1)}" width="${cw}" height="${s.toFixed(1)}" fill="rgba(95,180,217,.28)" pointer-events="none"/>`;
  }
  h += T(D1.shelf.B, D1.shelfY + 16, 9.5, '#8b96ad', 'полка');
  return h;
}

// ---------- lesson 2: planet and crate ----------
function gravityScene() {
  const Ls = L(), p = planet(), F = S.mass * p.g, gy = D2.ground, x = D2.cx, s = D2.box;
  let h = `<rect x="-2000" y="${gy}" width="4520" height="1200" fill="${p.col}"/><path d="M-2000 ${gy}H2520" stroke="${p.top}" stroke-width="4"/>`;
  if (p.id === 'jup') for (let i = 0; i < 6; i++) h += `<path d="M-2000 ${gy + 14 + i * 16}H2520" stroke="${i % 2 ? '#b08a5e' : '#6b5038'}" stroke-width="5" opacity=".6"/>`;
  else for (let i = 0; i < 14; i++) h += `<ellipse cx="${-40 + i * 47}" cy="${gy + 22 + (i * 37) % 60}" rx="${8 + (i * 7) % 10}" ry="3" fill="${p.top}" opacity=".35"/>`;
  // badge
  h += `<circle cx="430" cy="190" r="44" fill="${p.col}" stroke="${p.top}" stroke-width="3"/>` + T(430, 186, 13, '#e8ecf4', p.name, 'middle', 'font-weight="600" ' + halo) + T(430, 204, 11, '#e8ecf4', `g = ${fmt(p.g, 1)} Н/кг`, 'middle', halo);
  // height marker
  const by = gy - S.h;
  if (S.h > 2) h += `<path d="M${x + s / 2 + 12} ${by}V${gy}" stroke="#8b96ad" stroke-width="1" stroke-dasharray="3 3"/>`;
  // crate
  h += `<g data-drag="crate"><rect x="${x - s / 2 - 14}" y="${by - s - 14}" width="${s + 28}" height="${s + 28}" fill="transparent"/>
    <rect x="${x - s / 2}" y="${(by - s).toFixed(1)}" width="${s}" height="${s}" rx="4" fill="#b98a52" stroke="${INK}" stroke-width="2"/>
    <path d="M${x - s / 2 + 4} ${(by - s + 4).toFixed(1)}L${x + s / 2 - 4} ${(by - 4).toFixed(1)}M${x + s / 2 - 4} ${(by - s + 4).toFixed(1)}L${x - s / 2 + 4} ${(by - 4).toFixed(1)}" stroke="#8a6238" stroke-width="3"/>
    ${T(x, by - s / 2 - 6, 11, '#e8ecf4', `${nf(S.mass)} кг`, 'middle', 'font-weight="600" ' + halo)}</g>`;
  // gravity arrow from the centre of the crate
  const len = Math.min(170, 11 * Math.sqrt(F)), c = by - s / 2;
  h += `<circle cx="${x}" cy="${c.toFixed(1)}" r="3.5" fill="#ffb547" stroke="${INK}" stroke-width="1.2"/>`;
  h += arrow(x, c, x, c + len, '#ffb547', 3.4);
  h += T(x + 14, c + len - 2, 12, '#ffb547', `Fтяж = ${fmt(F, 1)} Н`, 'start', halo);
  h += T(x - 64, gy - 8, 9.5, p.top, 'к центру планеты ↓', 'end');
  return h;
}

// ---------- lesson 3: spring on a stand ----------
function hookeScene() {
  const Ls = L(), hy = D3.ty + D3.nat + S.disp, tx = D3.tx;
  let h = `<rect x="-2000" y="${D3.base}" width="4520" height="1200" fill="#151e2e"/><path d="M-2000 ${D3.base}H2520" stroke="#3a4762" stroke-width="2"/>`;
  // stand
  h += `<rect x="50" y="${D3.base - 8}" width="150" height="8" rx="2" fill="#4a5875" stroke="${INK}"/><rect x="66" y="88" width="8" height="${D3.base - 96}" fill="#6c7a96" stroke="${INK}"/><rect x="66" y="${D3.ty - 8}" width="${tx - 60}" height="7" fill="#6c7a96" stroke="${INK}"/>`;
  // ruler
  h += `<rect x="${D3.rx}" y="${D3.ty + D3.nat - 12}" width="30" height="${25 * D3.cm + 24}" rx="3" fill="#e9d9a8" stroke="${INK}" stroke-width="1.4"/>`;
  for (let c = 0; c <= 25; c++) {
    const y = D3.ty + D3.nat + c * D3.cm, big = c % 5 === 0;
    h += `<path d="M${D3.rx} ${y}h${big ? 12 : 7}" stroke="#3b3320" stroke-width="1"/>`;
    if (big) h += T(D3.rx + 26, y + 3, 8.5, '#3b3320', c, 'end');
  }
  h += T(D3.rx + 15, D3.ty + D3.nat - 18, 9, '#8b96ad', 'см');
  // spring
  const k = sprK(), coils = k >= 100 ? 9 : k >= 40 ? 11 : 13, wz = k >= 100 ? 9 : k >= 40 ? 8 : 7;
  h += `<path d="${zigzag(tx, D3.ty, hy, coils, wz)}" fill="none" stroke="${S.spr === 'X' ? '#ffb547' : '#72d4e8'}" stroke-width="${k >= 100 ? 2.6 : 2}" stroke-linejoin="round"/>`;
  h += `<path d="M${tx} ${hy}v6a4 4 0 1 1 -4 4" fill="none" stroke="#c8d2e3" stroke-width="2"/>`;
  h += T(tx - 18, D3.ty + 22, 11, S.spr === 'X' ? '#ffb547' : '#72d4e8', S.spr, 'end', 'font-weight="600"');
  // pointer to the ruler
  h += `<path d="M${tx + 10} ${hy.toFixed(1)}H${D3.rx + 14}" stroke="#ff8a73" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M${D3.rx + 14} ${hy.toFixed(1)}l-7 -4v8z" fill="#ff8a73"/>`;
  // hung weights
  if (S.n > 0) {
    h += `<g data-drag="wt-hung">`;
    for (let i = 0; i < S.n; i++) h += weight(tx, hy + 14 + i * D3.wh, i === 0 ? '' : '');
    h += `<rect x="${tx - 26}" y="${hy + 10}" width="52" height="${S.n * D3.wh + 8}" fill="transparent"/></g>`;
    h += arrow(tx - 34, hy + 14 + S.n * D3.wh / 2, tx - 34, hy + 14 + S.n * D3.wh / 2 - 40, '#86e0a8', 2.6) + T(tx - 40, hy - 2 + S.n * D3.wh / 2 - 30, 10, '#86e0a8', 'Fупр', 'end', halo);
  }
  // tray
  const nt = Ls.nMax - S.n;
  h += `<g data-drag="wt-tray">`;
  for (let i = 0; i < nt; i++) h += weight(D3.tray, D3.base - (i + 1) * D3.wh, '100 г');
  if (nt > 0) h += `<rect x="${D3.tray - 26}" y="${D3.base - nt * D3.wh - 10}" width="52" height="${nt * D3.wh + 10}" fill="transparent"/>`;

// fit the scene: 520 × 405 units, centred, content at the bottom

// lesson 1
function place1(id, where) {
  if (!id) return;
  if (where !== 'shelf') for (const k in S.loc) if (S.loc[k] === where && k !== id) S.loc[k] = 'shelf';
  S.loc[id] = where; S.sel = id;
  const b = body(id);
  if (where === 'scale') { S.meas[id].m = b.m; toast(`${b.name}: весы показывают ${b.m} г.`); }
  if (where === 'cyl') { S.meas[id].V = b.V; toast(`Вода поднялась с ${L().water} до ${L().water + b.V} мл.`); }
  renderTools(); buildScheme(); update();
}
// lesson 2
function setMass(m) { m = clamp(Math.round(m * 2) / 2, 0.5, 20); if (m === S.mass) return; S.mass = m; checkGrav(); renderTools(); update(); }
function setPlanet(pid) { if (pid === S.planet) return; S.planet = pid; checkGrav(); renderTools(); buildScheme(); update(); }
function checkGrav() {
  const Ls = L(), F = S.mass * planet().g;
  if (!S.moon && S.planet === 'moon' && Math.abs(F - Ls.fMoon) < 1e-9) { S.moon = true; toast(`На Луне на груз ${nf(S.mass)} кг действует сила тяжести 8 Н. Теперь на Землю!`); }
  else if (S.moon && !S.earth && S.planet === 'earth' && S.mass === 5) { S.earth = true; toast(`На Земле тот же груз 5 кг тянет вниз с силой ${fmt(F, 0)} Н — в 6 с лишним раз сильнее.`); }
}
// lesson 3
function setN(n) {
  n = clamp(n, 0, L().nMax); if (n === S.n) return;
  S.n = n; if (n > 0) S.pts[S.spr].push(n);
  if (reduce) { S.disp = dl3() * D3.cm; S.vel = 0; }
  renderTools(); buildScheme(); update();
}
function setSpring(id) { if (id === S.spr) return; S.spr = id; if (S.n > 0) S.pts[id].push(S.n); if (reduce) S.disp = dl3() * D3.cm; renderTools(); buildScheme(); update(); }
// lesson 4
function pullTo(hx) {
  let str = hx - (S.b + D4.rest);
  if (str < 0) str = 0;
  const fm = fMax4() * D4.pxN;
  if (str > fm) {
    const mv = str - fm;
    if (S.b + mv > D4.bMax) { S.b = D4.bMax; S.edge = true; }
    else { S.b += mv; S.slid += mv; }
    str = fm;
  }
  S.str = Math.min(str, 15 * D4.pxN);
  if (S.slid > 24 && !S.edge) record4();

}
function record4() {
  const k = S.surf + S.bm;
  if (S.rec[k]) return;
  S.rec[k] = { surf: surf().name, m: S.bm, F: fMax4() };
  toast(`Брусок поехал: трение скольжения ${fmt(fMax4(), 1)} Н (${surf().name}, ${S.bm} кг).`);
  renderTools(); buildScheme();
}
function release4() { S.pull = false; S.auto = false; if (reduce) S.str = 0; }
// lesson 5
function hang5(o) {
  if (o === S.hung) { dirty = true; return; }
  S.hung = o;
  if (reduce) { S.disp = hungF() * D5.pxN; S.vel = 0; }
  renderTools(); buildScheme(); update();

let last = performance.now();

    if (reduce) { S.h = 0; S.fall = false; }
    else { S.vy += planet().g * 40 * dt; S.h -= S.vy * dt; if (S.h <= 0) { S.h = 0; S.fall = false; } }
    dirty = true;
  }
  if (id === 'hooke' || id === 'dyno') {
    const target = id === 'hooke' ? dl3() * D3.cm : hungF() * D5.pxN;
    if (Math.abs(S.disp - target) > 0.05 || Math.abs(S.vel) > 0.05) {
      if (reduce) { S.disp = target; S.vel = 0; }
      else { const a = -60 * (S.disp - target) - 4.5 * S.vel; S.vel += a * dt; S.disp += S.vel * dt; }
      dirty = true;
    }
  }
  if (id === 'friction') {
    if (S.auto) {
      pullTo(S.b + D4.rest + S.str + (reduce ? 4 : 70 * dt));
      if (S.slid > 60 || S.edge || S.str >= 15 * D4.pxN) { release4(); renderTools(); }
    } else if (!S.pull && S.str > 0) { S.str = Math.max(0, S.str - 300 * dt); dirty = true; if (S.str === 0) update(); }
  }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function renderTools() {
  const id = LID(), tb = $('#tools'), Ls = L();

    if (S.meas.X.m && S.meas.X.V && !S.ans) h += sep + Ls.mats.map(m => B('mat-' + m, m, undefined, 'rec')).join('');

  if (id === 'hooke') {
    h = Ls.springs.map(s => B('sp-' + s.id, 'пружина ' + s.id, S.spr === s.id)).join('') + sep + B('n-', '− груз') + B('n+', '+ груз');
    if (S.spr === 'X' && new Set(S.pts.X).size >= 2 && !S.kOk) h += sep + Ls.kOpts.map(k => B('k-' + k, nf(k) + ' Н/м', undefined, 'rec')).join('');
  }
  if (id === 'friction') {
    h = Ls.surfs.map(s => B('sf-' + s.id, s.name, S.surf === s.id)).join('') + sep + B('bm-1', '1 кг', S.bm === 1) + B('bm-2', '2 кг', S.bm === 2) + sep + B('auto', S.auto ? 'Тянем…' : 'Тянуть', undefined, 'rec') + B('reset', 'Сброс');
    if (S.rec.wood1 && S.rec.wood2 && !S.ratio) h += sep + [['r2', 'в 2 раза больше'], ['r1', 'не изменилась'], ['r05', 'в 2 раза меньше'], ['r4', 'в 4 раза больше']].map(([k, l]) => B('ra-' + k, l, undefined, 'rec')).join('');
  }
  if (id === 'dyno') {
    h = Ls.objs.map(o => B('ob-' + o.id, o.name, S.hung === o.id)).join('') + B('ob-none', 'снять');

    else if (S.hung === 'pen' && !S.read) h += sep + '<span style="font-size:12px;color:var(--muted);padding:0 4px;white-space:nowrap">вес пенала:</span>' + Ls.readOpts.map(d => B('rd-' + d, nf(d) + ' Н', undefined, 'rec')).join('');

function act(a) {
  const id = LID(), Ls = L();
  if (a.startsWith('sel-')) { S.sel = a.slice(4); renderTools(); buildScheme(); return; }
  if (a === 'to-scale') return place1(S.sel, 'scale');
  if (a === 'to-cyl') return place1(S.sel, 'cyl');
  if (a === 'to-shelf') return place1(S.sel, 'shelf');
  if (a.startsWith('mat-')) {
    const m = a.slice(4);
    if (m === Ls.answer) { S.ans = true; toast('Верно: ρ = 8,9 г/см³ — это медь.'); renderTools(); buildScheme(); update(); }
    else toast('Не сходится. Посчитайте ρ = m / V и сравните с таблицей во вкладке «Расчёты».');
    return;
  }
  if (a === 'm-' || a === 'm+') return setMass(S.mass + (a === 'm-' ? -0.5 : 0.5));
  if (a.startsWith('pl-')) return setPlanet(a.slice(3));
  if (a === 'lift') { S.h = 120; S.vy = 0; S.fall = true; dirty = true; return; }
  if (a.startsWith('sp-')) return setSpring(a.slice(3));
  if (a === 'n-' || a === 'n+') return setN(S.n + (a === 'n-' ? -1 : 1));
  if (a.startsWith('k-')) {
    const k = +a.slice(2);
    if (k === Ls.kAns) { S.kOk = true; toast('Верно: k = 40 Н/м. На 1 Н пружина X удлиняется на 2,5 см.'); renderTools(); buildScheme(); update(); }
    else toast(k < 1 ? 'Похоже, вы делили на сантиметры. Переведите Δl в метры.' : 'Не то. k = F / Δl, где Δl — в метрах.');
    return;
  }
  if (a.startsWith('sf-')) { S.surf = a.slice(3); S.b = D4.b0; S.str = 0; S.edge = false; renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('bm-')) { S.bm = +a.slice(3); S.b = D4.b0; S.str = 0; S.edge = false; renderTools(); buildScheme(); update(); return; }
  if (a === 'auto') { if (S.auto) return; if (S.b > D4.bMax - 70) S.b = D4.b0; S.pull = true; S.auto = true; S.slid = 0; S.edge = false; renderTools(); return; }
  if (a === 'reset') { S.b = D4.b0; S.str = 0; S.pull = false; S.auto = false; S.edge = false; renderTools(); update(); return; }
  if (a.startsWith('ra-')) {
    if (a === 'ra-r2') { S.ratio = true; toast('Верно: прижали в 2 раза сильнее — трение выросло в 2 раза.'); renderTools(); buildScheme(); update(); }
    else toast('Сравните две записи трения на дереве.');
    return;
  }
  if (a.startsWith('ob-')) return hang5(a === 'ob-none' ? null : a.slice(3));
  if (a.startsWith('dv-')) {
    const d = +a.slice(3);
    if (d === Ls.divAns) { S.div = true; toast('Верно: (2 Н − 1 Н) / 5 делений = 0,2 Н.'); renderTools(); buildScheme(); update(); }
    else toast('Посчитайте мелкие деления между 1 Н и 2 Н — их 5 промежутков?');
    return;
  }
  if (a.startsWith('rd-')) {
    const d = +a.slice(3);
    if (d === Ls.readAns) { S.read = true; toast('Верно: вес пенала 2,4 Н. Его масса около 240 г.'); renderTools(); buildScheme(); update(); }
    else toast('Посмотрите в лупу: сколько делений по 0,2 Н после отметки 2?');
    return;
  }
}

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'density') return [t(m.xm, 'масса X'), t(m.xv, 'объём X'), t(m.ans, 'металл')].join(' · ');
  if (id === 'gravity') return [t(m.moon, '8 Н на Луне'), t(m.earth, 'тот же груз на Земле')].join(' · ');
  if (id === 'hooke') return [t(m.ptsX >= 2, `замеры X: ${m.ptsX}/2`), t(m.kOk, 'k найдена')].join(' · ');
  if (id === 'friction') return [t(m.r1, '1 кг'), t(m.r2, '2 кг'), t(m.ratio, 'вывод')].join(' · ');

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'density') {
    const b = body(S.sel), ms = S.meas[S.sel], ok = ms.m && ms.V;
    const rho = ok ? ms.m / ms.V : null;
    return `<h2>Плотность</h2><div class="formula">ρ = m / V</div><p class="note">m — масса (г), V — объём (см³). 1 мл = 1 см³, 1 г/см³ = 1000 кг/м³.</p>
      <h3>${b.name}</h3><div class="steps">` +
      step('масса m', ms.m ? `${ms.m} г` : 'поставьте на весы') +
      step('объём V', ms.V ? `${Ls.water + b.V} − ${Ls.water} = ${b.V} см³` : 'опустите в мензурку') +
      step('плотность', ok ? `${ms.m} / ${ms.V} = ${fmt(rho, 1)} г/см³ = ${fmt(rho * 1000, 0)} кг/м³` : '—', 'sum') + `</div>
      <h3>Таблица плотностей</h3><table class="dens">
      <tr><td>алюминий</td><td>2,7 г/см³</td></tr><tr><td>сталь, железо</td><td>7,8 г/см³</td></tr><tr><td>медь</td><td>8,9 г/см³</td></tr><tr><td>свинец</td><td>11,3 г/см³</td></tr><tr><td>вода</td><td>1,0 г/см³</td></tr></table>
      <p class="note" style="margin-top:10px">Бруски A и X одного объёма, но X гораздо тяжелее: его вещество плотнее.</p>`;
  }
  if (id === 'gravity') {
    const p = planet(), F = S.mass * p.g;
    return `<h2>Сила тяжести</h2><div class="formula">Fтяж = m · g</div><p class="note">m — масса в кг, g — в Н/кг, сила — в ньютонах.</p>
      <h3>Сейчас: ${p.name}</h3><div class="steps">` + step('m', `${nf(S.mass)} кг`) + step('g', `${fmt(p.g, 1)} Н/кг`) + step('Fтяж', `${nf(S.mass)} × ${fmt(p.g, 1)} = ${fmt(F, 1)} Н`, 'sum') + `</div>
      <h3>Тот же груз на других планетах</h3><div class="steps">` + Ls.planets.map(q => step(q.name, `${nf(S.mass)} × ${fmt(q.g, 1)} = ${fmt(S.mass * q.g, 1)} Н`)).join('') + `</div>
      <h3>К заданию</h3><div class="steps">` + step('нужная сила на Луне', '8 Н') + step('масса', 'm = F / g = 8 / 1,6 = ?', 'sum') + `</div>`;
  }
  if (id === 'hooke') {
    const k = sprK(), dl = dl3(), hide = S.spr === 'X' && !S.kOk;
    return `<h2>Закон Гука</h2><div class="formula">Fупр = k · Δl</div><div class="formula">k = F / Δl</div><p class="note">Когда груз висит неподвижно, сила упругости равна весу грузов. Вес груза 100 г ≈ 0,1 кг × 10 Н/кг = 1 Н.</p>
      <h3>Пружина ${S.spr}</h3><div class="steps">` + step('грузов', `${S.n}`) + step('F', `${S.n} × 1 Н = ${S.n} Н`) +
      step('Δl', `${fmt(dl, 1)} см = ${fmt(dl / 100, 3)} м`) +
      step('k', S.n === 0 ? 'подвесьте груз' : hide ? `${S.n} / ${fmt(dl / 100, 3)} = ?` : `${S.n} / ${fmt(dl / 100, 3)} = ${k} Н/м`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Удвоили груз — удвоилось удлинение. Отношение F / Δl для одной пружины всегда одно и то же: это и есть жёсткость.</p>`;
  }
  if (id === 'friction') {
    const sf = surf(), N = S.bm * GL;
    let rec = Object.keys(S.rec).map(k => step(`${S.rec[k].surf}, ${S.rec[k].m} кг`, `${fmt(S.rec[k].F, 1)} Н`)).join('');
    return `<h2>Сила трения</h2><div class="formula">Fтр = μ · N</div><p class="note">На горизонтальном столе N = m · g (берём g ≈ 10 Н/кг). При равномерном движении сила тяги равна силе трения.</p>
      <h3>Сейчас</h3><div class="steps">` + step('N', `${S.bm} × 10 = ${N} Н`) + step('тяга', `${fmt(F4(), 1)} Н`) +
      step('трение покоя', F4() < fMax4() - 1e-9 ? `${fmt(F4(), 1)} Н — брусок стоит` : 'достигло предела') + `</div>
      <h3>Записи</h3><div class="steps">${rec || step('пока нет', '—')}</div>` +
      (S.rec.wood1 && S.rec.wood2 ? `<h3>Сравнение на дереве</h3><div class="steps">` + step('отношение', `${fmt(S.rec.wood2.F, 1)} / ${fmt(S.rec.wood1.F, 1)} = ?`, 'sum') + `</div>` : '') +
      `<p class="note" style="margin-top:10px">μ = Fтр / N. ${Object.keys(S.rec).length ? 'Найдите μ по своим записям для каждой поверхности.' : ''}</p>`;
  }
  return `<h2>Цена деления</h2><div class="formula">ц.д. = (б − м) / n</div><p class="note">б и м — два соседних числа на шкале, n — число делений (промежутков) между ними.</p>
    <h3>Этот динамометр</h3><div class="steps">` + step('соседние числа', '2 Н и 1 Н') + step('делений между ними', S.div ? '5' : 'посчитайте') + step('цена деления', S.div ? '(2 − 1) / 5 = 0,2 Н' : '(2 − 1) / n = ?', 'sum') + `</div>
    <h3>Чтение показания</h3><div class="steps">` + step('целые ньютоны', 'последнее число над указателем') + step('плюс', 'число делений × цена деления') +
    step(S.hung ? L().objs.find(o => o.id === S.hung).name : 'на крючке', S.hung === 'pen' && !S.read ? '? Н' : S.hung ? `${fmt(hungF(), 1)} Н` : '—', 'sum') + `</div>
    <p class="note" style="margin-top:10px">Масса по весу: m = P / g. Если P = 1 Н, то m ≈ 1 / 10 = 0,1 кг = 100 г.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'density') { const sc = onScale(), mx = S.meas.X; el.innerHTML = `<div class="k">Брусок X</div><div class="v ${S.ans ? 'ok' : ''}">${mx.m ? mx.m + ' г' : 'm = ?'}</div><div class="lr"><span>V</span><span>${mx.V ? mx.V + ' см³' : '?'}</span></div><div class="lr"><span>весы</span><span>${sc ? body(sc).m + ' г' : '0 г'}</span></div>`; }
  else if (id === 'gravity') el.innerHTML = `<div class="k">${planet().name}</div><div class="v ${S.earth ? 'ok' : ''}">${fmt(m.F, 1)} Н</div><div class="lr"><span>m</span><span>${nf(S.mass)} кг</span></div><div class="lr"><span>g</span><span>${fmt(m.g, 1)} Н/кг</span></div>`;
  else if (id === 'hooke') el.innerHTML = `<div class="k">Пружина ${S.spr}</div><div class="v ${S.kOk && S.spr === 'X' ? 'ok' : ''}">F = ${S.n} Н</div><div class="lr"><span>Δl</span><span>${fmt(m.dl, 1)} см</span></div><div class="lr"><span>замеры</span><span>${new Set(S.pts[S.spr]).size}</span></div>`;
  else if (id === 'friction') el.innerHTML = `<div class="k">Динамометр</div><div class="v ${sliding4() ? 'ok' : ''}">${fmt(m.F, 1)} Н</div><div class="lr"><span>брусок</span><span>${S.edge ? 'у края' : sliding4() ? 'едет' : 'стоит'}</span></div><div class="lr"><span>m</span><span>${S.bm} кг</span></div>`;
  else el.innerHTML = `<div class="k">На крючке</div><div class="v ${S.read ? 'ok' : ''}">${S.hung ? L().objs.find(o => o.id === S.hung).name : '—'}</div><div class="lr"><span>показание</span><span>по шкале</span></div><div class="lr"><span>ц. д.</span><span class="${S.div ? 'ok' : ''}">${S.div ? '0,2 Н' : '?'}</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы умеете измерять и сравнивать силы!'), 1600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

    now = `Электронные весы и мензурка с ${Ls.water} мл воды (уровень сейчас ${m.level} мл). Бруски: A (алюминий) ${where('A')}, B (сталь) ${where('B')}, X (металл неизвестен) ${where('X')}. У бруска X измерено: масса ${S.meas.X.m ? S.meas.X.m + ' г' : 'нет'}, объём ${S.meas.X.V ? S.meas.X.V + ' см³' : 'нет'}. Металл ${S.ans ? 'определён верно' : 'ещё не определён'}. Название металла не называй — наводи: как найти объём по подъёму воды, как посчитать ρ = m / V, с чем сравнить.`;
  }
  if (id === 'gravity') now = `Груз массой ${nf(S.mass)} кг на планете ${planet().name} (g = ${fmt(m.g, 1)} Н/кг). Сила тяжести ${fmt(m.F, 1)} Н, стрелка направлена вниз к центру планеты. Груз ${S.h > 0 ? 'поднят над поверхностью' : 'стоит на поверхности'}. Сила 8 Н на Луне ${S.moon ? 'получена' : 'ещё не получена'}; тот же груз на Земле ${S.earth ? 'проверен' : 'ещё не проверен'}. Нужную массу не называй — наводи к m = F / g.`;
  if (id === 'hooke') now = `Штатив с пружиной ${S.spr} (A — жёсткость 100 Н/м, B — 25 Н/м, X — неизвестна). Подвешено грузов по 100 г: ${S.n} (вес ≈ ${S.n} Н), удлинение ${fmt(m.dl, 1)} см. Разных замеров на пружине X: ${m.ptsX}. Жёсткость X ${S.kOk ? 'найдена верно' : 'ещё не найдена'}. Значение k для X не называй; частая ошибка — делить ньютоны на сантиметры. Наводи: переведи Δl в метры, k = F / Δl.`;
  if (id === 'friction') now = `Деревянный брусок ${S.bm} кг на поверхности «${surf().name}», его тянут горизонтальным динамометром (шкала до 15 Н). Сейчас тяга ${fmt(m.F, 1)} Н, брусок ${S.edge ? 'у края стола' : sliding4() ? 'скользит' : 'стоит'}. Записи трения скольжения: ${Object.keys(S.rec).map(k => `${S.rec[k].surf}, ${S.rec[k].m} кг — ${fmt(S.rec[k].F, 1)} Н`).join('; ') || 'нет'}. Вывод о том, во сколько раз изменилось трение, ${S.ratio ? 'сделан верно' : 'не сделан'}. Ответ не называй — наводи сравнить две записи на дереве и подумать, во сколько раз сильнее брусок прижат к опоре.`;
  if (id === 'dyno') now = `Вертикальный динамометр с пределом 5 Н, числа на шкале через 1 Н, между ними мелкие деления; справа лупа ×3. На крючке: ${S.hung ? Ls.objs.find(o => o.id === S.hung).name : 'ничего'}. Цена деления ${S.div ? 'найдена (0,2 Н)' : 'ещё не найдена'}, вес пенала ${S.read ? 'определён' : 'ещё не определён'}. Цену деления и вес пенала не называй — наводи: возьми два соседних числа, посчитай промежутки между ними.`;
  return [
    `Раздел: физика, 7 класс, тема «Силы» (механика). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { density: 'Почему по плотности можно узнать вещество?', gravity: 'Чем масса отличается от силы тяжести?', hooke: 'Почему k нужно считать в метрах, а не в сантиметрах?', friction: 'Чем трение покоя отличается от трения скольжения?', dyno: 'Как быстро найти цену деления любого прибора?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
