<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии: наблюдение и эксперимент, световой микроскоп и клетки лука, как поставить честный опыт.">
<title>Как изучают жизнь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.tbl th{font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl td.m{font-family:var(--font-mono)}
.tbl .ok{color:var(--ok)}
.tbl .bad{color:var(--warn)}
.dish-h{font:600 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="17" cy="17" r="8" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M23 23l9 9" stroke="var(--fg)" stroke-width="2.6" stroke-linecap="round"/><path d="M13 17q4-5 8 0q-4 5-8 0z" fill="var(--ok)"/><circle cx="17" cy="17" r="1.4" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Биология · Как изучают жизнь</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Методы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const KEY = 'luch-bio-methods';
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263 + 1013904223) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ---------- biology data ----------
// Lesson 1: a goldfish; opercular (gill-cover) beats per minute rise with water temperature (simplified linear model)
const rateOf = T => 60 + 5 * (T - 18);
const TRIAL = 15, TMIN = 16, TMAX = 28, TOL_COUNT = 2;
// Lesson 2: school light microscope. Eyepiece 10×, field number 18 mm → field of view = 18 / objective, mm
const OCU = 10, FN = 18, OBJS = [4, 10, 40], F0 = 62.4;
const DEPTH = { 4: 1.5, 10: 0.8, 40: 0.3 };      // how far from the sharp point the picture still looks sharp (knob units)
const NEED = { 4: 0.2, 10: 0.35, 40: 0.6 };     // light needed: the bigger the objective, the more light
const CELL = { L: 0.25, H: 0.06, r: 0.010 };    // onion epidermis cell ≈ 250 × 60 мкм, nucleus ≈ 20 мкм across
const SPEC = { w: 3, h: 2 };                    // the piece of onion skin: 6 × 4 мм around the slide centre
const BAR = { 4: 1, 10: 0.5, 40: 0.1 };         // scale bar, мм
// Lesson 3: pea germination in 5 days (share of live seeds that sprout)
const GERM = { wetWarm: 0.9, wetCold: 0.1, dry: 0 };
const DAYS = 5;

const LESSONS = [
  { id: 'observe', title: 'Наблюдение и эксперимент',
    text: ['Биологи изучают живое двумя главными способами. Наблюдение — смотрим и измеряем, ничего не меняя. Эксперимент, или опыт, — нарочно меняем одно условие и смотрим, что из-за этого изменится.',
           'Рыба дышит жабрами: набирает воду ртом и выпускает её из-под жаберных крышек. Сосчитаем, сколько раз за 15 секунд поднимаются крышки, — это наблюдение. Потом изменим температуру воды и сосчитаем снова — это уже эксперимент.',
           'Чтобы узнать число движений в минуту, счёт за 15 секунд умножают на 4. Так же медсестра считает пульс.'],
    why: 'Рыбоводы в прудовых хозяйствах Алматинской области и на Балхаше следят, как дышит рыба: если она часто хватает воздух у поверхности, в воде мало кислорода. Пора включать аэраторы, иначе можно потерять всю рыбу в пруду. Медсестра и ветеринар так же считают дыхание и пульс за 15 секунд, а эколог годами наблюдает за птицами и сайгаками и замечает, когда что-то пошло не так.',
    safe: 'Нагреватель аквариума работает от сети: руки в воду не опускают, пока он включён. В настоящем аквариуме воду греют медленно, на 1–2 °C в день, иначе рыба заболеет. В нашей модели — сразу.',
    task: 'Сосчитайте движения жаберных крышек за 15 секунд при двух температурах воды, которые отличаются хотя бы на 4 °C. Ошибка — не больше 2.',
    hint: 'Нажмите на секундомер и при каждом взмахе жаберной крышки нажимайте на рыбку или «+1». Потом смените температуру и посчитайте ещё раз.',
    stage: 'Секундомер — старт. Нажатие на рыбку — плюс одно движение.',
    T: 18,
    check: m => m.pair },

// ---------- lesson 1: breathing clock ----------
const phaseAt = t => S.ph0 + rateOf(S.T) / 60 * (t - S.phT) / 1000;
function setTemp(T) {
  T = clamp(Math.round(T), TMIN, TMAX);
  if (T === S.T) return;
  if (S.trial) { toast('Пока идёт счёт, температуру не меняем.'); return; }
  const now = performance.now(); S.ph0 = phaseAt(now); S.phT = now; S.T = T; update();
}
function startTrial() {
  if (S.trial) { toast('Счёт уже идёт — следите за жабрами.'); return; }
  const t0 = performance.now();
  S.trial = { t0, b0: Math.floor(phaseAt(t0)), taps: 0, T: S.T };
  renderTools(); update();
}
function tapFish() {
  if (!S.trial) { toast('Сначала запустите секундомер.'); return; }
  S.trial.taps++; S.tapFx = performance.now(); update();
}
function finishTrial() {
  const tr = S.trial; S.trial = null;
  const real = Math.floor(phaseAt(tr.t0 + TRIAL * 1000)) - tr.b0, ok = Math.abs(tr.taps - real) <= TOL_COUNT;
  S.trials.push({ T: tr.T, taps: tr.taps, real, ok }); if (S.trials.length > 8) S.trials.shift();
  toast(ok ? `Насчитали ${tr.taps}, на самом деле ${real}. Точно!` : `Насчитали ${tr.taps}, а рыбка сделала ${real} движений. Попробуйте ещё раз.`);
  renderTools(); update();
}

// ---------- lesson 3: seeds ----------
const SEEDU = [0, 1].map(j => Array.from({ length: 20 }, (_, i) => hash(j * 31 + 7, i)));
SEEDU[0][0] = 0.95; SEEDU[1][0] = 0.3;          // the very first seed in dish А is dead: one seed proves nothing
const pGerm = d => !d.water ? GERM.dry : d.warm ? GERM.wetWarm : GERM.wetCold;
const germDay = (j, i) => 1.2 + 2.3 * hash(j + 101, i);
function dishResult(d, j) {
  const p = pGerm(d); let k = 0, fin = 0;
  for (let i = 0; i < d.n; i++) if (SEEDU[j][i] < p) { fin++; if (S.day >= germDay(j, i)) k++; }
  return { n: d.n, k, fin, p };
}
function issuesOf(D) {
  const [A, B] = D, out = [];
  if (A.water === B.water) out.push(A.water ? 'вода есть в обеих чашках — сравнивать не с чем' : 'воды нет в обеих чашках — сравнивать не с чем');
  if (A.light !== B.light) out.push('чашки отличаются ещё и светом');
  if (A.warm !== B.warm) out.push('чашки отличаются ещё и температурой');
  if (A.n !== B.n) out.push('в чашках разное число семян');
  if (Math.min(A.n, B.n) < 10) out.push('семян слишком мало — нужно хотя бы 10 в каждой чашке');
  if (!A.warm && !B.warm) out.push('обе чашки в холодильнике: в холоде горох почти не прорастает даже с водой, опыт ничего не покажет');
  return out;
}

function model() {
  const id = LID();
  if (id === 'observe') {
    const ok = S.trials.filter(t => t.ok); let pair = null;
    for (const a of ok) for (const b of ok) if (b.T - a.T >= 4 && (!pair || b.T - a.T > pair[1].T - pair[0].T)) pair = [a, b];
    const left = S.trial ? Math.max(0, TRIAL - (performance.now() - S.trial.t0) / 1000) : null;
    return { kind: 'fish', T: S.T, trial: S.trial, left, okN: ok.length, pair: !!pair, pairT: pair };
  }
  if (id === 'micro') {
    const mag = OCU * S.obj, fov = FN / S.obj, focus = S.coarse + S.fine, err = Math.abs(focus - F0), sharp = err < DEPTH[S.obj];
    const bright = S.lamp ? S.dia : 0, lit = bright >= NEED[S.obj], cx = -S.sx, cy = -S.sy, centered = Math.abs(cx) < SPEC.w && Math.abs(cy) < SPEC.h;
    return { kind: 'micro', mag, fov, focus, err, sharp, bright, lit, centered, stained: S.stained, found: S.found };
  }
  const res = S.dishes.map((d, j) => dishResult(d, j)), issues = issuesOf(S.dishes);
  return { kind: 'seed', res, issues, valid: issues.length === 0, day: S.day, finished: S.day >= DAYS, answer: S.answer };
}

  if (id === 'observe') { anim = true; if (S.trial && t - S.trial.t0 >= TRIAL * 1000) finishTrial(); else if (S.trial && Math.floor(t / 250) !== S.trialTick) { S.trialTick = Math.floor(t / 250); const mm = model(); renderMeter(mm); $('#taskState').textContent = taskState(mm); } }
  if (id === 'micro') { const tg = S.stained ? 1 : 0; if (S.stain !== tg) { S.stain = reduce ? tg : clamp(S.stain + (tg - S.stain > 0 ? 1 : -1) * dt * 1.2, 0, 1); anim = true; } }
  if (id === 'plan' && S.running) {
    S.day = Math.min(DAYS, S.day + dt * 2); anim = true;
    if (Math.floor(S.day * 4) !== S.dayTick) { S.dayTick = Math.floor(S.day * 4); renderMeter(model()); }
    if (S.day >= DAYS) { S.running = false; renderTools(); update(); toast('Прошло 5 дней. Сравните чашки и сделайте вывод.'); }
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function act(a) {
  const id = LID();
  if (a === 'start') return startTrial();
  if (a === 'tap') return tapFish();
  if (a === 'cold') return setTemp(S.T - 1);
  if (a === 'hot') return setTemp(S.T + 1);
  if (a === 'clear') { if (S.trial) return toast('Дождитесь конца счёта.'); S.trials = []; update(); return; }
  if (/^o\d+$/.test(a)) { const o = +a.slice(1); if (o !== S.obj) { if (o === 40 && !model().centered) toast('Сначала поставьте кожицу в центр на малом увеличении — на 40× её трудно найти.'); S.obj = o; renderTools(); buildScheme(); update(); } return; }
  if (a === 'lamp') { S.lamp = !S.lamp; renderTools(); buildScheme(); update(); return; }
  if (a === 'iod') { if (S.stained) return toast('Препарат уже окрашен.'); S.stained = true; toast('Капнули раствор йода: ядра стали заметнее.'); renderTools(); buildScheme(); update(); return; }
  if (a === 'cm' || a === 'cp') { S.coarse = clamp(S.coarse + (a === 'cp' ? 2 : -2), 0, 100); if (S.obj === 40) toast('На 40× лучше крутить микровинт.'); update(); return; }
  if (a === 'fm' || a === 'fp') { S.fine = clamp(Math.round((S.fine + (a === 'fp' ? 0.1 : -0.1)) * 100) / 100, -2, 2); update(); return; }
  if (/^n\d+$/.test(a)) return setN(+a.slice(1));
  if (a === 'run') return runDays();
  if (a === 'new') { S.day = 0; S.running = false; S.answer = null; renderTools(); update(); return; }
  if (a.startsWith('a-')) return answer(a.slice(2));
}

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'observe') {
    if (m.trial) return `Идёт счёт: ${m.trial.taps} · осталось ${Math.ceil(m.left)} с`;
    const temps = [...new Set(S.trials.filter(t => t.ok).map(t => t.T))];
    return temps.length ? `Точных замеров: при ${temps.join(', ')} °C · нужен ещё один (разница ≥ 4 °C)` : `Вода ${m.T} °C · замеров пока нет`;
  }
  if (L.id === 'micro') {
    if (!S.lamp) return 'Темно: включите свет';
    if (!m.centered) return `${m.mag}× · в центре пустое стекло — найдите кожицу`;
    if (!m.sharp) return `${m.mag}× · картинка размыта — крутите винты`;
    if (!m.lit) return `${m.mag}× · темновато — откройте диафрагму`;
    if (S.obj !== 40) return `${m.mag}× · резко. Нужно 400×`;
    if (!S.stained) return '400× · резко. Ядра плохо видны — окрасьте йодом';
    return '400× · резко, окрашено. Нажмите на ядро';
  }
  if (m.finished) return m.answer ? 'Вывод не тот — подумайте ещё' : 'Прошло 5 дней · сделайте вывод';
  if (S.running) return `Идёт день ${Math.min(DAYS, Math.floor(m.day) + 1)} из ${DAYS}`;
  return m.valid ? 'Опыт честный · можно ждать 5 дней' : `Пока: ${m.issues[0]}`;
}

    { id: 'dia', icon: ICON.dia, name: 'Диафрагма', spec: 'Открывается и закрывается, как зрачок, и регулирует, сколько света идёт к препарату.' },
    { id: 'lamp', icon: ICON.lamp, name: 'Осветитель', spec: 'Лампа под столиком. В старых микроскопах вместо неё зеркало, которое ловит свет из окна.' },
    { id: 'arm', icon: ICON.arm, name: 'Штатив', spec: 'Основание и ручка. Микроскоп переносят двумя руками: одна держит штатив, другая — основание.' },
    { id: 'view', icon: ICON.view, name: 'Поле зрения', spec: 'Круг, который видно в окуляр. Кожица лука: клетки похожи на кирпичики, в каждой — ядро.' }];
  return [
    { id: 'dishA', icon: ICON.dish, name: 'Чашка Петри А', spec: 'Плоская стеклянная чашка с фильтровальной бумагой. В ней раскладывают семена.' },
    { id: 'dishB', icon: ICON.dish, name: 'Чашка Петри Б', spec: 'Вторая такая же чашка. Одна из двух станет контрольной.' },
    { id: 'seeds', icon: ICON.seeds, name: 'Семена гороха', spec: 'Проросшее семя выпускает белый корешок, потом зелёный росток. Не каждое семя живое.' },
    { id: 'toggles', icon: ICON.toggles, name: 'Условия', spec: 'Вода (мокрая или сухая бумага), свет (на окне или в коробке) и температура (комната 22 °C или холодильник 4 °C).' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="safe"><b>Безопасность</b>${L.safe}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>${L.id === 'micro' ? 'Устройство микроскопа' : 'Оборудование'}</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'observe') {
    let h = `<h2>Считаем дыхание</h2><div class="formula">в минуту = за 15 с × 4</div><p class="note">15 секунд — это четверть минуты, поэтому счёт умножаем на 4.</p>`;
    if (S.trials.length) {
      h += `<h3>Ваши замеры</h3><table class="tbl"><tr><th>Вода</th><th>Насчитали</th><th>В минуту</th><th>Было</th></tr>` +
        S.trials.map(t => `<tr><td class="m">${t.T} °C</td><td class="m">${t.taps}</td><td class="m">${t.taps} × 4 = ${t.taps * 4}</td><td class="m ${t.ok ? 'ok' : 'bad'}">${t.real}</td></tr>`).join('') + `</table>`;
    } else h += `<p class="note">Запустите секундомер и считайте — здесь появится таблица замеров.</p>`;
    if (m.pairT) {
      const [a, b] = m.pairT;
      h += `<h3>Сравнение</h3><div class="steps">` + step(`${a.T} °C`, `${a.taps * 4} в минуту`) + step(`${b.T} °C`, `${b.taps * 4} в минуту`) +
        step('разница', `${b.taps * 4 - a.taps * 4 > 0 ? '+' : ''}${b.taps * 4 - a.taps * 4} в минуту`, 'sum') + `</div>
        <p class="note" style="margin-top:10px">В тёплой воде меньше растворённого кислорода, а обмен веществ у рыбы идёт быстрее. Ей приходится чаще прокачивать воду через жабры.</p>`;
    }
    h += `<h3>Что мы делали</h3><div class="steps">` + step('Считали, ничего не меняя', 'наблюдение') + step('Меняли температуру и считали снова', 'эксперимент') +
      step('Что меняли', 'температуру воды') + step('Что измеряли', 'частоту дыхания') + step('Всё остальное', 'та же рыба, тот же аквариум', 'sum') + `</div>`;
    return h;
  }
  if (id === 'micro') {
    const cells = m.fov / CELL.L;
    return `<h2>Увеличение и размеры</h2><div class="formula">Увеличение = окуляр × объектив</div><h3>Сейчас</h3><div class="steps">` +
      step('увеличение', `${OCU} × ${S.obj} = ${m.mag}×`) + step('поле зрения ≈ 18 мм / объектив', `18 / ${S.obj} = ${fmt(m.fov, 2)} мм`) +
      step('клеток лука поперёк поля', `${fmt(m.fov, 2)} / 0,25 ≈ ${fmt(cells, 0)}`) + step('длина клетки', '≈ 0,25 мм = 250 мкм') +
      step('в окуляре она кажется', `0,25 × ${m.mag} = ${fmt(0.25 * m.mag, 0)} мм`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">1 мм = 1000 мкм (микрометров). Ядро клетки лука — около 20 мкм, поэтому его видно только на большом увеличении.</p>
      <h3>Порядок работы</h3><div class="steps">` +
      step('1. Свет', S.lamp ? (m.lit ? 'хватает ✓' : 'мало — откройте диафрагму') : 'выключен') + step('2. Объект в центре', m.centered ? 'да ✓' : 'нет') +
      step('3. Резкость', m.sharp ? 'да ✓' : 'нет — крутите винт') + step('4. Окраска йодом', S.stained ? 'да ✓' : 'нет') + step('5. Объектив', `${S.obj}× → нужен 40×`, 'sum') + `</div>`;
  }
  const lab = j => { const d = S.dishes[j]; return `${d.water ? 'вода' : 'сухо'}, ${d.light ? 'свет' : 'темно'}, ${d.warm ? '22 °C' : '4 °C'}, ${d.n} ${plural(d.n, 'семя', 'семени', 'семян')}`; };
  let h = `<h2>Честный опыт</h2><div class="formula">всхожесть = проросло / всего × 100 %</div><h3>Условия</h3><div class="steps">` +
    step('Чашка А', lab(0)) + step('Чашка Б', lab(1)) + `</div><h3>Проверка опыта</h3><div class="steps">`;
  const [A, B] = S.dishes;
  h += step('вода отличается', A.water !== B.water ? 'да ✓' : 'нет ✗') + step('свет одинаковый', A.light === B.light ? 'да ✓' : 'нет ✗') +
    step('температура одинаковая', A.warm === B.warm ? 'да ✓' : 'нет ✗') + step('семян поровну и ≥ 10', A.n === B.n && A.n >= 10 ? 'да ✓' : 'нет ✗') +
    step('итог', m.valid ? 'опыт честный' : 'опыт нечестный', 'sum') + `</div>`;
  if (m.finished) {
    h += `<h3>Результат через 5 дней</h3><div class="steps">` + m.res.map((r, j) => step(`Чашка ${'АБ'[j]}`, `${r.k} / ${r.n} × 100 % = ${fmt(r.n ? r.k / r.n * 100 : 0, 0)} %`)).join('') + `</div>
      <p class="note" style="margin-top:10px">Сравните чашки. Если опыт честный, разница может быть только из-за того условия, которое меняли.</p>`;
  } else h += `<p class="note" style="margin-top:10px">Результат появится, когда пройдут 5 дней.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'fish') {
    el.innerHTML = `<div class="k">Секундомер</div><div class="v ${m.trial ? '' : 'ok'}">${m.trial ? '0:' + String(Math.ceil(m.left)).padStart(2, '0') : '0:15'}</div>
      <div class="lr"><span>счёт</span><span>${m.trial ? m.trial.taps : '—'}</span></div><div class="lr"><span>вода</span><span>${m.T} °C</span></div>`;
  } else if (m.kind === 'micro') {
    el.innerHTML = `<div class="k">Микроскоп</div><div class="v ${m.found ? 'ok' : ''}">${m.mag}×</div>
      <div class="lr"><span>поле</span><span>${fmt(m.fov, 2)} мм</span></div><div class="lr"><span>резкость</span><span>${m.sharp ? 'да' : 'нет'}</span></div>
      <div class="gauge"><b style="width:${(m.bright * 100).toFixed(0)}%;background:#ffe08a"></b><i style="left:${(NEED[S.obj] * 100).toFixed(0)}%"></i></div><div class="lr"><span>свет</span><span>${Math.round(m.bright * 100)} %</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Опыт</div><div class="v ${m.finished ? 'ok' : ''}">день ${fmt(Math.min(m.day, DAYS), 0)} из ${DAYS}</div>` +
      m.res.map((r, j) => `<div class="lr"><span>чашка ${'АБ'[j]}</span><span>${r.k}/${r.n}</span></div>`).join('');
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий исследователь!'), 1400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  observe: '<rect x="8" y="5" width="50" height="22" fill="#3a8fc0" opacity=".3" stroke="#e8ecf4" stroke-width="1"/><path d="M22 16q6-6 14-4q4 2 6 4q-2 2-6 4q-8 2-14-4z" fill="#f39a3c"/><path d="M22 16l-4-4v8z" fill="#f08a2c"/><path d="M36 12q-2 4 0 8" stroke="#d6283a" stroke-width="1.2" fill="none"/>',
  micro: '<path d="M14 26h18M18 26V16q0-7 6-9" stroke="#e8ecf4" stroke-width="1.6" fill="none"/><rect x="22" y="3" width="5" height="12" fill="#8b96ad"/><rect x="16" y="18" width="16" height="2" fill="#56627d"/><circle cx="48" cy="15" r="11" fill="#f1efe6"/><path d="M37 11h22M37 18h22M44 4v7M52 11v7" stroke="#7a5a14" stroke-width=".8"/><circle cx="47" cy="14.5" r="1.4" fill="#6b3f0c"/>',
  plan: '<ellipse cx="18" cy="17" rx="13" ry="6" fill="#7f9fbc" opacity=".6" stroke="#e8ecf4" stroke-width="1"/><ellipse cx="48" cy="17" rx="13" ry="6" fill="#d9cfb8" opacity=".7" stroke="#e8ecf4" stroke-width="1"/><circle cx="15" cy="17" r="2" fill="#c9cf86"/><path d="M15 18q2 4 6 4" stroke="#f4f0e2" stroke-width="1" fill="none"/><circle cx="21" cy="16" r="2" fill="#c9cf86"/><circle cx="45" cy="17" r="2" fill="#b9b06a"/><circle cx="51" cy="16" r="2" fill="#b9b06a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  // lesson 1
  S.T = LESSONS[0].T; S.ph0 = 0.3; S.phT = performance.now(); S.trial = null; S.trials = []; S.tapFx = 0;
  // lesson 2
  const M = LESSONS[1]; Object.assign(S, { obj: M.obj, lamp: M.lamp, dia: M.dia, coarse: M.coarse, fine: M.fine, sx: M.sx, sy: M.sy, stained: false, stain: 0, found: false, lastHit: null });
  // lesson 3
  S.dishes = LESSONS[2].dishes.map(d => Object.assign({}, d)); S.day = 0; S.running = false; S.answer = null;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'observe') {
    now = `Аквариум с золотой рыбкой, температура воды ${S.T} °C (можно менять от ${TMIN} до ${TMAX} °C). Ученик запускает секундомер на 15 с и нажимает на рыбку при каждом подъёме жаберной крышки. ` +
      (m.trial ? `Сейчас идёт счёт: насчитано ${m.trial.taps}, осталось ${Math.ceil(m.left)} с. ` : '') +
      (S.trials.length ? 'Замеры: ' + S.trials.map(t => `${t.T} °C — насчитал ${t.taps} (×4 = ${t.taps * 4} в мин), на самом деле ${t.real}, ${t.ok ? 'точно' : 'неточно'}`).join('; ') + '.' : 'Замеров пока нет.') +
      ' В модели частота растёт с температурой (в тёплой воде меньше кислорода, обмен веществ быстрее).';
    guide = 'Помоги различить наблюдение (считаем без вмешательства) и эксперимент (меняем одно условие — температуру).';
  }
  if (id === 'micro') {
    now = `Световой микроскоп, окуляр 10×, объектив ${S.obj}× (увеличение ${m.mag}×, поле зрения ${fmt(m.fov, 2)} мм). Препарат — кожица лука. Свет ${S.lamp ? 'включён' : 'выключен'}, диафрагма открыта на ${Math.round(S.dia * 100)} % (${m.lit ? 'света хватает' : 'света мало для этого объектива'}). ` +
      `Резкость ${m.sharp ? 'наведена' : 'не наведена (картинка размыта)'}. Кожица ${m.centered ? 'в центре поля зрения' : 'не в центре — в центре пустое стекло'}. Йодом ${S.stained ? 'окрашено' : 'не окрашено'}. Ядро ${S.found ? 'найдено' : 'пока не найдено'}.`;
    guide = 'Напоминай порядок: свет, малый объектив, объект в центр, резкость, потом больший объектив и микровинт.';
  }
  if (id === 'plan') {
    const d = j => { const x = S.dishes[j]; return `${x.water ? 'мокрая бумага' : 'сухая бумага'}, ${x.light ? 'на свету' : 'в темноте'}, ${x.warm ? '22 °C' : '4 °C'}, ${x.n} семян`; };
    now = `Гипотеза: «Семенам гороха для прорастания нужна вода». Чашка А: ${d(0)}. Чашка Б: ${d(1)}. Опыт ${m.valid ? 'поставлен честно' : 'пока нечестный: ' + m.issues.join('; ')}. ` +
      (m.finished ? `Прошло 5 дней: проросло в А ${m.res[0].k} из ${m.res[0].n}, в Б ${m.res[1].k} из ${m.res[1].n}. ${S.answer ? 'Ученик выбрал вывод, но он неверный.' : 'Ученик ещё не выбрал вывод.'}` : S.running ? `Идёт день ${Math.floor(m.day) + 1}.` : 'Опыт ещё не запущен.');
    guide = 'Не называй готовый вывод и правильные настройки прямо — веди вопросами: что отличается в чашках, почему мало одного семени, что считать контролем.';
  }
  return [
    `Раздел: биология, 7 класс, тема «Как изучают жизнь». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Как помогать: ${guide} Задавай наводящие вопросы, а не решай за ученика.`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    observe: 'Чем наблюдение отличается от эксперимента?', micro: 'Почему изображение в микроскопе перевёрнуто?', plan: 'Зачем нужна контрольная группа?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, с чего начать задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
