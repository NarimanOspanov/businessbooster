<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 6 класс: таблицы, столбчатые и круговые диаграммы, среднее арифметическое.">
<title>Данные и диаграммы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dtab{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 0}
.dtab th,.dtab td{border:1px solid var(--line);padding:7px 8px;text-align:left}
.dtab th{font:600 10.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.dtab td.n{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.dtab tr.tot td{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.chips .lbl2{font-size:12.5px;color:var(--muted);align-self:center;margin-right:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Математика · Данные и диаграммы</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#math">Карта</a><a href="/physics/#math">Математика</a><a href="./" aria-current="page">Диаграммы</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Данные</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: карточки с ответами, таблица, диаграммы и столбики из кубиков. Их можно перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 2) => { const s = fmt(x, n); return s.includes(',') ? s.replace(/(,d*?)0+$/, '$1').replace(/,$/, '') : s; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';

// survey of 6 «Б»: how do you get to school? 24 answers
const CATS = [
  { n: 'пешком', c: '#86e0a8' },
  { n: 'автобус', c: '#72d4e8' },
  { n: 'машина', c: '#ffb547' },
  { n: 'самокат', c: '#c79bff' }];
const ANS = [1, 0, 0, 2, 1, 3, 0, 1, 0, 2, 1, 0, 3, 1, 0, 2, 0, 1, 1, 0, 3, 2, 1, 0];
const FREQ = [9, 8, 4, 3];
const NAMES = ['Айгерим', 'Данияр', 'Мадина', 'Тимур', 'Алия'];

const LESSONS = [
  { id: 'table', title: 'Таблицы: наводим порядок',
    text: ['Учитель спросил весь 6 «Б»: «Как ты добираешься до школы?» Получилось 24 ответа вперемешку. По такой куче трудно что-то понять.',
           'Разложим ответы по строкам таблицы. Каждый ответ отмечаем палочкой, пятую палочку ставим поперёк — так удобно считать пятёрками.',
           'Число ответов в строке называют частотой. Сумма всех частот равна числу опрошенных. Так проверяют, что ничего не потеряли.'],
    why: 'Таблицы ведут почти все. Продавец и кладовщик считают остатки товара, медсестра отмечает прививки, социолог разбирает ответы опроса. Аналитик данных в банке или на маркетплейсе целый день собирает таблицы — и хорошо зарабатывает. А умение работать в Excel или Google Таблицах просят почти в каждой вакансии офиса.',
    task: 'Разложите все 24 ответа по строкам таблицы частот.',
    hint: 'Перетащите карточку в нужную строку. Или нажмите на карточку, а потом на строку. Кнопки снизу кладут подсвеченную карточку.',
    stage: 'Тащите карточку в строку таблицы. Палочки и частота посчитаются сами.',
    check: m => m.placed === 24 },
  { id: 'charts', title: 'Столбчатая и круговая диаграммы',
    text: ['Столбчатая диаграмма превращает таблицу в картинку. Высота столбца — это частота. Сразу видно, какой ответ самый частый.',
           'Круговая диаграмма показывает части целого. Весь круг — все 24 ученика, 360°. Сектор тем больше, чем больше доля ответа.',
           'Угол сектора считают так: частота : всего × 360°. Если ответ дали 6 человек из 24, это 1/4 класса и 90°.'],
    why: 'Журналист и аналитик рисуют диаграммы в отчётах, предприниматель показывает рост продаж инвесторам, агроном сравнивает урожай по годам. В банковском приложении круговая диаграмма показывает, на что ушли деньги за месяц. Кто умеет быстро читать диаграммы, того трудно обмануть красивыми цифрами в рекламе.',
    task: 'Постройте столбцы по таблице: пешком 9, автобус 8, машина 4, самокат 3. Потом откройте круговую диаграмму и нажмите на сектор, который занимает ровно треть круга.',
    hint: 'Тяните столбец вверх или вниз за любое место. Треть круга — это треть всех учеников. Сколько это из 24?',
    stage: 'Тяните столбцы. Кнопка «Круг» перестраивает те же данные в круговую диаграмму.',
    bars: [2, 2, 2, 2],
    check: m => m.match === 4 && m.view === 'pie' && m.pick === 1 },
  { id: 'mean', title: 'Среднее арифметическое',
    text: ['Пять друзей посчитали, сколько книг прочитали за лето: 7, 3, 5, 9 и 1. Кто-то много, кто-то мало. А сколько в среднем?',
           'Представим, что книги можно передавать. Переложим кубики из высоких столбиков в низкие, пока у всех не станет поровну. Этот общий уровень и есть среднее.',
           'Считать проще: сложить все числа и разделить сумму на их количество. Среднее = (7 + 3 + 5 + 9 + 1) : 5.'],
    why: 'Учитель выводит средний балл за четверть, синоптик — среднюю температуру месяца, агроном — средний урожай с гектара. Владелец кафе следит за средним чеком: если он растёт, бизнес идёт лучше. А когда в новостях пишут о средней зарплате, полезно понимать, как её посчитали.',
    task: 'Перекладывайте кубики, пока во всех столбиках не станет поровну.',
    hint: 'Тяните кубик с верхушки высокого столбика на низкий. Или нажмите на один столбик, потом на другой. Сколько кубиков всего? А на сколько друзей их делим?',
    stage: 'Тащите верхний кубик на другой столбик. Сумма при этом не меняется.',

const KEY = 'luch-math-data';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            placed: [], sel: -1, bars: [2, 2, 2, 2], view: 'bar', pick: -1, vals: [7, 3, 5, 9, 1], from: -1, showMean: false, guess: 4 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const nextFree = () => S.placed.findIndex(x => x < 0);

function model() {
  const id = LID();
  if (id === 'table') {
    const cnt = [0, 0, 0, 0]; S.placed.forEach(r => { if (r >= 0) cnt[r]++; });
    return { kind: id, cnt, placed: cnt.reduce((a, b) => a + b, 0) };
  }
  if (id === 'charts') {
    const v = S.bars.slice(), total = v.reduce((a, b) => a + b, 0);
    return { kind: id, v, total, match: v.filter((x, i) => x === FREQ[i]).length, view: S.view, pick: S.pick };
  }
  const v = S.vals.slice(), sum = v.reduce((a, b) => a + b, 0), n = v.length;
  return { kind: id, v, sum, n, mean: sum / n, equal: v.every(x => x === v[0]), max: Math.max(...v), min: Math.min(...v) };
}

// ---------- scene geometry (SVG units, 520 × 405) ----------
const CARD = { x0: 23, y0: 112, w: 74, h: 28, gx: 6, gy: 6 };
const TAB = { x0: 40, x1: 480, y0: 268, hh: 20, rh: 22, c1: 150, c2: 400 };
const CH = { x0: 80, x1: 470, y0: 350, unit: 20, max: 12 };
const PIE = { cx: 260, cy: 236, r: 112 };
const CUBE = { x0: 100, dx: 80, w: 40, h: 22, base: 352, max: 12 };
const cardXY = i => [CARD.x0 + (i % 6) * (CARD.w + CARD.gx), CARD.y0 + Math.floor(i / 6) * (CARD.h + CARD.gy)];
const rowY = r => TAB.y0 + TAB.hh + r * TAB.rh;
const barX = i => CH.x0 + (CH.x1 - CH.x0) / 4 * (i + 0.5);
const colX = i => CUBE.x0 + i * CUBE.dx;

const T = (x, y, s, txt, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;

function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}

function tally(x, y, n, col) {
  let h = '';
  for (let k = 0; k < n; k++) {
    const g = Math.floor(k / 5), j = k % 5, gx = x + g * 30;
    if (j < 4) h += `<path d="M${gx + j * 5} ${y - 7}v14" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>`;
    else h += `<path d="M${gx - 3} ${y + 5}L${gx + 18} ${y - 5}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>`;
  }
  return h;
}

function cardSVG(i, x, y, lifted) {
  const c = CATS[ANS[i]], sel = S.sel === i;
  let h = `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${CARD.w}" height="${CARD.h}" rx="6" fill="${lifted ? '#26324a' : '#1a2438'}" stroke="${sel || lifted ? '#ffb547' : '#3a4866'}" stroke-width="${sel || lifted ? 2 : 1.2}"/>`;
  h += `<rect x="${(x + 6).toFixed(1)}" y="${(y + 9).toFixed(1)}" width="10" height="10" rx="3" fill="${c.c}"/>`;
  h += T(x + 20, y + 18.5, 11.5, c.n, '#e8ecf4', 'start');
  return h + `</g>`;
}

function tableSVG(m) {
  let h = T(260, CARD.y0 - 10, 11.5, `ответы учеников 6 «Б» · осталось ${24 - m.placed}`, '#8b96ad');
  for (let i = 0; i < 24; i++) {
    const [x, y] = cardXY(i);
    if (S.placed[i] >= 0 || (drag && drag.kind === 'card' && drag.i === i && drag.moved)) h += `<rect x="${x}" y="${y}" width="${CARD.w}" height="${CARD.h}" rx="6" fill="none" stroke="#26324a" stroke-dasharray="3 3"/>`;
    else h += cardSVG(i, x, y, false);
  }
  // the table
  const W = TAB.x1 - TAB.x0, yEnd = rowY(5);
  h += `<rect x="${TAB.x0}" y="${TAB.y0}" width="${W}" height="${yEnd - TAB.y0}" rx="6" fill="#0e1520" stroke="#a9b4c9" stroke-width="1.4"/>`;
  h += `<rect x="${TAB.x0}" y="${TAB.y0}" width="${W}" height="${TAB.hh}" rx="6" fill="#1a2438"/>`;
  h += T(TAB.x0 + 10, TAB.y0 + 14, 10, 'КАК ДОБИРАЮТСЯ', '#8b96ad', 'start') + T(TAB.c1 + 10, TAB.y0 + 14, 10, 'ПОДСЧЁТ', '#8b96ad', 'start') + T(TAB.x1 - 10, TAB.y0 + 14, 10, 'ЧАСТОТА', '#8b96ad', 'end');
  const over = drag && drag.kind === 'card' && drag.moved ? rowAt(drag.p) : -1;
  for (let r = 0; r < 4; r++) {
    const y = rowY(r);
    if (over === r) h += `<rect x="${TAB.x0 + 1}" y="${y}" width="${W - 2}" height="${TAB.rh}" fill="rgba(255,181,71,.14)"/>`;
    h += `<path d="M${TAB.x0} ${y}H${TAB.x1}" stroke="#26324a"/>`;
    h += `<rect x="${TAB.x0 + 10}" y="${y + 6}" width="10" height="10" rx="3" fill="${CATS[r].c}"/>` + T(TAB.x0 + 26, y + 15, 11.5, CATS[r].n, '#e8ecf4', 'start');
    h += tally(TAB.c1 + 14, y + 11, m.cnt[r], CATS[r].c);
    h += T(TAB.x1 - 12, y + 16, 13, m.cnt[r], '#e8ecf4', 'end', 'font-weight="500"');
  }
  const yt = rowY(4);
  h += `<path d="M${TAB.x0} ${yt}H${TAB.x1}" stroke="#a9b4c9" stroke-width="1.2"/>` + T(TAB.x0 + 10, yt + 15, 11.5, 'Итого', '#e8ecf4', 'start', 'font-weight="600"');
  h += T(TAB.x1 - 12, yt + 16, 13, `${m.placed}`, m.placed === 24 ? '#86e0a8' : '#ffb547', 'end', 'font-weight="500"');
  h += `<path d="M${TAB.c1} ${TAB.y0}V${yEnd}M${TAB.c2} ${TAB.y0}V${yEnd}" stroke="#26324a"/>`;
  if (drag && drag.kind === 'card' && drag.moved) h += cardSVG(drag.i, drag.p.x - CARD.w / 2, drag.p.y - CARD.h / 2, true);
  return h;
}

function chartsSVG(m) {
  if (m.view === 'pie') return pieSVG(m);
  let h = '';
  for (let k = 0; k <= CH.max; k += 2) {
    const y = CH.y0 - k * CH.unit;
    h += `<path d="M${CH.x0} ${y}H${CH.x1}" stroke="${k ? 'rgba(169,180,201,.16)' : '#a9b4c9'}" stroke-width="${k ? 1 : 2}"/>` + T(CH.x0 - 8, y + 4, 10, k, '#8b96ad', 'end');
  }
  h += `<path d="M${CH.x0} ${CH.y0}V${CH.y0 - CH.max * CH.unit - 10}" stroke="#a9b4c9" stroke-width="2"/>`;
  h += T(CH.x0 - 6, CH.y0 - CH.max * CH.unit - 18, 10, 'учеников', '#8b96ad', 'start');
  for (let i = 0; i < 4; i++) {
    const x = barX(i), v = m.v[i], top = CH.y0 - v * CH.unit, ok = v === FREQ[i];
    h += `<g data-bar="${i}"><rect x="${x - 40}" y="${CH.y0 - CH.max * CH.unit}" width="80" height="${CH.max * CH.unit + 12}" fill="transparent"/>`;
    h += `<path d="M${x - 30} ${CH.y0 - FREQ[i] * CH.unit}h60" stroke="#e8ecf4" stroke-width="1.2" stroke-dasharray="3 4" opacity=".35"/>`;
    if (v > 0) h += `<rect x="${x - 28}" y="${top}" width="56" height="${v * CH.unit}" rx="3" fill="${CATS[i].c}" stroke="${INK}" stroke-width="2"/>`;
    h += `<rect x="${x - 16}" y="${top - 5}" width="32" height="6" rx="3" fill="#e8ecf4" stroke="${INK}" stroke-width="1.2"/>`;
    h += T(x, top - 12, 13, v, ok ? '#86e0a8' : '#e8ecf4', 'middle', 'font-weight="500"') + `</g>`;
    h += T(x, CH.y0 + 18, 11.5, CATS[i].n, '#e8ecf4') + T(x, CH.y0 + 34, 10, `в таблице ${FREQ[i]}`, '#8b96ad');
  }
  return h;
}

function sectors(v) {
  const tot = v.reduce((a, b) => a + b, 0); let a0 = 0; const out = [];
  v.forEach((x, i) => { const a = tot ? x / tot * Math.PI * 2 : 0; out.push({ i, a0, a1: a0 + a, x }); a0 += a; });
  return out;
}
function pieSVG(m) {
  const { cx, cy, r } = PIE;
  let h = T(cx, cy + r + 30, 12, `весь круг — ${m.total} ${plural(m.total, 'ученик', 'ученика', 'учеников')} = 360°`, '#e8ecf4', 'middle', 'font-weight="500"');
  if (!m.total) return h + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#3a4866" stroke-dasharray="6 5"/>` + T(cx, cy + 4, 12, 'данных нет — постройте столбцы', '#8b96ad');
  for (const s of sectors(m.v)) {
    if (!s.x) continue;
    const mid = (s.a0 + s.a1) / 2, off = S.pick === s.i ? 10 : 0, ox = off * Math.sin(mid), oy = -off * Math.cos(mid);
    const P = a => [cx + ox + r * Math.sin(a), cy + oy - r * Math.cos(a)];
    let d;
    if (s.x === m.total) d = `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`;
    else { const [x0, y0] = P(s.a0), [x1, y1] = P(s.a1); d = `M${(cx + ox).toFixed(1)} ${(cy + oy).toFixed(1)}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${s.a1 - s.a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`; }
    h += `<path data-sec="${s.i}" d="${d}" fill="${CATS[s.i].c}" stroke="${S.pick === s.i ? '#e8ecf4' : INK}" stroke-width="${S.pick === s.i ? 3 : 2}" stroke-linejoin="round"/>`;
    const lr = s.x === m.total ? 0 : r * 0.62, lx = cx + ox + lr * Math.sin(mid), ly = cy + oy - lr * Math.cos(mid);
    if (s.a1 - s.a0 > 0.32) h += T(lx, ly - 2, 11, CATS[s.i].n, '#0b1019', 'middle', 'font-weight="600"') + T(lx, ly + 12, 11, s.x, '#0b1019');
  }
  return h + T(cx, cy + r + 48, 11, 'нажмите на сектор, чтобы узнать его угол', '#8b96ad');
}

function meanSVG(m) {
  let h = `<path d="M${colX(0) - 50} ${CUBE.base}H${colX(4) + 50}" stroke="#a9b4c9" stroke-width="2"/>`;
  const lifting = drag && drag.kind === 'cube' && drag.moved ? drag.from : -1;
  for (let i = 0; i < m.n; i++) {
    const x = colX(i), v = m.v[i] - (lifting === i ? 1 : 0), sel = S.from === i, tgt = lifting >= 0 && lifting !== i && colAt(drag.p) === i;
    h += `<g data-col="${i}"><rect x="${x - 36}" y="${CUBE.base - CUBE.max * CUBE.h - 10}" width="72" height="${CUBE.max * CUBE.h + 40}" rx="8" fill="${tgt ? 'rgba(255,181,71,.10)' : 'transparent'}"/>`;
    for (let k = 0; k < v; k++) {
      const y = CUBE.base - (k + 1) * CUBE.h, top = sel && k === v - 1;
      h += `<rect x="${x - CUBE.w / 2}" y="${y + 1}" width="${CUBE.w}" height="${CUBE.h - 2}" rx="3" fill="${top ? '#ffb547' : '#5fb4d9'}" stroke="${INK}" stroke-width="1.5"/>`;
    }
    h += T(x, CUBE.base - v * CUBE.h - 8, 13, v, sel ? '#ffb547' : '#e8ecf4', 'middle', 'font-weight="500"') + `</g>`;
    h += T(x, CUBE.base + 18, 11, NAMES[i], '#e8ecf4');
  }
  // trial level from the scheme tab
  if (S.tab === 'scheme') {
    const y = CUBE.base - S.guess * CUBE.h;
    for (let i = 0; i < m.n; i++) {
      const x = colX(i), v = m.v[i];
      if (v > S.guess) h += `<rect x="${x - CUBE.w / 2 - 3}" y="${CUBE.base - v * CUBE.h}" width="${CUBE.w + 6}" height="${(v - S.guess) * CUBE.h}" rx="3" fill="none" stroke="#ff8a73" stroke-width="1.6"/>`;
      if (v < S.guess) h += `<rect x="${x - CUBE.w / 2}" y="${y}" width="${CUBE.w}" height="${(S.guess - v) * CUBE.h}" rx="3" fill="rgba(134,224,168,.12)" stroke="#86e0a8" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    }
    h += `<path d="M${colX(0) - 50} ${y}H${colX(4) + 50}" stroke="#ff8a73" stroke-width="1.6"/>` + T(colX(4) + 50, y - 6, 10, `пробный уровень ${S.guess}`, '#ff8a73', 'end');
  }
  if (S.showMean) {
    const y = CUBE.base - m.mean * CUBE.h;
    h += `<path d="M${colX(0) - 50} ${y}H${colX(4) + 50}" stroke="#ffb547" stroke-width="2" stroke-dasharray="7 5"/>` + T(colX(0) - 50, y - 6, 10.5, `среднее ${trim(m.mean)}`, '#ffb547', 'start');
  }
  if (lifting >= 0) h += `<rect x="${(drag.p.x - CUBE.w / 2).toFixed(1)}" y="${(drag.p.y - CUBE.h / 2).toFixed(1)}" width="${CUBE.w}" height="${CUBE.h - 2}" rx="3" fill="#ffb547" stroke="${INK}" stroke-width="1.5"/>`;
  h += T(260, CUBE.base + 40, 11, `всего книг ${m.sum}, друзей ${m.n}`, '#8b96ad');
  return h;
}

function hlBox(id) {
  return {
    cards: [16, 92, 488, 166], card: (() => { const i = Math.max(0, S.sel); const [x, y] = cardXY(i); return [x - 5, y - 5, CARD.w + 10, CARD.h + 10]; })(),
    rows: [TAB.x0 - 6, rowY(0) - 3, TAB.x1 - TAB.x0 + 12, TAB.rh * 4 + 6], tallycol: [TAB.c1 - 4, TAB.y0 - 4, TAB.c2 - TAB.c1 + 8, TAB.hh + TAB.rh * 5 + 8],
    freq: [TAB.c2 - 4, TAB.y0 - 4, TAB.x1 - TAB.c2 + 8, TAB.hh + TAB.rh * 5 + 8], total: [TAB.x0 - 6, rowY(4) - 3, TAB.x1 - TAB.x0 + 12, TAB.rh + 6],
    axis: [CH.x0 - 34, CH.y0 - CH.max * CH.unit - 30, 36, CH.max * CH.unit + 44], bars: [CH.x0 + 4, CH.y0 - CH.max * CH.unit - 6, CH.x1 - CH.x0 - 4, CH.max * CH.unit + 12],
    target: [CH.x0 + 4, CH.y0 - 12 * CH.unit, CH.x1 - CH.x0 - 4, 12 * CH.unit], labels: [CH.x0 + 4, CH.y0 + 4, CH.x1 - CH.x0 - 4, 38],
    pie: [PIE.cx - PIE.r - 14, PIE.cy - PIE.r - 14, PIE.r * 2 + 28, PIE.r * 2 + 28], pietitle: [PIE.cx - 170, PIE.cy + PIE.r + 12, 340, 26],
    cols: [colX(0) - 40, CUBE.base - CUBE.max * CUBE.h - 12, colX(4) - colX(0) + 80, CUBE.max * CUBE.h + 14], base: [colX(0) - 54, CUBE.base - 6, colX(4) - colX(0) + 108, 34],
    meanline: [colX(0) - 54, CUBE.base - model().mean * CUBE.h - 20, colX(4) - colX(0) + 108, 30], sumtxt: [120, CUBE.base + 26, 280, 22],
  }[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  if (id === 'table') h += tableSVG(m);
  else if (id === 'charts') h += chartsSVG(m);
  else h += meanSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 500, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 408 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const cardAt = p => { for (let i = 0; i < 24; i++) { const [x, y] = cardXY(i); if (S.placed[i] < 0 && p.x >= x && p.x <= x + CARD.w && p.y >= y && p.y <= y + CARD.h) return i; } return -1; };
function rowAt(p) { if (p.x < TAB.x0 - 20 || p.x > TAB.x1 + 20) return -1; const r = Math.floor((p.y - rowY(0)) / TAB.rh); return r >= 0 && r < 4 ? r : -1; }
function colAt(p) { if (p.y < CUBE.base - CUBE.max * CUBE.h - 30 || p.y > CUBE.base + 40) return -1; const i = Math.round((p.x - CUBE.x0) / CUBE.dx); return i >= 0 && i < 5 && Math.abs(p.x - colX(i)) < 40 ? i : -1; }
const setBar = (i, y) => { const v = clamp(Math.round((CH.y0 - y) / CH.unit), 0, CH.max); if (v !== S.bars[i]) { S.bars[i] = v; update(); } };

function placeCard(i, r) {
  if (i < 0 || S.placed[i] >= 0) return;
  if (ANS[i] !== r) { toast(`Это ответ «${CATS[ANS[i]].n}», а строка — «${CATS[r].n}». Найдите свою строку.`); return; }
  S.placed[i] = r; S.sel = nextFree(); update();
}
function moveCube(a, b) {
  if (a < 0 || b < 0 || a === b) return;
  if (S.vals[a] <= 0) { toast(`У ${NAMES[a]} кубиков нет.`); return; }
  if (S.vals[b] >= CUBE.max) { toast('Выше 12 столбик не поместится.'); return; }
  S.vals[a]--; S.vals[b]++; update();
}

scene.addEventListener('pointerdown', e => {
  const id = LID(), p = toSvg(e);
  const grab = () => { e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {} scene.classList.add('grabbing'); };
  if (id === 'table') {
    const i = cardAt(p);
    if (i >= 0) { grab(); drag = { kind: 'card', i, x: e.clientX, y: e.clientY, p, moved: false }; return; }
    const r = rowAt(p); if (r >= 0 && S.sel >= 0) placeCard(S.sel, r);
    return;
  }

};

function calcHTML(m) {
  const id = LID();
  if (id === 'table') {
    return `<h2>Частоты</h2><div class="formula" style="font-size:15px">частота = число одинаковых ответов</div><p class="note">Сумма всех частот равна числу опрошенных.</p><h3>Сейчас в таблице</h3><div class="steps">` +
      CATS.map((c, r) => step(c.n, `${m.cnt[r]}`)).join('') +
      step('итого', `${m.cnt.join(' + ')} = ${m.placed}`, 'sum') +
      step('проверка', m.placed === 24 ? '24 = 24, все ответы на месте' : `${m.placed} ≠ 24, осталось ${24 - m.placed}`) + `</div>
      <h3>Доля каждого ответа</h3><p class="note">Доля = частота : всего. Её можно записать дробью или в процентах.</p><div class="steps">` +
      CATS.map((c, r) => step(c.n, m.placed ? `${m.cnt[r]}/${m.placed} ≈ ${trim(m.cnt[r] / m.placed * 100, 1)} %` : '—')).join('') + `</div>`;
  }
  if (id === 'charts') {
    const t = m.total;
    let h = `<h2>Угол сектора</h2><div class="formula" style="font-size:15px">угол = частота : всего × 360°</div><p class="note">Весь круг — 360°. Половина класса — 180°, четверть — 90°.</p><h3>Сейчас на диаграмме</h3><div class="steps">` +
      step('всего', `${m.v.join(' + ')} = ${t}`);
    if (t) {
      h += CATS.map((c, i) => step(c.n, `${m.v[i]} : ${t} × 360° = ${trim(m.v[i] / t * 360, 1)}°`)).join('');
      h += step('сумма углов', `${trim(m.v.reduce((a, x) => a + x / t * 360, 0), 1)}°`, 'sum');
    } else h += step('диаграмма', 'пустая');
    h += `</div><h3>Сравним с таблицей</h3><div class="steps">` + CATS.map((c, i) => step(c.n, `столбец ${m.v[i]}, в таблице ${FREQ[i]} ${m.v[i] === FREQ[i] ? '✓' : ''}`)).join('') + `</div>
      <p class="note" style="margin-top:10px">Столбчатая удобна, чтобы сравнить ответы между собой. Круговая — чтобы увидеть, какую часть целого составляет каждый.</p>`;
    return h;
  }
  return `<h2>Среднее арифметическое</h2><div class="formula" style="font-size:15px">среднее = сумма : количество</div><h3>Сейчас</h3><div class="steps">` +
    step('числа', m.v.join('; ')) + step('сумма', `${m.v.join(' + ')} = ${m.sum}`) + step('количество', `${m.n}`) +
    step('среднее', `${m.sum} : ${m.n} = ${trim(m.mean)}`, 'sum') + `</div>
    <h3>Почему перекладывание работает</h3><p class="note">Кубик ушёл из одного столбика и пришёл в другой — сумма та же, число столбиков то же. Значит, и среднее не меняется. Когда все столбики равны, каждый из них и есть среднее.</p>
    <h3>Отклонения от среднего</h3><div class="steps">` +
    m.v.map((x, i) => step(NAMES[i], `${x} − ${trim(m.mean)} = ${trim(x - m.mean).replace(/^(?!−)(?!0$)/, '+')}`)).join('') +
    step('сумма отклонений', '0', 'sum') + `</div>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'table') el.innerHTML = `<div class="k">В таблице</div><div class="v ${ok ? 'ok' : ''}">${m.placed} / 24</div><div class="gauge"><b style="width:${(m.placed / 24 * 100).toFixed(1)}%"></b></div>`;
  else if (id === 'charts') {
    if (m.view === 'pie' && m.pick >= 0 && m.total) { const v = m.v[m.pick], g = gcd(v, m.total);
      el.innerHTML = `<div class="k">Сектор</div><div class="v ${ok ? 'ok' : ''}">${CATS[m.pick].n}</div><div class="lr"><span>доля</span><span>${v}/${m.total}${g > 1 ? ' = ' + v / g + '/' + m.total / g : ''}</span></div><div class="lr"><span>угол</span><span>${trim(v / m.total * 360, 1)}°</span></div>`; }
    else el.innerHTML = `<div class="k">Как в таблице</div><div class="v ${ok ? 'ok' : ''}">${m.match} из 4</div><div class="lr"><span>всего</span><span>${m.total}</span></div>`;
  }
  else el.innerHTML = `<div class="k">Среднее</div><div class="v ${ok ? 'ok' : ''}">${S.showMean || m.equal ? trim(m.mean) : '?'}</div><div class="lr"><span>сумма</span><span>${m.sum}</span></div><div class="lr"><span>разброс</span><span>${m.max - m.min}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Данные вам подвластны!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  table: '<path d="M8 6h50M8 13h50M8 20h50M8 27h50M24 6v21" stroke="#56627d" stroke-width="1"/><path d="M28 8v4M31 8v4M34 8v4M37 8v4M28 16v4M31 16v4" stroke="#86e0a8" stroke-width="1.2"/>',
  charts: '<rect x="10" y="10" width="7" height="16" fill="#86e0a8"/><rect x="19" y="12" width="7" height="14" fill="#72d4e8"/><rect x="28" y="19" width="7" height="7" fill="#ffb547"/><circle cx="49" cy="15" r="9" fill="#86e0a8"/><path d="M49 15V6A9 9 0 0 1 56.8 19.5Z" fill="#72d4e8"/>',
  mean: '<rect x="12" y="10" width="7" height="16" fill="#5fb4d9"/><rect x="22" y="20" width="7" height="6" fill="#5fb4d9"/><rect x="32" y="14" width="7" height="12" fill="#5fb4d9"/><rect x="42" y="6" width="7" height="20" fill="#5fb4d9"/><path d="M8 16h46" stroke="#ffb547" stroke-width="1.4" stroke-dasharray="3 2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.placed = Array(24).fill(-1); S.sel = 0;
  S.bars = (L.bars || [2, 2, 2, 2]).slice(); S.view = 'bar'; S.pick = -1;
  S.vals = (L.vals || [7, 3, 5, 9, 1]).slice(); S.from = -1; S.showMean = false; S.guess = 4;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'table') now = `Опрос 6 «Б» «Как ты добираешься до школы?», 24 карточки-ответа. В таблицу частот разложено ${m.placed} из 24: ${CATS.map((c, r) => `${c.n} ${m.cnt[r]}`).join(', ')}. ${S.sel >= 0 ? `Подсвечена карточка «${CATS[ANS[S.sel]].n}».` : 'Все карточки разложены.'}`;
  if (id === 'charts') now = `Режим: ${m.view === 'pie' ? 'круговая диаграмма' : 'столбчатая диаграмма'}. Высоты столбцов: ${CATS.map((c, i) => `${c.n} ${m.v[i]}`).join(', ')} (всего ${m.total}). Нужные по таблице: пешком 9, автобус 8, машина 4, самокат 3; совпало ${m.match} из 4.` +
    (m.view === 'pie' ? (m.pick >= 0 && m.total ? ` Выбран сектор «${CATS[m.pick].n}»: ${m.v[m.pick]} из ${m.total}, угол ${trim(m.v[m.pick] / m.total * 360, 1)}°.` : ' Сектор не выбран.') : '') + ' Ученик должен сам найти сектор, равный трети круга.';
  if (id === 'mean') now = `Пять столбиков из кубиков (книги за лето): ${NAMES.map((n, i) => `${n} ${m.v[i]}`).join(', ')}. Сумма ${m.sum}, количество ${m.n}. Линия среднего ${S.showMean ? 'показана' : 'скрыта'}. ${m.equal ? 'Все столбики равны.' : `Разброс ${m.max - m.min}.`}`;
  return [
    `Раздел: математика, 6 класс, «Данные и диаграммы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ к заданию: веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    table: 'Зачем ставить пятую палочку поперёк?', charts: 'Когда лучше столбчатая диаграмма, а когда круговая?',
    mean: 'Почему среднее может быть дробным числом?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
