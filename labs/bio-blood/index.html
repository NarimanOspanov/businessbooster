<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 9 класс: состав крови, работа сердца, сосуды и давление, иммунитет и прививки.">
<title>Кровь и сердце</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 31C11 24 8 19 8 15C8 11 11 9 14 9C17 9 19 11 20 13C21 11 23 9 26 9C29 9 32 11 32 15C32 19 29 24 20 31Z" fill="rgba(224,85,93,.3)" stroke="var(--warn)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 20h7l2-4 3 8 2-4h8" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Биология · Кровь и сердце</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Кровь</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f3 = x => (Math.round(x * 1000) / 1000).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-blood';
const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const BLUE = '#5b7fd6', RED = '#e0555d', MUSC = '#7c2f3c';

// ---------- lesson 1: blood cells ----------
const CT = {
  rbc: { name: 'Эритроцит', c: '#ff6b6b', feat: 'Красная клетка в форме двояковогнутого диска, 7–8 мкм. Ядра нет, внутри много гемоглобина.', job: 'переносит кислород от лёгких к тканям и часть углекислого газа обратно', count: '4–5 млн в 1 мм³', life: 'живёт около 120 суток, образуется в красном костном мозге' },
  wbc: { name: 'Лейкоцит', c: '#b48cff', feat: 'Крупная бесцветная клетка с ядром (на мазке ядро окрашено в фиолетовый). Может менять форму и выходить из сосудов.', job: 'защищает организм: поглощает микробов (фагоцитоз), образует антитела', count: '4–9 тыс. в 1 мм³', life: 'живут от нескольких дней до многих лет (клетки памяти)' },
  plt: { name: 'Тромбоцит', c: '#ffb547', feat: 'Кровяные пластинки: мелкие безъядерные кусочки крупных клеток костного мозга, 2–4 мкм.', job: 'участвуют в свёртывании крови и закрывают ранку тромбом', count: '180–320 тыс. в 1 мм³', life: 'живут 7–10 суток' },
};
const CTK = ['rbc', 'wbc', 'plt'];
const TG = [
  { x: -62, y: -46, type: 'rbc', look: 'красный диск без ядра, в центре светлее' },
  { x: 34, y: -58, type: 'wbc', kind: 'neut', look: 'крупная бледная клетка, ядро фиолетовое из нескольких долек' },
  { x: 66, y: 30, type: 'plt', look: 'горстка мелких фиолетовых зёрнышек, каждое намного меньше красных дисков' },
  { x: -24, y: 52, type: 'wbc', kind: 'lymph', look: 'клетка чуть крупнее красных дисков, почти вся занята большим круглым фиолетовым ядром' },
  { x: -76, y: 26, type: 'plt', look: 'несколько крошечных фиолетовых зёрнышек без ядра' },
  { x: 22, y: 6, type: 'rbc', look: 'красный диск без ядра, в центре светлее' },
];
const FX = 388, FY = 230, FR = 112;
const SMEAR = (() => {
  const r = rng(42), out = []; let guard = 0;
  while (out.length < 48 && guard++ < 4000) {
    const a = r() * 6.283, d = Math.sqrt(r()) * (FR + 8), x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (TG.some(g => Math.hypot(g.x - x, g.y - y) < (g.type === 'wbc' ? 30 : 23))) continue;
    if (out.some(o => Math.hypot(o[0] - x, o[1] - y) < 16)) continue;
    out.push([x, y, 8 + r() * 1.6]);
  }
  return out;
})();

// ---------- lesson 2: heart ----------
const PH = {
  as: { name: 'Систола предсердий', short: 'сист. предс.', c: '#72d4e8', what: 'Предсердия сокращаются и выталкивают кровь в желудочки. Створчатые клапаны открыты, полулунные закрыты.' },
  vs: { name: 'Систола желудочков', short: 'сист. желуд.', c: '#ff8a73', what: 'Желудочки сокращаются. Створчатые клапаны захлопнулись, полулунные открылись: кровь идёт в аорту и лёгочную артерию. Предсердия в это время наполняются.' },
  d: { name: 'Общая пауза', short: 'пауза', c: '#86e0a8', what: 'Сердце отдыхает. Кровь из вен заполняет предсердия и сама стекает в желудочки. Створчатые клапаны открыты, полулунные закрыты.' },
};
const PHK = ['as', 'vs', 'd'];
const HB = { ra: [116, 126, 106, 86], la: [298, 126, 106, 86], rv: [126, 232, 130, 116], lv: [264, 232, 142, 130] };

// ---------- models ----------
function cyc() { const T = 60 / S.hr, k = Math.sqrt(Math.min(1, T / 0.8)), sa = 0.1 * k, sv = 0.3 * k; return { T, sa, sv, dp: T - sa - sv }; }
function phaseAt(tc) {
  const c = cyc(), x = ((tc % c.T) + c.T) % c.T;
  if (x < c.sa) return { id: 'as', x, len: c.sa, c, pos: x };
  if (x < c.sa + c.sv) return { id: 'vs', x: x - c.sa, len: c.sv, c, pos: x };
  return { id: 'd', x: x - c.sa - c.sv, len: c.dp, c, pos: x };
}
function immCurve(i) {
  const P = IP[i], c = S.inj[i], V = P.V;
  const vac = c.vac.on ? c.vac.day : null, ser = c.ser.on ? c.ser.day : null;
  const vacA = t => { if (vac === null || t < vac) return 0; const x = t - vac, rise = 1 / (1 + Math.exp(-(x - 9) / 1.6)); return x <= 16 ? 2 * rise : (0.6 + 1.4 * Math.exp(-(x - 16) / 20)) * rise; };
  const serA = t => (ser === null || t < ser) ? 0 : 3 * Math.pow(0.5, (t - ser) / 7);
  const mem = vac !== null && V - vac >= 14;
  const aV = vacA(V) + serA(V);
  const prot = mem || aV >= 1;
  const resp = t => {
    if (t < V) return 0; const x = t - V;
    if (mem) return 4 / (1 + Math.exp(-(x - 1.5) / 0.6));
    if (!P.long) return 0; // столбняк не оставляет иммунитета
    return prot ? 0 : 2 / (1 + Math.exp(-(x - 9) / 1.6));
  };
  const ok = P.long ? mem : prot;
  return { vacA, serA, resp, A: t => vacA(t) + serA(t) + resp(t), mem, aV, prot, ok, vac, ser };
}
function model() {
  const id = LID();
  if (id === 'comp') { let n = 0, r = 0; S.lab.forEach((a, i) => { if (a) { n++; if (a === TG[i].type) r++; } }); return { kind: 'comp', placed: n, right: r, spun: S.spun && performance.now() - S.spinT > 1700 || (S.spun && reduce) }; }
  if (id === 'heart') { const p = phaseAt(S.tc), c = p.c; return { kind: 'heart', hr: S.hr, play: S.play, phase: p.id, p, T: c.T, mok: S.svol * S.hr / 1000 }; }
  if (id === 'bp') { const P = PATS[S.pat]; return { kind: 'bp', okS: S.marks.s !== null && Math.abs(S.marks.s - P.s) <= 5, okD: S.marks.d !== null && Math.abs(S.marks.d - P.d) <= 5 }; }
  const c0 = immCurve(0), c1 = immCurve(1);
  return { kind: 'imm', c0, c1, ok0: c0.ok, ok1: c1.ok };
}

// ---------- lesson 1 actions ----------
function pickTarget(i) { S.cur = i; S.curT = performance.now(); renderTools(); update(); }
function assign(k) {
  if (S.cur < 0) { toast('Сначала нажмите на номер клетки в мазке.'); return; }
  S.lab[S.cur] = k;
  const m = model();
  if (m.placed === TG.length && m.right < TG.length) toast(`Определены все клетки. Верно ${m.right} из 6 — проверьте красные.`);
  else if (m.placed < TG.length) { for (let d = 1; d <= TG.length; d++) { const j = (S.cur + d) % TG.length; if (!S.lab[j]) { S.cur = j; S.curT = performance.now(); break; } } }
  if (m.placed === TG.length && m.right === TG.length && !m.spun && !S.spun) toast('Клетки определены. Осталось разделить кровь в центрифуге.');
  renderTools(); update();
}
function spin() {
  if (S.spun) { toast('Кровь уже разделена: сверху плазма, снизу эритроциты.'); return; }
  S.spun = true; S.spinT = performance.now(); renderTools();
  setTimeout(() => { update(); }, reduce ? 0 : 1750);
  update();
}

// ---------- lesson 2 actions ----------
function stepPhase() {
  const p = phaseAt(S.tc), c = p.c, base = S.tc - p.pos;
  S.tc = p.id === 'as' ? base + c.sa + c.sv / 2 : p.id === 'vs' ? base + c.sa + c.sv + c.dp / 2 : base + c.T + c.sa / 2;
  S.play = false; renderTools(); update();
}
function setHr(v) { S.hr = clamp(Math.round(v), 50, 150); update(); }

// ---------- lesson 3 actions ----------
function pump() { S.valve = false; S.cuff = Math.min(240, S.cuff + 40); renderTools(); update(); }
function mark(k) {
  if (S.cuff < 20) { toast('Сначала накачайте манжету и выпускайте воздух.'); return; }
  S.marks[k] = Math.round(S.cuff);
  const m = model();
  if (S.marks.s !== null && S.marks.d !== null && !(m.okS && m.okD)) {
    if (S.marks.d >= S.marks.s) toast('Нижнее давление должно быть меньше верхнего. Повторите измерение.');
    else toast(`Записано ${S.marks.s}/${S.marks.d}. ${m.okS ? '' : 'Верхнее неточно. '}${m.okD ? '' : 'Нижнее неточно. '}Повторите: спускайте медленнее.`);
  }
  update();
}
function newPatient() { S.pat = (S.pat + 1) % PATS.length; S.cuff = 0; S.valve = false; S.marks = { s: null, d: null }; S.tones = []; S.hist = []; renderTools(); update(); toast('Пациент: ' + PATS[S.pat].name); }
function pArt(P, bt) {
  const ph = bt / BEAT, k = 3.5;
  const g = ph < 0.15 ? Math.sin(Math.PI / 2 * ph / 0.15) : (Math.exp(-k * (ph - 0.15)) - Math.exp(-k * 0.85)) / (1 - Math.exp(-k * 0.85));
  return P.d + (P.s - P.d) * g;
}
function bpTick(dt) {
  const P = PATS[S.pat];
  S.simT += dt;
  if (S.valve) { S.cuff = Math.max(0, S.cuff - S.rate * dt); if (S.cuff === 0) { S.valve = false; renderTools(); } }
  S.bt += dt;
  let beat = false;
  if (S.bt >= BEAT) {
    S.bt -= BEAT; beat = true;
    const tone = S.cuff > P.d && S.cuff < P.s;
    S.lastBeat = { tone, t: S.simT };
    if (tone) S.tones.push([S.simT, S.cuff]);
  }
  if (S.simT - S.histT >= 0.1) { S.histT = S.simT; S.hist.push([S.simT, S.cuff]); renderMeter(model()); updateScheme(model()); }
  while (S.hist.length && S.hist[0][0] < S.simT - 11) S.hist.shift();
  while (S.tones.length && S.tones[0][0] < S.simT - 11) S.tones.shift();
  if (beat) update();
}

function polyAt(pts, u) {

  let d = u * L;
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const k = d / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; } d -= seg[i]; }
  return pts[pts.length - 1];
}

  h += `<text x="${GX0 - 12}" y="${f(gy(1) + 3)}" font-size="9" fill="#8b96ad" text-anchor="end">1</text><text x="${GX0 - 12}" y="${f(gy(5) + 3)}" font-size="9" fill="#8b96ad" text-anchor="end">5</text>`;
  h += `<text x="${GX0 - 12}" y="${f(gy(3))}" font-size="9" fill="#8b96ad" text-anchor="middle" transform="rotate(-90 ${GX0 - 22} ${f(gy(3))})">антитела</text></g>`;
  h += `<g data-hit="thr"><path d="M${GX0} ${f(gy(1))}H${GX1}" stroke="#86e0a8" stroke-width="1.6" stroke-dasharray="7 4"/>` + lbl(GX1 - 4, gy(1) - 5, 'порог защиты', 9.5, '#86e0a8', 'end') + `</g>`;
  // sickness band
  const vx = gx(P.V, P);
  if (!C.prot) { const ex = P.long ? gx(Math.min(P.D, P.V + 12), P) : GX1; h += `<rect x="${f(vx)}" y="${GY1}" width="${f(ex - vx)}" height="${GY0 - GY1}" fill="rgba(255,138,115,.13)"/>` + lbl((vx + ex) / 2, GY1 + 14, 'болезнь', 10, '#ff8a73'); }
  // virus marker
  h += `<g data-hit="virus"><path d="M${f(vx)} ${GY1 - 4}V${GY0}" stroke="#ff8a73" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; h += `<path d="M${f(vx + Math.cos(a) * 6)} ${f(GY1 - 14 + Math.sin(a) * 6)}l${f(Math.cos(a) * 4)} ${f(Math.sin(a) * 4)}" stroke="#ff8a73" stroke-width="1.6"/>`; }
  h += `<circle cx="${f(vx)}" cy="${GY1 - 14}" r="6" fill="#ff8a73" stroke="${INK}"/>` + lbl(vx + 14, GY1 - 10, P.long ? 'встреча с вирусом' : 'токсин начнёт действовать', 9.5, '#ff8a73', 'start') + `</g>`;
  // curves

  if (C.vac !== null) h += `<path d="${path(C.vacA)}" stroke="#72d4e8" stroke-width="1.4" stroke-dasharray="4 3" fill="none" opacity=".8"/>`;
  if (C.ser !== null) h += `<path d="${path(C.serA)}" stroke="#b48cff" stroke-width="1.4" stroke-dasharray="4 3" fill="none" opacity=".8"/>`;
  h += `<path d="${path(C.A)}" stroke="#ffb547" stroke-width="2.6" fill="none"/>`;
  // axis
  h += `<path d="M${GX0} ${GY0}H${GX1}" stroke="#8b96ad" stroke-width="1.4"/>`;
  const stepD = P.D > 30 ? 10 : 5;
  for (let d = 0; d <= P.D; d += stepD) h += `<path d="M${f(gx(d, P))} ${GY0}v4" stroke="#8b96ad"/><text x="${f(gx(d, P))}" y="${GY0 + 14}" font-size="9" fill="#8b96ad" text-anchor="middle">${d}</text>`;
  h += lbl(GX1, GY0 + 26, 'день', 9.5, '#8b96ad', 'end');
  // syringes
  for (const [k, c, t] of [['vac', '#72d4e8', 'В'], ['ser', '#b48cff', 'С']]) {
    if (!cfg[k].on) continue;
    const x = gx(cfg[k].day, P), y = k === 'vac' ? GY0 + 34 : GY0 + 58, sel = drag && drag.key === k;
    h += `<path d="M${f(x)} ${GY0}V${y - 10}" stroke="${c}" stroke-width="1.4"/>`;
    h += `<g data-drag="${k}"><rect x="${f(x - 22)}" y="${y - 14}" width="44" height="28" fill="transparent"/><rect x="${f(x - 15)}" y="${y - 9}" width="30" height="18" rx="5" fill="${c}" stroke="${sel ? '#e8ecf4' : INK}" stroke-width="${sel ? 2 : 1.2}"/><path d="M${f(x + 15)} ${y}h7" stroke="${c}" stroke-width="2"/><text x="${f(x)}" y="${y + 4}" font-size="10.5" font-weight="600" fill="${INK}" text-anchor="middle">${t} ${cfg[k].day}</text></g>`;
  }
  if (!cfg.vac.on && !cfg.ser.on) h += lbl((GX0 + GX1) / 2, GY0 + 48, 'Включите вакцину или сыворотку на панели внизу', 10.5, '#8b96ad');
  return h;
}

function hlBox(id) {
  const L = LID();
  if (L === 'comp') {
    if (id === 'tube') return [TX - 12, TY - 14, TW + 24, TB - TY + 26];
    if (id === 'plasma') return [TX - 4, TY + 14, TW + 60, 110];
    if (id === 'field') return [FX - FR - 10, FY - FR - 10, 2 * FR + 20, 2 * FR + 20];
    const i = TG.findIndex(g => g.type === id); if (i >= 0) return [FX + TG[i].x - 22, FY + TG[i].y - 22, 44, 44];
    return null;
  }
  if (L === 'heart') {
    if (HB[id]) { const [x, y, w, hh] = HB[id]; return [x - 4, y - 4, w + 8, hh + 8]; }
    return { tri: [144, 206, 62, 38], mit: [314, 206, 62, 38], sl: [224, 212, 72, 30], vc: [28, 136, 106, 70], pv: [386, 136, 106, 70], pa: [84, 74, 170, 176], ao: [262, 56, 196, 190] }[id] || null;
  }
  if (L === 'bp') return { cuff: [34, 128, 124, 96], bulb: [200, 84, 66, 40], dial: [DCX - DR - 10, DCY - DR - 10, 2 * DR + 20, 2 * DR + 20], steth: [188, 198, 30, 30], artery: [6, 168, 362, 20], graph: [GXa - 6, GYa - 10, GXb - GXa + 12, GYb - GYa + 20] }[id] || null;
  const P = IP[S.ipt], cfg = S.inj[S.ipt];
  if (id === 'graph') return [GX0 - 10, GY1 - 12, GX1 - GX0 + 20, GY0 - GY1 + 24];
  if (id === 'thr') return [GX0 - 4, gy(1) - 8, GX1 - GX0 + 8, 16];
  if (id === 'virus') { const x = gx(P.V, P); return [x - 14, GY1 - 28, 28, GY0 - GY1 + 30]; }
  if (id === 'vac' || id === 'ser') { if (!cfg[id].on) return null; const x = gx(cfg[id].day, P), y = id === 'vac' ? GY0 + 34 : GY0 + 58; return [x - 20, y - 13, 40, 26]; }
  return null;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = id === 'comp' ? compScene(t) : id === 'heart' ? heartScene() : id === 'bp' ? bpScene() : immScene();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${f(b[0])}" y="${f(b[1])}" width="${f(b[2])}" height="${f(b[3])}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 510, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) { drag = { key: el.dataset.drag, x: e.clientX, y: e.clientY, moved: false }; scene.classList.add('grabbing'); }
  else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.key || !drag.moved) return;
  const P = IP[S.ipt], p = toSvg(e);
  const day = clamp(Math.round((p.x - GX0) / (GX1 - GX0) * P.D), 0, P.maxInj);
  if (S.inj[S.ipt][drag.key].day !== day) { S.inj[S.ipt][drag.key].day = day; update(); }
  dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel || d.moved || !d.hit) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'comp') {
    if (id.startsWith('tg')) pickTarget(+id.slice(2));
    if (id === 'tube') { if (!S.spun) spin(); else toast('Плазма сверху, эритроциты снизу, тонкий белый слой — лейкоциты и тромбоциты.'); }
  }
  if (L === 'heart' && id.startsWith('pp-')) { const k = id.slice(3); S.part = k; toast(`${HPARTS[k].name}. ${HPARTS[k].spec}`); update(); }
  if (L === 'bp') {
    if (id === 'bulb' || id === 'cuff') pump();
    if (id === 'steth') toast('Фонендоскоп слушает артерию ниже манжеты. Тоны слышны, только пока кровь прорывается через сдавленный сосуд.');
    if (id === 'dial') toast('Манометр показывает давление воздуха в манжете, в мм рт. ст.');
  }
  if (L === 'imm') {

    if (id === 'thr') toast('Выше этой линии антител достаточно, чтобы обезвредить возбудителя сразу.');
  }
}

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = clamp((t - (lastT || t)) / 1000, 0, 0.1); lastT = t;
  let anim = false;
  const id = LID();
  if (id === 'comp') anim = (S.spun && t - S.spinT < 1700) || (S.cur >= 0 && !reduce);
  if (id === 'heart' && S.play) {
    const before = phaseAt(S.tc).id;
    S.tc += dt / S.slow; anim = true;
    if (phaseAt(S.tc).id !== before) { renderMeter(model()); updateScheme(model()); }
  }
  if (id === 'bp') { bpTick(dt); anim = true; }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function updateScheme(m) {

  } else {

    set('#inVacO', c.vac.on ? c.vac.day : 'выкл.'); val('#inVac', c.vac.day); set('#inSerO', c.ser.on ? c.ser.day : 'выкл.'); val('#inSer', c.ser.day);

  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'comp') {
    const V = S.mass * 0.07, rbcN = V * 5e12;
    let h = `<h2>Сколько у вас крови</h2><div class="formula">V = 7 % × m</div><div class="steps">` +
      step('Масса тела', S.mass + ' кг') + step('Объём крови', `0,07 × ${S.mass} ≈ ${ru(V)} л`) +
      step('Плазма, 55 %', `0,55 × ${ru(V)} ≈ ${ru(V * .55)} л`) + step('Форменные элементы, 45 %', `0,45 × ${ru(V)} ≈ ${ru(V * .45)} л`) +
      step('Эритроцитов в 1 л', '≈ 5 · 10¹² шт.') + step('Всего эритроцитов', `≈ ${ru(rbcN / 1e12, 0)} · 10¹² шт.`, 'sum') + `</div>`;
    h += `<h3>Сколько кислорода несёт кровь</h3><div class="steps">` + step('Гемоглобин в 1 л крови', '≈ 140 г') + step('1 г гемоглобина связывает', '1,34 мл O₂') +
      step('В 1 л крови', '140 × 1,34 ≈ 188 мл O₂') + step(`Во всей крови (${ru(V)} л)`, `≈ ${ru(V * 0.188, 2)} л O₂`, 'sum') + `</div>`;
    h += `<h3>Ваши ответы</h3><div class="steps">` + TG.map((g, i) => step(`Клетка ${i + 1}`, S.lab[i] ? CT[S.lab[i]].name + (m.placed === 6 ? (S.lab[i] === g.type ? ' ✓' : ' ✗') : '') : '—')).join('') +
      step('итого', m.placed === 6 ? `верно ${m.right} из 6` : `определено ${m.placed} из 6`, 'sum') + `</div>`;
    return h;
  }
  if (id === 'heart') {
    const c = m.p.c;
    return `<h2>Цикл при пульсе ${S.hr}</h2><div class="formula">T = 60 с ÷ ЧСС</div><div class="steps">` +
      step('Длительность цикла', `60 ÷ ${S.hr} = ${ru(c.T, 2)} с`) + step('Систола предсердий', ru(c.sa, 2) + ' с') + step('Систола желудочков', ru(c.sv, 2) + ' с') +
      step('Общая пауза', ru(c.dp, 2) + ' с') + step('Желудочки отдыхают', `${Math.round((c.T - c.sv) / c.T * 100)} % цикла`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">При частом пульсе сильнее всего укорачивается пауза — сердцу меньше времени на отдых.</p>` +
      `<h3>Минутный объём</h3><div class="formula">МОК = УО × ЧСС</div><div class="steps">` + step('Ударный объём', S.svol + ' мл') +
      step('За минуту', `${S.svol} × ${S.hr} = ${S.svol * S.hr} мл ≈ ${ru(m.mok, 2)} л`) + step('За сутки', `≈ ${Math.round(m.mok * 60 * 24 / 100) / 10} тыс. л`, 'sum') +
      step('Ударов за сутки', `${S.hr} × 60 × 24 = ${(S.hr * 1440).toLocaleString('ru-RU')}`) + `</div>` +
      `<h3>Сейчас: ${PH[m.phase].name}</h3><p>${PH[m.phase].what}</p>`;
  }
  if (id === 'bp') {
    let h = `<h2>Как читать тонометр</h2><div class="steps">` +
      step('1. Манжета выше верхнего', 'артерия пережата, тишина') + step('2. Первый тон', '= систолическое') +
      step('3. Тоны слышны', 'кровь прорывается') + step('4. Тоны исчезли', '= диастолическое') + `</div>`;
    const s = S.marks.s, d = S.marks.d;
    if (s !== null && d !== null && d < s) {
      const cat = s >= 140 || d >= 90 ? 'повышенное (гипертензия)' : s >= 130 || d >= 85 ? 'высокое нормальное' : s >= 120 || d >= 80 ? 'нормальное' : s < 90 || d < 60 ? 'пониженное' : 'оптимальное';
      h += `<h3>Ваше измерение</h3><div class="steps">` + step('Давление', `${s}/${d} мм рт. ст.`) + step('Пульсовое', `${s} − ${d} = ${s - d}`) +
        step('Среднее ≈ Д + (С − Д) / 3', `${d} + ${s - d} / 3 ≈ ${Math.round(d + (s - d) / 3)}`) + step('Для взрослого это', cat, 'sum') + `</div>` +
        `<p class="note" style="margin-top:8px">Границы для взрослых по ВОЗ: до 120/80 — оптимальное, от 140/90 — повышенное. У подростков нормы ниже и зависят от роста — их оценивает врач.</p>`;
    } else h += `<p class="note" style="margin-top:10px">Отметьте оба тона, и здесь появится разбор вашего измерения.</p>`;
    h += `<h3>Давление и скорость в сосудах</h3><div class="steps">` + VES.map(v => step(v.name, `${v.p} мм · ${v.v}`)).join('') + `</div>` +
      `<p class="note" style="margin-top:8px">Давление падает от аорты к полым венам — эта разница и гонит кровь. В капиллярах кровь течёт в 1000 раз медленнее, чем в аорте: суммарный просвет капилляров огромен.</p>`;
    return h;
  }
  const P = IP[S.ipt], C = S.ipt ? m.c1 : m.c0;
  let h = `<h2>${P.name}: разбор</h2><div class="steps">`;
  h += step('Возбудитель действует', `день ${P.V}`);
  if (C.vac !== null) h += step('Вакцина', `день ${C.vac}`) + step('Прошло до встречи', `${P.V} − ${C.vac} = ${P.V - C.vac} дн.`) + step('Клетки памяти (нужно ≥ 14 дн.)', C.mem ? 'успели' : 'не успели');
  if (C.ser !== null) h += step('Сыворотка', `день ${C.ser}`) + (C.ser <= P.V ? step('Антител от сыворотки', `3 × 0,5^(${P.V - C.ser}/7) ≈ ${ru(C.serA(P.V), 2)}`) : step('Антител от сыворотки', 'введена позже'));
  h += step('Антител к дню встречи', `${ru(C.aV, 2)} (порог 1)`) + step('Итог', C.ok ? 'защищён(а)' : C.prot ? 'не заболеет, но защита короткая' : 'заболеет', 'sum') + `</div>`;
  h += `<h3>Правила модели</h3><div class="steps">` + step('Вакцина: антитела растут', 'с 5-го по 14-й день') + step('Сыворотка: половина антител', 'исчезает за 7 дней') +
    step('Клетки памяти при встрече', 'ответ за 1–2 дня') + `</div><p class="note" style="margin-top:8px">${P.long ? 'Асели нужна защита на годы — подумайте, что из двух средств оставляет клетки памяти.' : 'Перенесённый столбняк иммунитета не оставляет, поэтому важно защитить Тимура до начала болезни.'}</p>`;
  return h;
}

      <div class="gauge"><b style="width:${(m.placed / 6 * 100).toFixed(1)}%"></b></div>

  }

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как работает кровь и сердце!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  let now = '', guide = '';
  if (id === 'comp') {
    now = `Слева пробирка с кровью: ${m.spun ? 'кровь разделена в центрифуге — сверху плазма около 55 %, тонкий белый слой лейкоцитов и тромбоцитов, снизу эритроциты около 45 %' : 'кровь ещё не разделена (ученик не нажал «Центрифуга»)'}. Справа мазок крови под микроскопом, 6 отмеченных клеток: ` +
      TG.map((g, i) => `${i + 1}) видно: ${g.look}; ответ ученика: ${S.lab[i] ? CT[S.lab[i]].name.toLowerCase() : 'нет'}`).join('; ') + '. ' +
      (m.placed === 6 ? `Все определены, верно ${m.right} из 6.` : `Определено ${m.placed} из 6.`) + ` Масса тела в расчёте ${S.mass} кг, объём крови ≈ ${ru(S.mass * 0.07)} л.`;
    guide = 'Не называй тип каждой клетки. Спрашивай: есть ли ядро, какого клетка размера и цвета, какую работу могут делать такие клетки.';
  }
  if (id === 'heart') {
    const p = m.p;
    now = `Схема сердца в разрезе: правое предсердие и желудочек (венозная кровь), левые (артериальная), полые вены, лёгочная артерия, аорта, лёгочные вены. Пульс ${S.hr} уд/мин, цикл ${ru(p.c.T, 2)} с (систола предсердий ${ru(p.c.sa, 2)} с, систола желудочков ${ru(p.c.sv, 2)} с, пауза ${ru(p.c.dp, 2)} с). Сейчас фаза: ${PH[p.id].name}, ${S.play ? 'анимация идёт' : 'на паузе'}, замедление ×${S.slow}. ${PH[p.id].what} Ударный объём ${S.svol} мл, минутный объём ${ru(m.mok, 2)} л/мин.`;
    guide = 'Подводи вопросами: какие клапаны открыты в систоле желудочков, какой пульс дает цикл 0,8 с. Не нажимай за ученика.';
  }
  if (id === 'bp') {
    now = `Пациент: ${PATS[S.pat].name}. Тонометр: манжета на плече, давление в манжете ${Math.round(S.cuff)} мм рт. ст., спуск воздуха ${S.valve ? 'идёт со скоростью ' + S.rate + ' мм рт. ст./с' : 'остановлен'}. На последнем ударе сердца ${S.lastBeat.tone ? 'был слышен тон' : 'тона не было'}. Отметки ученика: первый тон ${S.marks.s ?? 'не отмечен'}, тоны исчезли ${S.marks.d ?? 'не отмечено'}.`;
    guide = 'Не называй настоящее давление пациента. Объясняй метод Короткова: когда тоны появляются и когда исчезают, и почему спускать надо медленно.';
  }
  if (id === 'imm') {
    now = IP.map((P, i) => { const C = i ? m.c1 : m.c0, c = S.inj[i]; return `${P.name} (${P.ill}): ${P.story} Введено: вакцина ${c.vac.on ? 'в день ' + c.vac.day : 'нет'}, сыворотка ${c.ser.on ? 'в день ' + c.ser.day : 'нет'}. Антител в день ${P.V}: ${ru(C.aV, 2)} (порог 1), клетки памяти: ${C.mem ? 'есть' : 'нет'}, итог: ${C.ok ? 'защищён(а)' : C.prot ? 'не заболеет, но защита короткая' : 'заболеет'}.`; }).join(' ') + ` На экране выбран пациент ${IP[S.ipt].name}.`;
    guide = 'Не говори готовый ответ, что и в какой день вводить. Спрашивай, чем вакцина отличается от сыворотки по скорости и длительности защиты.';
  }
  return [
    `Раздел: биология, 9 класс, тема «Кровь и сердце» (Человек). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { comp: 'Почему у эритроцитов нет ядра?', heart: 'Почему стенка левого желудочка толще правого?', bp: 'Почему тоны слышны только между верхним и нижним давлением?', imm: 'Чем вакцина отличается от сыворотки?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
