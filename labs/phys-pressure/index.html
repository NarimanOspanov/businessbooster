<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 7 класс: давление твёрдых тел, давление в жидкости и газе, атмосферное давление, закон Архимеда, плавание тел.">
<title>Давление</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Давление</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/7</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с давлением. Предметы можно тянуть и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const big = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'solid', title: 'Давление твёрдых тел',
    text: ['Давление показывает, с какой силой тело давит на каждый квадратный метр опоры. Одна и та же сила может давить сильно или слабо — всё решает площадь.',
           'Давление находят так: p = F / S. Здесь F — сила давления (у стоящего человека это его вес), S — площадь опоры. Единица давления — паскаль: 1 Па = 1 Н/м², 1 кПа = 1000 Па.',
           'Чтобы уменьшить давление, площадь опоры увеличивают: лыжи, гусеницы, широкий фундамент. Чтобы увеличить — уменьшают: нож точат, иглу делают острой.'],
    why: 'Инженер-строитель подбирает ширину фундамента так, чтобы дом не давил на грунт сильнее допустимого — иначе стены дадут трещины. Вездеходы и тракторы на мягких полях Северного Казахстана ездят на широких шинах и гусеницах, чтобы не вязнуть. Спасатели МЧС на тонком льду ползут или кладут доску: площадь больше — давление меньше.',
    task: 'Турист весит 60 кг и несёт рюкзак 20 кг. Подберите обувь, чтобы давление на снег было не больше 4 кПа. Потом встаньте в кроссовках на одну ногу.',
    hint: 'Обувь и рюкзак меняются кнопками внизу. Снег выдерживает 4 кПа: если давление больше, турист проваливается. Считаем g ≈ 10 Н/кг.',
    stage: 'Меняйте обувь и рюкзак кнопками внизу.',
    body: 60, load0: 20, needLoad: 20, pMax: 4000,
    check: m => m.safe && m.oneTried },
  { id: 'liquid', title: 'Давление в жидкости и газе',
    text: ['Молекулы жидкости и газа подвижны и всё время ударяются о стенки сосуда. Поэтому жидкость давит не только на дно, но и на стенки и на любое тело внутри неё.',
           'Закон Паскаля: давление в жидкости или газе передаётся во все стороны одинаково. На одной глубине датчик покажет одно и то же, куда его ни поверни.',
           'С глубиной давление жидкости растёт: p = ρgh, где ρ — плотность жидкости, h — глубина. Чем плотнее жидкость и чем глубже, тем больше давление.'],
    why: 'Водолазы и дайверы знают: каждые 10 м воды добавляют около 100 кПа, поэтому глубоко погружаются только в прочном снаряжении. Плотину Капшагайской ГЭС внизу делают толще, чем вверху: там вода давит сильнее. Сантехники и инженеры водоканала рассчитывают давление в трубах, чтобы вода доходила до верхних этажей.',
    task: 'Найдите в воде глубину, где давление воды 20 кПа, и поверните там датчик. Затем налейте керосин и найдите глубину с тем же давлением.',
    hint: 'Тяните датчик вверх-вниз или жмите стрелки. Считаем g ≈ 10 Н/кг и только давление самой жидкости, без воздуха над ней.',
    stage: 'Тяните датчик вверх и вниз.',

const LS_KEY = 'luch-phys-pressure';

try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}

const S = { lesson: clamp(savedIdx >= 0 ? savedIdx : saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, lid: LESSONS[S.lesson].id, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- physics data ----------
const g = 10;
const SHOES = { boots: { n: 'Кроссовки', s: 0.02, w: 20 }, shoes: { n: 'Снегоступы', s: 0.09, w: 64 }, skis: { n: 'Лыжи', s: 0.13, w: 180 } };
const LIQ = {

  oil: { n: 'Масло', r: 900, c: '#d6a94a' }, merc: { n: 'Ртуть', r: 13600, c: '#aeb8c9' } };
const LIQ2 = ['water', 'kero', 'brine'], LIQ4 = ['water', 'oil', 'brine'], LIQ5 = ['kero', 'water', 'brine', 'merc'];
const ABODY = { al: { n: 'Алюминий', r: 2700, c: '#c3cbd8' }, st: { n: 'Сталь', r: 7800, c: '#7d8799' } };
const FB = {
  cork: { n: 'Пробка', r: 240, c: '#c99a63' }, pine: { n: 'Сосна', r: 500, c: '#e3b56e' }, ice: { n: 'Лёд', r: 900, c: '#d4f1fb' },
  plex: { n: 'Оргстекло', r: 1200, c: '#8fd0e0' }, al: { n: 'Алюминий', r: 2700, c: '#c3cbd8' }, steel: { n: 'Сталь', r: 7800, c: '#7d8799' } };
const FBK = Object.keys(FB);
const PLACES = [{ n: 'Уровень моря', H: 0 }, { n: 'Алматы', H: 800 }, { n: 'Медеу', H: 1690 }, { n: 'Шымбулак', H: 2260 }, { n: 'Пик Талгар', H: 4979 }, { n: 'Хан-Тенгри', H: 7010 }];
const mmHg = H => 760 * Math.exp(-H / 8400);       // barometric formula, scale height ≈ 8,4 km
const PA_MM = 133.3;

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const SN = { y: 236, cm: 2.2 };                                        // lesson 1: snow surface, units per cm
const TK = { x0: 170, x1: 370, ys: 100, k: 90 };                       // lesson 2: tank, 90 units per metre
const MT = [[0, 44], [800, 84], [1690, 118], [2260, 140], [3500, 182], [4979, 222], [7010, 262]];  // lesson 3: left slope (H, x)
const yOfH = H => 370 - H * 0.032;
const xOfH = H => { for (let i = 1; i < MT.length; i++) if (H <= MT[i][0]) { const a = MT[i - 1], b = MT[i]; return a[1] + (b[1] - a[1]) * (H - a[0]) / (b[0] - a[0]); } return MT[MT.length - 1][1]; };
const TB = { x: 444, yz: 372, k: 0.285 };                              // lesson 3: Torricelli tube, units per mm
const AR = { x: 250, ys: 292, top: 118 };                              // lesson 4: dynamometer column, water surface
const FT = { x0: 122, x1: 398, ys: 176, yb: 386, A: 56, cx: 260, top: 96 };   // lesson 7: tank and cube
// lesson 3: connected vessels on a common pipe (profiles: [height cm, left x, right x] from the vessel axis) and a U-tube
const VS = { y0: 330, k: 7, H: 30, x0: 195, x1: 438 };
const VSH = {
  narrow: { n: 'Трубка', p: [[0, -8, 8], [30, -8, 8]] },
  funnel: { n: 'Воронка', p: [[0, -8, 8], [10, -8, 8], [30, -50, 50]] },
  slant: { n: 'Наклонная', p: [[0, -8, 8], [4, -8, 8], [30, 34, 50]] },
  flask: { n: 'Колба', p: [[0, -8, 8], [3, -8, 8], [8, -38, 38], [16, -38, 38], [21, -8, 8], [30, -8, 8]] } };
const VSK = Object.keys(VSH);
const VFIX = [{ x: 300, p: [[0, -44, 44], [30, -44, 44]], n: 'Широкий' }, { x: 205, p: [[0, -10, 10], [30, -10, 10]], n: 'Узкий' }];
const VRX = 430;
const VPAIRS = { oil: { n: 'Масло + вода', a: 'oil', b: 'water' }, kero: { n: 'Керосин + вода', a: 'kero', b: 'water' }, hg: { n: 'Вода + ртуть', a: 'water', b: 'merc' } };
const VPK = Object.keys(VPAIRS);
const UT = { xl: 270, xr: 390, y0: 320, k: 6, L0: 14, H: 44, w: 26 };
// lesson 4: hydraulic press (width ∝ √S, 1 unit = 1 mm of lift on the drawing)
const PR = { yb: 330, xs: 230, xl: 370, c: 4.6, ys0: 210, st: 30, yl0: 262, rod: 70, gx: 110 };
const PS1 = [2, 5, 10, 20], PS2 = [200, 500, 1000];

function resetState() {
  const Ls = L();
  Object.assign(S, {
    load: Ls.load0 != null ? Ls.load0 : 20, shoe: 'boots', one: false, safeOK: false, oneOK: false, sv: 0,
    hd: Ls.h0 != null ? Ls.h0 : 5, liq: 'water', orient: 0, seenOr: {}, w20: false, turned: false, k25: false,
    H: Ls.H0 != null ? Ls.H0 : 800, reached: false, conv: false,
    tr: 0, body: 'al', liq2: 'water', recAl: null, recSt: null,
    fb: Ls.fb0 || 'ice', fl: Ls.fl0 || 'water', fy: FT.top, fmode: 'held', seen: {}, hl: null,
    vmode: 'one', lev: 12, vshape: 'narrow', vSeen: {}, shapesOK: false, hA: 0, pair: 'oil', oilOK: false,
    f1: 50, s1: 5, s2: 500, lift: 0, liftV: 0, ph: 0, pumpT: -1, pumpOk: false, pumpHit: false, strokes: 0, lift100: false, lift50: false,
  });
}
resetState();

const pSolid = () => (L().body + S.load) * g / (SHOES[S.shoe].s * (S.one ? 1 : 2));
const sinkOf = p => p <= L().pMax ? 0.4 : Math.min(45, 1 + (p - L().pMax) / 600);
const pLiq = () => LIQ[S.liq].r * g * S.hd / 10;
const fSub = () => clamp((AR.top + S.tr + 137 - AR.ys) / 50, 0, 1);        // body bottom = top + tr + 137
const archF = () => { const V = L().V * 1e-6, P = ABODY[S.body].r * g * V, Fa = LIQ[S.liq2].r * g * V * fSub(); return { P, Fa, F: P - Fa, Vs: L().V * fSub() }; };
const subFrac = () => clamp((S.fy + FT.A - FT.ys) / FT.A, 0, 1);
const outcomeOf = (fb, fl) => FB[fb].r < LIQ[fl].r ? 'float' : FB[fb].r > LIQ[fl].r ? 'sink' : 'hover';
const OUT = { float: 'плавает на поверхности', sink: 'тонет', hover: 'плавает внутри жидкости' };
const seenAny = (b, o) => Object.keys(S.seen).some(k => k.split('|')[0] === b && S.seen[k] === o);
// U-tube: the lighter liquid A (column hA) is poured into the left arm on top of B; ρA·hA = ρB·hB above the interface
function uState() {
  const P = VPAIRS[S.pair], ra = LIQ[P.a].r, rb = LIQ[P.b].r, x = ra * S.hA / (2 * rb);
  return { P, ra, rb, li: UT.L0 - x, rr: UT.L0 + x, ta: UT.L0 - x + S.hA, hB: ra * S.hA / rb };
}
// press: p = F1/S1, F2 = p·S2; d2 — lift of the big piston (mm) per 10-cm stroke of the small one
function pressF() {
  const W = L().mass * g, p = S.f1 / (S.s1 * 1e-4), F2 = p * S.s2 * 1e-4;
  return { W, p, F2, ok: F2 >= W - 1e-6, min: Math.ceil(W * S.s1 / S.s2 / 10 - 1e-9) * 10, d2: 100 * S.s1 / S.s2 };
}

function model() {
  const id = LID();
  if (id === 'solid') { const p = pSolid(); return { kind: id, F: (L().body + S.load) * g, Sa: SHOES[S.shoe].s * (S.one ? 1 : 2), p, sink: p > L().pMax, safe: S.safeOK, oneTried: S.oneOK }; }
  if (id === 'liquid') return { kind: id, h: S.hd / 10, p: pLiq(), w20: S.w20, turned: S.turned, k25: S.k25 };
  if (id === 'atm') { const mm = mmHg(S.H); return { kind: id, H: S.H, mm, pa: mm * PA_MM, reached: S.reached, conv: S.conv }; }
  if (id === 'arch') return Object.assign({ kind: id, f: fSub(), recAl: S.recAl != null, recSt: S.recSt != null }, archF());
  if (id === 'vessels') return Object.assign({ kind: id, mode: S.vmode, lev: S.lev, p: LIQ.water.r * g * S.lev / 100, nShapes: Object.keys(S.vSeen).length, hA: S.hA, shapesOK: S.shapesOK, oilOK: S.oilOK }, uState());
  if (id === 'press') return Object.assign({ kind: id, lift: S.lift, strokes: S.strokes, lift100: S.lift100, lift50: S.lift50 }, pressF());
  return { kind: id, out: outcomeOf(S.fb, S.fl), k: subFrac(), iceSink: seenAny('ice', 'sink'), steelFloat: seenAny('steel', 'float'), plexHover: seenAny('plex', 'hover') };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const HALO = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function arrow(x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L2 = Math.hypot(x2 - x1, y2 - y1); if (L2 < 1) return '';

  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const p = toSvg(e);
  drag = { id: el.dataset.drag, y0: p.y, tr0: S.tr, fy0: S.fy, hA0: S.hA };
  if (drag.id === 'cube') { S.fmode = 'held'; }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSvg(e);
  if (drag.id === 'probe') setDepth(Math.round((p.y - TK.ys) / (TK.k / 10)));
  else if (drag.id === 'climber') setH(Math.round((370 - p.y) / 0.032 / 10) * 10);
  else if (drag.id === 'dyn') setTr(Math.round((drag.tr0 + p.y - drag.y0) / 5) * 5);
  else if (drag.id === 'cube') { S.fy = clamp(drag.fy0 + p.y - drag.y0, 60, FT.yb - FT.A); update(); }
  else if (drag.id === 'lev') setLev(Math.round((VS.y0 - p.y) / VS.k));
  else if (drag.id === 'col') setHA(Math.round(drag.hA0 + (drag.y0 - p.y) / (UT.k * (1 - LIQ[VPAIRS[S.pair].a].r / (2 * LIQ[VPAIRS[S.pair].b].r)))));
  else if (drag.id === 'pump' && !drag.done && p.y - drag.y0 > 12) { drag.done = true; act('push'); }
});
const endDrag = () => {
  if (!drag) return;
  if (drag.id === 'cube') S.fmode = 'free';
  if (drag.id === 'pump' && !drag.done) act('push');
  drag = null; scene.classList.remove('grabbing'); dirty = true;
};
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function setDepth(d) { d = clamp(d, 0, 30); if (d === S.hd) return; S.hd = d; update(); }
function setH(H) { H = clamp(H, 0, 7100); if (H === S.H) return; S.H = H; update(); }
function setTr(v) { v = clamp(v, 0, 100); if (v === S.tr) return; S.tr = v; update(); }
function setLoad(v) { v = clamp(v, 0, 30); if (v === S.load) return; S.load = v; update(); }
function setLev(v) { v = clamp(v, 3, 28); if (v === S.lev) return; S.lev = v; update(); }
function setHA(v) { v = clamp(v, 0, 30); if (v === S.hA) return; S.hA = v; update(); }
function setF1(v) { v = clamp(Math.round(v / 10) * 10, 10, 1000); if (v === S.f1) return; S.f1 = v; renderTools(); update(); }
// the small piston reaches the bottom of its stroke: the car rises if F2 ≥ P
function pumpHit() {
  const P = pressF();
  if (!P.ok) { toast(`F₂ = ${big(P.F2)} Н меньше веса ${big(P.W)} Н — масло не сдвинет поршень. Нужна сила побольше или другие поршни.`); return; }
  S.lift = Math.min(60, S.lift + P.d2); S.strokes++;
  let msg = `Малый поршень прошёл 10 см, автомобиль поднялся на ${fmt(P.d2, 1)} мм: во сколько выиграли в силе, во столько проиграли в пути.`;
  if (S.s1 === 5 && S.s2 === 500 && !S.lift100) {
    if (S.f1 === P.min) { S.lift100 = true; msg = `Хватило ${P.min} Н: F₂ = ${big(P.F2)} Н. Площадь больше в 100 раз — и сила в 100 раз. Теперь смените поршни, чтобы хватило 50 Н.`; }
    else msg = `Поднялся! Но хватило бы и меньшей силы — найдите наименьшую.`;
  }
  if (!S.lift50 && S.f1 <= 50) { S.lift50 = true; msg = `Всего ${S.f1} Н поднимают автомобиль: S₂ / S₁ = ${S.s2 / S.s1}. Зато малый поршень за ход сдвигает машину лишь на ${fmt(P.d2, 1)} мм.`; }
  toast(msg); update();
}

// task progress that is reached by a state (latched, with a toast)
function latch() {
  const id = LID(), Ls = L();
  if (id === 'solid') {
    const p = pSolid();
    if (!S.safeOK && S.load === Ls.needLoad && p <= Ls.pMax) { S.safeOK = true; toast(`${SHOES[S.shoe].n}: ${fmt(p / 1000, 1)} кПа — снег держит! Теперь встаньте в кроссовках на одну ногу.`); }
    if (!S.oneOK && S.one && S.shoe === 'boots') { S.oneOK = true; toast(`Площадь вдвое меньше — давление вдвое больше: ${fmt(p / 1000, 0)} кПа.`); }
  }
  if (id === 'liquid') {
    if (S.liq === 'water' && S.hd === 20) {
      if (!S.w20) { S.w20 = true; toast('20 кПа! Теперь поверните датчик и посмотрите на манометр.'); }
      S.seenOr[S.orient] = 1;
      if (!S.turned && Object.keys(S.seenOr).length >= 2) { S.turned = true; toast('Повернули — показание то же. Это закон Паскаля. Теперь керосин.'); }
    }
    if (!S.k25 && S.liq === 'kero' && S.hd === 25) { S.k25 = true; toast('В керосине 20 кПа только на 2,5 м: он легче воды.'); }
  }
  if (id === 'atm' && !S.reached && Math.abs(mmHg(S.H) - Ls.mmNeed) <= 2) { S.reached = true; toast(`Высота ${big(S.H)} м: столбик ${fmt(mmHg(S.H), 0)} мм. Сколько это в кПа?`); renderTools(); buildScheme(); }
  if (id === 'vessels') {
    if (S.vmode === 'one') {
      S.vSeen[S.vshape] = 1;
      if (!S.shapesOK && Object.keys(S.vSeen).length >= 3) { S.shapesOK = true; toast('Форма разная — уровень один и тот же. Теперь U-трубка: долейте масло.'); }
    } else if (!S.oilOK && S.pair === 'oil' && S.hA * LIQ.oil.r === Ls.hB * LIQ.water.r) { S.oilOK = true; toast(`Масло ${S.hA} см уравновешивает воду ${Ls.hB} см: 900 · ${S.hA} = 1000 · ${Ls.hB}.`); }
  }
  if (id === 'arch' && fSub() === 1 && S.liq2 === 'water') {
    const Fa = archF().Fa;
    if (S.body === 'al' && S.recAl == null) { S.recAl = Fa; toast(S.recSt == null ? `Алюминий: FA = ${fmt(Fa, 1)} Н. Теперь стальной цилиндр.` : `Алюминий: тоже ${fmt(Fa, 1)} Н!`); buildScheme(); }
    if (S.body === 'st' && S.recSt == null) { S.recSt = Fa; toast(S.recAl == null ? `Сталь: FA = ${fmt(Fa, 1)} Н. Теперь алюминиевый цилиндр.` : `Сталь: тоже ${fmt(Fa, 1)} Н! Сила Архимеда не зависит от материала.`); buildScheme(); }
  }
}

function floatTarget() {
  const rb = FB[S.fb].r, rl = LIQ[S.fl].r, A = FT.A;
  if (rb < rl) return FT.ys - A + A * rb / rl;
  if (rb > rl) return FT.yb - A;
  return S.fy >= FT.ys ? S.fy : FT.ys + 6;
}
function settleFloat() {
  const key = S.fb + '|' + S.fl, o = outcomeOf(S.fb, S.fl), was = S.seen[key];
  S.seen[key] = o;
  if (!was) toast(`${FB[S.fb].n} в жидкости «${LIQ[S.fl].n}»: ${OUT[o]}.`);
  buildScheme();
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  if (id === 'solid') {
    const tg = sinkOf(pSolid());
    if (Math.abs(S.sv - tg) > 0.02) { S.sv = reduce ? tg : S.sv + (tg - S.sv) * Math.min(1, dt * 5); dirty = true; }
  }
  if (id === 'float' && S.fmode === 'free') {
    const tg = floatTarget(), d = tg - S.fy;
    if (Math.abs(d) < 0.6 || reduce) { S.fy = tg; S.fmode = 'rest'; settleFloat(); }
    else S.fy += Math.sign(d) * Math.min(Math.abs(d), dt * 150);
    update();
  }
  if (id === 'press') {
    if (S.pumpT >= 0) {
      S.pumpT += reduce ? 10 : dt; const tt = S.pumpT, amp = S.pumpOk ? 1 : 0.08;
      if (tt < 0.45) S.ph = amp * tt / 0.45;
      else { if (!S.pumpHit) { S.pumpHit = true; pumpHit(); } S.ph = amp * Math.max(0, 1 - (tt - 0.45) / 0.35); }
      if (tt >= 0.8) { S.pumpT = -1; S.ph = 0; }
      dirty = true;
    }
    if (Math.abs(S.liftV - S.lift) > 0.01) { S.liftV = reduce ? S.lift : S.liftV + (S.lift - S.liftV) * Math.min(1, dt * 6); dirty = true; }
  }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3400); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed, cls) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}${cls ? ` class="${cls}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  let h = '';
  if (id === 'solid') h = Object.keys(SHOES).map(k => B('shoe-' + k, SHOES[k].n, S.shoe === k)).join('') + sep + B('one', 'На одной ноге', S.one) + sep + B('load-', 'Рюкзак −5') + B('load+', '+5');
  if (id === 'liquid') h = B('h-', '↑') + B('h+', '↓') + B('or', 'Повернуть', undefined, 'rec') + sep + LIQ2.map(k => B('liq-' + k, LIQ[k].n, S.liq === k)).join('');
  if (id === 'atm') {
    h = B('alt-100', '▼ 100 м') + B('alt-10', '▼ 10') + B('alt+10', '▲ 10') + B('alt+100', '▲ 100 м');
    if (S.reached && !S.conv) h += sep + L().kpaOpts.map(k => B('kpa-' + k, k + ' кПа')).join('');
  }
  if (id === 'vessels') {
    h = B('vm-one', 'Сосуды', S.vmode === 'one') + B('vm-two', 'U-трубка', S.vmode === 'two') + sep;
    if (S.vmode === 'one') h += B('lev-', 'Отлить') + B('lev+', 'Налить', undefined, 'rec') + sep + VSK.map(k => B('vs-' + k, VSH[k].n, S.vshape === k)).join('');
    else h += B('ha-', 'Столб −1') + B('ha+', '+1 см', undefined, 'rec') + sep + VPK.map(k => B('vp-' + k, VPAIRS[k].n, S.pair === k)).join('');
  }
  if (id === 'press') h = B('f1-', '−10 Н') + B('f1+', '+10 Н') + B('push', 'Нажать', undefined, 'rec') + sep + B('s1next', `S₁ = ${S.s1} см²`) + B('s2next', `S₂ = ${S.s2} см²`) + sep + B('release', 'Опустить');
  if (id === 'arch') h = B('tr-', 'Выше') + B('tr+', 'Ниже', undefined, 'rec') + sep + Object.keys(ABODY).map(k => B('body-' + k, ABODY[k].n, S.body === k)).join('') + sep + LIQ4.map(k => B('liq2-' + k, LIQ[k].n, S.liq2 === k)).join('');
  if (id === 'float') h = B('fbnext', 'Тело: ' + FB[S.fb].n) + B('flnext', LIQ[S.fl].n) + sep + B('drop', 'Опустить', undefined, 'rec') + B('lift', 'Вынуть');
  tb.innerHTML = h;
}
function act(a) {
  const id = LID();
  if (a.startsWith('shoe-')) { S.shoe = a.slice(5); renderTools(); buildScheme(); update(); return; }
  if (a === 'one') { S.one = !S.one; renderTools(); buildScheme(); update(); return; }
  if (a === 'load-' || a === 'load+') return setLoad(S.load + (a === 'load-' ? -5 : 5));
  if (a === 'h-' || a === 'h+') return setDepth(S.hd + (a === 'h-' ? -1 : 1));
  if (a === 'or' || a.startsWith('or-')) { S.orient = a === 'or' ? (S.orient + 1) % 3 : +a.slice(3); buildScheme(); update(); return; }
  if (a.startsWith('liq-')) { S.liq = a.slice(4); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('alt')) return setH(S.H + +a.slice(3));
  if (a.startsWith('pl-')) return setH(PLACES[+a.slice(3)].H);
  if (a.startsWith('kpa-')) {
    const k = +a.slice(4), right = Math.round(L().mmNeed * PA_MM / 1000);
    if (k === right) { S.conv = true; toast(`Верно: 600 × 133,3 ≈ 80 000 Па = 80 кПа. Это на 20% меньше, чем у моря.`); renderTools(); buildScheme(); update(); }
    else toast('Нет. 1 мм рт. ст. ≈ 133 Па. Умножьте и переведите в кПа.');
    return;
  }
  if (a.startsWith('vm-')) { S.vmode = a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 'lev-' || a === 'lev+') return setLev(S.lev + (a === 'lev-' ? -2 : 2));
  if (a === 'vsnext' || a.startsWith('vs-')) { S.vshape = a === 'vsnext' ? VSK[(VSK.indexOf(S.vshape) + 1) % VSK.length] : a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 'ha-' || a === 'ha+') return setHA(S.hA + (a === 'ha-' ? -1 : 1));
  if (a.startsWith('vp-')) { S.pair = a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 'f1-' || a === 'f1+') return setF1(S.f1 + (a === 'f1-' ? -10 : 10));
  if (a === 'push') { if (S.pumpT >= 0) return; S.pumpOk = pressF().ok; S.pumpT = 0; S.pumpHit = false; dirty = true; return; }
  if (a === 's1next' || a.startsWith('s1-')) { S.s1 = a === 's1next' ? PS1[(PS1.indexOf(S.s1) + 1) % PS1.length] : +a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 's2next' || a.startsWith('s2-')) { S.s2 = a === 's2next' ? PS2[(PS2.indexOf(S.s2) + 1) % PS2.length] : +a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a === 'release') { if (S.lift > 0) toast('Клапан открыт: масло ушло обратно, автомобиль опустился.'); S.lift = 0; update(); return; }
  if (a === 'tr-' || a === 'tr+') return setTr(S.tr + (a === 'tr-' ? -5 : 5));
  if (a.startsWith('body-')) { S.body = a.slice(5); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('liq2-')) { S.liq2 = a.slice(5); renderTools(); buildScheme(); update(); return; }
  if (a === 'fbnext' || a.startsWith('fb-')) { S.fb = a === 'fbnext' ? FBK[(FBK.indexOf(S.fb) + 1) % FBK.length] : a.slice(3); S.fy = FT.top; S.fmode = 'held'; renderTools(); buildScheme(); update(); return; }
  if (a === 'flnext' || a.startsWith('fl-')) { S.fl = a === 'flnext' ? LIQ5[(LIQ5.indexOf(S.fl) + 1) % LIQ5.length] : a.slice(3); if (S.fmode === 'rest') S.fmode = 'free'; renderTools(); buildScheme(); update(); return; }
  if (a === 'drop') { if (S.fmode === 'held') S.fmode = 'free'; return; }
  if (a === 'lift') { S.fy = FT.top; S.fmode = 'held'; update(); return; }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];

  S.tab = t;

  renderPanes(model());
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'solid') return [t(m.safe, 'Не провалиться'), t(m.oneTried, 'Одна нога')].join(' · ');
  if (id === 'liquid') return [t(m.w20, '20 кПа в воде'), t(m.turned, 'Поворот'), t(m.k25, 'Керосин')].join(' · ');
  if (id === 'atm') return [t(m.reached, '600 мм'), t(m.conv, 'В кПа')].join(' · ');
  if (id === 'vessels') return [t(m.shapesOK, `Три формы (${Math.min(3, m.nShapes)}/3)`), t(m.oilOK, 'Масло уравновесило воду')].join(' · ');
  if (id === 'press') return [t(m.lift100, 'Наименьшая сила'), t(m.lift50, 'Хватило 50 Н')].join(' · ');
  if (id === 'arch') return [t(m.recAl, 'Алюминий'), t(m.recSt, 'Сталь')].join(' · ');
  return [t(m.iceSink, 'Лёд утонул'), t(m.steelFloat, 'Сталь всплыла'), t(m.plexHover, 'Оргстекло зависло')].join(' · ');
}

// Scheme tab: built once per lesson, then values refreshed (sliders keep focus while dragging)
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const chips = (lbl, items) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips">${items.map(([a, n, on]) => `<button data-a="${a}" aria-pressed="${!!on}">${n}</button>`).join('')}</div></div>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'solid') h = `<h2>Турист на снегу</h2>` + chips('Обувь', Object.keys(SHOES).map(k => ['shoe-' + k, `${SHOES[k].n} · ${nf(SHOES[k].s * 10000)} см²`, S.shoe === k])) +
      chips('Стойка', [['one', 'На одной ноге', S.one]]) + slider('inLoad', 'Рюкзак', 0, 30, 5, S.load) +
      `<dl class="reads"><div><dt>вес F</dt><dd id="r1"></dd></div><div><dt>площадь S</dt><dd id="r2"></dd></div><div><dt>давление p</dt><dd id="r3"></dd></div></dl>
      <p class="note" style="margin-top:12px">Площадь в списке — для одной ступни. Турист весит 60 кг. Снег выдерживает 4 кПа.</p>`;
  if (id === 'liquid') h = `<h2>Бак и датчик</h2>` + slider('inH', 'Глубина датчика', 0, 3, 0.1, S.hd / 10) +
      chips('Плёнка датчика смотрит', [['or-0', 'вниз', S.orient === 0], ['or-1', 'вбок', S.orient === 1], ['or-2', 'вверх', S.orient === 2]]) +
      chips('Жидкость', LIQ2.map(k => ['liq-' + k, `${LIQ[k].n} · ${big(LIQ[k].r)}`, S.liq === k])) +
      `<dl class="reads"><div><dt>глубина</dt><dd id="r1"></dd></div><div><dt>ρ, кг/м³</dt><dd id="r2"></dd></div><div><dt>давление</dt><dd id="r3"></dd></div></dl>`;
  if (id === 'atm') h = `<h2>Барометр в горах</h2>` + slider('inAlt', 'Высота над уровнем моря', 0, 7100, 10, S.H) +
      chips('Перенестись', PLACES.map((P, i) => ['pl-' + i, `${P.n} · ${big(P.H)} м`, S.H === P.H])) +
      `<dl class="reads"><div><dt>столбик</dt><dd id="r1"></dd></div><div><dt>давление</dt><dd id="r2"></dd></div><div><dt>от нормы</dt><dd id="r3"></dd></div></dl>` +
      (S.reached ? chips('600 мм рт. ст. — это…', L().kpaOpts.map(k => ['kpa-' + k, k + ' кПа', S.conv && k === 80])) : '') +
      `<p class="note" style="margin-top:12px">Модель: давление убывает с высотой по барометрической формуле. Погода тоже немного меняет давление — здесь её нет.</p>`;
  if (id === 'vessels') {
    h = `<h2>Сообщающиеся сосуды</h2>` + chips('Опыт', [['vm-one', 'Сосуды разной формы', S.vmode === 'one'], ['vm-two', 'U-трубка, две жидкости', S.vmode === 'two']]);
    if (S.vmode === 'one') h += slider('inLev', 'Уровень воды', 3, 28, 1, S.lev) + chips('Правый сосуд', VSK.map(k => ['vs-' + k, VSH[k].n, S.vshape === k])) +
      `<dl class="reads"><div><dt>уровень</dt><dd id="r1"></dd></div><div><dt>p у дна</dt><dd id="r2"></dd></div><div><dt>форм видели</dt><dd id="r3"></dd></div></dl>
      <p class="note" style="margin-top:12px">Все сосуды соединены трубкой снизу. Уровень воды одинаков во всех — сравните с пунктиром.</p>`;
    else h += slider('inHA', 'Столб долитой жидкости', 0, 30, 1, S.hA) + chips('Жидкости (сверху + снизу)', VPK.map(k => ['vp-' + k, `${VPAIRS[k].n} · ${big(LIQ[VPAIRS[k].a].r)} / ${big(LIQ[VPAIRS[k].b].r)}`, S.pair === k])) +
      `<dl class="reads"><div><dt>h₁ (долили)</dt><dd id="r1"></dd></div><div><dt>h₂ (над границей)</dt><dd id="r2"></dd></div><div><dt>h₁ / h₂</dt><dd id="r3"></dd></div></dl>
      <p class="note" style="margin-top:12px">Высоты отсчитывают от уровня границы двух жидкостей — ниже неё в обоих коленах одна и та же жидкость.</p>`;
  }
  if (id === 'press') h = `<h2>Гидравлический пресс</h2>` + slider('inF1', 'Сила на малый поршень', 10, 1000, 10, S.f1) +
      chips('Малый поршень S₁', PS1.map(v => ['s1-' + v, v + ' см²', S.s1 === v])) + chips('Большой поршень S₂', PS2.map(v => ['s2-' + v, v + ' см²', S.s2 === v])) +
      `<div class="row"><button class="ghostbtn" data-a="push">Нажать</button><button class="ghostbtn" data-a="release">Опустить</button></div>
      <dl class="reads"><div><dt>давление p</dt><dd id="r1"></dd></div><div><dt>сила F₂</dt><dd id="r2"></dd></div><div><dt>подъём за ход</dt><dd id="r3"></dd></div></dl>
      <p class="note" style="margin-top:12px">Автомобиль 1000 кг: P = 10 000 Н. Малый поршень за одно нажатие проходит 10 см.</p>`;
  if (id === 'arch') h = `<h2>Динамометр и отливной сосуд</h2>` + slider('inTr', 'Опустить цилиндр', 0, 100, 5, S.tr) +
      chips('Цилиндр (100 см³)', Object.keys(ABODY).map(k => ['body-' + k, `${ABODY[k].n} · ${big(ABODY[k].r)}`, S.body === k])) +
      chips('Жидкость', LIQ4.map(k => ['liq2-' + k, `${LIQ[k].n} · ${big(LIQ[k].r)}`, S.liq2 === k])) +
      `<dl class="reads"><div><dt>в воздухе</dt><dd id="r1"></dd></div><div><dt>динамометр</dt><dd id="r2"></dd></div><div><dt>FA</dt><dd id="r3"></dd></div></dl>
      <h3>Записи (целиком в воде)</h3><div class="rec">` + step('алюминий', S.recAl != null ? fmt(S.recAl, 1) + ' Н' : '—') + step('сталь', S.recSt != null ? fmt(S.recSt, 1) + ' Н' : '—') + `</div>`;
  if (id === 'float') h = `<h2>Сосуд с жидкостью</h2>` + chips('Тело (плотность, кг/м³)', FBK.map(k => ['fb-' + k, `${FB[k].n} · ${big(FB[k].r)}`, S.fb === k])) +
      chips('Жидкость', LIQ5.map(k => ['fl-' + k, `${LIQ[k].n} · ${big(LIQ[k].r)}`, S.fl === k])) +
      `<div class="row"><button class="ghostbtn" data-a="drop">Опустить</button><button class="ghostbtn" data-a="lift">Вынуть</button></div>
      <h3>Что уже видели</h3><div class="rec">` + (Object.keys(S.seen).length ? Object.keys(S.seen).map(k => { const [b, l] = k.split('|'); return step(`${FB[b].n} в «${LIQ[l].n}»`, OUT[S.seen[k]]); }).join('') : '<p class="note">Пока ничего. Бросьте кубик в сосуд.</p>') + `</div>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inLoad', e => setLoad(+e.target.value));
  on('#inH', e => setDepth(Math.round(+e.target.value * 10)));
  on('#inAlt', e => setH(+e.target.value));
  on('#inTr', e => setTr(+e.target.value));
  on('#inLev', e => setLev(+e.target.value));
  on('#inHA', e => setHA(+e.target.value));
  on('#inF1', e => setF1(+e.target.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'solid') { set('#inLoadO', S.load + ' кг'); val('#inLoad', S.load); set('#r1', big(m.F) + ' Н'); set('#r2', fmt(m.Sa, 2) + ' м²'); set('#r3', fmt(m.p / 1000, 1) + ' кПа'); }
  if (id === 'liquid') { set('#inHO', fmt(m.h, 1) + ' м'); val('#inH', m.h); set('#r1', fmt(m.h, 1) + ' м'); set('#r2', big(LIQ[S.liq].r)); set('#r3', fmt(m.p / 1000, 1) + ' кПа'); }
  if (id === 'atm') { set('#inAltO', big(S.H) + ' м'); val('#inAlt', S.H); set('#r1', fmt(m.mm, 0) + ' мм'); set('#r2', fmt(m.pa / 1000, 1) + ' кПа'); set('#r3', '−' + fmt(760 - m.mm, 0) + ' мм'); }
  if (id === 'vessels' && S.vmode === 'one') { set('#inLevO', S.lev + ' см'); val('#inLev', S.lev); set('#r1', S.lev + ' см'); set('#r2', fmt(m.p / 1000, 1) + ' кПа'); set('#r3', Math.min(3, m.nShapes) + ' из 3'); }
  if (id === 'vessels' && S.vmode === 'two') { set('#inHAO', S.hA + ' см'); val('#inHA', S.hA); set('#r1', S.hA + ' см'); set('#r2', fmt(m.hB, 1) + ' см'); set('#r3', S.hA ? fmt(S.hA / m.hB, 2) : '—'); }
  if (id === 'press') { set('#inF1O', S.f1 + ' Н'); val('#inF1', S.f1); set('#r1', big(m.p / 1000) + ' кПа'); set('#r2', big(m.F2) + ' Н'); set('#r3', m.ok ? fmt(m.d2, 1) + ' мм' : 'не поднять'); }
  if (id === 'arch') { set('#inTrO', Math.round(m.f * 100) + '% в жидкости'); val('#inTr', S.tr); set('#r1', fmt(m.P, 2) + ' Н'); set('#r2', fmt(m.F, 2) + ' Н'); set('#r3', fmt(m.Fa, 2) + ' Н'); }
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'solid') {
    const n = S.one ? 1 : 2, s1 = SHOES[S.shoe].s;
    return `<h2>Давление на снег</h2><div class="formula">p = F / S</div><p class="note">F — вес туриста с рюкзаком (F = m·g, g ≈ 10 Н/кг), S — площадь опоры в м². 1 м² = 10 000 см².</p>
      <h3>Сейчас</h3><div class="steps">` +
      step('масса', `${Ls.body} + ${S.load} = ${Ls.body + S.load} кг`) + step('сила F', `${Ls.body + S.load} × 10 = ${big(m.F)} Н`) +
      step('площадь S', `${n} × ${fmt(s1, 2)} = ${fmt(m.Sa, 2)} м²`) + step('давление p', `${big(m.F)} / ${fmt(m.Sa, 2)} = ${big(m.p)} Па`, 'sum') +
      step('в кПа', `${fmt(m.p / 1000, 1)} кПа ${m.p <= Ls.pMax ? '≤' : '>'} 4 кПа`) + `</div>
      <p class="note" style="margin-top:10px">${m.p <= Ls.pMax ? 'Снег держит.' : 'Снег не держит — турист проваливается.'} Чтобы давление не превышало 4 кПа при весе ${big(m.F)} Н, нужна площадь не меньше ${big(m.F)} / 4000 = ${fmt(m.F / 4000, 2)} м².</p>`;
  }
  if (id === 'liquid') {
    const r = LIQ[S.liq].r;
    return `<h2>Давление жидкости</h2><div class="formula">p = ρ · g · h</div><p class="note">ρ — плотность жидкости (кг/м³), g ≈ 10 Н/кг, h — глубина от поверхности (м). Давление воздуха над жидкостью здесь не учитываем.</p>
      <h3>Сейчас</h3><div class="steps">` + step('ρ', `${big(r)} кг/м³ (${LIQ[S.liq].n.toLowerCase()})`) + step('h', `${fmt(m.h, 1)} м`) +
      step('p', `${big(r)} × 10 × ${fmt(m.h, 1)} = ${big(m.p)} Па`, 'sum') + step('в кПа', `${fmt(m.p / 1000, 1)} кПа`) + `</div>
      <h3>Как найти нужную глубину</h3><div class="steps">` + step('из формулы', 'h = p / (ρ · g)') + step('для 20 кПа', `20 000 / (${big(r)} × 10) = ?`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Направление плёнки в формулу не входит — по закону Паскаля давление на одной глубине одинаково во все стороны.</p>`;
  }
  if (id === 'atm') {
    return `<h2>Атмосферное давление</h2><div class="formula">p = ρрт · g · h</div><p class="note">Давление столба ртути равно давлению воздуха. Здесь берём точнее: g = 9,8 Н/кг, ρрт = 13 600 кг/м³.</p>
      <h3>У моря</h3><div class="steps">` + step('h', '760 мм = 0,76 м') + step('p₀', '13 600 × 9,8 × 0,76 ≈ 101 300 Па', 'sum') + `</div>
      <h3>1 мм ртутного столба</h3><div class="steps">` + step('p', '13 600 × 9,8 × 0,001 ≈ 133,3 Па', 'sum') + `</div>
      <h3>На высоте ${big(S.H)} м</h3><div class="steps">` + step('столбик', `${fmt(m.mm, 0)} мм`) +
      step('p', `${fmt(m.mm, 0)} × 133,3 ≈ ${big(m.pa)} Па`, 'sum') + step('ниже нормы на', `${fmt(760 - m.mm, 0)} мм рт. ст.`) + `</div>
      <h3>Цель</h3><div class="steps">` + step('600 мм рт. ст.', S.conv ? '600 × 133,3 ≈ 80 000 Па = 80 кПа' : '600 × 133,3 = ? Па = ? кПа', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Правило для небольших высот: подъём на 11–12 м — минус 1 мм рт. ст. Выше воздух разрежен, и давление падает медленнее.</p>`;
  }
  if (id === 'vessels' && S.vmode === 'one') {
    return `<h2>Один уровень</h2><div class="formula">p = ρ · g · h</div><p class="note">Давление у дна зависит только от плотности и высоты столба, а не от формы и ширины сосуда. g ≈ 10 Н/кг.</p>
      <h3>Сейчас у дна каждого сосуда</h3><div class="steps">` + step('h', `${S.lev} см = ${fmt(S.lev / 100, 2)} м`) + step('p', `1000 × 10 × ${fmt(S.lev / 100, 2)} = ${big(m.p)} Па`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Если бы в одном сосуде вода стояла выше, давление под ним было бы больше, и вода перетекала бы, пока уровни не сравняются.</p>`;
  }
  if (id === 'vessels') {
    const A = LIQ[m.P.a], B = LIQ[m.P.b];
    return `<h2>Две жидкости</h2><div class="formula">ρ₁ · h₁ = ρ₂ · h₂</div><p class="note">На уровне границы давления в обоих коленах равны: ρ₁gh₁ = ρ₂gh₂. Высоты отсчитывают от уровня границы.</p>
      <h3>Сейчас</h3><div class="steps">` + step(`${A.n.toLowerCase()} h₁`, `${S.hA} см`) + step(`ρ₁ · h₁`, `${big(A.r)} × ${S.hA} = ${big(A.r * S.hA)}`) +
      step(`${B.n.toLowerCase()} h₂`, `${big(A.r * S.hA)} / ${big(B.r)} = ${fmt(m.hB, 1)} см`, 'sum') + `</div>
      <h3>Цель: вода 18 см над границей</h3><div class="steps">` + step('из формулы', 'h_масла = ρ_воды · h_воды / ρ_масла') + step('h_масла', S.oilOK ? '1000 × 18 / 900 = 20 см' : '1000 × 18 / 900 = ?', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Жидкость в ${fmt(B.r / A.r, 1).replace(',0', '')} раза легче — её столб во столько же раз выше.</p>`;
  }
  if (id === 'press') {
    const k = S.s2 / S.s1;
    return `<h2>Выигрыш в силе</h2><div class="formula">F₂ / F₁ = S₂ / S₁</div><p class="note">Давление p = F₁ / S₁ передаётся маслом без изменения, поэтому F₂ = p · S₂. 1 см² = 0,0001 м², g ≈ 10 Н/кг.</p>
      <h3>Сейчас</h3><div class="steps">` + step('p', `${big(S.f1)} / ${fmt(S.s1 * 1e-4, 4)} = ${big(m.p)} Па`) + step('F₂', `${big(m.p)} × ${fmt(S.s2 * 1e-4, 2)} = ${big(m.F2)} Н`, 'sum') +
      step('выигрыш', `S₂ / S₁ = ${S.s2} / ${S.s1} = ${nf(k)} раз`) + step('вес автомобиля', `1000 × 10 = ${big(m.W)} Н → ${m.ok ? 'поднимаем' : 'не поднять'}`) + `</div>
      <h3>Наименьшая сила</h3><div class="steps">` + step('F₁', `P · S₁ / S₂ = 10 000 × ${S.s1} / ${S.s2} = ?`, 'sum') + `</div>
      <h3>Проигрыш в пути</h3><div class="steps">` + step('h₂', `h₁ · S₁ / S₂ = 100 мм × ${S.s1} / ${S.s2} = ${fmt(m.d2, 1)} мм`) + step('работа', m.ok ? `F₁·h₁ = ${big(S.f1)} × 0,1 = ${fmt(S.f1 * 0.1, 0)} Дж; F₂·h₂ = ${big(m.F2)} × ${fmt(m.d2 / 1000, 4)} = ${fmt(m.F2 * m.d2 / 1000, 0)} Дж` : 'автомобиль стоит — работы нет', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Выигрыша в работе нет: насколько выиграли в силе, настолько проиграли в расстоянии.</p>`;
  }
  if (id === 'arch') {
    const b = ABODY[S.body], l = LIQ[S.liq2];
    return `<h2>Сила Архимеда</h2><div class="formula">FA = ρж · g · Vпогр</div><p class="note">Vпогр — объём погружённой части. Цилиндр 100 см³ = 0,0001 м³, g ≈ 10 Н/кг.</p>
      <h3>Сейчас</h3><div class="steps">` +
      step('вес в воздухе P', `${big(b.r)} × 10 × 0,0001 = ${fmt(m.P, 2)} Н`) + step('погружено', `${Math.round(m.f * 100)}% → ${nf(m.Vs)} см³`) +
      step('FA', `${big(l.r)} × 10 × ${fmt(m.Vs * 1e-6, 6).replace(/0+$/, '').replace(/,$/, '')} = ${fmt(m.Fa, 2)} Н`, 'sum') +
      step('динамометр', `${fmt(m.P, 2)} − ${fmt(m.Fa, 2)} = ${fmt(m.F, 2)} Н`) + step('вес вылитой жидкости', `${fmt(m.Fa, 2)} Н = FA`) + `</div>
      <p class="note" style="margin-top:10px">Сравните: вес вытесненной жидкости в стаканчике всегда равен силе Архимеда. Это и есть закон Архимеда.</p>`;
  }
  const b = FB[S.fb], l = LIQ[S.fl], V = 0.001, Ft = b.r * g * V, FAmax = l.r * g * V;
  return `<h2>Утонет или всплывёт?</h2><div class="formula">Fт = ρт·g·V    FA = ρж·g·Vпогр</div><p class="note">Кубик 10 см: V = 0,001 м³, g ≈ 10 Н/кг.</p>
    <h3>${b.n} в жидкости «${l.n}»</h3><div class="steps">` +
    step('Fт', `${big(b.r)} × 10 × 0,001 = ${fmt(Ft, 1)} Н`) + step('FA, если целиком', `${big(l.r)} × 10 × 0,001 = ${fmt(FAmax, 1)} Н`) +
    step('сравнение', `${b.r} ${b.r < l.r ? '<' : b.r > l.r ? '>' : '='} ${l.r} → ${OUT[outcomeOf(S.fb, S.fl)]}`, 'sum') +
    (b.r < l.r ? step('доля под жидкостью', `${big(b.r)} / ${big(l.r)} = ${Math.round(b.r / l.r * 100)}%`) : '') + `</div>
    <p class="note" style="margin-top:10px">Сравнивать удобнее плотности: объём у тела и вытесненной жидкости один и тот же, а g одинаково.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'solid') el.innerHTML = `<div class="k">Давление на снег</div><div class="v ${m.sink ? '' : 'ok'}">${fmt(m.p / 1000, 1)} кПа</div><div class="lr"><span>F</span><span>${big(m.F)} Н</span></div><div class="lr"><span>S</span><span>${fmt(m.Sa, 2)} м²</span></div><div class="lr"><span>снег</span><span class="${m.sink ? 'bad' : 'ok'}">${m.sink ? 'не держит' : 'держит'}</span></div>`;
  else if (id === 'liquid') el.innerHTML = `<div class="k">Манометр</div><div class="v ${S.done.liquid ? 'ok' : ''}">${fmt(m.p / 1000, 1)} кПа</div><div class="lr"><span>h</span><span>${fmt(m.h, 1)} м</span></div><div class="lr"><span>ρ</span><span>${big(LIQ[S.liq].r)}</span></div>`;
  else if (id === 'atm') el.innerHTML = `<div class="k">Барометр</div><div class="v ${S.reached ? 'ok' : ''}">${fmt(m.mm, 0)} мм рт. ст.</div><div class="lr"><span>H</span><span>${big(S.H)} м</span></div><div class="lr"><span>p</span><span>${fmt(m.pa / 1000, 1)} кПа</span></div>`;
  else if (id === 'vessels' && S.vmode === 'one') el.innerHTML = `<div class="k">Уровень воды</div><div class="v ${S.shapesOK ? 'ok' : ''}">${S.lev} см</div><div class="lr"><span>сосуд</span><span>${VSH[S.vshape].n.toLowerCase()}</span></div><div class="lr"><span>p у дна</span><span>${fmt(m.p / 1000, 1)} кПа</span></div>`;
  else if (id === 'vessels') el.innerHTML = `<div class="k">${VPAIRS[S.pair].n}</div><div class="v ${S.oilOK ? 'ok' : ''}">${S.hA} / ${fmt(m.hB, 1)} см</div><div class="lr"><span>${LIQ[m.P.a].n.toLowerCase()}</span><span>${S.hA} см</span></div><div class="lr"><span>${LIQ[m.P.b].n.toLowerCase()}</span><span>${fmt(m.hB, 1)} см</span></div>`;
  else if (id === 'press') el.innerHTML = `<div class="k">Манометр</div><div class="v ${m.ok ? 'ok' : ''}">${big(m.p / 1000)} кПа</div><div class="lr"><span>F₂</span><span class="${m.ok ? 'ok' : 'bad'}">${big(m.F2)} Н</span></div><div class="lr"><span>подъём</span><span>${fmt(S.lift, 1)} мм</span></div>`;
  else if (id === 'arch') el.innerHTML = `<div class="k">Динамометр</div><div class="v">${fmt(m.F, 2)} Н</div><div class="lr"><span>P</span><span>${fmt(m.P, 2)} Н</span></div><div class="lr"><span>FA</span><span class="${m.f === 1 ? 'ok' : ''}">${fmt(m.Fa, 2)} Н</span></div>`;
  else el.innerHTML = `<div class="k">${FB[S.fb].n}</div><div class="v">${big(FB[S.fb].r)} кг/м³</div><div class="lr"><span>жидк.</span><span>${big(LIQ[S.fl].r)}</span></div><div class="lr"><span>итог</span><span class="${S.fmode === 'rest' ? 'ok' : ''}">${S.fmode === 'rest' ? { float: 'плавает', sink: 'утонул', hover: 'завис' }[m.out] : '…'}</span></div>`;
}

function update() {
  latch();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы разбираетесь в давлении!'), 1700);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  S.sv = sinkOf(pSolid());
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'solid') now = `Турист 60 кг с рюкзаком ${S.load} кг (вес ${big(m.F)} Н, g ≈ 10 Н/кг) стоит на рыхлом снегу, который выдерживает 4 кПа. Обувь: ${SHOES[S.shoe].n.toLowerCase()} (${nf(SHOES[S.shoe].s * 10000)} см² на одну ногу), стоит ${S.one ? 'на одной ноге' : 'на двух ногах'}. Площадь опоры ${fmt(m.Sa, 2)} м², давление ${fmt(m.p / 1000, 1)} кПа — снег ${m.sink ? 'не держит, турист проваливается' : 'держит'}. Подзадачи: не провалиться с рюкзаком 20 кг — ${S.safeOK ? 'сделано' : 'нет'}; встать в кроссовках на одну ногу — ${S.oneOK ? 'сделано' : 'нет'}. Какую обувь выбрать, не называй — пусть ученик посчитает нужную площадь F / 4000.`;
  if (id === 'liquid') now = `Бак глубиной 3 м, жидкость: ${LIQ[S.liq].n.toLowerCase()} (ρ = ${LIQ[S.liq].r} кг/м³). Датчик на глубине ${fmt(m.h, 1)} м, плёнка смотрит ${['вниз', 'вбок', 'вверх'][S.orient]}. Манометр: ${fmt(m.p / 1000, 1)} кПа (только давление жидкости, g ≈ 10 Н/кг). Подзадачи: 20 кПа в воде — ${S.w20 ? 'найдено' : 'нет'}; повернуть датчик там — ${S.turned ? 'сделано' : 'нет'}; 20 кПа в керосине — ${S.k25 ? 'найдено' : 'нет'}. Глубины не называй — наводи через h = p / (ρg).`;
  if (id === 'atm') now = `Горный склон от уровня моря до 7010 м (Алматы, Медеу, Шымбулак, пик Талгар, Хан-Тенгри) и трубка Торричелли. Альпинист на высоте ${big(S.H)} м, ртутный столбик ${fmt(m.mm, 0)} мм (${fmt(m.pa / 1000, 1)} кПа). Модель: барометрическая формула p = 760·e^(−H/8400) мм рт. ст. Подзадачи: найти высоту, где 600 мм, — ${S.reached ? 'сделано' : 'нет'}; перевести 600 мм рт. ст. в кПа — ${S.conv ? 'сделано' : 'нет'}. Высоту и ответ в кПа не называй — наводи (сколько Па в 1 мм рт. ст., как перевести Па в кПа).`;
  if (id === 'vessels') {
    if (S.vmode === 'one') now = `Опыт 1: широкий сосуд, узкая трубка и правый сосуд формы «${VSH[S.vshape].n}» соединены снизу трубкой, налита вода на высоту ${S.lev} см — во всех сосудах уровень одинаковый, давление у дна ${fmt(m.p / 1000, 1)} кПа. Формы, которые уже сравнили: ${Object.keys(S.vSeen).map(k => VSH[k].n).join(', ') || 'нет'} (нужно 3) — ${S.shapesOK ? 'сделано' : 'нет'}.`;
    else now = `Опыт 2: U-трубка, пара «${VPAIRS[S.pair].n}». Внизу ${LIQ[m.P.b].n.toLowerCase()} (ρ = ${m.rb} кг/м³), в левое колено долито ${S.hA} см жидкости «${LIQ[m.P.a].n}» (ρ = ${m.ra} кг/м³); над уровнем границы в правом колене столб ${fmt(m.hB, 1)} см. Подзадача: масло уравновешивает 18 см воды — ${S.oilOK ? 'сделано' : 'нет'}.`;
    now += ' Ответ (20 см масла) не называй — наводи через ρ₁h₁ = ρ₂h₂.';
  }
  if (id === 'press') now = `Гидравлический пресс: малый поршень S₁ = ${S.s1} см², большой S₂ = ${S.s2} см², на малый давят с силой ${S.f1} Н. Давление масла ${big(m.p / 1000)} кПа, сила на большой поршень F₂ = ${big(m.F2)} Н, на нём автомобиль 1000 кг (вес 10 000 Н, g ≈ 10 Н/кг) — ${m.ok ? 'поднимается' : 'не поднять'}. За ход малого поршня 10 см большой поднимается на ${fmt(m.d2, 1)} мм; уже поднят на ${fmt(S.lift, 1)} мм за ${S.strokes} нажатий. Подзадачи: наименьшая сила при 5 и 500 см² — ${S.lift100 ? 'сделано' : 'нет'}; поднять силой 50 Н, сменив поршни, — ${S.lift50 ? 'сделано' : 'нет'}. Ответы (100 Н, нужные поршни) не называй — наводи через F₂/F₁ = S₂/S₁.`;
  if (id === 'arch') now = `Динамометр с цилиндром 100 см³ (${ABODY[S.body].n.toLowerCase()}, вес в воздухе ${fmt(m.P, 2)} Н) над отливным сосудом с жидкостью «${LIQ[S.liq2].n}» (ρ = ${LIQ[S.liq2].r} кг/м³). Погружено ${Math.round(m.f * 100)}%, динамометр показывает ${fmt(m.F, 2)} Н, сила Архимеда ${fmt(m.Fa, 2)} Н, в стаканчик вылилось ${nf(m.Vs)} см³. Записи в воде: алюминий ${S.recAl != null ? fmt(S.recAl, 1) + ' Н' : 'нет'}, сталь ${S.recSt != null ? fmt(S.recSt, 1) + ' Н' : 'нет'}.`;
  if (id === 'float') now = `Сосуд с жидкостью «${LIQ[S.fl].n}» (ρ = ${LIQ[S.fl].r} кг/м³), кубик 10 см из материала «${FB[S.fb].n}» (ρ = ${FB[S.fb].r} кг/м³). Состояние кубика: ${S.fmode === 'held' ? 'держим над сосудом' : S.fmode === 'free' ? 'движется' : OUT[m.out]}. Уже видели: ${Object.keys(S.seen).map(k => { const [b, l] = k.split('|'); return `${FB[b].n} в «${LIQ[l].n}» — ${OUT[S.seen[k]]}`; }).join('; ') || 'ничего'}. Подзадачи: лёд утонул — ${m.iceSink ? 'да' : 'нет'}, сталь всплыла — ${m.steelFloat ? 'да' : 'нет'}, оргстекло зависло — ${m.plexHover ? 'да' : 'нет'}. Нужные жидкости не называй — наводи сравнением плотностей.`;
  return [
    `Раздел: физика, 7 класс, тема «Давление». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { solid: 'Почему острый нож режет лучше тупого?', liquid: 'Почему плотину внизу делают толще?', vessels: 'Почему носик чайника делают на уровне его верха?', press: 'Почему пресс не даёт выигрыша в работе?', atm: 'Почему в горах уши «закладывает»?', arch: 'Почему сила Архимеда не зависит от материала?', float: 'Почему железный корабль не тонет?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-pressure.js): the same set-up as real lab equipment
window.LUCH_REAL = () => {
  const id = LID(), r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100, M = { module: 'pressure' };
  if (id === 'solid') {
    const p = pSolid();
    return { ...M, scene: 'pressure-solid', help: 'Ботинок — сменить обувь, рюкзак — +5 кг, турист — на одну ногу',
      shoe: S.shoe, one: S.one, load: S.load, F: (L().body + S.load) * g, Sa: r2(SHOES[S.shoe].s * (S.one ? 1 : 2)), p: r1(p / 1000),
      sink: p > L().pMax, sv: r1(sinkOf(p)), shoeName: SHOES[S.shoe].n };
  }
  if (id === 'liquid') return { ...M, scene: 'pressure-liquid', help: 'Ручка штатива — глубже, датчик — повернуть, бак — сменить жидкость',
    h: S.hd / 10, liq: S.liq, liqName: LIQ[S.liq].n, rho: LIQ[S.liq].r, col: LIQ[S.liq].c, or: S.orient, p: r1(pLiq() / 1000) };
  if (id === 'atm') {
    const mm = mmHg(S.H); let pl = -1; PLACES.forEach((P, i) => { if (P.H === S.H) pl = i; });
    return { ...M, scene: 'pressure-atm', help: 'Гора — следующее место, альпинист — выше на 100 м',
      H: S.H, mm: Math.round(mm), kpa: r1(mm * PA_MM / 1000), place: pl >= 0 ? PLACES[pl].n : '', ok: S.reached };
  }
  if (id === 'vessels') {
    const u = uState(), A = LIQ[u.P.a], B = LIQ[u.P.b];
    return { ...M, scene: 'pressure-vessels', help: S.vmode === 'one' ? 'Правый сосуд — сменить форму, кувшин — долить, табличка — U-трубка' : 'Левое колено — долить 5 см, табличка жидкостей — сменить, другая — к сосудам',
      mode: S.vmode, lev: S.lev, shape: S.vshape, shapeName: VSH[S.vshape].n, pair: S.pair, pairName: VPAIRS[S.pair].n, hA: S.hA, hB: r1(u.hB), li: r2(u.li), rr: r2(u.rr),
      aName: A.n, aRho: A.r, aCol: A.c, bName: B.n, bRho: B.r, bCol: B.c, ok: S.vmode === 'one' ? S.shapesOK : S.oilOK };
  }
  if (id === 'press') {
    const P = pressF();
    return { ...M, scene: 'pressure-press', help: 'Ручка — нажать, таблички S₁/S₂ — сменить поршни, F₁ — сила, автомобиль — опустить',
      s1: S.s1, s2: S.s2, f1: S.f1, F2: Math.round(P.F2), W: P.W, p: Math.round(P.p / 1000), ok: P.ok, d2: r2(P.d2), lift: r1(S.lift) };
  }
  if (id === 'arch') {
    const A = archF(), lq = LIQ[S.liq2];
    return { ...M, scene: 'pressure-arch', help: 'Динамометр — опустить, цилиндр на столе — сменить, сосуд — жидкость',
      tr: S.tr, f: r2(fSub()), body: S.body, bodyName: ABODY[S.body].n, P: r2(A.P), Fa: r2(A.Fa), F: r2(A.F), Vs: Math.round(A.Vs),
      liq: S.liq2, liqName: lq.n, rho: lq.r, col: lq.c };
  }
  if (id === 'float') {
    const o = outcomeOf(S.fb, S.fl);
    return { ...M, scene: 'pressure-float', help: 'Кубик — бросить/вынуть, кубики в лотке — выбрать, сосуд — жидкость',
      fb: S.fb, fl: S.fl, bodyName: FB[S.fb].n, bodyRho: FB[S.fb].r, bodyCol: FB[S.fb].c, liqName: LIQ[S.fl].n, rho: LIQ[S.fl].r, col: LIQ[S.fl].c,
      mode: S.fmode, out: o, k: S.fmode === 'rest' ? r2(subFrac()) : null,
      bodies: FBK.map(k => ({ k, n: FB[k].n, c: FB[k].c })) };
  }
  return null;
};
// the cube falls frame by frame in the experiment: the 3D scene reads its height here (SVG units) and the geometry
window.LUCH_REAL.live = () => LID() === 'press' ? { ph: S.ph, lift: S.liftV } : ({ fy: S.fy, ys: FT.ys, yb: FT.yb, A: FT.A, top: FT.top, k: subFrac(), mode: S.fmode });
window.LUCH_REAL.click = k => {
  const id = LID(), nextOf = (arr, cur) => arr[(arr.indexOf(cur) + 1) % arr.length];
  if (id === 'solid') {
    if (k === 'shoe') return act('shoe-' + nextOf(Object.keys(SHOES), S.shoe));
    if (k === 'pack') return setLoad(S.load >= 30 ? 0 : S.load + 5);
    if (k === 'one') return act('one');
  }
  if (id === 'liquid') {
    if (k === 'hcycle') return setDepth(S.hd >= 30 ? 0 : Math.floor(S.hd / 5) * 5 + 5);
    if (k === 'or') return act('or');
    if (k === 'liq') return act('liq-' + nextOf(LIQ2, S.liq));
  }
  if (id === 'atm') {
    if (k === 'plnext') { const i = PLACES.findIndex(P => P.H > S.H); return act('pl-' + (i < 0 ? 0 : i)); }
    if (k === 'up') return act(S.H >= 7100 ? 'pl-0' : 'alt+100');
  }
  if (id === 'vessels') {
    if (k === 'shape') { if (S.vmode !== 'one') act('vm-one'); return act('vsnext'); }
    if (k === 'pour') return setLev(S.lev >= 28 ? 4 : S.lev + 4);
    if (k === 'mode') return act('vm-' + (S.vmode === 'one' ? 'two' : 'one'));
    if (k === 'ha') return setHA(S.hA >= 30 ? 0 : Math.floor(S.hA / 5) * 5 + 5);
    if (k === 'pair') return act('vp-' + nextOf(VPK, S.pair));
  }
  if (id === 'press') {
    if (k === 'push') return act('push');
    if (k === 's1') return act('s1next');
    if (k === 's2') return act('s2next');
    if (k === 'f1') { const st = [10, 20, 50, 100, 200, 500, 1000], n = st.find(v => v > S.f1); return setF1(n === undefined ? 10 : n); }
    if (k === 'release') return act('release');
  }
  if (id === 'arch') {
    if (k === 'lower') { const st = [0, 50, 62, 75, 87, 100], n = st.find(v => v > S.tr); return setTr(n === undefined ? 0 : n); }
    if (k === 'swap') return act('body-' + (S.body === 'al' ? 'st' : 'al'));
    if (k === 'liq') return act('liq2-' + nextOf(LIQ4, S.liq2));
  }
  if (id === 'float') {
    if (k === 'cube') return act(S.fmode === 'held' ? 'drop' : 'lift');
    if (k === 'liq') return act('flnext');
    if (k.startsWith('fb-')) return act(k);
  }
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
