<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 8–9 класс: обратная пропорциональность, функции y = √x и y = x³, свойства функций, обратная функция.">
<title>Функции и их свойства</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono);white-space:pre}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.formula{font:500 17px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: графики функций — гипербола, корень, куб, сдвигаемые графики и обратные функции. Точки, ползунки и графики можно перетаскивать, карточки — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const sd = (v, d = 3) => { if (Math.abs(v - Math.round(v)) < 1e-9) return ns(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && s !== '0' ? '−' : '') + s; };
const par = (v, d = 3) => v < 0 ? '(' + sd(v, d) + ')' : sd(v, d);
const snap = (v, st) => Math.round(v / st) * st;
const fx = v => Math.abs(v - Math.round(v)) < 1e-9 ? ns(Math.round(v)) : sd(v, 2);
function nice(v) {
  if (!isFinite(v)) return { s: '—', ex: false };
  if (Math.abs(v - Math.round(v)) < 1e-9) return { s: sd(Math.round(v)), ex: true };
  return { s: sd(v, 3), ex: Math.abs(v * 1000 - Math.round(v * 1000)) < 1e-6 };
}
const eqv = v => { const n = nice(v); return (n.ex ? '= ' : '≈ ') + n.s; };
const kx = k => k < 0 ? '−' + Math.abs(k) + '/x' : k + '/x';

// ---------- lesson data ----------
// lesson 1: points the hyperbola y = k/x must pass through
const G1 = [
  { x: 2, y: 3, k: 6, lbl: 'A(2; 3)', msg: 'k = 6: 2 · 3 = 6 — гипербола прошла через A.' },
  { x: -1, y: 4, k: -4, lbl: 'B(−1; 4)', msg: 'k = −4: (−1) · 4 = −4. При k < 0 ветви во II и IV четвертях.' },
  { x: 4, y: 0.5, k: 2, lbl: 'C(4; 0,5)', msg: 'k = 2: 4 · 0,5 = 2 — гипербола прошла через C.' },
  { x: 4, y: 2, k: 8, lbl: 'D(4; 2)', msg: 'k = 8 — это путь: t = 8/v. При 4 км/ч 8 км проходятся за 2 ч, при 8 км/ч — уже за 1 ч.' },
];
// lesson 2: sqrt and cube
const F2 = { sqrt: x => x >= 0 ? Math.sqrt(x) : NaN, cube: x => x ** 3 };
const T2 = [
  { f: 'sqrt', x: 4, y: 2, lbl: '√x = 2', msg: '√4 = 2, ведь 2² = 4.' },
  { f: 'cube', x: -2, y: -8, lbl: 'x³ = −8', msg: '(−2)³ = −8: у куба отрицательный x даёт отрицательный y.' },
  { f: 'sqrt', x: 2.25, y: 1.5, lbl: '√x = 1,5', msg: '√2,25 = 1,5, ведь 1,5² = 2,25.' },
  { mir: true, lbl: 'зеркало', msg: 'Парабола y = x² при x ≥ 0 и график y = √x симметричны относительно прямой y = x.' },
];
// lesson 3: shifted graphs y = g(x − a) + b
const FAM = {
  sq: { g: t => t * t, name: 'парабола' },
  ab: { g: t => Math.abs(t), name: 'модуль' },
  cu: { g: t => t * t * t / 4 - 3 * t, name: 'кубическая' },
};
const G3 = [
  { fam: 'sq', a: 3, b: -4, a0: -2, b0: 1, chip: 'нули 1 и 5', txt: 'нули функции — x = 1 и x = 5', msg: 'y = (x − 3)² − 4: вершина посередине между нулями, при x = 1 и x = 5 значение 0.' },
  { fam: 'ab', a: -2, b: 2, a0: 1, b0: -1, chip: 'min 2 при x = −2', txt: 'убывает на (−∞; −2], наименьшее значение 2', msg: 'y = |x + 2| + 2: левее x = −2 график идёт вниз, правее — вверх, ниже 2 не опускается.' },
  { fam: 'cu', a: 0, b: 0, a0: 1, b0: -1, chip: 'нечётная', txt: 'функция нечётная: f(−x) = −f(x)', msg: 'Центр симметрии попал в начало координат: (−x)³/4 − 3(−x) = −(x³/4 − 3x).' },
  { fam: 'cu', a: 2, b: 1, a0: -1, b0: -2, chip: 'max 5 при x = 0', txt: 'точка максимума x = 0, значение в ней 5', msg: 'Максимум на 2 левее центра симметрии и на 4 выше: центр (2; 1) → максимум (0; 5).' },
];
function shiftS(a) { return a === 0 ? 'x' : a > 0 ? `(x − ${a})` : `(x + ${-a})`; }
function bS(b) { return b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${-b}`; }
function formula3(fam, a, b) {
  if (fam === 'sq') return 'y = ' + shiftS(a) + '²' + bS(b);
  if (fam === 'ab') return 'y = |' + (a === 0 ? 'x' : shiftS(a).slice(1, -1)) + '|' + bS(b);
  const t = shiftS(a);
  return 'y = ' + t + '³/4 − 3' + (a === 0 ? 'x' : t) + bS(b);
}
function zeros3(fam, a, b) {

  else if (fam === 'ab') { if (b < 0) z = [a + b, a - b]; else if (b === 0) z = [a]; }
  else {
    const g = t => t * t * t / 4 - 3 * t + b;
    let prev = g(-10);
    for (let i = 1; i <= 2000; i++) {
      const t1 = -10 + i * 0.01, v = g(t1), t0 = t1 - 0.01;
      if (v === 0) z.push(t1);
      else if (prev !== 0 && prev * v < 0) { let lo = t0, hi = t1; for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; if (g(lo) * g(mid) <= 0) hi = mid; else lo = mid; } z.push((lo + hi) / 2); }
      prev = v;
    }
    [-2, 2].forEach(t => { if (Math.abs(g(t)) < 1e-9) z.push(t); });
    z = z.map(t => Math.abs(t - Math.round(t)) < 1e-7 ? Math.round(t) : t).sort((p, q) => p - q).filter((t, i, arr) => !i || Math.abs(t - arr[i - 1]) > 1e-6).map(t => t + a);

}

function model() {

  if (id === 'rootcube') { const f = S.f2, x = f === 'sqrt' ? S.xs2 : S.xc2; return { kind: id, f, x, y: F2[f](x), mir: S.mir2, neg: S.neg2, got: S.got2, nGot: S.got2.filter(Boolean).length }; }

    return { kind: id, gi: S.gi3, G, fam: G.fam, a, b, pr: props3(G.fam, a, b), hit: a === G.a && b === G.b, nSolved: G3.filter((_, i) => S.solved3[i]).length, solved: S.solved3 };

  if (!sameP) h += T(qx + 9, qy + 14, 10.5, 'P′', m.invOK ? GREEN : RED, 'start', 'font-weight="600" pointer-events="none" ' + HALO);
  // right panel: function cards and readout
  const RX = 268, RW = 234;
  M4.forEach((mm, i) => { const ok = (i === 0 && m.got[0]) || (i === 1 && m.got[1]) || (i === 2 && m.got[2]); h += chip(RX, 86 + i * 32, RW, (ok ? '✓ ' : '') + mm.name, m.fi === i, 'm4-' + i, ok ? GREEN : null, 12, 27); });
  if (M.id === 'sq') h += chip(RX, 184, RW, m.res ? '✓ только x ≥ 0' : 'ограничить: x ≥ 0', m.res, 'res4', m.res ? GREEN : ORANGE, 12, 27);
  else h += T(RX + RW / 2, 188, 10.5, 'функция монотонна — обратная есть', MUTED, 'middle');
  const u = M.id === 'temp' ? '°' : '';

    [`f:  ${M.name}${M.id === 'sq' && m.res ? ', x ≥ 0' : ''}`, BLUE],
    [m.invOK ? `f⁻¹:  ${M.inv}` : 'f⁻¹:  нет — отражение не функция', m.invOK ? GREEN : RED],
    [`P(${sd(m.x, 2)}${u}; ${sd(m.y, 2)}${u}) → P′(${sd(m.y, 2)}${u}; ${sd(m.x, 2)}${u})`, ORANGE],
    [M.id === 'sq' && !m.res ? (m.x ? `x² = ${sd(m.y, 2)} при x = ±${sd(Math.abs(m.x), 2)}` : 'x² = 0 только при x = 0') : M.id === 'temp' ? (sameP ? `${sd(m.x)} °C = ${sd(m.y)} °F ✓` : `${sd(m.x)} °C = ${sd(m.y, 1)} °F`) : 'каждое y — ровно один раз', M.id === 'sq' && !m.res && m.x ? RED : sameP && M.id === 'temp' ? GREEN : MUTED],
  ];
  info.forEach(([s, c], i) => { h += T(RX, 222 + i * 20, 11, s, c, 'start', 'font-weight="500"'); });
  // quiz
  h += T(260, 318, 11.5, Q4.q, FG, 'middle', 'font-weight="500"');
  Q4.opts.forEach((o, j) => { const on = m.pick === j; h += chip(24 + j * 160, 342, 152, o, on, 'q4-' + j, on ? (j === Q4.ok ? GREEN : RED) : null, 12, 26); });
  const qm = m.pick < 0 ? 'подумайте: какая из них монотонна на всей оси?' : m.pick === Q4.ok ? 'верно: x³ возрастает на всей оси, обратная — ∛x' : 'нет: эта функция принимает одно y при x и −x';
  h += T(260, 375, 11, qm, m.pick < 0 ? MUTED : m.pick === Q4.ok ? GREEN : RED, 'middle', 'font-weight="500"');
  h += T(260, 398, 11, `цели: ${I4.map((t, i) => (m.got[i] ? '✓ ' : '○ ') + t.lbl).join('   ')}`, m.nGot === I4.length ? GREEN : MUTED);
  return h;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  if (id === 'hyper') h += hyperSVG(m);
  else if (id === 'rootcube') h += rcSVG(m);
  else if (id === 'props') h += propsSVG(m);
  else h += invSVG(m);

    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;

// Content occupies x 18..502, y 62..405 (SVG units) and is pinned to the bottom of the scene.
// The task card (top-left) and meter (top-right) float over the stage: shrink the drawing until
// it sits either below both cards or between them.
let dirty = true;
const taskEl = document.querySelector('#stage .task'), meterEl = $('#meter');
let fitLater = false;
function fit() {
  if (typeof drag !== "undefined" && drag) { fitLater = true; return; } // do not move the scene under the pointer mid-drag
  fitLater = false;
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const CB = { x: 14, y: 58, w: 492, h: 352 };
  const tr = taskEl.getBoundingClientRect(), mr = meterEl.getBoundingClientRect();
  const tB = tr.height ? tr.bottom - rc.top + 6 : 0, tR = tr.width ? tr.right - rc.left + 6 : 0;
  const mB = mr.height ? mr.bottom - rc.top + 6 : 0, mL = mr.width ? mr.left - rc.left - 6 : w;
  // free regions [x, y, w, h] in scene pixels: below both cards, or right of the task card and below the meter
  const regs = [[0, Math.max(tB, mB), w, hh - Math.max(tB, mB)], [tR, mB, w - tR, hh - mB], [tR, 0, mL - tR, hh]];
  let best = null;
  regs.forEach(r => { if (r[2] <= 0 || r[3] <= 0) return; const s = Math.min(r[2] / CB.w, r[3] / CB.h, 1.45); if (!best || s > best.s) best = { s, r }; });
  const s = best.s, r = best.r;
  const left = r[0] + (r[2] - CB.w * s) / 2;
  const vw = w / s, vh = hh / s, vx = CB.x - left / s, vy = CB.y + CB.h - (r[1] + r[3]) / s;
  scene.setAttribute('viewBox', `${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
const ro = new ResizeObserver(fit);
ro.observe(scene); ro.observe(taskEl); ro.observe(meterEl);

// ---------- actions ----------
const toastOnce = (arr, i, msg) => { if (!arr[i]) { arr[i] = true; toast(msg); } };
function setK1(v) {
  v = clamp(Math.round(v), -8, 8); if (S.k1 === v) return; S.k1 = v;
  const g = G1.findIndex(G => G.k === v); if (g >= 0) toastOnce(S.got1, g, G1[g].msg);
  update();
}
function setPx1(x, dir) {
  x = clamp(snap(x, 0.5), -6, 6);
  if (x === 0) x = (dir || Math.sign(S.px1) || 1) * 0.5;
  if (S.px1 === x) return; S.px1 = x; update();
}
function sweep2() {
  T2.forEach((t, i) => {
    if (t.mir) { if (S.mir2 && S.f2 === 'sqrt') toastOnce(S.got2, i, t.msg); return; }
    const x = t.f === 'sqrt' ? S.xs2 : S.xc2;
    if (t.f === S.f2 && Math.abs(x - t.x) < 1e-9) toastOnce(S.got2, i, t.msg);
  });
}
function setX2(x) {
  if (S.f2 === 'sqrt') { S.neg2 = x < -0.12; x = +clamp(snap(x, 0.25), 0, 10).toFixed(2); if (S.xs2 === x) { dirty = true; return update(); } S.xs2 = x; }
  else { x = +clamp(snap(x, 0.1), -2.1, 2.1).toFixed(1); if (S.xc2 === x) return; S.xc2 = x; }
  sweep2(); update();
}
function setF2(f) { S.f2 = f; S.neg2 = false; sweep2(); renderTools(); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function toggleMir() { if (S.f2 !== 'sqrt') { S.f2 = 'sqrt'; S.mir2 = true; } else S.mir2 = !S.mir2; sweep2(); renderTools(); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function setAB3(a, b) {
  a = clamp(Math.round(a), -4, 4); b = clamp(Math.round(b), -5, 5);
  const cur = S.ab3[S.gi3]; if (cur.a === a && cur.b === b) return;
  cur.a = a; cur.b = b;
  const G = G3[S.gi3];
  if (a === G.a && b === G.b && !S.solved3[S.gi3]) { S.solved3[S.gi3] = true; toast(G.msg); }
  update();
}
function setGi3(i) { S.gi3 = clamp(i, 0, G3.length - 1); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function sweep4() {
  const x = S.px4[S.fi4];
  if (S.fi4 === 0 && x === 2) toastOnce(S.got4, 0, I4[0].msg);
  if (S.fi4 === 1 && S.res4 && x === 2) toastOnce(S.got4, 1, I4[1].msg);
  if (S.fi4 === 2 && x === -40) toastOnce(S.got4, 2, I4[2].msg);
}
function setX4(x) {
  const M = M4[S.fi4], lo = M.id === 'sq' && S.res4 ? 0 : M.xr[0];
  x = +clamp(snap(x, M.step), lo, M.xr[1]).toFixed(2);
  if (S.px4[S.fi4] === x) return; S.px4[S.fi4] = x; sweep4(); update();
}
function setFi4(i) { S.fi4 = clamp(i, 0, M4.length - 1); sweep4(); renderTools(); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); } }
function toggleRes() {
  if (S.fi4 !== 1) S.fi4 = 1;
  S.res4 = !S.res4;
  if (S.res4 && S.px4[1] < 0) S.px4[1] = -S.px4[1];
  if (S.res4) toast('Теперь парабола только возрастает — у неё есть обратная функция y = √x.');
  sweep4(); renderTools(); update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); }
}
function pickQ4(j) {
  S.pick4 = j;
  if (j === Q4.ok) toastOnce(S.got4, 3, Q4.why); else toast(Q4.bad);
  update();
}
function pick(p) {
  if (p.startsWith('f2-')) setF2(p.slice(3));
  else if (p === 'mir2') toggleMir();
  else if (p.startsWith('g3-')) setGi3(+p.slice(3));
  else if (p.startsWith('m4-')) setFi4(+p.slice(3));
  else if (p === 'res4') toggleRes();
  else if (p.startsWith('q4-')) pickQ4(+p.slice(3));
}

// ---------- pointer ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(d, p) {
  if (d === 'p1') setPx1(B1.iX(p.x), B1.iX(p.x) < 0 ? -1 : 1);
  else if (d === 'ks') setK1(-8 + (p.x - KS.x0) / (KS.x1 - KS.x0) * 16);
  else if (d === 'p2') setX2(B2(S.f2).iX(p.x));
  else if (d === 'g3') setAB3(B3.iX(p.x) + drag3.dx, B3.iY(p.y) + drag3.dy);
  else if (d === 'p4') setX4(B4().iX(p.x));
}
scene.addEventListener('pointerdown', e => {
  const pk = e.target.closest('[data-pick]'); if (pk) { e.preventDefault(); pick(pk.dataset.pick); return; }
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  drag = el.dataset.drag;
  const p = toSvg(e);
  if (drag === 'g3') { const cur = S.ab3[S.gi3], onHandle = el.tagName.toLowerCase() === 'g'; drag3 = onHandle ? { dx: cur.a - B3.iX(p.x), dy: cur.b - B3.iY(p.y) } : { dx: 0, dy: 0 }; }
  dragTo(drag, p);
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
});
scene.addEventListener('pointermove', e => { if (drag) dragTo(drag, toSvg(e)); });
const endDrag = () => { drag = null; scene.classList.remove('grabbing'); if (fitLater) fit(); if (S.neg2) { S.neg2 = false; dirty = true; } };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {

}

  const sep = '<span class="sep"></span>';

    props: B('g-', '‹ цель') + B('g+', 'цель ›') + sep + B('L', '←') + B('R', '→') + B('D', '↓') + B('U', '↑'),
    inverse: B('m-', '‹ f') + B('m+', 'f ›') + sep + B('x-', 'x −') + B('x+', 'x +') + sep + B('res', 'x ≥ 0', S.res4),
  }[id];

function act(a) {
  const id = LID();
  if (a === 'k-' || a === 'k+') return setK1(S.k1 + (a === 'k-' ? -1 : 1));
  if (a === 'x-' || a === 'x+') {
    const d = a === 'x-' ? -1 : 1;
    if (id === 'hyper') return setPx1(S.px1 + d * 0.5, d);
    if (id === 'rootcube') { S.neg2 = S.f2 === 'sqrt' && S.xs2 === 0 && d < 0; return setX2(S.f2 === 'sqrt' ? S.xs2 + d * 0.25 : S.xc2 + d * 0.1); }
    return setX4(S.px4[S.fi4] + d * M4[S.fi4].step);
  }
  if (a === 'fs') return setF2('sqrt');
  if (a === 'fc') return setF2('cube');
  if (a === 'mir') return toggleMir();
  if (a === 'g-' || a === 'g+') return setGi3((S.gi3 + (a === 'g-' ? G3.length - 1 : 1)) % G3.length);
  if ('LRDU'.includes(a) && a.length === 1) { const c = S.ab3[S.gi3]; return setAB3(c.a + (a === 'L' ? -1 : a === 'R' ? 1 : 0), c.b + (a === 'D' ? -1 : a === 'U' ? 1 : 0)); }

  if (id === 'props') h = `<h2>Свойства функции</h2><div class="chips">${G3.map((g, i) => pbtn('g3-' + i, g.chip, S.gi3 === i)).join('')}</div>` + reads('a', 'b', 'чётность') +
    slider('inA3', 'сдвиг вправо a', -4, 4, 1, S.ab3[S.gi3].a) + slider('inB3', 'сдвиг вверх b', -5, 5, 1, S.ab3[S.gi3].b);
  if (id === 'inverse') {
    const M = M4[S.fi4];
    h = `<h2>Функция и обратная</h2><div class="chips">${M4.map((mm, i) => pbtn('m4-' + i, mm.name, S.fi4 === i)).join('')}${M.id === 'sq' ? pbtn('res4', 'x ≥ 0', S.res4) : ''}</div>` + reads(M.ax[0], M.ax[1], 'обратная') +
      slider('inX4', 'точка P: ' + M.ax[0], M.id === 'sq' && S.res4 ? 0 : M.xr[0], M.xr[1], M.step, S.px4[S.fi4]) + `<h3>${Q4.q}</h3><div class="chips">${Q4.opts.map((o, j) => pbtn('q4-' + j, o, S.pick4 === j)).join('')}</div>`;
  }
  el.innerHTML = h + '<div id="sDiag"></div>';
  const on = (sel, ev, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener(ev, fn); };
  on('#inK', 'input', e => setK1(+e.target.value));
  on('#inX1', 'input', e => setPx1(+e.target.value));
  on('#inX2', 'input', e => setX2(+e.target.value));
  on('#inA3', 'input', e => setAB3(+e.target.value, S.ab3[S.gi3].b));
  on('#inB3', 'input', e => setAB3(S.ab3[S.gi3].a, +e.target.value));
  on('#inX4', 'input', e => setX4(+e.target.value));
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pick(b.dataset.p); updateScheme(model()); });
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  if (!el.querySelector('#sDiag')) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (pre, cur) => el.querySelectorAll(`[data-p^="${pre}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.p === pre + cur));
  if (m.kind === 'hyper') { set('#r1', ns(m.k)); set('#r2', sd(m.x)); set('#r3', m.k ? sd(m.y, 3) : '0'); set('#inKO', ns(m.k)); set('#inX1O', sd(m.x)); val('#inK', m.k); val('#inX1', m.x); }
  else if (m.kind === 'rootcube') { set('#r1', sd(m.x, 2)); set('#r2', sd(m.y, 3)); set('#r3', m.nGot + '/' + T2.length); set('#inX2O', sd(m.x, 2)); val('#inX2', m.x); }
  else if (m.kind === 'props') { set('#r1', ns(m.a)); set('#r2', ns(m.b)); set('#r3', m.pr.parity === 'even' ? 'чётная' : m.pr.parity === 'odd' ? 'нечётная' : 'нет'); set('#inA3O', ns(m.a)); set('#inB3O', ns(m.b)); val('#inA3', m.a); val('#inB3', m.b); press('g3-', m.gi); }
  else { set('#r1', sd(m.x, 2)); set('#r2', sd(m.y, 2)); set('#r3', m.invOK ? 'есть' : 'нет'); set('#inX4O', sd(m.x, 2)); val('#inX4', m.x); press('m4-', m.fi); press('q4-', m.pick); el.querySelectorAll('[data-p="res4"]').forEach(b => b.setAttribute('aria-pressed', m.res)); }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'hyper') {
    const k = m.k;
    let r = `<h2>${k ? 'y = ' + kx(k) : 'y = 0'}</h2><div class="formula" style="font-size:15px">y = k/x  ⇔  x · y = k,  x ≠ 0</div><h3>Таблица значений</h3><div class="steps">`;
    if (!k) r += step('k = 0', 'y = 0 при любом x — это прямая, а не гипербола', 'sum');
    else { [1, 2, 4, -1, -2].forEach(x => { r += step('x = ' + ns(x), `y = ${ns(k)}/${par(x)} = ${sd(k / x, 3)}`); }); r += step('x = ' + sd(m.x), `${sd(m.x)} · ${par(m.y)} = ${ns(k)}`, 'sum'); }
    r += `</div><h3>Путь 120 км: t = 120 / v</h3><div class="steps">` +
      [30, 40, 60, 120].map(v => step(`v = ${v} км/ч`, `t = ${120 / v} ч`)).join('') + step('v · t', '120 км при любой скорости', 'sum') + `</div>`;
    r += `<h3>Свойства</h3><div class="steps">` + step('D(f)', 'x ≠ 0') + step('E(f)', 'y ≠ 0') + step('асимптоты', 'x = 0 и y = 0') +
      step('k > 0', 'I и III четверти, убывает на (−∞; 0) и на (0; +∞)') + step('k < 0', 'II и IV четверти, возрастает на каждом промежутке', 'sum') + `</div>`;
    return r + `<p class="note" style="margin-top:10px">«Убывает на каждом промежутке» — не то же самое, что «убывает везде»: при k > 0 значение в x = −1 меньше, чем в x = 1.</p>`;
  }
  if (id === 'rootcube') {
    if (m.f === 'sqrt') {
      let r = `<h2>y = √x</h2><div class="formula" style="font-size:15px">√a = b  ⇔  b² = a,  b ≥ 0</div><h3>Таблица значений</h3><div class="steps">`;
      [0, 1, 4, 9].forEach(x => { r += step('x = ' + x, '√' + x + ' = ' + Math.sqrt(x)); });
      r += step('x = ' + sd(m.x, 2), '√' + sd(m.x, 2) + ' ' + eqv(m.y), 'sum') + `</div><h3>Обратная к x² при x ≥ 0</h3><div class="steps">`;
      [1, 1.5, 2].forEach(a => { r += step(`(${sd(a)}; ${sd(a * a)}) на y = x²`, `(${sd(a * a)}; ${sd(a)}) на y = √x`); });
      r += step('√(x²)', '= x при x ≥ 0,  (√x)² = x', 'sum') + `</div>`;
      return r + `<p class="note" style="margin-top:10px">При x < 0 запись √(x²) равна |x|, а не x: например, √((−3)²) = 3.</p>`;
    }
    let r = `<h2>y = x³</h2><div class="formula" style="font-size:15px">(−x)³ = −x³</div><h3>Таблица значений</h3><div class="steps">`;
    [-2, -1, 0, 1, 2].forEach(x => { r += step('x = ' + ns(x), par(x) + '³ = ' + ns(x ** 3)); });
    r += step('x = ' + sd(m.x, 2), par(m.x, 2) + '³ ' + eqv(m.y), 'sum') + `</div><h3>Свойства</h3><div class="steps">` +
      step('D(f), E(f)', 'все числа') + step('монотонность', 'возрастает на всей оси') + step('чётность', 'нечётная') + step('обратная', 'y = ∛x', 'sum') + `</div>`;
    return r;
  }
  if (id === 'props') {
    const pr = m.pr, f = pr.f;
    let r = `<h2>${formula3(m.fam, m.a, m.b)}</h2><div class="formula" style="font-size:14px">сдвиг графика ${FAM[m.fam].name === 'кубическая' ? 'y = x³/4 − 3x' : m.fam === 'sq' ? 'y = x²' : 'y = |x|'} на (${ns(m.a)}; ${ns(m.b)})</div><h3>Свойства</h3><div class="steps">` +
      step('D(f)', 'ℝ') + step('E(f)', pr.range) + step('нули', pr.z.length ? pr.z.map(fx).join('; ') : 'нет') +
      step('f > 0', iList(pr.pos)) + step('f < 0', iList(pr.neg)) + step('возрастает', mList(pr.inc)) + step('убывает', mList(pr.dec)) +
      step('экстремумы', m.fam === 'cu' ? `x<sub>max</sub> = ${ns(m.a - 2)}, y<sub>max</sub> = ${ns(m.b + 4)}; x<sub>min</sub> = ${ns(m.a + 2)}, y<sub>min</sub> = ${ns(m.b - 4)}` : `x<sub>min</sub> = ${ns(m.a)}, y<sub>min</sub> = ${ns(m.b)}`) +
      step('чётность', parityS(pr.parity), 'sum') + `</div><h3>Проверка чётности</h3><div class="steps">`;
    [1, 2].forEach(x => { r += step(`f(${x}) и f(−${x})`, `${sd(f(x), 2)} и ${sd(f(-x), 2)}`); });
    r += step('вывод', pr.parity === 'even' ? 'f(−x) = f(x)' : pr.parity === 'odd' ? 'f(−x) = −f(x)' : 'нет ни равенства, ни противоположности', 'sum') + `</div>`;
    return r + `<p class="note" style="margin-top:10px">Нецелые нули показаны приближённо. Экстремумы кубической функции — локальные: наибольшего и наименьшего значений на всей оси у неё нет.</p>`;
  }
  const M = m.M;
  let r = `<h2>${M.name}</h2>`;
  if (M.id === 'lin') r += `<div class="formula" style="font-size:15px">y = 2x + 1</div><h3>Как найти обратную</h3><div class="steps">` + step('1. выразите x', 'x = (y − 1)/2') + step('2. поменяйте буквы', 'y = (x − 1)/2', 'sum') + `</div>`;
  else if (M.id === 'sq') r += `<div class="formula" style="font-size:15px">y = x²${m.res ? ',  x ≥ 0' : ''}</div><h3>Как найти обратную</h3><div class="steps">` + step('1. выразите x', m.res ? 'x = √y (x ≥ 0)' : 'x = ±√y — два значения') + step('2. поменяйте буквы', m.res ? 'y = √x' : 'обратной нет', 'sum') + `</div>`;
  else r += `<div class="formula" style="font-size:15px">F = 1,8C + 32</div><h3>Как найти обратную</h3><div class="steps">` + step('1. выразите C', 'C = (F − 32)/1,8') + step('0 °C', '32 °F') + step('100 °C', '212 °F') + step('−40 °C', '−40 °F — шкалы совпадают', 'sum') + `</div>`;
  r += `<h3>Сейчас</h3><div class="steps">` + step('P', `(${sd(m.x, 2)}; ${sd(m.y, 2)})`) + step('P′', `(${sd(m.y, 2)}; ${sd(m.x, 2)})`);
  if (m.invOK) r += step('проверка', `f⁻¹(${sd(m.y, 2)}) = ${sd(M.g(m.y), 2)}`, 'sum');
  else r += step('проверка', `по y = ${sd(m.y, 2)} подходят x = ${sd(Math.abs(m.x), 2)} и x = ${sd(-Math.abs(m.x), 2)}`, 'sum');
  return r + `</div><p class="note" style="margin-top:10px">f⁻¹(f(x)) = x: применить функцию, а потом обратную — значит вернуться туда, откуда начали.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'hyper') el.innerHTML = `<div class="k">Произведение x·y</div><div class="v ${m.k ? 'ok' : ''}" style="${m.k ? '' : 'color:var(--warn)'}">k = ${ns(m.k)}</div><div class="lr"><span>${m.k > 0 ? 'I и III' : m.k < 0 ? 'II и IV' : 'не гипербола'}</span><span>${m.k > 0 ? '↘' : m.k < 0 ? '↗' : '✗'}</span></div><div class="lr"><span>точки</span><span>${m.nGot}/${G1.length}</span></div>`;
  else if (id === 'rootcube') el.innerHTML = `<div class="k">${m.f === 'sqrt' ? 'Корень √x' : 'Куб x³'}</div><div class="v">${sd(m.y, 3)}</div><div class="lr"><span>x</span><span>${sd(m.x, 2)}</span></div><div class="lr"><span>цели</span><span>${m.nGot}/${T2.length}</span></div>`;
  else if (id === 'props') el.innerHTML = `<div class="k">Сдвиг (a; b)</div><div class="v ${m.hit ? 'ok' : ''}">(${ns(m.a)}; ${ns(m.b)})</div><div class="lr"><span>${m.pr.parity === 'even' ? 'чётная' : m.pr.parity === 'odd' ? 'нечётная' : 'общего вида'}</span><span>${m.pr.z.length} нул.</span></div><div class="lr"><span>цели</span><span>${m.nSolved}/${G3.length}</span></div>`;
  else el.innerHTML = `<div class="k">Обратная</div><div class="v ${m.invOK ? 'ok' : ''}" style="${m.invOK ? '' : 'color:var(--warn)'}">${m.invOK ? 'есть' : 'нет'}</div><div class="lr"><span>P′</span><span>(${sd(m.y, 1)}; ${sd(m.x, 1)})</span></div><div class="lr"><span>цели</span><span>${m.nGot}/${I4.length}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Функции и их свойства освоены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetState();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'hyper') now = `График y = k/x при k = ${ns(m.k)}${m.k === 0 ? ' (это прямая y = 0, не гипербола)' : m.k > 0 ? ' (ветви в I и III четвертях)' : ' (ветви во II и IV четвертях)'}. Точка на гиперболе: x = ${sd(m.x)}, y = ${m.k ? sd(m.y, 3) : 0}. ` +
    `Цели: ${G1.map((G, i) => G.lbl + (m.got[i] ? ' — пройдена' : ' — не пройдена')).join('; ')}. Точка D — пешеход, путь 8 км, скорость 4 км/ч, время 2 ч.`;
  if (id === 'rootcube') now = `На поле график ${m.f === 'sqrt' ? 'y = √x' : 'y = x³'}, точка-зонд в x = ${sd(m.x, 2)}, y = ${sd(m.y, 3)}. Зеркало y = x ${m.mir && m.f === 'sqrt' ? 'включено (видна парабола y = x² при x ≥ 0)' : 'выключено'}. ` +
    `Цели: ${T2.map((t, i) => t.lbl + (m.got[i] ? ' — выполнена' : ' — нет')).join('; ')}.`;
  if (id === 'props') now = `Цель ${m.gi + 1} из ${G3.length}: ${m.G.txt}. Сейчас на поле ${formula3(m.fam, m.a, m.b)} (${FAM[m.fam].name}, сдвиг a = ${ns(m.a)}, b = ${ns(m.b)}). ` +
    `Свойства сейчас: E = ${m.pr.range}; нули: ${m.pr.z.length ? m.pr.z.map(fx).join('; ') : 'нет'}; возрастает на ${mList(m.pr.inc)}; убывает на ${mList(m.pr.dec)}; ${parityS(m.pr.parity)}. ` +
    `Выполнено ${m.nSolved} из ${G3.length}: ${G3.map((g, i) => g.chip + (m.solved[i] ? ' — да' : ' — нет')).join('; ')}.`;
  if (id === 'inverse') now = `Функция ${m.M.name}${m.M.id === 'sq' ? (m.res ? ' с ограничением x ≥ 0' : ' на всей оси') : ''}; обратная ${m.invOK ? m.M.inv : 'не существует'}. Точка P(${sd(m.x, 2)}; ${sd(m.y, 2)}), отражение P′(${sd(m.y, 2)}; ${sd(m.x, 2)}). ` +
    `Вопрос «${Q4.q}»: ${m.pick < 0 ? 'ещё не отвечен' : `выбран «${Q4.opts[m.pick]}» — ${m.pick === Q4.ok ? 'верно' : 'неверно'}`}. Цели: ${I4.map((t, i) => t.lbl + (m.got[i] ? ' — выполнена' : ' — нет')).join('; ')}.`;
  return [
    `Раздел: математика, 8–9 класс, алгебра, тема «Функции и их свойства». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (нужное k, x для целей, нужный сдвиг графика, верный вариант вопроса): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    hyper: 'Почему гипербола никогда не пересекает оси?', rootcube: 'Почему √x не определён при x < 0?',
    props: 'Как по графику понять, что функция чётная?', inverse: 'Почему у x² нет обратной функции на всей оси?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где функции нужны в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
