<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saudager Цены — мокап интерфейса сравнения</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Мокап потребительского интерфейса сравнения цен на электронику. Демонстрационные данные.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f4f5f7;
    --card: #ffffff;
    --border: #e6e7eb;
    --text: #1f2028;
    --muted: #6c7180;
    --accent: #f14635;
    --accent-2: #e2551f;
    --green: #1f9d55;
    --amber: #c47f17;
    --blue: #2563c9;
    --gradient: linear-gradient(135deg, #f14635 0%, #e23c2b 100%);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font: inherit; }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 20px; }

  /* ===== Demo banner ===== */
  .demo-bar {
    background: #fff4e5; border-bottom: 1px solid #f0dcc0; color: #8a5a12;
    font-size: 13px; text-align: center; padding: 7px 20px; font-weight: 500;
  }

  /* ===== Header + search ===== */
  header {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);

  .bar { display: flex; align-items: center; gap: 20px; height: 72px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; flex-shrink: 0; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--gradient); display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 900; }
  .logo small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; line-height: 1; }

  .search-wrap { position: relative; flex: 1; max-width: 620px; }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-soft); border: 1.5px solid transparent;
    border-radius: 12px; padding: 0 14px; height: 46px;
    transition: border-color .15s, background .15s;
  }
  .search-box:focus-within { background: #fff; border-color: var(--accent); box-shadow: 0 4px 20px rgba(241,70,53,.12); }
  .search-box svg { flex-shrink: 0; color: var(--muted); }
  .search-box input { flex: 1; border: none; background: none; outline: none; font-size: 15px; }
  .search-clear { color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
  .search-clear:hover { color: var(--text); }

  .ac {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 70;
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 16px 48px rgba(20,22,30,.16); overflow: hidden; max-height: 70vh; overflow-y: auto;
  }
  .ac-group { padding: 6px 0; border-top: 1px solid var(--border); }
  .ac-group:first-child { border-top: none; }
  .ac-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 16px; font-weight: 700; }
  .ac-item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; }
  .ac-item.on, .ac-item:hover { background: var(--bg-soft); }
  .ac-ico { width: 34px; height: 34px; border-radius: 8px; background: var(--bg-soft); display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .ac-item.on .ac-ico, .ac-item:hover .ac-ico { background: #fff; }
  .ac-txt { flex: 1; min-width: 0; }
  .ac-title { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-sub { font-size: 12.5px; color: var(--muted); }
  .ac-price { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .ac mark { background: #ffe8e5; color: var(--accent); font-weight: 700; padding: 0 1px; border-radius: 3px; }
  .ac-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ===== Landing ===== */
  .hero { padding: 44px 0 26px; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
  .hero p { color: var(--muted); margin-top: 10px; font-size: 16px; }
  .stats { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }

  .chips { display: flex; gap: 9px; flex-wrap: wrap; margin: 26px 0 8px; }

  .card-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .save { font-size: 12.5px; color: var(--green); font-weight: 700; }

  /* ===== Product page ===== */
  .crumbs { font-size: 13.5px; color: var(--muted); padding: 20px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .crumbs button:hover { color: var(--accent); }

  .gallery .big { height: 300px; border-radius: 16px; background: var(--bg-soft); display: grid; place-items: center; font-size: 110px; }
  .gallery .thumbs { display: flex; gap: 8px; margin-top: 10px; }
  .gallery .thumbs div { width: 58px; height: 58px; border-radius: 9px; background: var(--bg-soft); display: grid; place-items: center; font-size: 24px; border: 1.5px solid transparent; }
  .gallery .thumbs div:first-child { border-color: var(--accent); }

  h2.pname { font-size: 27px; font-weight: 800; letter-spacing: -.025em; line-height: 1.2; }
  .brandline { display: flex; gap: 14px; align-items: center; margin-top: 9px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
  .rating { color: var(--amber); font-weight: 700; }
  .specs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
  .spec { font-size: 13px; padding: 6px 12px; border-radius: 8px; background: var(--bg-soft); color: var(--muted); }

  .pricebox { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; background: linear-gradient(180deg,#fff,var(--bg-soft)); }

  .pricebox .amt { font-size: 34px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }

  .filters label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .filters input { accent-color: var(--accent); width: 15px; height: 15px; }

  .offer {
    display: grid; grid-template-columns: 34px 1fr 150px 180px; gap: 16px; align-items: center;
    padding: 15px 14px; border-bottom: 1px solid var(--border); border-radius: 10px;

  .offer:hover { background: var(--bg-soft); }
  .offer.top { background: #f4fbf6; border: 1px solid #cfe9d8; margin: 6px 0; }

  .rank { font-size: 15px; font-weight: 800; color: var(--muted); text-align: center; }
  .shop { min-width: 0; }
  .shop-name { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .shop-meta { font-size: 13px; color: var(--muted); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .01em; white-space: nowrap; }
  .tag.best { background: #e6f6ec; color: var(--green); }
  .tag.value { background: #e9f0fd; color: var(--blue); }
  .tag.fast { background: #fff2e2; color: var(--amber); }

  .price-cell { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .p-main { text-align: right; }
  .p-amt { font-size: 19px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .p-diff { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .p-diff.up { color: #b4442f; }
  .go { background: var(--gradient); color: #fff; padding: 10px 17px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; }

  .disclaimer { font-size: 12.5px; color: var(--muted); padding: 22px 0 60px; line-height: 1.6; }

  @media (max-width: 900px) {
    .bar { height: auto; padding: 12px 0; flex-wrap: wrap; }
    .search-wrap { max-width: none; order: 3; width: 100%; }
    .prod { grid-template-columns: 1fr; gap: 22px; }
    .gallery .big { height: 220px; font-size: 80px; }
    h1 { font-size: 26px; }
    h2.pname { font-size: 22px; }
    .offer { grid-template-columns: 1fr auto; gap: 10px; padding: 14px 12px; }
    .rank, .delivery { display: none; }
    .price-cell { justify-content: space-between; grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="demo-bar">Мокап интерфейса. Магазины, цены и остатки вымышлены — данные нужны только чтобы оценить внешний вид.</div>

<header>
  <div class="container bar">
    <button class="logo" onclick="goHome()">
      <span class="logo-mark">S</span>
      <span>Saudager<small>сравнение цен</small></span>

    <div class="search-wrap">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

  Saudager — мокап. Все названия магазинов вымышлены, любые совпадения случайны. Цены сгенерированы для демонстрации и не отражают реальный рынок.
</footer>

<script>
// ---------------------------------------------------------------------------
// Demo data. Shops are invented on purpose: attaching made-up prices to real
// retailers would be a fabricated record, and for judging the UI it changes
// nothing.
// ---------------------------------------------------------------------------
const SHOPS = [
  "Техносити", "Электрон.kz", "ГаджетМаркет", "ЦифроПлюс", "Мега Техно",
  "АйТи Ленд", "Смарт Базар", "Вольт Store", "Алма Дигитал", "НурТехника",
  "Керемет Электроникс", "Про Гаджет", "Дала Техно", "Стрим Маркет", "Юнит Шоп",
  "Тау Электро", "Байтерек Техно", "Орбита Диджитал", "Астана Гаджет", "Люмен Store"
];

const CATS = [
  { id: "phone",   name: "Смартфоны",   icon: "📱" },
  { id: "laptop",  name: "Ноутбуки",    icon: "💻" },
  { id: "audio",   name: "Наушники",    icon: "🎧" },
  { id: "tablet",  name: "Планшеты",    icon: "📲" },
  { id: "watch",   name: "Часы",        icon: "⌚" },
  { id: "tv",      name: "Телевизоры",  icon: "📺" },
  { id: "console", name: "Консоли",     icon: "🎮" },
  { id: "monitor", name: "Мониторы",    icon: "🖥️" }
];

const PRODUCTS = [
  { id: 1,  cat: "phone",  brand: "Apple",   name: "iPhone 17 Pro Max 512Gb", base: 812000, specs: ["6.9\" LTPO 120 Гц", "512 ГБ", "A19 Pro", "Титан"] },
  { id: 2,  cat: "phone",  brand: "Apple",   name: "iPhone 17 Pro 256Gb", base: 664000, specs: ["6.3\" LTPO", "256 ГБ", "A19 Pro"] },
  { id: 3,  cat: "phone",  brand: "Apple",   name: "iPhone 17 128Gb", base: 489000, specs: ["6.1\"", "128 ГБ", "A19"] },
  { id: 4,  cat: "phone",  brand: "Samsung", name: "Galaxy S26 Ultra 12/512Gb", base: 729000, specs: ["6.9\" AMOLED", "512 ГБ", "S Pen"] },
  { id: 5,  cat: "phone",  brand: "Samsung", name: "Galaxy S26 12/256Gb", base: 458000, specs: ["6.2\" AMOLED", "256 ГБ"] },
  { id: 6,  cat: "phone",  brand: "Xiaomi",  name: "Redmi Note 15 Pro 8/256Gb", base: 118000, specs: ["6.67\" AMOLED", "256 ГБ", "5100 мА·ч"] },
  { id: 7,  cat: "phone",  brand: "Xiaomi",  name: "16 Pro 12/512Gb", base: 486000, specs: ["6.73\"", "512 ГБ", "Leica"] },
  { id: 8,  cat: "phone",  brand: "Honor",   name: "Magic 8 Pro 12/512Gb", base: 512000, specs: ["6.8\"", "512 ГБ"] },
  { id: 9,  cat: "laptop", brand: "Apple",   name: "MacBook Air 15 M4 16/512Gb", base: 798000, specs: ["15.3\" Liquid Retina", "16 ГБ", "512 ГБ SSD"] },
  { id: 10, cat: "laptop", brand: "Apple",   name: "MacBook Pro 14 M4 Pro 24/1Tb", base: 1289000, specs: ["14.2\" XDR", "24 ГБ", "1 ТБ SSD"] },
  { id: 11, cat: "laptop", brand: "ASUS",    name: "ROG Zephyrus G16 RTX 5070", base: 934000, specs: ["16\" OLED 240 Гц", "RTX 5070", "32 ГБ"] },
  { id: 12, cat: "laptop", brand: "Lenovo",  name: "IdeaPad Slim 5 16/512Gb", base: 274000, specs: ["15.6\" IPS", "16 ГБ", "512 ГБ SSD"] },
  { id: 13, cat: "audio",  brand: "Apple",   name: "AirPods Pro 3", base: 148000, specs: ["ANC", "USB-C", "до 8 ч"] },
  { id: 14, cat: "audio",  brand: "Sony",    name: "WH-1000XM6", base: 236000, specs: ["Накладные", "ANC", "до 30 ч"] },
  { id: 15, cat: "audio",  brand: "JBL",     name: "Tune Beam 2", base: 27900, specs: ["TWS", "ANC", "до 40 ч"] },
  { id: 16, cat: "audio",  brand: "Samsung", name: "Galaxy Buds4 Pro", base: 112000, specs: ["TWS", "ANC", "Hi-Fi"] },
  { id: 17, cat: "tablet", brand: "Apple",   name: "iPad Air 13 M3 256Gb", base: 496000, specs: ["13\" Liquid Retina", "256 ГБ"] },
  { id: 18, cat: "tablet", brand: "Samsung", name: "Galaxy Tab S11 12/256Gb", base: 419000, specs: ["12.4\" AMOLED", "S Pen"] },
  { id: 19, cat: "watch",  brand: "Apple",   name: "Watch Series 11 46mm", base: 246000, specs: ["46 мм", "GPS", "Always-On"] },
  { id: 20, cat: "watch",  brand: "Garmin",  name: "Fenix 9 Solar 47mm", base: 588000, specs: ["47 мм", "Solar", "AMOLED"] },
  { id: 21, cat: "tv",     brand: "LG",      name: "OLED evo C5 65\"", base: 812000, specs: ["65\" OLED", "4K 144 Гц"] },
  { id: 22, cat: "tv",     brand: "Samsung", name: "Neo QLED QN90F 55\"", base: 574000, specs: ["55\" Neo QLED", "4K 120 Гц"] },
  { id: 23, cat: "console",brand: "Sony",    name: "PlayStation 5 Pro 2Tb", base: 458000, specs: ["2 ТБ", "8K", "Wi-Fi 7"] },
  { id: 24, cat: "console",brand: "Nintendo",name: "Switch 2 OLED", base: 264000, specs: ["OLED", "Docked 4K"] },
  { id: 25, cat: "monitor",brand: "LG",      name: "UltraGear 27\" OLED 480Hz", base: 486000, specs: ["27\" OLED", "480 Гц", "0.03 мс"] },
  { id: 26, cat: "monitor",brand: "Dell",    name: "UltraSharp U2725QE 27\"", base: 268000, specs: ["27\" IPS Black", "4K", "USB-C 90 Вт"] }
];

// Seeded PRNG so the mockup looks identical on every reload — a demo that
// reshuffles itself is impossible to discuss with anyone.
function rng(seed) {
  let s = seed * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

const DELIVERY = [
  { label: "Сегодня", days: 0, note: "до 21:00" },
  { label: "Завтра", days: 1, note: "курьером" },
  { label: "2 дня", days: 2, note: "курьером" },
  { label: "3 дня", days: 3, note: "пункт выдачи" },
  { label: "5 дней", days: 5, note: "из Астаны" },
  { label: "7 дней", days: 7, note: "под заказ" }
];

function buildOffers(p) {
  const r = rng(p.id * 137);
  const n = 6 + Math.floor(r() * 12);
  const pool = SHOPS.slice().sort(() => r() - 0.5);
  const offers = [];
  for (let i = 0; i < n; i++) {
    const spread = -0.055 + r() * 0.30;        // a few below base, a long tail above
    const price = Math.round((p.base * (1 + spread)) / 10) * 10;
    const d = DELIVERY[Math.floor(r() * DELIVERY.length)];
    offers.push({
      shop: pool[i % pool.length],
      price,
      rating: Math.round((3.6 + r() * 1.4) * 10) / 10,
      reviews: 12 + Math.floor(r() * 1800),
      delivery: d,
      installment: r() > 0.35,
      stock: r() > 0.18 ? "В наличии" : "Под заказ",
      years: 1 + Math.floor(r() * 9)
    });
  }
  return offers;
}

PRODUCTS.forEach((p) => {
  p.offers = buildOffers(p);
  p.min = Math.min(...p.offers.map((o) => o.price));
  p.max = Math.max(...p.offers.map((o) => o.price));
  p.icon = CATS.find((c) => c.id === p.cat).icon;
  p.catName = CATS.find((c) => c.id === p.cat).name;
  p.full = p.brand + " " + p.name;
  p.rating = p.offers.reduce((a, o) => a + o.rating, 0) / p.offers.length;
  // 30-day series, ending at today's minimum
  const r = rng(p.id * 31);
  p.history = Array.from({ length: 30 }, (_, i) =>
    Math.round(p.min * (1 + 0.11 * (1 - i / 29) + (r() - 0.5) * 0.03))
  );
  p.history[29] = p.min;
});

const money = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸";
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const stars = (n) => Number(n).toFixed(1);

// Value score: price dominates, but a cheap shop with 3.7 stars and a week of
// waiting is not actually the best deal, and the UI should be able to say so.
function scored(offers) {
  const prices = offers.map((o) => o.price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  return offers.map((o) => {
    const pn = hi === lo ? 1 : 1 - (o.price - lo) / (hi - lo);
    const rn = (o.rating - 3.5) / 1.5;
    const dn = 1 - Math.min(o.delivery.days, 7) / 7;
    return Object.assign({}, o, { score: pn * 0.6 + rn * 0.25 + dn * 0.15 });
  });
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------
const norm = (s) => s.toLowerCase().replace(/ё/g, "е").trim();

function hl(text, q) {
  const i = norm(text).indexOf(norm(q));
  if (i < 0 || !q) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}

function suggest(q) {
  const n = norm(q);
  if (!n) return { products: [], brands: [], cats: [] };
  const products = PRODUCTS.filter((p) => norm(p.full).includes(n) || norm(p.catName).includes(n)).slice(0, 6);
  const brands = [...new Set(PRODUCTS.map((p) => p.brand))].filter((b) => norm(b).includes(n)).slice(0, 3);
  const cats = CATS.filter((c) => norm(c.name).includes(n)).slice(0, 3);
  return { products, brands, cats };
}

let acItems = [], acIndex = -1;

function renderAc(q) {
  const ac = document.getElementById("ac");
  const s = suggest(q);
  acItems = [];
  if (!q) { ac.hidden = true; return; }

  let html = "";
  if (s.products.length) {
    html += '<div class="ac-group"><div class="ac-label">Товары</div>';
    s.products.forEach((p) => {
      acItems.push({ kind: "product", id: p.id });
      html += '<div class="ac-item" data-i="' + (acItems.length - 1) + '">' +
        '<div class="ac-ico">' + p.icon + '</div>' +
        '<div class="ac-txt"><div class="ac-title">' + hl(p.full, q) + '</div>' +
        '<div class="ac-sub">' + p.catName + ' · ' + p.offers.length + ' предложений</div></div>' +
        '<div class="ac-price">от ' + money(p.min) + '</div></div>';
    });
    html += "</div>";
  }
  if (s.brands.length) {
    html += '<div class="ac-group"><div class="ac-label">Бренды</div>';
    s.brands.forEach((b) => {
      acItems.push({ kind: "brand", id: b });
      const cnt = PRODUCTS.filter((p) => p.brand === b).length;
      html += '<div class="ac-item" data-i="' + (acItems.length - 1) + '">' +
        '<div class="ac-ico">🏷️</div><div class="ac-txt"><div class="ac-title">' + hl(b, q) +
        '</div><div class="ac-sub">' + cnt + ' товаров</div></div></div>';
    });
    html += "</div>";
  }
  if (s.cats.length) {
    html += '<div class="ac-group"><div class="ac-label">Категории</div>';
    s.cats.forEach((c) => {
      acItems.push({ kind: "cat", id: c.id });
      const cnt = PRODUCTS.filter((p) => p.cat === c.id).length;
      html += '<div class="ac-item" data-i="' + (acItems.length - 1) + '">' +
        '<div class="ac-ico">' + c.icon + '</div><div class="ac-txt"><div class="ac-title">' + hl(c.name, q) +
        '</div><div class="ac-sub">' + cnt + ' товаров</div></div></div>';
    });
    html += "</div>";
  }
  if (!html) html = '<div class="ac-empty">Ничего не нашлось по запросу «' + esc(q) + '»</div>';

  ac.innerHTML = html;
  ac.hidden = false;
  acIndex = -1;
  ac.querySelectorAll(".ac-item").forEach((el) => {
    el.onmousedown = (e) => { e.preventDefault(); pick(acItems[+el.dataset.i]); };
  });
}

function pick(it) {
  document.getElementById("ac").hidden = true;
  const q = document.getElementById("q");
  if (it.kind === "product") { q.value = ""; document.getElementById("clear").hidden = true; openProduct(it.id); }
  if (it.kind === "brand") { q.value = it.id; showList({ brand: it.id }); }
  if (it.kind === "cat") { q.value = ""; document.getElementById("clear").hidden = true; showList({ cat: it.id }); }
}

const qEl = document.getElementById("q");
qEl.addEventListener("input", () => {
  document.getElementById("clear").hidden = !qEl.value;
  renderAc(qEl.value);
});
qEl.addEventListener("focus", () => { if (qEl.value) renderAc(qEl.value); });
qEl.addEventListener("blur", () => setTimeout(() => { document.getElementById("ac").hidden = true; }, 120));
qEl.addEventListener("keydown", (e) => {
  const ac = document.getElementById("ac");
  if (ac.hidden || !acItems.length) {
    if (e.key === "Enter" && qEl.value) showList({ text: qEl.value });
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    acIndex = (acIndex + (e.key === "ArrowDown" ? 1 : -1) + acItems.length) % acItems.length;
    ac.querySelectorAll(".ac-item").forEach((el, i) => el.classList.toggle("on", i === acIndex));
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (acIndex >= 0) pick(acItems[acIndex]);
    else showList({ text: qEl.value });
    ac.hidden = true;
  } else if (e.key === "Escape") {
    ac.hidden = true;
  }
});
document.getElementById("clear").onclick = () => {
  qEl.value = ""; document.getElementById("clear").hidden = true;
  document.getElementById("ac").hidden = true; qEl.focus();
};

// ---------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------
const main = document.getElementById("main");
let activeCat = null;

function goHome() {
  activeCat = null;
  qEl.value = ""; document.getElementById("clear").hidden = true;
  showList({});
}

function cardHtml(p) {
  const save = Math.round(((p.max - p.min) / p.max) * 100);
  return '<button class="card" onclick="openProduct(' + p.id + ')">' +
    '<div class="thumb">' + p.icon + '</div>' +
    '<div class="card-title">' + esc(p.full) + '</div>' +
    '<div class="card-price">' + money(p.min) + ' <em>· мин.</em></div>' +
    '<div class="card-meta"><span>' + p.offers.length + ' предложений</span><span class="rating">★ ' + stars(p.rating) + '</span></div>' +
    (save > 6 ? '<div class="save">Разброс цен ' + save + '%</div>' : '<div class="save" style="color:var(--muted)">Цены почти равны</div>') +
    '</button>';
}

function showList(filter) {
  let items = PRODUCTS.slice();
  let title = "Электроника: где сейчас дешевле";
  let sub = "Один товар — все магазины в одном списке. Сравнение по цене, доставке и рейтингу продавца.";

  if (filter.cat) { activeCat = filter.cat; }
  if (filter.brand) { activeCat = null; }

  if (activeCat) {
    items = items.filter((p) => p.cat === activeCat);
    const c = CATS.find((x) => x.id === activeCat);
    title = c.name; sub = c.icon + " " + items.length + " товаров в категории";
  }
  if (filter.brand) {
    items = items.filter((p) => p.brand === filter.brand);
    title = filter.brand; sub = items.length + " товаров этого бренда";
  }
  if (filter.text) {
    const n = norm(filter.text);
    items = items.filter((p) => norm(p.full).includes(n) || norm(p.catName).includes(n));
    activeCat = null;
    title = "Результаты: «" + filter.text + "»";
    sub = items.length + " товаров найдено";
  }

  const totalOffers = PRODUCTS.reduce((a, p) => a + p.offers.length, 0);
  const head = filter.text || filter.brand || activeCat ? "" :
    '<div class="stats">' +
      '<div class="stat"><b>' + PRODUCTS.length + '</b><span>товаров<br>в каталоге</span></div>' +
      '<div class="stat"><b>' + totalOffers + '</b><span>предложений<br>от магазинов</span></div>' +
      '<div class="stat"><b>' + SHOPS.length + '</b><span>магазинов<br>подключено</span></div>' +
      '<div class="stat"><b>2×/день</b><span>обновление<br>цен</span></div>' +
    '</div>';

  main.innerHTML =
    '<div class="hero"><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p>' + head + '</div>' +
    '<div class="chips">' +
      '<button class="chip' + (activeCat ? "" : " on") + '" onclick="goHome()">Все</button>' +
      CATS.map((c) => '<button class="chip' + (activeCat === c.id ? " on" : "") + '" onclick="showList({cat:\'' + c.id + '\'})">' + c.icon + " " + c.name + '</button>').join("") +
    '</div>' +
    (items.length
      ? '<div class="grid">' + items.map(cardHtml).join("") + "</div>"
      : '<div class="ac-empty" style="padding:60px 0">Ничего не нашлось. Попробуйте другой запрос.</div>');
  window.scrollTo(0, 0);
}

function spark(hist) {
  const lo = Math.min(...hist), hi = Math.max(...hist);
  const pts = hist.map((v, i) => {
    const x = (i / (hist.length - 1)) * 280;
    const y = 44 - ((v - lo) / (hi - lo || 1)) * 40;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  return '<svg viewBox="0 0 280 48" width="100%" height="48" preserveAspectRatio="none">' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#1f9d55" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="280" cy="' + (44 - ((hist[hist.length - 1] - lo) / (hi - lo || 1)) * 40).toFixed(1) + '" r="3.5" fill="#1f9d55"/></svg>';
}

let sortMode = "price", onlyInstallment = false, onlyFast = false, onlyGood = false, currentId = null;

function openProduct(id) {
  currentId = id; sortMode = "price"; onlyInstallment = onlyFast = onlyGood = false;
  renderProduct();
  window.scrollTo(0, 0);
}

function renderProduct() {
  const p = PRODUCTS.find((x) => x.id === currentId);
  const all = scored(p.offers);
  const cheapest = all.reduce((a, b) => (b.price < a.price ? b : a));
  const bestValue = all.reduce((a, b) => (b.score > a.score ? b : a));
  const bestRated = all.reduce((a, b) => (b.rating > a.rating ? b : a));
  const fastest = all.reduce((a, b) => (b.delivery.days < a.delivery.days ? b : a));

  let list = all.slice();
  if (onlyInstallment) list = list.filter((o) => o.installment);
  if (onlyFast) list = list.filter((o) => o.delivery.days <= 1);
  if (onlyGood) list = list.filter((o) => o.rating >= 4.5);
  if (sortMode === "price") list.sort((a, b) => a.price - b.price);
  if (sortMode === "value") list.sort((a, b) => b.score - a.score);
  if (sortMode === "rating") list.sort((a, b) => b.rating - a.rating || a.price - b.price);
  if (sortMode === "fast") list.sort((a, b) => a.delivery.days - b.delivery.days || a.price - b.price);

  const spreadPct = Math.round(((p.max - p.min) / p.max) * 100);
  const drop = p.history[0] - p.min;

  const rows = list.map((o, i) => {
    const tags = [];
    if (o === cheapest) tags.push('<span class="tag best">Самая низкая цена</span>');
    if (o === bestValue && o !== cheapest) tags.push('<span class="tag value">Оптимальный выбор</span>');
    if (o === bestRated && o !== cheapest && o !== bestValue) tags.push('<span class="tag rate">Лучший рейтинг</span>');
    if (o === fastest && o.delivery.days === 0 && o !== cheapest) tags.push('<span class="tag fast">Доставка сегодня</span>');
    const diff = o.price - cheapest.price;
    return '<div class="offer' + (o === cheapest || o === bestValue ? " top" : "") + '">' +
      '<div class="rank">' + (i + 1) + '</div>' +
      '<div class="shop"><div class="shop-name">' + esc(o.shop) + tags.join("") + '</div>' +
        '<div class="shop-meta"><span class="rating">★ ' + stars(o.rating) + '</span>' +
        '<span>' + o.reviews + ' отзывов</span><span>' + o.stock + '</span>' +
        '<span>на площадке ' + o.years + " " + (o.years === 1 ? "год" : o.years < 5 ? "года" : "лет") + '</span>' +
        (o.installment ? "<span>0–0–12</span>" : "") + '</div></div>' +
      '<div class="delivery"><b>' + o.delivery.label + '</b>' + o.delivery.note + '</div>' +
      '<div class="price-cell"><div class="p-main"><div class="p-amt">' + money(o.price) + '</div>' +
        '<div class="p-diff' + (diff > 0 ? " up" : "") + '">' + (diff === 0 ? "минимум" : "+" + money(diff)) + '</div></div>' +
        '<span class="go">Перейти</span></div></div>';
  }).join("");

  main.innerHTML =
    '<div class="crumbs"><button onclick="goHome()">Каталог</button> › ' +
      '<button onclick="showList({cat:\'' + p.cat + '\'})">' + p.catName + '</button> › <span>' + esc(p.name) + '</span></div>' +

    '<div class="prod"><div class="gallery">' +
      '<div class="big">' + p.icon + '</div>' +
      '<div class="thumbs"><div>' + p.icon + '</div><div>📷</div><div>📷</div><div>📷</div></div></div>' +

      '<div><h2 class="pname">' + esc(p.full) + '</h2>' +
      '<div class="brandline"><span class="rating">★ ' + stars(p.rating) + '</span><span>' + p.offers.length +
        ' предложений</span><span>Бренд: ' + esc(p.brand) + '</span><span>Алматы</span></div>' +
      '<div class="specs">' + p.specs.map((s) => '<span class="spec">' + esc(s) + "</span>").join("") + "</div>" +

      '<div class="pricebox"><div class="from">Минимальная цена сейчас</div>' +
        '<div class="amt">' + money(p.min) + "</div>" +
        '<div class="spread">Самое дорогое предложение — ' + money(p.max) +
          ". Разброс <b>" + spreadPct + "%</b>, это " + money(p.max - p.min) + "</div>" +
        '<div class="sparkwrap"><div class="lbl"><span>Цена за 30 дней</span><span style="color:var(--green);font-weight:700">↓ ' +
          money(drop) + "</span></div>" + spark(p.history) + "</div></div></div></div>" +

    '<div class="offers-head"><h3>Все предложения — ' + p.offers.length + "</h3>" +
      '<span style="font-size:13px;color:var(--muted)">Обновлено сегодня в 09:40</span></div>' +

    '<div class="tabs">' +
      tab("price", "Сначала дешёвые") + tab("value", "Самые выгодные") +
      tab("rating", "По рейтингу магазина") + tab("fast", "Быстрая доставка") + "</div>" +

    '<div class="filters">' +
      chk("onlyInstallment", onlyInstallment, "Есть рассрочка 0–0–12") +
      chk("onlyFast", onlyFast, "Доставка сегодня или завтра") +
      chk("onlyGood", onlyGood, "Рейтинг магазина 4.5+") +
      '<span style="margin-left:auto">Показано ' + list.length + " из " + p.offers.length + "</span></div>" +

    (list.length ? rows : '<div class="ac-empty" style="padding:44px 0">Под эти фильтры не подошло ни одно предложение</div>') +

    '<div class="disclaimer"><b>Как считается «оптимальный выбор».</b> Цена даёт 60% оценки, рейтинг магазина — 25%, ' +
      'скорость доставки — 15%. Самое дешёвое предложение не всегда лучшее: магазин с рейтингом 3.7 и доставкой ' +
      'через неделю может стоить дешевле, и интерфейс должен об этом говорить прямо.<br><br>' +
      'Все данные на этой странице вымышлены и приведены только для оценки интерфейса.</div>';
}

function tab(mode, label) {
  return '<button class="tab' + (sortMode === mode ? " on" : "") + '" onclick="sortMode=\'' + mode + "';renderProduct()\">" + label + "</button>";
}
function chk(name, val, label) {
  return '<label><input type="checkbox"' + (val ? " checked" : "") +
    ' onchange="' + name + "=this.checked;renderProduct()\">" + label + "</label>";
}

goHome();
</script>
</body>
</html>
