<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 5 класс: порядок действий, делимость и её признаки, простые числа и решето Эратосфена, НОД и НОК.">
<title>Натуральные числа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="b"],.scene [data-drag="knob"],.scene [data-drag="track"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const KEY = 'luch-math-num';

// ---------- number helpers ----------
const isPrime = n => { if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true; };
const factor = n => { const f = []; let d = 2; while (n > 1) { while (n % d === 0) { f.push(d); n /= d; } d++; } return f; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const digitSum = n => String(n).split('').reduce((s, c) => s + +c, 0);
const divisors = n => { const r = []; for (let d = 1; d <= n; d++) if (n % d === 0) r.push(d); return r; };
const commonOf = (a, b) => { const fb = factor(b), c = []; for (const p of factor(a)) { const i = fb.indexOf(p); if (i >= 0) { c.push(p); fb.splice(i, 1); } } return c; };
const prod = arr => arr.reduce((s, x) => s * x, 1);
const dotJoin = arr => arr.length ? arr.join(' · ') : '1';
const PCOL = { 2: '#72d4e8', 3: '#ffb547', 5: '#86e0a8', 7: '#c39bff' };
const pcol = p => PCOL[p] || '#ff8a73';

const EXPRS = ['48 − 6 · (3 + 5) : 4', '120 : (15 − 7) + 3 · 9', '(72 − 12) : 5 · 2 − 4', '100 − (25 + 35) : (4 · 3)', '7 + 3 · (40 − 8 : 2)'];
const DIVS = [2, 3, 4, 5, 6, 9, 10];
const NMAX = 150;
const PAIRS = [[24, 36], [12, 18], [30, 45], [16, 40], [60, 84]];

const LESSONS = [
  { id: 'order', title: 'Порядок действий',
    text: ['В выражении бывает несколько действий. Чтобы у всех получился один и тот же ответ, договорились о порядке. Первым делом считают то, что в скобках.',
           'Потом выполняют умножение и деление, а уже затем сложение и вычитание. Действия одной ступени идут по порядку, слева направо.',
           'Перед тем как считать, расставьте над знаками номера действий. Так ошибиться гораздо труднее.'],
    why: 'Кассир и бухгалтер считают чек: 3 · 450 тг + 2 · 1200 тг. Сначала умножение, потом сложение, иначе сумма выйдет неверной. Программист знает, что калькулятор, компьютер и формулы в Excel считают по тем же правилам. Ошибся в порядке действий — ошибся в деньгах.',
    task: 'Вычислите выражение: каждый раз нажимайте на действие, которое по правилам выполняется следующим.',
    hint: 'Есть скобки — начните с них. И в скобках, и без них сначала «·» и «:», потом «+» и «−», слева направо.',
    stage: 'Нажимайте на знаки действий по порядку. Над примером появятся номера действий.',
    ex: 0,
    check: m => m.done },
  { id: 'div', title: 'Делимость',
    text: ['Число a делится на b, если a предметов можно разложить в кучки по b штук без остатка. 24 : 3 = 8, остаток 0 — значит, 24 делится на 3. А 25 на 3 не делится: одна точка останется лишней.',
           'Делить каждый раз не обязательно — есть признаки делимости. На 2 делятся числа, которые оканчиваются чётной цифрой. На 5 — цифрой 0 или 5. На 10 — цифрой 0.',
           'На 3 делится число, у которого сумма цифр делится на 3. На 9 — если сумма цифр делится на 9. Например, у 117 сумма цифр 1 + 1 + 7 = 9, поэтому 117 делится и на 3, и на 9.'],
    why: 'Менеджер склада раскладывает товар по коробкам по 6 или по 12 штук и сразу видит, останутся ли лишние. Организатор делит класс на команды поровну, повар — тесто на равные порции. А признаки делимости помогают проверить ответ за секунду, без калькулятора.',
    task: 'Найдите число больше 50, которое делится и на 2, и на 3, и на 5.',
    hint: 'На что оканчиваются числа, которые делятся и на 2, и на 5? Найдите такое число, а потом сложите его цифры.',
    stage: 'Тащите ползунок по числовому лучу, делитель выбирайте сверху. Оранжевые точки — остаток.',
    n: 24, k: 3,
    check: m => m.n > 50 && m.n % 30 === 0 },
  { id: 'prime', title: 'Простые числа',

// ---------- lesson 1: expressions ----------
const HI = o => o === '·' || o === ':';
function parseExpr(s) {
  let id = 0;
  return (s.match(/\d+|[−+·:()]/g) || []).map(x => /\d/.test(x) ? { t: 'n', v: +x } : x === '(' || x === ')' ? { t: x } : { t: 'o', o: x, id: id++ });
}
function groups(tk) {
  const segs = []; let open = -1;
  tk.forEach((t, i) => { if (t.t === '(') open = i; else if (t.t === ')') { if (open >= 0) segs.push([open + 1, i]); open = -1; } });
  return segs.length ? segs : [[0, tk.length]];
}
function allowed(tk) {
  const ok = new Set();
  for (const [a, b] of groups(tk)) {
    const ops = tk.slice(a, b).filter(t => t.t === 'o'); if (!ops.length) continue;
    ok.add((ops.find(t => HI(t.o)) || ops[0]).id);
  }
  return ok;
}
function whyWrong(tk, id) {
  const i = tk.findIndex(t => t.id === id), seg = groups(tk).find(([a, b]) => i >= a && i < b);
  if (!seg) return 'Сначала выполняются действия в скобках.';
  const ops = tk.slice(seg[0], seg[1]).filter(t => t.t === 'o');
  if (!HI(tk[i].o) && ops.some(t => HI(t.o))) return 'Умножение и деление выполняются раньше сложения и вычитания.';
  return 'Действия одной ступени выполняются по порядку, слева направо.';
}
const calc = (a, o, b) => o === '+' ? a + b : o === '−' ? a - b : o === '·' ? a * b : a / b;
function clickOp(id) {
  if (S.tk.length === 1) return;
  if (!allowed(S.tk).has(id)) { S.mist++; S.bad = { id, t: performance.now() }; toast(whyWrong(S.tk, id)); update(); return; }
  const i = S.tk.findIndex(t => t.id === id), a = S.tk[i - 1].v, o = S.tk[i].o, b = S.tk[i + 1].v, r = calc(a, o, b);
  S.tk.splice(i - 1, 3, { t: 'n', v: r, fresh: performance.now() });
  let j; while ((j = S.tk.findIndex((t, k) => t.t === '(' && S.tk[k + 2] && S.tk[k + 2].t === ')' && S.tk[k + 1].t === 'n')) >= 0) S.tk.splice(j, 3, S.tk[j + 1]);
  S.steps.push({ id, a, o, b, r });
  update();
}
function setExpr(i) { S.ex = (i + EXPRS.length) % EXPRS.length; S.orig = parseExpr(EXPRS[S.ex]); S.tk = parseExpr(EXPRS[S.ex]); S.steps = []; S.mist = 0; S.bad = null; }

// ---------- lesson 3: sieve ----------
function tapCell(n) {
  S.probe = n;
  if (n === 1) { toast('1 — ни простое, ни составное: у него всего один делитель.'); update(); return; }
  if (S.cross[n]) { const p = S.cross[n]; toast(`${n} уже вычеркнуто: ${n} = ${p} · ${n / p}. Это составное число.`); update(); return; }
  if (S.pr[n]) { toast(`${n} уже отмечено как простое.`); update(); return; }
  if (!isPrime(n)) { const p = factor(n)[0]; S.flash = { n: p, t: performance.now() }; toast(`${n} делится на ${p}, значит, оно составное. Сначала нажмите ${p}.`); update(); return; }
  S.pr[n] = true; S.last = n;
  const now = performance.now(); let c = 0;
  for (let m = 2 * n; m <= 100; m += n) if (!S.cross[m]) { S.cross[m] = n; S.crossT[m] = now + (reduce ? 0 : c * 30); c++; }
  toast(c ? `${n} — простое. Вычеркнули ${c} ${plural(c, 'число', 'числа', 'чисел')}, кратных ${n}.` : `${n} — простое. Кратных ему до 100 уже не осталось.`);
  update();
}
const nextPrimeToTap = () => { for (let n = 2; n <= 100; n++) if (!S.cross[n] && !S.pr[n]) return n; return null; };

// ---------- lesson 4: factor balls ----------
// two circles side by side; on a tall narrow stage they stack vertically
const GEO = {
  wide: { A: { x: 180, y: 150 }, B: { x: 340, y: 150 }, R: 125, W: 520, H: 340, tall: false },
  tall: { A: { x: 140, y: 145 }, B: { x: 140, y: 280 }, R: 105, W: 280, H: 476, tall: true },
};
let G = GEO.wide;
const gAxes = () => { const dx = G.B.x - G.A.x, dy = G.B.y - G.A.y, d = Math.hypot(dx, dy), u = { x: dx / d, y: dy / d };
  return { u, v: { x: -u.y, y: u.x }, mid: { x: (G.A.x + G.B.x) / 2, y: (G.A.y + G.B.y) / 2 }, half: Math.sqrt(G.R * G.R - d * d / 4) }; };
function buildBalls() {
  S.balls = []; S.bid = 0;
  for (const p of factor(S.a)) S.balls.push({ id: S.bid++, p, side: 'A', x: null, y: null });
  for (const p of factor(S.b)) S.balls.push({ id: S.bid++, p, side: 'B', x: null, y: null });
}
function zoneAt(x, y) {
  const inA = Math.hypot(x - G.A.x, y - G.A.y) < G.R, inB = Math.hypot(x - G.B.x, y - G.B.y) < G.R;
  return inA && inB ? 'M' : inA ? 'A' : inB ? 'B' : null;
}
function slots() {
  const pos = {}, { u, v, mid } = gAxes();
  for (const side of ['A', 'M', 'B']) {
    const list = S.balls.filter(b => b.side === side).sort((x, y) => x.p - y.p || x.id - y.id), n = list.length;
    const cols = n > 4 ? 2 : 1, per = Math.ceil(n / cols);
    list.forEach((b, i) => {
      const c = Math.floor(i / per), r = i % per, rows = Math.min(per, n - c * per), off = (r - (rows - 1) / 2) * 36;
      let base, along;
      if (side === 'M') { base = mid; along = cols === 2 ? (c ? 16 : -16) : 0; }
      else if (side === 'A') { base = G.A; along = -20 - c * 40; }
      else { base = G.B; along = 20 + c * 40; }
      pos[b.id] = { x: base.x + u.x * along + v.x * off, y: base.y + u.y * along + v.y * off };
    });
  }
  return pos;
}
function moveBall(ball, zone) {
  if (!zone || zone === ball.side) return false;
  if (zone === 'M') {
    const other = ball.side === 'A' ? 'B' : 'A', mate = S.balls.find(b => b.side === other && b.p === ball.p);
    if (!mate) { const num = other === 'A' ? S.a : S.b; toast(num % ball.p ? `В разложении числа ${num} нет множителя ${ball.p}. Он не общий.` : `Все множители ${ball.p} числа ${num} уже в середине. Этот — лишний.`); return false; }
    S.balls.splice(S.balls.indexOf(mate), 1); ball.side = 'M';
    update(); return true;
  }
  if (ball.side === 'M') {
    S.balls.push({ id: S.bid++, p: ball.p, side: zone === 'A' ? 'B' : 'A', x: ball.x, y: ball.y });
    ball.side = zone; update(); return true;
  }
  toast('Множитель одного числа нельзя переложить в другое. Общие кладите в середину.');
  return false;
}
function tapBall(ball) { if (ball.side === 'M') moveBall(ball, 'A'); else moveBall(ball, 'M'); }

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'order') {
    const ops = S.tk.filter(t => t.t === 'o').length;
    return { kind: 'order', done: S.tk.length === 1, value: S.tk.length === 1 ? S.tk[0].v : null, step: S.steps.length, total: S.steps.length + ops, mist: S.mist };
  }
  if (id === 'div') return { kind: 'div', n: S.n, k: S.k, q: Math.floor(S.n / S.k), r: S.n % S.k, ds: digitSum(S.n), last: S.n % 10 };
  if (id === 'prime') {
    let comp = 0, crossed = 0;
    for (let n = 4; n <= 100; n++) if (!isPrime(n)) { comp++; if (S.cross[n]) crossed++; }
    return { kind: 'prime', primes: Object.keys(S.pr).length, crossed, comp, left: comp - crossed };
  }
  const by = s => S.balls.filter(b => b.side === s).map(b => b.p).sort((x, y) => x - y);
  const A = by('A'), B = by('B'), M = by('M'), common = commonOf(S.a, S.b), g = gcd(S.a, S.b);
  return { kind: 'gcd', a: S.a, b: S.b, A, B, M, common, complete: M.length === common.length, g, l: S.a * S.b / g };
}

function tokW(t, fs) { const cw = fs * 0.6; return t.t === 'n' ? String(t.v).length * cw : t.t === 'o' ? fs * 1.15 : cw * 0.8; }

    h += `<g data-drag="c${n}"${part ? ` data-part="${part}"` : ''}><rect x="${x + 1.5}" y="${y + 1.5}" width="${C - 3}" height="${C - 3}" rx="6" fill="${lastP ? 'rgba(255,181,71,.16)' : flash ? 'rgba(114,212,232,.18)' : '#141d2d'}" stroke="${flash ? '#72d4e8' : '#26324a'}" stroke-width="${flash ? 2 : 1}"${n === 1 ? ' stroke-dasharray="3 3"' : ''}/>`;
    if (pr) h += `<circle cx="${cx}" cy="${cy}" r="14" fill="none" stroke="${pcol(n)}" stroke-width="${S.pr[n] ? 2.4 : 1.6}"${S.pr[n] ? '' : ' stroke-dasharray="3 2"'}/>`;
    h += txt(cx, cy + 5, n, 14, cr ? '#56627d' : n === 1 ? '#8b96ad' : '#e8ecf4', pr ? 'font-weight="600"' : '');

    }
    h += `</g>`;
  }
  return h + '</g>';
}

function drawGcd() {

    h += cap(260, 18, 'ОБЩИЕ');
  }

    const p = pos[b.id]; if (b.x === null) { b.x = p.x; b.y = p.y; }
    const parts = (b.side === 'M' ? 'mid ' : b.side === 'A' ? 'circA ' : 'circB ') + 'all';
    h += `<g data-drag="b${b.id}" data-part="${parts}"><circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="22" fill="transparent"/><circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="15" fill="${pcol(b.p)}" stroke="${INK}" stroke-width="2"/>${txt(b.x, b.y + 5, b.p, 14, '#0b1019', 'font-weight="600"')}</g>`;
  }
  if (m.complete && m.common.length) {
    h += `<text x="${G.W / 2}" y="${G.H - 32}" font-size="15" fill="#86e0a8" text-anchor="middle" data-part="mid">НОД = ${dotJoin(m.M)} = ${m.g}</text>`;
    h += `<text x="${G.W / 2}" y="${G.H - 8}" font-size="15" fill="#e8ecf4" text-anchor="middle" data-part="all">НОК = ${dotJoin(m.A.concat(m.M, m.B))} = ${m.l}</text>`;
  } else if (!m.common.length) {
    h += `<text x="${G.W / 2}" y="${G.H - 22}" font-size="${G.tall ? 11 : 13}" fill="#8b96ad" text-anchor="middle">У чисел нет общих простых множителей: НОД = 1</text>`;
  } else {
    h += `<text x="${G.W / 2}" y="${G.H - 22}" font-size="${G.tall ? 11 : 13}" fill="#8b96ad" text-anchor="middle">В середине: ${m.M.length ? dotJoin(m.M) : 'пусто'}. Все ли общие тут?</text>`;
  }
  return h;
}

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'order' ? drawOrder(t) : id === 'div' ? drawDiv() : id === 'prime' ? drawPrime(t) : drawGcd();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) scene.insertAdjacentHTML('beforeend', `<rect x="${(bb.x0 - 6).toFixed(1)}" y="${(bb.y0 - 6).toFixed(1)}" width="${(bb.x1 - bb.x0 + 12).toFixed(1)}" height="${(bb.y1 - bb.y0 + 12).toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`);

let VB = { x: 0, y: 0, w: 520, h: 330 }, dirty = true;

// ---------- pointer: taps and drags ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const ballOf = id => S.balls.find(b => 'b' + b.id === id);
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const id = el.dataset.drag; e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  drag = { id, x: e.clientX, y: e.clientY, moved: false };
  const p = toSvg(e);
  if (id === 'knob' || id === 'track') { scene.classList.add('grabbing'); setN(xToN(p.x)); drag.moved = true; }
  const b = ballOf(id); if (b) { scene.classList.add('grabbing'); drag.dx = b.x - p.x; drag.dy = b.y - p.y; }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (!drag.moved) return;
  const p = toSvg(e);
  if (drag.id === 'knob' || drag.id === 'track') { setN(xToN(p.x)); return; }
  const b = ballOf(drag.id); if (b) { b.x = clamp(p.x + drag.dx, VB.x + 12, VB.x + VB.w - 12); b.y = clamp(p.y + drag.dy, VB.y + 12, VB.y + VB.h - 12); dirty = true; }
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) { dirty = true; return; }
  const b = ballOf(d.id);
  if (!d.moved) {
    if (d.id.startsWith('op')) clickOp(+d.id.slice(2));
    else if (/^k\d/.test(d.id)) setK(+d.id.slice(1));
    else if (/^c\d/.test(d.id)) tapCell(+d.id.slice(1));
    else if (b) tapBall(b);
  } else if (b) moveBall(b, zoneAt(b.x, b.y));
  dirty = true;
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function setN(n) { n = clamp(Math.round(n), 1, NMAX); if (n !== S.n) { S.n = n; update(); } }
function setK(k) { if (k !== S.k) { S.k = k; update(); } }

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (id === 'gcd') {
    const pos = slots();
    for (const b of S.balls) {
      if (drag && drag.id === 'b' + b.id && drag.moved) continue;
      const p = pos[b.id]; if (b.x === null) { b.x = p.x; b.y = p.y; }
      const k = reduce ? 1 : Math.min(1, dt * 10), nx = b.x + (p.x - b.x) * k, ny = b.y + (p.y - b.y) * k;
      if (Math.abs(nx - b.x) + Math.abs(ny - b.y) > 0.05) anim = true;
      b.x = Math.abs(p.x - nx) < 0.05 ? p.x : nx; b.y = Math.abs(p.y - ny) < 0.05 ? p.y : ny;
    }
  }
  if (id === 'prime') for (const n in S.crossT) if (t - S.crossT[n] < 200) { anim = true; break; }
  if (id === 'order' && ((S.bad && t - S.bad.t < 800) || S.tk.some(k => k.fresh && t - k.fresh < 1400))) anim = true;
  if (id === 'prime' && S.flash && t - S.flash.t < 1700) anim = true;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

      <div class="ctl"><div class="lbl">Готовые пары</div><div class="chips" id="pairChips">${PAIRS.map(([a, b]) => `<button data-p="${a}-${b}">${a} и ${b}</button>`).join('')}</div></div>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inN', e => setN(+e.target.value));
  on('#inP', e => { S.probe = +e.target.value; update(); });
  on('#inA', e => { setPair(+e.target.value, S.b); renderTools(); update(); });
  on('#inB', e => { setPair(S.a, +e.target.value); renderTools(); update(); });
  el.querySelectorAll('#exChips button').forEach(b => b.onclick = () => act('ex-' + b.dataset.i));
  el.querySelectorAll('#kChips button').forEach(b => b.onclick = () => setK(+b.dataset.k));
  el.querySelectorAll('#pairChips button').forEach(b => b.onclick = () => act('pair-' + b.dataset.p));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.innerHTML = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'order') {
    set('#r1', m.done ? 'все' : `${m.step + 1} / ${m.total}`); set('#r2', String(m.mist)); set('#r3', m.done ? String(m.value) : '—');
    el.querySelectorAll('#exChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === S.ex));
  }
  if (m.kind === 'div') {
    set('#r1', String(m.q)); set('#r2', String(m.r)); set('#r3', String(m.ds));
    set('#inNO', String(m.n)); val('#inN', m.n);
    el.querySelectorAll('#kChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.k === S.k));
    set('#signs', signsHTML(m.n));
  }
  if (m.kind === 'prime') {
    set('#r1', String(m.primes)); set('#r2', `${m.crossed}/${m.comp}`); set('#r3', String(m.left));
    set('#inPO', String(S.probe)); val('#inP', S.probe);
    const n = S.probe, d = divisors(n);
    set('#probe', step('делители', d.join(', ')) + step('сколько делителей', String(d.length)) + step('вывод', n === 1 ? 'ни простое, ни составное' : d.length === 2 ? 'простое' : `составное: ${dotJoin(factor(n))}`, 'sum'));
  }
  if (m.kind === 'gcd') {
    set('#r1', m.complete && m.common.length ? String(m.g) : m.common.length ? '?' : '1'); set('#r2', m.complete ? String(m.l) : '?'); set('#r3', `${m.M.length}`);
    set('#inAO', String(m.a)); set('#inBO', String(m.b)); val('#inA', m.a); val('#inB', m.b);
    el.querySelectorAll('#pairChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === `${m.a}-${m.b}`));
  }
}
function signsHTML(n) {
  const l = n % 10, s = digitSum(n), sum = String(n).split('').join(' + ');
  return step('на 2: последняя цифра ' + l, (l % 2 ? 'нечётная → ' : 'чётная → ') + yn(n % 2 === 0)) +
    step('на 5: последняя цифра ' + l, (l === 0 || l === 5 ? '0 или 5 → ' : 'не 0 и не 5 → ') + yn(n % 5 === 0)) +
    step('на 10: последняя цифра ' + l, yn(n % 10 === 0)) +
    step(`на 3: ${sum} = ${s}`, `${s} : 3 → ` + yn(n % 3 === 0)) +
    step(`на 9: сумма цифр ${s}`, `${s} : 9 → ` + yn(n % 9 === 0));
}

      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  if (m.kind === 'order') {
    let h = `<h2>Вычисление по шагам</h2><div class="formula">( ) → · : → + −</div><p class="note">Сначала скобки, потом умножение и деление, потом сложение и вычитание. Внутри одной ступени — слева направо.</p><h3>Пример</h3><div class="steps">${step('выражение', EXPRS[S.ex])}</div><h3>Сделано</h3>`;
    h += S.steps.length ? `<div class="steps">` + S.steps.map((s, i) => step(`действие ${i + 1}`, `${s.a} ${s.o} ${s.b} = ${s.r}`)).join('') + (m.done ? step('ответ', String(m.value), 'sum') : '') + `</div>` : `<p class="note">Пока ничего. Какое действие здесь выполняется первым?</p>`;
    if (!m.done) h += `<p class="note" style="margin-top:10px">Осталось действий: ${m.total - m.step}. Какое из них по правилам идёт следующим — решите сами.</p>`;
    else h += `<p class="note" style="margin-top:10px">Ошибок по ходу: ${m.mist}. ${m.mist ? 'Попробуйте другой пример без единой ошибки.' : 'Чисто сработано!'}</p>`;
    return h;
  }
  if (m.kind === 'div') {
    return `<h2>Деление с остатком</h2><div class="formula">a = b · q + r,  r &lt; b</div><p class="note">a — делимое, b — делитель, q — неполное частное, r — остаток. Если r = 0, то a делится на b.</p><h3>Сейчас</h3><div class="steps">` +
      step(`${m.n} : ${m.k}`, `${m.q} (ост. ${m.r})`) + step('проверка', `${m.k} · ${m.q} + ${m.r} = ${m.k * m.q + m.r}`) +
      step(`${m.n} делится на ${m.k}?`, yn(m.r === 0), 'sum') + `</div><h3>Признаки делимости</h3><div class="steps">` + signsHTML(m.n) + `</div>` +
      `<p class="note" style="margin-top:10px">На 6 делится число, которое делится и на 2, и на 3. На 4 — если число из двух последних цифр делится на 4.</p>`;
  }
  if (m.kind === 'prime') {
    const n = S.probe, d = divisors(n);
    let h = `<h2>Почему решето работает</h2><div class="formula">простое: делители 1 и p</div><p class="note">Самое маленькое невычеркнутое число не делится ни на одно меньшее, кроме 1. Значит, оно простое.</p>`;
    h += `<h3>Когда можно остановиться</h3><div class="steps">` + step('у составного n ≤ 100 есть делитель', 'не больше 10') + step('почему', 'если n = a · b и a, b > 10, то n > 100') + step('простые до 10', '2, 3, 5, 7', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Поэтому после 2, 3, 5 и 7 всё, что не вычеркнуто, — простые числа. До 100 их 25.</p>`;
    h += `<h3>Число ${n}</h3><div class="steps">` + step('делители', d.join(', ')) + step('вывод', n === 1 ? 'ни простое, ни составное' : d.length === 2 ? 'простое' : `${n} = ${dotJoin(factor(n))}`, 'sum') + `</div><p class="note" style="margin-top:8px">Нажмите на число в таблице или возьмите ползунок на вкладке «Схема».</p>`;
    return h;
  }
  let h = `<h2>НОД и НОК</h2><div class="formula">НОД · НОК = a · b</div><h3>Разложение</h3><div class="steps">` +
    step(String(m.a), dotJoin(factor(m.a))) + step(String(m.b), dotJoin(factor(m.b))) + `</div>`;
  if (!m.common.length) return h + `<p class="note" style="margin-top:10px">Общих простых множителей нет, такие числа называют взаимно простыми: НОД = 1, НОК = ${m.a} · ${m.b} = ${m.l}.</p>`;
  if (!m.complete) return h + `<p class="note" style="margin-top:10px">Соберите в середину все общие множители — тогда здесь появится расчёт НОД и НОК.</p>`;
  h += `<h3>Ответ</h3><div class="steps">` + step('общие множители', dotJoin(m.M)) + step('НОД', `${dotJoin(m.M)} = ${m.g}`, 'sum') +
    step('НОК', `${dotJoin(m.A.concat(m.M, m.B))} = ${m.l}`, 'sum') + step('проверка', `${m.g} · ${m.l} = ${m.g * m.l} = ${m.a} · ${m.b}`) + `</div>`;
  h += `<h3>Задачи</h3><p class="note">Есть ${m.a} конфет и ${m.b} мандаринов. Наибольшее число одинаковых подарков без остатка — ${m.g}: в каждом ${m.a / m.g} конфет и ${m.b / m.g} мандаринов.</p>`;
  h += `<p class="note">Один автобус приходит на остановку каждые ${m.a} минут, другой — каждые ${m.b}. Если они пришли вместе, то снова встретятся через ${m.l} минут.</p>`;
  return h;
}

function renderMeter(m) {

}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {

  S.lesson = i; S.hl = null; drag = null;

}

    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    order: 'Почему умножение выполняют раньше сложения?', div: 'Почему признак делимости на 3 работает через сумму цифр?',
    prime: 'Почему 1 не простое число?', gcd: 'Чем НОД отличается от НОК?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
