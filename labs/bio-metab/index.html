<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: обмен веществ — ферменты, фотосинтез, клеточное дыхание и АТФ.">
<title>Обмен веществ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M14 8C26 12 14 20 26 24S14 32 26 34" fill="none" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><path d="M26 8C14 12 26 20 14 24S26 32 14 34" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round"/><path d="M16 13h8M17 20h6M16 27h8" stroke="var(--fg)" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Обмен</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const pct = x => Math.round(x * 100) + ' %';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-metab';

// ---------- models ----------
// Enzymes: simplified school model. Below the optimum — rule of van 't Hoff (×2 per 10 °C), above 37 °C — denaturation, 0 at 60 °C.
const ENZ = {
  amyl: { name: 'Амилаза слюны', short: 'амилаза', sub: 'крахмал', prod: 'мальтоза', pH: 6.8, where: 'во рту, где среда почти нейтральная', unit: 'hex', col: '#8fd6a8' },
  peps: { name: 'Пепсин желудка', short: 'пепсин', sub: 'белок', prod: 'короткие пептиды', pH: 2.0, where: 'в желудке, где соляная кислота делает среду очень кислой', unit: 'ball', col: '#f2a7c3' },
};
const T_OPT = 37, T_DEAD = 60;
const fT = T => T <= T_OPT ? Math.pow(2, (T - T_OPT) / 10) : Math.max(0, 1 - Math.pow((T - T_OPT) / (T_DEAD - T_OPT), 2));
const fP = (pH, opt) => Math.exp(-Math.pow((pH - opt) / 1.5, 2));

// Photosynthesis of Elodea: light falls off as 1/d², saturation by light and by CO₂.
const FILT = {
  white: { name: 'Белый', k: 1, col: '#fff4c2' },
  red: { name: 'Красный', k: 0.9, col: '#ff6b5a' },
  blue: { name: 'Синий', k: 0.8, col: '#6b95ff' },
  green: { name: 'Зелёный', k: 0.15, col: '#5fd16f' },
};
const CO2 = {
  none: { name: 'Кипячёная вода', note: 'CO₂ почти нет', k: 0.05 },
  norm: { name: 'Обычная вода', note: 'немного CO₂', k: 0.4 },
  soda: { name: 'Вода + сода', note: 'NaHCO₃ даёт много CO₂', k: 1.2 },
};
function photo(d, f, c) {
  const I = Math.pow(10 / d, 2) * FILT[f].k, C = CO2[c].k;
  const r = 60 * I / (I + 0.35) * C / (C + 0.35);
  return { I, C, r, n: Math.round(r) };
}

// Respiration (school numbers): glycolysis 2 АТФ, oxygen stage 36 АТФ.
const DUR = { aer: 3.4, an: 2.2 };
// ATP jobs
const POOL = 6, NEED = { mus: 3, pump: 2, rib: 4 };
const JOB = { mus: { name: 'Сокращение мышцы', short: 'Мышца' }, pump: { name: 'Насос ионов', short: 'Насос' }, rib: { name: 'Сборка белка', short: 'Рибосома' } };

const LESSONS = [
  { id: 'enz', title: 'Ферменты — ускорители реакций',
    text: ['Ферменты — это белки-катализаторы. Они ускоряют реакции в клетке в миллионы раз, а сами при этом не расходуются. Без них обед переваривался бы годами.',
           'У каждого фермента есть активный центр — «карман», в который входит только свой субстрат, как ключ в замок. Амилаза слюны расщепляет крахмал, пепсин желудка — белки.',
           'Фермент — белок, поэтому он чувствителен к условиям. Холод замедляет его работу. Сильный нагрев и неподходящий pH ломают форму белка — это денатурация, и активный центр перестаёт подходить к субстрату.'],
    why: 'Технолог хлебозавода и пивовар управляют ферментами дрожжей и солода — от этого зависят вкус и себестоимость продукции. Ферменты в стиральных порошках расщепляют пятна при 30–40 °C, поэтому такие порошки не используют для кипячения. Врач-лаборант по ферментам крови (АЛТ, АСТ) узнаёт, здорова ли печень. А сыр делают с сычужным ферментом — он створаживает молоко.',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  Object.assign(S, {
    enz: 'amyl', T: 20, pH: 7, ph: 0, cuts: 0,
    d: 40, filt: 'white', co2: 'norm', recs: [], bub: [], bacc: 0,
    o2: true, run: null, res: { aer: null, an: null },
    atp: POOL, jobs: { mus: 0, pump: 0, rib: 0 }, kj: 0, glu: 0, flash: null, pp: null, charge: 0,
  });
}
resetLesson();

function model() {
  const id = LID();
  if (id === 'enz') { const e = ENZ[S.enz], ft = fT(S.T), fp = fP(S.pH, e.pH); return { kind: 'enz', enz: S.enz, e, T: S.T, pH: S.pH, ft, fp, rate: ft * fp }; }
  if (id === 'photo') {
    const p = photo(S.d, S.filt, S.co2);
    const white = new Set(S.recs.filter(r => r.f === 'white').map(r => r.d)).size;
    return Object.assign({ kind: 'photo', white, green: S.recs.some(r => r.f === 'green') }, p);
  }
  if (id === 'resp') return { kind: 'resp', aer: S.res.aer !== null, an: S.res.an !== null, atpNow: respATP(performance.now()) };
  const adp = POOL - S.atp, allDone = Object.keys(NEED).every(k => S.jobs[k] >= NEED[k]);
  return { kind: 'atp', atp: S.atp, adp, allDone, spent: S.jobs.mus + S.jobs.pump + S.jobs.rib };
}

// ---------- scene ----------
const scene = $('#scene');
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const hexPath = (cx, cy, r) => { let d = ''; for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); } return d + 'Z'; };
const PAL = ['#c9151e', '#e0262a', '#ec4527', '#f37526', '#f8a11f', '#fbc81b', '#e9e21f', '#7cc443', '#33a84f', '#1b9c8c', '#2179bb', '#2f55a3', '#4a3c97', '#5e2c89', '#4a1d6e'];
const RND = []; { let s = 11; for (let i = 0; i < 200; i++) { s = (s * 16807) % 2147483647; RND.push(s / 2147483647); } }

function floor() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="2360" fill="url(#tile)"/>
    <rect x="-2000" y="360" width="4520" height="1200" fill="#1a2232"/>
    <rect x="-2000" y="358" width="4520" height="4" fill="#2c3954"/>`;
}

// ---- lesson 1: enzymes ----
const TH = { x: 60, top: 130, bot: 340, k: 210 / 80 };            // thermometer 0…80 °C
const PB = { x0: 170, w: 300, y: 372 };                            // pH bar 0…14
const VC = { x: 320, y: 222, r: 118 };                             // magnified view
const EZ = { x: 320, y: 264, R: 50 };
function enzymePath(dist) {
  let d = ''; const N = 64, notch = 20 * (1 - dist);
  for (let i = 0; i < N; i++) {
    let da = i / N * 2 * Math.PI; if (da > Math.PI) da -= 2 * Math.PI;
    const a = -Math.PI / 2 + da;
    let r = EZ.R * (1 + 0.05 * Math.sin(3 * a + 0.7)) + dist * (RND[i] - 0.5) * 22;
    if (Math.abs(da) < 0.42) r -= notch * Math.cos(da / 0.42 * Math.PI / 2);
    d += (i ? 'L' : 'M') + (EZ.x + r * Math.cos(a)).toFixed(1) + ' ' + (EZ.y + r * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
const unitSVG = (kind, x, y, col, op = 1) => kind === 'hex'
  ? `<path d="${hexPath(x, y, 9)}" fill="${col}" stroke="${INK}" stroke-width="1.4" opacity="${op}"/>`
  : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8.5" fill="${col}" stroke="${INK}" stroke-width="1.4" opacity="${op}"/>`;
const pairSVG = (kind, x, y, col, op = 1) => `<path d="M${(x - 11).toFixed(1)} ${y.toFixed(1)}h22" stroke="#e8ecf4" stroke-width="3" opacity="${op}"/>` + unitSVG(kind, x - 11, y, col, op) + unitSVG(kind, x + 11, y, col, op);

function enzScene(t) {
  const m = model(), e = m.e;
  let h = floor();
  // thermometer
  const ty = TH.bot - S.T * TH.k;
  h += `<g data-drag="therm"><rect x="30" y="108" width="72" height="262" fill="transparent"/>`;
  h += ol(`M53 ${TH.top - 12}V344A12 12 0 1 0 67 344V${TH.top - 12}A7 7 0 0 0 53 ${TH.top - 12}Z`, 'rgba(200,225,255,.08)', '#9fb3d1', 2);
  h += `<rect x="57" y="${ty.toFixed(1)}" width="6" height="${(350 - ty).toFixed(1)}" fill="#ff6b5a"/><circle cx="60" cy="352" r="9" fill="#ff6b5a"/>`;
  for (let v = 0; v <= 80; v += 10) { const y = TH.bot - v * TH.k; h += `<path d="M67 ${y.toFixed(1)}h6" stroke="#c8d6ec" stroke-width="1"/><text x="76" y="${(y + 3).toFixed(1)}" font-size="8" fill="#8b96ad">${v}</text>`; }
  const y37 = TH.bot - 37 * TH.k;
  h += `<path d="M44 ${y37.toFixed(1)}h9" stroke="#86e0a8" stroke-width="1.6"/><text x="42" y="${(y37 + 3).toFixed(1)}" font-size="7.5" fill="#86e0a8" text-anchor="end">37</text>`;
  h += `<rect x="48" y="${(ty - 5).toFixed(1)}" width="24" height="10" rx="3" fill="#ffb547" stroke="${INK}" stroke-width="1.2"/>`;
  h += `<text x="60" y="${(TH.top - 24)}" font-size="10" fill="#e8ecf4" text-anchor="middle">${S.T} °C</text></g>`;
  // pH bar
  const sw = PB.w / 14;
  h += `<g data-drag="phbar"><rect x="${PB.x0 - 14}" y="346" width="${PB.w + 28}" height="56" fill="transparent"/>`;
  for (let i = 0; i < 14; i++) h += `<rect x="${(PB.x0 + i * sw).toFixed(1)}" y="${PB.y}" width="${(sw + 0.4).toFixed(1)}" height="10" fill="${PAL[i]}"/>`;
  h += `<rect x="${PB.x0}" y="${PB.y}" width="${PB.w}" height="10" fill="none" stroke="${INK}" stroke-width="1.5" rx="2"/>`;
  for (const v of [0, 2, 4, 6, 7, 8, 10, 12, 14]) h += `<text x="${(PB.x0 + v * sw).toFixed(1)}" y="395" font-size="8" fill="#8b96ad" text-anchor="middle">${v}</text>`;
  const px = PB.x0 + S.pH * sw;
  h += `<path d="M${px.toFixed(1)} 371l-7-11h14z" fill="#e8ecf4" stroke="${INK}" stroke-width="1.3"/><text x="${px.toFixed(1)}" y="355" font-size="9" fill="#e8ecf4" text-anchor="middle">pH ${fmt(S.pH, 1)}</text></g>`;
  // magnified view
  h += `<defs><clipPath id="vc"><circle cx="${VC.x}" cy="${VC.y}" r="${VC.r - 3}"/></clipPath></defs>`;
  h += `<circle cx="${VC.x}" cy="${VC.y}" r="${VC.r}" fill="#0f1d30"/>`;
  h += `<g clip-path="url(#vc)">`;
  // idle substrate around
  for (let i = 0; i < 4; i++) {
    const bx = [248, 395, 236, 404][i], by = [168, 182, 300, 300][i];
    const dx = reduce ? 0 : Math.sin(t / 800 + i * 2) * 4, dy = reduce ? 0 : Math.cos(t / 950 + i) * 3;
    h += pairSVG(e.unit, bx + dx, by + dy, e.col, 0.55);
  }
  const dist = clamp(Math.max(S.T > 40 ? (S.T - 40) / 20 : 0, (1 - m.fp) * 0.85), 0, 1);
  h += `<g data-hit="enzyme">` + ol(enzymePath(dist), '#7f74d9', '#a99ff0', 2) + `<text x="${EZ.x}" y="${EZ.y + 18}" font-size="9" fill="#e8ecf4" text-anchor="middle">${e.short}</text></g>`;
  // the reacting substrate
  const k = S.cuts * 0.37 % 1, sx = 320 + (k - 0.5) * 140, sy = 132, dock = { x: EZ.x, y: EZ.y - EZ.R + 10 };
  let p = S.ph;
  if (m.rate < 0.03) {
    const j = reduce ? 0 : Math.sin(t / 300) * 6;
    h += pairSVG(e.unit, lerp(sx, dock.x, 0.6), lerp(sy, dock.y, 0.6) - 8 + j, e.col);
  } else if (p < 0.4) {
    const q = p / 0.4, qq = q * q * (3 - 2 * q);
    h += pairSVG(e.unit, lerp(sx, dock.x, qq), lerp(sy, dock.y, qq), e.col);
  } else if (p < 0.6) {
    h += `<circle cx="${dock.x}" cy="${dock.y}" r="20" fill="#ffb547" opacity="${(0.25 * Math.sin((p - 0.4) / 0.2 * Math.PI)).toFixed(2)}"/>` + pairSVG(e.unit, dock.x, dock.y, e.col);
  } else {
    const q = (p - 0.6) / 0.4, op = 1 - q * 0.8;
    h += unitSVG(e.unit, lerp(dock.x - 11, 252, q), lerp(dock.y, 150, q), e.col, op) + unitSVG(e.unit, lerp(dock.x + 11, 388, q), lerp(dock.y, 150, q), e.col, op);
  }
  h += `</g>`;
  h += ol(`M${VC.x - VC.r} ${VC.y}a${VC.r} ${VC.r} 0 1 0 ${2 * VC.r} 0a${VC.r} ${VC.r} 0 1 0 ${-2 * VC.r} 0Z`, 'none', '#56627d', 4);
  h += `<text x="${VC.x}" y="${VC.y - VC.r + 22}" font-size="9" fill="#8b96ad" text-anchor="middle">${e.short} + ${e.sub} → ${e.prod}</text>`;
  const st = S.T >= T_DEAD ? 'денатурация: белок потерял форму' : m.rate < 0.03 ? 'фермент почти не работает' : `расщеплено молекул: ${S.cuts}`;
  h += `<text x="${VC.x}" y="${VC.y + VC.r - 18}" font-size="9" fill="${m.rate < 0.03 ? '#ff8a73' : '#86e0a8'}" text-anchor="middle">${st}</text>`;
  return h;
}

  if (d.id === 'glu') { const g = S.gp; S.gp = null; if (!cancel && (!d.moved || (g && inCell(g)))) startRun(d.moved ? g : null); else if (!cancel && d.moved) toast('Отпустите глюкозу внутри клетки.'); }
  if (d.id === 'phos') {
    const pp = S.pp; S.pp = null;
    if (!cancel && d.moved && pp) { const st = Object.keys(ST).find(k => { const [x, y, w, hh] = ST[k]; return pp.x > x - 6 && pp.x < x + w + 6 && pp.y > y - 10 && pp.y < y + hh + 6; }); if (st) spend(st); else toast('Отпустите фосфат на одну из работ внизу.'); }
    else if (!cancel && !d.moved) toast('Тащите фосфат на работу или нажмите на работу.');
  }
  if (!cancel && d.id.startsWith('hit:') && !(p && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8)) hit(d.id.slice(4));
  dirty = true;
}
scene.addEventListener('pointerup', e => endDrag(false, e));
scene.addEventListener('pointercancel', () => endDrag(true));

function hit(h) {
  const id = LID();
  if (id === 'resp' && h === 'o2') return act('o2');
  if (id === 'atp' && h === 'mito') return act('mito');
  if (id === 'atp' && h.startsWith('job-')) return spend(h.slice(4));
  if (id === 'atp' && h === 'atp') return toast('Оторвать можно только крайний фосфат — тащите его.');
  if (id === 'photo' && h === 'plant') return toast(`Элодея выделяет ${model().n} пузырьков кислорода в минуту.`);
  if (id === 'enz' && h === 'enzyme') return toast(model().rate < 0.03 ? 'Фермент сейчас почти не работает. Почему?' : 'Это фермент: в его «кармане» — активном центре — режется субстрат.');
}

function startRun(at) {
  const t = performance.now();
  if (S.run && !S.run.fin) { toast('Подождите, предыдущая молекула ещё расщепляется.'); return; }
  const p = at || { x: GSRC.x, y: GSRC.y };
  S.run = { o2: S.o2, t0: reduce ? t - 1e6 : t, x0: p.x, y0: p.y, fin: false };
  update();
}
function finishRun() {
  const r = S.run; r.fin = true;
  S.res[r.o2 ? 'aer' : 'an'] = r.o2 ? 38 : 2;
  toast(r.o2 ? 'С кислородом: 2 + 36 = 38 АТФ, а ещё CO₂ и вода.' : 'Без кислорода: только 2 АТФ и молочная кислота.');
  update();
}
function spend(st) {
  if (S.jobs[st] >= NEED[st]) { toast(`«${JOB[st].name}» уже выполнено.`); return; }
  if (S.atp <= 0) { toast('АТФ кончились — остался один АДФ. Нажмите на митохондрию, чтобы зарядить.'); return; }
  S.atp--; S.jobs[st]++; S.kj += 40; S.flash = { st, t: performance.now() };
  if (S.jobs[st] === NEED[st]) toast(`Готово: ${JOB[st].name.toLowerCase()}. Потрачено ${NEED[st]} АТФ.`);
  update();
}

let last = performance.now(), lastDraw = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  let anim = false;
  if (id === 'enz') {
    const m = model();
    if (m.rate >= 0.03) {
      if (reduce) S.ph = 0.5;
      else { S.ph += dt * m.rate * 0.9; if (S.ph >= 1) { S.ph -= 1; S.cuts++; } }
    }
    if (reduce && m.rate >= 0.03 && t - lastDraw > 1000 / Math.max(0.2, m.rate * 0.9)) S.cuts++;
    anim = !reduce;
  }
  if (id === 'photo' && !reduce) {
    const n = photo(S.d, S.filt, S.co2).r;
    S.bacc += dt * n / 60 * 2;                                       // animation is 2× faster than real time
    while (S.bacc >= 1) { S.bacc -= 1; S.bub.push({ x: PLX + (RND[S.bub.length % 50] - 0.5) * 4, y: 252, r: 2.2 + RND[(S.bub.length + 7) % 50] * 1.4 }); }
    for (const b of S.bub) b.y -= dt * 45;
    S.bub = S.bub.filter(b => b.y > BKR.surf + 2);
    anim = true;
  }
  if (id === 'resp') {
    if (S.run && !S.run.fin && (t - S.run.t0) / 1000 >= (S.run.o2 ? DUR.aer : DUR.an)) finishRun();
    if (S.run && !S.run.fin) { anim = true; if (t - lastMeter > 120) { renderMeter(model()); lastMeter = t; } }
    if (S.o2 && !reduce) anim = true;
  }
  if (id === 'atp' && (S.flash || S.charge) && !reduce) anim = true;
  if (S.hl) anim = true;
  if (dirty || (anim && t - lastDraw > 30)) { drawScene(t); dirty = false; lastDraw = t; }
}

function act(a) {
  if (a === 'enz-amyl' || a === 'enz-peps') { S.enz = a.slice(4); renderTools(); buildScheme(); update(); return; }
  if (a === 't-' || a === 't+') { S.T = clamp(S.T + (a === 't+' ? 5 : -5), 0, 80); update(); return; }
  if (a === 'ph-' || a === 'ph+') { S.pH = clamp(Math.round((S.pH + (a === 'ph+' ? 0.5 : -0.5)) * 10) / 10, 0, 14); update(); return; }
  if (a === 'near' || a === 'far') { S.d = clamp(S.d + (a === 'far' ? 5 : -5), 10, 60); update(); return; }
  if (a === 'filt') { const k = Object.keys(FILT); S.filt = k[(k.indexOf(S.filt) + 1) % k.length]; toast(`Фильтр: ${FILT[S.filt].name.toLowerCase()}`); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('filt-')) { S.filt = a.slice(5); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('co2-')) { S.co2 = a.slice(4); buildScheme(); update(); return; }
  if (a === 'rec') {
    const m = model();
    S.recs = S.recs.filter(r => !(r.d === S.d && r.f === S.filt && r.c === S.co2));
    S.recs.push({ d: S.d, f: S.filt, c: S.co2, n: m.n });
    toast(`Записано: ${S.d} см, ${FILT[S.filt].name.toLowerCase()} свет — ${m.n} пуз./мин`);
    update(); return;
  }
  if (a === 'go') return startRun(null);
  if (a === 'o2') { S.o2 = !S.o2; toast(S.o2 ? 'Кислород снова поступает в клетку.' : 'Кислород перекрыт.'); renderTools(); buildScheme(); update(); return; }
  if (a === 'clr') { S.run = null; S.res = { aer: null, an: null }; update(); return; }
  if (a.startsWith('j-')) return spend(a.slice(2));
  if (a === 'mito') {
    if (S.atp >= POOL) { toast('Запас и так полный: все молекулы — АТФ.'); return; }
    S.atp = POOL; S.glu++; S.charge = performance.now();
    toast('Митохондрия расщепила глюкозу: АДФ + Ф → АТФ. Запас снова полный.'); update(); return;
  }
  if (a === 'reset') { S.atp = POOL; S.jobs = { mus: 0, pump: 0, rib: 0 }; S.kj = 0; S.glu = 0; update(); return; }
}

    <div class="row"><button class="ghostbtn" data-a="j-mus">Мышца</button><button class="ghostbtn" data-a="j-pump">Насос</button><button class="ghostbtn" data-a="j-rib">Рибосома</button><button class="ghostbtn" data-a="mito">Зарядить</button></div>`;

function updateScheme(m) {

  const d = el.querySelector('#sDiag'); if (!d) return;
  if (m.kind === 'enz') {
    d.innerHTML = curveSVG(T => fT(T) * m.fp, 0, 80, S.T, 'температура, °C', [0, 20, 37, 60, 80], 37) + '<div style="height:6px"></div>' + curveSVG(p => m.ft * fP(p, m.e.pH), 0, 14, S.pH, 'pH', [0, 2, 4, 7, 10, 14], m.e.pH);
    set('#r1', pct(m.rate)); set('#r2', fmt(m.ft, 2)); set('#r3', fmt(m.fp, 2));

      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +

function calcHTML(m) {
  const id = LID();
  if (id === 'enz') {
    const tl = S.T <= T_OPT ? `2^((${S.T} − 37) / 10) = ${fmt(m.ft, 2)}` : `1 − ((${S.T} − 37) / 23)² = ${fmt(m.ft, 2)}`;
    return `<h2>Скорость реакции</h2><div class="formula">v = v<sub>max</sub> · f(T) · f(pH)</div>
      <p class="note">Учебная модель. Ниже 37 °C работает правило Вант-Гоффа: на каждые 10 °C холоднее — вдвое медленнее. Выше 37 °C белок начинает денатурировать, к 60 °C фермент разрушен.</p>
      <h3>Сейчас: ${m.e.short}</h3><div class="steps">` +
      step('f(T)', tl) + step('оптимум pH', fmt(m.e.pH, 1)) + step('f(pH)', `e^(−((${fmt(S.pH, 1)} − ${fmt(m.e.pH, 1)}) / 1,5)²) = ${fmt(m.fp, 2)}`) +
      step('v / v<sub>max</sub>', `${fmt(m.ft, 2)} × ${fmt(m.fp, 2)} = ${pct(m.rate)}`, 'sum') + `</div>
      <h3>Как рассуждать</h3><div class="steps">` + step('1. Где работает фермент?', m.e.short === 'пепсин' ? 'в желудке' : 'во рту') + step('2. Какая там среда?', 'кислая или нейтральная?') + step('3. Какая температура тела?', 'около 37 °C') + `</div>
      <p class="note" style="margin-top:10px">Нагрев выше оптимума опаснее холода: охлаждённый фермент оживает при нагреве, а денатурированный — уже нет.</p>`;
  }
  if (id === 'photo') {
    const p = m, F = FILT[S.filt];
    return `<h2>Фотосинтез</h2><div class="formula">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</div>
      <p class="note">Свет от лампы расходится во все стороны, поэтому его яркость падает как 1/d²: вдвое дальше — вчетверо меньше света.</p>
      <h3>Сейчас</h3><div class="steps">` +
      step('свет (10 см = 100 %)', `(10 / ${S.d})² × ${fmt(F.k, 2)} = ${fmt(p.I, 3)}`) +
      step('CO₂ в воде', `${CO2[S.co2].name}: ${fmt(p.C, 2)}`) +
      step('v = 60 · I/(I+0,35) · C/(C+0,35)', `${fmt(p.r, 1)} ≈ ${p.n} пуз./мин`, 'sum') + `</div>
      <h3>Лимитирующий фактор</h3><p class="note">Скорость ограничивает то, чего меньше всего. Близко к лампе света много — и добавка CO₂ (соды) поднимает скорость. Далеко от лампы не хватает света, и сода почти не помогает.</p>
      <div class="steps">` + step('O₂ на 1 глюкозу', '6 молекул') + step('CO₂ на 1 глюкозу', '6 молекул') + `</div>`;
  }
  if (id === 'resp') {
    let h = `<h2>Энергетический обмен</h2><div class="formula">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 38 АТФ</div><h3>Этапы</h3><div class="steps">` +
      step('1. гликолиз (цитоплазма, без O₂)', 'C₆H₁₂O₆ → 2 C₃H₄O₃ + 2 АТФ') +
      step('2а. кислородный (митохондрии)', '2 C₃H₄O₃ + 5O₂ → 6CO₂ + 4H₂O + 36 АТФ') +
      step('2б. брожение (нет O₂)', '2 C₃H₄O₃ → 2 C₃H₆O₃ (молочная к-та)') + `</div>`;
    if (S.res.aer !== null && S.res.an !== null) h += `<h3>Сравнение</h3><div class="steps">` + step('с кислородом', '2 + 36 = 38 АТФ') + step('без кислорода', '2 АТФ') + step('выгода', '38 / 2 = 19 раз', 'sum') + step('запасено с O₂', '38 × 40 = 1520 кДж из 2800 кДж') + step('КПД', '1520 / 2800 ≈ 54 %') + `</div>`;
    else h += `<p class="note" style="margin-top:10px">Проведите оба опыта — здесь появится сравнение.</p>`;
    h += `<p class="note" style="margin-top:10px">По современным данным в клетке выходит около 30–32 АТФ, а не 38: часть энергии тратится на перенос веществ. В школьных задачах используют 38.</p>`;
    return h;
  }
  const spent = m.spent;
  return `<h2>Энергия АТФ</h2><div class="formula">АТФ + H₂O → АДФ + H₃PO₄ + 40 кДж</div><h3>Сейчас</h3><div class="steps">` +
    step('потрачено АТФ', String(spent)) + step('выделилось энергии', `${spent} × 40 = ${S.kj} кДж (на моль)`) +
    step('нужно на все работы', '3 + 2 + 4 = 9 АТФ') + step('было в запасе', `${POOL} АТФ`) +
    step('не хватает без зарядки', `9 − ${POOL} = ${9 - POOL} АТФ`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Поэтому клетка не копит АТФ, а всё время его перезаряжает: человек за сутки «прокручивает» количество АТФ, сравнимое с массой своего тела.</p>`;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'enz') el.innerHTML = `<div class="k">Скорость реакции</div><div class="v ${m.rate >= 0.9 ? 'ok' : m.rate < 0.03 ? 'bad' : ''}">${pct(m.rate)}</div><div class="gauge"><b style="width:${(m.rate * 100).toFixed(1)}%"></b><i style="left:90%"></i></div><div class="lr"><span>${S.T} °C</span><span>pH ${fmt(S.pH, 1)}</span></div>`;
  else if (m.kind === 'photo') el.innerHTML = `<div class="k">Выделение O₂</div><div class="v">${m.n} пуз./мин</div><div class="gauge"><b style="width:${clamp(m.r / 45 * 100, 0, 100).toFixed(1)}%"></b></div><div class="lr"><span>${S.d} см</span><span>замеров ${S.recs.length}</span></div>`;
  else if (m.kind === 'resp') el.innerHTML = `<div class="k">АТФ из 1 глюкозы</div><div class="v ${m.atpNow >= 38 ? 'ok' : ''}">${S.run ? m.atpNow + ' АТФ' : '—'}</div><div class="gauge"><b style="width:${(m.atpNow / 38 * 100).toFixed(1)}%"></b></div><div class="lr"><span>O₂ ${S.o2 ? 'есть' : 'нет'}</span><span>${m.aer ? '✓' : '·'} ${m.an ? '✓' : '·'}</span></div>`;
  else el.innerHTML = `<div class="k">Запас клетки</div><div class="v ${S.atp === 0 ? 'bad' : ''}">${S.atp} АТФ · ${POOL - S.atp} АДФ</div><div class="gauge"><b style="width:${(S.atp / POOL * 100).toFixed(1)}%"></b></div><div class="lr"><span>выделено</span><span>${S.kj} кДж</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Обмен веществ — ваша тема!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'enz') {
    now = `Фермент: ${m.e.name} (субстрат — ${m.e.sub}). Температура ${S.T} °C, pH ${fmt(S.pH, 1)}. Множитель температуры ${fmt(m.ft, 2)}, множитель pH ${fmt(m.fp, 2)}, скорость реакции ${pct(m.rate)} от максимальной.${S.T >= T_DEAD ? ' Фермент денатурирован.' : ''} Модель: ниже 37 °C скорость падает вдвое на каждые 10 °C, выше 37 °C — денатурация, к 60 °C ноль; по pH — колокол вокруг оптимума.`;
    guide = 'Не называй готовые значения температуры и pH для пепсина — наводи вопросами: где работает пепсин, какая там среда, какая температура тела.';
  }
  if (id === 'photo') {
    now = `Опыт с элодеей. Лампа на расстоянии ${S.d} см, фильтр: ${FILT[S.filt].name.toLowerCase()}, вода: ${CO2[S.co2].name.toLowerCase()} (${CO2[S.co2].note}). Относительная освещённость ${fmt(m.I, 3)} (10 см без фильтра = 1). Растение выделяет ${m.n} пузырьков O₂ в минуту. Записи: ${S.recs.map(r => `${r.d} см, ${FILT[r.f].name.toLowerCase()} — ${r.n}/мин`).join('; ') || 'пока нет'}.`;
    guide = 'Помогай заметить закономерность 1/d² и роль лимитирующего фактора, а также почему зелёный свет плохо работает.';
  }
  if (id === 'resp') {
    now = `Клетка с цитоплазмой и митохондрией. Кислород ${S.o2 ? 'поступает' : 'перекрыт'}. ${S.run ? `Последний опыт ${S.run.o2 ? 'с кислородом' : 'без кислорода'}: ${S.run.fin ? 'завершён' : 'идёт'}, получено ${m.atpNow} АТФ.` : 'Глюкоза ещё не отправлена в клетку.'} Выполнено: с кислородом — ${m.aer ? 'да (38 АТФ)' : 'нет'}, без кислорода — ${m.an ? 'да (2 АТФ)' : 'нет'}.`;
    guide = 'Помоги ученику самому сравнить выход АТФ и объяснить, почему без кислорода его так мало.';
  }
  if (id === 'atp') {
    now = `Молекула ${S.atp > 0 ? 'АТФ' : 'АДФ'} на экране. Запас: ${S.atp} АТФ и ${POOL - S.atp} АДФ из ${POOL}. Работы: сокращение мышцы ${S.jobs.mus}/3, насос ионов ${S.jobs.pump}/2, сборка белка ${S.jobs.rib}/4. Выделено ${S.kj} кДж (по 40 кДж на моль АТФ). Митохондрия заряжала АДФ ${S.glu} раз.`;
    guide = 'Если запас кончился, подскажи вопросом, где клетка заряжает АДФ обратно в АТФ.';
  }
  return [
    `Предмет: биология, 10 класс. Тема: «Обмен веществ». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Как помогать: ${guide} Отвечай коротко, задавай наводящие вопросы.`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    enz: 'Почему фермент ломается от нагрева, а от холода нет?', photo: 'Почему листья зелёные, если зелёный свет плохо работает?',
    resp: 'Почему без кислорода получается так мало АТФ?', atp: 'Почему клетка не запасает АТФ впрок?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
