<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 9–10 класс: графы, обход в ширину, алгоритм Дейкстры, графы в навигации, сетях и рекомендациях.">
<title>Графы и поиск пути</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-v]{cursor:grab}
.scene [data-hit]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-v]{cursor:grabbing}
.scene.addmode [data-hit="bg"]{cursor:crosshair}
.scene text{font-family:var(--font-mono)}
.scene .sans{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr span:last-child{color:var(--fg);text-align:right}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing.code{white-space:pre;overflow-x:auto;overflow-wrap:normal;font-size:12.5px}
.listing .cur{color:var(--force)}
.listing .cm{color:var(--muted)}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}
.step.cur{outline:1px solid var(--force)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage{height:calc(70vw + 330px);min-height:0}
}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.scene .pulse{animation:pulse 1.1s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Графы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: вершины графа можно перетаскивать и нажимать, клетки лабиринта — нажимать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CY = '#72d4e8', AM = '#ffb547', GR = '#86e0a8', WR = '#ff8a73', MU = '#8b96ad', DIM = '#56627d', LN = '#3a4762', FG = '#e8ecf4', NF = '#1d2940';
const INF = Infinity;
const fmtD = d => d === INF ? '∞' : String(d);
const minutes = n => `${n} ${plural(n, 'минута', 'минуты', 'минут')}`;

const LESSONS = [
  { id: 'graph', title: 'Что такое граф',
    text: ['Граф — это набор вершин и рёбер, которые соединяют пары вершин. Вершины — это объекты: станции, люди, веб-страницы. Рёбра — связи между ними. В графе важно только, что с чем соединено, а не где нарисована вершина: перетащите её — граф останется тем же.',
           'Граф бывает неориентированным: дружба взаимна, поэтому ребро рисуют простой линией. Бывает ориентированным: ссылка ведёт с одной страницы на другую, и ребро рисуют стрелкой — его называют дугой. Если у рёбер есть числа (длина, время, цена), граф называют взвешенным. Схема метро с минутами в пути — взвешенный граф.',
           'Степень вершины — число рёбер, которые к ней подходят. В ориентированном графе отдельно считают входящие и исходящие дуги. Сумма степеней всех вершин неориентированного графа равна удвоенному числу рёбер: каждое ребро посчитано дважды, у обоих концов.'],
    why: 'Графами описывают всё, где есть связи. Картографические сервисы хранят дороги и станции как граф, соцсети — людей и дружбу, поисковики — страницы и ссылки. Графы знаний связывают факты вида «Париж — столица — Франции», и ИИ-ассистенты опираются на них, чтобы меньше ошибаться. В ближайшие 10 лет инженер-программист и аналитик данных будут всё чаще проектировать такие графы, а рутинный код допишет ИИ. Поэтому главное умение — увидеть граф в задаче.',
    task: 'В «Соцсети» найдите человека с наибольшей степенью (больше всех друзей), а в «Вебе» — страницу, на которую ведёт больше всего ссылок. Выберите вершину и нажмите «Это ответ».',
    hint: 'Переключайте графы кнопками внизу. Считайте линии у каждой вершины, а в «Вебе» — только стрелки, которые входят в вершину. В «Метро» степени подписаны для примера.',
    stage: 'Нажмите на вершину, чтобы выбрать её. Вершины можно перетаскивать.',
    check: m => m.okSocial && m.okWeb },
  { id: 'bfs', title: 'Обход в ширину',
    text: ['Обход в ширину (BFS, breadth-first search) исследует граф волнами. Сначала старт — до него 0 шагов. Потом все его соседи — 1 шаг. Потом соседи соседей — 2 шага, и так далее. Так расходятся круги по воде.',

// ---------- shared graph helpers (edges: [a, b, w]) ----------
const nbrsOf = (E, v) => E.filter(e => e[0] === v || e[1] === v).map(e => ({ u: e[0] === v ? e[1] : e[0], w: e[2] }));
function bfsGraph(Vs, E, s, t) {
  const dist = { [s]: 0 }, prev = {}, q = [s];
  while (q.length) {
    const v = q.shift();
    for (const { u } of nbrsOf(E, v).sort((a, b) => a.u < b.u ? -1 : 1)) if (dist[u] === undefined) { dist[u] = dist[v] + 1; prev[u] = v; q.push(u); }
  }
  if (dist[t] === undefined) return { dist, path: null };
  const path = [t]; while (path[0] !== s) path.unshift(prev[path[0]]);
  return { dist, path };
}
function dijGraph(Vs, E, s, t) { // ties: fewer edges wins
  const d = {}, hops = {}, prev = {}, done = new Set();
  Vs.forEach(v => { d[v] = INF; hops[v] = INF; }); d[s] = 0; hops[s] = 0;
  for (;;) {
    let v = null;
    for (const x of Vs) if (!done.has(x) && d[x] < INF && (v === null || d[x] < d[v] || (d[x] === d[v] && hops[x] < hops[v]))) v = x;
    if (v === null) break;
    done.add(v);
    for (const { u, w } of nbrsOf(E, v)) if (d[v] + w < d[u] || (d[v] + w === d[u] && hops[v] + 1 < hops[u])) { d[u] = d[v] + w; hops[u] = hops[v] + 1; prev[u] = v; }
  }
  if (d[t] === INF) return { d, path: null };
  const path = [t]; while (path[0] !== s) path.unshift(prev[path[0]]);
  return { d, path, cost: d[t] };
}

const pq3 = () => S.dj.seen.filter(v => !S.dj.done.includes(v));
const pqMin = () => Math.min(...pq3().map(v => S.dj.dist[v]));
const djFinished = () => S.dj.done.includes(S.t3);
function djTake(v, hand) {
  const D = S.dj;

  if (D.done.includes(v)) { toast(`Вершина ${v} уже зафиксирована: её метка окончательная.`); return false; }
  if (!pq3().includes(v)) { toast(`Вершины ${v} нет в очереди: её метка пока ∞, до неё ещё не дошли.`); return false; }

    toast(`Не та: у ${v} метка ${D.dist[v]}, а в очереди есть ${who} с меткой ${mn}. Из очереди берут наименьшую.`);

function djAutoStep() { const q = pq3(); if (!q.length || djFinished()) return false; const mn = pqMin(); const v = q.filter(x => S.dj.dist[x] === mn).sort()[0]; return djTake(v, false); }

function hlBoxes(id) {
  const l = LID();
  if (l === 'graph') {
    const k = S.p1, g = G1[k], P = S.pos1[k];
    if (id === 'v') return Object.keys(g.V).map(v => { const w = pillW(g.V[v][0]); return [P[v].x - w / 2 - 4, P[v].y - 17, w + 8, 34]; });
    if (id === 'e' || id === 'w') return g.E.map(e => { const x = (P[e[0]].x + P[e[1]].x) / 2, y = (P[e[0]].y + P[e[1]].y) / 2; return [x - 15, y - 11, 30, 22]; });
    if (id === 'dir') return g.E.map(e => { const a = P[e[0]], b = P[e[1]], p = clipBox(a, b, pillW(g.V[e[1]][0]) / 2 + 2, 15); return [p.x - 11, p.y - 11, 22, 22]; });
    if (id === 'deg') return Object.keys(g.V).map(v => { const w = pillW(g.V[v][0]); return [P[v].x + w / 2 - 14, P[v].y - 26, 22, 22]; });
    return [];
  }
  if (l === 'bfs') {
    const box = i => [cc(i) * CS - 2, cr(i) * CS - 2, CS + 4, CS + 4];
    if (id === 'start') return [box(S.st)];
    if (id === 'fin') return [box(S.fin)];
    if (id === 'grid') return [[-3, -3, COLS * CS + 6, ROWS * CS + 6]];
    if (id === 'wall') return [...S.walls].slice(0, 60).map(box);
    if (id === 'wave') return S.wave && S.wave.front.length ? S.wave.front.map(box) : [box(S.st)];
    if (id === 'path') return S.trace ? S.trace.map(box) : [box(S.fin)];
    return [];
  }
  if (l === 'dijkstra') {
    const P = S.pos3;
    if (id === 'label') return V3.map(v => [P[v].x - 20, P[v].y - 41, 40, 22]);
    if (id === 'weight') return G3.E.map(e => { const a = P[e[0]], b = P[e[1]]; return [(a.x + b.x) / 2 - 15, (a.y + b.y) / 2 - 11, 30, 22]; });
    if (id === 'queue') return [[-4, 336, 400, 30]];
    if (id === 'fixed') return S.dj.done.length ? S.dj.done.map(v => [P[v].x - 23, P[v].y - 23, 46, 46]) : [[-4, 360, 300, 22]];
    if (id === 'step') return [[-4, 316, 526, 22]];
    return [];
  }
  const G = S.g4;
  if (id === 'canvas') return [[-3, -3, 526, 346]];
  if (id === 'ends') return G.V.filter(v => v.id === S.s4 || v.id === S.t4).map(v => [v.x - 22, v.y - 22, 44, 44]);
  if (id === 'weights') return G.E.map(e => { const a = vx4(e[0]), b = vx4(e[1]); return [(a.x + b.x) / 2 - 15, (a.y + b.y) / 2 - 11, 30, 22]; });
  if (id === 'paths') { const p = (S.res4.dij || S.res4.bfs); return p ? p.path.map(id2 => { const v = vx4(id2); return [v.x - 22, v.y - 22, 44, 44]; }) : [[-3, -3, 526, 346]]; }
  if (id === 'fof') return (S.res4.fof || []).map(id2 => { const v = vx4(id2); return [v.x - 22, v.y - 22, 44, 44]; });
  return [];
}

function drawScene(t) {
  const id = LID();
  let h = bg() + (id === 'graph' ? drawGraph1() : id === 'bfs' ? drawBfs(t) : id === 'dijkstra' ? drawDij(t) : drawWorld(t));
  if (S.hl) {

// The shared task card (with the lab-shell buttons) covers the top-left of the stage and the meter the
// top-right. fit() measures both and puts the scene in the largest free region: under both, or to the
// right of the card and under the meter, or between them.
let VB = { x: 0, y: 0, w: 520, h: 405 };
const taskCard = $('#taskBox');
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const [x0, y0, x1, y1] = BOX[LID()], cw = x1 - x0, ch = y1 - y0;
  const tc = taskCard.getBoundingClientRect(), mc = $('#meter').getBoundingClientRect(), pad = 10;
  const cardR = tc.right - rc.left + 10, cardB = tc.bottom - rc.top + 8, mB = mc.bottom - rc.top + 8, mL = mc.left - rc.left - 10;
  const regions = [[pad, Math.max(cardB, mB), w - pad, hh - pad], [cardR, mB, w - pad, hh - pad], [cardR, pad, mL, hh - pad]];
  let best = null;
  for (const r of regions) {
    const rw = r[2] - r[0], rh = r[3] - r[1]; if (rw < 120 || rh < 120) continue;
    const s = Math.min(rw / cw, rh / ch, 1.9);
    if (!best || s > best.s + 0.01) best = { s, r };
  }
  if (!best) best = { s: Math.min(w / cw, hh / ch), r: [0, 0, w, hh] };
  const s = best.s, r = best.r, px = (r[0] + r[2]) / 2, py = (r[1] + r[3]) / 2;
  VB = { w: w / s, h: hh / s }; VB.x = (x0 + x1) / 2 - px / s; VB.y = (y0 + y1) / 2 - py / s;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  fitHint();
  dirty = true;
}
// the stage hint (bottom-left) is hidden when it would run into the toolbar
function fitHint() {

  const a = hn.getBoundingClientRect(), b = $('#tools').getBoundingClientRect();
  if (a.width && b.width && a.right > b.left - 8 && a.bottom > b.top) hn.style.visibility = 'hidden';

new ResizeObserver(fit).observe(scene);
new ResizeObserver(fit).observe(taskCard);

// ---------- pointer ----------
let dirty = true, drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const editing2 = () => !S.wave || (S.mode2 !== 'wall') || !S.wave.found;
scene.addEventListener('pointerdown', e => {
  const v = e.target.closest('[data-v]'), hit = e.target.closest('[data-hit]');
  if (!v && !hit) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (v) { const o = posOf(v.dataset.v); if (!o) return; drag = { kind: 'v', id: v.dataset.v, dx: o.x - p.x, dy: o.y - p.y, x: e.clientX, y: e.clientY, moved: false }; return; }
  drag = { kind: 'hit', tag: hit.dataset.hit, p, x: e.clientX, y: e.clientY, moved: false };
  // walls: paint by dragging
  if (LID() === 'bfs' && drag.tag.startsWith('c:') && S.mode2 === 'wall' && !(S.wave && S.wave.found) && !S.run2) {
    const i = +drag.tag.slice(2);
    if (i === S.st || i === S.fin) { drag.paint = null; return; }
    drag.paint = !S.walls.has(i); setWall(i, drag.paint); drag.painted = true;
  }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.kind === 'v' && drag.moved) { const p = toSvg(e); setPos(drag.id, p.x + drag.dx, p.y + drag.dy); scene.classList.add('grabbing'); dirty = true; return; }
  if (drag.painted && drag.paint !== null) {
    const p = toSvg(e), c = Math.floor(p.x / CS), r = Math.floor(p.y / CS);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) { const i = ci(c, r); if (i !== S.st && i !== S.fin && S.walls.has(i) !== drag.paint) setWall(i, drag.paint); }
  }
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) return;
  if (d.kind === 'v') { if (!d.moved) tapVertex(d.id); else if (LID() === 'world') edited4Pos(); return; }
  if (d.painted || d.moved) return;
  tapHit(d.tag, d.p);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));
function edited4Pos() { dirty = true; }

function setWall(i, on) {
  if (on) S.walls.add(i); else S.walls.delete(i);
  if (S.wave) resetWave();
  update();
}

function tapVertex(id) {
  const l = LID();
  if (l === 'graph') { S.sel1 = S.sel1 === id ? null : id; update(); return; }
  if (l === 'dijkstra') {
    if (S.ends3) {
      if (S.ends3 === 's') { S.s3 = id; if (S.t3 === id) S.t3 = V3.find(v => v !== id && v === 'G') || V3.find(v => v !== id); S.ends3 = 't'; resetDij(); toast(`Старт — ${id}. Теперь нажмите финиш.`); }
      else { if (id === S.s3) { toast('Финиш должен отличаться от старта.'); return; } S.t3 = id; S.ends3 = null; resetDij(); toast(`Маршрут ${S.s3} → ${S.t3}. Начинайте с вершины, у которой метка 0.`); }
      update(); return;
    }
    if (S.dj.run) return;
    if (djTake(id, true)) update();
    return;
  }
  if (l === 'world') { vertexTap4(id); update(); }
}
function tapHit(tag, p) {
  const l = LID();
  if (l === 'bfs' && tag.startsWith('c:')) { tapCell(+tag.slice(2)); return; }
  if (l === 'dijkstra' && tag.startsWith('q:')) { tapVertex(tag.slice(2)); return; }
  if (l === 'world') {
    if (tag === 'bg') { if (S.mode4 === 'build') { if (S.pend) { S.pend = null; } else addVertex4(p); update(); } return; }
    const i = +tag.slice(2), e = S.g4.E[i]; if (!e) return;
    if (S.mode4 === 'del') { S.g4.E.splice(i, 1); edited4(); update(); return; }
    if (tag.startsWith('w:') && S.mode4 === 'build') { e[2] = e[2] % 9 + 1; edited4(); update(); }
  }
}
function tapCell(i) {
  if (S.run2) return;
  const W = S.wave;
  if (S.mode2 === 'start' || S.mode2 === 'fin') {
    if (S.walls.has(i)) { toast('Это стена. Выберите свободную клетку.'); return; }
    if ((S.mode2 === 'start' && i === S.fin) || (S.mode2 === 'fin' && i === S.st)) { toast('Старт и финиш должны быть в разных клетках.'); return; }
    if (S.mode2 === 'start') S.st = i; else S.fin = i;
    S.mode2 = 'wall'; resetWave(); update(); return;
  }
  if (W && W.found) { traceTo(i); return; }
  if (i === S.st || i === S.fin) return;
}
function traceTo(i) {
  const W = S.wave, tr = S.trace, last = tr[tr.length - 1];
  const at = tr.indexOf(i);
  if (at >= 0) { if (at < tr.length - 1) { S.trace = tr.slice(0, at + 1); update(); } return; }
  if (last === S.st) { toast('Путь уже готов. Нажмите на клетку пути, чтобы вернуться к ней.'); return; }
  if (S.walls.has(i)) { toast('Это стена — сквозь неё не пройти.'); return; }
  if (!adj(i, last)) { toast(`Нужна соседняя по стороне клетка с последней клеткой пути (там число ${W.dist[last]}).`); return; }
  if (W.dist[i] < 0) { toast('Сюда волна не дошла — эта клетка дальше от старта, чем финиш.'); return; }
  if (W.dist[i] !== W.dist[last] - 1) { toast(`Здесь ${W.dist[i]}, а нужно ${W.dist[last] - 1}: каждый шаг назад уменьшает число на 1.`); return; }
  tr.push(i);
  if (i === S.st) toast(`Путь восстановлен: ${tr.length - 1} ${plural(tr.length - 1, 'шаг', 'шага', 'шагов')} — короче не бывает.`);

// ---------- actions ----------
function act(a) {
  const id = LID();
  if (id === 'graph') {
    if (a.startsWith('p-')) { S.p1 = a.slice(2); S.sel1 = null; update(); requestAnimationFrame(fit); }
    if (a === 'ans') answer1();
    return;
  }
  if (id === 'bfs') {
    if (a === 'step') { if (S.wave && (S.wave.found || S.wave.dead)) return; S.run2 = null; waveStep(); update(); }
    if (a === 'run') { if (S.wave && (S.wave.found || S.wave.dead)) return; S.run2 = { t: 0 }; update(); }
    if (a === 'reset') { resetWave(); update(); }
    if (a === 'm-wall' || a === 'm-start' || a === 'm-fin') { S.mode2 = a.slice(2); if (S.mode2 !== 'wall' && S.wave && S.wave.found) toast('Перенос точки сбросит волну.'); update(); }
    if (a === 'maze') { resetMaze(); resetWave(); S.mode2 = 'wall'; update(); }
    if (a === 'empty') { S.walls = new Set(); resetWave(); update(); }
    return;
  }
  if (id === 'dijkstra') {
    if (a === 'take') { if (S.dj.run || S.ends3) return; if (djAutoStep()) update(); else if (djFinished()) toast('Маршрут уже найден.'); }
    if (a === 'all') { if (S.ends3 || djFinished()) return; S.dj.run = { t: 0 }; update(); }
    if (a === 'reset') { S.ends3 = null; resetDij(); update(); }
    if (a === 'greedy') { if (S.ends3) return; greedyRun(); update(); }
    if (a === 'ends') { S.ends3 = S.ends3 ? null : 's'; if (S.ends3) toast('Нажмите вершину-старт, потом вершину-финиш.'); update(); }
    return;
  }
  if (a.startsWith('m-')) { S.mode4 = a.slice(2); S.pend = null; if (S.mode4 === 'ends') { S.endsNext = 's'; toast('Нажмите старт, потом финиш.'); } update(); return; }
  if (a === 'bfs' || a === 'dij' || a === 'fof') { run4(a); update(); return; }
  if (a === 'clear') { S.g4 = { V: [], E: [] }; S.s4 = null; S.t4 = null; S.pend = null; S.mode4 = 'build'; edited4(); toast('Пусто. Нажимайте на свободное место — появятся вершины.'); update(); }
  if (a === 'sample') { resetL4(); update(); }
}
function answer1() {
  const k = S.p1; if (k === 'metro') return;
  const id = S.sel1; if (!id) { toast('Сначала нажмите на вершину.'); return; }
  const g = G1[k], best = Math.max(...Object.keys(g.V).map(v => score1(k, v))), dg = deg1(k, id), nm = g.V[id][0];
  if (score1(k, id) === best) {
    S.ans1[k] = true;

  } else {
    S.miss1++;
    if (k === 'web') toast(`На «${nm}» ведёт ${dg.in} ${plural(dg.in, 'ссылка', 'ссылки', 'ссылок')}${dg.out ? `, а исходящих у неё ${dg.out} — их не считаем` : ''}. Ищите больше входящих стрелок.`);
    else toast(`У ${nm} ${dg.all} ${plural(dg.all, 'друг', 'друга', 'друзей')}. Есть вершина, у которой рёбер больше.`);

let lastT = 0;

const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;

function taskState(m) {
  if (S.done[LID()]) return '✓ Выполнено';
  if (m.kind === 'graph') return `Соцсеть ${m.okSocial ? '✓' : '—'} · Веб ${m.okWeb ? '✓' : '—'}` + (m.miss ? ` · промахов ${m.miss}` : '');
  if (m.kind === 'bfs') {
    if (m.running) return `Волна ${m.layer} · в очереди ${m.front}`;
    if (m.dead) return 'До финиша не дойти — уберите стены';
    if (m.found) return `Финиш: ${m.len} ${plural(m.len, 'шаг', 'шага', 'шагов')} · путь ${m.traceLen}/${m.len}`;
    if (m.started) return `Волна ${m.layer} · посещено ${m.visited}`;
    return 'Волна не запущена';
  }
  if (m.kind === 'dij') {
    if (m.handDone && !m.greedySeen) return `Маршрут ${m.cost} мин найден сами — теперь «Жадный»`;
    if (m.fin && m.auto) return 'Ходы делал автомат — «Сброс» и сами';
    if (m.fin) return `Готово · ${m.cost} мин`;
    return `Зафиксировано ${m.done} из ${V3.length} · ошибок ${m.errors}` + (m.auto ? ' · был автошаг' : '');
  }
  const parts = [`вершин ${m.nV}/6`, `рёбер ${m.nE}/7`];
  if (m.bfs && m.dij) parts.push(m.contrast ? 'пути разные ✓' : `рёбер: BFS ${m.bfs.hops}, Дейкстра ${m.dij.hops}`);
  else parts.push('запустите BFS и Дейкстру');
  return parts.join(' · ');
}

const CODE = {
  bfs: ['from collections import deque', '', 'def bfs(start, finish):', '    dist = {start: 0}', '    q = deque([start])        # очередь', '    while q:', '        v = q.popleft()       # берём из начала', '        if v == finish:', '            return dist[v]', '        for u in neighbours(v):', '            if u not in dist:', '                dist[u] = dist[v] + 1', '                q.append(u)   # ставим в конец', '    return -1                 # пути нет'],
  dijkstra: ['import heapq', '', 'def dijkstra(g, start):', '    dist = {v: float(\'inf\') for v in g}', '    dist[start] = 0', '    pq = [(0, start)]         # очередь с приоритетом', '    while pq:', '        d, v = heapq.heappop(pq)   # наименьшая метка', '        if d > dist[v]:', '            continue          # устаревшая запись', '        for u, w in g[v]:', '            if d + w < dist[u]:     # релаксация', '                dist[u] = d + w', '                heapq.heappush(pq, (dist[u], u))', '    return dist'],
};
const codeHTML = lines => lines.map(s => { const i = s.indexOf('#'); return i > 0 ? esc(s.slice(0, i)) + `<span class="cm">${esc(s.slice(i))}</span>` : esc(s); }).join('\n');
function adjListCode() {
  const l = LID();
  if (l === 'graph') {
    const k = S.p1, g = G1[k], nm = id => `'${g.V[id][0]}'`;
    const lines = [`g = {   # ${g.name.toLowerCase()}: ${g.directed ? 'кто → на кого ссылается' : 'список соседей'}`];
    for (const id in g.V) {
      const out = g.E.filter(e => e[0] === id || (!g.directed && e[1] === id)).map(e => { const u = e[0] === id ? e[1] : e[0]; return g.weighted ? `(${nm(u)}, ${e[2]})` : nm(u); });
      lines.push(`    ${nm(id)}: [${out.join(', ')}],`);
    }
    lines.push('}');
    lines.push(g.directed ? "len(g['Главная'])   # исходящие ссылки" : `len(g[${nm(Object.keys(g.V)[0])}])   # степень вершины`);
    return lines;
  }
  const lines = ['g = {   # ваш граф: сосед и вес ребра'];
  for (const v of S.g4.V) lines.push(`    '${v.id}': [${nbrsOf(S.g4.E, v.id).map(x => `('${x.u}', ${x.w})`).join(', ')}],`);
  lines.push('}');
  return lines;
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const lst = el.querySelector('#lst');
  if (m.kind === 'graph') {
    set('#r1', String(m.nV)); set('#r2', String(m.nE)); set('#r3', m.sel ? G1[m.p].V[m.sel][0] : '—');
    el.querySelectorAll('#pch [data-a]').forEach(b => b.setAttribute('aria-pressed', b.dataset.a === 'p-' + m.p));
    if (lst) lst.innerHTML = codeHTML(adjListCode());
  } else if (m.kind === 'bfs') {
    set('#r1', String(m.layer)); set('#r2', String(m.front)); set('#r3', String(m.visited));
    el.querySelectorAll('[data-a]').forEach(b => b.disabled = !!S.run2 || ((b.dataset.a === 'step' || b.dataset.a === 'run') && (m.found || m.dead)));
    if (lst) lst.innerHTML = !S.wave ? `<span class="cm">[${cellName(S.st)}] — в очереди только старт</span>` : m.found ? '<span class="cm">Финиш найден — обход остановлен.</span>' : S.wave.front.length ? S.wave.front.map(cellName).join(' ') + `<div class="cm">у всех расстояние ${S.wave.layer}</div>` : '<span class="cm">пусто</span>';
  } else if (m.kind === 'dij') {
    set('#r1', `${m.s} → ${m.t}`); set('#r2', String(S.dj.log.length)); set('#r3', String(m.errors));
    el.querySelectorAll('[data-a]').forEach(b => b.disabled = !!S.dj.run);
    el.querySelectorAll('#vch [data-v]').forEach(b => { b.disabled = S.dj.done.includes(b.dataset.v) || !!S.dj.run; });
    if (lst) lst.innerHTML = V3.map(v => `<div class="${S.dj.done.includes(v) ? '' : pq3().includes(v) ? 'cur' : 'cm'}">${v}: d = ${fmtD(S.dj.dist[v])}${S.dj.prev[v] ? `, пришли из ${S.dj.prev[v]}` : ''}${S.dj.done.includes(v) ? ' ✓' : pq3().includes(v) ? ' (в очереди)' : ''}</div>`).join('');
  } else {
    set('#r1', String(m.nV)); set('#r2', String(m.nE)); set('#r3', m.s && m.t ? `${m.s} → ${m.t}` : '—');
    if (lst) lst.innerHTML = codeHTML(adjListCode());
  }
}

function pageRank(it = 30, d = 0.85) {
  const g = G1.web, V = Object.keys(g.V), N = V.length;
  let pr = {}; V.forEach(v => pr[v] = 1 / N);
  const out = v => g.E.filter(e => e[0] === v).length;
  for (let k = 0; k < it; k++) {
    const nx = {}; V.forEach(v => nx[v] = (1 - d) / N);
    for (const e of g.E) nx[e[1]] += d * pr[e[0]] / out(e[0]);
    pr = nx;
  }
  return V.map(v => ({ v, name: g.V[v][0], pr: pr[v], in: deg1('web', v).in })).sort((a, b) => b.pr - a.pr);
}

function calcHTML(m) {
  if (m.kind === 'graph') {
    const k = m.p, g = G1[k], V = Object.keys(g.V);
    if (g.directed) {
      let h = `<h2>Входящие и исходящие</h2><div class="formula">Σ вход = Σ исход = |E|</div><p class="note">Каждая дуга один раз выходит из вершины и один раз входит в другую.</p><div class="steps">`;
      V.forEach(v => { const dg = deg1(k, v); h += step(g.V[v][0], S.ans1.web ? `вход ${dg.in} · исход ${dg.out}` : `вход ? · исход ${dg.out}`, S.ans1.web && v === 'wiki' ? 'okk' : ''); });
      h += step('сумма исходящих', `${g.E.length}`, 'sum') + step('число дуг |E|', `${g.E.length}`, 'sum') + `</div><p class="note" style="margin-top:10px">Входящие откроются, когда найдёте самую цитируемую страницу.</p>`;
      return h;
    }
    const show = k === 'metro' || S.ans1[k];
    let h = `<h2>Лемма о рукопожатиях</h2><div class="formula">Σ deg(v) = 2 · |E|</div><p class="note">Каждое ребро добавляет по 1 к степеням обоих своих концов.</p><div class="steps">`;
    let sum = 0;
    V.forEach(v => { const dg = deg1(k, v).all; sum += dg; h += step(g.V[v][0], show ? `deg = ${dg}` : 'deg = ?'); });
    h += step('сумма степеней', show ? String(sum) : '?', 'sum') + step('рёбер |E| · 2', `${g.E.length} · 2 = ${2 * g.E.length}`, 'sum') + `</div>`;
    if (!show) h += `<p class="note" style="margin-top:10px">Степени откроются после верного ответа — сначала посчитайте сами.</p>`;
    if (k === 'metro') {
      const r = dijGraph(V, g.E, 'u', 'r');
      h += `<h3>Самый быстрый путь</h3><div class="steps">` + step('Университет → Порт', `${r.path.map(v => g.V[v][0]).join(' → ')}`) + step('время', minutes(r.cost), 'sum') + `</div><p class="note" style="margin-top:10px">Как такой путь найти автоматически — в уроке 3.</p>`;
    }
    return h;
  }
  if (m.kind === 'bfs') {
    let h = `<h2>Волна по слоям</h2><div class="formula">dist(u) = dist(v) + 1</div><p class="note">Соседу, которого волна ещё не видела, ставим число на 1 больше.</p><div class="steps">`;
    if (!S.wave) h += step('слой 0', `1 клетка — старт ${cellName(S.st)}`);
    else S.wave.layers.forEach((ly, k) => { if (ly.length) h += step(`слой ${k}`, `${ly.length} ${plural(ly.length, 'клетка', 'клетки', 'клеток')}`, k === S.wave.layer && !m.found ? 'cur' : ''); });
    h += step('свободных клеток', String(m.free)) + step('посещено волной', String(m.visited), 'sum');
    if (m.found) h += step('кратчайший путь', `${m.len} ${plural(m.len, 'шаг', 'шага', 'шагов')}`, 'okk sum') + step('путь восстановлен', `${m.traceLen} из ${m.len}`, m.traced ? 'okk' : '');
    h += `</div><h3>Сколько работы</h3><div class="steps">` + step('каждая клетка', 'попадает в очередь один раз') + step('каждое ребро', 'проверяется не больше двух раз') + step('сложность BFS', 'O(V + E)', 'sum') + `</div>`;
    const p = wavePath();
    if (p) h += `<p class="note" style="margin-top:10px">Один из кратчайших путей (строка, столбец): ${p.map(cellName).join(' → ')}</p>`;
    return h;
  }
  if (m.kind === 'dij') {
    let h = `<h2>Шаги алгоритма</h2><div class="formula">d(u) = min(d(u), d(v) + w)</div><div class="steps">`;
    h += step('старт', `d(${S.s3}) = 0, остальные ∞`);
    S.dj.log.forEach((x, k) => {
      h += step(`${k + 1}. взяли ${x.v} (${x.d})`, x.upd.length ? x.upd.map(y => y.keep ? `${y.u} ${fmtD(y.old)}` : `${y.u}: ${fmtD(y.old)}→${y.nw}`).join(', ') : '—', x.v === S.t3 ? 'okk' : '');
    });
    h += `</div>`;
    const best = dijGraph(V3, G3.E, S.s3, S.t3);
    if (m.fin) {
      h += `<h3>Итог</h3><div class="steps">` + step('маршрут Дейкстры', m.route.join(' → ')) + step('время', `${m.route.slice(1).map((v, i) => G3.E.find(e => [e[0], e[1]].sort().join('') === [m.route[i], v].sort().join(''))[2]).join(' + ')} = ${m.cost} мин`, 'okk sum');
      if (m.greedy) h += step('жадный маршрут', m.greedy.path.join(' → ')) + step('время жадного', m.greedy.dead ? 'тупик' : `${m.greedy.cost} мин`, m.greedy.cost > m.cost || m.greedy.dead ? 'badd sum' : 'sum');
      h += `</div>`;
    } else if (m.greedy) h += `<h3>Жадный маршрут</h3><div class="steps">` + step(m.greedy.path.join(' → '), m.greedy.dead ? 'тупик' : `${m.greedy.cost} мин`, 'badd') + step('лучший', `${best.cost} мин`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">С двоичной кучей (heapq) алгоритм работает за O((V + E) · log V) — так он справляется с картами из миллионов перекрёстков.</p>`;
    return h;
  }
  let h = `<h2>Ваш маршрут</h2><div class="steps">`;
  h += step('вершин', `${m.nV} (нужно ≥ 6)`, m.nV >= 6 ? 'okk' : '') + step('рёбер', `${m.nE} (нужно ≥ 7)`, m.nE >= 7 ? 'okk' : '');
  if (m.bfs) h += step('BFS', `${m.bfs.path.join('→')} · ${m.bfs.hops} рёб. · вес ${m.bfs.cost}`); else h += step('BFS', 'не запускали');
  if (m.dij) h += step('Дейкстра', `${m.dij.path.join('→')} · ${m.dij.hops} рёб. · вес ${m.dij.cost}`); else h += step('Дейкстра', 'не запускали');
  if (m.bfs && m.dij) h += step('рёбер больше у Дейкстры?', m.contrast ? 'да — меньше пересадок ≠ быстрее' : 'нет — перестройте веса', m.contrast ? 'okk sum' : 'badd sum');
  h += `</div>`;
  if (m.fof) h += `<h3>Друзья друзей для ${m.s}</h3><div class="steps">` + step('расстояние 2', m.fof.join(', ') || 'нет') + `</div>`;
  h += `<h3>PageRank графа «Веб» из урока 1</h3><div class="formula">PR(p) = (1 − d)/N + d · Σ PR(q)/out(q)</div><p class="note">d = 0,85 — вероятность, что читатель пойдёт по ссылке, а не откроет случайную страницу. 30 итераций.</p><div class="steps">`;
  pageRank().forEach((x, k) => { h += step(`${k + 1}. ${x.name}`, `${x.pr.toFixed(3)} · ссылок ${x.in}`, k === 0 ? 'okk' : ''); });
  h += `</div><p class="note" style="margin-top:10px">Важна не только число ссылок, но и «вес» ссылающихся: на «Главную» ведут всего 2 ссылки, но одна из них — с самой важной «Вики».</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'graph') {
    const g = G1[m.p], d = m.sel ? deg1(m.p, m.sel) : null, open = m.p === 'metro' || S.ans1[m.p];
    el.innerHTML = `<div class="k">${g.name}</div><div class="v ${ok ? 'ok' : ''}">${m.nV} верш. · ${m.nE} ${g.directed ? 'дуг' : 'рёб.'}</div>` +
      `<div class="lr"><span>выбрана</span><span>${m.sel ? g.V[m.sel][0] : '—'}</span></div>` +
      `<div class="lr"><span>${g.directed ? 'входящих' : 'степень'}</span><span>${d ? (open ? (g.directed ? d.in : d.all) : '?') : '—'}</span></div>` +
      `<div class="lr"><span>Σ степеней</span><span>${2 * m.nE}</span></div>`;
  } else if (m.kind === 'bfs') {
    el.innerHTML = `<div class="k">Обход в ширину</div><div class="v ${m.found ? 'ok' : m.dead ? 'bad' : ''}">${m.found ? `путь ${m.len}` : m.dead ? 'нет пути' : `волна ${m.layer}`}</div>` +
      `<div class="gauge"><b style="width:${(m.visited / Math.max(1, m.free) * 100).toFixed(1)}%"></b></div>` +
      `<div class="lr"><span>посещено</span><span>${m.visited}/${m.free}</span></div><div class="lr"><span>в очереди</span><span>${m.front}</span></div>` +
      `<div class="lr"><span>путь назад</span><span>${m.found ? `${m.traceLen}/${m.len}` : '—'}</span></div>`;
  } else if (m.kind === 'dij') {
    el.innerHTML = `<div class="k">Маршрут ${m.s} → ${m.t}</div><div class="v ${m.fin ? 'ok' : ''}">${m.fin ? `${m.cost} мин` : `d(${m.t}) = ${fmtD(S.dj.dist[m.t])}`}</div>` +
      `<div class="gauge"><b style="width:${(m.done / V3.length * 100).toFixed(1)}%"></b></div>` +
      `<div class="lr"><span>зафиксировано</span><span>${m.done}/${V3.length}</span></div><div class="lr"><span>ошибок</span><span>${m.errors}</span></div>` +
      `<div class="lr"><span>жадный</span><span>${m.greedy ? (m.greedy.dead ? 'тупик' : m.greedy.cost + ' мин') : '—'}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Ваш граф</div><div class="v ${ok || m.contrast ? 'ok' : ''}">${m.nV} верш. · ${m.nE} рёб.</div>` +
      `<div class="lr"><span>маршрут</span><span>${m.s || '?'} → ${m.t || '?'}</span></div>` +
      `<div class="lr"><span>BFS</span><span>${m.bfs ? `${m.bfs.hops} рёб. · ${m.bfs.cost}` : '—'}</span></div>` +
      `<div class="lr"><span>Дейкстра</span><span>${m.dij ? `${m.dij.hops} рёб. · ${m.dij.cost}` : '—'}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены: графы, BFS, Дейкстра и графы вокруг нас!'), 1500);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderTools(); fitHint();
  renderPanes(m);
  const n =Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  graph: '<path d="M12 8L33 20M12 8L30 6M33 20L54 10M33 20L50 25M30 6L54 10" stroke="#3d5274" stroke-width="1.6"/><circle cx="12" cy="8" r="4" fill="#5b6f93"/><circle cx="30" cy="6" r="3.5" fill="#5b6f93"/><circle cx="33" cy="20" r="5" fill="#ffb547"/><circle cx="54" cy="10" r="4" fill="#5b6f93"/><circle cx="50" cy="25" r="3.5" fill="#5b6f93"/>',
  bfs: '<rect x="4" y="3" width="58" height="24" rx="2" fill="#121a28"/><rect x="4" y="3" width="8" height="8" fill="rgba(114,212,232,.45)"/><rect x="12" y="3" width="8" height="8" fill="rgba(114,212,232,.35)"/><rect x="4" y="11" width="8" height="8" fill="rgba(114,212,232,.35)"/><rect x="20" y="3" width="8" height="8" fill="rgba(114,212,232,.25)"/><rect x="12" y="11" width="8" height="8" fill="#2a3348"/><rect x="4" y="19" width="8" height="8" fill="rgba(114,212,232,.25)"/><rect x="28" y="3" width="8" height="8" fill="none" stroke="#ffb547"/><rect x="12" y="19" width="8" height="8" fill="none" stroke="#ffb547"/><rect x="36" y="11" width="8" height="8" fill="#2a3348"/><path d="M56 25V14l5 2-5 2" fill="#ffb547"/>',
  dijkstra: '<path d="M8 15L24 6L42 6L58 16M8 15L24 24L42 24L58 16" fill="none" stroke="#3d5274" stroke-width="1.6"/><path d="M8 15L24 24L42 24L58 16" fill="none" stroke="#ffb547" stroke-width="2.4"/><circle cx="8" cy="15" r="4" fill="#86e0a8"/><circle cx="24" cy="6" r="3.5" fill="#5b6f93"/><circle cx="42" cy="6" r="3.5" fill="#5b6f93"/><circle cx="24" cy="24" r="3.5" fill="#86e0a8"/><circle cx="42" cy="24" r="3.5" fill="#86e0a8"/><circle cx="58" cy="16" r="4" fill="#ffb547"/>',
  world: '<path d="M10 22L22 8L36 16L52 6M22 8L36 16L48 24M10 22L48 24" fill="none" stroke="#3d5274" stroke-width="1.5"/><path d="M10 22L22 8L36 16L48 24" fill="none" stroke="#72d4e8" stroke-width="3" opacity=".6"/><circle cx="10" cy="22" r="3.5" fill="#86e0a8"/><circle cx="22" cy="8" r="3.5" fill="#5b6f93"/><circle cx="36" cy="16" r="3.5" fill="#5b6f93"/><circle cx="52" cy="6" r="3.5" fill="#c3a6ff"/><circle cx="48" cy="24" r="3.5" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetL1(); resetL2(); resetL3(); resetL4();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}
window.addEventListener('resize', () => requestAnimationFrame(fit));

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'graph') {
    const g = G1[m.p];
    now = `Показан граф «${g.name}» (${g.kind}): ${m.nV} вершин, ${m.nE} ${g.directed ? 'дуг' : 'рёбер'}. ` +
      `Рёбра: ${g.E.map(e => `${g.V[e[0]][0]}${g.directed ? '→' : '–'}${g.V[e[1]][0]}${g.weighted ? ` (${e[2]} мин)` : ''}`).join(', ')}. ` +
      (m.sel ? `Выбрана вершина «${g.V[m.sel][0]}». ` : 'Вершина не выбрана. ') +
      `Ответы: соцсеть — ${m.okSocial ? 'найдена верно' : 'не найдена'}, веб — ${m.okWeb ? 'найдена верно' : 'не найдена'}; промахов ${m.miss}. ` +
      `Не называй правильную вершину — предложи посчитать рёбра у каждой (в вебе только входящие стрелки).`;
  }
  if (id === 'bfs') {
    now = `Лабиринт ${COLS}×${ROWS} клеток, стен ${S.walls.size}, старт в клетке (строка ${cr(S.st)}, столбец ${cc(S.st)}), финиш (строка ${cr(S.fin)}, столбец ${cc(S.fin)}). ` +
      (m.started ? `Волна BFS: слой ${m.layer}, посещено ${m.visited} клеток, в очереди ${m.front}. ` : 'Волна ещё не запущена. ') +
      (m.found ? `Финиш найден, кратчайший путь ${m.len} шагов. Ученик восстановил ${m.traceLen} из ${m.len} шагов пути назад. ` : '') + (m.dead ? 'Финиш недостижим из-за стен. ' : '') +
      `Задание: дойти волной до финиша и восстановить путь от финиша к старту, переходя к соседу с числом на 1 меньше. Не диктуй клетки — объясняй правило.`;
  }
  if (id === 'dijkstra') {
    const D = S.dj;
    now = `Взвешенный граф дорог: ${G3.E.map(e => `${e[0]}–${e[1]} ${e[2]} мин`).join(', ')}. Старт ${m.s}, финиш ${m.t}. ` +
      `Метки сейчас: ${V3.map(v => `${v}=${fmtD(D.dist[v])}`).join(', ')}. Зафиксированы: ${D.done.join(', ') || 'никто'}. В очереди: ${m.pq.join(', ') || 'пусто'}. ` +
      `Ошибок ученика (взял не минимальную метку): ${m.errors}. ${m.auto ? 'Использовался автоматический шаг — для зачёта нужно «Сброс» и пройти самому. ' : ''}` +
      (m.fin ? `Маршрут найден: ${m.route.join(' → ')} = ${m.cost} мин. ` : '') + (m.greedy ? `Жадный маршрут: ${m.greedy.path.join(' → ')} = ${m.greedy.dead ? 'тупик' : m.greedy.cost + ' мин'}. ` : 'Жадный маршрут ещё не смотрели. ') +
      `Не называй следующую вершину — спрашивай, у кого в очереди наименьшая метка и как изменятся метки соседей.`;
  }
  if (id === 'world') {
    now = `Граф ученика: вершины ${S.g4.V.map(v => v.id).join(', ') || 'нет'}; рёбра ${S.g4.E.map(e => `${e[0]}–${e[1]} (вес ${e[2]})`).join(', ') || 'нет'}. Старт ${m.s || 'не задан'}, финиш ${m.t || 'не задан'}. Режим: ${{ build: 'строить', del: 'удалить', ends: 'старт·финиш' }[S.mode4]}. ` +
      (m.bfs ? `BFS: ${m.bfs.path.join('→')} (${m.bfs.hops} рёбер, вес ${m.bfs.cost}). ` : 'BFS не запускали. ') + (m.dij ? `Дейкстра: ${m.dij.path.join('→')} (${m.dij.hops} рёбер, вес ${m.dij.cost}). ` : 'Дейкстру не запускали. ') +
      (m.fof ? `Друзья друзей старта: ${m.fof.join(', ') || 'нет'}. ` : '') +
      `Цель: ≥ 6 вершин, ≥ 7 рёбер и маршрут Дейкстры с бо́льшим числом рёбер, чем у BFS. Подсказывай идею (дорогое прямое ребро и дешёвый обход), но не строй граф за ученика.`;
  }
  return [
    `Раздел: информатика, 9–10 класс, тема «Графы и поиск пути» (Поляков: «Графы», «Алгоритмы на графах»). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { graph: 'Чем ориентированный граф отличается от неориентированного?', bfs: 'Почему BFS находит самый короткий путь?', dijkstra: 'Почему жадный выбор дороги может ошибиться?', world: 'Как навигатор учитывает пробки?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
