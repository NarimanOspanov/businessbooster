<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии: Красная книга Казахстана, заповедники на карте страны и модель устойчивого промысла.">
<title>Охрана природы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --red:#e0605a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="card"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene text.bt{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;transition:box-shadow .3s}
.meter.flash{box-shadow:0 0 0 2px var(--arm)}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ok);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.qbox{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;width:min(560px,calc(100% - 24px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:9px 13px;pointer-events:none;font-size:13.5px;line-height:1.4;text-wrap:pretty}
.qbox .k{display:block;font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--force);margin-bottom:5px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}
.ghostbtn:disabled{opacity:.35;cursor:default}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1.1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button.okc{border-color:rgba(134,224,168,.55);color:var(--ok)}
.chips button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.txt span{font-family:var(--font-body)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:min(560px,calc(100% - 32px))}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .qbox{font-size:12.5px;padding:8px 10px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 6l11 4v9c0 7-5 12-11 15C14 31 9 26 9 19v-9z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M14 24c0-7 5-11 12-11-1 7-5 11-12 11z" fill="var(--ok)"/><path d="M14 24l7-6" stroke="var(--bg)" stroke-width="1.4"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Охрана природы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол эколога">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена урока: карточки видов, карта заповедников или модель озера с промыслом."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="qbox" id="qbox" hidden aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-protect';

// ---------- lesson 1: species for sorting (all «rb: true» are listed in the Red Book of Kazakhstan) ----------
const GRP = { m: 'млекопитающее', b: 'птица', p: 'растение' };
const SPECIES = [
  { n: 'Снежный барс', g: 'm', rb: true, clue: 'Высокогорья Тянь-Шаня, Джунгарского Алатау и Алтая. Охотится на горных козлов.', note: 'Ирбис — в Красной книге РК. Хищников в горах очень мало, а браконьеры охотятся за шкурой. Их считают по снимкам фотоловушек.' },
  { n: 'Серая ворона', g: 'b', rb: false, clue: 'Города, сёла, свалки, парки — по всей стране.', note: 'Обычный вид: ворона прекрасно живёт рядом с человеком, её много.' },
  { n: 'Тюльпан Грейга', g: 'p', rb: true, clue: 'Предгорья юга Казахстана. Цветёт весной ярко-красными цветками.', note: 'Красная книга РК. Его рвут на букеты и выкапывают луковицы. Срывать запрещено — за это штрафуют. От него пошли многие садовые сорта.' },
  { n: 'Кулан', g: 'm', rb: true, clue: 'Пустыни юго-востока. Дикий родственник осла.', note: 'Красная книга РК. В XX веке куланов в Казахстане почти истребили. Их спасли на острове Барсакельмес, потом расселили, например, в Алтын-Эмель.' },
  { n: 'Одуванчик', g: 'p', rb: false, clue: 'Газоны, обочины, луга — почти везде.', note: 'Обычный вид: растёт повсюду, семена-«парашютики» разносит ветер.' },
  { n: 'Розовый фламинго', g: 'b', rb: true, clue: 'Гнездится на нескольких солёных озёрах, например на Тенгизе.', note: 'Красная книга РК. Гнездовий мало, а озёра мелеют и пересыхают. Птиц нельзя беспокоить, иначе они бросают гнёзда.' },
  { n: 'Джейран', g: 'm', rb: true, clue: 'Пустыни и полупустыни юга. Быстрая антилопа.', note: 'Красная книга РК. Угрозы — браконьерство и распашка его пастбищ.' },
  { n: 'Домовый воробей', g: 'b', rb: false, clue: 'Живёт у домов и ферм в каждом населённом пункте.', note: 'Обычный вид: в городах и сёлах Казахстана воробьёв очень много.' },
  { n: 'Яблоня Сиверса', g: 'p', rb: true, clue: 'Дикие яблоневые леса в горах Заилийского и Джунгарского Алатау.', note: 'Красная книга РК. Это дикий предок домашней яблони. Угрозы — вырубка, застройка и скрещивание с садовыми сортами.' },
  { n: 'Архар', g: 'm', rb: true, clue: 'Горы и мелкосопочник. Самый крупный дикий баран.', note: 'Красная книга РК. Угрозы — браконьерство и выпас скота на его пастбищах.' },
  { n: 'Лисица', g: 'm', rb: false, clue: 'Степи, леса, окраины городов — по всей стране.', note: 'Обычный вид: лисица живёт почти везде и легко приспосабливается.' },
  { n: 'Кудрявый пеликан', g: 'b', rb: true, clue: 'Немногие колонии на Балхаше, Алаколе, в дельтах рек.', note: 'Красная книга РК. Птицы гибнут в рыболовных сетях, а водоёмы мелеют. Колоний осталось немного.' },
];
const RB_TOTAL = SPECIES.filter(s => s.rb).length;

function resetLesson() {
  const L = LESSONS[S.lesson];
  S.sorted = {}; S.sel = null; S.errors = 0; S.lastCard = null;
  S.found = {}; S.qerr = 0; S.info = null; S.np = false;
  S.quota = L.init.quota || 20; S.hist = [{ N: L.init.N0 || FISH.N0, c: 0, H: 0 }]; S.run = false;
  drag = null;
}
const curQ = () => QUIZ.findIndex(q => !S.found[q.r]);

function model() {
  const id = LID();
  if (id === 'redbook') {
    const keys = Object.keys(S.sorted);
    return { kind: 'sort', sorted: keys.length, inRB: keys.filter(k => S.sorted[k] === 'rb').length, errors: S.errors };
  }
  if (id === 'reserves') {
    const qi = curQ();
    return { kind: 'map', found: Object.keys(S.found).length, qi, errors: S.qerr };
  }
  const h = S.hist, last = h[h.length - 1], year = h.length - 1;
  const total = h.reduce((a, x) => a + x.c, 0);
  return { kind: 'fish', year, N: last.N, c: last.c, total, minN: Math.min(...h.map(x => x.N)),
           allQuota: h.slice(1).every(x => x.c >= FISH.minCatch - 1e-9), collapsed: last.N <= 0 };
}

function glyph(g, x, y) {
  if (g === 'm') return `<g transform="translate(${x} ${y})"><circle r="6" fill="#ffb547"/><circle cx="-5" cy="-5" r="2.6" fill="#ffb547"/><circle cx="5" cy="-5" r="2.6" fill="#ffb547"/><circle cx="-2" cy="-.5" r="1" fill="${INK}"/><circle cx="2" cy="-.5" r="1" fill="${INK}"/></g>`;
  if (g === 'b') return `<g transform="translate(${x} ${y})"><path d="M-7 1q4-7 10-4l4-2-1 4q2 5-5 6q-6 1-8-4z" fill="#72d4e8"/><circle cx="3" cy="-2" r="1" fill="${INK}"/></g>`;
  return `<g transform="translate(${x} ${y})"><path d="M-6 6q0-11 12-12q0 11-12 12z" fill="#86e0a8"/><path d="M-6 6l7-7" stroke="${INK}" stroke-width="1"/></g>`;
}
function cardSVG(i, x, y, lifted) {
  const sp = SPECIES[i], sel = S.sel === i;
  let h = `<g data-drag="card${i}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">`;
  if (lifted) h += `<rect x="3" y="5" width="${CARD.w}" height="${CARD.h}" rx="9" fill="#000" opacity=".35"/>`;
  h += `<rect width="${CARD.w}" height="${CARD.h}" rx="9" fill="#1a2438" stroke="${sel ? '#ffb547' : '#3a4762'}" stroke-width="${sel ? 2.4 : 1.4}"/>`;
  h += glyph(sp.g, 17, 26);
  h += `<text class="bt" x="31" y="23" font-size="${NARROW ? 13 : 11}" font-weight="600" fill="#e8ecf4">${sp.n}</text>`;
  h += `<text class="bt" x="31" y="40" font-size="${NARROW ? 11 : 9}" fill="#8b96ad">${GRP[sp.g]}</text>`;
  return h + `</g>`;
}
function zoneSVG(k) {
  const z = ZONES[k], rb = k === 'rb', list = Object.keys(S.sorted).filter(i => S.sorted[i] === k).map(Number);
  const target = drag && drag.moved && drag.over === k;
  let h = `<g data-drag="zone-${k}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="12" fill="${rb ? 'rgba(224,96,90,.10)' : 'rgba(134,224,168,.08)'}" stroke="${rb ? '#e0605a' : '#86e0a8'}" stroke-width="${target ? 3 : 1.6}" ${target ? '' : 'stroke-dasharray="7 5"'}/>`;
  if (rb) h += `<g transform="translate(${z.x + 14} ${z.y + 9})"><rect width="14" height="17" rx="2" fill="#e0605a"/><rect x="2" y="2" width="2" height="13" fill="#8a2a26"/><path d="M7 6h5M7 9h5" stroke="#fff" stroke-width="1"/></g>`;
  else h += `<g transform="translate(${z.x + 21} ${z.y + 17})"><circle r="8" fill="#86e0a8"/><path d="M-4 0l3 3 5-6" stroke="${INK}" stroke-width="1.8" fill="none"/></g>`;
  h += `<text class="bt" x="${z.x + 36}" y="${z.y + 22}" font-size="${NARROW ? 14 : 12}" font-weight="600" fill="#e8ecf4">${rb ? 'Красная книга РК' : 'Охрана не нужна'}</text>`;
  h += `<text x="${z.x + z.w - 12}" y="${z.y + 22}" font-size="11" fill="#8b96ad" text-anchor="end">${list.length}</text>`;
  list.forEach((i, j) => {
    const cx = z.x + 14 + (j % 2) * 116, cy = z.y + 44 + Math.floor(j / 2) * 16;
    h += glyph(SPECIES[i].g, cx + 4, cy - 3).replace('<g transform', '<g opacity=".9" transform').replace(/translate\(([^ ]+) ([^)]+)\)/, 'translate($1 $2) scale(.6)');
    h += `<text class="bt" x="${cx + 13}" y="${cy + 1}" font-size="${NARROW ? 11.5 : 10}" fill="#e8ecf4">${SPECIES[i].n}</text>`;
  });
  if (!list.length) h += `<text class="bt" x="${z.x + z.w / 2}" y="${z.y + 66}" font-size="10.5" fill="#8b96ad" text-anchor="middle">${S.sel !== null ? 'нажмите, чтобы положить сюда' : 'пока пусто'}</text>`;
  return h + `</g>`;
}
function sortScene() {
  let h = '';
  h += zoneSVG('rb') + zoneSVG('ok');
  let left = 0;
  SPECIES.forEach((sp, i) => {
    if (S.sorted[i] || (drag && drag.i === i && drag.moved)) return;
    left++; const p = slotPos(i); h += cardSVG(i, p.x, p.y, false);
  });
  if (drag && drag.moved && drag.i !== undefined) h += cardSVG(drag.i, drag.px, drag.py, true);
  if (!left && !(drag && drag.moved)) h += `<text class="bt" x="260" y="190" font-size="15" fill="#86e0a8" text-anchor="middle">Все виды разложены по полкам</text>`;
  return h;
}

// --- lesson 3: lake with fish ---
const FISHDOTS = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 44; i++) FISHDOTS.push({ u: r(), v: r(), p: r() * 6.28, d: r() < .5 ? 1 : -1 }); }
const SURF = 150;
const lakeDepth = x => SURF + 168 * Math.sqrt(Math.max(0, 1 - ((x - 260) / 236) ** 2));
function lakeScene(t, m) {

    const x = clamp(x0 + swim, 50, 470), yMax = lakeDepth(x) - 14, y = SURF + 18 + f.v * Math.max(4, yMax - SURF - 18);
    const dir = reduce ? f.d : (Math.cos(t / 1600 + f.p) >= 0 ? 1 : -1);
    h += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${dir} 1)"><path d="M-7 0q7-6 14 0q-7 6-14 0z" fill="#a9d9ee"/><path d="M-7 0l-5-4v8z" fill="#a9d9ee"/><circle cx="4" cy="-1" r=".9" fill="${INK}"/></g>`;
  }

  // boat (tap = one year)

  h += `<g data-drag="boat" transform="translate(${bx} ${(SURF + bob).toFixed(1)})"><rect x="-44" y="-58" width="88" height="74" fill="transparent"/>`;
  if (m.year > 0 && m.c > 0) h += `<path d="M-30 -2Q-34 30 -20 46H18Q30 30 26 -2" fill="none" stroke="#c9d3e3" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>`;

  h += ol('M0 -12V-52', 'none', '#c9d3e3', 2);

    { k: 'Экономика · улов', v: m.year ? m.c / 25 : 0, txt: m.year ? `${fmt(m.c, 1)} тыс. т в год` : 'промысла ещё не было', c: '#ffb547' },
    { k: 'Общество · работа', v: m.year ? m.c / 25 : 0, txt: m.year ? `≈ ${Math.round(m.c * 40)} рыбаков` : '—', c: '#72d4e8' },
  ];

function hlShapes(id) {
  const B = (x, y, w, hh) => `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5"/>`;
  const C = (x, y, r) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="5 4"/>`;
  const at = (o, r) => { const [x, y] = PX(o.lon, o.lat); return C(x, y, r); };
  switch (id) {
    case 'cards': case 'icons': return NARROW ? B(14, 34, 492, 254) : B(6, 90, 508, 188);
    case 'zrb': return B(6, 286, 254, 114);
    case 'zok': return B(260, 286, 254, 114);
    case 'res': return RESERVES.map(r => at(r, 12)).join('');
    case 'np': return NPARKS.map(r => at(r, 11)).join('');
    case 'water': { const a = PX(48.4, 44.5), b = PX(60.2, 45.5), c = PX(76.3, 46.5); return C(a[0], a[1], 34) + C(b[0], b[1], 34) + C(c[0], c[1], 40); }
    case 'cities': return CITIES.map(c => at(c, 12)).join('');
    case 'lake': return B(20, 140, 480, 184);
    case 'boat': return B(280, 88, 100, 84);
    case 'pillars': return NARROW ? B(14, 328, 492, 70) : B(8, 340, 504, 52);

function drawScene(t) {
  const id = LID(), m = model();
  let h = background();
  if (id === 'redbook') h += sortScene();
  else if (id === 'reserves') h += mapScene(t);
  else h += lakeScene(t, m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) S.hl = null;
    else h += `<g opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}">${hlShapes(S.hl.id)}</g>`;

}

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 490, hh / 410, 1.7);
  const qb = $('#qbox'), extra = qb.hidden ? 0 : (qb.offsetHeight + 6) / s;
  VB = { w: w / s, h: hh / s }; NARROW = VB.h > VB.w * 1.05; CARD.w = NARROW ? 154 : 118; CARD.h = NARROW ? 56 : 52; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h + extra;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);

}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const zoneAt = (x, y) => { for (const k of ['rb', 'ok']) { const z = ZONES[k]; if (x > z.x - 6 && x < z.x + z.w + 6 && y > z.y - 10 && y < z.y + z.h + 10) return k; } return null; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const id = el.dataset.drag;
  drag = { id, x: e.clientX, y: e.clientY, moved: false };
  if (id.startsWith('card')) {

    Object.assign(drag, { i, dx: sp.x - p.x, dy: sp.y - p.y, px: sp.x, py: sp.y, over: null });

});

function endDrag(cancel) {
  if (!drag) return;

function sortCard(i, zone) {
  const sp = SPECIES[i]; S.lastCard = i;
  if (S.sorted[i]) return;
  if ((zone === 'rb') === sp.rb) {
    S.sorted[i] = zone; S.sel = null; toast(`${sp.n}. ${sp.note}`);
  } else {
    S.errors++; S.sel = i;
    toast(sp.rb ? `${sp.n}: подумайте ещё. Много ли их? Не сокращается ли их число? Подсказка — во вкладке «Расчёты».` : `${sp.n} — многочисленный и широко распространённый вид. В Красную книгу вносят редких и исчезающих.`);
  }

}
function answer(i) {
  const qi = curQ();
  S.info = { k: 'res', i };
  if (qi < 0 || S.found[i]) { toast(`${RESERVES[i].n}: ${RESERVES[i].info}`); update(); return; }
  if (QUIZ[qi].r === i) {
    S.found[i] = true; toast(`Верно! ${RESERVES[i].n}. ${RESERVES[i].info}`);
  } else {
    S.qerr++; toast(`Это заповедник «${RESERVES[i].n}» — ${RESERVES[i].info} Не подходит, ищите дальше.`);

}
function stepYear() {
  const h = S.hist, last = h[h.length - 1];

  const g = growth(last.N), avail = last.N + g, c = Math.min(S.quota, avail);
  let N = avail - c; if (N < 0.5) N = 0;
  h.push({ N, c, H: S.quota });

}

    sustain: B('q-', 'Квота −') + B('q+', 'Квота +') + sep + B('year', '+1 год') + B('run', S.run ? 'Пауза' : '30 лет ▶') + sep + B('reset', 'Заново'),
  }[id];

function act(a) {
  if (a === 'to-rb' || a === 'to-ok') { if (S.sel === null) toast('Сначала нажмите на карточку вида.'); else sortCard(S.sel, a.slice(3)); return; }
  if (a === 'np') { S.np = !S.np; if (!S.np && S.info && S.info.k === 'np') S.info = null; renderTools(); update(); buildScheme(); return; }
  if (a === 'reset') { const keepQ = S.quota; resetLesson(); if (LID() === 'sustain') S.quota = keepQ; renderTools(); buildScheme(); renderQ(); update(); return; }

};

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'sort') return `Разложено ${m.sorted} из ${SPECIES.length} · ошибок ${m.errors}`;
  if (m.kind === 'map') return `Найдено ${m.found} из ${QUIZ.length} · промахов ${m.errors}`;
  if (m.collapsed) return `Год ${m.year}: рыбы не осталось — «Заново»`;
  if (m.year && !m.allQuota) return `Год ${m.year}: был год с уловом меньше 11 тыс. т`;
  if (m.minN < FISH.minN) return `Год ${m.year}: запас падал до ${fmt(m.minN, 1)} тыс. т — меньше 50`;
  return `Год ${m.year} из 30 · квота ${fmt(S.quota, 1)} · запас ${fmt(m.N, 1)} тыс. т`;
}

// stock chart: years 0…30, stock 0…100 (blue), catch ×4 (orange bars)
function chartSVG(mini) {
  const X = y => 12 + y * 3.5, Y = v => 66 - v * 0.6;
  let h = mini ? `<svg viewBox="0 0 120 76" aria-hidden="true">` : `<svg class="diag" viewBox="0 0 120 78" role="img" aria-label="Запас рыбы и улов по годам">`;
  h += `<rect x="12" y="6" width="105" height="60" fill="none" stroke="#26324a" stroke-width=".5"/>`;
  h += `<path d="M12 ${Y(50)}H117" stroke="#86e0a8" stroke-width=".5" stroke-dasharray="1.5 1.5"/>`;
  for (const v of [0, 50, 100]) h += `<text x="10" y="${Y(v) + 1.3}" font-size="${mini ? 5 : 3.4}" fill="#8b96ad" text-anchor="end">${v}</text>`;
  for (const y of [0, 10, 20, 30]) h += `<text x="${X(y)}" y="72.5" font-size="${mini ? 5 : 3.4}" fill="#8b96ad" text-anchor="middle">${y}</text>`;
  if (!mini) h += `<text x="115" y="11" font-size="3.4" fill="#5fb4d9" text-anchor="end">запас, тыс. т</text><text x="115" y="16" font-size="3.4" fill="#ffb547" text-anchor="end">улов × 4</text><text x="115" y="63" font-size="3.4" fill="#8b96ad" text-anchor="end">годы</text>`;
  S.hist.forEach((p, y) => { if (y && p.c > 0) h += `<rect x="${(X(y) - 1.1).toFixed(2)}" y="${Y(p.c * 4).toFixed(2)}" width="2.2" height="${(p.c * 4 * 0.6).toFixed(2)}" fill="#ffb547" opacity=".8"/>`; });
  h += `<path d="${S.hist.map((p, y) => (y ? 'L' : 'M') + X(y).toFixed(2) + ' ' + Y(p.N).toFixed(2)).join('')}" fill="none" stroke="#5fb4d9" stroke-width="${mini ? 1.6 : 1}"/>`;
  const L = S.hist.length - 1;
  h += `<circle cx="${X(L).toFixed(2)}" cy="${Y(S.hist[L].N).toFixed(2)}" r="${mini ? 2.6 : 1.6}" fill="#5fb4d9" stroke="#e8ecf4" stroke-width=".5"/>`;
  return h + `</svg>`;
}
// growth curve g(N) with the quota line
function growthSVG() {
  const X = n => 12 + n * 1.05, Y = g => 66 - g * 4;
  let h = `<svg class="diag" viewBox="0 0 120 76" role="img" aria-label="Прирост рыбы в зависимости от запаса и линия квоты">`;
  h += `<rect x="12" y="6" width="105" height="60" fill="none" stroke="#26324a" stroke-width=".5"/>`;
  let d = ''; for (let n = 0; n <= 100; n += 2) d += (d ? 'L' : 'M') + X(n).toFixed(2) + ' ' + Y(growth(n)).toFixed(2);
  h += `<path d="${d}" fill="none" stroke="#86e0a8" stroke-width="1"/>`;
  const q = Math.min(S.quota, 14.5);
  h += `<path d="M12 ${Y(q).toFixed(2)}H117" stroke="#ffb547" stroke-width=".7" stroke-dasharray="2 1.4"/><text x="115" y="${(Y(q) - 1.5).toFixed(2)}" font-size="3.4" fill="#ffb547" text-anchor="end">квота ${fmt(S.quota, 1)}${S.quota > 14.5 ? ' ↑' : ''}</text>`;
  h += `<path d="M${X(50)} 6V66" stroke="#26324a" stroke-width=".5" stroke-dasharray="1.5 1.5"/><circle cx="${X(50)}" cy="${Y(MSY)}" r="1.2" fill="#86e0a8"/>`;
  const N = S.hist[S.hist.length - 1].N; h += `<circle cx="${X(N).toFixed(2)}" cy="${Y(growth(N)).toFixed(2)}" r="1.6" fill="#5fb4d9" stroke="#e8ecf4" stroke-width=".4"/>`;
  for (const n of [0, 50, 100]) h += `<text x="${X(n)}" y="72" font-size="3.4" fill="#8b96ad" text-anchor="middle">${n}</text>`;
  for (const g of [0, 6, 12]) h += `<text x="10" y="${Y(g) + 1.2}" font-size="3.4" fill="#8b96ad" text-anchor="end">${g}</text>`;
  h += `<text x="14" y="11" font-size="3.4" fill="#86e0a8">прирост за год, тыс. т</text><text x="115" y="63" font-size="3.4" fill="#8b96ad" text-anchor="end">запас N</text>`;
  return h + `</svg>`;
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'redbook') h = `<h2>Сортировка видов</h2>
    <dl class="reads"><div><dt>Разложено</dt><dd id="r1"></dd></div><div><dt>В книге</dt><dd id="r2"></dd></div><div><dt>Ошибок</dt><dd id="r3"></dd></div></dl>

  if (id === 'reserves') h = `<h2>Заповедники на карте</h2>

    `<div class="row"><button class="ghostbtn" data-a="year">+1 год</button><button class="ghostbtn" data-a="run" id="runBtn"></button><button class="ghostbtn" data-a="reset">Заново</button></div>
    <h3>Прирост рыбы</h3><div id="gDiag"></div><p class="note" style="margin-top:8px">Зелёная кривая — сколько рыбы прибавляется за год при данном запасе. Если квота выше вершины кривой, запас обязательно падает.</p>`;
  el.innerHTML = h;
  const inQ = el.querySelector('#inQ'); if (inQ) inQ.addEventListener('input', e => { S.quota = +e.target.value; update(); });
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
  el.querySelectorAll('#resChips button').forEach(b => b.onclick = () => answer(+b.dataset.i));

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  if (m.kind === 'sort') {
    set('#r1', `${m.sorted}/${SPECIES.length}`); set('#r2', String(m.inRB)); set('#r3', String(m.errors));
    const ch = el.querySelector('#spChips');
    if (ch) {
      ch.innerHTML = SPECIES.map((s, i) => S.sorted[i] ? '' : `<button data-i="${i}" aria-pressed="${S.sel === i}">${s.n}</button>`).join('') || '<span class="note">Все виды разложены.</span>';
      ch.querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; S.sel = S.sel === i ? null : i; S.lastCard = i; update(); });
    }
  } else if (m.kind === 'map') {
    set('#r1', `${m.found}/${QUIZ.length}`); set('#r2', String(m.errors)); set('#r3', m.qi < 0 ? 'готово' : `${m.qi + 1} из ${QUIZ.length}`);
    set('#qText', m.qi < 0 ? 'Все пять заповедников найдены.' : QUIZ[m.qi].q);
    el.querySelectorAll('#resChips button').forEach(b => { const f = !!S.found[+b.dataset.i]; b.classList.toggle('okc', f); b.setAttribute('aria-pressed', !!(S.info && S.info.k === 'res' && S.info.i === +b.dataset.i)); });
    set('#npBtn', S.np ? 'Скрыть нацпарки' : 'Показать нацпарки');
  } else {
    const d = el.querySelector('#sDiag'); if (d) d.innerHTML = chartSVG(false);
    const g = el.querySelector('#gDiag'); if (g) g.innerHTML = growthSVG();
    set('#r1', `${m.year}/30`); set('#r2', fmt(m.N, 1)); set('#r3', m.year ? fmt(m.c, 1) : '—');
    set('#inQO', fmt(S.quota, 1)); const q = el.querySelector('#inQ'); if (q && document.activeElement !== q) q.value = S.quota;
    set('#runBtn', S.run ? 'Пауза' : '30 лет ▶');
  }
}

      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'redbook') {
    let h = `<h2>Как решают, кого вносить</h2><div class="formula" style="font-size:14px">мало особей<br>или численность быстро падает<br>или очень маленький ареал<br>→ Красная книга</div>
      <p class="note">Ареал — территория, где живёт вид. Хватает одного признака. Обычно смотрят на учёты за много лет.</p>`;
    const i = S.sel !== null ? S.sel : S.lastCard;
    if (i !== null && i !== undefined) {
      const sp = SPECIES[i], st = S.sorted[i];
      h += `<h3>${sp.n}</h3><div class="steps">` + step('Группа', GRP[sp.g], 'txt') + step('Где живёт', sp.clue, 'txt');
      if (st) h += step('Решение', st === 'rb' ? 'Красная книга РК' : 'охрана не нужна', 'sum txt') + `</div><p class="note" style="margin-top:10px">${sp.note}</p>`;
      else h += step('Решение', 'ваше: много их или мало?', 'sum txt') + `</div>`;
    } else h += `<p class="note">Выберите карточку — здесь появится подсказка о том, где живёт вид.</p>`;
    h += `<h3>Цвета страниц</h3><p class="note">В классических Красных книгах (как в книге СССР) страницы окрашены по категориям: красные — исчезающие виды, жёлтые — сокращающиеся, белые — редкие, серые — малоизученные, зелёные — восстановленные.</p>`;
    h += `<h3>Итог</h3><div class="steps">` + step('разложено', `${m.sorted} из ${SPECIES.length}`) + step('в Красной книге', String(m.inRB)) + step('ошибок', String(m.errors), 'sum') + `</div>`;
    return h;
  }
  if (id === 'reserves') {
    let h = `<h2>Режимы охраны</h2><div class="steps">` +
      step('Заповедник', 'хозяйство запрещено, главное — наука и охрана', 'txt') +
      step('Национальный парк', 'зоны: строгая охрана + туризм', 'txt') +
      step('Заказник', 'запрет отдельных занятий, часто на время', 'txt') +
      step('Памятник природы', 'один объект: скала, роща, водопад', 'txt') + `</div>`;
    h += `<h3>Как искать</h3><div class="steps">` + step('1. Ключевые слова', 'горы, озеро, степь, пустыня?', 'txt') + step('2. Часть страны', 'север, юг, запад, восток?', 'txt') + step('3. Сверка', 'нажмите и прочитайте описание', 'sum txt') + `</div>`;
    if (S.info) {
      const o = S.info.k === 'res' ? RESERVES[S.info.i] : NPARKS[S.info.i];
      h += `<h3>${S.info.k === 'res' ? 'Заповедник' : 'Национальный парк'} «${o.n}»</h3><p>${o.info}</p>`;
    }
    const f = RESERVES.filter((r, i) => S.found[i]);
    if (f.length) h += `<h3>Найдено</h3><div class="steps">` + f.map(r => step(r.n, 'заповедник', 'txt')).join('') + `</div>`;
    return h;
  }
  const N = m.N, g = growth(N), avail = N + g, c = Math.min(S.quota, avail), N1 = Math.max(0, avail - c);
  let h = `<h2>Модель промысла</h2><div class="formula">прирост = r · N · (1 − N / K)</div><p class="note">N — запас рыбы, K = 100 тыс. т — больше озеро не прокормит, r = 0,5 в год — скорость размножения. Так растут многие популяции: медленно, когда рыбы мало, и медленно, когда тесно.</p>
    <h3>Следующий год (сейчас год ${m.year})</h3><div class="steps">` +
    step('запас N', fmt(N, 1) + ' тыс. т') +
    step('прирост', `0,5 × ${fmt(N, 1)} × (1 − ${fmt(N / 100, 3)}) = ${fmt(g, 2)}`) +
    step('до промысла', `${fmt(N, 1)} + ${fmt(g, 2)} = ${fmt(avail, 2)}`) +
    step('улов', `${fmt(c, 1)} тыс. т${c < S.quota ? ' (квота не набрана)' : ''}`) +
    step('станет', `${fmt(avail, 2)} − ${fmt(c, 1)} = ${fmt(N1, 2)} тыс. т`, 'sum') + `</div>
    <h3>Максимальный устойчивый улов</h3><div class="steps">` +
    step('прирост больше всего при', 'N = K / 2 = 50 тыс. т') +
    step('наибольший прирост', `0,5 × 50 × (1 − 0,5) = ${fmt(MSY, 1)} тыс. т`) +
    step('вывод', `квота ≤ ${fmt(MSY, 1)} — запас держится`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Если квота больше прироста, запас каждый год уменьшается, прирост падает ещё сильнее — и рыба кончается. Так погибли многие промыслы мира.</p>
    <h3>Итог промысла</h3><div class="steps">` + step('лет прошло', String(m.year)) + step('выловлено всего', fmt(m.total, 1) + ' тыс. т') + step('минимальный запас', fmt(m.minN, 1) + ' тыс. т', 'sum') + `</div>`;
  return h;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    const fin = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length === LESSONS.length;
    setTimeout(() => toast(fin ? 'Все задания выполнены. Вы настоящий эколог!' : 'Задание выполнено. Можно переходить к следующему уроку.'), 1200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  redbook: '<rect x="8" y="5" width="15" height="20" rx="2" fill="#e0605a"/><rect x="10" y="7" width="2" height="16" fill="#8a2a26"/><circle cx="40" cy="15" r="5" fill="#ffb547"/><circle cx="36" cy="10" r="2.2" fill="#ffb547"/><circle cx="44" cy="10" r="2.2" fill="#ffb547"/><path d="M50 22q0-9 9-10q0 9-9 10z" fill="#86e0a8"/>',
  reserves: '<path d="M6 14l8-7 14 2 10-4 14 5 8 6-6 6-14 1-10 4-16-3z" fill="#17263a" stroke="#4a5a7a"/><circle cx="20" cy="15" r="2.4" fill="#86e0a8"/><circle cx="34" cy="20" r="2.4" fill="#ffb547"/><circle cx="50" cy="12" r="2.4" fill="#ffb547"/>',
  sustain: '<path d="M4 26V4" stroke="#8b96ad"/><path d="M5 6q10 2 16 10t22 4h18" stroke="#5fb4d9" stroke-width="1.5" fill="none"/><rect x="24" y="22" width="3" height="4" fill="#ffb547"/><rect x="32" y="21" width="3" height="5" fill="#ffb547"/><rect x="40" y="21" width="3" height="5" fill="#ffb547"/><rect x="48" y="21" width="3" height="5" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); renderQ(); update();
  const ls = $('#lessons'), cur = ls.querySelector('.lesson[aria-current="true"]');
  if (cur) { const a = ls.getBoundingClientRect(), b = cur.getBoundingClientRect(); ls.scrollLeft += b.left - a.left - (a.width - b.width) / 2; }
}

let lastStep = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const id = LID();
  if (id === 'sustain' && S.run && t - lastStep > 280) {
    lastStep = t;
    if (S.hist.length - 1 >= FISH.years || !stepYear() || S.hist.length - 1 >= FISH.years) { S.run = false; renderTools(); updateScheme(model()); }
  }
  const anim = !reduce && (id === 'sustain' || (id === 'reserves' && S.info && !(S.info.k === 'res' && S.found[S.info.i])));
  if (dirty || anim || S.hl) { drawScene(t); dirty = false; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'redbook') {
    const left = SPECIES.filter((s, i) => !S.sorted[i]).map(s => s.n);
    now = `Ученик раскладывает 12 видов Казахстана на две полки: «Красная книга РК» и «Охрана не нужна». Разложено ${m.sorted} из 12, ошибок ${m.errors}. В Красной книге: ${SPECIES.filter((s, i) => S.sorted[i] === 'rb').map(s => s.n).join(', ') || 'пока никого'}. На полке «Охрана не нужна»: ${SPECIES.filter((s, i) => S.sorted[i] === 'ok').map(s => s.n).join(', ') || 'пока никого'}. Ещё не разложены: ${left.join(', ') || 'все разложены'}.${S.sel !== null ? ` Выбрана карточка «${SPECIES[S.sel].n}».` : ''}`;
    guide = 'Не говори прямо, на какую полку класть неразложенные виды: наводи вопросами о численности, ареале и угрозах.';
  }
  if (id === 'reserves') {
    now = `Схематичная карта Казахстана с 10 заповедниками (оранжевые кружки) ${S.np ? 'и 6 национальными парками (голубые квадраты)' : ''}. Ученик по описаниям ищет 5 заповедников. Найдено ${m.found} из 5: ${RESERVES.filter((r, i) => S.found[i]).map(r => r.n).join(', ') || 'пока ни одного'}. Промахов ${m.errors}. ${m.qi >= 0 ? `Текущее описание: «${QUIZ[m.qi].q}»` : 'Все найдены.'}`;
    guide = 'Не называй прямо заповедник по текущему описанию: подскажи, в какой части страны искать и на какие ключевые слова обратить внимание.';
  }
  if (id === 'sustain') {
    now = `Модель промысла в озере: прирост = 0,5·N·(1 − N/100), N — запас в тыс. т, вначале 100. Квота ${fmt(S.quota, 1)} тыс. т в год. Прошло лет: ${m.year} из 30. Запас сейчас ${fmt(m.N, 1)} тыс. т, минимальный за время промысла ${fmt(m.minN, 1)}, улов в последний год ${m.year ? fmt(m.c, 1) : '—'}, всего выловлено ${fmt(m.total, 1)} тыс. т.${m.collapsed ? ' Рыба кончилась.' : ''} Условия задания: каждый год улов не меньше 11 тыс. т, запас не ниже 50 тыс. т.`;
    guide = 'Помоги понять, почему квота выше максимального прироста ведёт к краху, но сам ответ (диапазон квоты) не называй сразу — пусть ученик посчитает прирост при N = 50.';
  }
  return [
    `Раздел: биология, 11 класс, экология. Тема «Охрана природы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Указание репетитору: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    redbook: 'По каким признакам вид заносят в Красную книгу?',
    reserves: 'Чем заповедник отличается от национального парка?',
    sustain: 'Почему улов больше прироста приводит к краху?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
