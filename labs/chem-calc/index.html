<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 9–11 класс: вывод формулы по массовым долям и по продуктам сгорания, избыток и недостаток, выход продукта, смеси веществ, расчёты по электролизу.">
<title>Расчётные задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene [data-drag] text{pointer-events:none}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
.tgts{display:grid;gap:6px;margin-top:10px}
.tgts div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px}
.tgts div span:last-child{font:500 12.5px var(--font-mono);color:var(--muted);white-space:nowrap}
.tgts div.on span:last-child{color:var(--ok)}
.cnt.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cnt.c1 button,.cnt.c2 button{width:40px;height:40px}
.qbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:10px}
.qbox p{margin:0 0 8px;font-size:14px}
.qbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:7px}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow input{width:120px;min-height:42px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:500 15px var(--font-mono)}
.qrow input:focus{border-color:var(--arm)}
.qrow .u{font-size:13px;color:var(--muted)}
.qrow .ghostbtn{min-height:42px}
.qbox .state{margin-top:8px}
.qbox .state.bad{color:var(--warn)}
.row .ghostbtn{min-height:40px}
.tools button{min-height:40px}
.chips button{min-height:40px}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Расчёты</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Расчётный стол: модель формулы, установка для сжигания, столбики молей, смесь с газовой бюреткой, электролизёр. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-calc';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fmt = (x, d = 2) => String(+(+x).toFixed(d)).replace('.', ',');

let saved = {};

const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null, qd: {}, qw: {} };
function resetState() {
  Object.assign(S, {
    p1: 0, ix1: PROB1.map(P => P.els.map(() => 1)), f1: {},
    p2: 0, ix2: PROB2.map(() => [1, 1, 0]), burned: {}, burnT: 0, f2: {},
    p3: 0, nA: 1, nB: 1, nP: 0, lim: null, solved: {},
    p4: 0, k4: PROB4.map(P => Math.round(P.m / P.st * 0.75)), f4: {},

  });
}
resetState();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID();
  if (id === 'frac') {
    const P = PROB1[S.p1], idx = S.ix1[S.p1];
    const M = P.els.reduce((s, e, i) => s + AR[e] * idx[i], 0);
    const w = P.els.map((e, i) => AR[e] * idx[i] / M * 100);
    const wok = w.map((x, i) => Math.abs(x - P.w[i]) < 0.06), wOk = wok.every(Boolean);
    const g = idx.reduce((a, b) => gcd(a, b)), Mreq = P.D ? P.D.v * Mof(P.D.g) : null;
    const Mok = P.D ? near(M, Mreq) : g === 1;
    return { kind: 'frac', P, idx, f: fstr(P.els, idx), M, w, wok, wOk, g, Mreq, Mok, ok: wOk && Mok, found: S.f1 };
  }
  if (id === 'burn') {
    const P = PROB2[S.p2], idx = S.ix2[S.p2], burned = !!S.burned[S.p2];
    const M = 12 * idx[0] + idx[1] + 16 * idx[2], Mreq = P.D.v * Mof(P.D.g), n = P.m / M;
    const nCO2 = P.co2.V ? P.co2.V / VM : P.co2.m / 44, nH2O = P.h2o / 18;
    const pCO2 = n * idx[0], pH2O = n * idx[1] / 2;
    const okM = near(M, Mreq), okC = Math.abs(pCO2 - nCO2) < 1e-3, okH = Math.abs(pH2O - nH2O) < 1e-3;
    return { kind: 'burn', P, idx, f: fstr(EL2, idx), M, Mreq, D: M / Mof(P.D.g), n, nCO2, nH2O, pCO2, pH2O, okM, okC, okH, burned, ok: burned && okM && okC && okH, found: S.f2 };
  }
  if (id === 'excess') {
    const P = PROB3[S.p3], MA = Mof(P.A), MB = Mof(P.B), MP = Mof(P.P), cA = coefOf(P, P.A), cB = coefOf(P, P.B), cP = coefOf(P, P.P);
    const mA = S.nA * MA, mB = S.nB * MB, okA = near(mA, P.mA), okB = near(mB, P.mB);
    const tA = P.mA / MA / cA, tB = P.mB / MB / cB, limT = tA < tB ? 'A' : 'B';
    const nLim = limT === 'A' ? P.mA / MA : P.mB / MB, cLim = limT === 'A' ? cA : cB;
    const target = nLim / cLim * cP * P.eta, limOk = S.lim === limT && okA && okB;
    const okP = limOk && near(S.nP, target);
    const out = P.ask === 'm' ? S.nP * MP : S.nP * VM;
    const exF = limT === 'A' ? P.B : P.A, exN = limT === 'A' ? P.mB / MB - nLim / cA * cB : P.mA / MA - nLim / cB * cA;
    return { kind: 'excess', P, MA, MB, MP, cA, cB, cP, nA: S.nA, nB: S.nB, nP: S.nP, mA, mB, okA, okB, limT, limOk, okP, out, exF, exN, solved: S.solved };
  }
  if (id === 'mix') {
    const P = PROB4[S.p4], k = S.k4[S.p4], mA = k * P.st, mB = P.m - mA, MA = Mof(P.A), MB = Mof(P.B);
    const gA = mA / MA * P.rA, gB = mB / MB * P.rB, V = (gA + gB) * VM;
    return { kind: 'mix', P, k, K: Math.round(P.m / P.st), mA, mB, MA, MB, gA, gB, V, ok: Math.abs(V - P.V) < 0.01, found: S.f4 };
  }
  const s = SALT[S.salt], I = S.I2 / 2, t = S.tm * 60, Q = I * t, ne = Q / FAR;
  const nC = ne / s.cat.z, nAn = ne / s.an.z;
  const cat = s.cat.gas ? nC * VM : nC * AR[s.cat.f], an = nAn * VM;
  const ti = TARG5.findIndex(x => x.s === S.salt);
  return { kind: 'far', s, salt: S.salt, I, tm: S.tm, Q, ne, nC, nAn, cat, an, ti, hit: ti >= 0 && Math.abs(cat - TARG5[ti].v) <= TARG5[ti].tol, found: S.f5 };
}

// ---------- drawing helpers ----------

const T = (x, y, s, fs, c, a, w) => `<text x="${x}" y="${y}" font-size="${fs}" fill="${c || FG}"${a ? ` text-anchor="${a}"` : ''}${w ? ' font-weight="500"' : ''}>${s}</text>`;

// steppers on the right side of the bench (lessons 1 and 2)
const STP = { x: 312, y0: 140, dy: 62 };
function steppers(els, idx, mins, dis) {
  let h = T(STP.x + 96, STP.y0 - 10, 'ИНДЕКСЫ', 9.5, MUT, 'middle');
  els.forEach((e, i) => {

// little molecule: one row of atoms per element
function atomRows(els, idx, x, y) {
  let h = '';
  els.forEach((e, i) => { for (let k = 0; k < idx[i]; k++) h += ball(x + k * 14, y + i * 17, 6.2, EL[e].c, '', '', 0); });

}

function burnSVG(m, t) {

  if (fire) { const f = reduce ? 1 : 1 + 0.15 * Math.sin(t / 60); h += `<path d="M${bx} ${(214 - 34 * f).toFixed(1)}q12 18 0 32q-12 -14 0 -32z" fill="#ffb547" opacity=".9"/><path d="M${bx} ${(214 - 20 * f).toFixed(1)}q6 10 0 18q-6 -8 0 -18z" fill="#72d4e8"/>`; }

  h += uTube(APP.u1, 150, 30, '#e6e9ef', k, 'CaCl₂', '#72d4e8') + uTube(APP.u2, 150, 30, '#c9b8f0', k, 'KOH', '#9aa6bd');
  const co2 = P.co2.V ? `${fmt(P.co2.V * k)} л` : `+${fmt(P.co2.m * k, 1)} г`;
  h += T(APP.u1 + 15, 272, `H₂O +${fmt(P.h2o * k, 2)} г`, 9.5, k ? FG : MUT, 'middle') + T(APP.u2 + 24, 286, `CO₂ ${co2}`, 9.5, k ? FG : MUT, 'middle');
  // candidate
  h += T(20, 312, low(m.f), 24, done ? OK : FG, 'start', 1);

const BR = { A: 110, B: 222, P: 404, base: 296, k: 72, w: 58 };

function excessSVG(m) {

  h += T(260, 128, `дано: m(${low(P.A)}) = ${fmt(P.mA)} г, m(${low(P.B)}) = ${fmt(P.mB)} г${P.eta < 1 ? ` · выход ${P.eta * 100} %` : ''} · найти: ${P.ask}(${low(P.P)})`, 10, MUT, 'middle');
  for (let q = 0; q <= NMAX3 * 2; q++) {
    const y = barTop(q / 2);
    h += `<path d="M58 ${y}H470" stroke="rgba(160,185,230,${q % 2 ? 0.06 : 0.13})"/>`;
    h += T(52, y + 3.5, fmt(q / 2, 1), 9, MUT, 'end');
  }
  h += `<path d="M313 ${barTop(NMAX3)}V${BR.base}" stroke="#26324a" stroke-dasharray="4 4"/>`;
  const bar = (key, n, c, f, ok, dim) => {
    const cx = BR[key], y = barTop(n);

const scene = $('#scene');

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 500, hh / 410, 1.7);
  const vw = w / s, vh = hh / s;
  scene.setAttribute('viewBox', `${(260 - vw / 2).toFixed(1)} ${(405 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- dragging and tapping ----------
const LIVE = new Set(['bA', 'bB', 'bP', 'div']);
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const snap = v => clamp(Math.round(v * 20) / 20, 0, NMAX3);
function liveSet(d) {
  const y = d.p.y + d.off;
  if (d.id === 'div') {
    const P = PROB4[S.p4], K = Math.round(P.m / P.st), k = clamp(Math.round((y - MX.y) / MX.h * P.m / P.st), 0, K);
    if (k !== S.k4[S.p4]) { S.k4[S.p4] = k; update(true); }
    return;
  }
  const key = { bA: 'nA', bB: 'nB', bP: 'nP' }[d.id], n = snap((BR.base - y) / BR.k);
  if (n !== S[key]) { S[key] = n; update(true); }
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  drag = { id: el.dataset.drag, x: e.clientX, y: e.clientY, p: toSvg(e), moved: false, off: 0 };
  if (drag.id === 'bP' && !model().limOk) { toast('Сначала выставьте моли обоих реагентов и отметьте вещество в недостатке.'); drag = null; scene.classList.remove('grabbing'); return; }
  if (LIVE.has(drag.id)) {
    const top = drag.id === 'div' ? MX.y + model().mA / PROB4[S.p4].m * MX.h : barTop({ bA: S.nA, bB: S.nB, bP: S.nP }[drag.id]);
    drag.off = top - drag.p.y;
  }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  drag.p = toSvg(e);
  if (LIVE.has(drag.id) && drag.moved) liveSet(drag);
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (LIVE.has(d.id)) { if (d.moved) after(); update(); return; }
  if (cancel || d.moved) return;
  tap(d.id);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const [a, b, c] = id.split(':');
  if (a === 'ix') return stepIdx(+b, +c);
  if (a === 'burn') return burn();
  if (a === 'lim') return pickLim(b);
  if (a === 'mx') return stepMix(+b);
  if (a === 'I') return setI(S.I2 + +b);
  if (a === 't') return setT(S.tm + +b);
}

// feedback after a deliberate change (not on every live frame)
function after() {
  const m = model();
  if (m.kind === 'frac' && !m.found[S.p1]) {
    if (m.wOk && !m.Mok) toast(m.P.D ? 'Доли совпали — это простейшая формула. Теперь сравните молярную массу с плотностью газа.' : 'Доли совпали, но индексы можно сократить. Нужна простейшая формула.');
  }
  if (m.kind === 'burn' && m.burned && !m.found[S.p2] && m.okM && !(m.okC && m.okH)) toast('Молярная масса подходит, а продукты сгорания — нет. Сравните n(C) с n(CO₂) и n(H) с 2 · n(H₂O).');
  if (m.kind === 'excess' && m.okA && m.okB && !S.lim) toast('Массы совпали. Теперь отметьте вещество в недостатке.');
  if (m.kind === 'excess' && m.limOk && !m.okP && S.nP > 0) toast(m.P.eta < 1 ? 'Пока не так. По уравнению найдите теоретические моли и умножьте на выход.' : 'Пока не так. Считайте по веществу в недостатке и по коэффициентам.');
}
function stepIdx(i, d) {
  const id = LID(), arr = id === 'frac' ? S.ix1[S.p1] : S.ix2[S.p2], min = id === 'burn' && i === 2 ? 0 : 1;
  const v = arr[i] + d;
  if (v < min || v > IXMAX) { toast(v < min ? 'Меньше нельзя.' : 'Больше 12 атомов одного элемента в наших задачах не бывает.'); return false; }
  arr[i] = v; after(); update(); return true;
}
function burn() {
  if (S.burned[S.p2] || S.burnT) return;
  if (reduce) { S.burned[S.p2] = true; update(); toast('Навеска сгорела. Трубки поглотили воду и CO₂.'); return; }
  S.burnT = performance.now(); dirty = true;
}
function pickLim(k) {
  const m = model();
  if (!(m.okA && m.okB)) { toast('Сначала выставьте моли обоих реагентов по их массам.'); return false; }
  if (k !== m.limT) { toast('Нет, этого вещества хватает. Разделите моли каждого реагента на его коэффициент и сравните.'); S.lim = null; update(); return false; }
  S.lim = k; update(); toast(`Верно: ${low(k === 'A' ? m.P.A : m.P.B)} кончится первым. Теперь моли продукта.`); return true;
}
function stepMix(d) { const P = PROB4[S.p4], K = Math.round(P.m / P.st); S.k4[S.p4] = clamp(S.k4[S.p4] + d, 0, K); update(); return true; }
function setI(v) { S.I2 = clamp(v, 1, IMAX); update(); return true; }
function setT(v) { S.tm = clamp(v, 0, TMAX); update(); return true; }
function setProb(i) {
  const id = LID(), n = 3; i = (i + n) % n;
  if (id === 'frac') S.p1 = i;
  if (id === 'burn') { S.p2 = i; S.burnT = 0; }
  if (id === 'excess') { S.p3 = i; S.nA = 1; S.nB = 1; S.nP = 0; S.lim = null; }
  if (id === 'mix') S.p4 = i;
  renderTools(); buildScheme(); update();
}
function setSalt(s) { S.salt = s; renderTools(); buildScheme(); update(); }
function setNb(k, n) { S[k] = snap(n); update(); }

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  let anim = !!S.hl;
  if (S.burnT && LID() === 'burn') {
    anim = true;
    if (t - S.burnT > 1600) { S.burned[S.p2] = true; S.burnT = 0; update(); toast('Навеска сгорела. Трубки поглотили воду и CO₂ — смотрите прибавку массы.'); }
  }
  const id = LID();
  const live = !reduce && t - last > 50 && ((id === 'faraday' && S.tm > 0) || (id === 'burn' && !S.burned[S.p2]));
  if (dirty || anim || live) { drawScene(t); dirty = false; last = t; }
}

const PL = ['Вещество', 'Вещество', 'Задача', 'Смесь'];
function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  const probs = (cur, found) => [0, 1, 2].map(i => B('p-' + i, (i + 1) + (found[i] ? ' ✓' : ''), cur === i)).join('');
  tb.innerHTML = {
    frac: probs(S.p1, S.f1),
    burn: probs(S.p2, S.f2) + sep + B('burn', 'Сжечь'),
    excess: probs(S.p3, S.solved) + sep + B('rst', 'Сброс'),
    mix: probs(S.p4, S.f4) + sep + B('mx-', '−') + B('mx+', '+'),
    faraday: SALTS.map(s => B('s-' + s, low(s) + (TARG5.some((x, i) => x.s === s && S.f5[i]) ? ' ✓' : ''), S.salt === s)).join(''),
  }[id];
}
function act(a) {
  if (a.startsWith('p-')) return setProb(+a.slice(2));
  if (a === 'burn') return burn();
  if (a === 'rst') { S.nA = 1; S.nB = 1; S.nP = 0; S.lim = null; update(); return; }
  if (a === 'mx-') return stepMix(-1);
  if (a === 'mx+') return stepMix(1);
  if (a.startsWith('s-')) return setSalt(a.slice(2));
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  if (t === 'calc') buildCalc();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const tg = (a, b, on) => `<div class="${on ? 'on' : ''}"><span>${a}</span><span>${b}</span></div>`;
const cntF = (o, i) => Object.keys(o).filter(k => o[k]).length;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'frac') return `Найдено формул: ${cntF(S.f1)} из 3 · вещество ${S.p1 + 1}: ${low(m.f)}`;
  if (m.kind === 'burn') return `Найдено формул: ${cntF(S.f2)} из 3 · вещество ${S.p2 + 1}: ${m.burned ? low(m.f) : 'не сожжено'}`;
  if (m.kind === 'excess') return `Решено задач: ${cntF(S.solved)} из 3 · задача ${S.p3 + 1}: ${m.okP ? 'решена' : m.limOk ? 'шаг 3 — продукт' : m.okA && m.okB ? 'шаг 2 — недостаток' : 'шаг 1 — моли реагентов'}`;
  if (m.kind === 'mix') return `Разделено смесей: ${cntF(S.f4)} из 3 · сейчас ${fmt(m.V, 2)} л из ${fmt(m.P.V)} л`;
  return `Получено: ${cntF(S.f5)} из 3 · ${low(m.salt)}, Q = ${Math.round(m.Q)} Кл`;
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  const chips = (cur, lbl) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips" id="sChips">${[0, 1, 2].map(i => `<button data-f="${i}" aria-pressed="${i === cur}">${i + 1}</button>`).join('')}</div></div>`;
  const ixRows = (els, idx) => `<div class="cnt c1">${els.map((e, i) => `<div><span>${e} · ${EL[e].name}</span><span><button data-i="${i}" data-d="-1" aria-label="Уменьшить индекс ${e}">−</button> <b data-c="${i}">${idx[i]}</b> <button data-i="${i}" data-d="1" aria-label="Увеличить индекс ${e}">+</button></span></div>`).join('')}</div>`;
  let h = '';
  if (id === 'frac') h = `<h2>Вещество ${S.p1 + 1}: ${PROB1[S.p1].what}</h2>` + chips(S.p1, 'Вещество') +
      `<dl class="reads"><div><dt>Формула</dt><dd id="r1"></dd></div><div><dt>M, г/моль</dt><dd id="r2"></dd></div><div><dt>Доли</dt><dd id="r3"></dd></div></dl>` +
      `<div class="ctl"><div class="lbl">Индексы</div></div>` + ixRows(PROB1[S.p1].els, S.ix1[S.p1]) + `<h3>Найдено</h3><div class="tgts" id="tg"></div>`;
  if (id === 'burn') h = `<h2>Вещество ${S.p2 + 1}: сжигание навески</h2>` + chips(S.p2, 'Вещество') +
      `<div class="row"><button class="ghostbtn" id="sBurn">Сжечь навеску</button></div>` +
      `<dl class="reads"><div><dt>Формула</dt><dd id="r1"></dd></div><div><dt>M, г/моль</dt><dd id="r2"></dd></div><div><dt>Продукты</dt><dd id="r3"></dd></div></dl>` +
      `<div class="ctl"><div class="lbl">Индексы</div></div>` + ixRows(EL2, S.ix2[S.p2]) + `<h3>Найдено</h3><div class="tgts" id="tg"></div>`;
  if (id === 'excess') { const P = PROB3[S.p3]; h = `<h2>Задача ${S.p3 + 1}</h2><p>${P.q}</p>` + chips(S.p3, 'Задача') +
      `<div class="ctl"><label for="aR">n(${low(P.A)}) <output id="aO"></output></label><input type="range" id="aR" min="0" max="${NMAX3}" step="0.05"></div>` +
      `<div class="ctl"><label for="bR">n(${low(P.B)}) <output id="bO"></output></label><input type="range" id="bR" min="0" max="${NMAX3}" step="0.05"></div>` +
      `<div class="ctl"><div class="lbl">В недостатке</div><div class="chips" id="limC"><button data-l="A">${low(P.A)}</button><button data-l="B">${low(P.B)}</button></div></div>` +
      `<div class="ctl"><label for="pR">n(${low(P.P)}) — продукт <output id="pO"></output></label><input type="range" id="pR" min="0" max="${NMAX3}" step="0.05"></div>` +
      `<dl class="reads"><div><dt>m(${low(P.A)})</dt><dd id="r1"></dd></div><div><dt>m(${low(P.B)})</dt><dd id="r2"></dd></div><div><dt>Ответ</dt><dd id="r3"></dd></div></dl>`; }
  if (id === 'mix') { const P = PROB4[S.p4]; h = `<h2>Смесь ${S.p4 + 1}</h2><p>${P.q}</p>` + chips(S.p4, 'Смесь') +
      `<div class="ctl"><label for="kR">m(${low(P.A)}) в смеси <output id="kO"></output></label><input type="range" id="kR" min="0" max="${Math.round(P.m / P.st)}" step="1"></div>` +
      `<div class="row"><button class="ghostbtn" data-m="-1">− ${fmt(P.st, 1)} г</button><button class="ghostbtn" data-m="1">+ ${fmt(P.st, 1)} г</button></div>` +
      `<dl class="reads"><div><dt>m(${low(P.A)})</dt><dd id="r1"></dd></div><div><dt>m(${low(P.B)})</dt><dd id="r2"></dd></div><div><dt>V газа, л</dt><dd id="r3"></dd></div></dl>` +
      `<h3>Разделено</h3><div class="tgts" id="tg"></div>`; }
  if (id === 'faraday') h = `<h2>Электролиз раствора</h2>` +
      `<div class="ctl"><div class="lbl">Соль</div><div class="chips" id="sChips">${SALTS.map(s => `<button data-f="${s}" aria-pressed="${s === S.salt}">${low(s)}</button>`).join('')}</div></div>` +
      `<div class="ctl"><label for="iR">Сила тока I <output id="iO"></output></label><input type="range" id="iR" min="1" max="${IMAX}" step="1"></div>` +
      `<div class="ctl"><label for="tR">Время t <output id="tO"></output></label><input type="range" id="tR" min="0" max="${TMAX}" step="1"></div>` +
      `<dl class="reads"><div><dt>Q, Кл</dt><dd id="r1"></dd></div><div><dt>Катод</dt><dd id="r2"></dd></div><div><dt>Анод</dt><dd id="r3"></dd></div></dl>` +
      `<h3>Цели</h3><div class="tgts" id="tg"></div>`;
  el.innerHTML = h;
  el.querySelectorAll('#sChips button').forEach(b => b.onclick = () => id === 'faraday' ? setSalt(b.dataset.f) : setProb(+b.dataset.f));
  el.querySelectorAll('.cnt button[data-d]').forEach(b => b.onclick = () => stepIdx(+b.dataset.i, +b.dataset.d));
  el.querySelectorAll('#limC button').forEach(b => b.onclick = () => pickLim(b.dataset.l));
  el.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => stepMix(+b.dataset.m));
  const sb = el.querySelector('#sBurn'); if (sb) sb.onclick = burn;
  const rng = (sel, fn) => { const r = el.querySelector(sel); if (r) { r.oninput = () => fn(+r.value, true); r.onchange = () => { fn(+r.value, false); after(); }; } };
  rng('#aR', (v, live) => { S.nA = snap(v); update(live); });
  rng('#bR', (v, live) => { S.nB = snap(v); update(live); });
  rng('#pR', (v, live) => { if (!model().limOk) { if (!live) toast('Сначала реагенты и недостаток.'); update(true); return; } S.nP = snap(v); update(live); });
  rng('#kR', (v, live) => { S.k4[S.p4] = v; update(live); });
  rng('#iR', (v, live) => { S.I2 = v; update(live); });
  rng('#tR', (v, live) => { S.tm = v; update(live); });
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const tgEl = el.querySelector('#tg');
  if (m.kind === 'frac' || m.kind === 'burn') {
    const idx = m.idx; idx.forEach((v, i) => set(`[data-c="${i}"]`, String(v)));
    set('#r1', low(m.f)); set('#r2', fmt(m.M, 1));
    if (m.kind === 'frac') { set('#r3', m.wOk ? 'совпали' : 'нет'); if (tgEl) tgEl.innerHTML = PROB1.map((P, i) => tg(`${i + 1}. ${P.els.map((e, j) => `${e} ${fmt(P.w[j])} %`).join(', ')}`, S.f1[i] ? '✓' : '?', S.f1[i])).join(''); }
    else { set('#r3', !m.burned ? 'не сожжено' : m.okC && m.okH ? 'совпали' : 'нет'); if (tgEl) tgEl.innerHTML = PROB2.map((P, i) => tg(`${i + 1}. навеска ${fmt(P.m)} г`, S.f2[i] ? '✓' : S.burned[i] ? 'сожжено' : '?', S.f2[i])).join(''); }
  } else if (m.kind === 'excess') {
    set('#aO', fmt(m.nA) + ' моль'); set('#bO', fmt(m.nB) + ' моль'); set('#pO', fmt(m.nP) + ' моль'); val('#aR', m.nA); val('#bR', m.nB); val('#pR', m.nP);
    set('#r1', fmt(m.mA, 2) + ' г' + (m.okA ? ' ✓' : '')); set('#r2', fmt(m.mB, 2) + ' г' + (m.okB ? ' ✓' : '')); set('#r3', m.okP ? (m.P.ask === 'm' ? fmt(m.out, 2) + ' г' : fmt(m.out, 2) + ' л') : '?');
    el.querySelectorAll('#limC button').forEach(b => b.setAttribute('aria-pressed', S.lim === b.dataset.l));
    el.querySelectorAll('#sChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.f === S.p3));
  } else if (m.kind === 'mix') {
    set('#kO', fmt(m.mA, 2) + ' г'); val('#kR', m.k);
    set('#r1', fmt(m.mA, 2) + ' г'); set('#r2', fmt(m.mB, 2) + ' г'); set('#r3', fmt(m.V, 2) + (m.ok ? ' ✓' : ''));
    if (tgEl) tgEl.innerHTML = PROB4.map((P, i) => tg(`${i + 1}. ${low(P.A)} + ${low(P.B)}, ${fmt(P.m)} г`, S.f4[i] ? '✓' : '?', S.f4[i])).join('');
  } else {
    set('#iO', fmt(m.I, 1) + ' А'); set('#tO', m.tm + ' мин'); val('#iR', S.I2); val('#tR', S.tm);
    set('#r1', String(Math.round(m.Q))); set('#r2', `${low(m.s.cat.f)} ${fmt(m.cat, 2)}${m.s.cat.gas ? ' л' : ' г'}`); set('#r3', `${low(m.s.an.f)} ${fmt(m.an, 2)} л`);
    el.querySelectorAll('#sChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.salt));
    if (tgEl) tgEl.innerHTML = TARG5.map((x, i) => tg(x.txt, S.f5[i] ? '✓' : '?', S.f5[i])).join('');
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') { const c = $('#calcLive'); if (c) c.innerHTML = calcLive(m); }
}

// ---------- «Расчёты»: live method for the bench + ENT-style problems with answer check ----------
function calcLive(m) {
  if (m.kind === 'frac') {
    const P = m.P;
    let h = `<h2>Вещество ${S.p1 + 1}</h2><div class="formula">n(Э) = w(Э) : Ar(Э)</div><h3>1. Моли элементов в 100 г</h3><div class="steps">` +
      P.els.map((e, i) => step(`n(${e}) = ${fmt(P.w[i])} : ${fmt(AR[e], 1)}`, 'посчитайте')).join('') +
      step('соотношение', 'разделите все n на наименьшее', 'sum') + `</div>`;
    if (P.D) h += `<h3>2. Истинная формула</h3><div class="steps">${step('M = D · M(' + low(P.D.g) + ')', `${fmt(P.D.v)} · ${Mof(P.D.g)}`)}${step('множитель', 'M : M(простейшей)', 'sum')}</div>`;
    h += `<h3>Ваша формула ${low(m.f)}</h3><div class="steps">` + step('M', `${fmt(m.M, 1)} г/моль`) +
      P.els.map((e, i) => step(`w(${e}) = ${m.idx[i]} · ${fmt(AR[e], 1)} : ${fmt(m.M, 1)}`, `${fmt(m.w[i], 2)} % ${m.wok[i] ? '✓' : '≠ ' + fmt(P.w[i]) + ' %'}`)).join('') +
      (P.D ? step(`D(${low(P.D.g)}) = M : ${Mof(P.D.g)}`, `${fmt(m.M / Mof(P.D.g), 2)} ${near(m.M, m.Mreq) ? '✓' : '≠ ' + fmt(P.D.v)}`, 'sum') : step('можно сократить?', m.g > 1 ? 'да — сократите' : 'нет ✓', 'sum')) + `</div>`;
    return h;
  }
  if (m.kind === 'burn') {
    const P = m.P;
    let h = `<h2>Вещество ${S.p2 + 1}: ${fmt(P.m)} г</h2><div class="formula">CₓHᵧO_z + O₂ → x CO₂ + y/2 H₂O</div><h3>1. Что дало сгорание</h3><div class="steps">` +
      step('n(C) = n(CO₂)', P.co2.V ? `${fmt(P.co2.V)} : 22,4` : `${fmt(P.co2.m)} : 44`) + step('n(H) = 2 · n(H₂O)', `2 · ${fmt(P.h2o)} : 18`) +
      step('m(O) = m − m(C) − m(H)', `${fmt(P.m)} − 12 · n(C) − 1 · n(H)`, 'sum') + `</div>` +
      `<h3>2. Молярная масса</h3><div class="steps">${step('M = D · M(' + low(P.D.g) + ')', `${fmt(P.D.v)} · ${Mof(P.D.g)}`)}${step('n(вещества) = m : M', `${fmt(P.m)} : M`)}${step('x = n(C) : n(вещества)', 'так же y и z', 'sum')}</div>`;
    h += `<h3>Ваша формула ${low(m.f)}</h3><div class="steps">` + step('M', `${m.M} г/моль ${m.okM ? '✓' : ''}`);
    if (m.burned) h += step('дала бы CO₂', `${fmt(m.pCO2, 3)} моль ${m.okC ? '✓' : '≠ ' + fmt(m.nCO2, 3)}`) + step('дала бы H₂O', `${fmt(m.pH2O, 3)} моль ${m.okH ? '✓' : '≠ ' + fmt(m.nH2O, 3)}`, 'sum');
    else h += step('продукты', 'сначала сожгите навеску', 'sum');
    return h + `</div>`;
  }
  if (m.kind === 'excess') {
    const P = m.P;
    return `<h2>Задача ${S.p3 + 1}</h2><p>${P.q}</p><div class="formula">${eqText(P)}</div><h3>1. Моли реагентов</h3><div class="steps">` +
      step(`M(${low(P.A)})`, m.MA + ' г/моль') + step(`ваше n(${low(P.A)})`, `${fmt(m.nA)} моль → ${fmt(m.mA, 2)} г ${m.okA ? '✓' : '≠ ' + fmt(P.mA) + ' г'}`) +
      step(`M(${low(P.B)})`, m.MB + ' г/моль') + step(`ваше n(${low(P.B)})`, `${fmt(m.nB)} моль → ${fmt(m.mB, 2)} г ${m.okB ? '✓' : '≠ ' + fmt(P.mB) + ' г'}`, 'sum') + `</div>` +
      `<h3>2. Кто в недостатке</h3><div class="steps">${step(`n(${low(P.A)}) : ${m.cA}`, `${fmt(m.nA)} : ${m.cA}`)}${step(`n(${low(P.B)}) : ${m.cB}`, `${fmt(m.nB)} : ${m.cB}`)}${step('меньшее частное', S.lim && m.limOk ? low(S.lim === 'A' ? P.A : P.B) + ' ✓' : 'отметьте на столе', 'sum')}</div>` +
      `<h3>3. Продукт</h3><div class="steps">${step(`n(${low(P.P)}) = n(недост.) · ${m.cP} : коэф.(недост.)`, 'теоретически')}${P.eta < 1 ? step('практически', `· η = ${P.eta}`) : ''}` +
      step(P.ask === 'm' ? `m = n · ${m.MP}` : 'V = n · 22,4', m.okP ? (P.ask === 'm' ? fmt(m.out, 2) + ' г ✓' : fmt(m.out, 2) + ' л ✓') : '?', 'sum') + `</div>`;
  }
  if (m.kind === 'mix') {
    const P = m.P, one = !P.rB;
    return `<h2>Смесь ${S.p4 + 1}</h2><p>${P.q}</p><div class="formula">${one ? 'газ даёт только ' + low(P.A) : 'x + y = n(газа)'}</div>` +
      `<h3>Реакции</h3><div class="steps">${step(low(P.A), P.eqA)}${step(low(P.B), P.eqB)}</div>` +
      `<h3>Метод</h3><div class="steps">${step('n(газа) = V : 22,4', `${fmt(P.V)} : 22,4`)}` +
      (one ? step(`n(${low(P.A)})`, `n(газа) · ${P.rA === 1.5 ? '2 : 3' : '1'}`) + step(`m(${low(P.B)}) = m − m(${low(P.A)})`, 'w = m(комп.) : m(смеси)', 'sum')
        : step(`${m.MA}x + ${m.MB}y`, `= ${fmt(P.m)}`) + step('x + y', '= n(газа)', 'sum')) + `</div>` +
      `<h3>Ваше разделение</h3><div class="steps">${step(`m(${low(P.A)})`, fmt(m.mA, 2) + ' г')}${step(`m(${low(P.B)})`, fmt(m.mB, 2) + ' г')}` +
      step('газ от компонентов', `${fmt(m.gA, 3)} + ${fmt(m.gB, 3)} моль`) + step('V = n · 22,4', `${fmt(m.V, 2)} л ${m.ok ? '✓' : '≠ ' + fmt(P.V) + ' л'}`, 'sum') + `</div>`;
  }
  const s = m.s;
  return `<h2>Электролиз ${low(m.salt)}</h2><div class="formula">m = M · I · t : (z · F)</div><h3>Электроды</h3><div class="steps">${step('катод (−)', s.hc)}${step('анод (+)', s.ha)}${step('в растворе', s.sol)}</div>` +
    `<h3>Заряд</h3><div class="steps">${step('t', `${m.tm} мин = ${m.tm * 60} с`)}${step('Q = I · t', `${fmt(m.I, 1)} · ${m.tm * 60} = ${Math.round(m.Q)} Кл`)}${step('n(e⁻) = Q : F', `${Math.round(m.Q)} : 96 500 = ${fmt(m.ne, 4)} моль`, 'sum')}</div>` +
    `<h3>Продукты</h3><div class="steps">${step(`n(${low(s.cat.f)}) = n(e⁻) : ${s.cat.z}`, `${fmt(m.nC, 4)} моль`)}${step(s.cat.gas ? 'V = n · 22,4' : `m = n · ${AR[s.cat.f]}`, s.cat.gas ? fmt(m.cat, 2) + ' л' : fmt(m.cat, 2) + ' г')}` +
    `${step(`n(${low(s.an.f)}) = n(e⁻) : ${s.an.z}`, `${fmt(m.nAn, 4)} моль`)}${step('V = n · 22,4', fmt(m.an, 2) + ' л', 'sum')}</div>`;
}
function buildCalc() {
  const id = LID(), el = $('#pane-calc');
  el.innerHTML = `<div id="calcLive"></div><h3>Задачи как на ЕНТ</h3><p class="note">Решите в тетради и введите число. Дробь — через запятую.</p>` +
    EXQ[id].map((q, i) => { const k = id + '-' + i, ok = S.qd[k]; return `<div class="qbox"><div class="k">Задача ${i + 1}</div><p>${q.q}</p>` +
      `<div class="qrow"><input type="text" inputmode="decimal" autocomplete="off" aria-label="Ответ к задаче ${i + 1}" data-q="${i}" ${ok ? `value="${fmt(q.a, 2)}" disabled` : ''}><span class="u">${q.u}</span><button class="ghostbtn" data-chk="${i}" ${ok ? 'disabled' : ''}>Проверить</button></div>` +
      `<div class="state ${ok ? 'done' : ''}" id="qs-${i}">${ok ? '✓ Верно' : ''}</div></div>`; }).join('');
  const check = i => {
    const q = EXQ[id][i], inp = el.querySelector(`input[data-q="${i}"]`), st = el.querySelector('#qs-' + i), k = id + '-' + i;
    const v = parseFloat(String(inp.value).replace(',', '.').replace(/\s/g, ''));
    if (!isFinite(v)) { st.className = 'state bad'; st.textContent = 'Введите число.'; return; }
    if (Math.abs(v - q.a) <= q.tol + 1e-9) {
      S.qd[k] = true; st.className = 'state done'; st.textContent = '✓ Верно'; inp.disabled = true; el.querySelector(`[data-chk="${i}"]`).disabled = true; toast(`Задача ${i + 1} решена верно.`);
    } else { S.qw[k] = (S.qw[k] || 0) + 1; st.className = 'state bad'; st.textContent = 'Пока не так. ' + q.h; }
  };
  el.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => check(+b.dataset.chk));
  el.querySelectorAll('input[data-q]').forEach(inp => inp.onkeydown = e => { if (e.key === 'Enter') check(+inp.dataset.q); });
  const c = $('#calcLive'); if (c) c.innerHTML = calcLive(model());
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'frac') el.innerHTML = `<div class="k">Вещество ${S.p1 + 1}</div><div class="v ${m.found[S.p1] ? 'ok' : ''}">${low(m.f)}</div><div class="lr"><span>доли</span><span>${m.wOk ? 'совпали' : 'нет'}</span></div><div class="lr"><span>найдено</span><span>${cntF(S.f1)} из 3</span></div>`;
  else if (m.kind === 'burn') el.innerHTML = `<div class="k">Сжигание ${S.p2 + 1}</div><div class="v ${m.found[S.p2] ? 'ok' : ''}">${low(m.f)}</div><div class="lr"><span>найдено</span><span>${cntF(S.f2)} из 3</span></div>`;
  else if (m.kind === 'excess') el.innerHTML = `<div class="k">Задача ${S.p3 + 1}</div><div class="v ${m.okP ? 'ok' : ''}">${m.okP ? 'решена' : m.limOk ? 'шаг 3' : m.okA && m.okB ? 'шаг 2' : 'шаг 1'}</div><div class="lr"><span>решено</span><span>${cntF(S.solved)} из 3</span></div>`;
  else if (m.kind === 'mix') el.innerHTML = `<div class="k">Смесь ${S.p4 + 1}</div><div class="v ${m.ok ? 'ok' : ''}">${fmt(m.V, 2)} л</div><div class="lr"><span>опыт</span><span>${fmt(m.P.V)} л</span></div><div class="lr"><span>готово</span><span>${cntF(S.f4)} из 3</span></div>`;
  else el.innerHTML = `<div class="k">Катод</div><div class="v ${m.hit ? 'ok' : ''}">${low(m.s.cat.f)} ${fmt(m.cat, 2)} ${m.s.cat.gas ? 'л' : 'г'}</div><div class="lr"><span>Q</span><span>${Math.round(m.Q)} Кл</span></div><div class="lr"><span>цели</span><span>${cntF(S.f5)} из 3</span></div>`;
}

function update(live) {
  let m = model();
  const L = LESSONS[S.lesson];
  if (!live) {
    if (m.kind === 'frac' && m.ok && !S.f1[S.p1]) { S.f1[S.p1] = true; renderTools(); toast(`Верно: ${low(m.f)}. Доли${m.P.D ? ' и молярная масса' : ''} совпали.`); }
    if (m.kind === 'burn' && m.ok && !S.f2[S.p2]) { S.f2[S.p2] = true; renderTools(); toast(`Верно: ${low(m.f)} даёт ровно столько CO₂ и воды, M = ${m.M} г/моль.`); }
    if (m.kind === 'excess' && m.okP && !S.solved[S.p3]) { S.solved[S.p3] = true; renderTools(); toast(`Задача ${S.p3 + 1} решена: ${m.P.ask}(${low(m.P.P)}) = ${fmt(m.out, 2)} ${m.P.ask === 'm' ? 'г' : 'л'}.`); }
    if (m.kind === 'mix' && m.ok && !S.f4[S.p4]) { S.f4[S.p4] = true; renderTools(); toast(`Газ совпал: ${low(m.P.A)} ${fmt(m.mA, 2)} г, ${low(m.P.B)} ${fmt(m.mB, 2)} г.`); }
    if (m.kind === 'far' && m.hit && !S.f5[m.ti]) { S.f5[m.ti] = true; renderTools(); toast(`Есть: ${TARG5[m.ti].txt} — при Q = ${Math.round(m.Q)} Кл.`); }
    m = model();
    if (!S.done[L.id] && L.check(m)) {
      S.done[L.id] = true; save(); renderStrip();
      toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Расчётные задачи освоены!');
    }
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>

      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  resetState();
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); buildCalc(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor and the lecture generator: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;

  if (id === 'burn') { const P = m.P; now = `Установка для сжигания: лодочка с навеской ${fmt(P.m)} г в трубке, горелка (нажать — сжечь), поглотители CaCl₂ (вода) и KOH (CO₂). Плотность по ${GASN[P.D.g]} = ${fmt(P.D.v)}. ${m.burned ? `Навеска сожжена: воды ${fmt(P.h2o)} г, CO₂ ${P.co2.V ? fmt(P.co2.V) + ' л (н. у.)' : fmt(P.co2.m) + ' г'}.` : 'Навеска ещё не сожжена.'} Формула ученика ${m.f}, M = ${m.M} г/моль (${m.okM ? 'совпадает с плотностью' : 'не совпадает с плотностью'}); ${m.burned ? `она дала бы ${fmt(m.pCO2, 3)} моль CO₂ и ${fmt(m.pH2O, 3)} моль H₂O (${m.okC && m.okH ? 'совпало' : 'не совпало'})` : ''}. Вещество ${S.p2 + 1} из 3, найдено ${cntF(S.f2)}. Не называй формулу — веди: n(C) = n(CO₂), n(H) = 2n(H₂O), кислород по разности масс, M = D · M(газа).`; }
  if (id === 'excess') { const P = m.P; now = `Задача ${S.p3 + 1}: ${P.q} Уравнение ${eqText(P)}. Столбики молей: n(${P.A}) = ${fmt(m.nA)} (${fmt(m.mA, 2)} г, ${m.okA ? 'совпадает' : 'не совпадает'} с условием), n(${P.B}) = ${fmt(m.nB)} (${fmt(m.mB, 2)} г, ${m.okB ? 'совпадает' : 'не совпадает'}). Недостаток ${m.limOk ? 'отмечен верно' : S.lim ? 'отмечен неверно' : 'не отмечен'} (кнопки «недостаток» под столбиками). Продукт n(${P.P}) = ${fmt(m.nP)} моль${m.okP ? ' — верно' : ''}${P.eta < 1 ? `, выход ${P.eta * 100} %` : ''}. Решено задач ${cntF(S.solved)} из 3. Не называй ответ и не говори, что в недостатке — спроси, как сравнить n : коэффициент.`; }
  if (id === 'mix') { const P = m.P; now = `Смесь ${S.p4 + 1}: ${P.q} Столбик смеси разделён ручкой: ${P.A} ${fmt(m.mA, 2)} г, ${P.B} ${fmt(m.mB, 2)} г. Уравнения: ${P.eqA}; ${P.eqB}. Газовая бюретка: в опыте ${fmt(P.V)} л, по разделению ученика ${fmt(m.V, 2)} л (${m.ok ? 'совпало' : 'не совпало'}). Разделено смесей ${cntF(S.f4)} из 3. Не называй массы — спроси, какой компонент даёт газ, и подведи к уравнению или системе x + y.`; }
  if (id === 'faraday') { const s = m.s; now = `Электролизёр: раствор ${m.salt} (${s.name}), инертные электроды; источник тока I = ${fmt(m.I, 1)} А, t = ${m.tm} мин, Q = ${Math.round(m.Q)} Кл, n(e⁻) = ${fmt(m.ne, 4)} моль. Катод: ${s.hc}, получено ${s.cat.f} ${fmt(m.cat, 2)} ${s.cat.gas ? 'л' : 'г'}; анод: ${s.ha}, ${s.an.f} ${fmt(m.an, 2)} л; в растворе ${s.sol}. Цели: ${TARG5.map((x, i) => `${x.txt} — ${S.f5[i] ? 'получено' : 'ещё нет'}`).join('; ')}. Не называй нужные ток и время — веди: моли продукта, умножить на z, Q = n(e⁻) · F, I · t = Q.`; }
  return [
    `Раздел: химия, 9–11 класс, тема «Расчётные задачи» (подготовка к ЕНТ). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `На схеме: ${partsList().map(p => `${p.name} — ${p.spec}`).join(' ')}`,
    `Задание: ${L.task} Подсказка урока: ${L.hint} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Во вкладке «Расчёты» — три задачи как на ЕНТ: ${EXQ[id].map((q, i) => `${i + 1}) ${q.q} — ${S.qd[id + '-' + i] ? 'решена' : 'не решена'}`).join(' ')}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Для тьютора: не называй ответ ни к заданию на схеме, ни к задачам ЕНТ — веди наводящими вопросами по шагам алгоритма.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { frac: 'Почему у CH₂ и C₂H₄ одинаковые массовые доли?', burn: 'Как понять, есть ли в веществе кислород?', excess: 'Почему продукт считают по недостатку?', mix: 'Как решать, если газ дают оба компонента?', faraday: 'Почему на катоде из NaCl выделяется водород, а не натрий?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
