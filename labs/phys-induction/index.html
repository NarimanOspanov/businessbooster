<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 9 класс: опыты Фарадея, генератор, трансформатор, электромагнитные волны.">
<title>Электромагнитная индукция</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="5" y="17" width="14" height="7" rx="1.5" fill="var(--warn)"/><rect x="5" y="17" width="7" height="7" rx="1.5" fill="var(--arm)"/><path d="M23 12v16M27 12v16M31 12v16" stroke="var(--force)" stroke-width="2.2" stroke-linecap="round"/><path d="M21 30q8 6 14-4" fill="none" stroke="var(--fg)" stroke-width="1.6"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Физика · Индукция</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Индукция</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с электромагнитной индукцией. Магнит можно тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : (Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? 1 : 2));
const sgn = x => (x > 0 ? '+' : '') + fmt(x, 1);
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const sig3 = x => { const v = Number(x.toPrecision(3)); return String(v).replace('.', ','); };
const sci = x => { if (x === 0) return '0'; let e = Math.floor(Math.log10(x) + 1e-9), mm = x / 10 ** e; mm = Math.round(mm * 100) / 100; if (mm >= 10) { mm /= 10; e++; } return (mm === 1 ? '' : String(mm).replace('.', ',') + '·') + '10' + sup(e); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', CP = '#ffb547', OK = '#86e0a8', RED = '#ff8a73', CU = '#d9954f', MUT = '#8b96ad';

const LESSONS = [
  { id: 'faraday', title: 'Опыты Фарадея',
    text: ['В 1831 году Майкл Фарадей вдвигал магнит в катушку, подключённую к гальванометру, и увидел: пока магнит движется, по катушке идёт ток. Это явление назвали электромагнитной индукцией, а ток — индукционным.',
           'Ток возникает, только когда меняется магнитный поток через катушку — то есть сколько линий магнитного поля проходит сквозь её витки. Если магнит лежит неподвижно, поток не меняется и тока нет, даже когда магнит внутри катушки.',
           'Чем быстрее меняется поток и чем больше витков, тем сильнее ток: ℰ = −N · ΔΦ / Δt. Направление тока зависит от того, вносим магнит или вынимаем и каким полюсом. Правило Ленца: индукционный ток своим полем мешает изменению потока, поэтому подносимый магнит катушка отталкивает.'],
    why: 'На индукции работают почти все источники электричества: генераторы Экибастузской ГРЭС, ветряки Ерейментауской ВЭС, гидростанции на Иртыше. Индукционная плита греет кастрюлю током, который наводится прямо в её дне. Металлоискатели в аэропорту, датчики ABS в машине и беспроводные зарядки телефонов — тоже индукция. Электрики, энергетики и наладчики оборудования зарабатывают как раз на понимании этого опыта.',
    task: 'Двигайте магнит так, чтобы стрелка гальванометра отклонилась больше чем на 3 деления вправо и больше чем на 3 влево. Потом оставьте магнит внутри катушки и посмотрите на стрелку.',
    hint: 'Тяните магнит пальцем или мышкой либо жмите «Внести» и «Вынуть». Стрелка еле шевелится? Двигайте быстрее или возьмите катушку с большим числом витков.',
    stage: 'Тяните магнит к катушке и обратно.',
    N0: 200, turns: [100, 200, 400], thr: 3,
    check: m => m.pos && m.neg && m.rest },
  { id: 'generator', title: 'Генератор переменного тока',
    text: ['Генератор превращает механическую энергию в электрическую. В простейшем генераторе рамка из провода вращается между полюсами магнита. Поток через рамку всё время меняется, и в ней наводится ЭДС. Ток снимают через кольца и щётки.',
           'Когда рамка стоит поперёк линий поля, поток самый большой, но в этот миг почти не меняется — ЭДС равна нулю. Когда рамка повёрнута вдоль линий, поток проходит через ноль быстрее всего — ЭДС наибольшая. За один оборот ЭДС дважды меняет знак: получается переменный ток, его график — синусоида.',
           'Амплитуда ЭДС: ℰₘ = N · B · S · ω, где ω = 2πn — угловая скорость, n — число оборотов в секунду. Частота тока ν равна n. В сети Казахстана частота 50 Гц.'],
    why: 'Турбины электростанций крутят генераторы так, чтобы частота в сети держалась ровно 50 Гц, — за этим круглые сутки следят диспетчеры системного оператора KEGOC. Автоэлектрики чинят автомобильные генераторы, которые на ходу заряжают аккумулятор. Дизель-генераторы выручают стройки, фермы и больницы при отключениях. Инженер-энергетик — одна из самых востребованных профессий в стране.',

const LS_KEY = 'luch-phys-induction';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- geometry (SVG units; scene 520 × 405) ----------
const F1 = { xc: 330, y: 190, x0: 260, x1: 400, ry: 44, half: 65, xmin: 70, w: 22, d0: 100, K: 1.5, fast: 400, slow: 120 };
const gF = d => 1 / (1 + Math.exp((d - F1.d0) / F1.w));   // share of the max flux through the coil
const G2 = { ax: 260, y0: 125, y1: 215, hw: 80, gy: 348, gx0: 50, gx1: 470, win: 0.08, sc: 44 / 800 };
const T3 = { x0: 150, x1: 370, y0: 120, y1: 300, th: 30 };
const W4 = { y: 190, x0: 70, x1: 470, sx0: 30, sx1: 490, sy: 300 };
const C_LIGHT = 3e8;
const BANDS = [
  { n: 'радиоволны', s: 'радио', min: 1e-3, col: '#c3a8ff' },
  { n: 'инфракрасное', s: 'ИК', min: 7.6e-7, col: '#ff8a73' },
  { n: 'видимый свет', s: 'свет', min: 3.8e-7, col: 'vis' },
  { n: 'ультрафиолет', s: 'УФ', min: 1e-8, col: '#9d7cff' },
  { n: 'рентген', s: 'рентген', min: 1e-11, col: '#72d4e8' },
  { n: 'гамма-лучи', s: 'гамма', min: 0, col: '#86e0a8' },
];
const bandOf = lam => BANDS.find(b => lam >= b.min);
const EX = { 'радиоволны': 'радио, ТВ, мобильная связь, Wi-Fi, микроволновка', 'инфракрасное': 'пульт от ТВ, тепловизор, тепло от батареи', 'видимый свет': 'всё, что видит глаз: от красного до фиолетового', 'ультрафиолет': 'загар, обеззараживание воды, проверка купюр', 'рентген': 'снимки костей, досмотр багажа', 'гамма-лучи': 'радиоактивный распад, лечение опухолей' };
function lamCmp(l) {
  if (l >= 1e3) return 'как улица или город';
  if (l >= 10) return 'как дом или двор';
  if (l >= 1) return 'как рост человека';
  if (l >= 0.1) return 'как ладонь или тетрадь';
  if (l >= 1e-2) return 'как монета';
  if (l >= 1e-3) return 'как песчинка';
  if (l >= 1e-5) return 'как толщина волоса';
  if (l >= 1e-6) return 'как бактерия';
  if (l >= 1e-8) return 'как вирус';
  if (l >= 1e-10) return 'как молекула';
  if (l >= 1e-12) return 'как атом';
  return 'меньше атома — как ядро';
}
function fHz(f) {
  if (f >= 1e15) return sci(f) + ' Гц';
  for (const [k, u] of [[1e12, 'ТГц'], [1e9, 'ГГц'], [1e6, 'МГц'], [1e3, 'кГц'], [1, 'Гц']]) if (f >= k * 0.9995) return sig3(f / k) + ' ' + u;
  return sig3(f) + ' Гц';
}
function lamFmt(l) {
  for (const [k, u] of [[1e3, 'км'], [1, 'м'], [1e-2, 'см'], [1e-3, 'мм'], [1e-6, 'мкм'], [1e-9, 'нм'], [1e-12, 'пм']]) if (l >= k * 0.9995) return sig3(l / k) + ' ' + u;
  return sci(l) + ' м';
}

function resetState() {
  const Ls = L();
  Object.assign(S, {
    mx: 110, pmx: 110, mv: 0, I: 0, nd: 0, pol: 1, N: Ls.N0 || 200, speed: 'fast', go: null, pos: false, neg: false, rest: false, moved: false, still: 0, peak: 0,
    n: Ls.n0 || 10, th: 0.5, N1: 220, N2: 120, src: 'ac', g12: false, gUp: false, dc: false, ph: 0,
    e: Ls.e0 || 6, fm: false, vis: false, xr: false, wph: 0, hl: null,
  });
}
resetState();

function model() {
  const id = LID(), Ls = L();
  if (id === 'faraday') { const d = F1.xc - S.mx, g = gF(d); return { kind: id, d, g, rate: g * (1 - g) / F1.w * S.mv, I: S.I, v: S.mv, N: S.N, pos: S.pos, neg: S.neg, rest: S.rest }; }
  if (id === 'generator') { const w = 2 * Math.PI * S.n, Em = S.N * Ls.B * Ls.Sa * w; return { kind: id, f: S.n, w, Em, Urms: Em / Math.SQRT2, e: Em * Math.sin(S.th), N: S.N }; }
  if (id === 'transformer') { const ac = S.src === 'ac', U2 = ac ? Ls.U1 * S.N2 / S.N1 : 0; return { kind: id, ac, U2, k: S.N1 / S.N2, g12: S.g12, gUp: S.gUp, dc: S.dc }; }
  const f = 10 ** S.e, lam = C_LIGHT / f;
  return { kind: id, e: S.e, f, lam, band: bandOf(lam), fm: S.fm, vis: S.vis, xr: S.xr };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function arrow(x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L2 = Math.hypot(x2 - x1, y2 - y1); if (L2 < 1) return '';
  const hl = Math.min(10, L2 * 0.8), hx = x2 - hl * Math.cos(a), hy = y2 - hl * Math.sin(a);
  const p1 = `${(hx + 5 * Math.sin(a)).toFixed(1)} ${(hy - 5 * Math.cos(a)).toFixed(1)}`, p2 = `${(hx - 5 * Math.sin(a)).toFixed(1)} ${(hy + 5 * Math.cos(a)).toFixed(1)}`;
  return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1}L${p2}Z" fill="${col}"/>`;
}
const bg = () => `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
  <linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#ff4d4d"/><stop offset=".25" stop-color="#ffb547"/><stop offset=".45" stop-color="#f5f06a"/><stop offset=".62" stop-color="#5fe08a"/><stop offset=".8" stop-color="#5fb4ff"/><stop offset="1" stop-color="#9d5cff"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient></defs>
  <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;

// ---------- lesson 1: magnet and coil ----------
function nTurnsVis(N) { return N <= 100 ? 6 : N <= 200 ? 10 : 16; }
function faradayScene() {
  const y = F1.y, ry = F1.ry, nt = nTurnsVis(S.N), I = S.I, a = clamp(Math.abs(I) / 8, 0, 1);
  let back = '', front = '';
  for (let i = 0; i < nt; i++) {
    const x = F1.x0 + 6 + (F1.x1 - F1.x0 - 12) * i / (nt - 1);
    back += `<path d="M${x.toFixed(1)} ${y - ry}A10 ${ry} 0 0 0 ${x.toFixed(1)} ${y + ry}" fill="none" stroke="#7a5530" stroke-width="3.2"/>`;
    front += `<path d="M${x.toFixed(1)} ${y - ry}A10 ${ry} 0 0 1 ${x.toFixed(1)} ${y + ry}" fill="none" stroke="${CU}" stroke-width="3.4"/>`;
    if (a > 0.04) front += `<path d="M${x.toFixed(1)} ${y - ry}A10 ${ry} 0 0 1 ${x.toFixed(1)} ${y + ry}" fill="none" stroke="${CP}" stroke-width="3.4" opacity="${(a * 0.9).toFixed(2)}"/>`;
  }
  // stand
  let h = `<rect x="250" y="238" width="160" height="9" rx="3" fill="#3b4258" stroke="${INK}" stroke-width="1.4"/>`;
  // wires to the galvanometer
  h += `<path d="M${F1.x0 + 6} ${y + ry - 2}C238 250 232 330 266 330M${F1.x1 - 6} ${y + ry - 2}C422 250 428 330 394 330" fill="none" stroke="#c46a5a" stroke-width="2.4"/>`;
  h += back;
  // field lines of the magnet
  const l = S.mx - F1.half, r = S.mx + F1.half;
  for (const k of [1, 2]) {
    h += `<path d="M${r} ${y}C${r + 34 * k} ${y - 38 * k} ${l - 34 * k} ${y - 38 * k} ${l} ${y}M${r} ${y}C${r + 34 * k} ${y + 38 * k} ${l - 34 * k} ${y + 38 * k} ${l} ${y}" fill="none" stroke="${MUT}" stroke-width="1.2" stroke-dasharray="4 5" opacity=".45"/>`;
  }
  // magnet: right end faces the coil
  const nR = S.pol > 0, cR = nR ? RED : C1, cL = nR ? C1 : RED;
  h += `<g data-drag="mag"><rect x="${l - 10}" y="${y - 30}" width="${2 * F1.half + 20}" height="60" fill="transparent"/>`;
  h += `<rect x="${l}" y="${y - 17}" width="${F1.half}" height="34" rx="3" fill="${cL}" stroke="${INK}" stroke-width="2"/><rect x="${S.mx}" y="${y - 17}" width="${F1.half}" height="34" rx="3" fill="${cR}" stroke="${INK}" stroke-width="2"/>`;
  h += T(l + 16, y + 6, 15, INK, nR ? 'S' : 'N', 'middle', 'font-weight="500"') + T(r - 16, y + 6, 15, INK, nR ? 'N' : 'S', 'middle', 'font-weight="500"') + `</g>`;
  h += front;
  // induced current arrows and induced pole of the coil (Lenz)
  if (Math.abs(I) > 0.5) {
    for (const i of [1, nt - 2]) {
      const x = F1.x0 + 6 + (F1.x1 - F1.x0 - 12) * i / (nt - 1) + 10;
      h += I > 0 ? arrow(x, y + 14, x, y - 14, CP, 2.4) : arrow(x, y - 14, x, y + 14, CP, 2.4);
    }
    const leftN = I > 0;
    h += `<circle cx="${F1.x0 - 2}" cy="${y - ry - 16}" r="11" fill="${leftN ? RED : C1}" stroke="${INK}" stroke-width="1.6"/>` + T(F1.x0 - 2, y - ry - 12, 11, INK, leftN ? 'N' : 'S', 'middle', 'font-weight="500"');
    h += T(F1.x0 + 14, y - ry - 12, 10, '#a9b4c9', S.mv > 0 ? 'катушка отталкивает магнит' : 'катушка притягивает магнит', 'start', halo);
  }
  h += T(F1.xc, y + ry + 36, 10, MUT, `катушка · ${S.N} витков`, 'middle');
  // galvanometer
  const gx = 330, gy = 362, R = 56;
  h += `<rect x="266" y="284" width="128" height="88" rx="10" fill="#e8ecf4" stroke="${INK}" stroke-width="2"/>`;
  h += `<path d="M${gx - R * Math.sin(Math.PI / 3)} ${gy - R * Math.cos(Math.PI / 3)}A${R} ${R} 0 0 1 ${gx + R * Math.sin(Math.PI / 3)} ${gy - R * Math.cos(Math.PI / 3)}" fill="none" stroke="#5d6a86" stroke-width="1.4"/>`;
  for (let v = -10; v <= 10; v += 2) {
    const an = v * 6 * Math.PI / 180, s1 = Math.sin(an), c1 = Math.cos(an), ln = v % 10 === 0 ? 9 : 5;
    h += `<path d="M${(gx + R * s1).toFixed(1)} ${(gy - R * c1).toFixed(1)}L${(gx + (R - ln) * s1).toFixed(1)} ${(gy - (R - ln) * c1).toFixed(1)}" stroke="#2a3348" stroke-width="1.4"/>`;
    if (v % 10 === 0) h += T(gx + (R + 9) * s1, gy - (R + 9) * c1 + 3, 9, '#2a3348', v > 0 ? '+10' : fmt(v, 0));
  }
  const an = clamp(S.nd, -11, 11) * 6 * Math.PI / 180;
  h += `<path d="M${gx} ${gy}L${(gx + (R - 6) * Math.sin(an)).toFixed(1)} ${(gy - (R - 6) * Math.cos(an)).toFixed(1)}" stroke="#d6453a" stroke-width="2.2" stroke-linecap="round"/><circle cx="${gx}" cy="${gy}" r="4" fill="#2a3348"/>`;
  h += T(280, 366, 11, '#2a3348', 'G', 'middle', 'font-weight="500"');
  h += T(gx, 388, 10, MUT, 'гальванометр', 'middle');
  return h;
}

  if (Math.abs(s) > 0.25 && S.n > 0) {
    const up = s > 0;
    h += up ? arrow(xl, y0 + 70, xl, y0 + 25, CP, 2.6) + arrow(xr, y0 + 25, xr, y0 + 70, CP, 2.6) : arrow(xl, y0 + 25, xl, y0 + 70, CP, 2.6) + arrow(xr, y0 + 70, xr, y0 + 25, CP, 2.6);
  }
  // rings, brushes, wires, lamp
  h += `<ellipse cx="${ax}" cy="252" rx="13" ry="4.5" fill="#b9c2d4" stroke="${INK}" stroke-width="1.4"/><ellipse cx="${ax}" cy="266" rx="13" ry="4.5" fill="#b9c2d4" stroke="${INK}" stroke-width="1.4"/>`;
  h += `<rect x="${ax - 24}" y="248" width="10" height="8" fill="#5d6a86"/><rect x="${ax + 14}" y="262" width="10" height="8" fill="#5d6a86"/>`;
  h += `<path d="M${ax - 24} 252H200V284H460V276M${ax + 24} 266H480V276" fill="none" stroke="#c46a5a" stroke-width="2.2"/>`;

// lesson 1
function moveMag(to) { S.go = { to, sp: S.speed === 'fast' ? F1.fast : F1.slow }; }
function flipMag() {

  S.pol = -S.pol; renderTools(); buildScheme(); update();
}
function setTurns1(N) { if (N === S.N) return; S.N = N; renderTools(); buildScheme(); update(); }
function cycleTurns() { const ts = L().turns; const N = ts[(ts.indexOf(S.N) + 1) % ts.length]; if (LID() === 'faraday') setTurns1(N); else setTurns2(N); }
function stepFaraday(dt) {
  if (S.go) {
    const dx = S.go.to - S.mx, st = S.go.sp * dt;
    if (Math.abs(dx) <= st) { S.mx = S.go.to; S.go = null; } else S.mx += Math.sign(dx) * st;
  }

  S.mv += (vi - S.mv) * (1 - Math.exp(-dt / 0.05));
  if (Math.abs(S.mv) < 0.05 && vi === 0) S.mv = 0;
  const g = gF(F1.xc - S.mx);
  S.I = F1.K * (S.N / 200) * S.pol * g * (1 - g) / F1.w * S.mv;
  if (Math.abs(S.I) < 1e-3) S.I = 0;
  S.nd += (S.I - S.nd) * (reduce ? 1 : 1 - Math.exp(-dt / 0.09));
  const thr = L().thr;
  if (Math.abs(S.I) > 1) S.moved = true;
  if (S.I > thr && !S.pos) { S.pos = true; toast(`Стрелка вправо на ${fmt(S.I, 1)} дел.: поток через катушку растёт.`); update(); }
  if (S.I < -thr && !S.neg) { S.neg = true; toast(`Стрелка влево на ${fmt(-S.I, 1)} дел.: поток меняется в другую сторону, и ток тоже.`); update(); }
  if (!drag && !S.go && Math.abs(S.mv) < 1) S.still += dt; else S.still = 0;
  if (S.moved && !S.rest && S.still > 0.6 && F1.xc - S.mx < 35) { S.rest = true; toast('Магнит внутри, но стоит — поток не меняется, тока нет. Стрелка на нуле.'); update(); }
}

  if (m.ac && Math.abs(m.U2 - 1100) < 1e-9 && !S.gUp) { S.gUp = true; toast(`220 × ${S.N2} / ${S.N1} = 1100 В. Витков на выходе в 5 раз больше — напряжение в 5 раз выше.`); }

// lesson 4

  const m = model();

  if (m.band.n === 'видимый свет' && !S.vis) { S.vis = true; toast(`Видимый свет: λ = ${lamFmt(m.lam)}. Узкая полоска шкалы — всё, что видит глаз.`); }

let last = performance.now(), liveT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000)); last = t;
  const id = LID();
  if (id === 'faraday') { stepFaraday(dt); dirty = true; }
  if (id === 'generator' && S.n > 0 && !reduce) { S.th += 2 * Math.PI * (S.n / 100) * dt; dirty = true; }
  if (id === 'transformer' && !reduce) { S.ph += 2 * Math.PI * 0.5 * dt; dirty = true; }
  if (id === 'emwaves' && !reduce) { S.wph += 3 * dt; dirty = true; }
  if (t - liveT > 160 && (id === 'faraday' || id === 'generator')) { liveT = t; live(); }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

  if (id === 'emwaves') h = B('e-1', 'ν ÷10') + B('e-', 'ν −') + B('e+', 'ν +') + B('e+1', 'ν ×10');

function act(a) {
  if (a === 'in') return moveMag(F1.xc);
  if (a === 'out') return moveMag(F1.xmin);
  if (a === 'slow' || a === 'fast') { S.speed = a; renderTools(); buildScheme(); return; }
  if (a === 'flip') return flipMag();
  if (a === 'turns') return cycleTurns();
  if (a.startsWith('t-')) { const N = +a.slice(2); return LID() === 'faraday' ? setTurns1(N) : setTurns2(N); }
  if (a === 'n-' || a === 'n+') return setN(S.n + (a === 'n-' ? -5 : 5));
  if (a === 'n0') return setN(0);
  if (a === 'n1') return cycleN(1);
  if (a === 'n2') return cycleN(2);
  if (a.startsWith('a-')) return setN1(+a.slice(2));
  if (a.startsWith('b-')) return setN2(+a.slice(2));
  if (a === 'ac' || a === 'dc') return setSrc(a);
  if (a === 'e-1' || a === 'e+1') return setE(S.e + (a === 'e-1' ? -1 : 1));
  if (a === 'e-' || a === 'e+') return setE(S.e + (a === 'e-' ? -0.1 : 0.1));
}

    let h = `<h2>Коэффициент трансформации</h2><div class="formula">U₁ / U₂ = N₁ / N₂ = k</div><div class="formula">U₂ = U₁ · N₂ / N₁</div>
      <h3>Сейчас</h3><div class="steps">` + step('k = N₁ / N₂', `${S.N1} / ${S.N2} = ${nf(Math.round(m.k * 100) / 100)}`) +
      step('U₂', m.ac ? `${Ls.U1} × ${S.N2} / ${S.N1} = ${nf(m.U2)} В` : 'поток не меняется → 0 В', 'sum') +
      step('тип', !m.ac ? 'не работает' : m.k > 1 ? 'понижающий (k > 1)' : m.k < 1 ? 'повышающий (k < 1)' : 'k = 1') + `</div>`;
    if (m.ac) h += `<h3>Токи при лампе ${P} Вт</h3><div class="steps">` + step('I₂ = P / U₂', `${P} / ${nf(m.U2)} = ${nf(Math.round(P / m.U2 * 1000) / 1000)} А`) + step('I₁ = P / U₁', `${P} / ${Ls.U1} = ${nf(Math.round(P / Ls.U1 * 1000) / 1000)} А`) + `</div><p class="note" style="margin-top:8px">Трансформатор считаем идеальным: мощность на входе и выходе одинакова. У настоящих КПД 95–99 %.</p>`;
    return h;
  }
  return `<h2>Длина волны</h2><div class="formula">λ = c / ν</div><p class="note">c = 3 · 10⁸ м/с — скорость света в вакууме.</p>
    <h3>Сейчас</h3><div class="steps">` + step('частота ν', `${fHz(m.f)} = ${sci(m.f)} Гц`) + step('λ = c / ν', `3·10⁸ / ${sci(m.f)} = ${lamFmt(m.lam)}`, 'sum') +
    step('период T = 1 / ν', `${sci(1 / m.f)} с`) + step('диапазон', m.band.n) + step('сравнение', lamCmp(m.lam)) + `</div>
    <h3>Границы диапазонов</h3><div class="steps">` + step('радиоволны', 'λ > 1 мм') + step('инфракрасное', '760 нм – 1 мм') + step('видимый свет', '380–760 нм') + step('ультрафиолет', '10–380 нм') + step('рентген', '0,01–10 нм') + step('гамма', '< 0,01 нм') + `</div>
    <p class="note" style="margin-top:8px">Границы приблизительные: диапазоны плавно переходят один в другой.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'faraday') el.innerHTML = `<div class="k">Гальванометр</div><div class="v ${Math.abs(m.I) > 3 ? 'ok' : ''}">${sgn(m.I)} дел.</div><div class="lr"><span>N</span><span>${S.N}</span></div><div class="lr"><span>к катушке</span><span>${S.pol > 0 ? 'N' : 'S'}</span></div>`;
  else if (id === 'generator') el.innerHTML = `<div class="k">Генератор</div><div class="v ${m.f === 50 && m.Em >= 300 && m.Em <= 330 ? 'ok' : ''}">ℰₘ ${Math.round(m.Em)} В</div><div class="lr"><span>ν</span><span>${m.f} Гц</span></div><div class="lr"><span>e</span><span>${Math.round(m.e)} В</span></div>`;
  else if (id === 'transformer') el.innerHTML = `<div class="k">Выход</div><div class="v ${m.ac && (Math.abs(m.U2 - 12) < 1e-9 || Math.abs(m.U2 - 1100) < 1e-9) ? 'ok' : ''}">U₂ ${nf(m.U2)} В</div><div class="lr"><span>N₁</span><span>${S.N1}</span></div><div class="lr"><span>N₂</span><span>${S.N2}</span></div>`;
  else el.innerHTML = `<div class="k">Волна</div><div class="v">λ ${lamFmt(m.lam)}</div><div class="lr"><span>ν</span><span>${fHz(m.f)}</span></div><div class="lr"><span></span><span>${m.band.s}</span></div>`;
}

// cheap per-frame refresh for the moving lessons
function live() {
  const m = model();
  renderMeter(m);
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, откуда берётся ток в розетке и как работает связь!'), 1900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  faraday: '<rect x="4" y="11" width="12" height="8" rx="1.5" fill="#72d4e8"/><rect x="16" y="11" width="12" height="8" rx="1.5" fill="#ff8a73"/><path d="M36 6a2.5 9 0 0 1 0 18M42 6a2.5 9 0 0 1 0 18M48 6a2.5 9 0 0 1 0 18M54 6a2.5 9 0 0 1 0 18" fill="none" stroke="#d9954f" stroke-width="2"/>',
  generator: '<rect x="4" y="6" width="9" height="18" rx="2" fill="#ff8a73"/><rect x="53" y="6" width="9" height="18" rx="2" fill="#72d4e8"/><rect x="25" y="8" width="16" height="14" fill="none" stroke="#d9954f" stroke-width="2.2"/><path d="M33 3v25" stroke="#a9b4c9" stroke-width="1.6"/>',
  transformer: '<path d="M14 4h38v22H14zM21 10v10h24V10z" fill="#4a5470" fill-rule="evenodd"/><path d="M12 9l12-2M12 14l12-2M12 19l12-2M12 24l12-2M42 13l12-2M42 20l12-2" stroke="#d9954f" stroke-width="1.8"/>',
  emwaves: '<path d="M2 15h62" stroke="#3a4762"/><path d="M2 15q4-12 8 0t8 0 8 0 8 0 8 0 8 0 8 0" fill="none" stroke="#ffb547" stroke-width="2"/><path d="M2 15q4 7 8 0t8 0 8 0 8 0 8 0 8 0 8 0" fill="none" stroke="#72d4e8" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  scene.setAttribute('aria-label', LID() === 'faraday' ? 'Магнит, катушка и гальванометр. Магнит можно тянуть.' : LID() === 'generator' ? 'Рамка вращается между полюсами магнита, внизу график ЭДС.' : LID() === 'transformer' ? 'Трансформатор: две обмотки на стальном сердечнике, источник и вольтметр.' : 'Электромагнитная волна и шкала частот.');
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'faraday') now = `Полосовой магнит (к катушке обращён полюс ${S.pol > 0 ? 'N' : 'S'}) находится в ${Math.round(F1.xc - S.mx)} мм от центра катушки ${m.g > 0.9 ? '(внутри катушки)' : m.g < 0.1 ? '(далеко от катушки)' : '(частично входит в катушку)'}, скорость ${fmt(m.v / 10, 0)} см/с. Катушка ${S.N} витков подключена к гальванометру, показание ${sgn(m.I)} дел. (условные деления, ноль посередине). Поток через катушку ${Math.round(m.g * 100)} % от наибольшего. Отклонение вправо больше 3 делений ${S.pos ? 'получено' : 'не получено'}, влево ${S.neg ? 'получено' : 'не получено'}, опыт «магнит стоит внутри» ${S.rest ? 'сделан' : 'не сделан'}. Наводи вопросами: что должно меняться, чтобы шёл ток, от чего зависит его сила и направление.`;
  if (id === 'generator') now = `Рамка из ${S.N} витков площадью ${nf(Ls.Sa)} м² вращается в поле B = ${nf(Ls.B)} Тл с частотой ${S.n} об/с. Частота тока ${m.f} Гц, ω = ${nf(Math.round(m.w * 10) / 10)} рад/с, амплитуда ЭДС ${Math.round(m.Em)} В, действующее напряжение ${Math.round(m.Urms)} В. Цель: 50 Гц и амплитуда 300–330 В. Нужное число витков не называй — наводи вопросами про формулу ℰₘ = NBSω.`;
  if (id === 'transformer') now = `Трансформатор: N₁ = ${S.N1}, N₂ = ${S.N2}, источник ${m.ac ? 'переменный 220 В, 50 Гц' : 'постоянный 220 В'}. Напряжение на выходе U₂ = ${nf(m.U2)} В, k = ${nf(Math.round(m.k * 100) / 100)}. 12 В ${S.g12 ? 'получено' : 'не получено'}, 1100 В ${S.gUp ? 'получено' : 'не получено'}, опыт с постоянным током ${S.dc ? 'сделан' : 'не сделан'}. Готовые пары витков не называй — наводи вопросами про U₂ = U₁N₂/N₁.`;
  if (id === 'emwaves') now = `Частота волны ${fHz(m.f)} (${sci(m.f)} Гц), длина волны ${lamFmt(m.lam)}, диапазон: ${m.band.n}. На экране бегущая волна: E и B колеблются перпендикулярно друг другу и направлению движения; внизу шкала электромагнитных волн. Найдено: λ = 3 м — ${S.fm ? 'да' : 'нет'}, видимый свет — ${S.vis ? 'да' : 'нет'}, рентген — ${S.xr ? 'да' : 'нет'}. Нужную частоту не называй — наводи вопросами про λ = c/ν.`;
  return [
    `Раздел: физика, 9 класс, электричество и магнетизм, тема «Электромагнитная индукция». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { faraday: 'Почему ток есть, только пока магнит движется?', generator: 'Почему ток в розетке переменный?', transformer: 'Почему трансформатор не работает на постоянном токе?', emwaves: 'Чем свет отличается от радиоволн?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
