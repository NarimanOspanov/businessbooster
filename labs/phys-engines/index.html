<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: двигатель внутреннего сгорания, паровая турбина и КПД теплового двигателя.">
<title>Тепловые двигатели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31C12 31 13 20 19 20S26 11 31 9" fill="none" stroke="var(--force)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 31L29 11" stroke="var(--arm)" stroke-width="2.2" stroke-linecap="round"/><path d="M33 8l-7 1.5 4.5 4.5z" fill="var(--arm)"/><circle cx="7" cy="31" r="3" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Двигатели</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с тепловыми двигателями. Маховик можно вращать, свечу, прожекторы и кнопки — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const big = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const MJ = x => `${fmt(x / 1e6, 2)} МДж`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'ice', title: 'Двигатель внутреннего сгорания',
    text: ['В двигателе внутреннего сгорания топливо горит прямо внутри цилиндра. Горячий газ давит на поршень и толкает его. Через шатун поршень вращает коленчатый вал, а вал — колёса машины.',
           'Работа идёт по кругу из четырёх тактов. 1 — впуск: поршень идёт вниз, впускной клапан открыт, в цилиндр входит горючая смесь (пары бензина с воздухом). 2 — сжатие: оба клапана закрыты, поршень идёт вверх и сжимает смесь. 3 — рабочий ход: свеча даёт искру, смесь сгорает, газ толкает поршень вниз. 4 — выпуск: открыт выпускной клапан, поршень выталкивает отработавшие газы.',
           'Полезную работу газ совершает только в третьем такте. Остальные такты поршень проходит за счёт тяжёлого маховика, который раскрутился во время рабочего хода. За один цикл вал делает два оборота.'],
    why: 'Автомеханики и диагносты на СТО по звуку и приборам ищут, в каком такте сбой: пропуск искры, износ клапанов. Это востребованная работа в любом городе Казахстана: машин много, а хороших мастеров мало. Инженеры на заводах в Костанае и Алматы собирают автомобили и настраивают двигатели. А водителю это помогает понять, почему машина «троит» и что сказать мастеру.',
    task: 'Заведите двигатель: включите стартер и дайте искру в нужный момент два цикла подряд. Тогда двигатель заработает сам.',
    hint: 'Маховик можно крутить пальцем по часовой стрелке, а можно включить стартер. Следите за кругом тактов справа. Искру даёт кнопка «Искра» или нажатие на свечу. В каком такте смесь сжата сильнее всего?',
    safe: 'Выхлоп содержит угарный газ: у него нет запаха, а он смертельно ядовит. Не прогревайте машину в закрытом гараже. Не трогайте двигатель и выхлопную трубу сразу после поездки.',
    stage: 'Крутите маховик по часовой стрелке или включите стартер.',
    starter: 150, run: 540, win: [320, 380], need: 2,
    check: m => m.started },
  { id: 'turb', title: 'Паровая турбина',
    text: ['В паровой турбине топливо горит снаружи, в топке котла. Вода в котле кипит, пар собирается под большим давлением. По трубе он идёт к соплам.',
           'Из сопла пар вылетает тонкой струёй с огромной скоростью. Струя ударяет в изогнутые лопатки на диске и раскручивает его. Энергия пара переходит в энергию вращения вала. Вал крутит генератор, и тот даёт ток.',
           'Отработавший пар уходит в конденсатор, остывает и снова становится водой. Насос возвращает её в котёл. Чтобы ток в сети был с частотой 50 Гц, вал генератора крутится ровно 3000 оборотов в минуту. Чем больше лампочек включено, тем больше нужно пара.'],
    why: 'Большая часть электричества Казахстана идёт с паровых турбин на угольных станциях: на Экибастузской ГРЭС-1 стоят турбины по 500 МВт. Машинисты турбин и операторы энергоблоков следят за давлением пара и оборотами, пока город включает свет и чайники. Теплоэнергетик — нужная и хорошо оплачиваемая профессия: её учат в Павлодаре, Экибастузе, Алматы.',
    task: 'Включите все 4 прожектора и удержите частоту тока 50 Гц (3000 ± 150 об/мин) 3 секунды. Пар через предохранительный клапан не должен уходить.',
    hint: 'Огонь и задвижку меняйте кнопками внизу или ползунками во вкладке «Схема». Прожекторы включаются нажатием на них. Без нагрузки турбина разгоняется слишком сильно. Если стрелка давления у красной черты, задвижку надо открыть шире.',
    safe: 'Пар обжигает сильнее кипятка: когда он конденсируется на коже, он отдаёт ещё и теплоту парообразования. Струя перегретого пара из трещины может быть невидимой. Котлы и турбины обслуживают только обученные люди.',
    stage: 'Разожгите огонь, откройте задвижку, включите прожекторы.',
    kv: 0.1, Cb: 0.25, pMax: 16, J: 0.0042, kW: 6, fric: 0.3, trip: 3300, lamps: 4, hold: 3,
    check: m => m.ok },
  { id: 'eff', title: 'КПД теплового двигателя',
    text: ['Любой тепловой двигатель получает от сгоревшего топлива теплоту Q₁. Часть её превращается в полезную работу A. Остальное Q₂ уходит в окружающую среду: с горячим выхлопом, через радиатор, на трение.',
           'Коэффициент полезного действия показывает, какая доля теплоты стала полезной работой: η = A / Q₁ · 100 %. КПД всегда меньше 100 %: без холодильника, куда уходит часть тепла, тепловой двигатель работать не может.',
           'У бензиновых двигателей КПД около 25 %, у дизелей около 40 %, у паровоза всего 8–10 %. Чем выше КПД, тем меньше топлива нужно на ту же работу.'],
    why: 'Логисты и владельцы грузовиков считают расход топлива на рейс Алматы — Астана: от КПД двигателя зависит прибыль. Поэтому фуры и тракторы почти всегда дизельные. Инженеры-конструкторы годами борются за каждый процент КПД. А в семье это видно на заправке: экономичная машина за год экономит сотни тысяч тенге.',
    task: 'Залейте в бак столько топлива, чтобы машина доехала до аула в 2 км и запас был не больше 10 %. Сделайте это для бензинового двигателя и для дизеля.',
    hint: 'Сила сопротивления движению 500 Н. Работа до аула A = F·s. Подумайте: какую теплоту Q₁ должно дать топливо, если КПД двигателя η? А сколько для этого нужно граммов? Двигатель меняет кнопка «Двигатель».',
    stage: 'Залейте топливо и нажмите «Поехали».',

const LS_KEY = 'luch-phys-engines';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true;

const ENG = {
  petrol: { name: 'бензиновый', fuel: 'бензин', q: 4.6e7, eta: 0.25, col: '#e6c14a' },
  diesel: { name: 'дизель', fuel: 'дизельное топливо', q: 4.2e7, eta: 0.40, col: '#c9a35a' },
};
const EKEYS = Object.keys(ENG);
const STROKES = ['впуск', 'сжатие', 'рабочий ход', 'выпуск'];

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const G1 = { cx: 190, cy: 340, r: 36, l: 90, head: 188, wx: 400, wy: 285, wr: 56 };
const G2 = { bx: 22, bw: 104, by: 250, wcx: 270, wcy: 282, wr: 56, gx: 370, gy: 256, lampY: 178, lampX: [384, 414, 444, 474] };
const G3 = { x0: 40, x1: 480, km: 2.2, ry: 372, ey: 186 };
const sx3 = s => G3.x0 + (G3.x1 - G3.x0) * s / (G3.km * 1000);

function resetState() {
  Object.assign(S, {
    // lesson 1
    phi: 0, starter: false, running: false, fired: false, sparkAt: null, streak: 0, started: false, flashT: -1e9, cycles: 0,
    // lesson 2
    burner: 0, valve: 0, p: 1, rpm: 0, rot: 0, vent: false, lamp: [false, false, false, false], hold: 0, ok: false, trips: 0, best: 0,
    // lesson 3
    eng: 'petrol', mf: L().mf0 || 50, pos: 0, driving: false, arrived: false, left: L().mf0 || 50, petrol: false, diesel: false, runs: [],
    hl: null,
  });
}

// ---------- lesson 1: four-stroke engine ----------
const loc = () => ((S.phi % 720) + 720) % 720;
const strokeOf = a => Math.min(3, Math.floor(a / 180));
const pinY = th => { const r = G1.r, l = G1.l; return G1.cy - (r * Math.cos(th) + Math.sqrt(l * l - r * r * Math.sin(th) ** 2)); };
const pistonTop = () => pinY(S.phi * Math.PI / 180) - 18;
const TDC = G1.cy - G1.r - G1.l - 18, BDC = G1.cy + G1.r - G1.l - 18;
const valveLift = (a, from) => (a >= from && a < from + 180) ? 9 * Math.sin((a - from) / 180 * Math.PI) : 0;
function advance(d) {
  while (d > 0) {
    const st = Math.min(d, 8), before = loc(), c0 = Math.floor(S.phi / 720);
    S.phi += st; d -= st;
    const a = loc(), c1 = Math.floor(S.phi / 720);
    if (c1 > c0) { S.fired = false; S.sparkAt = null; S.cycles++; continue; }
    if (S.running && before < 345 && a >= 345) { S.fired = true; S.sparkAt = 345; S.flashT = performance.now(); }
    if (!S.running && before < L().win[1] && a >= L().win[1] && !S.fired) {
      if (S.streak > 0) toast('Момент искры пропущен: смесь не сгорела, и рабочего хода не было.');
      S.streak = 0;
    }
    if (!S.running && before < 540 && a >= 540 && S.fired) {
      S.streak++;
      if (S.streak >= L().need) {
        S.running = true; S.starter = false; S.started = true;
        toast('Двигатель завёлся! Теперь искру в нужный момент даёт система зажигания.');
        renderTools(); buildScheme();
      } else toast(`Рабочий ход! Вспышек подряд: ${S.streak} из ${L().need}.`);
      update();
    }
  }
  dirty = true;
}
function spark() {
  if (LID() !== 'ice') return;
  if (S.running) { toast('Двигатель работает: искру в нужный момент даёт система зажигания.'); return; }
  S.flashT = performance.now(); dirty = true;
  const a = loc(), w = L().win;
  if (S.fired) { toast('Смесь в этом цикле уже сгорела. Ждите следующего сжатия.'); return; }
  if (a >= w[0] && a <= w[1]) { S.fired = true; S.sparkAt = a; toast('Вспышка! Горячий газ толкает поршень вниз.'); }
  else if (a > 180 && a < w[0]) { S.streak = 0; toast('Рано: поршень ещё идёт вверх, и вспышка толкает его назад. Дождитесь верхней точки.'); }
  else if (a > w[1] && a < 540) { S.streak = 0; toast('Поздно: поршень уже ушёл вниз, смесь сгорит почти без пользы.'); }
  else { S.streak = 0; toast(`Сейчас ${STROKES[strokeOf(a)]}: в цилиндре нет сжатой горючей смеси.`); }
  update();
}
const burning = a => S.fired && S.sparkAt !== null && a >= S.sparkAt && a < 540;
const gasState = a => {
  const k = strokeOf(a);
  if (k === 0) return 'mix';
  if (k === 1) return burning(a) ? 'burn' : 'mix';
  if (k === 2) return burning(a) ? 'burn' : 'mix';
  return S.fired ? 'exhaust' : 'mix';
};

// ---------- lesson 2: steam turbine ----------
const nLamps = () => S.lamp.filter(Boolean).length;
const flow = () => L().kv * S.valve / 100 * Math.max(0, S.p - 1);
const Nturb = () => L().kW * flow();
const Pload = () => nLamps() * (S.rpm / 3000) ** 2 + L().fric * (S.rpm / 3000);
const freq = () => S.rpm / 60;
function stepTurb(dt) {
  const Ls = L(), gen = S.burner / 100;
  let p = S.p + (gen - flow()) / Ls.Cb * dt;
  if (p > Ls.pMax) { p = Ls.pMax; S.vent = true; } else S.vent = false;
  S.p = Math.max(1, p);
  S.rpm = Math.max(0, S.rpm + (Nturb() - Pload() - 0.05) / Ls.J * dt);
  S.rot = (S.rot + S.rpm / 3000 * 430 * dt) % 360;
  if (S.rpm > Ls.trip) {
    S.valve = 0; S.trips++;
    toast(`Автомат безопасности: вал разогнался выше ${Ls.trip} об/мин, задвижка закрыта. Добавьте нагрузку или убавьте огонь.`);
    renderTools(); buildScheme(); update();
  }
  const inBand = nLamps() === Ls.lamps && Math.abs(S.rpm - 3000) <= 150 && !S.vent;
  S.hold = inBand ? S.hold + dt : 0;
  S.best = Math.max(S.best, S.hold);
  if (!S.ok && S.hold >= Ls.hold) {
    S.ok = true;
    toast(`Частота ${fmt(freq(), 1)} Гц держится. Турбина отдаёт ${fmt(Nturb(), 1)} кВт, и все прожекторы горят ровно.`);
    update();
  }
}

// ---------- lesson 3: efficiency ----------
const Q1 = () => ENG[S.eng].q * S.mf / 1000;
const Ause = () => ENG[S.eng].eta * Q1();
const range3 = () => Ause() / L().F;
const needG = k => L().F * L().D / (ENG[k].eta * ENG[k].q) * 1000;
function go() {
  if (S.driving) return;
  S.pos = 0; S.left = S.mf; S.arrived = false; S.driving = true; renderTools(); update();
}
function stepDrive(dt) {
  const Ls = L(), sMax = Math.min(range3(), Ls.D), v = reduce ? 4000 : 700;
  S.pos = Math.min(sMax, S.pos + v * dt);
  S.left = S.mf * (1 - S.pos / range3());
  if (S.pos >= sMax - 1e-9) {
    S.driving = false;
    const left = S.mf - needG(S.eng) ;
    const rec = { eng: S.eng, m: S.mf, s: sMax };
    S.runs.unshift(rec); S.runs = S.runs.slice(0, 4);
    if (range3() < Ls.D) toast(`Топливо кончилось за ${big(Ls.D - range3())} м до аула. Нужно больше топлива.`);
    else if (range3() <= Ls.D * (1 + Ls.extra) + 1e-6) {
      S.arrived = true; S[S.eng] = true;
      toast(`Доехали! В баке осталось ${fmt(Math.max(0, left), 1)} г — запас в норме.`);
    } else { S.arrived = true; toast(`Доехали, но в баке осталось ${fmt(left, 0)} г. Запас больше 10 % — попробуйте точнее.`); }
    renderTools(); update();
  }
}

function model() {
  const id = LID();
  if (id === 'ice') return { kind: id, started: S.started, phase: loc(), streak: S.streak };
  if (id === 'turb') return { kind: id, ok: S.ok, rpm: S.rpm, p: S.p };
  return { kind: id, petrol: S.petrol, diesel: S.diesel };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#2e3b57" stroke-width="3"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    ${[['B', '#7fc4ff'], ['G', '#a9b4c9'], ['O', '#ffb547'], ['E', '#86e0a8']].map(([k, c]) => `<marker id="ar${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const ground = y => `<rect x="-2000" y="${y}" width="4520" height="1200" fill="#151e2e"/><rect x="-2000" y="${y}" width="4520" height="12" fill="url(#hatch)"/><path d="M-2000 ${y}H2520" stroke="#3a4762" stroke-width="2"/>`;
function flame(x, y, s, t) {
  const k = reduce ? 1 : 1 + 0.08 * Math.sin(t / 90) + 0.05 * Math.sin(t / 37);
  const hgt = 30 * s * k;
  return `<path d="M${x - 9 * s} ${y}C${x - 10 * s} ${y - hgt * .5} ${x - 3 * s} ${y - hgt * .7} ${x} ${y - hgt}C${x + 3 * s} ${y - hgt * .7} ${x + 10 * s} ${y - hgt * .5} ${x + 9 * s} ${y}Z" fill="#ff8a3c" opacity=".9"/>
    <path d="M${x - 4.5 * s} ${y}C${x - 5 * s} ${y - hgt * .35} ${x - 1 * s} ${y - hgt * .45} ${x} ${y - hgt * .62}C${x + 1 * s} ${y - hgt * .45} ${x + 5 * s} ${y - hgt * .35} ${x + 4.5 * s} ${y}Z" fill="#7fc4ff" opacity=".85"/>`;
}
function puffs(x, y, tm, n, dx, col = '#c8d0dd') {
  let h = '';
  for (let k = 0; k < n; k++) {
    const ph = reduce ? 0.4 : ((tm / 700 + k / n) % 1);
    h += `<circle cx="${(x + dx * ph * 40).toFixed(1)}" cy="${(y - ph * 30).toFixed(1)}" r="${(4 + ph * 9).toFixed(1)}" fill="${col}" opacity="${(0.55 * (1 - ph)).toFixed(2)}"/>`;
  }
  return h;
}
const arc = (cx, cy, r, a0, a1) => {
  const p = a => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
};
const sector = (cx, cy, r, a0, a1) => `M${cx} ${cy}L` + arc(cx, cy, r, a0, a1).slice(1) + 'Z';

// ---------- lesson 1 scene ----------
function iceScene(tm) {
  const g = G1, cx = g.cx, a = loc(), th = S.phi * Math.PI / 180, k = strokeOf(a);
  const pt = pistonTop(), py = pinY(th), crx = cx + g.r * Math.sin(th), cry = g.cy - g.r * Math.cos(th);
  const inL = valveLift(a, 0), exL = valveLift(a, 540);
  let h = ground(392);
  // crankcase
  h += `<path d="M${cx - 60} 300H${cx + 60}V384q0 8-8 8H${cx - 52}q-8 0-8-8z" fill="#151e2e" stroke="#3a4762" stroke-width="2"/>`;
  // ports
  h += `<path d="M${cx - 130} 172H${cx - 46}L${cx - 24} ${g.head}" fill="none" stroke="#3a4762" stroke-width="14" stroke-linejoin="round"/>
    <path d="M${cx + 130} 172H${cx + 46}L${cx + 24} ${g.head}" fill="none" stroke="#3a4762" stroke-width="14" stroke-linejoin="round"/>`;
  if (inL > 1) h += `<path d="M${cx - 124} 172H${cx - 54}" stroke="#7fc4ff" stroke-width="3" marker-end="url(#arB)" stroke-dasharray="${reduce ? '0' : '8 6'}" stroke-dashoffset="${reduce ? 0 : (-tm / 30 % 14).toFixed(1)}"/>`;
  if (exL > 1) h += `<path d="M${cx + 54} 172H${cx + 124}" stroke="#a9b4c9" stroke-width="3" marker-end="url(#arG)" stroke-dasharray="${reduce ? '0' : '8 6'}" stroke-dashoffset="${reduce ? 0 : (-tm / 30 % 14).toFixed(1)}"/>` + (S.fired || S.running ? puffs(cx + 140, 168, tm, 3, 1, '#8b96ad') : '');
  h += T(cx - 100, 160, 9.5, '#7fc4ff', 'смесь', 'middle', halo) + T(cx + 100, 160, 9.5, '#a9b4c9', 'выхлоп', 'middle', halo);
  // gas in cylinder
  const gs = gasState(a);
  let gcol = '#7fc4ff', gop = 0.28;
  if (gs === 'mix' && k === 1) gop = 0.28 + 0.35 * (a - 180) / 180;
  if (gs === 'mix' && k === 2) gop = 0.5 - 0.25 * (a - 360) / 180;
  if (gs === 'burn') { const u = (a - S.sparkAt) / (540 - S.sparkAt); gcol = u < 0.3 ? '#ffd27a' : '#ff8a3c'; gop = 0.85 - 0.5 * u; }
  if (gs === 'exhaust') { gcol = '#8b96ad'; gop = 0.35; }
  h += `<rect x="${cx - 48}" y="${g.head}" width="96" height="${(pt - g.head).toFixed(1)}" fill="${gcol}" opacity="${gop.toFixed(2)}"/>`;
  if (gs === 'burn') h += `<ellipse cx="${cx}" cy="${((g.head + pt) / 2).toFixed(1)}" rx="70" ry="40" fill="url(#glow)"/>`;
  // cylinder walls and head
  h += `<path d="M${cx - 50} ${g.head}V312M${cx + 50} ${g.head}V312" stroke="#a9b4c9" stroke-width="4"/>
    <rect x="${cx - 64}" y="156" width="128" height="${g.head - 156}" rx="4" fill="#3a4762" stroke="${INK}" stroke-width="1.6"/>`;
  for (let y = 200; y < 300; y += 14) h += `<path d="M${cx - 60} ${y}h6M${cx + 54} ${y}h6" stroke="#5d6a86" stroke-width="3"/>`;
  // valves
  const valve = (x, lift, col) => `<path d="M${x} 146V${(g.head + lift).toFixed(1)}" stroke="#c8d0dd" stroke-width="3"/><path d="M${x - 11} ${(g.head + lift).toFixed(1)}h22l-4 -5h-14z" fill="${col}" stroke="${INK}" stroke-width="1"/><rect x="${x - 6}" y="140" width="12" height="7" rx="2" fill="#5d6a86"/>`;
  h += `<g data-click="valves">${valve(cx - 24, inL, inL > 1 ? '#7fc4ff' : '#8b96ad')}${valve(cx + 24, exL, exL > 1 ? '#ffb547' : '#8b96ad')}</g>`;
  // spark plug
  const fl = performance.now() - S.flashT < 220;
  h += `<g data-click="plug"><rect x="${cx - 14}" y="110" width="28" height="64" fill="transparent"/><rect x="${cx - 5}" y="118" width="10" height="20" rx="3" fill="#e8ecf4"/><rect x="${cx - 7}" y="138" width="14" height="12" fill="#8b96ad"/><path d="M${cx} 150V${g.head + 3}" stroke="#c8d0dd" stroke-width="3"/>
    <path d="M${cx} 114V104" stroke="#ff8a73" stroke-width="2"/></g>`;
  if (fl) h += `<path d="M${cx - 2} ${g.head + 2}l5 4-6 3 7 4" fill="none" stroke="#fff3b0" stroke-width="2"/><circle cx="${cx}" cy="${g.head + 6}" r="14" fill="url(#glow)"/>`;
  h += T(cx, 98, 9.5, '#ff8a73', 'свеча', 'middle', halo);
  // piston, rod, crank, flywheel
  h += `<g data-drag="fly"><circle cx="${cx}" cy="${g.cy}" r="64" fill="transparent"/>
    <circle cx="${cx}" cy="${g.cy}" r="50" fill="none" stroke="#5d6a86" stroke-width="9"/>`;
  for (let s = 0; s < 6; s++) { const an = th + s * Math.PI / 3; h += `<path d="M${cx} ${g.cy}L${(cx + 46 * Math.sin(an)).toFixed(1)} ${(g.cy - 46 * Math.cos(an)).toFixed(1)}" stroke="#3a4762" stroke-width="3"/>`; }
  h += `<circle cx="${(cx + 50 * Math.sin(th)).toFixed(1)}" cy="${(g.cy - 50 * Math.cos(th)).toFixed(1)}" r="4" fill="#ffb547"/>`;
  h += `<path d="M${cx} ${g.cy}L${crx.toFixed(1)} ${cry.toFixed(1)}" stroke="#a9b4c9" stroke-width="10" stroke-linecap="round"/>
    <path d="M${crx.toFixed(1)} ${cry.toFixed(1)}L${cx} ${py.toFixed(1)}" stroke="#c8d0dd" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${g.cy}" r="7" fill="#e8ecf4" stroke="${INK}"/><circle cx="${crx.toFixed(1)}" cy="${cry.toFixed(1)}" r="5" fill="#e8ecf4" stroke="${INK}"/></g>`;
  h += `<rect x="${cx - 47}" y="${pt.toFixed(1)}" width="94" height="34" rx="3" fill="#8b96ad" stroke="${INK}" stroke-width="1.6"/>
    <path d="M${cx - 47} ${(pt + 7).toFixed(1)}h94M${cx - 47} ${(pt + 12).toFixed(1)}h94" stroke="#5d6a86" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${py.toFixed(1)}" r="5" fill="#e8ecf4" stroke="${INK}"/>`;
  // force arrow on burn, motion arrow
  if (gs === 'burn') h += `<path d="M${cx - 30} ${(pt - 22).toFixed(1)}V${(pt - 3).toFixed(1)}M${cx + 30} ${(pt - 22).toFixed(1)}V${(pt - 3).toFixed(1)}" stroke="#ffb547" stroke-width="3" marker-end="url(#arO)"/>`;
  const down = (a % 360) < 180;
  h += `<path d="M${cx - 76} ${down ? 224 : 270}V${down ? 270 : 224}" stroke="#86e0a8" stroke-width="2.5" marker-end="url(#arE)"/>` + T(cx - 78, 290, 9, '#86e0a8', down ? 'вниз' : 'вверх', 'middle', halo);
  h += T(cx, 404, 9.5, '#8b96ad', 'маховик · тяни по часовой', 'middle', halo);
  // stroke wheel
  const wx = g.wx, wy = g.wy, wr = g.wr;
  const cols = ['#7fc4ff', '#72d4e8', '#ffb547', '#8b96ad'];
  for (let s = 0; s < 4; s++) {

const scene = $('#scene');

  const id = LID();

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 440, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 430 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);

}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const flyAngle = p => Math.atan2(p.x - G1.cx, -(p.y - G1.cy)) * 180 / Math.PI;
scene.addEventListener('pointerdown', e => {
  const cl = e.target.closest('[data-click]');
  if (cl) { act(cl.dataset.click); return; }
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  if (S.running) { toast('Двигатель работает сам. Нажмите «Заглушить», чтобы крутить маховик рукой.'); return; }
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  drag = { id: el.dataset.drag, a: flyAngle(toSvg(e)) };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const a = flyAngle(toSvg(e));
  let d = a - drag.a; if (d > 180) d -= 360; if (d < -180) d += 360;
  drag.a = a;
  if (d > 0) { advance(Math.min(d, 60)); }
});
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); update(); };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

// ---------- state changes ----------
function setBurner(v) { S.burner = clamp(Math.round(v / 5) * 5, 0, 100); renderTools(); update(); }
function setValve(v) { S.valve = clamp(Math.round(v / 5) * 5, 0, 100); renderTools(); update(); }
function setMf(v) { if (S.driving) return; S.mf = clamp(Math.round(v), 5, 200); S.left = S.mf; S.pos = 0; S.arrived = false; renderTools(); update(); }
function setEng(k) { if (S.driving || S.eng === k) return; S.eng = k; S.left = S.mf; S.pos = 0; S.arrived = false; renderTools(); update(); }
function resetIce() { Object.assign(S, { phi: 0, starter: false, running: false, fired: false, sparkAt: null, streak: 0, cycles: 0 }); renderTools(); update(); }
function resetTurb() { Object.assign(S, { burner: 0, valve: 0, p: 1, rpm: 0, vent: false, lamp: [false, false, false, false], hold: 0 }); renderTools(); update(); }

let last = performance.now(), acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  const tick = () => { acc += dt; if (acc > 0.2) { acc = 0; update(); } };
  if (id === 'ice') { if (S.running) { advance(L().run * dt); tick(); } else if (S.starter) { advance(L().starter * dt); tick(); } }
  if (id === 'turb') { stepTurb(dt); tick(); dirty = true; }
  if (id === 'eff') { if (S.driving) { stepDrive(dt); tick(); } dirty = true; }
  if (id === 'ice' && performance.now() - S.flashT < 400) dirty = true;
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function renderTools() {

function act(a) {
  const id = LID();
  if (a === 'reset') { if (id === 'ice') resetIce(); if (id === 'turb') resetTurb(); buildScheme(); return; }
  if (a === 'starter') { S.starter = !S.starter; renderTools(); update(); return; }
  if (a === 'stop') { S.running = false; S.starter = false; S.streak = 0; S.fired = false; renderTools(); buildScheme(); update(); return; }
  if (a === 'spark' || a === 'plug') return spark();
  if (a === 'turn') { if (!S.running) { advance(45); update(); } return; }
  if (a === 'valves') { const v = loc(); toast(valveLift(v, 0) > 0 ? 'Открыт впускной клапан: входит горючая смесь.' : valveLift(v, 540) > 0 ? 'Открыт выпускной клапан: выходят отработавшие газы.' : 'Оба клапана закрыты.'); return; }
  if (a === 'b-' || a === 'b+') { setBurner(S.burner + (a === 'b+' ? 5 : -5)); buildScheme(); return; }
  if (a === 'v-' || a === 'v+') { setValve(S.valve + (a === 'v+' ? 10 : -10)); buildScheme(); return; }
  if (a === 'burner') { setBurner(S.burner >= 100 ? 0 : S.burner + 10); buildScheme(); return; }
  if (a === 'valve') { setValve(S.valve >= 100 ? 0 : S.valve + 10); buildScheme(); return; }
  if (/^lamp\d$/.test(a)) { const i = +a[4]; S.lamp[i] = !S.lamp[i]; renderTools(); buildScheme(); update(); return; }
  if (a === 'lamps') { const n = (nLamps() + 1) % 5; S.lamp = [0, 1, 2, 3].map(i => i < n); renderTools(); buildScheme(); update(); return; }
  if (a === 'ecycle') { setEng(EKEYS[(EKEYS.indexOf(S.eng) + 1) % EKEYS.length]); buildScheme(); return; }
  if (/^eng-/.test(a)) { setEng(a.slice(4)); buildScheme(); return; }

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'ice') {
    const a = loc(), k = strokeOf(a), pt = pistonTop(), V = (pt - G1.head), Vmax = BDC - G1.head, Vmin = TDC - G1.head;
    const inO = valveLift(a, 0) > 0, exO = valveLift(a, 540) > 0, down = (a % 360) < 180;
    return `<h2>Что происходит сейчас</h2><div class="formula">${k + 1}. ${STROKES[k]}</div>
      <div class="steps">` + step('угол коленчатого вала', `${Math.round(a)}° из 720°`) + step('поршень движется', down ? 'вниз' : 'вверх') +
      step('впускной клапан', inO ? 'открыт' : 'закрыт') + step('выпускной клапан', exO ? 'открыт' : 'закрыт') +
      step('объём над поршнем', `${Math.round(V / Vmax * 100)} % от наибольшего`) +
      step('газ в цилиндре', { mix: k === 1 ? 'горючая смесь, сжимается' : k === 0 ? 'горючая смесь, входит' : 'несгоревшая смесь', burn: 'горит, давит на поршень', exhaust: 'отработавшие газы' }[gasState(a)], 'sum') + `</div>
      <h3>Цикл целиком</h3><div class="steps">` +
      step('1. впуск, 0–180°', 'поршень ↓, впуск открыт') + step('2. сжатие, 180–360°', 'поршень ↑, клапаны закрыты') + step('3. рабочий ход, 360–540°', 'искра, газ толкает поршень ↓') + step('4. выпуск, 540–720°', 'поршень ↑, выпуск открыт') +
      step('степень сжатия Vmax / Vmin', `${fmt(Vmax / Vmin, 0)}`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">За цикл вал делает 2 оборота, а работу газ совершает только в одном такте из четырёх. Поэтому в машинах ставят по 4 цилиндра и больше: их рабочие ходы идут по очереди, и вал крутится ровно.</p>`;
  }

    const G = flow(), N = Nturb(), n = nLamps(), x = S.rpm / 3000;
    return `<h2>Энергия по цепочке</h2><div class="formula">топливо → пар → вал → ток</div>
      <h3>Котёл</h3><div class="steps">` + step('огонь', `${S.burner} % — пара ${fmt(S.burner / 100, 2)} ед./с`) + step('задвижка', `${S.valve} %`) +
      step('давление пара', `${fmt(S.p, 1)} атм${S.vent ? ' — сброс через клапан!' : ''}`) + step('к турбине идёт пара', `${fmt(G, 2)} ед./с`, 'sum') + `</div>
      <h3>Турбина и нагрузка</h3><div class="steps">` + step('мощность пара на валу', `${fmt(N, 2)} кВт`) +
      step('прожекторы', `${n} × 1 кВт · (n/3000)² = ${fmt(n * x * x, 2)} кВт`) + step('трение', `${fmt(Ls.fric * x, 2)} кВт`) +
      step(N > Pload() + 0.02 ? 'пар сильнее нагрузки' : N < Pload() - 0.02 ? 'нагрузка сильнее пара' : 'равновесие', N > Pload() + 0.02 ? 'вал разгоняется' : N < Pload() - 0.02 ? 'вал тормозится' : 'обороты постоянны', 'sum') + `</div>
      <h3>Генератор</h3><div class="steps">` + step('частота f = n / 60', `${big(S.rpm)} / 60 = ${fmt(freq(), 1)} Гц`) + step('нужно', '50 Гц = 3000 об/мин', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Обороты перестают меняться, когда мощность пара равна мощности нагрузки. Больше прожекторов — нужно больше пара, а значит, больше огня в топке.</p>`;
  }
  const e = ENG[S.eng], q1 = Q1(), A = Ause(), Aneed = Ls.F * Ls.D;
  return `<h2>КПД и расход топлива</h2><div class="formula">η = A / Q₁ · 100 %</div><p class="note">A — полезная работа (Дж), Q₁ — теплота от сгоревшего топлива (Дж), Q₂ = Q₁ − A — теплота, ушедшая в окружающую среду.</p>
    <h3>Топливо</h3><div class="steps">` + step('топливо', e.fuel) + step('q', `${fmt(e.q / 1e7, 1)}·10⁷ Дж/кг`) + step('m', `${S.mf} г = ${fmt(S.mf / 1000, 3)} кг`) +
    step('Q₁ = q·m', `${big(q1)} Дж`, 'sum') + `</div>
    <h3>Двигатель</h3><div class="steps">` + step('η', `${Math.round(e.eta * 100)} % = ${fmt(e.eta, 2)}`) + step('A = η·Q₁', `${fmt(e.eta, 2)} · ${big(q1)} = ${big(A)} Дж`) +
    step('Q₂ = Q₁ − A', `${big(q1 - A)} Дж`) + step('путь s = A / F', `${big(A)} / ${Ls.F} = ${big(A / Ls.F)} м`, 'sum') + `</div>
    <h3>Дорога до аула</h3><div class="steps">` + step('нужна работа A = F·s', `${Ls.F} · ${Ls.D} = ${big(Aneed)} Дж`) +
    step('сравнение', A >= Aneed ? `хватит, запас ${fmt((A / Aneed - 1) * 100, 0)} %` : `не хватит ${big(Aneed - A)} Дж работы`, 'sum') + `</div>` +
    (S.runs.length ? `<h3>Последние поездки</h3><div class="steps">` + S.runs.map(r => step(`${ENG[r.eng].name}, ${r.m} г`, r.s >= Ls.D ? 'доехала' : `встала на ${big(r.s)} м`)).join('') + `</div>` : '') +
    `<p class="note" style="margin-top:10px">Типичный КПД: паровоз 8–10 %, бензиновый двигатель 20–30 %, дизель 35–40 %, паровая турбина ТЭС 30–40 %.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'ice') {
    const a = loc(), k = strokeOf(a);
    el.innerHTML = `<div class="k">${S.running ? 'Двигатель работает' : S.starter ? 'Стартер крутит' : 'Двигатель'}</div><div class="v ${S.running ? 'ok' : ''}">${k + 1}. ${STROKES[k]}</div>` +
      `<div class="lr"><span>угол</span><span>${Math.round(a)}°</span></div><div class="lr"><span>вспышки</span><span class="${S.streak ? 'ok' : ''}">${S.running ? 'сами' : S.streak + ' из ' + L().need}</span></div>`;
  } else if (id === 'turb') {
    el.innerHTML = `<div class="k">Генератор</div><div class="v ${Math.abs(S.rpm - 3000) <= 150 ? 'ok' : ''}">${fmt(freq(), 1)} Гц</div>` +
      `<div class="lr"><span>обороты</span><span>${big(S.rpm)}</span></div><div class="lr"><span>давление</span><span class="${S.vent ? 'bad' : ''}">${fmt(S.p, 1)} атм</span></div><div class="lr"><span>мощность</span><span>${fmt(Nturb(), 1)} кВт</span></div>`;
  } else {
    el.innerHTML = `<div class="k">${ENG[S.eng].name} · КПД ${Math.round(ENG[S.eng].eta * 100)} %</div><div class="v ${S.arrived ? 'ok' : ''}">${fmt(S.pos / 1000, 2)} км</div>` +
      `<div class="lr"><span>в баке</span><span>${fmt(S.left, 1)} г</span></div><div class="lr"><span>Q₁</span><span>${MJ(Q1())}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как работают тепловые двигатели!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  ice: '<path d="M22 4v18M44 4v18" stroke="#a9b4c9" stroke-width="2"/><rect x="20" y="1" width="26" height="4" fill="#3a4762"/><rect x="23" y="5" width="20" height="6" fill="#ffb547" opacity=".7"/><rect x="23" y="11" width="20" height="7" fill="#8b96ad"/><path d="M33 15l4 11" stroke="#c8d0dd" stroke-width="2"/><circle cx="54" cy="20" r="7" fill="none" stroke="#5d6a86" stroke-width="2"/>',
  turb: '<rect x="3" y="10" width="14" height="18" rx="3" fill="#26324a"/><path d="M10 10V5H24" stroke="#5d6a86" stroke-width="2" fill="none"/><circle cx="33" cy="16" r="10" fill="none" stroke="#a9d6e4" stroke-width="2" stroke-dasharray="3 2"/><path d="M33 16H48" stroke="#c8d0dd" stroke-width="2"/><rect x="48" y="10" width="15" height="12" rx="2" fill="#3a4762"/><circle cx="56" cy="5" r="3" fill="#ffe696"/>',
  eff: '<path d="M3 12H24" stroke="#ffb547" stroke-width="10" opacity=".75"/><rect x="24" y="4" width="14" height="16" rx="3" fill="#3a4762"/><path d="M38 9C50 9 50 6 63 6" stroke="#86e0a8" stroke-width="4" fill="none"/><path d="M38 16C48 16 50 26 58 26" stroke="#ff8a73" stroke-width="6" fill="none" opacity=".75"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'ice') { const a = loc(), k = strokeOf(a); now = `Разрез четырёхтактного двигателя: цилиндр, поршень, шатун, коленчатый вал с маховиком, впускной и выпускной клапаны, свеча. Угол вала ${Math.round(a)}° из 720°, сейчас такт ${k + 1} — ${STROKES[k]}, поршень идёт ${(a % 360) < 180 ? 'вниз' : 'вверх'}, впускной клапан ${valveLift(a, 0) > 0 ? 'открыт' : 'закрыт'}, выпускной ${valveLift(a, 540) > 0 ? 'открыт' : 'закрыт'}. Стартер ${S.starter ? 'включён' : 'выключен'}. Двигатель ${S.running ? 'завёлся и работает сам' : 'не заведён'}. Удачных вспышек подряд: ${S.streak} из ${Ls.need}. Ученик сам должен понять, что искра нужна в конце такта сжатия, когда поршень у верхней точки — не говори угол прямо, наводи вопросами.`; }
  if (id === 'turb') now = `Котёл с топкой (огонь ${S.burner} %), задвижка открыта на ${S.valve} %, давление пара ${fmt(S.p, 1)} атм${S.vent ? ', пар сбрасывается через предохранительный клапан' : ''}. Турбина ${big(S.rpm)} об/мин, генератор ${fmt(freq(), 1)} Гц, мощность пара на валу ${fmt(Nturb(), 2)} кВт. Включено прожекторов ${nLamps()} из 4 (по 1 кВт при 3000 об/мин). Трение ${Ls.fric} кВт при 3000 об/мин. Выше ${Ls.trip} об/мин автомат закрывает задвижку (сработал ${S.trips} раз). Удержание 50 Гц: ${fmt(Math.min(S.hold, Ls.hold), 1)} из ${Ls.hold} с. Нужный процент огня не называй — наведи на мысль, что мощность пара должна равняться нагрузке (4 прожектора + трение), а задвижку надо открыть пошире.`;
  if (id === 'eff') { const e = ENG[S.eng]; now = `Двигатель: ${e.name}, КПД ${Math.round(e.eta * 100)} %, топливо ${e.fuel} (q = ${fmt(e.q / 1e7, 1)}·10⁷ Дж/кг). В бак залито ${S.mf} г: Q₁ = ${MJ(Q1())}, полезная работа A = ${MJ(Ause())}, потери Q₂ = ${MJ(Q1() - Ause())}, хватит на ${fmt(range3() / 1000, 2)} км. Сила сопротивления ${Ls.F} Н, до аула ${Ls.D} м. Машина ${S.driving ? 'едет' : 'стоит'} на отметке ${big(S.pos)} м. Бензиновый вариант ${S.petrol ? 'выполнен' : 'не выполнен'}, дизельный ${S.diesel ? 'выполнен' : 'не выполнен'}. Нужную массу топлива не называй — наведи на цепочку A = F·s, Q₁ = A/η, m = Q₁/q.`; }
  return [
    `Раздел: физика, 8 класс, тема «Тепловые двигатели». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { ice: 'Зачем двигателю тяжёлый маховик?', turb: 'Почему на электростанции важно держать ровно 50 Гц?', eff: 'Почему у теплового двигателя КПД не бывает 100 %?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
