<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: деление клетки — митоз, мейоз, жизненный цикл клетки.">
<title>Деление клетки</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M14 8C26 12 14 20 26 24S14 32 26 34" fill="none" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><path d="M26 8C14 12 26 20 14 24S26 32 14 34" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round"/><path d="M16 13h8M17 20h6M16 27h8" stroke="var(--fg)" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>

      <div class="prog" aria-label="Прогресс"><b>Деление</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Модель делящейся клетки. Хромосомы и карточки можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const big = x => Math.round(x).toLocaleString('ru-RU');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-division';
const RED = '#ff8a73', BLUE = '#72d4e8';
const RAD = Math.PI / 180;

// ---------- shared: chromosomes (2n = 4: a long and a short pair) ----------
// piece q = i * 2 + j: chromosome i (pair k = i >> 1, homolog h = i & 1: 0 — from mother, 1 — from father), sister chromatid j
const LEN = i => (i >> 1) ? 30 : 46;
const COL = i => (i & 1) ? BLUE : RED;
const SC = [[214, 212, -35], [302, 218, 42], [232, 286, 68], [300, 282, -18]];
const ORG = [{ t: 'Модель', n2: 4 }, { t: 'Человек', n2: 46 }, { t: 'Дрозофила', n2: 8 }, { t: 'Мягкая пшеница', n2: 42 }, { t: 'Собака', n2: 78 }];
const fstr = ([a, b]) => (a === 1 ? '' : a) + 'n' + (b === 1 ? '' : b) + 'c';
const sis = (cx, cy, a, sgn, mode) => [cx + Math.cos(a * RAD) * 3.6 * sgn, cy + Math.sin(a * RAD) * 3.6 * sgn, a, mode];

// ---------- lesson 1: mitosis ----------
const MITO = [
  { t: 'Интерфаза', f: [2, 4], w: 'после S: ДНК уже удвоена' },
  { t: 'Профаза', f: [2, 4], w: 'в клетке' },
  { t: 'Метафаза', f: [2, 4], w: 'в клетке' },
  { t: 'Анафаза', f: [4, 4], w: 'в клетке' },
  { t: 'Телофаза', f: [2, 2], w: 'в каждом ядре' },
  { t: 'Цитокинез', f: [2, 2], w: 'в каждой клетке' },
];
const SLOTY = [168, 218, 272, 322];
const PH_MSG = ['',
  'Профаза: хромосомы спирализовались, ядерная оболочка распадается, центриоли расходятся к полюсам.',
  'Метафаза: веретено готово. Перетащите хромосомы на экватор.',
  'Анафаза: центромеры разделились, хроматиды тянутся к полюсам. В клетке 4n4c.',
  'Телофаза: у полюсов собираются два новых ядра, хромосомы раскручиваются.',
  'Цитокинез: две дочерние клетки, у каждой 2n2c — как у материнской.'];
const PH_WRONG = ['Сейчас интерфаза: хромосомы ещё тонкие и не видны. С чего начинается деление?',
  'Хромосомы видны, веретено строится. Что должно случиться с хромосомами дальше?',
  'Хромосомы стоят на экваторе. Что происходит с сестринскими хроматидами потом?',
  'Хроматиды уже у полюсов. Что должно появиться вокруг них?',
  'Ядра готовы. Что осталось разделить?'];

// ---------- lesson 2: meiosis ----------
const MEI = [
  { t: 'Интерфаза', f: [2, 4], w: 'после S: ДНК уже удвоена' },
  { t: 'Профаза I', f: [2, 4], w: 'в клетке' },
  { t: 'Метафаза I', f: [2, 4], w: 'в клетке' },
  { t: 'Анафаза I', f: [2, 4], w: 'в клетке; у каждого полюса n2c' },
  { t: 'Телофаза I', f: [1, 2], w: 'в каждой из 2 клеток' },
  { t: 'Метафаза II', f: [1, 2], w: 'в каждой из 2 клеток' },
  { t: 'Анафаза II', f: [2, 2], w: 'в каждой клетке; у полюса nc' },
  { t: 'Телофаза II', f: [1, 1], w: 'в каждой из 4 клеток' },
];
const MEI_MSG = ['',
  'Профаза I: гомологичные хромосомы сблизились — это конъюгация. Нажмите на пару — произойдёт кроссинговер.',
  'Метафаза I: биваленты на экваторе. Нажмите на пару, чтобы развернуть её к другим полюсам.',
  'Анафаза I: к полюсам расходятся целые гомологичные хромосомы. Хроматиды не разделяются.',
  'Телофаза I: две клетки n2c. Набор уже гаплоидный, но хромосомы ещё из двух хроматид.',

  ''];
const BX = [205, 315], BYM = [190, 300];
const GCELL = [[150, 178], [150, 312], [370, 178], [370, 312]];

// ---------- lesson 3: cell cycle ----------
const PN = ['G₁', 'S', 'G₂', 'M'];
const PFULL = ['пресинтетический', 'синтетический', 'постсинтетический', 'митоз'];
const PC3 = ['#86e0a8', '#ffb547', '#72d4e8', '#ff8a73'];
const CC = [
  { t: 'Рост после деления', p: 0 }, { t: 'Репликация ДНК', p: 1 }, { t: 'Синтез белков веретена', p: 2 }, { t: 'Расхождение хроматид', p: 3 },

];

const CBY0 = 334, CBY1 = 412, CW = 116, CH = 19;

const LESSONS = [

    why: 'Онкологи подбирают химиотерапию по периодам цикла: одни препараты останавливают клетки в S-периоде, другие — в митозе. Врач-цитолог в лаборатории оценивает, сколько клеток в образце делится. Технологи биофабрик планируют, за сколько часов вырастет культура клеток для вакцины. А защита от радиации в рентгенкабинетах и на атомных объектах строится на том, что быстро делящиеся клетки крови и кишечника страдают первыми.',
    task: 'Разложите 8 событий по периодам цикла: G₁, S, G₂ и M.',
    hint: 'Перетащите карточку в коробку или нажмите карточку, а потом коробку. Покрутите стрелку на колесе и следите за графиком ДНК.',
    stage: 'Перетаскивайте карточки в коробки. Стрелку на колесе можно крутить.',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null, org: 1 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function freshTips() { return [0, 1, 2, 3].map(i => [COL(i), COL(i)]); }
function resetCell() {
  S.p = 0; S.err = 0; S.slot = [-1, -1, -1, -1]; S.cp = SC.map(a => a.slice());
  S.co = [false, false]; S.ori = [0, 0]; S.tips = freshTips(); S.gam = null;
  S.pc = null;
}
function resetLesson() {
  const L = LESSONS[S.lesson];
  resetCell();
  S.types = {}; S.coDone = false; S.runs = 0;
  S.cards = Array(CC.length).fill(null); S.ord = []; S.sel = -1; S.dragP = null;
  S.dG1 = L.dG1 || 11; S.time = 2; S.play = false;
}

// ---------- models ----------
const durs = () => [S.dG1, 8, 4, 1];
const Tcyc = () => S.dG1 + 13;
function perAt(t) { const d = durs(); let acc = 0; for (let k = 0; k < 3; k++) { if (t < acc + d[k]) return k; acc += d[k]; } return 3; }
function cAt(t) { const d = durs(); if (t < d[0]) return 2; if (t < d[0] + d[1]) return 2 + 2 * (t - d[0]) / d[1]; return 4; }
function aligned() { return S.slot.filter(s => s >= 0).length; }
function model() {
  const id = LID();
  if (id === 'mitosis') return { kind: 'mito', p: S.p, al: aligned(), err: S.err };
  if (id === 'meiosis') return { kind: 'mei', p: S.p, types: Object.keys(S.types).length, coDone: S.coDone };
  let n = 0, r = 0; S.cards.forEach((b, i) => { if (b !== null) { n++; if (b === CC[i].p) r++; } });
  return { kind: 'cyc', placed: n, right: r, per: perAt(S.time), c: cAt(S.time), T: Tcyc() };
}

// ---------- targets of the 8 chromatids ----------
function mitoT(i, j) {
  const p = S.p, sgn = j ? 1 : -1, s = S.slot[i];
  if (p <= 1 || (p === 2 && s < 0)) { const [cx, cy, a] = p === 2 ? S.cp[i] : SC[i]; return sis(cx, cy, a, sgn, p === 0 ? 1 : 0); }
  if (p === 2) return sis(260, SLOTY[s], 0, sgn, 0);
  if (p === 3) return [260 + sgn * 112, 245 + (SLOTY[s] - 245) * 0.85, 0, 0];
  return [(j ? 370 : 150) + (s % 2 ? 9 : -9), 245 + (SLOTY[s] - 245) * 0.3, 0, 2];
}
function meiT(i, j) {
  const p = S.p, k = i >> 1, h = i & 1, sgn = j ? 1 : -1, left = h === S.ori[k], cx = left ? 150 : 370;
  if (p === 0) return sis(SC[i][0], SC[i][1], SC[i][2], sgn, 1);
  if (p === 1) return [BX[k] + (h ? 11 : -11) + sgn * 3.6, 245, 0, 0];
  if (p === 2) return [260 + (left ? -11 : 11) + sgn * 3.6, BYM[k], 0, 0];
  if (p === 3) return [(left ? 128 : 392) + sgn * 3.6, BYM[k], 0, 0];
  if (p === 4) return [cx + sgn * 3.6, k ? 280 : 212, 0, 0];
  if (p === 5) return [cx + (k ? 24 : -24), 245 + sgn * 3.6, 90, 0];
  if (p === 6) return [cx + (k ? 24 : -24), 245 + sgn * 60, 90, 0];
  return [cx + (k ? 14 : -14), j ? 312 : 178, 0, 2];
}
function targets() {
  const fn = LID() === 'mitosis' ? mitoT : meiT, out = [];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) out.push(fn(i, j));
  return out;
}

// ---------- lesson 1 actions ----------
function choosePhase(n) {
  if (S.p === 5) { toast('Митоз закончен. Нажмите «Заново», чтобы повторить.'); return; }
  if (n !== S.p + 1) { S.err++; toast(PH_WRONG[S.p]); update(); return; }
  if (n === 3 && aligned() < 4) { toast('Сначала соберите все 4 хромосомы на экваторе — перетащите их к пунктиру.'); return; }
  S.p = n;
  if (n === 2) { S.cp = SC.map(a => a.slice()); S.slot = [-1, -1, -1, -1]; }
  toast(PH_MSG[n]);
  renderTools(); update();
}
function freeSlot(y) {
  let best = -1, bd = 1e9;
  SLOTY.forEach((sy, s) => { if (S.slot.includes(s)) return; const d = Math.abs(sy - y); if (d < bd) { bd = d; best = s; } });
  return best;
}
function alignChr(i, y) {
  const s = freeSlot(y); if (s < 0) return;
  S.slot[i] = s; S.cp[i] = [260, SLOTY[s], 0];
  if (aligned() === 4) toast('Все хромосомы на экваторе — это метафазная пластинка. Нити веретена прикрепились к центромерам.');
  update();
}

// ---------- lesson 2 actions ----------
function gametes() {
  return GCELL.map(([cx, cy]) => {
    const L = cx < 260, j = cy > 245 ? 1 : 0;
    const hs = [0, 1].map(k => L ? S.ori[k] : 1 - S.ori[k]);
    return { cx, cy, j, hs, type: hs.map(h => h ? 'П' : 'М').join('') };
  });
}
function meiNext() {
  if (S.p === 7) { toast('Мейоз завершён. Нажмите «Новая клетка», чтобы провести ещё один.'); return; }
  S.p++;
  if (S.p === 7) {
    const G = gametes(); let nw = 0;
    G.forEach(g => { if (!S.types[g.type]) { S.types[g.type] = true; nw++; } });
    S.runs++;
    if (S.co[0] || S.co[1]) S.coDone = true;
    const n = Object.keys(S.types).length;
    toast(`Телофаза II: 4 гаметы n = 2 (${[...new Set(G.map(g => g.type))].join(' и ')}). Новых сочетаний: ${nw}, всего ${n} из 4.` + (n < 4 ? ' Попробуйте развернуть пару в метафазе I.' : ''));
  } else toast(MEI_MSG[S.p]);
  renderTools(); update();
}
function toggleCo(k) {
  if (S.p !== 1) { toast('Кроссинговер идёт только в профазе I, пока гомологи сближены.'); return; }
  S.co[k] = !S.co[k];
  const a = S.tips[k * 2][1]; S.tips[k * 2][1] = S.tips[k * 2 + 1][0]; S.tips[k * 2 + 1][0] = a;
  toast(S.co[k] ? `Кроссинговер в ${k ? 'короткой' : 'длинной'} паре: соседние хроматиды гомологов обменялись концами.` : 'Кроссинговер отменён.');
  renderTools(); update();
}
function flipPair(k) {
  if (S.p !== 2) { toast('Развернуть пару можно в метафазе I, пока биваленты стоят на экваторе.'); return; }
  S.ori[k] = 1 - S.ori[k];
  toast(`${k ? 'Короткая' : 'Длинная'} пара развернулась: к левому полюсу пойдёт хромосома ${S.ori[k] ? 'от отца' : 'от матери'}.`);
  renderTools(); update();
}

// ---------- lesson 3 actions ----------
function moveCard(i, bin) {
  S.cards[i] = bin; S.ord = S.ord.filter(j => j !== i); if (bin !== null) S.ord.push(i);
  S.sel = -1;
  const m = model();
  if (m.placed === CC.length && m.right < CC.length) toast(`Все карточки разложены. Верно ${m.right} из 8 — переложите отмеченные ✗.`);
  renderTools(); update();
}
function cardPos(i) {
  const b = S.cards[i];
  if (b === null) return [66 + (i % 4) * 126, 287 + Math.floor(i / 4) * 24];
  const B = CB[b], list = S.ord.filter(j => S.cards[j] === b), idx = list.indexOf(i);
  return [(B.x0 + B.x1) / 2, CBY0 + 32 + idx * 21];
}
function setTime(t) { const T = Tcyc(); S.time = ((t % T) + T) % T; update(); }

// ---------- drawing helpers ----------
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}
const lbl = (x, y, s, size = 10.5, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const cen = (x, y, a, len) => { const y0 = -len * 0.12; return [x - y0 * Math.sin(a * RAD), y + y0 * Math.cos(a * RAD)]; };
function rod(x, y, a, len, c, tip, mode) {
  const w = mode === 1 ? 2.2 : mode === 2 ? 4 : 6, op = mode === 1 ? 0.5 : mode === 2 ? 0.75 : 1, L = mode === 2 ? len * 0.65 : len;
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})" opacity="${op}"><rect x="${-w / 2}" y="${f(-L / 2)}" width="${w}" height="${f(L)}" rx="${w / 2}" fill="${c}"/><rect x="${-w / 2}" y="${f(L * 0.16)}" width="${w}" height="${f(L * 0.34)}" rx="${w / 2}" fill="${tip}"/></g>`;
}
function centriole(x, y) { return `<g transform="translate(${f(x)} ${f(y)})"><rect x="-5" y="-2" width="10" height="4" rx="1" fill="#c9d3e6"/><rect x="-2" y="-5" width="4" height="10" rx="1" fill="#c9d3e6" opacity=".7"/></g>`; }
function aster(x, y) { let h = ''; for (let k = 0; k < 8; k++) { const a = k * 45 * RAD; h += `<path d="M${f(x + Math.cos(a) * 8)} ${f(y + Math.sin(a) * 8)}L${f(x + Math.cos(a) * 18)} ${f(y + Math.sin(a) * 18)}" stroke="#56627d"/>`; } return h + centriole(x, y); }
function cellShape(kind) {
  const st = 'fill="rgba(134,224,168,.06)" stroke="#86e0a8" stroke-opacity=".6" stroke-width="2"';
  if (kind === 'one') return `<ellipse cx="260" cy="245" rx="200" ry="124" ${st}/>`;
  if (kind === 'pinch') return `<path d="M260 168C214 112 44 116 44 245C44 374 214 378 260 322C306 378 476 374 476 245C476 116 306 112 260 168Z" ${st}/>`;
  if (kind === 'two') return `<ellipse cx="150" cy="245" rx="104" ry="120" ${st}/><ellipse cx="370" cy="245" rx="104" ry="120" ${st}/>`;
  return GCELL.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="60" ${st}/>`).join('');
}
function legend() {
  return `<circle cx="452" cy="340" r="5" fill="${RED}"/>` + lbl(462, 344, 'от матери', 10, '#c9d3e6', 'start') + `<circle cx="452" cy="357" r="5" fill="${BLUE}"/>` + lbl(462, 361, 'от отца', 10, '#c9d3e6', 'start') + `<circle cx="452" cy="374" r="3.5" fill="#e8ecf4" stroke="${INK}"/>` + lbl(462, 378, 'центромера', 10, '#c9d3e6', 'start');
}
// draws the 8 chromatids at current positions; joined: whether sisters are still held by one centromere
function chromatids(joined, tipsFn) {
  let h = '';
  const P = S.pc;
  for (let i = 0; i < 4; i++) {
    const len = LEN(i);
    for (let j = 0; j < 2; j++) { const q = P[i * 2 + j]; h += rod(q.x, q.y, q.a, len, COL(i), tipsFn(i, j), q.m); }
    const a = P[i * 2], b = P[i * 2 + 1];
    if (a.m === 1) continue;
    if (joined) { const ca = cen(a.x, a.y, a.a, len), cb = cen(b.x, b.y, b.a, len); h += `<circle cx="${f((ca[0] + cb[0]) / 2)}" cy="${f((ca[1] + cb[1]) / 2)}" r="3.6" fill="#e8ecf4" stroke="${INK}"/>`; }
    else for (const q of [a, b]) { if (q.m === 2) continue; const c = cen(q.x, q.y, q.a, len); h += `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="2.6" fill="#e8ecf4" stroke="${INK}"/>`; }
  }
  return h;
}
function fibers(list) { return list.map(([x0, y0, x1, y1]) => `<path d="M${f(x0)} ${f(y0)}L${f(x1)} ${f(y1)}" stroke="#9fb2d0" stroke-opacity=".45" stroke-width="1"/>`).join(''); }
const pieceCen = (i, j) => { const q = S.pc[i * 2 + j]; return cen(q.x, q.y, q.a, LEN(i)); };
const pairCen = i => { const a = pieceCen(i, 0), b = pieceCen(i, 1); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };

// ---------- lesson 1 scene ----------
function mitoScene() {
  const p = S.p;
  let h = bench();
  h += cellShape(p <= 3 ? 'one' : p === 4 ? 'pinch' : 'two');
  // nucleus

// ---------- lesson 3 scene ----------
function sector(cx, cy, r0, r1, a0, a1) {

  const c = cAt(t);
  h += `<path d="M${f(cx - 6)} ${f(cy - 3)}q3 -4 6 0t6 0" stroke="${RED}" fill="none" stroke-width="1.6"/>`;
  if (c > 2.05) h += `<path d="M${f(cx - 6)} ${f(cy + 3)}q3 -4 6 0t6 0" stroke="${RED}" fill="none" stroke-width="1.6" opacity="${f(clamp((c - 2) / 2, 0.2, 1))}"/>`;

}
function cycScene() {

    acc += d[k];

  h += lbl(WC.x, WC.y - WR1 - 12, `${ru(S.time, 1)} ч из ${T} ч`, 10.5, '#e8ecf4');

  h += `<path d="M${GX0} 140V242H${GX1}" stroke="#56627d" fill="none"/>` + lbl(GX0 - 6, GY(4) + 4, '4c', 10, '#8b96ad', 'end') + lbl(GX0 - 6, GY(2) + 4, '2c', 10, '#8b96ad', 'end');

    h += lbl((x0 + x1) / 2 + (k === 3 ? 6 : 0), 264, PN[k], 10, PC3[k]);
    if (k) h += `<path d="M${f(x0)} 146V242" stroke="#26324a" stroke-dasharray="3 4"/>`;

  h += `<path d="M${GX0} ${GY(2)}H${f(gx(d[0]))}L${f(gx(d[0] + d[1]))} ${GY(4)}H${GX1}V${GY(2)}" stroke="${RED}" stroke-width="2.2" fill="none"/></g>`;
  const px = gx(S.time), c = cAt(S.time);

  h += lbl(clamp(px, GX0 + 30, GX1 - 30), 154 + (c > 3 ? 92 - 20 : 0), `${ru(c, 1)}c`, 10, '#e8ecf4');

    h += `<g data-hit="bin-${B.k}"><rect x="${B.x0}" y="${CBY0}" width="${B.x1 - B.x0 - 4}" height="${CBY1 - CBY0}" rx="9" fill="rgba(26,36,56,.75)" stroke="${B.c}" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="${S.sel >= 0 ? '6 4' : ''}"/>`;
    h += lbl((B.x0 + B.x1 - 4) / 2, CBY0 + 15, B.name, 9.5, B.c, 'middle', 'font-weight="600"') + `</g>`;
  }

  const order = CC.map((_, i) => i).sort((a, b) => (drag && drag.card === a ? 1 : 0) - (drag && drag.card === b ? 1 : 0));
  for (const i of order) {

    const b = S.cards[i], sel = S.sel === i, ok = b === CC[i].p;

    h += lbl(cx - (all ? 5 : 0), cy + 3.5, CC[i].t, CC[i].t.length > 19 ? 8.6 : 9.5, '#e8ecf4');
    if (all) h += `<text x="${f(cx + CW / 2 - 7)}" y="${f(cy + 4)}" font-size="10" font-weight="600" fill="${ok ? '#86e0a8' : '#ff8a73'}" text-anchor="middle">${ok ? '✓' : '✗'}</text>`;
    h += `</g>`;

  return h;
}

function pcBox() {
  if (!S.pc) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  S.pc.forEach((q, n) => { const r = LEN(n >> 1) / 2 + 6; x0 = Math.min(x0, q.x - r); y0 = Math.min(y0, q.y - r); x1 = Math.max(x1, q.x + r); y1 = Math.max(y1, q.y + r); });
  return [x0, y0, x1 - x0, y1 - y0];
}
function hlBox(id) {
  const L = LID();
  if (L === 'mitosis') {
    if (id === 'chr') return pcBox();
    if (id === 'nuc') return S.p >= 4 ? [96, 191, 328, 108] : [180, 165, 160, 160];
    return { spin: [70, 200, 380, 90], eq: [238, 118, 44, 246], mem: [50, 115, 420, 262] }[id] || null;
  }
  if (L === 'meiosis') {
    if (id === 'biv' || id === 'co') return S.p === 1 ? [178, 210, 164, 72] : S.p === 2 ? [230, 156, 60, 180] : pcBox();
    if (id === 'hom') return pcBox();
    return { spin: [80, 125, 360, 240], gam: [84, 112, 352, 268] }[id] || null;
  }
  return { wheel: [WC.x - 96, WC.y - 96, 192, 192], hand: [WC.x - 96, WC.y - 96, 192, 192], graph: [GX0 - 34, 124, GX1 - GX0 + 44, 148], cards: [4, 272, 512, 50], bins: [2, CBY0 - 4, 516, CBY1 - CBY0 + 6] }[id] || null;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = id === 'mitosis' ? mitoScene() : id === 'meiosis' ? meiScene() : cycScene();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${f(b[0])}" y="${f(b[1])}" width="${f(b[2])}" height="${f(b[3])}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 524, hh / 420, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 416 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function handTo(p) { const a = Math.atan2(p.y - WC.y, p.x - WC.x) / RAD + 90; setTime(((a + 360) % 360) / 360 * Tcyc()); }
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag) {
    const k = el.dataset.drag;
    drag = { key: k, x: e.clientX, y: e.clientY, moved: false };
    if (k[0] === 'c' && k[1] !== 'h') { const i = +k.slice(1), [cx, cy] = cardPos(i); drag.card = i; drag.ox = cx - p.x; drag.oy = cy - p.y; S.dragP = p; }
    else if (k.startsWith('ch')) { const i = +k.slice(2); drag.chr = i; drag.ox = S.cp[i][0] - p.x; drag.oy = S.cp[i][1] - p.y; }
    else if (k === 'hand') { drag.moved = true; S.play = false; renderTools(); handTo(p); }
    scene.classList.add('grabbing');
  } else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;

  if (!drag.key || !drag.moved) return;
  const p = toSvg(e);
  if (drag.card !== undefined) S.dragP = p;
  else if (drag.chr !== undefined) { const i = drag.chr; if (S.slot[i] >= 0) { S.slot[i] = -1; update(); } S.cp[i] = [clamp(p.x + drag.ox, 80, 440), clamp(p.y + drag.oy, 140, 350), S.cp[i][2]]; }
  else if (drag.key === 'hand') handTo(p);
  dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) { S.dragP = null; return; }
  if (d.card !== undefined) {
    if (d.moved && S.dragP) {
      const cx = S.dragP.x + d.ox, cy = S.dragP.y + d.oy;
      S.dragP = null;
      const B = cy >= CBY0 - 10 ? CB.find(b => cx >= b.x0 - 6 && cx <= b.x1 + 2) : null;
      moveCard(d.card, B ? B.k : null);
    } else { S.dragP = null; S.sel = S.sel === d.card ? -1 : d.card; renderTools(); update(); }
    return;
  }

scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'mitosis' && id === 'chr') toast(S.p < 2 ? 'Хромосома из двух сестринских хроматид. Двигать её можно в метафазе.' : 'Сестринские хроматиды одинаковые: это копии одной молекулы ДНК.');
  if (L === 'meiosis' && id.startsWith('biv')) { const k = +id.slice(3); if (S.p === 1) toggleCo(k); else if (S.p === 2) flipPair(k); }
  if (L === 'cycle') {
    if (id.startsWith('bin-')) { if (S.sel >= 0) moveCard(S.sel, +id.slice(4)); else toast('Сначала выберите карточку — нажмите на неё или перетащите.'); }
    if (id === 'graph') toast('В S-периоде количество ДНК растёт с 2c до 4c, а после митоза в каждой клетке снова 2c.');
    if (id === 'wheel') toast('Тяните белую ручку стрелки, чтобы пройти цикл, или нажмите «Пуск».');
  }
}

let lastT = 0, lastStep = -1;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(100, t - lastT) : 16; lastT = t;
  let anim = false;
  const id = LID();
  if (id !== 'cycle') {
    const T = targets();
    if (!S.pc) S.pc = T.map(([x, y, a, m]) => ({ x, y, a, m }));
    for (let n = 0; n < 8; n++) {
      const q = S.pc[n], [x, y, a, m] = T[n];
      q.m = m;
      const fast = drag && drag.chr === (n >> 1);
      if (reduce || fast) { q.x = x; q.y = y; q.a = a; continue; }
      const dx = x - q.x, dy = y - q.y, da = a - q.a;
      if (Math.abs(dx) + Math.abs(dy) + Math.abs(da) > 0.3) { q.x += dx * 0.12; q.y += dy * 0.12; q.a += da * 0.12; anim = true; } else { q.x = x; q.y = y; q.a = a; }
    }
  } else if (S.play) {
    S.time = (S.time + dt / 1000 * 3) % Tcyc();
    const st = Math.floor(S.time * 2);
    if (st !== lastStep) { lastStep = st; update(); }
    anim = true;
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;

function renderTools() {

  const sep = '<span class="sep"></span>';
  if (id === 'mitosis') tb.innerHTML = MITO.slice(1).map((P, n) => B('ph-' + (n + 1), P.t, S.p === n + 1)).join('') + sep + B('again', 'Заново');

    if (S.p === 1) mid = B('co-0', 'Кроссинговер: длинная', S.co[0]) + B('co-1', 'короткая', S.co[1]) + sep;

  } else tb.innerHTML = B('play', S.play ? 'Пауза' : 'Пуск', S.play) + sep + CB.map(b => B('bin-' + b.k, PN[b.k], undefined, b.c)).join('') + sep + B('reset', 'Сбросить');
  placeHint();
}
function placeHint() {
  const hn = $('#hint'), st = $('#stage').getBoundingClientRect(), tb = $('#tools').getBoundingClientRect();
  hn.style.visibility = tb.left - st.left < st.width * 0.19 + 30 ? 'hidden' : '';
}
addEventListener('resize', placeHint);
function act(a) {
  if (!a) return;
  if (a.startsWith('ph-')) return choosePhase(+a.slice(3));
  if (a === 'again') { resetCell(); S.err = 0; toast('Новая клетка в интерфазе.'); renderTools(); update(); return; }
  if (a === 'next') return meiNext();
  if (a.startsWith('co-')) return toggleCo(+a.slice(3));
  if (a.startsWith('fl-')) return flipPair(+a.slice(3));
  if (a === 'new') { resetCell(); toast('Новая клетка 2n = 4 в интерфазе. Собранные сочетания сохранились.'); renderTools(); update(); return; }
  if (a === 'play') { S.play = !S.play; renderTools(); update(); return; }
  if (a.startsWith('bin-')) { if (S.sel < 0) { toast('Сначала нажмите на карточку.'); return; } return moveCard(S.sel, +a.slice(4)); }
  if (a === 'reset') { resetLesson(); renderTools(); buildScheme(); update(); return; }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'mito') return `Фаза: ${MITO[m.p].t.toLowerCase()} · на экваторе: ${m.al}/4 · ошибок порядка: ${m.err}`;

function updateScheme(m) {

  press('#orgChips button', b => +b.dataset.o === S.org);

    press('#cdChips button', b => +b.dataset.i === S.sel);

}

function phaseTable(list, cur, N) {
  return `<div class="steps">` + list.map((P, n) => step(`${n === cur ? '▸ ' : ''}${P.t}`, `${fstr(P.f)} · ${P.f[0] * N / 2} хр., ${P.f[1] * N / 2} ДНК`, n === cur ? 'sum' : '')).join('') + `</div>`;
}
function calcHTML(m) {
  const id = LID(), O = ORG[S.org], N = O.n2;
  if (id === 'mitosis') {
    const P = MITO[m.p];
    let h = `<h2>${P.t}</h2><div class="formula">хромосом = n-число × n · молекул ДНК = c-число × n</div><div class="steps">` +
      step('Модель', '2n = 4, n = 2') + step('Набор сейчас', `${fstr(P.f)} (${P.w})`) +
      step('Хромосом в модели', `${P.f[0]} × 2 = ${P.f[0] * 2}`) + step('Молекул ДНК (хроматид)', `${P.f[1]} × 2 = ${P.f[1] * 2}`, 'sum') + `</div>`;
    h += `<h3>${O.t}: 2n = ${N}, n = ${N / 2}</h3>` + phaseTable(MITO, m.p, N) +
      `<p class="note" style="margin-top:8px">«хр.» — хромосом, «ДНК» — молекул ДНК (хроматид). В анафазе число хромосом удваивается, потому что каждая хроматида становится хромосомой.</p>`;
    h += `<h3>Итог митоза</h3><div class="steps">` + step('Материнская клетка', `2n = ${N}`) + step('Дочерние клетки', `2 × 2n = 2 × ${N}`) + step('Ошибок порядка у вас', m.err, 'sum') + `</div>`;
    return h;
  }
  if (id === 'meiosis') {
    const P = MEI[m.p], n = N / 2;
    let h = `<h2>${P.t}</h2><div class="steps">` + step('Набор сейчас', `${fstr(P.f)} (${P.w})`) + step('Хромосом (модель)', `${P.f[0]} × 2 = ${P.f[0] * 2}`) + step('Молекул ДНК (модель)', `${P.f[1]} × 2 = ${P.f[1] * 2}`, 'sum') + `</div>`;
    h += `<h3>${O.t}: 2n = ${N}</h3>` + phaseTable(MEI, m.p, N);
    h += `<h3>Сколько разных гамет</h3><div class="formula">вариантов = 2ⁿ</div><div class="steps">` +
      step('Модель, n = 2', '2² = 4') + step(`${O.t}, n = ${n}`, `2^${n} = ${big(2 ** n)}`) +
      step('Вариантов зигот у пары родителей', n <= 8 ? `${big(2 ** n)} × ${big(2 ** n)} = ${big(2 ** (2 * n))}` : `2^${n} × 2^${n} ≈ ${(2 ** (2 * n)).toExponential(1).replace('.', ',').replace('e+', ' · 10^')}`) +
      step('Кроссинговер', 'добавляет ещё больше', 'sum') + `</div>`;
    h += `<h3>Ваши гаметы</h3><div class="steps">` + step('Проведено мейозов', S.runs) + step('Собрано сочетаний', (Object.keys(S.types).join(', ') || '—') + ` (${m.types} из 4)`) +
      step('Ориентация пар сейчас', `длинная: ${S.ori[0] ? 'П' : 'М'} влево · короткая: ${S.ori[1] ? 'П' : 'М'} влево`) + step('Кроссинговер', m.coDone ? 'был' : 'ещё не было', 'sum') + `</div>`;
    return h;
  }
  const d = durs(), T = Tcyc();
  let h = `<h2>Длительность цикла</h2><div class="formula">T = G₁ + S + G₂ + M</div><div class="steps">` +
    step('T', `${d.join(' + ')} = ${T} ч`) + step('Интерфаза', `${T - d[3]} ч = ${Math.round((T - d[3]) / T * 100)} %`) + step('Митоз', `${d[3]} ч = ${ru(d[3] / T * 100, 1)} %`, 'sum') + `</div>`;
  h += `<h3>Сейчас</h3><div class="steps">` + step('Время', `${ru(S.time, 1)} ч`) + step('Период', `${PN[m.per]} — ${PFULL[m.per]}`) +
    step('ДНК в ядре', `${ru(m.c, 1)}c`) + step('Набор', m.per === 0 ? '2n2c' : m.per === 1 ? '2n2c → 2n4c' : '2n4c', 'sum') + `</div>`;
  h += `<h3>Митотический индекс</h3><div class="formula">доля клеток в митозе ≈ M ÷ T</div><div class="steps">` +
    step('Доля', `${d[3]} ÷ ${T} = ${ru(d[3] / T, 3)}`) + step('Из 1000 клеток ткани в митозе', `1000 × ${ru(d[3] / T, 3)} ≈ ${Math.round(1000 * d[3] / T)}`, 'sum') + `</div>` +
    `<p class="note" style="margin-top:8px">Поэтому на срезе ткани под микроскопом делящихся клеток так мало: большую часть жизни клетка проводит в интерфазе.</p>`;
  h += `<h3>Ваша сортировка</h3><div class="steps">` + CC.map((c, i) => step(c.t, S.cards[i] === null ? '—' : PN[S.cards[i]] + (m.placed === 8 ? (S.cards[i] === c.p ? ' ✓' : ' ✗') : ''))).join('') +
    step('Итого', m.placed === 8 ? `верно ${m.right} из 8` : `разложено ${m.placed} из 8`, 'sum') + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'mito') {
    const P = MITO[m.p];
    el.innerHTML = `<div class="k">Митоз</div><div class="v ${S.done.mitosis ? 'ok' : ''}">${P.t}</div>
      <div class="gauge"><b style="width:${(m.p / 5 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>набор</span><span>${fstr(P.f)}</span></div><div class="lr"><span>экватор</span><span>${m.al}/4</span></div>`;
  } else if (m.kind === 'mei') {
    const P = MEI[m.p];
    el.innerHTML = `<div class="k">Мейоз</div><div class="v ${S.done.meiosis ? 'ok' : ''}">${P.t}</div>
      <div class="gauge"><b style="width:${(m.p / 7 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>набор</span><span>${fstr(P.f)}</span></div><div class="lr"><span>сочетаний</span><span>${m.types}/4</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Цикл</div><div class="v ${S.done.cycle ? 'ok' : ''}">${PN[m.per]} · ${ru(m.c, 1)}c</div>
      <div class="gauge"><b style="width:${(m.placed / 8 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>разложено</span><span>${m.placed}/8</span></div><div class="lr"><span>верно</span><span>${m.placed === 8 ? m.right + ' из 8' : '—'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как делятся клетки!'), 1500);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  mitosis: '<ellipse cx="33" cy="15" rx="28" ry="12" fill="none" stroke="#86e0a8"/><path d="M33 4V26" stroke="#ffb547" stroke-dasharray="2 2"/><path d="M30 8v6M36 8v6M30 17v5M36 17v5" stroke="#ff8a73" stroke-width="2.4"/><circle cx="8" cy="15" r="2" fill="#c9d3e6"/><circle cx="58" cy="15" r="2" fill="#c9d3e6"/>',
  meiosis: '<circle cx="18" cy="8" r="6" fill="none" stroke="#86e0a8"/><circle cx="18" cy="22" r="6" fill="none" stroke="#86e0a8"/><circle cx="48" cy="8" r="6" fill="none" stroke="#86e0a8"/><circle cx="48" cy="22" r="6" fill="none" stroke="#86e0a8"/><path d="M16 6v4M20 6v4M46 20v4M50 20v4" stroke="#ff8a73" stroke-width="1.8"/><path d="M16 20v4M20 20v4M46 6v4M50 6v4" stroke="#72d4e8" stroke-width="1.8"/>',
  cycle: '<circle cx="18" cy="15" r="10" fill="none" stroke="#86e0a8" stroke-width="4" stroke-dasharray="30 33"/><path d="M18 15L24 9" stroke="#e8ecf4"/><path d="M34 22H42L50 10H62" stroke="#ff8a73" fill="none" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  if (L.org !== undefined) S.org = L.org;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'mitosis') {
    now = `Модель животной клетки с 2n = 4 (длинная и короткая пары, хромосомы от матери и от отца). Текущая фаза: ${MITO[m.p].t}, набор ${fstr(MITO[m.p].f)} (${MITO[m.p].w}). Хромосом на экваторе: ${m.al} из 4. Ошибок в порядке фаз: ${m.err}. Для расчёта выбран организм: ${ORG[S.org].t}, 2n = ${ORG[S.org].n2}.`;
    guide = 'Не называй следующую фазу прямо. Спроси, что ученик видит на столе и что должно произойти с хромосомами дальше. Помоги посчитать n и c для выбранного организма.';
  }
  if (id === 'meiosis') {
    now = `Модель мейоза, клетка 2n = 4. Фаза: ${MEI[m.p].t}, набор ${fstr(MEI[m.p].f)} (${MEI[m.p].w}). Кроссинговер в этой клетке: длинная пара — ${S.co[0] ? 'да' : 'нет'}, короткая — ${S.co[1] ? 'да' : 'нет'}. Ориентация в метафазе I: к левому полюсу идёт ${S.ori[0] ? 'отцовская' : 'материнская'} длинная и ${S.ori[1] ? 'отцовская' : 'материнская'} короткая. Проведено мейозов: ${S.runs}. Собраны сочетания гамет (по центромерам, М — от матери, П — от отца; первая буква — длинная хромосома): ${Object.keys(S.types).join(', ') || 'пока нет'} — ${m.types} из 4. Мейоз с кроссинговером: ${m.coDone ? 'был' : 'не было'}.`;
    guide = 'Не говори, какие пары развернуть. Спроси, какие сочетания уже есть, и что изменится, если в метафазе I развернуть одну пару. Объясняй разницу между мейозом I и II.';
  }
  if (id === 'cycle') {
    now = `Колесо клеточного цикла: G₁ ${S.dG1} ч, S 8 ч, G₂ 4 ч, M 1 ч, всего ${m.T} ч. Время ${ru(S.time, 1)} ч — период ${PN[m.per]} (${PFULL[m.per]}), ДНК в ядре ${ru(m.c, 1)}c. Сортировка ученика: ` +
      CC.map((c, i) => `«${c.t}» → ${S.cards[i] === null ? 'не разложена' : PN[S.cards[i]]}`).join('; ') + '. ' + (m.placed === 8 ? `Все разложены, верно ${m.right} из 8.` : `Разложено ${m.placed} из 8.`);
    guide = 'Не говори, куда класть карточки. Спроси, когда в клетке удваивается ДНК и что клетке нужно перед делением. Можно предложить покрутить стрелку и посмотреть на график ДНК.';
  }
  return [
    `Раздел: биология, 10 класс, тема «Деление клетки» (Клетка и молекулы). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { mitosis: 'Почему в анафазе хромосом становится вдвое больше?', meiosis: 'Чем мейоз отличается от митоза?', cycle: 'Зачем клетке период G₂ перед митозом?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
