<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: электрический ток, сила тока, напряжение, сопротивление и закон Ома.">
<title>Электрический ток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools button:disabled{opacity:.4;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.answer input{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--fg);font:500 15px var(--font-mono)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1560px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31C12 31 13 20 19 20S26 11 31 9" fill="none" stroke="var(--force)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 31L29 11" stroke="var(--arm)" stroke-width="2.2" stroke-linecap="round"/><path d="M33 8l-7 1.5 4.5 4.5z" fill="var(--arm)"/><circle cx="7" cy="31" r="3" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Ток</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с электрической цепью. Ключ можно нажимать, ползунок реостата, щупы вольтметра и зажим на проволоке — перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'amp', title: 'Сила тока',
    text: ['Электрический ток — это упорядоченное, направленное движение заряженных частиц. В металлах это свободные электроны. Пока ключ разомкнут, они мечутся хаотично. Замкнули цепь — и все они дружно дрейфуют вдоль провода.',
           'Сила тока I показывает, какой заряд q проходит через поперечное сечение проводника за единицу времени: I = q / t. Единица — ампер (А). Ток 1 А — это заряд 1 Кл каждую секунду.',
           'Силу тока измеряют амперметром. Его включают в цепь последовательно, «в разрыв» провода: тогда через прибор идёт тот же ток, что и через лампу. За направление тока договорились считать путь от «+» к «−» источника, хотя электроны движутся наоборот.'],
    why: 'Электромонтёры измеряют ток клещами-амперметром, чтобы найти перегруженную линию раньше, чем случится пожар. Автоматы в щитке квартиры рассчитаны на определённый ток: 16 А, 25 А. Автоэлектрики ищут ток утечки, когда аккумулятор машины садится за ночь. А на пауэрбанке пишут ёмкость в мА·ч — это тоже заряд: 10 000 мА·ч = 36 000 Кл.',
    task: 'Включите амперметр последовательно с лампой и замкните ключ. Реостатом подберите ток так, чтобы за 10 секунд через сечение провода прошёл заряд 2 Кл. Проверьте секундомером.',
    hint: 'Амперметр ставят, нажав на пунктирное место. Какой нужен ток, если q = 2 Кл, а t = 10 с? Ползунок реостата тяните пальцем или мышью, точнее — кнопками «R −» и «R +».',
    safe: 'Амперметр нельзя подключать параллельно лампе или прямо к источнику: у него очень маленькое сопротивление, получится короткое замыкание. Опыты делают только с батарейками и низковольтными источниками, к розетке 220 В приборы не подключают.',
    stage: 'Нажмите на ключ, чтобы замкнуть цепь.',
    U: 4.5, RL: 7.5, RA: 0.1, Rmax: 30, Amax: 1, qNeed: 2, tRun: 10, speed: 2, rh0: 30,
    check: m => m.ok },
  { id: 'volt', title: 'Напряжение',
    text: ['Ток идёт, потому что электрическое поле в проводнике толкает заряды и совершает работу. Напряжение U показывает, какую работу A совершает поле, перемещая заряд 1 Кл: U = A / q. Единица — вольт (В): 1 В = 1 Дж / 1 Кл.',
           'Батарейка — источник тока: внутри неё химическая энергия разделяет заряды. Один элемент даёт 1,5 В. Если соединить элементы последовательно, «плюс» к «минусу», их напряжения складываются.',
           'Напряжение измеряют вольтметром. Его подключают параллельно: щупами к двум точкам цепи, между которыми хотят узнать напряжение. Красный щуп ставят ближе к «+» источника.'],
    why: 'Электрик сначала проверяет, есть ли напряжение, и только потом берётся за ремонт. Монтажники солнечных электростанций (в Казахстане их строят в Туркестанской, Жамбылской и Карагандинской областях) соединяют панели последовательно, чтобы набрать нужное напряжение. А дома полезно помнить: в розетке 220 В, у зарядки телефона 5 В, у аккумулятора машины 12 В. Перепутаете блоки питания — сожжёте прибор.',
    task: 'Соберите батарею из трёх элементов. Вольтметром измерьте напряжение сначала на батарее, а потом на лампе при замкнутом ключе.',
    hint: 'Перетащите красный и чёрный щупы на выводы (светлые точки) или нажмите «Щупы: батарея» и «Щупы: лампа». Если показание со знаком «−», поменяйте щупы местами. Интересно: что покажет вольтметр на разомкнутом ключе?',

const LS_KEY = 'luch-phys-current';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true;

// ---------- data ----------
const E_CH = 1.6e-19;
const MAT = {
  cu: { name: 'медь', rho: 0.017, col: '#d98a4e', alloy: false },
  al: { name: 'алюминий', rho: 0.028, col: '#c8d0dd', alloy: false },
  fe: { name: 'железо', rho: 0.10, col: '#7d8798', alloy: false },
  nik: { name: 'никелин', rho: 0.42, col: '#c9b98a', alloy: true },
  nich: { name: 'нихром', rho: 1.1, col: '#a3acc4', alloy: true },
};
const MKEYS = Object.keys(MAT);
const SECT = [0.1, 0.2, 0.5, 1];
const RES = { r2: { name: '2 Ом', R: 2, col: '#ff8a73' }, r5: { name: '5 Ом', R: 5, col: '#ffb547' }, r10: { name: '10 Ом', R: 10, col: '#72d4e8' }, x: { name: 'X', R: 0, col: '#c9a0ff' } };
const RKEYS = Object.keys(RES);
const rOf = k => k === 'x' ? L().Rx : RES[k].R;

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const C1 = { x0: 90, x1: 430, y0: 170, y1: 370, sw: [150, 210], am: 320, ly: 270, gate: 200, rh: [190, 310], rod: 340, rodX: 320, par: 490 };
const C3 = { xa: 70, xb: 450, wy: 318, mx: 140, my: 190, lx: 382, ly: 190, lr: 56 };
const C4 = { x0: 60, x1: 250, y0: 170, y1: 370, sw: [125, 185], gx0: 322, gy0: 350, gw: 170, gh: 185 };
const NODES = { bp: [90, 236, 'батарея +'], bm: [90, 304, 'батарея −'], s1: [150, 170, 'ключ, левый вывод'], s2: [210, 170, 'ключ, правый вывод'], l1: [430, 236, 'лампа, верхний вывод'], l2: [430, 304, 'лампа, нижний вывод'] };
const REST = { pr: [236, 342], pb: [284, 342] };

function resetState() {
  const Ls = L();
  Object.assign(S, {
    sw: false, off: 0,
    // lesson 1
    amm: 'none', rh: Ls.rh0 || 30, running: false, tRun: 0, q: 0, ok1: false, runs: [],
    // lesson 2
    n: Ls.n0 || 1, pr: { x: REST.pr[0], y: REST.pr[1], at: null }, pb: { x: REST.pb[0], y: REST.pb[1], at: null }, bat: false, lampM: false, warned: false,
    // lesson 3
    mat: Ls.mat0 || 'cu', S: Ls.S0 || 0.5, l: Ls.l0 || 1, ok3: false,
    // lesson 4
    U: 0, R: Ls.R0 || 'r5', pts: [], rxIn: '', rx: false,
    hl: null,
  });
}

// ---------- physics ----------
// lesson 1: battery 4,5 V, lamp 7,5 Ω (its resistance is taken as constant), slider rheostat 0…30 Ω, ammeter 0,1 Ω
function cur1() {
  const Ls = L();
  if (!S.sw) return { I: 0, IA: 0, IL: 0 };
  if (S.amm === 'par') {
    const Rp = Ls.RL * Ls.RA / (Ls.RL + Ls.RA), I = Ls.U / (S.rh + Rp);
    return { I, IA: I * Ls.RL / (Ls.RL + Ls.RA), IL: I * Ls.RA / (Ls.RL + Ls.RA) };
  }
  const I = Ls.U / (Ls.RL + S.rh + (S.amm === 'ser' ? Ls.RA : 0));
  return { I, IA: S.amm === 'ser' ? I : 0, IL: I };
}
function guard1() {
  const c = cur1();
  if (c.IA > L().Amax) {
    S.sw = false; S.running = false;
    toast(`Ток через амперметр ${fmt(c.IA, 1)} А — стрелка зашкалила! Это короткое замыкание. Ключ разомкнут.`);
  }
}
function stepTimer(dt) {
  const Ls = L();
  let dtm = dt * Ls.speed;
  if (S.tRun + dtm >= Ls.tRun) dtm = Ls.tRun - S.tRun;
  S.q += cur1().I * dtm; S.tRun += dtm;
  if (S.tRun >= Ls.tRun - 1e-9) finishTimer();
}
function finishTimer() {
  const Ls = L();
  S.running = false;
  S.runs.unshift({ q: S.q, amm: S.amm }); S.runs = S.runs.slice(0, 4);
  const good = Math.abs(S.q - Ls.qNeed) <= 0.1;
  if (good && S.amm === 'ser') { S.ok1 = true; toast(`За 10 с прошло ${fmt(S.q, 2)} Кл. Это ${fmt(S.q / E_CH / 1e18, 1)}·10¹⁸ электронов!`); }
  else if (good) toast(`Заряд ${fmt(S.q, 2)} Кл подходит, но амперметр не включён последовательно с лампой.`);
  else if (S.q < 1e-6) toast('Заряд не прошёл: цепь разомкнута.');
  else toast(`Прошло ${fmt(S.q, 2)} Кл — ${S.q < Ls.qNeed ? 'мало' : 'много'}. Нужно 2 Кл.`);
  renderTools(); update();
}
function startTimer() {
  if (S.running) return;
  if (!S.sw) { toast('Сначала замкните ключ.'); return; }
  S.running = true; S.tRun = 0; S.q = 0; renderTools(); update();
}

// lesson 2: n cells of 1,5 V in series, ideal wires and ideal voltmeter
const U2 = () => S.n * L().cell;
function phi(node) {
  const U = U2();
  if (node === 'bp' || node === 's1') return U;
  if (node === 'bm' || node === 'l2') return 0;
  return S.sw ? U : 0; // s2, l1
}
const vRead = () => (S.pr.at && S.pb.at) ? phi(S.pr.at) - phi(S.pb.at) : 0;
const I2 = () => S.sw ? U2() / L().RL : 0;
const pairIs = (a, b) => (S.pr.at === a && S.pb.at === b) || (S.pr.at === b && S.pb.at === a);
function judge2() {
  const v = vRead(), Ls = L();
  if (!S.pr.at || !S.pb.at) return;
  if (v < -1e-9) { toast('Минус на табло: красный щуп стоит на «−». Поменяйте щупы местами.'); return; }
  if (pairIs('bp', 'bm')) {
    if (S.n === Ls.nNeed) { if (!S.bat) { S.bat = true; toast(`На батарее ${fmt(v, 1)} В: три элемента по 1,5 В.`); } }
    else toast(`На батарее ${fmt(v, 1)} В. По заданию нужно три элемента.`);
  } else if (pairIs('l1', 'l2')) {
    if (!S.sw) toast('На лампе 0 В: ключ разомкнут, тока нет.');
    else if (S.n === Ls.nNeed) { if (!S.lampM) { S.lampM = true; toast(`На лампе тоже ${fmt(v, 1)} В — провода почти не «съедают» напряжение.`); } }
    else toast(`На лампе ${fmt(v, 1)} В. А нужно собрать батарею из трёх элементов.`);
  } else if (pairIs('s1', 's2')) toast(S.sw ? 'На замкнутом ключе 0 В.' : `На разомкнутом ключе всё напряжение батареи: ${fmt(v, 1)} В.`);
  else toast(`Вольтметр: ${fmt(v, 1)} В.`);
}

// lesson 3: R = ρ·l / S
const R3 = () => MAT[S.mat].rho * S.l / S.S;
function judge3() {
  const Ls = L();
  if (!S.ok3 && Math.abs(R3() - Ls.Rneed) <= Ls.tol + 1e-9) { S.ok3 = true; toast(`Готово: ${MAT[S.mat].name}, ${fmt(S.S, 1)} мм², ${nf(S.l * 100)} см — R = ${fmt(R3(), 2)} Ом.`); }
}

// lesson 4: regulated source 0…12 V, resistor, ammeter 0…3 A, voltmeter
const I4 = () => S.sw ? S.U / rOf(S.R) : 0;
function guard4() {
  if (I4() > L().Amax + 1e-9) { const i = I4(); S.sw = false; toast(`Ток был бы ${fmt(i, 1)} А — больше 3 А. Защита разомкнула ключ.`); }
}
function recordPoint() {
  if (!S.sw) { toast('Ключ разомкнут — нечего записывать.'); return; }
  if (S.U <= 0) { toast('При 0 В ток равен нулю. Прибавьте напряжение.'); return; }
  const I = I4();
  if (S.pts.some(p => p.r === S.R && Math.abs(p.U - S.U) < 1e-9)) { toast('Такая точка уже есть. Поменяйте напряжение.'); return; }
  S.pts.push({ r: S.R, U: S.U, I }); S.pts = S.pts.slice(-40);
  const n = ptsFor('r5');
  toast(`Записано: U = ${fmt(S.U, 1)} В, I = ${fmt(I, 2)} А.` + (S.R === 'r5' && n < L().nPts ? ` Точек для 5 Ом: ${n}.` : ''));
  update();
}
const ptsFor = k => new Set(S.pts.filter(p => p.r === k).map(p => p.U)).size;
function checkRx() {
  const v = parseFloat(String(S.rxIn).replace(',', '.'));
  if (!isFinite(v)) { toast('Введите число, например 7,5.'); return; }
  if (!S.pts.some(p => p.r === 'x')) { toast('Сначала измерьте: подключите резистор X и запишите хотя бы одну точку.'); return; }
  if (Math.abs(v - L().Rx) <= L().tol) { S.rx = true; toast(`Верно! R X = ${nf(L().Rx)} Ом.`); }
  else toast('Не сходится. Возьмите любую точку X на графике и разделите U на I.');
  update();
}

function model() {
  const id = LID();
  if (id === 'amp') return { kind: id, ok: S.ok1, I: cur1().IA, q: S.q };
  if (id === 'volt') return { kind: id, bat: S.bat, lamp: S.lampM, v: vRead() };
  if (id === 'res') return { kind: id, ok: S.ok3, R: R3() };
  return { kind: id, pts: ptsFor('r5') >= L().nPts, rx: S.rx, I: I4() };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
const WIRE = '#9fb0cc';
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    <clipPath id="lens"><circle cx="${C3.lx}" cy="${C3.ly}" r="${C3.lr - 2}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const pathD = pts => 'M' + pts.map(p => `${(+p[0]).toFixed(1)} ${(+p[1]).toFixed(1)}`).join('L');
const wire = (pts, w = 3, col = WIRE) => `<path d="${pathD(pts)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; }
function pointAt(pts, s) {
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (s <= d || i === pts.length - 1) { const f = d ? clamp(s / d, 0, 1) : 0; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; }
    s -= d;
  }
  return pts[pts.length - 1];
}
// free electrons along the wire; the path goes from «−» to «+» of the source, so the offset grows in the electrons' direction
function electrons(pts, tm, moving) {
  const len = polyLen(pts), gap = 22;
  let h = '';
  for (let k = 0, s0 = ((S.off % gap) + gap) % gap; s0 + k * gap < len; k++) {
    const p = pointAt(pts, s0 + k * gap);
    const jx = moving || reduce ? 0 : 2.2 * Math.sin(tm / 130 + k * 1.7), jy = moving || reduce ? 0 : 2.2 * Math.cos(tm / 110 + k * 2.3);
    h += `<circle cx="${(p[0] + jx).toFixed(1)}" cy="${(p[1] + jy).toFixed(1)}" r="2.6" fill="#72d4e8" opacity=".9" pointer-events="none"/>`;
  }
  return h;
}
function battery(x, y1, y2, n, U) {
  let h = `<rect x="${x - 21}" y="${y1 + 2}" width="42" height="${y2 - y1 - 4}" rx="6" fill="#121a28" stroke="${INK}" stroke-width="1.6"/>`;
  const ch = (y2 - y1 - 8) / n;
  for (let i = 0; i < n; i++) {
    const yy = y1 + 4 + i * ch;
    h += `<rect x="${x - 16}" y="${(yy + 1).toFixed(1)}" width="32" height="${(ch - 2).toFixed(1)}" rx="3" fill="#3a4762" stroke="${INK}" stroke-width="1"/>
      <rect x="${x - 16}" y="${(yy + 1).toFixed(1)}" width="32" height="3.5" fill="#ffb547"/><rect x="${x - 4}" y="${(yy - 1).toFixed(1)}" width="8" height="3" fill="#c8d0dd"/>`;
  }
  h += T(x - 28, y1 + 12, 14, '#ff8a73', '+', 'middle', 'font-weight="500" ' + halo) + T(x - 28, y2 - 2, 15, '#72d4e8', '−', 'middle', 'font-weight="500" ' + halo);
  h += T(x - 28, (y1 + y2) / 2 + 4, 10.5, '#e8ecf4', `${fmt(U, 1)} В`, 'end', halo);
  return h;
}
function keySwitch(x1, x2, y, closed, labelUp = true) {
  const len = x2 - x1, a = closed ? 0 : -32 * Math.PI / 180;
  const ex = x1 + Math.cos(a) * len, ey = y + Math.sin(a) * len;
  return `<g data-click="sw"><rect x="${x1 - 14}" y="${y - 44}" width="${len + 28}" height="62" fill="transparent"/>
    <circle cx="${x1}" cy="${y}" r="5.5" fill="#c8d0dd" stroke="${INK}" stroke-width="1.4"/><circle cx="${x2}" cy="${y}" r="5.5" fill="#c8d0dd" stroke="${INK}" stroke-width="1.4"/>
    <path d="M${x1} ${y}L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${closed ? '#86e0a8' : '#ff8a73'}" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="#0e1520" stroke="${closed ? '#86e0a8' : '#ff8a73'}" stroke-width="2"/>
    ${T((x1 + x2) / 2, labelUp ? y - 30 : y + 26, 10.5, closed ? '#86e0a8' : '#8b96ad', closed ? 'ключ замкнут' : 'ключ: нажми', 'middle', halo)}</g>`;
}
function lamp(x, yc, b) {
  const g = clamp(b, 0, 1.6), fil = g > 0.02 ? (g > 1.25 ? '#ffffff' : '#ffd27a') : '#5d6a86';
  let h = '';
  if (g > 0.02) h += `<circle cx="${x}" cy="${yc}" r="${(24 + 40 * Math.min(1.3, g)).toFixed(1)}" fill="url(#glow)" opacity="${Math.min(1, 0.25 + g).toFixed(2)}" pointer-events="none"/>`;
  h += `<rect x="${x - 9}" y="${yc + 14}" width="18" height="16" rx="2" fill="#8b96ad" stroke="${INK}" stroke-width="1.2"/><path d="M${x - 9} ${yc + 19}h18M${x - 9} ${yc + 24}h18" stroke="#5d6a86"/>
    <circle cx="${x}" cy="${yc - 4}" r="20" fill="${g > 0.02 ? '#fff3c4' : '#1c2638'}" fill-opacity="${g > 0.02 ? (0.2 + 0.5 * Math.min(1, g)).toFixed(2) : 1}" stroke="#a9d6e4" stroke-width="2"/>
    <path d="M${x - 5} ${yc + 14}V${yc - 2}l3 -6l2 5l2 -5l2 5l2 -5l2 6V${yc + 14}" fill="none" stroke="${fil}" stroke-width="1.8" stroke-linejoin="round" transform="translate(-2 0)"/>`;
  return h;
}
function dial(x, y, r, letter, val, max, over) {
  const a = (-60 + 120 * clamp(val / max, 0, 1.08)) * Math.PI / 180, px = x, py = y + r * 0.42, len = r * 0.8;
  let h = `<circle cx="${x}" cy="${y}" r="${r}" fill="#d9dfe9" stroke="${INK}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r - 3}" fill="none" stroke="#8b96ad" stroke-width="1"/>`;
  for (let k = 0; k <= 4; k++) { const b = (-60 + 30 * k) * Math.PI / 180; h += `<path d="M${(px + Math.sin(b) * r * 0.7).toFixed(1)} ${(py - Math.cos(b) * r * 0.7).toFixed(1)}L${(px + Math.sin(b) * r * 0.84).toFixed(1)} ${(py - Math.cos(b) * r * 0.84).toFixed(1)}" stroke="#26324a" stroke-width="1.3"/>`; }
  h += `<path d="M${px} ${py}L${(px + Math.sin(a) * len).toFixed(1)} ${(py - Math.cos(a) * len).toFixed(1)}" stroke="${over ? '#ff3c2e' : '#c0392b'}" stroke-width="1.8" stroke-linecap="round"/><circle cx="${px}" cy="${py}" r="2.4" fill="#26324a"/>`;
  h += T(x, y + r * 0.86, r * 0.4, '#0b1019', letter, 'middle', 'font-weight="500"');
  return h;
}
function nodeDot(x, y, active) {
  return `<circle cx="${x}" cy="${y}" r="${active ? 7 : 4.5}" fill="${active ? '#e8ecf4' : '#c8d0dd'}" stroke="${active ? '#72d4e8' : INK}" stroke-width="${active ? 2.4 : 1.4}"/>`;
}

// ---------- lesson 1: battery, key, ammeter, lamp, rheostat ----------
const rhX = () => C1.rh[0] + (C1.rh[1] - C1.rh[0]) * S.rh / L().Rmax;
function path1() {
  const c = C1, xs = rhX();
  const right = S.amm === 'par'
    ? [[c.x1, c.y1], [c.x1, 304], [c.par, 304], [c.par, 236], [c.x1, 236], [c.x1, c.y0]]
    : [[c.x1, c.y1], [c.x1, c.y0]];
  return [[c.x0, 304], [c.x0, c.y1], [xs, c.y1], [xs, c.rod], [c.rodX, c.rod], [c.rodX, c.y1]].concat(right, [[c.x0, c.y0], [c.x0, 236]]);
}
function ampScene(tm) {
  const Ls = L(), c = C1, cu = cur1(), xs = rhX(), am = c.am;
  let h = '';
  // wires
  h += wire([[c.x0, 304], [c.x0, c.y1], [c.rh[0], c.y1]]) + wire([[c.rodX, c.rod], [c.rodX, c.y1], [c.x1, c.y1], [c.x1, c.y0], [am + 22, c.y0]]) +
    wire([[am - 22, c.y0], [c.sw[1], c.y0]]) + wire([[c.sw[0], c.y0], [c.x0, c.y0], [c.x0, 236]]) + wire([[c.rh[0] - 6, c.rod], [c.rodX, c.rod]], 4, '#5d6a86');
  if (S.amm !== 'ser') h += `<path d="M${am - 22} ${c.y0}Q${am} ${c.y0 - 12} ${am + 22} ${c.y0}" fill="none" stroke="${WIRE}" stroke-width="3"/>`;
  if (S.amm === 'par') h += wire([[c.x1, 236], [c.par, 236], [c.par, 248]]) + wire([[c.x1, 304], [c.par, 304], [c.par, 292]]);
  // electrons
  const v = cu.I;
  h += electrons(path1(), tm, v > 1e-6);
  // rheostat: coil + rod + slider
  h += `<rect x="${c.rh[0]}" y="${c.y1 - 9}" width="${c.rh[1] - c.rh[0]}" height="18" rx="4" fill="#3a2e22" stroke="${INK}" stroke-width="1.4"/>`;
  for (let x = c.rh[0] + 4; x < c.rh[1]; x += 5) h += `<path d="M${x} ${c.y1 - 9}l3 18" stroke="#c9b98a" stroke-width="1.6"/>`;
  h += `<g data-drag="rh"><rect x="${(xs - 18).toFixed(1)}" y="${c.rod - 20}" width="36" height="${c.y1 - c.rod + 30}" fill="transparent"/>
    <rect x="${(xs - 9).toFixed(1)}" y="${c.rod - 10}" width="18" height="16" rx="3" fill="#ffb547" stroke="${INK}" stroke-width="1.4"/>
    <path d="M${xs.toFixed(1)} ${c.rod + 6}V${c.y1 - 9}" stroke="#ffb547" stroke-width="3"/></g>`;
  h += T((c.rh[0] + c.rh[1]) / 2, c.y1 + 24, 10.5, '#e8ecf4', `реостат: ${fmt(S.rh, 1)} Ом`, 'middle', halo);
  h += T(xs, c.rod - 15, 9.5, '#ffb547', '↔', 'middle', halo);
  // battery, key, lamp
  h += battery(c.x0, 236, 304, 3, Ls.U);
  h += keySwitch(c.sw[0], c.sw[1], c.y0, S.sw);
  h += lamp(c.x1, c.ly, Math.pow(cu.IL / 0.6, 2));
  h += T(c.x1 - 30, c.ly + 4, 10, '#8b96ad', `${nf(Ls.RL)} Ом`, 'end', halo);
  // cross-section gate and counter
  h += `<ellipse cx="${c.x1}" cy="${c.gate}" rx="11" ry="4" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="3 2"/>`;
  h += T(c.x1 - 18, c.gate + 4, 10.5, '#ffb547', S.tRun > 0 ? `q = ${fmt(S.q, 2)} Кл` : 'сечение', 'end', halo);
  // current direction (conventional)
  if (S.sw && cu.I > 1e-6) h += `<path d="M236 ${c.y0 - 12}h34" stroke="#ffb547" stroke-width="2"/><path d="M274 ${c.y0 - 12}l-8 -4v8z" fill="#ffb547"/>` + T(253, c.y0 - 19, 10.5, '#ffb547', 'I', 'middle', halo);
  // ammeter
  const over = cu.IA > Ls.Amax;
  if (S.amm === 'ser') h += `<g data-click="amm">${dial(am, c.y0, 22, 'A', cu.IA, Ls.Amax, over)}</g>` + T(am, c.y0 - 30, 11, '#e8ecf4', `${fmt(cu.IA, 2)} А`, 'middle', 'font-weight="500" ' + halo);
  else h += `<g data-click="slotS"><circle cx="${am}" cy="${c.y0}" r="22" fill="rgba(114,212,232,.06)" stroke="#72d4e8" stroke-width="1.6" stroke-dasharray="4 4"/>${T(am, c.y0 - 30, 9.5, '#72d4e8', 'в разрыв', 'middle', halo)}</g>`;
  if (S.amm === 'par') h += `<g data-click="amm">${dial(c.par, c.ly, 22, 'A', cu.IA, Ls.Amax, over)}</g>` + T(c.par, c.ly + 46, 11, '#ff8a73', `${fmt(cu.IA, 2)} А`, 'middle', 'font-weight="500" ' + halo);
  else h += `<g data-click="slotP"><circle cx="${c.par}" cy="${c.ly}" r="20" fill="rgba(255,138,115,.05)" stroke="#ff8a73" stroke-width="1.4" stroke-dasharray="4 4"/>${T(c.par, c.ly + 36, 9, '#ff8a73', 'параллельно', 'middle', halo)}</g>`;
  if (S.amm === 'none') h += `<g data-click="slotS">${dial(260, 262, 22, 'A', 0, Ls.Amax, false)}</g>` + T(260, 300, 10, '#8b96ad', 'амперметр', 'middle', halo) + T(260, 313, 9, '#8b96ad', 'не подключён', 'middle', halo);
  return h;
}

// ---------- lesson 2: battery of n cells, key, lamp, voltmeter with probes ----------
function voltScene(tm) {
  const Ls = L(), c = C1, U = U2(), I = I2();
  let h = '';
  h += wire([[c.x0, 304], [c.x0, c.y1], [c.x1, c.y1], [c.x1, c.y0], [c.sw[1], c.y0]]) + wire([[c.sw[0], c.y0], [c.x0, c.y0], [c.x0, 236]]);
  h += electrons([[c.x0, 304], [c.x0, c.y1], [c.x1, c.y1], [c.x1, c.y0], [c.x0, c.y0], [c.x0, 236]], tm, I > 1e-6);
  h += battery(c.x0, 236, 304, S.n, U);
  h += keySwitch(c.sw[0], c.sw[1], c.y0, S.sw);
  const b = Math.pow((S.sw ? U : 0) / Ls.Urated, 2);
  h += lamp(c.x1, c.ly, b);
  h += T(c.x1 - 30, c.ly + 4, 10, '#8b96ad', `${fmt(Ls.Urated, 1)} В`, 'end', halo);
  if (b > 1.25) h += T(c.x1, c.ly - 40, 10.5, '#ff8a73', 'перекал!', 'middle', halo);
  // terminals (targets)
  const dragging = drag && (drag.id === 'pr' || drag.id === 'pb');
  for (const k in NODES) h += nodeDot(NODES[k][0], NODES[k][1], dragging);
  // voltmeter body
  const vx = 260, vy = 280, v = vRead();
  h += `<rect x="${vx - 50}" y="${vy - 28}" width="100" height="56" rx="8" fill="#e6c14a" stroke="${INK}" stroke-width="1.8"/>
    <rect x="${vx - 40}" y="${vy - 20}" width="80" height="26" rx="3" fill="#0e1520"/>
    ${T(vx, vy - 1.5, 15, v < -1e-9 ? '#ff8a73' : '#86e0a8', `${fmt(v, 2)} В`, 'middle', 'font-weight="500"')}
    ${T(vx - 30, vy + 20, 9, '#0b1019', 'V', 'middle', 'font-weight="600"')}
    <circle cx="${vx - 14}" cy="${vy + 17}" r="4.5" fill="#d9483b" stroke="${INK}"/><circle cx="${vx + 14}" cy="${vy + 17}" r="4.5" fill="#26324a" stroke="${INK}"/>`;
  // leads and probes
  [['pr', vx - 14, '#e0473a'], ['pb', vx + 14, '#2a2f3a']].forEach(([k, jx, col]) => {
    const p = S[k];
    h += `<path d="M${jx} ${vy + 17}C${jx} ${vy + 60} ${p.x.toFixed(1)} ${(p.y + 50).toFixed(1)} ${p.x.toFixed(1)} ${(p.y + 8).toFixed(1)}" fill="none" stroke="${col === '#2a2f3a' ? '#4a5876' : col}" stroke-width="2.4"/>`;
    h += `<g data-drag="${k}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="18" fill="transparent"/>
      <rect x="${(p.x - 5).toFixed(1)}" y="${(p.y + 3).toFixed(1)}" width="10" height="20" rx="3" fill="${col}" stroke="${k === 'pb' ? '#8b96ad' : INK}" stroke-width="1.2"/>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#e8ecf4" stroke="${INK}" stroke-width="1"/></g>`;
  });
  if (!S.pr.at && !S.pb.at) h += T(vx, vy - 38, 10, '#8b96ad', 'тяни щупы к выводам', 'middle', halo);
  return h;
}

// ---------- lesson 3: wire on a board, sliding clamp, ohmmeter, magnifier ----------
const clX = () => C3.xa + (C3.xb - C3.xa) * S.l;
function resScene(tm) {
  const c = C3, m = MAT[S.mat], xl = clX(), R = R3(), Ls = L();
  let h = '';
  // board and ruler
  h += `<rect x="40" y="282" width="440" height="92" rx="8" fill="#2e2519" stroke="${INK}" stroke-width="1.6"/>`;
  for (let k = 0; k <= 20; k++) { const x = c.xa + (c.xb - c.xa) * k / 20; h += `<path d="M${x.toFixed(1)} 340v${k % 2 ? 6 : 11}" stroke="#c9b98a" stroke-width="1.2"/>`; if (k % 2 === 0) h += T(x, 364, 9, '#c9b98a', k === 20 ? '1 м' : fmt(k / 20, 1), 'middle'); }
  // wire (thickness shows the cross-section), the measured part is highlighted
  const w = 2 + 6 * Math.sqrt(S.S);
  h += `<path d="M${c.xa} ${c.wy}H${c.xb}" stroke="${m.col}" stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity=".35"/>
    <path d="M${c.xa} ${c.wy}H${xl.toFixed(1)}" stroke="${m.col}" stroke-width="${w.toFixed(1)}" stroke-linecap="round"/>
    <rect x="${c.xb + 2}" y="${c.wy - 10}" width="10" height="20" rx="2" fill="#5d6a86"/>`;
  h += T((c.xa + xl) / 2, c.wy - 12, 10, '#e8ecf4', `l = ${nf(S.l * 100)} см`, 'middle', halo);
  // ohmmeter
  const mx = c.mx, my = c.my, ok = Math.abs(R - Ls.Rneed) <= Ls.tol + 1e-9;
  h += `<rect x="${mx - 66}" y="${my - 38}" width="132" height="78" rx="9" fill="#e6c14a" stroke="${INK}" stroke-width="1.8"/>
    <rect x="${mx - 56}" y="${my - 30}" width="112" height="30" rx="3" fill="#0e1520"/>
    ${T(mx, my - 9, 15, ok ? '#86e0a8' : '#e8ecf4', `${R < 10 ? fmt(R, 2) : fmt(R, 1)} Ом`, 'middle', 'font-weight="500"')}
    ${T(mx - 40, my + 26, 11, '#0b1019', 'Ω', 'middle', 'font-weight="600"')}
    <circle cx="${mx - 14}" cy="${my + 24}" r="4.5" fill="#d9483b" stroke="${INK}"/><circle cx="${mx + 14}" cy="${my + 24}" r="4.5" fill="#26324a" stroke="${INK}"/>`;
  h += `<path d="M${mx + 14} ${my + 24}C${mx + 14} ${my + 90} ${c.xa} ${c.wy - 80} ${c.xa} ${c.wy - 12}" fill="none" stroke="#4a5876" stroke-width="2.4"/>
    <path d="M${mx - 14} ${my + 24}C${mx - 14} ${my + 100} ${xl.toFixed(1)} ${c.wy - 90} ${xl.toFixed(1)} ${c.wy - 14}" fill="none" stroke="#e0473a" stroke-width="2.4"/>`;
  // fixed clamp
  h += `<path d="M${c.xa - 7} ${c.wy - 16}h14l-3 14h-8z" fill="#2a2f3a" stroke="#8b96ad" stroke-width="1.2"/>`;
  // sliding clamp
  h += `<g data-drag="cl"><rect x="${(xl - 20).toFixed(1)}" y="${c.wy - 40}" width="40" height="64" fill="transparent"/>
    <path d="M${(xl - 8).toFixed(1)} ${c.wy - 18}h16l-3 16h-10z" fill="#e0473a" stroke="${INK}" stroke-width="1.2"/>
    <path d="M${(xl - 6).toFixed(1)} ${c.wy + 6}h12" stroke="#e0473a" stroke-width="3" stroke-linecap="round"/>
    ${T(xl, c.wy + 19, 9, '#ffb547', '↔', 'middle', halo)}</g>`;
  // magnifier: ions of the lattice and drifting electrons
  const lx = c.lx, ly = c.ly, lr = c.lr, tx = (c.xa + xl) / 2;
  h += `<path d="M${lx - 16} ${ly + lr - 4}L${tx.toFixed(1)} ${c.wy - 20}" stroke="#8b96ad" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="${lx}" cy="${ly}" r="${lr}" fill="#0e1520" stroke="#a9b4c9" stroke-width="3"/><g clip-path="url(#lens)">`;
  const hash = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
  for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
    const dx = m.alloy ? (hash(i, j) - 0.5) * 7 : 0, dy = m.alloy ? (hash(j + 9, i) - 0.5) * 7 : 0, big = m.alloy && hash(i + 3, j - 5) > 0.55;
    h += `<circle cx="${(lx + i * 15 + dx).toFixed(1)}" cy="${(ly + j * 15 + dy).toFixed(1)}" r="${big ? 6 : 4.5}" fill="${big ? '#8b6fc4' : m.col}" opacity=".75"/>`;
  }
  const spd = 40 / (1 + m.rho * 8);
  for (let k = 0; k < 8; k++) {
    const base = (k * 37) % 110, ph = reduce ? 0 : tm / 1000 * spd, x = lx + 55 - ((base + ph) % 110);
    const jit = reduce ? 0 : (m.alloy ? 5 : 1.5) * Math.sin(tm / 90 + k * 2.1);
    h += `<circle cx="${x.toFixed(1)}" cy="${(ly - 42 + k * 12 + jit).toFixed(1)}" r="2.4" fill="#72d4e8"/>`;
  }
  h += `</g>` + T(lx, ly - lr - 8, 10, '#8b96ad', `решётка: ${m.name}`, 'middle', halo);
  h += T(260, 396, 10.5, '#e8ecf4', `${m.name} · S = ${fmt(S.S, 1)} мм² · ρ = ${String(m.rho).replace('.', ',')} Ом·мм²/м`, 'middle', halo);
  return h;
}

// ---------- lesson 4: regulated source, ammeter, resistor, voltmeter, I(U) graph ----------
function ohmScene(tm) {
  const Ls = L(), c = C4, I = I4(), Rk = S.R, Rc = RES[Rk].col;
  let h = '';
  h += wire([[c.x0, 315], [c.x0, c.y1], [c.sw[0], c.y1]]) + wire([[c.sw[1], c.y1], [c.x1, c.y1], [c.x1, c.y0], [c.x0, c.y0], [c.x0, 225]]);
  h += electrons([[c.x0, 315], [c.x0, c.y1], [c.x1, c.y1], [c.x1, c.y0], [c.x0, c.y0], [c.x0, 225]], tm, I > 1e-6);
  // source
  h += `<rect x="${c.x0 - 38}" y="225" width="76" height="90" rx="8" fill="#26324a" stroke="${INK}" stroke-width="1.8"/>
    <rect x="${c.x0 - 30}" y="234" width="60" height="26" rx="3" fill="#0e1520"/>
    ${T(c.x0, 252, 13, '#86e0a8', `${fmt(S.U, 1)} В`, 'middle', 'font-weight="500"')}
    <g data-click="u-"><circle cx="${c.x0 - 17}" cy="290" r="12" fill="#3a4762" stroke="#8b96ad"/>${T(c.x0 - 17, 295, 15, '#e8ecf4', '−')}</g>
    <g data-click="u+"><circle cx="${c.x0 + 17}" cy="290" r="12" fill="#3a4762" stroke="#8b96ad"/>${T(c.x0 + 17, 295, 15, '#e8ecf4', '+')}</g>
    ${T(c.x0 - 44, 232, 12, '#ff8a73', '+', 'middle', halo)}${T(c.x0 - 44, 316, 13, '#72d4e8', '−', 'middle', halo)}`;
  h += keySwitch(c.sw[0], c.sw[1], c.y1, S.sw, false);
  // resistor
  h += `<g data-click="rcycle"><rect x="${c.x1 - 12}" y="238" width="24" height="64" rx="3" fill="#2a2f3a" stroke="${Rc}" stroke-width="2.4"/>
    ${T(c.x1, 274, 10, Rc, Rk === 'x' ? 'X' : 'R', 'middle', 'font-weight="500"')}</g>
    ${T(c.x1 - 16, 334, 10.5, Rc, Rk === 'x' ? 'R = ?' : `R = ${RES[Rk].name}`, 'end', halo)}`;
  // ammeter
  const over = I > Ls.Amax;
  h += dial((c.x0 + c.x1) / 2, c.y0, 22, 'A', I, Ls.Amax, over) + T((c.x0 + c.x1) / 2, c.y0 - 30, 11, '#e8ecf4', `${fmt(I, 2)} А`, 'middle', 'font-weight="500" ' + halo);
  // voltmeter across the resistor
  const vx = 168, vy = 270, Ur = S.sw ? S.U : 0;
  h += `<path d="M${vx + 20} ${vy - 10}H${c.x1 - 30}V242H${c.x1 - 12}" fill="none" stroke="#e0473a" stroke-width="2"/><path d="M${vx + 20} ${vy + 10}H${c.x1 - 30}V298H${c.x1 - 12}" fill="none" stroke="#4a5876" stroke-width="2"/>`;
  h += dial(vx, vy, 22, 'V', Ur, Ls.Umax, false) + T(vx, vy + 38, 11, '#e8ecf4', `${fmt(Ur, 1)} В`, 'middle', 'font-weight="500" ' + halo);
  if (S.sw && I > 1e-6) h += `<path d="M86 ${c.y0 - 12}h30" stroke="#ffb547" stroke-width="2"/><path d="M120 ${c.y0 - 12}l-8 -4v8z" fill="#ffb547"/>` + T(101, c.y0 - 19, 10.5, '#ffb547', 'I', 'middle', halo);
  // graph
  const gx = c.gx0, gy = c.gy0, gw = c.gw, gh = c.gh, X = u => gx + gw * u / Ls.Umax, Y = i => gy - gh * i / Ls.Amax;
  h += `<rect x="${gx - 22}" y="${gy - gh - 18}" width="${gw + 34}" height="${gh + 42}" rx="10" fill="rgba(11,16,25,.6)" stroke="#26324a"/>`;
  for (let u = 0; u <= Ls.Umax; u += 3) h += `<path d="M${X(u).toFixed(1)} ${gy}V${gy - gh}" stroke="#26324a"/>` + T(X(u), gy + 13, 9, '#8b96ad', u);
  for (let i = 0; i <= Ls.Amax; i++) h += `<path d="M${gx} ${Y(i).toFixed(1)}H${gx + gw}" stroke="#26324a"/>` + (i ? T(gx - 5, Y(i) + 3, 9, '#8b96ad', i, 'end') : '');
  h += `<path d="M${gx} ${gy - gh - 4}V${gy}H${gx + gw + 4}" fill="none" stroke="#8b96ad" stroke-width="1.4"/>` + T(gx + gw, gy - 6, 9.5, '#8b96ad', 'U, В', 'end') + T(gx + 4, gy - gh - 6, 9.5, '#8b96ad', 'I, А', 'start');
  // fitted lines through the origin for resistors with ≥ 2 points
  RKEYS.forEach(k => {
    const ps = S.pts.filter(p => p.r === k); if (ps.length < 2) return;
    const kk = ps.reduce((a, p) => a + p.U * p.I, 0) / ps.reduce((a, p) => a + p.U * p.U, 0);
    const uEnd = Math.min(Ls.Umax, Ls.Amax / kk);
    h += `<path d="M${gx} ${gy}L${X(uEnd).toFixed(1)} ${Y(kk * uEnd).toFixed(1)}" stroke="${RES[k].col}" stroke-width="1.6" opacity=".7"/>`;
  });
  S.pts.forEach(p => { h += `<circle cx="${X(p.U).toFixed(1)}" cy="${Y(p.I).toFixed(1)}" r="3.6" fill="${RES[p.r].col}" stroke="${INK}"/>`; });
  if (S.sw && I <= Ls.Amax) h += `<circle cx="${X(S.U).toFixed(1)}" cy="${Y(I).toFixed(1)}" r="6" fill="none" stroke="${Rc}" stroke-width="1.8"${reduce ? '' : ` opacity="${(0.6 + 0.4 * Math.sin(tm / 200)).toFixed(2)}"`}/>`;
  const legend = RKEYS.filter(k => S.pts.some(p => p.r === k));
  legend.forEach((k, i) => { h += `<circle cx="${gx + 8}" cy="${gy - gh + 12 + i * 13}" r="3.4" fill="${RES[k].col}"/>` + T(gx + 15, gy - gh + 15 + i * 13, 9, RES[k].col, RES[k].name, 'start'); });
  return h;
}

function hlBox(id) {

  e.preventDefault();

  scene.classList.add('grabbing');

const endDrag = () => {
  if (!drag) return;

    const p = S[id];
    let best = null, bd = 30;
    for (const k in NODES) { const d = Math.hypot(NODES[k][0] - p.x, NODES[k][1] - p.y); if (d < bd) { bd = d; best = k; } }

    if (best && other.at === best) best = null;
    if (best) { p.at = best; p.x = NODES[best][0]; p.y = NODES[best][1]; } else { p.at = null; p.x = REST[id][0]; p.y = REST[id][1]; }

};

let last = performance.now(), acc = 0;

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете закон Ома!'), 2200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  let now = '';
  if (id === 'amp') { const cu = cur1(); now = `Цепь: батарея ${fmt(Ls.U, 1)} В, ключ (${S.sw ? 'замкнут' : 'разомкнут'}), лампа ${nf(Ls.RL)} Ом, ползунковый реостат ${fmt(S.rh, 1)} Ом (из 0–${Ls.Rmax}). Амперметр (сопротивление ${fmt(Ls.RA, 1)} Ом, шкала до ${Ls.Amax} А): ${({ none: 'не подключён', ser: 'включён последовательно, в разрыв цепи', par: 'подключён параллельно лампе — неправильно' })[S.amm]}, показывает ${fmt(cu.IA, 3)} А. Ток в цепи ${fmt(cu.I, 3)} А, через лампу ${fmt(cu.IL, 3)} А. Секундомер: ${S.running ? 'идёт' : 'стоит'}, t = ${fmt(S.tRun, 1)} с, прошло q = ${fmt(S.q, 2)} Кл. Нужно: 2 Кл за 10 с при амперметре в разрыв; задание ${S.ok1 ? 'выполнено' : 'не выполнено'}. Нужное сопротивление реостата не называй — пусть ученик найдёт ток из I = q/t и подберёт ползунок по амперметру.`; }
  if (id === 'volt') now = `Батарея из ${S.n} элементов по 1,5 В = ${fmt(U2(), 1)} В, ключ ${S.sw ? 'замкнут' : 'разомкнут'}, лампа на ${fmt(Ls.Urated, 1)} В (${Ls.RL} Ом), ток лампы ${fmt(I2(), 2)} А. Вольтметр: красный щуп — ${S.pr.at ? NODES[S.pr.at][2] : 'не подключён'}, чёрный — ${S.pb.at ? NODES[S.pb.at][2] : 'не подключён'}, показание ${S.pr.at && S.pb.at ? fmt(vRead(), 2) + ' В' : 'нет'}. Измерено напряжение батареи из 3 элементов: ${S.bat ? 'да' : 'нет'}; на лампе при замкнутом ключе: ${S.lampM ? 'да' : 'нет'}. Модель: провода и вольтметр идеальные.`;
  if (id === 'res') now = `Проволока: ${MAT[S.mat].name} (ρ = ${String(MAT[S.mat].rho).replace('.', ',')} Ом·мм²/м), сечение ${fmt(S.S, 1)} мм², длина между зажимами ${nf(S.l * 100)} см. Омметр показывает ${fmt(R3(), 3)} Ом. Цель — 4,4 Ом (±0,05), ${S.ok3 ? 'достигнута' : 'не достигнута'}. Длина 10–100 см шагом 5 см; материалы: медь, алюминий, железо, никелин, нихром; сечения 0,1/0,2/0,5/1 мм². Готовую комбинацию не называй — наводи на l = R·S/ρ и на то, какой материал вообще может дать 4,4 Ом при длине до 1 м.`;
  if (id === 'ohm') now = `Регулируемый источник ${fmt(S.U, 1)} В, ключ ${S.sw ? 'замкнут' : 'разомкнут'}. Подключён резистор ${S.R === 'x' ? 'X (сопротивление неизвестно ученику)' : RES[S.R].name}. Вольтметр ${fmt(S.sw ? S.U : 0, 1)} В, амперметр ${fmt(I4(), 3)} А (шкала до ${Ls.Amax} А, при перегрузке ключ размыкается). Записано точек: ${S.pts.length}, из них разных напряжений для 5 Ом: ${ptsFor('r5')} (нужно ${Ls.nPts}); точек для X: ${S.pts.filter(p => p.r === 'x').length}. Ответ R X ${S.rx ? 'найден верно' : 'ещё не найден'}. Сопротивление X не называй — пусть ученик сам вычислит R = U/I по своим измерениям.`;
  return [
    `Раздел: физика, 8 класс, тема «Электрический ток». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { amp: 'Почему амперметр включают последовательно?', volt: 'Почему на разомкнутом ключе всё напряжение батареи?', res: 'Почему провода делают из меди, а спирали из нихрома?', ohm: 'Почему график I(U) — прямая через ноль?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
