<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 8–10 класс: экзо- и эндотермические реакции, термохимические уравнения, энергия связей, теплота сгорания топлива.">
<title>Тепловой эффект реакции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Термохимия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Калориметр с термометром, весы с порциями вещества, молекулы и энергетическая диаграмма, полка с видами топлива. Карточки можно перетаскивать, молекулы и таблички — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-thermo';
const fx = (v, d) => v.toFixed(d).replace('.', ',').replace(/^-/, '−');
const NB = ' ';
// число без лишних нулей: 1780, 0,5, 71,2, 44 500
function nf(v, d = 2) {
  const a = Math.abs(v);
  let s = Math.abs(a - Math.round(a)) < 1e-9 ? String(Math.round(a)) : a.toFixed(a < 10 ? d : 1).replace(/0+$/, '').replace(/\.$/, '');
  const [i, f] = s.split('.');
  s = i.replace(/\B(?=(\d{3})+(?!\d))/g, NB) + (f ? ',' + f : '');
  return (v < 0 && a > 1e-12 ? '−' : '') + s;
}
const sg = (v, d = 1) => (v > 0.0499 ? '+' : '') + fx(v, d);
const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

// ---------- lesson 1: calorimeter, 100 g of water at 20 °C ----------
const T0 = 20, CW = 4.18, TAU = 1.1, TB = 5;
const SAMP = [
  { id: 'naoh', name: 'NaOH', sub: 'гранулы, 4 г', exo: true, col: '#f2f2ee', q: 4.45, mass: 104, n: 0.1, kind: 'dis', solid: '#f2f2ee',
    what: '4 г NaOH (0,1 моль) растворяют в 100 мл воды', eq: 'NaOH(тв) → Na⁺ + OH⁻, выделяется 44,5 кДж/моль', perMol: -44.5 },
  { id: 'nh4', name: 'NH₄NO₃', sub: 'селитра, 8 г', exo: false, col: '#e9eef8', q: -2.57, mass: 108, n: 0.1, kind: 'dis', solid: '#e9eef8',

    const A = M.atoms[a], B = M.atoms[b], dx = B[1] - A[1], dy = B[2] - A[2], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
    for (let j = 0; j < o; j++) { const off = (j - (o - 1) / 2) * 3.4; h += `<path d="M${f1(cx + A[1] + nx * off)} ${f1(cy + A[2] + ny * off)}L${f1(cx + B[1] + nx * off)} ${f1(cy + B[2] + ny * off)}" stroke="${ghost ? '#5c6b88' : '#c8d1e2'}" stroke-width="1.6" ${ghost ? 'stroke-dasharray="3 3"' : ''}/>`; }
  }

    const r = ARAD[el];
    h += ghost ? `<circle cx="${f1(cx + x)}" cy="${f1(cy + y)}" r="${r}" fill="#0e1520" stroke="#5c6b88" stroke-dasharray="3 2"/>` :

}

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 500, hh / 410, 1.7), vx = null;
  // the task card (it grows with the shared «Формулы урока» block and the «Как выполнить» button) must not cover the bench:
  // content spans x 10…510 and y 118…405 — place it to the right of the card or below it, whichever is larger
  const tk = document.querySelector('#stage .task');
  if (tk && tk.offsetParent) {
    const tb = tk.getBoundingClientRect(), right = tb.right - rc.left + 8, bot = tb.bottom - rc.top + 8;
    if (right > w / 2 - 250 * s && bot > hh - 287 * s) {
      const sSide = Math.min(s, (w - right - 8) / 500), sDown = Math.min(s, (hh - bot) / 287);
      if (sSide >= sDown) { s = Math.max(0.3, sSide); vx = 10 - (right + (w - 8 - right - 500 * s) / 2) / s; }
      else s = Math.max(0.3, sDown);
    }
  }
  const vw = w / s, vh = hh / s;
  if (vx === null) vx = 260 - vw / 2;
  scene.setAttribute('viewBox', `${vx.toFixed(1)} ${(405 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);
new ResizeObserver(fit).observe(document.querySelector('#stage .task'));

// ---------- dragging and tapping ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const live = id => id === 'm2';
const movable = id => id.startsWith('card-') || id === 'm2';
function liveMove(id, p) {
  if (id === 'm2') { const r = RX2[QS[S.q].rx]; setM2(Math.round(clamp((p.x - SLD.x0) / (SLD.x1 - SLD.x0), 0, 1) * r.max / r.step) * r.step); }
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  drag = { id: el.dataset.drag, x: e.clientX, y: e.clientY, p: toSvg(e), moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6 && movable(drag.id)) drag.moved = true;
  drag.p = toSvg(e);
  if (drag.moved && live(drag.id)) { liveMove(drag.id, drag.p); return; }
  if (drag.moved) dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.moved) drop(d.id, d.p); else tap(d.id, d.p);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id, p) {
  if (id === 'm2') return liveMove(id, p);
  if (id.startsWith('card-')) return testSamp(+id.slice(5));
  if (id.startsWith('tile-')) return answer(+id.slice(5));
  if (id.startsWith('r-')) return breakR(+id.slice(2));
  if (id.startsWith('p-')) return formP(+id.slice(2));
  if (id.startsWith('v-')) return verdict(id.slice(2));
  if (id.startsWith('fuel-')) return pickFuel(+id.slice(5));
  if (id.startsWith('sc-')) return setSc(+id.slice(3));
}
function drop(id, p) {
  if (id.startsWith('card-')) {
    const i = +id.slice(5);
    if (inCupZone(p)) return testSamp(i);
    const b = basketAt(p); if (b) return sortSamp(i, b);
  }
}

// lesson 1 actions
function testSamp(i) {
  const a = SAMP[i];
  if (S.cur === i) { toast(`${a.name} уже в калориметре. Чтобы повторить опыт, сначала вымойте стакан.`); return true; }
  S.cur = i; S.t1 = reduce ? 12 : 0; S.tested[a.id] = true; BUB = []; acc1 = 0;
  toast(`Опыт: ${a.what}. Следите за термометром.`);
  renderTools(); update(); return true;
}
function sortSamp(i, k) {
  const a = SAMP[i], d = dTof(a);
  if (!S.tested[a.id]) { toast('Сначала проведите этот опыт в калориметре.'); return false; }
  if ((k === 'exo') !== a.exo) {
    S.wrong1++;
    toast(a.exo ? `Нет: вода нагрелась на ${fx(d, 1)} °C — теплота выделилась.` : `Нет: вода остыла на ${fx(-d, 1)} °C — теплота поглотилась.`);
    update(); return false;
  }
  if (S.sorted[a.id] === k) return true;
  S.sorted[a.id] = k;
  toast(`Верно: ${a.eq}.`);
  update(); return true;
}
function clearCup() { S.cur = null; S.t1 = 0; BUB = []; renderTools(); update(); }

// lesson 2 actions
function setQ(i) { S.q = clamp(i, 0, QS.length - 1); S.m2 = QS[S.q].m; S.bad2 = null; renderTools(); buildScheme(); update(); }
function setM2(v) { const r = RX2[QS[S.q].rx]; v = clamp(Math.round(v / r.step) * r.step, 0, r.max); if (Math.abs(v - S.m2) < 1e-9) return; S.m2 = v; update(); }
function answer(k) {
  const qq = QS[S.q], v = qq.opts[k], r = RX2[qq.rx], n = qq.m / r.M;
  if (S.ans[S.q]) { toast('Эта задача уже решена. Переходите к следующей.'); return true; }
  if (v === qq.ans) {
    S.ans[S.q] = true; S.bad2 = null; S.m2 = qq.m;
    const next = QS.findIndex((x, i) => !S.ans[i]);
    toast(`Верно: n = ${nf(qq.m)} / ${r.M} = ${nf(n, 3)} моль, Q = ${nf(n, 3)} / ${r.nu} · ${Math.abs(r.Q)} = ${nf(v, 1)} кДж.${next >= 0 ? ` Дальше — задача ${next + 1}.` : ''}`);
    update(); return true;
  }
  S.wrong2++; S.bad2 = v;
  let msg = 'Нет. Сначала найдите n = m / M, потом сравните с числом моль в уравнении.';
  if (v === Math.abs(r.Q)) msg = `Нет: ${Math.abs(r.Q)} кДж — это теплота на ${r.nu} моль ${r.f}, как в уравнении. А сколько моль в ${nf(qq.m)} г?`;
  else if (r.nu > 1 && Math.abs(v - n * Math.abs(r.Q)) < 1e-6) msg = `Нет: в уравнении ${r.nu} моль ${r.f}, а теплота ${Math.abs(r.Q)} кДж — на все ${r.nu} моль. Разделите на ${r.nu}.`;
  else if (Math.abs(v - qq.m * Math.abs(r.Q)) < 1e-6) msg = 'Нет: умножили на массу в граммах, а теплота пропорциональна количеству вещества в молях.';
  toast(msg); update(); return false;
}

// lesson 3 actions
function setRx(i) { S.rx3 = clamp(i, 0, RX3.length - 1); S.brk = []; S.frm = []; renderTools(); buildScheme(); update(); }
function breakR(i) {
  const r = RX3[S.rx3], k = r.R[i]; if (!k) return;
  if (S.brk[i]) { toast(`${MOLS[k].f} уже разорвана на атомы.`); return; }
  S.brk[i] = true;
  toast(`Разорвали ${bTxt(k)} в ${MOLS[k].f}: затрачено ${molE(k)} кДж.`);
  update();
}
function formP(i) {
  const r = RX3[S.rx3], k = r.P[i]; if (!k) return;
  if (S.frm[i]) { toast(`${MOLS[k].f} уже собрана.`); return; }
  if (!r.R.every((x, j) => S.brk[j])) { toast('Сначала разорвите связи во всех молекулах реагентов: атомы для продуктов берутся из них.'); return; }
  S.frm[i] = true;
  toast(`Образовались ${bTxt(k)} в ${MOLS[k].f}: выделилось ${molE(k)} кДж.`);
  update();
}
const breakNext = () => { const r = RX3[S.rx3], i = r.R.findIndex((k, j) => !S.brk[j]); if (i < 0) toast('Все связи в реагентах уже разорваны.'); else breakR(i); };
const formNext = () => { const r = RX3[S.rx3], i = r.P.findIndex((k, j) => !S.frm[j]); if (i < 0) toast('Все продукты уже собраны.'); else formP(i); };
function verdict(v) {
  const r = RX3[S.rx3], m = model();
  if (!m.allF) { toast('Сначала разорвите все связи и соберите все продукты — тогда станет ясен итог.'); return; }
  if ((v === 'exo') !== r.exo) { S.wrong3++; toast(`Нет: на разрыв ушло ${m.Ebrk} кДж, а при образовании выделилось ${m.Efrm} кДж. Чего больше?`); update(); return; }
  const first = !S.f3[r.id]; S.f3[r.id] = true;
  toast(`Верно: Q = ${m.Efrm} − ${m.Ebrk} = ${m.Q > 0 ? '+' : '−'}${Math.abs(m.Q)} кДж, ${r.exo ? 'экзотермическая' : 'эндотермическая'} (${r.real}).${first && !(S.f3.ch4 && S.f3.no) ? ' Теперь другая реакция.' : ''}`);
  update();
}

// lesson 4 actions
let scT = 0;
function setSc(i) { S.sc = clamp(i, 0, SC4.length - 1); S.sel = null; clearTimeout(scT); renderTools(); buildScheme(); update(); }
function pickFuel(i) {
  const sc = SC4[S.sc], f = FUELS[i];
  S.sel = i;
  if (S.pick[S.sc]) { update(); return; }
  if (f.id === sc.ok) {
    S.pick[S.sc] = f.id; toast(sc.right);
    const next = SC4.findIndex((x, j) => !S.pick[j]), lesson = S.lesson;
    clearTimeout(scT); if (next >= 0) scT = setTimeout(() => { if (S.lesson === lesson) setSc(next); }, 2600);
    update(); return;
  }
  S.wrong4++;
  let msg;
  if (sc.id === 'rocket') { const h2 = FUELS[0]; msg = `Можно лучше: с ${INSTR[f.id]} понадобится ${kgTxt(massFor(sc, f))} — в ${nf(massFor(sc, f) / massFor(sc, h2), 1)} раза больше по массе, чем у самого «лёгкого» топлива.`; if (f.bat) msg = `Аккумуляторы на 1000 МДж весили бы больше тонны: около 0,9 МДж/кг. Для ракеты нужна наибольшая теплота сгорания.`; }
  else if (sc.id === 'boiler') msg = sc.only.includes(f.id) ? `Есть вариант чище: ${f.name.toLowerCase()} даёт около ${f.co2} г CO₂ на МДж, за зиму ${kgTxt(co2For(sc, f))}.` : 'В этой задаче котельная работает на ископаемом топливе: выбирайте из метана (природного газа), бензина и угля.';
  else msg = f.id === 'h2' ? 'Сжигать водород на закрытом складе опасно: смесь H₂ с воздухом взрывоопасна. (Бывают погрузчики на водородных топливных элементах — там водород не горит, а даёт ток.)' : `${f.name} ${f.id === 'wood' ? 'горят' : 'горит'}: пламя, выхлоп с CO₂, а при нехватке воздуха — ядовитый угарный газ CO. В закрытом складе так нельзя.`;
  toast(msg); update();
}

// ---------- animation loop ----------
let lastT = 0, lastUi = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
  const id = LID();
  let anim = false;
  if (id === 'exo') {
    if (S.cur !== null && S.t1 < 12) { S.t1 = Math.min(12, S.t1 + dt); if (t - lastUi > 150 || S.t1 >= 12) { lastUi = t; update(); } }
    if (!reduce) { stepBubbles(dt); anim = true; }
  }
  if (dirty || anim || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    exo: SAMP.map((a, i) => B('s-' + i, a.name, S.cur === i)).join('') + sep + B('clr', 'Вымыть'),
    equation: QS.map((q, i) => B('q-' + i, 'Задача ' + (i + 1), S.q === i)).join('') + sep + B('m-', '−m') + B('m+', '+m'),
    bonds: RX3.map((r, i) => B('rx-' + i, r.name, S.rx3 === i)).join('') + sep + B('brk', 'Разорвать') + B('frm', 'Собрать') + sep + B('rs3', 'Заново'),
    fuel: SC4.map((s, i) => B('sc-' + i, s.name, S.sc === i)).join(''),
  }[id];
}
function act(a) {
  if (a.startsWith('s-')) return testSamp(+a.slice(2));
  if (a === 'clr') return clearCup();
  if (a.startsWith('q-')) return setQ(+a.slice(2));
  if (a === 'm-' || a === 'm+') { const r = RX2[QS[S.q].rx]; return setM2(S.m2 + (a === 'm+' ? r.step : -r.step)); }
  if (a.startsWith('rx-')) return setRx(+a.slice(3));
  if (a === 'brk') return breakNext();
  if (a === 'frm') return formNext();
  if (a === 'rs3') return setRx(S.rx3);
  if (a.startsWith('sc-')) return setSc(+a.slice(3));
  if (a.startsWith('fuel-')) return pickFuel(+a.slice(5));
  if (a === 'exo' || a === 'endo') return verdict(a);
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'exo') return `Опытов ${SAMP.filter(a => S.tested[a.id]).length} из 6 · разложено ${SAMP.filter(a => S.sorted[a.id]).length} из 6 · T = ${fx(m.T, 1)} °C`;
  if (m.kind === 'eq') return `Решено ${QS.filter((q, i) => S.ans[i]).length} из 3 · сейчас задача ${S.q + 1}`;
  if (m.kind === 'bd') return `Горение метана: ${S.f3.ch4 ? '✓' : '—'} · N₂ + O₂: ${S.f3.no ? '✓' : '—'}${S.f3.hcl ? ' · H₂ + Cl₂: ✓' : ''}`;
  return SC4.map((s, i) => `${s.name}: ${S.pick[i] ? '✓' : '—'}`).join(' · ');
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const val = (s, v) => { const x = el.querySelector(s); if (x && +x.value !== v) x.value = v; };
  const press = (s, f) => el.querySelectorAll(s + ' button').forEach(b => b.setAttribute('aria-pressed', f(+b.dataset.i)));
  if (m.kind === 'exo') {
    set('#r1', fx(m.T, 1) + ' °C'); set('#r2', sg(m.dT) + ' °C'); set('#r3', sg(m.Q, 2) + ' кДж');
    press('#sChips', i => i === S.cur);
    el.querySelectorAll('select[data-i]').forEach(s => { s.value = S.sorted[SAMP[+s.dataset.i].id] || ''; });
  } else if (m.kind === 'eq') {
    set('#r1', nf(m.n, 3) + ' моль'); set('#r2', '×' + nf(m.k, 3)); set('#r3', m.known ? nf(m.Q, 1) + ' кДж' : '?'); set('#mO', nf(m.m)); val('#mR', m.m);
    press('#qChips', i => i === S.q);
    el.querySelectorAll('#aChips button').forEach(b => b.setAttribute('aria-pressed', !!S.ans[S.q] && QS[S.q].opts[+b.dataset.i] === QS[S.q].ans));
  } else if (m.kind === 'bd') {
    set('#r1', '+' + m.brk + ' кДж'); set('#r2', '−' + m.frm + ' кДж'); set('#r3', (m.E > 0 ? '+' : '') + nf(m.E) + ' кДж');
    press('#rChips', i => i === S.rx3);
  } else {
    set('#r1', m.f ? '≈' + nf(m.f.q, 1) : '—'); set('#r2', m.f ? kgTxt(m.mass) : '—'); set('#r3', m.f ? (m.f.co2 ? kgTxt(m.co2) : '0') : '—');
    set('#scTxt', m.sc.text.join(' '));
    press('#cChips', i => i === S.sc); press('#fChips', i => i === S.sel);
  }
}

function calcHTML(m) {
  if (m.kind === 'exo') {
    const s = m.s;
    let h = `<h2>Теплота по нагреву воды</h2><div class="formula">Q = c · m · ΔT</div>`;
    if (s) {
      h += `<h3>${s.name} (${s.sub})</h3><div class="steps">` + step('c (вода и разбавленный раствор)', '4,18 Дж/(г·°C)') + step('m раствора', nf(s.mass, 1) + ' г') +
        step('ΔT', `${fx(m.T, 1)} − 20 = ${sg(m.dT)} °C`) + step('Q = c · m · ΔT', `${sg(CW * s.mass * m.dT, 0)} Дж = ${sg(m.Q, 2)} кДж`, 'sum') + `</div>`;
      h += m.Q >= 0 ? `<p class="note" style="margin-top:10px">Раствор получил теплоту — процесс её выделил: экзо.</p>` : `<p class="note" style="margin-top:10px">Раствор потерял теплоту — процесс её поглотил: эндо.</p>`;
      if (s.kind === 'burn') h += `<h3>Сколько выделил спирт</h3><div class="steps">${step('n(C₂H₅OH) = 0,30 / 46', '0,0065 моль')}${step('0,0065 · 1367 кДж', '≈ 8,9 кДж')}${step('попало в воду', '≈ 3,6 кДж, около 40%')}</div><p class="note" style="margin-top:10px">Остальное тепло ушло в воздух и на нагрев банки: открытое пламя — плохой калориметр.</p>`;
      else if (m.settled) h += `<h3>На 1 моль</h3><div class="steps">${step('n', nf(s.n, 2) + ' моль')}${step('Q / n', `${sg(m.Q / s.n, 0)} кДж/моль`)}${step('по справочнику', `${s.perMol < 0 ? '+' : '−'}${nf(Math.abs(s.perMol), 1)} кДж/моль`, 'sum')}</div>`;
    } else h += `<p class="note">Проведите опыт — здесь появится расчёт.</p>`;
    h += `<h3>Проведённые опыты</h3><div class="steps">${SAMP.map(a => step(`${a.name}, ${a.sub}`, S.tested[a.id] ? `ΔT ≈ ${sg(dTof(a))} °C${S.sorted[a.id] ? ' ✓' : ''}` : '?')).join('')}</div>`;
    return h;
  }
  if (m.kind === 'eq') {
    const r = m.r, qq = m.qq;
    let h = `<h2>${r.eq}</h2><div class="formula">n = m / M · Q = n / ν · Q(ур.)</div><h3>Задача ${S.q + 1}: ${nf(qq.m)} г ${r.f}</h3><div class="steps">` +
      step('M(' + r.f + ')', r.M + ' г/моль') + step('n = m / M', `${nf(qq.m)} / ${r.M} = ${nf(qq.m / r.M, 3)} моль`) +
      step(`по уравнению: ${r.nu} моль`, `${Math.abs(r.Q)} кДж`) + step(`${nf(qq.m / r.M, 3)} моль`, 'x') +
      step('x', S.ans[S.q] ? `${nf(qq.m / r.M, 3)} · ${Math.abs(r.Q)} / ${r.nu} = ${nf(qq.ans, 1)} кДж` : '? — посчитайте и выберите табличку', 'sum') + `</div>`;
    h += `<h3>На весах сейчас</h3><div class="steps">${step('m', nf(m.m) + ' г')}${step('n', nf(m.n, 3) + ' моль')}${step('Q', m.known ? nf(m.Q, 1) + ' кДж' : 'после верного ответа')}</div>`;
    h += `<h3>Обратная задача</h3><p class="note">Сколько метана нужно сжечь, чтобы получить 445 кДж? 445 / 890 = 0,5 моль, m = 0,5 · 16 = 8 г.</p>`;
    h += `<h3>Задачи</h3><div class="steps">${QS.map((q, i) => step('задача ' + (i + 1), S.ans[i] ? nf(q.ans, 1) + ' кДж ✓' : 'ещё нет')).join('')}</div>`;
    return h;
  }
  if (m.kind === 'bd') {
    const r = m.r;
    let h = `<h2>${r.eq}</h2><div class="formula">Q = ΣE(образ.) − ΣE(разорв.)</div><h3>Разрыв связей (затрата)</h3><div class="steps">` +
      r.R.map((k, i) => step(`${MOLS[k].f}: ${MOLS[k].b.map(([b, n]) => `${n} × ${b} (${BE[b]})`).join(', ')}`, S.brk[i] ? '+' + molE(k) : '?')).join('') + step('всего', m.allB ? '+' + m.Ebrk + ' кДж' : '+' + m.brk + ' …', 'sum') + `</div>`;
    h += `<h3>Образование связей (выделение)</h3><div class="steps">` +
      r.P.map((k, i) => step(`${MOLS[k].f}: ${MOLS[k].b.map(([b, n]) => `${n} × ${b} (${BE[b]})`).join(', ')}`, S.frm[i] ? '−' + molE(k) : '?')).join('') + step('всего', m.allF ? '−' + m.Efrm + ' кДж' : '−' + m.frm + ' …', 'sum') + `</div>`;
    if (m.allF) h += `<h3>Итог</h3><div class="steps">${step('Q', `${m.Efrm} − ${m.Ebrk} = ${m.Q > 0 ? '+' : '−'}${Math.abs(m.Q)} кДж`, 'sum')}${step('по таблицам', r.real)}</div>`;
    h += `<p class="note" style="margin-top:10px">Энергии связей — средние значения в кДж/моль, поэтому расчёт даёт оценку.</p>`;
    return h;
  }
  const sc = m.sc;
  let h = `<h2>${sc.name}: ${nf(sc.E)} МДж</h2><div class="formula">m = E / q · CO₂ = E · k</div><h3>Для этой задачи</h3><div class="steps">` +
    FUELS.map(f => step(`${f.name} (≈${nf(f.q, 1)} МДж/кг)`, `${kgTxt(massFor(sc, f))} · CO₂ ${f.co2 ? kgTxt(co2For(sc, f)) : '0'}`)).join('') + `</div>`;
  h += `<h3>Энергия на колёсах</h3><div class="steps">${step('бензин: 44 МДж/кг · КПД ≈ 25%', '≈ 11 МДж/кг')}${step('аккумулятор: 0,9 МДж/кг · КПД ≈ 90%', '≈ 0,8 МДж/кг')}${step('разница', 'примерно в 13 раз', 'sum')}</div>`;
  h += `<p class="note" style="margin-top:10px">Числа округлены («около»): теплота сгорания угля и дров зависит от сорта и влажности, а CO₂ водорода и аккумулятора — от того, как получены водород и электричество.</p>`;
  h += `<h3>Задачи</h3><div class="steps">${SC4.map((s, i) => step(s.name, S.pick[i] ? FUELS.find(f => f.id === S.pick[i]).name + ' ✓' : 'ещё нет')).join('')}</div>`;
  return h;
}

  }
}

function update() {
  const L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(model())) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Тепловой эффект реакций освоен!'), 1900);
  }
  const mm = model();
  renderMeter(mm);
  $('#taskState').textContent = taskState(mm);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(mm);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  equation: '<rect x="4" y="16" width="9" height="9" rx="2" fill="#9fd4f0"/><rect x="14" y="16" width="9" height="9" rx="2" fill="#9fd4f0"/><rect x="2" y="25" width="24" height="3" fill="#5c6b88"/><text x="45" y="20" font-size="10" text-anchor="middle" fill="#ff8a73" font-family="IBM Plex Mono">+Q</text>',

  fuel: '<rect x="4" y="5" width="56" height="4" rx="2" fill="#ffb547"/><rect x="4" y="11" width="24" height="4" rx="2" fill="#ffb547" opacity=".7"/><rect x="4" y="17" width="21" height="4" rx="2" fill="#ffb547" opacity=".7"/><rect x="4" y="23" width="3" height="4" rx="1" fill="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null; clearTimeout(scT);
  S.cur = null; S.t1 = 0; S.tested = {}; S.sorted = {}; S.wrong1 = 0; BUB = [];
  S.q = 0; S.m2 = QS[0].m; S.ans = {}; S.wrong2 = 0; S.bad2 = null;
  S.rx3 = 0; S.brk = []; S.frm = []; S.f3 = {}; S.wrong3 = 0;
  S.sc = 0; S.sel = null; S.pick = {}; S.wrong4 = 0;
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-chem-thermo.js): calorimeter on a lab tray, fuel shelf
window.LUCH_REAL = () => {
  const id = LID(), m = model(), base = { module: 'chem-thermo' };
  if (id === 'exo') return { ...base, scene: 'chth-calor', help: 'Баночка — опыт в калориметре, клавиши «экзо/эндо» — отсортировать опыт из стакана, стакан — вымыть',
    cur: S.cur, kind: m.s ? m.s.kind : null, sid: m.s ? m.s.id : null, name: m.s ? m.s.name + ' · ' + m.s.sub : null,
    samples: SAMP.map(a => ({ id: a.id, name: a.name, col: a.col, kind: a.kind, tested: !!S.tested[a.id], sorted: S.sorted[a.id] || null })) };
  if (id === 'fuel') return { ...base, scene: 'chth-fuel', help: 'Топливо на полке — выбрать для задачи, клавиши — сменить задачу',
    sc: S.sc, scName: m.sc.name, E: m.sc.E, text: m.sc.text, sel: S.sel, only: m.sc.only || null, picks: SC4.map((s, i) => S.pick[i] || null),
    res: m.f ? `${kgTxt(m.mass)} · CO₂ ${m.f.co2 ? kgTxt(m.co2) : '0'}` : null,
    fuels: FUELS.map(f => ({ id: f.id, name: f.name, q: f.q, co2: f.co2, col: f.col, bat: !!f.bat })) };
  return null;
};
// values that change every frame (temperature in the calorimeter)
window.LUCH_REAL.live = () => {
  if (LID() !== 'exo') return null;
  const m = model(); return { T: m.T, dT: m.dT, p: m.p };
};
window.LUCH_REAL.click = k => {
  if (k === 'exo' || k === 'endo') { if (S.cur === null) { toast('Сначала проведите опыт — нажмите на баночку.'); return; } sortSamp(S.cur, k); return; }
  if (k === 'cup') return clearCup();
  if (k.startsWith('smp-')) return testSamp(+k.slice(4));
  act(k);
};

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'exo') now = `Калориметр: 100 мл воды при 20 °C, термометр и график T(t). Опыты: ${SAMP.map(a => a.name + ' (' + a.sub + ')').join(', ')}. Сейчас в стакане: ${m.s ? `${m.s.what}; T = ${fx(m.T, 1)} °C, ΔT = ${sg(m.dT)} °C, теплота воды Q = c·m·ΔT = ${sg(m.Q, 2)} кДж${m.settled ? '' : ', температура ещё меняется'}` : 'чистая вода'}. Проведены: ${SAMP.filter(a => S.tested[a.id]).map(a => a.name).join(', ') || 'ничего'}. Разложены: ${SAMP.filter(a => S.sorted[a.id]).map(a => `${a.name} — ${S.sorted[a.id] === 'exo' ? 'экзо' : 'эндо'}`).join(', ') || 'ничего'}. Ошибок сортировки: ${S.wrong1}. Не говори, куда класть непроверенный опыт, — спроси, что показал термометр; объясни, что растворение NaOH и NH₄NO₃ — процесс с тепловым эффектом, хотя и не классическая реакция.`;
  if (id === 'equation') now = `Задача ${S.q + 1} из 3: «${m.qq.ask.join(' ')}» Уравнение: ${m.r.eq}. Варианты ответа: ${m.qq.opts.map(v => nf(v, 1)).join(', ')} кДж. На весах ${nf(m.m)} г ${m.r.f} = ${nf(m.n, 3)} моль (M = ${m.r.M} г/моль), это ×${nf(m.k, 3)} от уравнения. Решены: ${QS.map((q, i) => S.ans[i] ? 'задача ' + (i + 1) : '').filter(Boolean).join(', ') || 'ничего'}. Неверных ответов: ${S.wrong2}${S.bad2 !== null ? `, последний неверный — ${nf(S.bad2, 1)}` : ''}. Не называй ответ — веди через n = m/M и пропорцию, обрати внимание на коэффициент перед веществом в уравнении.`;
  if (id === 'bonds') now = `Мысленный опыт с энергиями связей для реакции ${m.r.eq}. Энергии связей (кДж/моль): ${Object.entries(BE).map(([b, e]) => b + ' ' + e).join(', ')}. Разорваны: ${m.r.R.map((k, i) => S.brk[i] ? MOLS[k].f : '').filter(Boolean).join(', ') || 'ничего'} (+${m.brk} кДж); образованы: ${m.r.P.map((k, i) => S.frm[i] ? MOLS[k].f : '').filter(Boolean).join(', ') || 'ничего'} (−${m.frm} кДж). ${m.allF ? `Итог Q = ${m.Q} кДж.` : ''} Вывод сделан: горение метана — ${S.f3.ch4 ? 'да' : 'нет'}, N₂ + O₂ — ${S.f3.no ? 'да' : 'нет'}, H₂ + Cl₂ — ${S.f3.hcl ? 'да' : 'нет'}. Ошибок: ${S.wrong3}. Не говори вывод прямо — спроси, на что ушло больше энергии. Подчеркни, что на диаграмме настоящий путь идёт через активированный комплекс, а не через полный распад на атомы.`;
  if (id === 'fuel') now = `Полка с топливом: ${FUELS.map(f => `${f.name} ≈${nf(f.q, 1)} МДж/кг, ${f.co2} г CO₂/МДж`).join('; ')} (CO₂ — при сжигании; для водорода и аккумулятора выбросы зависят от производства). Задача ${S.sc + 1}: ${m.sc.text.join(' ')} (${nf(m.sc.E)} МДж). Выбрано: ${m.f ? `${m.f.name}: ${kgTxt(m.mass)}, CO₂ ${kgTxt(m.co2)}` : 'ничего'}. Решены задачи: ${SC4.map((s, i) => S.pick[i] ? s.name : '').filter(Boolean).join(', ') || 'нет'}. Неверных выборов: ${S.wrong4}. Не называй топливо — спроси, какой показатель важнее в этой задаче.`;
  return [
    `Предмет: химия, 8–10 класс. Тема «Тепловой эффект химических реакций». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { exo: 'Как работает холодный пакет из аптечки?', equation: 'Почему теплоту делят на коэффициент в уравнении?', bonds: 'Почему горение выделяет тепло, если связи надо рвать?', fuel: 'Почему водород не везде заменил бензин?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
