<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по термодинамике: первый закон, работа газа на графике p–V, второй закон и тепловой насос, цикл Карно и КПД идеальной машины, тепловые машины и экология.">
<title>Термодинамика</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Термодинамика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов по термодинамике: цилиндр с газом, график p–V, бруски и тепловой насос. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const sg = (x, n = 0) => (x > 0 ? '+' : '') + fmt(x, n);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const LS_KEY = 'luch-phys-thermo';

// ---------- physics constants ----------
// Везде ν = 1 моль одноатомного идеального газа (гелий). p в кПа, V в литрах: p·V сразу в джоулях.
const R = 8.31, CV = 1.5 * R, CP = 2.5 * R;
const L1 = { T0: 300, p0: 100, qMin: -1000, qMax: 1500, target: 500 };
const V0L = R * L1.T0 / L1.p0;                       // 24,93 л
const P1 = [10, 300], P2 = [30, 100];                // состояния 1 и 2 урока «Работа газа»
const B3 = { C: 2000, k: 800, Th0: 353.15, Tc0: 293.15, pump: 14000, rest: 330, touch: 190 }; // Дж/К, Вт/К, К, Вт
const TK = T => T - 273.15;

const LESSONS = [
  { id: 'first', title: 'Первый закон',
    text: ['Газу можно передать энергию двумя путями: нагреть его (теплопередача, тепло Q) или сжать, то есть совершить над ним работу. Внутренняя энергия U — это энергия беспорядочного движения молекул. У одноатомного идеального газа U = 3/2 · νRT: чем горячее газ, тем она больше.',
           'Первый закон термодинамики — это закон сохранения энергии: Q = ΔU + A. Полученное тепло идёт на нагрев самого газа (ΔU) и на работу A, которую газ совершает, толкая поршень.',
           'В цилиндре 1 моль гелия при 300 K и 100 кПа. Если поршень закреплён, газ работы не совершает и всё тепло уходит в ΔU. Если поршень свободен (на нём груз, давление постоянное), часть тепла уходит в работу.'],
    why: 'Теплотехники городских ТЭЦ и котельных по этому закону считают, сколько топлива нужно, чтобы нагреть воду и получить пар. Инженеры по отоплению и вентиляции подбирают мощность котлов для домов и школ — это стабильная работа в любом городе. А в жизни: насос греется, когда качаешь шину, — работа превращается во внутреннюю энергию воздуха.',
    safe: 'Газ в закрытом сосуде при нагреве сильно повышает давление. Баллоны и аэрозольные баллончики нельзя нагревать и бросать в огонь — они взрываются.',
    task: 'Передайте газу 500 Дж тепла дважды: при закреплённом поршне и при свободном. Где газ нагреется сильнее?',
    hint: 'Нажатие на горелку — +50 Дж, если держать — греет непрерывно. Режим поршня меняют кнопки внизу; при смене режима газ начинает с 300 K заново. Точно — ползунком на вкладке «Схема».',

function ecoCalc(o, gridId) {
  const g = GRID[gridId];
  if (o.id === 'pump') {
    const e = 1 / o.cop, prim = g.eta ? e / (g.eta * LINE) : e / LINE;
    return { o, g, kind: 'pump', cop: o.cop, copMax: o.T1 / (o.T1 - o.T2), carnot: null, eta: null, prim, wastePer: prim - e, co2: g.f * (g.eta ? prim : e / LINE), plantLoss: g.eta ? 100 / (g.eta * LINE) - 100 : 100 / LINE - 100 };
  }
  if (o.id === 'ev') {
    const eta = g.eta ? g.eta * LINE * o.dev : LINE * o.dev;
    return { o, g, kind: 'ev', carnot: g.eta ? 1 - g.T2 / g.T1 : null, eta, use: 100 * eta, waste: 100 - 100 * eta, wastePer: (1 - eta) / eta, co2: g.f / eta };
  }
  return { o, g: null, kind: 'heat', carnot: 1 - o.T2 / o.T1, eta: o.eta, use: 100 * o.eta, waste: 100 - 100 * o.eta, wastePer: (1 - o.eta) / o.eta, co2: o.f / o.eta };
}
const ecoOpt = id => ECO.find(o => o.id === id);

function carnotGeo(T1, T2) {
  const r = Math.pow(T1 / T2, 1.5), V1 = 10, V2 = 20, V3 = V2 * r, V4 = V1 * r;
  const Q1 = R * T1 * Math.log(V2 / V1), Q2 = R * T2 * Math.log(V3 / V4), A = Q1 - Q2;
  return { V1, V2, V3, V4, r, Q1, Q2, A, eta: 1 - T2 / T1, p1: R * T1 / V1, p2: R * T1 / V2, p3: R * T2 / V3, p4: R * T2 / V4 };
}
// точка на цикле: этап k (0…3), доля f
function stagePt(g, T1, T2, k, f) {
  let V, T;
  if (k >= 4) { k = 0; f = 0; }
  if (k === 0) { V = g.V1 * Math.pow(g.V2 / g.V1, f); T = T1; }
  else if (k === 1) { V = g.V2 * Math.pow(g.V3 / g.V2, f); T = T1 * Math.pow(g.V2 / V, 2 / 3); }
  else if (k === 2) { V = g.V3 * Math.pow(g.V4 / g.V3, f); T = T2; }
  else { V = g.V4 * Math.pow(g.V1 / g.V4, f); T = T2 * Math.pow(g.V4 / V, 2 / 3); }
  return { V, T, p: R * T / V };
}

    return { kind: id, Th: S.Th, Tc: S.Tc, contact, pump: S.pump, W: S.W, Qflow: S.Qflow, Qp: S.Qp, dS };

  if (id === 'eco') {

}

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, f) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * f).toString(16).padStart(2, '0')).join(''); };
function heatCol(T, lo, hi) { const f = clamp((T - lo) / (hi - lo), 0, 1); return f < 0.5 ? mixC('#4f8fe0', '#9aa6bd', f * 2) : mixC('#9aa6bd', '#ef6a3c', (f - 0.5) * 2); }
const tri = z => { const m = ((z % 2) + 2) % 2; return 1 - Math.abs(m - 1); };
const DOTS = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 44; i++) DOTS.push({ u: r() * 2, v: r() * 2, a: r() * 2 - 1, b: r() * 2 - 1 }); }
function gasDots(x, y, w, h, T, t, n) {
  if (w < 6 || h < 6) return '';
  const sp = reduce ? 0 : 0.00022 * Math.sqrt(Math.max(T, 20) / 300);
  let s = '';
  for (let i = 0; i < n; i++) {
    const d = DOTS[i], px = x + 4 + tri(d.u + d.a * sp * t) * (w - 8), py = y + 4 + tri(d.v + d.b * sp * t * 1.3) * (h - 8);
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.3" fill="#eef3fa" opacity=".85"/>`;
  }
  return s;
}

    const k = 0.9, y0 = 164, hu = m.use * k, hw = m.waste * k, xs = 296;

    const wave = reduce ? 0 : Math.sin(t / 300) * 2;

function hlBox(id) {
  const m = model();

    const gt = CYL.bot - m.V * CYL.k;

  if (LID() === 'second') return { hot: [104, 160, 102, 204], cold: [S.cx - 6, 160, 102, 204], pump: [212, 70, 86, 90], pads: [108, 336, S.cx + 90 - 108, 26] }[id];
  if (LID() === 'eco') return { list: [8, 296, 510, 64], scale: [188, 52, 316, 96], flow: [188, 146, 316, 166], co2: [8, 214, 182, 76] }[id];
  return { plate: [26, 296, 138, 40], cyl: [32, 76, 126, 224], chart: [190, 120, 314, 240] }[id];

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = bench();
  if (id === 'first') h += firstSVG(m, t);
  else if (id === 'work') h += workSVG(m, t);
  else if (id === 'second') h += secondSVG(m, t);
  else if (id === 'eco') h += ecoSVG(m, t);
  else h += carnotSVG(m, t);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 500, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 262 - VB.w / 2; VB.y = 400 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- actions ----------
let drag = null, dirty = true, acc = 0, lastUpd = 0, traceAcc = 0;
function addQ(d) {
  const nq = clamp(S.q + d, L1.qMin, L1.qMax);
  if (nq === S.q) { toast(d > 0 ? 'Хватит греть: дальше опыт не рассчитан.' : 'Хватит охлаждать.'); return false; }
  S.q = nq; if (d > 0) S.flame = performance.now() + 260; else S.cold = performance.now() + 500;
  update(); return true;
}
function setMode(md) { if (md === S.mode) return; S.mode = md; S.q = 0; toast(md === 'fix' ? 'Поршень закреплён. Газ снова 300 K.' : 'Поршень свободен, на нём груз. Газ снова 300 K.'); renderTools(); buildScheme(); update(); }
function moveTo(V, p) {
  const [V0, p0] = S.path[S.path.length - 1];
  if (V === V0 && p === p0) return;
  S.A2 += (p0 + p) / 2 * (V - V0);
  S.path.push([V, p]); if (S.path.length > 900) S.path.splice(1, 1);
  if (V === P2[0] && p === P2[1]) { S.arr.push(S.A2); if (S.arr.length > 6) S.arr.shift(); toast(`Газ в состоянии 2. Работа газа ${fmt(S.A2 / 1000, 2)} кДж.`); }
  update();
}
function goHome() { S.path = [P1.slice()]; S.A2 = 0; update(); }
function pumpStep(Qc) {
  const n = Math.max(1, Math.ceil(Qc / 25)), dq = Qc / n;
  for (let i = 0; i < n; i++) {
    if (S.Tc - dq / B3.C < 230) { S.pump = false; toast('Правый брусок слишком остыл, насос остановлен.'); break; }
    const A = dq * (S.Th / S.Tc - 1);
    S.Tc -= dq / B3.C; S.Th += (dq + A) / B3.C; S.W += A; S.Qp += dq;
    if (S.mixed && S.Th >= B3.Th0) { if (S.pump) { S.pump = false; toast('Левый брусок снова 80 °C. Насос остановлен.'); } break; }
  }
}
function setT(T1, T2) {
  T2 = clamp(Math.round(T2 / 10) * 10, 200, 400); T1 = clamp(Math.round(T1 / 10) * 10, 300, 1000);
  if (T1 < T2 + 50) T1 = T2 + 50;
  S.T1 = T1; S.T2 = T2; S.run = false; S.ph = 0; update();
}
function startRun() { S.ph = 0; S.run = true; update(); }
function pickEco(id) {
  if (!ecoOpt(id) || id === S.pick) return;
  S.pick = id; S.seen[id] = true;
  const c = ecoCalc(ecoOpt(id), S.grid);
  if (S.found && ecoOpt(id).group === 'power' && id !== 'ccgt') toast(`${ecoOpt(id).name}: на 1 кВт·ч электричества уходит впустую ≈ ${fmt(c.wastePer, 2)} кВт·ч тепла.`);
  renderTools(); buildScheme(); update();
}
function setGrid(g) { if (!GRID[g] || g === S.grid) return; S.grid = g; renderTools(); buildScheme(); update(); }
function setGuess(v) { v = clamp(Math.round(v), 0, 100); if (v === S.guess) return; S.guess = v; update(); }
function checkGuess() {
  const m = model();
  if (m.mode === 'pump') { toast('У теплового насоса предел — коэффициент T₁ / (T₁ − T₂), его считают на вкладке «Расчёты».'); return; }
  if (m.carnot == null) { toast('Ветер и солнце — не тепловые машины: предел Карно к ним не относится.'); return; }
  const T1 = m.mode === 'ev' ? m.g.T1 : m.o.T1, T2 = m.mode === 'ev' ? m.g.T2 : m.o.T2;
  if (S.guess === Math.round(m.carnot * 100)) {
    if (S.pick === 'coal' && !S.found) { S.found = true; toast(`Верно: 1 − 300 / 840 ≈ 64 %. А реальный КПД ТЭС — около 37 %. Теперь найдите станцию с наименьшими потерями.`); }
    else toast(`Верно: 1 − ${T2} / ${T1} ≈ ${Math.round(m.carnot * 100)} %, а реально ${fmt(m.eta * 100, 0)} %.`);
    update();
  } else toast(`Пока не так. Подставьте T₁ = ${T1} K и T₂ = ${T2} K в η_max = 1 − T₂ / T₁ и округлите до целых процентов.`);
}

const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const id = el.dataset.drag; e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  const p = toSvg(e);
  drag = { id, t0: performance.now(), x: e.clientX, y: e.clientY, moved: false, dx: id === 'cold' ? S.cx - p.x : 0 };
  acc = 0;
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.moved) return;
  const p = toSvg(e);
  if (drag.id === 'pt') {
    const [V0, p0] = S.path[S.path.length - 1];
    // «прилипание»: по второстепенной оси точка держит прежнее значение, чтобы легко провести изобару или изохору
    const dx = Math.abs(p.x - WX(V0)), dy = Math.abs(p.y - WY(p0)), horiz = dx >= dy;
    const V = !horiz && dx < 10 ? V0 : Math.round((p.x - 180) / 8);
    const pp = horiz && dy < 10 ? p0 : Math.round((360 - p.y) / 0.6 / 10) * 10;
    moveTo(clamp(V, 5, 38), clamp(pp, 20, 380));
  } else if (drag.id === 'cold') {
    let x = clamp(p.x + drag.dx, B3.touch, 390); if (x < B3.touch + 6) x = B3.touch;
    if (x !== S.cx) { const was = S.cx <= B3.touch + 1; S.cx = x; if (was !== (x <= B3.touch + 1)) { renderTools(); update(); } }
  } else if (drag.id === 'gs') setGuess((p.x - SX(0)) / 3);
  dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) return;
  if (!d.moved) {
    if (d.id === 'burner' && performance.now() - d.t0 < 250) addQ(50);
    if (d.id === 'pump') act('pump');
    if (d.id === 'pt') toast('Тащите точку, не отпуская.');
    if (d.id.startsWith('o-')) pickEco(d.id.slice(2));
    if (d.id === 'gs') toast('Тащите треугольник вдоль шкалы или жмите «Ответ ±1».');
  }
  dirty = true;
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

let last = performance.now(), lastDraw = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  const id = LID(); let anim = false;
  if (drag && drag.id === 'burner' && t - drag.t0 > 250) {
    acc += dt; anim = true;
    while (acc >= 0.08) { acc -= 0.08; if (!addQ(10)) { acc = 0; drag = null; break; } }
  }
  if (id === 'second') {
    const contact = S.cx <= B3.touch + 1; let changed = false;
    if (contact && Math.abs(S.Th - S.Tc) > 1e-4) {
      for (let i = 0; i < 4; i++) { const q = B3.k * (S.Th - S.Tc) * dt / 4; S.Th -= q / B3.C; S.Tc += q / B3.C; S.Qflow += q; }
      changed = true;
      if (!S.mixed && Math.abs(S.Th - S.Tc) < 0.3) { S.mixed = true; toast(`Равновесие: оба бруска ≈ ${fmt(TK((S.Th + S.Tc) / 2), 1)} °C. Теперь верните левому 80 °C.`); }
    }
    if (S.pump) { pumpStep(B3.pump * dt); changed = true; if (!S.pump) lastUpd = -1e9; }
    if (changed) {
      traceAcc += dt; if (traceAcc > 0.2) { traceAcc = 0; S.trace.push([S.Th, S.Tc]); if (S.trace.length > 300) S.trace.splice(0, S.trace.length - 300); }
      anim = true; if (t - lastUpd > 150) { lastUpd = t; update(); }
    }
  }
  if (id === 'carnot' && S.run) {
    const k0 = Math.floor(S.ph);
    S.ph = Math.min(4, S.ph + dt / (reduce ? 0.3 : 1.4)); anim = true;
    if (S.ph >= 4) { S.run = false; S.cycles++; S.doneKey = S.T1 + '/' + S.T2; const g = carnotGeo(S.T1, S.T2); toast(`Цикл пройден: работа ${fmt(g.A, 0)} Дж, КПД ${fmt(g.eta * 100, 1)} %.`); update(); }
    else if (Math.floor(S.ph) !== k0) update();
  }
  if (S.hl) anim = true;
  const drift = !reduce && id !== 'second' && t - lastDraw > 40;
  if (dirty || anim || drift) { drawScene(t); dirty = false; lastDraw = t; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

let toolsSig = '';
function renderTools(force) {
  const id = LID(), tb = $('#tools');
  const contact = S.cx <= B3.touch + 1;
  const sig = id + S.mode + contact + S.pump + S.run + S.pick + S.grid + force;
  const eo = ecoOpt(S.pick) || {};
  if (sig === toolsSig && !force) return; toolsSig = sig;
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    first: B('fix', 'Закреплён', S.mode === 'fix') + B('free', 'Свободен', S.mode === 'free') + sep + B('q50', '+50 Дж') + B('qm50', '−50 Дж') + sep + B('reset', 'Заново'),
    work: B('home', 'В точку 1') + B('pathLow', 'Вниз, потом вправо') + B('pathLine', 'По прямой'),
    second: B('contact', contact ? 'Развести' : 'Свести') + B('pump', 'Насос', S.pump) + B('pump1', 'Насос +1 кДж') + sep + B('reset', 'Заново'),
    carnot: B('run', 'Цикл ▶', S.run) + sep + B('t1m', 'T₁ −50') + B('t1p', 'T₁ +50') + B('t2m', 'T₂ −10') + B('t2p', 'T₂ +10'),
    eco: (eo.grid ? B('g-coal', 'Сеть: уголь', S.grid === 'coal') + B('g-gas', 'газ', S.grid === 'gas') + B('g-wind', 'ветер и солнце', S.grid === 'wind') + sep : '') +
      (eo.id === 'pump' ? '' : B('gm1', 'Ответ −1') + B('gp1', 'Ответ +1') + B('check', 'Проверить')),
  }[id];

function act(a) {
  if (a === 'fix' || a === 'free') return setMode(a);
  if (a === 'q50') return addQ(50);
  if (a === 'qm50') return addQ(-50);
  if (a === 'reset') { resetState(); renderTools(); buildScheme(); update(); return; }
  if (a === 'home') return goHome();
  if (a === 'pathLow') { goHome(); moveTo(10, 100); moveTo(30, 100); return; }
  if (a === 'pathLine') { goHome(); moveTo(30, 100); return; }
  if (a === 'contact') { S.cx = S.cx <= B3.touch + 1 ? B3.rest : B3.touch; renderTools(); update(); return; }
  if (a === 'pump') { S.pump = !S.pump; if (S.pump && S.cx <= B3.touch + 1) toast('Бруски касаются: часть тепла будет утекать обратно.'); renderTools(); update(); return; }

  if (a === 't1m') return setT(S.T1 - 50, S.T2);
  if (a === 't1p') return setT(S.T1 + 50, S.T2);
  if (a === 't2m') return setT(S.T1, S.T2 - 10);
  if (a === 't2p') return setT(S.T1, S.T2 + 10);
  if (a.startsWith('o-')) return pickEco(a.slice(2));
  if (a.startsWith('g-')) return setGrid(a.slice(2));
  if (a === 'gcycle') { const ks = Object.keys(GRID); return setGrid(ks[(ks.indexOf(S.grid) + 1) % ks.length]); }
  if (a === 'plant') { const ps = ['coal', 'gt', 'ccgt'], i = ps.indexOf(S.pick); return pickEco(ps[(i + 1) % ps.length]); }
  if (a === 'cars') return pickEco(S.pick === 'car' ? 'ev' : 'car');
  if (a === 'gm1') return setGuess(S.guess - 1);
  if (a === 'gp1') return setGuess(S.guess + 1);
  if (a === 'check') return checkGuess();
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const J = x => fmt(x, 0) + ' Дж';

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'first') return `Q = ${S.q} Дж · закреплён ${S.rec.fix ? '✓' : '—'} · свободен ${S.rec.free ? '✓' : '—'}`;
  if (L.id === 'work') return `A = ${fmt(m.A / 1000, 2)} кДж · ${m.at2 ? 'газ в состоянии 2' : m.at1 ? 'газ в состоянии 1' : `V ${m.V} л, p ${m.p} кПа`}`;
  if (L.id === 'second') return S.mixed ? `Равновесие было ✓ · левый ${fmt(TK(m.Th), 1)} °C из 80` : `Левый ${fmt(TK(m.Th), 1)} °C · правый ${fmt(TK(m.Tc), 1)} °C`;
  if (L.id === 'eco') return `Предел Карно ТЭС ${S.found ? '✓' : '—'} · станция с наименьшими потерями ${S.found && S.pick === 'ccgt' ? '✓' : '—'} · сейчас: ${m.o.short}`;
  return `η = ${fmt(m.eta * 100, 1)} % · циклов ${S.cycles}${S.run ? ' · идёт цикл' : ''}`;
}
// урок 5: сравнение всех вариантов на 1 кВт·ч пользы
function ecoCompareSVG() {
  const rows = ECO.map(o => ({ o, c: ecoCalc(o, S.grid) })), rh = 11, H0 = 10; // полосы: впустую 44…74, CO₂ 86…112
  const maxW = 3.2, maxC = 1.3;
  let h = `<svg class="diag" viewBox="0 0 120 ${H0 + rows.length * rh + 6}" role="img" aria-label="Сравнение вариантов: тепло впустую и CO₂ на 1 кВт·ч пользы">`;
  h += `<text x="44" y="5" font-size="3.4" fill="#ff8a73">впустую, кВт·ч</text><text x="86" y="5" font-size="3.4" fill="#a9b4c9">CO₂, кг</text>`;
  rows.forEach(({ o, c }, i) => {
    const y = H0 + i * rh, on = o.id === S.pick, ww = clamp(c.wastePer / maxW, 0, 1) * 28, cw = clamp(c.co2 / maxC, 0, 1) * 22;
    if (on) h += `<rect x="0" y="${y - 1.5}" width="120" height="${rh - 1}" fill="#2c3954"/>`;
    h += `<rect x="1" y="${y}" width="1.4" height="6" fill="${GCOL[o.group]}"/><text x="4" y="${y + 4.6}" font-size="3.8" fill="${on ? '#e8ecf4' : '#a9b4c9'}">${o.short}</text>`;
    h += `<rect x="44" y="${y + 0.5}" width="${Math.max(0.4, ww).toFixed(2)}" height="5" fill="#ff6a4a" opacity=".7"/><text x="${(45 + ww).toFixed(2)}" y="${y + 4.4}" font-size="3.3" fill="#ff8a73">${fmt(c.wastePer, 2)}</text>`;
    h += `<rect x="86" y="${y + 0.5}" width="${Math.max(0.4, cw).toFixed(2)}" height="5" fill="#8b96ad"/><text x="${(87 + cw).toFixed(2)}" y="${y + 4.4}" font-size="3.3" fill="#c8d1e2">${fmt(c.co2, 2)}</text>`;
  });
  return h + `</svg>`;
}

function energyBar(parts, max, label) {
  let h = `<svg class="diag" viewBox="0 0 120 30" role="img" aria-label="${label}">`, x = 4;
  for (const p of parts) {
    const w = Math.abs(p.v) / max * 112;
    if (w > 0.2) { h += `<rect x="${x.toFixed(2)}" y="6" width="${w.toFixed(2)}" height="9" fill="${p.c}" opacity="${p.v < 0 ? .45 : .85}"/>`; h += `<text x="${(x + w / 2).toFixed(2)}" y="24" font-size="3.6" fill="#e8ecf4" text-anchor="middle">${p.n} ${sg(p.v, 0)}</text>`; x += w; }
  }
  if (x === 4) h += `<text x="60" y="13" font-size="4" fill="#8b96ad" text-anchor="middle">пока тепла не передавали</text>`;
  return h + `</svg>`;
}
function traceSVG() {
  const T = S.trace, lo = 270, hi = 370, n = Math.max(T.length - 1, 1);
  const X = i => 10 + i / n * 106, Y = v => 50 - (v - lo) / (hi - lo) * 44;
  let h = `<svg class="diag" viewBox="0 0 120 56" role="img" aria-label="Температуры брусков во времени"><rect x="10" y="6" width="106" height="44" fill="none" stroke="#26324a" stroke-width=".5"/>`;
  for (const c of [20, 50, 80]) h += `<path d="M10 ${Y(c + 273.15)}H116" stroke="#26324a" stroke-width=".4" stroke-dasharray="1.5 1.5"/><text x="8.5" y="${Y(c + 273.15) + 1.2}" font-size="3.4" fill="#8b96ad" text-anchor="end">${c}°</text>`;
  const line = k => T.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(clamp(v[k], lo, hi)).toFixed(2)).join('');
  h += `<path d="${line(0)}" stroke="#ef6a3c" stroke-width=".9" fill="none"/><path d="${line(1)}" stroke="#4f8fe0" stroke-width=".9" fill="none"/>`;
  h += `<text x="116" y="54.5" font-size="3.4" fill="#8b96ad" text-anchor="end">время →</text>`;
  return h + `</svg>`;
}

function slider(id, label, min, max, stepv, val) {

}

      <div class="ctl"><div class="lbl">Вариант</div><div class="chips" id="ecoChips">${ECO.map(o => `<button data-o="${o.id}" aria-pressed="${o.id === S.pick}">${o.short}</button>`).join('')}</div></div>

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const d = el.querySelector('#sDiag');
  if (id === 'first') {
    if (d) d.innerHTML = energyBar([{ n: 'ΔU', v: m.dU, c: '#ffb547' }, { n: 'A', v: m.A, c: '#72d4e8' }], 1500, 'Распределение тепла');
    set('#r1', fmt(m.T, 1) + ' K'); set('#r2', J(m.dU)); set('#r3', J(m.A)); set('#r4', fmt(m.V, 2) + ' л'); set('#r5', fmt(m.p, 1) + ' кПа'); set('#r6', sg(m.dT, 1) + ' K');
    set('#inQO', S.q + ' Дж'); val('#inQ', S.q);
    el.querySelectorAll('#modeChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === S.mode));
  } else if (id === 'work') {
    set('#r1', m.V + ' л'); set('#r2', m.p + ' кПа'); set('#r3', fmt(m.T, 0) + ' K'); set('#r4', fmt(m.A / 1000, 2) + ' кДж');
    if (d) d.innerHTML = S.arr.length ? `<div class="steps">${S.arr.map((a, i) => step(`приход ${i + 1}`, fmt(a / 1000, 2) + ' кДж')).join('')}</div>` : '<p class="note">Пока газ в состояние 2 не приходил.</p>';
  } else if (id === 'second') {
    if (d) d.innerHTML = traceSVG();
    set('#r1', fmt(TK(m.Th), 1) + ' °C'); set('#r2', fmt(TK(m.Tc), 1) + ' °C'); set('#r3', fmt(m.W / 1000, 2) + ' кДж');
  } else if (id === 'eco') {
    if (d) d.innerHTML = ecoCompareSVG();
    const pm = m.mode === 'pump';
    set('#r1', pm ? `тепла ×${m.cop}` : fmt(m.eta * 100, 0) + ' %');
    set('#r2', pm ? `×${fmt(m.copMax, 1)}` : m.carnot == null ? 'нет' : m.hidden ? '?' : fmt(m.carnot * 100, 0) + ' %');
    set('#r3', fmt(m.wastePer, 2) + ' кВт·ч'); set('#r4', '≈ ' + fmt(m.co2, 2) + ' кг');
    set('#inGuessO', S.guess + ' %'); val('#inGuess', S.guess);
    el.querySelectorAll('#ecoChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.o === S.pick));
    el.querySelectorAll('#gridChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === S.grid));
  } else {
    if (d) d.innerHTML = energyBar([{ n: 'A', v: m.A, c: '#72d4e8' }, { n: 'Q₂', v: m.Q2, c: '#8b96ad' }], m.Q1, 'Распределение тепла нагревателя');
    set('#r1', fmt(m.eta * 100, 1) + ' %'); set('#r2', J(m.Q1)); set('#r3', J(m.A));
    set('#inT1O', S.T1 + ' K'); set('#inT2O', S.T2 + ' K'); val('#inT1', S.T1); val('#inT2', S.T2);
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'first') {
    let h = `<h2>Первый закон</h2><div class="formula">Q = ΔU + A</div><p class="note">ν = 1 моль, R = 8,31 Дж/(моль·K). Одноатомный газ: ΔU = 3/2 · νRΔT.</p><h3>Сейчас: поршень ${m.fix ? 'закреплён' : 'свободен'}</h3><div class="steps">` +
      step('Q', J(m.Q));
    if (m.fix) h += step('A = p·ΔV', 'ΔV = 0, значит A = 0') + step('ΔU = Q', J(m.dU)) + step('ΔT = ΔU / (3/2 · νR)', `${fmt(m.dU, 0)} / 12,465 = ${sg(m.dT, 2)} K`) + step('p = νRT / V', `8,31 × ${fmt(m.T, 1)} / ${fmt(V0L, 2)} = ${fmt(m.p, 1)} кПа`);
    else h += step('Q = 5/2 · νRΔT', `ΔT = ${fmt(m.Q, 0)} / 20,775 = ${sg(m.dT, 2)} K`) + step('ΔU = 3/2 · νRΔT', `12,465 × ${fmt(m.dT, 2)} = ${J(m.dU)}`) + step('A = pΔV = νRΔT', `8,31 × ${fmt(m.dT, 2)} = ${J(m.A)}`) + step('V = νRT / p', `8,31 × ${fmt(m.T, 1)} / 100 = ${fmt(m.V, 2)} л`);
    h += step('проверка ΔU + A', `${fmt(m.dU, 0)} + ${fmt(m.A, 0)} = ${J(m.dU + m.A)}`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">При свободном поршне из каждых 5 частей тепла 3 идут на нагрев и 2 — на работу. Поэтому при p = const газ нагревается слабее.</p>`;
    if (S.rec.fix || S.rec.free) h += `<h3>Ваши опыты с Q = 500 Дж</h3><div class="steps">` + (S.rec.fix ? step('поршень закреплён', `ΔT = ${sg(S.rec.fix.dT, 1)} K`) : '') + (S.rec.free ? step('поршень свободен', `ΔT = ${sg(S.rec.free.dT, 1)} K`) : '') + `</div>`;
    return h;
  }
  if (id === 'work') {
    const P = S.path, segs = [];
    for (let i = Math.max(1, P.length - 6); i < P.length; i++) { const [Va, pa] = P[i - 1], [Vb, pb] = P[i]; segs.push(step(`${Va}→${Vb} л, ${pa}→${pb} кПа`, `${fmt((pa + pb) / 2, 0)} × ${sg(Vb - Va, 0)} = ${sg((pa + pb) / 2 * (Vb - Va), 0)} Дж`)); }
    return `<h2>Работа газа</h2><div class="formula">A = p · ΔV</div><p class="note">1 кПа · 1 л = 1000 Па · 0,001 м³ = 1 Дж. Если давление на участке меняется линейно, берут среднее давление (площадь трапеции).</p>
      <h3>Последние участки пути</h3><div class="steps">${segs.join('') || step('пока', 'точка не двигалась')}${step('всего A газа', `${fmt(m.A, 0)} Дж = ${fmt(m.A / 1000, 2)} кДж`, 'sum')}</div>
      <h3>Пример: путь «вниз, потом вправо»</h3><div class="steps">${step('1 → (10 л; 100 кПа)', 'ΔV = 0, A = 0')}${step('→ 2 при 100 кПа', '100 × (30 − 10) = 2000 Дж')}${step('итого', '2 кДж', 'sum')}</div>
      <h3>Энергия в точках 1 и 2</h3><div class="steps">${step('p₁V₁', '300 × 10 = 3000 Дж')}${step('p₂V₂', '100 × 30 = 3000 Дж')}${step('T₁ = T₂ = pV / νR', '3000 / 8,31 ≈ 361 K')}${step('ΔU от 1 до 2', '0, значит Q = A', 'sum')}</div>`;
  }
  if (id === 'second') {
    const Tf = (B3.Th0 + B3.Tc0) / 2, Tc2 = Tf * Tf / B3.Th0, Wmin = B3.C * (B3.Th0 - Tf) - B3.C * (Tf - Tc2);
    let h = `<h2>Второй закон</h2><div class="formula">Q = C · ΔT</div><p class="note">C = 2000 Дж/К у каждого бруска. Тепло через контакт идёт от горячего к холодному, никогда наоборот.</p><h3>Сейчас</h3><div class="steps">` +
      step('перешло через контакт', `${fmt(m.Qflow / 1000, 2)} кДж`) +
      step('левый брусок', `${fmt(TK(m.Th), 2)} °C`) + step('правый брусок', `${fmt(TK(m.Tc), 2)} °C`) +
      step('насос взял у правого Q₂', `${fmt(m.Qp / 1000, 2)} кДж`) + step('насос потратил работу A', `${fmt(m.W / 1000, 2)} кДж`) + step('отдал левому Q₁ = Q₂ + A', `${fmt((m.Qp + m.W) / 1000, 2)} кДж`, 'sum') + `</div>`;
    h += `<h3>Идеальный насос</h3><div class="formula">A = Q₂ · (T₁ / T₂ − 1)</div><p class="note">T₁ и T₂ — температуры горячего и холодного тела в кельвинах. Чем больше разница, тем дороже перекачать каждый джоуль.</p>`;
    h += `<h3>Почему «как было» не получится</h3><div class="steps">` + step('равновесие', `(80 + 20) / 2 = ${fmt(TK(Tf), 0)} °C`) + step('после насоса правый', `≈ ${fmt(TK(Tc2), 1)} °C, а не 20 °C`) + step('минимум работы', `≈ ${fmt(Wmin / 1000, 1)} кДж`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Работа насоса превратилась в лишнее тепло, поэтому правый брусок остаётся теплее, чем был. Энтропия — мера беспорядка — при выравнивании выросла на ${fmt(B3.C * Math.log(Tf / B3.Th0) + B3.C * Math.log(Tf / B3.Tc0), 1)} Дж/К, и никакая машина не уменьшит её даром. Сейчас изменение: ${sg(m.dS, 1)} Дж/К.</p>`;
    return h;
  }
  if (id === 'eco') {
    const o = m.o, pc = x => fmt(x * 100, 0) + ' %';
    let h = `<h2>${o.name}</h2>`;
    if (m.mode === 'pump') {
      h += `<div class="formula">k_max = T₁ / (T₁ − T₂)</div><p class="note">Тепловой насос — тепловая машина «наоборот»: он не производит тепло, а перекачивает его с улицы в дом, тратя работу. Его предел тоже задают температуры в кельвинах.</p><div class="steps">` +
        step('T₁ (вода в батареях 45 °C)', `${o.T1} K`) + step('T₂ (улица 0 °C)', `${o.T2} K`) +
        step('k_max', `${o.T1} / (${o.T1} − ${o.T2}) = ${fmt(m.copMax, 1)}`) + step('реально', `около ${o.cop}: 1 кВт·ч электричества → ${o.cop} кВт·ч тепла`) +
        step('сеть: ' + m.g.name, m.g.eta ? `на 1 кВт·ч тепла сжечь ≈ ${fmt(m.prim, 2)} кВт·ч топлива` : 'топливо не сжигают') +
        step('CO₂ на 1 кВт·ч тепла', `≈ ${fmt(m.co2, 2)} кг`, 'sum') + `</div>
        <p class="note" style="margin-top:10px">Для сравнения: газовый котёл с КПД около 90 % даёт ≈ ${fmt(0.20 / 0.9, 2)} кг CO₂ на 1 кВт·ч тепла, электрический обогреватель от угольной сети ≈ ${fmt(0.34 / (0.37 * LINE), 1)} кг. Чем меньше разница температур улицы и батарей, тем выгоднее насос — поэтому любят тёплые полы с водой около 35 °C.</p>`;
    } else {
      const T1 = m.mode === 'ev' ? (m.g.T1 || 0) : o.T1, T2 = m.mode === 'ev' ? (m.g.T2 || 0) : o.T2;
      h += `<div class="formula">η_max = 1 − T₂ / T₁</div><div class="steps">`;
      if (m.carnot != null) h += step('T₁, T₂', `${T1} K, ${T2} K${m.mode === 'ev' ? ' (электростанция)' : ''}`) + step('η_max', m.hidden ? `1 − ${T2} / ${T1} = ?` : `1 − ${T2} / ${T1} = ${fmt(m.carnot, 3)} ≈ ${pc(m.carnot)}`);
      else h += step('ветер и солнце', 'не тепловые машины: предела Карно нет');
      if (m.mode === 'ev') h += step('цепочка', `${m.g.eta ? `станция ${pc(m.g.eta)} × ` : ''}провода ${pc(LINE)} × зарядка и мотор ${pc(o.dev)} = ${pc(m.eta)}`);
      else h += step('реальный КПД', `около ${pc(m.eta)}`) + (m.hidden ? '' : step('доля от предела', `${pc(m.eta)} / ${pc(m.carnot)} ≈ ${fmt(m.eta / m.carnot, 2)}`));
      h += step('тепло впустую на 1 кВт·ч', `(1 − η) / η = ${fmt(m.wastePer, 2)} кВт·ч`);
      h += step('CO₂ на 1 кВт·ч пользы', m.mode === 'ev' && !m.g.eta ? `≈ ${fmt(m.co2, 2)} кг (строительство станций)` : `${fmt(m.mode === 'ev' ? m.g.f : o.f, 2)} / ${fmt(m.eta, 3)} ≈ ${fmt(m.co2, 2)} кг`, 'sum') + `</div>`;
      h += `<p class="note" style="margin-top:10px">${m.mode === 'ev' ? 'При сжигании топлива на каждый кВт·ч тепла выделяется около 0,34 кг CO₂ у угля и 0,20 кг у газа.' : `При сгорании топлива «${o.fuel}» на каждый кВт·ч тепла выделяется около ${fmt(o.f, 2)} кг CO₂.`} Делим на КПД — получаем CO₂ на кВт·ч пользы. ${o.group === 'move' && o.id !== 'ev' ? 'Предел посчитан грубо: газ в цилиндре такой горячий лишь в момент вспышки.' : ''}</p>`;
    }
    h += `<h3>Как поднять КПД и снизить выбросы</h3><div class="steps">` +
      step('T₁ выше', 'пар 600–620 °C вместо 540 °C: нужны жаропрочные стали') +
      step('парогазовый цикл', 'выхлоп газовой турбины (≈ 600 °C) кипятит воду для паровой турбины: 38 % → около 58–60 %') +
      step('когенерация (ТЭЦ)', 'сбросное тепло идёт на отопление: полезно используется до 80–90 % тепла топлива') +
      step('тепловой насос', 'тепло не сжигают, а перекачивают с улицы: из 1 кВт·ч — около 3 кВт·ч тепла') +
      step('без сжигания', 'ветер, солнце, ГЭС: CO₂ почти только при строительстве', 'sum') + `</div>`;
    return h;
  }
  return `<h2>Цикл Карно</h2><div class="formula">η = 1 − T₂ / T₁</div><h3>Сейчас</h3><div class="steps">` +
    step('T₁, T₂', `${S.T1} K, ${S.T2} K`) + step('η', `1 − ${S.T2} / ${S.T1} = ${fmt(m.eta, 4)} = ${fmt(m.eta * 100, 1)} %`) +
    step('Q₁ = νRT₁ · ln(V₂/V₁)', `8,31 × ${S.T1} × ln 2 = ${J(m.Q1)}`) + step('A = η · Q₁', J(m.A)) + step('Q₂ = Q₁ − A', J(m.Q2), 'sum') + `</div>
    <h3>Этапы цикла</h3><div class="steps">${STAGES.map((s, i) => step(`${i + 1} → ${(i + 1) % 4 + 1}`, s)).join('')}</div>
    <p class="note" style="margin-top:10px">На адиабатах TV^(2/3) = const, поэтому V₃ / V₂ = (T₁ / T₂)^1,5 = ${fmt(m.r, 2)}. Реальные машины теряют больше: у ТЭЦ с паром около 560 °C (≈ 833 K) и охлаждением около 30 °C (≈ 303 K) предел Карно ≈ ${fmt((1 - 303 / 833) * 100, 0)} %, а на деле около 40 %.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'first') el.innerHTML = `<div class="k">Q = ΔU + A</div><div class="v">${fmt(m.Q, 0)} = ${fmt(m.dU, 0)} + ${fmt(m.A, 0)}</div><div class="lr"><span>T</span><span>${fmt(m.T, 1)} K</span></div><div class="lr"><span>V</span><span>${fmt(m.V, 2)} л</span></div>`;
  else if (id === 'work') el.innerHTML = `<div class="k">Работа газа</div><div class="v ${S.done.work ? 'ok' : ''}">A = ${fmt(m.A / 1000, 2)} кДж</div><div class="lr"><span>V</span><span>${m.V} л</span></div><div class="lr"><span>p</span><span>${m.p} кПа</span></div>`;
  else if (id === 'second') el.innerHTML = `<div class="k">Температуры</div><div class="v">${fmt(TK(m.Th), 1)} / ${fmt(TK(m.Tc), 1)} °C</div><div class="gauge"><b style="width:${clamp(TK(m.Th), 0, 100).toFixed(1)}%;background:#ef6a3c"></b><i style="left:80%"></i></div><div class="lr"><span>работа насоса</span><span>${fmt(m.W / 1000, 2)} кДж</span></div>`;
  else if (id === 'eco') el.innerHTML = m.mode === 'pump'
    ? `<div class="k">Тепла из 1 кВт·ч</div><div class="v">≈ ${m.cop} кВт·ч</div><div class="lr"><span>предел</span><span>${fmt(m.copMax, 1)}</span></div><div class="lr"><span>CO₂</span><span>≈ ${fmt(m.co2, 2)} кг/кВт·ч</span></div>`
    : `<div class="k">КПД · ${m.o.short}</div><div class="v ${S.done.eco ? 'ok' : ''}">${fmt(m.eta * 100, 0)} %</div><div class="lr"><span>предел Карно</span><span>${m.carnot == null ? 'нет' : m.hidden ? '?' : fmt(m.carnot * 100, 0) + ' %'}</span></div><div class="lr"><span>CO₂</span><span>≈ ${fmt(m.co2, 2)} кг/кВт·ч</span></div>`;
  else el.innerHTML = `<div class="k">КПД идеальной машины</div><div class="v ${S.done.carnot ? 'ok' : ''}">η = ${fmt(m.eta * 100, 1)} %</div><div class="lr"><span>T₁</span><span>${S.T1} K</span></div><div class="lr"><span>T₂</span><span>${S.T2} K</span></div>${m.k >= 0 ? `<div class="lr"><span>этап</span><span>${m.k + 1} из 4</span></div>` : ''}`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (L.id === 'first' && S.q === L1.target && !S.rec[S.mode]) { S.rec[S.mode] = { dT: m.dT }; toast(`Q = 500 Дж: газ нагрелся на ${fmt(m.dT, 1)} K${S.mode === 'free' ? `, совершил работу ${fmt(m.A, 0)} Дж` : ''}.`); }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Термодинамика покорена!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  if (L.id === 'second' || L.id === 'carnot' || L.id === 'eco') renderTools();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  work: '<path d="M10 3v24h48" fill="none" stroke="#8b96ad" stroke-width="1"/><path d="M18 8H44V22H18Z" fill="#86e0a8" opacity=".25"/><path d="M18 8H44V22" fill="none" stroke="#ffb547" stroke-width="1.4"/><circle cx="18" cy="8" r="1.8" fill="#e8ecf4"/><circle cx="44" cy="22" r="1.8" fill="#e8ecf4"/>',
  second: '<rect x="10" y="10" width="18" height="14" fill="#ef6a3c"/><rect x="38" y="10" width="18" height="14" fill="#4f8fe0"/><path d="M29 17h7m-3-3 3 3-3 3" stroke="#ffb547" stroke-width="1.3" fill="none"/>',

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(true); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

  }

  }
  return { ...base, scene: 'eng-carnot', help: 'Кнопки у нагревателя и холодильника — температуры, цилиндр — провести цикл',
    T1: S.T1, T2: S.T2, run: S.run, eta: Math.round(m.eta * 1000) / 10, A: Math.round(m.A), Q1: Math.round(m.Q1), Q2: Math.round(m.Q2), cycles: S.cycles, ok: !!S.done.carnot };
};
// быстрые значения (температуры брусков, фаза цикла) — сцена читает их в kit.onFrame
window.LUCH_REAL.live = () => {
  const id = LID();
  if (id === 'second') return { Th: S.Th, Tc: S.Tc, cx: S.cx, pump: S.pump, W: S.W, Qp: S.Qp, Qflow: S.Qflow, contact: S.cx <= B3.touch + 1 };
  if (id === 'carnot') { const m = model(); return { ph: S.ph, run: S.run, k: m.k, V: m.cur.V, T: m.cur.T, p: m.cur.p }; }
  if (id === 'eco') return { pick: S.pick, guess: S.guess };
  const m = model(); return { V: m.V, T: m.T, p: m.p };
};
window.LUCH_REAL.click = k => {
  if (k === 'mode') return act(S.mode === 'fix' ? 'free' : 'fix');
  if (k === 'w-lock') { wLock = !wLock; toast(wLock ? 'Поршень на упорах: объём не меняется.' : 'Упоры сняты: поршень держат грузы, давление постоянное.'); return; }
  if (k === 'w-heat' || k === 'w-cool') {
    const [V, p] = S.path[S.path.length - 1], up = k === 'w-heat';
    if (wLock) { const np = clamp(Math.round((p + (up ? 50 : -50)) / 50) * 50, 50, 350); if (np === p) { toast(up ? 'Хватит греть: дальше опыт не рассчитан.' : 'Меньше 50 кПа не получится.'); return; } moveTo(V, np); }
    else { const nV = clamp(V + (up ? 2 : -2), 6, 38); if (nV === V) { toast(up ? 'Поршень у верхнего края.' : 'Сильнее сжимать нельзя.'); return; } moveTo(nV, p); }
    return;
  }
  act(k);
};

// для ИИ-репетитора: что сейчас на экране
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'first') now = `Цилиндр с 1 моль гелия (одноатомный идеальный газ), начальное состояние 300 K, 100 кПа, ${fmt(V0L, 2)} л. Поршень ${m.fix ? 'закреплён упорами (V = const)' : 'свободен, на нём груз (p = const = 100 кПа)'}. Передано тепла Q = ${m.Q} Дж. ΔU = ${fmt(m.dU, 1)} Дж, работа газа A = ${fmt(m.A, 1)} Дж, T = ${fmt(m.T, 1)} K (ΔT = ${fmt(m.dT, 2)} K), V = ${fmt(m.V, 2)} л, p = ${fmt(m.p, 1)} кПа. Опыт с Q = 500 Дж: при закреплённом поршне ${S.rec.fix ? 'сделан' : 'не сделан'}, при свободном ${S.rec.free ? 'сделан' : 'не сделан'}.`;
  if (id === 'work') now = `График p(V) для 1 моль газа. Состояние 1: 10 л, 300 кПа; состояние 2: 30 л, 100 кПа (оба на изотерме pV = 3000 Дж). Сейчас газ: V = ${m.V} л, p = ${m.p} кПа, T ≈ ${fmt(m.T, 0)} K. Накоплена работа газа на пройденном пути A = ${fmt(m.A, 0)} Дж. Газ ${m.at2 ? 'в состоянии 2' : 'не в состоянии 2'}. Приходы в состояние 2 с работой: ${S.arr.map(a => fmt(a, 0) + ' Дж').join(', ') || 'пока нет'}. Не называй готовый путь сразу: наводи вопросами про площадь под графиком.`;
  if (id === 'second') now = `Два медных бруска по C = 2000 Дж/К на пенопласте. Левый ${fmt(TK(m.Th), 2)} °C (начально 80 °C), правый ${fmt(TK(m.Tc), 2)} °C (начально 20 °C). Бруски ${m.contact ? 'соприкасаются' : 'разведены'}. Через контакт перешло ${fmt(m.Qflow / 1000, 2)} кДж. Равновесие ${S.mixed ? 'уже было достигнуто' : 'ещё не достигнуто'}. Идеальный тепловой насос ${m.pump ? 'работает' : 'выключен'}: взял у правого ${fmt(m.Qp / 1000, 2)} кДж, потратил работу ${fmt(m.W / 1000, 2)} кДж. Изменение энтропии системы ${fmt(m.dS, 1)} Дж/К.`;
  if (id === 'carnot') now = `Идеальная машина Карно, 1 моль одноатомного газа, V₁ = 10 л, V₂ = 20 л. T₁ = ${S.T1} K, T₂ = ${S.T2} K, η = ${fmt(m.eta * 100, 1)} %, Q₁ = ${fmt(m.Q1, 0)} Дж, A = ${fmt(m.A, 0)} Дж, Q₂ = ${fmt(m.Q2, 0)} Дж. ${S.run ? `Идёт цикл, этап ${m.k + 1}: ${STAGES[m.k]}.` : 'Цикл не идёт.'} Полных циклов: ${S.cycles}${S.doneKey ? ` (последний при ${S.doneKey.replace('/', ' K и ')} K)` : ''}. Не называй готовые температуры: помоги вывести отношение T₂/T₁ из формулы.`;
  if (id === 'eco') {
    const rows = ECO.map(o => { const c = ecoCalc(o, S.grid); return `${o.name}: ${c.kind === 'pump' ? `коэффициент ≈ ${o.cop} (предел ${fmt(c.copMax, 1)})` : `КПД ≈ ${fmt(c.eta * 100, 0)} %${c.carnot != null && !(o.id === 'coal' && !S.found) ? `, предел Карно ${fmt(c.carnot * 100, 0)} %` : ''}`}, тепла впустую ${fmt(c.wastePer, 2)} кВт·ч и CO₂ ≈ ${fmt(c.co2, 2)} кг на 1 кВт·ч пользы`; }).join('; ');
    now = `Сравнение способов получить энергию (оценки «около», без добычи и перевозки топлива). Выбран: ${m.o.name}. Электричество для электромобиля и теплового насоса: ${GRID[S.grid].name}. Ответ ученика на шкале: ${S.guess} %. Предел Карно угольной ТЭС (840 K и 300 K) ${S.found ? 'найден верно' : 'ещё не найден — не называй число, помоги подставить в 1 − T₂/T₁'}. Варианты: ${rows}. Вторая часть задания — выбрать электростанцию с наименьшими потерями тепла на 1 кВт·ч (это парогазовая); не называй её сразу, наводи на сравнение (1 − η)/η. Без политики, только физика и факты.`;
  }
  return [
    `Раздел: физика, 10 класс, термодинамика. Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика вопросами, не решай за него.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    first: 'Почему при свободном поршне газ нагревается слабее?', work: 'Почему работа зависит от пути?',
    second: 'Почему нельзя бесплатно вернуть тепло горячему телу?', carnot: 'Почему КПД не может быть 100 %?',
    eco: 'Почему тепловой насос даёт тепла больше, чем тратит электричества?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
