<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 11 класс: IT-профессии, как устроен стартап, как цифровые сервисы зарабатывают деньги.">
<title>IT-профессии и стартапы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag],.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .sans{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.big{font:600 15px/1 var(--font-mono);color:var(--fg);min-width:34px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.mtab span{background:var(--surface-2);border-radius:7px;padding:6px 7px;font:500 12.5px/1.2 var(--font-mono);display:flex;justify-content:space-between;gap:4px;min-width:0}
.mtab span b{font-weight:600;color:var(--fg)}
.mtab span i{font-style:normal;color:var(--force);letter-spacing:.06em}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mtab{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 180px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="11" cy="20" r="3" fill="var(--force)"/><rect x="17" y="18" width="12" height="4" rx="2" fill="var(--arm)"/><circle cx="34" cy="20" r="1.6" fill="var(--fg)"/><path d="M8 11h24M8 29h24" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Информатика · IT-профессии и стартапы</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>IT и стартапы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: карточки и ползунки можно перетаскивать, кнопки — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const big = n => Math.round(n).toLocaleString('ru-RU');
const fmt = (x, n = 1) => (Math.round(x * 10 ** n) / 10 ** n).toFixed(n).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';

const LESSONS = [
  { id: 'roles', title: 'Кем работать в IT',
    text: ['IT — это не только программисты. Приложение такси делает целая команда: дизайнер придумывает экраны, фронтенд-разработчик собирает их в коде, бэкенд-разработчик пишет серверную часть — заказы, оплату, базу данных.',
           'Тестировщик (QA) ищет ошибки раньше пользователей. Аналитик данных по цифрам объясняет, что происходит с продуктом: сколько людей пришло, сколько ушло и почему. Есть и другие роли: DevOps-инженер, специалист по кибербезопасности, ML-инженер, продакт-менеджер.',
           'Рост в профессии идёт по ступеням: junior → middle → senior. Кроме языка программирования ценят умение работать в команде, писать понятный код и учиться самому.'],
    why: 'IT-специалисты в Казахстане нужны не только в IT-компаниях: свои команды разработки есть у Kaspi, банков, телеком-операторов, маркетплейсов и госсервисов вроде eGov. Многие работают удалённо на зарубежные компании. Роль лучше выбрать заранее: дизайнеру нужны Figma и чувство пользователя, бэкендеру — базы данных и алгоритмы, аналитику — SQL и статистика. Начать можно с бесплатных курсов и своих учебных проектов: портфолио на GitHub помогает на первом собеседовании.',
    task: 'Разложите все 10 рабочих задач по специалистам: кто в команде это делает?',
    hint: 'Про каждую задачу спросите: это про внешний вид, про код экрана, про сервер и данные, про поиск ошибок или про цифры? Перетащите карточку к специалисту или нажмите карточку, а потом специалиста.',
    stage: 'Тащите задачу к специалисту. Неверно — карточка вернётся.',
    cards: [
      { id: 'figma', name: 'Макет экрана в Figma', short: 'Макет', g: 'des' },
      { id: 'interview', name: 'Интервью с клиентами', short: 'Интервью', g: 'des' },
      { id: 'button', name: 'Кнопка на HTML и CSS', short: 'Кнопка', g: 'front' },
      { id: 'mobile', name: 'Вёрстка под телефон', short: 'Вёрстка', g: 'front' },
      { id: 'api', name: 'API для заказа такси', short: 'API', g: 'back' },
      { id: 'db', name: 'База данных заказов', short: 'База', g: 'back' },
      { id: 'bug', name: 'Баг: оплата прошла дважды', short: 'Баг', g: 'qa' },
      { id: 'autotest', name: 'Автотест на вход', short: 'Автотест', g: 'qa' },
      { id: 'churn', name: 'Сколько клиентов ушло', short: 'Отток', g: 'data' },
      { id: 'dash', name: 'Дашборд продаж на SQL', short: 'Дашборд', g: 'data' }],
    check: m => m.placed === m.total },
  { id: 'startup', title: 'Как устроен стартап',
    text: ['Стартап — молодая компания, которая ищет бизнес-модель, способную быстро расти. Вокруг много неизвестного, и главный риск — сделать продукт, который никому не нужен.',
           'Поэтому стартап живёт циклом «создай — измерь — сделай вывод». Формулируют гипотезу: «родители заплатят за подбор репетитора». Делают MVP — минимальный продукт, на котором её можно проверить. Измеряют поведение реальных людей, например конверсию — долю посетителей, оставивших заявку.',
           'Гипотеза не подтвердилась — делают пивот: меняют сегмент клиентов или саму идею. Подтвердилась — продолжают и ищут деньги на рост: свои сбережения и гранты, потом бизнес-ангелы и венчурные фонды.'],

const GQ = { // guiding questions after a wrong drop (no answers)

const CARD = { w: 172, h: 26 };
const cardHome = i => ({ x: 6 + (i % 2) * 176, y: 90 + (i >> 1) * 31 });
const ZONE = { y: 252, w: 66, h: 146 };

// ---------- lesson 2: startup ----------

const MVPS = [

const VISITORS = 400;
const seg = id => SEGS.find(s => s.id === id);
const mvp = id => MVPS.find(s => s.id === id);
const conv = t => t.signups / t.visitors * 100;
const testOf = id => S.tests.find(t => t.seg === id);

// ---------- lesson 3: unit economics ----------
const COST = 400; // servers, SMS, payment fee per subscriber per month
const SL = [
  { id: 'price', name: 'Цена', min: 990, max: 4990, step: 100 },
  { id: 'churn', name: 'Отток', min: 3, max: 30, step: 1 },
  { id: 'cac', name: 'CAC', min: 2000, max: 15000, step: 500 },
];
const SLX = { x0: 96, x1: 290 };
const slY = i => 318 + i * 30;
function econ(P, ch, cac) {
  const g = P - COST, m = ch / 100, ltv = g / m;
  let cum = -cac, pay = null; const pts = [cum];
  for (let t = 1; t <= 120; t++) { cum += g * Math.pow(1 - m, t - 1); if (t <= 24) pts.push(cum); if (pay === null && cum >= 0) pay = t; }
  return { g, m, ltv, ratio: ltv / cac, pay, pts, life: 1 / m };
}

function model() {
  const id = LID();
  if (id === 'roles') {
    const cards = L().cards, placed = cards.filter(c => S.place[c.id]).length;
    return { kind: 'sort', placed, total: cards.length, miss: S.miss };
  }
  if (id === 'startup') {
    const B = L().budget, spent = S.tests.reduce((s, t) => s + t.cost, 0), weeks = S.tests.reduce((s, t) => s + t.weeks, 0);
    const goT = S.go ? testOf(S.go) : null;
    return { kind: 'startup', budget: B, spent, left: B - spent, weeks, tests: S.tests.length, pending: S.pending,
             goOk: !!(goT && conv(goT) >= L().need && B - spent >= 0), broke: B - spent < MVPS[0].cost && !S.go && S.pending === null };
  }
  const e = econ(S.price, S.churn, S.cac);
  return Object.assign({ kind: 'money', price: S.price, churn: S.churn, cac: S.cac }, e);
}

// ---------- drawing ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const rr = (w, h, r) => `M${r} 0H${w - r}Q${w} 0 ${w} ${r}V${h - r}Q${w} ${h} ${w - r} ${h}H${r}Q0 ${h} 0 ${h - r}V${r}Q0 0 ${r} 0Z`;

function roleIcon(id, col) {

  return `<path d="M-13 12H13" ${s}/><rect x="-11" y="2" width="5" height="9" rx="1" fill="#72d4e8"/><rect x="-3" y="-5" width="5" height="16" rx="1" fill="#72d4e8"/><rect x="5" y="-11" width="5" height="22" rx="1" fill="#ffb547"/>`;

function drawSort(t) {
  const Ls = L();
  let h = '';
  ROLES.forEach((z, i) => {
    const x = zoneX(i), sel = S.sel !== null;
    const bad = S.lastBad && S.lastBad.z === z.id && t - S.lastBad.t < 700;

    h += `<g transform="translate(${x + ZONE.w / 2} ${ZONE.y + 26})">${roleIcon(z.id, '#e8ecf4')}</g>`;
    h += `<text x="${x + ZONE.w / 2}" y="${ZONE.y + 58}" font-size="${z.name.length > 9 ? 8.4 : 9.5}" fill="#e8ecf4" text-anchor="middle" class="sans" font-weight="600">${z.name}</text>`;
    let k = 0;
    for (const c of Ls.cards) if (S.place[c.id] === z.id) {
      const y = ZONE.y + 68 + k * 26; k++;

    }

  });
  Ls.cards.forEach((c, i) => {
    if (S.place[c.id]) return;
    const home = cardHome(i);
    h += `<rect x="${home.x}" y="${home.y}" width="${CARD.w}" height="${CARD.h}" rx="8" fill="none" stroke="#26324a" stroke-dasharray="4 4"/>`;
  });
  const order = Ls.cards.filter(c => !S.place[c.id]).sort((a, b) => (drag && drag.card === a.id ? 1 : 0) - (drag && drag.card === b.id ? 1 : 0));

  h += `<text x="180" y="246" font-size="9" fill="#8b96ad" text-anchor="middle">IT-команда</text>`;
  return h;
}

const PHASES = ['Гипотеза', 'MVP', 'Измерение', 'Вывод'];
function phase() {

  if (S.seg) return 1;

function drawStartup(t) {

  SEGS.forEach((s, i) => {

    h += `<rect x="6" y="372" width="${sw.toFixed(1)}" height="9" rx="3" fill="${good ? '#86e0a8' : '#ff8a73'}"/><text x="${(sw + 12).toFixed(1)}" y="380" font-size="8.5" fill="${good ? '#86e0a8' : '#ff8a73'}">${last.signups} ${plural(last.signups, 'заявка', 'заявки', 'заявок')} · ${fmt(c)} %</text>`;
    const thr = 6 + wf * L().need / 100;
    h += `<path d="M${thr.toFixed(1)} 355V385" stroke="#ffb547" stroke-width="1.3" stroke-dasharray="2 2"/><text x="${thr.toFixed(1)}" y="395" font-size="7.5" fill="#ffb547" text-anchor="middle">порог ${L().need} %</text>`;
  } else h += `<text x="6" y="362" font-size="9.5" fill="#56627d" class="sans">Тестов пока не было.</text><text x="6" y="377" font-size="9.5" fill="#56627d" class="sans">Порог успеха — конверсия ${L().need} %.</text>`;

// unit economics chart
const CH = { x0: 40, x1: 352, y0: 94, y1: 226, vmin: -15000, vmax: 45000 };
const cx = t => CH.x0 + (CH.x1 - CH.x0) * t / 24;
const cy = v => CH.y1 - (CH.y1 - CH.y0) * (clamp(v, CH.vmin, CH.vmax) - CH.vmin) / (CH.vmax - CH.vmin);
function drawMoney(t) {

  // sliders
  SL.forEach((s, i) => {
    const y = slY(i), v = S[s.id], k = (v - s.min) / (s.max - s.min), hx = SLX.x0 + (SLX.x1 - SLX.x0) * k;

function hlBox(id) {

const scene = $('#scene');
function drawScene(t) {

}

// fit the scene: 360 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 360, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 372, hh / 412, 1.8);
  VB = { w: w / s, h: hh / s }; VB.x = 180 - VB.w / 2; VB.y = 404 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- interaction ----------
let P = {}, drag = null, dirty = true;
const resetProps = () => { P = {}; if (LID() === 'roles') L().cards.forEach((c, i) => { const p = cardHome(i); P[c.id] = { x: p.x, y: p.y, rx: p.x, ry: p.y }; }); };
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const zoneAt = p => { if (p.y < ZONE.y - 10 || p.y > ZONE.y + ZONE.h + 6) return null; const i = ROLES.findIndex((z, k) => p.x >= zoneX(k) - 2 && p.x <= zoneX(k) + ZONE.w + 2); return i >= 0 ? ROLES[i].id : null; };
function setSlider(id, x) {
  const s = SL.find(q => q.id === id), k = clamp((x - SLX.x0) / (SLX.x1 - SLX.x0), 0, 1);
  const v = clamp(Math.round((s.min + k * (s.max - s.min)) / s.step) * s.step, s.min, s.max);
  if (v !== S[id]) { S[id] = v; update(); }
}

scene.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-drag]'), hit = e.target.closest('[data-hit]');
  if (!d && !hit) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (d) {
    const [k, id] = d.dataset.drag.split(':');
    if (k === 'sl') { drag = { sl: id }; scene.classList.add('grabbing'); return; }
    const o = P[id], p = toSvg(e);
    drag = { card: id, dx: o.x - p.x, dy: o.y - p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing'); dirty = true; return;
  }
  const h = hit.dataset.hit;
  if (h.startsWith('track:')) { const id = h.slice(6); drag = { sl: id }; setSlider(id, toSvg(e).x); scene.classList.add('grabbing'); return; }
  drag = { hit: h };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.sl) { setSlider(drag.sl, toSvg(e).x); return; }
  if (!drag.card) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.moved) return;
  const p = toSvg(e), o = P[drag.card];
  o.x = clamp(p.x + drag.dx, VB.x - CARD.w / 2, VB.x + VB.w - CARD.w / 2); o.y = clamp(p.y + drag.dy, VB.y, 390);
  dirty = true;
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (d.sl || cancel) return;
  if (d.hit) { onHit(d.hit); return; }
  if (!d.moved) { S.sel = S.sel === d.card ? null : d.card; update(); return; }
  const z = zoneAt(toSvg(e));
  if (z) tryPlace(d.card, z);
}
scene.addEventListener('pointerup', e => endDrag(e, false));
scene.addEventListener('pointercancel', e => endDrag(e, true));

function onHit(h) {
  const [k, v] = h.split(':');
  if (k === 'zone') { if (S.sel) tryPlace(S.sel, v); else toast('Сначала выберите карточку с задачей.'); }
  if (k === 'seg') pickSeg(v);
  if (k === 'mvp') pickMvp(v);
  if (k === 'launch' || k === 'pivot' || k === 'go') act(k);
}

function tryPlace(cid, zid) {
  const c = L().cards.find(x => x.id === cid); if (!c || S.place[cid]) return;
  if (c.g === zid) { S.place[cid] = zid; S.sel = null; toast(`«${c.name}» — это работа: ${ROLES.find(z => z.id === zid).full}.`); }
  else { S.miss++; S.lastBad = { z: zid, t: performance.now() }; toast(GQ[cid]); }
  update();
}

function blocked() {
  if (S.go) { toast('Решение уже принято: продолжаем. Нажмите «Заново», чтобы начать сначала.'); return true; }
  if (S.pending !== null) { toast('Сначала сделайте вывод по прошлому тесту: пивот или продолжать?'); return true; }
  return false;
}
function pickSeg(id) {
  if (blocked()) return;
  const t = testOf(id);
  if (t) { toast(`Эту гипотезу уже проверили: конверсия ${fmt(conv(t))} %. Повторять — тратить деньги зря.`); return; }
  S.seg = S.seg === id ? null : id; update();
}
function pickMvp(id) {
  if (blocked()) return;
  S.mvp = S.mvp === id ? null : id; update();
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label) => `<button data-a="${k}">${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    roles: B('reshuffle', 'Начать заново'),
    startup: B('launch', '▶ Тест') + B('pivot', '↺ Пивот') + B('go', 'Продолжать') + sep + B('resetS', 'Заново'),
    money: B('priceM', 'Цена −') + B('priceP', 'Цена +') + sep + B('churnM', 'Отток −') + B('churnP', 'Отток +') + sep + B('resetM', 'Сброс'),
  }[id];
}
function nudge(id, dir) { const s = SL.find(q => q.id === id); S[id] = clamp(S[id] + dir * s.step, s.min, s.max); update(); }
function act(a) {
  if (a === 'reshuffle') { S.place = {}; S.miss = 0; S.sel = null; resetProps(); update(); return; }
  if (a === 'launch') {
    if (blocked()) return;
    if (!S.seg) { toast('Выберите гипотезу: кто оставит заявку?'); return; }
    if (!S.mvp) { toast('Выберите MVP, которым проверите гипотезу.'); return; }
    const m = model(), v = mvp(S.mvp);
    if (v.cost > m.left) { toast(`Не хватает денег: осталось ${big(m.left)} ₸, а «${v.name}» стоит ${big(v.cost)} ₸.`); return; }
    const s = seg(S.seg);
    S.tests.push({ seg: s.id, mvp: v.id, visitors: VISITORS, signups: s.n, cost: v.cost, weeks: v.weeks });
    S.pending = S.tests.length - 1;
    toast(`Тест прошёл: ${s.n} ${plural(s.n, 'заявка', 'заявки', 'заявок')} из ${VISITORS} посетителей. Теперь вывод.`);
    update(); return;
  }
  if (a === 'pivot') {
    if (S.pending === null) { toast(S.go ? 'Решение уже принято.' : 'Пивот делают после теста, когда гипотеза не подтвердилась.'); return; }
    const t = S.tests[S.pending];
    if (conv(t) >= L().need) toast('Конверсия выше порога, а вы меняете курс. Так можно, но зачем бросать рабочую гипотезу?');
    S.pivots++; S.pending = null; S.seg = null; S.mvp = null; update(); return;
  }
  if (a === 'go') {
    if (S.go) return;
    if (S.pending === null) { toast('Сначала проверьте гипотезу тестом.'); return; }
    const t = S.tests[S.pending];
    if (conv(t) < L().need) { toast(`Конверсия ${fmt(conv(t))} % ниже порога ${L().need} % — гипотеза не подтвердилась. Подумайте о пивоте.`); return; }
    S.go = t.seg; S.pending = null; update(); return;
  }
  if (a === 'resetS') { S.seg = null; S.mvp = null; S.tests = []; S.pending = null; S.go = null; S.pivots = 0; update(); return; }
  if (a === 'priceM') return nudge('price', -1);
  if (a === 'priceP') return nudge('price', 1);
  if (a === 'churnM') return nudge('churn', -1);

}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'roles') {
    set('#r1', `${m.placed}/${m.total}`); set('#r2', String(m.total - m.placed)); set('#r3', String(m.miss));
    const cc = el.querySelector('#cardChips');
    if (cc) {
      const left = L().cards.filter(c => !S.place[c.id]);
      cc.innerHTML = left.length ? left.map(c => `<button data-c="${c.id}" aria-pressed="${S.sel === c.id}">${c.name}</button>`).join('') : '<span class="note">Все задачи разложены.</span>';
      cc.querySelectorAll('button').forEach(b => b.onclick = () => { S.sel = S.sel === b.dataset.c ? null : b.dataset.c; update(); });
    }
  } else if (id === 'startup') {
    set('#r1', big(m.left) + ' ₸'); set('#r2', String(m.weeks)); set('#r3', String(m.tests));
    const sc = el.querySelector('#segChips'), mc = el.querySelector('#mvpChips');
    if (sc) { sc.innerHTML = SEGS.map(s => { const t = testOf(s.id); return `<button data-s="${s.id}" aria-pressed="${S.seg === s.id}">${s.name}${t ? ` · ${fmt(conv(t))} %` : ''}</button>`; }).join(''); sc.querySelectorAll('button').forEach(b => b.onclick = () => pickSeg(b.dataset.s)); }
    if (mc) { mc.innerHTML = MVPS.map(v => `<button data-v="${v.id}" aria-pressed="${S.mvp === v.id}">${v.name} · ${big(v.cost / 1000)} тыс ₸</button>`).join(''); mc.querySelectorAll('button').forEach(b => b.onclick = () => pickMvp(b.dataset.v)); }
  } else {
    set('#r1', big(m.ltv) + ' ₸'); set('#r2', fmt(m.ratio)); set('#r3', m.pay === null ? 'нет' : m.pay + ' мес');
    set('#inPriceO', big(S.price) + ' ₸'); set('#inChurnO', S.churn + ' %'); set('#inCacO', big(S.cac) + ' ₸');

}

function calcHTML(m) {
  const id = LID();
  if (id === 'roles') {
    let h = `<h2>Как рассуждать</h2><div class="formula">задача → результат → роль</div><p class="note">Спросите, что получится в итоге: картинка экрана, код в браузере, код на сервере, найденная ошибка или вывод из цифр.</p><h3>Разложено</h3>`;
    const placed = L().cards.filter(c => S.place[c.id]);
    h += placed.length ? `<div class="steps">` + placed.map(c => step(c.name, ROLES.find(s => s.id === S.place[c.id]).full)).join('') + `</div>` : `<p class="note">Пока ничего. Разложите первую задачу — здесь появится рассуждение.</p>`;
    h += `<h3>Итог</h3><div class="steps">` + step('разложено', `${m.placed} из ${m.total}`) + step('промахов', String(m.miss)) +
      step('точность', m.placed + m.miss ? `${m.placed} / ${m.placed + m.miss} = ${Math.round(m.placed / (m.placed + m.miss) * 100)} %` : '—', 'sum') + `</div>`;
    return h;
  }
  if (id === 'startup') {
    let h = `<h2>Конверсия и бюджет</h2><div class="formula">конверсия = заявки / посетители × 100 %</div>`;
    if (!S.tests.length) h += `<p class="note">Тестов ещё не было. Запустите первый — здесь появится расчёт.</p>`;
    S.tests.forEach((t, i) => {
      const c = conv(t), ok = c >= L().need;
      h += `<h3>Тест ${i + 1}: ${seg(t.seg).name.toLowerCase()} · ${mvp(t.mvp).name}</h3><div class="steps">` +
        step('конверсия', `${t.signups} / ${t.visitors} × 100 % = ${fmt(c)} %`) +
        step('цена одной заявки', `${big(t.cost)} / ${t.signups} ≈ ${big(t.cost / t.signups)} ₸`) +
        step('вывод', `${fmt(c)} % ${ok ? '≥' : '<'} ${L().need} % → ${ok ? 'подтверждена' : 'нужен пивот'}`, 'sum') + `</div>`;
    });
    h += `<h3>Бюджет</h3><div class="steps">` + step('было', big(m.budget) + ' ₸') +
      (S.tests.length ? step('потрачено', S.tests.map(t => big(t.cost)).join(' + ') + ' = ' + big(m.spent) + ' ₸') : '') +
      step('осталось', `${big(m.budget)} − ${big(m.spent)} = ${big(m.left)} ₸`, 'sum') + step('прошло времени', `${m.weeks} нед`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">Спрос лендинг и полное приложение покажут одинаково, но приложение стоит в 6 раз дороже и делается в 12 раз дольше.</p>`;
    return h;
  }
  let h = `<h2>Юнит-экономика</h2><div class="formula">LTV = (цена − затраты) / отток</div><div class="steps">` +
    step('маржа в месяц', `${big(S.price)} − ${COST} = ${big(m.g)} ₸`) +
    step('отток', `${S.churn} % = ${fmt(m.m, 2)}`) +
    step('срок жизни клиента', `1 / ${fmt(m.m, 2)} ≈ ${fmt(m.life)} мес`) +
    step('LTV', `${big(m.g)} / ${fmt(m.m, 2)} ≈ ${big(m.ltv)} ₸`) +
    step('LTV / CAC', `${big(m.ltv)} / ${big(S.cac)} ≈ ${fmt(m.ratio, 2)}`, 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">${m.ratio >= 3 ? 'Отношение не меньше 3 — каждый тенге рекламы возвращается с запасом.' : 'Меньше 3 — почти весь заработок уходит на рекламу.'}${S.price > L().maxPrice ? ' Но цена выше 2 990 ₸ — так клиенты уйдут к конкурентам.' : ''}</p>`;
  h += `<h3>Окупаемость клиента</h3><div class="steps">` +
    step('прибыль за 1-й месяц', `${big(m.g)} ₸`) +
    step('за k-й месяц', `${big(m.g)} × (1 − ${fmt(m.m, 2)})^(k−1)`) +
    step('окупился', m.pay === null ? 'не окупается: LTV < CAC' : `на ${m.pay}-м месяце`, 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">Множитель (1 − отток) — доля клиентов, которые ещё остались. Модель упрощённая: без налогов, зарплат команды и скидок.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID(), ok = !!S.done[id];
  if (m.kind === 'sort') el.innerHTML = `<div class="k">Разложено</div><div class="v ${ok ? 'ok' : ''}">${m.placed} из ${m.total}</div><div class="gauge"><b style="width:${(m.placed / m.total * 100).toFixed(1)}%"></b></div><div class="lr"><span>промахи</span><span>${m.miss}</span></div>`;

  else el.innerHTML = `<div class="k">LTV / CAC</div><div class="v ${ok ? 'ok' : ''}">${fmt(m.ratio)}</div><div class="gauge"><b style="width:${clamp(m.ratio / 3 * 100, 0, 100).toFixed(1)}%;background:${m.ratio >= 3 ? 'var(--ok)' : 'var(--arm)'}"></b></div><div class="lr"><span>нужно</span><span>≥ 3</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.place = {}; S.miss = 0; S.sel = null; S.lastBad = null; S.hl = null;
  S.seg = null; S.mvp = null; S.tests = []; S.pending = null; S.go = null; S.pivots = 0;
  if (Ls.id === 'money') { S.price = Ls.price; S.churn = Ls.churn; S.cac = Ls.cac; }
  drag = null;
  save(); resetProps();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const ls = $('#lessons'), cur = ls.querySelector('.lesson[aria-current="true"]');
  if (cur) { const a = ls.getBoundingClientRect(), b = cur.getBoundingClientRect(); ls.scrollLeft += (b.left - a.left) - (a.width - b.width) / 2; }
}

  if (id === 'startup') {
    const tests = S.tests.map((t, i) => `тест ${i + 1}: ${seg(t.seg).name.toLowerCase()}, MVP «${mvp(t.mvp).name}», ${t.signups} заявок из ${t.visitors} (конверсия ${fmt(conv(t))} %), стоимость ${big(t.cost)} ₸`);
    now = `Симуляция стартапа «сервис подбора репетиторов в Алматы». Цикл: гипотеза → MVP → измерение → вывод (пивот или продолжать). Гипотезы-сегменты: школьники, родители, студенты; MVP: лендинг (150 000 ₸, 1 нед), Telegram-бот (300 000 ₸, 2 нед), приложение (900 000 ₸, 12 нед); каждый тест даёт ${VISITORS} посетителей, порог успеха — конверсия ${Ls.need} %. Бюджет ${big(m.budget)} ₸, осталось ${big(m.left)} ₸, прошло ${m.weeks} нед. Проведённые тесты: ${tests.join('; ') || 'нет'}. Сейчас выбрано: сегмент ${S.seg ? seg(S.seg).name : 'не выбран'}, MVP ${S.mvp ? mvp(S.mvp).name : 'не выбран'}.${S.pending !== null ? ' Последний тест ждёт решения: пивот или продолжать.' : ''}${S.go ? ` Принято решение продолжать с сегментом «${seg(S.go).name}».` : ''} Пивотов: ${S.pivots}.`;
    guide = 'Результаты непроверенных сегментов неизвестны — не угадывай и не подсказывай, какой сегмент сработает. Помоги рассуждать: какой MVP дешевле проверяет гипотезу, как посчитать конверсию, что делать, если она ниже порога.';
  }
  if (id === 'money') {
    now = `Юнит-экономика подписочного сервиса. Цена ${big(S.price)} ₸/мес (ограничение задания — не выше ${big(Ls.maxPrice)} ₸), затраты на клиента ${COST} ₸/мес, маржа ${big(m.g)} ₸/мес, отток ${S.churn} %/мес (средний срок жизни клиента ≈ ${fmt(m.life)} мес), CAC ${big(S.cac)} ₸. LTV = маржа / отток ≈ ${big(m.ltv)} ₸, LTV/CAC ≈ ${fmt(m.ratio, 2)}, ${m.pay === null ? 'клиент не окупается' : `клиент окупается на ${m.pay}-м месяце`}. На сцене график накопленной прибыли с одного клиента за 24 месяца и полосы LTV против 3 × CAC.`;
    guide = 'Не называй готовые значения ползунков: спроси, какие величины входят в формулу LTV и как каждая влияет на отношение LTV/CAC.';
  }
  return [
    `Раздел: информатика, 11 класс, тема «IT-профессии и стартапы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    S.done[id] ? 'Задание уже выполнено — можно обсуждать свободно.' : guide,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = {
    roles: 'Чем фронтенд отличается от бэкенда?',
    startup: 'Зачем делать MVP, если можно сразу сделать хорошее приложение?',
    money: 'Почему снижение оттока так сильно повышает LTV?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Какие школьные предметы нужны для IT-профессий?'];
};

setLesson(S.lesson);
fit();

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  for (const [k, o] of Object.entries(P)) {
    if (drag && drag.card === k) continue;
    const nx = reduce ? o.rx : o.x + (o.rx - o.x) * Math.min(1, dt * 12), ny = reduce ? o.ry : o.y + (o.ry - o.y) * Math.min(1, dt * 12);
    if (Math.abs(o.rx - nx) + Math.abs(o.ry - ny) > 0.3) { o.x = nx; o.y = ny; anim = true; } else if (o.x !== o.rx || o.y !== o.ry) { o.x = o.rx; o.y = o.ry; anim = true; }
  }
  if (S.hl || (S.lastBad && t - S.lastBad.t < 800)) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
