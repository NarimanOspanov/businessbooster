<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивные опыты с горохом: доминирование, расщепление 3 : 1, анализирующее и дигибридное скрещивание, решётка Пеннета.">
<title>Законы Менделя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /optics. 2D crossing stand on the left, lesson notebook on the right, lesson strip under the stand. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.stop{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:14px 14px 0;flex:none}

.task{flex:1 1 220px;max-width:380px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}
.task .chips{margin-top:9px}

.result{flex:0 1 230px;min-width:150px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.result .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.result .v{font:500 15px/1 var(--font-mono);margin-top:8px}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px}
.stack i{display:block;height:100%}
.stackl{display:flex;justify-content:space-between;font:500 10px/1 var(--font-mono);color:var(--muted);margin-top:8px}
.rrows{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 7px;align-items:center;margin-top:10px;font:500 11px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.rrows i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.rrows span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrows em{font-style:normal;color:var(--muted)}

#cross{display:block;flex:1 1 0;min-height:0;width:100%;padding:6px 10px 4px;user-select:none;-webkit-user-select:none}
.tools{flex:none;align-self:center;margin:0 14px 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 28px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tools .sq{width:30px;padding:6px 0;font:500 15px/1 var(--font-mono)}
.tools .mono{font-family:var(--font-mono)}
.tools .grow{background:var(--fg);color:var(--bg);font-weight:600}
.tools .grow:hover{color:var(--bg)}

/* stage svg */
.s-lbl{fill:var(--fg);font:600 10px var(--font-body);text-anchor:middle}
.s-row{fill:var(--muted);font:500 11px var(--font-mono)}
.s-note{fill:var(--muted);font:500 8.5px var(--font-body);text-anchor:middle}
.s-x{fill:var(--muted);font:500 20px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.chip{cursor:pointer}
.chip rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.chip.dom rect{fill:#2b3754}
.chip:hover rect{stroke:var(--muted)}
.chip.lock{cursor:default}
.chip.lock rect{stroke-dasharray:2 2}
.chip text{fill:var(--fg);font:500 13px var(--font-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.meio{stroke:var(--line);stroke-width:1;fill:none}
.gm circle{fill:var(--bg);stroke-width:1.3}
.gm.f circle{stroke:var(--force)}
.gm.m circle{stroke:var(--arm)}
.gm text{fill:var(--fg);font:500 10px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.gm.on circle{fill:#2b3754;stroke-width:2.4}
.cell{cursor:crosshair;touch-action:none}
.cell rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.cell.on rect{fill:var(--surface-2);stroke:var(--fg);stroke-width:1.4}
.cell text{fill:var(--fg);font:500 9.5px var(--font-mono);text-anchor:middle;pointer-events:none}
.cell .pea,.cell circle,.cell path{pointer-events:none}
.pea{stroke:rgba(0,0,0,.45);stroke-width:.8}
.slot{fill:var(--line)}
.sprout{animation:sprout .35s both;transform-box:fill-box;transform-origin:center}
@keyframes sprout{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.flash{animation:flash 1.6s}
@keyframes flash{0%,100%{filter:none}25%,75%{filter:drop-shadow(0 0 5px #72d4e8)}}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{border-left:2px solid var(--arm);padding:2px 0 2px 12px;margin:4px 0 12px;font-size:14px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--arm);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips.mono button{font-family:var(--font-mono)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row .primary{margin-top:0}

.formula{font:500 19px/1.2 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.formula.cross{text-align:left;font-size:14.5px;line-height:1.75}
.formula.cross b{display:inline-block;width:2.4em;color:var(--muted);font-weight:500}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
div.part{cursor:default}
div.part:hover{border-color:var(--line)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:5;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:981px){
  .stage{display:grid;grid-template-columns:minmax(220px,270px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .stop{flex-direction:column;flex-wrap:nowrap;padding:14px 0 0 14px;overflow:auto;min-height:0}
  .task,.result{flex:none;max-width:none;width:100%}
  #cross{grid-column:2;grid-row:1;height:100%;padding:10px 14px 6px}
  .tools{grid-column:1/-1}
}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:auto}
  #cross{flex:none;height:auto}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .stop{padding:10px 10px 0;gap:8px}
  .task{padding:9px 11px}
  .task p{font-size:13px}
  .result{flex:1 1 100%;max-width:none;padding:8px 10px}
  .result .stack,.result .stackl{display:none}
  #cross{padding:4px 2px}
  .tools{margin:0 10px 10px;max-width:calc(100% - 20px)}
  .tools button{padding:6px 7px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sections a{padding:8px 9px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 21Q20 7 34 21Q20 33 6 21Z" fill="#3e7a34" stroke="#1f3d1a" stroke-width="1.2"/><circle cx="13" cy="20.5" r="3.6" fill="#f2cf4a"/><circle cx="20" cy="20.5" r="3.6" fill="#f2cf4a"/><circle cx="27" cy="20.5" r="3.6" fill="#8cc65e"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Мендель</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Стенд скрещивания">
    <div class="stop">
      <div class="task" aria-live="polite">
        <div class="k" id="taskK">Задание</div>
        <p id="taskText"></p>
        <div class="state" id="taskState"></div>
        <div id="taskAns"></div>
      </div>
      <div class="result" id="result" aria-live="polite"></div>
    </div>
    <svg id="cross" viewBox="0 0 360 392" role="img" aria-label="Родители, гаметы, решётка Пеннета и потомство. Нажмите на букву, чтобы поменять аллель, проведите по решётке, чтобы увидеть встречу гамет."></svg>
    <div class="tools" role="toolbar" aria-label="Потомство">
      <button class="mono" data-n="10" aria-pressed="false">10</button>
      <button class="mono" data-n="100" aria-pressed="true">100</button>
      <button class="mono" data-n="1000" aria-pressed="false">1000</button>
      <span class="sep"></span>
      <button class="grow" data-act="grow">Вырастить потомство</button>
      <span class="sep"></span>
      <button class="sq" data-act="reset" aria-label="Начать урок заново">⟲</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const pct = (x, n = 1) => fmt(x * 100, n).replace(/,0$/, '') + '%';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const frac = (k, t) => { if (!k) return '0'; if (k === t) return '1'; const g = gcd(k, t); return `${k / g}/${t / g}`; };

// ---------- traits ----------
// Colours of seeds/flowers. Y/G — seed colour, S/W — smooth/wrinkled, R/P/W — red/pink/white flowers, U — unknown.
const COL = { Y: '#f2cf4a', G: '#8cc65e', R: '#e5485b', P: '#f39cbd', W: '#eeeee4', U: '#4a5672' };
const CLS = {
  pea1: [{ k: 'Y', name: 'жёлтые', short: 'жёлтые' }, { k: 'G', name: 'зелёные', short: 'зелёные' }],
  flower: [{ k: 'R', name: 'красные', short: 'красные' }, { k: 'P', name: 'розовые', short: 'розовые' }, { k: 'W', name: 'белые', short: 'белые' }],
  pea2: [{ k: 'YS', name: 'жёлтые гладкие', short: 'жёлт. гл.' }, { k: 'YW', name: 'жёлтые морщинистые', short: 'жёлт. морщ.' },
         { k: 'GS', name: 'зелёные гладкие', short: 'зел. гл.' }, { k: 'GW', name: 'зелёные морщинистые', short: 'зел. морщ.' }],
};
const ONE = { Y: 'жёлтый', G: 'зелёный', YS: 'жёлтый гладкий', YW: 'жёлтый морщинистый', GS: 'зелёный гладкий', GW: 'зелёный морщинистый', R: 'красный', P: 'розовый', W: 'белый', U: 'неизвестно' };
const colOf = (mode, k) => k === 'U' ? COL.U : mode === 'pea2' ? COL[k[0]] : COL[k];
const rank = ch => ch === '?' ? 1 : ch === ch.toUpperCase() ? 0 : 2;

let saved = {};
try { saved = JSON.parse(localStorage.getItem('luch-mendel') || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), p: [], n: 100, res: null, hidden: 'AA', solved: false,
            hl: -1, done: saved.done || {}, tab: 'overview' };
const save = () => { try { localStorage.setItem('luch-mendel', JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];

// ---------- genetics ----------
const isTest = () => L().id === 'test';
const hiddenNow = () => isTest() && !S.solved;
const actG = i => isTest() && i === 0 ? { A: S.hidden } : S.p[i];
const dispG = i => hiddenNow() && i === 0 ? { A: 'A?' } : actG(i);
const gStr = g => L().genes.map(x => g[x]).join('');
const gametesOf = g => L().genes.length === 1 ? [g.A[0], g.A[1]] : [g.A[0] + g.B[0], g.A[0] + g.B[1], g.A[1] + g.B[0], g.A[1] + g.B[1]];
const sameG = (i, s) => gStr(actG(i)) === s;
function punnett(gf, gm) {
  const rows = gametesOf(gf), cols = gametesOf(gm), genes = L().genes, cells = [];
  rows.forEach((r, i) => cols.forEach((c, j) => {
    const g = {}; genes.forEach((x, k) => { g[x] = norm(r[k] + c[k]); });
    cells.push({ i, j, r, c, g, s: gStr(g), k: ph(L().mode, g) });
  }));
  return { rows, cols, cells };
}
const curP = () => punnett(dispG(0), dispG(1));
const actP = () => punnett(actG(0), actG(1));
// phenotype distribution as counts of Punnett cells
const dist = P => { const d = {}; for (const c of P.cells) d[c.k] = (d[c.k] || 0) + 1; return d; };
function ratioStr(d) {
  const ks = CLS[L().mode].map(c => c.k).filter(k => d[k]);
  if (!ks.length) return '—';
  const g = ks.reduce((a, k) => gcd(a, d[k]), 0);
  return ks.length === 1 ? 'все' : ks.map(k => d[k] / g).join(' : ');
}
const ratioNames = d => CLS[L().mode].filter(c => d[c.k]).map(c => c.name).join(' : ');
const ratioText = d => { const c = CLS[L().mode].filter(x => d[x.k]); return c.length === 1 ? `все ${c[0].name}` : `${ratioNames(d)} = ${ratioStr(d)}`; };

function simulate(n) {
  const genes = L().genes, a = actG(0), b = actG(1), counts = {}, list = [];
  for (let t = 0; t < n; t++) {
    const g = {};
    for (const x of genes) g[x] = norm(a[x][Math.random() < 0.5 ? 0 : 1] + b[x][Math.random() < 0.5 ? 0 : 1]);
    const k = ph(L().mode, g);
    counts[k] = (counts[k] || 0) + 1;
    if (list.length < 100) list.push(k);
  }
  return { n, counts, list };
}

// ---------- drawing ----------
function seedSVG(x, y, r, color, wr, cls) {
  let h;
  if (wr) {
    let d = '';
    for (let i = 0; i <= 36; i++) {
      const t = i / 36 * Math.PI * 2, rr = r * (0.93 + 0.055 * Math.sin(5 * t + 0.6) + 0.03 * Math.sin(11 * t));
      d += (i ? 'L' : 'M') + (x + rr * Math.cos(t)).toFixed(2) + ',' + (y + rr * Math.sin(t)).toFixed(2);
    }
    h = `<path class="pea" d="${d}Z" fill="${color}"/><path d="M${(x - r * .45).toFixed(2)},${(y - r * .05).toFixed(2)}Q${x},${(y + r * .35).toFixed(2)} ${(x + r * .45).toFixed(2)},${(y - r * .1).toFixed(2)}" fill="none" stroke="rgba(0,0,0,.32)" stroke-width="${(r * .1).toFixed(2)}"/>`;
  } else h = `<circle class="pea" cx="${x}" cy="${y}" r="${r}" fill="${color}"/>`;
  h += `<ellipse cx="${(x - r * .33).toFixed(2)}" cy="${(y - r * .35).toFixed(2)}" rx="${(r * .3).toFixed(2)}" ry="${(r * .2).toFixed(2)}" fill="#fff" opacity=".35"/>`;
  return cls ? `<g class="${cls}">${h}</g>` : h;
}
function flowerSVG(x, y, r, color, cls) {
  let h = '';
  for (let k = 0; k < 5; k++) {
    const a = (k * 72 - 90) * Math.PI / 180;
    h += `<circle class="pea" cx="${(x + r * .52 * Math.cos(a)).toFixed(2)}" cy="${(y + r * .52 * Math.sin(a)).toFixed(2)}" r="${(r * .5).toFixed(2)}" fill="${color}"/>`;
  }
  h += `<circle cx="${x}" cy="${y}" r="${(r * .26).toFixed(2)}" fill="#f5d36a" stroke="rgba(0,0,0,.35)" stroke-width=".6"/>`;
  return cls ? `<g class="${cls}">${h}</g>` : h;
}
function orgSVG(mode, k, x, y, r, cls) {
  if (k === 'U') return `<g${cls ? ` class="${cls}"` : ''}><circle class="pea" cx="${x}" cy="${y}" r="${r}" fill="${COL.U}"/><text x="${x}" y="${y}" fill="var(--fg)" font-size="${(r * 1.3).toFixed(1)}" font-family="IBM Plex Mono,monospace" text-anchor="middle" dominant-baseline="central">?</text></g>`;
  if (mode === 'flower') return flowerSVG(x, y, r * 1.15, COL[k], cls);
  return seedSVG(x, y, r, colOf(mode, k), mode === 'pea2' && k[1] === 'W', cls);
}
function parentSVG(mode, k, x, y) {
  if (mode === 'flower') {
    return `<path d="M${x},${y + 24}L${x},${y + 6}" stroke="#4f8f3c" stroke-width="2.6" stroke-linecap="round"/>` +
      `<ellipse cx="${x + 8}" cy="${y + 17}" rx="8" ry="3.4" transform="rotate(-28 ${x + 8} ${y + 17})" fill="#5d9f47" stroke="#1f3d1a" stroke-width=".7"/>` +
      `<ellipse cx="${x - 8}" cy="${y + 20}" rx="7" ry="3" transform="rotate(25 ${x - 8} ${y + 20})" fill="#5d9f47" stroke="#1f3d1a" stroke-width=".7"/>` +
      flowerSVG(x, y - 4, 19, colOf(mode, k));
  }
  let h = `<path d="M${x - 37},${y}Q${x},${y - 24} ${x + 37},${y}Q${x},${y + 24} ${x - 37},${y}Z" fill="#3e7a34" stroke="#1f3d1a" stroke-width="1.2"/>` +
    `<path d="M${x - 30},${y}Q${x},${y - 15} ${x + 30},${y}Q${x},${y + 15} ${x - 30},${y}Z" fill="#2c5a26"/>`;
  const col = k === 'U' ? COL.U : colOf(mode, k), wr = mode === 'pea2' && k[1] === 'W';
  for (const dx of [-17, 0, 17]) h += seedSVG(x + dx, y, 7.6, col, wr);
  return h;
}

// stage layout, viewBox units
const W = 360, PX = [80, 280], PY = 40, CHIP_Y = 66, GY = 118, PUN_Y = 144;
let geo = null;
function layout() {
  const di = L().genes.length === 2, n = di ? 4 : 2, c = di ? 36 : 48, h = di ? 34 : 28, w = h + n * c;
  const x0 = (W - w) / 2, end = PUN_Y + w, capY = end + 15, bedLbl = capY + 19, bedTop = bedLbl + 7;
  return { di, n, c, h, x0, capY, bedLbl, bedTop, H: bedTop + 5 * 16 + 4, gr: di ? 13 : 11 };
}
const chipOffsets = di => di ? [-50, -26, 6, 30] : [-23, 3];

function drawStage() {
  const Ls = L(), mode = Ls.mode, g = layout(); geo = g;
  const svg = $('#cross');
  svg.setAttribute('viewBox', `0 0 ${W} ${g.H}`);
  svg.style.aspectRatio = `${W} / ${g.H}`;
  let h = `<text class="s-row" x="10" y="${PY + 4}">P</text><text class="s-row" x="10" y="${GY + 4}">G</text><text class="s-row" x="10" y="${PUN_Y + g.h + 4}">F</text>`;
  h += `<text class="s-x" x="${W / 2}" y="${PY}">×</text>`;
  // parents
  h += `<g id="g-parents">`;
  [0, 1].forEach(i => {
    const x = PX[i], gd = dispG(i), k = ph(mode, gd);
    h += `<text class="s-lbl" x="${x}" y="11"><tspan fill="${i ? 'var(--arm)' : 'var(--force)'}">${i ? '♂' : '♀'}</tspan> ${hiddenNow() && !i ? 'жёлтый, генотип?' : ONE[k]}</text>`;
    h += parentSVG(mode, k, x, PY);

    letters.forEach((ch, idx) => {
      const gene = Ls.genes[g.di ? (idx < 2 ? 0 : 1) : 0], kk = idx % 2, cx = x + offs[idx];
      const lock = Ls.lock, dom = ch !== '?' && ch === ch.toUpperCase();
      h += `<g class="chip${dom ? ' dom' : ''}${lock ? ' lock' : ''}" data-chip="${i},${gene},${kk}" role="button" tabindex="0" aria-label="${i ? 'Отец' : 'Мать'}, аллель ${ch}${lock ? '' : ', нажмите, чтобы поменять'}"><rect x="${cx}" y="${CHIP_Y}" width="20" height="22" rx="5"/><text x="${cx + 10}" y="${CHIP_Y + 11.5}">${ch}</text></g>`;
    });
  });
  h += `<text class="s-note" x="${W / 2}" y="${CHIP_Y + 14}">${Ls.lock ? 'родители заданы' : 'буквы нажимаются'}</text></g>`;

    h += `<g class="gm ${i ? 'm' : 'f'}" data-gm="${i ? 'm' : 'f'}${j}"><circle cx="${x.toFixed(1)}" cy="${GY}" r="${g.gr}"/><text x="${x.toFixed(1)}" y="${GY}">${gm}</text></g>`;

  P.cols.forEach((gm, j) => { const x = x0 + g.h + c * j + c / 2; h += `<g class="gm m" data-gm="hm${j}"><circle cx="${x}" cy="${top + g.h / 2}" r="${g.gr}"/><text x="${x}" y="${top + g.h / 2}">${gm}</text></g>`; });
  P.rows.forEach((gm, i) => { const y = top + g.h + c * i + c / 2; h += `<g class="gm f" data-gm="hf${i}"><circle cx="${x0 + g.h / 2}" cy="${y}" r="${g.gr}"/><text x="${x0 + g.h / 2}" y="${y}">${gm}</text></g>`; });
  P.cells.forEach((cl, idx) => {

      orgSVG(mode, cl.k, x + c / 2, y + (g.di ? 24.5 : 31), g.di ? 6.2 : 8.5) + `</g>`;
  });
  h += `<text class="s-note" id="cap" x="${W / 2}" y="${g.capY}"></text></g>`;
  h += `<g id="g-bed"></g>`;
  svg.innerHTML = h;

}

function drawBed(anim) {
  const g = geo, mode = L().mode, r = S.res, bed = $('#g-bed');
  let h = `<text class="s-note" x="${W / 2}" y="${g.bedLbl}">${r ? `Потомство: ${r.n} ${plural(r.n, 'растение', 'растения', 'растений')}${r.n > 100 ? ' · показаны первые 100' : ''}` : 'Здесь вырастет потомство — нажмите «Вырастить»'}</text>`;
  const x0 = (W - 20 * 16) / 2 + 8;
  if (!r) for (let i = 0; i < 100; i++) h += `<circle class="slot" cx="${x0 + (i % 20) * 16}" cy="${g.bedTop + 8 + Math.floor(i / 20) * 16}" r="1.6"/>`;
  else r.list.forEach((k, i) => {
    const x = x0 + (i % 20) * 16, y = g.bedTop + 8 + Math.floor(i / 20) * 16;
    const s = orgSVG(mode, k, x, y, mode === 'flower' ? 5.4 : 6, anim && !reduce ? 'sprout' : '');

function setHl(idx) {

  [`[data-cell="${idx}"]`, `[data-gm="f${cl.i}"]`, `[data-gm="m${cl.j}"]`, `[data-gm="hf${cl.i}"]`, `[data-gm="hm${cl.j}"]`].forEach(s => { const e = svg.querySelector(s); if (e) e.classList.add('on'); });
  cap.textContent = `♀ ${cl.r} + ♂ ${cl.c} → ${cl.s} · ${cl.k === 'U' ? 'пока неизвестно' : ONE[cl.k]} · шанс ${frac(1, P.cells.length)}`;
}

// Punnett scrubbing: works with mouse and touch
const svgEl = $('#cross');
let scrub = false;
const cellAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest && el.closest('.cell'); return c ? +c.dataset.cell : -1; };
svgEl.addEventListener('pointerdown', e => { const i = cellAt(e); if (i >= 0) { scrub = true; try { svgEl.setPointerCapture(e.pointerId); } catch (er) {} setHl(i); } });
svgEl.addEventListener('pointermove', e => { if (!scrub && e.pointerType !== 'mouse') return; const i = cellAt(e); if (i >= 0 && i !== S.hl) setHl(i); });

function setGeno(i, gene, val) { if (L().lock) return; S.p[i][gene] = val; changed(); }
function grow() {

function newUnknown() { S.hidden = Math.random() < 0.5 ? 'AA' : 'Aa'; S.solved = false; S.res = null; drawStage(); update(); }
function answer(a) {
  const r = S.res;
  if (S.solved) return;

  if (a === S.hidden) {
    S.solved = true;
    toast(a === 'AA' ? `Верно: все ${r.n} потомков жёлтые, значит ♀ — AA.` : 'Верно: появились зелёные aa, значит ♀ несёт аллель a — это Aa.');
    drawStage(); update(); return;
  }
  if (a === 'AA' && green) return toast('Не сходится: зелёная горошина aa получила a от каждого родителя. Значит, у ♀ есть a.');
  if (a === 'AA') return toast(`Пока все жёлтые, но ${r.n} — маловато. Вырастите 1000 и проверьте ещё раз.`);

}

function sdNote(r, p) {
  const sd = Math.sqrt(p * (1 - p) / r.n);
  return `При ${r.n} потомках обычный разброс около ±${pct(sd)} от теории. Чем больше потомков, тем ближе опыт к расчёту — это закон больших чисел.`;
}
function obsBlock(d, tot) {
  const r = S.res, cls = CLS[L().mode];
  if (!r) return `<h3>Опыт</h3><p class="note">Вырастите потомство, и здесь появится сравнение с теорией.</p>`;
  const present = cls.filter(c => r.counts[c.k]), min = Math.min(...present.map(c => r.counts[c.k]));
  let h = `<h3>Опыт: ${r.n} ${plural(r.n, 'потомок', 'потомка', 'потомков')}</h3><div class="steps">` +
    cls.filter(c => r.counts[c.k] || (d && d[c.k])).map(c => step(c.name, `${r.counts[c.k] || 0} · ${pct((r.counts[c.k] || 0) / r.n)}${d ? ` (теория ${pct((d[c.k] || 0) / tot)})` : ''}`)).join('') +
    step('отношение', present.map(c => fmt(r.counts[c.k] / min, 2)).join(' : '), 'sum') + `</div>`;
  if (d) { const big = cls.reduce((a, c) => (d[c.k] || 0) > (d[a.k] || 0) ? c : a, cls[0]); const p = (d[big.k] || 0) / tot; if (p > 0 && p < 1) h += `<p class="note" style="margin-top:10px">${sdNote(r, p)}</p>`; }
  return h;
}
function calcHTML() {

    <p class="note">Гаметы отца и матери встречаются случайно и независимо, поэтому вероятность потомка — произведение вероятностей двух гамет.</p>`;
  if (hiddenNow()) {

    h += `<h3>Две гипотезы</h3><div class="steps">` +
      step('если ♀ = AA', 'гаметы A → все Aa, жёлтые') +
      step('если ♀ = Aa', 'A, a по 1/2 → Aa : aa = 1 : 1') + `</div>`;
    if (r) {
      const p = Math.pow(0.5, r.n), green = r.counts.G || 0;
      h += `<h3>Что говорит опыт</h3><div class="steps">` + step('жёлтые', String(r.counts.Y || 0)) + step('зелёные', String(green)) + `</div>`;
      h += green ? `<p class="note" style="margin-top:10px">Есть зелёные aa. Каждая получила a от обоих родителей, значит у ♀ точно есть аллель a.</p>`
        : `<p class="note" style="margin-top:10px">Зелёных нет. Если бы ♀ была Aa, шанс получить всех ${r.n} жёлтых — (1/2)<sup>${r.n}</sup> ${p > 1e-6 ? '≈ ' + (p >= 0.001 ? pct(p, 2) : '1 из ' + Math.round(1 / p).toLocaleString('ru-RU')) : '— меньше одной миллионной'}.</p>`;
    } else h += `<p class="note" style="margin-top:10px">Вырастите потомство и сравните с гипотезами.</p>`;
    return h;
  }
  const P = curP(), tot = P.cells.length, d = dist(P);
  h += `<h3>Гаметы</h3><div class="steps">` + [0, 1].map(i => {
    const u = uniq(gametesOf(dispG(i))), n = gametesOf(dispG(i)).length;
    return step(`${i ? '♂' : '♀'} ${gStr(dispG(i))}`, Object.keys(u).map(k => `${k} — ${frac(u[k], n)}`).join(', '));
  }).join('') + step('одна клетка решётки', `${frac(1, P.rows.length)} × ${frac(1, P.cols.length)} = ${frac(1, tot)}`, 'sum') + `</div>`;
  const gt = uniq(P.cells.map(c => c.s)), gtKeys = Object.keys(gt).sort(gtSort);
  h += `<h3>Генотипы потомства</h3><div class="steps">` + gtKeys.map(k => step(k, `${gt[k]} из ${tot} = ${frac(gt[k], tot)}`)).join('') + `</div>`;
  h += `<h3>Фенотипы</h3><div class="steps">` + cls.map(c => {
    const ks = gtKeys.filter(k => P.cells.find(x => x.s === k).k === c.k);
    const sum = ks.reduce((a, k) => a + gt[k], 0);
    return step(c.name, ks.length ? `${ks.length > 1 ? ks.join(' + ') + ' = ' : ''}${frac(sum, tot)} · ${pct(sum / tot)}` : '0');
  }).join('') + step('расщепление', ratioStr(d) === 'все' ? 'все одинаковые' : ratioStr(d), 'sum') + `</div>`;
  if (di) {
    const pA = (() => { const u = punnettGene('A'); return u; })(), pB = punnettGene('B');
    h += `<h3>Без решётки: правило умножения</h3><div class="steps">` +
      step('жёлтые', pA.txt) + step('гладкие', pB.txt) +
      cls.map(c => { const a = c.k[0] === 'Y' ? pA.d : 1 - pA.d, b = c.k[1] === 'S' ? pB.d : 1 - pB.d; return step(c.name, `${fracF(a)} × ${fracF(b)} = ${fracF(a * b)}`); }).join('') + `</div>`;
  }
  h += `<h3>Сколько ждать из ${S.n}</h3><div class="steps">` + cls.filter(c => d[c.k]).map(c => step(c.name, `${S.n} × ${frac(d[c.k], tot)} = ${fmt(S.n * d[c.k] / tot, 1).replace(/,0$/, '')}`)).join('') + `</div>`;
  h += obsBlock(d, tot);
  return h;
}
// single-gene probability of the dominant phenotype for the dihybrid product rule
function punnettGene(gene) {
  const a = dispG(0)[gene], b = dispG(1)[gene]; let k = 0;
  for (const x of a) for (const y of b) if (x === x.toUpperCase() || y === y.toUpperCase()) k++;
  return { d: k / 4, txt: `${frac(k, 4)} (${a} × ${b})` };
}
const fracF = x => { const t = 16, k = Math.round(x * t); return frac(k, t); };

  const exp = {}, obs = {};
  cls.forEach(c => { exp[c.k] = d ? (d[c.k] || 0) / tot : 0; obs[c.k] = r ? (r.counts[c.k] || 0) / r.n : 0; });
  let h = `<div class="k">Потомство</div><div class="v">${r ? `${r.n} шт.` : d ? 'ждём ' + (ratioStr(d) === 'все' ? 'все одинаковые' : ratioStr(d)) : 'ждём ?'}</div>`;
  h += `<div class="stackl"><span>опыт</span><span>${r ? '' : 'пока пусто'}</span></div>${bar(obs)}`;
  h += `<div class="stackl"><span>теория</span><span>${d ? ratioStr(d) : '?'}</span></div>${d ? bar(exp) : '<div class="stack"></div>'}`;
  h += `<div class="rrows">` + cls.map(c => `<i style="background:${colOf(L().mode, c.k)}"></i><span>${c.short}</span><b>${r ? pct(obs[c.k]) : '—'}</b><em>${d ? pct(exp[c.k], 0) : '?'}</em>`).join('') + `</div>`;
  $('#result').innerHTML = h;
}

function update() {
  const Ls = L();
  if (!S.done[Ls.id] && CHECK[Ls.id]()) {
    S.done[Ls.id] = true; save(); renderStrip();
    if (Ls.id !== 'test') toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены.');
  }
  renderResult();
  $('#taskState').textContent = taskState();
  $('#taskState').classList.toggle('done', !!S.done[Ls.id] && (Ls.id !== 'test' || S.solved));
  $('#taskAns').innerHTML = ansHTML();
  renderPanes();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
}

function miniSVG(Ls) {
  const m = Ls.mini, mc = k => k === 'U' ? COL.U : Ls.mode === 'pea2' ? ({ S: COL.Y, Y: '#c7a537', G: COL.G, g: '#5f8f3f' })[k] || COL[k[0]] : COL[k];
  let h = '';
  m.p.forEach((k, i) => { const x = 7 + i * 14; h += `<circle cx="${x}" cy="15" r="4.6" fill="${Ls.mode === 'pea2' ? COL[k[0]] : mc(k)}" stroke="rgba(0,0,0,.4)" stroke-width=".6"/>`; if (k === 'U') h += `<text x="${x}" y="17.3" font-size="6.5" text-anchor="middle" fill="var(--fg)" font-family="monospace">?</text>`; });
  h += `<path d="M12.6 13.2l2.8 3.6M15.4 13.2l-2.8 3.6M28 15h6M31.5 12.5l2.5 2.5-2.5 2.5" stroke="var(--muted)" stroke-width=".9" fill="none"/>`;
  const f = m.f.split(''), big = f.length > 8, cols = big ? 8 : 4, sp = big ? 3.6 : 7, r = big ? 1.5 : 2.8, x0 = big ? 38 : 40, y0 = big ? 12.5 : 11;
  f.forEach((k, i) => { h += `<circle cx="${(x0 + (i % cols) * sp).toFixed(1)}" cy="${(y0 + Math.floor(i / cols) * (big ? 5 : 8)).toFixed(1)}" r="${r}" fill="${mc(k)}"/>`; });
  return h;
}
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${miniSVG(Ls)}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.p = Ls.p.map(g => Object.assign({}, g)); S.res = null; S.hl = -1;
  S.hidden = Math.random() < 0.5 ? 'AA' : 'Aa'; S.solved = false;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  renderStrip(); drawStage(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const Ls = L(), r = S.res, cls = CLS[Ls.mode];
  const pd = i => { const g = dispG(i); return `${gStr(g)} (${hiddenNow() && !i ? 'жёлтая, генотип скрыт от ученика: AA или Aa — не называй ответ, наводи вопросами' : ONE[ph(Ls.mode, g)]})`; };
  const lines = [
    `Раздел: биология, генетика, законы Менделя. Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[Ls.id] ? 'выполнено' : 'не выполнено'}. Подсказка на экране: ${taskState()}.`,
    `Признаки: ${traitLine()}`,
    `Родители: ♀ ${pd(0)} × ♂ ${pd(1)}.`,
  ];
  if (!hiddenNow()) {
    const P = curP(), d = dist(P);
    lines.push(`Гаметы: ♀ ${[...new Set(P.rows)].join(', ')}; ♂ ${[...new Set(P.cols)].join(', ')}. Решётка Пеннета ${P.rows.length}×${P.cols.length}: ${P.cells.map(c => c.s).join(', ')}.`);
    lines.push(`Ожидаемое расщепление по фенотипу: ${ratioText(d)}.`);
    if (S.hl >= 0 && P.cells[S.hl]) { const c = P.cells[S.hl]; lines.push(`Ученик выделил клетку решётки: ♀ ${c.r} + ♂ ${c.c} → ${c.s} (${ONE[c.k]}).`); }
  } else lines.push('Решётка показывает гаметы ♀ как A и ?, потому что генотип скрыт.');
  lines.push(r ? `Последний опыт: выращено ${r.n}; ${cls.map(c => `${c.name} ${r.counts[c.k] || 0} (${pct((r.counts[c.k] || 0) / r.n)})`).join(', ')}.` : `Потомство ещё не выращивали; выбрано ${S.n} потомков.`);
  lines.push(`Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`);
  return lines.join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L();
  const q = { dom: 'Почему гибрид Aa жёлтый, а не зелёный?', split: 'Почему на 10 горошинах не выходит ровно 3 : 1?',
    test: 'Как по потомству узнать генотип родителя?', incomplete: 'Чем неполное доминирование отличается от полного?',
    dihybrid: 'Откуда берётся 9 : 3 : 3 : 1?' }[Ls.id];
  return [S.done[Ls.id] ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где законы Менделя пригодятся в жизни?'];
};

setN(100);
setLesson(S.lesson);
})();
</script>
