<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике: центр тяжести, условия равновесия (сумма сил и моментов), виды равновесия, устойчивость и опрокидывание.">
<title>Статика: равновесие тел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /labs/phys-machines. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .lbl{font-size:12px;color:var(--force);padding:0 4px 0 6px;white-space:nowrap}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Статика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов по статике: пластины на гвоздике с отвесом, балка на весах, кронштейн, шарик в чаше, наклонная доска и башенный кран. Детали можно тянуть и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>

    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>

  <nav class="strip" aria-label="Уроки">

    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const PI = Math.PI, DEG = 180 / PI;

const LESSONS = [
  { id: 'cg', title: 'Центр тяжести',
    text: ['На каждую частичку тела действует сила тяжести. Все эти маленькие силы можно заменить одной — силой тяжести всего тела, приложенной в одной точке. Эта точка — центр тяжести: как бы тело ни повернули, сила тяжести действует так, будто вся масса собрана в ней.',
           'Тело, подвешенное на гвоздик, качается и успокаивается так, что центр тяжести оказывается точно под точкой подвеса — на вертикали, которую показывает отвес. Подвесим пластину за одну точку и проведём линию по отвесу, потом подвесим за другую — центр тяжести лежит на пересечении линий.',
           'У однородных симметричных тел центр тяжести совпадает с центром симметрии: у прямоугольника — пересечение диагоналей, у круга — его центр, у треугольника — точка пересечения медиан. У тела сложной формы его находят опытом, и он может оказаться даже вне тела — как у уголка или бублика.'],
    why: 'Конструкторы самолётов и дронов следят, чтобы центр тяжести был в строго заданном месте: сместится он слишком назад — машина станет неуправляемой, поэтому груз и пассажиров размещают по схеме загрузки. Инженеры-робототехники рассчитывают центр тяжести человекоподобных роботов — Boston Dynamics Atlas, Tesla Optimus — и всё время держат его над стопами, чтобы робот не упал на ходу. Смартфоны, кроссовки, гоночные машины, ракеты — всё проектируют с учётом центра тяжести. В ближайшие 10 лет рутинные расчёты всё больше будет делать ИИ, но поставить задачу и заметить, что модель ошиблась, сможет только инженер, который понимает физику, — поэтому инженеры-механики, конструкторы и робототехники останутся востребованными.',
    task: 'Найдите центр тяжести прямоугольной пластины и пластины неправильной формы: подвесьте каждую за два разных отверстия и проведите линии по отвесу.',
    hint: 'Нажмите на отверстие — пластина повиснет на нём. Когда она успокоится, нажмите «Провести линию». Пластину можно качнуть мышкой.',
    stage: 'Нажмите на отверстие — подвесить за него. Пластину можно качнуть.',
    check: m => m.rect && m.blob },
  { id: 'cond', title: 'Условия равновесия',
    text: ['Тело покоится, если действующие на него силы уравновешены. Первое условие равновесия: сумма всех сил равна нулю. Для балки на двух опорах: опоры давят на балку вверх с силами N_A и N_B и вместе держат вес балки и грузов: N_A + N_B = Pб + P₁ + P₂.',
           'Второе условие: сумма моментов сил относительно любой оси равна нулю — иначе балка начала бы поворачиваться. Момент силы M = F · l, где l — плечо, кратчайшее расстояние от оси до линии действия силы. Ось удобно взять в опоре: у её силы плечо равно нулю, и она выпадает из уравнения.',
           'Так находят реакции опор: из уравнения моментов относительно опоры A получаем N_B, а потом из суммы сил — N_A. Тот же приём работает для кронштейна: момент силы натяжения троса относительно шарнира уравновешивает момент веса груза.'],

function centroid(P) {
  let A = 0, cx = 0, cy = 0;
  for (let i = 0; i < P.length; i++) { const [x0, y0] = P[i], [x1, y1] = P[(i + 1) % P.length], f = x0 * y1 - x1 * y0; A += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f; }
  A /= 2; return [cx / (6 * A), cy / (6 * A)];
}
for (const k in SHAPES) SHAPES[k].c = centroid(SHAPES[k].pts);
function inPoly(P, x, y) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; }
  return c;
}
// line through hole p and the centre of gravity, from edge to edge (plate coordinates)
function lineSeg(sh, p) {
  const c = sh.c, dx = c[0] - p[0], dy = c[1] - p[1], Ln = Math.hypot(dx, dy), ux = dx / Ln, uy = dy / Ln, P = sh.pts;
  let tmax = Ln;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length], ex = b[0] - a[0], ey = b[1] - a[1], den = ux * ey - uy * ex;
    if (Math.abs(den) < 1e-9) continue;
    const wx = a[0] - p[0], wy = a[1] - p[1], t = (wx * ey - wy * ex) / den, s = (wx * uy - wy * ux) / den;
    if (s >= -1e-9 && s <= 1 + 1e-9 && t > 0) tmax = Math.max(tmax, t);
  }
  return [p[0] - ux * 12, p[1] - uy * 12, p[0] + ux * (tmax + 12), p[1] + uy * (tmax + 12)];
}
// the parts of that line that lie on the plate (for the 3D view)
function runs(sh, seg) {
  const out = [], n = 120; let st = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = seg[0] + (seg[2] - seg[0]) * t, y = seg[1] + (seg[3] - seg[1]) * t, inside = inPoly(sh.pts, x, y);
    if (inside && !st) st = [x, y];
    if ((!inside || i === n) && st) { out.push([st[0], st[1], x, y].map(v => Math.round(v * 10) / 10)); st = null; }
  }
  return out;
}

const toWorld = (q, sh = SHAPES[S.shape]) => { const p = sh.holes[S.hole], x = q[0] - p[0], y = q[1] - p[1], c = Math.cos(S.th), s = Math.sin(S.th); return [PV.x + x * c - y * s, PV.y + x * s + y * c]; };

function calcHTML(m) {

      <h3>${SHAPES[S.shape].n}</h3><div class="steps">` + step1('линий проведено', n) + step1('центр тяжести', n >= 2 ? 'найден' : 'нужны 2 линии', 'sum') + `</div><p class="note" style="margin-top:10px">Где он: ${where}.</p>
      <h3>Расчёт для уголка</h3><div class="steps">` + step1('полоса 4 × 15 см', 'S₁ = 60 см², центр x₁ = −5 см') + step1('полоса 10,5 × 4 см', 'S₂ = 42 см², центр x₂ = 2,25 см') +
      step1('x центра тяжести', '(60·(−5) + 42·2,25) / 102 ≈ −2,0 см', 'sum') + `</div><p class="note" style="margin-top:10px">Координаты отсчитаны от середины пластины. Точка x ≈ −2 см, y ≈ 2,3 см лежит в вырезе — вне материала.</p>`;
  }
  if (id === 'cond' && S.setup === 'beam') {
    const R = reac(), mom = BM.Pb * 50 + LA * S.xa + LB * S.xb, q = v => S.ans ? fmt(v, 1) + ' Н' : '?';
    return `<h2>Балка на двух опорах</h2><div class="formula">ΣF = 0    ΣM = 0</div><p class="note">Опоры — под концами балки, на 0 и 100 см. Ось моментов — в опоре A: у силы N_A плечо 0, и она выпадает из уравнения.</p>
      <h3>Моменты относительно опоры A</h3><div class="steps">` + step1('балка 10 Н × 50 см', '500 Н·см') + step1(`груз 20 Н × ${S.xa} см`, `${LA * S.xa} Н·см`) + step1(`груз 10 Н × ${S.xb} см`, `${LB * S.xb} Н·см`) +

      <h3>Сумма сил</h3><div class="steps">` + step1('N_A + N_B', '10 + 20 + 10 = 40 Н') + step1('N_A = 40 − N_B', q(R.NA), 'sum') + `</div>
      <p class="note" style="margin-top:10px">Опоры нагружены поровну, когда моменты грузов относительно середины балки равны: 20 · (50 − x₁) = 10 · (x₂ − 50).</p>`;
  }
  if (id === 'cond') {

      <h3>Фонарь на конце (x = 60 см)</h3><div class="steps">` + BR.angs.map(a => step1('α = ' + a + '°', `T = 20 / sin ${a}° = ${fmt(20 / Math.sin(a / DEG), 1)} Н`)).join('') + `</div>

  if (id === 'kinds') {
    if (S.sh3 === 'toy') { const a = toyAy(); return `<h2>Ванька-встанька</h2><div class="formula">h = R − a · cos φ</div><p class="note">h — высота центра тяжести над столом, R — радиус донышка, a — расстояние от центра донышка до центра тяжести (вниз — плюс), φ — угол наклона.</p>
      <h3>Сейчас</h3><div class="steps">` + step1('R', '4,6 см') + step1('a', S.toy === 'low' ? '+2 см (ЦТ ниже центра)' : '−3 см (ЦТ выше центра)') + step1('наклон φ', Math.round(Math.abs(S.phi) * DEG) + '°') + step1('ЦТ поднялся на', fmt(a * (1 - Math.cos(S.phi)) / 10, 2) + ' см', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Если a > 0, при наклоне h растёт — игрушка возвращается: равновесие устойчивое. Если a < 0, h уменьшается — игрушка падает.</p>`; }
    const [, by] = ballPos(), dh = (yRest() - by) / 10;
    return `<h2>Высота центра тяжести</h2><div class="formula">Eп = m · g · h</div><p class="note">Тело само движется туда, где его потенциальная энергия меньше, то есть где центр тяжести ниже.</p>
      <div class="steps">` + step1('чаша', 'при сдвиге ЦТ выше → назад') + step1('купол', 'при сдвиге ЦТ ниже → прочь') + step1('стол', 'ЦТ на той же высоте') + `</div>
      <h3>Сейчас: ${SH3[S.sh3].toLowerCase()}</h3><div class="steps">` + step1('сдвиг шарика', fmt(S.u / 10, 1) + ' см') + step1('ЦТ относительно покоя', (dh >= 0 ? '+' : '') + fmt(dh, 2) + ' см', 'sum') + `</div>`;
  }
  if (S.setup === 'slope') {
    const o = OBJ[S.obj];
    return `<h2>Когда тело опрокинется</h2><div class="formula">tg α = (b / 2) / h</div><p class="note">b — ширина основания, h — высота центра тяжести. При таком угле вертикаль через центр тяжести проходит точно через нижний край основания.</p>
      <h3>${o.n}</h3><div class="steps">` + step1('b / 2', o.b / 2 + ' см') + step1('h', o.hc + ' см') + step1('tg α = (b/2) / h', fmt(o.b / 2 / o.hc, 2)) + step1('сейчас tg ' + S.al + '°', fmt(Math.tan(S.al / DEG), 2), 'sum') + `</div>
      <h3>Записи</h3><div class="steps">` + Object.keys(OBJ).map(k => step1(OBJ[k].n, S.tipRec[k] != null ? `${S.tipRec[k]}°` : '—')).join('') + `</div>
      <p class="note" style="margin-top:10px">Шире основание или ниже центр тяжести — больше tg α, тело устойчивее.</p>`;
  }
  const xc = craneXc();
  return `<h2>Устойчивость крана</h2><div class="formula">x = Σ Pᵢ xᵢ / Σ Pᵢ</div><p class="note">Координаты — от оси башни, вперёд — плюс. Кран стоит, пока общий центр тяжести между опорами: −2,5 м ≤ x ≤ 2,5 м.</p>
    <h3>Сейчас</h3><div class="steps">` + step1('башня и стрела', '100 кН × 1 м') + step1('противовес', `${S.wc} кН × (−7 м)`) + step1('груз', `${S.P} кН × ${S.xt} м`) +
    step1('x', `(100 − ${7 * S.wc} + ${S.P * S.xt}) / ${100 + S.wc + S.P} = ${fmt(xc, 2)} м`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">${Math.abs(xc) <= CR.edge ? 'Центр тяжести между опорами — кран стоит.' : xc > 0 ? 'Центр тяжести впереди передних опор — кран опрокидывается вперёд.' : 'Центр тяжести позади задних опор — кран опрокидывается назад.'}</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const row = (a, b, cls) => `<div class="lr"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`;
  if (id === 'cg') { const n = (S.lines[S.shape] || []).length, e = Math.round(Math.abs(Math.atan2(Math.sin(S.th - th0()), Math.cos(S.th - th0()))) * DEG); el.innerHTML = `<div class="k">Пластина</div><div class="v">${SHAPES[S.shape].n}</div>` + row('отверстие', S.hole + 1) + row('отклонение', e + '°', e === 0 ? 'ok' : '') + row('линий', n) + row('ЦТ', n >= 2 ? 'найден' : '—', n >= 2 ? 'ok' : ''); }
  else if (id === 'cond' && S.setup === 'beam') el.innerHTML = `<div class="k">Весы</div><div class="v ${S.ans ? 'ok' : ''}">A: ${S.ans ? nf(Math.round(m.NA * 10) / 10) : '?'} · B: ${S.ans ? nf(Math.round(m.NB * 10) / 10) : '?'}</div>` + row('ΣP', '40 Н') + row('N_A + N_B', S.ans ? '40 Н' : '?') + row('ΣF, ΣM', '0', 'ok');
  else if (id === 'cond') { const over = m.T > BR.lim + 1e-9; el.innerHTML = `<div class="k">Натяжение троса</div><div class="v ${over ? 'bad' : 'ok'}">T = ${fmt(m.T, 1)} Н</div>` + row('угол α', S.ang + '°') + row('фонарь x', S.xl + ' см') + row('предел', '30 Н', over ? 'bad' : ''); }
  else if (id === 'kinds' && S.sh3 !== 'toy') { const [, by] = ballPos(), dh = (yRest() - by) / 10, mv = Math.abs(S.v) > 0.5 || S.drop > 0; el.innerHTML = `<div class="k">${SH3[S.sh3]}</div><div class="v">${mv ? 'катится' : 'покой'}</div>` + row('сдвиг', fmt(S.u / 10, 1) + ' см') + row('ЦТ', (dh >= 0 ? '+' : '') + fmt(dh, 1) + ' см', dh > 0.05 ? 'ok' : dh < -0.05 ? 'bad' : ''); }
  else if (id === 'kinds') el.innerHTML = `<div class="k">Ванька-встанька</div><div class="v ${S.lying ? 'bad' : ''}">${S.lying ? 'упала' : Math.abs(S.phi) < 0.01 ? 'стоит' : 'качается'}</div>` + row('наклон', Math.round(Math.abs(S.phi) * DEG) + '°') + row('груз', S.toy === 'low' ? 'внизу' : 'в голове') + row('ЦТ', (toyAy() >= 0 ? '+' : '−') + fmt(Math.abs(toyAy() * (1 - Math.cos(S.phi))) / 10, 1) + ' см');
  else if (S.setup === 'slope') el.innerHTML = `<div class="k">Наклон доски</div><div class="v ${S.fallen || S.tipping ? 'bad' : ''}">α = ${S.al}°</div>` + row('tg α', fmt(Math.tan(S.al / DEG), 2)) + row('шкаф', S.fallen ? 'упал' : S.tipping ? 'падает' : 'стоит', S.fallen || S.tipping ? 'bad' : 'ok');
  else { const ok = craneOk() && !S.cfall; el.innerHTML = `<div class="k">Общий ЦТ крана</div><div class="v ${ok ? 'ok' : 'bad'}">x = ${fmt(m.xc, 2)} м</div>` + row('опоры', '±2,5 м') + row('противовес', S.wc + ' кН') + row('груз · вылет', `${S.P} кН · ${S.xt} м`) + row('кран', S.cfall ? 'упал' : 'стоит', ok ? 'ok' : 'bad'); }
}

function update() {
  latch();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, почему тела стоят, качаются и падают!'), 2200);
  }
  renderTools();
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  cg: '<path d="M44 3H58V28" stroke="#6c7a96" stroke-width="2" fill="none"/><path d="M24 7l15-3 6 12-9 11-14-4z" fill="#e3cfa6"/><path d="M39 4v24" stroke="#e8ecf4" stroke-width="1"/><path d="M24 7l15 14M39 4L28 22" stroke="#2f6fd8" stroke-width="1.2"/><circle cx="33" cy="14" r="2.2" fill="#ff8a73"/>',
  cond: '<rect x="6" y="11" width="54" height="4" fill="#c98f55"/><path d="M8 15l-4 7h8zM58 15l-4 7h8z" fill="#6c7a96"/><rect x="18" y="5" width="9" height="6" rx="1" fill="#7d8799"/><rect x="40" y="7" width="7" height="4" rx="1" fill="#7d8799"/><path d="M8 28v-5M58 28v-5" stroke="#86e0a8" stroke-width="1.6"/>',
  kinds: '<path d="M2 14Q11 30 20 14V28H2z" fill="#b47944"/><circle cx="11" cy="18" r="3" fill="#c6ccd6"/><path d="M24 28V22Q33 6 42 22V28z" fill="#b47944"/><circle cx="33" cy="11" r="3" fill="#c6ccd6"/><rect x="46" y="20" width="18" height="8" fill="#b47944"/><circle cx="55" cy="17" r="3" fill="#c6ccd6"/>',
  tip: '<path d="M4 27L40 13l1 2L5 29z" fill="#c98f55"/><g transform="translate(22 20) rotate(-21)"><rect x="-3" y="-15" width="7" height="15" fill="#b47944"/></g><path d="M50 27V8M44 8h20" stroke="#f2c94c" stroke-width="2"/><rect x="42" y="9" width="5" height="4" fill="#9aa3b2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  toolsHTML = ''; renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'cg') now = `Картонная пластина «${SHAPES[S.shape].n}» висит на гвоздике за отверстие №${S.hole + 1}, рядом с гвоздика свисает отвес. Отклонение от равновесия ${Math.round(Math.abs(Math.atan2(Math.sin(S.th - th0()), Math.cos(S.th - th0()))) * DEG)}°. Проведено линий по отвесу на этой пластине: ${(S.lines[S.shape] || []).length}. Центр тяжести найден: ${SHK.filter(k => S.found[k]).map(k => SHAPES[k].n).join(', ') || 'пока ни у одной'}. Не говори, где центр тяжести, — наводи: где оказывается центр тяжести подвешенного тела, сколько линий нужно, чтобы найти точку.`;
  if (id === 'cond' && S.setup === 'beam') { const R = reac(); now = `Однородная балка 1 м весом 10 Н лежит концами на двух опорах (0 и 100 см), под опорами весы. Груз 20 Н стоит на ${S.xa} см, груз 10 Н — на ${S.xb} см. Реакции: N_A = ${fmt(R.NA, 1)} Н, N_B = ${fmt(R.NB, 1)} Н (ученик видит их, только если ответил: ${S.ans ? 'ответил верно' : 'ещё нет — не называй числа, наводи к уравнению моментов относительно опоры'}). Опоры поровну: ${S.eq ? 'сделано' : 'нет'}.`; }
  if (id === 'cond' && S.setup === 'bracket') now = `Кронштейн: лёгкий стержень 60 см на шарнире в стене, трос от конца стержня к стене под углом ${S.ang}° к стержню. Фонарь 20 Н висит в ${S.xl} см от стены. Натяжение троса ${fmt(tens(), 1)} Н, трос выдерживает 30 Н. Подзадача (фонарь на конце, T ≤ 30 Н): ${S.br ? 'сделано' : 'нет'}. Нужный угол не называй — наводи к T · l · sin α = P · x.`;
  if (id === 'kinds') now = S.sh3 === 'toy' ? `Ванька-встанька с грузом ${S.toy === 'low' ? 'в донышке (центр тяжести ниже центра донышка)' : 'в голове (центр тяжести выше центра донышка)'}; наклон ${Math.round(Math.abs(S.phi) * DEG)}°, ${S.lying ? 'игрушка упала' : 'стоит или качается'}.` : `Стальной шарик ${S.sh3 === 'bowl' ? 'в чаше' : S.sh3 === 'dome' ? 'на куполе' : 'на ровном столе'}, сдвиг ${fmt(S.u / 10, 1)} см${S.off ? ', скатился с купола на стол' : ''}.`;
  if (id === 'kinds') now += ` Определено: ${['bowl', 'dome', 'flat'].filter(k => S.cls[k]).map(k => SH3[k]).join(', ') || 'ничего'}; игрушка с грузом внизу — ${S.toyLow ? 'проверена' : 'нет'}, с грузом в голове — ${S.toyHigh ? 'проверена' : 'нет'}. Вид равновесия не называй — спроси, вернулся ли шарик и поднялся ли центр тяжести.`;
  if (id === 'tip' && S.setup === 'slope') now = `${OBJ[S.obj].n} (основание ${OBJ[S.obj].b} см, центр тяжести на высоте ${OBJ[S.obj].hc} см) стоит у упора на доске, наклонённой на ${S.al}°; ${S.fallen ? `опрокинулся при ${S.tipAl}°` : S.tipping ? 'опрокидывается' : 'стоит'}. Записи: ${Object.keys(OBJ).filter(k => S.tipRec[k] != null).map(k => `${OBJ[k].n} — ${S.tipRec[k]}°`).join('; ') || 'нет'}. Наводи к tg α = (b/2)/h.`;
  if (id === 'tip' && S.setup === 'crane') now = `Башенный кран: башня со стрелой 100 кН (ЦТ на +1 м), противовес ${S.wc} кН на −7 м, груз ${S.P} кН на вылете ${S.xt} м, опоры на ±2,5 м. Общий ЦТ x = ${fmt(craneXc(), 2)} м; кран ${S.cfall ? 'опрокинулся' : 'стоит'}. Подходящий противовес не называй — наводи к расчёту x для пустого крана и с грузом.`;
  if (id === 'tip') now += ` Подзадачи: высокий шкаф — ${S.tipRec.tall != null ? 'сделано' : 'нет'}, с грузом внизу — ${S.tipRec.tallw != null ? 'сделано' : 'нет'}, кран — ${S.crane ? 'сделано' : 'нет'}.`;
  return [
    `Раздел: физика, 7–10 класс, тема «Статика: равновесие тел». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}». g ≈ 10 Н/кг.`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { cg: 'Почему центр тяжести может оказаться вне тела?', cond: 'Почему ось моментов удобно брать в опоре?', kinds: 'Как роботы держат равновесие при ходьбе?', tip: 'Почему Пизанская башня не падает?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-statics.js): the same set-up as real lab equipment
window.LUCH_REAL = () => {
  const id = LID(), M = { module: 'statics' };
  if (id === 'cg') {
    const sh = SHAPES[S.shape], ls = S.lines[S.shape] || [];
    return { ...M, scene: 'statics-cg', help: 'Пластина — следующее отверстие, гвоздик — провести линию', shape: S.shape, name: sh.n, pts: sh.pts, holes: sh.holes, hole: S.hole,
      lines: ls.map(i => runs(sh, lineSeg(sh, sh.holes[i]))).flat(), cg: ls.length >= 2 ? sh.c.map(v => Math.round(v * 10) / 10) : null };
  }
  if (id === 'cond' && S.setup === 'beam') { const R = reac(); return { ...M, scene: 'statics-beam', help: 'Груз — передвинуть на 5 см', xa: S.xa, xb: S.xb, show: S.ans, NA: Math.round(R.NA * 10) / 10, NB: Math.round(R.NB * 10) / 10 }; }
  if (id === 'cond') return { ...M, scene: 'statics-bracket', help: 'Крепление троса — сменить угол, фонарь — сдвинуть', ang: S.ang, angs: BR.angs, xl: S.xl, T: Math.round(tens() * 10) / 10, over: tens() > BR.lim + 1e-9 };
  if (id === 'kinds') return { ...M, scene: 'statics-kinds', help: S.sh3 === 'toy' ? 'Игрушка — наклонить' : 'Шарик — толкнуть, основание — сменить опыт', sh3: S.sh3, toy: S.toy };
  if (S.setup === 'slope') return { ...M, scene: 'statics-slope', help: 'Стойка — наклон +5°, шкаф — поставить заново', obj: S.obj, o: OBJ[S.obj], xc: SL.xc, L: SL.L, px: SL.px };
  return { ...M, scene: 'statics-crane', help: 'Тележка — дальше, противовес — сменить, груз — снять/повесить', wc: S.wc, P: S.P, fall: S.cfall };
};
window.LUCH_REAL.live = () => ({ th: S.th, u: S.u, off: S.off, drop: S.drop, phi: S.phi, al: S.al, beta: S.beta, fallen: S.fallen, xt: S.xt, ct: S.ct, xc: craneXc(), ok: craneOk() });
window.LUCH_REAL.click = k => {
  if (k === 'plate') return act('hole-next');
  if (k === 'pin') return act('line');
  if (k === 'lift') { if (S.fallen) return act('reset4'); return act(S.al >= SL.amax ? 'reset4' : 'up5'); }
  if (k === 'tr+') { if (S.xt >= 20) return setXt(4); }
  act(k);
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
