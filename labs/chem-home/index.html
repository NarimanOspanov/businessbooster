<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 8 класс: химия дома — как моющие средства снимают жир, кислоты и щёлочи на кухне и какие средства нельзя смешивать.">
<title>Химия дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Дом</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол: таз с пятном жира и моющими средствами, банки с кухонными растворами и индикаторной бумагой, флаконы бытовой химии. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-home';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);

// ---------- lesson 1: detergents ----------
const AG = {
  soap: { name: 'мыло', full: 'хозяйственное мыло', c: '#72d4e8', f: 'C₁₇H₃₅COONa' },
  syn: { name: 'СМС', full: 'синтетическое моющее средство', c: '#b88cf0', f: 'R–C₆H₄–SO₃Na' },
};
const PER_DROP = 6, CA = 12, NEED = 24, MAXDROP = 10, LIMIT = 5;
const DROP = { cx: 250, ry0: 15, rx0: 50, floor: 330, up: { x: 250, y: 236, r: 30 } };

// ---------- lesson 2: kitchen pH ----------
const JARS = [
  { k: 'lemon', name: 'Лимонный сок', sh: 'лимон', ph: 2, liq: '#f3e27a', op: 0.75, what: 'лимонная кислота' },
  { k: 'vin', name: 'Уксус 9%', sh: 'уксус', ph: 3, liq: '#e9eef6', op: 0.25, what: 'уксусная кислота CH₃COOH' },
  { k: 'kefir', name: 'Кефир', sh: 'кефир', ph: 4, liq: '#f4f1ea', op: 0.95, what: 'молочная кислота' },
  { k: 'water', name: 'Вода', sh: 'вода', ph: 7, liq: '#9fd3ee', op: 0.3, what: 'чистая вода' },
  { k: 'soda', name: 'Раствор соды', sh: 'сода', ph: 8, liq: '#e9eef6', op: 0.3, what: 'гидрокарбонат натрия NaHCO₃' },
  { k: 'soap', name: 'Мыльная вода', sh: 'мыло', ph: 10, liq: '#dfe6f0', op: 0.7, what: 'мыло — соль слабой кислоты и щёлочи' },
  { k: 'pipe', name: 'Для труб', sh: 'трубы', ph: 13, liq: '#7fa8e8', op: 0.55, what: 'гидроксид натрия NaOH' },
];
const PHC = ['#c8202e', '#dd2f33', '#ea4a2c', '#f1702a', '#f39a2a', '#f2c63a', '#d4d83c', '#5fbf4a', '#2fa88a', '#2a93b0', '#2f74c4', '#3a58c4', '#4a44b4', '#5a3aa8', '#66309c'];
const phName = p => p <= 2 ? 'красная' : p === 3 ? 'красно-оранжевая' : p === 4 ? 'оранжевая' : p <= 6 ? 'жёлтая' : p === 7 ? 'зелёная' : p === 8 ? 'сине-зелёная' : p <= 10 ? 'синяя' : 'фиолетовая';
const zoneOf = p => p < 7 ? 'a' : p === 7 ? 'n' : 'b';

function washModel() {
  const mol = S.drops * PER_DROP;
  const toCa = S.agent === 'soap' && S.hard ? PER_DROP * (S.soda ? S.sodaAt : S.drops) : 0;
  const bound = Math.min(2 * CA, toCa), caBound = bound / 2;
  const caFree = S.hard && !S.soda ? CA - caBound : 0, caOut = S.hard && S.soda ? CA - caBound : 0;
  const free = mol - bound, mic = Math.min(free, NEED);
  return { kind: 'wash', agent: S.agent, A: AG[S.agent], hard: S.hard, drops: S.drops, soda: S.soda, mol, bound, caBound, caFree, caOut, free, mic, extra: Math.max(0, free - NEED), clean: free >= NEED };
}
function model() {
  const id = LID();
  if (id === 'wash') return washModel();
  if (id === 'ph') return { kind: 'ph', sel: S.sel, nTested: JARS.filter(j => S.tested[j.k]).length, nPlaced: JARS.filter(j => S.placed[j.k]).length };
  return { kind: 'mix', sel: S.bsel, last: S.last, nTried: Object.keys(S.tried).length, found: DANGER.filter(k => S.tried[k]).length };
}

function molSVG(x, y, ang, c, len = 15) {
  // head at (x,y); tail goes in direction ang (radians) — zigzag carbon chain
  const ux = Math.cos(ang), uy = Math.sin(ang), px = -uy, py = ux;
  let d = `M${f1(x + ux * 4)} ${f1(y + uy * 4)}`;
  for (let k = 1; k <= 5; k++) { const s = 4 + k * (len - 4) / 5, w = k % 2 ? 2.2 : -2.2; d += ` L${f1(x + ux * s + px * w)} ${f1(y + uy * s + py * w)}`; }
  return `<path d="${d}" fill="none" stroke="#e8ecf4" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${f1(x)}" cy="${f1(y)}" r="4.4" fill="${INK}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="3.6" fill="${c}"/>`;
}
const dropGeo = m => {
  if (m.clean) return { x: DROP.up.x, y: DROP.up.y, rx: DROP.up.r, ry: DROP.up.r, up: true };
  const k = m.mic / NEED, ry = DROP.ry0 + 9 * k, rx = DROP.rx0 - 12 * k;
  return { x: DROP.cx, y: DROP.floor - ry + 2, rx, ry, up: false };
};
function slotOrder(n) { const o = []; for (let i = 0; i < n / 2; i++) { o.push(i); o.push(n - 1 - i); } return o; }
function washSVG(m, t) {
  let h = '';
  // basin
  h += `<path d="M66 138 L72 340 Q74 352 88 352 L412 352 Q426 352 428 340 L434 138" fill="rgba(160,190,230,.05)" stroke="#c8d1e2" stroke-opacity=".55" stroke-width="2.4"/>`;
  h += `<path d="M70.5 164 L72 340 Q74 350 88 350 L412 350 Q426 350 428 340 L429.5 164 Z" fill="${m.hard && !m.soda ? 'rgba(150,190,215,.20)' : 'rgba(95,180,217,.20)'}"/>`;
  h += `<path d="M70.5 164 H429.5" stroke="#9fd3ee" stroke-opacity=".6" stroke-width="1.5"/>`;
  h += `<text x="80" y="156" font-size="9" fill="#8b96ad">${m.hard ? (m.soda ? 'вода смягчена содой' : 'жёсткая вода: Ca²⁺') : 'мягкая вода'}</text>`;
  // fabric
  h += `<rect x="118" y="330" width="264" height="14" rx="3" fill="#c9b79a"/>`;
  for (let x = 124; x < 380; x += 8) h += `<path d="M${x} 331v12" stroke="#a8977a" stroke-width="1"/>`;
  h += `<text x="372" y="341" font-size="7.5" fill="#5e5140" text-anchor="end">ткань</text>`;
  // CaCO3 sediment
  for (let i = 0; i < m.caOut; i++) { const left = i % 2 === 0, x = left ? 84 + rnd(i, 3) * 28 : 388 + rnd(i, 4) * 28, y = 338 + rnd(i, 5) * 9; h += `<circle cx="${f1(x)}" cy="${f1(y)}" r="2.6" fill="#f2f4f8"/>`; }
  if (m.caOut) h += `<text x="98" y="328" font-size="7.5" fill="#c8d1e2" text-anchor="middle">CaCO₃↓</text>`;
  // free Ca2+ ions
  for (let i = 0; i < m.caFree; i++) {
    const x = 90 + rnd(i, 1) * 320, y = 190 + rnd(i, 2) * 100;
    if (Math.abs(x - 250) < 70 && y > 260) continue;
    h += `<circle cx="${f1(x)}" cy="${f1(y)}" r="7" fill="#9fd27a" opacity=".9"/><text x="${f1(x)}" y="${f1(y + 2.4)}" font-size="6.5" fill="#0b1019" text-anchor="middle" font-weight="500">Ca</text>`;
  }
  // scum flakes (calcium soap) at the surface
  for (let i = 0; i < m.caBound; i++) {
    const x = 92 + (i % 12) * 28 + rnd(i, 6) * 6, y = 176 + Math.floor(i / 12) * 14 + rnd(i, 7) * 4;
    h += `<g opacity=".85"><path d="M${f1(x - 12)} ${f1(y)} l3 -2 l3 2 l3 -2" fill="none" stroke="#a9b0bd" stroke-width="1.3"/><path d="M${f1(x + 3)} ${f1(y)} l3 -2 l3 2 l3 -2" fill="none" stroke="#a9b0bd" stroke-width="1.3"/><circle cx="${f1(x)}" cy="${f1(y)}" r="4" fill="#7d8698"/></g>`;
  }
  // grease drop
  const g = dropGeo(m);
  h += `<ellipse cx="${f1(g.x)}" cy="${f1(g.y)}" rx="${f1(g.rx + 1.4)}" ry="${f1(g.ry + 1.4)}" fill="${INK}"/><ellipse cx="${f1(g.x)}" cy="${f1(g.y)}" rx="${f1(g.rx)}" ry="${f1(g.ry)}" fill="#e8b93a"/><ellipse cx="${f1(g.x - g.rx * 0.35)}" cy="${f1(g.y - g.ry * 0.4)}" rx="${f1(g.rx * 0.25)}" ry="${f1(g.ry * 0.22)}" fill="#fff" opacity=".3"/>`;
  h += `<text x="${f1(g.x)}" y="${f1(g.y + 3)}" font-size="8" fill="#5a4310" text-anchor="middle">жир</text>`;
  if (!g.up && m.mic === 0) h += `<ellipse cx="250" cy="331" rx="56" ry="3" fill="#b08a2a" opacity=".6"/>`;
  // attached molecules
  const order = slotOrder(NEED);
  for (let n = 0; n < m.mic; n++) {
    const j = order[n];
    const th = g.up ? -Math.PI / 2 + j / NEED * Math.PI * 2 : Math.PI + (j + 0.5) / NEED * Math.PI;
    const cx = g.x + g.rx * Math.cos(th), cy = g.y + g.ry * Math.sin(th);
    let nx = Math.cos(th) / g.rx, ny = Math.sin(th) / g.ry; const l = Math.hypot(nx, ny); nx /= l; ny /= l;
    h += molSVG(cx + nx * 7, cy + ny * 7, Math.atan2(-ny, -nx), m.A.c, 17);
  }

    wash: B('ag-soap', 'Мыло', S.agent === 'soap') + B('ag-syn', 'СМС', S.agent === 'syn') + sep + B('w-hard', 'Жёсткая', S.hard) + B('w-soft', 'Мягкая', !S.hard) + sep + B('drop', '+ капля') + B('soda', 'Сода') + B('reset', 'Заново'),
    ph: B('reset', 'Начать заново'),
    safe: B('clear', 'Снять выбор') + B('reset', 'Начать заново'),
  }[id];
}
function act(a) {
  if (a === 'ag-soap' || a === 'ag-syn') return setAgent(a.slice(3));
  if (a === 'w-hard' || a === 'w-soft') return setWater(a === 'w-hard');
  if (a === 'drop') return addDrop();
  if (a === 'soda') return addSoda();
  if (a === 'clear') { S.bsel = null; update(); return; }
  if (a === 'reset') {
    if (LID() === 'wash') resetWash();
    else if (LID() === 'ph') { S.tested = {}; S.placed = {}; S.sel = null; S.wrong = 0; }
    else { S.tried = {}; S.last = null; S.bsel = null; }
    buildScheme(); update();
  }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'wash') return `${m.hard ? 'жёсткая' : 'мягкая'} вода · капель ${m.drops} из ${LIMIT} · пятно ${m.clean ? 'отстирано' : Math.round(m.mic / NEED * 100) + '%'}`;
  if (m.kind === 'ph') return `Проверено ${m.nTested} из ${JARS.length} · на шкале ${m.nPlaced} из ${JARS.length}`;
  return `Опасных найдено ${m.found} из ${DANGER.length} · пар проверено ${m.nTried} из 15`;
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'wash') h = `<h2>Стирка в тазу</h2>
      <div class="ctl"><div class="lbl">Средство</div><div class="chips" id="agChips">${Object.keys(AG).map(k => `<button data-k="${k}" aria-pressed="${S.agent === k}">${AG[k].full}</button>`).join('')}</div></div>
      <div class="ctl"><div class="lbl">Вода</div><div class="chips" id="wChips"><button data-h="1" aria-pressed="${S.hard}">жёсткая (Ca²⁺)</button><button data-h="0" aria-pressed="${!S.hard}">мягкая</button></div></div>

      <p class="note" style="margin-top:12px">Модель условная: одна капля — 6 молекул, в тазу 12 ионов кальция, на каплю жира нужно 24 молекулы.</p>`;
  if (id === 'ph') h = `<h2>Индикаторная бумага</h2><p class="note">Сначала тест, потом зона. Верный ответ закрепится.</p>
      <div class="pairs">${JARS.map((J, i) => `<label><span>${J.name} <output id="ph${i}"></output></span><span><button class="ghostbtn" data-t="${i}" style="padding:5px 9px">Тест</button> <select data-z="${i}"><option value="">зона</option>${['a', 'n', 'b'].map(z => `<option value="${z}">${ZONE[z]}</option>`).join('')}</select></span></label>`).join('')}</div>

      <dl class="reads"><div><dt>Пар</dt><dd id="r1"></dd></div><div><dt>Опасных</dt><dd id="r2"></dd></div><div><dt>Последняя</dt><dd id="r3"></dd></div></dl>
      <h3>Проверенные пары</h3><div class="steps" id="triedList"></div>`;
  el.innerHTML = h;
  el.querySelectorAll('#agChips button').forEach(b => b.onclick = () => setAgent(b.dataset.k));
  el.querySelectorAll('#wChips button').forEach(b => b.onclick = () => setWater(b.dataset.h === '1'));
  const q = s => el.querySelector(s);
  if (q('#sDrop')) q('#sDrop').onclick = addDrop;
  if (q('#sSoda')) q('#sSoda').onclick = addSoda;
  if (q('#sReset')) q('#sReset').onclick = () => act('reset');
  el.querySelectorAll('button[data-t]').forEach(b => b.onclick = e => { e.preventDefault(); testJar(+b.dataset.t); });
  el.querySelectorAll('select[data-z]').forEach(s => s.onchange = () => { if (!s.value) return; if (!placeJar(+s.dataset.z, s.value)) s.value = ''; });
  if (q('#sMix')) q('#sMix').onclick = () => { const a = +q('#mA').value, b = +q('#mB').value; if (a === b) { toast('Выберите два разных средства.'); return; } mixPair(a, b); };
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  if (m.kind === 'wash') {
    set('#r1', `${m.drops} · ${m.mol} мол.`); set('#r2', `${m.mic} из ${NEED}`); set('#r3', String(m.bound)); set('#r4', String(m.caFree));
    el.querySelectorAll('#agChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.agent));
    el.querySelectorAll('#wChips button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.h === '1') === S.hard));
  } else if (m.kind === 'ph') {
    JARS.forEach((J, i) => {
      set('#ph' + i, S.tested[J.k] ? `· pH ≈ ${J.ph}` : '');
      const s = el.querySelector(`select[data-z="${i}"]`); if (s) { s.disabled = !S.tested[J.k] || !!S.placed[J.k]; if (S.placed[J.k]) s.value = zoneOf(J.ph); }
    });
    set('#r1', `${m.nTested} из 7`); set('#r2', `${m.nPlaced} из 7`); set('#r3', String(S.wrong));
  } else {
    set('#r1', `${m.nTried} из 15`); set('#r2', `${m.found} из ${DANGER.length}`); set('#r3', m.last ? V[MIX[m.last].v].t.toLowerCase() : '—');
    const tl = el.querySelector('#triedList');
    if (tl) tl.innerHTML = Object.keys(S.tried).map(k => { const [a, b] = k.split('|').map(prOf); return step(`${prName(a)} + ${prName(b)}`, `<span style="color:${V[MIX[k].v].c}">${V[MIX[k].v].t.toLowerCase()}</span>`); }).join('') || '<p class="note">Пока ничего.</p>';
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'wash') {
    let h = `<h2>Куда ушло средство</h2><div class="formula">свободные = все − связанные кальцием</div><div class="steps">` +
      step('капель', String(m.drops)) +
      step('молекул всего', `${m.drops} · ${PER_DROP} = ${m.mol}`) +
      step('ионов Ca²⁺ в воде', m.hard ? `${CA}${m.soda ? ` → сода осадила ${m.caOut}` : ''}` : '0 (вода мягкая)') +
      step('связано в хлопья', m.agent === 'soap' ? `${m.caBound} · 2 = ${m.bound}` : '0 — СМС не осаждается') +
      step('свободных молекул', `${m.mol} − ${m.bound} = ${m.free}`) +
      step('нужно на каплю жира', String(NEED)) +
      step('результат', m.clean ? `${m.free} ≥ ${NEED} — пятно отстирано ✓` : `${m.free} < ${NEED} — не хватает ${NEED - m.free}`, 'sum') + `</div>`;
    h += `<h3>Реакции</h3><div class="steps">` +
      step('мыло в жёсткой воде', '2C₁₇H₃₅COO⁻ + Ca²⁺ → (C₁₇H₃₅COO)₂Ca↓') +
      step('смягчение содой', 'Ca²⁺ + CO₃²⁻ → CaCO₃↓') + `</div>`;
    h += `<h3>Сравните способы</h3><div class="steps">` +
      step('мыло, жёсткая вода', `${(2 * CA + NEED) / PER_DROP} капель`) +
      step('мыло + сода', `${NEED / PER_DROP} капли`) +
      step('СМС, жёсткая вода', `${NEED / PER_DROP} капли`) + `</div><p class="note" style="margin-top:10px">Числа условные, но соотношение верное: в жёсткой воде мыла уходит заметно больше.</p>`;
    return h;
  }
  if (m.kind === 'ph') {
    const J = m.sel !== null ? JARS[m.sel] : null;
    let h = `<h2>Что значит pH</h2><div class="formula">pH &lt; 7 кислая · pH = 7 нейтральная · pH &gt; 7 щелочная</div>`;
    if (J && S.tested[J.k]) {
      const d = 7 - J.ph, times = Math.pow(10, Math.abs(d));
      h += `<h3>${J.name}</h3><div class="steps">` + step('окраска бумажки', phName(J.ph)) + step('pH по шкале', '≈ ' + J.ph) +
        step('сравнение с 7', J.ph < 7 ? `${J.ph} < 7` : J.ph === 7 ? '7 = 7' : `${J.ph} > 7`) +
        step('ионов H⁺, моль/л', `10<sup>−${J.ph}</sup>`) +
        step('чем отличается от воды', d === 0 ? 'это нейтральная среда' : d > 0 ? `H⁺ больше в 10<sup>${d}</sup> = ${times.toLocaleString('ru-RU')} раз` : `H⁺ меньше в 10<sup>${-d}</sup> = ${times.toLocaleString('ru-RU')} раз`) +
        step('среда', ZONE[zoneOf(J.ph)] + (S.placed[J.k] ? ' ✓' : ''), 'sum') + `</div><p class="note" style="margin-top:10px">Что внутри: ${J.what}.</p>`;
    } else h += `<p class="note">Нажмите на банку — здесь появится разбор её pH.</p>`;
    h += `<h3>Ваши измерения</h3><div class="steps">${JARS.map(Jj => step(Jj.name, S.tested[Jj.k] ? `pH ≈ ${Jj.ph}` : '?')).join('')}</div>`;
    h += `<p class="note" style="margin-top:10px">Шаг шкалы — в 10 раз. Поэтому лимонный сок (pH 2) кислее кефира (pH 4) не в 2, а в 100 раз.</p>`;
    return h;
  }
  let h = `<h2>Как рассуждать</h2><div class="steps">${step('окислитель + кислота', 'хлор Cl₂ — опасно')}${step('окислитель + аммиак', 'хлорамины — опасно')}${step('сильная кислота + сильная щёлочь', 'кипение, брызги — опасно')}${step('кислота + основание', 'нейтрализация — бесполезно')}${step('кислота + кислота', 'нет реакции', 'sum')}</div>`;
  if (m.last) {
    const R = MIX[m.last], [a, b] = m.last.split('|').map(prOf);
    h += `<h3>${prName(a)} + ${prName(b)}</h3><div class="steps">` +
      step(`1. ${a.f}`, a.cls) + step(`2. ${b.f}`, b.cls) + step('3. правило', R.rule) + step('4. реакция', R.eq) +
      step('вывод', `<span style="color:${V[R.v].c}">${V[R.v].t.toLowerCase()}</span>`, 'sum') + `</div><p class="note" style="margin-top:10px">${R.why}</p>`;
  } else h += `<p class="note" style="margin-top:10px">Проверьте пару — здесь появится разбор по шагам.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'wash') {
    const k = m.mic / NEED;
    el.innerHTML = `<div class="k">Пятно</div><div class="v ${m.clean ? 'ok' : ''}">${m.clean ? 'отстирано' : Math.round(k * 100) + '% окружено'}</div><div class="gauge"><b style="width:${(k * 100).toFixed(1)}%;background:${m.clean ? 'var(--ok)' : 'var(--liq)'}"></b></div>` +
      `<div class="lr"><span>капель</span><span style="color:${m.drops > LIMIT ? 'var(--warn)' : 'inherit'}">${m.drops} / ${LIMIT}</span></div><div class="lr"><span>в хлопьях</span><span>${m.bound}</span></div><div class="lr"><span>Ca²⁺</span><span>${m.caFree}</span></div>`;
  } else if (m.kind === 'ph') {
    const J = m.sel !== null ? JARS[m.sel] : null, t = J && S.tested[J.k];
    el.innerHTML = `<div class="k">Индикатор</div><div class="v">${t ? 'pH ≈ ' + J.ph : '—'}</div><div class="swatch" style="background:${t ? PHC[J.ph] : 'transparent'}"></div>` +
      `<div class="lr"><span>проверено</span><span>${m.nTested}/7</span></div><div class="lr"><span>на шкале</span><span>${m.nPlaced}/7</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Опасные смеси</div><div class="v ${m.found === DANGER.length ? 'ok' : ''}">${m.found} из ${DANGER.length}</div><div class="gauge"><b style="width:${(m.found / DANGER.length * 100).toFixed(1)}%;background:var(--warn)"></b></div>` +
      `<div class="lr"><span>пар</span><span>${m.nTried}/15</span></div><div class="lr"><span>выбран</span><span>${m.sel !== null ? PR[m.sel].f : '—'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Химия дома освоена!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  wash: '<ellipse cx="33" cy="17" rx="10" ry="7" fill="#e8b93a"/><circle cx="20" cy="17" r="2.6" fill="#72d4e8"/><circle cx="46" cy="17" r="2.6" fill="#72d4e8"/><circle cx="33" cy="6" r="2.6" fill="#72d4e8"/><circle cx="33" cy="28" r="2.6" fill="#72d4e8"/><circle cx="24" cy="9" r="2.6" fill="#72d4e8"/><circle cx="42" cy="9" r="2.6" fill="#72d4e8"/><circle cx="24" cy="25" r="2.6" fill="#72d4e8"/><circle cx="42" cy="25" r="2.6" fill="#72d4e8"/>',
  ph: PHC.map((c, i) => `<rect x="${3 + i * 4}" y="11" width="4" height="10" fill="${c}"/>`).join(''),
  safe: '<path d="M33 3l12 12 -12 12 -12 -12z" fill="#fff" stroke="#e0303a" stroke-width="2"/><path d="M33 9v8" stroke="#0b1019" stroke-width="2"/><circle cx="33" cy="20.5" r="1.4" fill="#0b1019"/><rect x="5" y="9" width="10" height="16" rx="2" fill="#5f8fd6"/><rect x="51" y="9" width="10" height="16" rx="2" fill="#3fb08a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.agent = 'soap'; S.hard = true; resetWash();
  S.tested = {}; S.placed = {}; S.sel = null; S.wrong = 0;
  S.bsel = null; S.tried = {}; S.last = null;
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'wash') now = `Модель стирки: таз с ${m.hard ? 'жёсткой водой (12 условных ионов Ca²⁺)' : 'мягкой водой'}${m.soda ? ', вода смягчена стиральной содой Na₂CO₃' : ''}, на ткани капля жира. Средство: ${m.A.full}. Капель добавлено: ${m.drops} (1 капля = 6 молекул, всего ${m.mol}). Связано кальцием в хлопья: ${m.bound} молекул, свободных ионов Ca²⁺ осталось ${m.caFree}. На капле жира ${m.mic} из ${NEED} молекул, пятно ${m.clean ? 'отстирано' : 'ещё на ткани'}. Условие задания: отстирать в жёсткой воде не больше чем за ${LIMIT} капель. Не называй готовый способ — спроси, куда девается мыло в жёсткой воде и чем это можно исправить.`;
  if (id === 'ph') now = `Семь банок: ${JARS.map(J => J.name).join(', ')}. Ученик проверяет их универсальной индикаторной бумагой и ставит на шкалу pH в зону кислая/нейтральная/щелочная. Проверены: ${JARS.filter(J => S.tested[J.k]).map(J => `${J.name} (pH ≈ ${J.ph})`).join(', ') || 'пока ни одна'}. Поставлены на шкалу: ${JARS.filter(J => S.placed[J.k]).map(J => J.name).join(', ') || 'ничего'}. Ошибок: ${S.wrong}. ${m.sel !== null ? `Выбрана банка «${JARS[m.sel].name}».` : ''} Не называй pH непроверенных растворов — предложи проверить бумажкой и сравнить с 7.`;
  if (id === 'safe') now = `Шесть флаконов: ${PR.map(P => `${prName(P)} (${P.f})`).join(', ')}. Ученик мысленно смешивает пары и ищет 4 опасные смеси. Проверены пары: ${Object.keys(S.tried).map(k => { const [a, b] = k.split('|').map(prOf); return `${prName(a)} + ${prName(b)} — ${V[MIX[k].v].t.toLowerCase()}`; }).join('; ') || 'пока ни одной'}. Найдено опасных: ${m.found} из ${DANGER.length}. ${m.sel !== null ? `Выбран флакон «${prName(PR[m.sel])}».` : ''} Не перечисляй ненайденные опасные пары — помоги понять, кто из веществ кислота, щёлочь, окислитель. Подчёркивай, что в жизни бытовую химию не смешивают.`;
  return [
    `Предмет: химия, 8 класс. Тема «Химия дома». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { wash: 'Почему в жёсткой воде мыло плохо пенится?', ph: 'Почему шаг шкалы pH — это в 10 раз?', safe: 'Почему хлорку нельзя смешивать с кислотой?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
