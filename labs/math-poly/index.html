<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 7 класс: степень с натуральным показателем, одночлены и многочлены, формулы сокращённого умножения, разложение на множители.">
<title>Многочлены</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.termbtns{display:grid;gap:6px;margin-top:8px}
.termbtns div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 8px}
.termbtns b{font:500 14px/1 var(--font-mono);min-width:44px}
.termbtns span{font-size:12.5px;color:var(--muted);flex:1}
.termbtns button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.termbtns button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Математика · Многочлены</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: столбики степеней, алгебраические плитки, квадрат из частей и прямоугольник из плиток. Части можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const big = v => { const s = String(Math.abs(v)); const g = s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s; return (v < 0 ? '−' : '') + g; };
const par = v => v < 0 ? `(${ns(v)})` : ns(v);
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => c === '-' ? '⁻' : SUPD[+c]).join('');
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
// polynomial in x from coefficients [c2, c1, c0]
function polyStr(cs) {
  const parts = [];
  [[cs[0], 'x²'], [cs[1], 'x'], [cs[2], '']].forEach(([c, v]) => { if (!c) return; const ab = Math.abs(c); parts.push({ neg: c < 0, body: v ? (ab === 1 ? v : ab + v) : String(ab) }); });
  if (!parts.length) return '0';
  return parts.map((p, i) => i === 0 ? (p.neg ? '−' : '') + p.body : (p.neg ? ' − ' : ' + ') + p.body).join('');
}

// lesson 2: 3x² − x + 2 − x² + 4x − 3
const MONO0 = { x2: { p: 3, n: 1 }, x: { p: 4, n: 1 }, u: { p: 2, n: 3 } };
const KINDS = ['x2', 'x', 'u'];
const KIND = { x2: { v: 'x²', name: 'x²', w: 40, h: 40, col: BLUE, y: 128 }, x: { v: 'x', name: 'x', w: 14, h: 40, col: VIOL, y: 190 }, u: { v: '', name: '1', w: 14, h: 14, col: ORANGE, y: 256 } };
// lesson 4: x² + bx + c
const TARGETS = [{ b: 5, c: 6 }, { b: 3, c: 0 }, { b: 4, c: 4 }, { b: 7, c: 12 }];

const LESSONS = [
  { id: 'power', title: 'Степень с натуральным показателем',
    text: ['Степень — короткая запись произведения одинаковых множителей: aⁿ = a · a · … · a, где n множителей. Число a — основание, n — показатель. Например, 2⁵ = 2 · 2 · 2 · 2 · 2 = 32. По определению a¹ = a.',
           'Степень растёт очень быстро: каждый следующий шаг ещё раз умножает результат на основание. Столбики на поле — это a¹, a², a³ и дальше. Удвоение доходит от 2 до 1024 всего за 10 шагов.',
           'Знак степени отрицательного числа зависит от чётности показателя: (−2)⁴ = 16, а (−2)³ = −8. Главные свойства: aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ (при m > n и a ≠ 0), (aᵐ)ⁿ = aᵐⁿ, (ab)ⁿ = aⁿbⁿ.'],
    why: 'Память компьютера считают степенями двойки: 2¹⁰ = 1024 байта — это килобайт, 2³⁰ байт — гигабайт. Банк начисляет проценты на проценты: вклад под 15% годовых через n лет умножается на 1,15ⁿ — так работает любой депозитный калькулятор в Kaspi или Halyk. Микробиолог по степени двойки оценивает, сколько станет бактерий после n делений, а специалист по кибербезопасности — сколько вариантов у пароля из n символов.',
    task: 'Найдите, в какую степень нужно возвести 2, чтобы получить 1024. Затем подберите показатель для основания −2 так, чтобы степень была равна −32.',
    hint: 'Меняйте a и n кнопками внизу или нажимайте на столбик — показатель станет равен его номеру. При отрицательном основании следите за чётностью n.',
    stage: 'Нажмите на столбик — n станет равен его номеру.',
    a: 2, n: 1,
    check: m => m.seen && m.a === -2 && m.n === 5 },
  { id: 'mono', title: 'Одночлены и многочлены',

const KEY = 'luch-math-poly';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            a1: 2, n1: 1, seen: false,
            T: null, sel: null, deg: null,
            a3: 5, b3: 3, mode: 'sum', placed: {}, assembled: false,
            tg: 0, p: 0, q: 0 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const cloneT = () => JSON.parse(JSON.stringify(MONO0));

function model() {
  const id = LID();
  if (id === 'power') {
    const a = S.a1, n = S.n1, vals = [];
    for (let k = 1; k <= 10; k++) vals.push(a ** k);
    return { kind: id, a, n, v: a ** n, vals, seen: S.seen };
  }
  if (id === 'mono') {
    const T = S.T, c = KINDS.map(k => T[k].p - T[k].n), pairs = KINDS.reduce((s, k) => s + Math.min(T[k].p, T[k].n), 0);
    const rawStr = (() => {
      const parts = [];
      KINDS.forEach(k => { const v = KIND[k].v; [['p', 1], ['n', -1]].forEach(([s, sg]) => { const cnt = T[k][s]; if (!cnt) return; parts.push({ neg: sg < 0, body: v ? (cnt === 1 ? v : cnt + v) : String(cnt) }); }); });
      if (!parts.length) return '0';
      return parts.map((p, i) => i === 0 ? (p.neg ? '−' : '') + p.body : (p.neg ? ' − ' : ' + ') + p.body).join('');
    })();
    const realDeg = c[0] ? 2 : c[1] ? 1 : 0;
    return { kind: id, c, pairs, raw: rawStr, std: polyStr(c), realDeg, deg: S.deg, sel: S.sel, terms: c.filter(Boolean).length };
  }
  if (id === 'fsu') {
    const a = S.a3, b = S.b3, cnt = Object.keys(S.placed).length;
    return { kind: id, a, b, mode: S.mode, cnt, assembled: S.assembled, sum2: (a + b) ** 2, dif2: (a - b) ** 2, sq: a * a - b * b };
  }
  const t = TARGETS[S.tg], p = S.p, q = S.q, used = p + q, need = p * q;
  return { kind: 'factor', tg: S.tg, B: t.b, C: t.c, p, q, used, need, complete: used === t.b && need === t.c };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="${RED}" stroke-width="2" opacity=".7"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 14, w, 28, on ? (col || FG) : '#1a2438', `rx="8" stroke="${on ? (col || FG) : '#33405c'}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, 12, label, on ? '#0b1019' : FG, 'middle', 'font-weight="500"')}</g>`;
}

// ---------- lesson 1: powers ----------
const BAR = { x0: 40, w: 44 };
const powAxis = m => m.a < 0 ? { y: 262, up: 86, down: 86 } : { y: 336, up: 162, down: 0 };
function powerSVG(m) {
  const good = (m.a === 2 && m.n === 10) || (m.a === -2 && m.n === 5);
  let h = T(260, 92, 22, `${par(m.a)}${sup(m.n)} = ${big(m.v)}`, good ? GREEN : FG, 'middle', 'font-weight="500"');
  const n = m.n, cw = 34, gap = 9, tot = n * cw + (n - 1) * gap, x0 = 260 - tot / 2;
  for (let j = 0; j < n; j++) {
    const x = x0 + j * (cw + gap);
    h += R(x, 106, cw, 26, '#1a2438', `rx="7" stroke="${m.a < 0 ? RED : BLUE}" stroke-width="1.3"`) + T(x + cw / 2, 123.5, 12, ns(m.a), FG, 'middle', 'font-weight="500"');
    if (j) h += T(x - gap / 2, 124, 13, '·', MUTED);
  }
  h += T(260, 150, 11, `${n} ${plural(n, 'множитель', 'множителя', 'множителей')}, каждый равен ${ns(m.a)}`, MUTED);
  const ax = powAxis(m), mx = Math.max(1, ...m.vals.slice(0, n).map(Math.abs));
  h += L(BAR.x0 - 4, ax.y, BAR.x0 + 10 * BAR.w + 4, ax.y, '#6b7690', 1.4);
  for (let k = 1; k <= 10; k++) {
    const cx = BAR.x0 + (k - 1) * BAR.w + BAR.w / 2, v = m.vals[k - 1];
    let g = `<g data-bar="${k}" style="cursor:pointer">` + R(cx - 22, 160, 44, 222, 'transparent');
    if (k <= n) {
      let hh = Math.abs(v) / mx * (v < 0 ? ax.down : ax.up); if (v !== 0) hh = Math.max(hh, 1.5);
      const y = v >= 0 ? ax.y - hh : ax.y;
      g += R(cx - 15, y, 30, hh, v < 0 ? RED : k === n ? ORANGE : BLUE, `rx="3" stroke="${INK}" stroke-width="1.2"`);
      const s = big(v), fs = s.length > 8 ? 7 : s.length > 6 ? 8 : 9.5;
      g += T(cx, v >= 0 ? y - 5 : y + hh + 12, fs, s, k === n ? FG : MUTED);
    } else g += R(cx - 15, ax.y - 18, 30, 18, 'none', 'rx="3" stroke="#26324a" stroke-dasharray="3 3"');
    g += T(cx, m.a < 0 ? 374 : 354, 10.5, `a${sup(k)}`, k === n ? ORANGE : '#6b7690');
    h += g + '</g>';
  }
  return h;
}

// ---------- lesson 2: monomials / tiles ----------
const TX0 = 64;
function tileXs(k) {
  const K = KIND[k], c = S.T[k], st = K.w + 6, xs = [];
  for (let i = 0; i < c.p; i++) xs.push({ s: 'p', x: TX0 + i * st, i });
  const off = TX0 + c.p * st + (c.p ? 16 : 0);
  for (let i = 0; i < c.n; i++) xs.push({ s: 'n', x: off + i * st, i });
  return xs;
}
function monoSVG(m) {
  let h = T(260, 90, 16, m.raw, m.pairs ? FG : GREEN, 'middle', 'font-weight="500"');
  h += T(260, 112, 11, m.pairs ? `нулевых пар осталось: ${m.pairs}` : 'нулевых пар нет — подобные приведены', m.pairs ? MUTED : GREEN);
  KINDS.forEach((k, ki) => {
    const K = KIND[k], c = S.T[k];
    h += T(30, K.y + K.h / 2 + 5, 14, K.name, FG, 'middle', 'font-weight="500"');
    tileXs(k).forEach(t => {
      const last = t.s === 'p' ? c.p - 1 : c.n - 1, sel = S.sel && S.sel.k === k && S.sel.s === t.s && t.i === last;
      const lbl = (t.s === 'n' ? '−' : '') + (K.v || '1');
      h += `<g data-tile="${k}:${t.s}" style="cursor:pointer">` + R(t.x - 3, K.y - 3 - (k === 'u' ? 10 : 0), K.w + 6, K.h + 6 + (k === 'u' ? 20 : 0), 'transparent') +
        R(t.x, K.y, K.w, K.h, t.s === 'p' ? K.col : RED, `rx="${k === 'u' ? 2.5 : 4}" stroke="${sel ? FG : INK}" stroke-width="${sel ? 2.6 : 1.4}"`) +
        (k === 'u' ? '' : T(t.x + K.w / 2, K.y + K.h / 2 + 4, k === 'x2' ? 12 : 9, lbl, INK, 'middle', 'font-weight="500"')) + '</g>';
    });
    if (!c.p && !c.n) h += T(TX0, K.y + K.h / 2 + 4, 11, 'пусто', '#5d6880', 'start');
    const coef = m.c[ki];
    h += T(496, K.y + K.h / 2 + 5, 13, `= ${polyStr(ki === 0 ? [coef, 0, 0] : ki === 1 ? [0, coef, 0] : [0, 0, coef])}`, K.col, 'end', 'font-weight="500"');
  });
  h += T(24, 304, 13, 'Стандартный вид:', MUTED, 'start') + T(160, 304, 15, m.pairs ? '… уберите нулевые пары' : m.std, m.pairs ? '#5d6880' : GREEN, 'start', 'font-weight="500"');
  h += T(24, 349, 13, 'Степень:', MUTED, 'start');
  for (let d = 1; d <= 4; d++) h += chip(100 + (d - 1) * 56, 345, 46, String(d), S.deg === d, 'deg-' + d, S.done.mono && S.deg === d ? GREEN : null);
  if (S.deg !== null && m.pairs === 0 && S.deg !== m.realDeg) h += T(330, 384, 11, 'посмотрите на наибольший показатель в стандартном виде', RED);
  return h;
}

// ---------- lesson 3: square of a sum ----------
const FX = 30, FY = 132, HX = 262;
const U3 = () => Math.min(20, 190 / (S.a3 + S.b3));
function pieces() {
  const u = U3(), a = S.a3 * u, b = S.b3 * u;
  return {
    A2: { w: a, h: a, sx: 0, sy: 0, col: BLUE, lbl: 'a²', val: S.a3 * S.a3 },
    AB1: { w: b, h: a, sx: a, sy: 0, col: VIOL, lbl: 'ab', val: S.a3 * S.b3 },
    AB2: { w: a, h: b, sx: 0, sy: a, col: VIOL, lbl: 'ab', val: S.a3 * S.b3 },
    B2: { w: b, h: b, sx: a, sy: a, col: ORANGE, lbl: 'b²', val: S.b3 * S.b3 },
  };
}
const homeOf = P => [HX + P.sx + (P.sx ? 10 : 0), FY + P.sy + (P.sy ? 10 : 0)];
function pieceSVG(id, P, x, y, lifted) {
  const small = Math.min(P.w, P.h);
  return `<g data-drag="pc-${id}">` + R(x, y, P.w, P.h, P.col, `rx="3" opacity="${lifted ? 1 : .92}" stroke="${lifted ? FG : INK}" stroke-width="${lifted ? 2 : 1.4}"`) +
    (small >= 18 ? T(x + P.w / 2, y + P.h / 2 + (small >= 34 ? -1 : 4), small >= 34 ? 13 : 10, P.lbl, INK, 'middle', 'font-weight="500"') : '') +
    (small >= 34 ? T(x + P.w / 2, y + P.h / 2 + 13, 10, `= ${P.val}`, INK) : '') + '</g>';
}
function fsuSVG(m) {
  let h = chip(97, 88, 104, '(a + b)²', m.mode === 'sum', 'mode-sum') + chip(209, 88, 104, '(a − b)²', m.mode === 'dif', 'mode-dif') + chip(321, 88, 104, 'a² − b²', m.mode === 'sq', 'mode-sq');
  const a = m.a, b = m.b;
  if (m.mode === 'sum') {
    const u = U3(), s = (a + b) * u, P = pieces();
    h += R(FX, FY, s, s, 'rgba(26,36,56,.5)', 'stroke="#6b7690" stroke-width="1.4" stroke-dasharray="6 4"');
    h += L(FX + a * u, FY, FX + a * u, FY + s, '#33405c', 1, 'stroke-dasharray="3 4"') + L(FX, FY + a * u, FX + s, FY + a * u, '#33405c', 1, 'stroke-dasharray="3 4"');
    h += T(FX + a * u / 2, FY - 7, 12, 'a', BLUE) + T(FX + a * u + b * u / 2, FY - 7, 12, 'b', ORANGE);
    h += T(FX - 9, FY + a * u / 2 + 4, 12, 'a', BLUE) + T(FX - 9, FY + a * u + b * u / 2 + 4, 12, 'b', ORANGE);
    for (const id in P) {
      const p = P[id];
      if (S.placed[id]) h += pieceSVG(id, p, FX + p.sx, FY + p.sy);
      else {
        h += R(FX + p.sx + 2, FY + p.sy + 2, p.w - 4, p.h - 4, 'none', 'rx="2" stroke="#26324a" stroke-dasharray="2 4"');
        if (!(drag && drag.id === id)) { const [hx, hy] = homeOf(p); h += pieceSVG(id, p, hx, hy); }
      }
    }
    if (m.cnt < 4) h += T(HX, FY + s + 30, 11, 'части — перетащите в рамку', '#5d6880', 'start');
    h += T(260, 350, 14, m.cnt === 4 ? '(a + b)² = a² + ab + ab + b² = a² + 2ab + b²' : '(a + b)² = ?', m.cnt === 4 ? GREEN : FG, 'middle', 'font-weight="500"');
    h += T(260, 372, 12, m.cnt === 4 ? `(${a} + ${b})² = ${a * a} + ${2 * a * b} + ${b * b} = ${m.sum2}` : `в рамке ${m.cnt} из 4 частей · a = ${a}, b = ${b}`, m.cnt === 4 ? FG : MUTED);
    if (drag && drag.kind === 'pc') {
      const p = P[drag.id], near = Math.hypot(drag.x - (FX + p.sx), drag.y - (FY + p.sy)) < 24;
      if (near) h += R(FX + p.sx, FY + p.sy, p.w, p.h, 'rgba(114,212,232,.12)', 'stroke="#72d4e8" stroke-width="2"');
      h += pieceSVG(drag.id, p, drag.x, drag.y, true);
    }
    return h;
  }
  if (m.mode === 'dif') {
    const u = Math.min(22, 190 / a), s = a * u, X = 50, Y = FY, bu = b * u, cu = (a - b) * u;
    h += R(X, Y, s, s, 'rgba(95,180,217,.18)', `stroke="${BLUE}" stroke-width="1.4"`);
    h += R(X, Y + bu, cu, cu, GREEN, `opacity=".85" stroke="${INK}" stroke-width="1.4"`);
    if (cu >= 26) h += T(X + cu / 2, Y + bu + cu / 2 + 4, 12, '(a − b)²', INK, 'middle', 'font-weight="500"');
    h += R(X, Y, s, bu, 'url(#hatch)', `stroke="${RED}" stroke-width="1.2"`) + R(X + cu, Y, bu, s, 'url(#hatch)', `stroke="${RED}" stroke-width="1.2"`);
    h += R(X + cu, Y, bu, bu, 'rgba(255,138,115,.35)', `stroke="${RED}" stroke-width="1.6"`);
    h += T(X + s / 2, Y - 7, 12, 'a', BLUE) + T(X + s + 10, Y + bu / 2 + 4, 11, 'b', RED, 'start') + T(X - 9, Y + bu + cu / 2 + 4, 12, 'a − b', GREEN, 'end');
    const lx = 292, rows = [[`a² = ${a * a}`, BLUE], [`− ab = −${a * b} (верхняя полоса)`, RED], [`− ab = −${a * b} (правая полоса)`, RED], [`+ b² = +${b * b} (угол вычли дважды)`, ORANGE], [`= (a − b)² = ${m.dif2}`, GREEN]];
    rows.forEach((r, i) => { h += T(lx, Y + 18 + i * 30, 12, r[0], r[1], 'start', i === 4 ? 'font-weight="500"' : ''); });
    h += T(260, 350, 14, '(a − b)² = a² − 2ab + b²', FG, 'middle', 'font-weight="500"');
    h += T(260, 372, 12, `(${a} − ${b})² = ${a * a} − ${2 * a * b} + ${b * b} = ${m.dif2}`, MUTED);

// ---------- lesson 4: rectangle of tiles ----------
const X0 = 46, Y0 = 128, XL = 64, UL = 20;

  let k = 0;
  for (let j = 0; j < q; j++) for (let i = 0; i < p; i++) {

    h += k < m.C ? R(x + 1, y + 1, UL - 2, UL - 2, ORANGE, `rx="2" stroke="${INK}" stroke-width="1.1"`) : R(x + 2, y + 2, UL - 4, UL - 4, 'rgba(255,138,115,.08)', `rx="2" stroke="${RED}" stroke-dasharray="3 2"`);

  if (!freeX) h += T(sx, Y0 + 40, 11, 'полоски x: все в деле', m.used === m.B ? GREEN : MUTED, 'start');
  for (let i = 0; i < freeU; i++) h += R(sx + (i % 6) * 24, Y0 + 92 + Math.floor(i / 6) * 24, 18, 18, ORANGE, `rx="2" stroke="${INK}" stroke-width="1.1"`);

}

function tapTile(k, s) {

    c.p--; c.n--; S.sel = null;
    toast(`${KIND[k].v || '1'} + (−${KIND[k].v || '1'}) = 0 — нулевая пара убрана.`);
  } else if (sel && sel.k !== k && sel.s !== s) {
    toast(`${KIND[sel.k].name} и ${KIND[k].name} — не подобные члены: у них разная буквенная часть.`);
    S.sel = { k, s };

}

  if (id === 'power') h = `<h2>Степень aⁿ</h2><dl class="reads"><div><dt>aⁿ</dt><dd id="r1"></dd></div><div><dt>Знак</dt><dd id="r2"></dd></div><div><dt>Цифр</dt><dd id="r3"></dd></div></dl>` +
    slider('inA', 'Основание a', -3, 5, 1, S.a1) + slider('inN', 'Показатель n', 1, 10, 1, S.n1) + '<div id="sDiag"></div>';
  if (id === 'mono') h = `<h2>Приведение подобных</h2><dl class="reads"><div><dt>Пар</dt><dd id="r1"></dd></div><div><dt>Членов</dt><dd id="r2"></dd></div><div><dt>Ст. вид</dt><dd id="r3"></dd></div></dl>` +
    `<h3>Убрать нулевую пару</h3><div class="row">${KINDS.map(k => `<button class="ghostbtn" data-z="${k}">${KIND[k].name} и −${KIND[k].name}</button>`).join('')}</div>` +
    `<h3>Степень многочлена</h3><div class="chips">${[1, 2, 3, 4].map(d => pbtn('deg-' + d, d, S.deg === d)).join('')}</div><div id="sDiag"></div>`;
  if (id === 'fsu') h = `<h2>Формулы на площадях</h2><div class="chips">${pbtn('mode-sum', '(a + b)²', S.mode === 'sum')}${pbtn('mode-dif', '(a − b)²', S.mode === 'dif')}${pbtn('mode-sq', 'a² − b²', S.mode === 'sq')}</div>` +
    `<dl class="reads"><div><dt>Площадь</dt><dd id="r1"></dd></div><div><dt>a² + b²</dt><dd id="r2"></dd></div><div><dt>2ab</dt><dd id="r3"></dd></div></dl>` +
    slider('inA3', 'a', 1, 8, 1, S.a3) + slider('inB3', 'b', 1, 5, 1, S.b3) +
    (S.mode === 'sum' ? `<h3>Положить часть в рамку</h3><div class="row">${['A2', 'AB1', 'AB2', 'B2'].map(k => `<button class="ghostbtn" data-pc="${k}">${{ A2: 'a²', AB1: 'ab (справа)', AB2: 'ab (снизу)', B2: 'b²' }[k]}</button>`).join('')}</div>` : '') + '<div id="sDiag"></div>';
  if (id === 'factor') h = `<h2>Прямоугольник из плиток</h2><div class="chips">${TARGETS.map((t, i) => pbtn('tg-' + i, polyStr([1, t.b, t.c]), S.tg === i)).join('')}</div>` +
    `<dl class="reads"><div><dt>Справа</dt><dd id="r1"></dd></div><div><dt>Снизу</dt><dd id="r2"></dd></div><div><dt>Угол</dt><dd id="r3"></dd></div></dl>` +
    `<div class="row"><button class="ghostbtn" data-a="addR">+x справа</button><button class="ghostbtn" data-r="R">−x справа</button><button class="ghostbtn" data-a="addD">+x снизу</button><button class="ghostbtn" data-r="D">−x снизу</button></div><div id="sDiag"></div>`;
  el.innerHTML = h;
  const on = (sel, ev, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener(ev, fn); };
  on('#inA', 'input', e => { S.a1 = +e.target.value; update(); });
  on('#inN', 'input', e => { S.n1 = +e.target.value; update(); });
  on('#inA3', 'input', e => { const v = +e.target.value; if (S.mode !== 'sum' && S.b3 >= v) { e.target.value = S.a3; toast('В этом режиме a должно быть больше b.'); return; } S.a3 = v; update(); });
  on('#inB3', 'input', e => { const v = +e.target.value; if (S.mode !== 'sum' && v >= S.a3) { e.target.value = S.b3; toast('В этом режиме b должно быть меньше a.'); return; } S.b3 = v; update(); });
  el.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { const k = b.dataset.z, c = S.T[k]; if (c.p && c.n) { S.sel = { k, s: 'p' }; tapTile(k, 'n'); } else toast(`Пар ${KIND[k].name} и −${KIND[k].name} не осталось.`); });
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pick(b.dataset.p); if (LID() !== 'factor' && LID() !== 'fsu') buildScheme(); updateScheme(model()); });
  el.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => place(b.dataset.pc));
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rmStrip(b.dataset.r));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (!el.querySelector('#sDiag')) return;
  if (m.kind === 'power') {
    set('#r1', big(m.v)); set('#r2', m.v > 0 ? 'плюс' : m.v < 0 ? 'минус' : 'ноль'); set('#r3', String(Math.abs(m.v)).length);
    set('#inAO', ns(m.a)); set('#inNO', m.n); val('#inA', m.a); val('#inN', m.n);
  } else if (m.kind === 'mono') {
    set('#r1', m.pairs); set('#r2', m.pairs ? '—' : m.terms); set('#r3', m.pairs ? '—' : m.std);
    el.querySelectorAll('[data-p^="deg-"]').forEach(b => b.setAttribute('aria-pressed', S.deg === +b.dataset.p.slice(4)));
  } else if (m.kind === 'fsu') {
    set('#r1', m.mode === 'sum' ? m.sum2 : m.mode === 'dif' ? m.dif2 : m.sq); set('#r2', m.a * m.a + m.b * m.b); set('#r3', 2 * m.a * m.b);
    set('#inA3O', m.a); set('#inB3O', m.b); val('#inA3', m.a); val('#inB3', m.b);
    el.querySelectorAll('[data-pc]').forEach(b => b.disabled = !!S.placed[b.dataset.pc]);
  } else {
    set('#r1', m.p); set('#r2', m.q); set('#r3', `${m.need} / ${m.C}`);
    el.querySelectorAll('[data-p^="tg-"]').forEach(b => b.setAttribute('aria-pressed', S.tg === +b.dataset.p.slice(3)));
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'power') {
    const a = m.a, n = m.n;
    let h = `<h2>Считаем ${par(a)}${sup(n)}</h2><div class="formula">${Array(n).fill(par(a)).join(' · ')} = ${big(m.v)}</div><h3>По шагам</h3><div class="steps">`;
    for (let k = 1; k <= n; k++) h += step(`${par(a)}${sup(k)}`, k === 1 ? ns(a) : `${big(m.vals[k - 2])} · ${par(a)} = ${big(m.vals[k - 1])}`, k === n ? 'sum' : '');
    h += `</div><h3>Знак</h3><div class="steps">` + step('основание', a > 0 ? 'положительное' : a < 0 ? 'отрицательное' : 'ноль') +
      step('показатель', n % 2 ? 'нечётный' : 'чётный') + step('вывод', a > 0 ? 'степень положительна' : a === 0 ? '0ⁿ = 0' : n % 2 ? 'минус: нечётное число минусов' : 'плюс: минусы разбились на пары', 'sum') + `</div>`;
    h += `<h3>Свойство aᵐ · aⁿ = aᵐ⁺ⁿ</h3><div class="steps">` + step('пример', '2³ · 2² = 8 · 4 = 32') + step('по свойству', '2³⁺² = 2⁵ = 32', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Внимание: −2⁴ = −16 (сначала степень, потом минус), а (−2)⁴ = 16.</p>`;
  }
  if (id === 'mono') {
    let h = `<h2>Стандартный вид</h2><div class="formula">${m.pairs ? m.raw : m.std}</div><h3>Группируем подобные</h3><div class="steps">` +
      step('члены с x²', `3x² − x² = (3 − 1)x² = 2x²`) + step('члены с x', `−x + 4x = (−1 + 4)x = 3x`) + step('числа', `2 − 3 = −1`) + `</div>`;
    h += `<h3>Сейчас на поле</h3><div class="steps">` + KINDS.map((k, i) => step(KIND[k].name, `${S.T[k].p} плюс, ${S.T[k].n} минус → ${polyStr(i === 0 ? [m.c[0], 0, 0] : i === 1 ? [0, m.c[1], 0] : [0, 0, m.c[2]])}`)).join('') +
      step('итог', m.pairs ? `осталось нулевых пар: ${m.pairs}` : `${m.std} — ${m.terms} ${plural(m.terms, 'член', 'члена', 'членов')}`, 'sum') + `</div>`;
    h += `<h3>Одночлены: умножение</h3><div class="steps">` + step('пример', '2x · 3x = (2 · 3) · x¹⁺¹ = 6x²') + step('степень 6x²', '2') + step('степень −5a²b³', '2 + 3 = 5', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Степень многочлена выберите сами — по стандартному виду.</p>`;
  }
  if (id === 'fsu') {
    const a = m.a, b = m.b;
    let h;
    if (m.mode === 'sum') h = `<h2>Квадрат суммы</h2><div class="formula">(a + b)² = a² + 2ab + b²</div><h3>При a = ${a}, b = ${b}</h3><div class="steps">` +
      step('a²', `${a}² = ${a * a}`) + step('2ab', `2 · ${a} · ${b} = ${2 * a * b}`) + step('b²', `${b}² = ${b * b}`) + step('сумма', `${a * a} + ${2 * a * b} + ${b * b} = ${m.sum2}`) +
      step('проверка', `(${a} + ${b})² = ${a + b}² = ${m.sum2} ✓`, 'sum') + step('ошибка a² + b²', `${a * a + b * b} ≠ ${m.sum2}: потеряно 2ab = ${2 * a * b}`) + `</div>`;
    else if (m.mode === 'dif') h = `<h2>Квадрат разности</h2><div class="formula">(a − b)² = a² − 2ab + b²</div><h3>При a = ${a}, b = ${b}</h3><div class="steps">` +
      step('a²', `${a * a}`) + step('− 2ab', `−2 · ${a} · ${b} = −${2 * a * b}`) + step('+ b²', `+${b * b}`) + step('итог', `${a * a} − ${2 * a * b} + ${b * b} = ${m.dif2}`) +
      step('проверка', `(${a} − ${b})² = ${a - b}² = ${m.dif2} ✓`, 'sum') + `</div>`;
    else h = `<h2>Разность квадратов</h2><div class="formula">a² − b² = (a + b)(a − b)</div><h3>При a = ${a}, b = ${b}</h3><div class="steps">` +
      step('a² − b²', `${a * a} − ${b * b} = ${m.sq}`) + step('(a + b)(a − b)', `${a + b} · ${a - b} = ${(a + b) * (a - b)}`) + step('совпадает?', m.sq === (a + b) * (a - b) ? 'да ✓' : 'нет', 'sum') + `</div>`;
    return h + `<h3>Счёт в уме</h3><div class="steps">` + step('51²', '(50 + 1)² = 2500 + 100 + 1 = 2601') + step('49²', '(50 − 1)² = 2500 − 100 + 1 = 2401') + step('99 · 101', '(100 − 1)(100 + 1) = 10000 − 1 = 9999') + `</div>`;
  }
  const poly = polyStr([1, m.B, m.C]);
  let h = `<h2>Ищем стороны</h2><div class="formula">${poly}</div><h3>Что нужно</h3><div class="steps">` +
    step('полоски справа + снизу', `p + q = ${m.B}`) + step('клетки угла', `p · q = ${m.C}`) + `</div><h3>Сейчас</h3><div class="steps">` +
    step('p (справа)', m.p) + step('q (снизу)', m.q) + step('p + q', `${m.used} ${m.used === m.B ? '✓' : m.used < m.B ? '— не все полоски' : ''}`) + step('p · q', `${m.need} ${m.need === m.C ? '✓' : m.need < m.C ? '— лишние единички' : '— не хватает единичек'}`, 'sum') + `</div>`;
  if (m.complete) {
    const p = Math.min(m.p, m.q), q = Math.max(m.p, m.q);
    h += `<h3>Группировка</h3><div class="steps">` + (p === 0
      ? step('общий множитель', `x² + ${q}x = x · x + ${q} · x = x(x + ${q})`, 'sum')
      : step('разбили bx', `x² + ${p}x + ${q}x + ${m.C}`) + step('группы', `x(x + ${p}) + ${q}(x + ${p})`) + step('вынесли (x + ' + p + ')', factStr(p, q), 'sum')) + `</div>`;
  } else h += `<p class="note" style="margin-top:10px">Подберите p и q: их сумма — коэффициент при x, произведение — свободный член.</p>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'power') el.innerHTML = `<div class="k">Степень</div><div class="v ${ok ? 'ok' : ''}">${big(m.v)}</div><div class="lr"><span>a</span><span>${ns(m.a)}</span></div><div class="lr"><span>n</span><span>${m.n}</span></div><div class="lr"><span>знак</span><span>${m.v > 0 ? '+' : m.v < 0 ? '−' : '0'}</span></div>`;
  else if (id === 'mono') el.innerHTML = `<div class="k">Нулевых пар</div><div class="v ${m.pairs ? '' : 'ok'}">${m.pairs}</div><div class="lr"><span>плиток</span><span>${KINDS.reduce((s, k) => s + S.T[k].p + S.T[k].n, 0)}</span></div><div class="gauge"><b style="width:${((4 - m.pairs) / 4 * 100).toFixed(1)}%;background:var(--ok)"></b></div>`;
  else if (id === 'fsu') el.innerHTML = `<div class="k">Площадь</div><div class="v ${ok ? 'ok' : ''}">${m.mode === 'sum' ? m.sum2 : m.mode === 'dif' ? m.dif2 : m.sq}</div><div class="lr"><span>a / b</span><span>${m.a} / ${m.b}</span></div><div class="lr"><span>частей</span><span>${m.cnt}/4</span></div><div class="gauge"><b style="width:${(m.cnt / 4 * 100).toFixed(1)}%;background:var(--ok)"></b></div>`;
  else el.innerHTML = `<div class="k">Угол / единички</div><div class="v ${m.complete ? 'ok' : ''}" style="${m.need > m.C ? 'color:var(--warn)' : ''}">${m.need} / ${m.C}</div><div class="lr"><span>полоски</span><span>${m.used}/${m.B}</span></div><div class="lr"><span>p · q</span><span>${m.p} · ${m.q}</span></div>`;
}

function update() {
  if (LID() === 'power' && S.a1 === 2 && S.n1 === 10 && !S.seen) { S.seen = true; toast('2¹⁰ = 1024 — ровно столько байт в килобайте.'); }
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Многочлены покорены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  mono: '<rect x="6" y="5" width="14" height="14" rx="2" fill="#5fb4d9"/><rect x="23" y="5" width="14" height="14" rx="2" fill="#ff8a73"/><rect x="41" y="5" width="5" height="14" rx="1" fill="#b59cff"/><rect x="48" y="5" width="5" height="14" rx="1" fill="#b59cff"/><rect x="6" y="22" width="5" height="5" fill="#ffb547"/><rect x="13" y="22" width="5" height="5" fill="#ff8a73"/>',
  fsu: '<rect x="18" y="2" width="16" height="16" fill="#5fb4d9"/><rect x="34" y="2" width="10" height="16" fill="#b59cff"/><rect x="18" y="18" width="16" height="10" fill="#b59cff"/><rect x="34" y="18" width="10" height="10" fill="#ffb547"/>',
  factor: '<rect x="12" y="2" width="14" height="14" fill="#5fb4d9"/><rect x="26" y="2" width="5" height="14" fill="#b59cff"/><rect x="31" y="2" width="5" height="14" fill="#b59cff"/><rect x="12" y="16" width="14" height="5" fill="#b59cff"/><rect x="26" y="16" width="5" height="5" fill="#ffb547"/><rect x="31" y="16" width="5" height="5" fill="#ffb547"/><rect x="12" y="21" width="14" height="5" fill="#b59cff"/><rect x="26" y="21" width="5" height="5" fill="#ffb547"/><rect x="31" y="21" width="5" height="5" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.a1 = LESSONS[0].a; S.n1 = LESSONS[0].n; S.seen = false;
  S.T = cloneT(); S.sel = null; S.deg = null;
  S.a3 = LESSONS[2].a; S.b3 = LESSONS[2].b; S.mode = 'sum'; S.placed = {}; S.assembled = false;
  S.tg = LESSONS[3].tg; S.p = 0; S.q = 0;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'power') now = `Степень ${par(m.a)}${sup(m.n)} (основание a = ${ns(m.a)}, показатель n = ${m.n}) = ${big(m.v)}. Показаны ${m.n} одинаковых множителей и столбчатая диаграмма значений a¹ … a${sup(m.n)} (отрицательные — красные, ниже оси). ` +
    `Первая часть задания (найти n, при котором 2ⁿ = 1024): ${m.seen ? 'выполнена' : 'ещё не выполнена'}. Вторая часть: подобрать n для основания −2, чтобы получить −32.`;
  if (id === 'mono') now = `Алгебраические плитки многочлена 3x² − x + 2 − x² + 4x − 3 (x² — синий квадрат, x — фиолетовая полоска, 1 — оранжевый квадратик, отрицательные — красные). Сейчас на поле: ${m.raw}. Нулевых пар осталось: ${m.pairs}. ` +
    `${m.pairs ? '' : `Стандартный вид: ${m.std}. `}Ученик ${m.deg === null ? 'ещё не выбрал степень многочлена' : `выбрал степень ${m.deg} (${m.deg === m.realDeg ? 'верно' : 'неверно'})`}.`;
  if (id === 'fsu') now = `Режим ${{ sum: 'квадрат суммы (a + b)²: ученик собирает квадрат из частей a², ab, ab, b² перетаскиванием', dif: 'квадрат разности (a − b)² на картинке с вычитанием полос', sq: 'разность квадратов: из квадрата a² вырезан угол b², часть переложена в прямоугольник (a + b)(a − b)' }[m.mode]}. a = ${m.a}, b = ${m.b}. ` +
    `Квадрат (a + b)² ${m.assembled ? 'уже собран' : `ещё не собран (в рамке ${m.cnt} из 4 частей)`}. Для задания нужен режим a² − b² при a = 7, b = 3.`;
  if (id === 'factor') now = `Многочлен ${polyStr([1, m.B, m.C])}${m.tg ? ' (тренировочный; задание — x² + 5x + 6)' : ''} в виде плиток: x², ${m.B} полосок x, ${m.C} единичек. Ученик строит прямоугольник: справа ${m.p} полосок, снизу ${m.q}; угол ${m.p}×${m.q} = ${m.need} клеток при ${m.C} единичках. ` +
    `${m.complete ? `Прямоугольник сложен: ${polyStr([1, m.B, m.C])} = ${factStr(m.p, m.q)}.` : 'Прямоугольник ещё не сложен.'}`;
  return [
    `Раздел: математика, 7 класс, алгебра, тема «Многочлены». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (нужный показатель, степень многочлена, множители): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    power: 'Почему (−2)⁴ положительно, а (−2)⁵ отрицательно?', mono: 'Почему x² и x нельзя сложить?',
    fsu: 'Откуда в (a + b)² берётся 2ab?', factor: 'Как подобрать числа для разложения x² + bx + c?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
