<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 8 класс: ковалентная, ионная и металлическая связь, типы кристаллических решёток.">
<title>Химическая связь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry. Model stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chips button.ok{border-color:var(--ok);color:var(--ok)}
.chips button.ok[aria-pressed="true"]{background:var(--ok);color:var(--bg)}
.rules{display:grid;gap:6px;margin-top:6px}
.rules div{background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.45}
.rules b{color:var(--fg);font-weight:600}
@media (max-width:1680px){.hint{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="13.5" cy="20" r="6.5" fill="none" stroke="var(--fg)" stroke-width="1.8"/><circle cx="26.5" cy="20" r="6.5" fill="none" stroke="var(--fg)" stroke-width="1.8"/><circle cx="20" cy="17.6" r="1.7" fill="var(--arm)"/><circle cx="20" cy="22.4" r="1.7" fill="var(--arm)"/><circle cx="5" cy="20" r="1.4" fill="var(--force)"/><circle cx="35" cy="20" r="1.4" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Химия · Химическая связь</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#chem">Карта</a><a href="/physics/#chem">Химия</a><a href="/labs/chem-bonds/" aria-current="page">Химическая связь</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Связь</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Модели атомов, ионов и кристаллов. Атомы, электроны, слои и карточки можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-bonds';
const TAU = Math.PI * 2;

// ---------- lesson 1: covalent bond (electron-dot model) ----------
// v — валентные электроны, u — неспаренные, chi — электроотрицательность (шкала Полинга)
const EL = {
  H: { v: 1, u: 1, chi: 2.20, r: 22, c: '#eef2f8', t: '#0b1019', name: 'водород', full: 2 },
  Cl: { v: 7, u: 1, chi: 3.16, r: 29, c: '#5fc46a', t: '#0b1019', name: 'хлор', full: 8 },
  O: { v: 6, u: 2, chi: 3.44, r: 27, c: '#e5533f', t: '#fff', name: 'кислород', full: 8 },
  N: { v: 5, u: 3, chi: 3.04, r: 27, c: '#4d7cf0', t: '#fff', name: 'азот', full: 8 },
};
const MOLS = [
  { id: 'H2', f: 'H₂', name: 'водород', st: 'H–H', atoms: [['H', 205, 250], ['H', 315, 250]], links: [[0, 1]] },
  { id: 'Cl2', f: 'Cl₂', name: 'хлор', st: 'Cl–Cl', atoms: [['Cl', 195, 250], ['Cl', 325, 250]], links: [[0, 1]] },
  { id: 'HCl', f: 'HCl', name: 'хлороводород', st: 'H–Cl', atoms: [['H', 200, 250], ['Cl', 322, 250]], links: [[0, 1]] },
  { id: 'H2O', f: 'H₂O', name: 'вода', st: 'H–O–H', atoms: [['O', 225, 215], ['H', 335, 215], ['H', 225, 322]], links: [[0, 1], [0, 2]] },
  { id: 'N2', f: 'N₂', name: 'азот', st: 'N≡N', atoms: [['N', 200, 250], ['N', 320, 250]], links: [[0, 1]] },
];
const SLOTS = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
const angd = (a, b) => { let d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };
const bondType = d => d === 0 ? 'ковалентная неполярная' : 'ковалентная полярная';

// ---------- lesson 2: ionic bond (Bohr shells) ----------
const AT2 = {
  Na: { Z: 11, sh: [2, 8, 1], metal: true, c: '#b88cf0', name: 'натрий', chi: 0.93 },
  Mg: { Z: 12, sh: [2, 8, 2], metal: true, c: '#7ad1b5', name: 'магний', chi: 1.31 },
  Cl: { Z: 17, sh: [2, 8, 7], metal: false, c: '#5fc46a', name: 'хлор', chi: 3.16 },
  O: { Z: 8, sh: [2, 6], metal: false, c: '#e5533f', name: 'кислород', chi: 3.44 },
};
const CMPS = [
  { id: 'NaCl', f: 'NaCl', name: 'хлорид натрия (поваренная соль)', atoms: [['Na', 165, 245], ['Cl', 355, 245]] },
  { id: 'MgO', f: 'MgO', name: 'оксид магния', atoms: [['Mg', 165, 245], ['O', 355, 245]] },
  { id: 'MgCl2', f: 'MgCl₂', name: 'хлорид магния', atoms: [['Cl', 92, 245], ['Mg', 260, 245], ['Cl', 428, 245]] },
];
const SHR = k => 22 + 13 * k;
const chargeStr = q => q === 0 ? '' : (Math.abs(q) > 1 ? Math.abs(q) : '') + (q > 0 ? '+' : '−');
const SUPC = { '+': '⁺', '−': '⁻', '1': '¹', '2': '²', '3': '³' };
const ionName = (s, q) => s + chargeStr(q).split('').map(c => SUPC[c] || c).join('');

// ---------- lesson 3: metallic bond ----------
const ST3 = 50, COLS = 8, ROWS = 4, X3 = 85, Y3 = 165, ALPHA = 0.0043; // α меди, 1/°C
const ELS = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 34; i++) ELS.push({ x: 62 + r() * 396, y: 144 + r() * 192, a: r() * TAU }); }

// ---------- lesson 4: crystal lattices ----------

// ---------- models ----------
function modelCov() {
  const M = MOLS[S.mol];
  const at = M.atoms.map(([s, x, y], i) => ({ s, x, y, i, E: EL[s], b: 0 }));
  const bonds = M.links.map(([a, b]) => { const n = S.bonds[a + '-' + b] || 0; at[a].b += n; at[b].b += n; return { a, b, n, d: Math.abs(EL[M.atoms[a][0]].chi - EL[M.atoms[b][0]].chi) }; });
  at.forEach(a => { a.unp = a.E.u - a.b; a.around = a.E.v - a.E.u + a.unp + 2 * a.b; a.ok = a.unp === 0; });
  const complete = at.every(a => a.ok), polar = bonds.some(b => b.d > 0);
  return { kind: 'cov', M, at, bonds, complete, polar, nb: bonds.reduce((s, b) => s + b.n, 0), nOk: at.filter(a => a.ok).length };
}
function modelIon() {
  const C = CMPS[S.cmp];
  const at = C.atoms.map(([s, x, y], i) => {
    const A = AT2[s], d = S.de[i] || 0, last = A.sh[A.sh.length - 1], outer = last + d;
    const shells = A.metal && outer === 0 ? A.sh.slice(0, -1) : A.sh.slice(0, -1).concat([outer]);
    return { s, x, y, i, A, d, q: -d, outer, shells, give: A.metal ? outer : 0, need: A.metal ? 0 : 8 - outer, ok: A.metal ? outer === 0 : outer === 8 };
  });
  return { kind: 'ion', C, at, complete: at.every(a => a.ok), moved: at.filter(a => a.A.metal).reduce((s, a) => s - a.d, 0) };
}
function modelMet() {
  const metal = S.sample === 'metal';
  const I = metal && S.volt ? 100 / (1 + ALPHA * (S.temp - 20)) : 0;
  return { kind: 'met', metal, I };
}
function modelLat() {
  const s = SUBST[S.sub], melted = S.T >= s.tm;
  return { kind: 'lat', s, melted, placed: Object.keys(S.placed).length, test: S.tests[S.sub] || {} };
}
function model() { return [modelCov, modelIon, modelMet, modelLat][S.lesson](); }

const scene = $('#scene');
const bg = () => `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs><rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
const dot = (x, y, r, c) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${c}" stroke="${INK}" stroke-width=".9"/>`;
const C_UNP = '#ffb547', C_LONE = '#e8ecf4', C_SH = '#72d4e8';

function drawCov(m, t) {
  let h = '';
  const at = m.at;
  // shared pairs with electron clouds
  for (const B of m.bonds) {
    const A = at[B.a], C = at[B.b], dx = C.x - A.x, dy = C.y - A.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, px = -uy, py = ux;
    if (B.n === 0) { h += `<path d="M${A.x + ux * (A.E.r + 16)} ${A.y + uy * (A.E.r + 16)}L${C.x - ux * (C.E.r + 16)} ${C.y - uy * (C.E.r + 16)}" stroke="#3a4762" stroke-width="1.4" stroke-dasharray="3 5"/>`; continue; }
    const pA = [A.x + ux * A.E.r, A.y + uy * A.E.r], pC = [C.x - ux * C.E.r, C.y - uy * C.E.r];
    const sh = clamp((C.E.chi - A.E.chi) * 14, -14, 14), mx = (pA[0] + pC[0]) / 2 + ux * sh, my = (pA[1] + pC[1]) / 2 + uy * sh;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    h += `<ellipse cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" rx="${(L / 2 - 4).toFixed(1)}" ry="${10 + 7 * (B.n - 1)}" transform="rotate(${ang.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)})" fill="rgba(114,212,232,.13)" stroke="rgba(114,212,232,.35)" stroke-width="1"/>`;
    for (let k = 0; k < B.n; k++) {
      const off = (k - (B.n - 1) / 2) * 12;
      for (const s of [-5, 5]) h += dot(mx + px * off + ux * s, my + py * off + uy * s, 3.6, C_SH);
    }
  }
  // link being dragged
  if (drag && drag.kind === 'link' && drag.moved) { const A = at[drag.from]; h += `<path d="M${A.x} ${A.y}L${drag.px.toFixed(1)} ${drag.py.toFixed(1)}" stroke="${C_UNP}" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${drag.px.toFixed(1)}" cy="${drag.py.toFixed(1)}" r="5" fill="${C_UNP}"/>`; }
  // atoms with lone pairs and unpaired electrons
  for (const a of at) {
    const r = a.E.r;
    h += `<g data-drag="a${a.i}"><circle cx="${a.x}" cy="${a.y}" r="${r + 18}" fill="transparent"/>`;
    if (S.sel === a.i) h += `<circle cx="${a.x}" cy="${a.y}" r="${r + 15}" fill="none" stroke="${C_UNP}" stroke-width="1.6" stroke-dasharray="4 4"/>`;
    h += `<circle cx="${a.x}" cy="${a.y}" r="${r}" fill="${a.E.c}" stroke="${INK}" stroke-width="2.4"/><circle cx="${a.x - r * .35}" cy="${a.y - r * .35}" r="${r * .28}" fill="#fff" opacity=".18"/>`;
    h += `<text x="${a.x}" y="${a.y + 6}" font-size="${a.s.length > 1 ? 17 : 19}" fill="${a.E.t}" text-anchor="middle" font-weight="500">${a.s}</text>`;
    // free slots: remove one per bonded neighbour; singles go towards partners, pairs away from them
    const nbrs = m.bonds.filter(B => B.a === a.i || B.b === a.i).map(B => at[B.a === a.i ? B.b : B.a]);
    const dir = o => Math.atan2(o.y - a.y, o.x - a.x);
    const free = SLOTS.slice();
    for (const o of nbrs) { if (!m.bonds.find(B => (B.a === a.i && B.b === o.i) || (B.b === a.i && B.a === o.i)).n) continue; const th = dir(o); let k = 0; free.forEach((s, i) => { if (angd(s, th) < angd(free[k], th)) k = i; }); free.splice(k, 1); }
    const pd = nbrs.map(dir), cl = s => Math.min(...pd.map(d => angd(s, d)));
    free.sort((p, q) => cl(p) - cl(q));
    const pairs = (a.E.v - a.E.u) / 2;
    const place = (s, two, col) => {
      const cx = a.x + Math.cos(s) * (r + 10), cy = a.y + Math.sin(s) * (r + 10), qx = -Math.sin(s), qy = Math.cos(s);
      if (two) return dot(cx + qx * 5, cy + qy * 5, 3.4, col) + dot(cx - qx * 5, cy - qy * 5, 3.4, col);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6.5" fill="rgba(255,181,71,.18)"/>` + dot(cx, cy, 3.8, col);
    };
    for (let k = 0; k < a.unp; k++) h += place(free[k], false, C_UNP);
    for (let k = 0; k < pairs; k++) h += place(free[free.length - 1 - k], true, C_LONE);
    h += `</g>`;
  }
  // partial charges
  if (m.complete && m.polar) for (const a of at) {
    const others = m.bonds.filter(B => B.a === a.i || B.b === a.i).map(B => at[B.a === a.i ? B.b : B.a]);
    const neg = others.some(o => o.E.chi < a.E.chi);
    h += `<text x="${a.x + a.E.r * .75 + 8}" y="${a.y - a.E.r * .75 - 10}" font-size="13" fill="${neg ? '#ff8a73' : '#72d4e8'}" font-weight="500">δ${neg ? '−' : '+'}</text>`;
  }
  h += `<text x="260" y="385" font-size="13" fill="${m.complete ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">${m.complete ? `${m.M.f} · ${m.M.st} · ${bondType(m.bonds[0].d)} связь` : `${m.M.f} · соберите молекулу`}</text>`;
  return h;
}

function drawIon(m, t) {
  let h = '';
  const at = m.at, cx = at.reduce((s, a) => s + a.x, 0) / at.length;
  const off = a => m.complete ? Math.sign(cx - a.x) * 14 * S.join : 0;
  if (m.complete) {
    const xs = at.map(a => a.x + off(a)).sort((p, q) => p - q);
    for (let i = 0; i < xs.length - 1; i++) {
      const x1 = xs[i] + 52, x2 = xs[i + 1] - 52;
      h += `<path d="M${x1} 245H${x2}" stroke="#86e0a8" stroke-width="1.6" stroke-dasharray="4 4" opacity="${S.join.toFixed(2)}"/><path d="M${x1 + 7} 240l-7 5 7 5M${x2 - 7} 240l7 5-7 5" fill="none" stroke="#86e0a8" stroke-width="1.6" opacity="${S.join.toFixed(2)}"/>`;
    }
    h += `<text x="260" y="226" font-size="10" fill="#86e0a8" text-anchor="middle" opacity="${S.join.toFixed(2)}">${at.length > 2 ? '' : 'притяжение'}</text>`;
  }
  for (const a of at) {
    const x = a.x + off(a), y = a.y, A = a.A;
    h += `<g data-drag="a${a.i}"><circle cx="${x}" cy="${y}" r="${SHR(2) + 10}" fill="transparent"/>`;
    // ghost of the lost shell

function tryBond(i, j) {

  if (B.A.metal) { toast('Металл электроны не принимает — он их отдаёт. Тяните электрон на неметалл.'); return; }
  if (B.need <= 0) { toast(`У ${ionName(B.s, B.q)} уже 8 электронов на внешнем слое. Больше он не примет — отдайте другому атому.`); return; }

// ---------- pointer ----------
let drag = null, dirty = true, dropBin = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;

  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');

  const L = LID();
  if (id[0] === 'a' && L === 'covalent') drag = Object.assign(base, { kind: 'link', from: +id.slice(1) });
  else if (id[0] === 'a' && L === 'ionic') drag = Object.assign(base, { kind: 'e', from: +id.slice(1) });
  else if (id === 'shear') drag = Object.assign(base, { kind: 'shear', x0: p.x, s0: S.shift });
  else if (id === 'switch') drag = Object.assign(base, { kind: 'switch' });

});
scene.addEventListener('pointermove', e => {
  if (!drag) return;

  if (!drag.moved) return;
  const p = toSvg(e); drag.px = p.x; drag.py = p.y;

  if (drag.kind === 'tile') { if (S.placed[drag.i]) drag.moved = false; else dropBin = binAt(p); }

  if (d.kind === 'link') {
    const at = modelCov().at;

    const j = hitAtom(p, at, a => a.E.r + 22);

// ---------- loop ----------
let last = performance.now(), lastDraw = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const L = LID();
  if (L === 'ionic' && modelIon().complete && S.join < 1) { S.join = Math.min(1, S.join + dt * 1.6); anim = true; }
  if (L === 'metallic') {
    if (S.cracked && S.crackK < 1) { S.crackK = Math.min(1, S.crackK + dt * 3); anim = true; }
    if (!reduce && S.sample === 'metal') {
      const m = modelMet(), drift = 75 * m.I / 100;
      for (const e of ELS) {
        e.a += (Math.random() - 0.5) * dt * 8;
        e.x += (Math.cos(e.a) * 55 + drift) * dt; e.y += Math.sin(e.a) * 55 * dt;
        if (e.y < 144) { e.y = 144; e.a = -e.a; } if (e.y > 336) { e.y = 336; e.a = -e.a; }
        if (e.x > 458) e.x -= 396; if (e.x < 62) e.x += 396;
      }
      anim = true;
    } else if (!reduce) anim = true;
  }
  if (L === 'lattices') {
    if (S.heat) {
      const s = SUBST[S.sub];
      S.T = Math.min(TMAX, S.T + (80 + 0.9 * (S.T - T0)) * dt);
      if (S.T >= s.tm) { S.T = s.tm; S.heat = false; testOf(S.sub).tm = s.tm; toast(s.id === 'iodine' ? 'Йод плавится при 114 °C, а ещё раньше начинает возгоняться — видны фиолетовые пары.' : `${s.name} плавится при ${s.id === 'diamond' ? '≈ ' : ''}${fmt(s.tm, 0)} °C.`); update(); }
      anim = true; tickUI(t);
    }
    if (!reduce && (SUBST[S.sub].id === 'iodine' && S.T > 40 || t - S.hitT < 3100)) anim = true;
  }
  if (S.hl) anim = true;

}

function act(a) {

  if (a === 'reion') { S.de = []; S.join = 0; update(); return; }
  if (a.startsWith('tr')) { const [i, j] = a.slice(2).split('-').map(Number); return transfer(i, j); }
  if (a.startsWith('bd')) { const [i, j] = a.slice(2).split('-').map(Number); return tryBond(i, j); }

function calcHTML(m) {
  if (m.kind === 'cov') {
    let h = `<h2>Считаем электроны</h2><div class="formula">вокруг атома = свои + общие</div><p class="note">Общую пару считают у обоих атомов сразу. Цель: у H — 2 электрона, у остальных — 8.</p><h3>${m.M.f} сейчас</h3><div class="steps">`;
    for (const a of m.at) h += step(`${a.s}: ${a.E.v} внешн. e⁻, связей ${a.b}`, `${a.E.v - a.b} своих + ${2 * a.b} в общих = ${a.around} ${a.ok ? '✓' : `из ${a.E.full}`}`, a.ok ? '' : '');
    h += `</div><h3>Тип связи</h3><div class="steps">`;
    for (const B of m.bonds) { const A = m.at[B.a], C = m.at[B.b]; h += step(`ЭО: ${A.s} ${fmt(A.E.chi, 2)}, ${C.s} ${fmt(C.E.chi, 2)}`, `ΔЭО = ${fmt(B.d, 2)}`); }
    const d = m.bonds[0].d;
    h += step('вывод', d === 0 ? 'атомы одинаковые → неполярная' : `атомы разные → полярная, δ− на ${m.at.reduce((p, a) => a.E.chi > p.E.chi ? a : p).s}`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Если разница электроотрицательностей больше примерно 1,7, электрон не «делят», а отдают: связь становится ионной. Это следующий урок.</p>`;
    return h;
  }
  if (m.kind === 'ion') {
    let h = `<h2>Отдал и принял</h2><div class="formula">${m.C.f}: ${CMPS[S.cmp].atoms.map(([s]) => s).join(' + ')}</div><h3>Слои электронов</h3><div class="steps">`;
    for (const a of m.at) {
      const last = a.A.sh[a.A.sh.length - 1];
      h += step(`${a.s} (${a.A.name}): ${a.A.sh.join(', ')}`, a.A.metal ? `отдаёт ${last} → ${ionName(a.s, -last)}: ${a.A.sh.slice(0, -1).join(', ')}` : `принимает ${8 - last} → ${ionName(a.s, -(8 - last))}: ${a.A.sh.slice(0, -1).concat([8]).join(', ')}`);
    }
    const metals = m.at.filter(a => a.A.metal), gives = metals.reduce((s, a) => s + a.A.sh[a.A.sh.length - 1], 0), takes = m.at.filter(a => !a.A.metal).reduce((s, a) => s + 8 - a.A.sh[a.A.sh.length - 1], 0);
    h += step('отдано = принято', `${gives} = ${takes}`, 'sum') + `</div><h3>Сейчас</h3><div class="steps">` +
      step('перенесено электронов', `${m.moved} из ${gives}`) + step('заряды частиц', m.at.map(a => ionName(a.s, a.q)).join(', ')) + step('сумма зарядов', String(m.at.reduce((s, a) => s + a.q, 0)), 'sum') + `</div>`;
    const mt = m.at.find(a => a.A.metal), nm = m.at.find(a => !a.A.metal);
    h += `<h3>Почему связь ионная</h3><div class="steps">` + step(`ЭО: ${mt.s} ${fmt(mt.A.chi, 2)}, ${nm.s} ${fmt(nm.A.chi, 2)}`, `ΔЭО = ${fmt(nm.A.chi - mt.A.chi, 2)}`) + step('ΔЭО больше ≈ 1,7', 'электроны переходят полностью', 'sum') + `</div>`;
    return h;
  }
  if (m.kind === 'met') {
    const R = 1 + ALPHA * (S.temp - 20);
    return `<h2>Ток и температура</h2><div class="formula">R = R₂₀ · (1 + α · (t − 20))</div><p class="note">α — температурный коэффициент сопротивления, у меди α ≈ 0,0043 1/°C. Напряжение то же, поэтому ток обратно пропорционален сопротивлению.</p>
      <h3>Сейчас</h3><div class="steps">` +
      step('образец', m.metal ? 'медь' : 'ионный кристалл NaCl') + step('свободные электроны', m.metal ? 'есть' : 'нет') + step('напряжение', S.volt ? 'включено' : 'выключено') +
      (m.metal ? step('R / R₂₀', `1 + 0,0043 · (${S.temp} − 20) = ${fmt(R, 3)}`) + step('ток от тока при 20 °C', S.volt ? `1 / ${fmt(R, 3)} = ${fmt(100 / R, 0)} %` : 'цепь разомкнута', 'sum') : step('ток', 'нет: заряды не могут двигаться', 'sum')) + `</div>
      <h3>Сдвиг слоя</h3><div class="steps">` +
      step('металл', S.bent ? 'слой сдвинулся, связь цела' : 'ещё не пробовали') + step('ионный кристалл', S.crackSeen ? 'раскололся' : 'ещё не пробовали') + `</div>
      <p class="note" style="margin-top:10px">В металле после сдвига каждый ион снова окружён электронным газом. В ионном кристалле после сдвига на пол-ряда «+» встаёт против «+», а «−» против «−»: силы притяжения сменяются отталкиванием.</p>`;
  }
  const s = m.s, tt = m.test, placed = S.placed[S.sub];
  return `<h2>Как узнать решётку</h2><div class="rules">
      <div><b>Ионная:</b> тугоплавкая (сотни и тысячи °C), хрупкая, в твёрдом виде ток не проводит, расплав — проводит.</div>
      <div><b>Атомная:</b> очень тугоплавкая и очень твёрдая, ток не проводит ни твёрдой, ни в расплаве.</div>
      <div><b>Молекулярная:</b> легкоплавкая (обычно ниже 300 °C), мягкая, часто летучая и с запахом.</div>
      <div><b>Металлическая:</b> проводит ток в твёрдом виде, ковкая, блестит.</div></div>
    <h3>${s.name} (${s.f})</h3><div class="steps">` +
    step('температура плавления', tt.tm !== undefined ? (s.id === 'diamond' ? '≈ ' : '') + fmt(tt.tm, 0) + ' °C' : 'не измерена') +
    step('ток в твёрдом виде', yes(tt.tokS)) + step('ток в расплаве', yes(tt.tokL)) + step('удар молотком', tt.hit ? s.hit : 'не проверяли') +
    step('вывод', placed ? `${TNAME[placed]} решётка ✓` : 'сравните с признаками выше', 'sum') + `</div>` +
    (placed ? `<p class="note" style="margin-top:10px">${({ ion: 'В узлах — ионы, между ними сильное притяжение разноимённых зарядов.', atom: 'В узлах — атомы, все связаны прочными ковалентными связями в один каркас.', mol: 'В узлах — молекулы. Внутри молекулы связи прочные, а между молекулами слабые: их легко «растащить» нагревом.', met: 'В узлах — ионы металла, между ними свободные электроны.' })[placed]}</p>` : '');
}

}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, что держит вещество вместе!'), 1600);
  }
  renderMeter(m);
  renderTools();
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; dropBin = null;
  S.bonds = {}; S.sel = null; S.de = []; S.join = 0;
  S.volt = false; S.shift = 0; S.cracked = false; S.crackK = 0;
  S.T = T0; S.heat = false; S.hitT = -1e9;
  Object.assign(S, L.init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'covalent') now = `Модель «точек» (электронная формула). Собирается молекула ${m.M.f} (${m.M.name}). Атомы: ${m.at.map(a => `${a.s} — внешних электронов ${a.E.v}, неспаренных осталось ${a.unp}, общих пар ${a.b}, вокруг ${a.around} из ${a.E.full}`).join('; ')}. ${m.complete ? `Молекула готова: ${m.M.st}, связь ${bondType(m.bonds[0].d)}.` : 'Молекула ещё не собрана.'} Уже собраны: ${MOLS.filter(x => S.built[x.id]).map(x => x.f).join(', ') || 'ничего'} (нужно H₂, Cl₂, HCl, H₂O, N₂). Ученик тянет линию от атома к атому, чтобы создать общую пару.`;
  if (id === 'ionic') now = `Модель электронных слоёв (Бора). Вещество ${m.C.f} (${m.C.name}). Частицы: ${m.at.map(a => `${ionName(a.s, a.q)} — слои ${a.shells.join(', ')}`).join('; ')}. Перенесено электронов: ${m.moved}. ${m.complete ? 'Все слои завершены, ионы притягиваются.' : 'Перенос не закончен.'} Уже получены: ${CMPS.filter(x => S.built2[x.id]).map(x => x.f).join(', ') || 'ничего'} (нужно NaCl, MgO, MgCl₂). Ученик тянет электрон с внешнего слоя металла на неметалл. Не говори, сколько электронов переносить, — спроси, сколько не хватает до восьми.`;
  if (id === 'metallic') now = `Образец: ${m.metal ? 'металл (медь): ионы в узлах и свободные электроны' : 'ионный кристалл NaCl: ионы Na⁺ и Cl⁻, свободных электронов нет'}. Напряжение ${S.volt ? 'включено' : 'выключено'}, ток ${m.I > 0 ? fmt(m.I, 0) + ' % от тока при 20 °C' : 'нет'}. Температура металла ${S.temp} °C. Верхние слои ${S.shift ? `сдвинуты на ${fmt(S.shift / ST3, 1)} ряда` : 'на месте'}${S.cracked ? ', ионный кристалл раскололся' : ''}. Сделано: ток в металле — ${S.cur ? 'да' : 'нет'}, сдвиг слоя металла — ${S.bent ? 'да' : 'нет'}, раскол ионного кристалла — ${S.crackSeen ? 'да' : 'нет'}.`;
  if (id === 'lattices') { const tt = m.test; now = `Испытываем «${m.s.name}» (${m.s.f}). Температура ${fmt(S.T, 0)} °C${m.melted ? ', образец расплавлен' : ''}. Измерено: tпл ${tt.tm !== undefined ? fmt(tt.tm, 0) + ' °C' : 'не измерена'}, ток в твёрдом виде ${yes(tt.tokS)}, в расплаве ${yes(tt.tokL)}, удар молотком ${tt.hit ? m.s.hit : 'не проверяли'}. Вещества: ${SUBST.map(x => `${x.name} ${x.f}`).join(', ')}. Уже правильно разложены: ${SUBST.filter((x, i) => S.placed[i]).map(x => `${x.name} — ${TNAME[S.placed[SUBST.indexOf(x)]]}`).join(', ') || 'ничего'}. Ошибок: ${S.wrong}. Не называй тип решётки для неразложенных веществ — подскажи, какое испытание провести и что значит результат.`; }
  return [
    `Предмет: химия, 8 класс. Тема «Химическая связь». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { covalent: 'Почему у азота связь тройная, а у хлора одинарная?', ionic: 'Почему натрий отдаёт электрон, а хлор принимает?', metallic: 'Почему горячий провод хуже проводит ток?', lattices: 'Почему соль плавится при 801 °C, а лёд при 0 °C?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
