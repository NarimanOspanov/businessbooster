<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 8 класс: кислород и горение, получение водорода и проба на чистоту, электролиз и свойства воды, состав воздуха.">
<title>Кислород, водород, вода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene [data-drag] text{pointer-events:none}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
.tgts{display:grid;gap:6px;margin-top:10px}
.tgts div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px}
.tgts div span:last-child{font:500 12.5px var(--font-mono);color:var(--muted);white-space:nowrap}
.tgts div.on span:last-child{color:var(--ok)}
.cnt.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cnt button.w{width:38px;font-size:12px}
.ans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.ans button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font:500 14px/1 var(--font-mono);cursor:pointer;color:var(--fg)}
.ans button.ok{border-color:var(--ok);color:var(--ok)}
.ans button.bad{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>O₂ · H₂</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол: банки с газами, прибор для получения водорода, электролизёр, стакан с водой и колокол для опыта с воздухом. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-oxy';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fmt = (x, d = 2) => String(+(+x).toFixed(d)).replace('.', ',');
const n1 = v => (+v).toFixed(1);
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(k, 0, 1)).toString(16).padStart(2, '0')).join(''); };

// ---------- lesson 1: oxygen and burning ----------
const ITEMS1 = ['splint', 'C', 'S', 'Fe', 'Mg'];
const IT1 = { splint: { name: 'тлеющая лучинка', short: 'лучинка' }, C: { name: 'уголь', short: 'C' }, S: { name: 'сера', short: 'S' }, Fe: { name: 'железная проволока', short: 'Fe' }, Mg: { name: 'магниевая лента', short: 'Mg' } };
const FX = {
  splint: { air: { em: '#ff6a3d', glow: 'O', gr: 12, txt: 'Лучинка только тлеет: огонёк красный и не разгорается.' },
            O2: { fl: 13, c: '#ffc04d', core: '#fff1c2', glow: 'O', gr: 40, txt: 'Лучинка ярко вспыхнула! Так узнают кислород.' },
            eq: 'древесина + O₂ → CO₂ + H₂O' },
  C: { air: { em: '#ff5a2e', glow: 'O', gr: 14, txt: 'Уголь медленно тлеет красным.' },

function tick(dt) {

    return true;

const stepH = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const tg = (a, b, on) => `<div class="${on ? 'on' : ''}"><span>${a}</span><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'burn') return `Лучинка в O₂: ${S.f1.splint ? 'да' : 'нет'} · сожжено в O₂: ${['C', 'S', 'Fe'].filter(k => S.f1[k]).length} из 3`;
  if (m.kind === 'hydro') return `Проба: ${S.f2.pure ? 'чистый ✓' : S.last2 || 'не было'} · CuO → Cu: ${Math.round(S.cu * 100)} %`;
  if (m.kind === 'water') return `H₂: ${fmt(S.vH, 1)} мл${S.f3.full ? ' ✓' : ''} · пробы газов: ${(S.f3.h ? 1 : 0) + (S.f3.o ? 1 : 0)} из 2 · вещества: ${CUPIT.filter(k => S.f3[k]).length} из 4`;
  return `Опыт: ${S.f4.ans ? 'ответ верный ✓' : S.bp === 3 ? 'ждёт ответа' : S.bp ? 'идёт' : 'не начат'} · модель: ${S.f4.model ? 'верна ✓' : m.sum + ' из 100'}`;
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'burn') h = `<h2>Банки и вещества</h2>
      <dl class="reads"><div><dt>Банка</dt><dd id="r1"></dd></div><div><dt>Вещество</dt><dd id="r2"></dd></div><div><dt>Газ</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Куда вносим</div><div class="chips">${B('j-A', 'Банка А', S.jarSel === 'A')}${B('j-B', 'Банка Б', S.jarSel === 'B')}</div></div>
      <div class="ctl"><div class="lbl">Что вносим</div><div class="chips">${ITEMS1.map(it => B('i-' + it, IT1[it].name)).join('')}${B('out', 'Вынуть')}</div></div>
      <h3>Цели</h3><div class="tgts" id="tg"></div>`;
  if (id === 'hydro') h = `<h2>Прибор для водорода</h2>
      <dl class="reads"><div><dt>H₂ из прибора</dt><dd id="r1"></dd></div><div><dt>H₂ в пробирке</dt><dd id="r2"></dd></div><div><dt>CuO → Cu</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Прибор</div><div class="chips">${B('acid', 'Кислота на цинк', S.acid)}${B('flip', 'Перевернуть пробирку')}</div></div>
      <div class="ctl"><div class="lbl">Пробирка</div><div class="chips">${B('z-out', 'К трубке', S.tube === 'out')}${B('z-lamp', 'К пламени', S.tube === 'lamp')}${B('z-home', 'В штатив', S.tube === 'home')}</div></div>
      <div class="ctl"><div class="lbl">Восстановление меди</div><div class="chips">${B('clamp', 'Зажим открыт', S.clamp)}${B('heat', 'Нагрев', S.heat)}</div></div>
      <h3>Цели</h3><div class="tgts" id="tg"></div>`;
  if (id === 'water') h = `<h2>${S.mode3 === 'el' ? 'Электролиз воды' : 'Вода + лакмус'}</h2>
      <div class="ctl"><div class="lbl">Режим</div><div class="chips">${B('m3-el', 'Электролиз', S.mode3 === 'el')}${B('m3-cup', 'Стакан', S.mode3 === 'cup')}</div></div>` +
      (S.mode3 === 'el' ? `<dl class="reads"><div><dt>V(H₂), мл</dt><dd id="r1"></dd></div><div><dt>V(O₂), мл</dt><dd id="r2"></dd></div><div><dt>H₂ : O₂</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><label for="iR">Сила тока <output id="iO"></output></label><input type="range" id="iR" min="0.5" max="3" step="0.5" value="${S.I}"></div>
      <div class="chips" style="margin-top:12px">${B('cur', 'Ток', S.on)}${B('tH', 'Проба H₂')}${B('tO', 'Проба O₂')}${B('reset3', 'Сброс')}</div>` :
      `<dl class="reads"><div><dt>Вещество</dt><dd id="r1"></dd></div><div><dt>Лакмус</dt><dd id="r2"></dd></div><div><dt>Испытано</dt><dd id="r3"></dd></div></dl>
      <div class="ctl"><div class="lbl">Бросить в воду</div><div class="chips">${CUPIT.map(x => B('cup-' + x, RX[x].name)).join('')}${B('fresh', 'Свежая вода')}</div></div>`) +
      `<h3>Цели</h3><div class="tgts" id="tg"></div>`;
  if (id === 'air') h = `<h2>${S.mode4 === 'bell' ? 'Опыт под колоколом' : 'Модель воздуха'}</h2>
      <div class="ctl"><div class="lbl">Режим</div><div class="chips">${B('m4-bell', 'Колокол', S.mode4 === 'bell')}${B('m4-model', 'Модель', S.mode4 === 'model')}</div></div>` +
      (S.mode4 === 'bell' ? `<dl class="reads"><div><dt>Стадия</dt><dd id="r1"></dd></div><div><dt>Подъём воды</dt><dd id="r2"></dd></div><div><dt>Делений</dt><dd>5</dd></div></dl>
      <div class="chips" style="margin-top:12px">${B('ign', 'Поджечь фосфор')}${B('again', 'Повторить')}</div>
      <div class="ctl"><div class="lbl">Какая часть воздуха израсходована?</div><div class="ans" id="ansB">${ANS.map(([v, s]) => `<button data-a="ans-${v}">${s}</button>`).join('')}</div></div>` :
      `<dl class="reads"><div><dt>Всего</dt><dd id="r1"></dd></div><div><dt>O₂, %</dt><dd id="r2"></dd></div><div><dt>N₂, %</dt><dd id="r3"></dd></div></dl>
      <div class="cnt">${GAS4.map(g => `<div><span>${low(g)} · ${G4[g].n}</span><span><button data-a="st:${g}:-10" aria-label="Минус 10: ${G4[g].n}" class="w">−10</button> <button data-a="st:${g}:-1" aria-label="Минус 1: ${G4[g].n}">−</button> <b data-c="${g}">0</b> <button data-a="st:${g}:1" aria-label="Плюс 1: ${G4[g].n}">+</button> <button data-a="st:${g}:10" aria-label="Плюс 10: ${G4[g].n}" class="w">+10</button></span></div>`).join('')}</div>`) +
      `<h3>Цели</h3><div class="tgts" id="tg"></div>`;
  el.innerHTML = h;
  const r = el.querySelector('#iR');
  if (r) r.oninput = () => { S.I = +r.value; update(true); };
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const P = { 'j-A': S.jarSel === 'A', 'j-B': S.jarSel === 'B', acid: S.acid, 'z-out': S.tube === 'out', 'z-lamp': S.tube === 'lamp', 'z-home': S.tube === 'home', clamp: S.clamp, heat: S.heat, cur: S.on, 'm3-el': S.mode3 === 'el', 'm3-cup': S.mode3 === 'cup', 'm4-bell': S.mode4 === 'bell', 'm4-model': S.mode4 === 'model' };
  el.querySelectorAll('button[data-a][aria-pressed]').forEach(b => { const v = P[b.dataset.a]; if (v !== undefined) b.setAttribute('aria-pressed', v); });
  const tgEl = el.querySelector('#tg');
  if (m.kind === 'burn') {
    set('#r1', S.jarSel === 'A' ? 'А' : 'Б'); set('#r2', S.spoon ? IT1[S.spoon.it].short : '—');
    set('#r3', S.rev[S.jarSel] ? (S.oxJar === S.jarSel ? 'O₂' : 'воздух') : '?');
    if (tgEl) tgEl.innerHTML = tg('Лучинка вспыхнула в O₂', S.f1.splint ? '✓' : '?', S.f1.splint) + ['C', 'S', 'Fe'].map(k => tg(`${IT1[k].name} в O₂`, S.f1[k] ? FX[k].prod + ' ✓' : '?', S.f1[k])).join('');
  } else if (m.kind === 'hydro') {
    set('#r1', Math.round(m.g * 100) + ' %'); set('#r2', Math.round(S.fH * 100) + ' %'); set('#r3', Math.round(S.cu * 100) + ' %');
    if (tgEl) tgEl.innerHTML = tg('Проба на чистоту', S.f2.pure ? 'глухой хлопок ✓' : S.last2 || '?', S.f2.pure) + tg('CuO → Cu', S.f2.cu ? 'медь ✓' : Math.round(S.cu * 100) + ' %', S.f2.cu);
  } else if (m.kind === 'water') {
    if (S.mode3 === 'el') { set('#r1', fmt(S.vH, 1)); set('#r2', fmt(S.vH / 2, 1)); set('#r3', S.vH > 0 ? '2 : 1' : '—'); set('#iO', fmt(S.I, 1) + ' А'); }
    else { set('#r1', S.cupIt ? low(S.cupIt) : '—'); set('#r2', !S.cupIt || RX[S.cupIt].col === LIT0 ? 'фиолетовый' : RX[S.cupIt].col === '#e0455a' ? 'красный' : 'синий'); set('#r3', CUPIT.filter(k => S.f3[k]).length + ' из 4'); }
    if (tgEl) tgEl.innerHTML = tg('Водород ≥ 20 мл', S.f3.full ? '✓' : fmt(S.vH, 1) + ' мл', S.f3.full) + tg('Проба H₂ и O₂', ((S.f3.h ? 'H₂ ' : '') + (S.f3.o ? 'O₂' : '')) || '?', S.f3.h && S.f3.o) +
      CUPIT.map(k => tg(RX[k].name, S.f3[k] ? RX[k].prod + ' ✓' : '?', S.f3[k])).join('');
  } else {
    if (S.mode4 === 'bell') {
      set('#r1', ['готов', 'горит', 'остывает', 'готово'][S.bp]); set('#r2', S.bp === 3 ? '1 деление' : S.bp ? '…' : '0');
      el.querySelectorAll('#ansB button').forEach(b => { const v = b.dataset.a.slice(4); b.className = S.f4.ans && v === '1/5' ? 'ok' : S.pick4 === v && v !== '1/5' ? 'bad' : ''; });
    } else {
      set('#r1', m.sum + ' / 100'); set('#r2', S.cnt.O2); set('#r3', S.cnt.N2);
      GAS4.forEach(g => set(`[data-c="${g}"]`, String(S.cnt[g])));
    }
    if (tgEl) tgEl.innerHTML = tg('Доля израсходованного воздуха', S.f4.ans ? '1/5 ✓' : '?', S.f4.ans) + tg('Модель из 100 молекул', S.f4.model ? 'верна ✓' : '?', S.f4.model);
  }
}

function partsList() {
  const id = LID();
  if (id === 'burn') return [
    { id: 'jars', icon: ICON.jars, name: 'Две банки', spec: 'В одной — воздух, в другой — чистый кислород. Снаружи их не различить: оба газа бесцветные.' },
    { id: 'spoon', icon: ICON.spoon, name: 'Ложечка для сжигания', spec: 'Держит горящее вещество внутри банки. Картонный кружок на горлышке не даёт газу быстро уйти.' },
    { id: 'tray', icon: ICON.tray, name: 'Вещества', spec: 'Тлеющая лучинка, уголь, сера, железная проволока и магниевая лента. Зелёная рамка — уже сожжено в кислороде.' },
    { id: 'flame', icon: ICON.flame, name: 'Пламя и свечение', spec: 'Чем больше кислорода, тем ярче горение. Цвет пламени у каждого вещества свой: у серы — синий, у магния — белый.' }];
  if (id === 'hydro') return [
    { id: 'gen', icon: ICON.gen, name: 'Прибор с цинком', spec: 'Из воронки на цинк течёт соляная кислота. Первые порции газа вытесняют воздух из прибора.' },
    { id: 'tube', icon: ICON.tube, name: 'Пробирка-приёмник', spec: 'Её держат отверстием вниз: водород легче воздуха и скапливается наверху. Подпись показывает долю H₂.' },
    { id: 'plamp', icon: ICON.plamp, name: 'Спиртовка для пробы', spec: 'К пламени подносят пробирку с газом. По звуку хлопка судят о чистоте водорода.' },
    { id: 'clamp', icon: ICON.clamp, name: 'Зажим', spec: 'Пускает водород к оксиду меди. Открывают только после чистой пробы.' },
    { id: 'cuo', icon: ICON.cuo, name: 'Трубка с CuO', spec: 'Чёрный оксид меди греют в токе водорода. Он краснеет — это медь, а на холодном конце оседает вода.' }];
  if (id === 'water') return [
    { id: 'hof', icon: ICON.hof, name: 'Электролизёр', spec: 'Две трубки со шкалой в мл и средняя трубка с запасом воды. Газы вытесняют воду вниз.', mode: 'el' },
    { id: 'power', icon: ICON.power, name: 'Источник тока', spec: 'Постоянный ток. На катоде (−) выделяется водород, на аноде (+) — кислород.', mode: 'el' },
    { id: 'cup', icon: ICON.cup, name: 'Стакан с лакмусом', spec: 'Лакмус — индикатор: в нейтральной воде фиолетовый, в щёлочи синий, в кислоте красный.', mode: 'cup' },
    { id: 'cards', icon: ICON.cards, name: 'Вещества', spec: 'Активный металл, оксид металла, оксид неметалла и малоактивный металл — по одному из каждой группы.', mode: 'cup' }];
  return [
    { id: 'bell', icon: ICON.bell, name: 'Колокол', spec: 'Стеклянный колпак без дна, объём воздуха под ним разделён на 5 равных частей.', mode: 'bell' },
    { id: 'trough', icon: ICON.trough, name: 'Сосуд с водой', spec: 'Вода запирает воздух под колоколом и показывает, сколько газа израсходовано.', mode: 'bell' },
    { id: 'grid', icon: ICON.grid, name: 'Сотня молекул', spec: 'Каждый кружок — молекула. Доля в процентах = число молекул из 100.', mode: 'model' },
    { id: 'bars', icon: ICON.bars, name: 'Ползунки газов', spec: 'Тяните, чтобы задать число молекул каждого газа. Всего — ровно 100.', mode: 'model' }];
}

function renderPanes(m, live) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    if (live) { const st = $('#pane-overview .taskbox .state'); if (st) { st.textContent = taskState(m); st.classList.toggle('done', done); } return; }
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts' && !live) {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}" data-mode="${p.mode || ''}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      const md = b.dataset.mode;
      if (md && LID() === 'water' && S.mode3 !== md) act('m3-' + md);
      if (md && LID() === 'air' && S.mode4 !== md) act('m4-' + md);
      S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'burn') {
    let h = `<h2>Что происходит в банке</h2>`;
    if (!S.spoon) h += `<p class="note">Внесите вещество в банку — здесь появятся наблюдение, уравнение и расчёт.</p>`;
    else {
      const it = S.spoon.it, F = FX[it];
      h += `<div class="formula">${F.eq}</div><div class="steps">` + stepH('Банка', S.spoon.jar === 'A' ? 'А' : 'Б') + stepH('Газ в банке', S.rev[S.spoon.jar] ? (m.gas === 'O2' ? 'кислород, 100 %' : 'воздух, O₂ 21 %') : '? — проверьте лучинкой') +
        stepH('Наблюдение', F[m.gas].txt) + (F.prod ? stepH('Продукт', `${F.prod} — ${F.pn}`, 'sum') : '') + `</div>`;
      if (F.calc) {
        const c = F.calc, n = c.m / c.M, nO = n * c.k;
        h += `<h3>Сколько кислорода нужно</h3><div class="steps">` + stepH(`m(${it})`, fmt(c.m, 1) + ' г') + stepH(`n(${it}) = m : M`, `${fmt(c.m, 1)} : ${c.M} = ${fmt(n, 2)} моль`) +
          stepH('n(O₂) по коэффициентам', `${fmt(n, 2)} · ${it === 'Fe' ? '2 : 3' : it === 'Mg' ? '1 : 2' : '1 : 1'} = ${fmt(nO, 2)} моль`) + stepH('V(O₂) = n · 22,4', `${fmt(nO * 22.4, 2)} л`, 'sum') +
          stepH('воздуха нужно ≈ V(O₂) : 0,21', `${fmt(nO * 22.4 / 0.21, 1)} л`) + `</div>`;
      }
    }
    h += `<h3>Почему в кислороде ярче</h3><div class="steps">` + stepH('O₂ в воздухе', '21 %') + stepH('O₂ в банке с кислородом', '100 %') + stepH('молекул O₂ больше в', '100 : 21 ≈ 4,8 раза', 'sum') + `</div>`;
    return h;
  }
  if (m.kind === 'hydro') {
    const verdict = S.fH < 0.08 ? 'хлопка не будет' : S.fH < 0.93 ? 'лающий хлопок — опасно' : 'глухой хлопок — чистый';
    return `<h2>Получение и проба</h2><div class="formula">Zn + 2HCl → ZnCl₂ + H₂↑</div><div class="steps">` +
      stepH('доля H₂ в газе из прибора', Math.round(m.g * 100) + ' %') + stepH('доля H₂ в пробирке', Math.round(S.fH * 100) + ' %') +
      stepH('пробирка', `${ZN[S.tube]}, ${S.up ? 'отверстием вверх' : 'отверстием вниз'}`) + stepH('если поднести к пламени', verdict, 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Смесь водорода с воздухом взрывается, если водорода в ней от 4 до 75 %. Чистым считаем газ, где воздуха почти нет.</p>` +
      `<h3>Восстановление меди</h3><div class="formula">CuO + H₂ → Cu + H₂O</div><div class="steps">` +
      stepH('прогресс', Math.round(S.cu * 100) + ' %') + stepH('пример: m(CuO)', '8 г') + stepH('n(CuO) = 8 : 80', '0,1 моль') +
      stepH('n(H₂) = n(Cu) = n(CuO)', '0,1 моль') + stepH('V(H₂) = 0,1 · 22,4', '2,24 л') + stepH('m(Cu) = 0,1 · 64', '6,4 г', 'sum') + `</div>` +
      `<h3>Сколько нужно цинка</h3><div class="steps">` + stepH('n(Zn) = n(H₂)', '0,1 моль') + stepH('m(Zn) = 0,1 · 65', '6,5 г', 'sum') + `</div>`;
  }
  if (m.kind === 'water') {
    if (S.mode3 === 'el') {
      const nH = S.vH / 22400;
      return `<h2>Электролиз воды</h2><div class="formula">2H₂O → 2H₂↑ + O₂↑</div><div class="steps">` +
        stepH('V(H₂) у катода', fmt(S.vH, 1) + ' мл') + stepH('V(O₂) у анода', fmt(S.vH / 2, 1) + ' мл') + stepH('отношение', S.vH > 0 ? `${fmt(S.vH, 1)} : ${fmt(S.vH / 2, 1)} = 2 : 1` : '—', 'sum') + `</div>` +
        `<h3>Вывод о формуле</h3><div class="steps">` + stepH('закон Авогадро', 'объём газа ∝ числу молекул') + stepH('H₂ : O₂ = 2 : 1', 'атомов H : O = 4 : 2 = 2 : 1') + stepH('формула воды', 'H₂O', 'sum') + `</div>` +
        `<h3>Сколько воды разложилось</h3><div class="steps">` + stepH('n(H₂) = V : 22 400 мл', fmt(nH * 1000, 3) + ' ммоль') + stepH('n(H₂O) = n(H₂)', fmt(nH * 1000, 3) + ' ммоль') + stepH('m(H₂O) = n · 18', fmt(nH * 18 * 1000, 1) + ' мг', 'sum') + `</div>`;
    }
    const it = S.cupIt;
    return `<h2>Вода реагирует?</h2>` + (it ? `<div class="formula">${RX[it].eq}</div><div class="steps">` + stepH('вещество', RX[it].name) + stepH('продукт', RX[it].prod) +
      stepH('лакмус', RX[it].col === LIT0 ? 'фиолетовый — среда нейтральная' : RX[it].col === '#e0455a' ? 'красный — кислота' : 'синий — щёлочь', 'sum') + `</div>` : `<p class="note">Бросьте вещество в стакан.</p>`) +
      `<h3>Правило</h3><div class="steps">` + stepH('активный металл + вода', 'щёлочь + H₂') + stepH('оксид активного металла + вода', 'основание (щёлочь)') + stepH('оксид неметалла + вода', 'кислота') + stepH('Cu, Ag, Au + вода', 'не реагируют') + `</div>`;
  }
  if (S.mode4 === 'bell') {
    const V = 1000;
    return `<h2>Опыт под колоколом</h2><div class="formula">4P + 5O₂ → 2P₂O₅</div><div class="steps">` +
      stepH('воздух под колоколом', `пусть ${V} мл = 5 частей`) + stepH('1 часть', `${V} : 5 = ${V / 5} мл`) +
      stepH('вода поднялась на', S.bp === 3 ? 'см. деления на колоколе' : S.bp ? 'ждём…' : 'опыт не начат') + stepH('израсходовано O₂', S.f4.ans ? `${V / 5} мл = 20 % ≈ 21 %` : '? — ответьте на вопрос', 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Школьный опыт точнее, чем «около 1/5», не измеряет: часть кислорода может остаться. Точные приборы дают 20,95 %.</p>`;
  }
  return `<h2>Модель и проценты</h2><div class="formula">доля, % = число молекул из 100</div><div class="steps">` +
    GAS4.map(g => stepH(`${low(g)} · ${G4[g].n}`, `${S.cnt[g]} из 100 = ${S.cnt[g]} %`)).join('') + stepH('всего', m.sum + ' из 100', 'sum') + `</div>` +
    `<h3>Вдыхаемый и выдыхаемый воздух</h3><div class="steps">` + stepH('O₂: вдох → выдох', '21 % → около 16 %') + stepH('CO₂: вдох → выдох', '0,04 % → около 4 %') + stepH('N₂', 'почти не меняется, 78 %') + `</div>` +
    `<p class="note" style="margin-top:10px">CO₂ в воздухе 0,04 % — это 4 молекулы на 10 000.</p>`;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'burn') {
    const it = S.spoon && S.spoon.it;
    el.innerHTML = `<div class="k">Банка ${S.jarSel === 'A' ? 'А' : 'Б'}</div><div class="v ${S.rev[S.jarSel] && S.oxJar === S.jarSel ? 'ok' : ''}">${S.rev[S.jarSel] ? (S.oxJar === S.jarSel ? 'кислород' : 'воздух') : 'газ ?'}</div><div class="lr"><span>внутри</span><span>${it ? IT1[it].short : '—'}</span></div><div class="lr"><span>в O₂ сожжено</span><span>${['C', 'S', 'Fe'].filter(k => S.f1[k]).length} из 3</span></div>`;
  } else if (m.kind === 'hydro') {
    el.innerHTML = `<div class="k">Пробирка</div><div class="v ${S.fH > 0.93 ? 'ok' : ''}">H₂ ${Math.round(S.fH * 100)} %</div><div class="gauge"><b style="width:${(S.fH * 100).toFixed(1)}%"></b><i style="left:93%"></i></div><div class="lr"><span>из прибора</span><span>${Math.round(m.g * 100)} %</span></div><div class="lr"><span>проба</span><span>${S.f2.pure ? 'чистый' : S.last2 || '—'}</span></div>`;
  } else if (m.kind === 'water') {
    if (S.mode3 === 'el') el.innerHTML = `<div class="k">Электролиз</div><div class="v ${S.f3.full ? 'ok' : ''}">H₂ ${fmt(S.vH, 1)} мл</div><div class="lr"><span>O₂</span><span>${fmt(S.vH / 2, 1)} мл</span></div><div class="lr"><span>ток</span><span>${S.on ? fmt(S.I, 1) + ' А' : 'выкл'}</span></div><div class="gauge"><b style="width:${(S.vH / HOF.max * 100).toFixed(1)}%"></b><i style="left:50%"></i></div>`;
    else { const c = S.cupIt ? RX[S.cupIt].col : LIT0; el.innerHTML = `<div class="k">Лакмус</div><div class="v">${c === LIT0 ? 'фиолет.' : c === '#e0455a' ? 'красный' : 'синий'}</div><div class="swatch" style="background:${c}"></div><div class="lr"><span>испытано</span><span>${CUPIT.filter(k => S.f3[k]).length} из 4</span></div>`; }
  } else {
    if (S.mode4 === 'bell') el.innerHTML = `<div class="k">Колокол</div><div class="v ${S.f4.ans ? 'ok' : ''}">${['готов', 'горит', 'остывает', S.f4.ans ? 'O₂ ≈ 1/5' : 'вопрос'][S.bp]}</div><div class="lr"><span>подъём</span><span>${fmt(S.rise / PART, 2)} дел.</span></div>`;
    else el.innerHTML = `<div class="k">Модель</div><div class="v ${S.f4.model ? 'ok' : ''}">${m.sum} / 100</div>${GAS4.map(g => `<div class="lr"><span>${low(g)}</span><span>${S.cnt[g]}</span></div>`).join('')}`;
  }
}

function update(live) {
  let m = model();
  const L = LESSONS[S.lesson];
  if (!live) {
    if (m.kind === 'air' && m.match && !S.f4.model) { S.f4.model = true; toast('Модель верна: 78 N₂, 21 O₂ и 1 Ar. CO₂ в сотню не попал — его 4 на 10 000.'); }
    m = model();
    if (!S.done[L.id] && L.check(m)) {
      S.done[L.id] = true; save(); renderStrip();
      setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Кислород, водород и вода освоены!'), 1600);
    }
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m, live);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  burn: '<path d="M8 10v17h16V10M30 10v17h16V10" fill="rgba(95,180,217,.12)" stroke="#8fb9d6"/><path d="M38 24C33 21 35 16 38 10C41 16 43 21 38 24Z" fill="#6a5cff"/><circle cx="16" cy="22" r="2.5" fill="#ff6a3d"/><circle cx="58" cy="15" r="3" fill="#e6c63a"/>',
  hydro: '<path d="M8 12v12a4 4 0 0 0 8 0V12" fill="rgba(186,230,140,.2)" stroke="#8fb9d6"/><path d="M12 10V6H30V10" fill="none" stroke="#8fb9d6"/><path d="M26 26V12a4 4 0 0 1 8 0v14" fill="rgba(238,242,248,.25)" stroke="#c8d1e2"/><rect x="42" y="14" width="20" height="7" rx="3.5" fill="none" stroke="#8fb9d6"/><rect x="47" y="17" width="10" height="2.5" fill="#c06a3a"/>',
  water: '<path d="M10 4v22h16V4M18 2v24" fill="none" stroke="#8fb9d6"/><rect x="10" y="4" width="5" height="12" fill="rgba(238,242,248,.4)"/><rect x="21" y="4" width="5" height="6" fill="rgba(229,83,63,.4)"/><path d="M38 8v17a2 2 0 0 0 2 2h16a2 2 0 0 0 2 -2V8" fill="none" stroke="#8fb9d6"/><rect x="39" y="14" width="18" height="12" fill="#3f6fe0" fill-opacity=".5"/>',
  air: '<path d="M8 26V11q0 -5 5 -5h8q5 0 5 5v15" fill="none" stroke="#c8d1e2"/><rect x="9" y="20" width="16" height="6" fill="rgba(95,180,217,.4)"/><path d="M34 9h26M34 16h26M34 23h26" stroke="#26324a" stroke-width="3" stroke-linecap="round"/><path d="M34 9h20" stroke="#4d7cf0" stroke-width="3" stroke-linecap="round"/><path d="M34 16h6" stroke="#e5533f" stroke-width="3" stroke-linecap="round"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetState();
  Object.assign(S, JSON.parse(JSON.stringify(L.init || {})));
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let scr = '';
  if (id === 'burn') {
    const jn = j => (j === 'A' ? 'А' : 'Б');
    scr = `Две банки, А и Б: в одной воздух, в другой чистый кислород. Уже проверено лучинкой: ${['A', 'B'].filter(j => S.rev[j]).map(j => `банка ${jn(j)} — ${S.oxJar === j ? 'кислород' : 'воздух'}`).join(', ') || 'ничего'}. ` +
      (S.spoon ? `Сейчас в банке ${jn(S.spoon.jar)} — ${IT1[S.spoon.it].name}; видно: ${FX[S.spoon.it][m.gas].txt} ` : 'Сейчас в банках ничего нет. ') +
      `Цели: лучинка в кислороде — ${S.f1.splint ? 'да' : 'нет'}; в кислороде сожжены: ${['C', 'S', 'Fe'].map(k => `${k} — ${S.f1[k] ? 'да' : 'нет'}`).join(', ')}. Если банки ещё не проверены, не говори, в какой из них кислород, — спроси, как его распознать.`;
  }
  if (id === 'hydro') scr = `Прибор: цинк и соляная кислота (кислота ${S.acid ? 'течёт' : 'перекрыта'}), доля водорода в газе из прибора ${Math.round(m.g * 100)} %. Пробирка-приёмник ${ZN[S.tube]}, ${S.up ? 'отверстием вверх' : 'отверстием вниз'}, водорода в ней ${Math.round(S.fH * 100)} %. Последняя проба: ${S.last2 || 'не было'}. Зажим к трубке с CuO ${S.clamp ? 'открыт' : 'закрыт'}, нагрев ${S.heat ? 'включён' : 'выключен'}, CuO превратился в медь на ${Math.round(S.cu * 100)} %. Цели: чистая проба — ${S.f2.pure ? 'да' : 'нет'}, медь получена — ${S.f2.cu ? 'да' : 'нет'}. Подводи вопросами: почему первые порции газа с воздухом, как держать пробирку и почему нельзя греть CuO до пробы.`;
  if (id === 'water') {
    scr = S.mode3 === 'el' ? `Режим «Электролиз»: ток ${S.on ? 'включён' : 'выключен'}, ${fmt(S.I, 1)} А (опыт ускорен в 10 раз). Над катодом ${fmt(S.vH, 1)} мл газа, над анодом ${fmt(S.vH / 2, 1)} мл. Проверено лучинкой: ${[S.f3.h ? 'водород' : '', S.f3.o ? 'кислород' : ''].filter(Boolean).join(', ') || 'ничего'}.` :
      `Режим «Стакан»: вода с лакмусом. ${S.cupIt ? `Брошено: ${RX[S.cupIt].name}. ${RX[S.cupIt].txt}` : 'Пока ничего не брошено.'} Испытано: ${CUPIT.filter(k => S.f3[k]).map(k => RX[k].name).join(', ') || 'ничего'}.`;
    scr += ` Цели: не меньше 20 мл H₂ — ${S.f3.full ? 'да' : 'нет'}, пробы обоих газов — ${S.f3.h && S.f3.o ? 'да' : 'нет'}, испытаны 4 вещества — ${CUPIT.every(k => S.f3[k]) ? 'да' : 'нет'}.`;
  }
  if (id === 'air') scr = S.mode4 === 'bell' ? `Режим «Колокол»: колокол над водой, воздух под ним разделён на 5 равных частей, внутри фосфор. Стадия: ${['фосфор не подожжён', 'фосфор горит', 'колокол остывает, вода поднимается', 'опыт закончен'][S.bp]}. ${S.bp === 3 ? (S.f4.ans ? 'Ученик верно ответил, какая часть воздуха израсходована.' : `Ученик ещё не ответил верно${S.pick4 ? ' (последний ответ ' + S.pick4 + ' — неверный)' : ''}; не называй ответ, спроси, на сколько делений поднялась вода.`) : ''}` :
    `Режим «Модель»: 100 молекул воздуха — N₂ ${S.cnt.N2}, O₂ ${S.cnt.O2}, Ar ${S.cnt.Ar}, CO₂ ${S.cnt.CO2}, всего ${m.sum}. Модель ${S.f4.model ? 'собрана верно' : 'пока не совпадает с составом сухого воздуха'}. Не называй числа — спроси, как проценты переводятся в число молекул из 100.`;
  return [
    `Предмет: химия, 8 класс. Тема «Кислород, водород, вода». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${scr}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { burn: 'Почему в чистом кислороде всё горит ярче?', hydro: 'Почему смесь водорода с воздухом опасна?', water: 'Почему водорода при электролизе вдвое больше?', air: 'Почему вода поднялась только на одну пятую?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
