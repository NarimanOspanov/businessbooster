<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ответ — кабинет клиники</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --soft:#f4f5f7; --border:#e6e7eb; --text:#1f2028; --muted:#6c7180;
    --accent:#f14635; --green:#1f9d55; --amber:#b8860b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Roboto,"Segoe UI",system-ui,sans-serif; color:var(--text); background:var(--soft); line-height:1.55; }
  a { color:inherit; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
  header { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  nav { display:flex; align-items:center; justify-content:space-between; height:62px; gap:16px; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:900; font-size:17px; }
  .mark { width:29px; height:29px; border-radius:8px; background:linear-gradient(135deg,#f14635,#e23c2b); display:grid; place-items:center; color:#fff; font-size:14px; }
  .who { font-size:13.5px; color:var(--muted); text-align:right; }
  .btn { padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:#fff; font:inherit; font-size:14px; cursor:pointer; }
  .btn:hover { border-color:#c9ccd4; }
  .btn-primary { background:linear-gradient(135deg,#f14635,#e23c2b); color:#fff; border:none; font-weight:600; }
  main { padding:26px 0 60px; }
  .gate { max-width:420px; margin:70px auto; background:#fff; border:1px solid var(--border); border-radius:16px; padding:30px; text-align:center; }
  .gate h1 { font-size:21px; margin-bottom:8px; }
  .gate p { color:var(--muted); font-size:14.5px; margin-bottom:20px; }
  .clinics { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip { background:#fff; border:1px solid var(--border); border-radius:999px; padding:7px 14px; font-size:13.5px; }
  .chip b { font-weight:700; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:#fff; border:1px solid var(--border); border-radius:13px; padding:16px 18px; }
  .stat .n { font-size:26px; font-weight:900; letter-spacing:-.02em; }
  .stat .l { font-size:13px; color:var(--muted); }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--soft); }
  .tag { display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .t-book { background:rgba(31,157,85,.12); color:var(--green); }
  .t-urg { background:rgba(241,70,53,.12); color:var(--accent); }
  .t-none { background:var(--soft); color:var(--muted); }
  .muted { color:var(--muted); }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); }
  dialog { border:none; border-radius:16px; padding:0; max-width:620px; width:calc(100% - 32px); box-shadow:0 20px 60px rgba(31,32,40,.25); }
  dialog::backdrop { background:rgba(31,32,40,.45); }
  .dlg-head { padding:20px 22px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .dlg-body { padding:18px 22px 24px; max-height:60vh; overflow:auto; }
  .fields { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; margin-bottom:16px; }
  .fields dt { color:var(--muted); }
  .turn { margin-bottom:11px; font-size:14px; }
  .turn .r { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .turn.agent .r { color:var(--accent); }
  audio { width:100%; margin-bottom:16px; }
  @media (max-width:720px) { .hide-sm { display:none; } }
</style>
</head>
<body>

<header><div class="wrap"><nav>
  <a class="logo" href="/"><span class="mark">О</span>Ответ</a>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="who" id="who"></div>
    <button class="btn" id="out" hidden>Выйти</button>
  </div>
</nav></div></header>

<main class="wrap">
  <div class="gate" id="gate">
    <h1>Кабинет клиники</h1>
    <p id="gate-text">Войдите, чтобы увидеть звонки, которые приняли за вас.</p>
    <button class="btn btn-primary" id="in">Войти</button>
  </div>

  <div id="app" hidden>
    <div class="clinics" id="clinics"></div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <table>
        <thead><tr>
          <th>Когда</th><th>Клиент</th><th>Телефон</th>
          <th class="hide-sm">Услуга</th><th class="hide-sm">Когда хочет</th><th>Итог</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Звонков пока нет.</div>
    </div>
  </div>
</main>

<dialog id="dlg">
  <div class="dlg-head">
    <div><div style="font-weight:800;font-size:17px" id="d-title"></div>
    <div class="muted" style="font-size:13px" id="d-sub"></div></div>
    <button class="btn" onclick="document.getElementById('dlg').close()">Закрыть</button>
  </div>
  <div class="dlg-body">
    <audio id="d-audio" controls preload="none"></audio>
    <dl class="fields" id="d-fields"></dl>
    <div id="d-summary" class="muted" style="font-size:14px;margin-bottom:16px"></div>
    <div id="d-transcript"></div>
  </div>
</dialog>

<script>
  var clerk = null;

  function fmtDate(s) {
    // Время в базе в UTC, клиника живёт по Алматы.
    var d = new Date(s.endsWith("Z") ? s : s + "Z");
    return new Date(d.getTime() + 5 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
  }

  async function api(path) {
    var t = await clerk.session.getToken();
    var r = await fetch(path, { headers: { Authorization: "Bearer " + t } });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  function tag(c) {
    if (c.is_urgent) return '<span class="tag t-urg">срочно</span>';
    if (c.is_booked) return '<span class="tag t-book">записан</span>';
    var nothing = !c.client_name && !c.service && !c.desired_time && !c.summary;
    return '<span class="tag t-none">' + (nothing ? "только номер" : "без записи") + "</span>";
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>]/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m];
    });
  }

  async function load() {
    var me = await api("/api/cabinet/me");
    document.getElementById("who").textContent = me.email || me.name || "";
    document.getElementById("clinics").innerHTML = (me.clinics || []).length
      ? me.clinics.map(function (c) {
          return '<span class="chip"><b>' + esc(c.name) + "</b>" +
                 (c.number ? " · " + esc(c.number) : "") + "</span>";
        }).join("")
      : '<span class="chip">Клиника ещё не привязана к вашей организации</span>';

    var d = await api("/api/cabinet/calls?limit=100");
    var calls = d.calls || [];

    var booked = calls.filter(function (c) { return c.is_booked; }).length;
    var urgent = calls.filter(function (c) { return c.is_urgent; }).length;
    var mins = Math.round(calls.reduce(function (a, c) { return a + (c.duration_secs || 0); }, 0) / 60);
    document.getElementById("stats").innerHTML =
      '<div class="stat"><div class="n">' + calls.length + '</div><div class="l">звонков принято</div></div>' +
      '<div class="stat"><div class="n" style="color:var(--green)">' + booked + '</div><div class="l">записались</div></div>' +
      '<div class="stat"><div class="n" style="color:var(--accent)">' + urgent + '</div><div class="l">срочных</div></div>' +
      '<div class="stat"><div class="n">' + mins + '</div><div class="l">минут разговоров</div></div>';

    document.getElementById("empty").hidden = calls.length > 0;
    document.getElementById("rows").innerHTML = calls.map(function (c) {
      return '<tr data-id="' + esc(c.conversation_id) + '">' +
        "<td>" + fmtDate(c.received_at) + '<div class="muted" style="font-size:12px">' + (c.duration_secs || 0) + " с</div></td>" +
        "<td>" + (esc(c.client_name) || '<span class="muted">—</span>') + "</td>" +
        "<td>" + (esc(c.client_phone) || esc(c.caller_number) || '<span class="muted">—</span>') + "</td>" +
        '<td class="hide-sm">' + (esc(c.service) || '<span class="muted">—</span>') + "</td>" +
        '<td class="hide-sm">' + (esc(c.desired_time) || '<span class="muted">—</span>') + "</td>" +
        "<td>" + tag(c) + "</td></tr>";
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("#rows tr"), function (tr) {
      tr.addEventListener("click", function () { openCall(tr.getAttribute("data-id")); });
    });
  }

  async function openCall(id) {
    var d = await api("/api/cabinet/call?id=" + encodeURIComponent(id));
    var c = d.call;
    document.getElementById("d-title").textContent = c.client_name || "Звонок без имени";
    document.getElementById("d-sub").textContent =
      fmtDate(c.received_at) + " · " + (c.duration_secs || 0) + " с · " +
      (c.direction === "outbound" ? "исходящий" : "входящий");

    var a = document.getElementById("d-audio");
    a.src = "/api/cabinet/audio?id=" + encodeURIComponent(id);

    var f = [
      ["Телефон", c.client_phone || c.caller_number],
      ["Услуга", c.service], ["Когда хочет", c.desired_time],
      ["Записался", c.is_booked ? "да" : "нет"],
      ["Срочно", c.is_urgent ? "да" : "нет"],
    ];
    document.getElementById("d-fields").innerHTML = f.map(function (x) {
      return "<dt>" + x[0] + "</dt><dd>" + (esc(x[1]) || "—") + "</dd>";
    }).join("");
    document.getElementById("d-summary").textContent = c.summary || "";

    var turns = [];
    try { turns = JSON.parse(c.transcript || "[]"); } catch (e) {}
    document.getElementById("d-transcript").innerHTML = turns
      .filter(function (t) { return String(t.message || "").trim(); })
      .map(function (t) {
        return '<div class="turn ' + (t.role === "agent" ? "agent" : "") + '">' +
          '<div class="r">' + (t.role === "agent" ? "ассистент" : "клиент") + "</div>" +
          esc(t.message) + "</div>";
      }).join("") || '<div class="muted">Расшифровки нет.</div>';

    document.getElementById("dlg").showModal();
  }

  // Бандл Clerk забирает ключ из data-атрибута своего же тега и создаёт
  // window.Clerk сам. Хост берём из ключа: так версия скрипта всегда совпадает
  // с инстансом.
  function loadClerk(pk) {
    var host;
    try {
      host = atob(pk.replace(/^pk_(test|live)_/, "")).split("$")[0];
    } catch (e) {
      return Promise.reject(new Error("bad_key"));
    }
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.async = true;
      s.crossOrigin = "anonymous";
      s.setAttribute("data-clerk-publishable-key", pk);
      s.src = "https://" + host + "/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
      s.onerror = function () { reject(new Error("script_failed")); };
      s.onload = function () {
        if (!window.Clerk) return reject(new Error("no_clerk"));
        window.Clerk.load().then(function () { resolve(window.Clerk); }, reject);
      };
      document.head.appendChild(s);
    });
  }

  function showGate(text) {
    document.getElementById("gate").hidden = false;
    document.getElementById("app").hidden = true;
    if (text) document.getElementById("gate-text").textContent = text;
  }

  (async function () {
    var cfg = await fetch("/api/config").then(function (r) { return r.json(); }).catch(function () { return {}; });
    if (!cfg.clerkPublishableKey) {
      showGate("Вход пока не настроен: на сервере нет ключей Clerk.");
      document.getElementById("in").hidden = true;
      return;
    }
    try {
      clerk = await loadClerk(cfg.clerkPublishableKey);
    } catch (e) {
      showGate("Не удалось загрузить форму входа. Обновите страницу.");
      document.getElementById("in").hidden = true;
      return;
    }

    document.getElementById("in").addEventListener("click", function () {
      clerk.openSignIn({ afterSignInUrl: "/cabinet/", afterSignUpUrl: "/cabinet/" });
    });
    document.getElementById("out").addEventListener("click", function () {
      clerk.signOut().then(function () { location.reload(); });
    });

    if (!clerk.user) { showGate(); return; }
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("out").hidden = false;
    load().catch(function (e) {
      showGate("Не удалось загрузить звонки: " + e.message);
    });
  })();
</script>
</body>
</html>
