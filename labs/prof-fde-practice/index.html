<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Практикум Forward Deployed Engineer: первые недели у клиента. Интервью с клиентом, карта данных, метрики успеха, порог уверенности модели, правило или модель, маленький пилот и сборка системы — на одном сквозном примере колл-центра сети клиник.">
<title>Практикум FDE: первые недели у клиента</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /labs/prof-fde (stage on the left, lesson notebook on the right, lesson strip under the stage). */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --vio:#a99cff;
  --ink:#04070d;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.sections .sm{display:none}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,185,230,.04) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(160,185,230,.04) 1.5px,transparent 1.5px);background-size:40px 40px;pointer-events:none}

.task{position:absolute;top:14px;left:14px;width:300px;max-width:min(300px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .3s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;min-height:36px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;font-size:12px;line-height:1.45;color:var(--muted);pointer-events:none;z-index:2}

/* ---------- the screen ---------- */
.screen{position:absolute;left:14px;right:14px;top:120px;bottom:60px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;z-index:1;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.bh{font:600 10.5px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bh em{font-style:normal;color:var(--force);letter-spacing:.06em}
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--font-body)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}
.small{font-size:12.5px;color:var(--muted);margin:0}
.src{font:400 11px/1.4 var(--font-body);color:var(--muted);margin:8px 0 0}

/* cards, zones, drag */
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool:empty::after{content:"Все карточки разложены.";font-size:12.5px;color:var(--muted)}
.tcard{display:flex;align-items:center;gap:8px;min-height:42px;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:8px 11px;font:500 13px/1.3 var(--font-body);color:var(--fg);text-align:left;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:1 1 200px;max-width:100%}
.tcard::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--arm);flex:none}
.tcard:hover{border-color:var(--muted)}
.tcard.sel{border-color:var(--force);background:#2a3a56;box-shadow:0 0 0 2px rgba(255,181,71,.25)}
.tcard.sel::before{background:var(--force)}
.tcard.lift{opacity:.35}
.tcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.dghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;opacity:.95;transform:rotate(-1.5deg);box-shadow:0 14px 30px -8px rgba(0,0,0,.7);margin:0}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zone{min-height:110px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:rgba(20,29,46,.6);transition:border-color .2s,background .2s}
.zone.armed{border-color:var(--arm)}
.zone.over{border-color:var(--force);background:rgba(255,181,71,.08)}
.zone.bad{border-color:var(--warn);background:rgba(255,138,115,.1)}
.zone .zh{font:600 11px/1.25 var(--font-body);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.zone .zh small{display:block;font:400 11px/1.3 var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.placed{font-size:12px;line-height:1.3;padding:6px 8px;background:#1f3a2f;border:1px solid var(--ok);border-radius:8px;animation:pop .35s ease-out}
.placed.minus{background:#3a2220;border-color:var(--warn)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;font:600 13.5px/1.2 var(--font-body);cursor:pointer}
.btn.gh{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;background:none;border:0;border-radius:7px;min-height:38px;padding:7px 10px;font:600 12.5px/1.1 var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.opt{display:block;width:100%;text-align:left;min-height:44px;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:10px 12px;font:500 13.5px/1.35 var(--font-body);color:var(--fg);cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt.ok{border-color:var(--ok);background:#1f3a2f}
.opt.no{border-color:var(--warn);background:#3a2220}
.opts{display:flex;flex-direction:column;gap:6px}
.fb{font-size:13px;line-height:1.45;margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.fb.ok{border-color:rgba(134,224,168,.5)}
.fb.no{border-color:rgba(255,138,115,.5)}
.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:80vh;min-height:620px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  /* phone: no overlay — task, meter, screen and tools simply stack, the page scrolls */
  .stage{height:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
  .task,.meter,.tools,.screen{position:static!important;transform:none;max-width:none}
  .task{width:auto;padding:9px 11px}
  .task p{font-size:13px}
  .meter{width:auto;padding:8px 10px}
  .screen{overflow:visible}
  .tools{align-self:center;max-width:100%}
  .tools button{padding:6px 8px;font-size:12px}
  .hint{display:none}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .sections .lg{display:none}.sections .sm{display:inline}
  .crow,.ticks{grid-template-columns:minmax(0,1fr)}
  .ticks>span{display:none}
  .selfgrid{grid-template-columns:minmax(0,1fr)}
  .selfgrid svg{max-width:220px;margin:0 auto}
  .mt{grid-template-columns:96px minmax(0,1fr) 32px}
  .tcard{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- practicum ---------- */
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--force);min-height:28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px}
.rd{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 8px;min-width:0}
.rd dt{font:600 9.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rd dd{margin:5px 0 0;font:500 15px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rd dd.ok{color:var(--ok)}.rd dd.bad{color:var(--warn)}
/* 1: interview */
.chat{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto;scrollbar-width:thin;padding-right:2px}
.msg{max-width:88%;padding:7px 10px;border-radius:11px;font-size:13px;line-height:1.4;animation:pop .3s ease-out}
.msg.me{align-self:flex-end;background:#22314d;border-bottom-right-radius:3px}
.msg.cl{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.msg.cl.bad{border:1px solid rgba(255,138,115,.6)}
.msg small{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msg .why{display:block;margin-top:5px;font-size:12px;color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fld{background:var(--bg);border:1.5px dashed var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.35;color:#56627d;min-height:52px}
.fld b{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fld.on{border-style:solid;border-color:rgba(134,224,168,.55);color:var(--fg);animation:pop .4s ease-out}
.fld.on b{color:var(--ok)}
.qdots{display:flex;gap:5px;align-items:center}
.qdots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.qdots i.g{background:var(--ok);border-color:var(--ok)}.qdots i.b{background:var(--warn);border-color:var(--warn)}
/* 2: data map */
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.srcs .zone{min-height:96px}
.zone .ic{width:26px;height:26px;flex:none}
.zone.gold{border-style:solid;border-color:var(--force);background:rgba(255,181,71,.07)}
.tagd{font-size:12px;line-height:1.3;padding:5px 8px;background:#2a2342;border:1px solid var(--vio);border-radius:8px;animation:pop .35s ease-out}
.pick6{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
/* 3: metrics */
.mpool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mc{min-height:46px;text-align:left;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:8px 10px;font:500 13px/1.3 var(--font-body);cursor:pointer}
.mc:hover{border-color:var(--muted)}
.mc.in{border-color:var(--ok);background:#1f3a2f}
.mc.red.in{border-color:var(--warn);background:#3a2220}
.mc.shake{animation:shake .45s}
.mc:disabled{opacity:.35;cursor:default}
.dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dsl{border:1.5px dashed var(--line);border-radius:10px;padding:7px 8px;min-height:64px;font-size:12px;line-height:1.3;color:#56627d}
.dsl b{display:block;font:600 9.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dsl.on{border-style:solid;border-color:rgba(134,224,168,.55);color:var(--fg)}
.dsl.rl.on{border-color:rgba(255,138,115,.7)}
.calc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.calc input{flex:1 1 120px;min-width:0;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--fg);font:500 15px var(--font-mono)}
.eq{font:500 14px/1.4 var(--font-mono);color:var(--fg)}
.ops{display:flex;gap:4px;flex-wrap:wrap}
.ops svg{width:26px;height:34px}
.ctl2{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:10px;align-items:end}
.ctl2 label{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl2 output{font:500 13px var(--font-mono);color:var(--fg)}
.money{display:flex;align-items:center;gap:6px;font:500 13px var(--font-mono)}
.money input{width:80px;min-height:40px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;color:var(--fg);font:500 14px var(--font-mono)}
/* 4: threshold */
.sliders{display:grid;gap:4px}
.qs{display:grid;grid-template-columns:96px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:12.5px}
.qs input{margin:0}
.qs output{font:500 12px var(--font-mono);text-align:right;color:var(--fg)}
.qs output.hum{color:var(--force)}
.dot{transition:opacity .25s}
/* 5: lanes */
.lanes3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lanes3 .zone{min-height:120px}
/* 6: pilot */
.pcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:9px 10px;cursor:pointer;min-height:44px}
.pc:hover{border-color:var(--muted)}
.pc.in{border-color:var(--ok);background:#1f3a2f}
.pc b{font:600 13px/1.3 var(--font-body)}
.pc small{font-size:11.5px;color:var(--muted);line-height:1.3}
.vre{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 6px;align-items:center;font:500 10.5px/1 var(--font-mono);color:var(--muted)}
.sq{display:flex;gap:2px}.sq i{width:12px;height:7px;border-radius:2px;background:var(--line)}
.sq.v i.f{background:var(--ok)}.sq.r i.f{background:var(--warn)}.sq.e i.f{background:var(--arm)}
.pm{display:grid;gap:7px}
.pmr{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12.5px}
.pmr .tr{position:relative;height:10px;border-radius:5px;background:var(--line)}
.pmr .tr b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .5s cubic-bezier(.3,1.3,.5,1),background .3s}
.pmr .tr i{position:absolute;top:-3px;width:2px;height:16px;background:var(--fg)}
.pmr span{font:500 12px var(--font-mono);text-align:right}
.doc{background:#f3efe6;color:#1d1a14;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.4}
.doc h4{margin:0 0 8px;font:700 13px/1.2 var(--font-display);letter-spacing:.04em}
.dsec{border-top:1px solid #d8d0bf;padding:7px 0}
.dsec>b{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#7a705c;margin-bottom:5px}
.dsec .fillt{color:#1b5e3b;font-weight:500}
.dopts{display:flex;flex-direction:column;gap:4px}
.dopts button{text-align:left;min-height:40px;background:#fff;border:1px solid #d8d0bf;border-radius:8px;padding:7px 9px;font:500 12.5px/1.3 var(--font-body);color:#1d1a14;cursor:pointer}
.dopts button:hover{border-color:#7a705c}
.dopts button.no{border-color:#c8553d;background:#fbe9e4}
/* 7: system */
.pipe{display:flex;flex-direction:column;gap:6px}
.ps{position:relative;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px 8px 34px;min-height:44px;font-size:13px;color:var(--muted)}
.ps::before{content:attr(data-n);position:absolute;left:9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 10.5px/1 var(--font-mono);background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.ps.next{border-color:var(--arm);color:var(--fg);cursor:pointer}
.ps.over{border-color:var(--force);background:rgba(255,181,71,.08)}
.ps.fill{border-style:solid;border-color:#3a4762;background:var(--surface-2);color:var(--fg);animation:pop .35s ease-out}
.ps.fill::before{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.ps.fill+.ps.fill::after{content:"";position:absolute;left:17px;top:-8px;width:2px;height:8px;background:var(--ok)}
.prob{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.prob p{margin:0 0 7px;font-size:13px;line-height:1.4}
.prob .lbl{font:600 10px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 5px}
.pats{display:flex;flex-wrap:wrap;gap:5px}
.pats button{min-height:38px;background:var(--surface-2);border:1px solid #3a4762;border-radius:8px;padding:6px 9px;font:500 12px/1.2 var(--font-body);cursor:pointer}
.pats button.ok{border-color:var(--ok);background:#1f3a2f}
.pats button.no{border-color:var(--warn);background:#3a2220}
.rub{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.rub li{display:flex;gap:8px;font-size:13px;line-height:1.4}
.rub li b{color:var(--ok);font-family:var(--font-mono)}
.ctas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;background:var(--force);color:#1a1300;border-radius:12px;padding:12px 14px;text-decoration:none;font:600 14px/1.3 var(--font-body)}
.cta.gh{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.cta:hover{filter:brightness(1.07)}
@media (max-width:600px){
  .fields,.srcs,.pick6,.mpool,.pcs,.ctas{grid-template-columns:minmax(0,1fr)}
  .dash{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lanes3{grid-template-columns:minmax(0,1fr)}
  .lanes3 .zone{min-height:80px}
  .ctl2{grid-template-columns:minmax(0,1fr)}
  .qs{grid-template-columns:78px minmax(0,1fr) 66px;gap:6px;font-size:12px}
  .pmr{grid-template-columns:84px minmax(0,1fr) 62px}
  .rds{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Профессии" style="cursor:pointer" onclick="location.href='/prof/'" onkeydown="if(event.key==='Enter')location.href='/prof/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Профессии · FDE · Уровень 1</small></div>

      <div class="prog" aria-label="Прогресс"><b>Практикум</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/7</span></div>

  <section class="stage" id="stage" aria-label="Экран лаборатории: практикум FDE на примере колл-центра сети клиник">

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const big = n => Math.round(n).toLocaleString('ru-RU');
const fmt = (x, n = 1) => (Math.round(x * 10 ** n) / 10 ** n).toFixed(n).replace('.', ',');
const pct = (x, n = 0) => fmt(x * 100, n) + ' %';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// stable shuffle: the same order every time for the same salt
const mix = (arr, salt) => { const r = mulberry(salt * 977 + 13), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const LESSONS = [
  { id: 'talk', title: 'Первые 10 минут у клиента',
    text: ['Сеть клиник «Медика». Колл-центр получает около 900 обращений в день, операторы вручную раскладывают их по шести очередям. Клиника купила ИИ-модель, демо ошибалось в каждом пятом обращении, проект встал. Тебя прислали на 6 недель.',
           'Первый разговор — с руководителем колл-центра. Не спрашивай про модель. Узнай, кто принимает решение, как это делают сейчас и как поймём успех.'],
    why: 'Хорошие вопросы в первые минуты экономят недели работы. Плохие — сразу показывают клиенту, что ты пришёл продавать, а не разбираться.',
    task: 'Заполни все 7 полей карточки задачи, задав не больше 8 вопросов.',
    hint: 'Хороший вопрос — про людей, решение, процесс, данные и цифры. Плохой — про модель, бюджет или с готовым ответом внутри.',
    stage: 'Ответы клиента сами попадают в карточку задачи. Точки — твои 8 вопросов.',
    check: m => m.filled === 7 && m.asked <= 8 },
  { id: 'data', title: 'Карта данных клиента',
    text: ['Модель учится и проверяется на данных клиента. Прежде чем строить, обойди все источники и запиши, что с каждым не так.',
           'Отдельно найди источник «правильных ответов» — где люди уже приняли решение по прошлым обращениям. По нему ты будешь проверять модель.'],
    why: 'Почти каждый проект с ИИ спотыкается о данные: пустые поля, нет доступа, нет выгрузки. Узнать это в первую неделю — дешевле, чем на пятой.',
    task: 'Разложи 6 проблем по источникам данных и выбери, где взять известные правильные ответы для проверки модели.',
    hint: 'Тяни ярлык на источник или нажми ярлык, потом источник. Подумай, где живёт эта проблема.',
    stage: 'Линия на карте загорается, когда у источника найдена его проблема.',
    check: m => m.placed === m.total && m.goldOk },
  { id: 'metric', title: 'Как поймём, что получилось',
    text: ['Договорись о цифрах до того, как строить. Иначе через 6 недель каждый будет считать успех по-своему.',
           'Нужны метрики пользы и одна красная линия, которую нельзя пересекать. И базовая цифра «как сейчас» — без неё не с чем сравнивать.'],
    why: 'Клиент платит за сэкономленные часы и быстрые ответы пациентам, а не за точность на демо или число встреч.',
    task: 'Собери панель пилота: 3 метрики пользы + 1 красная линия. Потом посчитай, сколько часов в день операторы тратят сейчас.',
    hint: 'Метрика пользы — то, что заметит пациент или директор. Тщеславная метрика — то, что приятно показать, но ничего не говорит о результате.',
    stage: 'Под панелью — калькулятор: двигай долю автоматики и ставку оператора.',
    check: m => m.metricsOk && m.calcOk },
  { id: 'thresh', title: 'Порог уверенности',
    text: ['Модель к каждому ответу добавляет уверенность (confidence) — число от 0 до 1. Выше порога — обращение уходит в очередь само. Ниже — его разбирает оператор.',
           'Перед тобой 200 прошлых обращений, где правильный ответ известен. Ниже порог — больше автоматики и больше ошибок. Найди баланс.'],
    why: 'Порог — главный рычаг FDE в любом проекте с ИИ: он решает, где машина работает сама, а где страхует человек.',
    task: 'Добейся ≥ 60 % обращений автоматически при ошибках ≤ 2 %, и чтобы срочные симптомы ни разу не ушли в автомат.',
    hint: 'Одним общим порогом не выйдет. Переключись на «Порог на очередь»: где модель надёжна, порог можно ниже; где цена ошибки огромна — только человек.',
    stage: 'Точка — обращение: зелёная — модель права, красная — ошиблась. Яркие точки справа от линии ушли в автомат.',
    check: m => m.auto >= 0.6 && m.err <= 0.02 && m.urg === 0 },
  { id: 'lanes', title: 'Правило, модель или человек',
    text: ['Не всё нужно отдавать модели. Если решение можно записать одной строкой «если… то…», это правило в коде: оно не ошибается и его легко проверить.',
           'Модель берёт то, что нельзя описать правилом: свободный текст. А человек — то, где цена ошибки высока или нужна ответственность.'],
    why: 'Сильный FDE использует модель там, где она нужна, а не везде. Так система дешевле, надёжнее и понятнее клиенту.',
    task: 'Разложи 8 шагов работы колл-центра по трём дорожкам: правило в коде, модель или человек.',
    hint: 'Спроси: можно ли записать это как «если… то…»? Нужно ли понимать живой текст? Кто отвечает, если ошибёмся?',
    stage: 'Схема сверху показывает, по каким дорожкам идёт обращение.',
    check: m => m.placed === m.total },
  { id: 'pilot', title: 'Пилот: самая маленькая полезная версия',
    text: ['Сделать всё сразу за 6 недель нельзя. Выбери кусок, который за 2 недели даст заметную пользу при низком риске.',
           'Потом запиши договорённость на одной странице: цель, метрика, что входит, что не входит, сроки и риски.'],
    why: 'Маленький удачный пилот открывает дверь к большому проекту. Большой неудачный — закрывает её навсегда.',
    task: 'Собери пилот: польза ≥ 7, риск каждой части ≤ 2, работы не больше чем на 2 недели. Затем заполни все 6 разделов страницы объёма работ.',
    hint: 'Начни с самой частой и безопасной очереди. Без журнала решений пилот нельзя проверить.',
    stage: 'Шкалы показывают пользу, самый большой риск и срок.',
    check: m => m.pilotOk && m.scopeN === 6 },
  { id: 'system', title: 'Собери систему',
    text: ['Разбей решение на части (decomposition): что приходит на вход, что делает модель, что — правила, где порог, кто проверяет.',
           'А потом примени тот же приём к новым задачам. Почти любая задача у клиента похожа на один из пяти типовых шаблонов.'],
    why: 'На собеседовании FDE и в работе тебя спросят именно это: как разложить чужую задачу на понятные части за 30 минут.',
    task: 'Собери конвейер из 6 блоков по порядку, затем для 3 новых задач выбери шаблон и первый вопрос клиенту.',
    hint: 'Конвейер: сначала понять обращение, потом проверить правила, потом решить, куда отправить, и всё записать.',
    stage: 'Блоки встают в конвейер сверху вниз. Лишние блоки не подойдут.',
    check: m => m.pipe === 6 && m.bankOk === 3 },
];

const KEY = 'luch-prof-fde-practice';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview' };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- 1. interview ----------
const LEAD = 'Анна, руководитель колл-центра';
const FIELDS = [

function talkOptions() {
  const iv = S.iv, open = FIELDS.filter(f => !iv.filled[f.id]);

  const pool = unused.length >= 2 ? unused : BADQ.map((b, i) => i);
  const bad = [pool[(iv.turn * 2) % pool.length], pool[(iv.turn * 2 + 1) % pool.length]].filter((v, i, a) => a.indexOf(v) === i).map(i => ({ k: 'b', id: i, q: BADQ[i].q }));
  return mix(good.concat(bad), iv.turn + 1);
}

const DATA = (() => {
  const r = mulberry(25), out = [];
  QUEUES.forEach((q, qi) => {
    for (let i = 0; i < q.cnt; i++) {
      const c = +(q.lo + (0.99 - q.lo) * Math.pow(r(), q.sk)).toFixed(2);
      const pw = c >= q.safe ? 0.008 : (q.safe > 1 ? 0.25 : 0.12 + (q.safe - c) * 1.6);
      out.push({ q: q.id, qi, c, ok: r() >= pw });
    }
  });
  const j = mulberry(4242); out.forEach(d => { d.jy = j() * 2 - 1; });
  return out;
})();

  return { a, e, u, auto: a / DATA.length, err: a ? e / a : 0 };

let dg = null, ghost = null;

  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Практикум пройден! Дальше — карта навыков FDE.'), 900);
    if (window.LuchShell && window.LuchShell.prefetchQuiz) try { window.LuchShell.prefetchQuiz(); } catch (e) {}
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  paint();
  renderPanes(m);
  renderTools();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
}

// ---------- layout: keep the screen clear of the task card ----------
const stage = $('#stage');
function fit() {
  const tb = $('#taskBox'), mt = $('#meter'), tl = $('#tools'), hint = $('#hint');
  if (getComputedStyle(screen).position === 'static') { mt.style.cssText = ''; screen.style.cssText = ''; hint.style.cssText = ''; return; }
  const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return;
  const tr = tb.getBoundingClientRect(), bottom = Math.round(r.bottom - tl.getBoundingClientRect().top + 8);
  const sideW = r.right - tr.right - 12 - 14;
  if (sideW >= 460) {
    mt.style.cssText = `top:${Math.round(tr.bottom - r.top + 8)}px;left:14px;right:auto;width:${Math.round(tr.width)}px`;
    const mr = mt.getBoundingClientRect();
    hint.style.cssText = `top:${Math.round(mr.bottom - r.top + 12)}px;left:16px;width:${Math.round(tr.width) - 4}px;display:block`;
    screen.style.cssText = `left:${Math.round(tr.right - r.left + 12)}px;top:14px;right:14px;bottom:${bottom}px`;
  } else {
    mt.style.cssText = '';
    hint.style.cssText = 'display:none';
    const mr = mt.getBoundingClientRect();
    const top = Math.round(Math.max(tr.bottom, mr.bottom) - r.top + 8);
    screen.style.cssText = `left:14px;top:${top}px;right:14px;bottom:${bottom}px`;
  }
}
const ro = new ResizeObserver(() => fit());
[stage, $('#taskBox'), $('#tools')].forEach(x => ro.observe(x));

};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));
function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.rp = false;
  resetState();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  build();
  screen.scrollTop = 0;
  renderStrip(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons');
  if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// ---------- for the AI tutor: what is on the screen right now ----------
const CASE = 'Сквозной пример: сеть клиник «Медика» (5 клиник). Колл-центр получает около 900 обращений в день: запись, перенос, анализы, страховка, жалобы, срочные симптомы. Операторы вручную раскладывают их по 6 очередям, около 4 минут на обращение (60 часов операторов в день), ответ пациенту ждёт около суток. Клиника купила ИИ-модель, на демо она ошибалась в каждом пятом обращении и однажды отправила «боль в груди» в обычную запись — проект встал. Ученик играет FDE, которого прислали на 6 недель. Деньги — в долларах, ставка оператора около $8 в час.';
const ROLEPLAY = `РЕЖИМ РОЛЕВОЙ ИГРЫ (ученик нажал «Сыграть с наставником»). Ты играешь роль «${LEAD}» сети клиник «Медика». Ученик — FDE, он задаёт вопросы, а ты отвечаешь от первого лица, по-разговорному, 1–3 предложения, только на то, что спросили. Не подсказывай, какие вопросы задавать, и не выходи из роли без причины.
Факты, которые ты раскрываешь только на прямой вопрос: пользователи — операторы колл-центра, 14 человек в смене, и ты сама; решение — в какую из 6 очередей отправить обращение (запись, перенос, анализы, страховка, жалобы, срочные); сейчас оператор читает или слушает обращение, ищет пациента в CRM и выбирает очередь, около 4 минут на каждое, около 900 обращений в день, ответ пациенту — примерно через сутки; пробовали купленную модель — на демо она ошибалась в каждом пятом обращении и отправила «боль в груди» в обычную запись, проект остановили; данные — CRM колл-центра (поле «симптомы» часто пустое), медицинская система с картами пациентов (доступ только через главврача и юриста), расписание врачей в отдельной программе, Excel с прайсом, записи звонков, история, куда операторы отправляли обращения за 3 года; ограничения — срочное не должно потеряться, медданные не выходят за пределы клиники, операторов не сокращают; успех — ответ пациенту в тот же день, меньше часов операторов, ни одного срочного не туда.
Если первым спрашивают про модель или бюджет — отвечай, что не разбираешься и это к финансовому директору. На наводящие вопросы («вы же согласны, что…») — отвечай с лёгким раздражением. Если ученик сразу предлагает решение — скажи, что вы это уже слышали от продавцов.
После 8 вопросов ученика или если он напишет «стоп» — выйди из роли и коротко разбери: какие из 7 полей карточки задачи (кто пользователь, какое решение, как сейчас, что пробовали, данные и доступы, ограничения, как поймём успех) он заполнил и какой один вопрос стоило задать.`;
window.LUCH_CONTEXT = () => {

  if (id === 'talk') {
    const iv = S.iv;
    now = `Симулятор первого разговора с руководителем колл-центра. Ученик выбирает следующий вопрос из 4 вариантов, всего не больше 8 вопросов; ответы заполняют карточку задачи из 7 полей. Заполнено ${m.filled} из 7 (${FIELDS.filter(f => iv.filled[f.id]).map(f => f.n).join(', ') || 'ничего'}), задано вопросов ${m.asked}, из них впустую ${m.bad}. ${m.filled < 7 && iv.asked < MAXQ ? `Сейчас на выбор: ${talkOptions().map(o => '«' + o.q + '»').join('; ')}.` : ''}`;
    guide = 'Для наставника: не называй, какой вариант выбрать. Спроси, какой вопрос даст факт о людях, решении, процессе, данных или цифре успеха, а какой — о модели или деньгах.';
  }
  if (id === 'data') {
    now = `Карта данных клиники: 6 источников (${SRC.map(s => s.n).join(', ')}) и 6 ярлыков-проблем, которые нужно разложить по источникам. Разложено верно ${m.placed} из ${m.total}: ${TAGS.filter(t => S.place[t.id]).map(t => `«${t.t}» → ${SRC.find(s => s.id === t.g).n}`).join('; ') || 'ничего'}. Вопрос «где взять известные правильные ответы для проверки модели»: ${m.goldOk ? 'решён (история разбора обращений операторами)' : S.gold ? 'был неверный выбор' : 'не отвечен'}. Промахов: ${m.miss}.`;
    guide = 'Для наставника: не называй источник для ярлыка. Спроси, где эта проблема живёт: кто заполняет поле, где лежат медданные, какая система отдельная, что приходит файлом, что не текст.';

    guide = 'Для наставника: не называй метрики и не говори ответ 60. Спроси, заметит ли эту цифру пациент или директор, и подскажи шаги: умножить, потом перевести минуты в часы.';

    guide = 'Для наставника: не называй конкретные значения порогов. Спроси, в какой очереди цена ошибки самая высокая и где модель надёжна даже при пороге пониже.';
  }
  if (id === 'lanes') {
    now = `Ученик раскладывает 8 шагов работы колл-центра на три дорожки: «Правило в коде», «Модель», «Человек». Разложено ${m.placed} из ${m.total}: ${STEPS.filter(s => S.place[s.id]).map(s => `«${s.t}» → ${LANES.find(l => l.id === S.place[s.id]).name}`).join('; ') || 'ничего'}. Осталось: ${STEPS.filter(s => !S.place[s.id]).map(s => '«' + s.t + '»').join(', ') || 'ничего'}. Промахов: ${m.miss}.`;
    guide = 'Для наставника: не называй дорожку. Задай три вопроса: можно ли записать это как «если… то…»; нужно ли понимать живой текст; дорогая ли ошибка и нужна ли ответственность.';
  }

    now = `Ученик собирает двухнедельный пилот: польза ≥ ${P_V}, риск каждой части ≤ ${P_R}, работы ≤ ${P_E} единиц (10 дней). Части (польза/риск/работа): ${PIECES.map(p => `${p.n} ${p.v}/${p.r}/${p.e}`).join('; ')}. Выбрано: ${PIECES.filter(p => S.pil.includes(p.id)).map(p => p.n).join(', ') || 'ничего'} → польза ${m.v}, макс. риск ${m.r}, работа ${m.e}; пилот ${m.pilotOk ? 'верный' : 'пока не подходит'}. Страница объёма работ (цель, метрика, входит, не входит, сроки, риски): заполнено ${m.scopeN} из 6.`;
    guide = 'Для наставника: не называй состав пилота. Спроси, какая очередь самая частая и безопасная и как без журнала решений проверить результат.';

    now = `Ученик собирает конвейер из 6 блоков по порядку (есть 2 лишних блока). Собрано ${m.pipe} из 6: ${S.pipe.map(x => '«' + BLOCKS.find(b => b.id === x).t + '»').join(' → ') || 'ничего'}. Затем банк задач: 3 новых клиента (банк — спорные списания; интернет-магазин — расходятся остатки; городская служба — обращения жителей и поиск по правилам), для каждого выбрать шаблон (${PATTERNS.map(p => p.n).join(', ')}) и первый вопрос клиенту. Решено ${m.bankOk} из 3. Промахов: ${m.miss}.`;
    guide = 'Для наставника: не называй следующий блок и шаблон. Спроси, что системе нужно знать перед этим шагом, и что в задаче клиента главное: решение по каждому входящему, ответ в документах, расхождение двух систем.';

  const lines = [
    `Раздел: Профессии, «Практикум FDE: первые недели у клиента» (уровень 1, почти без кода). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    CASE,

    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    S.done[id] ? 'Задание уже выполнено — можно обсуждать свободно.' : guide,

  if (id === 'talk' && S.rp) lines.push(ROLEPLAY);

};

resetState();
setLesson(S.lesson);
fit();
})();
