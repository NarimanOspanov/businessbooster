<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 11 класс: элементарные частицы и кварки, античастицы и аннигиляция, следы частиц в камере, Большой адронный коллайдер и Стандартная модель.">
<title>Элементарные частицы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics (copied from labs/phys-machines). Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">

      <div class="prog" aria-label="Прогресс"><b>Частицы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с элементарными частицами. Частицы, кварки, следы и клетки таблицы можно нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? 1 : 3);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', CP = '#ffb547', OK = '#86e0a8', WARN = '#ff8a73', MUT = '#8b96ad', GOLD = '#ffd166', FG = '#e8ecf4';
const ease = p => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p);

const LESSONS = [
  { id: 'zoo', title: 'Зоопарк частиц',
    text: ['Всё вещество вокруг собрано из атомов, а атомы — из трёх частиц: электронов в оболочке, протонов и нейтронов в ядре. Ещё две частицы встречаются повсюду: фотон — квант света, у него нет ни заряда, ни массы покоя, и нейтрино — почти невесомая нейтральная частица, которая пролетает сквозь всю Землю, ни с чем не столкнувшись.',
           'Массу частиц удобно мерить в единицах энергии: по формуле Эйнштейна E = mc² каждой массе соответствует энергия покоя. У электрона она 0,511 МэВ, у протона — 938 МэВ: протон тяжелее электрона в 1836 раз. Заряд записывают в долях элементарного заряда e: у электрона −1, у протона +1, у нейтрона 0.',
           'Электрон, фотон и нейтрино — элементарные частицы: внутри них ничего не нашли. А протон и нейтрон состоят из кварков. Кварк u (верхний) имеет заряд +2/3, кварк d (нижний) — −1/3. Протон — это u u d, нейтрон — u d d. Кварки держит сильное взаимодействие, его переносят глюоны, и поодиночке кварки никогда не вылетают.'],
    why: 'Физики CERN под Женевой — крупнейшей лаборатории частиц, где работают учёные из более чем ста стран, — открывают и измеряют частицы на огромных ускорителях. Нейтринные телескопы во льду Антарктиды и в глубинах морей ловят нейтрино от Солнца и далёких галактик. Знание «зоопарка» частиц нужно медицинским физикам, инженерам ускорителей и исследователям новых материалов: свойства любого вещества задают его электроны, протоны и нейтроны. Через десять лет рутинные расчёты возьмёт на себя ИИ, но ставить вопросы природе и проверять, не ошибся ли алгоритм, будут люди, которые понимают физику частиц.',
    task: 'Нажмите на все пять частиц и узнайте их заряд и массу. Затем в режиме «Кварки» соберите из кварков протон и нейтрон.',
    hint: 'Кнопки «Частицы» и «Кварки» переключают опыт. В режиме «Кварки» жмите на u и d на лотке — кварк встанет в частицу; нажмите на кварк в частице, чтобы убрать его.',
    stage: 'Нажмите на частицу, чтобы узнать её свойства.',
    check: m => m.seen >= 5 && m.p && m.n },
  { id: 'anti', title: 'Античастицы',
    text: ['У каждой частицы есть античастица — с той же массой, но противоположным зарядом. Античастицу электрона, позитрон e⁺, предсказал Поль Дирак в 1928 году, а в 1932 году Карл Андерсон увидел её след в камере среди космических лучей. Есть антипротон, антинейтрон и даже антиводород — его получают в CERN.',

function hlBox(id) {

  }
  if (lid === 'anti') {

    if (S.amode === 'pair') return ({ gam: [40, NUC.y - 30, 110, 60], nuc: [NUC.x - 24, NUC.y - 24, 48, 64], field: [PBOX.x0, PBOX.y0, PBOX.x1 - PBOX.x0, PBOX.y1 - PBOX.y0], bal: [20, 322, 480, 80] })[id];
    return ({ ring: [PET.x - PET.ro - 4, PET.y - PET.ro - 4, 2 * PET.ro + 8, 2 * PET.ro + 8], head: [PET.x - 70, PET.y - 84, 140, 168], lines: [PET.x - PET.ri, PET.y - PET.ri, 2 * PET.ri, 2 * PET.ri], tumor: [PET.x - 70, PET.y - 84, 140, 168] })[id];
  }

    const q = quizTracks().find(x => x.k === id);
    if (q) { const xs = q.pts.map(p => p[0]), ys = q.pts.map(p => p[1]); return [Math.min(...xs) - 8, Math.min(...ys) - 8, Math.max(...xs) - Math.min(...xs) + 16, Math.max(...ys) - Math.min(...ys) + 16]; }
    if (id === 'vertex') return [VTX.x - 14, VTX.y - 14, 28, 28];
    return null;
  }
  if (S.cmode === 'ring') return ({ ring: [RING.x - RING.r - 12, RING.y - RING.r - 12, 2 * RING.r + 24, 2 * RING.r + 24], det: [DET.x - DET.R - 4, DET.y - DET.R - 4, 2 * DET.R + 8, 2 * DET.R + 8], tracker: [DET.x - 44, DET.y - 44, 88, 88], ecal: [DET.x - 82, DET.y - 82, 164, 164], muon: [DET.x - DET.R - 4, DET.y - DET.R - 4, 2 * DET.R + 8, 2 * DET.R + 8] })[id];
  const g = { quarks: ['q'], leptons: ['l'], bosons: ['b'], higgs: ['h'] }[id];
  if (!g) return null;

  return [x0 - 4, y0 - 4, x1 - x0 + 8, y1 - y0 + 8];
}

function act(a) {
  const id = LID();
  const re = () => { renderTools(); buildScheme(); update(); };
  // lesson 1
  if (a === 'zm-zoo' || a === 'zm-q') { S.zmode = a === 'zm-zoo' ? 'zoo' : 'q'; return re(); }
  if (a.startsWith('sel-')) { if (S.zmode !== 'zoo') S.zmode = 'zoo'; const z = a.slice(4); S.sel = z; if (!S.seen[z]) { S.seen[z] = true; const n = Object.keys(S.seen).length; if (n === 5) toast('Все пять частиц изучены. Теперь режим «Кварки»: из чего сделаны протон и нейтрон?'); } if (z === 'n' || z === 'p') S.view3 = z; return re(); }
  if (a === 'add-u' || a === 'add-d') {
    if (S.zmode !== 'q') S.zmode = 'q';
    if (S.bag.length >= 3) { toast('В протоне и нейтроне по три кварка. Нажмите на кварк в частице, чтобы убрать его.'); return re(); }
    S.bag.push(a.slice(4));

      const k = bagKey(), Hd = HADRON[k];
      if ((k === 'uud' || k === 'udd') && !S.built[k]) { S.built[k] = true; toast(`${Hd.name}: ${S.bag.map(q => QK[q].t).join(' ')} = ${thirds(bagQ())}.` + (S.built.uud && S.built.udd ? ' Оба нуклона собраны!' : k === 'uud' ? ' Теперь соберите нейтрон.' : ' Теперь соберите протон.')); }
      else if (k === 'uuu' || k === 'ddd') toast(`${Hd.name}, заряд ${thirds(bagQ())}. Такая частица есть, но ${Hd.note}. Протон и нейтрон собираются иначе.`);
      if (k === 'uud') S.view3 = 'p'; if (k === 'udd') S.view3 = 'n';
    }
    return re();
  }
  if (a.startsWith('rm-')) { S.bag.splice(+a.slice(3), 1); return re(); }
  if (a === 'undo') { S.bag.pop(); return re(); }
  if (a === 'clear') { S.bag = []; return re(); }
  if (a === 'bag') { if (S.bag.length === 3) { S.bag = []; return re(); } return; }
  if (a === 'swap3') { if (id === 'zoo') { S.view3 = S.view3 === 'p' ? 'n' : 'p'; if (S.zmode === 'q') { S.bag = S.view3 === 'p' ? [] : []; ['u', S.view3 === 'p' ? 'u' : 'd', 'd'].forEach(q => S.bag.push(q)); const k = bagKey(); if (!S.built[k]) { S.built[k] = true; toast(`${HADRON[k].name} собран: ${S.bag.map(q => QK[q].t).join(' ')} = ${thirds(bagQ())}.`); } } } return re(); }
  // lesson 2
  if (a.startsWith('am-')) { S.amode = a.slice(3); S.anim = null; return re(); }
  if (a === 'collide') {
    if (S.amode !== 'ann') S.amode = 'ann';
    S.annA = Math.PI / 2 + (Math.random() - 0.5) * 1.0; S.annN++;
    startAnim('ann', 2.2);
    if (!S.ann) { S.ann = true; setTimeout(() => toast('Аннигиляция: электрон и позитрон исчезли, родились два γ-кванта по 0,511 МэВ. Энергия и заряд сохранились.'), reduce ? 0 : 1600); }
    return re();
  }
  if (a.startsWith('E-')) { S.Ei = +a.slice(2); S.pres = null; S.anim = null; return re(); }
  if (a === 'shoot') {
    if (S.amode !== 'pair') return;
    const E = EG[S.Ei], ok = E >= 2 * ME;
    S.pres = { E, ok }; startAnim('pair', 2.4);
    if (!ok && !S.low) { S.low = true; setTimeout(() => toast(`γ ${fmt(E, 1)} МэВ пролетел мимо: на два электрона нужно хотя бы 1,022 МэВ.`), reduce ? 0 : 1000); }
    if (ok && !S.pairOk) { S.pairOk = true; setTimeout(() => toast(`Родилась пара e⁻ + e⁺! Из ${fmt(E, 1)} МэВ 1,022 МэВ ушло на массы, остальное — на движение.`), reduce ? 0 : 1100); }
    return re();
  }
  if (a === 'scan') { if (S.amode !== 'pet') return; petScan(10); return re(); }
  if (a === 'petclr') { S.pet.ev = []; S.pet.lit = {}; S.pet.miss = null; return re(); }
  // lesson 3
  if (a === 'tm-lab' || a === 'tm-quiz') { S.tmode = a === 'tm-lab' ? 'lab' : 'quiz'; return re(); }
  if (a.startsWith('pid-')) { S.pid = a.slice(4); return re(); }
  if (a.startsWith('lvl-')) { S.lvl = +a.slice(4); return re(); }
  if (a.startsWith('B-')) { S.Bs = +a.slice(2); return re(); }
  if (a === 'launch') { if (S.tmode !== 'lab') return; launch(); return re(); }
  if (a === 'clr') { S.tracks = []; return re(); }
  if (a === 'cham') return;
  if (a.startsWith('qs-')) { if (S.tmode !== 'quiz') S.tmode = 'quiz'; S.qsel = a.slice(3); return re(); }
  if (a.startsWith('qa-')) {
    if (!S.qsel) { toast('Сначала выберите след — нажмите на него или на кнопку «След A…D».'); return; }
    const q = QUIZ.find(x => x.k === S.qsel), ans = a.slice(3);

    if (ans === q.ans) {
      S.qans[q.k] = true; toast(`Верно, ${q.k} — ${PT[q.ans].name}: ${q.why}.`);

    else if (hv.id === 'H' && first) toast('Бозон Хиггса: нужно не меньше 125 ГэВ. Он распался на два фотона — жёлтые линии гаснут в калориметре.' + (S.made.Z ? '' : ' Найдите ещё энергию, при которой рождается Z.'));

    const c = SM.find(x => x.id === a.slice(3)); if (!c) return;
    S.smSel = c.id;

      else toast(`Это ${c.n}. ${QS[S.qi].no}`);
    }
    return re();
  }
  if (a === 'smreset') { S.smSel = null; return re(); }
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'zoo') return [`Частицы ${m.seen}/5`, t(m.p, 'Протон'), t(m.n, 'Нейтрон')].join(' · ');
  if (id === 'anti') return [t(m.ann, 'Аннигиляция'), t(m.low, '1,0 МэВ'), t(m.pair, 'Пара'), t(m.pet, 'ПЭТ')].join(' · ');
  if (id === 'tracks') return [t(m.signs, 'e⁻ и e⁺'), t(m.mom, 'Импульс'), `Снимок ${m.ids}/4`].join(' · ');
  return [t(m.z, 'Z'), t(m.h, 'Хиггс'), `Таблица ${Math.min(m.q, 4)}/4`].join(' · ');
}

// Scheme tab: built once per lesson state, then values refreshed
const chips = (lbl, items) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips">${items.map(([a, n, on]) => `<button data-a="${a}" aria-pressed="${!!on}">${n}</button>`).join('')}</div></div>`;
const reads = (a, b, c) => `<dl class="reads"><div><dt>${a}</dt><dd id="r1"></dd></div><div><dt>${b}</dt><dd id="r2"></dd></div><div><dt>${c}</dt><dd id="r3"></dd></div></dl>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'zoo') {
    h = `<h2>Частицы и кварки</h2>` + chips('Опыт', [['zm-zoo', 'Частицы', S.zmode === 'zoo'], ['zm-q', 'Кварки', S.zmode === 'q']]);
    if (S.zmode === 'zoo') h += chips('Выбрать частицу', ZOO.map(z => ['sel-' + z.id, z.sym + ' ' + z.name.toLowerCase(), S.sel === z.id])) + reads('заряд', 'mc²', 'изучено');
    else h += chips('Добавить кварк', [['add-u', 'u · +2/3', false], ['add-d', 'd · −1/3', false], ['undo', 'Убрать', false], ['clear', 'Очистить', false]]) + reads('кварки', 'заряд', 'частица');
    h += `<h3>Записи</h3><div class="rec">` + step('протон', S.built.uud ? 'u u d → +1' : '—') + step('нейтрон', S.built.udd ? 'u d d → 0' : '—') + `</div>`;
  }
  if (id === 'anti') {
    h = `<h2>Античастицы</h2>` + chips('Опыт', [['am-ann', 'Аннигиляция', S.amode === 'ann'], ['am-pair', 'Рождение пары', S.amode === 'pair'], ['am-pet', 'ПЭТ', S.amode === 'pet']]);
    if (S.amode === 'ann') h += chips('Действие', [['collide', 'Столкнуть e⁻ и e⁺', false]]);
    if (S.amode === 'pair') h += chips('Энергия γ-кванта', EG.map((E, i) => ['E-' + i, fmt(E, 1) + ' МэВ', S.Ei === i])) + chips('Действие', [['shoot', 'Выстрелить', false]]);
    if (S.amode === 'pet') h += chips('Сканер', [['scan', 'Сканировать (+10 линий)', false], ['petclr', 'Очистить', false]]);
    h += reads('квант', 'нужно', 'линий ПЭТ');
    h += `<h3>Записи</h3><div class="rec">` + step('аннигиляция', S.ann ? '2 γ по 0,511 МэВ' : '—') + step('γ 1,0 МэВ', S.low ? 'пары нет' : '—') + step('рождение пары', S.pairOk ? 'e⁻ + e⁺ родились' : '—') + step('ПЭТ', S.pet.found ? 'опухоль найдена' : '—') + `</div>`;
  }
  if (id === 'tracks') {
    h = `<h2>Камера в магнитном поле</h2>` + chips('Опыт', [['tm-lab', 'Камера', S.tmode === 'lab'], ['tm-quiz', 'Снимок', S.tmode === 'quiz']]);
    if (S.tmode === 'lab') h += chips('Частица', PIDS.map(p => ['pid-' + p, PT[p].sym + ' ' + PT[p].name, S.pid === p])) + chips('Импульс', LVL.map((n, i) => ['lvl-' + i, n, S.lvl === i])) + chips('Магнитное поле', [['B-1', '⊗ в экран', S.Bs === 1], ['B--1', '⊙ из экрана', S.Bs === -1], ['B-0', 'выключено', S.Bs === 0]]) + chips('Действие', [['launch', 'Пуск', false], ['clr', 'Стереть следы', false]]);
    else h += chips('След', QUIZ.map(q => ['qs-' + q.k, q.k + (S.qans[q.k] ? ' ✓' : ''), S.qsel === q.k])) + chips('Это…', ['em', 'ep', 'p', 'al'].map(p => ['qa-' + p, PT[p].sym + ' ' + PT[p].name, false]));
    h += reads('частица', 'заряд', 'следов');
    h += `<h3>Записи</h3><div class="rec">` + step('электрон в поле', S.sg.em ? 'изогнут' : '—') + step('позитрон в поле', S.sg.ep ? 'изогнут в другую сторону' : '—') + step('разный импульс', Object.keys(S.momS).filter(k => Object.keys(S.momS[k]).length >= 2).map(k => PT[k].sym).join(', ') || '—') + QUIZ.map(q => step('след ' + q.k, S.qans[q.k] ? PT[q.ans].name : '?')).join('') + `</div>`;
  }
  if (id === 'lhc') {
    h = `<h2>Коллайдер</h2>` + chips('Опыт', [['cm-ring', 'Коллайдер', S.cmode === 'ring'], ['cm-sm', 'Стандартная модель', S.cmode === 'sm']]);
    if (S.cmode === 'ring') h += chips('Энергия столкновения', EKT.map((n, i) => ['Ek-' + i, n, S.Ek === i])) + chips('Действие', [['bang', 'Столкнуть', false]]);
    else h += chips('Ответить: нажмите на клетку', SM.map(c => ['sm-' + c.id, c.s, S.smSel === c.id]));
    h += reads('энергия', 'родилось', 'вопросы');
    h += `<h3>Записи</h3><div class="rec">` + BORN.filter(b => S.made[b.id]).map(b => step(b.n, `от ${fmt(b.E, b.E < 10 ? 2 : 1)} ГэВ`)).join('') + (Object.keys(S.made).length ? '' : '<p class="note">Пока пусто. Столкните пучки.</p>') + step('таблица', `${Math.min(S.qi, 4)} из 4 ответов`) + `</div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  if (id === 'zoo') {
    if (S.zmode === 'zoo') { const z = ZOO.find(q => q.id === S.sel); set('#r1', z ? z.q : '—'); set('#r2', z ? z.m.split(' —')[0] : '—'); set('#r3', m.seen + ' / 5'); }
    else { set('#r1', S.bag.join(' ') || '—'); set('#r2', S.bag.length ? thirds(bagQ()) : '—'); set('#r3', S.bag.length === 3 ? HADRON[bagKey()].sym : '…'); }
  }
  if (id === 'anti') { set('#r1', S.amode === 'pair' ? fmt(EG[S.Ei], 1) + ' МэВ' : S.amode === 'ann' ? '2 × 0,511' : '0,511 МэВ'); set('#r2', '1,022 МэВ'); set('#r3', String(S.pet.ev.length)); }
  if (id === 'tracks') { const P = S.tmode === 'lab' ? PT[S.pid] : S.qsel ? { sym: S.qsel, q: '?' } : { sym: '—', q: '—' }; set('#r1', P.sym); set('#r2', typeof P.q === 'number' ? (P.q > 0 ? '+' : P.q < 0 ? '−' : '') + Math.abs(P.q) : P.q); set('#r3', String(S.tracks.length)); }
  if (id === 'lhc') { set('#r1', EKT[S.Ek]); set('#r2', S.ev ? BORN.find(b => b.id === S.ev.id).n.split(' ')[0] : '—'); set('#r3', Math.min(S.qi, 4) + ' / 4'); }
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'zoo') {
    const parts = S.bag.map(q => QK[q].t);
    return `<h2>Заряд из кварков</h2><div class="formula">q = q₁ + q₂ + q₃</div><p class="note">u = +2/3, d = −1/3 (в долях элементарного заряда e = 1,6·10⁻¹⁹ Кл).</p>
      <h3>Сейчас в частице</h3><div class="steps">` + step('кварки', S.bag.join(' ') || '—') + step('заряд', parts.length ? `${parts.join(' ')} = ${thirds(bagQ())}` : '—', 'sum') + `</div>
      <h3>Проверка</h3><div class="steps">` + step('протон u u d', '2/3 + 2/3 − 1/3 = +1') + step('нейтрон u d d', '2/3 − 1/3 − 1/3 = 0') + `</div>
      <h3>Масса через энергию</h3><div class="steps">` + step('электрон, mc²', '0,511 МэВ') + step('протон, mc²', '938,3 МэВ') + step('протон / электрон', '938,3 / 0,511 ≈ 1836', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Масса трёх кварков u u d — всего около 9 МэВ. Остальные 99% массы протона — энергия глюонов и движения кварков внутри: снова E = mc².</p>`;
  }
  if (id === 'anti') {
    const E = EG[S.Ei];
    return `<h2>Энергия покоя</h2><div class="formula">E = m · c²</div><p class="note">m = 9,11·10⁻³¹ кг — масса электрона, c = 3·10⁸ м/с, 1 МэВ = 1,6·10⁻¹³ Дж.</p>
      <h3>Энергия покоя электрона</h3><div class="steps">` + step('m · c²', '9,11·10⁻³¹ × (3·10⁸)²') + step('в джоулях', '8,2·10⁻¹⁴ Дж') + step('в МэВ', '8,2·10⁻¹⁴ / 1,6·10⁻¹³ ≈ 0,511 МэВ', 'sum') + `</div>
      <h3>Аннигиляция e⁻ + e⁺ → 2γ</h3><div class="steps">` + step('до', '0,511 + 0,511 = 1,022 МэВ') + step('после', '2 × 0,511 = 1,022 МэВ', 'sum') + `</div>
      <h3>Рождение пары γ → e⁻ + e⁺</h3><div class="steps">` + step('порог', '2 · 0,511 = 1,022 МэВ') + step('квант сейчас', `${fmt(E, 1)} МэВ`) + step(E >= 2 * ME ? 'на движение' : 'не хватает', E >= 2 * ME ? `${fmt(E, 1)} − 1,022 = ${fmt(E - 2 * ME, 3)} МэВ` : `1,022 − ${fmt(E, 1)} = ${fmt(2 * ME - E, 3)} МэВ`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">В ПЭТ кванты по 0,511 МэВ ловят детекторы: энергия 0,511 МэВ — подпись именно аннигиляции.</p>`;
  }
  if (id === 'tracks') {
    return `<h2>Радиус следа</h2><div class="formula">r = p / (|q| · B)</div><p class="note">p = m·v — импульс, q — заряд, B — индукция поля. Сила Лоренца F = |q|·v·B работает как центростремительная.</p>
      <h3>Что меняет радиус</h3><div class="steps">` + step('импульс p × 2', 'r × 2 — след прямее') + step('заряд |q| × 2', 'r ÷ 2 — круче') + step('поле B × 2', 'r ÷ 2 — круче') + step('поле B = 0', 'прямая линия', 'sum') + `</div>
      <h3>Направление изгиба (поле ⊗)</h3><div class="steps">` + step('q > 0 (e⁺, p, α)', 'против часовой стрелки') + step('q < 0 (e⁻)', 'по часовой стрелке') + step('q = 0 (γ, n)', 'следа нет', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Электрон теряет энергию на ионизацию, его p падает — r уменьшается, и след сворачивается в спираль.</p>`;
  }
  const E = EK[S.Ek];
  return `<h2>Порог рождения</h2><div class="formula">E ≥ m · c²</div><p class="note">Энергия столкновения должна покрыть энергию покоя новой частицы (для пары — двух частиц). 1 ГэВ = 1000 МэВ.</p>
    <h3>Сейчас: ${EKT[S.Ek]}</h3><div class="steps">` + BORN.map(b => step(b.n, `${fmt(b.E, b.E < 10 ? 2 : 1)} ГэВ ${b.E <= E ? '✓' : '✗'}`, b === heaviest(E) ? 'sum' : '')).join('') + `</div>
    <h3>Большой адронный коллайдер</h3><div class="steps">` + step('длина кольца', '27 км') + step('энергия протонов', '6,8 + 6,8 = 13,6 ТэВ') + step('скорость', '0,999999991 c') + step('оборотов в секунду', '≈ 11 245') + step('столкновений в секунду', '≈ 1 миллиард', 'sum') + `</div>
    <p class="note" style="margin-top:10px">Протон — мешок кварков и глюонов, и в одном столкновении сталкиваются лишь их части: до новой частицы доходит малая доля 13,6 ТэВ. Хиггс рождается примерно в одном столкновении из миллиарда — поэтому событий нужно так много, а отбирать их помогают быстрые фильтры и ИИ.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const row = (a, b, cls) => `<div class="lr"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`;
  if (id === 'zoo') {
    if (S.zmode === 'zoo') { const z = ZOO.find(q => q.id === S.sel); el.innerHTML = `<div class="k">${z ? z.name : 'Частица'}</div><div class="v">${z ? z.sym : '—'}</div>` + row('заряд', z ? z.q : '—') + row('mc²', z ? z.m.split(' —')[0] : '—') + row('изучено', m.seen + '/5', m.seen >= 5 ? 'ok' : ''); }
    else { const full = S.bag.length === 3; el.innerHTML = `<div class="k">Заряд</div><div class="v ${full && (m.bag === 'uud' || m.bag === 'udd') ? 'ok' : ''}">${S.bag.length ? thirds(bagQ()) : '—'}</div>` + row('кварки', S.bag.join(' ') || '—') + row('протон', S.built.uud ? '✓' : '—', S.built.uud ? 'ok' : '') + row('нейтрон', S.built.udd ? '✓' : '—', S.built.udd ? 'ok' : ''); }
  } else if (id === 'anti') {
    if (S.amode === 'ann') el.innerHTML = `<div class="k">Энергия</div><div class="v">1,022 МэВ</div>` + row('e⁻ + e⁺', '2 × 0,511') + row('γ + γ', S.ann ? '2 × 0,511' : '—', S.ann ? 'ok' : '');
    else if (S.amode === 'pair') { const E = EG[S.Ei]; el.innerHTML = `<div class="k">Энергия кванта</div><div class="v ${E >= 2 * ME ? 'ok' : ''}">${fmt(E, 1)} МэВ</div>` + row('порог', '1,022 МэВ') + row('пара', E >= 2 * ME ? 'может' : 'нет', E >= 2 * ME ? 'ok' : 'bad'); }
    else el.innerHTML = `<div class="k">ПЭТ</div><div class="v">${S.pet.ev.length} линий</div>` + row('γ', '0,511 МэВ') + row('опухоль', S.pet.found ? 'найдена' : '?', S.pet.found ? 'ok' : '');
  } else if (id === 'tracks') {
    if (S.tmode === 'lab') { const P = PT[S.pid]; el.innerHTML = `<div class="k">Частица</div><div class="v">${P.sym} · ${P.name}</div>` + row('заряд', P.q ? (P.q > 0 ? '+' : '−') + Math.abs(P.q) : '0') + row('импульс', LVL[S.lvl]) + row('поле', S.Bs > 0 ? '⊗' : S.Bs < 0 ? '⊙' : 'выкл'); }
    else el.innerHTML = `<div class="k">Снимок</div><div class="v ${m.ids >= 4 ? 'ok' : ''}">${m.ids} / 4</div>` + row('выбран', S.qsel ? 'след ' + S.qsel : '—') + row('поле', '⊗');
  } else {
    if (S.cmode === 'ring') { const hv = heaviest(EK[S.Ek]); el.innerHTML = `<div class="k">Энергия</div><div class="v">${EKT[S.Ek]}</div>` + row('до', hv ? hv.n.split(' (')[0] : '—') + row('Z', S.made.Z ? '✓' : '—', S.made.Z ? 'ok' : '') + row('H', S.made.H ? '✓' : '—', S.made.H ? 'ok' : ''); }
    else { const c = SM.find(x => x.id === S.smSel); el.innerHTML = `<div class="k">${c ? GNAME[c.g] : 'Таблица'}</div><div class="v">${c ? c.s : Math.min(S.qi, 4) + ' / 4'}</div>` + (c ? row('заряд', c.q) + row('mc²', c.m) : row('вопросы', Math.min(S.qi, 4) + ' / 4', S.qi >= 4 ? 'ok' : '')); }
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, из чего сделан мир!'), 2400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  drawScene(performance.now()); dirty = false;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {

  if (id === 'anti') now = S.amode === 'ann' ? `Опыт «Аннигиляция»: электрон и позитрон ${S.ann ? 'уже столкнулись и дали два γ-кванта по 0,511 МэВ' : 'ещё не сталкивали'}.` : S.amode === 'pair' ? `Опыт «Рождение пары»: γ-квант с энергией ${fmt(EG[S.Ei], 1)} МэВ летит к ядру свинца в магнитном поле. Последний выстрел: ${S.pres ? `${fmt(S.pres.E, 1)} МэВ — ${S.pres.ok ? 'пара родилась' : 'пары нет'}` : 'не было'}. Порог не называй — наводи к 2·mc² электрона.` : `Опыт «ПЭТ»: набрано ${S.pet.ev.length} линий совпадений, опухоль ${S.pet.found ? 'найдена' : 'ещё не найдена (её место скрыто)'}.`;
  if (id === 'anti') now += ` Подзадачи: аннигиляция — ${S.ann ? 'да' : 'нет'}, квант 1,0 МэВ проверен — ${S.low ? 'да' : 'нет'}, пара рождена — ${S.pairOk ? 'да' : 'нет'}, ПЭТ — ${S.pet.found ? 'да' : 'нет'}.`;
  if (id === 'tracks') now = S.tmode === 'lab' ? `Камера Вильсона, поле ${S.Bs > 0 ? '⊗ в экран' : S.Bs < 0 ? '⊙ из экрана' : 'выключено'}. Выбрана частица: ${PT[S.pid].name}, импульс ${LVL[S.lvl]}. Следов на экране: ${S.tracks.length}. Электрон в поле — ${S.sg.em ? 'запущен' : 'нет'}, позитрон — ${S.sg.ep ? 'запущен' : 'нет'}; разный импульс у одной частицы — ${m.mom ? 'да' : 'нет'}.` : `Режим «Снимок»: четыре следа A–D из одной точки в поле ⊗. Выбран след ${S.qsel || '—'}. Определены: ${QUIZ.filter(q => S.qans[q.k]).map(q => q.k).join(', ') || 'ни одного'}. Ответы не называй — наводи по направлению изгиба, толщине и длине следа.`;
  if (id === 'lhc') now = S.cmode === 'ring' ? `Коллайдер: выбрана энергия столкновения ${EKT[S.Ek]}. Последнее столкновение: ${S.ev ? `${EKT[S.ev.Ek]}, самая тяжёлая рождённая частица — ${BORN.find(b => b.id === S.ev.id).n}` : 'не было'}. Получены Z — ${S.made.Z ? 'да' : 'нет'}, Хиггс — ${S.made.H ? 'да' : 'нет'}. Нужные энергии не называй — наводи к E ≥ mc².` : `Таблица Стандартной модели. Вопрос ${Math.min(S.qi + 1, 4)} из 4: «${QS[Math.min(S.qi, 3)].q}» (отвечено ${Math.min(S.qi, 4)}). Выбрана клетка: ${S.smSel ? SM.find(c => c.id === S.smSel).n : 'нет'}. Ответ не называй.`;
  return [
    `Раздел: физика, 11 класс, тема «Элементарные частицы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-particles.js)
const r1 = x => Math.round(x * 10) / 10;
window.LUCH_REAL = () => {
  const id = LID(), M = { module: 'particles' };
  if (id === 'zoo') {
    const q = S.bag.length === 3 ? S.bag.slice() : S.view3 === 'n' ? ['u', 'd', 'd'] : ['u', 'u', 'd'];
    const k = q.slice().sort((a, b) => a === b ? 0 : a === 'u' ? -1 : 1).join('');
    return { ...M, scene: 'particles-proton', help: 'Частица — сменить протон / нейтрон', q, had: HADRON[k].name, Q: thirds(q.reduce((s, x) => s + QK[x].q, 0)) };
  }
  if (id === 'anti') {
    if (S.amode === 'pet') return { ...M, scene: 'particles-pet', help: 'Сканер — +10 линий', n: S.pet.ev.length, found: S.pet.found, tum: S.pet.tum.map(v => r1(v)), ev: S.pet.ev.slice(-60).map(e => [r1(e[0]), r1(e[1]), r1(e[2]), r1(e[3])]) };
    return { ...M, scene: 'particles-anni', help: S.amode === 'ann' ? 'Частицы — столкнуть' : 'Квант — выстрелить', mode: S.amode, done: S.ann, E: S.pres ? S.pres.E : EG[S.Ei], ok: S.pres ? S.pres.ok : null, a: r1(S.annA) };
  }
  if (id === 'tracks') {
    const sub = pts => { const out = []; for (let i = 0; i < pts.length; i += 3) out.push([Math.round(pts[i][0]), Math.round(pts[i][1])]); if (pts.length) out.push([Math.round(pts[pts.length - 1][0]), Math.round(pts[pts.length - 1][1])]); return out; };
    const list = S.tmode === 'lab' ? S.tracks.filter(x => x.pts.length).map(x => ({ pts: sub(x.pts), w: PT[x.pid].w, s: PT[x.pid].sym })) : quizTracks().map(q => { const m = q.pts[Math.min(q.pts.length - 1, q.k === 'D' ? q.pts.length - 1 : q.k === 'C' ? 60 : 26)]; return { pts: sub(q.pts), w: PT[q.pid].w, s: S.qans[q.k] ? q.k + ' · ' + PT[q.pid].sym : q.k, lab: [Math.round(m[0]), Math.round(m[1])] }; });
    return { ...M, scene: 'particles-chamber', help: S.tmode === 'lab' ? 'Источник — пуск, магнит — сменить поле' : 'Снимок из камеры: следы A–D', B: S.tmode === 'lab' ? S.Bs : 1, quiz: S.tmode === 'quiz', tracks: list, box: CH, src: SRC, vtx: VTX };
  }
  if (S.cmode === 'sm') return { ...M, scene: 'particles-sm', help: 'Клетка — ответ на вопрос', sel: S.smSel, qi: S.qi, q: S.qi < QS.length ? QS[S.qi].q : 'Все ответы верны!' };
  return { ...M, scene: 'particles-lhc', help: 'Детектор — столкнуть', E: EKT[S.Ek], ev: S.ev ? S.ev.id : null, sig: S.ev ? SIG[S.ev.id] : '', made: Object.keys(S.made) };
};
// live values for smooth motion in 3D: phase of the current animation (s) and its counter
window.LUCH_REAL.live = () => ({ k: S.animK, a: S.anim ? S.anim.k : null, p: S.anim ? (performance.now() - S.anim.t0) / 1000 : 99 });
window.LUCH_REAL.click = k => {
  const id = LID();
  if (k === 'swap') return act('swap3');
  if (k === 'collide') return act(S.amode === 'pair' ? 'shoot' : 'collide');
  if (k === 'scan') return act('scan');
  if (k === 'launch') return act('launch');
  if (k === 'field') return act('B-' + (S.Bs === 1 ? '-1' : S.Bs === -1 ? '0' : '1'));
  if (k === 'bang') return act('bang');
  if (k && k.startsWith('sm-')) return act(k);
  if (k && k.startsWith('qs-') && id === 'tracks') return act(k);
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
