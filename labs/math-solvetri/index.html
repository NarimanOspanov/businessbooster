<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 9 класс: синус, косинус и тангенс углов от 0° до 180°, теорема синусов, теорема косинусов, решение треугольников и задачи на местности.">
<title>Теоремы синусов и косинусов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.good{color:var(--ok)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:20%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:48%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.pbody h3 .m,.meter .k .m{text-transform:none;letter-spacing:.02em}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж: единичная полуокружность, треугольник с описанной окружностью и задачи на местности. Точки можно двигать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>

    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>

  <nav class="strip" aria-label="Уроки">

</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY = 'luch-math-solvetri';
const RAD = Math.PI / 180;
const sinD = d => { const r = Math.sin(d * RAD); return Math.abs(r) < 1e-12 ? 0 : r; };
const cosD = d => { const r = Math.cos(d * RAD); return Math.abs(r) < 1e-12 ? 0 : r; };
// number with a decimal comma and a real minus sign
const fx = (v, n = 2) => { let s = (Math.round(v * 10 ** n) / 10 ** n).toFixed(n); if (/^-0(\.0+)?$/.test(s)) s = s.slice(1); return s.replace('.', ',').replace('-', '−'); };
const tr = (v, n = 2) => { let s = fx(v, n); if (s.includes(',')) s = s.replace(/0+$/, '').replace(/,$/, ''); return s === '−0' ? '0' : s; };
const br = s => s.startsWith('−') ? '(' + s + ')' : s;
const INK = '#04070d', CA = '#ffb547', CB = '#72d4e8', CC = '#b79cff', OK = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', RD = '#ff8a73', WA = '#5fb4d9';

// exact values for the table angles: [sin, cos, tg]
const EX = { 0: ['0', '1', '0'], 30: ['1/2', '√3/2', '√3/3'], 45: ['√2/2', '√2/2', '1'], 60: ['√3/2', '1/2', '√3'], 90: ['1', '0', 'не существует'],
             120: ['√3/2', '−1/2', '−√3'], 135: ['√2/2', '−√2/2', '−1'], 150: ['1/2', '−√3/2', '−√3/3'], 180: ['0', '−1', '0'] };
const sinS = d => EX[d] ? EX[d][0] : '≈ ' + fx(sinD(d), 3);
const cosS = d => EX[d] ? EX[d][1] : '≈ ' + fx(cosD(d), 3);
const tgS = d => EX[d] ? EX[d][2] : '≈ ' + fx(sinD(d) / cosD(d), 3);

const LESSONS = [
  { id: 'circle', title: 'Синус, косинус и тангенс от 0° до 180°',
    text: ['Возьмём полуокружность радиуса 1 с центром в начале координат — единичную полуокружность. Из центра O проведём луч под углом α к оси Ox, он пересечёт полуокружность в точке M(x; y). Для любого угла α от 0° до 180° по определению sin α = y, cos α = x. Для острого угла это те же отношения сторон прямоугольного треугольника с гипотенузой OM = 1.',
           'Точка M лежит не ниже оси Ox, поэтому 0 ≤ sin α ≤ 1. А абсцисса бывает и отрицательной: у тупого угла cos α < 0, например cos 120° = −1/2. Тангенс tg α = sin α : cos α, у тупого угла он тоже отрицательный. При α = 90° косинус равен 0, и tg 90° не существует. По теореме Пифагора sin²α + cos²α = 1.',
           'Точки для углов α и 180° − α симметричны относительно оси Oy: ордината одна и та же, абсциссы противоположны. Отсюда формулы приведения sin(180° − α) = sin α и cos(180° − α) = −cos α. Например, sin 150° = sin 30° = 1/2, cos 135° = −cos 45° = −√2/2. Если точка A лежит на луче на расстоянии OA от начала координат, то A(OA·cos α; OA·sin α).'],
    why: 'Разработчик игр и компьютерной графики поворачивает персонажа, камеру или луч света на любой угол, не только острый. Координаты после поворота он считает как (r·cos α; r·sin α), и при угле больше 90° косинус сам даёт минус: объект уходит влево. Инженер-робототехник так же задаёт угол в суставе манипулятора, который сгибается и дальше 90°. Через 10 лет код поворотов всё чаще будет писать ИИ, но заметить, что объект улетел не туда из-за знака косинуса, сможет тот, кто понимает единичную окружность.',
    task: 'Двигайте точку M по полуокружности. Найдите тупой угол с sin α = 1/2 и тупой угол с cos α = −1/2. Включите «180° − α» и сравните их с острыми углами.',
    hint: 'sin α — высота точки M над осью Ox. Высоту 1/2 имеют две точки: при 30° и симметричная ей относительно оси Oy. cos α = −1/2 — точка на половину радиуса левее оси Oy.',
    stage: 'Тащите точку M. Кнопки внизу меняют угол на 1° и 5°.',
    al: 40,
    check: m => m.found >= 2 && m.mirSeen },
  { id: 'sines', title: 'Теорема синусов',
    text: ['Площадь треугольника равна половине произведения двух сторон на синус угла между ними: S = ½ab·sin C. Высота, опущенная из вершины B на сторону b, равна a·sin C — и для острого, и для тупого угла C.',

function tri2(a, B, C) {
  const A = 180 - B - C, sA = sinD(A), b = a * sinD(B) / sA, c = a * sinD(C) / sA, R = a / (2 * sA);
  return { a, b, c, A, B, C, R, U: { B: { x: 0, y: 0 }, C: { x: a, y: 0 }, A: { x: c * cosD(B), y: c * sinD(B) }, O: { x: a / 2, y: R * cosD(A) } } };
}
function g2() {
  if (S.fix) return S.fix;
  const t = tri2(S.a2, S.B2, S.C2), s = Math.min(42, 268 / (2 * t.R));
  return { s, ox: 195 - t.U.O.x * s, oy: 160 + t.U.O.y * s };
}
function setTri(a, B, C) {
  a = clamp(Math.round(a * 2) / 2, 3, 9); B = clamp(Math.round(B / 5) * 5, 15, 135); C = clamp(Math.round(C / 5) * 5, 15, 135);
  if (180 - B - C < 20) return;
  if (a === S.a2 && B === S.B2 && C === S.C2) return;
  S.a2 = a; S.B2 = B; S.C2 = C; update();
}

function g3() {
  if (S.fix) return S.fix;

  const s = Math.min(44, 400 / (x1 - x0), 196 / Math.max(a * sinD(g), 1));
  return { s, ox: 260 - (x0 + x1) / 2 * s, oy: 248 };
}
const TGT3 = { '5-8': 60, '3-5': 120 };
function setCos(a, b, g) {
  a = clamp(Math.round(a * 2) / 2, 1, 9); b = clamp(Math.round(b * 2) / 2, 1, 9); g = clamp(Math.round(g), 5, 175);
  if (a === S.a3 && b === S.b3 && g === S.g3) return;
  S.a3 = a; S.b3 = b; S.g3 = g;
  const k = Math.min(a, b) + '-' + Math.max(a, b);

const TOWER_H = 72, TOWER_D = 50, TREE = { x: 45, y: 100 }, LAKE_CA = 300, LAKE_DIR = 130, PLOT_B = 80;
function model4() {
  const sc = S.sc, base = { kind: 'solve', sc, solved: S.solved.size, ok: S.solved.has(sc), pick: S.pick[sc] };
  if (sc === 'river') {
    const AB = S.xB, A = Math.atan2(TREE.y, TREE.x) / RAD, B = Math.atan2(TREE.y, AB - TREE.x) / RAD, C = 180 - A - B;
    return { ...base, AB, A, B, C, ans: AB * sinD(B) / sinD(C) };
  }
  if (sc === 'lake') {
    const a = LAKE_CA, b = S.lakeD, g = S.lakeG;
    return { ...base, CA: a, CB: b, g, ans: Math.sqrt(a * a + b * b - 2 * a * b * cosD(g)) };
  }
  if (sc === 'tower') {
    const x1 = S.x1, x2 = x1 - TOWER_D, al = Math.atan2(TOWER_H, x1) / RAD, be = Math.atan2(TOWER_H, x2) / RAD, T = be - al;
    const PT2 = TOWER_D * sinD(al) / sinD(T);
    return { ...base, x1, x2, d: TOWER_D, al, be, T, PT2, ans: PT2 * sinD(be) };
  }
  const a = S.plA, b = PLOT_B, g = S.plG;
  return { ...base, a, b, g, ans: 0.5 * a * b * sinD(g) };
}
function pick(p) {
  const sc = S.sc;
  S.pick[sc] = p;
  if (p === SC[sc].need) {
    if (!S.solved.has(sc)) { S.solved.add(sc); toast(`Верно: ${PICKL[p]}. Ход решения — во вкладке «Расчёты».`); }

}

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'circle') { const al = S.al; return { kind: id, al, s: sinD(al), c: cosD(al), found: S.found1.size, mir: S.mir, mirSeen: S.mirSeen }; }
  if (id === 'sines') {
    const t = tri2(S.a2, S.B2, S.C2), built = S.a2 === TASK2.a && S.B2 === TASK2.B && S.C2 === TASK2.C;
    const ansOk = S.ans2 !== null && ANS2[S.ans2].ok === true;
    return { kind: id, ...t, built, ansOk, hideB: built && !ansOk, k: t.a / sinD(t.A) };
  }
  if (id === 'cosines') {
    const a = S.a3, b = S.b3, g = S.g3, cs = cosD(g), c2 = a * a + b * b - 2 * a * b * cs, c = Math.sqrt(c2);
    const A = Math.acos(clamp((b * b + c2 - a * a) / (2 * b * c), -1, 1)) / RAD, B = 180 - g - A;
    return { kind: id, a, b, g, cs, c2, c, A, B, found: S.found3.size, c7: Math.abs(c - 7) < 0.005 };
  }
  return model4();
}

// angle mark at vertex V between rays to P and Q
function angArc(V, P, Q, r, col, label, fs = 11) {
  let a0 = dirOf(V, P), d = ((dirOf(V, Q) - a0) % 360 + 360) % 360;
  if (d > 180) { a0 = dirOf(V, Q); d = 360 - d; }
  let h = Math.abs(d - 90) < 0.01
    ? (() => { const u = PT(V, 11, a0), w = PT(V, 11, a0 + 90), z = PT(V, 11 * Math.SQRT2, a0 + 45); return `<path d="M${f1(u.x)} ${f1(u.y)}L${f1(z.x)} ${f1(z.y)}L${f1(w.x)} ${f1(w.y)}" fill="none" stroke="${col}" stroke-width="1.3"/>`; })()
    : `<path d="${sector(V, r, a0, a0 + d)}" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="1.2"/>`;
  if (label) { const lp = PT(V, r + (d < 35 ? 22 : 15), a0 + d / 2); h += txt(lp.x, lp.y + 4, label, fs, col, 'font-weight="600"'); }

}
// label for side PQ, pushed away from point G (the centroid)
function sideLbl(P, Q, G, s, col, gap = 7, fs = 11.5) {
  const md = { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 }; let nx = -(Q.y - P.y), ny = Q.x - P.x; const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
  if ((md.x - G.x) * nx + (md.y - G.y) * ny < 0) { nx = -nx; ny = -ny; }
  // push the text box (width ≈ 0.62 em per character) fully off the line
  const off = gap + s.length * fs * 0.31 * Math.abs(nx) + fs * 0.5 * Math.abs(ny);
  return txt(md.x + nx * off, md.y + ny * off + fs * 0.36, s, fs, col, 'font-weight="600"');
}
const vLbl = (V, G, s, col = FG) => { const dx = V.x - G.x, dy = V.y - G.y, L = Math.hypot(dx, dy) || 1; return txt(V.x + dx / L * 17, V.y + dy / L * 17 + 5, s, 13.5, col, 'font-weight="600"'); };

}

function drawSines() {

    line(O, A, 'rgba(183,156,255,.7)', 1.2, 'stroke-dasharray="3 3"') + dot(O, CC, 3) + txt(O.x + 9, O.y + 14, 'O', 11.5, CC, 'font-weight="600"') +

  h += `<g pointer-events="none">${vLbl(A, G, 'A')}${vLbl(B, G, 'B')}</g>` + knob('A2', A, CA, 'knobs') + knob('C2', C, FG, 'knobs') + `<g pointer-events="none">${vLbl(C, G, 'C')}</g>`;

function drawCosines() {
  const m = model(), g = g3(), s = g.s, C = { x: g.ox, y: g.oy }, A = { x: C.x + m.b * s, y: C.y }, B = { x: C.x + m.a * m.cs * s, y: C.y - m.a * sinD(m.g) * s }, H = { x: B.x, y: C.y };

    (m.g !== 90 ? line(B, H, 'rgba(232,236,244,.45)', 1.1, 'stroke-dasharray="3 3"') + thick(C, H, 'rgba(255,181,71,.55)', 1.6) + (m.cs < 0 ? txt(C.x - 8, C.y + 19, 'a·cos C ≈ ' + fx(m.a * m.cs, 2), 10, CA, 'text-anchor="end"') : txt((C.x + H.x) / 2, C.y + 36, 'a·cos C ≈ ' + fx(m.a * m.cs, 2), 10, CA)) : '') + '</g>';

function drawSolve() {

    h += `<g data-part="angs" pointer-events="none">${angArc(A, B, T, 26, CA, fx(m.A, 1) + '°')}${angArc(B, T, A, 26, CB, fx(m.B, 1) + '°')}</g>`;

    h += `<g pointer-events="none">${txt(A.x - 4, A.y + 20, 'A', 13.5, FG, 'font-weight="600"')}</g>` + dot(A, FG, 5) + knob('Br', B, CB, 'knob') + `<g pointer-events="none">${txt(B.x + 16, B.y + 20, 'B', 13.5, FG, 'font-weight="600"')}</g>`;
  } else if (m.sc === 'lake') {
    const C = P({ x: 0, y: 0 }), A = P(pol(LAKE_CA, LAKE_DIR)), B = P(pol(m.CB, LAKE_DIR - m.g)), G = { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };

    h += `<g data-part="angs" pointer-events="none">${angArc(C, B, A, 26, FG, m.g + '°')}</g>`;
    h += `<g data-part="answer" pointer-events="none">${line(A, B, ansCol, 1.8, 'stroke-dasharray="7 5"')}${sideLbl(A, B, G, m.ok ? `AB ≈ ${fx(m.ans, 0)} м` : 'AB = ?', ansCol, 7, 12.5)}</g>`;
    h += `<g pointer-events="none">${vLbl(C, G, 'C')}${vLbl(A, G, 'A')}</g>` + dot(C, FG, 5) + dot(A, CA, 5) + knob('Bl', B, CB, 'knob') + `<g pointer-events="none">${vLbl(B, G, 'B')}</g>`;
  } else if (m.sc === 'tower') {
    const T = P({ x: 0, y: TOWER_H }), P1 = P({ x: m.x1, y: 0 }), P2 = P({ x: m.x2, y: 0 }), g0 = D.oy;
    h += `<g data-part="land" pointer-events="none"><rect x="-400" y="${g0}" width="1320" height="200" fill="rgba(134,224,168,.07)"/>${line({ x: -400, y: g0 }, { x: 920, y: g0 }, 'rgba(169,180,201,.6)', 1.4)}` +
      `<path d="M${f1(P({ x: 8, y: 0 }).x)} ${g0}l6 14H${f1(P({ x: 30, y: 0 }).x - 6)}l6 -14Z" fill="rgba(95,180,217,.3)" stroke="${WA}" stroke-width="1.2"/>${say(P({ x: 19, y: 0 }).x, g0 + 30, 'ров', 11, WA, 'font-style="italic"')}</g>`;

      `<text x="510" y="96" font-size="12" fill="${CA}" text-anchor="end" font-weight="600">α ≈ ${fx(m.al, 1)}°</text><text x="510" y="114" font-size="12" fill="${CB}" text-anchor="end" font-weight="600">β ≈ ${fx(m.be, 1)}°</text></g>`;
    h += `<g data-part="dist" pointer-events="none">${line({ x: P2.x, y: g0 + 20 }, { x: P1.x, y: g0 + 20 }, FG, 1.2)}${line({ x: P2.x, y: g0 + 15 }, { x: P2.x, y: g0 + 25 }, FG, 1.2)}${line({ x: P1.x, y: g0 + 15 }, { x: P1.x, y: g0 + 25 }, FG, 1.2)}${txt((P1.x + P2.x) / 2, g0 + 35, `d = ${m.d} м`, 11.5, FG, 'font-weight="600"')}</g>`;
    h += dot(P2, CB, 5) + `<g pointer-events="none">${txt(P2.x, g0 - 10, 'P₂', 12, CB, 'font-weight="600"')}</g>` + knob('P1', P1, CA, 'knob') + `<g pointer-events="none">${txt(P1.x + 18, g0 - 10, 'P₁', 12, CA, 'font-weight="600"')}</g>`;
  } else {

    h += `<defs><pattern id="rows" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0H10" stroke="rgba(134,224,168,.3)" stroke-width="1.2"/></pattern></defs>`;

    h += `<g pointer-events="none">${vLbl(C, G, 'C')}${vLbl(A, G, 'A')}</g>` + dot(C, FG, 5) + dot(A, CB, 5) + knob('Bp', B, CA, 'knob') + `<g pointer-events="none">${vLbl(B, G, 'B')}</g>`;

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'circle' ? drawCircle() : id === 'sines' ? drawSines() : id === 'cosines' ? drawCosines() : drawSolve();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);

  // the scene goes either below both of them or to the right of the card, whichever is bigger
  const tb = $('#taskBox'), mt = $('#meter'), D = DIM[LID()];

  let r = null;
  for (const c of cands) { c.h = H0 - c.y - 54; if (c.w < 140 || c.h < 140) continue; c.s = Math.min(c.w / (D[0] + 16), c.h / (D[1] + 8), 1.8); if (!r || c.s > r.s) r = c; }
  if (!r) { r = cands[0]; r.h = Math.max(140, H0 - r.y - 54); r.s = Math.min(r.w / (D[0] + 16), r.h / (D[1] + 8), 1.8); }

    { id: 'knobs', name: 'Ручки B и A', spec: 'B меняет a и угол C, A — сторону b.' },

  const L = { river: [

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на поле</h2><p class="note">Нажмите на пункт, чтобы найти его на поле.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'circle') {
    const b = 180 - m.al;
    return `<h2>Точка на полуокружности</h2><div class="formula">M(cos α; sin α)</div><h3>Угол <span class="m">α = ${m.al}°</span></h3><div class="steps">` +
      step('sin α = y', sinS(m.al)) + step('cos α = x', cosS(m.al)) + step('tg α = sin α : cos α', tgS(m.al)) +
      step('sin²α + cos²α', `${fx(m.s * m.s, 3)} + ${fx(m.c * m.c, 3)} = 1`, 'sum') + step('угол', m.al < 90 ? 'острый, cos α > 0' : m.al > 90 ? 'тупой, cos α < 0' : 'прямой, cos α = 0') + `</div>` +
      `<h3>Угол <span class="m">180° − α = ${b}°</span></h3><div class="steps">` +
      step('sin(180° − α) = sin α', `${sinS(b)} = ${sinS(m.al)}`) + step('cos(180° − α) = −cos α', `${cosS(b)}`) + step('tg(180° − α) = −tg α', tgS(b)) + `</div>` +
      `<h3>Таблица</h3><div class="steps">` + [0, 30, 45, 60, 90, 120, 135, 150, 180].map(d => step(d + '°', `sin ${EX[d][0]} · cos ${EX[d][1]} · tg ${EX[d][2] === 'не существует' ? '—' : EX[d][2]}`)).join('') + `</div>`;
  }
  if (m.kind === 'sines') {
    return `<h2>Теорема синусов</h2><div class="formula">a : sin A = b : sin B = c : sin C = 2R</div><div class="steps">` +
      step('∠A = 180° − ∠B − ∠C', `180 − ${m.B} − ${m.C} = ${m.A}°`) +
      step('a : sin A', `${tr(m.a, 1)} : ${fx(sinD(m.A), 3)} ≈ ${fx(m.k, 2)}`) +
      step('b = a · sin B : sin A', m.hideB ? 'найдите сами' : `${tr(m.a, 1)} · ${fx(sinD(m.B), 3)} : ${fx(sinD(m.A), 3)} ≈ ${fx(m.b, 2)}`) +
      step('c = a · sin C : sin A', `${tr(m.a, 1)} · ${fx(sinD(m.C), 3)} : ${fx(sinD(m.A), 3)} ≈ ${fx(m.c, 2)}`) +
      step('R = a : (2 sin A)', `≈ ${fx(m.R, 2)}`, 'sum') + `</div>` +
      `<h3>Площадь</h3><div class="steps">` + step('S = ½ab·sin C', m.hideB ? 'после ответа' : `½ · ${tr(m.a, 1)} · ${fx(m.b, 2)} · ${fx(sinD(m.C), 3)} ≈ ${fx(0.5 * m.a * m.b * sinD(m.C), 2)}`) +
      step('S = ½ac·sin B', `½ · ${tr(m.a, 1)} · ${fx(m.c, 2)} · ${fx(sinD(m.B), 3)} ≈ ${fx(0.5 * m.a * m.c * sinD(m.B), 2)}`) + `</div>` +
      `<p class="note" style="margin-top:10px">Против большего угла лежит большая сторона: синусы растут вместе с углом до 90°, а для тупого угла sin(180° − α) = sin α.</p>`;
  }
  if (m.kind === 'cosines') {
    const k = m.g < 90 ? 'острый' : m.g > 90 ? 'тупой' : 'прямой';
    const big = Math.max(m.A, m.B, m.g), kind = big > 90.0001 ? 'тупоугольный' : Math.abs(big - 90) < 0.0001 ? 'прямоугольный' : 'остроугольный';
    return `<h2>Теорема косинусов</h2><div class="formula">c² = a² + b² − 2ab·cos C</div><div class="steps">` +
      step('a² + b²', `${tr(m.a * m.a)} + ${tr(m.b * m.b)} = ${tr(m.a * m.a + m.b * m.b)}`) +
      step('2ab·cos C', `2 · ${tr(m.a, 1)} · ${tr(m.b, 1)} · ${br(tr(m.cs, 3))} ≈ ${fx(2 * m.a * m.b * m.cs, 2)}`) +
      step('c²', `≈ ${fx(m.c2, 2)}`) + step('c = √c²', `≈ ${fx(m.c, 2)}`, 'sum') + `</div>` +
      `<h3>Обратно: угол по трём сторонам</h3><div class="steps">` +
      step('cos C = (a² + b² − c²) : 2ab', `${fx(m.a * m.a + m.b * m.b - m.c2, 2)} : ${tr(2 * m.a * m.b)} ≈ ${fx(m.cs, 3)}`) +
      step('угол C', `${m.g}°, ${k}`) + step('∠A по теореме косинусов', `≈ ${fx(m.A, 1)}°`) + step('∠B = 180° − ∠A − ∠C', `≈ ${fx(m.B, 1)}°`) +
      step('треугольник', kind, 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">${m.g === 90 ? 'При C = 90° поправка 2ab·cos C равна нулю — это теорема Пифагора.' : 'Сравните c² с a² + b²: разница и есть поправка −2ab·cos C.'}</p>`;
  }
  const D = SC[m.sc];
  let h = `<h2>${D.name}</h2><p class="note">${D.head[0].split(' · ')[1]}; ${D.head[1]}.</p><h3>Известно</h3><div class="steps">`;
  if (m.sc === 'river') h += step('база AB', m.AB + ' м') + step('∠A', fx(m.A, 1) + '°') + step('∠B', fx(m.B, 1) + '°');
  if (m.sc === 'lake') h += step('CA', m.CA + ' м') + step('CB', m.CB + ' м') + step('∠C', m.g + '°');
  if (m.sc === 'tower') h += step('d = P₁P₂', m.d + ' м') + step('α (из P₁)', fx(m.al, 1) + '°') + step('β (из P₂)', fx(m.be, 1) + '°');
  if (m.sc === 'plot') h += step('a', m.a + ' м') + step('b', m.b + ' м') + step('∠C', m.g + '°');
  h += `</div>`;
  if (!m.ok) return h + `<p class="note" style="margin-top:12px">Выберите формулу кнопкой под полем — здесь появится ход решения.</p>`;
  h += `<h3>Решение · ${PICKL[D.need]}</h3><div class="steps">`;
  if (m.sc === 'river') h += step('∠C = 180° − ∠A − ∠B', `≈ ${fx(m.C, 1)}°`) + step('AC : sin B = AB : sin C', '') + step('AC = AB · sin B : sin C', `${m.AB} · ${fx(sinD(m.B), 3)} : ${fx(sinD(m.C), 3)} ≈ ${fx(m.ans, 0)} м`, 'sum');
  if (m.sc === 'lake') h += step('AB² = CA² + CB² − 2·CA·CB·cos C', `${m.CA * m.CA} + ${m.CB * m.CB} − ${2 * m.CA * m.CB}·${fx(cosD(m.g), 3)}`) + step('AB²', `≈ ${fx(m.ans * m.ans, 0)}`) + step('AB', `≈ ${fx(m.ans, 0)} м`, 'sum');
  if (m.sc === 'tower') h += step('∠P₁TP₂ = β − α', `≈ ${fx(m.T, 1)}°`) + step('P₂T = d · sin α : sin(β − α)', `${m.d} · ${fx(sinD(m.al), 3)} : ${fx(sinD(m.T), 3)} ≈ ${fx(m.PT2, 1)} м`) +
    step('H = P₂T · sin β', `${fx(m.PT2, 1)} · ${fx(sinD(m.be), 3)} ≈ ${fx(m.ans, 0)} м`, 'sum');
  if (m.sc === 'plot') h += step('S = ½ab·sin C', `½ · ${m.a} · ${m.b} · ${fx(sinD(m.g), 3)}`) + step('S', `≈ ${fx(m.ans, 0)} м²`, 'sum');
  return h + `</div><p class="note" style="margin-top:10px">${{ river: 'Сторона AC лежит напротив угла B, а известная сторона AB — напротив угла C.', lake: 'Две стороны и угол между ними — классический случай теоремы косинусов.', tower: 'Сначала теорема синусов в △P₁P₂T, потом прямоугольный треугольник с вершиной T: H = P₂T · sin β.', plot: 'Площадь участка в гектарах: 1 га = 10 000 м².' }[m.sc]}</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'circle') el.innerHTML = `<div class="k">Угол <span class="m">α</span></div><div class="v ${ok ? 'ok' : ''}">${m.al}°</div><div class="lr"><span>sin</span><span>${sinS(m.al)}</span></div><div class="lr"><span>cos</span><span>${cosS(m.al)}</span></div><div class="lr"><span>tg</span><span>${EX[m.al] && m.al === 90 ? '—' : tgS(m.al)}</span></div>`;
  else if (m.kind === 'sines') el.innerHTML = `<div class="k">Диаметр 2R</div><div class="v ${ok ? 'ok' : ''}">≈ ${fx(2 * m.R, 2)}</div><div class="lr"><span>углы</span><span>${m.A}·${m.B}·${m.C}</span></div><div class="lr"><span>b</span><span class="${m.ansOk ? 'ok' : ''}">${m.hideB ? '?' : fx(m.b, 2)}</span></div>`;
  else if (m.kind === 'cosines') el.innerHTML = `<div class="k">Сторона c</div><div class="v ${m.c7 ? 'ok' : ''}">≈ ${fx(m.c, 2)}</div><div class="lr"><span>c²</span><span>${fx(m.c2, 2)}</span></div><div class="lr"><span>a² + b²</span><span>${tr(m.a * m.a + m.b * m.b)}</span></div><div class="lr"><span>найдено</span><span>${m.found} из 2</span></div>`;
  else el.innerHTML = `<div class="k">Решено задач</div><div class="v ${ok ? 'ok' : ''}">${m.solved} из 4</div><div class="lr"><span>${SC[m.sc].name}</span><span class="${m.ok ? 'ok' : ''}">${m.ok ? ansStr(m).split(' ≈ ')[1] : '?'}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Треугольники решены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  cosines: '<path d="M12 25H50" stroke="#72d4e8" stroke-width="2"/><path d="M12 25L24 6" stroke="#ffb547" stroke-width="2"/><path d="M24 6L50 25" stroke="#86e0a8" stroke-width="2"/><path d="M19 25A7 7 0 0 0 15.8 19" fill="none" stroke="#e8ecf4"/>',
  solve: '<rect x="0" y="9" width="66" height="9" fill="rgba(95,180,217,.35)"/><circle cx="26" cy="5" r="3.5" fill="#86e0a8"/><path d="M12 25L26 6L44 25" fill="none" stroke="#ffb547" stroke-dasharray="3 2"/><path d="M12 25H44" stroke="#e8ecf4" stroke-width="1.6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.fix = null;
  resetLesson();
  if (L.id === 'circle') { S.found1 = new Set(); S.mirSeen = false; }
  if (L.id === 'cosines') S.found3 = new Set();
  if (L.id === 'solve') { S.sc = 'river'; S.solved = new Set(); S.pick = {}; }
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {

  if (id === 'circle') now = `Единичная полуокружность с центром O. Точка M при угле α = ${m.al}°: sin α = ${sinS(m.al)}, cos α = ${cosS(m.al)}, tg α = ${tgS(m.al)}. Точка 180° − α ${m.mir ? 'показана (зелёная, симметрична M относительно оси y)' : 'скрыта'}. Найдено нужных углов: ${m.found} из 2 (${[...S.found1].map(k => k === 'sin' ? 'тупой угол с sin = 1/2' : 'тупой угол с cos = −1/2').join(', ') || 'пока ни одного'}); кнопку «180° − α» ${m.mirSeen ? 'включали' : 'ещё не включали'}.`;
  if (id === 'sines') now = `Треугольник ABC с описанной окружностью. ∠A = ${m.A}°, ∠B = ${m.B}°, ∠C = ${m.C}°, a = BC = ${tr(m.a, 1)}, c ≈ ${fx(m.c, 2)}, b ${m.hideB ? 'скрыта (это треугольник из задачи, ученик ищет b сам)' : '≈ ' + fx(m.b, 2)}. Отношения a : sin A = b : sin B = c : sin C ≈ ${fx(m.k, 2)} = 2R. Задача: ∠A = 45°, ∠B = 60°, a = 6, найти b. Треугольник ${m.built ? 'построен верно' : 'пока не совпадает с задачей'}; выбранный ответ: ${S.ans2 === null ? 'нет' : 'b ≈ ' + fx(ANS2[S.ans2].v, 2) + (m.ansOk ? ' (верно)' : ' (неверно)')}.`;
  if (id === 'cosines') now = `Треугольник ABC: a = CB = ${tr(m.a, 1)}, b = CA = ${tr(m.b, 1)}, угол C = ${m.g}°, c = AB ≈ ${fx(m.c, 2)}, c² ≈ ${fx(m.c2, 2)}, a² + b² = ${tr(m.a * m.a + m.b * m.b)}. Показана проекция a·cos C ≈ ${fx(m.a * m.cs, 2)} на прямую CA. Задание: c = 7 при a = 5, b = 8 и при a = 3, b = 5. Найдено: ${m.found} из 2 (${[...S.found3].join('; ') || 'пока ни одного'}).`;
  if (id === 'solve') {
    const k = { river: `база AB = ${m.AB} м, ∠A ≈ ${fx(m.A, 1)}°, ∠B ≈ ${fx(m.B, 1)}°, найти AC до дерева на другом берегу`, lake: `CA = ${m.CA} м, CB = ${m.CB} м, ∠C = ${m.g}°, найти AB через озеро`,
      tower: `d = ${m.d} м между точками P₁ и P₂, угол подъёма на вершину из P₁ α ≈ ${fx(m.al, 1)}°, из P₂ β ≈ ${fx(m.be, 1)}°, основание башни за рвом, найти высоту H`, plot: `стороны a = ${m.a} м, b = ${m.b} м, угол между ними C = ${m.g}°, найти площадь` }[m.sc];
    now = `Четыре задачи на местности, открыта «${SC[m.sc].name}»: ${k}. Ученик выбирает формулу кнопкой: теорема синусов, теорема косинусов или S = ½ab·sin C. Последний выбор здесь: ${m.pick ? PICKL[m.pick] : 'нет'}. Решены: ${[...S.solved].map(x => SC[x].name).join(', ') || 'пока ни одна'}.`;
  }
  return [
    `Раздел: математика, 9 класс, геометрия, тема «Теоремы синусов и косинусов» (соотношения между сторонами и углами треугольника). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (нужные углы, длину b, номер верной формулы): веди ученика наводящими вопросами и проверяй его вычисления.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    circle: 'Почему косинус тупого угла отрицательный?',
    sines: 'Как по теореме синусов измеряют расстояние до недоступной точки?',
    cosines: 'Почему при угле 90° получается теорема Пифагора?',
    solve: 'Как понять, какую теорему применять?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
