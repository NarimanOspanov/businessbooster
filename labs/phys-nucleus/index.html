<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .tl{font-size:12px;color:var(--muted);padding:0 4px 0 6px;white-space:nowrap}
.safe{border:1px solid rgba(255,138,115,.45);background:rgba(255,138,115,.08);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:4px 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:7px}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1600px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">

      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="20" cy="20" r="13" fill="none" stroke="var(--arm)" stroke-width="1.4" stroke-dasharray="2 3"/><circle cx="16.5" cy="17" r="4.2" fill="var(--warn)"/><circle cx="23.5" cy="17" r="4.2" fill="#a9b4c9"/><circle cx="16.5" cy="23.5" r="4.2" fill="#a9b4c9"/><circle cx="23.5" cy="23.5" r="4.2" fill="var(--warn)"/><circle cx="20" cy="20.2" r="4.2" fill="var(--force)"/></svg>

    </div>

  <section class="stage" id="stage" aria-label="Опытная площадка">

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const C1 = '#72d4e8', CP = '#ffb547', OK = '#86e0a8', WARN = '#ff8a73', MUT = '#8b96ad', PRO = '#ff8a73', NEU = '#a9b4c9';

const LESSONS = [
  { id: 'radio', title: 'Радиоактивность',
    text: ['В 1896 году Анри Беккерель заметил, что соли урана сами испускают невидимое излучение — оно засвечивало фотопластинку в чёрной бумаге. Мария и Пьер Кюри нашли ещё более сильные излучатели — полоний и радий. Это явление назвали радиоактивностью: неустойчивое ядро само превращается в другое ядро и испускает излучение.',
           'В магнитном поле пучок делится на три. α-лучи — ядра гелия, заряд +2e. β-лучи — быстрые электроны, заряд −e. γ-лучи — электромагнитное излучение, как свет, но с огромной энергией, заряда у них нет. α задерживает лист бумаги, β — несколько миллиметров алюминия, γ ослабляет только толстый слой свинца или бетона.',
           'Когда распадётся отдельное ядро, предсказать нельзя — это случай. Но для большого числа ядер есть закон: за период полураспада T½ распадается половина имеющихся ядер. Через два периода остаётся четверть, через три — восьмая часть: N = N₀ · 2^(−t/T½).'],
    why: 'Дозиметристы и радиационные инженеры работают на урановых рудниках «Казатомпрома», на Ульбинском заводе и в Институте ядерной физики. Радиологи лечат опухоли γ-лучами кобальта-60, а йод-131 помогает при болезнях щитовидной железы. Дефектоскописты γ-лучами просвечивают сварные швы газопроводов и мостов — это хорошо оплачиваемая работа. Археологи по распаду углерода-14 узнают возраст находок.',
    safety: 'Радиоактивные источники нельзя трогать и брать домой. Если нашли металлический предмет со знаком «трилистник», не поднимайте его, отойдите подальше и сообщите взрослым или позвоните 112.',
    task: 'Режим «Лучи»: включите магнитное поле и узнайте, куда отклоняется каждый луч. Поставьте бумагу и алюминий — что они задерживают? Режим «Распад»: дождитесь, когда распадётся половина ядер.',
    hint: 'Кнопки «Лучи» и «Распад» переключают опыт. Ядра в сетке тоже можно нажимать: они покажут, что с ними стало. Распад случайный — каждый запуск чуть отличается.',
    stage: 'Включите поле и ставьте преграды на пути лучей.',
    check: m => m.field && m.paper && m.al && m.half },
  { id: 'nucleus', title: 'Состав ядра',
    text: ['Ядро состоит из протонов и нейтронов, их вместе называют нуклонами. Число протонов Z — зарядовое число, оно задаёт элемент. Массовое число A = Z + N, где N — число нейтронов. Ядро записывают так: перед символом элемента сверху ставят A, снизу Z, например ⁴₂He.',
           'Протоны заряжены одинаково и отталкиваются. Ядро не разлетается, потому что нуклоны держат ядерные силы. Они примерно в 100 раз сильнее электрических, но действуют только на крошечном расстоянии — около 10⁻¹⁵ м.',
           'Масса ядра чуть меньше, чем сумма масс отдельных протонов и нейтронов. Эта разница — дефект масс Δm. По формуле Эйнштейна ей соответствует энергия связи E = Δm · c². Столько энергии нужно, чтобы разобрать ядро на нуклоны, и столько же выделяется, когда ядро собирается.'],
    why: 'На энергии связи держится вся атомная энергетика: при делении урана и при слиянии водорода в гелий часть энергии связи выходит наружу. Инженеры Ульбинского завода в Усть-Каменогорске делают топливо для реакторов. Масс-спектрометристы в лабораториях взвешивают ядра с точностью до миллионных долей — так проверяют состав руды, лекарств и продуктов.',

function particle(A, Z) {
  if (A === 1 && Z === 1) return { s: 'p', name: 'протон', ok: true };
  if (A === 1 && Z === 0) return { s: 'n', name: 'нейтрон', ok: true };
  if (A === 0 && Z === -1) return { s: 'e', name: 'электрон (β-частица)', ok: true };
  if (A === 0 && Z === 1) return { s: 'e⁺', name: 'позитрон', ok: true };
  if (A === 0 && Z === 0) return { s: 'γ', name: 'γ-квант', ok: true };
  if (A === 4 && Z === 2) return { s: 'He', name: 'α-частица, ядро гелия', ok: true };
  if (Z >= 1 && Z <= 92 && A >= Z && A <= 3.2 * Z + 4) return { s: SYM[Z], name: `ядро: ${elName(Z)}-${A}`, ok: true };
  return { s: '?', name: 'такой частицы нет', ok: false };
}

const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;

// nuclide notation: A up-left, Z down-left, symbol; returns {h, w}
function nota(A, Z, sym, x, y, fs, col, anchor = 'start') {
  const sA = String(A), sZ = String(Z).replace('-', '−'), dw = 0.62 * fs * 0.55 * Math.max(sA.length, sZ.length), sw = 0.62 * fs * [...sym].length, w = dw + 2 + sw;
  const x0 = anchor === 'middle' ? x - w / 2 : x;
  const h = T(x0 + dw, y - fs * 0.42, fs * 0.55, col, sA, 'end') + T(x0 + dw, y + fs * 0.22, fs * 0.55, col, sZ, 'end') + T(x0 + dw + 2, y, fs, col, sym, 'start', 'font-weight="500"');
  return { h, w };
}

function rayY(k, x) {

  if (x <= G.f1) { const u = (x - G.f0) / (G.f1 - G.f0); return G.y0 + d * u * u; }
  return G.y0 + d + 2 * d / (G.f1 - G.f0) * (x - G.f1);
}

// fit the scene: 520 × 405 units, centred, content at the bottom

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);

  if (id === 'nucleus') { if (S.glue > 0) { S.glue = Math.max(0, S.glue - dt * 1.2); dirty = true; } else if (!reduce && !beOf(S.Z, S.N)) dirty = true; }

      <div class="ctl"><div class="lbl">Преграда</div><div class="chips">${[['none', 'нет'], ['paper', 'бумага'], ['al', 'алюминий 3 мм'], ['pb', 'свинец 5 см']].map(([k, n]) => `<button data-a="ab-${k}" aria-pressed="${S.ab === k}">${n}</button>`).join('')}</div></div>

    else h += `<div class="ctl"><div class="lbl">Изотоп</div><div class="chips">${ISO.map((q, i) => `<button data-a="iso-${i}" aria-pressed="${S.iso === i}">${q.name}</button>`).join('')}</div></div>

      <div class="row"><button class="ghostbtn" data-a="run">Пуск / пауза</button><button class="ghostbtn" data-a="dreset">Сброс</button></div>
      <p class="note" style="margin-top:12px">В лаборатории один период полураспада идёт 2,5 секунды, какой бы ни был изотоп.</p>`;
  }

    `<div class="ctl"><div class="lbl">Быстро</div><div class="chips">${L().targets.concat([{ Z: 92, A: 235, s: 'U' }]).map(tg => `<button data-q="${tg.Z}-${tg.A - tg.Z}">${tg.s}: ${tg.Z} p, ${tg.A - tg.Z} n</button>`).join('')}</div></div>
    <dl class="reads"><div><dt>A = Z + N</dt><dd id="r1"></dd></div><div><dt>E связи</dt><dd id="r2"></dd></div><div><dt>на нуклон</dt><dd id="r3"></dd></div></dl>
    <p class="note" style="margin-top:12px">Кнопки «Быстро» сразу ставят состав — но для задания сначала попробуйте найти его сами по записи ядра.</p>`;
  if (id === 'reactions') h = `<h2>Неизвестная частица</h2><div class="ctl"><div class="lbl">Реакция</div><div class="chips">${RX.map((r, i) => `<button data-a="r-${i}" aria-pressed="${S.r === i}">${i + 1}${S.solved[r.id] ? ' ✓' : ''}</button>`).join('')}</div></div>` +
    slider('inA', 'Массовое число A', 0, 240, 1, S.un[S.r].A) + slider('inZr', 'Зарядовое число Z', -1, 92, 1, S.un[S.r].Z) +
    `<dl class="reads"><div><dt>A слева</dt><dd id="r1"></dd></div><div><dt>A справа</dt><dd id="r2"></dd></div><div><dt>частица</dt><dd id="r5"></dd></div><div><dt>Z слева</dt><dd id="r3"></dd></div><div><dt>Z справа</dt><dd id="r4"></dd></div></dl>`;
  if (id === 'npp') h = `<h2>Пульт реактора</h2>` + slider('inH', 'Стержни в активной зоне', 0, 100, 0.5, S.h * 100) +
    `<div class="ctl"><div class="lbl">Насосы</div><div class="chips"><button data-a="pump" aria-pressed="${S.pump}">${S.pump ? 'работают' : 'стоят'}</button></div></div>
    <dl class="reads"><div><dt>мощность</dt><dd id="r1"></dd></div><div><dt>k</dt><dd id="r2"></dd></div><div><dt>вода</dt><dd id="r3"></dd></div><div><dt>тепло</dt><dd id="r4"></dd></div><div><dt>ток</dt><dd id="r5"></dd></div><div><dt>удержано</dt><dd id="r6"></dd></div></dl>
    <div class="row"><button class="ghostbtn" data-a="scram">Аварийная защита</button><button class="ghostbtn" data-a="reset">Сброс</button></div>
    <p class="note" style="margin-top:12px">Модель упрощена: время в ней идёт быстрее, а мощность нагревом сама немного снижает k — так устроены настоящие водяные реакторы.</p>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inZ', e => setNuc(+e.target.value, S.N));
  on('#inN', e => setNuc(S.Z, +e.target.value));
  on('#inA', e => setUn(0, 0, [+e.target.value, S.un[S.r].Z]));
  on('#inZr', e => setUn(0, 0, [S.un[S.r].A, +e.target.value]));
  on('#inH', e => { setH(+e.target.value / 100); renderTools(); updateScheme(model()); });
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const [z, n] = b.dataset.q.split('-').map(Number); setNuc(z, n); buildScheme(); });
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    act(a); if (/^(rays|decay|field|ab-|iso-|r-|pump|scram|reset)/.test(a)) buildScheme();
    updateScheme(model());
  });
  updateScheme(model());
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'radio') {
    if (S.mode === 'rays') { for (const [k, r] of [['a', '#r1'], ['b', '#r2'], ['g', '#r3']]) set(r, stops(k, S.ab) ? 'задержан' : (S.ab === 'pb' && k === 'g' ? 'ослаблен' : 'проходит')); }
    else { const iso = ISO[S.iso]; set('#r1', fmtT(iso.T, iso)); set('#r2', fmtT(S.dt * iso.T, iso)); set('#r3', nLeft()); set('#r4', fmt(100 * 2 ** -S.dt, 0)); set('#r5', S.halfT === null ? '—' : fmtT(S.halfT * iso.T, iso)); }
  }
  if (id === 'nucleus') { set('#inZO', S.Z); set('#inNO', S.N); val('#inZ', S.Z); val('#inN', S.N); set('#r1', m.A); set('#r2', m.be ? fmt(m.be, 1) + ' МэВ' : '—'); set('#r3', m.be && m.A > 1 ? fmt(m.be / m.A, 2) + ' МэВ' : '—'); }
  if (id === 'reactions') { const s = sides(S.r), u = S.un[S.r]; set('#inAO', u.A); set('#inZrO', String(u.Z).replace('-', '−')); val('#inA', u.A); val('#inZr', u.Z); set('#r1', s.AL); set('#r2', s.AR); set('#r3', String(s.ZL).replace('-', '−')); set('#r4', String(s.ZR).replace('-', '−')); set('#r5', particle(u.A, u.Z).s); }
  if (id === 'npp') { set('#inHO', fmt(S.h * 100, 1) + ' %'); val('#inH', S.h * 100); set('#r1', fmt(S.P, S.P < 10 ? 1 : 0) + ' %'); set('#r2', fmt(m.k, 3)); set('#r3', fmt(S.Tc, 0) + ' °C'); set('#r4', fmt(3000 * S.P / 100, 0) + ' МВт'); set('#r5', fmt(m.Pel, 0) + ' МВт'); set('#r6', fmt(Math.min(m.hold, 5), 1) + ' с'); }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'radio') {
    const iso = ISO[S.iso], tt = S.dt;
    let h = `<h2>Закон радиоактивного распада</h2><div class="formula">N = N₀ · 2<sup>−t/T½</sup></div><p class="note">N₀ — сколько ядер было, N — сколько осталось через время t, T½ — период полураспада.</p>
      <h3>Сейчас: ${iso.name}</h3><div class="steps">` + step('N₀', '100 ядер') + step('T½', fmtT(iso.T, iso)) + step('прошло t', fmtT(tt * iso.T, iso)) +
      step('t / T½', fmt(tt, 2)) + step('2<sup>−t/T½</sup>', fmt(2 ** -tt, 3)) + step('по закону N', `100 · ${fmt(2 ** -tt, 3)} ≈ ${fmt(100 * 2 ** -tt, 0)}`, 'sum') + step('в опыте N', `${nLeft()}`) + `</div>
      <p class="note" style="margin-top:8px">Опыт и закон немного расходятся: ядер всего 100, а распад случаен. Чем больше ядер, тем точнее закон. В крупинке вещества их миллиарды миллиардов.</p>
      <h3>Три вида излучения</h3><div class="steps">` + step('α: ядро гелия ⁴₂He', 'заряд +2e · стоп: бумага') + step('β: электрон', 'заряд −e · стоп: алюминий') + step('γ: квант света', 'заряда нет · ослабляет свинец') + `</div>`;
    return h;
  }
  if (id === 'nucleus') {
    const A = m.A, mf = S.Z * MP + S.N * MN;
    let h = `<h2>Дефект масс и энергия связи</h2><div class="formula">Δm = Z·m<sub>p</sub> + N·m<sub>n</sub> − M<sub>я</sub></div><div class="formula">E<sub>св</sub> = Δm · c²</div><p class="note">1 а.е.м. = 1,66 · 10⁻²⁷ кг. Ей соответствует энергия 931,5 МэВ, поэтому удобно: E (МэВ) = Δm (а.е.м.) · 931,5.</p>
      <h3>Сейчас: ${elName(S.Z)}-${A}</h3><div class="steps">` + step('Z · m<sub>p</sub>', `${S.Z} · 1,00728 = ${fmt(S.Z * MP, 5)}`) + step('N · m<sub>n</sub>', `${S.N} · 1,00866 = ${fmt(S.N * MN, 5)}`) + step('нуклоны врозь', `${fmt(mf, 5)} а.е.м.`);
    if (m.be && A > 1) {
      const dm = m.be / UMEV;
      h += step('масса ядра M<sub>я</sub>', `${fmt(mf - dm, 5)} а.е.м.`) + step('Δm', `${fmt(dm, 5)} а.е.м.`) + step('E<sub>св</sub>', `${fmt(dm, 5)} · 931,5 ≈ ${fmt(m.be, 1)} МэВ`, 'sum') + step('на нуклон', `${fmt(m.be, 1)} / ${A} = ${fmt(m.be / A, 2)} МэВ`, 'sum') + step('в джоулях', `${fmt(m.be * 1.602 / 10, 2)} · 10⁻¹² Дж`);
    } else h += step('масса ядра', A === 1 ? 'это один протон' : 'нет в таблице лаборатории');
    h += `</div><h3>Собранные ядра</h3><div class="steps">` + L().targets.map(tg => step(`${tg.s}-${tg.A}`, S.found[tg.s] ? `${fmt(BE[tg.Z + '-' + tg.A] / tg.A, 2)} МэВ на нуклон` : 'ещё не собрано')).join('') + `</div>
      <p class="note" style="margin-top:8px">Чем больше энергия связи на нуклон, тем прочнее ядро. Лёгким ядрам выгодно сливаться, тяжёлым — делиться: в обоих случаях выделяется энергия.</p>`;
    return h;
  }
  if (id === 'reactions') {
    const R = RX[S.r], u = S.un[S.r], s = sides(S.r);
    const show = arr => arr.map(q => q ? q : [u.A, u.Z]);
    const sumA = arr => show(arr).map(q => q[0]).join(' + '), sumZ = arr => show(arr).map(q => String(q[1]).replace('-', '−')).join(' + ');
    return `<h2>Законы сохранения</h2><div class="formula">ΣA до = ΣA после</div><div class="formula">ΣZ до = ΣZ после</div>
      <h3>Реакция ${S.r + 1}: ${R.name}</h3><div class="steps">` +
      step('A слева', `${sumA(R.L)} = ${s.AL}`) + step('A справа', `${sumA(R.R)} = ${s.AR}`) + step('A', s.AL === s.AR ? 'сходится ✓' : `не хватает ${s.AL - s.AR > 0 ? s.AL - s.AR : 'лишнее: ' + (s.AR - s.AL)}`.replace('не хватает лишнее', 'лишнее'), 'sum') +
      step('Z слева', `${sumZ(R.L)} = ${String(s.ZL).replace('-', '−')}`) + step('Z справа', `${sumZ(R.R)} = ${String(s.ZR).replace('-', '−')}`) + step('Z', s.ZL === s.ZR ? 'сходится ✓' : 'пока не сходится', 'sum') +
      step('«?» сейчас', particle(u.A, u.Z).name) + `</div>
      <h3>Правила смещения</h3><div class="steps">` + step('α-распад', 'A − 4, Z − 2') + step('β-распад', 'A не меняется, Z + 1') + step('γ-излучение', 'A и Z не меняются') + `</div>`;
  }
  const P = S.P, Pth = 3000 * P / 100, fis = Pth * 1e6 / 3.2e-11, kgDay = fis * 86400 / 6.02e23 * 0.235;
  const sci = v => { if (v <= 0) return '0'; const e = Math.floor(Math.log10(v)); return `${fmt(v / 10 ** e, 1)} · 10${String(e).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).replace('-', '⁻')}`; };
  return `<h2>Энергия деления</h2><div class="formula">²³⁵U + n → ¹⁴¹Ba + ⁹²Kr + 3n + 200 МэВ</div><div class="formula">P<sub>эл</sub> = η · P<sub>тепл</sub></div>
    <h3>Сейчас</h3><div class="steps">` + step('коэффициент k', `${fmt(kOf(), 3)} → ${kOf() > 1.0005 ? 'мощность растёт' : kOf() < 0.9995 ? 'мощность падает' : 'мощность постоянна'}`) +
    step('тепловая мощность', `3000 МВт · ${fmt(P, 1)} % = ${fmt(Pth, 0)} МВт`) + step('энергия одного деления', '200 МэВ = 3,2 · 10⁻¹¹ Дж') +
    step('делений в секунду', `${fmt(Pth, 0)} · 10⁶ / 3,2 · 10⁻¹¹ ≈ ${sci(fis)}`) + step('урана-235 за сутки', `≈ ${fmt(kgDay, 2)} кг`, 'sum') +
    step('электрическая мощность', `0,33 · ${fmt(Pth, 0)} ≈ ${fmt(Pth * 0.33, 0)} МВт`, 'sum') + `</div>
    <p class="note" style="margin-top:8px">1 кг урана-235 при полном делении даёт около 8 · 10¹³ Дж — столько же, сколько сгорание примерно 2800 тонн каменного угля. Поэтому АЭС почти не нужны поезда с топливом и она не выбрасывает углекислый газ.</p>`;
}

  const id = LID(), el = $('#meter');
  if (id === 'radio') {
    if (S.mode === 'rays') el.innerHTML = `<div class="k">Излучение радия</div><div class="v">${S.field ? 'поле вкл' : 'поле выкл'}</div>` + ['a', 'b', 'g'].map(k => `<div class="lr"><span>${RNAME[k]}</span><span class="${stops(k, S.ab) ? 'bad' : 'ok'}">${stops(k, S.ab) ? 'стоп' : 'проходит'}</span></div>`).join('');
    else { const iso = ISO[S.iso]; el.innerHTML = `<div class="k">${iso.name}</div><div class="v ${m.half ? 'ok' : ''}">N = ${m.N}</div><div class="lr"><span>t</span><span>${fmtT(S.dt * iso.T, iso)}</span></div><div class="lr"><span>закон</span><span>${fmt(100 * 2 ** -S.dt, 0)}</span></div>`; }
  } else if (id === 'nucleus') el.innerHTML = `<div class="k">${elName(S.Z)}-${m.A}</div><div class="v ${m.be ? 'ok' : ''}">${m.be && m.A > 1 ? fmt(m.be / m.A, 2) + ' МэВ' : '—'}</div><div class="lr"><span>p · n</span><span>${S.Z} · ${S.N}</span></div><div class="lr"><span>E св</span><span>${m.be ? fmt(m.be, 1) : '—'}</span></div>`;
  else if (id === 'reactions') { const s = sides(S.r); el.innerHTML = `<div class="k">Реакция ${S.r + 1}</div><div class="v ${m.bal ? 'ok' : ''}">${m.bal ? 'сходится' : 'не сходится'}</div><div class="lr"><span>A</span><span class="${s.AL === s.AR ? 'ok' : 'bad'}">${s.AL} | ${s.AR}</span></div><div class="lr"><span>Z</span><span class="${s.ZL === s.ZR ? 'ok' : 'bad'}">${String(s.ZL).replace('-', '−')} | ${String(s.ZR).replace('-', '−')}</span></div>`; }
  else el.innerHTML = `<div class="k">Реактор</div><div class="v ${S.P >= 95 && S.P <= 105 ? 'ok' : ''}">${fmt(S.P, S.P < 10 ? 1 : 0)} %</div><div class="lr"><span>k</span><span>${fmt(m.k, 3)}</span></div><div class="lr"><span>вода</span><span class="${S.Tc > 330 ? 'bad' : ''}">${fmt(S.Tc, 0)} °C</span></div><div class="lr"><span>ток</span><span>${fmt(m.Pel, 0)} МВт</span></div>`;
}

function update(light) {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как устроено ядро и как работает АЭС!'), 2200);
    light = false;
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  if (light) {
    const ov = $('#ovState'); if (ov && S.tab === 'overview') ov.textContent = taskState(m);
    if (S.tab === 'scheme') updateScheme(m);
    if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
  } else renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  radio: '<rect x="2" y="10" width="12" height="10" rx="2" fill="#3b4459"/><path d="M14 15h12q14 0 34 -10" stroke="#72d4e8" stroke-width="1.4" fill="none"/><path d="M26 15h34" stroke="#c3a8ff" stroke-width="1.4"/><path d="M26 15q14 0 34 5" stroke="#ffb547" stroke-width="1.4" fill="none"/>',
  nucleus: '<circle cx="20" cy="13" r="4" fill="#ff8a73"/><circle cx="27" cy="13" r="4" fill="#a9b4c9"/><circle cx="20" cy="20" r="4" fill="#a9b4c9"/><circle cx="27" cy="20" r="4" fill="#ff8a73"/><path d="M42 24h18M51 24V8M41 10l20 -3" stroke="#8b96ad" stroke-width="1.4"/>',
  reactions: '<text x="4" y="20" font-size="10" fill="#e8ecf4" font-family="monospace">N+α→O+</text><rect x="50" y="9" width="12" height="14" rx="3" fill="none" stroke="#ffb547" stroke-dasharray="2 2"/>',
  npp: '<rect x="4" y="6" width="16" height="20" rx="4" fill="rgba(95,180,217,.3)" stroke="#8b96ad"/><rect x="8" y="12" width="3" height="12" fill="#ffcf80"/><rect x="13" y="6" width="3" height="10" fill="#2b3245" stroke="#8b96ad" stroke-width=".6"/><path d="M20 10h14" stroke="#ffb547" stroke-width="2"/><path d="M34 8l12 -3v18l-12 -3z" fill="#3b4459"/><rect x="50" y="9" width="12" height="10" rx="2" fill="#2b3245" stroke="#8b96ad"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // centre the active card by scrolling only the strip, never the page
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'radio') {
    const iso = ISO[S.iso];
    now = S.mode === 'rays'
      ? `Опыт «Лучи»: пучок от радия, магнитное поле ${S.field ? 'включено (направлено на зрителя): α отклоняются слабо вниз, β сильно вверх, γ прямо' : 'выключено, три вида лучей летят одним пучком'}. Преграда: ${({ none: 'нет', paper: 'лист бумаги', al: 'алюминий 3 мм', pb: 'свинец 5 см' })[S.ab]}. Проходят: ${['a', 'b', 'g'].filter(k => !stops(k, S.ab)).map(k => RNAME[k]).join(', ') || 'ничего'}.`
      : `Опыт «Распад»: ${iso.name}, T½ по таблице ${fmtT(iso.T, iso)}. Прошло ${fmtT(S.dt * iso.T, iso)} (${fmt(S.dt, 2)} T½), осталось ${nLeft()} ядер из 100, по закону ${fmt(100 * 2 ** -S.dt, 0)}. Таймер ${S.run ? 'идёт' : 'стоит'}. ${S.halfT !== null ? `Половина распалась через ${fmtT(S.halfT * iso.T, iso)}.` : 'Половина ещё не распалась.'}`;
    now += ` Отмечено: поле ${S.seen.field ? 'да' : 'нет'}, бумага ${S.seen.paper ? 'да' : 'нет'}, алюминий ${S.seen.al ? 'да' : 'нет'}, полураспад ${S.halfT !== null ? 'да' : 'нет'}.`;
  }
  if (id === 'nucleus') now = `Собрано ядро: протонов Z = ${S.Z}, нейтронов N = ${S.N}, A = ${m.A}, элемент ${elName(S.Z)} (${SYM[S.Z]}). ${m.be ? `Энергия связи ${fmt(m.be, 1)} МэВ, на нуклон ${m.A > 1 ? fmt(m.be / m.A, 2) : 0} МэВ, дефект масс ${fmt(m.be / UMEV, 4)} а.е.м.` : 'Такого устойчивого ядра нет в таблице лаборатории.'} Цели: ${L().targets.map(tg => `${tg.s}-${tg.A} ${S.found[tg.s] ? 'собрано' : 'не собрано'}`).join(', ')}. Выбор самого прочного: ${S.pick ? S.pick + (S.pick === 'Fe' ? ' (верно)' : ' (неверно)') : 'ещё не сделан'}. Не называй состав ядер и самое прочное ядро — спрашивай, как найти N по записи и как сравнить прочность.`;
  if (id === 'reactions') {
    const R = RX[S.r], u = S.un[S.r], s = sides(S.r);
    now = `Реакция ${S.r + 1} из 4 (${R.name}). Неизвестная частица сейчас: A = ${u.A}, Z = ${u.Z} (${particle(u.A, u.Z).name}). Суммы: A слева ${s.AL}, справа ${s.AR}; Z слева ${s.ZL}, справа ${s.ZR}. Дописаны реакции: ${RX.filter(r => S.solved[r.id]).map(r => RX.indexOf(r) + 1).join(', ') || 'ни одной'}. Не называй ответ — помоги посчитать суммы и понять, какой элемент имеет такой Z.`;
  }
  if (id === 'npp') now = `Модель АЭС с водяным реактором 3000 МВт тепловых. Управляющие стержни введены на ${fmt(S.h * 100, 1)} %, k = ${fmt(m.k, 3)}, мощность ${fmt(S.P, 1)} %, вода ${fmt(S.Tc, 0)} °C, насосы ${S.pump ? 'работают' : 'стоят'}, электрическая мощность ${fmt(m.Pel, 0)} МВт. ${S.scram ? 'Сработала аварийная защита.' : ''} Удержание 95–105 %: ${fmt(Math.min(m.hold, 5), 1)} из 5 с. Помогай понять связь k и роста мощности, не диктуй точное положение стержней.`;
  return [
    `Раздел: физика, 9 класс, «Атом и Вселенная», тема «Атомное ядро». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { radio: 'Почему β-лучи отклоняются в другую сторону, чем α?', nucleus: 'Почему ядро легче, чем протоны и нейтроны по отдельности?', reactions: 'Как по A и Z узнать, что за частица вылетела?', npp: 'Почему мощность реактора растёт, если k чуть больше 1?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
