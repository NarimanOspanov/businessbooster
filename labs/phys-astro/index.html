<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 11 класс: законы Кеплера и Солнечная система, звёзды и диаграмма Герцшпрунга–Рассела, типы галактик, закон Хаббла и расширение Вселенной.">
<title>Астрофизика</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:124px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 152px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="var(--arm)" stroke-width="1.4" transform="rotate(-20 20 20)"/><circle cx="20" cy="20" r="4.5" fill="var(--force)"/><circle cx="32" cy="15.6" r="2.2" fill="var(--fg)"/><circle cx="9" cy="9" r="1" fill="var(--muted)"/><circle cx="31" cy="32" r="1" fill="var(--muted)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Физика · Астрофизика</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Астрофизика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов по астрофизике: орбиты планет, диаграмма звёзд, галактики и спектры."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
// whole numbers with thin-space thousands separators
const fint = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ').replace('-', '−');
// about three significant digits, never drops zeros of whole numbers
const fsig = x => {
  if (!isFinite(x)) return '∞';
  const a = Math.abs(x);
  if (a >= 100) return fint(x);
  if (a >= 10) return fmt(x, 1);
  if (a >= 1) return fmt(x, 2);
  if (a === 0) return '0';
  const d = clamp(2 - Math.floor(Math.log10(a)), 2, 8);
  return fmt(x, d);
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const RAD = Math.PI / 180;

const LESSONS = [
  { id: 'solar', title: 'Солнечная система и законы Кеплера',
    text: ['Солнечная система — это Солнце и всё, что вокруг него движется: восемь планет с их спутниками, карликовые планеты, астероиды и кометы. На Солнце приходится 99,8 % массы системы, поэтому его притяжение управляет движением остальных тел.',
           'Планеты движутся по эллипсам, и Солнце находится в одном из фокусов — это I закон Кеплера. Ближайшая к Солнцу точка орбиты называется перигелием, самая далёкая — афелием. Радиус-вектор планеты за равные промежутки времени заметает равные площади (II закон). Поэтому у Солнца планета идёт быстрее, а вдали — медленнее.',
           'III закон Кеплера: квадраты периодов обращения планет относятся как кубы больших полуосей их орбит. Если период мерить в годах, а полуось в астрономических единицах (1 а. е. ≈ 150 млн км, расстояние от Земли до Солнца), то T² = a³. Этот закон следует из закона всемирного тяготения Ньютона.'],
    why: 'По законам Кеплера и Ньютона инженеры-баллистики рассчитывают орбиты спутников и полёты к планетам. С Байконура уходят корабли к МКС, а казахстанские спутники связи KazSat и спутники съёмки Земли KazEOSat работают на точно рассчитанных орбитах: телевидение, интернет, снимки полей и паводков. GPS в телефоне и в такси работает только потому, что орбиты навигационных спутников известны с точностью до метров.',
    safe: 'Никогда не смотрите на Солнце в бинокль, телескоп или фотоаппарат без специального солнечного фильтра — можно мгновенно и навсегда повредить глаза. Тёмные очки и закопчённое стекло не защищают.',
    task: 'Перетаскивая точки П и А, найдите орбиту с периодом как у Юпитера — 11,9 года (±0,5). Затем вытяните любую орбиту до e ≥ 0,5 и сравните скорости в перигелии и афелии.',
    hint: 'Большая полуось a — половина расстояния от П до А. По III закону T = a·√a. Скорости в перигелии и афелии показаны стрелками и на табло.',
    stage: 'Тащите точки П и А вдоль оси.',
    rp0: 1, ra0: 1,
    check: m => m.jup && m.ecc },
  { id: 'stars', title: 'Звёзды на диаграмме Г–Р',
    text: ['Звезда — огромный раскалённый газовый шар. В её ядре идут термоядерные реакции: водород превращается в гелий, и выделяется энергия. Главное свойство звезды — масса. От неё зависят светимость, температура, размер и срок жизни.',
           'Светимость L — мощность излучения звезды; её сравнивают со светимостью Солнца L☉. По закону Стефана–Больцмана L = 4πR²σT⁴: чем больше радиус и чем горячее поверхность, тем ярче звезда. Цвет зависит от температуры (закон Вина λmax = b / T): красные звёзды холоднее 4000 К, голубые — горячее 10 000 К.',
           'На диаграмме Герцшпрунга–Рассела по горизонтали отложена температура (горячие звёзды слева), по вертикали — светимость. Большинство звёзд лежат на главной последовательности — пока в ядре горит водород. Массивные звёзды горячее и ярче, но тратят топливо быстрее и живут меньше. Потом звезда раздувается в гиганта, а в конце становится белым карликом, нейтронной звездой или чёрной дырой.'],

const LS_KEY = 'luch-phys-astro';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true, lastUpd = 0;

// ---------- lesson 1: Kepler orbits ----------
// Sun at the focus; perihelion to the right, aphelion to the left. k px per AU.
const O1 = { sx: 320, sy: 250, k: 24, rpMin: 0.3, rpMax: 5, raMax: 9.5 };
const REF = [{ n: 'Земля', a: 1, c: '#5fb4d9', ang: 225 }, { n: 'Марс', a: 1.52, c: '#ff8a73', ang: 300 }, { n: 'Юпитер', a: 5.2, c: '#e0b77a', ang: 45 }];
const VE = 29.78; // Earth's mean orbital speed, km/s
const orb = () => {
  const a = (S.rp + S.ra) / 2, e = (S.ra - S.rp) / (S.ra + S.rp), T = Math.pow(a, 1.5);
  const vp = VE * Math.sqrt(2 / S.rp - 1 / a), va = VE * Math.sqrt(2 / S.ra - 1 / a);
  return { a, e, T, b: a * Math.sqrt(1 - e * e), vp, va };
};
// planet position at time t (years) by solving Kepler's equation
function planetAt(t, o) {
  const M = 2 * Math.PI * ((t / o.T) % 1);
  let E = M;
  for (let i = 0; i < 12; i++) E -= (E - o.e * Math.sin(E) - M) / (1 - o.e * Math.cos(E));
  return [O1.sx + O1.k * o.a * (Math.cos(E) - o.e), O1.sy - O1.k * o.b * Math.sin(E)];
}

// ---------- lesson 2: stars on the main sequence (simple model) ----------
// L = M^3.5, R = M^0.8, so T = 5778 · M^0.475; lifetime = 10 billion years · M / L
const MMIN = 0.2, MMAX = 30;
const star = M => {
  const Lum = Math.pow(M, 3.5), R = Math.pow(M, 0.8), T = 5778 * Math.pow(M, 0.475), life = 10 * M / Lum;
  return { M, L: Lum, R, T, life, lam: 2.898e6 / T };
};
const fate = M => M < 8 ? 'белый карлик' : M < 25 ? 'нейтронная звезда' : 'чёрная дыра';
const HR = { x0: 70, x1: 490, y0: 390, y1: 110, tMax: Math.log10(40000), tMin: Math.log10(2300), lMin: -4, lMax: 6 };
const xT = T => HR.x0 + (HR.tMax - Math.log10(T)) / (HR.tMax - HR.tMin) * (HR.x1 - HR.x0);
const yL = Lum => HR.y0 - (Math.log10(Lum) - HR.lMin) / (HR.lMax - HR.lMin) * (HR.y0 - HR.y1);
const REFSTARS = [
  { n: 'Солнце', T: 5778, L: 1 }, { n: 'Сириус A', T: 9940, L: 25 }, { n: 'Бетельгейзе', T: 3600, L: 1e5 },
  { n: 'Ригель', T: 12100, L: 1.2e5 }, { n: 'Альдебаран', T: 3900, L: 440 }, { n: 'Сириус B', T: 25000, L: 0.056 },
  { n: 'Проксима', T: 3040, L: 0.0017 }];
const TC = [[2300, [255, 140, 70]], [3500, [255, 180, 115]], [4500, [255, 212, 165]], [5800, [255, 243, 230]], [7500, [238, 240, 255]], [10000, [205, 216, 255]], [20000, [172, 192, 255]], [40000, [150, 172, 255]]];
function tColor(T) {
  let i = 0; while (i < TC.length - 2 && T > TC[i + 1][0]) i++;
  const [t1, c1] = TC[i], [t2, c2] = TC[i + 1], k = clamp((T - t1) / (t2 - t1), 0, 1);
  return `rgb(${c1.map((v, j) => Math.round(v + (c2[j] - v) * k)).join(',')})`;
}

// ---------- lesson 3: galaxy cards ----------
const GALS = [
  { n: 'M87', t: 'E', ratio: 0.85, rot: 0 },
  { n: 'M51 Водоворот', t: 'S', tilt: 0.9, rot: 0 },
  { n: 'Магелланово облако', t: 'Irr', seed: 1 },
  { n: 'NGC 1300', t: 'SB', tilt: 0.72, rot: 12 },
  { n: 'M32', t: 'E', ratio: 0.55, rot: 28 },
  { n: 'M31 Андромеда', t: 'S', tilt: 0.38, rot: -32 },
];
const BINS = [{ t: 'E', name: 'эллиптические' }, { t: 'S', name: 'спиральные' }, { t: 'SB', name: 'с перемычкой' }, { t: 'Irr', name: 'неправильные' }];
const SLOTS = [[110, 150], [260, 150], [410, 150], [110, 248], [260, 248], [410, 248]];
const CW = 124, CH = 88, BW = 112, BY = 306, BH = 116;
const binX = i => 22 + i * (BW + 10);
// the Milky Way "galactic year" calculator
const LY = 9.461e12; // km

// ---------- lesson 4: redshift and Hubble's law ----------
const C = 299792; // km/s
const GX = [{ n: 'A', d: 20, v: 1550 }, { n: 'B', d: 50, v: 3380 }, { n: 'C', d: 90, v: 6400 }, { n: 'D', d: 140, v: 9700 }, { n: 'E', d: 200, v: 14150 }];
const lamTrue = g => 656.3 * (1 + g.v / C);
const SP = { x0: 40, x1: 490, l0: 640, l1: 700, yLab: 108, yGal: 154, h: 26 };
const xLam = l => SP.x0 + (l - SP.l0) / (SP.l1 - SP.l0) * (SP.x1 - SP.x0);
const PL = { x0: 80, x1: 480, y0: 405, y1: 232, dMax: 220, vMax: 16000 };
const px = d => PL.x0 + d / PL.dMax * (PL.x1 - PL.x0);
const py = v => PL.y0 - v / PL.vMax * (PL.y0 - PL.y1);
const fitH = () => { let a = 0, b = 0; for (const k in S.rec) { const r = S.rec[k], d = GX[k].d; a += r.v * d; b += d * d; } return b ? a / b : NaN; };

function resetState() {
  const Ls = L();
  Object.assign(S, {
    rp: Ls.rp0 || 1, ra: Ls.ra0 || 1, t: 0, jup: false, ecc: false, eccRatio: null,
    M: Ls.m0 || 1, hot: false, cool: false,
    cards: SLOTS.map(([x, y]) => ({ x, y, home: [x, y], bin: null })), wrong: 0, Rg: 26000, vg: 230,
    gi: 0, lam: 656.3, rec: {}, miss: 0,
    hl: null,
  });
}

function model() {
  const id = LID();
  if (id === 'solar') { const o = orb(); return { kind: id, ...o, jup: S.jup, ecc: S.ecc }; }
  if (id === 'stars') return { kind: id, ...star(S.M), hot: S.hot, cool: S.cool };
  if (id === 'gal') {
    const Tg = 2 * Math.PI * S.Rg * LY / S.vg / 3.156e7 / 1e6;
    return { kind: id, placed: S.cards.filter(c => c.bin !== null).length, Tg };
  }
  const z = (S.lam - 656.3) / 656.3;
  return { kind: id, rec: Object.keys(S.rec).length, z, v: C * z, H: fitH() };
}
function track() {
  const id = LID();
  if (id === 'solar') {
    const o = orb();
    if (!S.jup && Math.abs(o.T - 11.9) <= 0.5) { S.jup = true; toast(`Период ${fmt(o.T, 1)} года при a = ${fmt(o.a, 2)} а. е. У Юпитера a = 5,2 а. е. — III закон работает!`); }
    if (!S.ecc && o.e >= 0.5) { S.ecc = true; S.eccRatio = o.vp / o.va; toast(`e = ${fmt(o.e, 2)}: в перигелии планета летит в ${fmt(o.vp / o.va, 1)} раза быстрее, чем в афелии.`); }
  }
  if (id === 'stars') {
    const s = star(S.M);
    if (!S.hot && s.life < 0.1) { S.hot = true; toast(`Звезда ${fmt(S.M, 1)} M☉ проживёт всего ${fsig(s.life * 1000)} млн лет — массивные звёзды быстро сгорают.`); }
    if (!S.cool && s.T < 4000) { S.cool = true; toast(`Красный карлик: ${fint(s.T)} К. Такие звёзды живут дольше, чем существует Вселенная.`); }
  }
}

// ---------- drawing helpers ----------
const f1 = x => (+x).toFixed(1);
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
const ln = (a, b, c, w = 1.5, extra = '') => `<path d="M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}" stroke="${c}" stroke-width="${w}" fill="none" ${extra}/>`;
const STARS = Array.from({ length: 70 }, (_, i) => [((i * 97) % 640) - 60, ((i * 61 + 23) % 520) - 60, (i % 5 === 0) ? 1.1 : 0.6]);
function bg() {
  return `<defs>
    <radialGradient id="gSun"><stop offset="0" stop-color="#fff6d8"/><stop offset=".45" stop-color="#ffcf5a"/><stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gE"><stop offset="0" stop-color="#fff3d2"/><stop offset=".35" stop-color="#f0cf8e" stop-opacity=".75"/><stop offset="1" stop-color="#c9955a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gS"><stop offset="0" stop-color="#cfdcff" stop-opacity=".45"/><stop offset="1" stop-color="#7d97e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gI"><stop offset="0" stop-color="#e2ebff" stop-opacity=".9"/><stop offset="1" stop-color="#8fa8e8" stop-opacity="0"/></radialGradient>
    <linearGradient id="gSp" x1="0" x2="1"><stop offset="0" stop-color="#ff9a1a"/><stop offset=".5" stop-color="#ff4a12"/><stop offset="1" stop-color="#a8061c"/></linearGradient>
    <marker id="arV" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#86e0a8"/></marker>
    </defs>` + STARS.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#c8d0dd" opacity=".35"/>`).join('');
}

// ---------- lesson 1 scene ----------
function solarScene(tm) {
  const o = orb(), k = O1.k, cx = O1.sx - k * o.a * o.e;
  let h = '';
  REF.forEach(r => {
    h += `<circle cx="${O1.sx}" cy="${O1.sy}" r="${f1(r.a * k)}" fill="none" stroke="${r.c}" stroke-width="1" stroke-dasharray="3 5" opacity=".45"/>`;
    const ca = Math.cos(r.ang * RAD), sa = Math.sin(r.ang * RAD);
    h += T(O1.sx + (r.a * k + 4) * ca, O1.sy - (r.a * k + 4) * sa + 3, 8.5, r.c, r.n, ca < 0 ? 'end' : 'start', halo + ' opacity=".85"');
  });
  // the orbit
  h += `<ellipse cx="${f1(cx)}" cy="${O1.sy}" rx="${f1(o.a * k)}" ry="${f1(o.b * k)}" fill="rgba(114,212,232,.04)" stroke="#72d4e8" stroke-width="1.8"/>`;
  const xp = O1.sx + S.rp * k, xa = O1.sx - S.ra * k;
  h += ln([xa, O1.sy], [xp, O1.sy], '#8b96ad', 1, 'stroke-dasharray="4 4"');
  if (o.e > 0.02) h += `<circle cx="${f1(cx - k * o.a * o.e)}" cy="${O1.sy}" r="2" fill="#8b96ad"/>` + T(cx - k * o.a * o.e, O1.sy + 14, 8, '#8b96ad', 'фокус', 'middle', halo);
  if (o.e > 0.15) h += `<path d="M${f1(cx - 3)} ${O1.sy - 3}l6 6m0 -6l-6 6" stroke="#8b96ad" stroke-width="1"/>` + T(cx, O1.sy - 8, 8, '#8b96ad', 'центр', 'middle', halo);
  // equal-areas sectors (II law) for elongated orbits
  if (o.e >= 0.2) {
    const sec = (t0) => { const pts = []; for (let i = 0; i <= 8; i++) pts.push(planetAt(t0 + o.T * 0.06 * i / 8, o)); return `<path d="M${O1.sx} ${O1.sy}` + pts.map(p => `L${f1(p[0])} ${f1(p[1])}`).join('') + 'Z" fill="rgba(255,181,71,.16)" stroke="rgba(255,181,71,.5)" stroke-width="1"/>'; };
    h += sec(-o.T * 0.03) + sec(o.T * 0.47);
  }
  // velocity arrows at perihelion and aphelion
  const vs = 3.2;
  h += ln([xp, O1.sy], [xp, O1.sy - o.vp * vs], '#86e0a8', 2, 'marker-end="url(#arV)"') + T(xp + 6, O1.sy - o.vp * vs + 4, 9, '#86e0a8', `${fmt(o.vp, 1)} км/с`, 'start', halo);
  h += ln([xa, O1.sy], [xa, O1.sy + o.va * vs], '#86e0a8', 2, 'marker-end="url(#arV)"') + T(xa - 6, O1.sy + o.va * vs + 4, 9, '#86e0a8', `${fmt(o.va, 1)} км/с`, 'end', halo);
  // the Sun
  h += `<circle cx="${O1.sx}" cy="${O1.sy}" r="16" fill="url(#gSun)"/><circle cx="${O1.sx}" cy="${O1.sy}" r="6" fill="#ffe08a"/>`;
  // the planet
  const p = planetAt(reduce ? 0 : S.t, o);
  h += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="5.5" fill="#e8ecf4" stroke="${INK}" stroke-width="1.5"/>`;
  // handles
  const hd = (x, lab, id) => `<g data-drag="${id}"><circle cx="${f1(x)}" cy="${O1.sy}" r="18" fill="transparent"/><circle cx="${f1(x)}" cy="${O1.sy}" r="8" fill="${INK}" stroke="#ffb547" stroke-width="2"/>` + T(x, O1.sy + 3.5, 9, '#ffb547', lab, 'middle', 'font-weight="600"') + '</g>';
  // when the two handles nearly coincide, the A label goes on the left
  if (Math.abs(xp - xa) < 20) h += hd(xa, 'А', 'A') + hd(xp, 'П', 'P');
  else h += hd(xp, 'П', 'P') + hd(xa, 'А', 'A');
  h += T(xp, O1.sy + 26, 8.5, '#ffb547', `${fmt(S.rp, 2)} а. е.`, 'middle', halo) + T(xa, O1.sy - 16, 8.5, '#ffb547', `${fmt(S.ra, 2)} а. е.`, 'middle', halo);
  if (!drag && S.rp === 1 && S.ra === 1) h += T(O1.sx - 70, O1.sy - 44, 9, '#ffb547', '← тяните А', 'middle', halo);
  return h;
}

// ---------- lesson 2 scene ----------
function starsScene() {
  const s = star(S.M);

function armPath(s, phase, start) {

}

    for (const ph of [0, Math.PI]) { const p = armPath(s, ph, st); h += `<path d="${p}" fill="none" stroke="#8fb0ff" stroke-width="${f1(7 * s)}" opacity=".25" stroke-linecap="round"/><path d="${p}" fill="none" stroke="#c4d5ff" stroke-width="${f1(2.4 * s)}" stroke-linecap="round"/>`; }
    if (bar) h += `<rect x="${f1(-12 * s)}" y="${f1(-3 * s)}" width="${f1(24 * s)}" height="${f1(6 * s)}" rx="${f1(3 * s)}" fill="#ffe2a8" opacity=".9"/>`;
    h += `<circle r="${f1(7 * s)}" fill="url(#gE)"/><circle r="${f1(3 * s)}" fill="#fff6dc"/></g>`;

  }
  return h + '</g>';
}
function galScene() {

function hlBox(id) {

const scene = $('#scene');

let VB = { x: 0, y: 0, w: 520, h: 440 };
function fit() {

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const throttled = () => { const n = performance.now(); if (n - lastUpd > 120) { lastUpd = n; update(); } };

function dropCard() {

  if (a === 'earth') { S.rp = 0.98; S.ra = 1.02; dirty = true; update(); return; }
  if (a === 'mars') { S.rp = 1.38; S.ra = 1.67; dirty = true; update(); return; }
  if (a === 'm-' || a === 'm+') { setM(S.M * (a === 'm+' ? 1.12 : 1 / 1.12)); update(); return; }
  if (a === 'sun') { setM(1); update(); return; }
  if (a.startsWith('g:')) { S.gi = +a.slice(2); renderTools(); buildScheme(); update(); return; }
  if (a === 'l-' || a === 'l+') { setLam(S.lam + (a === 'l+' ? 0.1 : -0.1)); update(); return; }
  if (a === 'rec' && id === 'hubble') {
    const g = GX[S.gi], lt = lamTrue(g);
    if (Math.abs(S.lam - lt) > 0.5) { S.miss++; toast(S.lam < 657 ? 'Метка стоит на месте лабораторной линии. В спектре галактики линия сдвинута — найдите её.' : 'Метка не совпадает с тёмной линией в спектре галактики. Подвиньте точнее.'); return; }
    const z = (S.lam - 656.3) / 656.3;
    S.rec[S.gi] = { lam: S.lam, v: C * z };
    const n = Object.keys(S.rec).length;
    toast(`Галактика ${g.n}: z = ${fmt(z, 4)}, v ≈ ${fint(C * z)} км/с. ${n < 3 ? `Записано ${n} из 3.` : `H₀ ≈ ${fint(fitH())} км/(с·Мпк).`}`);
    const next = GX.findIndex((x, i) => !S.rec[i]); if (next >= 0) S.gi = next;
    renderTools(); buildScheme(); update(); return;
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'solar') {
    return `<h2>Орбита и период</h2><div class="formula">T² = a³</div><div class="steps">` +
      step('перигелий rп и афелий rа', `${fmt(S.rp, 2)} и ${fmt(S.ra, 2)} а. е.`) +
      step('a = (rп + rа) / 2', `(${fmt(S.rp, 2)} + ${fmt(S.ra, 2)}) / 2 = ${fmt(m.a, 3)} а. е.`) +
      step('e = (rа − rп) / (rа + rп)', `${fmt(S.ra - S.rp, 2)} / ${fmt(S.ra + S.rp, 2)} = ${fmt(m.e, 3)}`) +
      step('a³', fmt(m.a ** 3, 2)) +
      step('T = √(a³)', `${fmt(m.T, 2)} года`, 'sum') +
      step('в километрах a', `${fmt(m.a * 149.6, 1)} млн км`) + `</div>
      <h3>Скорости (II закон)</h3><div class="formula">v = vЗ · √(2/r − 1/a)</div><div class="steps">` +
      step('vЗ — скорость Земли', '29,78 км/с') +
      step('в перигелии vп', `29,78 · √(2/${fmt(S.rp, 2)} − 1/${fmt(m.a, 2)}) = ${fmt(m.vp, 1)} км/с`) +
      step('в афелии vа', `29,78 · √(2/${fmt(S.ra, 2)} − 1/${fmt(m.a, 2)}) = ${fmt(m.va, 1)} км/с`) +
      step('vп / vа = rа / rп', `${fmt(m.vp / m.va, 2)}`, 'sum') + `</div>
      <h3>Справка</h3><div class="steps">` + step('Земля', 'a = 1 а. е., T = 1 год') + step('Марс', 'a = 1,52 а. е., T = 1,88 года') + step('Юпитер', 'a = 5,20 а. е., T = 11,86 года') + step('Сатурн', 'a = 9,58 а. е., T = 29,4 года') + `</div>`;
  }
  if (id === 'stars') {
    const s = m;
    return `<h2>Параметры звезды</h2><div class="formula">L / L☉ = (R / R☉)² · (T / T☉)⁴</div><div class="steps">` +
      step('масса M', `${fsig(S.M)} M☉`) +
      step('светимость L ≈ M³·⁵', `${fsig(S.M)}³·⁵ = ${fsig(s.L)} L☉`) +
      step('радиус R ≈ M⁰·⁸', `${fsig(s.R)} R☉`) +
      step('T = 5778 · (L / R²)^¼', `${fint(s.T)} К`, 'sum') + `</div>
      <h3>Цвет — закон Вина</h3><div class="formula">λmax = b / T</div><div class="steps">` +
      step('b', '2,898·10⁻³ м·К') +
      step('λmax = 2,898·10⁻³ / ' + fint(s.T), `${fint(s.lam)} нм`, 'sum') +
      step('где максимум', s.lam > 700 ? 'инфракрасный — звезда красная' : s.lam < 400 ? 'ультрафиолет — звезда голубая' : 'видимый свет') + `</div>
      <h3>Срок жизни</h3><div class="formula">t ≈ 10 млрд лет · M / L</div><div class="steps">` +
      step('M / L', `${fsig(S.M)} / ${fsig(s.L)} = ${fsig(S.M / s.L)}`) +
      step('t', lifeTxt(s.life), 'sum') +
      step('финал', fate(S.M)) + `</div>
      <p class="note" style="margin-top:10px">Солнце (10 млрд лет) прожило около 4,6 млрд лет — примерно половину. Возраст Вселенной — 13,8 млрд лет.</p>`;
  }
  if (id === 'gal') {
    const R = S.Rg * LY, Ts = 2 * Math.PI * R / S.vg;
    return `<h2>Галактический год</h2><div class="formula">T = 2πR / v</div><div class="steps">` +
      step('1 св. год', '9,46·10¹² км') +
      step('R', `${fint(S.Rg)} св. лет = ${fmt(R / 1e17, 2)}·10¹⁷ км`) +
      step('v', `${S.vg} км/с`) +
      step('T = 2πR / v', `${fmt(Ts / 1e15, 2)}·10¹⁵ с`) +
      step('1 год ≈ 3,156·10⁷ с', `${fint(m.Tg)} млн лет`, 'sum') +
      step('оборотов за 4,6 млрд лет', fmt(4600 / m.Tg, 0)) + `</div>
      <h3>Как различать типы</h3><div class="steps">` +
      step('нет рукавов, гладкий овал', 'E') + step('рукава от ядра', 'S') + step('рукава от концов перемычки', 'SB') + step('нет симметрии и ядра', 'Irr') + `</div>
      <h3>Ваша сортировка</h3><div class="steps">` +
      BINS.map((b, i) => step(`${b.t} — ${b.name}`, S.cards.map((c, j) => c.bin === i ? GALS[j].n : null).filter(Boolean).join(', ') || '—')).join('') + `</div>`;
  }
  const H = m.H, list = Object.keys(S.rec).map(k => { const r = S.rec[k], g = GX[k]; return step(`${g.n}: d = ${g.d} Мпк, λ = ${fmt(r.lam, 1)} нм`, `v = ${fint(r.v)}, v/d = ${fint(r.v / g.d)}`); }).join('');
  return `<h2>Красное смещение</h2><div class="formula">v = c · (λ − λ₀) / λ₀</div><div class="steps">` +
    step('λ₀ (лаборатория)', '656,3 нм') + step('λ (метка)', `${fmt(S.lam, 1)} нм`) +
    step('Δλ = λ − λ₀', `${fmt(S.lam - 656.3, 1)} нм`) +
    step('z = Δλ / λ₀', `${fmt(S.lam - 656.3, 1)} / 656,3 = ${fmt(m.z, 4)}`) +
    step('v = c · z', `300 000 · ${fmt(m.z, 4)} ≈ ${fint(m.v)} км/с`, 'sum') + `</div>
    <h3>Закон Хаббла</h3><div class="formula">v = H₀ · d</div><div class="steps">` + (list || step('пока пусто', 'запишите замер')) +
    (m.rec ? step('H₀ — наклон прямой через 0', `${fint(H)} км/(с·Мпк)`, 'sum') : '') + `</div>
    <h3>Возраст Вселенной</h3><div class="formula">t ≈ 1 / H₀</div><div class="steps">` +
    (m.rec ? step('1 Мпк', '3,086·10¹⁹ км') + step('1 / H₀ = 3,086·10¹⁹ / ' + fint(H), `${fmt(3.086e19 / H / 1e17, 2)}·10¹⁷ с`) + step('в годах', `≈ ${fmt(977.8 / H, 1)} млрд лет`, 'sum') : step('нужен хотя бы один замер', '—')) + `</div>
    <p class="note" style="margin-top:10px">Для z меньше 0,1 формула v = c · z точная с запасом. Наклон прямой считается методом наименьших квадратов: H₀ = Σ(v·d) / Σ(d²).</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'solar') {
    el.innerHTML = `<div class="k">Орбита</div><div class="v ${m.jup ? 'ok' : ''}">T = ${fmt(m.T, 2)} г.</div><div class="lr"><span>a</span><span>${fmt(m.a, 2)} а. е.</span></div><div class="lr"><span>e</span><span class="${m.e >= 0.5 ? 'ok' : ''}">${fmt(m.e, 2)}</span></div><div class="lr"><span>vп / vа</span><span>${fmt(m.vp / m.va, 2)}</span></div>`;
  } else if (id === 'stars') {
    el.innerHTML = `<div class="k">Звезда ${fsig(S.M)} M☉</div><div class="v ${m.T < 4000 ? 'ok' : ''}">${fint(m.T)} К</div><div class="lr"><span>L</span><span>${fsig(m.L)} L☉</span></div><div class="lr"><span>живёт</span><span class="${m.life < 0.1 ? 'ok' : ''}">${lifeTxt(m.life)}</span></div><div class="lr"><span>финал</span><span>${fate(S.M)}</span></div>`;
  } else if (id === 'gal') {
    el.innerHTML = `<div class="k">Сортировка</div><div class="v ${m.placed >= 6 ? 'ok' : ''}">${m.placed} из 6</div><div class="lr"><span>ошибок</span><span class="${S.wrong ? 'bad' : ''}">${S.wrong}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Галактика ${GX[S.gi].n}</div><div class="v">${fint(m.v)} км/с</div><div class="lr"><span>z</span><span>${fmt(m.z, 4)}</span></div><div class="lr"><span>замеры</span><span class="${m.rec >= 3 ? 'ok' : ''}">${m.rec}/3</span></div><div class="lr"><span>H₀</span><span>${m.rec ? fint(m.H) : '—'}</span></div>`;
  }
}

function update() {
  track();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы измерили Вселенную — от орбит планет до её расширения!'), 1900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  solar: '<ellipse cx="36" cy="15" rx="26" ry="11" fill="none" stroke="#72d4e8" stroke-width="1.4"/><circle cx="24" cy="15" r="4" fill="#ffcf5a"/><circle cx="60" cy="12" r="2" fill="#e8ecf4"/>',
  stars: '<path d="M6 4C24 10 42 20 60 27" fill="none" stroke="#72d4e8" stroke-width="4" stroke-opacity=".35"/><circle cx="12" cy="6" r="3" fill="#acc0ff"/><circle cx="34" cy="15" r="3" fill="#fff3e6"/><circle cx="56" cy="25" r="2.5" fill="#ffb473"/><circle cx="54" cy="8" r="4" fill="#ffb473" opacity=".8"/>',
  gal: '<g transform="translate(33 15) scale(1 .6)"><circle r="14" fill="#7d97e0" opacity=".25"/><path d="M0 0C8 -6 14 4 8 10M0 0C-8 6 -14 -4 -8 -10" fill="none" stroke="#c4d5ff" stroke-width="1.6"/><circle r="3" fill="#fff6dc"/></g>',
  hubble: '<rect x="4" y="4" width="58" height="8" rx="1" fill="#ff5a14"/><rect x="38" y="4" width="2" height="8" fill="#04070d"/><path d="M6 28L60 16" stroke="#86e0a8" stroke-dasharray="3 2"/><circle cx="20" cy="25" r="2" fill="#ffb547"/><circle cx="44" cy="20" r="2" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // scroll only the strip, never the page
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'solar') now = `Орбита планеты вокруг Солнца: перигелий ${fmt(S.rp, 2)} а. е., афелий ${fmt(S.ra, 2)} а. е., большая полуось a = ${fmt(m.a, 2)} а. е., эксцентриситет e = ${fmt(m.e, 2)}, период T = ${fmt(m.T, 2)} года. Скорость в перигелии ${fmt(m.vp, 1)} км/с, в афелии ${fmt(m.va, 1)} км/с. Орбита с периодом Юпитера найдена: ${m.jup ? 'да' : 'нет'}; вытянутая орбита e ≥ 0,5: ${m.ecc ? 'да' : 'нет'}. Не называй нужную полуось — наведи на III закон Кеплера T² = a³ и на то, как a связана с перигелием и афелием.`;
  if (id === 'stars') now = `Диаграмма Герцшпрунга–Рассела, звезда главной последовательности массой ${fsig(S.M)} M☉: светимость ${fsig(m.L)} L☉, радиус ${fsig(m.R)} R☉, температура ${fint(m.T)} К, максимум излучения ${fint(m.lam)} нм, срок жизни ${lifeTxt(m.life)}, финал — ${fate(S.M)}. Найдена звезда со сроком жизни < 100 млн лет: ${m.hot ? 'да' : 'нет'}; звезда холоднее 4000 К: ${m.cool ? 'да' : 'нет'}. Модель: L ≈ M^3,5, R ≈ M^0,8. Наводи вопросами: как масса влияет на температуру и срок жизни.`;
  if (id === 'gal') now = `Сортировка галактик по Хабблу (E, S, SB, Irr). На местах ${m.placed} из 6: ${S.cards.map((c, j) => c.bin !== null ? GALS[j].n + ' → ' + BINS[c.bin].t : null).filter(Boolean).join(', ') || 'пока ни одной'}. Ещё не разложены: ${S.cards.map((c, j) => c.bin === null ? GALS[j].n : null).filter(Boolean).join(', ') || 'нет'}. Ошибочных попыток: ${S.wrong}. Не называй тип конкретной галактики — спрашивай про признаки: рукава, перемычка, форма. В Схеме — расчёт галактического года: R = ${fint(S.Rg)} св. лет, v = ${S.vg} км/с, T ≈ ${fint(m.Tg)} млн лет.`;
  if (id === 'hubble') now = `Спектрограф: выбрана галактика ${GX[S.gi].n} на расстоянии ${GX[S.gi].d} Мпк. Метка стоит на ${fmt(S.lam, 1)} нм (лабораторная линия Hα 656,3 нм), по метке z = ${fmt(m.z, 4)}, v ≈ ${fint(m.v)} км/с. Записанные замеры: ${Object.keys(S.rec).map(k => `${GX[k].n}: d=${GX[k].d} Мпк, v≈${fint(S.rec[k].v)} км/с`).join('; ') || 'нет'}. ${m.rec ? `Оценка H₀ ≈ ${fint(m.H)} км/(с·Мпк).` : ''} Не говори, где именно линия в спектре галактики, — объясни, что её надо искать сдвинутой вправо, и помоги посчитать v = c·Δλ/λ₀.`;
  return [
    `Раздел: физика, 11 класс, тема «Астрофизика» (Атом и Вселенная). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { solar: 'Почему зимой Земля ближе к Солнцу, а холодно?', stars: 'Что станет с Солнцем в конце жизни?', gal: 'Столкнётся ли Млечный Путь с Андромедой?', hubble: 'Во что расширяется Вселенная?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
