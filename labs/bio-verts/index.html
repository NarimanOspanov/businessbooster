<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8 класс: рыбы, земноводные и пресмыкающиеся, птицы, млекопитающие.">
<title>Позвоночные</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 21Q12 13 22 14Q30 15 34 20Q30 25 22 26Q12 27 6 21Z" fill="rgba(255,181,71,.3)" stroke="var(--force)" stroke-width="1.2"/><path d="M8 21L3 16M8 21L3 26" stroke="var(--force)" stroke-width="1.2" stroke-linecap="round"/><path d="M11 20H31" stroke="var(--arm)" stroke-width="1.2" stroke-linecap="round"/><path d="M14 17V23M18 16.5V23.5M22 16.5V23.5M26 17V23" stroke="var(--arm)" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="19" r="1.2" fill="var(--arm)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Биология · Позвоночные</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#bio">Карта</a><a href="/physics/#bio">Биология</a><a href="/labs/bio-verts/" aria-current="page">Позвоночные</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Позвоночные</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f1 = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
const f2 = x => (Math.round(x * 100) / 100).toString().replace('.', ',');
const f3 = x => (Math.round(x * 1000) / 1000).toString().replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-verts';
const cap = s => s[0].toUpperCase() + s.slice(1);

// ---------- lesson 1: fish and swim bladder ----------
const FM = 1070, FV = 1000, TOL = 3; // fish mass, g; body volume without bladder, cm³; tolerance, g
const WATER = { fresh: { name: 'Пресная вода', where: 'река', rho: 1.000, c1: '#1d4c5e', c2: '#0f2a36' }, sea: { name: 'Морская вода', where: 'море', rho: 1.025, c1: '#183c6c', c2: '#0c1d3a' } };
const needVb = w => FM / WATER[w].rho - FV;
const FX = 290, FK = 1.25, WY0 = 128, WY1 = 382, FYMIN = WY0 + 42, FYMAX = WY1 - 40;
// ---------- lesson 2: amphibians and reptiles ----------
const CL = {
  amph: { name: 'Земноводные', c: '#86e0a8' },
  both: { name: 'Оба класса', c: '#ffb547' },
  rept: { name: 'Пресмыкающиеся', c: '#ff8a73' },
};
const CLK = ['amph', 'both', 'rept'];
const TRAITS = [
  { id: 'skin', t: ['Голая кожа со слизью,', 'через неё идёт дыхание'], short: 'Голая влажная кожа', ans: 'amph', why: 'кожа без чешуй, железы выделяют слизь, и через влажную кожу проходит кислород' },
  { id: 'spawn', t: ['Икра без скорлупы,', 'откладывается в воду'], short: 'Икра в воде', ans: 'amph', why: 'икринки без плотной оболочки высохнут на воздухе, поэтому размножение связано с водой' },
  { id: 'tad', t: ['Личинка-головастик', 'дышит жабрами'], short: 'Головастик', ans: 'amph', why: 'головастик похож на рыбку: жабры, хвост, боковая линия; потом происходит превращение' },
  { id: 'scale', t: ['Сухая кожа', 'с роговыми чешуями'], short: 'Роговые чешуи', ans: 'rept', why: 'роговые чешуи и щитки берегут тело от высыхания, но кожа почти не дышит' },
  { id: 'egg', t: ['Яйца с плотной оболочкой', 'откладывают на суше'], short: 'Яйца на суше', ans: 'rept', why: 'внутри яйца есть запас воды и желтка, а оболочка не даёт ему высохнуть' },
  { id: 'direct', t: ['Прямое развитие:', 'без личинки'], short: 'Без личинки', ans: 'rept', why: 'из яйца выходит маленькая ящерица или черепашка, похожая на взрослую' },
  { id: 'cold', t: ['Температура тела', 'зависит от среды'], short: 'Холоднокровные', ans: 'both', why: 'тело почти не греет само себя: на солнце животное активное, в холод — вялое' },
  { id: 'heart', t: ['Сердце у большинства', 'трёхкамерное'], short: 'Трёхкамерное сердце', ans: 'both', why: 'два предсердия и один желудочек; только у крокодилов сердце четырёхкамерное' },
  { id: 'winter', t: ['Зимой впадают', 'в оцепенение'], short: 'Зимнее оцепенение', ans: 'both', why: 'зимой им не хватает тепла, и они замирают в норах, под корнями или на дне водоёмов' },
];
const CW = 158, CH = 52, BW = 158, BH = 112;
const HOME = [3, 6, 0, 8, 1, 4, 7, 2, 5];
const homeXY = c => { const k = HOME.indexOf(c); return [8 + (k % 3) * 172, 100 + Math.floor(k / 3) * 60]; };
const binXY = b => [8 + b * 172, 290];
const chipStep = b => Math.min(22, 82 / Math.max(1, S.bin.filter(x => x === b).length));
const chipXY = c => { const b = S.bin[c], [x, y] = binXY(b), k = TRAITS.filter((_, j) => j < c && S.bin[j] === b).length; return [x + 6, y + 26 + k * chipStep(b)]; };
// ---------- lesson 3: birds and lift ----------

const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };

const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  const L = LESSONS[S.lesson];
  S.vb = L.vb === undefined ? 20 : L.vb; S.water = L.water || 'fresh'; S.fy = (FYMIN + FYMAX) / 2; S.okF = false; S.okS = false; S.fpart = null; S.ph = 0;
  S.bin = Array(TRAITS.length).fill(-1); S.wsel = -1; S.look = -1;
  S.bird = L.bird || 'pigeon'; S.v = L.v === undefined ? 5 : L.v; S.spread = L.spread || 60; S.by = GROUND; S.okB = {}; S.scroll = 0;
  S.sk = L.sk || 0; S.idn = {}; S.tooth = null; S.trects = [];
}

// ---------- models ----------
function fishNet() { const w = WATER[S.water]; return w.rho * (FV + S.vb) - FM; }
function birdNow() {
  const B = BIRDS[S.bird], Sw = B.S * S.spread / 100, L = .5 * RHO * S.v * S.v * Sw * CLIFT, W = B.m * G;
  return { L, W, Sw, vm: vmin(S.bird), fly: L >= W };
}
function model() {
  const id = LID();
  if (id === 'fish') {
    const net = fishNet(), rhoF = FM / (FV + S.vb);
    return { kind: 'fish', net, rhoF, neutral: Math.abs(net) <= TOL, okFresh: S.okF, okSea: S.okS, depth: (S.fy - WY0) / (WY1 - WY0) * 6 };
  }
  if (id === 'amrep') { let n = 0, r = 0; S.bin.forEach((b, i) => { if (b >= 0) { n++; if (CLK[b] === TRAITS[i].ans) r++; } }); return { kind: 'sort', placed: n, right: r }; }
  if (id === 'birds') { const b = birdNow(); return Object.assign({ kind: 'bird', okPigeon: !!S.okB.pigeon, okSwan: !!S.okB.swan }, b); }
  return { kind: 'skull', idn: SKULLS.filter(s => S.idn[s.id]).length };
}

// ---------- lesson 1 actions ----------
function setVb(v) {
  S.vb = clamp(Math.round(v / 2) * 2, 0, 120);
  checkFish(); renderTools(); update();
}
function setWater(w) { S.water = w; checkFish(); renderTools(); update(); }
function checkFish() {
  if (Math.abs(fishNet()) > TOL) return;
  if (S.water === 'fresh' && !S.okF) { S.okF = true; toast(`В реке рыба зависла: пузырь ${S.vb} см³.`); }
  if (S.water === 'sea' && !S.okS) { S.okS = true; toast(`В море рыба зависла: пузырь ${S.vb} см³ — меньше, чем в реке.`); }
}
// ---------- lesson 2 actions ----------
function drop(c, b) {
  S.bin[c] = b; S.wsel = -1; S.look = c;
  const m = model();
  if (m.placed === TRAITS.length && m.right < TRAITS.length) toast(`Все признаки разложены. Верно ${m.right} из 9 — красные переложите.`);
  update();
}
// ---------- lesson 3 actions ----------
function setBird(b) { S.bird = b; S.by = GROUND; checkBird(); renderTools(); update(); }
function setV(v) { S.v = clamp(Math.round(v * 2) / 2, 0, 25); checkBird(); renderTools(); update(); }
function setSpread(p) { S.spread = p; checkBird(); renderTools(); update(); }
function checkBird() {
  const b = birdNow();
  if (!b.fly || S.okB[S.bird]) return;
  if (S.spread === 100 && S.v <= b.vm + 1) { S.okB[S.bird] = true; toast(`${BIRDS[S.bird].name} летит на скорости ${f1(S.v)} м/с — почти на минимальной.`); }
  else if (S.spread < 100) toast('Летит, но крылья раскрыты не полностью — так нужна большая скорость.');
  else toast(`Летит, но ${f1(S.v)} м/с — с запасом. Попробуйте медленнее.`);
}
// ---------- lesson 4 actions ----------
function setSkull(i) { S.sk = clamp(i, 0, SKULLS.length - 1); S.tooth = null; renderTools(); update(); }
function guess(o) {
  const s = SKULLS[S.sk];
  if (S.idn[s.id]) { toast(`Этот череп уже определён: ${s.name.toLowerCase()}, отряд ${ORD[s.ord]}.`); return; }
  if (o === s.ord) { S.idn[s.id] = true; toast(`Верно! Это ${s.name.toLowerCase()}, отряд ${ORD[o]}.`); }
  else {
    const has = g => (s.up + s.lo).split('').some(t => TOK[t] === g);
    let why = 'Посмотрите ещё раз на клыки и коренные зубы.';
    if (o === 'carn') why = has('car') ? why : 'У хищных есть крупные хищные зубы, а здесь их нет.';
    if (o === 'rod') why = 'У грызунов по одному огромному резцу сверху и снизу, а здесь иначе.';
    if (o === 'art') why = 'У парнокопытных нет верхних резцов — вместо них роговая подушка.';
    if (o === 'ins') why = 'У насекомоядных все зубы мелкие и острые, похожие друг на друга.';
    toast('Нет. ' + why);
  }
  renderTools(); update();
}

function hlBoxes(id) {

    const B = (x, y, w, h) => [FX + x * FK, S.fy + y * FK, w * FK, h * FK];
    const s = Math.sqrt(S.vb / 70);
    return { bladder: [B(-12 - 28 * s - 4, -7 - 9 * s - 4, 56 * s + 8, 18 * s + 8)], gill: [B(24, -26, 18, 52)], line: [B(-72, -12, 110, 16)], fins: [B(-40, -54, 60, 30), B(-44, 20, 64, 26), B(10, 6, 26, 20)], tail: [B(-106, -34, 38, 68)], scale: [B(-74, -32, 138, 64)], water: [[24, WY0, 472, WY1 - WY0]] }[id] || null;
  }
  if (L === 'amrep') { const b = CLK.indexOf(id); if (b >= 0) { const [x, y] = binXY(b); return [[x - 4, y - 4, BW + 8, BH + 8]]; } return null; }
  if (L === 'birds') {
    const k = BIRDS[S.bird].k, B = (x, y, w, h) => [BX + x * k, S.by + y * k, w * k, h * k];
    return { wing: [B(-30, -72, 80, 80)], tail: [B(-64, -16, 40, 28)], beak: S.bird === 'swan' ? [B(58, -56, 26, 20)] : [B(42, -20, 18, 14)], keel: [B(-10, 6, 36, 20)], legs: [B(-16, 12, 36, 26)] }[id] || null;

const scene = $('#scene');

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 510, hh / 410, 1.7);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const binAt = p => { for (let b = 0; b < 3; b++) { const [x, y] = binXY(b); if (p.x > x - 6 && p.x < x + BW + 6 && p.y > y - 10 && p.y < y + BH + 6) return b; } return -1; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) {
    const c = +el.dataset.drag.slice(1), p = toSvg(e);
    let dx = -CW / 2, dy = -CH / 2;
    if (S.bin[c] < 0) { const [x, y] = homeXY(c); dx = x - p.x; dy = y - p.y; }
    drag = { c, dx, dy, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing');
  } else drag = { c: -1, hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;

  if (drag.c < 0 || !drag.moved) return;

});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) { dirty = true; return; }
  if (d.c >= 0) {
    if (!d.moved) {
      if (S.wsel >= 0 && S.wsel !== d.c && S.bin[d.c] >= 0) { drop(S.wsel, S.bin[d.c]); return; }
      S.wsel = S.wsel === d.c ? -1 : d.c; S.look = d.c; update(); return;
    }

  }

}

function tap(id) {
  const L = LID();
  if (L === 'fish' && id.startsWith('fp-')) { S.fpart = id.slice(3); update(); }
  if (L === 'amrep' && id.startsWith('bin')) {
    if (S.wsel >= 0) drop(S.wsel, +id.slice(3)); else toast('Сначала нажмите на карточку с признаком, потом на коробку.');
  }
  if (L === 'birds' && id.startsWith('bp-')) { S.bpart = id.slice(3); update(); }
  if (L === 'mammals' && id.startsWith('t-')) { S.tooth = { g: id.slice(2) }; update(); }
}

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = clamp((t - (lastT || t)) / 1000, 0, .05); lastT = t;
  let anim = false;
  const id = LID();
  if (id === 'fish') {
    const net = fishNet(), vy = Math.abs(net) <= TOL ? 0 : clamp(-net * 1.8, -80, 80);
    const y0 = S.fy;
    S.fy = clamp(S.fy + (reduce ? vy * 6 : vy) * dt, FYMIN, FYMAX);
    if (!reduce) { S.ph += dt * 7; anim = true; }
    else if (S.fy !== y0) anim = true;
    if (Math.floor(t / 250) !== Math.floor((t - dt * 1000) / 250)) update(true);
  }
  if (id === 'birds') {
    const m = birdNow(), target = m.fly ? CRUISE : GROUND, y0 = S.by;
    S.by += clamp(target - S.by, -90 * dt * (reduce ? 6 : 1), 120 * dt * (reduce ? 6 : 1));
    if (!reduce) { S.ph += dt * (m.fly ? 9 : 0); S.scroll += S.v * 10 * dt; anim = true; }
    else if (S.by !== y0) anim = true;
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

    { id: 'bladder', icon: ICON.bladder, name: 'Плавательный пузырь', spec: 'Мешок с газом над кишечником. Больше газа — больше объём тела и выталкивающая сила.' },
    { id: 'gill', icon: ICON.gill, name: 'Жабры', spec: 'Красные лепестки под жаберной крышкой, в них много капилляров. Забирают из воды кислород.' },
    { id: 'line', icon: ICON.line, name: 'Боковая линия', spec: 'Канал с чувствительными клетками вдоль тела. Чувствует течения, препятствия и других рыб даже в темноте.' },
    { id: 'fins', icon: ICON.fins, name: 'Плавники', spec: 'Парные грудные и брюшные — рули и тормоза. Непарные спинной и анальный не дают рыбе опрокинуться.' },
    { id: 'tail', icon: ICON.tail, name: 'Хвостовой плавник', spec: 'Изгибы хвоста толкают рыбу вперёд.' },
    { id: 'scale', icon: ICON.scale, name: 'Чешуя и слизь', spec: 'Чешуйки лежат как черепица. По годичным кольцам на чешуе узнают возраст рыбы.' },
    { id: 'water', icon: ICON.water, name: 'Вода', spec: 'Пресная: 1 г/см³. Морская солёная: около 1,025 г/см³ — она сильнее выталкивает тело.' }];
  if (id === 'amrep') return CLK.map(k => ({ id: k, icon: dot(CL[k].c), name: CL[k].name, spec: TRAITS.filter(t => t.ans === k).length + ' признака в этой коробке. Нажмите, чтобы найти её на столе.' }));
  if (id === 'birds') return [
    { id: 'wing', icon: ICON.wing, name: 'Крыло', spec: 'Видоизменённая передняя конечность. Маховые перья образуют несущую плоскость.' },
    { id: 'tail', icon: ICON.btail, name: 'Хвост', spec: 'Рулевые перья: поворот, торможение при посадке.' },
    { id: 'beak', icon: ICON.beak, name: 'Клюв', spec: 'Роговой чехол на челюстях. Зубов нет — голова лёгкая.' },
    { id: 'keel', icon: ICON.keel, name: 'Киль', spec: 'Вырост грудины. К нему крепятся грудные мышцы — до четверти массы птицы.' },
    { id: 'legs', icon: ICON.legs, name: 'Ноги', spec: 'Видны, когда птица стоит или бежит. В полёте поджаты к телу.' }];
  return ['inc', 'can', 'pre', 'car', 'mol', 'pad', 'gap'].map(g => ({ id: g, icon: toothIcon(g), name: TG[g].name, spec: cap(TG[g].job) + '.' }));
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${L.id === 'amrep' ? 'Коробки-классы' : L.id === 'mammals' ? 'Зубы млекопитающих' : 'Что на столе'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'amrep') h += `<h3>Кто есть кто</h3><div class="feat">` +
      [['Бесхвостые земноводные', 'Лягушки, жабы, квакши. Озёрная лягушка и зелёная жаба обычны в Казахстане.', '#86e0a8'], ['Хвостатые земноводные', 'Тритоны, саламандры. Семиреченский лягушкозуб живёт только в Джунгарском Алатау.', '#86e0a8'], ['Чешуйчатые', 'Ящерицы и змеи: быстрая ящурка, степная гадюка, щитомордник, полоз.', '#ff8a73'], ['Черепахи', 'Панцирь из костных пластин, покрытых роговыми щитками. Степная черепаха — в пустынях юга.', '#ff8a73'], ['Крокодилы', 'Живут в тропиках, сердце четырёхкамерное.', '#ff8a73']]
        .map(([a, b, c]) => `<div style="border-left-color:${c}"><b>${a}</b>${b}</div>`).join('') + `</div>`;
    if (L.id === 'birds') h += `<h3>Как птица устроена для полёта</h3><div class="feat">` +
      [['Полые кости', 'Многие кости внутри пустые и связаны с воздушными мешками.', '#d8cfb8'], ['Воздушные мешки', 'Воздух проходит через лёгкие и на вдохе, и на выдохе — двойное дыхание.', '#72d4e8'], ['Четырёхкамерное сердце', 'Артериальная и венозная кровь не смешиваются, обмен веществ быстрый.', '#ff8a73'], ['Нет мочевого пузыря', 'Остатки выводятся сразу — лишнего веса нет.', '#b48cff']]
        .map(([a, b, c]) => `<div style="border-left-color:${c}"><b>${a}</b>${b}</div>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      S.hl = { id: b.dataset.id, t: performance.now() };
      if (L.id === 'mammals') { if (!S.trects.some(r => r.g === b.dataset.id)) toast(`На черепе ${S.sk + 1} такого нет.`); }
      dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'fish') {
    const W = WATER[S.water], V = FV + S.vb, Fa = W.rho * V, need = needVb(S.water);
    let h = `<h2>Утонет или всплывёт</h2><div class="formula">рыба висит, когда ρ<sub>воды</sub> · V = m</div><div class="steps">` +
      step('масса рыбы m', '1070 г') + step('объём тела без пузыря', '1000 см³') + step('объём пузыря', `${S.vb} см³`) +
      step('весь объём V', `1000 + ${S.vb} = ${V} см³`) + step('плотность рыбы m / V', `1070 / ${V} = ${f3(m.rhoF)} г/см³`) +
      step('плотность воды', `${f3(W.rho)} г/см³ (${W.where})`) +
      step('вытесненная вода ρ · V', `${f3(W.rho)} · ${V} = ${f1(Fa)} г`) +
      step('разница Fₐ − mg', `${f1(Fa)} − 1070 = ${m.net > 0 ? '+' : ''}${f1(m.net)} гс`) +
      step('итог', m.neutral ? 'висит (разница не больше 3 гс)' : m.net > 0 ? 'всплывает' : 'тонет', 'sum') + `</div>`;
    h += `<h3>Сколько газа нужно</h3><p>Нужен такой объём, чтобы вытесненная вода весила столько же, сколько рыба: V = m / ρ<sub>воды</sub>. Тогда объём пузыря = m / ρ<sub>воды</sub> − 1000 см³. Подставьте плотность воды и проверьте себя.</p>`;
    if (m.okFresh && m.okSea) h += `<div class="steps">` + step('река', `1070 / 1 − 1000 = ${f1(needVb('fresh'))} см³ (7 %)`) + step('море', `1070 / 1,025 − 1000 = ${f1(needVb('sea'))} см³ (4 %)`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">Без пузыря рыба плотнее воды (${f3(FM / FV)} г/см³) и тонет. 1 гс (грамм-сила) ≈ 0,01 Н.${need ? '' : ''}</p>`;
    return h;
  }
  if (id === 'amrep') {
    const all = m.placed === 9;
    let h = `<h2>Как рассуждать</h2><div class="formula">вода → земноводные · защита от высыхания → пресмыкающиеся · тело не греет себя → оба</div><div class="steps">` +
      step('1. Признак нужен для жизни во влажной среде?', 'земноводные') + step('2. Признак защищает от высыхания на суше?', 'пресмыкающиеся') + step('3. Признак есть у обоих?', 'оба класса') + `</div>`;
    if (S.look >= 0) { const T = TRAITS[S.look]; h += `<h3>${T.short}</h3><p>${all ? cap(T.why) + '.' : 'Подумайте: у кого из лягушки и ящерицы это есть? Объяснение появится, когда все карточки будут разложены.'}</p>`; }
    h += `<h3>Сейчас</h3><div class="steps">` + TRAITS.map((w, c) => step(w.short, S.bin[c] < 0 ? '—' : CL[CLK[S.bin[c]]].name + (all ? (CLK[S.bin[c]] === w.ans ? ' ✓' : ' ✗') : ''))).join('') +
      step('итого', all ? `верно ${m.right} из 9` : `разложено ${m.placed} из 9`, 'sum') + `</div>`;
    return h;
  }
  if (id === 'birds') {
    const B = BIRDS[S.bird], b = m;
    let h = `<h2>Подъёмная сила крыла</h2><div class="formula">F = ½ · ρ · v² · S · C</div><div class="steps">` +
      step('птица', `${B.name}, m = ${f2(B.m)} кг`) + step('вес mg', `${f2(B.m)} · 9,8 = ${f1(b.W)} Н`) +
      step('площадь крыльев S', `${f3(B.S)} · ${S.spread} % = ${f3(b.Sw)} м²`) + step('скорость v', `${f1(S.v)} м/с, v² = ${f1(S.v * S.v)}`) +
      step('F = ½ · 1,2 · v² · S · 1,2', `${f2(b.L)} Н`) +
      step('итог', b.fly ? 'F ≥ mg — летит' : 'F < mg — не взлетит', 'sum') + `</div>`;
    h += `<h3>Нагрузка на крыло</h3><div class="steps">` + BK.map(k => step(BIRDS[k].name, `${f2(BIRDS[k].m)} / ${f2(BIRDS[k].S)} = ${f1(BIRDS[k].m / BIRDS[k].S)} кг/м²`)).join('') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Минимальную скорость находят из равенства F = mg: v = √(2mg / (ρ·S·C)). На каждый квадратный метр крыла лебедя приходится почти в 3 раза больше массы, чем у голубя, поэтому лебедь разбегается по воде, а голубь взлетает почти с места. Настоящая птица ещё и машет крыльями — это даёт тягу.</p>`;
    return h;
  }
  const sk = SKULLS[S.sk], known = !!S.idn[sk.id], has = g => (sk.up + sk.lo).split('').some(t => TOK[t] === g);
  const cnt = (row, g) => sk[row].split('').filter(t => TOK[t] === g).length;
  let h = `<h2>Определяем отряд по зубам</h2><div class="formula">клыки? → резцы? → коренные? → отряд</div><div class="steps">` +
    step('1. Крупные клыки и хищные зубы', 'хищные') + step('2. Один большой резец, клыков нет, щель', 'грызуны') +
    step('3. Сверху нет резцов, коренные с гребнями', 'парнокопытные') + step('4. Много мелких острых зубов', 'насекомоядные') + `</div>`;
  h += `<h3>Череп ${S.sk + 1}: зубы одной стороны</h3><div class="steps">` +
    ['inc', 'can', 'pre', 'car', 'mol'].map(g => step(TG[g].name, `сверху ${cnt('up', g)}, снизу ${cnt('lo', g)}`)).join('') +
    step('диастема (щель)', has('gap') ? 'есть' : 'нет') + step('роговая подушка', has('pad') ? 'есть' : 'нет') +
    step('отряд', known ? `${ORD[sk.ord]} — ${sk.name.toLowerCase()}, ест ${sk.food}` : 'ещё не определён', 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">Нижний клык сайгака по форме похож на резец — он помогает срезать траву.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'fish') {
    el.innerHTML = `<div class="k">Пузырь</div><div class="v ${m.neutral ? 'ok' : ''}">${S.vb} см³</div>
      <div class="lr"><span>Fₐ − mg</span><span>${m.net > 0 ? '+' : ''}${f1(m.net)} гс</span></div><div class="lr"><span>глубина</span><span>${f1(m.depth)} м</span></div>
      <div class="lr"><span>река / море</span><span>${m.okFresh ? '✓' : '—'} / ${m.okSea ? '✓' : '—'}</span></div>`;
  } else if (m.kind === 'sort') {
    const c = S.look;
    el.innerHTML = `<div class="k">${c >= 0 ? 'Выбран признак' : 'Разложено'}</div><div class="v ${S.done.amrep ? 'ok' : ''}">${c >= 0 ? TRAITS[c].short : m.placed + ' / 9'}</div>` +
      `<svg viewBox="-60 -16 120 30" aria-hidden="true"><g transform="translate(-30 2)">${FROG}</g><g transform="translate(30 2)">${LIZ}</g></svg>` +
      `<div class="gauge"><b style="width:${(m.placed / 9 * 100).toFixed(1)}%"></b></div><div class="lr"><span>всего</span><span>${m.placed}/9</span></div>`;
  } else if (m.kind === 'bird') {
    el.innerHTML = `<div class="k">${BIRDS[S.bird].name}</div><div class="v ${m.fly ? 'ok' : 'bad'}">${m.fly ? 'летит' : 'не летит'}</div>
      <div class="gauge"><b style="width:${clamp(m.L / m.W * 50, 0, 100).toFixed(1)}%;background:${m.fly ? 'var(--ok)' : 'var(--force)'}"></b></div>
      <div class="lr"><span>F / mg</span><span>${f2(m.L / m.W)}</span></div><div class="lr"><span>скорость</span><span>${f1(S.v)} м/с</span></div>`;
  } else {
    const g = S.tooth && S.tooth.g;
    el.innerHTML = `<div class="k">${g ? 'Выбрано' : 'Череп ' + (S.sk + 1)}</div><div class="v ${S.idn[SKULLS[S.sk].id] ? 'ok' : ''}">${g ? TG[g].name : 'нажмите зуб'}</div>` +
      (g ? `<div class="lr"><span>${TG[g].job}</span></div>` : '') + `<div class="lr"><span>определено</span><span>${m.idn}/4</span></div>`;
  }
}

function update(light) {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий зоолог!');
    light = false;
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  if (!light || S.tab === 'scheme' || S.tab === 'calc') renderPanes(m);
  if (!light) {
    const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
    $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  }
  dirty = true;
}

};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.bpart = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage; $('#hint').hidden = L.id === 'amrep';
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now

      `Выталкивающая сила минус вес: ${f1(m.net)} гс, рыба ${m.neutral ? 'висит в толще воды' : m.net > 0 ? 'всплывает' : 'тонет'}, глубина ${f1(m.depth)} м. Зависание в реке ${m.okFresh ? 'получено' : 'ещё не получено'}, в море ${m.okSea ? 'получено' : 'ещё не получено'}.` +

  }
  if (id === 'amrep') {
    now = `9 карточек с признаками: ${TRAITS.map((w, c) => `«${w.t.join(' ')}» — ${S.bin[c] < 0 ? 'не разложена' : 'в коробке «' + CL[CLK[S.bin[c]]].name + '»'}`).join('; ')}. Коробки: только земноводные, оба класса, только пресмыкающиеся. ` +

  }
  if (id === 'birds') {
    now = `Модель полёта: ${BIRDS[S.bird].name.toLowerCase()}, масса ${f2(BIRDS[S.bird].m)} кг, крылья раскрыты на ${S.spread} % (площадь ${f3(m.Sw)} м²), скорость ${f1(S.v)} м/с. Подъёмная сила ${f2(m.L)} Н, вес ${f2(m.W)} Н — птица ${m.fly ? 'летит' : 'не может взлететь'}. ` +
      `Цель: взлететь при полностью раскрытых крыльях на скорости не больше чем на 1 м/с выше минимальной. Голубь: ${m.okPigeon ? 'выполнено' : 'не выполнено'}, лебедь: ${m.okSwan ? 'выполнено' : 'не выполнено'}.` + (S.bpart ? ` Ученик нажал на часть птицы: ${BPART[S.bpart]}.` : '');
    guide = 'Не называй минимальную скорость числом. Помоги понять, как подъёмная сила зависит от скорости и площади крыла, и предложи приравнять её к весу.';
  }
  if (id === 'mammals') {
    const sk = SKULLS[S.sk];
    now = `На столе череп ${S.sk + 1} из 4 (вид сбоку, рот открыт). Верхний ряд зубов: ${sk.up.split('').map(t => TG[TOK[t]].name.toLowerCase()).join(', ')}. Нижний ряд: ${sk.lo.split('').map(t => TG[TOK[t]].name.toLowerCase()).join(', ')}. ` +
      (S.idn[sk.id] ? `Этот череп определён: ${sk.name}, отряд ${ORD[sk.ord]}. ` : 'Отряд этого черепа ещё не определён. ') + `Всего определено ${m.idn} из 4.` + (S.tooth ? ` Ученик выбрал зуб: ${TG[S.tooth.g].name}.` : '');
    guide = 'Не называй животное и отряд неопределённого черепа. Спрашивай, есть ли клыки, какие резцы, острые ли коренные зубы и что этими зубами удобно есть.';
  }
  return [
    `Раздел: биология, 8 класс, тема «Позвоночные». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    fish: 'Зачем рыбе плавательный пузырь?', amrep: 'Почему лягушка не может жить в пустыне?',
    birds: 'Почему лебедю нужен разбег, а голубю нет?', mammals: 'Как по зубам понять, чем питается животное?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
