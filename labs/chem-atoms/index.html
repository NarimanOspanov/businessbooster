<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 7 класс: собираем атом из протонов, нейтронов и электронов, учим знаки элементов, строим молекулы по формулам и взвешиваем их на весах.">
<title>Атомы и молекулы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /optics. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.eltab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.eltab span{background:var(--surface-2);border-radius:6px;padding:5px 2px;text-align:center;font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.eltab span b{display:block;color:var(--fg);font-size:14px}
.eltab span.on{outline:2px solid var(--force);color:var(--fg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Химия · Атомы и молекулы</small></div>
    </div>
    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/physics/#chem">Карта</a><a href="/physics/#chem">Химия</a><a href="/labs/chem-atoms/" aria-current="page">Атомы</a></nav>
      <div class="prog" aria-label="Прогресс"><b>Атомы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Модель атомов и молекул. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const num = x => Number.isInteger(x) ? String(x) : fmt(x, 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-atoms';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const SUPD = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const sup = s => String(s).split('').map(c => SUPD[c] || c).join('');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

// ---------- lesson 1: elements Z = 1…20 ----------
// знак, название, Ar (школьное округление), числа нейтронов у устойчивых природных изотопов, как читается знак
const EL = [
  ['H', 'Водород', 1, [0, 1], 'аш'], ['He', 'Гелий', 4, [1, 2], 'гелий'], ['Li', 'Литий', 7, [3, 4], 'литий'], ['Be', 'Бериллий', 9, [5], 'бериллий'],
  ['B', 'Бор', 11, [5, 6], 'бор'], ['C', 'Углерод', 12, [6, 7], 'цэ'], ['N', 'Азот', 14, [7, 8], 'эн'], ['O', 'Кислород', 16, [8, 9, 10], 'о'],
  ['F', 'Фтор', 19, [10], 'фтор'], ['Ne', 'Неон', 20, [10, 11, 12], 'неон'], ['Na', 'Натрий', 23, [12], 'натрий'], ['Mg', 'Магний', 24, [12, 13, 14], 'магний'],
  ['Al', 'Алюминий', 27, [14], 'алюминий'], ['Si', 'Кремний', 28, [14, 15, 16], 'силициум'], ['P', 'Фосфор', 31, [16], 'пэ'], ['S', 'Сера', 32, [16, 17, 18, 20], 'эс'],
  ['Cl', 'Хлор', 35.5, [18, 20], 'хлор'], ['Ar', 'Аргон', 40, [18, 20, 22], 'аргон'], ['K', 'Калий', 39, [20, 22], 'калий'], ['Ca', 'Кальций', 40, [20, 22, 23, 24, 26], 'кальций'],
].map(([s, name, ar, st, pr], i) => ({ z: i + 1, s, name, ar, st, pr }));
const LIM = { p: 20, n: 26, e: 20 };
const SHELL = [2, 8, 8, 2];
const shells = e => { const r = []; let left = e; for (const c of SHELL) { if (left <= 0) break; r.push(Math.min(c, left)); left -= c; } return r; };
const ionName = (el, q) => el ? el.s + (q === 0 ? '' : sup((Math.abs(q) > 1 ? Math.abs(q) : '') + (q > 0 ? '+' : '-'))) : '';

// formula in the usual school order: known molecules as written, otherwise C, H, then the rest
function formulaOf(c) {
  const known = MOLS.find(M => M.ck === countKey(c));
  if (known) return known.key;
  const order = c.C ? ['C', 'H', 'N', 'O'] : ['H', 'N', 'O', 'C'];
  return order.filter(x => c[x]).map(x => x + (c[x] > 1 ? c[x] : '')).join('');
}

function model() {
  const id = LID();
  if (id === 'element') {
    const el = S.p > 0 ? EL[S.p - 1] : null, q = S.p - S.e;
    return { kind: 'atom', p: S.p, n: S.n, e: S.e, el, A: S.p + S.n, q, sh: shells(S.e), stable: el ? el.st.includes(S.n) : false };
  }
  if (id === 'symbols') return { kind: 'sym', placed: Object.keys(S.placed).length };
  if (id === 'formula') {
    const c = S.atoms, tot = BUILD.reduce((a, x) => a + c[x], 0), mol = MOLS.find(M => M.ck === countKey(c)) || null;
    return { kind: 'mol', c, tot, mol, key: mol ? mol.key : null, k: S.k, f: tot ? formulaOf(c) : '', built: S.built };
  }
  const sb = subNow(), Mr = massOf(sb), sum = S.w.reduce((a, b) => a + b, 0);
  return { kind: 'mass', sb, Mr, sum, diff: Mr - sum, bal: sum === Mr, found: S.found };
}

// ----- lesson 1: atom -----
function nucleus(p, n, t) {
  const N = p + n; if (!N) return '';
  const pts = [];
  for (let i = 0; i < N; i++) {
    const isP = Math.floor((i + 1) * p / N) > Math.floor(i * p / N);
    const r = N === 1 ? 0 : 6.4 * Math.sqrt(i + 0.5), a = i * 2.39996;
    const j = reduce ? 0 : Math.sin(t / 260 + i * 1.7) * 0.7;
    pts.push({ x: AC.x + Math.cos(a) * r + j, y: AC.y + Math.sin(a) * r + j * 0.6, isP });
  }
  let h = '';
  for (let i = pts.length - 1; i >= 0; i--) { const q = pts[i]; h += ball(q.x, q.y, 6.2, q.isP ? '#ff7a66' : '#a9b4c9', '', '', 0); }
  return h;
}
function atomSVG(m, t) {
  let h = '';
  const over = drag && drag.moved && LID() === 'element' && drag.id.startsWith('bin') && Math.hypot(drag.p.x - AC.x, drag.p.y - AC.y) < 150;
  h += `<circle cx="${AC.x}" cy="${AC.y}" r="150" fill="${over ? 'rgba(114,212,232,.08)' : 'rgba(114,212,232,.025)'}" stroke="${over ? '#72d4e8' : 'rgba(114,212,232,.15)'}" stroke-dasharray="4 6"/>`;
  m.sh.forEach((c, k) => { h += `<circle cx="${AC.x}" cy="${AC.y}" r="${SR[k]}" fill="none" stroke="#72d4e8" stroke-opacity=".35" stroke-width="1.3"/>`; });
  h += nucleus(m.p, m.n, t);
  m.sh.forEach((c, k) => {
    const w = reduce ? 0 : t / 1000 * (0.9 / (k + 1)) * (k % 2 ? -1 : 1);
    for (let j = 0; j < c; j++) { const a = w + j * Math.PI * 2 / c - Math.PI / 2; h += ball(AC.x + Math.cos(a) * SR[k], AC.y + Math.sin(a) * SR[k], 4.6, '#72d4e8', '', '', 0); }
  });
  if (m.el) h += `<text x="${AC.x}" y="${AC.y + (SR[Math.max(0, m.sh.length - 1)] || 50) + 20}" font-size="12" fill="#8b96ad" text-anchor="middle">${m.el.name}${m.q ? ' · ион' : ''}</text>`;
  for (const [k, b] of Object.entries(BINS1)) {
    h += `<g data-drag="bin-${k}"><rect x="${b.x - 34}" y="${b.y - 34}" width="68" height="78" rx="12" fill="#121a28" stroke="#26324a" stroke-width="1.5"/>`;
    for (let i = 0; i < 5; i++) { const a = i * 2.4, r = i ? 9 : 0; h += ball(b.x + Math.cos(a) * r, b.y - 6 + Math.sin(a) * r * 0.8, k === 'e' ? 5 : 7, b.c, '', '', 0); }
    h += `<text x="${b.x}" y="${b.y + 26}" font-size="11" fill="#e8ecf4" text-anchor="middle">${b.t}</text><text x="${b.x}" y="${b.y + 38}" font-size="8" fill="#8b96ad" text-anchor="middle">${b.n}</text></g>`;
  }
  return h;
}

// fit the scene: 520 × 405 units, centred, bench at the bottom

// ---------- dragging and tapping ----------

function tap(id) {

  if (id.startsWith('tile-')) return toast('Перетащите знак на карточку элемента.');
  if (id.startsWith('atom-')) return addAtom(id.slice(5), 1);
  if (id.startsWith('in-')) return addAtom(id.slice(3), -1);

function drop(id, p) {
  if (id.startsWith('bin-')) { if (Math.hypot(p.x - AC.x, p.y - AC.y) < 150) addP(id.slice(4), 1); return; }
  if (id.startsWith('tile-')) { const i = cardAt(p); if (i >= 0) place(id.slice(5), i); return; }
  if (id.startsWith('atom-')) { if (inArea(p)) addAtom(id.slice(5), 1); return; }
  if (id.startsWith('in-')) { if (!inArea(p)) addAtom(id.slice(3), -1); return; }
  if (id.startsWith('w-')) { if (nearPanR(p)) addW(+id.slice(2)); return; }
  if (id.startsWith('pw-')) { if (!nearPanR(p)) remW(+id.slice(3)); }

function addP(k, d) {
  const v = S[k] + d;
  if (v < 0) return false;
  if (v > LIM[k]) { toast(k === 'p' ? 'В этой модели — элементы с 1 по 20.' : k === 'n' ? 'Хватит нейтронов: такое ядро сразу развалится.' : 'Больше 20 электронов в этой модели не помещается.'); return false; }

}

  if (x.s !== s) {
    S.wrong++;
    const right = SYM.find(y => y.s === s);
    toast(`Нет: ${s} — от латинского ${right.lat}. Это не ${x.name.toLowerCase()}.`);
    update(); return false;
  }
  S.placed[s] = true; toast(`Верно: ${s} — «${x.pr}», от латинского ${x.lat}.`); update(); return true;

  S.atoms[s] = v; update(); return true;

let last = performance.now(), lastDraw = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  if (LID() === 'mass') {
    const m = model(), target = -9 * Math.tanh(m.diff / 6);
    const na = reduce ? target : S.ang + (target - S.ang) * Math.min(1, dt * 5);

  }

  }
  if (/^k\d$/.test(a)) { S.k = +a[1]; if (!model().mol) toast('Коэффициент относится к целой молекуле — сначала соберите её.'); renderTools(); buildScheme(); update(); return; }
  if (a === 'clear') { S.atoms = { H: 0, C: 0, N: 0, O: 0 }; update(); return; }
  if (a === 'prev' || a === 'next') { const i = SUBS.findIndex(x => x.id === S.sub); setSub(SUBS[(i + (a === 'next' ? 1 : -1) + SUBS.length) % SUBS.length].id); return; }
  if (a === 'cur') { toast(`На левой чашке: ${subNow().name} ${low(S.sub)}`); return; }
  if (a === 'wclear') { S.w = []; update(); return; }
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'element') return m.el ? `${m.el.name}: p ${m.p}, n ${m.n}, e ${m.e}` + (m.q ? ` · заряд ${m.q > 0 ? '+' : '−'}${Math.abs(m.q)}` : ' · нейтральный') : 'Протонов нет — это ещё не атом';
  if (L.id === 'symbols') return `Разложено ${m.placed} из ${SYM.length}`;
  if (L.id === 'formula') {
    const got = ['H2O', 'CO2', 'CH4'].filter(k => m.built[k]);
    return `Собрано: ${got.length ? got.map(low).join(', ') : 'пока ничего'}` + (got.length === 3 ? ' · теперь 2H₂O' : '');
  }
  const got = ['H2O', 'CO2', 'H2SO4'].filter(k => m.found[k]);
  return `Найдено: ${got.length ? got.map(low).join(', ') : 'пока ничего'} · ${m.bal ? 'равновесие' : m.diff > 0 ? 'тяжелее слева' : 'тяжелее справа'}`;
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'atom') {
    set('#r1', m.el ? `${m.el.s} · ${m.el.name}` : '—'); set('#r2', String(m.A)); set('#r3', m.q === 0 ? '0' : (m.q > 0 ? '+' : '−') + Math.abs(m.q));
    set('#inPO', String(S.p)); set('#inNO', String(S.n)); set('#inEO', String(S.e)); val('#inP', S.p); val('#inN', S.n); val('#inE', S.e);
    el.querySelectorAll('#elTab span').forEach(s => s.classList.toggle('on', +s.dataset.z === S.p));
  } else if (m.kind === 'sym') {
    set('#r1', String(m.placed)); set('#r2', String(S.wrong)); set('#r3', String(SYM.length - m.placed));
  } else if (m.kind === 'mol') {
    set('#r1', m.tot ? (m.mol && m.k > 1 ? m.k : '') + low(m.f) : '—'); set('#r2', String(m.tot * (m.mol ? m.k : 1))); set('#r3', m.mol ? m.mol.name : m.tot ? 'нет в справочнике' : '—');
    BUILD.forEach(s => set('#c' + s, String(m.c[s])));
    el.querySelectorAll('#kChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.k === S.k));
  } else {
    set('#r1', low(m.sb.id)); set('#r2', String(m.sum)); set('#r3', m.bal ? 'равновесие' : m.diff > 0 ? 'левая ниже' : 'правая ниже');
    el.querySelectorAll('#subChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === S.sub));
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];

      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'element') {
    let h = `<h2>Какой это атом</h2><div class="formula">Z = p · A = p + n · заряд = p − e</div><h3>Сейчас</h3><div class="steps">` +
      step('протонов p', String(m.p)) + step('порядковый номер Z', m.el ? `${m.p} → ${m.el.name} ${m.el.s} («${m.el.pr}»)` : '0 → элемента нет');
    if (m.el) {
      h += step('массовое число A = p + n', `${m.p} + ${m.n} = ${m.A}`) +
        step('изотоп', `${m.el.name}-${m.A}: ${m.stable ? 'устойчивый' : 'неустойчивый или не существует'}`) +
        step('заряд = p − e', `${m.p} − ${m.e} = ${m.q > 0 ? '+' : m.q < 0 ? '−' : ''}${Math.abs(m.q)}`) +
        step('итог', m.q === 0 ? `нейтральный атом ${m.el.s}` : `${m.q > 0 ? 'положительный' : 'отрицательный'} ион ${ionName(m.el, m.q)}`, 'sum');
      h += `</div><h3>Электронные слои</h3><div class="steps">` + (m.sh.length ? m.sh.map((c, k) => step(`${k + 1}-й слой`, `${c} ${plural(c, 'электрон', 'электрона', 'электронов')}`)).join('') : step('электронов нет', '—')) + `</div>`;
      h += `<p class="note" style="margin-top:10px">Ar(${m.el.s}) в таблице — ${num(m.el.ar)}. Это среднее по природным изотопам, поэтому оно может быть не целым. Устойчивые ядра этого элемента: ${m.el.st.map(n => `${m.el.name.toLowerCase()}-${m.p + n}`).join(', ')}.</p>`;
    } else h += `</div><p class="note" style="margin-top:10px">Без протонов ядра нет — добавьте хотя бы один.</p>`;
    return h;
  }
  if (id === 'symbols') {
    return `<h2>Откуда берутся знаки</h2><div class="formula">ferrum → Fe</div><p class="note">Берут первую букву латинского названия. Если она уже занята, добавляют одну из следующих: C — углерод (carboneum), Cu — медь (cuprum).</p><h3>Ваши карточки</h3><div class="steps">` +
      SYM.map(x => S.placed[x.s] ? step(x.name, `${x.s} ← ${x.lat} · «${x.pr}»`) : step(x.name, '?')).join('') +
      step('разложено', `${m.placed} из ${SYM.length}`, 'sum') + `</div>`;
  }
  if (id === 'formula') {
    if (!m.tot) return `<h2>Читаем формулу</h2><div class="formula">2H₂O</div><div class="steps">${step('2 — коэффициент', 'две молекулы')}${step('₂ после H — индекс', '2 атома H в молекуле')}${step('O без индекса', '1 атом O')}${step('всего атомов', 'H: 2 × 2 = 4, O: 2 × 1 = 2', 'sum')}</div><p class="note" style="margin-top:10px">Соберите молекулу — здесь появится её разбор.</p>`;
    const k = m.mol ? m.k : 1, F = (k > 1 ? k : '') + low(m.f);
    let h = `<h2>Формула ${F}</h2><div class="formula">${F}</div><h3>Сколько атомов</h3><div class="steps">`;
    for (const s of BUILD) if (m.c[s]) h += step(`${s} · ${ATOM[s].name}`, k > 1 ? `${k} × ${m.c[s]} = ${k * m.c[s]}` : `${m.c[s]}`);
    h += step('всего атомов', k > 1 ? `${k} × ${m.tot} = ${k * m.tot}` : String(m.tot), 'sum') + `</div>`;
    h += m.mol ? `<p class="note" style="margin-top:10px">${m.mol.name[0].toUpperCase() + m.mol.name.slice(1)}. Читается: «${readF(m.mol.key)}».${k > 1 ? ` Коэффициент ${k} стоит перед формулой и умножает все атомы.` : ''}</p>`
      : `<p class="note" style="margin-top:10px">Такой молекулы нет в нашем справочнике. Здесь знакомые: H₂, O₂, N₂, O₃, H₂O, H₂O₂, CO, CO₂, CH₄, NH₃.</p>`;
    const got = ['H2O', 'CO2', 'CH4'].map(x => step(low(x), m.built[x] ? 'собрана ✓' : 'ещё нет'));
    return h + `<h3>Задание</h3><div class="steps">${got.join('')}</div>`;
  }
  const sb = m.sb, parts = Object.entries(sb.atoms), isAtom = parts.length === 1 && parts[0][1] === 1, shown = m.found[sb.id] || m.bal;
  let h = `<h2>${isAtom ? 'Ar' : 'Mr'}(${low(sb.id)})</h2><div class="formula">${isAtom ? 'Ar — из таблицы Менделеева' : 'Mr = Σ Ar · индекс'}</div><h3>Расчёт</h3><div class="steps">`;
  if (isAtom) h += step(`Ar(${sb.id})`, shown ? String(m.Mr) : '? — проверьте на весах');
  else {
    h += parts.map(([k, n]) => step(`${k} × ${n}`, `${n} · ${AR[k]} = ${n * AR[k]}`)).join('');
    h += step(`Mr(${low(sb.id)})`, parts.map(([k, n]) => n * AR[k]).join(' + ') + ' = ' + (shown ? m.Mr : '?'), 'sum');
  }
  h += `</div><h3>Весы</h3><div class="steps">` + step('гирьки', S.w.length ? S.w.join(' + ') + ' = ' + m.sum : '0') +
    step('состояние', m.bal ? 'равновесие ✓' : m.diff > 0 ? 'частица тяжелее — добавьте' : 'гирьки тяжелее — снимите', 'sum') + `</div>`;
  h += `<h3>Найдено</h3><div class="steps">` + SUBS.filter(x => m.found[x.id]).map(x => step(`${low(x.id)} · ${x.name}`, `${x.atoms[x.id] === 1 ? 'Ar' : 'Mr'} = ${massOf(x)}`)).join('') + (Object.keys(m.found).length ? '' : step('пока ничего', '—')) + `</div>`;
  return h;
}
const RD = { H: 'аш', C: 'цэ', N: 'эн', O: 'о', S: 'эс' };
const readF = f => (f.match(/[A-Z][a-z]?\d*/g) || []).map(t => { const s = t.match(/[A-Z][a-z]?/)[0], n = t.slice(s.length); return RD[s] + (n ? '-' + ({ 2: 'два', 3: 'три', 4: 'четыре' }[n] || n) : ''); }).join('-');

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'atom') {
    el.innerHTML = `<div class="k">Элемент</div><div class="big">${m.el ? ionName(m.el, m.q) : '—'}<small>${m.el ? m.el.name : 'нет протонов'}</small></div>
      <div class="lr"><span>Z ${m.p}</span><span>A ${m.A}</span><span>${m.q === 0 ? '0' : (m.q > 0 ? '+' : '−') + Math.abs(m.q)}</span></div>`;
  } else if (m.kind === 'sym') {
    el.innerHTML = `<div class="k">Знаки</div><div class="v ${m.placed === SYM.length ? 'ok' : ''}">${m.placed} из ${SYM.length}</div><div class="gauge"><b style="width:${(m.placed / SYM.length * 100).toFixed(1)}%"></b></div><div class="lr"><span>ошибок</span><span>${S.wrong}</span></div>`;
  } else if (m.kind === 'mol') {
    el.innerHTML = `<div class="k">Формула</div><div class="v ${m.mol ? 'ok' : ''}">${m.tot ? (m.mol && m.k > 1 ? m.k : '') + low(m.f) : '—'}</div><div class="lr"><span>${m.mol ? m.mol.name : m.tot ? 'не молекула' : 'пусто'}</span></div><div class="lr"><span>атомов</span><span>${m.tot * (m.mol ? m.k : 1)}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Весы</div><div class="v ${m.bal ? 'ok' : ''}">${m.bal ? 'равновесие' : m.diff > 0 ? 'слева тяжелее' : 'справа тяжелее'}</div><div class="lr"><span>${low(m.sb.id)}</span><span>гирьки ${m.sum}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (m.kind === 'mol' && m.mol && !S.built[m.mol.key]) { S.built[m.mol.key] = true; toast(`Получилась молекула: ${m.mol.name} ${low(m.mol.key)}`); }
  if (m.kind === 'mass' && m.bal && !S.found[m.sb.id]) { S.found[m.sb.id] = true; toast(`Равновесие! ${Object.values(m.sb.atoms).reduce((a, b) => a + b, 0) === 1 ? 'Ar' : 'Mr'}(${low(m.sb.id)}) = ${m.Mr}`); }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Атомы и молекулы освоены!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  element: '<circle cx="33" cy="15" r="11" fill="none" stroke="#72d4e8" stroke-opacity=".6"/><circle cx="31" cy="14" r="3" fill="#ff7a66"/><circle cx="35" cy="15" r="3" fill="#a9b4c9"/><circle cx="32" cy="17.5" r="3" fill="#ff7a66"/><circle cx="44" cy="15" r="2" fill="#72d4e8"/><circle cx="22" cy="15" r="2" fill="#72d4e8"/>',
  symbols: '<rect x="10" y="5" width="20" height="20" rx="4" fill="#e8ecf4"/><text x="20" y="19.5" font-size="11" fill="#0b1019" text-anchor="middle" font-family="IBM Plex Mono">Fe</text><rect x="36" y="5" width="20" height="20" rx="4" fill="#e8ecf4"/><text x="46" y="19.5" font-size="11" fill="#0b1019" text-anchor="middle" font-family="IBM Plex Mono">Cu</text>',
  formula: '<path d="M33 13L22 20M33 13L44 20" stroke="#c8d1e2" stroke-width="1.6"/><circle cx="33" cy="12" r="6" fill="#e5533f"/><circle cx="21" cy="20" r="4" fill="#eef2f8"/><circle cx="45" cy="20" r="4" fill="#eef2f8"/>',
  mass: '<path d="M14 11H52" stroke="#a9b4c9" stroke-width="2"/><path d="M33 11v15M27 27h12" stroke="#8a96b0" stroke-width="1.6"/><path d="M8 20h12q-2 3-6 3t-6-3zM46 20h12q-2 3-6 3t-6-3z" fill="#56627d"/><circle cx="14" cy="17" r="3" fill="#e5533f"/><rect x="49" y="14" width="6" height="6" rx="1" fill="#c9a24a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.p = 1; S.n = 0; S.e = 1; S.placed = {}; S.wrong = 0; S.atoms = { H: 0, C: 0, N: 0, O: 0 }; S.k = 1; S.built = {}; S.sub = 'H2O'; S.w = []; S.found = {}; S.ang = 0;
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'element') now = `Модель атома (ядро и электронные слои). Протонов ${m.p}, нейтронов ${m.n}, электронов ${m.e}. ${m.el ? `Это элемент №${m.p} ${m.el.name} (${m.el.s}), массовое число A = ${m.A}, изотоп ${m.stable ? 'устойчивый' : 'неустойчивый или не существует'}, заряд частицы ${m.q > 0 ? '+' : m.q < 0 ? '−' : ''}${Math.abs(m.q)} (${m.q === 0 ? 'нейтральный атом' : 'ион ' + ionName(m.el, m.q)}). Электроны по слоям: ${m.sh.join(', ') || 'нет'}.` : 'Протонов нет, элемента нет.'}`;
  if (id === 'symbols') now = `Игра: разложить знаки Fe, Cu, Ag, Au, Hg, Pb, Zn, Al по карточкам с русскими названиями (железо, медь, серебро, золото, ртуть, свинец, цинк, алюминий). Уже правильно разложены: ${SYM.filter(x => S.placed[x.s]).map(x => `${x.s} — ${x.name}`).join(', ') || 'ничего'}. Ошибок: ${S.wrong}. Не называй ученику ответы для оставшихся карточек — подсказывай через латинские названия и наводящие вопросы.`;
  if (id === 'formula') now = `Поле сборки молекул. В поле атомов: ${BUILD.map(s => `${s} ${m.c[s]}`).join(', ')}. ${m.mol ? `Получилась молекула ${m.mol.name} ${m.mol.key}, коэффициент ${m.k} (на экране ${m.k > 1 ? m.k : ''}${m.mol.key}).` : m.tot ? `Формула ${m.f}, такой молекулы в справочнике лаборатории нет (знакомые: H2, O2, N2, O3, H2O, H2O2, CO, CO2, CH4, NH3).` : 'Поле пустое.'} Уже собраны: ${Object.keys(S.built).join(', ') || 'ничего'}.`;
  if (id === 'mass') now = `Рычажные весы. На левой чашке ${m.sb.name} ${m.sb.id}, на правой гирьки ${S.w.join(' + ') || 'нет'} = ${m.sum} эталонных единиц (1/12 массы атома углерода). Весы: ${m.bal ? 'в равновесии' : m.diff > 0 ? 'левая чашка тяжелее' : 'правая чашка тяжелее'}. Ar: H 1, C 12, N 14, O 16, S 32, Fe 56. Уже найдены: ${SUBS.filter(x => S.found[x.id]).map(x => `${x.id} = ${massOf(x)}`).join(', ') || 'ничего'}. ${m.bal || S.found[m.sb.id] ? '' : 'Не называй готовое значение Mr для текущего вещества — помоги посчитать вопросами.'}`;
  return [
    `Предмет: химия, 7 класс. Тема «Атомы и молекулы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    element: 'Почему число нейтронов не меняет элемент?', symbols: 'Почему у меди знак Cu, а не M?',
    formula: 'Чем индекс отличается от коэффициента?', mass: 'Почему у Ar нет единиц измерения?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
