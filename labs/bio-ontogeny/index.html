<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: индивидуальное развитие организма — оплодотворение, эмбриональное развитие, метаморфоз, рост, старение и стволовые клетки.">
<title>Индивидуальное развитие организма</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 300px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Онтогенез</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Модель развития организма. Клетки, карточки и животных можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>

      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>

      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {

];

// ---------- models ----------
const orgOK = j => { const M = S.m3[j]; return M.slot.every((c, k) => c === k); };
function model() {
  const id = LID();
  if (id === 'fert') return { kind: 'fert', fz: S.fz, ans: S.ans, n: ORG[S.org].n2 / 2 };
  if (id === 'embryo') { let n = 0, r = 0; S.cards.forEach((b, i) => { if (b !== null) { n++; if (b === OC[i].p) r++; } }); return { kind: 'emb', st: S.st, placed: n, right: r }; }
  if (id === 'meta') {
    let solved = 0; ORG3.forEach((o, j) => { if (orgOK(j) && S.m3[j].ty === o.type) solved++; });
    const M = S.m3[S.o3], filled = M.slot.filter(c => c >= 0).length;
    return { kind: 'meta', solved, o: S.o3, filled, n: M.slot.length, ok: orgOK(S.o3), ty: M.ty };
  }
  return { kind: 'grow', vis: S.vis.filter(Boolean).length, pl: S.pl, axo: S.axo, types: Object.keys(S.got).length, age: S.age, per: perOf(S.age) };
}

const lbl = (x, y, s, size = 10.5, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const bold = 'font-weight="600"';
function rod(x, y, a, len, c, w = 3.4) { return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><rect x="${-w / 2}" y="${f(-len / 2)}" width="${w}" height="${f(len)}" rx="${w / 2}" fill="${c}"/></g>`; }
function nucleus(x, y, r, cols, op = 1) {
  let h = `<g opacity="${f(op)}"><circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="rgba(180,140,255,.12)" stroke="#b48cff" stroke-width="1.6"/>`;
  const n = cols.length;
  cols.forEach((c, i) => { const len = [12, 9, 6][i % 3] * r / 18; h += rod(x - r * 0.55 + (i + 0.5) * r * 1.1 / n, y + (i % 2 ? 2 : -2), (i % 2 ? 14 : -10), len, c, Math.max(2, r / 7)); });
  return h + '</g>';
}

function sperm(x, y, a, t, ph, op = 1, tailOp = 1) {

  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})" opacity="${f(op)}"><path d="${d}" stroke="#9fd8ea" stroke-width="1.4" fill="none" opacity="${f(tailOp)}"/><rect x="-12" y="-1.6" width="6" height="3.2" rx="1.4" fill="#72d4e8" opacity="${f(tailOp)}"/><ellipse cx="0" cy="0" rx="7" ry="4.6" fill="#2c5f8a" stroke="#72d4e8" stroke-width="1.3"/><path d="M3 -3.6Q8.6 0 3 3.6" fill="#c9eef7" opacity=".85"/></g>`;

// ---------- actions ----------

  S.sel3 = -1;

const scene = $('#scene');

// the task card and the meter cover the top of the stage: the scene goes below them
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const tk = $('.task').getBoundingClientRect(), mt = $('#meter').getBoundingClientRect();
  const cover = Math.max(tk.bottom, mt.bottom) - rc.top;

// ---------- pointer ----------

const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

    if (k.startsWith('sp')) { drag.kind = 'sp'; drag.i = +k.slice(2); }

    else if (k[0] === 'k') { const i = +k.slice(1), [cx, cy] = cardPos3(i); Object.assign(drag, { kind: 'k', card: i, ox: cx - p.x, oy: cy - p.y }); }
    else if (k === 'age') { drag.kind = 'age'; drag.moved = true; S.play = false; renderTools(); setAge(ageAt(p.x)); }
    else if (k === 'stem') drag.kind = 'stem';
    S.dragP = p;
    scene.classList.add('grabbing');

});
scene.addEventListener('pointermove', e => {
  if (!drag) return;

  if (drag.kind === 'hit' || !drag.moved) return;

});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  const P = S.dragP; S.dragP = null;
  if (cancel) return;
  if (d.kind === 'sp') {
    if (!d.moved || !P) { toast('Сперматозоид гаплоидный (n). Перетащите его в яйцеклетку.'); return; }
    if (Math.hypot(P.x - EC.x, P.y - EC.y) < ER + 30) fertilize(d.i, P);
    else S.spRet[d.i] = { x: P.x, y: P.y, t: now() };
    return;
  }
  if (d.kind === 'c') {
    if (d.moved && P) {
      const cx = P.x + d.ox, cy = P.y + d.oy;
      let bin = null; for (let k = 0; k < 3; k++) { const B = BIN(k); if (cy >= BY0 - 10 && cx >= B.x0 - 4 && cx <= B.x1 + 4) bin = k; }
      moveCard2(d.card, bin);
    } else { S.sel = S.sel === d.card ? -1 : d.card; renderTools(); update(); }
    return;
  }
  if (d.kind === 'k') {
    const o = ORG3[S.o3], n = o.st.length;
    if (d.moved && P) {

      let slot = null;
      if (Math.abs(cy - SY3) < KH * 0.75) { let best = 1e9; for (let k = 0; k < n; k++) { const dd = Math.abs(slotX(k, n) - cx); if (dd < best && dd < 62) { best = dd; slot = k; } } }

function tap(id, p) {
  const L = LID();

  if (L === 'embryo') {
    if (id.startsWith('st')) { const i = +id.slice(2); if (i <= S.maxSt + 1) setStage(i); else toast('Стадии идут по порядку — нажимайте «Дальше».'); }
    if (id.startsWith('bin-')) { if (S.sel >= 0) moveCard2(S.sel, +id.slice(4)); else toast('Сначала выберите карточку органа — нажмите на неё.'); }
  }
  if (L === 'meta') {
    if (id.startsWith('sl')) { if (S.sel3 >= 0) placeCard3(S.sel3, +id.slice(2)); else toast('Сначала нажмите на карточку стадии или перетащите её.'); }

    if (id === 'limb') cutLimb();
    if (id.startsWith('z-')) { const Z = ZONES.find(z => z.id === id.slice(2)); toast(S.got[Z.id] ? Z.med : 'Перетащите сюда стволовую клетку из центра.'); }
  }
}

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(100, t - lastT) : 16; lastT = t;
  let anim = false;
  const id = LID();
  if (id === 'fert') {
    anim = true;
    if (S.fz === 1 && t - S.fzT >= FZ_MS) { S.fz = 2; toast('Ядра слились — это зигота. Сколько в ней хромосом? Ответ — на панели внизу.'); renderTools(); update(); }
  }
  if (id === 'embryo' && t - S.stT < 500) anim = true;
  if (id === 'grow') {
    if (S.mode === 'life' && S.play) { setAge(S.age + dt / 1000 * 8); if (S.age >= 80) { S.play = false; renderTools(); } anim = true; }
    if (S.mode === 'stem') anim = true;
    if (S.rg0 && !S.pl && t - S.rg0 >= 3200) { S.pl = true; toast(`Каждый из ${S.cuts.length + 1} кусочков отрастил голову и хвост — получились целые планарии.`); update(); }
    if (S.limbT0 && !S.axo && t - S.limbT0 >= 4200) { S.axo = true; toast('Лапа аксолотля полностью выросла — с костями, мышцами и пальцами.'); update(); }
    if (S.mode === 'regen' && ((S.rg0 && t - S.rg0 < 3300) || (S.limbT0 && t - S.limbT0 < 4300))) anim = true;
  }
  if (drag) anim = true;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function placeHint() {

}
addEventListener('resize', placeHint);
function act(a) {

  if (a === 'again') { resetFert(); toast('Новая яйцеклетка и сперматозоиды.'); renderTools(); update(); return; }
  if (a === 'next') { if (S.st === 7) toast('Нейрула — последняя стадия в модели. Дальше идёт органогенез и рост зародыша.'); else setStage(S.st + 1); return; }
  if (a === 'prev') return setStage(S.st - 1);
  if (a.startsWith('bin-')) { if (S.sel < 0) { toast('Сначала нажмите на карточку органа.'); return; } return moveCard2(S.sel, +a.slice(4)); }

  if (a.startsWith('src-')) { S.src = +a.slice(4); toast(S.src ? 'Кроветворная стволовая клетка из костного мозга: даёт только клетки крови.' : 'ИПСК — перепрограммированная клетка кожи: может стать почти любой клеткой.'); renderTools(); update(); return; }
  if (a === 'reset') { const l = LID(); if (l === 'embryo') resetEmbryo(); if (l === 'meta') resetMeta(); renderTools(); buildScheme(); update(); return; }
}

const TABS = ['overview', 'parts', 'scheme', 'calc'];

}

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'fert') return `Оплодотворение: ${m.fz === 0 ? 'ещё нет' : m.fz === 1 ? 'идёт…' : 'зигота ✓'} · ответ: ${m.ans ? (m.ans * m.n) + (m.ans === 2 ? ' ✓' : ' ✗') : '—'}`;
  if (m.kind === 'emb') return `Стадия: ${EST[m.st].t.toLowerCase()}${m.st === 7 ? ' ✓' : ''} · органы: ${m.placed < 9 ? `разложено ${m.placed} из 9` : `верно ${m.right} из 9`}`;
  if (m.kind === 'meta') return `Решено организмов: ${m.solved} из 4 · ${ORG3[m.o].t}: ${m.filled}/${m.n} карточек`;
  return `Периоды: ${m.vis}/4 · регенерация: ${(m.pl ? 1 : 0) + (m.axo ? 1 : 0)}/2 · типы клеток: ${Math.min(m.types, 3)}/3`;
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (s, fn) => el.querySelectorAll(s).forEach(b => b.setAttribute('aria-pressed', fn(b)));
  if (m.kind === 'fert') {
    press('#orgChips button', b => +b.dataset.o === S.org);
    set('#r1', 'n = ' + m.n); set('#r2', m.fz === 2 ? '2n = ' + 2 * m.n : '—'); set('#r3', ['гаметы', 'слияние', 'зигота'][m.fz]);
    [1, 2, 4].forEach(v => set('#ansB' + v, String(v * m.n)));
  } else if (m.kind === 'emb') {
    press('#stChips button', b => +b.dataset.s === S.st);
    el.querySelectorAll('#stChips button').forEach(b => { b.disabled = +b.dataset.s > S.maxSt + 1; });
    press('#cdChips button', b => +b.dataset.i === S.sel);
    set('#r1', EST[m.st].s); set('#r2', ['1', '2', '4', '8', '≈ 32', 'сотни', 'тысячи', 'тысячи'][m.st]); set('#r3', m.placed < 9 ? `${m.placed}/9` : `${m.right} ✓`);
  } else if (m.kind === 'meta') {
    press('#o3Chips button', b => +b.dataset.j === S.o3);
    const o = ORG3[S.o3], M = S.m3[S.o3], k3 = el.querySelector('#k3Chips'), s3 = el.querySelector('#s3Chips');
    if (k3) { k3.innerHTML = o.st.map((s, c) => `<button data-c="${c}" aria-pressed="${S.sel3 === c}">${s.replace('|', ' ')}</button>`).join(''); k3.querySelectorAll('button').forEach(b => b.onclick = () => { S.sel3 = +b.dataset.c; update(); }); }
    if (s3) { s3.innerHTML = M.slot.map((c, k) => `<button data-k="${k}">${k + 1}${c >= 0 ? ': ' + o.st[c].split('|')[0] : ''}</button>`).join(''); s3.querySelectorAll('button').forEach(b => b.onclick = () => { if (S.sel3 < 0) toast('Сначала выберите карточку стадии.'); else placeCard3(S.sel3, +b.dataset.k); }); }
    set('#r1', o.t); set('#r2', m.filled < m.n ? `${m.filled}/${m.n}` : m.ok ? 'верно' : 'ошибки'); set('#r3', `${m.solved}/4`);
  } else {
    press('#mdChips button', b => b.dataset.m === S.mode);
    press('#srcChips button', b => +b.dataset.j === S.src);
    set('#inAgeO', yrs(S.age)); val('#inAge', S.age);
    set('#r1', Math.round(height(S.age)) + ' см'); set('#r2', PER[m.per].s); set('#r3', Math.round(100 - S.age * 0.5) + ' %');
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'fert') {
    const O = ORG[S.org], n = O.n2 / 2;
    let h = `<h2>${O.t}: n + n = 2n</h2><div class="formula">хромосом в зиготе = n (яйцеклетка) + n (сперматозоид)</div><div class="steps">` +
      step('Яйцеклетка', `n = ${n}`) + step('Сперматозоид', `n = ${n}`) + step('Зигота', `${n} + ${n} = ${2 * n} (2n)`, 'sum') + '</div>';
    h += `<h3>Количество ДНК</h3><div class="steps">` + step('Гамета', '1n1c') + step('Зигота после слияния', '2n2c') + step('Зигота перед первым делением', '2n4c (ДНК удвоилась)', 'sum') + '</div>';
    h += `<h3>Сколько разных зигот</h3><div class="formula">вариантов гамет = 2ⁿ (без кроссинговера)</div><div class="steps">` +
      step('Вариантов яйцеклеток', n > 20 ? `2^${n} ≈ ${big(2 ** n)}` : big(2 ** n)) + step('Вариантов сперматозоидов', n > 20 ? `2^${n} ≈ ${big(2 ** n)}` : big(2 ** n)) +
      step('Вариантов зигот у пары', `2^${2 * n} ≈ ${(2 ** (2 * n)).toExponential(1).replace('.', ',').replace('e+', ' · 10^')}`, 'sum') + '</div>' +
      `<p class="note" style="margin-top:8px">Поэтому родные братья и сёстры (кроме однояйцевых близнецов) генетически разные.</p>`;
    return h;
  }
  if (id === 'embryo') {
    let h = `<h2>Дробление</h2><div class="formula">клеток = 2ᵏ · объём клетки = V зиготы ÷ 2ᵏ</div><div class="steps">` +
      [1, 2, 3, 5, 7].map(k => step(`${k} ${k === 1 ? 'деление' : k < 5 ? 'деления' : 'делений'}`, `${2 ** k} клеток · 1/${2 ** k} объёма`)).join('') + '</div>' +
      `<p class="note" style="margin-top:8px">При дроблении нет роста между делениями, поэтому клетки быстро мельчают. У зародыша человека первые деления идут примерно раз в сутки, у лягушки — каждые полчаса-час.</p>`;
    h += `<h3>Сколько делений до 1000 клеток</h3><div class="steps">` + step('2¹⁰', '1024') + step('Значит', 'около 10 делений', 'sum') + '</div>';
    h += `<h3>Ваша сортировка</h3><div class="steps">` + OC.map((c, i) => step(c.t, S.cards[i] === null ? '—' : LAYERS[S.cards[i]] + (m.placed === 9 ? (S.cards[i] === c.p ? ' ✓' : ' ✗') : ''))).join('') +
      step('Итого', m.placed === 9 ? `верно ${m.right} из 9` : `разложено ${m.placed} из 9`, 'sum') + '</div>';
    return h;
  }
  if (id === 'meta') {
    let h = `<h2>Ваши ответы</h2><div class="steps">` + ORG3.map((o, j) => step(o.t, (S.m3[j].slot.every(c => c >= 0) ? (orgOK(j) ? 'порядок ✓' : 'порядок ✗') : 'не собран') + ' · ' + (S.m3[j].ty === null ? 'тип —' : S.m3[j].ty === o.type ? (o.type ? 'непрямое ✓' : 'прямое ✓') : 'тип ✗'))).join('') + step('Решено', `${m.solved} из 4`, 'sum') + '</div>';
    h += `<h3>Сколько живёт личинка и взрослый</h3><div class="steps">` +
      step('Майский жук', 'личинка 3–4 года, жук — 1–2 месяца') + step('Подёнка', 'личинка 1–3 года, взрослая — от нескольких часов до пары дней') +
      step('Лягушка', 'головастик — 1–4 месяца') + step('Вывод', 'большую часть жизни многие насекомые — личинки', 'sum') + '</div>';
    h += `<h3>Линьки</h3><p class="note">Покровы насекомых не растягиваются, поэтому личинка растёт скачками — после каждой линьки. У кузнечика обычно около 5 линек; крылья у личинки увеличиваются с каждой.</p>`;
    return h;
  }
  const a = S.age, gr = growth(a);
  let h = `<h2>Рост в ${Math.floor(a)} лет</h2><div class="steps">` + step('Рост', `${Math.round(height(a))} см`) + step('Скорость роста', `${ru(Math.max(0, gr), 1)} см/год`) + step('Период', PER[m.per].t, 'sum') + '</div>';
  h += `<h3>Пропорции</h3><div class="formula">доля головы = высота головы ÷ рост</div><div class="steps">` + step('Новорождённый', '≈ 1/4') + step('6 лет', '≈ 1/6') + step('Взрослый', '≈ 1/7 – 1/8', 'sum') + '</div>';
  h += `<h3>Предел Хейфлика</h3><div class="formula">клеток после k делений = 2ᵏ</div><div class="steps">` + step('Делений клетки в культуре', '≈ 50') + step('Потомков одной клетки', '2⁵⁰ ≈ 1,1 · 10¹⁵') + step('Клеток в теле взрослого', '≈ 3 · 10¹³', 'sum') + '</div>' +
    `<p class="note" style="margin-top:8px">Даже ограниченного числа делений хватило бы на много организмов — но с возрастом в тканях копятся повреждения, и стволовых клеток становится меньше.</p>`;
  h += `<h3>Задание</h3><div class="steps">` + step('Периоды жизни', `${m.vis} из 4`) + step('Планарии', m.pl ? 'выросли ✓' : 'нет') + step('Лапа аксолотля', m.axo ? 'выросла ✓' : 'нет') + step('Типы клеток', `${m.types} из 3` + (m.types >= 3 ? ' ✓' : ''), 'sum') + '</div>';
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), L = LESSONS[S.lesson];
  if (m.kind === 'fert') el.innerHTML = `<div class="k">Оплодотворение</div><div class="v ${S.done.fert ? 'ok' : ''}">${['Гаметы n', 'Слияние ядер', 'Зигота 2n'][m.fz]}</div>
      <div class="gauge"><b style="width:${(m.fz / 2 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>хромосом</span><span>${m.n} + ${m.n}</span></div><div class="lr"><span>ответ</span><span>${m.ans ? m.ans * m.n : '—'}</span></div>`;
  else if (m.kind === 'emb') el.innerHTML = `<div class="k">Зародыш</div><div class="v ${S.done.embryo ? 'ok' : ''}">${EST[m.st].s}</div>
      <div class="gauge"><b style="width:${(m.st / 7 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>стадия</span><span>${m.st + 1}/8</span></div><div class="lr"><span>органы</span><span>${m.placed < 9 ? m.placed + '/9' : m.right + ' из 9'}</span></div>`;
  else if (m.kind === 'meta') el.innerHTML = `<div class="k">Развитие</div><div class="v ${S.done.meta ? 'ok' : ''}">${ORG3[m.o].t}</div>
      <div class="gauge"><b style="width:${(m.solved / 4 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>карточки</span><span>${m.filled}/${m.n}</span></div><div class="lr"><span>решено</span><span>${m.solved}/4</span></div>`;
  else el.innerHTML = `<div class="k">Онтогенез</div><div class="v ${S.done.grow ? 'ok' : ''}">${{ life: 'Рост', regen: 'Регенерация', stem: 'Стволовые' }[S.mode]}</div>
      <div class="gauge"><b style="width:${(((m.vis / 4) + (m.pl + m.axo) / 2 + Math.min(m.types, 3) / 3) / 3 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>периоды</span><span>${m.vis}/4</span></div><div class="lr"><span>регенерация</span><span>${(m.pl ? 1 : 0) + (m.axo ? 1 : 0)}/2</span></div><div class="lr"><span>типы клеток</span><span>${Math.min(m.types, 3)}/3</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы прошли онтогенез — от зиготы до старости!'), 1500);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  fert: '<circle cx="42" cy="15" r="11" fill="none" stroke="#ffd896"/><circle cx="42" cy="15" r="4" fill="#b48cff" opacity=".6"/><ellipse cx="22" cy="12" rx="3.5" ry="2.4" fill="#72d4e8"/><path d="M18 12q-4 -3 -7 0t-7 0" stroke="#72d4e8" fill="none"/><ellipse cx="24" cy="21" rx="3.5" ry="2.4" fill="#72d4e8"/><path d="M20 21q-4 -3 -7 0t-7 0" stroke="#72d4e8" fill="none"/>',
  embryo: '<circle cx="12" cy="15" r="8" fill="none" stroke="#ffd896"/><circle cx="31" cy="15" r="8" fill="none" stroke="#ffd896" stroke-dasharray="2 2"/><path d="M45 21A9 9 0 1 1 59 21" fill="none" stroke="#72d4e8" stroke-width="2.4"/><path d="M48 19A5 5 0 1 1 56 19" fill="none" stroke="#ffb547" stroke-width="2"/>',
  meta: '<circle cx="9" cy="16" r="3" fill="none" stroke="#9fb2d0"/><ellipse cx="25" cy="16" rx="5" ry="4" fill="#4a5a44"/><path d="M29 16q5 -3 8 1" stroke="#56627d" fill="none"/><ellipse cx="51" cy="17" rx="8" ry="5" fill="#7fb85a"/><path d="M14 16h4M39 16h4" stroke="#8b96ad"/>',
  grow: '<path d="M4 26C14 26 14 12 24 10C34 8 44 8 62 9" stroke="#86e0a8" fill="none" stroke-width="1.6"/><circle cx="50" cy="20" r="5" fill="rgba(134,224,168,.3)" stroke="#86e0a8"/><circle cx="50" cy="20" r="2" fill="#b48cff"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'fert') {
    now = `Модель оплодотворения. Организм для подсчёта: ${ORG[S.org].t}, 2n = ${ORG[S.org].n2}. Состояние: ${['сперматозоиды ещё не проникли в яйцеклетку', 'идёт оплодотворение, пронуклеусы сближаются', 'ядра слились, образовалась зигота'][m.fz]}. Ответ ученика о числе хромосом в зиготе: ${m.ans ? m.ans * m.n + (m.ans === 2 ? ' (верно)' : ' (неверно)') : 'ещё не выбран'}.`;
    guide = 'Не называй ответ (2n) прямо. Спроси, сколько хромосом в каждой гамете и что происходит с ядрами при оплодотворении. Объясни, почему в яйцеклетку проникает только один сперматозоид.';
  }
  if (id === 'embryo') {
    now = `Модель зародыша: стадия «${EST[m.st].t}» (${m.st + 1} из 8, дальше всего дошли до «${EST[S.maxSt].t}»). Сортировка органов по листкам: ` +
      OC.map((c, i) => `«${c.t}» → ${S.cards[i] === null ? 'не разложена' : LAYERS[S.cards[i]].toLowerCase()}`).join('; ') + '. ' + (m.placed === 9 ? `Все разложены, верно ${m.right} из 9.` : `Разложено ${m.placed} из 9.`);
    guide = 'Не говори, в какую коробку класть орган. Спроси, какой листок наружный, а какой выстилает первичную кишку, и что логично из него развивается. Объясни, почему при дроблении клетки мельчают.';
  }
  if (id === 'meta') {
    now = 'Расстановка стадий: ' + ORG3.map((o, j) => { const M = S.m3[j]; return `${o.t} — ячейки: ${M.slot.map(c => c >= 0 ? o.st[c].replace('|', ' ') : 'пусто').join(' → ')}; порядок ${orgOK(j) ? 'верный' : 'не собран или с ошибками'}; тип: ${M.ty === null ? 'не выбран' : M.ty ? 'непрямое' : 'прямое'}${M.ty !== null ? (M.ty === o.type ? ' (верно)' : ' (неверно)') : ''}`; }).join('. ') + `. Сейчас на столе: ${ORG3[S.o3].t}. Решено ${m.solved} из 4.`;
    guide = 'Не называй правильный порядок. Спроси, что вылупляется из яйца и похоже ли оно на взрослого; есть ли у этого животного стадия покоя (куколка). Помоги отличить полное и неполное превращение.';
  }
  if (id === 'grow') {
    now = `Режим: ${MODES[S.mode]}. Возраст на графике: ${Math.floor(S.age)} лет (${PER[m.per].t}), рост ${Math.round(height(S.age))} см. Пройдено периодов жизни: ${m.vis} из 4. Планария: ${S.pl ? 'регенерировала из ' + (S.cuts.length + 1) + ' кусочков' : S.cuts.length ? 'разрезана на ' + (S.cuts.length + 1) + ' кусочков, регенерация не завершена' : 'не разрезана'}. Лапа аксолотля: ${S.axo ? 'отросла' : S.limbT0 ? 'отрастает' : 'не трогали'}. Источник стволовых клеток: ${SRC[S.src]}. Получены типы клеток: ${Object.keys(S.got).map(k => ZONES.find(z => z.id === k).t).join(', ') || 'пока нет'} (${m.types} из 3 нужных).`;
    guide = 'Помогай по шагам задания. Объясни разницу между плюрипотентными и мультипотентными клетками, если ученик пытается получить нейрон из кроветворной клетки. Не обещай, что стволовые клетки лечат всё: многие методы ещё в клинических испытаниях.';
  }
  return [
    `Раздел: биология, 10 класс, тема «Индивидуальное развитие организма» (онтогенез). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { fert: 'Почему в яйцеклетку проникает только один сперматозоид?', embryo: 'Почему при дроблении зародыш не растёт?', meta: 'Чем полное превращение отличается от неполного?', grow: 'Почему человек не может отрастить руку, как аксолотль?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

new ResizeObserver(fit).observe(scene);
new ResizeObserver(fit).observe($('.task'));
setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
