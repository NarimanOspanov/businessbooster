<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8 класс: минеральное питание, фотосинтез в листе, испарение воды, размножение растений.">
<title>Как живёт растение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">

<script>
(() => {

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();

];

  sex: { name: 'Семенное', c: '#ff9ecb', feat: 'Половое: из семени, которое образовалось после оплодотворения. Потомки получают признаки двух родителей и отличаются друг от друга.' },
};
const GRK = ['veg', 'sex'];
const ITEMS = [
  { id: 'potato', name: ['Клубень', 'картофеля'], short: 'Клубень картофеля', ans: 'veg', organ: 'клубень — видоизменённый подземный побег, из «глазков»-почек растут ростки', c: '#d9b070', kids: null },

}

// fit the scene: 520 × 405 units, centred, content at the bottom

function loop(t) {
  requestAnimationFrame(loop);
  let anim = false;
  const id = LID();
  if (id === 'min') anim = !reduce && [1, 2, 3, 4].some(j => S.fixed[j] && t - S.healT[j] < 1600);
  if (id === 'photo' && !reduce) anim = true;

    if (!reduce) { S.bpos = (S.bpos + model().E * dt / 1000 * 0.06) % 1; anim = true; }
  }
  if (id === 'repro' && !reduce && S.grown) anim = t - S.growT < 1000;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'min') return `Вылечено ${m.healed} из 4 · ошибок ${m.mist}`;
  if (m.kind === 'photo') return `Кислород: ${m.B} пузырьков/мин · цель 40`;
  if (m.kind === 'transp') return m.hi ? `Максимум ≥ 5 есть ✓ · сейчас ${ru(m.E, 2)} мл/ч, цель ≤ 0,5` : `Испарение ${ru(m.E, 2)} мл/ч · цель ≥ 5`;
  return m.placed < 8 ? `Разложено ${m.placed} из 8` : m.grown ? `Верно ${m.right} из 8 · потомство выросло` : `Верно ${m.right} из 8 · вырастите потомство`;
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
function photoChart() {
  let h = `<svg class="diag" viewBox="0 0 120 64" role="img" aria-label="Пузырьки в минуту при разном расстоянии до лампы">`, d = '';
  for (let x = 10; x <= 60; x++) { const r = photoRates(x, S.soda, S.temp); d += `${x === 10 ? 'M' : 'L'}${f(12 + (x - 10) * 2)} ${f(52 - r.B * .88)}`; }
  h += `<path d="M12 52H112M12 8V52" stroke="#26324a" stroke-width=".6"/><path d="M12 ${f(52 - 40 * .88)}H112" stroke="#86e0a8" stroke-width=".5" stroke-dasharray="2 2"/>`;
  h += `<path d="${d}" stroke="#ffb547" stroke-width="1.2" fill="none"/>`;
  const m = model(); h += `<circle cx="${f(12 + (S.dist - 10) * 2)}" cy="${f(52 - m.B * .88)}" r="2.2" fill="#72d4e8"/>`;
  h += `<text x="12" y="60" font-size="4" fill="#8b96ad">расстояние до лампы 10…60 см</text><text x="100" y="${f(50 - 40 * .88)}" font-size="3.6" fill="#86e0a8">40/мин</text>`;
  return h + `</svg>`;
}
function transpChart() {
  let h = `<svg class="diag" viewBox="0 0 120 64" role="img" aria-label="Испарение при разной влажности воздуха">`, d = '';
  const m = model(), k = 0.12 * WINDF[S.wind] * m.st * m.n / 6, rs = satV(S.temp);
  for (let H = 30; H <= 90; H += 5) d += `${H === 30 ? 'M' : 'L'}${f(12 + (H - 30) / 60 * 100)} ${f(52 - k * rs * (1 - H / 100) * 6)}`;
  h += `<path d="M12 52H112M12 8V52" stroke="#26324a" stroke-width=".6"/><path d="M12 ${f(52 - 30)}H112" stroke="#86e0a8" stroke-width=".5" stroke-dasharray="2 2"/><path d="M12 ${f(52 - 3)}H112" stroke="#ffb547" stroke-width=".5" stroke-dasharray="2 2"/>`;
  h += `<path d="${d}" stroke="#72d4e8" stroke-width="1.2" fill="none"/><circle cx="${f(12 + (S.hum - 30) / 60 * 100)}" cy="${f(52 - m.E * 6)}" r="2.2" fill="#ffb547"/>`;
  h += `<text x="12" y="60" font-size="4" fill="#8b96ad">влажность воздуха 30…90%</text><text x="100" y="${f(50 - 30)}" font-size="3.6" fill="#86e0a8">5 мл/ч</text>`;
  return h + `</svg>`;
}
function buildScheme() {

  let h = '';
  if (id === 'min') h = `<h2>Водные культуры</h2><p class="note">Выберите банку и соль, затем нажмите «Добавить». Площадь грядки нужна для расчёта удобрения.</p>
      <div class="ctl"><div class="lbl">Банка</div><div class="chips" id="jChips">${JARS.map((J, j) => `<button data-j="${j}">${J.lbl}</button>`).join('')}</div></div>

      `<dl class="reads"><div><dt>Пузырьков/мин</dt><dd id="r1"></dd></div><div><dt>Свет</dt><dd id="r2"></dd></div><div><dt>Ограничивает</dt><dd id="r3"></dd></div></dl>`;
  if (id === 'transp') h = `<h2>Испарение</h2><p class="note">Голубая линия — испарение при разной влажности воздуха, остальное как сейчас. Точка — ваш опыт.</p><div id="tDiag"></div>` +

      <div class="row"><button class="ghostbtn" data-a="leaves">Вернуть листья</button><button class="ghostbtn" data-a="reset">Сбросить</button></div>`;

  on('#inArea', v => { S.area = v; update(); });
  el.querySelectorAll('#jChips button').forEach(b => b.onclick = () => { S.jsel = +b.dataset.j; update(); });
  el.querySelectorAll('#eChips button').forEach(b => b.onclick = () => { S.bsel = S.bsel === b.dataset.k ? null : b.dataset.k; update(); });
  el.querySelectorAll('#wChips button').forEach(b => b.onclick = () => { setWind(+b.dataset.w); renderTools(); });
  el.querySelectorAll('#nChips button').forEach(b => b.onclick = () => { if (S.night !== (b.dataset.n === '1')) setNight(b.dataset.n === '1'); renderTools(); });
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (m.kind === 'min') {
    set('#r1', `${m.healed} из 4`); set('#r2', String(m.mist)); set('#r3', JARS[S.jsel].lbl);
    set('#inAreaO', S.area + ' м²'); val('#inArea', S.area);
    el.querySelectorAll('#jChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.j === S.jsel));
    el.querySelectorAll('#eChips button').forEach(b => b.setAttribute('aria-pressed', S.bsel === b.dataset.k));
  } else if (m.kind === 'photo') {
    const d = el.querySelector('#pDiag'); if (d) d.innerHTML = photoChart();
    set('#inDistO', S.dist + ' см'); val('#inDist', S.dist); set('#inSodaO', String(S.soda)); val('#inSoda', S.soda); set('#inTempO', S.temp + ' °C'); val('#inTemp', S.temp);
    set('#r1', String(m.B)); set('#r2', m.L + '%'); set('#r3', { L: 'свет', C: 'CO₂', T: 'тепло' }[m.lim]);
  } else if (m.kind === 'transp') {
    const d = el.querySelector('#tDiag'); if (d) d.innerHTML = transpChart();
    set('#inTO', S.temp + ' °C'); val('#inT', S.temp); set('#inHO', S.hum + '%'); val('#inH', S.hum);
    set('#r1', ru(m.E, 2) + ' мл/ч'); set('#r2', `${m.n} из 6`); set('#r3', S.night ? 'закрыты' : 'открыты');
    el.querySelectorAll('#wChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.w === S.wind));
    el.querySelectorAll('#nChips button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.n === '1') === S.night));
  } else {
    set('#r1', `${m.placed} из 8`); set('#r2', m.placed === 8 ? `${m.right} из 8` : '—'); set('#r3', S.look >= 0 ? ITEMS[S.look].short : '—');
    const bl = el.querySelector('#binList');
    if (bl) bl.innerHTML = GRK.map((k, b) => step(GRP[k].name, ITEMS.filter((_, c) => S.bin[c] === b).map(s => s.short).join(', ') || '—')).join('');
  }
}

      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'min') {
    const J = JARS[S.jsel];
    let h = `<h2>Как поставить диагноз</h2><div class="formula">признак → какая работа нарушена → какой элемент</div><div class="steps">` +
      step('Желтеет весь старый лист, растение мелкое', 'мало хлорофилла и белка → азот') +
      step('Жёлтое между зелёными жилками', 'хлорофилл без центра → магний') +
      step('Бурые сухие края листьев', 'клетки теряют воду → калий') +
      step('Фиолетовый оттенок, слабые корни', 'мало энергии для роста → фосфор') +
      step('Почему сначала нижние листья', 'элемент уходит из старых листьев к молодым') + `</div>`;
    h += `<h3>Банка ${J.lbl}</h3><div class="steps">` + step('Признаки', J.symp) +
      (S.jsel === 0 ? step('Добавлять', 'ничего') : S.fixed[S.jsel] ? step('Не хватало', EL[J.def].gen + ' ✓', 'sum') : step('Уже пробовали', ELK.filter(k => S.tried[S.jsel + k]).map(k => EL[k].sym).join(', ') || '—') + step('Диагноз', 'поставьте сами', 'sum')) + `</div>`;
    const k = S.bsel || (S.jsel && S.fixed[S.jsel] ? J.def : 'N'), E = EL[k], need = E.dose * S.area, mass = need / E.share;
    h += `<h3>Сколько удобрения на грядку</h3><div class="formula">масса = норма × площадь ÷ доля элемента</div><div class="steps">` +
      step('Удобрение', `${E.saltFull}, ${Math.round(E.share * 100)}% ${E.unit}`) + step('Норма', `${E.dose} г ${E.unit} на 1 м²`) + step('Площадь', `${S.area} м²`) +
      step('Нужно элемента', `${E.dose} × ${S.area} = ${need} г`) + step('Масса удобрения', `${need} ÷ ${ru(E.share, 2)} = ${ru(mass, 0)} г`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Нормы примерные, для овощей. Настоящую норму агрохимик считает по анализу почвы.</p>`;
    return h;
  }
  if (id === 'photo') {
    const lim = { L: 'свет', C: 'CO₂', T: 'тепло' }[m.lim];
    let h = `<h2>Скорость фотосинтеза</h2><div class="formula">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂<br><span class="note">на свету, в хлоропластах</span></div><div class="steps">` +
      step('Освещённость', S.dist <= 15 ? `${S.dist} см ≤ 15 см → 100% (насыщение)` : `100 × (15 / ${S.dist})² = ${m.L}%`) +
      step('Свет разрешает', `0,5 × ${m.L} = ${ru(m.rL, 1)}`) +
      step('CO₂ разрешает', `18 + 10 × ${S.soda} = ${m.rC}`) +
      step('Тепло разрешает', `50 × ${ru(tempF(S.temp), 2)} = ${ru(m.rT, 1)}`) +
      step('Пузырьков в минуту', `min(${ru(m.rL, 1)}; ${m.rC}; ${ru(m.rT, 1)}) = ${m.B}`, 'sum') + `</div>`;
    h += `<h3>Вывод</h3><p>Сейчас ограничивает <b>${lim}</b>. ${m.B >= 40 ? 'Цель достигнута.' : 'Улучшайте именно этот фактор — остальные пока не помогут.'}</p>`;
    h += `<p class="note">Освещённость падает как квадрат расстояния — это настоящий закон. Остальные числа — условные числа модели. В настоящем опыте между лампой и стаканом ставят экран с водой, чтобы лампа не грела воду.</p>`;
    return h;
  }
  if (id === 'transp') {
    let h = `<h2>Сколько воды испаряется</h2><div class="formula">испарение = k × нехватка пара × ветер × устьица × доля листьев</div><div class="steps">` +
      step(`Насыщенный пар при ${S.temp} °C`, `${ru(m.rs, 1)} г/м³`) +
      step('Пара в воздухе сейчас', `${ru(m.rs, 1)} × ${S.hum}% = ${ru(m.have, 1)} г/м³`) +
      step('Не хватает до насыщения', `${ru(m.rs, 1)} − ${ru(m.have, 1)} = ${ru(m.D, 1)} г/м³`) +
      step('Ветер', `× ${ru(WINDF[S.wind], 1)} (${WINDN[S.wind]})`) + step('Устьица', `× ${ru(m.st, 2)} (${S.night ? 'ночь, закрыты' : 'день, открыты'})`) + step('Листья', `× ${m.n}/6`) +
      step('Испарение', `0,12 × ${ru(m.D, 1)} × ${ru(WINDF[S.wind], 1)} × ${ru(m.st, 2)} × ${m.n}/6 = ${ru(m.E, 2)} мл/ч`, 'sum') + `</div>`;
    h += `<h3>Цель</h3><div class="steps">` + step('Разогнать до ≥ 5 мл/ч', m.hi ? 'да ✓' : 'пока нет') + step('Потом снизить до ≤ 0,5 мл/ч', m.hi && m.E <= .5 ? 'да ✓' : 'пока нет') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Плотность насыщенного пара — настоящая (как в таблице из физики). Коэффициент 0,12 и множители ветра — условные числа модели.</p>`;
    return h;
  }
  const all = m.placed === 8;
  let h = `<h2>Как рассуждать</h2><div class="formula">было оплодотворение? да → семенное, нет → вегетативное</div><div class="steps">` +
    step('1. Образец — семя с зародышем?', 'семенное (половое)') + step('2. Образец — клубень, луковица, ус, лист, черенок?', 'вегетативное') +
    step('3. Потомство при вегетативном', 'копия родителя') + step('4. Потомство из семян', 'смесь признаков двух родителей') + `</div>`;
  if (S.look >= 0) { const it = ITEMS[S.look]; h += `<h3>${it.short}</h3><div class="steps">` + step('Что это', it.organ) + (S.grown ? step('Потомство', it.kids ? 'разное — не как родитель' : 'одинаковое, как родитель') : '') + `</div>`; }
  h += `<h3>Сейчас</h3><div class="steps">` + ITEMS.map((s, c) => step(s.short, S.bin[c] < 0 ? '—' : GRP[GRK[S.bin[c]]].name + (all ? (GRK[S.bin[c]] === s.ans ? ' ✓' : ' ✗') : ''))).join('') +
    step('итого', all ? `верно ${m.right} из 8` : `разложено ${m.placed} из 8`, 'sum') + `</div>`;
  if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все 8 карточек будут на грядках.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'min') {
    el.innerHTML = `<div class="k">Вылечено</div><div class="v ${m.healed === 4 ? 'ok' : ''}">${m.healed} / 4</div>
      <div class="gauge"><b style="width:${m.healed * 25}%"></b></div>
      <div class="lr"><span>банка</span><span>${JARS[S.jsel].lbl}</span></div><div class="lr"><span>соль</span><span>${S.bsel ? EL[S.bsel].sym : '—'}</span></div><div class="lr"><span>ошибок</span><span>${m.mist}</span></div>`;
  } else if (m.kind === 'photo') {
    el.innerHTML = `<div class="k">Кислород, пуз./мин</div><div class="v ${m.B >= 40 ? 'ok' : m.B < 15 ? 'bad' : ''}">${m.B}</div>
      <div class="gauge"><b style="width:${(m.B / 50 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>свет</span><span>${m.L}%</span></div><div class="lr"><span>мешает</span><span>${{ L: 'свет', C: 'CO₂', T: 'тепло' }[m.lim]}</span></div>`;
  } else if (m.kind === 'transp') {
    el.innerHTML = `<div class="k">Испарение, мл/ч</div><div class="v ${m.E >= 5 || (m.hi && m.E <= .5) ? 'ok' : ''}">${ru(m.E, 2)}</div>
      <div class="gauge"><b style="width:${clamp(m.E / 7 * 100, 0, 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>листьев</span><span>${m.n}/6</span></div><div class="lr"><span>устьица</span><span>${S.night ? 'закр.' : 'откр.'}</span></div>`;
  } else {
    const c = S.look;
    el.innerHTML = `<div class="k">${c >= 0 ? 'Образец' : 'Разложено'}</div><div class="v ${S.done.repro ? 'ok' : ''}" style="font-size:13px">${c >= 0 ? ITEMS[c].short : m.placed + ' / 8'}</div>` +
      (c >= 0 ? `<svg viewBox="-24 -24 48 48" aria-hidden="true" style="width:52px;margin:8px auto 0">${picSVG(ITEMS[c].id, 0, 0, 22, 'm')}</svg>` : `<div class="gauge"><b style="width:${(m.placed / 8 * 100).toFixed(1)}%"></b></div>`) +
      `<div class="lr"><span>всего</span><span>${m.placed}/8</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (m.kind === 'transp' && m.E >= 5 && !S.hi) { S.hi = true; m.hi = true; toast('Испарение выше 5 мл/ч! Теперь сбавьте его до 0,5 мл/ч и ниже.'); }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий ботаник!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  if (L.id === 'min') $('#tools').querySelectorAll('[data-a^="el-"]').forEach(b => b.setAttribute('aria-pressed', S.bsel === b.dataset.a.slice(3)));
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  min: '<rect x="6" y="14" width="18" height="14" rx="2" fill="rgba(95,180,217,.35)" stroke="#8b96ad"/><path d="M15 14V3" stroke="#4ea65a" stroke-width="1.6"/><ellipse cx="11" cy="7" rx="4" ry="2" fill="#5fbf6a"/><rect x="38" y="14" width="18" height="14" rx="2" fill="rgba(95,180,217,.35)" stroke="#8b96ad"/><path d="M47 14V6" stroke="#4ea65a" stroke-width="1.6"/><ellipse cx="43" cy="10" rx="4" ry="2" fill="#e8df86"/><text x="31" y="12" font-size="8" fill="#72d4e8" text-anchor="middle" font-family="monospace">N</text>',
  photo: '<circle cx="8" cy="15" r="5" fill="#fff2b0"/><path d="M14 12l14-4M14 18l14 4" stroke="#ffd36b" stroke-width=".8"/><rect x="30" y="4" width="20" height="24" rx="2" fill="rgba(58,138,160,.4)" stroke="#8b96ad"/><path d="M40 27V12" stroke="#3f8f4c" stroke-width="1.6"/><circle cx="40" cy="9" r="1.6" fill="none" stroke="#e8ecf4"/><circle cx="41" cy="5" r="1.2" fill="none" stroke="#e8ecf4"/>',
  transp: '<path d="M14 26V6" stroke="#4ea65a" stroke-width="1.6"/><ellipse cx="9" cy="16" rx="6" ry="2.4" fill="#5fbf6a"/><ellipse cx="19" cy="10" rx="6" ry="2.4" fill="#5fbf6a"/><circle cx="26" cy="5" r="1.4" fill="#c3e6f4"/><circle cx="4" cy="9" r="1.4" fill="#c3e6f4"/><path d="M14 26V28H62" stroke="#2a6a8a" stroke-width="2.4"/><ellipse cx="46" cy="28" rx="3" ry="1.4" fill="#0e1520" stroke="#e8ecf4" stroke-width=".6"/>',
  repro: '<ellipse cx="14" cy="16" rx="10" ry="7" fill="#d9b070"/><circle cx="10" cy="14" r="1" fill="#6a4a24"/><circle cx="17" cy="18" r="1" fill="#6a4a24"/><path d="M30 16h6" stroke="#8b96ad"/><circle cx="44" cy="10" r="3.4" fill="#e8d24a"/><circle cx="54" cy="10" r="3.4" fill="#86c04a"/><circle cx="49" cy="21" r="3.4" fill="#a8322a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'min') {
    now = `Опыт водных культур: 5 банок с растениями. Контроль — полный раствор. ` + JARS.slice(1).map((J, j) => `Банка ${J.lbl}: ${S.fixed[j + 1] ? 'вылечена' : 'признаки — ' + J.symp}`).join('; ') +
      `. Бутылки с солями: N (аммиачная селитра), P (суперфосфат), K (хлорид калия), Mg (сульфат магния). Выбрана банка ${JARS[S.jsel].lbl}${S.bsel ? ', взята соль ' + EL[S.bsel].sym : ''}. Вылечено ${m.healed} из 4, ошибочных добавлений ${m.mist}.`;
    guide = 'Не называй, какой элемент нужен конкретной банке. Спрашивай, какую работу делает каждый элемент (хлорофилл, белки, корни, вода в клетках) и почему признаки видны на нижних листьях.';
  }
  if (id === 'photo') {
    now = `Опыт с элодеей в стакане воды под лампой. Лампа в ${S.dist} см (освещённость ${m.L}%), соды ${S.soda} из 3 ложек, вода ${S.temp} °C. Элодея выделяет ${m.B} пузырьков кислорода в минуту. По модели: свет разрешает ${ru(m.rL, 1)}, CO₂ — ${m.rC}, температура — ${ru(m.rT, 1)}; ограничивает ${{ L: 'свет', C: 'CO₂', T: 'температура' }[m.lim]}. Справа лист в разрезе: CO₂ входит через устьице, O₂ выходит. Цель — не меньше 40 пузырьков в минуту.`;
    guide = 'Не называй готовые значения. Подводи к идее ограничивающего фактора: что сейчас самая короткая полоска и что будет, если улучшать другой фактор.';
  }
  if (id === 'transp') {
    now = `Потометр: побег с ${m.n} листьями из 6 в трубке с водой, пузырёк воздуха в капилляре ползёт к растению. ${S.night ? 'Ночь, устьица закрыты' : 'День, устьица открыты'}, ветер: ${WINDN[S.wind]}, воздух ${S.temp} °C, влажность ${S.hum}%. Нехватка пара до насыщения ${ru(m.D, 1)} г/м³. Испарение ${ru(m.E, 2)} мл/ч. ` +
      (m.hi ? 'Ученик уже разогнал испарение выше 5 мл/ч, теперь нужно снизить до 0,5 мл/ч и ниже.' : 'Сначала нужно разогнать испарение до 5 мл/ч и выше, потом снизить до 0,5 мл/ч и ниже.');
    guide = 'Не перечисляй готовый набор настроек. Спрашивай, в какую погоду быстрее сохнет бельё и зачем растению закрывать устьица.';
  }
  if (id === 'repro') {
    now = `8 образцов посадочного материала: ${ITEMS.map((s, c) => `${s.short} — ${S.bin[c] < 0 ? 'не разложен' : 'на грядке «' + GRP[GRK[S.bin[c]]].name + '»'}`).join('; ')}. Грядки: вегетативное и семенное (половое) размножение. ` +
      (m.placed === 8 ? `Все разложены, верно ${m.right} из 8.` : `Разложено ${m.placed} из 8.`) + (S.grown ? ' Потомство выращено: у вегетативных образцов дети одинаковые, как родитель, у семян — разные.' : ' Потомство ещё не выращено.');
    guide = 'Не говори, на какую грядку класть образец. Спрашивай, было ли оплодотворение и какой частью растения является образец.';
  }
  return [
    `Раздел: биология, 8 класс, тема «Как живёт растение». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    min: 'Почему нехватку азота видно сначала на нижних листьях?', photo: 'Почему яркий свет не помогает, если мало CO₂?',
    transp: 'Зачем растению испарять столько воды?', repro: 'Почему из семечка Апорта не вырастет Апорт?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
