<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 10 класс: электрический ток в металлах, полупроводниках, электролитах, газах и вакууме.">
<title>Ток в разных средах</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. Topic: current in different media. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.meter svg{display:block;width:64px;height:64px;margin:8px auto 0}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter svg{width:48px;height:48px}
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="5" y="14" width="30" height="12" rx="3" fill="rgba(208,138,78,.22)" stroke="#d08a4e" stroke-width="1.6"/><circle cx="11" cy="20" r="2" fill="#72d4e8"/><circle cx="19" cy="18" r="2" fill="#72d4e8"/><circle cx="27" cy="22" r="2" fill="#72d4e8"/><path d="M8 32H30" stroke="var(--force)" stroke-width="2" stroke-linecap="round"/><path d="M26 29L30 32L26 35" fill="none" stroke="var(--force)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Физика · Ток в разных средах</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Ток в средах</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с электрическим током в металлах, полупроводниках, электролитах, газах и вакууме."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>

</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'metal', title: 'Металлы: электронный газ',
    text: ['В металле атомы отдают часть внешних электронов «в общее пользование». Положительные ионы стоят в узлах кристаллической решётки, а свободные электроны носятся между ними, как газ. Ток в металле — направленное движение свободных электронов. Это доказали опыты Толмена и Стюарта: при резкой остановке вращавшейся катушки электроны по инерции проскакивают вперёд и дают короткий импульс тока.',
           'Электроны на пути сталкиваются с колеблющимися ионами — отсюда сопротивление. При нагревании ионы колеблются сильнее, столкновений больше, и сопротивление растёт: R = R₀(1 + αt). Здесь R₀ — сопротивление при 0 °C, t — температура в °C, α — температурный коэффициент сопротивления. У меди α ≈ 0,0043 К⁻¹, у сплава нихрома — в десятки раз меньше.',
           'При очень сильном охлаждении у многих металлов и сплавов сопротивление скачком падает до нуля. Это сверхпроводимость. Ртуть становится сверхпроводником при 4,2 К, то есть около −269 °C.'],
    why: 'Энергетики учитывают нагрев проводов: в летнюю жару сопротивление линий растёт, а с ним и потери энергии. На этом же эффекте работают термометры сопротивления — платиновые датчики на ТЭЦ и нефтеперерабатывающих заводах Атырау, Павлодара и Шымкента; их настраивает инженер КИПиА. Из нихрома, у которого сопротивление почти не зависит от температуры, делают спирали чайников, фенов и паяльников. Сверхпроводящие магниты работают в аппаратах МРТ.',
    task: 'Нагрейте медную проволоку так, чтобы её сопротивление стало в 1,5 раза больше, чем при 0 °C.',
    hint: 'Меняйте температуру кнопками на площадке, ползунком во вкладке «Схема» или тяните столбик термометра. При 0 °C сопротивление проволоки 2,00 Ом. Формулу R = R₀(1 + αt) можно решить относительно t.',
    stage: 'Тяните столбик термометра.',
    t0: 20, U0: 1.5, mat0: 'cu',
    check: m => m.mat === 'cu' && Math.abs(m.ratio - 1.5) <= 0.02 },
  { id: 'semi', title: 'Полупроводники и диод',
    text: ['У полупроводников — кремния, германия — сопротивление при нагревании не растёт, а падает. В чистом кремнии все внешние электроны заняты в связях между атомами, и ток почти не идёт. Нагрев или свет рвёт часть связей: появляется свободный электрон и пустое место — дырка. Дырка ведёт себя как положительный заряд. Это собственная проводимость.',
           'Добавим примесь. Атом фосфора (5 внешних электронов) отдаёт лишний электрон — это донор, получается полупроводник n-типа с электронной проводимостью. Атом бора (3 внешних электрона) забирает электрон у соседа и оставляет дырку — это акцептор, получается p-тип с дырочной проводимостью.',
           'Граница p- и n-областей — p–n-переход. Если «+» источника подключён к p-области (прямое включение), электроны и дырки идут навстречу друг другу, и ток большой. При обратном включении носители уходят от границы, запирающий слой расширяется, и тока почти нет. Так работает диод: он пропускает ток в одну сторону.'],

const LS_KEY = 'luch-phys-media';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true, lastUpd = 0, lastT = 0;
const P = { el: [], car: [], ions: [], flash: [], gp: [], mol: [] };   // particles for animation
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- physics ----------
// metals: R = R0 (1 + alpha t), R0 at 0 °C
const MET = {
  cu: { name: 'Медь', adj: 'медная', a: 4.3e-3, col: '#d08a4e', fill: 'rgba(208,138,78,.13)' },
  nich: { name: 'Нихром', adj: 'нихромовая', a: 1e-4, col: '#a9b2c3', fill: 'rgba(169,178,195,.12)' },
};
const R0 = 2.0;
// semiconductor crystal 10 x 5
const NC = 10, NR = 5;
const AX = c => 75 + 41 * c, AY = r => 150 + 38 * r, JX = (AX(4) + AX(5)) / 2;
const typ = (p, b) => b > p ? 'p' : p > b ? 'n' : 'i';
const TYPN = { p: 'p-тип', n: 'n-тип', i: 'чистый' };
// electrolysis of CuSO4: k = M / (n F)
const KG = 0.0635 / (2 * 96485) * 1000;   // g/C
// gases
const GAS = {
  air100: { name: 'Воздух 100 кПа', short: '100 кПа', br: Infinity, isat: 2, mol: 56 },
  air1: { name: 'Разрежённый 1 кПа', short: '1 кПа', br: 1.2, isat: 0.4, mol: 24 },
  air01: { name: 'Разрежённый 0,1 кПа', short: '0,1 кПа', br: 0.4, isat: 0.08, mol: 9 },
  vac: { name: 'Вакуум', short: 'вакуум', br: NaN, isat: 0, mol: 0 },
};
const GKEYS = ['air100', 'air1', 'air01', 'vac'];
const FLAGS = [['ns', 'несамостоятельный ток'], ['glow', 'тлеющий разряд'], ['vf', 'ток в вакууме'], ['vr', 'диод заперт']];

function resetState() {
  const Ls = L();
  Object.assign(S, {
    t: Ls.t0 == null ? 20 : Ls.t0, U: Ls.U0 || 1.5, mat: Ls.mat0 || 'cu',
    grid: Array(NC * NR).fill('Si'), mode: 'B', plusLeft: true, hot: false, seenF: false, seenR: false,
    I: Ls.I0 || 1, tm: Ls.tm0 || 10, mass: 0, run: null, runs: [],
    gas: Ls.gas0 || 'air100', Ug: 0.5, ion: false, heat: false, pol: true, flags: {},
    hl: null,
  });
  initParticles();
}

function mMetal() { const M = MET[S.mat], R = R0 * (1 + M.a * S.t), I = S.U / R; return { kind: 'metal', mat: S.mat, t: S.t, U: S.U, R, I, ratio: R / R0 }; }
function counts() {
  const c = { PL: 0, BL: 0, PR: 0, BR: 0 };
  S.grid.forEach((k, i) => { const left = i % NC < NC / 2; if (k === 'P') { if (left) c.PL++; else c.PR++; } if (k === 'B') { if (left) c.BL++; else c.BR++; } });
  return c;
}
function mSemi() {
  const c = counts(), pairs = S.hot ? 2 : 0, tL = typ(c.PL, c.BL), tR = typ(c.PR, c.BR);
  const cL = Math.abs(c.BL - c.PL) + pairs, cR = Math.abs(c.PR - c.BR) + pairs;
  const pn = (tL === 'p' && tR === 'n') || (tL === 'n' && tR === 'p');
  let mode = 'ohm', I;
  if (pn) { const fwd = (tL === 'p') === S.plusLeft; mode = fwd ? 'fwd' : 'rev'; I = fwd ? Math.min(40, 6 * Math.min(cL, cR)) : 0.001 * pairs; }
  else I = 1.5 * Math.min(cL, cR);
  const pnTask = c.BL - c.PL >= 3 && c.PR - c.BR >= 3;
  return { kind: 'semi', ...c, tL, tR, cL, cR, pairs, pn, mode, I, pnTask, seenF: S.seenF, seenR: S.seenR };
}
function runProgress(now) {
  if (!S.run) return 1;
  return S.run.dur ? clamp((now - S.run.t0) / S.run.dur, 0, 1) : 1;
}
function mElec() {
  const q = S.I * S.tm * 60, dm = KG * q;
  const pr = runProgress(performance.now()), mass = S.run ? S.run.m0 + S.run.dm * pr : S.mass;
  return { kind: 'elec', I: S.I, tm: S.tm, q, dm, mass, running: !!S.run, runs: S.runs.length };
}
function mGas() {
  const G = GAS[S.gas], U = S.Ug, vac = S.gas === 'vac';
  let regime = 'none', I = 0;   // I in mA
  if (!vac) {
    if (U >= G.br) { regime = 'self'; I = (U * 1000 - 600 * G.br) / 200; }
    else if (S.ion && U > 0) { regime = 'ns'; I = G.isat * (1 - Math.exp(-U / 0.15)) / 1000; }
  } else if (S.heat) {
    if (S.pol && U > 0) { regime = 'vac'; I = Math.min(5, 4 * U ** 1.5); }
    else if (!S.pol) regime = 'block';
  }
  const found = FLAGS.filter(f => S.flags[f[0]]).length;
  return { kind: 'gas', gas: S.gas, U, regime, I, br: G.br, found, ion: S.ion, heat: S.heat, pol: S.pol };
}
function model() {
  const id = LID();
  return id === 'metal' ? mMetal() : id === 'semi' ? mSemi() : id === 'elec' ? mElec() : mGas();
}
const fmtI = mA => mA >= 0.1 ? fmt(mA, mA >= 10 ? 1 : 2) + ' мА' : mA >= 1e-4 ? fmt(mA * 1000, mA >= 0.01 ? 0 : 2) + ' мкА' : '0';

function track() {
  const id = LID();
  if (id === 'semi') {
    const m = mSemi();
    if (m.pnTask && m.mode === 'fwd' && !S.seenF) { S.seenF = true; toast(`Прямое включение: «+» на p-области. Ток ${fmtI(m.I)} — диод открыт.`); }
    if (m.pnTask && m.mode === 'rev' && !S.seenR) { S.seenR = true; toast('Обратное включение: носители ушли от границы, запирающий слой расширился. Тока почти нет.'); }
  }
  if (id === 'gas') {
    const m = mGas(), f = S.flags, say = (k, msg) => { if (!f[k]) { f[k] = true; toast(msg); } };
    if (m.regime === 'ns' && m.U >= 0.2) say('ns', `Есть ток ${fmtI(m.I)} — но только пока работает ионизатор. Это несамостоятельный разряд.`);
    if (m.regime === 'self' && !S.ion) say('glow', 'Газ светится без ионизатора — электроны сами ионизуют молекулы. Самостоятельный тлеющий разряд!');
    if (m.regime === 'vac' && m.U >= 0.1) say('vf', `Нить — катод: электроны летят к аноду, ток ${fmtI(m.I)}. Термоэлектронная эмиссия.`);
    if (m.regime === 'block' && m.U >= 0.1) say('vr', 'Нить стала анодом: электроны возвращаются к ней, тока нет. Вакуумный диод заперт.');
  }
}

// ---------- particles ----------
const WX0 = 40, WX1 = 480, WY0 = 150, WY1 = 220;
function initParticles() {
  P.el = [];
  for (let i = 0; i < 38; i++) { const a = rnd(0, 6.283); P.el.push({ x: rnd(WX0 + 6, WX1 - 6), y: rnd(WY0 + 6, WY1 - 6), vx: 45 * Math.cos(a), vy: 45 * Math.sin(a) }); }
  buildCarriers();
  P.ions = [];
  for (let i = 0; i < 12; i++) P.ions.push({ k: 'cu', x: rnd(194, 326), y: rnd(218, 390), ph: rnd(0, 6.3) });
  for (let i = 0; i < 12; i++) P.ions.push({ k: 'so', x: rnd(194, 326), y: rnd(218, 390), ph: rnd(0, 6.3) });
  P.flash = [];
  P.gp = []; buildMol();
}
function buildCarriers() {
  P.car = [];
  S.grid.forEach((k, i) => {
    if (k === 'Si') return;
    const c = i % NC, r = (i / NC) | 0, side = c < NC / 2 ? 'L' : 'R';
    const hx = side === 'L' ? clamp(AX(c) + rnd(-18, 18), 60, JX - 8) : clamp(AX(c) + rnd(-18, 18), JX + 8, 459), hy = AY(r) + rnd(-19, -14);
    P.car.push({ t: k === 'P' ? 'e' : 'h', hx, hy, x: hx, y: hy, side });
  });
  if (S.hot) for (const side of ['L', 'R']) for (let j = 0; j < 2; j++) {
    const hx = side === 'L' ? rnd(66, JX - 24) : rnd(JX + 14, 446), hy = rnd(140, 306);
    P.car.push({ t: 'e', hx, hy, x: hx, y: hy, side }); P.car.push({ t: 'h', hx: hx + 10, hy: hy + 8, x: hx + 10, y: hy + 8, side });
  }
}
function buildMol() { P.mol = []; const n = GAS[S.gas].mol; for (let i = 0; i < n; i++) P.mol.push({ x: rnd(80, 440), y: rnd(198, 262), ph: rnd(0, 6.3) }); }

function stepParticles(dt, tm) {
  const id = LID();
  if (id === 'metal') {
    const m = mMetal(), T = S.t + 273, nu = 2 + 7 * T / 573, vd = 16 * m.I, v0 = 45;
    for (const e of P.el) {
      if (Math.random() < nu * dt) { const a = rnd(0, 6.283); e.vx = v0 * Math.cos(a); e.vy = v0 * Math.sin(a); }
      e.x += (e.vx - vd) * dt; e.y += e.vy * dt;
      if (e.y < WY0 + 5) { e.y = WY0 + 5; e.vy = Math.abs(e.vy); }
      if (e.y > WY1 - 5) { e.y = WY1 - 5; e.vy = -Math.abs(e.vy); }
      if (e.x < WX0 + 4) e.x = WX1 - 4;
      if (e.x > WX1 - 4) e.x = WX0 + 4;
    }
  }
  if (id === 'semi') {
    const m = mSemi(), flow = (m.mode === 'fwd' || m.mode === 'ohm') && m.I > 0.05;
    const eDir = S.plusLeft ? -1 : 1;
    for (const c of P.car) {
      if (flow) {
        c.x += (c.t === 'e' ? eDir : -eDir) * (m.mode === 'fwd' ? 55 : 30) * dt;
        if (c.x < 58) c.x = 461;
        if (c.x > 461) c.x = 58;
        c.y += (c.hy - c.y) * Math.min(1, dt * 2) + Math.sin(tm / 300 + c.hx) * 0.3;
      } else {
        let tx = c.hx;
        if (m.mode === 'rev') tx = c.side === 'L' ? 56 + (c.hx - 56) * (JX - 62 - 56) / (JX - 56) : 463 - (463 - c.hx) * (463 - JX - 62) / (463 - JX);
        const k = Math.min(1, dt * 3);
        c.x += (tx - c.x) * k + Math.sin(tm / 260 + c.hy) * 0.25; c.y += (c.hy - c.y) * k + Math.cos(tm / 310 + c.hx) * 0.25;
      }
    }
  }
  if (id === 'elec') {
    const run = !!S.run, v = 22 + 24 * S.I;
    for (const p of P.ions) {
      if (run) {
        p.x += (p.k === 'cu' ? -v : v) * dt; p.y += Math.sin(tm / 200 + p.ph) * 0.4;
        if (p.k === 'cu' && p.x < 194) { P.flash.push({ y: p.y, t: tm }); p.x = 326; p.y = rnd(218, 390); }
        if (p.k === 'so' && p.x > 326) { p.x = 194; p.y = rnd(218, 390); }
      } else { p.x += Math.sin(tm / 240 + p.ph) * 0.3; p.y += Math.cos(tm / 270 + p.ph) * 0.3; }
      p.x = clamp(p.x, 190, 330); p.y = clamp(p.y, 214, 394);
    }
    P.flash = P.flash.filter(f => tm - f.t < 400);
  }
  if (id === 'gas') {
    const m = mGas(), U = S.Ug, plusRight = S.pol, gp = P.gp;
    const spawn = (k, x, y, life) => { if (gp.length < 70) gp.push({ k, x, y, age: 0, life }); };
    let rate = 0;
    if (m.regime === 'self') rate = 26;
    else if (S.gas !== 'vac' && S.ion) rate = 4 + 4 * GAS[S.gas].isat;
    if (Math.random() < rate * dt) {
      const x = m.regime === 'self' ? rnd(110, 410) : rnd(215, 305), y = rnd(200, 260);
      spawn('e', x, y, U > 0 ? 9 : 1.1); spawn('i', x + 4, y + 3, U > 0 ? 9 : 1.1);
    }
    if (S.gas === 'vac' && S.heat && Math.random() < 14 * dt) spawn('t', 104, rnd(208, 252), S.pol && U > 0 ? 9 : 0.7);
    const ve = 40 + 60 * U, vi = 12 + 18 * U;
    for (const p of gp) {
      p.age += dt;
      if (p.k === 't') {
        if (S.pol && U > 0) p.x += (60 + 90 * U) * dt;
        else p.x = 104 + 16 * Math.sin(Math.PI * clamp(p.age / p.life, 0, 1));
      } else if (U > 0) {
        const toRight = p.k === 'e' ? plusRight : !plusRight;
        p.x += (toRight ? 1 : -1) * (p.k === 'e' ? ve : vi) * dt;
      }
      p.y += Math.sin(p.age * 9 + p.x) * 0.3;
    }
    P.gp = gp.filter(p => p.age < p.life && p.x > 98 && p.x < 419);
    for (const q of P.mol) { q.x += Math.sin(tm / 300 + q.ph) * 0.25; q.y += Math.cos(tm / 340 + q.ph) * 0.25; }
  }
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
const f1 = x => (+x).toFixed(1);
const ln = (x1, y1, x2, y2, c, w = 1.5, extra = '') => `<path d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}" stroke="${c}" stroke-width="${w}" fill="none" ${extra}/>`;
const WIRE = '#8b96ad';
const neg = v => String(v).replace('-', '−');
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <radialGradient id="glowG" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#ff7ad0" stop-opacity=".75"/><stop offset="1" stop-color="#b45cff" stop-opacity=".25"/></radialGradient>
    <marker id="arO" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker><marker id="arB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#72d4e8"/></marker></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
// battery symbol: long plate = +, short plate = −
function battery(x, y, plusLeft, label) {
  const xl = x - 5, xr = x + 5, long = 14, short = 8;
  const hl = plusLeft ? long : short, hr = plusLeft ? short : long;
  return ln(xl, y - hl, xl, y + hl, '#e8ecf4', plusLeft ? 2.4 : 4) + ln(xr, y - hr, xr, y + hr, '#e8ecf4', plusLeft ? 4 : 2.4) +
    T(xl - 9, y - 9, 11, '#ffb547', plusLeft ? '+' : '−', 'middle', halo) + T(xr + 9, y - 9, 11, '#ffb547', plusLeft ? '−' : '+', 'middle', halo) +
    (label ? T(x, y + 30, 9.5, '#c8d0dd', label, 'middle', halo) : '');
}
function ammeter(x, y, val) {
  return `<circle cx="${x}" cy="${y}" r="14" fill="#121a28" stroke="#e8ecf4" stroke-width="1.6"/>` + T(x, y + 4, 12, '#e8ecf4', 'A', 'middle', 'font-weight="600"') + T(x, y + 30, 9.5, '#86e0a8', val, 'middle', halo);
}

// ---------- lesson 1: metal wire ----------
const tY = t => 395 - (t + 100) / 400 * 100;
function metalScene(tm) {
  const m = mMetal(), M = MET[S.mat], heat = clamp(S.t / 300, -1, 1);
  let h = '';
  const tint = heat >= 0 ? `rgba(255,${(120 - 60 * heat).toFixed(0)},70,${f1(0.04 + 0.22 * heat)})` : `rgba(110,170,255,${f1(-0.18 * heat)})`;
  h += `<rect x="${WX0}" y="${WY0}" width="${WX1 - WX0}" height="${WY1 - WY0}" rx="10" fill="${M.fill}" stroke="${M.col}" stroke-width="2"/>`;
  h += `<rect x="${WX0}" y="${WY0}" width="${WX1 - WX0}" height="${WY1 - WY0}" rx="10" fill="${tint}"/>`;
  h += T(WX0 + 6, WY0 - 8, 10, M.col, `${M.adj} проволока · t = ${neg(S.t)} °C`, 'start', halo);
  // ions with thermal vibration
  const A = 3.4 * Math.sqrt((S.t + 273) / 573);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 16; c++) {
    const x0 = WX0 + 18 + c * (WX1 - WX0 - 36) / 15, y0 = WY0 + 17 + r * 18, ph = c * 1.7 + r * 2.9;
    const dx = reduce ? 0 : A * Math.sin(tm / 45 + ph), dy = reduce ? 0 : A * Math.cos(tm / 53 + ph * 1.3);
    h += `<circle cx="${f1(x0)}" cy="${f1(y0)}" r="${f1(5 + A)}" fill="none" stroke="${M.col}" stroke-opacity=".22" stroke-dasharray="2 2"/>`;
    h += `<circle cx="${f1(x0 + dx)}" cy="${f1(y0 + dy)}" r="5" fill="${M.col}" fill-opacity=".85"/><path d="M${f1(x0 + dx - 2.5)} ${f1(y0 + dy)}h5M${f1(x0 + dx)} ${f1(y0 + dy - 2.5)}v5" stroke="${INK}" stroke-width="1.2"/>`;
  }
  for (const e of P.el) h += `<circle cx="${f1(e.x)}" cy="${f1(e.y)}" r="2.6" fill="#72d4e8"/>`;
  if (m.I > 0.01) {
    h += ln(330, WY1 + 13, 250, WY1 + 13, '#72d4e8', 1.6, 'marker-end="url(#arB)"') + T(336, WY1 + 17, 9, '#72d4e8', 'дрейф e⁻', 'start', halo);
    h += ln(330, WY0 - 22, 410, WY0 - 22, '#ffb547', 1.6, 'marker-end="url(#arO)"') + T(416, WY0 - 18, 9, '#ffb547', 'ток I', 'start', halo);
  }
  // circuit: + to the left end of the wire
  const yc = 262;
  h += `<path d="M${WX0} 185H22V${yc}H70M80 ${yc}H136M164 ${yc}H498V185H${WX1}" fill="none" stroke="${WIRE}" stroke-width="2"/>`;
  h += battery(75, yc, true, `U = ${fmt(S.U, 1)} В`) + ammeter(150, yc, `I = ${fmt(m.I, 2)} А`);
  // graph R(t)
  const gx0 = 40, gx1 = 380, gy0 = 412, gy1 = 310, X = t => gx0 + (t + 100) / 400 * (gx1 - gx0), Y = R => gy0 - R / 5 * (gy0 - gy1);
  h += `<rect x="${gx0}" y="${gy1 - 8}" width="${gx1 - gx0}" height="${gy0 - gy1 + 8}" fill="rgba(18,26,40,.6)" stroke="#26324a"/>`;
  for (let t = -100; t <= 300; t += 100) h += ln(X(t), gy0, X(t), gy1 - 8, '#26324a', 1) + T(X(t), gy0 + 12, 8.5, '#8b96ad', neg(t));
  for (let R = 1; R <= 4; R++) h += ln(gx0, Y(R), gx1, Y(R), '#26324a', 1) + T(gx0 - 4, Y(R) + 3, 8.5, '#8b96ad', R, 'end');
  h += T(gx0 + 4, gy1 + 2, 8.5, '#c8d0dd', 'R, Ом', 'start') + T(gx1 - 4, gy0 - 5, 8.5, '#c8d0dd', 't, °C', 'end');
  h += ln(gx0, Y(R0), gx1, Y(R0), '#e8ecf4', 1, 'stroke-dasharray="3 4" opacity=".5"') + T(gx1 + 4, Y(R0) + 3, 8.5, '#c8d0dd', 'R₀', 'start');
  h += ln(gx0, Y(1.5 * R0), gx1, Y(1.5 * R0), '#ffb547', 1, 'stroke-dasharray="3 4" opacity=".7"') + T(gx1 + 4, Y(1.5 * R0) + 3, 8.5, '#ffb547', '1,5R₀', 'start');
  for (const k of ['nich', 'cu']) {
    const a = MET[k].a, on = k === S.mat;
    h += ln(X(-100), Y(R0 * (1 - 100 * a)), X(300), Y(R0 * (1 + 300 * a)), MET[k].col, on ? 2.2 : 1.2, on ? '' : 'opacity=".35"');
  }
  h += `<circle cx="${f1(X(S.t))}" cy="${f1(Y(m.R))}" r="4.5" fill="#ffd54a" stroke="${INK}" stroke-width="1.5"/>`;
  // thermometer (draggable)
  const ty = tY(S.t);
  h += `<g data-drag="therm"><rect x="430" y="282" width="50" height="140" fill="transparent"/><rect x="449" y="288" width="12" height="112" rx="6" fill="#121a28" stroke="#8b96ad" stroke-width="1.4"/><circle cx="455" cy="406" r="10" fill="#ff6a55" stroke="#8b96ad" stroke-width="1.4"/><rect x="452" y="${f1(ty)}" width="6" height="${f1(404 - ty)}" fill="#ff6a55"/><path d="M445 ${f1(ty)}h20" stroke="#ffd54a" stroke-width="2.4" stroke-linecap="round"/></g>`;
  for (let t = -100; t <= 300; t += 100) h += ln(462, tY(t), 467, tY(t), '#8b96ad', 1) + T(470, tY(t) + 3, 8, '#8b96ad', neg(t), 'start');
  h += T(455, 279, 9, '#c8d0dd', 't, °C', 'middle', halo);
  if (!drag && S.t === LESSONS[0].t0 && !S.done.metal) h += T(443, 385, 9, '#ffb547', 'тяните ↕', 'end', halo);
  return h;
}

// ---------- lesson 2: semiconductor crystal ----------
function semiScene() {
  const m = mSemi();
  let h = '';
  const x0 = 54, x1 = 465, y0 = 128, y1 = 324;
  h += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="8" fill="rgba(114,212,232,.04)" stroke="#3a4762" stroke-width="1.4"/>`;
  if (m.pn) {
    const w = m.mode === 'rev' ? 62 : 5;
    h += `<rect x="${f1(JX - w)}" y="${y0}" width="${f1(2 * w)}" height="${y1 - y0}" fill="rgba(255,213,74,.08)" stroke="rgba(255,213,74,.35)" stroke-dasharray="4 4"/>`;
    if (m.mode === 'rev') h += T(JX, y1 + 17, 9, '#ffd54a', 'запирающий слой', 'middle', halo);
  }
  h += ln(JX, y0 - 4, JX, y1 + 4, '#8b96ad', 1, 'stroke-dasharray="2 4" opacity=".6"');
  for (let r = 0; r < NR; r++) h += ln(AX(0), AY(r), AX(NC - 1), AY(r), '#3a4762', 2);
  for (let c = 0; c < NC; c++) h += ln(AX(c), AY(0), AX(c), AY(NR - 1), '#3a4762', 2);
  S.grid.forEach((k, i) => {
    const c = i % NC, r = (i / NC) | 0, x = AX(c), y = AY(r);
    const st = k === 'P' ? ['#1f4660', '#72d4e8'] : k === 'B' ? ['#55381f', '#ffb547'] : ['#232e44', '#5d6a86'];
    h += `<g data-click="a${i}"><circle cx="${x}" cy="${y}" r="13" fill="${st[0]}" stroke="${st[1]}" stroke-width="1.6"/>${T(x, y + 4, 10, k === 'Si' ? '#8b96ad' : st[1], k, 'middle', 'font-weight="600"')}</g>`;
    if (k !== 'Si') h += T(x + 12, y + 14, 9, st[1], k === 'P' ? '+' : '−', 'middle', halo);
  });
  for (const c of P.car) h += c.t === 'e' ? `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="3.2" fill="#72d4e8" pointer-events="none"/>` : `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="3.6" fill="none" stroke="#ffb547" stroke-width="1.6" pointer-events="none"/>`;
  const lab = (x, t) => T(x, y1 + 18, 11, t === 'p' ? '#ffb547' : t === 'n' ? '#72d4e8' : '#8b96ad', TYPN[t], 'middle', halo + ' font-weight="600"');
  h += lab((x0 + JX) / 2, m.tL) + lab((JX + x1) / 2, m.tR);
  h += `<rect x="${x0 - 12}" y="${y0}" width="12" height="${y1 - y0}" fill="#5d6a86"/><rect x="${x1}" y="${y0}" width="12" height="${y1 - y0}" fill="#5d6a86"/>`;
  const yc = 385;
  h += `<path d="M${x0 - 6} ${y1}V${yc}H235M245 ${yc}H336M364 ${yc}H${x1 + 6}V${y1}" fill="none" stroke="${WIRE}" stroke-width="2"/>`;
  h += battery(240, yc, S.plusLeft, S.plusLeft ? '«+» слева' : '«+» справа') + ammeter(350, yc, fmtI(m.I));
  h += T(x0 - 18, y1 + 16, 12, '#ffb547', S.plusLeft ? '+' : '−', 'middle', halo) + T(x1 + 18, y1 + 16, 12, '#ffb547', S.plusLeft ? '−' : '+', 'middle', halo);
  if (S.hot) h += T(x1, y1 + 36, 9.5, '#ff8a73', 'нагрето до 150 °C', 'end', halo);
  return h;
}

// ---------- lesson 3: electrolysis ----------
function elecScene(tm) {
  const m = mElec(), coat = 1.2 + 7 * clamp(m.mass, 0, 1.2) / 1.2;
  let h = '';
  h += `<path d="M120 175V398Q120 405 127 405H393Q400 405 400 398V175" fill="none" stroke="#bfe3f2" stroke-width="2.4" opacity=".7"/>`;
  h += `<rect x="122" y="205" width="276" height="198" fill="rgba(70,140,230,.26)"/>` + ln(122, 205, 398, 205, '#5fb4d9', 1.6);
  h += T(394, 397, 9.5, '#5fb4d9', 'раствор CuSO₄', 'end', halo);
  h += `<rect x="170" y="140" width="14" height="236" fill="#5d6a86" stroke="#8b96ad"/>`;
  if (m.mass > 0.0005) h += `<rect x="${f1(170 - coat)}" y="205" width="${f1(14 + 2 * coat)}" height="171" fill="#c27a45" stroke="#e09a5e" stroke-width=".8"/>`;
  h += `<rect x="336" y="140" width="14" height="236" fill="#c27a45" stroke="#e09a5e"/>`;
  for (const f of P.flash) h += `<circle cx="${f1(184 + coat)}" cy="${f1(f.y)}" r="${f1(3 + (tm - f.t) / 60)}" fill="none" stroke="#ffd54a" stroke-opacity="${f1(clamp(1 - (tm - f.t) / 400, 0, 1))}"/>`;
  for (const p of P.ions) {
    if (p.k === 'cu') h += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="5.5" fill="#4aa8e8"/>` + T(p.x, p.y + 2.6, 7, INK, '2+');
    else h += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="6" fill="#ffd54a" fill-opacity=".85"/>` + T(p.x, p.y + 2.6, 7, INK, '2−');
  }
  h += T(177, 422, 9.5, '#c8d0dd', 'катод (−)', 'middle', halo) + T(343, 422, 9.5, '#c8d0dd', 'анод (+)', 'middle', halo);
  const yc = 108;
  h += `<path d="M177 140V${yc}H245M255 ${yc}H281M309 ${yc}H343V140" fill="none" stroke="${WIRE}" stroke-width="2"/>`;
  h += battery(250, yc, false, '') + ammeter(295, yc, `${fmt(S.I, 1)} А`);
  const pr = runProgress(performance.now());
  h += `<rect x="14" y="250" width="96" height="64" rx="8" fill="#121a28" stroke="#26324a"/>` + T(62, 268, 8.5, '#8b96ad', 'весы: катод') + T(62, 290, 14, Math.abs(m.mass - 0.5) <= 0.01 ? '#86e0a8' : '#e8ecf4', '+' + fmt(m.mass, 3)) + T(62, 305, 8.5, '#8b96ad', 'грамма');
  h += `<rect x="14" y="330" width="96" height="50" rx="8" fill="#121a28" stroke="#26324a"/>` + T(62, 347, 8.5, '#8b96ad', 'таймер') + T(62, 369, 13, S.run ? '#ffb547' : '#e8ecf4', `${fmt(S.run ? S.tm * pr : S.tm, S.run ? 1 : 0)} мин`);
  if (S.run) h += T(260, 192, 9.5, '#ffb547', 'идёт электролиз…', 'middle', halo);
  return h;
}

// ---------- lesson 4: gas discharge and vacuum ----------
const RG = { none: 'нет тока', ns: 'несамост.', self: 'тлеющий', vac: 'диод открыт', block: 'диод заперт' };
function gasScene(tm) {
  const m = mGas(), vac = S.gas === 'vac';
  let h = '';
  h += `<rect x="60" y="185" width="400" height="90" rx="44" fill="rgba(170,215,235,.05)" stroke="#bfe3f2" stroke-width="2" stroke-opacity=".6"/>`;
  if (m.regime === 'self') {
    const op = clamp(0.25 + m.I / 30, 0.25, 0.9);
    h += `<rect x="64" y="189" width="392" height="82" rx="40" fill="url(#glowG)" opacity="${f1(op)}"/>`;
    h += `<ellipse cx="${S.pol ? 125 : 395}" cy="230" rx="22" ry="34" fill="#ffd1f0" opacity="${f1(op * 0.6)}"/>`;
  }
  for (const q of P.mol) h += `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="1.8" fill="#8b96ad" opacity=".45"/>`;
  const hot = vac && S.heat;
  h += `<path d="M95 205l6 6l-6 6l6 6l-6 6l6 6l-6 6l6 6" fill="none" stroke="${hot ? '#ffb547' : '#8b96ad'}" stroke-width="${hot ? 2.6 : 2}"/>`;
  if (hot) h += `<circle cx="98" cy="230" r="18" fill="#ffb547" opacity=".18"/>`;
  h += `<rect x="420" y="200" width="9" height="60" fill="#8b96ad"/>`;
  h += T(98, 296, 9, '#c8d0dd', 'нить', 'middle', halo) + T(425, 296, 9, '#c8d0dd', 'пластина', 'middle', halo);
  const lsign = S.pol ? '−' : '+', rsign = S.pol ? '+' : '−';
  h += T(82, 200, 12, '#ffb547', lsign, 'middle', halo) + T(442, 200, 12, '#ffb547', rsign, 'middle', halo);
  for (const p of P.gp) h += p.k === 'i' ? `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="3.6" fill="#ff8a73"/>` : `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="2.4" fill="#72d4e8"/>`;
  if (S.ion) {
    h += `<rect x="232" y="300" width="56" height="16" rx="4" fill="#3a2a5a" stroke="#b48cff"/>` + T(260, 332, 9, '#b48cff', 'УФ-ионизатор', 'middle', halo);
    for (let i = 0; i < 5; i++) h += ln(240 + i * 10, 298, 236 + i * 12, 278, '#b48cff', 1.4, `opacity="${reduce ? 0.6 : f1(0.35 + 0.35 * Math.sin(tm / 120 + i))}"`);
  } else h += `<rect x="232" y="300" width="56" height="16" rx="4" fill="#1a2438" stroke="#3a4762"/>` + T(260, 332, 9, '#5d6a86', 'ионизатор выкл.', 'middle', halo);
  const yc = 375;
  h += `<path d="M95 253V262H38V${yc}H180M220 ${yc}H331M359 ${yc}H482V230H429" fill="none" stroke="${WIRE}" stroke-width="2"/>`;
  h += `<rect x="180" y="${yc - 15}" width="40" height="30" rx="5" fill="#121a28" stroke="#e8ecf4"/>` + T(200, yc + 4, 10, '#e8ecf4', 'U') + T(200, yc + 30, 9.5, '#c8d0dd', `${fmt(S.Ug, 2)} кВ`, 'middle', halo);
  h += T(174, yc - 5, 11, '#ffb547', lsign, 'end', halo) + T(226, yc - 5, 11, '#ffb547', rsign, 'start', halo);
  h += ammeter(345, yc, fmtI(m.I));
  h += T(260, 172, 10, '#c8d0dd', `в трубке: ${GAS[S.gas].name.toLowerCase()}`, 'middle', halo);
  const rl = { none: m.U > 0 && !vac && !S.ion ? 'газ — изолятор' : vac && !S.heat ? 'нет носителей' : '', ns: 'несамостоятельный разряд', self: 'тлеющий разряд', vac: 'электроны летят к аноду', block: 'электроны не уходят от нити' }[m.regime];
  if (rl) h += T(260, 238, 10.5, m.regime === 'self' ? '#ffe2f4' : '#ffd54a', rl, 'middle', halo);
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'metal') return ({ wire: [WX0 - 4, WY0 - 4, WX1 - WX0 + 8, WY1 - WY0 + 8], ions: [WX0 + 8, WY0 + 6, 120, 52], el: [WX0 + 140, WY0 + 4, 140, 62], bat: [55, 240, 40, 56], amm: [130, 244, 40, 52], graph: [20, 283, 380, 140], therm: [432, 270, 56, 150] })[id];
  if (lid === 'semi') return ({ si: [54, 128, 411, 196], left: [54, 128, JX - 54, 196], right: [JX, 128, 465 - JX, 196], junc: [JX - 20, 120, 40, 212], car: [54, 128, 411, 196], bat: [215, 360, 50, 56], amm: [330, 365, 40, 50] })[id];
  if (lid === 'elec') return ({ bath: [116, 170, 288, 240], cat: [160, 135, 34, 250], an: [326, 135, 34, 250], ions: [186, 210, 148, 190], bat: [235, 90, 30, 36], amm: [275, 90, 40, 46], scale: [10, 246, 104, 138] })[id];
  return ({ tube: [56, 181, 408, 98], fil: [84, 198, 30, 66], plate: [414, 194, 22, 72], ion: [226, 272, 68, 64], src: [172, 355, 56, 50], amm: [325, 357, 40, 52], mol: [70, 190, 380, 80] })[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = bg();
  if (id === 'metal') h += metalScene(t);
  else if (id === 'semi') h += semiScene(t);
  else if (id === 'elec') h += elecScene(t);
  else h += gasScene(t);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 440, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 430 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const throttled = () => { const n = performance.now(); if (n - lastUpd > 100) { lastUpd = n; update(); } };
function setT(v) { S.t = clamp(Math.round(v), -100, 300); dirty = true; }
function atomAt(p) {
  const c = Math.round((p.x - 75) / 41), r = Math.round((p.y - 150) / 38);
  if (c < 0 || c >= NC || r < 0 || r >= NR) return -1;
  return Math.hypot(p.x - AX(c), p.y - AY(r)) <= 19 ? r * NC + c : -1;
}
function paint(i) { if (i < 0 || S.grid[i] === S.mode) return false; S.grid[i] = S.mode; buildCarriers(); return true; }
scene.addEventListener('pointerdown', e => {
  const p = toSvg(e), id = LID();
  if (id === 'metal' && p.x > 425 && p.y > 270 && p.y < 425) { drag = { id: 'therm' }; setT((395 - p.y) / 100 * 400 - 100); }

function act(a) {

  else if (a === 'hot') { S.hot = !S.hot; buildCarriers(); toast(S.hot ? 'Нагрели до 150 °C: в каждой половине разорвались связи — появились пары «электрон + дырка».' : 'Остудили до 20 °C: собственных носителей почти нет.'); }
  else if (a === 'clear') { S.grid = Array(NC * NR).fill('Si'); buildCarriers(); }
  else if (a === 'I-' || a === 'I+') S.I = clamp(Math.round((S.I + (a === 'I+' ? 0.1 : -0.1)) * 10) / 10, 0.1, 3);
  else if (a === 't-' || a === 't+') S.tm = clamp(S.tm + (a === 't+' ? 1 : -1), 1, 30);
  else if (a === 'run') {
    if (S.run) return;
    const m = mElec(); S.run = { t0: performance.now(), dur: reduce ? 0 : 2600, m0: S.mass, dm: m.dm }; S.runs.push({ I: S.I, tm: S.tm, dm: m.dm });
    if (reduce) { finishRun(); return; }
  }
  else if (a === 'new') { if (S.run) return; S.mass = 0; S.runs = []; toast('Повесили чистый катод.'); }
  else if (a.startsWith('g:')) { S.gas = a.slice(2); if (S.gas !== 'vac') S.heat = false; buildMol(); P.gp = []; }
  else if (a === 'U-' || a === 'U+') S.Ug = clamp(Math.round((S.Ug + (a === 'U+' ? 0.1 : -0.1)) * 100) / 100, 0, 5);
  else if (a === 'ion') S.ion = !S.ion;

}

  return [
    { id: 'tube', icon: ICON.tube, name: 'Трубка', spec: 'Стеклянная трубка с электродами. Газ можно откачивать.' },
    { id: 'mol', icon: ICON.mol, name: 'Молекулы газа', spec: 'Нейтральные — сами ток не несут. Чем ниже давление, тем их меньше.' },
    { id: 'fil', icon: ICON.fil, name: 'Нить накала', spec: 'Раскалённая испускает электроны (термоэлектронная эмиссия).' },
    { id: 'plate', icon: ICON.plate, name: 'Пластина', spec: 'Второй электрод. В вакуумном диоде — анод.' },
    { id: 'ion', icon: ICON.uv, name: 'Ионизатор', spec: 'Ультрафиолет выбивает электроны из молекул: появляются электроны и ионы.' },
    { id: 'src', icon: ICON.src, name: 'Источник высокого напряжения', spec: 'От 0 до 5 кВ.' },
    { id: 'amm', icon: ICON.amm, name: 'Амперметр', spec: 'Ток в трубке: от микроампер до миллиампер.' }];
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'metal') {
    const M = MET[m.mat], at = M.a * m.t, as = m.mat === 'cu' ? '0,0043' : '0,0001';
    return `<h2>Сопротивление и температура</h2><div class="formula">R = R₀(1 + αt)</div><div class="steps">` +
      step('металл', M.name) + step('R₀ (при 0 °C)', '2,00 Ом') + step('α', as + ' К⁻¹') + step('t', `${neg(m.t)} °C`) +
      step('α · t', `${as} · ${neg(m.t)} = ${fmt(at, 4)}`) +
      step('R = R₀(1 + αt)', `2,00 · ${fmt(1 + at, 4)} = ${fmt(m.R, 3)} Ом`, 'sum') +
      step('R / R₀', fmt(m.ratio, 3)) + `</div>
      <h3>Закон Ома</h3><div class="formula">I = U / R</div><div class="steps">` +
      step('U', `${fmt(m.U, 1)} В`) + step('I = U / R', `${fmt(m.U, 1)} / ${fmt(m.R, 3)} = ${fmt(m.I, 3)} А`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Чем горячее проволока, тем сильнее колеблются ионы и тем чаще с ними сталкиваются электроны. Поэтому при том же напряжении ток меньше.</p>`;
  }
  if (id === 'semi') {
    const side = (nm, p, b, t) => step(`${nm}: фосфор ${p}, бор ${b}`, b > p ? `дырок больше → ${TYPN[t]}` : p > b ? `электронов больше → ${TYPN[t]}` : `примесей нет или поровну → ${TYPN[t]}`);
    let verdict;
    if (m.pn) {
      verdict = step('p-область подключена к', m.mode === 'fwd' ? '«+» — прямое включение' : '«−» — обратное включение') +
        step('итог', m.mode === 'fwd' ? `носители идут к границе, ток ${fmtI(m.I)}` : `носители уходят от границы, ток ${fmtI(m.I)}`, 'sum');
    } else verdict = step('p–n-перехода нет', m.I > 0 ? `кристалл просто проводит, ток ${fmtI(m.I)}` : 'свободных носителей нет, ток ≈ 0', 'sum');
    return `<h2>Разбор кристалла</h2><div class="steps">` +
      side('слева', m.PL, m.BL, m.tL) + side('справа', m.PR, m.BR, m.tR) +
      step('собственные пары (нагрев)', S.hot ? 'по 2 в каждой половине' : 'нет, кристалл холодный') +
      step('носителей слева / справа', `${m.cL} / ${m.cR}`) + verdict + `</div>
      <h3>Правило диода</h3><div class="steps">` + step('«+» к p, «−» к n', 'ток идёт') + step('«+» к n, «−» к p', 'тока почти нет') + `</div>
      <p class="note" style="margin-top:10px">Ток в модели примерный: он растёт с числом свободных носителей. У чистого кремния при нагреве носителей больше и ток растёт — сопротивление падает, в отличие от металла.</p>`;
  }
  if (id === 'elec') {
    return `<h2>Закон Фарадея</h2><div class="formula">m = k · I · t</div><div class="steps">` +
      step('k = M / (n · F)', '0,0635 / (2 · 96 485)') + step('k', '3,29·10⁻⁷ кг/Кл = 0,329 мг/Кл') +
      step('I', `${fmt(m.I, 1)} А`) + step('t', `${m.tm} мин = ${m.tm * 60} с`) +
      step('q = I · t', `${fmt(m.I, 1)} · ${m.tm * 60} = ${fmt(m.q, 0)} Кл`) +
      step('m = k · q', `0,329 мг/Кл · ${fmt(m.q, 0)} Кл ≈ ${fmt(m.dm * 1000, 0)} мг`, 'sum') + `</div>
      <h3>Журнал запусков</h3><div class="steps">` +
      (S.runs.length ? S.runs.map((r, i) => step(`${i + 1}. ${fmt(r.I, 1)} А × ${r.tm} мин`, `+${fmt(r.dm, 3)} г`)).join('') + step('всего на катоде', `${fmt(m.mass, 3)} г`, 'sum') : step('пока пусто', 'нажмите «Пуск»')) + `</div>
      <p class="note" style="margin-top:10px">Молярная масса меди 63,5 г/моль, заряд иона Cu²⁺ равен 2. На каждый осевший атом меди через цепь проходят 2 электрона.</p>`;
  }
  const G = GAS[m.gas], rs = [];
  if (m.gas === 'vac') {
    rs.push(step('газа нет', 'ионизовать нечего'));
    rs.push(step('нить накала', S.heat ? 'раскалена — испускает электроны' : 'холодная — электронов нет'));
    if (S.heat) rs.push(step('нить подключена к', S.pol ? '«−» — электроны летят к аноду' : '«+» — электроны тянет обратно'));
  } else {
    rs.push(step('напряжение пробоя', isFinite(G.br) ? `≈ ${fmt(G.br, 1)} кВ` : 'больше 5 кВ (нужны десятки кВ)'));
    rs.push(step('U', `${fmt(m.U, 2)} кВ ${m.U >= G.br ? '≥' : '<'} U пробоя`));
    rs.push(step('ионизатор', S.ion ? 'включён — создаёт ионы и электроны' : 'выключен'));
  }
  rs.push(step('режим', { none: 'тока нет', ns: 'несамостоятельный разряд', self: 'самостоятельный (тлеющий) разряд', vac: 'ток в вакууме', block: 'вакуумный диод заперт' }[m.regime]));
  rs.push(step('ток', fmtI(m.I), 'sum'));
  return `<h2>Почему идёт (или не идёт) ток</h2><div class="steps">` + rs.join('') + `</div>
    <h3>Найдено</h3><div class="steps">` + FLAGS.map(([k, t]) => step(t, S.flags[k] ? '✓' : '—')).join('') + `</div>
    <p class="note" style="margin-top:10px">Несамостоятельный ток растёт с напряжением только до насыщения. Ток самостоятельного разряда ограничивает сопротивление цепи (здесь 200 кОм), иначе он рос бы лавиной.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'metal') el.innerHTML = `<div class="k">${MET[m.mat].name}</div><div class="v">R = ${fmt(m.R, 2)} Ом</div><div class="lr"><span>t</span><span>${neg(m.t)} °C</span></div><div class="lr"><span>I</span><span>${fmt(m.I, 2)} А</span></div><div class="lr"><span>R / R₀</span><span class="${m.mat === 'cu' && Math.abs(m.ratio - 1.5) <= 0.02 ? 'ok' : ''}">${fmt(m.ratio, 3)}</span></div>`;
  else if (id === 'semi') el.innerHTML = `<div class="k">Кристалл</div><div class="v ${m.I > 1 ? 'ok' : ''}">I = ${fmtI(m.I)}</div><div class="lr"><span>слева</span><span>${TYPN[m.tL]}</span></div><div class="lr"><span>справа</span><span>${TYPN[m.tR]}</span></div><div class="lr"><span>включение</span><span>${m.pn ? (m.mode === 'fwd' ? 'прямое' : 'обратное') : '—'}</span></div>`;
  else if (id === 'elec') el.innerHTML = `<div class="k">Электролиз</div><div class="v ${Math.abs(m.mass - 0.5) <= 0.01 ? 'ok' : ''}">+${fmt(m.mass, 3)} г</div><div class="lr"><span>I</span><span>${fmt(m.I, 1)} А</span></div><div class="lr"><span>t</span><span>${m.tm} мин</span></div><div class="lr"><span>цель</span><span>0,500 г</span></div>`;
  else el.innerHTML = `<div class="k">${GAS[m.gas].short}</div><div class="v ${m.I > 0 ? 'ok' : ''}">I = ${fmtI(m.I)}</div><div class="lr"><span>U</span><span>${fmt(m.U, 2)} кВ</span></div><div class="lr"><span>режим</span><span>${RG[m.regime]}</span></div><div class="lr"><span>найдено</span><span class="${m.found >= 4 ? 'ok' : ''}">${m.found}/4</span></div>`;
}

function update() {
  track();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, кто переносит ток в металле, кристалле, растворе, газе и вакууме!'), 1900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  metal: '<rect x="3" y="8" width="60" height="14" rx="4" fill="rgba(208,138,78,.2)" stroke="#d08a4e"/><circle cx="12" cy="15" r="2" fill="#72d4e8"/><circle cx="26" cy="12" r="2" fill="#72d4e8"/><circle cx="40" cy="18" r="2" fill="#72d4e8"/><circle cx="53" cy="14" r="2" fill="#72d4e8"/>',
  semi: '<rect x="3" y="4" width="30" height="22" fill="rgba(255,181,71,.18)"/><rect x="33" y="4" width="30" height="22" fill="rgba(114,212,232,.18)"/><text x="18" y="20" font-size="11" fill="#ffb547" text-anchor="middle" font-family="monospace">p</text><text x="48" y="20" font-size="11" fill="#72d4e8" text-anchor="middle" font-family="monospace">n</text>',
  elec: '<path d="M12 4V27H54V4" fill="none" stroke="#bfe3f2"/><rect x="13" y="11" width="40" height="15" fill="rgba(70,140,230,.35)"/><rect x="20" y="3" width="4" height="22" fill="#c27a45"/><rect x="42" y="3" width="4" height="22" fill="#c27a45"/>',
  gas: '<rect x="3" y="8" width="60" height="14" rx="7" fill="rgba(255,122,208,.35)" stroke="#bfe3f2"/><path d="M8 11l3 2l-3 2l3 2" fill="none" stroke="#ffb547"/><rect x="56" y="10" width="3" height="10" fill="#8b96ad"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const ls = $('#lessons'), cur = $('#lessons .lesson[aria-current="true"]');
  if (cur) { const a = ls.getBoundingClientRect(), b = cur.getBoundingClientRect(); ls.scrollLeft += b.left - a.left - (a.width - b.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'metal') now = `Проволока (${MET[m.mat].name.toLowerCase()}, α = ${m.mat === 'cu' ? '0,0043' : '0,0001'} К⁻¹, R₀ = 2,00 Ом при 0 °C) в цепи с источником ${fmt(m.U, 1)} В и амперметром. Температура ${neg(m.t)} °C, сопротивление R = ${fmt(m.R, 3)} Ом, R/R₀ = ${fmt(m.ratio, 3)}, ток ${fmt(m.I, 3)} А. На площадке видны ионы решётки (при нагреве колеблются сильнее), свободные электроны и график R(t). Не называй нужную температуру — помоги выразить t из R = R₀(1 + αt).`;
  if (id === 'semi') now = `Кристалл кремния 10×5 атомов, левая и правая половины. Слева: фосфор ${m.PL}, бор ${m.BL} (${TYPN[m.tL]}). Справа: фосфор ${m.PR}, бор ${m.BR} (${TYPN[m.tR]}). Кристалл ${S.hot ? 'нагрет до 150 °C (есть собственные пары электрон–дырка)' : 'холодный, 20 °C'}. «+» источника ${S.plusLeft ? 'слева' : 'справа'}. ${m.pn ? `Есть p–n-переход, включение ${m.mode === 'fwd' ? 'прямое' : 'обратное'}.` : 'p–n-перехода нет.'} Ток ${fmtI(m.I)}. Прямое включение проверено: ${S.seenF ? 'да' : 'нет'}, обратное: ${S.seenR ? 'да' : 'нет'}. Наводи вопросами: сколько внешних электронов у фосфора и бора, куда идут электроны и дырки.`;
  if (id === 'elec') now = `Электролиз раствора CuSO₄, медный анод, катод на весах. Сила тока ${fmt(m.I, 1)} А, время запуска ${m.tm} мин, заряд за запуск ${fmt(m.q, 0)} Кл, масса меди за запуск ${fmt(m.dm, 3)} г. На катоде сейчас ${fmt(m.mass, 3)} г${m.running ? ', электролиз идёт' : ''}. Цель — 0,50 ± 0,01 г. Не называй готовые I и t — помоги найти нужный заряд q = m / k (k = 0,329 мг/Кл) и перевести минуты в секунды.`;
  if (id === 'gas') now = `Трубка с двумя электродами (слева нить накала, справа пластина). В трубке: ${GAS[m.gas].name.toLowerCase()}. Напряжение ${fmt(m.U, 2)} кВ, напряжение пробоя ${m.gas === 'vac' ? 'не определено (газа нет)' : isFinite(m.br) ? '≈ ' + fmt(m.br, 1) + ' кВ' : 'больше 5 кВ'}. Ионизатор ${m.ion ? 'включён' : 'выключен'}, накал ${m.heat ? 'включён' : 'выключен'}, нить подключена к ${m.pol ? '«−» (катод)' : '«+» (анод)'}. Режим: ${RG[m.regime]}, ток ${fmtI(m.I)}. Найдено: ${FLAGS.map(([k, t]) => `${t} — ${S.flags[k] ? 'да' : 'нет'}`).join('; ')}.`;
  return [
    `Раздел: физика, 10 класс, тема «Ток в разных средах» (электричество и магнетизм). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { metal: 'Почему лампочка чаще перегорает в момент включения?', semi: 'Как солнечная батарея делает ток из света?', elec: 'Почему мокрыми руками опасно трогать розетку?', gas: 'Почему молния бьёт в высокие предметы?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
