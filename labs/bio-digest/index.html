<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 9 класс: лёгкие и дыхание, пищеварение, питание и витамины, выделение.">
<title>Дыхание и питание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.flist{display:grid;gap:5px;margin-top:10px}
.flist div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:5px 6px 5px 11px;font-size:13px}
.flist span{flex:1;min-width:0}
.flist b{font:500 13px var(--font-mono);min-width:22px;text-align:center}
.flist button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font:500 15px/1 var(--font-mono)}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 8v9M20 17q-4 3-7 2M20 17q4 3 7 2" stroke="#9fb0c8" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M18 14q-9-1-9 10q0 6 5 6q4 0 4-5zM22 14q9-1 9 10q0 6-5 6q-4 0-4-5z" fill="rgba(114,212,232,.25)" stroke="var(--arm)" stroke-width="1.3"/><circle cx="14" cy="25" r="1.6" fill="var(--ok)"/><circle cx="26" cy="25" r="1.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Обмен</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>

  <aside class="panel">
    <div class="tabs" role="tablist">

      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>

    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>

    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-digest';

// ---------- lesson 1: lung volumes of an adult (litres) ----------
const RV = 1.2, ERV = 1.2, TV = 0.5, IRV = 1.8;
const VC = ERV + TV + IRV;          // vital capacity 3.5 L
const FRC = RV + ERV;               // volume left after a calm exhale, 2.4 L
const UMIN = -ERV, UMAX = TV + IRV; // u = air above the calm-exhale level

// ---------- lesson 2: digestive juices and where they act ----------
const JUICE = [
  { id: 'saliva', sh: 'Слюна', name: 'Слюна', has: 'фермент амилаза', ans: ['mouth'], c: '#72d4e8' },
  { id: 'gastric', sh: 'Желуд. сок', name: 'Желудочный сок', has: 'пепсин и соляная кислота', ans: ['stomach'], c: '#ff8a73' },
  { id: 'bile', sh: 'Желчь', name: 'Желчь', has: 'без ферментов, дробит жир', ans: ['duod'], c: '#c9d84f' },

  { id: 'intest', sh: 'Кишечный сок', name: 'Кишечный сок', has: 'пептидазы, мальтаза…', ans: ['small', 'duod'], c: '#b48cff' },
];
const SPOTS = [
  { id: 'mouth', name: 'Ротовая полость', short: 'Рот' },
  { id: 'stomach', name: 'Желудок', short: 'Желудок' },
  { id: 'duod', name: '12-перстная кишка', short: '12-перстная' },
  { id: 'small', name: 'Тонкая кишка', short: 'Тонкая кишка' },
  { id: 'large', name: 'Толстая кишка', short: 'Толстая кишка' },
];
const ROUTE = ['mouth', 'eso', 'stomach', 'duod', 'small', 'large', 'out'];
const ROUTE_NAME = { plate: 'на тарелке', mouth: 'ротовая полость', eso: 'пищевод', stomach: 'желудок', duod: '12-перстная кишка', small: 'тонкая кишка', large: 'толстая кишка', out: 'выведено' };
const NUTR = { starch: 'Углеводы (крахмал)', prot: 'Белки', fat: 'Жиры' };
const NUTK = ['starch', 'prot', 'fat'];
const PHASE = [['poly', 'целые молекулы', '#56627d'], ['frag', 'частично расщеплены', '#ffb547'], ['mono', 'до мономеров', '#86e0a8'], ['abs', 'всосались', '#72d4e8']];

// ---------- lesson 3: foods, one portion each (rounded table values) ----------
// energy is counted by the rule 4 kcal per 1 g of protein or carbohydrate, 9 kcal per 1 g of fat
const FOODS = [
  { n: 'Хлеб', w: '2 ломтика, 60 г', p: 5, fat: 2, carb: 29, vc: 0, va: 0 },
  { n: 'Гречка', w: 'каша, 150 г', p: 9, fat: 2.4, carb: 48, vc: 0, va: 0 },
  { n: 'Пюре', w: 'картофельное, 200 г', p: 4, fat: 6, carb: 28, vc: 12, va: 40 },
  { n: 'Курица', w: 'грудка, 120 г', p: 35, fat: 2.5, carb: 0, vc: 0, va: 10 },
  { n: 'Говядина', w: 'отварная, 100 г', p: 26, fat: 16, carb: 0, vc: 0, va: 0 },
  { n: 'Яйца', w: '2 шт, 100 г', p: 13, fat: 11, carb: 1, vc: 0, va: 250 },

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function freshMeal() { const N = { emul: false }; NUTK.forEach(k => { N[k] = { poly: 1, frag: 0, mono: 0, abs: 0 }; }); return N; }
function resetMeal() { S.meal = freshMeal(); S.pos = -1; S.ran = false; S.log = []; }
function resetLesson() {
  const L = LESSONS[S.lesson];
  // lesson 1
  S.u = 0; S.target = null; S.auto = false; S.autoT = 0; S.flow = 0; S.uLast = 0; S.lastT = 0;
  S.spiro = []; S.sT = 0; S.hiU = 0; S.loU = 0; S.peak = false; S.vcDone = false; S.vc = 0; S.needUI = false; S.uiT = 0;
  // lesson 2
  S.jb = Array(JUICE.length).fill(-1); S.sel = -1; resetMeal();
  // lesson 3
  S.cnt = Array(FOODS.length).fill(0); S.lastFood = -1;
  // lesson 4
  S.fi = Array(SUB.length).fill(null); S.re = Array(SUB.length).fill(null); S.hot = false; S.drink = L.drink || 1.5; S.lastSub = -1;
}

// ---------- models ----------
function urineOf() {
  const w = SUB.findIndex(s => s.id === 'water');
  if (S.fi[w] !== true) return { urine: 0, primary: 0, low: false, flood: false };
  if (S.re[w] === 'urine') return { urine: 180, primary: 180, low: false, flood: true };
  const raw = S.drink + FOOD_WATER + CELL_WATER - BREATH_LOSS - FECES_LOSS - SKIN_LOSS - (S.hot ? HEAT_EXTRA : 0);
  return { urine: Math.max(0.5, Math.round(raw * 100) / 100), raw, primary: 180, low: raw < 1.0, flood: false };
}
function foodTotals() {
  const T = { kcal: 0, p: 0, fat: 0, carb: 0, vc: 0, va: 0 };
  FOODS.forEach((x, i) => { const n = S.cnt[i]; if (n) for (const k in T) T[k] += x[k] * n; });
  T.fatPct = T.kcal ? T.fat * 9 / T.kcal * 100 : 0;
  T.ok = { e: T.kcal >= NORM.eMin && T.kcal <= NORM.eMax, p: T.p >= NORM.p, fat: T.kcal > 0 && T.fatPct <= NORM.fatPct, vc: T.vc >= NORM.vc, va: T.va >= NORM.va };
  return T;
}
const rowSet = i => S.fi[i] === false || (S.fi[i] === true && S.re[i] !== null);
const rowOk = i => SUB[i].f ? (S.fi[i] === true && S.re[i] === SUB[i].r) : S.fi[i] === false;
function model() {
  const id = LID();
  if (id === 'breath') return { kind: 'breath', V: FRC + S.u, u: S.u, vcDone: S.vcDone, vc: S.vc, peak: S.peak };
  if (id === 'digest') {
    let n = 0, r = 0;
    S.jb.forEach((b, i) => { if (b >= 0) { n++; if (JUICE[i].ans.includes(SPOTS[b].id)) r++; } });
    return { kind: 'digest', placed: n, right: r, ran: S.ran };
  }
  if (id === 'food') { const T = foodTotals(); return { kind: 'food', T, right: Object.values(T.ok).filter(Boolean).length }; }
  let set = 0, r = 0; SUB.forEach((_, i) => { if (rowSet(i)) set++; if (rowOk(i)) r++; });
  const U = urineOf();
  return { kind: 'excr', set, right: r, hot: S.hot, urine: U.urine, U };
}

// ---------- lesson 1 actions ----------
function setU(u) { S.u = clamp(u, UMIN, UMAX); S.needUI = true; dirty = true; }
function trackU() {
  const u = S.u;
  if (u > S.hiU) S.hiU = u;
  if (u >= UMAX - 0.06) { if (!S.peak) { S.peak = true; S.needUI = true; } S.hiU = Math.max(S.hiU, u); S.loU = u; }
  else if (S.peak) S.loU = Math.min(S.loU, u);
  if (S.peak && u <= UMIN + 0.06 && !S.vcDone) { S.vcDone = true; S.vc = S.hiU - S.loU; S.needUI = true; }
}

// ---------- lesson 2 actions ----------
function dropJuice(c, b) {
  if (b < 0) { S.sel = -1; dirty = true; return; }
  const was = S.jb[c]; S.jb[c] = b; S.sel = -1;
  if (was !== b) resetMeal();
  const m = model();
  if (m.placed === JUICE.length && m.right < JUICE.length) toast(`Все соки на местах. Верно ${m.right} из 5 — переложите красные.`);
  renderTools(); update();
}
function stopNotes(loc) {
  const N = S.meal, acid = loc === 'stomach', notes = [];
  const here = JUICE.filter((j, i) => S.jb[i] >= 0 && SPOTS[S.jb[i]].id === loc).map(j => j.id);
  if (loc === 'mouth') notes.push('зубы измельчили пищу, язык смочил её слюной');
  if (loc === 'eso') notes.push('стенки пищевода волной сокращений протолкнули комок в желудок');
  for (const id of ['bile', 'saliva', 'gastric', 'panc', 'intest']) {
    if (!here.includes(id)) continue;
    if (id === 'bile') {
      if (acid || loc === 'mouth') notes.push('желчь здесь бесполезна: она работает в кишке, где среда щелочная');
      else { N.emul = true; notes.push('желчь раздробила жир на мелкие капельки'); }
    }
    if (id === 'saliva') {
      if (acid) notes.push('амилаза слюны в кислой среде не работает');
      else { const x = Math.min(N.starch.poly, 0.1); N.starch.poly -= x; N.starch.frag += x; notes.push(`амилаза слюны расщепила ${Math.round(x * 100)} % крахмала до мальтозы`); }
    }
    if (id === 'gastric') {
      if (!acid) notes.push('пепсину нужна кислая среда — здесь он не работает');
      else { const x = Math.min(N.prot.poly, 0.3); N.prot.poly -= x; N.prot.frag += x; notes.push(`пепсин расщепил ${Math.round(x * 100)} % белков на куски`); }
    }
    if (id === 'panc') {
      if (acid) notes.push('ферменты сока поджелудочной не работают в кислой среде');
      else {
        N.starch.frag += N.starch.poly; N.starch.poly = 0; N.prot.frag += N.prot.poly; N.prot.poly = 0;
        const x = N.emul ? N.fat.poly : N.fat.poly * 0.3; N.fat.poly -= x; N.fat.mono += x;
        notes.push('амилаза и трипсин расщепили крахмал и белки на части');
        notes.push(N.emul ? 'липаза расщепила жир до глицерина и жирных кислот' : `липаза без желчи расщепила только ${Math.round(x * 100)} % жира — капли слишком крупные`);
      }
    }
    if (id === 'intest') {
      if (acid) notes.push('кишечный сок в кислой среде не работает');
      else { N.starch.mono += N.starch.frag; N.starch.frag = 0; N.prot.mono += N.prot.frag; N.prot.frag = 0; notes.push('кишечный сок довёл части до глюкозы и аминокислот'); }
    }
  }
  if (loc === 'duod' || loc === 'small') {
    let any = false; NUTK.forEach(k => { if (N[k].mono > 0) { any = true; N[k].abs += N[k].mono; N[k].mono = 0; } });
    notes.push(any ? 'ворсинки всосали мономеры в кровь и лимфу' : 'всасывать пока нечего — нет мономеров');
  }
  if (loc === 'large') notes.push('всасывается вода, бактерии перерабатывают клетчатку');
  if (loc === 'out') {
    const left = NUTK.filter(k => N[k].abs < 0.995).map(k => `${NUTR[k].split(' ')[0].toLowerCase()} ${Math.round((1 - N[k].abs) * 100)} %`);
    notes.push(left.length ? 'не усвоено и выведено: ' + left.join(', ') : 'всё питательное усвоено, выведены только остатки клетчатки');
  }
  if (!here.length && (loc === 'stomach' || loc === 'duod' || loc === 'small')) notes.push('сюда не добавлено ни одного сока');
  return notes;
}
function mealStep() {
  if (S.pos >= ROUTE.length - 1) { resetMeal(); renderTools(); update(); return; }
  S.pos++;
  const loc = ROUTE[S.pos];
  S.log.push({ loc, notes: stopNotes(loc) });
  S.moveT = performance.now();
  if (loc === 'out') {
    S.ran = true;
    const N = S.meal;
    toast(`Всосалось: углеводы ${Math.round(N.starch.abs * 100)} %, белки ${Math.round(N.prot.abs * 100)} %, жиры ${Math.round(N.fat.abs * 100)} %.`);
  }
  renderTools(); update();
}

// ---------- lesson 3 actions ----------
function addFood(i, d) {
  const n = clamp(S.cnt[i] + d, 0, MAXP);
  if (n === S.cnt[i]) { if (d > 0) toast('Хватит: не больше 5 порций одного продукта.'); return; }
  S.cnt[i] = n; S.lastFood = i; S.foodT = performance.now();
  update();
}

// ---------- lesson 4 actions ----------
function setFi(i, v) { S.fi[i] = v; if (!v) S.re[i] = null; S.lastSub = i; afterSub(); }
function setRe(i, v) {
  if (S.fi[i] !== true) { toast(S.fi[i] === false ? 'Это вещество не попало в каналец — ему нечего возвращать.' : 'Сначала решите, проходит ли вещество в капсулу.'); return; }
  S.re[i] = v; S.lastSub = i; afterSub();
}

function polyAt(P, q) { // point at fraction q along polyline P
  let L = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(d); L += d; }
  let s = clamp(q, 0, 1) * L;
  for (let i = 0; i < seg.length; i++) { if (s <= seg[i] || i === seg.length - 1) { const k = seg[i] ? clamp(s / seg[i], 0, 1) : 0; return [P[i][0] + (P[i + 1][0] - P[i][0]) * k, P[i][1] + (P[i + 1][1] - P[i][1]) * k]; } s -= seg[i]; }

  return `<g data-hit="${id}"><rect x="${x}" y="${y - 12}" width="${w}" height="24" rx="8" fill="${on ? 'rgba(255,181,71,.16)' : '#121a28'}" stroke="${c}" stroke-width="${on ? 1.8 : 1.2}" opacity="${dis ? .35 : 1}"/>` + T(x + w / 2, y + 4, label, 10, on ? '#e8ecf4' : '#8b96ad', `text-anchor="middle"${dis ? ' opacity=".4"' : ''}`) + `</g>`;
}
function nephronScene(t) {
  let h = bench();
  const m = model(), all = m.set === SUB.length;
  // table
  h += `<g data-hit="table"><rect x="8" y="104" width="272" height="276" rx="12" fill="rgba(18,26,40,.9)" stroke="#26324a"/></g>`;
  h += T(PX.y + 37, 122, '1. Проходит', 10, '#e8ecf4', 'text-anchor="middle" font-weight="600"') + T(PX.y + 37, 135, 'в капсулу?', 10, '#e8ecf4', 'text-anchor="middle" font-weight="600"');
  h += T(PX.b + 43, 122, '2. Куда из', 10, '#e8ecf4', 'text-anchor="middle" font-weight="600"') + T(PX.b + 43, 135, 'канальца?', 10, '#e8ecf4', 'text-anchor="middle" font-weight="600"');
  SUB.forEach((s, i) => {
    const y = RY(i), fi = S.fi[i], re = S.re[i], ok = all ? rowOk(i) : null;
    h += `<circle cx="20" cy="${y}" r="5" fill="${s.c}" stroke="${INK}"/>` + T(30, y + 4, s.name, 10, '#e8ecf4');
    h += pill(`fi${i}y`, PX.y, y, 34, 'да', fi === true, ok, false) + pill(`fi${i}n`, PX.n, y, 38, 'нет', fi === false, ok, false);
    h += pill(`re${i}b`, PX.b, y, 42, 'в кровь', re === 'blood', ok, fi !== true) + pill(`re${i}u`, PX.u, y, 42, 'в мочу', re === 'urine', ok, fi !== true);
    if (all) h += T(279, y + 4, ok ? '✓' : '✗', 11, ok ? '#86e0a8' : '#ff8a73', 'text-anchor="end"');
  });
  // nephron
  h += T(296, 112, 'кровь', 9.5, '#ff6b6b');
  h += `<g data-hit="cap"><polyline points="${pts(BLOOD)}" fill="none" stroke="transparent" stroke-width="14"/><polyline points="${pts(BLOOD)}" fill="none" stroke="#c4505c" stroke-width="5" stroke-linejoin="round" opacity=".85"/></g>`;
  h += `<g data-hit="tub"><polyline points="${pts(TUB.slice(0, -2))}" fill="none" stroke="transparent" stroke-width="14"/><polyline points="${pts(TUB.slice(0, -2))}" fill="none" stroke="#e9d84f" stroke-width="6" stroke-linejoin="round" opacity=".55"/></g>`;
  h += `<g data-hit="duct"><polyline points="${pts(TUB.slice(-3))}" fill="none" stroke="#e9d84f" stroke-width="9" stroke-linejoin="round" opacity=".7"/></g>`;
  h += `<g data-hit="caps"><circle cx="318" cy="140" r="22" fill="rgba(233,216,79,.12)" stroke="#e9d84f" stroke-width="2.4"/></g>`;
  h += `<g data-hit="glom"><path d="M306 138q4-8 8 0t8 0t8 0M308 146q4-8 8 0t8 0" stroke="#ff6b6b" stroke-width="2.6" fill="none"/></g>`;
  h += T(316, 176, 'капсула', 9, '#e9d84f', 'text-anchor="middle"') + T(439, 300, 'каналец', 9, '#e9d84f', 'transform="rotate(-90 439 300)"') + T(496, 392, 'моча', 10, '#e9d84f', 'text-anchor="end" font-weight="600"');
  h += T(292, 380, 'в кровь ←', 9.5, '#ff6b6b');
  // particles
  const time = reduce ? 0 : t;
  SUB.forEach((s, i) => {
    for (let j = 0; j < 2; j++) {
      const q = ((time / 7000) + i / 6 + j / 2) % 1;
      let p;
      if (S.fi[i] === true) {
        if (S.re[i] === 'blood') p = q < 0.45 ? polyAt(TUB, q * 0.75 / 0.45 * 0.45) : polyAt(BACK, (q - 0.45) / 0.55);
        else if (S.re[i] === 'urine') p = polyAt(TUB, q);
        else p = polyAt(TUB, Math.min(q, 0.3));
      } else if (S.fi[i] === false) p = polyAt(BLOOD, q);
      else p = polyAt(BLOOD, Math.min(q, 0.12));
      h += `<circle cx="${f(p[0] + (j ? 2 : -2))}" cy="${f(p[1] + (i % 3 - 1) * 1.6)}" r="${S.lastSub === i ? 4 : 3}" fill="${s.c}" stroke="${INK}" stroke-width=".8"/>`;
    }
  });
  if (S.hot) h += `<g transform="translate(486 128)"><circle r="9" fill="#ffb547"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M0 -12V-16" stroke="#ffb547" stroke-width="2" transform="rotate(${a})"/>`).join('')}</g>` + T(486, 156, 'жара', 9.5, '#ffb547', 'text-anchor="middle"');
  return h;
}

function hlBox(id) {
  const L = LID();
  if (L === 'breath') return { airway: [124, 66, 32, 152], lungs: [56, 120, 168, 170], ribs: [44, 128, 192, 176], dia: [46, diaY() - 14, 188, 60], spiro: [264, 108, 252, 290] }[id];
  if (L === 'digest') return ORG2[id] || null;
  if (L === 'food') return { ebar: [8, 94, 504, 52], tiles: [8, 144, 504, 254] }[id] || null;
  return { glom: [298, 120, 40, 40], caps: [292, 114, 52, 52], tub: [336, 118, 172, 240], cap: [280, 116, 140, 276], duct: [486, 196, 24, 196], table: [6, 102, 276, 280] }[id] || null;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = id === 'breath' ? breathScene(t) : id === 'digest' ? tractScene(t) : id === 'food' ? menuScene(t) : nephronScene(t);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${f(b[0])}" y="${f(b[1])}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 510, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer: taps, dragging the diaphragm and juice cards ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const inBox = (p, b, pad = 0) => p.x > b[0] - pad && p.x < b[0] + b[2] + pad && p.y > b[1] - pad && p.y < b[1] + b[3] + pad;
const slotAt = p => {
  for (let b = 0; b < SPOTS.length; b++) { const [x, y] = slotXY(b); if (inBox(p, [x, y, SW, SH], 6)) return b; }
  for (let b = 0; b < SPOTS.length; b++) if (inBox(p, ORG2[SPOTS[b].id])) return b;
  return -1;
};
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag === 'dia') {
    S.auto = false; S.target = null; renderTools();
    drag = { dia: true, c: -1, dy: diaY() - p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing');
  } else if (el.dataset.drag) {
    const c = +el.dataset.drag.slice(1);
    let dx = -JW / 2, dy = -JH / 2;
    if (S.jb[c] < 0) { const [x, y] = homeJ(c); dx = x - p.x; dy = y - p.y; }
    drag = { c, dx, dy, px: p.x, py: p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing');
  } else drag = { c: -1, hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.dia) { const p = toSvg(e); setU(UMIN + (p.y + drag.dy - 262) / 70 * (UMAX - UMIN)); return; }
  if (drag.c < 0 || !drag.moved) return;
  const p = toSvg(e); drag.px = p.x; drag.py = p.y; dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (d.dia) { S.needUI = true; dirty = true; return; }
  if (cancel) { dirty = true; return; }
  if (d.c >= 0) {
    if (!d.moved) { S.sel = S.sel === d.c ? -1 : d.c; dirty = true; return; }
    dropJuice(d.c, slotAt({ x: d.px, y: d.py }));
    return;
  }
  if (d.moved) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'breath' && id === 'lungs') toast('Лёгкие сами не расширяются — тяните диафрагму.');
  if (L === 'digest') {
    if (id.startsWith('slot') || id.startsWith('o-')) {
      const b = id.startsWith('slot') ? +id.slice(4) : SPOTS.findIndex(s => 'o-' + s.id === id);
      if (b >= 0 && S.sel >= 0) dropJuice(S.sel, b);
      else if (id === 'o-liver') toast('Печень вырабатывает желчь. А где желчь работает?');
      else if (id === 'o-panc') toast('Поджелудочная железа делает сок. Куда идёт её проток?');
      else if (id === 'o-eso') toast('В пищеводе пища не переваривается — он только проводит комок.');
      else if (b >= 0) toast('Сначала нажмите сок слева, потом отдел.');
    }
  }
  if (L === 'food') {
    if (id.startsWith('food')) addFood(+id.slice(4), 1);
    if (id.startsWith('minus')) addFood(+id.slice(5), -1);
  }
  if (L === 'excr') {
    const mm = id.match(/^(fi|re)(\d)([ynbu])$/);
    if (mm) { const i = +mm[2]; if (mm[1] === 'fi') setFi(i, mm[3] === 'y'); else setRe(i, mm[3] === 'b' ? 'blood' : 'urine'); }
  }
}

function loop(t) {
  requestAnimationFrame(loop);
  let anim = false;
  const id = LID();
  if (id === 'breath') {
    const dt = S.lastT ? Math.min(0.1, (t - S.lastT) / 1000) : 0; S.lastT = t;
    const u0 = S.u;
    if (S.auto) S.u = TV / 2 - TV / 2 * Math.cos(2 * Math.PI * (t - S.autoT) / 4000);
    else if (S.target !== null) {
      const d = S.target - S.u, st = (reduce ? 99 : 1.3) * dt;
      if (Math.abs(d) <= st) { S.u = S.target; S.target = null; renderTools(); } else S.u += Math.sign(d) * st;
    }
    if (S.u !== u0) S.needUI = true;
    if (dt > 0) S.flow = S.flow * 0.8 + ((S.u - S.uLast) / dt) * 0.2;
    S.uLast = S.u;
    trackU();
    const last = S.spiro[S.spiro.length - 1], V = FRC + S.u;
    if (reduce ? (last === undefined || Math.abs(last - V) > 0.01) : t - S.sT >= 50) {
      S.spiro.push(V); S.sT = t; if (S.spiro.length > MAXS) S.spiro.shift(); anim = true;
    }
    if (Math.abs(S.flow) > 0.01) anim = true;
    if (S.needUI && t - S.uiT > 150) { S.needUI = false; S.uiT = t; update(true); }
  }
  if (id === 'digest' && !reduce && S.moveT) anim = t - S.moveT < 420;
  if (id === 'food' && !reduce && S.foodT) anim = t - S.foodT < 420;
  if (id === 'excr' && !reduce) anim = true;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed, c, cls) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}${cls ? ` class="${cls}"` : ''}>${c ? `<i style="background:${c}"></i>` : ''}${label}</button>`;
  const sep = '<span class="sep"></span>';
  const stepLabel = S.pos < 0 ? 'Съесть обед ›' : S.pos >= ROUTE.length - 1 ? 'Сначала ↺' : 'Дальше ›';
  tb.innerHTML = {
    breath: B('inmax', 'Макс. вдох') + B('calm', 'Спокойно') + B('exmax', 'Макс. выдох') + B('auto', 'Спокойное дыхание', S.auto) + sep + B('reset', 'Сбросить'),
    digest: B('step', stepLabel, undefined, '', 'go') + B('meal', 'Новый обед') + sep + B('reset', 'Убрать соки'),
    food: B('reset', 'Очистить меню'),
    excr: B('hot', 'Жара +40 °C', S.hot, '#ffb547') + B('less', 'Пить меньше') + B('more', 'Пить больше') + sep + B('reset', 'Сбросить'),
  }[id];
  placeHint();
}
// the stage hint sits bottom-left; hide it when the toolbar is wide enough to cover it
function placeHint() {
  const hn = $('#hint'), st = $('#stage').getBoundingClientRect(), tb = $('#tools').getBoundingClientRect();
  hn.style.visibility = tb.left - st.left < st.width * 0.19 + 30 ? 'hidden' : '';
}
addEventListener('resize', placeHint);
function act(a) {
  const id = LID();
  if (a === 'reset') { resetLesson(); renderTools(); buildScheme(); update(); return; }
  if (id === 'breath') {
    if (a === 'inmax' || a === 'exmax' || a === 'calm') { S.auto = false; S.target = a === 'inmax' ? UMAX : a === 'exmax' ? UMIN : 0; renderTools(); return; }
    if (a === 'auto') { S.auto = !S.auto; S.target = null; if (S.auto) S.autoT = performance.now() - Math.acos(clamp(1 - S.u / (TV / 2), -1, 1)) / (2 * Math.PI) * 4000; renderTools(); update(); return; }
  }
  if (id === 'digest') {
    if (a === 'step') return mealStep();
    if (a === 'meal') { resetMeal(); renderTools(); update(); return; }
  }
  if (id === 'excr') {
    if (a === 'hot') { S.hot = !S.hot; renderTools(); update(); return; }
    if (a === 'less') return setDrink(S.drink - 0.25);
    if (a === 'more') return setDrink(S.drink + 0.25);
  }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {

  lungs: IC('<path d="M15 8Q5 8 5 22Q5 30 11 30Q15 30 15 24Z" fill="#ff9db0" opacity=".7"/><path d="M19 8Q29 8 29 22Q29 30 23 30Q19 30 19 24Z" fill="#ff9db0" opacity=".7"/>'),
  ribs: IC('<path d="M17 6Q6 6 4 14M17 13Q6 13 4 21M17 20Q6 20 4 28M17 6Q28 6 30 14M17 13Q28 13 30 21M17 20Q28 20 30 28" stroke="#cfd6e4" stroke-width="2" fill="none"/>'),

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'breath') return m.peak ? `Вдох есть. Теперь максимальный выдох · ${ru(m.V)} л` : `Объём лёгких ${ru(m.V)} л`;
  if (m.kind === 'digest') {
    if (m.placed < 5) return `Соков на месте: ${m.placed} из 5`;
    if (m.right < 5) return `Верно ${m.right} из 5`;
    return S.pos < 0 ? 'Соки на местах — пора обедать' : `Обед: ${ROUTE_NAME[ROUTE[S.pos]]}`;
  }
  if (m.kind === 'food') return `Выполнено условий: ${m.right} из 5 · ${Math.round(m.T.kcal)} ккал`;
  if (m.set < 6) return `Настроено веществ: ${m.set} из 6`;
  if (m.right < 6) return `Верно ${m.right} из 6`;
  if (!m.hot) return 'Нефрон верный. Включите жару';
  return `Моча ${ru(m.urine)} л в сутки, нужно 1,2–1,8 л`;
}

// Scheme tab: built once per lesson, values refreshed after

      <dl class="reads"><div><dt>Объём</dt><dd id="r1"></dd></div><div><dt>Поток</dt><dd id="r2"></dd></div><div><dt>ЖЁЛ</dt><dd id="r3"></dd></div></dl>
      <h3>Объёмы лёгких взрослого</h3><div id="vDiag"></div><p class="note" id="muscNote" style="margin-top:10px"></p>`;
  if (id === 'digest') h = `<h2>Соки и отделы</h2><p class="note">Можно без перетаскивания: выберите сок, потом отдел.</p>

      <dl class="reads"><div><dt>На месте</dt><dd id="r1"></dd></div><div><dt>Верно</dt><dd id="r2"></dd></div><div><dt>Обед</dt><dd id="r3"></dd></div></dl>
      <h3>Что с обедом</h3><div class="steps" id="nutList"></div>

function exVerdict(m) {
  const U = m.U, i = k => SUB.findIndex(s => s.id === k);
  if (S.fi[i('water')] === false) return 'Вода не проходит в капсулу — первичная моча не образуется, почка не работает.';
  if (S.fi[i('water')] !== true) return 'Решите, проходит ли вода через фильтр клубочка.';
  if (U.flood) return 'Вода не возвращается в кровь: 180 л мочи в сутки! Человек обезводится за несколько часов.';
  const msg = [];
  if (S.re[i('gluc')] === 'urine') msg.push('глюкоза в моче — так бывает при сахарном диабете');
  if (S.fi[i('prot')] === true || S.fi[i('rbc')] === true) msg.push('белки или клетки крови в моче — признак повреждённого фильтра');
  if (S.fi[i('urea')] === false || S.re[i('urea')] === 'blood') msg.push('мочевина копится в крови — организм отравляется');
  if (U.raw !== undefined && U.raw < 0.5) msg.push('воды очень мало: почки выводят минимум, моча тёмная, хочется пить — это обезвоживание');
  else if (U.low) msg.push('мочи мало, она концентрированная — стоит пить больше');
  return msg.length ? msg.join('; ') + '.' : `Моча ${ru(U.urine)} л в сутки — всё в порядке.`;
}

  }
  if (id === 'food') {
    const Tt = m.T, used = FOODS.map((x, i) => [x, S.cnt[i]]).filter(([, n]) => n);
    let h = `<h2>Расчёт меню</h2><div class="formula">E = 4·Б + 9·Ж + 4·У</div>`;
    h += `<h3>Продукты</h3>` + (used.length ? `<div class="steps">` + used.map(([x, n]) => step(`${x.n} × ${n}`, `${x.kcal} × ${n} = ${x.kcal * n} ккал`)).join('') + `</div>` : `<p class="note">Меню пока пустое.</p>`);
    h += `<h3>Суммы</h3><div class="steps">` +
      step('белки, Б', `${ru(Tt.p)} г`) + step('жиры, Ж', `${ru(Tt.fat)} г`) + step('углеводы, У', `${ru(Tt.carb)} г`) +
      step('энергия', `4·${ru(Tt.p, 0)} + 9·${ru(Tt.fat, 0)} + 4·${ru(Tt.carb, 0)} ≈ ${Math.round(Tt.kcal)} ккал`, 'sum') +
      step('доля жира', Tt.kcal ? `9·${ru(Tt.fat, 0)} ÷ ${Math.round(Tt.kcal)} × 100 = ${ru(Tt.fatPct, 0)} %` : '—', 'sum') + `</div>`;
    const ck = (ok, a, b) => step(a, `${b} ${ok ? '✓' : '✗'}`);
    h += `<h3>Проверка по нормам 14–15 лет</h3><div class="steps">` +
      ck(Tt.ok.e, 'энергия 2400–3000 ккал', `${Math.round(Tt.kcal)}`) + ck(Tt.ok.p, 'белки ≥ 75 г', `${ru(Tt.p, 0)}`) + ck(Tt.ok.fat, 'жиры ≤ 35 % энергии', `${ru(Tt.fatPct, 0)} %`) +
      ck(Tt.ok.vc, 'витамин C ≥ 70 мг', `${Math.round(Tt.vc)}`) + ck(Tt.ok.va, 'витамин A ≥ 700 мкг', `${Math.round(Tt.va)}`) + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Состав продуктов округлён по таблицам химического состава. Витамин A посчитан в пересчёте на ретинол.</p>`;
  }
  const U = m.U;
  let h = `<h2>Работа нефрона</h2><div class="formula">кровь → фильтрация → первичная моча → обратное всасывание → вторичная моча</div>`;
  h += `<h3>За сутки</h3><div class="steps">` + step('через почки проходит крови', 'около 1700 л') + step('первичной мочи', U.primary ? `${U.primary} л` : '0 л') +
    step('вернулось в кровь', U.primary && !U.flood ? `${U.primary} − ${ru(U.urine)} = ${ru(U.primary - U.urine)} л (${ru((U.primary - U.urine) / U.primary * 100)} %)` : '—') +
    step('вторичной мочи', U.primary ? `${ru(U.urine)} л` : '—', 'sum') + `</div>`;
  const loss = SKIN_LOSS + (S.hot ? HEAT_EXTRA : 0);
  h += `<h3>Водный баланс</h3><div class="steps">` +
    step('приход: питьё + пища + из клеток', `${ru(S.drink, 2)} + ${ru(FOOD_WATER)} + ${ru(CELL_WATER)} = ${ru(S.drink + FOOD_WATER + CELL_WATER, 2)} л`) +
    step(`расход без почек: дыхание + кожа${S.hot ? ' в жару' : ''} + кишечник`, `${ru(BREATH_LOSS)} + ${ru(loss)} + ${ru(FECES_LOSS)} = ${ru(BREATH_LOSS + loss + FECES_LOSS)} л`) +
    step('остаётся для почек', U.raw !== undefined ? `${ru(U.raw, 2)} л${U.raw < 0.5 ? ' → минимум 0,5 л' : ''}` : '—', 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">${exVerdict(m)}</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'breath') {
    const ins = Math.abs(S.flow) > 0.06 ? (S.flow > 0 ? 'ниже атм.' : 'выше атм.') : 'равно атм.';
    el.innerHTML = `<div class="k">Объём лёгких</div><div class="v ${S.done.breath ? 'ok' : ''}">${ru(m.V, 2)} л</div>
      <div class="gauge"><b style="width:${(kU() * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>давление</span><span>${ins}</span></div><div class="lr"><span>ЖЁЛ</span><span>${S.vcDone ? ru(S.vc) + ' л' : '—'}</span></div>`;
  } else if (m.kind === 'digest') {
    const N = S.meal;
    let s = `<svg viewBox="0 0 150 52" aria-hidden="true">`;
    NUTK.forEach((k, r) => {
      let x = 44; s += `<text x="0" y="${r * 17 + 10}" font-size="9" fill="#8b96ad" font-family="IBM Plex Mono,monospace">${['углев.', 'белки', 'жиры'][r]}</text>`;
      PHASE.forEach(([ph, , c]) => { const w = N[k][ph] * 104; if (w > 0.3) s += `<rect x="${f(x)}" y="${r * 17 + 2}" width="${f(w)}" height="10" fill="${c}"/>`; x += w; });
    });
    el.innerHTML = `<div class="k">Обед: ${S.pos < 0 ? 'на тарелке' : ROUTE_NAME[ROUTE[S.pos]]}</div>` + s + `</svg>` +
      `<div class="lr"><span style="color:#72d4e8">■ всосалось</span><span style="color:#ffb547">■ части</span></div><div class="lr"><span>соки верно</span><span>${m.placed === 5 ? m.right + ' из 5' : m.placed + '/5 на месте'}</span></div>`;
  } else if (m.kind === 'food') {
    const Tt = m.T, c = ok => ok ? 'ok' : 'bad';
    el.innerHTML = `<div class="k">Энергия</div><div class="v ${S.done.food ? 'ok' : Tt.kcal > NORM.eMax ? 'bad' : ''}">${Math.round(Tt.kcal)} ккал</div>
      <div class="gauge"><b style="width:${clamp(Tt.kcal / NORM.eMax * 100, 0, 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>белки</span><span class="${c(Tt.ok.p)}">${ru(Tt.p, 0)} г</span></div><div class="lr"><span>жиры</span><span class="${c(Tt.ok.fat)}">${ru(Tt.fatPct, 0)} %</span></div>
      <div class="lr"><span>вит. C</span><span class="${c(Tt.ok.vc)}">${Math.round(Tt.vc)} мг</span></div><div class="lr"><span>вит. A</span><span class="${c(Tt.ok.va)}">${Math.round(Tt.va)} мкг</span></div>`;
  } else {
    const U = m.U, ok = U.urine >= 1.2 && U.urine <= 1.8 && !U.flood;
    el.innerHTML = `<div class="k">Моча за сутки</div><div class="v ${S.done.excr ? 'ok' : U.flood || (U.raw !== undefined && U.raw < 0.5) ? 'bad' : ''}">${U.primary ? ru(U.urine) + ' л' : '—'}</div>
      <div class="gauge"><b style="width:${clamp(U.urine / 3 * 100, 0, 100).toFixed(1)}%;background:${ok ? 'var(--ok)' : 'var(--arm)'}"></b></div>
      <div class="lr"><span>первичная</span><span>${U.primary ? U.primary + ' л' : '—'}</span></div><div class="lr"><span>питьё</span><span>${ru(S.drink, 2)} л</span></div><div class="lr"><span>погода</span><span>${S.hot ? 'жара' : 'обычная'}</span></div>`;
  }
}

function update(lite) {
  const m = model(), L = LESSONS[S.lesson];
  let fresh = false;
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip(); fresh = true;
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m, lite && !fresh);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  breath: '<path d="M14 4V12M14 12Q9 13 7 17M14 12Q19 13 21 17" stroke="#9fb0c8" stroke-width="1.4" fill="none"/><path d="M12 9Q4 9 4 20Q4 26 9 26Q12 26 12 22Z" fill="#ff9db0" opacity=".7"/><path d="M16 9Q24 9 24 20Q24 26 19 26Q16 26 16 22Z" fill="#ff9db0" opacity=".7"/><path d="M32 18Q36 10 40 18T48 18Q52 4 56 18T64 18" stroke="#72d4e8" stroke-width="1.6" fill="none"/>',
  digest: '<ellipse cx="12" cy="6" rx="6" ry="3" fill="#e07c88"/><path d="M12 9Q14 14 22 14" stroke="#e4a39a" stroke-width="2" fill="none"/><path d="M22 10Q32 8 32 16Q30 22 22 20Z" fill="#efa49a"/><path d="M20 22H44V27H20Z" fill="#c89272"/><circle cx="52" cy="12" r="5" fill="#72d4e8"/><circle cx="60" cy="20" r="4" fill="#ffb547"/>',
  food: '<ellipse cx="22" cy="20" rx="16" ry="6" fill="#e8ecf4" opacity=".85"/><rect x="12" y="12" width="9" height="7" rx="2" fill="#d9b680"/><path d="M22 18L28 8" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="15" r="4" fill="#ffa040"/><rect x="44" y="6" width="5" height="18" fill="#ff8a73"/><rect x="51" y="11" width="5" height="13" fill="#ffb547"/><rect x="58" y="4" width="5" height="20" fill="#72d4e8"/>',
  excr: '<circle cx="12" cy="10" r="6" fill="none" stroke="#e9d84f" stroke-width="1.4"/><path d="M8 10q2-3 4 0t4 0" stroke="#ff6b6b" stroke-width="1.4" fill="none"/><path d="M18 10H28V24H36V8H46V26" stroke="#e9d84f" stroke-width="2" fill="none"/><circle cx="56" cy="14" r="3" fill="#5fb4d9"/><circle cx="60" cy="22" r="3" fill="#ffb547"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'breath') {
    now = `Модель грудной клетки взрослого с лёгкими, рёбрами и диафрагмой, рядом спирограмма. Объём лёгких сейчас ${ru(m.V, 2)} л (после спокойного выдоха в лёгких ${ru(FRC)} л, остаточный объём ${ru(RV)} л). ${muscText(S.u)} ` +
      (Math.abs(S.flow) > 0.06 ? (S.flow > 0 ? 'Идёт вдох, давление в лёгких ниже атмосферного. ' : 'Идёт выдох, давление в лёгких выше атмосферного. ') : 'Воздух не движется. ') +
      (S.auto ? 'Включено спокойное дыхание. ' : '') +
      (S.vcDone ? `ЖЁЛ измерена: ${ru(S.vc, 2)} л.` : S.peak ? 'Ученик сделал максимальный вдох, но ещё не сделал максимальный выдох.' : 'Максимального вдоха ещё не было.');
    guide = 'Не выполняй задание за ученика. Спрашивай, какие мышцы работают на вдохе, почему воздух входит, когда объём растёт, и как из спирограммы найти ЖЁЛ.';
  }
  if (id === 'digest') {
    now = `Схема пищеварительной системы. Соки и куда их положил ученик: ${JUICE.map((j, c) => `${j.name} — ${S.jb[c] < 0 ? 'не положен' : SPOTS[S.jb[c]].name}`).join('; ')}. ` +
      (m.placed === 5 ? `Все соки разложены, верно ${m.right} из 5. ` : `Разложено ${m.placed} из 5. `) +
      `Обед: ${S.pos < 0 ? 'ещё на тарелке' : ROUTE_NAME[ROUTE[S.pos]]}. ` + (S.log.length ? `Что случилось по пути: ${S.log.map(e => ROUTE_NAME[e.loc] + ' — ' + e.notes.join(', ')).join('; ')}. ` : '') +
      `Всосалось: углеводы ${Math.round(S.meal.starch.abs * 100)} %, белки ${Math.round(S.meal.prot.abs * 100)} %, жиры ${Math.round(S.meal.fat.abs * 100)} %.`;
    guide = 'Не говори, куда класть каждый сок. Подводи вопросами: где кислая среда, какой фермент что расщепляет, куда открываются протоки печени и поджелудочной железы.';
  }
  if (id === 'food') {
    const Tt = m.T, used = FOODS.map((x, i) => S.cnt[i] ? `${x.n} ×${S.cnt[i]}` : '').filter(Boolean);
    now = `Конструктор меню на день для подростка 14–15 лет. В меню: ${used.length ? used.join(', ') : 'пока ничего'}. Итого: ${Math.round(Tt.kcal)} ккал (нужно 2400–3000), белки ${ru(Tt.p, 0)} г (нужно от 75), жиры ${ru(Tt.fatPct, 0)} % энергии (нужно не больше 35), витамин C ${Math.round(Tt.vc)} мг (нужно от 70), витамин A ${Math.round(Tt.va)} мкг (нужно от 700). Выполнено условий: ${m.right} из 5.`;
    guide = 'Не составляй меню за ученика. Спрашивай, какого вещества не хватает и в каких продуктах оно есть, обсуждай, почему чипсы и газировка мешают уложиться в нормы.';
  }
  if (id === 'excr') {
    now = `Модель нефрона и таблица 6 веществ. Ответы ученика: ${SUB.map((s, i) => `${s.name} — в капсулу: ${S.fi[i] === null ? 'не выбрано' : S.fi[i] ? 'да' : 'нет'}${S.fi[i] ? ', из канальца: ' + (S.re[i] === null ? 'не выбрано' : S.re[i] === 'blood' ? 'в кровь' : 'в мочу') : ''}`).join('; ')}. ` +
      (m.set === 6 ? `Все вещества настроены, верно ${m.right} из 6. ` : `Настроено ${m.set} из 6. `) +
      `Погода: ${S.hot ? 'жара +40 °C' : 'обычная'}. Выпито ${ru(S.drink, 2)} л в день. Вторичная моча: ${m.U.primary ? ru(m.urine) + ' л в сутки' : 'не образуется'}. ${exVerdict(m)}`;
    guide = 'Не называй правильные ответы по веществам. Спрашивай про размер частиц и пользу вещества для организма; для водного баланса предложи посчитать приход и расход воды.';
  }
  return [
    `Раздел: биология, 9 класс, тема «Дыхание и питание». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    breath: 'Почему воздух входит в лёгкие, если в них нет мышц?', digest: 'Зачем нужна желчь, если в ней нет ферментов?',
    food: 'Почему витамин C легко потерять при варке?', excr: 'Почему первичной мочи так много, а вторичной мало?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
