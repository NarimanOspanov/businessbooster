<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 10 класс: скорость реакции и её факторы, катализаторы и энергия активации, химическое равновесие и принцип Ле Шателье.">
<title>Скорость и равновесие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Химия · Скорость и равновесие</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Кинетика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Реактор с частицами, колба с пероксидом водорода, ампула и шприц с оксидами азота. Шкалы, карточки и поршень можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-kinetics';
const fx = (v, d) => v.toFixed(d).replace('.', ',');
const SUPD = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = n => String(n).replace(/[-\d]/g, c => SUPD[c]);
function sci(v) {
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 100) return fx(v, 0);
  if (a >= 1) return fx(v, 2);
  if (a >= 0.01) return fx(v, 3);
  const e = Math.floor(Math.log10(a)), m = v / Math.pow(10, e);
  return `${fx(m, 1)}·10${sup(e)}`;
}
const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const R = 8.314;

// ---------- lesson 1: A + B → AB, v = k·c(A)·c(B), Van 't Hoff γ = 2 ----------
const K20 = 0.5, GAMMA = 2, V0 = K20 * 0.2 * 0.2;
const kOf = T => K20 * Math.pow(GAMMA, (T - 20) / 10);
function avgRate(a, b, T, t) { const k = kOf(T), h = 0.001; let x = a, y = b; for (let i = 0; i < t / h; i++) { const v = k * x * y; x -= v * h; y -= v * h; } return { a1: x, v: (a - x) / t }; }

// ---------- lesson 2: decomposition of H2O2 with additives ----------
const EA0 = 75, DH = -98;
const ADD = [
  { id: 'mno2', name: 'MnO₂', sub: 'чёрный порошок', cat: true, Ea: 58, col: '#2e2f36', what: 'оксид марганца(IV) — неорганический катализатор' },
  { id: 'raw', name: 'Картофель', sub: 'сырой ломтик', cat: true, Ea: 23, col: '#eadfae', what: 'в клетках картофеля есть фермент каталаза — биокатализатор' },
  { id: 'sand', name: 'Песок', sub: 'SiO₂, промытый', cat: false, Ea: EA0, col: '#d8b97a', what: 'песок с пероксидом не взаимодействует и путь реакции не меняет' },
  { id: 'boiled', name: 'Картофель', sub: 'варёный ломтик', cat: false, Ea: EA0, col: '#c9a86a', what: 'при варке белок-фермент каталаза разрушился (денатурировал)' },
];
const speedup = Ea => Math.exp((EA0 - Ea) * 1000 / (R * 293));

// ---------- lessons 3–4: N2O4 ⇌ 2NO2 ----------
const K25 = 4.6e-3, DH2 = 57.2;
const KofT = T => K25 * Math.exp(-DH2 * 1000 / R * (1 / (T + 273.15) - 1 / 298.15));
const KF = 0.05, KB = KF / K25;
function traj(start) {
  let a = start === 'A' ? 0.05 : 0, b = start === 'A' ? 0 : 0.1;
  const pts = [], h = 0.0005;
  for (let i = 0; i <= 1200; i++) {
    pts.push({ a, b, vf: KF * a, vb: KB * b * b });
    for (let j = 0; j < 20; j++) { const v = KF * a - KB * b * b; a -= v * h; b += 2 * v * h; }
  }
  return pts;
}

scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6 && drag.id !== 'mark' && !drag.id.startsWith('bath-')) drag.moved = true;
  drag.p = toSvg(e);
  if (drag.moved && live(drag.id)) { liveMove(drag.id, drag.p); return; }
  if (drag.moved) dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.moved) drop(d.id, d.p); else tap(d.id, d.p);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id, p) {
  if (id.startsWith('g-') || id === 'plot') return liveMove(id, p);
  if (id === 'piston') return;
  if (id.startsWith('card-')) return testAdd(+id.slice(5));
  if (id === 'mark') return markEq();
  if (id.startsWith('bath-')) return setTemp(TEMPS[+id.slice(5)]);
}
function drop(id, p) {
  if (id.startsWith('card-')) {
    const i = +id.slice(5);
    if (inFlaskZone(p)) return testAdd(i);
    const b = basketAt(p); if (b) return sortAdd(i, b);
  }
}

// lesson 1 actions
function setGauge(k, v) {
  if (k === 't') { v = clamp(Math.round(v / 10) * 10, 0, 80); if (v === S.T) return; S.T = v; }
  else { v = clamp(v, 1, 8); const key = k === 'a' ? 'cA' : 'cB'; if (v === S[key]) return; S[key] = v; syncParticles(); }
  update();
}
function resetRate() { S.cA = 2; S.cB = 2; S.T = 20; syncParticles(); update(); }

// lesson 2 actions
function testAdd(i) {
  const a = ADD[i];
  if (S.inFlask === i) { toast(`${a.name} (${a.sub}) уже в колбе.`); return true; }
  S.inFlask = i; S.tested[a.id] = true; BUB = []; acc2 = 0;
  toast(a.cat ? `${a.name}: бурно выделяется кислород. Энергия активации снизилась.` : `${a.name} (${a.sub}): пузырьков почти нет, как без добавки.`);
  renderTools(); update(); return true;
}
function sortAdd(i, k) {
  const a = ADD[i];
  if (!S.tested[a.id]) { toast('Сначала проверьте эту добавку в колбе.'); return false; }
  if ((k === 'yes') !== a.cat) {
    S.wrong2++;
    toast(a.cat ? `Нет: с ${a.name === 'MnO₂' ? 'MnO₂' : 'сырым картофелем'} пузырьков много — реакция ускорилась.` : `Нет: ${a.what}. Пузырьков почти нет.`);
    update(); return false;
  }
  if (S.sorted[a.id] === k) return true;
  S.sorted[a.id] = k;
  toast(`Верно: ${a.what}.`);
  update(); return true;
}
function clearFlask() { S.inFlask = null; BUB = []; renderTools(); update(); }

// lesson 3 actions
function setT(t) { S.t = clamp(Math.round(t * 100) / 100, 0, TMAX); update(); }
function setStart(s) { S.start = s; S.t = 0; S.play = false; renderTools(); buildScheme(); update(); }
function togglePlay() { if (S.t >= TMAX - 0.01) S.t = 0; S.play = !S.play; renderTools(); update(); }
function markEq() {
  const m = model();
  if (S.f3[S.start]) { toast('Для этого старта равновесие уже отмечено. Попробуйте другой старт.'); return true; }
  if (!m.eq) {
    S.wrong3++;
    toast(m.p.vf > m.p.vb ? 'Ещё нет: прямая реакция идёт быстрее обратной, концентрации меняются.' : 'Ещё нет: обратная реакция идёт быстрее прямой, концентрации меняются.');
    update(); return false;
  }
  S.f3[S.start] = true;
  const other = S.start === 'A' ? 'B' : 'A';
  toast(`Равновесие: v→ ≈ v←, [NO₂] ≈ ${fx(m.p.b, 3)} моль/л.${S.f3[other] ? ' С обеих сторон пришли к одному составу!' : ' Теперь начните с другой стороны.'}`);
  update(); return true;
}

// lesson 4 actions
function settle() { S.nB = S.target; }
function perturb(kind, desc, fn) {
  settle();
  fn();
  const tgt = eqNB(S.n0, V4(), S.T4), d = tgt - S.nB;
  S.target = tgt; S.dir = Math.abs(d) < 1e-6 ? 0 : d > 0 ? 1 : -1; S.nact++;
  if (reduce) settle();
  S.last = { kind, desc, dir: S.dir };
  const word = S.dir > 0 ? 'вправо, к NO₂' : S.dir < 0 ? 'влево, к N₂O₄' : 'не смещается';
  if (S.dir > 0 && kind && !S.f4[kind]) { S.f4[kind] = true; toast(`${desc}: равновесие смещается ${word}. Способ «${FACT[kind]}» засчитан.`); }
  else toast(`${desc}: равновесие ${S.dir ? 'смещается ' : ''}${word}.`);
  update();
}
function setTemp(T) {
  if (T === S.T4) { toast(`Шприц уже в ванне ${T} °C.`); return; }
  const up = T > S.T4;
  perturb('T', up ? `Нагрели до ${T} °C — прямая реакция эндотермическая` : `Охладили до ${T} °C — обратная реакция экзотермическая`, () => { S.T4 = T; });
}
function setV(vq) {
  vq = clamp(vq, 2, 8); if (vq === S.vq) return;
  const up = vq > S.vq;
  perturb('P', up ? 'Объём больше, давление меньше — сторона с бо́льшим числом молекул газа' : 'Сжали газ, давление выросло — сторона с меньшим числом молекул', () => { S.vq = vq; });
}
function addGas(k) {
  settle();
  const nA = S.n0 - S.nB / 2;
  if (k !== 'rmB' && S.n0 + (k === 'A' ? 0.02 : 0.02) > 0.12 + 1e-9) { toast('Шприц и так полон. Уберите часть NO₂ или сбросьте опыт.'); return; }
  if (k === 'rmB' && S.nB < 0.002) { toast('NO₂ почти не осталось — убирать нечего.'); return; }
  if (k === 'A') perturb('C', 'Добавили N₂O₄ — он начинает расходоваться', () => { S.n0 += 0.02; });
  if (k === 'B') perturb('C', 'Добавили NO₂ — он начинает расходоваться', () => { S.n0 += 0.02; S.nB += 0.04; });
  if (k === 'rmB') perturb('C', 'Убрали половину NO₂ — его начинает образовываться больше', () => { const r = S.nB / 2; S.nB -= r; S.n0 = nA + S.nB / 2; });
}
function addCatalyst() { perturb(null, 'Катализатор ускоряет и прямую, и обратную реакцию одинаково', () => {}); }
function resetLC() { S.T4 = 25; S.vq = 4; S.n0 = 0.05; S.nB = eqNB(S.n0, 1, 25); S.target = S.nB; S.dir = 0; S.last = null; update(); }

// ---------- animation loop ----------
let lastT = 0, lastUi = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
  const id = LID();
  let anim = false;
  if (id === 'rate' && !reduce) { stepParticles(dt); anim = true; }
  if (id === 'catalyst' && !reduce) { stepBubbles(dt); anim = true; }
  if (id === 'equilibrium') {
    if (S.play) { S.t = Math.min(TMAX, S.t + dt * 1.5); if (S.t >= TMAX) { S.play = false; renderTools(); } if (t - lastUi > 120) { lastUi = t; update(); } }
    if (!reduce) anim = true;
  }
  if (id === 'lechatelier') {
    if (Math.abs(S.target - S.nB) > 1e-7) { S.nB += (S.target - S.nB) * Math.min(1, dt * 2.2); if (Math.abs(S.target - S.nB) < 2e-6) settle(); if (t - lastUi > 120 || Math.abs(S.target - S.nB) < 1e-7) { lastUi = t; update(); } }
    if (!reduce) anim = true;
  }
  if (dirty || anim || S.hl) { drawScene(t); dirty = false; }
}

    catalyst: ADD.map((a, i) => B('ad-' + i, a.id === 'raw' ? 'Сырой' : a.id === 'boiled' ? 'Варёный' : a.name, S.inFlask === i)).join('') + sep + B('clr', 'Очистить'),
    equilibrium: B('sA', 'Старт N₂O₄', S.start === 'A') + B('sB', 'Старт NO₂', S.start === 'B') + sep + B('play', S.play ? 'Пауза' : 'Пуск') + B('mk', 'Равновесие!'),
    lechatelier: B('addA', '+N₂O₄') + B('addB', '+NO₂') + B('rmB', '−NO₂') + sep + B('cat', 'Катализатор') + B('rs', 'Сброс'),
  }[id];
}
function act(a) {
  if (/^[abt][+-]$/.test(a)) { const k = a[0], d = a[1] === '+' ? 1 : -1; return setGauge(k, k === 't' ? S.T + 10 * d : (k === 'a' ? S.cA : S.cB) + d); }
  if (a === 'r0') return resetRate();
  if (a.startsWith('ad-')) return testAdd(+a.slice(3));
  if (a === 'clr') return clearFlask();
  if (a === 'sA' || a === 'sB') return setStart(a[1]);
  if (a === 'play') return togglePlay();
  if (a === 'mk') return markEq();
  if (a === 'addA') return addGas('A');
  if (a === 'addB') return addGas('B');
  if (a === 'rmB') return addGas('rmB');
  if (a === 'cat') return addCatalyst();
  if (a === 'rs') return resetLC();
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

function taskState(m) {
  const L = LESSONS[S.lesson];

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const val = (s, v) => { const x = el.querySelector(s); if (x && +x.value !== v) x.value = v; };
  if (m.kind === 'rate') {
    set('#r1', sci(m.v)); set('#r2', '×' + fx(m.ratio, 2)); set('#r3', sci(m.k));
    set('#aO', fx(m.a, 1)); set('#bO', fx(m.b, 1)); set('#tO', S.T + ' °C'); val('#aR', S.cA); val('#bR', S.cB); val('#tR', S.T);
  } else if (m.kind === 'cat') {
    set('#r1', m.ad ? m.ad.name : 'нет'); set('#r2', String(m.Ea)); set('#r3', m.up > 1.5 ? '×' + sci(m.up) : 'нет');
    el.querySelectorAll('#adChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === S.inFlask));
    el.querySelectorAll('select[data-i]').forEach(s => { s.value = S.sorted[ADD[+s.dataset.i].id] || ''; });
  } else if (m.kind === 'eq') {
    set('#r1', fx(m.t, 2) + ' с'); set('#r2', sci(m.p.vf)); set('#r3', sci(m.p.vb)); set('#ttO', fx(m.t, 2)); val('#ttR', m.t);
    el.querySelectorAll('#sChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === S.start));
  } else {
    set('#r1', sci(m.K)); set('#r2', sci(m.Q)); set('#r3', m.settled ? 'нет' : S.dir > 0 ? 'вправо' : 'влево'); set('#vO', fx(m.V, 2)); val('#vR', S.vq);
    el.querySelectorAll('#tChips button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.t === S.T4));
  }
}

      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {
  if (m.kind === 'rate') {
    const n = (m.T - 20) / 10, av = avgRate(m.a, m.b, m.T, 5);
    let h = `<h2>Скорость A + B → AB</h2><div class="formula">v = k · c(A) · c(B)</div><h3>Константа скорости</h3><div class="steps">` +
      step('k при 20 °C', '0,5 л/(моль·с)') + step('правило Вант-Гоффа', 'k = k₂₀ · γ^((T − 20)/10)') +
      step(`γ^((${m.T} − 20)/10)`, `2${sup(n)} = ${fx(Math.pow(2, n), n < 0 ? 3 : 0)}`) + step('k', `0,5 · ${fx(Math.pow(2, n), n < 0 ? 3 : 0)} = ${sci(m.k)}`, 'sum') + `</div>`;
    h += `<h3>Начальная скорость</h3><div class="steps">` + step('v', `${sci(m.k)} · ${fx(m.a, 1)} · ${fx(m.b, 1)} = ${sci(m.v)}`) +
      step('v₀ (исходные условия)', '0,5 · 0,2 · 0,2 = 0,020') + step('v / v₀', `${fx(m.ratio, 3)}`, 'sum') + `</div>`;
    h += `<h3>Средняя скорость за 5 с</h3><div class="steps">` + step('c(A) в начале', fx(m.a, 3) + ' моль/л') + step('c(A) через 5 с', fx(av.a1, 3) + ' моль/л') +
      step('v = Δc / Δt', `(${fx(m.a, 3)} − ${fx(av.a1, 3)}) / 5 = ${sci(av.v)}`, 'sum') + `</div><p class="note" style="margin-top:10px">Средняя скорость меньше начальной: реагенты расходуются, и столкновений становится меньше.</p>`;
    h += `<h3>Задание</h3><div class="steps">${step('×4 концентрациями', m.f1.c ? 'да ✓' : 'ещё нет')}${step('×4 температурой', m.f1.T ? 'да ✓' : 'ещё нет')}</div>`;
    return h;
  }
  if (m.kind === 'cat') {
    const RT = R * 293;
    let h = `<h2>2H₂O₂ → 2H₂O + O₂↑</h2><div class="formula">ΔH = −98 кДж/моль H₂O₂</div><h3>Энергия активации</h3><div class="steps">` +
      step('без катализатора', `${EA0} кДж/моль`) + ADD.filter(a => S.tested[a.id]).map(a => step(`${a.name} (${a.sub.split(',')[0]})`, `${a.Ea} кДж/моль`)).join('') + `</div>`;
    if (m.ad) {
      h += `<h3>Во сколько раз быстрее при 20 °C</h3><div class="formula">k₂ / k₁ = e^(ΔEₐ / RT)</div><div class="steps">` +
        step('ΔEₐ', `${EA0} − ${m.Ea} = ${EA0 - m.Ea} кДж/моль`) + step('RT', `8,314 · 293 = ${fx(RT / 1000, 2)} кДж/моль`) +
        step('ΔEₐ / RT', fx((EA0 - m.Ea) * 1000 / RT, 2)) + step('ускорение', m.up > 1.5 ? `≈ ${sci(m.up)} раз` : 'нет', 'sum') + `</div>` +
        `<p class="note" style="margin-top:10px">Это оценка по уравнению Аррениуса (оно изучается подробнее в вузе): снижение барьера всего на 17 кДж ускоряет реакцию примерно в тысячу раз.</p>`;
    } else h += `<p class="note">Добавьте вещество в колбу — здесь появится расчёт ускорения.</p>`;
    h += `<h3>Что не меняет катализатор</h3><div class="steps">${step('тепловой эффект ΔH', 'тот же')}${step('масса катализатора', 'та же, он не расходуется')}${step('продукты реакции', 'те же')}</div>`;
    h += `<h3>Сортировка</h3><div class="steps">${ADD.map(a => step(`${a.name}, ${a.sub.split(',')[0]}`, S.sorted[a.id] ? (S.sorted[a.id] === 'yes' ? 'катализатор ✓' : 'не ускоряет ✓') : S.tested[a.id] ? 'проверено' : '?')).join('')}</div>`;
    return h;
  }
  if (m.kind === 'eq') {
    const p = m.p;
    let h = `<h2>N₂O₄ ⇌ 2NO₂, t = ${fx(m.t, 2)} с</h2><div class="formula">v→ = k₁[N₂O₄] · v← = k₂[NO₂]²</div><h3>Сейчас</h3><div class="steps">` +
      step('[N₂O₄]', fx(p.a, 4) + ' моль/л') + step('[NO₂]', fx(p.b, 4) + ' моль/л') +
      step('v→ = 0,05 · [N₂O₄]', sci(p.vf)) + step(`v← = ${fx(KB, 1)} · [NO₂]²`, sci(p.vb)) +
      step('разница скоростей', p.vf + p.vb > 0 ? `${fx(Math.abs(p.vf - p.vb) / Math.max(p.vf, p.vb) * 100, 1)}%` : '—', 'sum') + `</div>`;
    h += `<h3>Отношение концентраций</h3><div class="formula">Q = [NO₂]² / [N₂O₄]</div><div class="steps">` +
      step('Q', isFinite(m.Q) ? sci(m.Q) : '∞ (N₂O₄ ещё нет)') + step('Kc при 25 °C', sci(K25)) + step('вывод', m.eq ? 'Q ≈ Kc, равновесие' : isFinite(m.Q) && m.Q < K25 ? 'Q < Kc, идёт прямая' : 'Q > Kc, идёт обратная', 'sum') + `</div>`;
    h += `<h3>Задание</h3><div class="steps">${step('старт с N₂O₄', m.f3.A ? 'равновесие ✓' : 'ещё нет')}${step('старт с NO₂', m.f3.B ? 'равновесие ✓' : 'ещё нет')}</div>`;
    return h;
  }
  const L = S.last;
  let h = `<h2>N₂O₄ ⇌ 2NO₂ при ${m.T} °C</h2><div class="formula">Kc = [NO₂]² / [N₂O₄]</div><h3>Сейчас</h3><div class="steps">` +
    step('V', fx(m.V, 2) + ' л') + step('n(N₂O₄) / n(NO₂)', `${fx(m.nA, 4)} / ${fx(m.nB, 4)} моль`) +
    step('[N₂O₄] = n / V', fx(m.cA, 4)) + step('[NO₂] = n / V', fx(m.cB, 4)) +
    step('Q = [NO₂]² / [N₂O₄]', sci(m.Q)) + step(`Kc при ${m.T} °C`, sci(m.K)) +
    step('сравнение', m.settled ? 'Q = Kc, равновесие' : m.Q < m.K ? 'Q < Kc → идёт прямая, вправо' : 'Q > Kc → идёт обратная, влево', 'sum') + `</div>`;
  h += `<h3>Последнее воздействие</h3>` + (L ? `<div class="steps">${step('что сделали', L.desc)}${step('ответ системы', L.dir > 0 ? 'смещение вправо' : L.dir < 0 ? 'смещение влево' : 'без смещения')}</div>` : `<p class="note">Пока ничего не меняли.</p>`);
  h += `<h3>Kc и температура</h3><div class="steps">${TEMPS.map(T => step(`${T} °C`, sci(KofT(T)))).join('')}</div><p class="note" style="margin-top:10px">Прямая реакция эндотермическая, поэтому при нагревании Kc растёт.</p>`;
  h += `<h3>Задание</h3><div class="steps">${['T', 'P', 'C'].map(k => step('вправо ' + FACT[k], m.f4[k] ? 'да ✓' : 'ещё нет')).join('')}</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'rate') {
    const hit = Math.abs(m.ratio - 4) < 1e-9;
    el.innerHTML = `<div class="k">Скорость</div><div class="v ${hit ? 'ok' : ''}">×${fx(m.ratio, 2)}</div><div class="lr"><span>v</span><span>${sci(m.v)}</span></div><div class="lr"><span>k</span><span>${sci(m.k)}</span></div><div class="gauge"><b style="width:${(Math.log2(m.ratio * 16 + 1e-9) / Math.log2(16 * 256) * 100).toFixed(1)}%"></b><i style="left:${(Math.log2(64) / Math.log2(4096) * 100).toFixed(1)}%"></i></div>`;
  } else if (m.kind === 'cat') {
    el.innerHTML = `<div class="k">Колба</div><div class="v ${m.ad && m.ad.cat ? 'ok' : ''}">${m.ad ? m.ad.name : 'H₂O₂'}</div><div class="lr"><span>Eₐ</span><span>${m.Ea} кДж</span></div><div class="lr"><span>быстрее</span><span>${m.up > 1.5 ? '×' + sci(m.up) : '—'}</span></div><div class="lr"><span>масса доб.</span><span>${m.ad ? '1,0→1,0 г' : '—'}</span></div>`;
  } else if (m.kind === 'eq') {
    el.innerHTML = `<div class="k">Скорости</div><div class="v ${m.eq ? 'ok' : ''}">${m.eq ? 'v→ ≈ v←' : m.p.vf > m.p.vb ? 'v→ > v←' : 'v→ < v←'}</div><div class="lr"><span>v→</span><span>${sci(m.p.vf)}</span></div><div class="lr"><span>v←</span><span>${sci(m.p.vb)}</span></div><div class="swatch" style="background:rgba(160,85,40,${brown(m.p.b).toFixed(3)})"></div>`;
  } else {
    el.innerHTML = `<div class="k">Равновесие</div><div class="v ${m.settled ? 'ok' : ''}">${m.settled ? 'Q = Kc' : m.Q < m.K ? 'Q < Kc' : 'Q > Kc'}</div><div class="lr"><span>Kc</span><span>${sci(m.K)}</span></div><div class="lr"><span>[NO₂]</span><span>${sci(m.cB)}</span></div><div class="swatch" style="background:rgba(160,85,40,${brown(m.cB).toFixed(3)})"></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (m.kind === 'rate' && Math.abs(m.ratio - 4) < 1e-9) {
    if (S.T === 20 && !S.f1.c) { S.f1.c = true; toast(`Верно: c(A)·c(B) = ${fx(m.a * m.b, 2)}, это в 4 раза больше 0,04.`); }
    if (S.T === 40 && S.cA === 2 && S.cB === 2 && !S.f1.T) { S.f1.T = true; toast('Верно: +20 °C — это дважды по 10 °C, скорость ×2×2 = ×4.'); }
  }
  if (!S.done[L.id] && L.check(model())) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Скорость и равновесие освоены!'), 1700);
  }
  const mm = model();
  renderMeter(mm);
  $('#taskState').textContent = taskState(mm);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(mm);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.cA = 2; S.cB = 2; S.T = 20; S.f1 = {};
  S.inFlask = null; S.tested = {}; S.sorted = {}; S.wrong2 = 0; BUB = [];
  S.start = 'A'; S.t = 0; S.play = false; S.f3 = {}; S.wrong3 = 0;
  S.T4 = 25; S.vq = 4; S.n0 = 0.05; S.f4 = {}; S.last = null; S.dir = 0; S.nact = 0;
  Object.assign(S, init);
  S.nB = eqNB(S.n0, V4(), S.T4); S.target = S.nB;
  syncParticles();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'rate') now = `Модель простой реакции A + B → AB в закрытом сосуде, частицы летают и иногда реагируют (вспышки). Закон действующих масс v = k·c(A)·c(B), k = 0,5 л/(моль·с) при 20 °C, правило Вант-Гоффа с γ = 2. Сейчас c(A) = ${fx(m.a, 1)} моль/л, c(B) = ${fx(m.b, 1)} моль/л, T = ${m.T} °C, k = ${sci(m.k)}, v = ${sci(m.v)} моль/(л·с), это ×${fx(m.ratio, 3)} от исходной скорости 0,020 (0,2 и 0,2 моль/л, 20 °C). Ускорение ×4 только концентрациями: ${m.f1.c ? 'найдено' : 'ещё нет'}; только температурой: ${m.f1.T ? 'найдено' : 'ещё нет'}. Не называй готовые значения — спроси, во сколько раз меняется произведение концентраций и сколько раз по 10 °C нужно прибавить.`;
  if (id === 'catalyst') now = `Колба с 3% H₂O₂, реакция 2H₂O₂ → 2H₂O + O₂, ΔH = −98 кДж/моль, Eₐ без катализатора ${EA0} кДж/моль. Рядом энергетическая диаграмма. В колбе: ${m.ad ? `${m.ad.name} (${m.ad.sub}), Eₐ = ${m.Ea} кДж/моль, ускорение примерно в ${sci(m.up)} раз` : 'ничего'}. Проверены: ${ADD.filter(a => S.tested[a.id]).map(a => a.name + ' ' + a.sub.split(',')[0]).join(', ') || 'ничего'}. Разложены по корзинам: ${ADD.filter(a => S.sorted[a.id]).map(a => `${a.name} ${a.sub.split(',')[0]} — ${S.sorted[a.id] === 'yes' ? 'катализатор' : 'не ускоряет'}`).join(', ') || 'ничего'}. Ошибок сортировки: ${S.wrong2}. Не говори, куда класть непроверенную добавку, — пусть ученик посмотрит на пузырьки и диаграмму; про варёный картофель наведи на мысль о ферментах-белках.`;
  if (id === 'equilibrium') now = `Запаянная ампула с N₂O₄ ⇌ 2NO₂ при 25 °C (Kc = 4,6·10⁻³ моль/л), время в модели замедлено. Старт: ${S.start === 'A' ? '0,05 моль/л N₂O₄' : '0,10 моль/л NO₂'}. Курсор на t = ${fx(m.t, 2)} с: [N₂O₄] = ${fx(m.p.a, 4)}, [NO₂] = ${fx(m.p.b, 4)} моль/л, v→ = ${sci(m.p.vf)}, v← = ${sci(m.p.vb)} моль/(л·с), ${m.eq ? 'скорости практически равны (равновесие)' : 'скорости ещё не равны'}. Равновесие отмечено: старт N₂O₄ — ${m.f3.A ? 'да' : 'нет'}, старт NO₂ — ${m.f3.B ? 'да' : 'нет'}. Ранних отметок: ${S.wrong3}. Не называй момент времени — спроси, как выглядят графики при равновесии.`;
  if (id === 'lechatelier') now = `Шприц с равновесной смесью N₂O₄ ⇌ 2NO₂ (прямая реакция эндотермическая, ΔH = +57 кДж). T = ${m.T} °C, V = ${fx(m.V, 2)} л, n(N₂O₄) = ${fx(m.nA, 4)}, n(NO₂) = ${fx(m.nB, 4)} моль, [NO₂] = ${sci(m.cB)} моль/л, Kc = ${sci(m.K)}, Q = ${sci(m.Q)}; ${m.settled ? 'равновесие установилось' : S.dir > 0 ? 'идёт смещение вправо' : 'идёт смещение влево'}. Последнее воздействие: ${S.last ? S.last.desc : 'нет'}. Смещено вправо: температурой — ${m.f4.T ? 'да' : 'нет'}, давлением — ${m.f4.P ? 'да' : 'нет'}, концентрацией — ${m.f4.C ? 'да' : 'нет'}. Не подсказывай прямо, что делать, — спроси, как система может ослабить воздействие.`;
  return [
    `Предмет: химия, 10 класс. Тема «Скорость и равновесие». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { rate: 'Почему при нагревании скорость растёт так сильно?', catalyst: 'Почему варёный картофель не ускоряет разложение?', equilibrium: 'Почему равновесие называют динамическим?', lechatelier: 'Почему при сжатии равновесие смещается влево?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
