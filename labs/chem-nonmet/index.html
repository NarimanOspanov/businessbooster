<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 9 класс: неметаллы. Галогены вытесняют друг друга, лестница степеней окисления серы, синтез аммиака, белый и красный фосфор, карбонаты и силикаты.">
<title>Неметаллы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.meter .big{font:700 30px/1 var(--font-display);margin-top:8px;letter-spacing:.02em}
.meter .big small{font:500 12px/1 var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.pairs{display:grid;gap:6px;margin-top:10px}
.pairs label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13.5px}
.pairs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px var(--font-mono)}
.pairs select:disabled{color:var(--ok);opacity:1}
.cnt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.cnt div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:13px}
.cnt b{font:500 14px var(--font-mono)}
.cnt button{width:30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font:500 15px/1 var(--font-mono)}
.vtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.vtab span{background:var(--surface-2);border-radius:8px;padding:7px 4px;text-align:center;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.vtab span b{display:block;color:var(--fg);font-size:15px}
.vtab span.on{outline:2px solid var(--ok);color:var(--fg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="var(--arm)" stroke-width="1.6" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Химия · Неметаллы</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Неметаллы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с пробирками, реактором и горелкой. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-nonmet';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const SUPD = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const ox = n => n > 0 ? '+' + n : n < 0 ? '−' + (-n) : '0';
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
const sci = v => { const e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e); return `${fmt(m, 1)}·10${String(e).replace(/[-\d]/g, c => SUPD[c])}`; };
const f1 = v => v.toFixed(1);

// ---------- lesson 1: halogens ----------
const HAL = [
  { s: 'Cl₂', k: 'Cl', w: 'хлорная вода', c: '#c9dc6e' },
  { s: 'Br₂', k: 'Br', w: 'бромная вода', c: '#e8962f' },
  { s: 'I₂', k: 'I', w: 'йодная вода', c: '#8b4a1e' },
];
const SALT = [{ s: 'KCl', k: 'Cl' }, { s: 'KBr', k: 'Br' }, { s: 'KI', k: 'I' }];
const RANK = { F: 0, Cl: 1, Br: 2, I: 3 };
const HNAME = { Cl: 'хлор', Br: 'бром', I: 'йод', F: 'фтор' };
const reacts = (r, c) => RANK[HAL[r].k] < RANK[SALT[c].k];
const EQH = { '0-1': 'Cl₂ + 2KBr → 2KCl + Br₂', '0-2': 'Cl₂ + 2KI → 2KCl + I₂', '1-2': 'Br₂ + 2KI → 2KBr + I₂' };
const TOK = [
  { k: 'F', s: 'F₂', c: '#efe6a0', st: 'светло-жёлтый газ' }, { k: 'Cl', s: 'Cl₂', c: '#b9d65a', st: 'жёлто-зелёный газ' },
  { k: 'Br', s: 'Br₂', c: '#c0502a', st: 'красно-бурая жидкость' }, { k: 'I', s: 'I₂', c: '#7a55b0', st: 'тёмно-фиолетовые кристаллы' },
];
const ORDER = ['F', 'Cl', 'Br', 'I'];

// ---------- lesson 2: sulfur ----------
const CARDS = [
  { f: 'H2S', v: -2, name: 'сероводород', p: [['H', 2, 1]] },
  { f: 'ZnS', v: -2, name: 'сульфид цинка', p: [['Zn', 1, 2]] },
  { f: 'S', v: 0, name: 'сера', p: [] },
  { f: 'SO2', v: 4, name: 'сернистый газ', p: [['O', 2, -2]] },
  { f: 'Na2SO3', v: 4, name: 'сульфит натрия', p: [['Na', 2, 1], ['O', 3, -2]] },
  { f: 'SO3', v: 6, name: 'оксид серы(VI)', p: [['O', 3, -2]] },
  { f: 'H2SO4', v: 6, name: 'серная кислота', p: [['H', 2, 1], ['O', 4, -2]] },

const DH = -92000, DS = -208, R = 8.314, EAR = 12028; // J/mol, J/(mol·K), Ea/R for the iron catalyst (K)
function haber(T, P, cat) {
  const TK = T + 273, dG = DH - TK * DS, Kp = Math.exp(-dG / (R * TK)), Pa = P * 9.869;
  const a = Math.sqrt(Kp * 27 / 256) * Pa;
  const x = ((2 * a + 1) - Math.sqrt(4 * a + 1)) / (2 * a);
  const base = Math.exp(-EAR * (1 / TK - 1 / 723)), v = cat ? base : base / 3000;
  return { TK, dG, Kp, Pa, a, x, v, base };
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = bench();
  if (id === 'halogens') h += halSVG(m);
  else if (id === 'sulfur') h += sulSVG(m);
  else if (id === 'ammonia') h += nh3SVG(m, t);
  else if (id === 'phos') h += phosSVG(m, t);
  else h += carbSVG(m, t);
  if (drag && drag.moved) h += `<g opacity=".92" pointer-events="none">${ghostSVG(drag)}</g>`;
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${f1(b[0])}" y="${f1(b[1])}" width="${f1(b[2])}" height="${f1(b[3])}" rx="10" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 500, hh / 410, 1.7);
  const vw = w / s, vh = hh / s;
  scene.setAttribute('viewBox', `${(260 - vw / 2).toFixed(1)} ${(405 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- dragging and tapping ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const live = id => id === 'therm' || id === 'mano' || id === 'burner';
const fixed = id => id.startsWith('tube-') || id.startsWith('shelf-') || id.startsWith('slot-') || id.startsWith('t5-') || id === 'oslot' || id === 'cat' || id === 'flask' || id === 'lime';
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  drag = { id: el.dataset.drag, x: e.clientX, y: e.clientY, p: toSvg(e), moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6 && !fixed(drag.id)) drag.moved = true;
  drag.p = toSvg(e);
  if (drag.moved && live(drag.id)) {
    if (drag.id === 'therm') { const v = tFromY(drag.p.y); if (v !== S.T) setT(v); }
    else if (drag.id === 'mano') { const v = pFromY(drag.p.y); if (v !== S.P) setP(v); }
    else setXb(drag.p.x);
    return;
  }
  if (drag.moved) dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.moved) drop(d.id, d.p); else tap(d.id);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  if (id.startsWith('tube-')) { const [r, c] = id.slice(5).split('-').map(Number); return mix(r, c); }
  if (id === 'oslot') return clearOrder();
  if (id.startsWith('card-')) { const i = +id.slice(5); if (S.place[i] !== undefined) return; S.sel = S.sel === i ? null : i; update(); return; }
  if (id.startsWith('shelf-')) { if (S.sel === null) { toast('Сначала выберите карточку в лотке.'); return; } place(S.sel, SHELF[+id.slice(6)].v); return; }
  if (id === 'cat') return setCat(!S.cat);
  if (id === 'burner') return setPow(S.pow ? 0 : 60);
  if (id === 'flask') return dissolve();
  if (id === 'hcl') { toast('Перетащите склянку на пробирку или просто нажмите на пробирку.'); return; }
  if (id.startsWith('t5-')) { const i = +id.slice(3); return S.acid5[i] ? passGas(i) : addAcid(i); }
  if (id === 'lime') { if (S.lime !== null) { S.lime = null; toast('Налита свежая известковая вода.'); update(); } return; }
  if (id.startsWith('lab-')) { const k = +id.slice(4); if (Object.values(S.lab5).includes(k)) return; S.sel5 = S.sel5 === k ? null : k; update(); return; }
  if (id.startsWith('slot-')) { if (S.sel5 === null) { toast('Сначала выберите этикетку внизу.'); return; } assign(+id.slice(5), S.sel5); return; }
}
function drop(id, p) {

// lesson 1 actions
function mix(r, c) {
  const k = r + '-' + c;
  S.last1 = k;
  if (S.mix.includes(k)) { update(); return; }
  S.mix.push(k);
  const g = HAL[r], s = SALT[c];
  if (reacts(r, c)) toast(`${g.s} + ${s.s}: раствор окрасился — выделился ${HNAME[s.k]} ${s.k}₂. ${HNAME[g.k][0].toUpperCase() + HNAME[g.k].slice(1)} активнее!`);
  else if (g.k === s.k) toast(`${g.s} + ${s.s}: галоген тот же, реакции нет.`);
  else toast(`${g.s} + ${s.s}: окраска — от самой галогенной воды. ${HNAME[s.k][0].toUpperCase() + HNAME[s.k].slice(1)} не вытеснен.`);
  update(); return true;
}
function addOrder(k) {
  if (S.orderOk) { toast('Ряд уже собран верно.'); return; }
  if (S.order.includes(k)) { toast('Этот галоген уже в ряду.'); return; }
  S.order.push(k);
  if (S.order.length === 4) {
    if (S.order.join() === ORDER.join()) { S.orderOk = true; toast('Верно: F₂ > Cl₂ > Br₂ > I₂. Активность падает сверху вниз по группе.'); }
    else { const o = S.order.join(' > '); S.order = []; toast(`${o} — не сходится с опытами. Кто кого вытеснил? Фтор — самый активный неметалл.`); }
  }
  update(); return true;
}
function clearOrder() { if (S.orderOk) return; S.order = []; update(); }

// lesson 2 actions
function place(i, v) {
  const c = CARDS[i];
  if (!c || S.place[i] !== undefined) return false;
  S.sel = null; S.last2 = i;
  if (c.v !== v) {
    S.wrong2++;
    const k = c.p.reduce((s, p) => s + p[1] * p[2], 0);
    toast(`${low(c.f)}: на полке ${ox(v)} сумма будет ${ox(k + v)}, а должна быть 0. Пересчитайте.`);
    update(); return false;
  }
  S.place[i] = v;
  const left = CARDS.length - Object.keys(S.place).length;
  toast(`${low(c.f)} (${c.name}): сера ${ox(v)}. ${left ? `Осталось ${left}.` : 'Все на своих полках!'}`);
  update(); return true;
}

// lesson 3 actions
function setT(v) { S.T = clamp(v, 200, 700); update(); }
function setP(v) { S.P = clamp(v, 1, 30); update(); }
function setCat(v) { S.cat = v; toast(v ? 'Вставлен железный катализатор: он ускоряет реакцию, но равновесие не сдвигает.' : 'Катализатор убран — реакция почти стоит.'); renderTools(); update(); }

// lesson 4 actions
function setXb(x) { S.xb = Math.round(clamp(x, 70, 390)); dirty = true; liveRefresh(); }
function setPow(v) { S.pow = clamp(v, 0, 100); renderTools(); update(); }
function newSamples() { Object.assign(S, { Ts: { w: 20, r: 20 }, lit: { w: 0, r: 0 }, gone: { w: false, r: false }, fair: false, oxide: 0, acid: false, firstLit: null, pow: 0 }); renderTools(); toast('Новые образцы на холодной пластине. Горелка погашена.'); update(); }
function dissolve() {
  if (S.acid) { toast('Лакмус уже красный: в колбе фосфорная кислота.'); return; }
  if (!S.oxide) { toast('Сначала сожгите фосфор: нужен дым P₂O₅.'); return; }
  S.acid = true; toast('Дым растворился: P₂O₅ + 3H₂O → 2H₃PO₄. Лакмус покраснел — это кислота.'); update(); return true;
}
function ignite(s, now) {
  S.lit[s] = now;
  if (!S.firstLit) S.firstLit = s;
  if (s === 'w') {
    if (S.firstLit === 'w' && Math.abs(S.xb - MID) <= 20) { S.fair = true; toast(`Белый вспыхнул около 40 °C, а красный рядом нагрет лишь до ${Math.round(S.Ts.r)} °C. Опыт честный: белый фосфор активнее.`); }
    else if (S.firstLit === 'w') toast('Белый загорелся, но горелка стояла ближе к нему — сравнение нечестное. Нажмите «Новые образцы» и поставьте горелку посередине.');
    else toast('Белый фосфор тоже загорелся.');
  } else {
    if (S.firstLit === 'r') toast('Красный загорелся первым: горелка прямо под ним. Для честного сравнения нужна середина — «Новые образцы».');

}
let lastTick = 0, lastLive = 0;
function tick4(now) {
  const dt = lastTick ? Math.min(0.1, (now - lastTick) / 1000) : 0; lastTick = now;
  const m = model(), k = reduce ? 1 : 1 - Math.exp(-dt / 1.2);
  for (const s of ['w', 'r']) {
    if (S.gone[s]) continue;
    S.Ts[s] += (plateT(PX[s], m) - S.Ts[s]) * k;
    if (!S.lit[s] && S.Ts[s] >= IGN[s]) ignite(s, now);
    else if (S.lit[s] && now - S.lit[s] > 3000) { S.lit[s] = 0; S.gone[s] = true; S.oxide++; update(); }
  }
  if (now - lastLive > 250) { lastLive = now; liveRefresh(); }
}

// lesson 5 actions
function addAcid(i) {
  if (S.acid5[i]) { toast('Кислота уже добавлена. Нажмите пробирку ещё раз, чтобы пропустить газ в известковую воду.'); return; }
  S.acid5[i] = true;
  const c = CONT[i];
  toast(`Пробирка ${TL[i]}: ${c === 0 ? 'шипит, выделяется газ без цвета и запаха.' : c === 1 ? 'выпал полупрозрачный студенистый осадок.' : 'никаких изменений.'}`);
  update(); return true;
}
function passGas(i) {
  if (!S.acid5[i]) { toast('Сначала капните кислоту в эту пробирку.'); return false; }
  if (CONT[i] !== 0) { toast(`Из пробирки ${TL[i]} газ не выделяется — пропускать нечего.`); return false; }
  S.lime = i; S.limeDone = true; toast('Известковая вода помутнела: выпал CaCO₃. Значит, газ — CO₂.'); update(); return true;
}
function assign(i, k) {
  S.sel5 = null;

  if (!S.acid5[i]) { toast(`Сначала проведите опыт: капните кислоту в пробирку ${TL[i]}.`); update(); return false; }
  if (CONT[i] !== k) {

    update(); return false;
  }
  if (k === 0 && !S.limeDone) { toast('Газ есть, но какой? Докажите, что это CO₂: нажмите пробирку ещё раз и пропустите газ через известковую воду.'); update(); return false; }
  S.lab5[i] = k; toast(`Пробирка ${TL[i]} — ${SUB5[k].f}, ${SUB5[k].name}.`); update(); return true;
}

function loop(t) {
  requestAnimationFrame(loop);

  if (id === 'phos') tick4(t); else lastTick = 0;

}

function act(a) {

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  const val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x && +x.value !== v) x.value = v; };
  if (m.kind === 'hal') {
    set('#r1', `${m.n} из 9`); set('#r2', `${m.found} из 3`); set('#r3', m.orderOk ? 'верно' : m.order.length ? m.order.join('>') : '—'); set('#oO', m.order.join(' > '));
    el.querySelectorAll('[data-mx]').forEach(b => b.setAttribute('aria-pressed', S.mix.includes(b.dataset.mx)));
  } else if (m.kind === 'sul') {
    set('#r1', `${m.placed} из ${CARDS.length}`); set('#r2', String(S.wrong2)); set('#r3', low(CARDS[S.last2].f));
    el.querySelectorAll('select[data-c]').forEach(s => { const v = S.place[s.dataset.c]; s.value = v === undefined ? '' : String(v); s.disabled = v !== undefined; });
  } else if (m.kind === 'nh3') {
    set('#r1', fmt(m.x * 100, 1) + ' %'); set('#r2', fmt(m.v, 2)); set('#r3', m.ok ? 'есть ✓' : 'нет'); set('#tO', m.T + ' °C'); set('#pO', m.P + ' МПа');
    val('#tR', m.T); val('#pR', m.P);
    const cb = el.querySelector('#catB'); if (cb) cb.textContent = m.cat ? 'Убрать катализатор' : 'Вставить катализатор';
  } else if (m.kind === 'phos') {
    const st = s => m.gone[s] ? 'сгорел' : m.lit[s] ? 'горит' : Math.round(m.Ts[s]) + ' °C';
    set('#r1', st('w')); set('#r2', st('r')); set('#r3', m.pow ? m.pow + ' %' : 'выкл.'); set('#xO', String(m.xb)); set('#fO', m.pow + ' %');
    val('#xR', m.xb); val('#fR', m.pow);
  } else {
    set('#r1', `${m.labeled} из 3`); set('#r2', m.limeDone ? 'доказан' : 'нет'); set('#r3', String(S.wrong5));
    el.querySelectorAll('select[data-t]').forEach(s => { const v = S.lab5[s.dataset.t]; if (v !== undefined) { s.value = String(v); s.disabled = true; } });
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}" id="ovState">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'hal') {
    let h = `<h2>Реакции вытеснения</h2><div class="formula">Hal₂ + 2KHal' → 2KHal + Hal'₂</div><p class="note">Идёт, если Hal активнее Hal'.</p>`;
    if (S.last1) {
      const [r, c] = S.last1.split('-').map(Number), g = HAL[r], s = SALT[c];
      h += `<h3>Последний опыт: ${g.s} + ${s.s}</h3><div class="steps">`;
      if (reacts(r, c)) h += step('уравнение', EQH[S.last1]) + step('окислитель', `${g.k}₂⁰ + 2e⁻ → 2${g.k}⁻`) + step('восстановитель', `2${s.k}⁻ − 2e⁻ → ${s.k}₂⁰`) + step('вывод', `${g.s} активнее ${s.k}₂`, 'sum');
      else h += step('реакция', 'не идёт') + step('вывод', g.k === s.k ? 'галоген тот же' : `${g.s} слабее ${s.k}₂`, 'sum');
      h += `</div>`;
    } else h += `<p class="note">Проведите опыт — здесь появится разбор.</p>`;
    h += `<h3>Найденные реакции</h3><div class="steps">${Object.keys(EQH).map(k => step(S.mix.includes(k) ? EQH[k] : '?', S.mix.includes(k) ? '✓' : 'ещё не найдена')).join('')}</div>`;
    h += `<h3>Строение атома</h3><div class="steps">${step('внешний слой', 'ns²np⁵ — 7 e⁻')}${step('до октета', 'не хватает 1 e⁻')}${step('радиус F → I', 'растёт')}${step('окислительная сила F → I', 'падает', 'sum')}</div>`;
    return h;
  }
  if (m.kind === 'sul') {
    const c = CARDS[S.sel !== null ? S.sel : S.last2], known = c.p.reduce((s, p) => s + p[1] * p[2], 0);
    const shown = S.place[CARDS.indexOf(c)] !== undefined;
    let h = `<h2>${low(c.f)} · ${c.name}</h2><div class="formula">Σ (атомов × с. о.) = 0</div><div class="steps">` +
      (c.p.length ? c.p.map(p => step(`${p[0]}: ${p[1]} × ${ox(p[2])}`, ox(p[1] * p[2]))).join('') + step('известные атомы', ox(known)) : step('простое вещество', 'с. о. = 0')) +
      step('сера S: x', shown ? `x = 0 − (${ox(known)}) = ${ox(c.v)} ✓` : 'x = 0 − (сумма известных) = ?', 'sum') + `</div>`;
    h += `<h3>Цепочка до серной кислоты</h3><div class="steps">${step('S⁰ → S⁺⁴', 'S + O₂ → SO₂')}${step('S⁺⁴ → S⁺⁶', '2SO₂ + O₂ ⇌ 2SO₃ (V₂O₅, 450 °C)')}${step('S⁺⁶ → кислота', 'SO₃ + H₂O → H₂SO₄')}${step('S⁻² → S⁺⁴', '2H₂S + 3O₂ → 2SO₂ + 2H₂O')}</div>`;
    h += `<h3>Полки</h3><div class="steps">${SHELF.map(z => step(`${ox(z.v)}: ${z.role}`, CARDS.filter((x, i) => x.v === z.v && S.place[i] !== undefined).map(x => low(x.f)).join(', ') || '—')).join('')}</div>`;
    return h;
  }
  if (m.kind === 'nh3') {
    let h = `<h2>Равновесие и скорость</h2><div class="formula">N₂ + 3H₂ ⇌ 2NH₃ + 92 кДж</div><h3>Выход при равновесии</h3><div class="steps">` +
      step('T', `${m.T} °C = ${m.TK} K`) +
      step('ΔG = ΔH − TΔS', `−92 + ${m.TK}·0,208 = ${fmt(m.dG / 1000, 1)} кДж`) +
      step('Kp = e^(−ΔG/RT)', sci(m.Kp) + ' атм⁻²') +
      step('P', `${m.P} МПа ≈ ${Math.round(m.Pa)} атм`) +
      step('x/(1−x)² = √(27Kp/256)·P', fmt(m.a, 3)) +
      step('доля NH₃ x', fmt(m.x * 100, 1) + ' %', 'sum') + `</div><h3>Скорость</h3><div class="steps">` +
      step('по Аррениусу, к 450 °C', `e^(−Ea/R·(1/${m.TK} − 1/723)) = ${fmt(m.base, 2)}`) +
      step('катализатор', m.cat ? 'есть: × 1' : 'нет: в 3000 раз медленнее') +
      step('скорость', fmt(m.v, 2) + (m.v >= 0.5 ? ' ✓' : ' — мало'), 'sum') + `</div><h3>Проверка цели</h3><div class="steps">` +
      step('выход ≥ 25 %', m.x >= 0.25 ? 'да ✓' : 'нет') + step('скорость ≥ 0,5', m.v >= 0.5 ? 'да ✓' : 'нет') + `</div>` +
      `<p class="note" style="margin-top:10px">Модель упрощённая: газы считаем идеальными. На заводе работают при 400–500 °C и 15–30 МПа, а непрореагировавшие N₂ и H₂ снова пускают в колонну.</p>`;
    return h;
  }
  if (m.kind === 'phos') {
    const d = s => Math.abs(PX[s] - S.xb);
    let h = `<h2>Нагрев пластины</h2><div class="formula">T = 20 + (Tпл − 20) · e^(−d/90)</div><div class="steps">` +
      step('над пламенем Tпл', `${m.Tmax} °C`) +
      ['w', 'r'].map(s => step(`${PNAME[s]}: d = ${d(s)}`, `≈ ${Math.round(plateT(PX[s], m))} °C (нужно ${IGN[s]})`)).join('') + `</div>`;
    h += `<h3>Реакции</h3><div class="steps">${step('горение', '4P + 5O₂ → 2P₂O₅')}${step('с водой', 'P₂O₅ + 3H₂O → 2H₃PO₄')}${step('лакмус', S.acid ? 'красный ✓' : 'фиолетовый')}</div>`;
    h += `<h3>Доля фосфора в P₂O₅</h3><div class="steps">${step('M(P₂O₅)', '2·31 + 5·16 = 142 г/моль')}${step('ω(P)', '62 / 142 = 43,7 %', 'sum')}</div>`;
    h += `<p class="note" style="margin-top:10px">Удобрения подписывают по содержанию P₂O₅: «P₂O₅ 46 %» значит, что в 100 кг удобрения столько фосфора, сколько в 46 кг P₂O₅.</p>`;
    return h;
  }
  let h = `<h2>Наблюдения</h2><div class="steps">` + TL.map((l, i) => {
    const a = S.acid5[i], c = CONT[i];
    return step(`пробирка ${l} + HCl`, a ? (c === 0 ? 'газ' + (S.limeDone ? ', мутит Ca(OH)₂' : '') : c === 1 ? 'студенистый осадок' : 'без изменений') : '?');
  }).join('') + `</div><h3>Уравнения подтверждённых</h3><div class="steps">`;
  const EQ5 = ['Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑', 'Na₂SiO₃ + 2HCl → 2NaCl + H₂SiO₃↓', 'NaCl + HCl → реакции нет'];
  const lab = Object.values(S.lab5);
  h += SUB5.map((s, k) => step(s.f, lab.includes(k) ? EQ5[k] : '?')).join('') + (S.limeDone ? step('проба на CO₂', 'CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O') : '') + `</div>`;
  h += `<h3>Почему так</h3><div class="steps">${step('HCl сильная', 'вытесняет слабые кислоты из солей')}${step('H₂CO₃', '→ H₂O + CO₂↑ (неустойчива)')}${step('H₂SiO₃', 'нерастворима → осадок')}</div>`;
  h += `<p class="note" style="margin-top:10px">Если долго пропускать CO₂, муть исчезнет: CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂ растворяется.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'hal') el.innerHTML = `<div class="k">Вытеснение</div><div class="v ${m.found === 3 ? 'ok' : ''}">${m.found} из 3</div><div class="lr"><span>опытов</span><span>${m.n}/9</span></div><div class="lr"><span>ряд</span><span>${m.orderOk ? 'верно' : m.order.length + '/4'}</span></div>`;
  else if (m.kind === 'sul') el.innerHTML = `<div class="k">Сера на полках</div><div class="v ${m.placed === CARDS.length ? 'ok' : ''}">${m.placed} из ${CARDS.length}</div><div class="lr"><span>выбрана</span><span>${S.sel !== null ? low(CARDS[S.sel].f) : '—'}</span></div><div class="lr"><span>ошибок</span><span>${S.wrong2}</span></div>`;
  else if (m.kind === 'nh3') el.innerHTML = `<div class="k">Выход NH₃</div><div class="v ${m.ok ? 'ok' : ''}">${fmt(m.x * 100, 1)} %</div><div class="gauge"><b style="width:${(m.x * 100).toFixed(1)}%;background:${m.x >= 0.25 ? 'var(--ok)' : 'var(--liq)'}"></b><i style="left:25%"></i></div><div class="lr"><span>скорость</span><span>${fmt(m.v, 2)}</span></div><div class="lr"><span>катализатор</span><span>${m.cat ? 'Fe' : 'нет'}</span></div>`;
  else if (m.kind === 'phos') {
    const st = s => m.gone[s] ? 'сгорел' : m.lit[s] ? 'горит' : Math.round(m.Ts[s]) + ' °C';
    el.innerHTML = `<div class="k">Температура</div><div class="lr"><span>белый</span><span>${st('w')}</span></div><div class="lr"><span>красный</span><span>${st('r')}</span></div><div class="lr"><span>пламя</span><span>${m.pow ? m.Tmax + ' °C' : 'выкл.'}</span></div><div class="lr"><span>лакмус</span><span>${m.acid ? 'красный' : 'фиолет.'}</span></div>`;
  } else el.innerHTML = `<div class="k">Определено</div><div class="v ${m.labeled === 3 ? 'ok' : ''}">${m.labeled} из 3</div><div class="lr"><span>кислота</span><span>${TL.filter((l, i) => m.acid5[i]).join(' ') || '—'}</span></div><div class="lr"><span>Ca(OH)₂</span><span>${S.lime !== null && CONT[S.lime] === 0 ? 'мутная' : 'чистая'}</span></div>`;
}

function liveRefresh() {
  const m = model(), L = LESSONS[S.lesson];
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  const ov = $('#ovState'); if (ov && S.tab === 'overview') ov.textContent = taskState(m);
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
  dirty = true;
  return L;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Неметаллы освоены!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  resetState();
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'halogens') now = `Таблица 3×3 пробирок: строки — хлорная, бромная, йодная вода; столбцы — растворы KCl, KBr, KI. Ученик провёл опыты: ${S.mix.map(k => { const [r, c] = k.split('-').map(Number); return `${HAL[r].k}₂ + K${SALT[c].k} (${reacts(r, c) ? 'реакция, цвет изменился' : 'нет реакции'})`; }).join('; ') || 'пока ни одного'}. Найдено реакций вытеснения: ${m.found} из 3. Ряд активности: ${S.orderOk ? 'собран верно F₂ > Cl₂ > Br₂ > I₂' : (S.order.join(' > ') || 'не начат')}. ${S.orderOk ? '' : 'Не называй готовый ряд — спроси, кто кого вытеснил в опытах.'}`;
  if (id === 'sulfur') now = `Лестница степеней окисления серы с полками −2, 0, +4, +6. Карточки: ${CARDS.map(c => c.f).join(', ')}. На полках правильно стоят: ${CARDS.filter((c, i) => S.place[i] !== undefined).map(c => `${c.f} (${ox(c.v)})`).join(', ') || 'ничего'}. В лотке: ${CARDS.filter((c, i) => S.place[i] === undefined).map(c => c.f).join(', ') || 'пусто'}. Ошибок: ${S.wrong2}. Не называй степени окисления карточек из лотка — подскажи, как посчитать через сумму, равную нулю.`;
  if (id === 'ammonia') now = `Колонна синтеза аммиака N₂ + 3H₂ ⇌ 2NH₃ + Q. Упрощённая модель равновесия (идеальные газы, ΔH = −92 кДж, ΔS = −208 Дж/К) и скорости (Аррениус, 1 = как при 450 °C с катализатором). Сейчас T = ${m.T} °C, P = ${m.P} МПа, катализатор ${m.cat ? 'есть' : 'нет'}. Выход NH₃ ${fmt(m.x * 100, 1)} %, скорость ${fmt(m.v, 2)}. Цель: выход ≥ 25 % и скорость ≥ 0,5 — ${m.ok ? 'достигнута' : 'не достигнута'}. Подводи к принципу Ле Шателье и компромиссу, не называй готовые числа.`;
  if (id === 'phos') now = `Медная пластина над горелкой: белый фосфор слева (x = 105), красный справа (x = 355), середина — 230. Горелка в x = ${S.xb}, пламя ${S.pow} % (над пламенем ${m.Tmax} °C). Белый: ${m.gone.w ? 'сгорел' : m.lit.w ? 'горит' : Math.round(m.Ts.w) + ' °C'}; красный: ${m.gone.r ? 'сгорел' : m.lit.r ? 'горит' : Math.round(m.Ts.r) + ' °C'}. Честное сравнение (белый загорелся первым при горелке посередине): ${m.fair ? 'да' : 'нет'}. Дым P₂O₅: ${S.oxide}. Лакмус в колбе: ${m.acid ? 'покраснел (H₃PO₄)' : 'фиолетовый'}.`;
  if (id === 'carbon') now = `Три неподписанные пробирки A, B, C с растворами Na₂CO₃, Na₂SiO₃, NaCl в неизвестном порядке, склянка HCl и стакан известковой воды. Кислота добавлена в: ${TL.filter((l, i) => S.acid5[i]).map(l => { const c = CONT[TL.indexOf(l)]; return `${l} (${c === 0 ? 'выделяется газ' : c === 1 ? 'студенистый осадок' : 'без изменений'})`; }).join(', ') || 'никуда'}. Газ через известковую воду: ${S.limeDone ? 'пропущен, вода помутнела' : 'не пропускали'}. Подписано верно: ${Object.keys(S.lab5).map(i => `${TL[i]} — ${SUB5[S.lab5[i]].f}`).join(', ') || 'ничего'}. Ошибок: ${S.wrong5}. Не называй, что в неподписанных пробирках, если ученик не провёл опыт — спроси, что он видит.`;
  return [
    `Предмет: химия, 9 класс. Тема «Неметаллы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { halogens: 'Почему фтор активнее йода?', sulfur: 'Почему сера в H₂S может быть только восстановителем?', ammonia: 'Почему аммиак не синтезируют при комнатной температуре?', phos: 'Чем белый фосфор отличается от красного?', carbon: 'Почему кремниевая кислота выпадает в осадок?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
