<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Карта школьной физики: все разделы и темы от 7 до 11 класса, от простого к сложному, с интерактивными опытами.">
<title>Карта физики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the lab shell again. A subway-style tree: one trunk of basics, five branches as rails, topics as stations ordered by grade from top to bottom; details in a side panel. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --ok:#86e0a8;
  --accent:#ffb547;
  --c-mech:#ffb547;
  --c-heat:#ff8a73;
  --c-elec:#a99cff;
  --c-opt:#72d4e8;
  --c-mod:#86e0a8;
  --c-base:#c8d1e2;
  --band:rgba(255,255,255,.018);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--c-opt);outline-offset:2px}

.wrap{max-width:1480px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}

.subjects{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.subj{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.subj:hover{border-color:var(--muted);color:var(--fg)}
.subj[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subj em{font:500 10.5px/1 var(--font-mono);font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 5px}

.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin:26px 0 18px}
.intro h2{font:500 clamp(22px,3vw,32px)/1.15 var(--font-display);margin:0 0 10px;text-wrap:balance;max-width:20ch}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
.stat b{display:block;font:500 22px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:6px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.treebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto;min-width:0}
.tree{position:relative;display:grid;grid-template-columns:70px repeat(5,minmax(186px,1fr));column-gap:12px;min-width:1080px;padding:18px 18px 22px 8px}
.tree svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.band{grid-column:1/-1;background:var(--band);border-radius:10px}
.band.alt{background:none}
.lvl{grid-column:1;align-self:start;padding:16px 0 0 10px;font:500 11px/1.3 var(--font-mono);color:var(--muted);position:relative;z-index:1}
.lvl b{display:block;font:500 20px/1 var(--font-display);color:var(--fg);margin-bottom:4px}
.trunk{grid-column:2/-1;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1;padding:4px 0 34px}
.trunk .node{width:230px}
.bh{position:relative;z-index:1;padding:0 0 6px 2px;display:flex;align-items:center;gap:8px;font:600 11.5px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase}
.bh i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px var(--surface)}
.cell{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:12px 0 12px 22px;min-width:0}

.node{position:relative;display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px 10px;cursor:pointer;transition:opacity .2s,border-color .2s,transform .2s}
.node:hover{border-color:var(--muted)}
.node .nt{display:block;font-weight:600;font-size:13.5px;line-height:1.25;text-wrap:balance}
.node .nm{display:flex;align-items:center;gap:6px;margin-top:5px;font:500 11px/1.2 var(--font-mono);color:var(--muted)}
.st{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.node.done{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface-2))}
.node.done .st,.node.part .st{background:var(--ok);border-color:var(--ok)}
.node.part{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.node.part .st{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.node.soon .nt{color:#c3cada}
.node[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px -6px var(--c)}
.tree.focus .node:not(.rel){opacity:.32}
.tree.focus .bh{opacity:.6}

.side{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-height:calc(100vh - 28px);overflow:auto}
.side h3{font:500 18px/1.3 var(--font-display);margin:6px 0 10px;text-wrap:balance}
.side h4{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.side p{margin:0 0 10px;font-size:14px;line-height:1.55}
.kicker{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--font-mono);color:var(--muted)}
.kicker i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.items li{display:flex;gap:9px;align-items:baseline;font-size:14px}
.items li:before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted);flex:none;transform:translateY(-1px)}
.items li.ok:before{background:var(--ok);border-color:var(--ok)}
.items li.ok span{color:var(--fg)}
.items li em{font:500 11px var(--font-mono);font-style:normal;color:var(--ok);margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--fg);color:var(--bg);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none}
.soonbox{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:9px}
.legend .st{width:10px;height:10px}
.legend .st.ok{background:var(--ok);border-color:var(--ok)}
.legend .st.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.plans{display:grid;gap:8px}
.plan{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.plan b{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.plan b em{font:500 10.5px var(--font-mono);font-style:normal;color:var(--muted)}
.plan span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.close{float:right;background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted)}

/* list view for phones */
.list{display:none}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lb>h3{display:flex;align-items:center;gap:9px;margin:0;padding:13px 14px;font:600 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.lb>h3 i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.lb details{border-top:1px solid var(--line)}
.lb details:first-of-type{border-top:0}
.lb summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
.lb summary::-webkit-details-marker{display:none}
.lb summary .g{font:500 11px var(--font-mono);color:var(--muted);width:44px;flex:none}
.lb summary .t{flex:1;font-weight:500;font-size:14px}
.lb .body{padding:0 14px 14px 68px}
.lb .body .cta{margin-top:10px}

@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
@media (max-width:760px){
  .treebox{display:none}
  .list{display:block}
  .side{display:none}
  .side.plansonly{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/physics/">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 32V18M20 18L11 9M20 18l9-9M20 24l-6-4M20 24l6-4" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="11" cy="9" r="2.6" fill="var(--c-opt)"/><circle cx="29" cy="9" r="2.6" fill="var(--c-mech)"/><circle cx="14" cy="20" r="2" fill="var(--c-elec)"/><circle cx="26" cy="20" r="2" fill="var(--c-heat)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Карта предметов</small></div>
    </a>
    <nav class="sections" aria-label="Разделы"><a href="/physics/" aria-current="page">Карта</a><a href="/optics/">Оптика</a><a href="/mechanics/">Механика</a></nav>
  </header>

  <div class="subjects" id="subjects" role="group" aria-label="Предметы"></div>

  <div class="intro">
    <div>
      <h2>Физика от простого к сложному</h2>
      <p>Вся школьная физика с 7 по 11 класс на одной карте. Сверху основы, ниже ветки разделов: чем ниже тема, тем она сложнее. Нажмите на тему, чтобы увидеть, что в ней и что стоит пройти до неё.</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="layout">
    <div class="treebox"><div class="tree" id="tree"></div></div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

const BRANCHES = [
  { id: 'mech', name: 'Механика', c: 'var(--c-mech)' },
  { id: 'heat', name: 'Тепловые явления', c: 'var(--c-heat)' },
  { id: 'elec', name: 'Электричество и магнетизм', c: 'var(--c-elec)' },
  { id: 'opt', name: 'Оптика', c: 'var(--c-opt)' },
  { id: 'mod', name: 'Атом и Вселенная', c: 'var(--c-mod)' },
];
const GRADES = [7, 8, 9, 10, 11];

// status: done = опыты готовы, part = часть тем готова, soon = в планах
const TOPICS = [
  { id: 'measure', b: 'base', g: 7, t: 'Измерения и единицы', items: ['Длина, время, масса', 'Цена деления прибора', 'Погрешность измерений', 'Система единиц СИ'], req: [] },
  { id: 'matter', b: 'base', g: 7, t: 'Строение вещества', items: ['Молекулы и атомы', 'Диффузия', 'Твёрдое, жидкое, газ'], req: [] },

  { id: 'motion', b: 'mech', g: 7, t: 'Механическое движение', items: ['Путь и перемещение', 'Скорость', 'График движения', 'Средняя скорость'], req: ['measure'] },
  { id: 'forces', b: 'mech', g: 7, t: 'Силы', items: ['Масса и плотность', 'Сила тяжести', 'Упругость и закон Гука', 'Трение', 'Динамометр'], req: ['motion'] },
  { id: 'pressure', b: 'mech', g: 7, t: 'Давление', items: ['Давление твёрдых тел', 'Давление в жидкости и газе', 'Атмосферное давление', 'Закон Архимеда', 'Плавание тел'], req: ['forces', 'matter'] },
  { id: 'lever', b: 'mech', g: 7, t: 'Простые механизмы', items: ['Рычаг и правило моментов', 'Динамометр и плечо силы', 'Золотое правило механики', 'Блоки', 'Наклонная плоскость', 'КПД механизма'], doneItems: 3, req: ['forces'], status: 'part', href: '/mechanics/', lessons: 5 },
  { id: 'energy', b: 'mech', g: 7, t: 'Работа и энергия', items: ['Механическая работа', 'Мощность', 'Кинетическая и потенциальная энергия', 'Сохранение энергии'], req: ['lever'] },
  { id: 'kinem', b: 'mech', g: 9, t: 'Кинематика', items: ['Равноускоренное движение', 'Свободное падение', 'Бросок под углом', 'Относительность движения'], req: ['motion'] },
  { id: 'newton', b: 'mech', g: 9, t: 'Законы Ньютона', items: ['Инерция', 'Второй закон', 'Третий закон', 'Всемирное тяготение', 'Движение по окружности'], req: ['kinem', 'forces'] },
  { id: 'momentum', b: 'mech', g: 9, t: 'Импульс', items: ['Импульс тела', 'Закон сохранения импульса', 'Реактивное движение'], req: ['newton'] },
  { id: 'waves', b: 'mech', g: 9, t: 'Колебания и волны', items: ['Маятник', 'Период и частота', 'Резонанс', 'Волны', 'Звук'], req: ['energy'] },

  { id: 'temp', b: 'heat', g: 8, t: 'Температура и теплопередача', items: ['Внутренняя энергия', 'Теплопроводность', 'Конвекция', 'Излучение'], req: ['matter'] },
  { id: 'heatq', b: 'heat', g: 8, t: 'Количество теплоты', items: ['Удельная теплоёмкость', 'Сгорание топлива', 'Тепловой баланс'], req: ['temp'] },
  { id: 'phase', b: 'heat', g: 8, t: 'Плавление и кипение', items: ['Плавление и отвердевание', 'Испарение и кипение', 'Влажность воздуха'], req: ['heatq'] },
  { id: 'engines', b: 'heat', g: 8, t: 'Тепловые двигатели', items: ['Двигатель внутреннего сгорания', 'Паровая турбина', 'КПД теплового двигателя'], req: ['phase', 'energy'] },
  { id: 'mkt', b: 'heat', g: 10, t: 'Молекулярная физика', items: ['Идеальный газ', 'Уравнение Менделеева — Клапейрона', 'Изопроцессы'], req: ['matter', 'temp'] },
  { id: 'thermo', b: 'heat', g: 10, t: 'Термодинамика', items: ['Первый закон', 'Работа газа', 'Второй закон', 'Цикл Карно'], req: ['mkt', 'engines'] },

  { id: 'charge', b: 'elec', g: 8, t: 'Электрический заряд', items: ['Электризация', 'Проводники и диэлектрики', 'Электрическое поле'], req: ['matter'] },
  { id: 'current', b: 'elec', g: 8, t: 'Электрический ток', items: ['Сила тока', 'Напряжение', 'Сопротивление', 'Закон Ома'], req: ['charge'] },
  { id: 'circuits', b: 'elec', g: 8, t: 'Электрические цепи', items: ['Последовательное соединение', 'Параллельное соединение', 'Работа и мощность тока', 'Закон Джоуля — Ленца'], req: ['current'] },
  { id: 'magnet', b: 'elec', g: 8, t: 'Магнитное поле', items: ['Постоянные магниты', 'Магнитное поле тока', 'Электромагнит', 'Электродвигатель'], req: ['current'] },
  { id: 'induction', b: 'elec', g: 9, t: 'Электромагнитная индукция', items: ['Опыты Фарадея', 'Генератор', 'Трансформатор', 'Электромагнитные волны'], req: ['magnet', 'waves'] },
  { id: 'estatic', b: 'elec', g: 10, t: 'Электростатика', items: ['Закон Кулона', 'Напряжённость и потенциал', 'Конденсаторы'], req: ['charge'] },
  { id: 'media', b: 'elec', g: 10, t: 'Ток в разных средах', items: ['Металлы', 'Полупроводники', 'Электролиты', 'Газы и вакуум'], req: ['circuits'] },
  { id: 'ac', b: 'elec', g: 11, t: 'Переменный ток', items: ['Колебательный контур', 'Переменный ток', 'Радиосвязь'], req: ['induction', 'estatic'] },

  { id: 'light', b: 'opt', g: 8, t: 'Свет и тени', items: ['Источники света', 'Прямолинейное распространение', 'Тень и полутень', 'Затмения'], req: ['measure'] },
  { id: 'reflect', b: 'opt', g: 8, t: 'Отражение света', items: ['Закон отражения', 'Плоское зеркало'], req: ['light'] },
  { id: 'refract', b: 'opt', g: 8, t: 'Преломление света', items: ['Закон преломления', 'Полное отражение'], req: ['reflect'] },
  { id: 'lens', b: 'opt', g: 8, t: 'Линзы', items: ['Как линза строит изображение', 'Фокусное расстояние', 'Увеличенное изображение', 'Лупа и мнимое изображение', 'Рассеивающая линза'], doneItems: 5, req: ['refract'], status: 'done', href: '/optics/', lessons: 5 },
  { id: 'eye', b: 'opt', g: 8, t: 'Глаз и оптические приборы', items: ['Как устроен глаз', 'Очки', 'Фотоаппарат и проектор', 'Микроскоп и телескоп'], req: ['lens'] },
  { id: 'wave', b: 'opt', g: 11, t: 'Волновая оптика', items: ['Дисперсия', 'Интерференция', 'Дифракция', 'Поляризация'], req: ['refract', 'waves'] },

  { id: 'atom', b: 'mod', g: 9, t: 'Строение атома', items: ['Опыт Резерфорда', 'Модель атома', 'Спектры'], req: ['matter', 'charge'] },
  { id: 'nucleus', b: 'mod', g: 9, t: 'Атомное ядро', items: ['Радиоактивность', 'Состав ядра', 'Ядерные реакции', 'Атомная электростанция'], req: ['atom'] },
  { id: 'relat', b: 'mod', g: 11, t: 'Теория относительности', items: ['Постулаты Эйнштейна', 'Замедление времени', 'E = mc²'], req: ['newton', 'wave'] },
  { id: 'quant', b: 'mod', g: 11, t: 'Кванты и свет', items: ['Фотоэффект', 'Фотон', 'Лазер', 'Волны и частицы'], req: ['wave', 'atom'] },
  { id: 'astro', b: 'mod', g: 11, t: 'Астрофизика', items: ['Солнечная система', 'Звёзды', 'Галактики', 'Расширение Вселенной'], req: ['nucleus', 'newton'] },
];
const T = Object.fromEntries(TOPICS.map(t => [t.id, Object.assign(t, { status: t.status || 'soon' })]));
const deps = id => TOPICS.filter(t => t.req.includes(id)).map(t => t.id);
const color = b => b === 'base' ? 'var(--c-base)' : BRANCHES.find(x => x.id === b).c;
const bname = b => b === 'base' ? 'Основы' : BRANCHES.find(x => x.id === b).name;
const STATUS = { done: 'опыты готовы', part: 'часть опытов готова', soon: 'скоро' };

const SUBJECTS = [
  { id: 'phys', name: 'Физика', live: true },
  { id: 'math', name: 'Математика', plan: 'Геометрия и графики, которые можно двигать руками: углы, площади, функции, вероятности.' },
  { id: 'chem', name: 'Химия', plan: 'Лаборатория без риска: реакции, растворы, строение молекул и таблица Менделеева в 3D.' },
  { id: 'bio', name: 'Биология', plan: 'Живые модели: клетка, органы человека, наследственность, экосистемы.' },
  { id: 'cs', name: 'Информатика', plan: 'Алгоритмы, которые видно: сортировки, графы, логические схемы, первые программы.' },
];

// ---------- stats ----------
const doneN = TOPICS.filter(t => t.status !== 'soon').length;
const lessonsN = TOPICS.reduce((a, t) => a + (t.lessons || 0), 0);
$('#stats').innerHTML = [
  [BRANCHES.length, plural(BRANCHES.length, 'раздел', 'раздела', 'разделов')],
  [TOPICS.length, plural(TOPICS.length, 'тема', 'темы', 'тем')],
  [doneN, 'уже с опытами'],
  [lessonsN, plural(lessonsN, 'урок', 'урока', 'уроков')],
].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

$('#subjects').innerHTML = SUBJECTS.map(s => `<button class="subj" data-s="${s.id}" aria-pressed="${!!s.live}">${s.name}${s.live ? '' : '<em>скоро</em>'}</button>`).join('');
$('#subjects').addEventListener('click', e => {
  const b = e.target.closest('.subj'); if (!b) return;
  const s = SUBJECTS.find(x => x.id === b.dataset.s);
  if (s.live) { select(null); return; }
  showPlan(s);
});

// ---------- tree ----------
const tree = $('#tree');
const nodeHTML = t => {
  const meta = t.status === 'soon' ? `${t.g} класс · скоро` : `${t.g} класс · ${t.lessons} ${plural(t.lessons, 'урок', 'урока', 'уроков')}`;
  return `<button class="node ${t.status}" data-id="${t.id}" style="--c:${color(t.b)}" aria-pressed="false"><span class="nt">${esc(t.t)}</span><span class="nm"><i class="st"></i>${meta}</span></button>`;
};
let html = `<div class="trunk" style="grid-row:1">${TOPICS.filter(t => t.b === 'base').map(nodeHTML).join('')}</div>`;
BRANCHES.forEach((b, i) => { html += `<div class="bh" data-b="${b.id}" style="grid-row:2;grid-column:${i + 2};--c:${b.c}"><i></i>${b.name}</div>`; });
GRADES.forEach((g, r) => {
  const row = r + 3;
  html += `<div class="band ${r % 2 ? 'alt' : ''}" style="grid-row:${row}"></div>`;
  html += `<div class="lvl" style="grid-row:${row}"><b>${g}</b>класс</div>`;
  BRANCHES.forEach((b, i) => {
    const list = TOPICS.filter(t => t.b === b.id && t.g === g);
    html += `<div class="cell" data-b="${b.id}" style="grid-row:${row};grid-column:${i + 2}">${list.map(nodeHTML).join('')}</div>`;
  });
});
tree.innerHTML = html + '<svg class="edges" id="edges" aria-hidden="true"></svg>';
const edges = $('#edges');

let selected = null;
function draw() {
  const box = tree.getBoundingClientRect();
  const W = tree.scrollWidth, H = tree.scrollHeight;
  edges.setAttribute('width', W); edges.setAttribute('height', H); edges.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const r = el => { const q = el.getBoundingClientRect(); return { l: q.left - box.left, t: q.top - box.top, r: q.right - box.left, bt: q.bottom - box.top, cx: (q.left + q.right) / 2 - box.left, cy: (q.top + q.bottom) / 2 - box.top }; };
  let s = '';
  const trunkNodes = [...tree.querySelectorAll('.trunk .node')].map(r);
  const heads = [...tree.querySelectorAll('.bh')].map(h => ({ b: h.dataset.b, ...r(h) }));
  const busY = Math.max(...trunkNodes.map(n => n.bt)) + 16;
  const railX = h => h.l + 8;
  // trunk → bus → branch heads
  trunkNodes.forEach(n => { s += `<path d="M${n.cx} ${n.bt} V${busY}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`; });
  s += `<path d="M${railX(heads[0])} ${busY} H${railX(heads[heads.length - 1])}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`;
  heads.forEach(h => { s += `<path d="M${railX(h)} ${busY} V${h.cy - 7}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`; });
  // rails with stations
  heads.forEach(h => {
    const c = BRANCHES.find(x => x.id === h.b).c, x = railX(h) + (tree.querySelector(`.cell[data-b="${h.b}"]`) ? 0 : 0);
    const nodes = [...tree.querySelectorAll(`.cell[data-b="${h.b}"] .node`)].map(n => ({ id: n.dataset.id, ...r(n) }));
    if (!nodes.length) return;
    const cellL = r(tree.querySelector(`.cell[data-b="${h.b}"]`)).l + 9;
    s += `<path d="M${cellL} ${h.cy + 7} V${nodes[nodes.length - 1].cy}" stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85"/>`;
    nodes.forEach(n => {
      const st = T[n.id].status;
      s += `<path d="M${cellL} ${n.cy} H${n.l}" stroke="${c}" stroke-width="2" opacity=".7"/>`;
      s += `<circle cx="${cellL}" cy="${n.cy}" r="${st === 'soon' ? 4 : 5.5}" fill="${st === 'soon' ? 'var(--surface)' : c}" stroke="${c}" stroke-width="2"/>`;
    });
  });
  // links of the selected topic
  if (selected) {
    const sel = tree.querySelector(`.node[data-id="${selected}"]`), S = r(sel);
    const link = (fromId, toRect, dashed, c) => {
      const el = tree.querySelector(`.node[data-id="${fromId}"]`); if (!el) return;
      const P = r(el); let d;
      if (Math.abs(P.cx - toRect.cx) < 20) { const x = Math.max(P.r, toRect.r) + 34; d = `M${P.r} ${P.cy} C${x} ${P.cy} ${x} ${toRect.cy} ${toRect.r} ${toRect.cy}`; }
      else if (toRect.cx > P.cx) d = `M${P.r} ${P.cy} C${P.r + 70} ${P.cy} ${toRect.l - 70} ${toRect.cy} ${toRect.l} ${toRect.cy}`;
      else d = `M${P.l} ${P.cy} C${P.l - 70} ${P.cy} ${toRect.r + 70} ${toRect.cy} ${toRect.r} ${toRect.cy}`;
      s += `<path d="${d}" stroke="${c}" stroke-width="2.2" fill="none" ${dashed ? 'stroke-dasharray="5 5" opacity=".7"' : ''}/>`;
    };
    T[selected].req.forEach(p => link(p, S, false, color(T[p].b)));
    deps(selected).forEach(dId => { const el = tree.querySelector(`.node[data-id="${dId}"]`); const D = r(el); const P = S;
      let d; if (Math.abs(P.cx - D.cx) < 20) { const x = Math.max(P.r, D.r) + 34; d = `M${P.r} ${P.cy} C${x} ${P.cy} ${x} ${D.cy} ${D.r} ${D.cy}`; }
      else if (D.cx > P.cx) d = `M${P.r} ${P.cy} C${P.r + 70} ${P.cy} ${D.l - 70} ${D.cy} ${D.l} ${D.cy}`;
      else d = `M${P.l} ${P.cy} C${P.l - 70} ${P.cy} ${D.r + 70} ${D.cy} ${D.r} ${D.cy}`;
      s += `<path d="${d}" stroke="${color(T[selected].b)}" stroke-width="1.8" fill="none" stroke-dasharray="5 5" opacity=".75"/>`; });
  }
  edges.innerHTML = s;
}

tree.addEventListener('click', e => { const n = e.target.closest('.node'); if (n) select(n.dataset.id === selected ? null : n.dataset.id); });

// ---------- side panel ----------
const side = $('#side');
const chip = id => `<button class="chip" data-go="${id}" style="--c:${color(T[id].b)}"><i></i>${esc(T[id].t)}</button>`;
function itemsHTML(t) {
  return `<ul class="items">${t.items.map((x, i) => { const ok = t.doneItems && i < t.doneItems; return `<li class="${ok ? 'ok' : ''}"><span>${esc(x)}</span>${ok ? '<em>готово</em>' : ''}</li>`; }).join('')}</ul>`;
}
function ctaHTML(t) {
  return t.status === 'soon'
    ? `<div class="soonbox">Опыты по этой теме скоро добавим.</div>`
    : `<a class="cta" href="${t.href}">Открыть опыты · ${t.lessons} ${plural(t.lessons, 'урок', 'урока', 'уроков')} ›</a>${t.status === 'part' ? '<div class="soonbox">Остальные темы раздела скоро добавим.</div>' : ''}`;
}
function plansHTML() {
  return `<h4>Другие предметы</h4><div class="plans">${SUBJECTS.filter(s => !s.live).map(s => `<div class="plan"><b>${s.name}<em>скоро</em></b><span>${s.plan}</span></div>`).join('')}</div>`;
}
function defaultSide() {
  side.classList.remove('plansonly');
  side.innerHTML = `<h3>Как читать карту</h3>
    <p>Сверху основы, без которых не обойтись ни в одном разделе. От них расходятся пять веток. В каждой ветке темы идут сверху вниз: от 7 класса к 11, от простого к сложному.</p>
    <p>Нажмите на тему: появятся её связи. Сплошные линии ведут от того, что нужно знать заранее, пунктир — к темам, которые она открывает.</p>
    <h4>Обозначения</h4>
    <div class="legend"><div><i class="st ok"></i>Опыты готовы, можно заниматься</div><div><i class="st half"></i>Часть опытов готова</div><div><i class="st"></i>Скоро добавим</div></div>
    <h4>Уже можно открыть</h4><div class="chips">${TOPICS.filter(t => t.status !== 'soon').map(t => chip(t.id)).join('')}</div>
    ${plansHTML()}`;
}
function topicSide(t) {
  side.classList.remove('plansonly');
  const req = t.req, nx = deps(t.id);
  side.innerHTML = `<button class="close" id="closeSide" aria-label="Закрыть">✕</button>
    <div class="kicker" style="--c:${color(t.b)}"><i></i>${bname(t.b)} · ${t.g} класс</div>
    <h3>${esc(t.t)}</h3>
    <p class="note" style="color:var(--muted)">${t.status === 'soon' ? 'В планах' : STATUS[t.status]}</p>
    <h4>Что внутри</h4>${itemsHTML(t)}
    ${req.length ? `<h4>Сначала стоит пройти</h4><div class="chips">${req.map(chip).join('')}</div>` : '<h4>С чего начать</h4><p>Это стартовая тема, знаний заранее не нужно.</p>'}
    ${nx.length ? `<h4>Дальше откроется</h4><div class="chips">${nx.map(chip).join('')}</div>` : ''}
    ${ctaHTML(t)}`;
  $('#closeSide').onclick = () => select(null);
}
function showPlan(s) {
  select(null, true);
  document.querySelectorAll('.subj').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s.id));
  side.classList.add('plansonly');
  side.innerHTML = `<button class="close" id="closeSide" aria-label="Закрыть">✕</button><div class="kicker" style="--c:var(--muted)"><i></i>Скоро</div><h3>${s.name}</h3><p>${s.plan}</p>
    <p class="note" style="color:var(--muted)">Карта и опыты появятся здесь так же, как у физики: темы от простого к сложному и интерактивные уроки.</p>${plansHTML()}`;
  $('#closeSide').onclick = () => select(null);
  if (matchMedia('(max-width:1180px)').matches) side.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
side.addEventListener('click', e => { const c = e.target.closest('[data-go]'); if (c) { select(c.dataset.go); if (matchMedia('(max-width:760px)').matches) openInList(c.dataset.go); } });

function related(id) {
  const set = new Set([id]);
  T[id].req.forEach(x => set.add(x)); deps(id).forEach(x => set.add(x));
  return set;
}
function select(id, keepSubjects) {
  selected = id;
  if (!keepSubjects) document.querySelectorAll('.subj').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === 'phys'));
  tree.classList.toggle('focus', !!id);
  const rel = id ? related(id) : new Set();
  tree.querySelectorAll('.node').forEach(n => { n.setAttribute('aria-pressed', n.dataset.id === id); n.classList.toggle('rel', rel.has(n.dataset.id)); });
  if (!keepSubjects) id ? topicSide(T[id]) : defaultSide();
  draw();
}

// ---------- list view (phones) ----------
const list = $('#list');
const groups = [{ id: 'base', name: 'Основы', c: 'var(--c-base)' }, ...BRANCHES];
list.innerHTML = groups.map(gp => `<section class="lb" style="--c:${gp.c}"><h3><i></i>${gp.name}</h3>` +
  TOPICS.filter(t => t.b === gp.id).map(t => `<details data-id="${t.id}"><summary><span class="g">${t.g} кл</span><span class="t">${esc(t.t)}</span><span class="node ${t.status}" style="all:unset;display:flex"><i class="st" style="${t.status === 'done' ? 'background:var(--ok);border-color:var(--ok)' : t.status === 'part' ? 'background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)' : ''}"></i></span></summary>
    <div class="body">${itemsHTML(t)}${t.req.length ? `<p class="note" style="margin:10px 0 0;font-size:13px;color:var(--muted)">Сначала: ${t.req.map(x => esc(T[x].t)).join(', ')}</p>` : ''}${ctaHTML(t)}</div></details>`).join('') + `</section>`).join('') +
  `<section class="lb" style="--c:var(--muted)"><h3><i></i>Другие предметы</h3><div style="padding:12px 14px">${SUBJECTS.filter(s => !s.live).map(s => `<div class="plan" style="margin-bottom:8px"><b>${s.name}<em>скоро</em></b><span>${s.plan}</span></div>`).join('')}</div></section>`;
function openInList(id) { const d = list.querySelector(`details[data-id="${id}"]`); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

defaultSide();
new ResizeObserver(() => draw()).observe(tree);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
draw();
})();
</script>
</body>
</html>
