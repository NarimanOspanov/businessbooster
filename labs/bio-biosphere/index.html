<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 11 класс: учение Вернадского о биосфере, природные зоны и высотная поясность, человек и биосфера на примере Аральского моря.">
<title>Биосфера</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="#ffd36b"/><path d="M12 4v2.5M12 17.5v2.5M4 12h2.5M17.5 12h2.5" stroke="#ffd36b" stroke-width="1.5"/><path d="M26 7a10 10 0 0 1 6 13" stroke="var(--arm)" stroke-width="1.8" fill="none"/><path d="M33 17l-1 4l-3.4-2.2" stroke="var(--arm)" stroke-width="1.6" fill="none"/><path d="M6 33Q14 25 22 29T34 27V33Z" fill="rgba(95,191,106,.4)" stroke="var(--leaf)" stroke-width="1.2"/><circle cx="27" cy="24" r="2.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Биосфера</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-biosphere';
const T = (x, y, s, size, fill, extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const fmtN = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const dec = (x, d = 1) => x.toFixed(d).replace('.', ',').replace('-', '−');
const sgn = x => (x > 0 ? '+' : '') + dec(x);
const rnd = i => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };
const HALO = 'stroke="#0b1019" stroke-width="3" paint-order="stroke"';

// ---------- lesson 1: types of matter (Vernadsky) ----------
const BINS = [
  { k: 'live', name: 'Живое', sub: 'все организмы', c: '#5fbf6a', d: 'Совокупность всех живых организмов планеты.' },
  { k: 'bio', name: 'Биогенное', sub: 'создано жизнью', c: '#c79a62', d: 'Создано живыми организмами или из их остатков: уголь, нефть, торф, известняк, мел.' },
  { k: 'bioinert', name: 'Биокосное', sub: 'жизнь + неживое', c: '#72d4e8', d: 'Создаётся организмами вместе с неживой природой: почва, ил, природные воды.' },
  { k: 'inert', name: 'Косное', sub: 'без участия жизни', c: '#9aa6bd', d: 'Образовано без участия живого: магматические породы, лава, самородные металлы.' },
];
const BI = k => BINS.findIndex(b => b.k === k);
const CARDS = [
  { n: 'Каменный уголь', k: 'bio', clue: 'Уголь не живой, но вспомните, из чего он образовался в болотах сотни миллионов лет назад.' },
  { n: 'Чернозём', k: 'bioinert', clue: 'В почве есть и минеральные частицы, и перегной, и миллиарды бактерий. Кто её создал?' },
  { n: 'Гранит', k: 'inert', clue: 'Гранит застыл из магмы глубоко в земной коре. Участвовала ли в этом жизнь?' },
  { n: 'Сайгак', k: 'live', clue: 'Сайгак дышит, питается и размножается прямо сейчас.' },
  { n: 'Нефть Тенгиза', k: 'bio', clue: 'Нефть — продукт превращения остатков древнего планктона.' },
  { n: 'Озёрный ил', k: 'bioinert', clue: 'Ил — смесь минеральных частиц и органики, которую перерабатывают бактерии.' },
  { n: 'Базальтовая лава', k: 'inert', clue: 'Лава вытекла из вулкана при температуре около 1000 °C. Могла ли её создать жизнь?' },
  { n: 'Цианобактерии', k: 'live', clue: 'Цианобактерии — живые клетки, они фотосинтезируют.' },
  { n: 'Мел', k: 'bio', clue: 'Под микроскопом мел — это миллиарды панцирей древних одноклеточных водорослей.' },
  { n: 'Речная вода', k: 'bioinert', clue: 'Состав природной воды меняют растворённые газы и вещества от организмов: это не чистая H₂O.' },
  { n: 'Ель Шренка', k: 'live', clue: 'Ель растёт и фотосинтезирует — это организм.' },
  { n: 'Самородное золото', k: 'inert', clue: 'Золото выделилось из горячих растворов в недрах, без участия организмов.' },
];

// ---------- lesson 2: zones and mountain belts ----------
const ZONES = [

function resetSea() {
  S.year = 1960; S.h = 53; S.hist = [[1960, 53]]; S.run = false; S.histMode = false; S.histUsed = false; S.sumQ = 0; S.nY = 0; S.fishToast = false;
}
function resetLesson() {
  const L = LESSONS[S.lesson];
  S.bin = {}; S.csel = -1; S.err = 0; S.flash = null;
  S.lmode = 'lat'; S.lat = L.lat !== undefined ? L.lat : 4; S.alt = L.alt || 700; S.seenZ = {}; S.seenB = {};

// ---------- models ----------
function model() {
  const id = LID();
  if (id === 'vern') {
    const per = BINS.map(b => CARDS.filter((c, i) => S.bin[i] === b.k).length);
    return { kind: 'vern', placed: Object.keys(S.bin).length, per, err: S.err };
  }
  if (id === 'zones') {
    const z = zoneAt(S.lat), b = beltAt(S.alt);
    return { kind: 'zones', z, b, kz: ZONES.filter(x => x.kz && S.seenZ[x.id]).length, belts: BELTS.filter(x => S.seenB[x.id]).length, T: TH(S.alt) };
  }
  const A = AR(S.h), Sl = SAL(S.h), w = S.histMode ? wHist(S.year) : S.w, Q = Q0 * (1 - w);
  const avgQ = S.nY ? S.sumQ / S.nY : Q0 * w;
  const goal = S.year >= 2020 && !S.histUsed && Sl < GOAL_S && avgQ >= GOAL_Q - 1e-9;
  return { kind: 'sea', A, Sl, V: VOL(S.h), w, Q, take: Q0 * w, E: EVAP / 1000 * A, avgQ, goal, ha: Q0 * w * 100 };
}

// ---------- lesson 1 actions ----------
function place(c, b) {
  if (b < 0) { S.csel = -1; dirty = true; return; }
  const card = CARDS[c], bin = BINS[b];
  if (card.k === bin.k) {
    S.bin[c] = bin.k; S.csel = -1;
    const left = CARDS.length - Object.keys(S.bin).length;
    if (left) toast(`Верно: ${card.n.toLowerCase()} — ${bin.name.toLowerCase()} вещество.`);
  } else {
    S.err++; S.csel = -1; S.flash = { b, t: performance.now() };
    toast(card.clue);
  }
  update();
}

// ---------- lesson 2 actions ----------
function setLat(v) {
  S.lat = clamp(Math.round(v * 2) / 2, 0, 90);
  const z = zoneAt(S.lat);
  if (!S.seenZ[z.id]) {
    S.seenZ[z.id] = true;
    if (z.kz) { const n = ZONES.filter(x => x.kz && S.seenZ[x.id]).length; toast(`${z.name} — есть в Казахстане! Найдено ${n} из ${KZN}.`); }
  }
  update();
}
function setAlt(v) {
  S.alt = clamp(Math.round(v / 50) * 50, H0, H1);
  const b = beltAt(S.alt);
  if (!S.seenB[b.id]) { S.seenB[b.id] = true; toast(`${b.name}: похоже на зону «${b.an}».`); }
  update();
}
function setMode(md) { S.lmode = md; renderTools(); buildScheme(); update(); }
function stepZone(d) {
  if (S.lmode === 'lat') { const i = clamp(ZONES.indexOf(zoneAt(S.lat)) + d, 0, ZONES.length - 1), z = ZONES[i]; setLat(Math.min((z.a + z.b) / 2, 88)); }
  else { const i = clamp(BELTS.indexOf(beltAt(S.alt)) + d, 0, BELTS.length - 1), b = BELTS[i]; setAlt(Math.min((b.a + b.b) / 2, 4700)); }
}

// ---------- lesson 3 actions ----------
function seaYear() {
  if (S.year >= 2020) return;
  const w = S.histMode ? wHist(S.year) : S.w, Q = Q0 * (1 - w);
  for (let k = 0; k < 4; k++) { const a = Math.max(AR(S.h), 300); S.h = clamp(S.h + (1000 * Q / a - EVAP) / 4, 21, 53.5); }
  S.year++; S.sumQ += Q0 * w; S.nY++;
  S.hist.push([S.year, S.h]);
  if (S.histMode && EVENTS[S.year]) toast(EVENTS[S.year]);
  else if (!S.fishToast && SAL(S.h) >= GOAL_S) { S.fishToast = true; toast(`${S.year} год: солёность выше ${GOAL_S} г/л — рыба гибнет.`); }
  if (S.year >= 2020) {
    S.run = false;
    const m = model();
    if (!S.histMode && !S.histUsed && !m.goal) toast(m.Sl >= GOAL_S ? `2020 год: солёность ${dec(m.Sl, 0)} г/л — море погибло. Уменьшите забор и нажмите «Сначала».` : `Море живо, но на поля шло в среднем ${dec(m.avgQ)} км³ — меньше ${GOAL_Q}. Можно забрать больше.`);
    renderTools();
  }
  update();
}
let runT = 0;
function setRun(on) {
  if (on && S.year >= 2020) { resetSea(); }
  S.run = on; lastStep = performance.now(); renderTools(); update();
}
let lastStep = 0;
function setW(v) {
  S.w = clamp(Math.round(v * 100) / 100, 0, 0.95);
  if (S.histMode) { S.histMode = false; toast('Режим истории выключен: теперь забор задаёте вы. Для проверки задания начните сначала.'); }
  renderTools(); update();
}
function startHist() { resetSea(); S.histMode = true; S.histUsed = true; S.run = true; lastStep = performance.now(); toast('История: забор воды растёт с 10% в 1960 году до 90% к 1985 году.'); renderTools(); buildScheme(); update(); }

function hlBox(id) {

  if (L === 'vern') {
    if (id === 'pool') return [4, 100, 512, 160];
    const i = BI(id); return i >= 0 ? [binX(i) - 4, BY - 4, BW + 8, BH + 8] : null;

    if (S.lmode === 'lat') return { pic: [6, 100, 508, 168], band: [14, 270, 492, 60], kz: [LX(40.5) - 6, 280, LX(55.4) - LX(40.5) + 12, 76], marker: [LX(S.lat) - 16, 268, 32, 56], info: [20, 358, 480, 40] }[id] || null;

}

const scene = $('#scene');

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (cancel) { dirty = true; return; }
  const k = d.kind;
  if (k[0] === 'c') {
    const c = +k.slice(1);
    if (!d.moved) { S.csel = S.csel === c ? -1 : c; update(); return; }
    place(c, binAt({ x: d.px, y: d.py }));
    return;
  }
  if (k === 'lat' || k === 'alt') { dirty = true; return; }
  if (d.moved) return;
  tap(d.hit, d);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id, d) {
  const L = LID();
  if (L === 'vern' && id.startsWith('bin')) {
    const i = +id.slice(3);
    if (S.csel >= 0) place(S.csel, i); else toast(BINS[i].name + ' вещество: ' + BINS[i].d.charAt(0).toLowerCase() + BINS[i].d.slice(1));
  }
  if (L === 'zones') {
    if (id === 'band') setLat(latFromX(d.px));
    else if (id === 'mount') setAlt(altFromY(d.py));
    else if (id === 'pic') { const z = zoneAt(S.lat); toast(`${z.name}: продуктивность около ${fmtN(z.npp)} г органики на 1 м² в год.`); }
  }
  if (L === 'human') {
    const m = model();
    if (id === 'sea') toast(`Площадь моря ${fmtN(m.A)} км², объём ${fmtN(m.V)} км³, солёность ${dec(m.Sl, 0)} г/л.`);
    if (id === 'floor') toast('Бывшее дно — новая пустыня Аралкум: соль, песок и остатки удобрений.');
    if (id === 'rivers') toast(`До моря доходит ${dec(m.Q)} км³ воды в год из ${Q0}.`);
    if (id === 'fields') toast(`На поля уходит ${dec(m.take)} км³ в год — это около ${fmtN(m.ha)} тыс. га полива.`);
  }
}

function loop(t) {
  requestAnimationFrame(loop);
  if (S.run && LID() === 'human' && t - lastStep >= 220) { lastStep = t; seaYear(); }
  if (S.flash && t - S.flash.t < 1000) dirty = true;
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

let toastT = 0;

function renderTools() {
  const id = LID(), tb = $('#tools');

  const sep = '<span class="sep"></span>';
  if (id === 'vern') tb.innerHTML = B('reset', 'Начать заново');
  if (id === 'zones') tb.innerHTML = B('m-lat', 'Широты', S.lmode === 'lat') + B('m-alt', 'Горы Алатау', S.lmode === 'alt') + sep + B('z-', S.lmode === 'lat' ? '‹ К экватору' : '‹ Вниз') + B('z+', S.lmode === 'lat' ? 'К полюсу ›' : 'Вверх ›', undefined, '#ffd36b');
  if (id === 'human') tb.innerHTML = B('run', S.run ? 'Пауза' : S.year >= 2020 ? 'Заново' : 'Пуск', undefined, S.run ? '#ff8a73' : '#86e0a8') + B('w-', 'Полив −') + B('w+', 'Полив +') + sep + B('hist', 'Как было', S.histMode) + B('reset', 'Сначала');

}
function placeHint() {
  const hn = $('#hint'), st = $('#stage').getBoundingClientRect(), tb = $('#tools').getBoundingClientRect();
  const c = scene.getScreenCTM(); let left = 1e9;
  if (c) { const q = scene.createSVGPoint(); q.x = 4; q.y = 300; left = q.matrixTransform(c).x; }
  hn.style.visibility = 'hidden';
  const hr = hn.getBoundingClientRect();
  hn.style.visibility = tb.left - st.left < st.width * 0.19 + 30 || hr.right > left - 6 ? 'hidden' : '';
}
addEventListener('resize', placeHint);
function act(a) {
  if (a === 'm-lat' || a === 'm-alt') return setMode(a.slice(2));
  if (a === 'z-') return stepZone(-1);
  if (a === 'z+') return stepZone(1);
  if (a === 'w-') return setW(S.w - 0.05);
  if (a === 'w+') return setW(S.w + 0.05);
  if (a === 'run') return setRun(!S.run);
  if (a === 'hist') return startHist();
  if (a === 'reset') {
    const id = LID();
    if (id === 'vern') { S.bin = {}; S.csel = -1; S.err = 0; update(); }
    else if (id === 'human') { resetSea(); renderTools(); buildScheme(); update(); }
  }
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (m.kind === 'vern') return `Разложено ${m.placed}/${CARDS.length} · ошибок ${m.err}`;
  if (m.kind === 'zones') return `Зоны Казахстана ${m.kz}/${KZN} · пояса Алатау ${m.belts}/${BELTS.length}`;
  return `${S.year} г. · солёность ${m.Sl >= 149 ? '>150' : dec(m.Sl, 0)} г/л · полив в среднем ${dec(m.avgQ)} км³${S.histUsed ? ' · режим истории' : ''}`;
}

function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const chips = (id, list, lbl) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips" id="${id}">${list.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('')}</div></div>`;
function buildScheme() {

  }

    h = `<h2>${S.lmode === 'lat' ? 'Путь от экватора к полюсу' : 'Подъём в горы Алатау'}</h2>` + chips('modeChips', [['lat', 'Широты'], ['alt', 'Горы Алатау']], 'Режим') +

      `<dl class="reads"><div><dt>${S.lmode === 'lat' ? 'Зона' : 'Пояс'}</dt><dd id="r1"></dd></div><div><dt>Температура</dt><dd id="r2"></dd></div><div><dt>${S.lmode === 'lat' ? 'Осадки, мм' : 'Аналог'}</dt><dd id="r3"></dd></div></dl>` +

  if (id === 'human') {

      `<dl class="reads"><div><dt>Год</dt><dd id="r1"></dd></div><div><dt>Уровень</dt><dd id="r2"></dd></div><div><dt>Солёность</dt><dd id="r3"></dd></div></dl>` +
      `<dl class="reads"><div><dt>В море</dt><dd id="r4"></dd></div><div><dt>На поля</dt><dd id="r5"></dd></div><div><dt>Средний полив</dt><dd id="r6"></dd></div></dl>` +
      `<div class="row"><button class="ghostbtn" data-a="run" id="runBtn"></button><button class="ghostbtn" data-a="hist">Как было в истории</button><button class="ghostbtn" data-a="reset">Сначала</button></div>`;

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;

      cc.querySelectorAll('button').forEach(b => b.onclick = () => { S.csel = S.csel === +b.dataset.c ? -1 : +b.dataset.c; update(); });
    }
  } else if (m.kind === 'zones') {
    el.querySelectorAll('#modeChips button').forEach(b => b.setAttribute('aria-pressed', S.lmode === b.dataset.k));
    if (S.lmode === 'lat') { set('#inLatO', `${dec(S.lat)}° с. ш.`); val('#inLat', S.lat); set('#r1', m.z.sh); set('#r2', m.z.T); set('#r3', m.z.P.split(',')[0]); }
    else { set('#inAltO', `${fmtN(S.alt)} м`); val('#inAlt', S.alt); set('#r1', m.b.sh); set('#r2', `${sgn(m.T)} °C`); set('#r3', m.b.an); }
    const sl = el.querySelector('#seenList');
    if (sl) sl.innerHTML = S.lmode === 'lat' ? ZONES.filter(z => z.kz).map(z => step(z.name, S.seenZ[z.id] ? 'найдена ✓' : '—')).join('') : BELTS.map(b => step(`${b.name} (${fmtN(b.a)}–${fmtN(Math.min(b.b, H1))} м)`, S.seenB[b.id] ? 'пройден ✓' : '—')).join('');
  } else {
    set('#inWO', `${Math.round(m.w * 100)}% = ${dec(m.take)} км³/год`); val('#inW', Math.round(m.w * 100));
    set('#r1', String(S.year)); set('#r2', `${dec(S.h)} м`); set('#r3', `${m.Sl >= 149 ? '>150' : dec(m.Sl, 0)} г/л`);
    set('#r4', `${dec(m.Q)} км³`); set('#r5', `${dec(m.take)} км³`); set('#r6', `${dec(m.avgQ)} км³`);
    set('#runBtn', S.run ? 'Пауза' : S.year >= 2020 ? 'Заново' : 'Пуск');

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +

      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

  }

function calcHTML(m) {
  const id = LID();
  if (id === 'vern') {
    let h = `<h2>Толщина биосферы</h2><div class="formula">от −11 км до +22 км ≈ 33 км</div><div class="steps">` +
      step('Верхняя граница', 'озоновый слой, 20–25 км') + step('Нижняя граница в океане', 'дно Марианской впадины, ≈ 11 км') +
      step('Нижняя граница на суше', 'бактерии в земной коре, 3–4 км') + step('Толщина «плёнки жизни»', '11 + 22 ≈ 33 км', 'sum') +
      step('Радиус Земли', '6371 км') + step('Доля от радиуса', '33 / 6371 ≈ 0,005 = 0,5%', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Если Землю сжать до размера футбольного мяча (радиус 11 см), биосфера будет тоньше листа бумаги: 110 мм × 0,005 ≈ 0,6 мм.</p>`;
    h += `<h3>Ваша сортировка</h3><div class="steps">` + BINS.map((b, i) => step(b.name, `${m.per[i]} из 3`)).join('') +
      step('Всего', `${m.placed} из ${CARDS.length} · ошибок ${m.err}`, 'sum') + `</div>`;
    h += `<h3>Как рассуждать</h3><div class="steps">` + step('1. Это организм?', 'да → живое') + step('2. Создано только организмами?', 'да → биогенное') +
      step('3. Создано организмами вместе с неживым?', 'да → биокосное') + step('4. Жизнь не участвовала?', 'да → косное') + `</div>`;
    return h;
  }
  if (id === 'zones') {
    if (S.lmode === 'lat') {
      const z = m.z, top = ZONES[0].npp;
      let h = `<h2>${z.name}</h2><div class="formula">широта ${dec(S.lat)}° с. ш.</div><div class="steps">` +
        step('Средняя годовая температура', `${z.T} °C`) + step('Осадки', `${z.P} мм/год`) + step('Продуктивность', `≈ ${fmtN(z.npp)} г/м² в год`) +
        step('По сравнению с экваториальным лесом', z.npp >= top ? 'максимум' : `в ${dec(top / z.npp, top / z.npp >= 10 ? 0 : 1)} раз меньше`, 'sum') + `</div>`;
      h += `<p class="note" style="margin-top:10px">Продуктивность — сколько сухой органики создают растения на 1 м² за год. Её ограничивает то, чего не хватает: в тундре — тепла, в пустыне — воды.</p>`;
      h += `<h3>Все зоны по порядку</h3><div class="steps">` + ZONES.map(q => step(`${q.a}–${Math.round(Math.min(q.b, 90))}° · ${q.sh}${q.kz ? ' (КЗ)' : ''}`, `${fmtN(q.npp)} г/м²`)).join('') + `</div>`;
      return h;
    }
    const dh = S.alt - 850;
    let h = `<h2>Температура на высоте</h2><div class="formula">t = t(Алматы) − 0,6 °C × Δh / 100 м</div><div class="steps">` +
      step('Алматы, 850 м', '+10 °C в среднем за год') + step('Подъём Δh', `${fmtN(S.alt)} − 850 = ${dh < 0 ? '−' : ''}${fmtN(Math.abs(dh))} м`) +
      step('Похолодание', `0,6 × ${dec(dh / 100)} = ${dec(0.6 * dh / 100)} °C`) + step('Температура', `10 − ${dec(0.6 * dh / 100)} = ${sgn(m.T)} °C`, 'sum') +
      step('Пояс', `${m.b.name} ≈ ${m.b.an}`) + `</div>`;
    h += `<p class="note" style="margin-top:10px">На вершине пика Талгар (4979 м) в среднем около ${sgn(TH(4979))} °C — как в Арктике. Поэтому пояса гор повторяют зоны на пути к полюсу.</p>`;
    h += `<h3>Пояса Заилийского Алатау</h3><div class="steps">` + BELTS.map(b => step(`${fmtN(b.a)}–${fmtN(Math.min(b.b, H1))} м · ${b.sh}`, `${sgn(TH(b.a))}…${sgn(TH(Math.min(b.b, H1)))} °C`)).join('') + `</div>`;
    return h;
  }
  const dh = 1000 * m.Q / Math.max(m.A, 300) - EVAP;
  let h = `<h2>Водный баланс за год</h2><div class="formula">ΔV = приток − испарение</div><div class="steps">` +
    step('Раньше доходило до моря', `${Q0} км³/год`) + step('Забор на полив', `${Math.round(m.w * 100)}% × ${Q0} = ${dec(m.take)} км³`) +
    step('Приток в море', `${Q0} − ${dec(m.take)} = ${dec(m.Q)} км³`) + step('Площадь моря', `${fmtN(m.A)} км²`) +
    step('Испарение (за вычетом осадков)', `0,84 м × ${fmtN(m.A)} км² = ${dec(m.E)} км³`) +
    step('Баланс', `${dec(m.Q)} − ${dec(m.E)} = ${sgn(m.Q - m.E)} км³`, 'sum') + step('Уровень за год', `${sgn(dh)} м`) + `</div>`;
  h += `<h3>Солёность</h3><div class="formula">соль не испаряется: S = 10 г/л × V(1960) / V</div><div class="steps">` +
    step('Объём в 1960 году', `${fmtN(VOL(53))} км³`) + step('Объём сейчас', `${fmtN(m.V)} км³`) +
    step('Солёность', `10 × ${fmtN(VOL(53))} / ${fmtN(m.V)} = ${m.Sl >= 149 ? '>150' : dec(m.Sl, 0)} г/л`, 'sum') + `</div>`;
  h += `<h3>Задание</h3><div class="steps">` + step('Год', `${S.year} из 2020`) + step(`Солёность < ${GOAL_S} г/л`, m.Sl < GOAL_S ? 'да ✓' : 'нет ✗') +
    step(`Средний полив ≥ ${GOAL_Q} км³`, `${dec(m.avgQ)} ${m.avgQ >= GOAL_Q ? '✓' : '✗'}`) + step('Свой план, не «Как было»', S.histUsed ? 'нет ✗' : 'да ✓') + `</div>`;
  h += `<p class="note" style="margin-top:10px">Модель учебная: всё море считается одним водоёмом, соль не выпадает в осадок (поэтому солёность выше 150 г/л модель не показывает), нет плотины. Но порядок чисел близок к реальности: в 1960 году уровень был 53 м, солёность около 10 г/л, а в 2000-х Большой Арал стал солёнее океана в 3 раза и больше.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'vern') {
    el.innerHTML = `<div class="k">Разложено</div><div class="v ${m.placed === CARDS.length ? 'ok' : ''}">${m.placed} / ${CARDS.length}</div>
      <div class="gauge"><b style="width:${(m.placed / CARDS.length * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>ошибок</span><span>${m.err}</span></div>` + (S.csel >= 0 ? `<div class="lr"><span>выбран: ${CARDS[S.csel].n}</span></div>` : '');
  } else if (m.kind === 'zones') {
    if (S.lmode === 'lat') el.innerHTML = `<div class="k">${dec(S.lat)}° с. ш.</div><div class="v">${m.z.sh}</div>
      <div class="gauge"><b style="width:${(m.kz / KZN * 100).toFixed(0)}%"></b></div><div class="lr"><span>зоны КЗ</span><span>${m.kz}/${KZN}</span></div><div class="lr"><span>t, °C</span><span>${m.z.T}</span></div>`;
    else el.innerHTML = `<div class="k">${fmtN(S.alt)} м</div><div class="v">${m.b.sh}</div>
      <div class="gauge"><b style="width:${(m.belts / BELTS.length * 100).toFixed(0)}%"></b></div><div class="lr"><span>пояса</span><span>${m.belts}/${BELTS.length}</span></div><div class="lr"><span>t</span><span>${sgn(m.T)} °C</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Солёность · ${S.year}</div><div class="v ${m.Sl < GOAL_S ? 'ok' : 'bad'}">${m.Sl >= 149 ? '>150' : dec(m.Sl, 0)} г/л</div>
      <div class="gauge"><b style="width:${((S.year - 1960) / 60 * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>полив</span><span>${Math.round(m.w * 100)}%</span></div><div class="lr"><span>уровень</span><span>${dec(S.h)} м</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Биосфера в надёжных руках!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  vern: '<rect x="3" y="4" width="16" height="9" rx="2" fill="#1a2438" stroke="#56627d"/><rect x="3" y="17" width="13" height="10" rx="2" fill="#1a2438" stroke="#5fbf6a"/><rect x="18" y="17" width="13" height="10" rx="2" fill="#1a2438" stroke="#c79a62"/><rect x="33" y="17" width="13" height="10" rx="2" fill="#1a2438" stroke="#72d4e8"/><rect x="48" y="17" width="13" height="10" rx="2" fill="#1a2438" stroke="#9aa6bd"/>',
  zones: '<rect x="2" y="10" width="10" height="10" fill="#2f8a4a"/><rect x="12" y="10" width="10" height="10" fill="#b5a345"/><rect x="22" y="10" width="10" height="10" fill="#cfa865"/><rect x="32" y="10" width="10" height="10" fill="#a7b34e"/><rect x="42" y="10" width="10" height="10" fill="#2f6a4a"/><rect x="52" y="10" width="12" height="10" fill="#cfdce8"/><path d="M37 5v20" stroke="#ffd36b" stroke-width="2"/>',
  human: '<ellipse cx="30" cy="15" rx="22" ry="10" fill="#bfb49a" opacity=".4" stroke="#e8ecf4" stroke-dasharray="2 2"/><ellipse cx="27" cy="16" rx="11" ry="5" fill="#5a9a98"/><rect x="50" y="4" width="6" height="5" fill="#5fbf6a"/><rect x="57" y="4" width="6" height="5" fill="#5fbf6a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'vern') {
    now = `Игра-сортировка: 12 образцов нужно разложить по типам вещества биосферы по Вернадскому (живое, биогенное, биокосное, косное). Неверно положенный образец возвращается обратно. ` +
      `Уже разложено верно: ${BINS.map((b, i) => `${b.name.toLowerCase()} — ${CARDS.filter((c, j) => S.bin[j] === b.k).map(c => c.n).join(', ') || 'пусто'}`).join('; ')}. ` +
      `Ещё не разложены: ${CARDS.filter((c, j) => !S.bin[j]).map(c => c.n).join(', ') || 'ничего'}. Выбран образец: ${S.csel >= 0 ? CARDS[S.csel].n : 'нет'}. Ошибок: ${S.err}.`;
    guide = 'Не называй, в какую коробку класть оставшиеся образцы. Задавай вопросы: живой ли это организм; образовалось ли это из остатков организмов; создаётся ли это организмами вместе с неживой природой; участвовала ли жизнь вообще.';
  }
  if (id === 'zones') {
    now = S.lmode === 'lat'
      ? `Режим «Широты»: схема природных зон от экватора к Северному полюсу (через Африку и Евразию). Маркер на ${dec(S.lat)}° с. ш., зона — ${m.z.name}: ${m.z.T} °C, осадки ${m.z.P} мм в год, продуктивность около ${m.z.npp} г/м² в год, растения: ${m.z.pl}; животные: ${m.z.an}.`
      : `Режим «Горы Алатау»: высотные пояса Заилийского Алатау над Алматы. Альпинист на высоте ${S.alt} м, температура около ${dec(m.T)} °C (минус 0,6 °C на каждые 100 м от +10 °C в Алматы на 850 м), пояс — ${m.b.name}, похож на зону «${m.b.an}».`;
    now += ` Найдено зон Казахстана: ${m.kz} из ${KZN} (${ZONES.filter(z => z.kz && S.seenZ[z.id]).map(z => z.sh).join(', ') || 'ни одной'}). Пройдено поясов: ${m.belts} из ${BELTS.length}.`;
    guide = 'Не называй широты зон напрямую. Спроси, между какими широтами лежит Казахстан, почему в Казахстане нет лесов, как у Москвы, хотя широта похожа (мало влаги), и почему в горах холодает с высотой.';
  }
  if (id === 'human') {
    now = `Учебная модель Аральского моря: до 1960 года в море приходило около ${Q0} км³ воды в год, испарение минус осадки 0,84 м в год с площади моря. Ученик задаёт долю воды, которую забирают на полив. ` +
      `Режим: ${S.histMode ? 'история (забор растёт с 10% до 90% к 1985 году)' : 'план ученика'}. Год ${S.year}, забор ${Math.round(m.w * 100)}% (${dec(m.take)} км³ на поля, ${dec(m.Q)} км³ в море), уровень ${dec(S.h)} м, площадь ${fmtN(m.A)} км², солёность ${dec(m.Sl, 0)} г/л, средний полив за прошедшие годы ${dec(m.avgQ)} км³. ` +
      `Цель: дойти до 2020 года своим планом с солёностью ниже ${GOAL_S} г/л и средним поливом не меньше ${GOAL_Q} км³ в год. Модель ${S.run ? 'идёт' : 'на паузе'}.`;
    guide = 'Не называй точный процент забора. Помоги рассуждать: от чего зависит, сколько воды испаряется с моря; почему при меньшей площади испарения меньше и море находит новое равновесие; почему соль остаётся в море. Свяжи с реальной историей Арала и Кокаральской плотиной.';
  }
  return [
    `Раздел: биология, 11 класс, раздел «Экология», тема «Биосфера». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    vern: 'Почему Вернадский называл живое вещество геологической силой?',
    zones: 'Почему на одной широте с лесами Европы в Казахстане степи?',
    human: 'Можно ли полностью вернуть Аральское море?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
