<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 8 класс: функции и списки в Python — def и return, списки и индексы, строки и срезы, поиск ошибок. Редактор, пошаговое выполнение, кадры вызовов в памяти и автопроверка.">
<title>Функции и списки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. The stage is a tiny Python IDE: editor, console, memory with call frames and list cells; lesson notebook on the right. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --lh:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.top{display:flex;gap:10px;align-items:stretch;flex:none;min-width:0}
.task{flex:1;min-width:0;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}
.meter{flex:none;width:184px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .v.run{color:var(--force)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}
.hl{outline:2px dashed var(--arm);outline-offset:2px}

.work{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.box{display:flex;flex-direction:column;min-height:0;min-width:0;background:rgba(11,16,25,.74);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bh{flex:none;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font:600 10.5px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bh span:last-child{font:500 10.5px/1.2 var(--font-mono);letter-spacing:.04em;text-transform:none;text-align:right}
.ed{flex:1;min-height:0;display:flex;position:relative;font:14px/var(--lh) var(--font-mono)}
.gut{flex:none;width:56px;overflow:hidden;position:relative;border-right:1px solid var(--line);color:var(--muted);user-select:none;-webkit-user-select:none;background:rgba(18,26,40,.6)}
.gut .in{position:absolute;left:0;right:0;top:0;padding-top:10px}
.gut .gl{height:var(--lh);display:flex;justify-content:space-between;align-items:center;padding:0 6px 0 8px;font-size:12px}
.gut .gl.cur{color:var(--fg)}
.gut .c{font-size:10px;color:var(--force);font-variant-numeric:tabular-nums}
.gut .gl.zero .c{color:#56627d}
.edw{flex:1;min-width:0;position:relative;overflow:hidden}
.curl{position:absolute;left:0;right:0;height:var(--lh);background:rgba(255,181,71,.14);border-left:3px solid var(--force);pointer-events:none}
.curl.err{background:rgba(255,138,115,.18);border-left-color:var(--warn)}
#code{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:none;background:transparent;color:var(--fg);font:inherit;padding:10px 12px;margin:0;white-space:pre;overflow:auto;tab-size:4;-moz-tab-size:4;caret-color:var(--force);touch-action:pan-x pan-y}
#code:focus-visible{outline:none}
.edw:focus-within{box-shadow:inset 0 0 0 1px rgba(114,212,232,.35)}
.snips{flex:none;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:7px 8px;border-top:1px solid var(--line)}
.snips button{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--font-mono);cursor:pointer;white-space:nowrap}
.snips button:hover{border-color:var(--muted)}
.side{display:grid;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);gap:10px;min-height:0;min-width:0}
.con{flex:1;min-height:0;overflow:auto;padding:10px 12px;font:13.5px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.con .p{color:var(--muted)}
.con .i{color:var(--arm)}
.con .e{color:var(--warn)}
.con .s{color:#56627d}
.con .ex{display:block;color:var(--fg);font-family:var(--font-body);font-size:13px;line-height:1.45;background:rgba(255,138,115,.1);border-left:3px solid var(--warn);border-radius:6px;padding:7px 9px;margin-top:6px;white-space:normal}
.con .empty{color:#56627d;font-family:var(--font-body);font-size:13px}
.inrow{flex:none;display:flex;gap:6px;padding:7px 8px;border-top:1px solid var(--line);background:rgba(114,212,232,.06)}
.inrow span{font:500 14px/34px var(--font-mono);color:var(--arm);padding-left:4px}
.inrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--arm);border-radius:8px;padding:6px 10px;font:500 15px/1.3 var(--font-mono);outline:none}
.inrow button{background:var(--arm);color:var(--bg);border:0;border-radius:8px;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer}
.mem{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.fr{border:1px dashed var(--line);border-radius:10px;padding:6px 8px 8px;min-width:0}
.fr.call{border-style:solid;border-color:rgba(180,156,255,.55);background:rgba(180,156,255,.06)}
.fh{font:500 11px/1.3 var(--font-mono);color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
.fr.call .fh{color:#b49cff}
.cells{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.arr{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.arr span{display:flex;flex-direction:column;align-items:center;min-width:24px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px 4px 3px}
.arr span i{font:500 9.5px/1 var(--font-mono);color:var(--muted);font-style:normal}
.arr span b{font:500 13px/1.3 var(--font-mono);white-space:pre}
.arr span.more{justify-content:center;color:var(--muted);font:500 11px/1 var(--font-mono)}
.alias{font-size:11px;color:var(--force);margin-top:4px}
.ret{font:500 12px/1.4 var(--font-mono);color:#b49cff;overflow-wrap:anywhere}
.cell{min-width:84px;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:6px 9px 7px;transition:border-color .3s}
.cell .n{display:flex;justify-content:space-between;gap:10px;font:500 11px/1.2 var(--font-mono);color:var(--muted)}
.cell .n i{font-style:normal;font-size:10px;padding:1px 5px;border-radius:5px;background:var(--bg)}
.cell .v{font:500 14.5px/1.3 var(--font-mono);margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cell.chg{border-color:var(--force);box-shadow:0 0 0 1px var(--force)}
.ty-int{color:#72d4e8}.ty-float{color:#b49cff}.ty-str{color:#86e0a8}.ty-bool{color:#ffb547}.ty-list{color:#ff8ad8}.ty-tuple{color:#ff8ad8}.ty-NoneType{color:#8b96ad}.ty-function{color:#b49cff}
.mem .empty{color:#56627d;font-size:13px;padding:2px 4px}

.tools{flex:none;align-self:center;display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:100%}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.pbody code{font:500 13px var(--font-mono);background:var(--surface-2);border-radius:5px;padding:1px 5px}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.chips.mono button{font-family:var(--font-mono);font-size:12.5px}

.formula{font:500 15px/1.45 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .ed{flex:none;height:264px}
  .side{grid-template-rows:auto auto}
  .con{flex:none;height:180px}
  .mem{flex:none;min-height:70px;max-height:280px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .stage{padding:8px}
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{padding:9px 11px}
  .task p{font-size:13px}
  .ed{font-size:16px}
  .inrow input{font-size:16px}
  .gut{width:48px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M9 13l6 5-6 5" fill="none" stroke="var(--force)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 26h13" stroke="var(--arm)" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Информатика · Функции и списки</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Функции</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории: редактор Python, консоль, память и кадры вызовов">
    <div class="top">
      <div class="task" id="taskBox" aria-live="polite">
        <div class="k" id="taskK">Задание</div>
        <p id="taskText"></p>
        <div class="state" id="taskState"></div>
      </div>
      <div class="meter" id="meter"></div>
    </div>
    <div class="work">
      <div class="box" id="edPane">
        <div class="bh"><span>Редактор · main.py</span><span id="edInfo"></span></div>
        <div class="ed">
          <div class="gut" id="gut"><div class="in" id="gutIn"></div></div>
          <div class="edw"><div class="curl" id="curl" hidden></div><textarea id="code" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Код программы на Python"></textarea></div>
        </div>
        <div class="snips" id="snips" aria-label="Вставить заготовку"></div>
      </div>
      <div class="side">
        <div class="box" id="conPane">

const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, codes: saved.codes || {}, tab: 'overview',

// =====================================================================
// A small Python interpreter (a school subset): print, input, variables,
// int/float/str/bool/list, arithmetic, comparisons, if/elif/else,
// while, for … in range/str/list, break/continue, f-strings,
// def/return with local frames, indexing, slices, item assignment.
// =====================================================================
class PyErr extends Error { constructor(type, msg, line) { super(msg); this.type = type; this.line = line; } }
class F { constructor(v) { this.v = v; } }   // float
const BRK = { brk: 1 }, CNT = { cnt: 1 };
class Ret { constructor(v) { this.v = v; } }
const E = (type, msg, line) => new PyErr(type, msg, line);

const KW = new Set('if elif else while for in and or not True False None break continue pass def return import from class lambda try except finally with as global nonlocal is del yield raise assert async await'.split(' '));
const OPS = ['**=', '//=', '**', '//', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '->', '+', '-', '*', '/', '%', '<', '>', '=', '(', ')', '[', ']', '{', '}', ',', ':', '.', ';'];
const AUG = new Set(['+=', '-=', '*=', '/=', '//=', '%=', '**=']);

function tokenize(s, no) {
  const T = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === ' ' || c === '\t' || c === ' ') { i++; continue; }
    if (c === '#') break;
    const rest = s.slice(i);
    let m = /^([fFrR]{0,2})(["'])/.exec(rest);
    if (m) {
      const pre = m[1].toLowerCase(), q = m[2];
      if (rest.slice(m[1].length, m[1].length + 3) === q + q + q) throw E('SyntaxError', 'тройные кавычки в этой лаборатории не поддерживаются', no);
      let j = i + m[1].length + 1, buf = '';
      while (j < s.length && s[j] !== q) {
        if (s[j] === '\\' && !pre.includes('r') && j + 1 < s.length) {
          const n = s[j + 1]; buf += n === 'n' ? '\n' : n === 't' ? '\t' : n === '\\' ? '\\' : n === "'" ? "'" : n === '"' ? '"' : '\\' + n; j += 2;
        } else buf += s[j++];
      }
      if (j >= s.length) throw E('SyntaxError', `unterminated string literal (detected at line ${no})`, no);
      T.push({ t: pre.includes('f') ? 'fstr' : 'str', v: buf });
      i = j + 1; continue;
    }
    if ((m = /^(\d[\d_]*\.?[\d_]*([eE][+-]?\d+)?|\.\d+([eE][+-]?\d+)?)/.exec(rest))) {
      const raw = m[0].replace(/_/g, '');
      T.push({ t: 'num', v: /[.eE]/.test(raw) ? new F(parseFloat(raw)) : parseInt(raw, 10) });
      i += m[0].length; continue;
    }
    if ((m = /^[\p{L}_][\p{L}\p{N}_]*/u.exec(rest))) {
      T.push({ t: KW.has(m[0]) ? 'kw' : 'name', v: m[0] }); i += m[0].length; continue;
    }
    const op = OPS.find(o => rest.startsWith(o));
    if (op) { T.push({ t: 'op', v: op }); i += op.length; continue; }
    const code = 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
    if ('«»“”„‘’'.includes(c)) throw E('SyntaxError', `invalid character '${c}' (${code})`, no);
    throw E('SyntaxError', `invalid character '${c}' (${code})`, no);
  }
  return T;
}

function mkP(toks, no) {
  return { toks, p: 0, no,
    peek(k) { return this.toks[this.p + (k || 0)] || { t: 'end', v: '' }; },
    next() { return this.toks[this.p++] || { t: 'end', v: '' }; },
    isOp(v) { const t = this.peek(); return t.t === 'op' && t.v === v; },
    isKw(v) { const t = this.peek(); return t.t === 'kw' && t.v === v; },
    atEnd() { return this.p >= this.toks.length; } };
}
function synErr(P, msg) { return E('SyntaxError', msg || 'invalid syntax', P.no); }

function parseExpr(P) { return orTest(P); }
function exprList(P) {
  const first = parseExpr(P);
  if (!P.isOp(',')) return first;
  const items = [first];
  while (P.isOp(',')) { P.next(); if (P.atEnd() || P.isOp(')') || P.isOp('=') || P.isOp(':')) break; items.push(parseExpr(P)); }
  return { k: 'tuple', items };
}
function orTest(P) { let a = andTest(P); while (P.isKw('or')) { P.next(); a = { k: 'or', a, b: andTest(P) }; } return a; }
function andTest(P) { let a = notTest(P); while (P.isKw('and')) { P.next(); a = { k: 'and', a, b: notTest(P) }; } return a; }
function notTest(P) { if (P.isKw('not')) { P.next(); return { k: 'not', a: notTest(P) }; } return comparison(P); }
const CMP = new Set(['<', '>', '==', '!=', '<=', '>=']);
function comparison(P) {
  const first = arith(P), ops = [], rest = [];
  for (;;) {
    const t = P.peek();
    let op = null;
    if (t.t === 'op' && CMP.has(t.v)) { op = t.v; P.next(); }
    else if (t.t === 'kw' && t.v === 'in') { op = 'in'; P.next(); }
    else if (t.t === 'kw' && t.v === 'not' && P.peek(1).t === 'kw' && P.peek(1).v === 'in') { op = 'not in'; P.p += 2; }
    else if (t.t === 'kw' && t.v === 'is') { P.next(); if (P.isKw('not')) { P.next(); op = 'is not'; } else op = 'is'; }
    else break;
    ops.push(op); rest.push(arith(P));
  }
  return ops.length ? { k: 'cmp', first, ops, rest } : first;
}

  const calls = S.X ? S.X.calls : [];
  if (!calls.length) h += '<p class="note">Запустите программу — здесь появится каждый вызов: с какими аргументами и что вернул.</p>';
  else h += `<div class="steps">` + calls.slice(0, 25).map(c => step(`${'· '.repeat(Math.max(0, c.depth - 1))}${esc(c.name)}(${esc(c.args.join(', '))})`, c.ret === undefined ? 'не завершился' : '→ ' + esc(c.ret))).join('') + (calls.length > 25 ? step('…', `ещё ${calls.length - 25}`) : '') + `</div>`;
  h += `<h3>Трасса последнего запуска</h3>`;
  const tr = S.trace, src = code.value.split('\n');
  if (!tr.length) h += '<p class="note">Запустите программу — по шагам появится, какая строка выполнилась и что изменилось в памяти.</p>';
  else {
    const show = tr.length > 60 ? tr.slice(0, 40).concat([null], tr.slice(-15)) : tr;
    h += `<div class="steps">` + show.map(x => x ? step(`${tr.indexOf(x) + 1}. стр. ${x.line}: <code>${esc((src[x.line - 1] || '').trim().slice(0, 40))}</code>`, esc([...x.ch, x.out ? 'вывод: ' + x.out.replace(/\n$/, '').replace(/\n/g, ' ⏎ ') : ''].filter(Boolean).join(' · ') || '—')) : step('…', `пропущено ${tr.length - 55} шагов`)).join('') + `</div>`;
  }
  return h;
}
function renderPanes() {
  if (S.tab === 'overview') { const o = $('#ovState'); if (o) { o.textContent = taskState(); o.classList.toggle('done', !!S.done[LID()]); } }
  if (S.tab === 'scheme') updateScheme();
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML();
}

function update() {
  const Ls = L(), m = { kind: Ls.id, tests: S.tests && S.tests.lesson === Ls.id && S.tests.code === code.value ? S.tests : null };
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Функции, списки и строки освоены!'), 1200);
  }
  renderMeter(); renderConsole(); renderMem(); renderGutter(); renderTools();
  if (S.curLine) scrollToLine(S.curLine); else if (S.errLine) scrollToLine(S.errLine);
  placeCur();
  $('#edInfo').textContent = S.curLine ? `следующая: стр. ${S.curLine}` : S.errLine ? `ошибка: стр. ${S.errLine}` : '';
  $('#taskState').textContent = taskState();
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
}

const MINI = {
  func: '<rect x="4" y="5" width="34" height="20" rx="4" fill="none" stroke="#b49cff" stroke-width="1.6"/><path d="M10 12h8M10 18h14" stroke="#e8ecf4" stroke-width="1.6"/><path d="M40 15h14" stroke="#ffb547" stroke-width="1.8"/><path d="M50 11l5 4-5 4" fill="none" stroke="#ffb547" stroke-width="1.8"/><circle cx="60" cy="15" r="3" fill="#86e0a8"/>',
  lists: '<g fill="#0b1019" stroke="#ff8ad8"><rect x="4" y="10" width="11" height="14" rx="2"/><rect x="17" y="10" width="11" height="14" rx="2"/><rect x="30" y="10" width="11" height="14" rx="2" stroke="#ffb547"/><rect x="43" y="10" width="11" height="14" rx="2"/></g><path d="M8 6h3M21 6h3M34 6h3M47 6h3" stroke="#8b96ad" stroke-width="1.6"/><path d="M58 17h5" stroke="#8b96ad" stroke-width="1.6" stroke-dasharray="1 2"/>',
  str: '<g fill="#0b1019" stroke="#86e0a8"><rect x="4" y="9" width="9" height="13" rx="2"/><rect x="14" y="9" width="9" height="13" rx="2"/><rect x="24" y="9" width="9" height="13" rx="2"/><rect x="34" y="9" width="9" height="13" rx="2"/><rect x="44" y="9" width="9" height="13" rx="2"/></g><path d="M3 26h31" stroke="#ffb547" stroke-width="1.8"/><path d="M56 15h7" stroke="#86e0a8" stroke-width="1.6"/>',
  debug: '<ellipse cx="33" cy="17" rx="8" ry="10" fill="none" stroke="#ff8a73" stroke-width="1.8"/><path d="M33 8v18M25 13l-7-3M25 19h-8M25 24l-6 3M41 13l7-3M41 19h8M41 24l6 3" stroke="#ff8a73" stroke-width="1.5" stroke-linecap="round"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.run = null; hideInput();
  S.lesson = i; S.tests = null; S.status = 'ready';
  resetOutput();
  code.value = typeof S.codes[Ls.id] === 'string' ? S.codes[Ls.id] : Ls.code;
  code.scrollTop = 0;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  renderSnips(); renderStrip();
  setTab(S.tab);
  update();
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const Ls = L(), id = Ls.id, t = S.tests && S.tests.lesson === id ? S.tests : null;
  const src = code.value.split('\n').map((l, i) => `${String(i + 1).padStart(2, ' ')}| ${l}`).join('\n');
  let out = S.con.map(s => s.t).join(''); if (out.length > 1500) out = '…' + out.slice(-1500);
  const X = S.X;
  const mem = X && X.env.size ? Array.from(X.env, ([k, v]) => `${k} = ${repr(v).slice(0, 120)} (${typeName(v)})`).join('; ') : 'пусто';
  const frames = X && X.frames.length > 1 ? X.frames.slice(1).map(f => `${f.name}(${f.rec.args.join(', ')}) — локальные: ${Array.from(f.env, ([k, v]) => `${k} = ${repr(v).slice(0, 80)}`).join(', ') || 'нет'}`).join(' → ') : 'нет активных вызовов';
  const calls = X && X.calls.length ? X.calls.slice(0, 10).map(c => `${c.name}(${c.args.join(', ')}) → ${c.ret === undefined ? 'не завершился' : c.ret}`).join('; ') : 'нет';
  const st = (STATUS[S.status] || STATUS.ready)[0];
  const tests = t ? `${t.pass} из ${t.total} пройдено` + t.rows.filter(x => !x.ok).slice(0, 3).map(x => `; не пройден ${x.label}: получено «${x.got}»${x.note ? ' (' + x.note + ')' : ''}`).join('') : 'ещё не запускались';
  return [
    `Раздел: информатика, 8 класс, тема «Функции и списки» (Python). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `На экране: мини-среда Python (редактор, консоль, память с кадрами вызовов функций, пошаговый запуск, автопроверка, которая сама вызывает функцию ${Ls.fn} с тестовыми аргументами). Интерпретатор поддерживает школьное подмножество Python: print, input, if/elif/else, for/while, def/return, списки, строки, индексы, срезы и основные методы.`,
    `Код ученика:\n${src}`,
    `Состояние программы: ${st}${S.curLine ? ', следующая строка ' + S.curLine : ''}. Шагов выполнено: ${S.steps}.`,
    `Консоль:\n${out || '(пусто)'}`,
    S.err ? `Ошибка в строке ${S.errLine}: ${S.err.type}: ${S.err.message}. Подсказка на экране: ${explain(S.err).replace(/<[^>]+>/g, '')}` : 'Ошибок нет.',
    `Глобальная память: ${mem}.`,
    `Стек вызовов: ${frames}. Вызовы при последнем запуске: ${calls}.`,
    `Автотесты: ${tests}.`,
    id === 'debug' ? 'Это урок на поиск ошибок: не называй ученику все ошибки и не давай исправленный код. Помогай по одной: попроси прочитать сообщение об ошибке, пройти код кнопкой «Шаг», посчитать сумму на маленьком примере.' : 'Не пиши за ученика готовую функцию целиком. Наводи вопросами: что функция получает, что должна вернуть, какой индекс у первого элемента, что даёт split(). Можно показать маленький пример на другой задаче.',
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { func: 'Чем return отличается от print?', lists: 'Почему индексы списка начинаются с нуля?', str: 'Почему строку нельзя изменить по индексу?', debug: 'Как найти логическую ошибку, если Python молчит?' }[Ls.id];
  return [S.err ? 'Что означает эта ошибка?' : done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где функции и списки пригодятся в профессии?'];
};

addEventListener('resize', () => { placeCur(); });
setLesson(S.lesson);
requestAnimationFrame(loop);
})();
