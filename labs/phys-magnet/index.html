<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: постоянные магниты, магнитное поле тока, электромагнит, электродвигатель.">
<title>Магнитное поле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 31C12 31 13 20 19 20S26 11 31 9" fill="none" stroke="var(--force)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 31L29 11" stroke="var(--arm)" stroke-width="2.2" stroke-linecap="round"/><path d="M33 8l-7 1.5 4.5 4.5z" fill="var(--arm)"/><circle cx="7" cy="31" r="3" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>

      <div class="prog" aria-label="Прогресс"><b>Магнетизм</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с магнитами, проводом с током, электромагнитом и моделью электродвигателя. Компас и рамку можно перетаскивать."></svg>
    <div class="task" aria-live="polite">

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const NCOL = '#e0564a', SCOL = '#4a86d6';

const LESSONS = [
  { id: 'perm', title: 'Постоянные магниты',
    text: ['Магнит притягивает железо, сталь, никель и кобальт. Сильнее всего он действует у концов — полюсов. У каждого магнита два полюса: северный N и южный S. Одноимённые полюсы отталкиваются, разноимённые притягиваются. Если магнит разрезать, получатся два магнита, и у каждого снова два полюса.',
           'Вокруг магнита есть магнитное поле. Его показывают магнитные линии: снаружи магнита они выходят из северного полюса и входят в южный. Железные опилки выстраиваются вдоль этих линий. Стрелка компаса — тоже маленький магнит: её северный конец поворачивается по направлению магнитной линии.',
           'Земля — огромный магнит. Вдали от других магнитов стрелка компаса показывает северным концом на север. Значит, возле географического Северного полюса находится южный магнитный полюс Земли.'],
    why: 'Постоянные магниты стоят в динамиках и наушниках, в моторах электросамокатов и ветрогенераторов, в магнитных замках дверей и держателях телефона в такси. Геологи ищут железную руду по искажению магнитного поля: так в 1949 году нашли Соколовско-Сарбайское месторождение у Рудного — лётчик заметил, что над степью «сходит с ума» компас. Туристы и спасатели в горах Алатау ориентируются по компасу, когда пропадает GPS.',
    task: 'У магнита стёрлась маркировка. Поднесите компас к обоим концам магнита и определите, какой конец — северный полюс N.',
    hint: 'Тащите компас. Красный конец стрелки — её северный полюс. Вспомните: разноимённые полюсы притягиваются. Кнопки «Опилки» и «Линии» показывают поле.',
    safe: 'Неодимовые магниты очень сильные: они больно щемят пальцы и могут испортить телефон или банковскую карту. Маленькие магниты нельзя давать малышам: проглоченные магниты опасны для жизни.',
    stage: 'Тащите компас к концам магнита.',
    check: m => m.visL && m.visR && m.ans },
  { id: 'wire', title: 'Магнитное поле тока',
    text: ['В 1820 году датский физик Эрстед поставил компас рядом с проводом. Когда он замкнул цепь, стрелка повернулась. Когда разомкнул — стрелка вернулась на север. Так открыли, что электрический ток создаёт магнитное поле.',
           'Магнитные линии прямого провода — замкнутые окружности вокруг провода. Чем больше ток и чем ближе к проводу, тем поле сильнее. Если поменять направление тока, поле тоже меняет направление.',
           'Направление линий находят по правилу буравчика: если ввинчивать буравчик (штопор) по направлению тока, то ручка вращается по направлению магнитных линий. На рисунке провод виден с торца: ⊙ — ток идёт к нам, ⊗ — от нас.'],
    why: 'Токоизмерительными клещами электрик за секунду узнаёт ток в проводе, не разрезая его: клещи чувствуют магнитное поле тока. Поэтому толстые кабели с большим током не кладут вплотную к чувствительной аппаратуре, а геодезисты и туристы держат компас подальше от проводов, аккумуляторов и машины. Электромонтёры в Казахстане проверяют клещами щитки в домах и на заводах каждый день.',
    task: 'Поставьте компас к северу от провода (выше него) и пустите ток так, чтобы северный конец стрелки повернул на восток (вправо) не меньше чем на 45°.',
    hint: 'Сначала замкните ключ. Направление тока меняет кнопка «Ток». Куда идут линии над проводом, подскажет правило буравчика. Чем ближе компас и чем больше ток, тем сильнее отклонение.',
    safe: 'В опыте Эрстеда ток включают на пару секунд: толстый провод без нагрузки — почти короткое замыкание, он греется, а батарейка быстро садится. С розеткой такие опыты делать нельзя.',

const LS_KEY = 'luch-phys-magnet';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;
let drag = null, dirty = true, lastUpd = 0;

// ---------- geometry (SVG units; scene 520 × 405) ----------
const G1 = { mx: 260, my: 205, hl: 80, hh: 18, qd: 66, earth: 8e-6 };
const G2 = { wx: 260, wy: 215, ppc: 12, BE: 2e-5, rmin: 2.2, rmax: 16 };
const G3 = { x0: 150, x1: 350, cy: 175, R: 38, cx0: 128, cx1: 372, comp: [450, 175] };
const G4 = { cx: 260, cy: 215, R: 92, K: Math.PI * Math.PI, b: 2 };

function resetState() {
  const Ls = L();
  Object.assign(S, {
    // lesson 1
    hidN: Math.random() < 0.5 ? 1 : -1, cpx: 120, cpy: 320, visL: false, visR: false, ans: null, ansOk: false, filings: false, lines: false,
    // lesson 2
    wOn: false, wDir: 1, wI: Ls.I0 || 2, wx: G2.wx + 6 * G2.ppc, wy: G2.wy, wFil: false,
    // lesson 3
    cN: Ls.N0 || 100, cI: Ls.I0 || 1, core: false, cOn: false, cDir: 1, cAns: null,
    // lesson 4
    mOn: false, comm: false, mDir: 1, pol: 1, mI: Ls.I0 || 1, phi: 0.6, om: 0, omS: 0,
    hl: null,
  });
  linesCache = null;
}

// ---------- lesson 1: permanent magnet ----------
let linesCache = null;
const poles = () => { const n = S.hidN; return [{ x: G1.mx + n * G1.qd, y: G1.my, q: 1 }, { x: G1.mx - n * G1.qd, y: G1.my, q: -1 }]; };
function Bmag(x, y) {
  let bx = 0, by = 0;
  for (const p of poles()) { const dx = x - p.x, dy = y - p.y, d2 = dx * dx + dy * dy + 30, d3 = d2 * Math.sqrt(d2); bx += p.q * dx / d3; by += p.q * dy / d3; }
  return [bx, by];
}
const Btot1 = (x, y) => { const [bx, by] = Bmag(x, y); return [bx, by - G1.earth]; };
const endPt = side => [G1.mx + side * G1.hl, G1.my]; // side −1 = left, +1 = right
const distEnd = side => { const [ex, ey] = endPt(side); return Math.hypot(S.cpx - ex, S.cpy - ey); };
function needle1() { const [bx, by] = Btot1(S.cpx, S.cpy); return Math.atan2(by, bx); }
// which way the needle's N end points relative to the nearest magnet end: toward the magnet or away from it
function nearInfo() {
  const side = distEnd(-1) < distEnd(1) ? -1 : 1, d = distEnd(side), a = needle1();
  const [ex, ey] = endPt(side), tx = ex - S.cpx, ty = ey - S.cpy, tl = Math.hypot(tx, ty) || 1;
  const cosv = (Math.cos(a) * tx + Math.sin(a) * ty) / tl;
  return { side, d, toward: cosv > 0.3, away: cosv < -0.3 };
}
function setCompass1(x, y) {
  x = clamp(x, 0, 520); y = clamp(y, 50, 385);
  const px = G1.hl + 22, py = G1.hh + 22;
  if (Math.abs(x - G1.mx) < px && Math.abs(y - G1.my) < py) y = G1.my + (y < G1.my ? -py : py);
  S.cpx = x; S.cpy = y;
  if (!S.visL && distEnd(-1) < 58) { S.visL = true; toast('Компас у левого конца. Куда смотрит красный конец стрелки — к магниту или от него?'); renderTools(); }
  if (!S.visR && distEnd(1) < 58) { S.visR = true; toast('Компас у правого конца. Сравните со стрелкой у левого конца.'); renderTools(); }
  dirty = true;
}
function answer1(side) {
  if (!S.visL || !S.visR) { toast('Сначала поднесите компас к обоим концам магнита.'); return; }
  S.ans = side;
  if (side === S.hidN) { S.ansOk = true; toast('Верно! К северному полюсу магнита стрелка повёрнута южным концом: разноимённые полюсы притягиваются.'); }
  else { S.ansOk = false; toast('Проверьте ещё раз. Красный конец стрелки — северный. Какой полюс магнита он притягивает?'); }
  renderTools(); update();
}
function fieldLines() {
  if (linesCache && linesCache.n === S.hidN) return linesCache.h;
  const [Np, Sp] = poles(); let h = '';
  const n = 16;
  for (let i = 0; i < n; i++) {
    const a = (i + 0.5) / n * 2 * Math.PI;
    let x = Np.x + 5 * Math.cos(a), y = Np.y + 5 * Math.sin(a);
    const pts = [[x, y]];
    for (let k = 0; k < 900; k++) {
      const [bx, by] = Bmag(x, y), b = Math.hypot(bx, by) || 1;
      x += 3 * bx / b; y += 3 * by / b; pts.push([x, y]);
      if (Math.hypot(x - Sp.x, y - Sp.y) < 5 || x < -500 || x > 1020 || y < -400 || y > 800) break;
    }
    h += `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}" fill="none" stroke="#72d4e8" stroke-width="1.2" opacity=".5"/>`;
    // arrowheads at a few points outside the magnet
    for (const f of [0.25, 0.5, 0.75]) {
      const j = Math.floor(pts.length * f), p = pts[j], q = pts[Math.min(j + 1, pts.length - 1)];
      if (!p || !q) continue;
      if (Math.abs(p[0] - G1.mx) < G1.hl + 6 && Math.abs(p[1] - G1.my) < G1.hh + 6) continue;
      const ang = Math.atan2(q[1] - p[1], q[0] - p[0]), c = Math.cos(ang), s = Math.sin(ang);
      h += `<path d="M${(p[0] + 6 * c).toFixed(1)} ${(p[1] + 6 * s).toFixed(1)}L${(p[0] - 4 * c - 4 * s).toFixed(1)} ${(p[1] - 4 * s + 4 * c).toFixed(1)}L${(p[0] - 4 * c + 4 * s).toFixed(1)} ${(p[1] - 4 * s - 4 * c).toFixed(1)}z" fill="#72d4e8" opacity=".75"/>`;
    }
  }
  linesCache = { n: S.hidN, h };
  return h;
}
function filingsSVG() {
  let h = '';
  for (let x = 14; x <= 506; x += 22) for (let y = 60; y <= 384; y += 22) {
    if (Math.abs(x - G1.mx) < G1.hl + 8 && Math.abs(y - G1.my) < G1.hh + 8) continue;
    const [bx, by] = Bmag(x, y), b = Math.hypot(bx, by); if (!b) continue;
    const c = bx / b, s = by / b, op = clamp(0.25 + 0.22 * Math.log10(b / 2e-6), 0.12, 0.95);
    h += `<path d="M${(x - 5 * c).toFixed(1)} ${(y - 5 * s).toFixed(1)}L${(x + 5 * c).toFixed(1)} ${(y + 5 * s).toFixed(1)}" stroke="#b7bfcc" stroke-width="1.6" stroke-linecap="round" opacity="${op.toFixed(2)}"/>`;
  }
  return h;
}

// ---------- lesson 2: field of a straight wire ----------
const rCm2 = () => Math.hypot(S.wx - G2.wx, S.wy - G2.wy) / G2.ppc;
const Bw = () => (S.wOn ? 2e-7 * S.wI / (rCm2() / 100) : 0); // Тл
function Bvec2() {
  const dx = S.wx - G2.wx, dy = S.wy - G2.wy, d = Math.hypot(dx, dy) || 1, b = Bw();
  // current toward viewer (⊙, wDir = 1): field lines go counterclockwise as seen from above
  const tx = S.wDir * dy / d, ty = -S.wDir * dx / d;
  return [b * tx, -G2.BE + b * ty, b];
}
const alpha2 = () => { const [bx, by] = Bvec2(); return Math.atan2(bx, -by) * 180 / Math.PI; }; // + = to the east
const beta2 = () => Math.atan2(S.wx - G2.wx, -(S.wy - G2.wy)) * 180 / Math.PI; // bearing of the compass from the wire
function setCompass2(x, y) {
  let dx = x - G2.wx, dy = y - G2.wy, d = Math.hypot(dx, dy);
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  const r = clamp(d / G2.ppc, G2.rmin, G2.rmax) * G2.ppc;
  S.wx = G2.wx + dx / d * r; S.wy = G2.wy + dy / d * r; dirty = true;
}
function setR2(cm) { const d = Math.hypot(S.wx - G2.wx, S.wy - G2.wy) || 1; setCompass2(G2.wx + (S.wx - G2.wx) / d * cm * G2.ppc, G2.wy + (S.wy - G2.wy) / d * cm * G2.ppc); }
function setBear2(deg) { const r = rCm2() * G2.ppc, a = deg * Math.PI / 180; setCompass2(G2.wx + r * Math.sin(a), G2.wy - r * Math.cos(a)); }
const dirWord2 = () => (S.wDir > 0 ? 'к нам ⊙' : 'от нас ⊗');

// ---------- lesson 3: electromagnet ----------
const NI = () => (S.cOn ? S.cN * S.cI : 0);
const clips3 = () => Math.min(40, Math.floor(NI() * (S.core ? 1 / 20 : 1 / 400) + 1e-9));
const nSide3 = () => (S.cDir > 0 ? 'L' : 'R'); // front current up → N on the left
const sideWord = s => (s === 'L' ? 'левый' : 'правый');
function answer3(s) {
  if (!S.cOn || S.cI <= 0) { toast('Сначала включите ток: без тока у катушки нет полюсов.'); return; }
  S.cAns = s;
  if (s === nSide3()) toast(`Верно: ${sideWord(s)} конец — северный полюс. Компас это подтверждает.`);
  else toast('Проверьте ещё раз: обхватите катушку правой рукой, пальцы — по току в витках. Куда смотрит большой палец?');
  renderTools(); update();
}

// ---------- lesson 4: DC motor ----------
const cosPhi = () => Math.cos(S.phi);
function sideCur() { // current direction in side A: +1 = toward viewer (⊙), −1 = away (⊗), 0 = brushes on the gap
  if (!S.mOn || S.mI <= 0) return 0;
  if (!S.comm) return S.mDir;
  const c = cosPhi();
  return Math.abs(c) < 0.08 ? 0 : S.mDir * Math.sign(c);
}
const torque = () => G4.K * S.mI * S.pol * sideCur() * cosPhi();
const rpmOf = om => om * 60 / (2 * Math.PI) * 10; // the picture runs 10 times slower than the real motor
const rpm4 = () => Math.abs(rpmOf(S.omS));
const cw4 = () => S.omS < 0 && Math.abs(S.om) > 0.2;
function stepMotor(dt) {
  if (drag && drag.id === 'frame') return;
  if (S.comm && S.mOn && S.mI > 0 && Math.abs(S.om) < 0.05 && Math.abs(cosPhi()) < 0.08) S.phi += 0.12; // a real armature has several coils, so it never sticks on the gap
  const n = 4, h = dt / n;
  for (let i = 0; i < n; i++) { S.om += (torque() - G4.b * S.om) * h; S.phi += S.om * h; }
  S.phi = ((S.phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  S.omS += (S.om - S.omS) * Math.min(1, dt / 0.8);
}

function model() {
  const id = LID();
  if (id === 'perm') return { kind: id, visL: S.visL, visR: S.visR, ans: S.ansOk };
  if (id === 'wire') return { kind: id, on: S.wOn, I: S.wI, beta: beta2(), alpha: alpha2(), r: rCm2() };
  if (id === 'coil') return { kind: id, on: S.cOn, core: S.core, clips: clips3(), I: S.cI, N: S.cN, ans: S.cAns === nSide3() && S.cOn };
  return { kind: id, on: S.mOn, comm: S.comm, cw: cw4(), rpm: rpm4() };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#2e3b57" stroke-width="3"/></pattern>
    <radialGradient id="metal" cx=".35" cy=".35"><stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#7d889e"/></radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b6"/><stop offset=".5" stop-color="#6b7488"/><stop offset="1" stop-color="#4a5163"/></linearGradient>
    ${[['O', '#ffb547'], ['C', '#72d4e8'], ['E', '#86e0a8']].map(([k, c]) => `<marker id="ar${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const ground = y => `<rect x="-2000" y="${y}" width="4520" height="1200" fill="#151e2e"/><rect x="-2000" y="${y}" width="4520" height="12" fill="url(#hatch)"/><path d="M-2000 ${y}H2520" stroke="#3a4762" stroke-width="2"/>`;
function needleSVG(x, y, a, L0) {
  const c = Math.cos(a), s = Math.sin(a), w = 3.6;
  const tip = [x + L0 * c, y + L0 * s], tail = [x - L0 * c, y - L0 * s], l = [x - w * s, y + w * c], r = [x + w * s, y - w * c];
  const P = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  return `<path d="M${P(tip)}L${P(l)}L${P(r)}z" fill="${NCOL}" stroke="${INK}" stroke-width=".8"/><path d="M${P(tail)}L${P(l)}L${P(r)}z" fill="#dfe5ee" stroke="${INK}" stroke-width=".8"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${INK}"/>`;
}
function compassSVG(x, y, a, R, id) {
  let h = `<g ${id ? `data-drag="${id}"` : ''}><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R + 10}" fill="transparent"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R}" fill="#1e2a40" stroke="#c8d0dd" stroke-width="2"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R - 4}" fill="rgba(169,214,228,.06)" stroke="#3a4762"/>`;
  for (let k = 0; k < 8; k++) { const t = k * Math.PI / 4; h += `<path d="M${(x + (R - 4) * Math.sin(t)).toFixed(1)} ${(y - (R - 4) * Math.cos(t)).toFixed(1)}L${(x + (R - 1) * Math.sin(t)).toFixed(1)} ${(y - (R - 1) * Math.cos(t)).toFixed(1)}" stroke="#5d6a86" stroke-width="1.2"/>`; }
  h += needleSVG(x, y, a, R - 6) + `</g>`;
  return h;
}
function northMark(x, y) {
  return `<path d="M${x} ${y + 22}V${y}" stroke="#8b96ad" stroke-width="1.5" marker-end="url(#arE)"/>` + T(x, y - 6, 10, '#86e0a8', 'С (север)', 'middle', halo);
}

// ---------- lesson 1 scene ----------
function permScene() {
  const g = G1;
  let h = '';
  if (S.filings) h += filingsSVG();
  if (S.lines) h += fieldLines();
  const rev = S.ansOk, nRight = S.hidN > 0;
  const colL = rev ? (nRight ? SCOL : NCOL) : '#8d97ab', colR = rev ? (nRight ? NCOL : SCOL) : '#8d97ab';
  h += `<g data-click="magnet"><rect x="${g.mx - g.hl}" y="${g.my - g.hh}" width="${g.hl}" height="${2 * g.hh}" rx="3" fill="${colL}" stroke="${INK}" stroke-width="1.5"/>
    <rect x="${g.mx}" y="${g.my - g.hh}" width="${g.hl}" height="${2 * g.hh}" rx="3" fill="${colR}" stroke="${INK}" stroke-width="1.5"/>
    <path d="M${g.mx - g.hl + 6} ${g.my - g.hh + 5}H${g.mx + g.hl - 6}" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round"/>`;
  if (rev) h += T(g.mx - g.hl / 2, g.my + 7, 20, INK, nRight ? 'S' : 'N', 'middle', 'font-weight="500"') + T(g.mx + g.hl / 2, g.my + 7, 20, INK, nRight ? 'N' : 'S', 'middle', 'font-weight="500"');
  else h += T(g.mx - g.hl / 2, g.my + 6, 16, '#3a4256', '?', 'middle') + T(g.mx + g.hl / 2, g.my + 6, 16, '#3a4256', '?', 'middle');
  h += `</g>`;
  h += T(g.mx - g.hl, g.my + g.hh + 18, 9.5, S.visL ? '#86e0a8' : '#8b96ad', S.visL ? 'левый конец ✓' : 'левый конец', 'middle', halo);
  h += T(g.mx + g.hl, g.my + g.hh + 18, 9.5, S.visR ? '#86e0a8' : '#8b96ad', S.visR ? 'правый конец ✓' : 'правый конец', 'middle', halo);

// ---------- lesson 2 scene ----------
function wireScene(tm) {

function hlBox(id) {

  }
  if (lid === 'wire') return ({ wire: [G2.wx - 16, G2.wy - 16, 32, 32], compass: [S.wx - 22, S.wy - 22, 44, 44], rings: [G2.wx - 50, G2.wy - 50, 100, 100], board: [G2.wx - 206, G2.wy - 206, 412, 412], north: [440, 296, 60, 64] })[id];
  if (lid === 'coil') return ({ coil: [G3.x0 - 8, G3.cy - G3.R - 8, G3.x1 - G3.x0 + 16, 2 * G3.R + 16], core: [G3.cx0 - 6, G3.cy - 22, G3.cx1 - G3.cx0 + 12, 44], bat: [230, 76, 60, 44], key: [298, 76, 60, 44], clips: [G3.cx0 - 10, G3.cy + 16, G3.cx1 - G3.cx0 + 20, 100], compass: [G3.comp[0] - 24, G3.comp[1] - 24, 48, 48], cur: [G3.x0, G3.cy - 24, G3.x1 - G3.x0 + 20, 48] })[id];

}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = bg();
  if (id === 'perm') h += permScene(t);
  else if (id === 'wire') h += wireScene(t);
  else if (id === 'coil') h += coilScene(t);
  else h += motorScene(t);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 440, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 430 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const throttled = () => { const n = performance.now(); if (n - lastUpd > 120) { lastUpd = n; update(); } };
scene.addEventListener('pointerdown', e => {
  const cl = e.target.closest('[data-click]');
  if (cl) { act(cl.dataset.click); return; }
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  const p = toSvg(e), id = el.dataset.drag;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  scene.classList.add('grabbing');
  if (id === 'compass') drag = { id, dx: p.x - (LID() === 'perm' ? S.cpx : S.wx), dy: p.y - (LID() === 'perm' ? S.cpy : S.wy) };
  else if (id === 'frame') { drag = { id, a0: Math.atan2(-(p.y - G4.cy), p.x - G4.cx) - S.phi }; S.om = 0; S.omS = 0; }
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSvg(e);
  if (drag.id === 'compass') {
    if (LID() === 'perm') setCompass1(p.x - drag.dx, p.y - drag.dy); else setCompass2(p.x - drag.dx, p.y - drag.dy);
    throttled();
  } else if (drag.id === 'frame') { S.phi = Math.atan2(-(p.y - G4.cy), p.x - G4.cx) - drag.a0; dirty = true; }
});
const endDrag = () => {
  if (!drag) return;
  drag = null; scene.classList.remove('grabbing');
  update();
};
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

let last = performance.now(), acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (LID() === 'motor') {
    stepMotor(dt);
    if (Math.abs(S.om) > 1e-3 || drag) dirty = true;
    acc += dt; if (acc > 0.25) { acc = 0; update(); }
  }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

  const sep = '<span class="sep"></span>';
  let h = '';

  if (id === 'wire') h = B('key', S.wOn ? 'Разомкнуть' : 'Замкнуть', S.wOn, 'rec') + B('dir', 'Ток: ' + (S.wDir > 0 ? '⊙' : '⊗')) + B('i-', 'I −') + B('i+', 'I +') + sep + B('fil', 'Опилки', S.wFil) + B('north', 'Компас на север');
  if (id === 'coil') h = B('key', S.cOn ? 'Выключить' : 'Включить', S.cOn, 'rec') + B('core', 'Сердечник', S.core) + B('n-', 'Витки −') + B('n+', 'Витки +') + B('i-', 'I −') + B('i+', 'I +') + B('flip', 'Ток ⇄') + sep + B('ansL', 'N слева', S.cAns === 'L') + B('ansR', 'N справа', S.cAns === 'R');
  if (id === 'motor') h = B('key', S.mOn ? 'Выключить' : 'Включить', S.mOn, 'rec') + B('comm', 'Коллектор', S.comm) + B('flip', 'Батарея ⇄') + B('pol', 'Магнит ⇄') + B('i-', 'I −') + B('i+', 'I +');
  tb.innerHTML = h;
}
function act(a) {
  const id = LID();
  if (id === 'perm') {
    if (a === 'filings') { S.filings = !S.filings; if (S.filings) toast('Опилки выстроились вдоль магнитных линий. Гуще всего они у полюсов.'); }
    else if (a === 'lines') { S.lines = !S.lines; if (S.lines) toast('Снаружи магнита линии идут от N к S. Стрелки на линиях — подсказка для ответа.'); }
    else if (a === 'ansL') return answer1(-1);
    else if (a === 'ansR') return answer1(1);
    else if (a === 'magnet') { toast(S.ansOk ? 'Северный полюс красный, южный синий.' : 'Маркировки нет. Определите полюсы компасом.'); return; }
    else if (a === 'reset') { S.cpx = 120; S.cpy = 320; }
    renderTools(); buildScheme(); update(); return;
  }
  if (id === 'wire') {
    if (a === 'key') { S.wOn = !S.wOn; if (S.wOn) toast('Цепь замкнута: по проводу идёт ток. Посмотрите на стрелку компаса.'); }
    else if (a === 'dir' || a === 'wire') S.wDir = -S.wDir;
    else if (a === 'dirP') S.wDir = 1;
    else if (a === 'dirN') S.wDir = -1;
    else if (a === 'i-' || a === 'i+') S.wI = clamp(Math.round((S.wI + (a === 'i+' ? 0.5 : -0.5)) * 10) / 10, 0, 5);
    else if (a === 'fil') S.wFil = !S.wFil;
    else if (a === 'north') setBear2(0);
    else if (/^b-/.test(a)) setBear2(+a.slice(2));
    renderTools(); buildScheme(); update(); return;
  }
  if (id === 'coil') {
    if (a === 'key') S.cOn = !S.cOn;
    else if (a === 'core') { S.core = !S.core; toast(S.core ? 'Железный сердечник внутри: он намагничивается и усиливает поле во много раз.' : 'Сердечник вынут: осталась пустая катушка.'); }
    else if (a === 'n-' || a === 'n+') S.cN = clamp(S.cN + (a === 'n+' ? 50 : -50), 50, 300);
    else if (/^n\d/.test(a)) S.cN = +a.slice(1);
    else if (a === 'i-' || a === 'i+') S.cI = clamp(Math.round((S.cI + (a === 'i+' ? 0.1 : -0.1)) * 10) / 10, 0, 3);
    else if (a === 'flip') { S.cDir = -S.cDir; toast('Полюсы батареи поменяли местами: ток в витках идёт в другую сторону.'); }
    else if (a === 'ansL') return answer3('L');
    else if (a === 'ansR') return answer3('R');
    renderTools(); buildScheme(); update(); return;
  }
  if (a === 'key') { S.mOn = !S.mOn; if (S.mOn && !S.comm) toast('Без коллектора рамка повернётся и остановится поперёк поля. Посмотрите на силы.'); }
  else if (a === 'comm') { S.comm = !S.comm; if (S.comm) toast('Коллектор каждые пол-оборота меняет направление тока в рамке.'); if (Math.abs(S.om) < 0.3 && Math.abs(cosPhi()) < 0.15) S.phi += 0.5; }
  else if (a === 'flip') S.mDir = -S.mDir;
  else if (a === 'pol') S.pol = -S.pol;
  else if (a === 'i-' || a === 'i+') S.mI = clamp(Math.round((S.mI + (a === 'i+' ? 0.25 : -0.25)) * 100) / 100, 0, 3);
  dirty = true; renderTools(); buildScheme(); update();
}

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'perm') return [t(S.visL, 'левый конец'), t(S.visR, 'правый конец'), t(S.ansOk, 'ответ')].join(' · ');
  if (id === 'wire') return [t(S.wOn && S.wI > 0, 'ток'), t(Math.abs(beta2()) <= 30, 'компас на севере'), `отклонение ${fmt(alpha2(), 0)}° / 45°`].join(' · ');

    { id: 'forces', icon: ICON.forces, name: 'Силы Ампера', spec: 'Оранжевые стрелки. На стороны рамки с противоположным током они действуют в разные стороны и поворачивают её.' },
    { id: 'comm', icon: ICON.comm, name: 'Коллектор', spec: 'Два полукольца на валу. Каждые пол-оборота меняет направление тока в рамке. Нажмите, чтобы включить или убрать.' },
    { id: 'brushes', icon: ICON.brushes, name: 'Щётки', spec: 'Графитовые пластинки. Скользят по коллектору и подводят к рамке ток.' },
    { id: 'bat', icon: ICON.bat, name: 'Батарея и ключ', spec: 'Источник тока. Нажмите на батарею, чтобы поменять её полюсы.' }];
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'perm') {
    const ni = nearInfo(), sideW = ni.side < 0 ? 'левого' : 'правого';
    const obs = ni.d > 70 ? 'компас далеко от магнита' : ni.toward ? 'красный (N) конец повёрнут к магниту' : ni.away ? 'красный (N) конец повёрнут от магнита' : 'стрелка повёрнута вбок — подойдите ближе к торцу';
    return `<h2>Как узнать полюс компасом</h2><div class="formula">N ↔ S притягиваются</div><p class="note">Стрелка — маленький магнит. Её северный конец (красный) тянется к южному полюсу магнита и отворачивается от северного.</p>
      <h3>Наблюдение сейчас</h3><div class="steps">` + step('ближе всего к', `${sideW} концу`) + step('расстояние', `${fmt(ni.d / 10, 1)} см`) + step('стрелка', obs) + `</div>
      <h3>Рассуждение</h3><div class="steps">` + step('1. N стрелки смотрит на конец', '→ этот конец S') + step('2. N стрелки смотрит от конца', '→ этот конец N') +
      step('3. у магнита два полюса', 'второй конец — противоположный') +
      step('ответ', S.ansOk ? `N — ${S.hidN > 0 ? 'правый' : 'левый'} конец` : 'сделайте вывод сами', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Вблизи сильного магнита поле Земли почти не заметно. Поэтому компас для проверки подносят близко к торцу.</p>`;
  }
  if (id === 'wire') {
    const r = rCm2(), b = Bw(), al = alpha2();
    return `<h2>Поле прямого тока</h2><div class="formula">B = 2·10⁻⁷ · I / r</div><p class="note">Эту формулу проходят в старших классах, здесь она нужна для оценки. B — магнитная индукция в теслах (Тл), I — ток в амперах, r — расстояние в метрах.</p>
      <h3>Сейчас</h3><div class="steps">` + step('ток', S.wOn ? `${fmt(S.wI, 1)} А, ${dirWord2()}` : 'ключ разомкнут, I = 0') + step('r', `${fmt(r, 1)} см = ${fmt(r / 100, 3)} м`) +
      step('B тока', S.wOn ? `2·10⁻⁷ · ${fmt(S.wI, 1)} / ${fmt(r / 100, 3)} = ${fmt(b * 1e6, 1)} мкТл` : '0') + step('B Земли (горизонтальная часть)', '≈ 20 мкТл, на север') +
      step('стрелка отклонилась', `${fmt(al, 0)}° ${al > 0.5 ? 'на восток' : al < -0.5 ? 'на запад' : ''}`, 'sum') + `</div>
      <h3>Когда компас точно к северу от провода</h3><div class="steps">` + step('поле тока', 'направлено на восток или запад') + step('tg α = B тока / B Земли', S.wOn ? `${fmt(b * 1e6, 1)} / 20 = ${fmt(b / G2.BE, 2)}` : '0') +
      step('для 45° нужно', 'B тока = B Земли = 20 мкТл') + step('при I = 5 А', 'r ≤ 2·10⁻⁷·5 / 2·10⁻⁵ = 0,05 м = 5 см', 'sum') + `</div>
      <h3>Направление — правило буравчика</h3><div class="steps">` + step('ток к нам ⊙', 'линии против часовой стрелки') + step('ток от нас ⊗', 'линии по часовой стрелке') + `</div>`;
  }
  if (id === 'coil') {
    const ni = NI(), k = S.core ? 20 : 400;
    return `<h2>Сила электромагнита</h2><div class="formula">поле ~ N · I</div><p class="note">Поле катушки растёт с числом витков N и током I. Произведение N·I называют ампер-витками. Сердечник усиливает поле в сотни раз.</p>
      <h3>Сейчас</h3><div class="steps">` + step('витков N', S.cN) + step('ток I', S.cOn ? `${fmt(S.cI, 1)} А` : '0 (выключено)') + step('N·I', `${S.cN} · ${S.cOn ? fmt(S.cI, 1) : 0} = ${Math.round(ni)} А`) +
      step('сердечник', S.core ? 'есть' : 'нет') + step('в нашей модели', `1 скрепка на ${k} А·витков`) + step('скрепок', `${Math.round(ni)} / ${k} = ${clips3()}${clips3() >= 40 ? ' (больше не помещается)' : ''}`, 'sum') + `</div>
      <h3>Цель: 15 скрепок при I ≤ 1,5 А</h3><div class="steps">` + step('нужно N·I', `15 · ${k} = ${15 * k} А`) + step('при I = 1,5 А', `N ≥ ${15 * k} / 1,5 = ${Math.round(15 * k / 1.5)} витков`) + step('витков у нас максимум', '300', 'sum') + `</div>
      <h3>Полюс — правило правой руки</h3><div class="steps">` + step('4 пальца', 'по току в витках') + step('большой палец', 'на северный полюс N') +
      step('ток на передней стороне', S.cOn ? (S.cDir > 0 ? 'вверх' : 'вниз') : 'нет тока') + `</div>`;
  }
  const F = S.mOn ? 0.4 * S.mI : 0;
  return `<h2>Сила Ампера и двигатель</h2><div class="formula">F = B · I · L · n</div><p class="note">Эту формулу подробно изучают в 9–10 классе. B = 0,1 Тл — поле магнита, L = 4 см — длина стороны рамки, n = 100 витков.</p>
    <h3>Сейчас</h3><div class="steps">` + step('ток I', S.mOn ? `${fmt(S.mI, 2)} А` : '0 (выключено)') + step('F = B·I·L·n', `0,1 · ${S.mOn ? fmt(S.mI, 2) : 0} · 0,04 · 100 = ${fmt(F, 2)} Н`) +
    step('ширина рамки', '3 см') + step('наибольший момент M = F · 0,03 м', `${fmt(F * 0.03 * 1000, 1)} мН·м`) +
    step('коллектор', S.comm ? 'есть: ток в рамке меняется каждые пол-оборота' : 'нет: рамка встанет поперёк поля') + step('обороты', `${Math.round(rpm4())} об/мин`, 'sum') + `</div>
    <h3>Куда крутится</h3><div class="steps">` + step('батарея ⇄', 'направление меняется') + step('магнит ⇄', 'направление меняется') + step('оба сразу', 'направление прежнее') +
    step('сейчас', Math.abs(S.om) < 0.3 ? 'рамка стоит' : S.om < 0 ? 'по часовой стрелке' : 'против часовой стрелки', 'sum') + `</div>
    <p class="note" style="margin-top:10px">В модели скорость растёт пропорционально току: примерно 300 об/мин на каждый ампер. В настоящем моторе её ограничивают ещё трение и нагрузка.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'perm') {
    const ni = nearInfo();
    el.innerHTML = `<div class="k">Компас</div><div class="v">${ni.d > 70 ? 'на север' : ni.toward ? 'N к магниту' : ni.away ? 'N от магнита' : 'вбок'}</div>` +
      `<div class="lr"><span>левый</span><span class="${S.visL ? 'ok' : ''}">${fmt(distEnd(-1) / 10, 1)} см</span></div><div class="lr"><span>правый</span><span class="${S.visR ? 'ok' : ''}">${fmt(distEnd(1) / 10, 1)} см</span></div>`;
  } else if (id === 'wire') {
    const al = alpha2();
    el.innerHTML = `<div class="k">Отклонение</div><div class="v ${al >= 45 && Math.abs(beta2()) <= 30 ? 'ok' : ''}">${fmt(al, 0)}° ${al > 0.5 ? 'В' : al < -0.5 ? 'З' : ''}</div>` +
      `<div class="lr"><span>I</span><span>${S.wOn ? fmt(S.wI, 1) : 0} А</span></div><div class="lr"><span>r</span><span>${fmt(rCm2(), 1)} см</span></div><div class="lr"><span>B тока</span><span>${fmt(Bw() * 1e6, 1)} мкТл</span></div>`;
  } else if (id === 'coil') {
    el.innerHTML = `<div class="k">Поднято скрепок</div><div class="v ${clips3() >= 15 ? 'ok' : ''}">${clips3()}</div>` +
      `<div class="lr"><span>N·I</span><span>${Math.round(NI())} А</span></div><div class="lr"><span>I</span><span class="${S.cI > 1.5 ? 'bad' : ''}">${fmt(S.cI, 1)} А</span></div><div class="lr"><span>витков</span><span>${S.cN}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Обороты</div><div class="v ${S.done.motor ? 'ok' : ''}">${Math.round(rpm4())} об/мин</div>` +
      `<div class="lr"><span>I</span><span>${S.mOn ? fmt(S.mI, 2) : 0} А</span></div><div class="lr"><span>вращение</span><span>${Math.abs(S.om) < 0.3 ? 'стоит' : S.om < 0 ? 'по час.' : 'против'}</span></div><div class="lr"><span>коллектор</span><span>${S.comm ? 'есть' : 'нет'}</span></div>`;
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как магнит и ток крутят моторы!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  perm: '<rect x="8" y="10" width="22" height="10" fill="#e0564a"/><rect x="30" y="10" width="22" height="10" fill="#4a86d6"/><circle cx="60" cy="15" r="5" fill="none" stroke="#c8d0dd"/><path d="M57 15h6" stroke="#e0564a" stroke-width="2"/>',
  wire: '<circle cx="33" cy="15" r="4" fill="#d08a52"/><circle cx="33" cy="15" r="9" fill="none" stroke="#72d4e8" stroke-dasharray="2 2"/><circle cx="33" cy="15" r="14" fill="none" stroke="#72d4e8" stroke-dasharray="2 2"/>',
  coil: '<rect x="12" y="11" width="40" height="8" fill="#6b7488"/><path d="M16 6l3 18M22 6l3 18M28 6l3 18M34 6l3 18M40 6l3 18M46 6l3 18" stroke="#d08a52" stroke-width="1.6"/>',
  motor: '<rect x="4" y="5" width="10" height="20" fill="#e0564a"/><rect x="52" y="5" width="10" height="20" fill="#4a86d6"/><path d="M22 24L44 6" stroke="#d08a52" stroke-width="2.5"/><circle cx="33" cy="15" r="4" fill="none" stroke="#e6c14a" stroke-width="2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'perm') { const ni = nearInfo(); now = `Полосовой магнит без маркировки полюсов лежит на столе. Компас стоит в ${fmt(distEnd(-1) / 10, 1)} см от левого конца и в ${fmt(distEnd(1) / 10, 1)} см от правого; сейчас его стрелка ${ni.d > 70 ? 'смотрит в основном на север (поле Земли)' : ni.toward ? `повёрнута северным (красным) концом к ${ni.side < 0 ? 'левому' : 'правому'} концу магнита` : ni.away ? `повёрнута северным (красным) концом от ${ni.side < 0 ? 'левого' : 'правого'} конца магнита` : 'повёрнута вбок'}. Компас подносили к левому концу: ${S.visL ? 'да' : 'нет'}, к правому: ${S.visR ? 'да' : 'нет'}. Опилки ${S.filings ? 'показаны' : 'скрыты'}, магнитные линии ${S.lines ? 'показаны' : 'скрыты'}. Ответ ученика: ${S.ans ? `${S.ans < 0 ? 'левый' : 'правый'} конец — N, ${S.ansOk ? 'верно' : 'неверно'}` : 'ещё не дан'}. Какой конец северный, не называй — наведи вопросами: каким полюсом является красный конец стрелки и какие полюсы притягиваются.`; }
  if (id === 'wire') now = `Вертикальный провод, вид сверху, север вверху. Ключ ${S.wOn ? 'замкнут' : 'разомкнут'}, ток ${fmt(S.wI, 1)} А, направление ${dirWord2()}. Компас на расстоянии ${fmt(rCm2(), 1)} см от провода, азимут от провода ${fmt(beta2(), 0)}° (0° — север, 90° — восток). Поле тока ${fmt(Bw() * 1e6, 1)} мкТл, поле Земли 20 мкТл. Стрелка отклонилась на ${fmt(alpha2(), 0)}° (плюс — на восток). Цель: компас к северу от провода (±30°), отклонение на восток не меньше 45°. Направление тока не называй — наведи на правило буравчика и на то, что поле сильнее ближе к проводу и при большем токе.`;
  if (id === 'coil') now = `Катушка ${S.cN} витков, ток ${S.cOn ? `${fmt(S.cI, 1)} А` : 'выключен'} (на ползунке ${fmt(S.cI, 1)} А), железный сердечник ${S.core ? 'вставлен' : 'вынут'}. Ампер-витки N·I = ${Math.round(NI())} А, поднято скрепок: ${clips3()} (в модели 1 скрепка на ${S.core ? 20 : 400} А·витков). На передней стороне витков ток идёт ${S.cDir > 0 ? 'вверх' : 'вниз'}. Ответ ученика о северном полюсе: ${S.cAns ? `${sideWord(S.cAns)} конец — ${S.cAns === nSide3() ? 'верно' : 'неверно'}` : 'ещё не дан'}. Цель: не меньше 15 скрепок при токе не больше 1,5 А и верно найденный полюс. Полюс не называй — наведи на правило правой руки.`;
  if (id === 'motor') now = `Модель двигателя постоянного тока: рамка между полюсами магнита (${S.pol > 0 ? 'N слева, S справа' : 'S слева, N справа'}), видна с торца. Ключ ${S.mOn ? 'замкнут' : 'разомкнут'}, ток ${fmt(S.mI, 2)} А, батарея ${S.mDir > 0 ? 'в исходном положении' : 'перевёрнута'}. Коллектор ${S.comm ? 'есть (два полукольца)' : 'нет (сплошное кольцо, ток в рамке не переключается)'}. Рамка ${Math.abs(S.om) < 0.3 ? 'стоит' : S.om < 0 ? 'крутится по часовой стрелке' : 'крутится против часовой стрелки'}, ${Math.round(rpm4())} об/мин (модель: около 300 об/мин на ампер). Сила Ампера на сторону рамки ${fmt(S.mOn ? 0.4 * S.mI : 0, 2)} Н. Цель: непрерывное вращение по часовой стрелке не меньше 500 об/мин. Помоги понять, зачем коллектор и что меняет направление вращения.`;
  return [
    `Раздел: физика, 8 класс, тема «Магнитное поле». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { perm: 'Почему нельзя получить магнит с одним полюсом?', wire: 'Как работает правило буравчика?', coil: 'Почему железный сердечник так усиливает магнит?', motor: 'Зачем двигателю коллектор?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
