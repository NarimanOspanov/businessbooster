<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 8 класс: теорема Пифагора, подобные треугольники, синус, косинус и тангенс острого угла.">
<title>Пифагор и подобие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="4" y="14" width="10" height="10" fill="rgba(255,181,71,.15)" stroke="var(--force)" stroke-width="1.4"/><rect x="14" y="24" width="10" height="10" fill="rgba(114,212,232,.15)" stroke="var(--arm)" stroke-width="1.4"/><path d="M14 14L24 24L34 14L24 4Z" fill="rgba(195,155,255,.15)" stroke="#c39bff" stroke-width="1.4"/><path d="M14 24V14L24 24Z" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Математика · Пифагор и подобие</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж: прямоугольные и подобные треугольники. Вершины можно двигать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-math-pyth';
const f1c = v => String(Math.round(v * 10) / 10).replace('.', ',');
const f2c = v => v.toFixed(2).replace('.', ',');
const f3c = v => v.toFixed(3).replace('.', ',');
const RAD = Math.PI / 180;

const LESSONS = [
  { id: 'pyth', title: 'Теорема Пифагора',
    text: ['В прямоугольном треугольнике стороны, которые образуют прямой угол, называют катетами. Сторону напротив прямого угла называют гипотенузой. Гипотенуза — самая длинная сторона.',
           'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов, c² = a² + b². На чертеже это видно: площадь квадрата на гипотенузе равна сумме площадей квадратов на катетах. Отсюда c = √(a² + b²), а катет a = √(c² − b²).',
           'Доказательство перекладкой: возьмём два одинаковых квадрата со стороной a + b и в каждый положим четыре равных треугольника. Слева останется квадрат c², справа — квадраты a² и b². Значит, c² = a² + b². Верно и обратное: если c² = a² + b², то треугольник прямоугольный.'],
    why: 'Строитель проверяет прямой угол «правилом 3-4-5»: отмеряет 3 м вдоль одной стены и 4 м вдоль другой. Если между метками ровно 5 м, угол прямой — так размечают фундамент, стены и плитку. Электрик и сантехник считают по Пифагору длину кабеля или трубы, идущей наискосок. Диагональ телевизора в дюймах — тоже гипотенуза: её находят по ширине и высоте экрана. А приложение такси считает расстояние по прямой между двумя точками на карте той же формулой.',
    task: 'Двигайте концы катетов (длины — целые сантиметры). Найдите две разные пифагоровы тройки: такие катеты, при которых гипотенуза тоже получается целым числом.',
    hint: 'Ищите, когда a² + b² — точный квадрат: 25, 100, 169… Начните с катета 3 или 6. Кнопка «Доказательство» показывает, почему c² = a² + b².',
    stage: 'Тащите точки A и B или жмите кнопки внизу.',
    a: 2, b: 3,
    check: m => m.found >= 2 },
  { id: 'sim', title: 'Подобные треугольники',
    text: ['Треугольники подобны, если углы одного равны углам другого, а сходственные стороны пропорциональны: A₁B₁ : AB = A₁C₁ : AC = B₁C₁ : BC = k. Число k — коэффициент подобия. Пишут △A₁B₁C₁ ∼ △ABC.',
           'Признаки подобия: по двум углам; по двум сторонам и углу между ними (стороны пропорциональны); по трём пропорциональным сторонам. Самый удобный — первый: хватает двух равных углов, третий равен сам собой, ведь сумма углов 180°.',
           'Периметры подобных треугольников относятся как k, а площади — как k². Увеличили треугольник в 2 раза — площадь выросла в 4 раза.'],
    why: 'Архитектор чертит план в масштабе 1 : 100 — каждая комната на бумаге подобна настоящей. Дизайнер и фотограф увеличивают картинку, сохраняя пропорции, иначе лица «поплывут». Геодезист находит высоту дерева или здания по тени: палка и её тень, здание и его тень дают подобные треугольники. А площадь растёт как k²: если комната вдвое длиннее и вдвое шире, плитки и краски для пола нужно вчетверо больше — это важно, когда считаешь смету.',
    task: 'Постройте △A₁B₁C₁, подобный △ABC, с коэффициентом k = 1,5: углы те же, стороны в 1,5 раза длиннее. Посмотрите, во сколько раз выросла площадь.',
    hint: 'По первому признаку хватит двух равных углов: ∠A₁ = ∠A и ∠B₁ = ∠B. Сторона A₁B₁ = 1,5 · AB. Кнопка «Наложить» показывает, совпала ли форма.',
    stage: 'Меняйте углы и сторону A₁B₁ кнопками внизу или во вкладке «Схема».',
    A1: 40, B1: 85, L: 5,
    check: m => m.sim && Math.abs(m.k - 1.5) < 1e-9 },
  { id: 'trig', title: 'Синус, косинус, тангенс',
    text: ['Возьмём прямоугольный треугольник с острым углом α. Синус α — отношение противолежащего катета к гипотенузе. Косинус α — отношение прилежащего катета к гипотенузе. Тангенс α — отношение противолежащего катета к прилежащему.',
           'Эти отношения зависят только от угла, а не от размера треугольника. Все прямоугольные треугольники с углом α подобны по двум углам, поэтому отношения их сторон одинаковые. Значит, sin, cos и tg можно занести в таблицу или посчитать на калькуляторе.',
           'Синус и косинус острого угла меньше 1: катет короче гипотенузы. Из теоремы Пифагора следует основное тождество sin²α + cos²α = 1. А ещё tg α = sin α : cos α.'],
    why: 'Строитель задаёт уклон крыши или пандуса через тангенс: высота подъёма делённая на длину основания. Геодезист измеряет угол на верх вышки и расстояние до неё: высота = расстояние · tg α, и лезть наверх не нужно. Пилот заходит на посадку по углу глиссады, инженер раскладывает силу на составляющие через sin и cos. На этих же функциях работают GPS, 3D-игры и анимация.',
    task: 'Меняя угол α, найдите угол, у которого sin α = 0,5, и угол, у которого tg α = 1. Поменяйте гипотенузу c — изменятся ли отношения?',
    hint: 'sin α = 0,5 — противолежащий катет вдвое короче гипотенузы. tg α = 1 — катеты равны, треугольник равнобедренный.',
    stage: 'Тащите вершину B или меняйте α и c кнопками внизу.',
    al: 35, c: 6,
    check: m => m.found >= 2 && m.cSeen },
];

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            a: 2, b: 3, found1: new Set(), proof: false, fix1: null,
            A1: 40, B1: 85, L: 5, ghost: false,
            al: 35, c: 6, found3: new Set(), cSeen: false, twin: false };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const PT = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * RAD), y: c.y - r * Math.sin(deg * RAD) });
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

// ---------- lesson 1: Pythagoras ----------
function setLegs(a, b) {
  a = clamp(Math.round(a), 1, 12); b = clamp(Math.round(b), 1, 12);
  if (a === S.a && b === S.b) return;
  S.a = a; S.b = b;
  const c2 = a * a + b * b, c = Math.round(Math.sqrt(c2));
  if (c * c === c2) {
    const key = Math.min(a, b) + '-' + Math.max(a, b);
    if (!S.found1.has(key)) { S.found1.add(key); toast(`Пифагорова тройка: ${Math.min(a, b)}, ${Math.max(a, b)}, ${c}!`); }
  }
  update();
}
function g1() {
  const a = S.a, b = S.b; let s, ox, oy;
  if (S.fix1) ({ s, ox, oy } = S.fix1);
  else { s = Math.min(34, 470 / (2 * a + b), 262 / (a + 2 * b)); ox = 260 - s * b / 2; oy = 150 + s * a / 2; }
  return { s, ox, oy, P: p => ({ x: ox + p.x * s, y: oy - p.y * s }) };
}

// ---------- lesson 2: similarity ----------
const ORIG = { L: 4, A: 50, B: 70 };
function triPts(L, A, B) {
  const sAB = Math.sin((A + B) * RAD), AC = L * Math.sin(B * RAD) / sAB, BC = L * Math.sin(A * RAD) / sAB;
  return { A: { x: 0, y: 0 }, B: { x: L, y: 0 }, C: { x: AC * Math.cos(A * RAD), y: AC * Math.sin(A * RAD) }, AC, BC, L, aA: A, aB: B };
}
const T0 = triPts(ORIG.L, ORIG.A, ORIG.B);
function setSim(A, B, L) {
  A = clamp(Math.round(A / 5) * 5, 20, 110); B = clamp(Math.round(B / 5) * 5, 20, 110);
  if (A + B > 160) B = 160 - A;
  L = clamp(Math.round(L * 2) / 2, 2, 8);
  if (A !== S.A1 || B !== S.B1 || L !== S.L) { S.A1 = A; S.B1 = B; S.L = L; update(); }
}
function g2(T1) {
  const mn = Math.min(0, T1.C.x), mx = Math.max(T1.L, T1.C.x);
  const s = Math.min(28, 205 / (mx - mn), 205 / Math.max(T1.C.y, T0.C.y));
  return { s, y0: 258, oL: 130 - s * 2, oR: 385 - s * (mn + mx) / 2 };
}

// ---------- lesson 3: trig ratios ----------
const A3 = { x: 90, y: 268 }, SC3 = 25;
function setTrig(al, c) {
  al = clamp(Math.round(al), 5, 85); c = clamp(Math.round(c * 2) / 2, 2, 10);
  if (al === S.al && c === S.c) return;
  if (c !== S.c) S.cSeen = true;
  S.al = al; S.c = c;
  if (al === 30 && !S.found3.has('sin')) { S.found3.add('sin'); toast('Нашли: противолежащий катет ровно вдвое короче гипотенузы, sin α = 0,5.'); }
  if (al === 45 && !S.found3.has('tg')) { S.found3.add('tg'); toast('Нашли: катеты равны, tg α = 1.'); }
  update();
}

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'pyth') {
    const a = S.a, b = S.b, c2 = a * a + b * b, c = Math.sqrt(c2), ci = Math.round(c);
    return { kind: 'pyth', a, b, c2, c, int: ci * ci === c2, found: S.found1.size, proof: S.proof };
  }
  if (id === 'sim') {
    const T1 = triPts(S.L, S.A1, S.B1), k = S.L / ORIG.L;
    const S0 = 0.5 * ORIG.L * T0.C.y, S1 = 0.5 * S.L * T1.C.y;
    return { kind: 'sim', T1, A1: S.A1, B1: S.B1, C1: 180 - S.A1 - S.B1, L: S.L, k, rb: T1.AC / T0.AC, ra: T1.BC / T0.BC,
             sim: S.A1 === ORIG.A && S.B1 === ORIG.B, S0, S1, ghost: S.ghost };
  }
  const al = S.al, c = S.c, sn = Math.sin(al * RAD), cs = Math.cos(al * RAD);
  return { kind: 'trig', al, c, a: c * sn, b: c * cs, sin: sn, cos: cs, tg: sn / cs, found: S.found3.size, cSeen: S.cSeen, twin: S.twin };
}

// ---------- drawing ----------
const DIM = { pyth: [520, 300], sim: [520, 300], trig: [520, 300] };
const scene = $('#scene');
const f1 = v => v.toFixed(1);
const txt = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" ${extra}>${s}</text>`;
const say = (x, y, s, fs, fill, extra = '') => `<text x="${x}" y="${y}" font-size="${fs}" fill="${fill}" text-anchor="middle" font-family="Golos Text,sans-serif" ${extra}>${s}</text>`;
const line = (p, q, st, w, extra = '') => `<path d="M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
const poly = (pts, fill, st, w, extra = '') => `<path d="M${pts.map(p => f1(p.x) + ' ' + f1(p.y)).join('L')}Z" fill="${fill}" stroke="${st}" stroke-width="${w}" stroke-linejoin="round" ${extra}/>`;
const sector = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(c.x)} ${f1(c.y)}L${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}Z`; };
const knob = (id, p, col, part) => `<g data-drag="${id}" data-part="${part}"><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="22" fill="transparent"/><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="9" fill="${col}" stroke="${INK}" stroke-width="2"/></g>`;
const CA = '#ffb547', CB = '#72d4e8', CC = '#c39bff', OK = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad';

function grid(P, x0, x1, y0, y1, col) {
  let d = '';
  for (let i = x0 + 1; i < x1; i++) { const p = P({ x: i, y: y0 }), q = P({ x: i, y: y1 }); d += `M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}`; }
  for (let j = y0 + 1; j < y1; j++) { const p = P({ x: x0, y: j }), q = P({ x: x1, y: j }); d += `M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}`; }
  return d ? `<path d="${d}" stroke="${col}" stroke-width="1" fill="none"/>` : '';
}

function drawPyth() {
  const m = model();
  if (m.proof) return drawProof(m);
  const a = m.a, b = m.b, { s, P } = g1(), C = P({ x: 0, y: 0 }), A = P({ x: b, y: 0 }), B = P({ x: 0, y: a });
  const lbl = (cen, side, name, val, col, sub) => side * s >= 64 ? txt(cen.x, cen.y - 2, `${name} = ${val}`, 12.5, col, 'font-weight="600"') + txt(cen.x, cen.y + 15, sub, 11, col)
    : txt(cen.x, cen.y + 4, val, side * s >= 40 ? 12.5 : 10, col, 'font-weight="600"');
  let h = '';
  h += `<g data-part="sqb" pointer-events="none">${poly([C, A, P({ x: b, y: -b }), P({ x: 0, y: -b })], 'rgba(114,212,232,.12)', CB, 1.6)}${grid(P, 0, b, -b, 0, 'rgba(114,212,232,.3)')}${lbl(P({ x: b / 2, y: -b / 2 }), b, 'b²', b * b, CB, 'b = ' + b)}</g>`;
  h += `<g data-part="sqa" pointer-events="none">${poly([C, B, P({ x: -a, y: a }), P({ x: -a, y: 0 })], 'rgba(255,181,71,.12)', CA, 1.6)}${grid(P, -a, 0, 0, a, 'rgba(255,181,71,.3)')}${lbl(P({ x: -a / 2, y: a / 2 }), a, 'a²', a * a, CA, 'a = ' + a)}</g>`;
  const cc = m.int ? OK : CC;
  h += `<g data-part="sqc" pointer-events="none">${poly([A, B, P({ x: a, y: a + b }), P({ x: a + b, y: b })], m.int ? 'rgba(134,224,168,.14)' : 'rgba(195,155,255,.12)', cc, 1.6)}${lbl(P({ x: (a + b) / 2, y: (a + b) / 2 }), m.c, 'c²', m.c2, cc, m.int ? 'c = ' + Math.round(m.c) : 'c ≈ ' + f2c(m.c))}</g>`;
  h += `<g data-part="tri" pointer-events="none">${poly([C, A, B], 'rgba(232,236,244,.07)', FG, 2.2)}<path d="M${f1(C.x + 10)} ${f1(C.y)}V${f1(C.y - 10)}H${f1(C.x)}" fill="none" stroke="${FG}" stroke-width="1.2"/>`;
  h += '</g><g pointer-events="none">' + txt(C.x - 10, C.y + 15, 'C', 13.5, FG, 'font-weight="600"') + txt(A.x + 13, A.y + 16, 'A', 13.5, FG, 'font-weight="600"') + txt(B.x - 13, B.y - 8, 'B', 13.5, FG, 'font-weight="600"') + '</g>';
  h += knob('pA', A, CB, 'knobs') + knob('pB', B, CA, 'knobs');
  return h;
}

function drawProof(m) {
  const a = m.a, b = m.b, n = a + b, s = Math.min(20, 225 / n);
  const LL = { x: 250 - n * s, y: 150 + n * s / 2 }, RL = { x: 270, y: LL.y };
  const Q = O => (u, v) => ({ x: O.x + u * s, y: O.y - v * s });
  const L = Q(LL), R = Q(RL);
  const triF = 'rgba(232,236,244,.10)';
  let h = say(260, f1(LL.y - n * s - 12), 'два одинаковых квадрата (a + b) × (a + b), в каждом 4 равных треугольника', 11, MU);
  h += `<g data-part="proofL" pointer-events="none">${poly([L(0, 0), L(n, 0), L(n, n), L(0, n)], 'none', FG, 2)}` +
    poly([L(a, 0), L(n, a), L(b, n), L(0, b)], 'rgba(195,155,255,.22)', CC, 1.6) + txt(L(n / 2, n / 2).x, L(n / 2, n / 2).y + 5, 'c²', 15, CC, 'font-weight="600"') + '</g>';
  h += `<g data-part="tris" pointer-events="none">` + [[L(0, 0), L(a, 0), L(0, b)], [L(n, 0), L(n, a), L(a, 0)], [L(n, n), L(b, n), L(n, a)], [L(0, n), L(0, b), L(b, n)],
    [R(a, 0), R(n, 0), R(a, a)], [R(n, 0), R(n, a), R(a, a)], [R(0, a), R(a, a), R(0, n)], [R(a, a), R(a, n), R(0, n)]].map(t => poly(t, triF, MU, 1.2)).join('') + '</g>';
  h += `<g data-part="proofR" pointer-events="none">${poly([R(0, 0), R(n, 0), R(n, n), R(0, n)], 'none', FG, 2)}` +
    poly([R(0, 0), R(a, 0), R(a, a), R(0, a)], 'rgba(255,181,71,.2)', CA, 1.6) + poly([R(a, a), R(n, a), R(n, n), R(a, n)], 'rgba(114,212,232,.2)', CB, 1.6) +
    txt(R(a / 2, a / 2).x, R(a / 2, a / 2).y + 5, 'a²', a * s >= 26 ? 14 : 10, CA, 'font-weight="600"') + txt(R(a + b / 2, a + b / 2).x, R(a + b / 2, a + b / 2).y + 5, 'b²', b * s >= 26 ? 14 : 10, CB, 'font-weight="600"') + '</g>';
  h += `<g pointer-events="none">${txt(L(n / 2, 0).x, LL.y + 20, `c² = ${m.c2}`, 13, CC, 'font-weight="600"')}${txt(260, LL.y - n * s / 2 + 6, '=', 22, FG)}${txt(R(n / 2, 0).x, LL.y + 20, `a² + b² = ${a * a} + ${b * b}`, 13, FG, 'font-weight="600"')}</g>`;
  return h;
}

function drawSim() {
  const m = model(), T1 = m.T1, g = g2(T1), s = g.s;
  const map = (T, ox, k = 1) => ({ A: { x: ox + T.A.x * k * s, y: g.y0 - T.A.y * k * s }, B: { x: ox + T.B.x * k * s, y: g.y0 - T.B.y * k * s }, C: { x: ox + T.C.x * k * s, y: g.y0 - T.C.y * k * s } });
  const V0 = map(T0, g.oL), V1 = map(T1, g.oR);
  const tri = (V, T, sub, col, fill, part, angCol) => {
    let h = `<g data-part="${part}" pointer-events="none">${poly([V.A, V.B, V.C], fill, col, 2.2)}`;
    const G = { x: (V.A.x + V.B.x + V.C.x) / 3, y: (V.A.y + V.B.y + V.C.y) / 3 };
    const side = (p, q, val) => { const md = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 }, dx = md.x - G.x, dy = md.y - G.y, L = Math.hypot(dx, dy) || 1; return txt(md.x + dx / L * 13, md.y + dy / L * 13 + 4, f2c(val).replace(/(,d*?)0+$/, '$1').replace(/,$/, ''), 11, MU); };
    h += side(V.A, V.B, T.L) + side(V.A, V.C, T.AC) + side(V.B, V.C, T.BC) + '</g>';
    const aC = 180 - T.aA - T.aB;
    h += `<g data-part="angs" pointer-events="none">`;
    const arc = (c, a0, a1, val, col) => { const lp = PT(c, (a1 - a0) < 35 ? 38 : 30, (a0 + a1) / 2); return `<path d="${sector(c, 18, a0, a1)}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="1.2"/>` + txt(lp.x, lp.y + 4, val + '°', 10.5, col, 'font-weight="600"'); };
    h += arc(V.A, 0, T.aA, T.aA, angCol[0]) + arc(V.B, 180 - T.aB, 180, T.aB, angCol[1]) + arc(V.C, 180 + T.aA, 360 - T.aB, aC, angCol[2]) + '</g>';
    h += '<g pointer-events="none">' + txt(V.A.x - 11, V.A.y + 15, 'A' + sub, 13, FG, 'font-weight="600"') + txt(V.B.x + 11, V.B.y + 15, 'B' + sub, 13, FG, 'font-weight="600"') + txt(V.C.x, V.C.y - 9, 'C' + sub, 13, FG, 'font-weight="600"') + '</g>';
    return h;
  };
  let h = tri(V0, T0, '', FG, 'rgba(232,236,244,.05)', 'orig', [CA, CB, CC]);
  const ac = (v, w) => v === w ? OK : '#ff8a73';
  h += tri(V1, T1, '₁', m.sim ? OK : FG, m.sim ? 'rgba(134,224,168,.08)' : 'rgba(232,236,244,.04)', 'copy', [ac(m.A1, 50), ac(m.B1, 70), ac(m.C1, 60)]);
  if (m.ghost) {
    const Vg = map(T0, g.oR, m.k);
    h += `<g data-part="ghost" pointer-events="none">${poly([Vg.A, Vg.B, Vg.C], 'none', m.sim ? OK : CA, 2, 'stroke-dasharray="6 4"')}${txt(Vg.C.x, Vg.C.y - 24, '△ABC × ' + f2c(m.k).replace(/(,d*?)0+$/, '$1').replace(/,$/, ''), 11, m.sim ? OK : CA)}</g>`;
  }
  const v = m.sim ? `△A₁B₁C₁ ∼ △ABC, k = ${f2c(m.k).replace(/(,d*?)0+$/, '$1').replace(/,$/, '')}, площадь больше в ${f2c(m.S1 / m.S0)} раза` : 'углы не равны — треугольники не подобны';
  h += `<g data-part="verdict" pointer-events="none">${say(260, 294, v, 12.5, m.sim ? OK : MU, 'font-weight="600"')}</g>`;
  return h;
}

function drawTrig() {
  const m = model(), s = SC3, A = A3, C = { x: A.x + m.b * s, y: A.y }, B = { x: C.x, y: A.y - m.a * s };
  let h = '';
  if (m.twin) {
    const C2 = { x: A.x + m.b * s / 2, y: A.y }, B2 = { x: C2.x, y: A.y - m.a * s / 2 };
    h += `<g data-part="twin" pointer-events="none">${line(C2, B2, OK, 1.6, 'stroke-dasharray="5 4"')}${line(A, B2, OK, 1.6, 'stroke-dasharray="5 4"')}<circle cx="${f1(B2.x)}" cy="${f1(B2.y)}" r="3" fill="${OK}"/><text x="${f1(B2.x + 6)}" y="${f1(B2.y + 18)}" font-size="10.5" fill="${OK}">c/2</text></g>`;
  }
  h += `<g data-part="adj" pointer-events="none">${line(A, C, CB, 3, 'stroke-linecap="round"')}${txt((A.x + C.x) / 2, A.y + 18, `b = ${f2c(m.b)}`, 11.5, CB, 'font-weight="600"')}</g>`;
  h += `<g data-part="opp" pointer-events="none">${line(C, B, CA, 3, 'stroke-linecap="round"')}<text x="${f1(C.x + 8)}" y="${f1((C.y + B.y) / 2 + 4)}" font-size="11.5" fill="${CA}" font-weight="600">a = ${f2c(m.a)}</text></g>`;
  const mh = { x: A.x + (B.x - A.x) * 0.74, y: A.y + (B.y - A.y) * 0.74 }, nx = -m.sin, ny = -m.cos;
  h += `<g data-part="hyp" pointer-events="none">${line(A, B, CC, 3, 'stroke-linecap="round"')}${txt(mh.x + nx * 18, mh.y + ny * 18 + 4, `c = ${f1c(m.c)}`, 11.5, CC, 'font-weight="600"')}</g>`;
  const lp = PT(A, 50, m.al / 2);
  h += `<g data-part="ang" pointer-events="none"><path d="${sector(A, 30, 0, m.al)}" fill="${FG}" fill-opacity=".1" stroke="${FG}" stroke-width="1.2"/>${txt(lp.x + 8, lp.y + 4, `α = ${m.al}°`, 11.5, FG, 'font-weight="600"')}</g>`;
  h += `<g pointer-events="none"><path d="M${f1(C.x - 10)} ${f1(C.y)}V${f1(C.y - 10)}H${f1(C.x)}" fill="none" stroke="${FG}" stroke-width="1.2"/>` +
    txt(A.x - 12, A.y + 5, 'A', 13.5, FG, 'font-weight="600"') + txt(C.x + 10, C.y + 16, 'C', 13.5, FG, 'font-weight="600"') + txt(B.x + 4, B.y - 14, 'B', 13.5, FG, 'font-weight="600"') + '</g>';
  const row = (y, name, frac, val, col) => txt(440, y, `${name} = ${frac}`, 12, col, 'font-weight="600"') + txt(440, y + 17, val, 12, FG);
  h += `<g data-part="ratios" pointer-events="none">` +
    row(110, 'sin α', 'a : c', `${f2c(m.a)} : ${f1c(m.c)} ≈ ${f3c(m.sin)}`, CA) +
    row(160, 'cos α', 'b : c', `${f2c(m.b)} : ${f1c(m.c)} ≈ ${f3c(m.cos)}`, CB) +
    row(210, 'tg α', 'a : b', `${f2c(m.a)} : ${f2c(m.b)} ≈ ${f3c(m.tg)}`, OK) + '</g>';
  h += knob('b3', B, CA, 'knobB');
  return h;
}

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'pyth' ? drawPyth() : id === 'sim' ? drawSim() : drawTrig();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);
      scene.insertAdjacentHTML('beforeend', `<rect x="${f1(bb.x0 - 6)}" y="${f1(bb.y0 - 6)}" width="${f1(bb.x1 - bb.x0 + 12)}" height="${f1(bb.y1 - bb.y0 + 12)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`); }
    else { S.hl = null; toast('Сейчас этого нет на поле — включите его кнопкой внизу.'); }
  }
}

let VB = { x: 0, y: 0, w: 520, h: 300 }, dirty = true;
function fit() {
  const st = $('#stage'), W0 = st.clientWidth, H0 = st.clientHeight; if (!W0 || !H0) return;
  const top = Math.max($('#taskBox').offsetHeight, $('#meter').offsetHeight) + 24, hh = Math.max(140, H0 - top - 54);
  scene.style.top = top + 'px'; scene.style.height = hh + 'px';
  const D = DIM[LID()], s = Math.min(W0 / (D[0] + 16), hh / (D[1] + 8), 1.8);
  VB = { w: W0 / s, h: hh / s }; VB.x = D[0] / 2 - VB.w / 2; VB.y = D[1] / 2 - VB.h / 2;
  scene.setAttribute('viewBox', `${f1(VB.x)} ${f1(VB.y)} ${f1(VB.w)} ${f1(VB.h)}`);

}

// ---------- pointer ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(id, p) {
  if ((id === 'pA' || id === 'pB') && S.fix1) {
    const f = S.fix1;
    if (id === 'pA') setLegs(S.a, (p.x - f.ox) / f.s); else setLegs((f.oy - p.y) / f.s, S.b);
  } else if (id === 'b3') {
    const x = Math.max(0.05, (p.x - A3.x) / SC3), y = Math.max(0.05, (A3.y - p.y) / SC3);
    setTrig(Math.atan2(y, x) / RAD, Math.hypot(x, y));
  }
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  const k = el.dataset.drag;
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  drag = { id: k };
  if (k === 'pA' || k === 'pB') { const g = g1(); S.fix1 = { s: g.s, ox: g.ox, oy: g.oy }; }
  scene.classList.add('grabbing');
  dragTo(k, toSvg(e));
});
scene.addEventListener('pointermove', e => { if (drag) dragTo(drag.id, toSvg(e)); });
const endDrag = () => { if (!drag) return; drag = null; S.fix1 = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);

  if (a === 'proof') { S.proof = !S.proof; renderTools(); update(); return; }

  if (a === 'L-' || a === 'L+') { setSim(S.A1, S.B1, S.L + (a[1] === '+' ? 0.5 : -0.5)); return; }
  if (a === 'ghost') { S.ghost = !S.ghost; renderTools(); update(); return; }

function taskState(m) {

function calcHTML(m) {
  if (m.kind === 'pyth') {
    const a = m.a, b = m.b, n = a + b;
    return `<h2>Теорема Пифагора</h2><div class="formula">c² = a² + b²</div><div class="steps">` +
      step('a²', `${a}² = ${a * a}`) + step('b²', `${b}² = ${b * b}`) + step('c² = a² + b²', `${a * a} + ${b * b} = ${m.c2}`) +
      step('c = √(a² + b²)', m.int ? `√${m.c2} = ${Math.round(m.c)}` : `√${m.c2} ≈ ${f2c(m.c)}`, 'sum') +
      step('целое?', yn(m.int)) + `</div>` +
      `<h3>Доказательство перекладкой</h3><div class="steps">` +
      step('большой квадрат (a + b)²', `${n}² = ${n * n}`) + step('4 треугольника по ½ab', `4 · ½ · ${a} · ${b} = ${2 * a * b}`) +
      step('остаток слева: c²', `${n * n} − ${2 * a * b} = ${m.c2}`) + step('остаток справа: a² + b²', `${a * a} + ${b * b} = ${m.c2}`, 'sum') + `</div>` +
      `<h3>Обратная задача</h3><div class="steps">` + step('катет b = √(c² − a²)', `√(${m.c2} − ${a * a}) = √${b * b} = ${b}`) + `</div>` +
      `<p class="note" style="margin-top:10px">Найдено троек: ${m.found}${m.found ? ' (' + [...S.found1].map(k => k.replace('-', ', ') + ', ' + Math.round(Math.hypot(...k.split('-').map(Number)))).join('; ') + ')' : ''}. Если умножить тройку на одно число, снова выйдет тройка.</p>`;
  }
  if (m.kind === 'sim') {
    const T1 = m.T1, eqA = m.A1 === 50, eqB = m.B1 === 70;
    let h = `<h2>Подобны ли?</h2><div class="formula">k = A₁B₁ : AB</div><h3>Углы (признак по двум углам)</h3><div class="steps">` +
      step('∠A₁ и ∠A', `${m.A1}° и 50° ${eqA ? '<span class="yes">=</span>' : '<span class="no">≠</span>'}`) +
      step('∠B₁ и ∠B', `${m.B1}° и 70° ${eqB ? '<span class="yes">=</span>' : '<span class="no">≠</span>'}`) +
      step('∠C₁ = 180° − ∠A₁ − ∠B₁', `180 − ${m.A1} − ${m.B1} = ${m.C1}° (∠C = 60°)`) + step('подобны?', yn(m.sim), 'sum') + `</div>` +
      `<h3>Отношения сторон</h3><div class="steps">` +
      step('A₁B₁ : AB', `${f2c(m.L)} : 4 = ${f2c(m.k)}`) + step('A₁C₁ : AC', `${f2c(T1.AC)} : ${f2c(T0.AC)} ≈ ${f2c(m.rb)}`) +
      step('B₁C₁ : BC', `${f2c(T1.BC)} : ${f2c(T0.BC)} ≈ ${f2c(m.ra)}`) + step('все равны?', yn(Math.abs(m.rb - m.k) < 0.005 && Math.abs(m.ra - m.k) < 0.005), 'sum') + `</div>` +
      `<h3>Площади (S = ½ · основание · высота)</h3><div class="steps">` +
      step('S△ABC', `½ · 4 · ${f2c(T0.C.y)} ≈ ${f2c(m.S0)} см²`) + step('S△A₁B₁C₁', `½ · ${f2c(m.L)} · ${f2c(T1.C.y)} ≈ ${f2c(m.S1)} см²`) +
      step('S₁ : S', f2c(m.S1 / m.S0), 'sum');
    if (m.sim) h += step('k²', `${kStr(m.k)}² = ${f2c(m.k * m.k)}`, 'sum');
    return h + `</div><p class="note" style="margin-top:10px">${m.sim ? 'Площади подобных треугольников относятся как квадрат коэффициента подобия.' : 'Пока углы разные, отношения сторон не совпадают и о коэффициенте k говорить нельзя.'}</p>`;
  }
  const done = !!S.done.trig;
  return `<h2>Отношения сторон</h2><div class="formula">sin α = a : c<br>cos α = b : c<br>tg α = a : b</div><div class="steps">` +
    step('a — противолежащий', f2c(m.a) + ' см') + step('b — прилежащий', f2c(m.b) + ' см') + step('c — гипотенуза', f1c(m.c) + ' см') +
    step('sin α = a : c', `${f2c(m.a)} : ${f1c(m.c)} ≈ ${f3c(m.sin)}`) + step('cos α = b : c', `${f2c(m.b)} : ${f1c(m.c)} ≈ ${f3c(m.cos)}`) +
    step('tg α = a : b', `${f2c(m.a)} : ${f2c(m.b)} ≈ ${f3c(m.tg)}`) + step('sin²α + cos²α', `${f3c(m.sin)}² + ${f3c(m.cos)}² = 1`, 'sum') + `</div>` +
    `<h3>Проверка Пифагором</h3><div class="steps">` + step('a² + b²', `${f2c(m.a * m.a)} + ${f2c(m.b * m.b)} = ${f2c(m.c * m.c)}`) + step('c²', `${f1c(m.c)}² = ${f2c(m.c * m.c)}`, 'sum') + `</div>` +
    (done ? `<h3>Таблица значений</h3><div class="steps">` + step('α = 30°', 'sin ½ · cos √3/2 · tg √3/3') + step('α = 45°', 'sin √2/2 · cos √2/2 · tg 1') + step('α = 60°', 'sin √3/2 · cos ½ · tg √3') + `</div>`
      : `<p class="note" style="margin-top:10px">Таблица значений для 30°, 45° и 60° откроется, когда выполните задание.</p>`);
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'pyth') el.innerHTML = `<div class="k">Гипотенуза</div><div class="v ${m.int ? 'ok' : ''}">c ${cStr(m)}</div><div class="lr"><span>a² + b²</span><span>${m.c2}</span></div><div class="lr"><span>тройки</span><span>${m.found} из 2</span></div>`;
  else if (m.kind === 'sim') el.innerHTML = `<div class="k">Коэффициент</div><div class="v ${m.sim ? 'ok' : ''}">${m.sim ? 'k = ' + kStr(m.k) : 'не подобны'}</div><div class="lr"><span>углы</span><span>${m.A1}·${m.B1}·${m.C1}</span></div><div class="lr"><span>S₁ : S</span><span>${f2c(m.S1 / m.S0)}</span></div>`;
  else el.innerHTML = `<div class="k">Угол α</div><div class="v ${ok ? 'ok' : ''}">${m.al}°</div><div class="lr"><span>sin</span><span>${f3c(m.sin)}</span></div><div class="lr"><span>cos</span><span>${f3c(m.cos)}</span></div><div class="lr"><span>tg</span><span>${f3c(m.tg)}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  pyth: '<rect x="22" y="15" width="10" height="10" fill="rgba(114,212,232,.3)" stroke="#72d4e8"/><rect x="12" y="7" width="10" height="8" fill="rgba(255,181,71,.3)" stroke="#ffb547"/><path d="M22 15L32 15L22 7Z" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><path d="M22 7L32 15L40 5L30 -3Z" fill="rgba(195,155,255,.3)" stroke="#c39bff"/>',
  sim: '<path d="M4 26L12 12L20 26Z" fill="none" stroke="#e8ecf4" stroke-width="1.3"/><path d="M28 26L40 5L52 26Z" fill="rgba(134,224,168,.15)" stroke="#86e0a8" stroke-width="1.3"/>',
  trig: '<path d="M10 26H48V6Z" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><path d="M48 26V6" stroke="#ffb547" stroke-width="2"/><path d="M10 26L48 6" stroke="#c39bff" stroke-width="2"/><path d="M18 26A8 8 0 0 0 17 22" stroke="#e8ecf4" fill="none"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.fix1 = null;
  if (L.id === 'pyth') { S.a = L.a; S.b = L.b; S.found1 = new Set(); S.proof = false; }
  if (L.id === 'sim') { S.A1 = L.A1; S.B1 = L.B1; S.L = L.L; S.ghost = false; }
  if (L.id === 'trig') { S.al = L.al; S.c = L.c; S.found3 = new Set(); S.cSeen = false; S.twin = false; }
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'pyth') now = `Прямоугольный △ABC с прямым углом C, на каждой стороне построен квадрат. Катет a = BC = ${m.a} см, катет b = AC = ${m.b} см. a² = ${m.a * m.a}, b² = ${m.b * m.b}, c² = ${m.c2}, гипотенуза c ${cStr(m)} см${m.int ? ' (целое число — пифагорова тройка)' : ''}. Режим «Доказательство перекладкой» ${m.proof ? 'включён: два квадрата (a+b)², в каждом 4 треугольника, слева остаётся c², справа a² и b²' : 'выключен'}. Найдено троек: ${m.found} из 2 (${[...S.found1].join('; ') || 'ни одной'}). Катеты — целые от 1 до 12. Не называй тройки готовыми — помоги искать, когда a² + b² будет точным квадратом.`;
  if (id === 'sim') now = `Слева △ABC: AB = 4 см, ∠A = 50°, ∠B = 70°, ∠C = 60°. Справа △A₁B₁C₁, его задаёт ученик: ∠A₁ = ${m.A1}°, ∠B₁ = ${m.B1}°, ∠C₁ = ${m.C1}°, A₁B₁ = ${f1c(m.L)} см. Треугольники ${m.sim ? 'подобны, k = ' + kStr(m.k) : 'не подобны (углы не равны)'}. Отношения сторон: A₁B₁:AB = ${f2c(m.k)}, A₁C₁:AC ≈ ${f2c(m.rb)}, B₁C₁:BC ≈ ${f2c(m.ra)}. Площади: S ≈ ${f2c(m.S0)}, S₁ ≈ ${f2c(m.S1)}, S₁:S ≈ ${f2c(m.S1 / m.S0)}. Наложение △ABC×k ${m.ghost ? 'включено' : 'выключено'}. Задание: подобие с k = 1,5. Наводи вопросами: какие углы должны совпасть, как найти A₁B₁ через k.`;
  if (id === 'trig') now = `Прямоугольный △ABC, прямой угол C, острый угол α при вершине A. α = ${m.al}°, гипотенуза c = ${f1c(m.c)} см, противолежащий катет a ≈ ${f2c(m.a)} см, прилежащий b ≈ ${f2c(m.b)} см. sin α ≈ ${f3c(m.sin)}, cos α ≈ ${f3c(m.cos)}, tg α ≈ ${f3c(m.tg)}. Треугольник с гипотенузой c/2 ${m.twin ? 'показан' : 'скрыт'}. Найдено нужных углов: ${m.found} из 2 (${[...S.found3].map(k => k === 'sin' ? 'sin α = 0,5' : 'tg α = 1').join(', ') || 'пока ни одного'}); гипотенуза ${m.cSeen ? 'менялась' : 'ещё не менялась'}. Задание: найти угол с sin α = 0,5 и угол с tg α = 1, поменять c. Не называй углы прямо — наводи через отношения катетов и гипотенузы.`;
  return [
    `Раздел: математика, 8 класс, геометрия, тема «Пифагор и подобие». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    pyth: 'Как проверить прямой угол рулеткой по правилу 3-4-5?',
    sim: 'Почему площадь растёт как k², а не как k?',
    trig: 'Как найти высоту дерева, зная угол и расстояние до него?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
