<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 8 класс: квадратные корни, иррациональные числа, свойства арифметического квадратного корня, вынесение множителя из-под знака корня.">
<title>Квадратные корни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: квадраты и подбор цифр корня, сравнение свойств корней столбиками, квадрат, разбитый на клетки. Элементы можно нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const dec = (v, d) => { const s = Math.abs(v).toFixed(d).replace('.', ','); return (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + s; };
// short decimal: up to d digits, trailing zeros removed
const sd = (v, d = 3) => { if (Math.abs(v - Math.round(v)) < 1e-9) return ns(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 ? '−' : '') + s; };
const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
const rt = n => isInt(Math.sqrt(n)) ? String(Math.round(Math.sqrt(n))) : '√' + n;
const approx = v => isInt(v) ? ns(Math.round(v)) : '≈ ' + dec(v, 3);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

// lesson 1: areas under the root
const NS = [2, 3, 4, 5, 7, 10];
const PLACE = [1000, 100, 10, 1];
const PLACE_NAME = ['единицы', 'десятые', 'сотые', 'тысячные'];
// lesson 2: modes
const MODES = ['mul', 'div', 'sq', 'sum'];
const MODE_LBL = { mul: '√(a·b)', div: '√(a:b)', sq: '√(a²)', sum: '√(a+b)' };
const MODE_MAX = { mul: 25, div: 5, sq: 10, sum: 10 };
// lesson 3: numbers to simplify
const NUMS = [12, 18, 48, 50, 72, 75, 200];
const KS = [2, 3, 4, 5, 6, 7, 8, 10];

const LESSONS = [
  { id: 'irr', title: 'Иррациональные числа: охота на √2',
    text: ['Квадратный корень из a — это число, квадрат которого равен a. Арифметический корень √a — неотрицательное такое число: √9 = 3, потому что 3² = 9 и 3 ≥ 0. Геометрически √a — сторона квадрата площадью a.',
           'У квадрата площадью 4 сторона ровно 2. А у квадрата площадью 2? Подбираем: 1,4² = 1,96 — мало, 1,5² = 2,25 — много. Уточняем дальше: 1,41; 1,414… Цифры никогда не кончаются и не повторяются периодом: √2 = 1,41421356…',
           'Такие числа называют иррациональными: их нельзя записать дробью m/n. Иррациональны √2, √3, √5, число π. Рациональные и иррациональные числа вместе образуют действительные числа — каждой точке числовой прямой соответствует ровно одно из них.'],
    why: 'Лист бумаги А4 устроен на √2: если разрезать его пополам, пропорции сохранятся — поэтому типографии и копицентры обходятся одним форматом. Строитель и плиточник считают диагональ квадратной комнаты как сторону × √2 ≈ 1,414. Программист знает, что компьютер хранит √2 только приближённо, и следит за ошибками округления — от этого зависят расчёты в банковских и инженерных программах.',
    task: 'Подберите √2 с точностью до тысячных: найдите такое x, что x² < 2, а (x + 0,001)² уже больше 2.',
    hint: 'Нажимайте ▲ и ▼ над и под цифрами или выберите разряд и жмите «+» и «−» внизу. Сначала подберите единицы, потом десятые, сотые и тысячные.',
    stage: 'Тап по ▲/▼ меняет цифру. Сравнивайте x² с площадью N.',
    N: 2, x: 1000,
    check: m => m.N === 2 && m.xi === 1414 },
  { id: 'props', title: 'Свойства корней',
    text: ['Корень из произведения равен произведению корней: √(ab) = √a · √b при a ≥ 0, b ≥ 0. Корень из дроби: √(a : b) = √a : √b при a ≥ 0, b > 0. Например, √2 · √8 = √16 = 4 — два иррациональных числа дали целое.',
           'Корень из квадрата равен модулю: √(a²) = |a|. Ведь арифметический корень не бывает отрицательным: √((−5)²) = √25 = 5, а не −5. А (√a)² = a при a ≥ 0.',
           'Для суммы такого правила нет! √(9 + 16) = √25 = 5, а √9 + √16 = 3 + 4 = 7. Столбики на поле показывают левую и правую части равенства: если свойство верно, они одинаковой длины.'],
    why: 'Свойства корней ускоряют расчёты без калькулятора: √50 · √2 = √100 = 10. Инженер-электрик пересчитывает действующее значение напряжения через √2, а статистик в банке или страховой компании оценивает разброс данных через корень из суммы квадратов — и ошибка «корень суммы равен сумме корней» стоила бы денег. На ЕНТ задачи на свойства корней встречаются каждый год.',
    task: 'Проверьте √(a²) = |a| при a = −5. Затем в режиме √(a+b) найдите такие a и b, при которых √(a + b) всё-таки равно √a + √b.',
    hint: 'Режимы — кнопками над столбиками, a и b — кнопками внизу или ползунками на вкладке «Схема». Подумайте, когда «лишний» кусок пропадает.',
    stage: 'Сравнивайте длины столбиков: равны ли части?',
    mode: 'mul', a: 2, b: 8,
    check: m => m.negSeen && m.mode === 'sum' && m.eq && m.a + m.b > 0 },
  { id: 'simp', title: 'Вынесение множителя из-под корня',
    text: ['Если под корнем есть множитель — точный квадрат, его выносят: √72 = √(36 · 2) = √36 · √2 = 6√2. Работает свойство корня из произведения. Ищите самый большой квадрат-делитель — тогда хватит одного шага.',
           'Картинка: квадрат площадью 72 режем на 6 × 6 одинаковых клеток. Площадь каждой 72 : 36 = 2, сторона клетки √2, а сторона всего квадрата — шесть таких сторон, то есть 6√2.',
           'Обратное действие — внесение множителя под корень: 3√2 = √(9 · 2) = √18. После вынесения корни с одинаковым подкоренным числом складывают как подобные члены: 6√2 + 5√2 = 11√2.'],
    why: 'Упрощение корней — ежедневный инструмент инженеров, архитекторов и программистов графики: формулы с 6√2 считать и проверять легче, чем с √72. Так же упрощают выражения в физике и при подготовке к ЕНТ, где калькулятором пользоваться нельзя. Навык «разложи на удобные множители» помогает и в быту — быстро прикинуть площадь или смету в уме.',
    task: 'Вынесите множитель из-под корня до конца для √72, а затем для √50. Сложите результаты как подобные корни.',
    hint: 'Выберите число вверху, затем квадрат k² справа. Если 72 не делится на k², клетки не получатся. Под корнем в конце не должно остаться квадратов-делителей.',
    stage: 'Выберите число и квадрат-делитель k² справа.',

const KEY = 'luch-math-roots';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            N: 2, xi: 1000, place: 0,
            mode: 'mul', a: 2, b: 8, negSeen: false,
            n: 72, k: 1, simp: {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const kmax = n => { let k = 1; for (let j = 2; j * j <= n; j++) if (n % (j * j) === 0) k = j; return k; };
const xs = xi => dec(xi / 1000, 3);
const x2s = xi => dec(xi * xi / 1e6, 6);
const kroot = (k, m) => m === 1 ? String(k) : (k === 1 ? '' : k) + '√' + m;

function model() {
  const id = LID();
  if (id === 'irr') {
    const N = S.N, xi = S.xi, sq = xi * xi, tgt = N * 1e6, nx = (xi + 1) * (xi + 1);
    const cmp = sq < tgt ? -1 : sq > tgt ? 1 : 0;
    return { kind: id, N, xi, x: xi / 1000, sq, cmp, nextAbove: nx > tgt, bracket: cmp === 0 || (cmp < 0 && nx > tgt), exact: cmp === 0, rational: isInt(Math.sqrt(N)), root: Math.sqrt(N), place: S.place };
  }
  if (id === 'props') {
    const a = S.a, b = S.b, md = S.mode;
    let Lv, Rv, lt, rt2;
    if (md === 'mul') { Lv = Math.sqrt(a * b); Rv = Math.sqrt(a) * Math.sqrt(b); lt = `√(${a}·${b}) = ${rt(a * b)}`; rt2 = `${rt(a)} · ${rt(b)}`; }
    else if (md === 'div') { Lv = Math.sqrt(a / b); Rv = Math.sqrt(a) / Math.sqrt(b); lt = `√(${a}:${b})`; rt2 = `${rt(a)} : ${rt(b)}`; }
    else if (md === 'sq') { Lv = Math.sqrt(a * a); Rv = Math.abs(a); lt = `√(${a < 0 ? '(' + ns(a) + ')' : a}²) = √${a * a}`; rt2 = `|${ns(a)}|`; }
    else { Lv = Math.sqrt(a + b); Rv = Math.sqrt(a) + Math.sqrt(b); lt = `√(${a}+${b}) = ${rt(a + b)}`; rt2 = `${rt(a)} + ${rt(b)}`; }
    return { kind: id, mode: md, a, b, L: Lv, R: Rv, lt, rt: rt2, eq: Math.abs(Lv - Rv) < 1e-9, negSeen: S.negSeen };
  }
  const n = S.n, k = S.k, ok = n % (k * k) === 0, km = kmax(n);
  return { kind: 'simp', n, k, ok, m: n / (k * k), km, mm: n / (km * km), full: ok && k === km, simp72: !!S.simp[72], simp50: !!S.simp[50] };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 14, w, 28, on ? (col || FG) : '#1a2438', `rx="8" stroke="${on ? (col || FG) : '#33405c'}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, 12, label, on ? '#0b1019' : FG, 'middle', 'font-weight="500"')}</g>`;
}

// ---------- lesson 1: hunting √N ----------
const SQ = { x0: 40, y0: 318, u: 50 };
const OD = { x: [296, 352, 396, 440], y: 168, w: 38, h: 46 };
const NL = { x0: 40, k: 110, y: 358 };
function irrSVG(m) {
  let h = T(24, 66, 11, 'Площадь N:', MUTED, 'start');
  NS.forEach((N, i) => { h += chip(48 + i * 72, 88, 64, '√' + N, m.N === N, 'N-' + N, S.done.irr && N === 2 && m.N === 2 ? GREEN : null); });
  // squares
  const sN = m.root * SQ.u, sx = m.x * SQ.u, col = m.exact ? GREEN : m.bracket ? ORANGE : BLUE;
  h += R(SQ.x0, SQ.y0 - sx, sx, sx, m.cmp > 0 ? 'rgba(255,138,115,.22)' : 'rgba(95,180,217,.25)', `stroke="${m.cmp > 0 ? RED : BLUE}" stroke-width="1.6"`);
  h += R(SQ.x0, SQ.y0 - sN, sN, sN, 'none', `stroke="${GREEN}" stroke-width="2" stroke-dasharray="6 4"`);
  h += T(SQ.x0 + 2, SQ.y0 - Math.max(sN, sx) - 8, 11, `площадь ${m.N}, сторона √${m.N}`, GREEN, 'start');
  if (sx > 84) h += T(SQ.x0 + sx / 2, SQ.y0 - 10, 11, `x² ≈ ${dec(m.sq / 1e6, 2)}`, FG);
  h += L(SQ.x0 - 6, SQ.y0, SQ.x0 + 206, SQ.y0, '#6b7690', 1.2);
  for (let i = 0; i <= 4; i++) h += L(SQ.x0 + i * SQ.u, SQ.y0, SQ.x0 + i * SQ.u, SQ.y0 + 4, '#6b7690', 1);
  // odometer
  h += T(OD.x[0] - 12, OD.y + 8, 20, 'x =', FG, 'end', 'font-weight="500"');
  const digs = [Math.floor(m.xi / 1000), Math.floor(m.xi / 100) % 10, Math.floor(m.xi / 10) % 10, m.xi % 10];
  digs.forEach((d, p) => {
    const x = OD.x[p], on = p === m.place;
    h += `<g data-od="${p}:1" style="cursor:pointer">${R(x - 2, OD.y - OD.h / 2 - 34, OD.w + 4, 32, 'transparent')}<path d="M${x + OD.w / 2 - 8} ${OD.y - OD.h / 2 - 8}l8 -10 8 10z" fill="${on ? ORANGE : MUTED}"/></g>`;
    h += `<g data-od="${p}:0" style="cursor:pointer">${R(x, OD.y - OD.h / 2, OD.w, OD.h, '#1a2438', `rx="8" stroke="${on ? ORANGE : '#33405c'}" stroke-width="${on ? 2 : 1.3}"`)}${T(x + OD.w / 2, OD.y + 9, 26, d, FG, 'middle', 'font-weight="500"')}</g>`;
    h += `<g data-od="${p}:-1" style="cursor:pointer">${R(x - 2, OD.y + OD.h / 2 + 2, OD.w + 4, 32, 'transparent')}<path d="M${x + OD.w / 2 - 8} ${OD.y + OD.h / 2 + 8}l8 10 8 -10z" fill="${on ? ORANGE : MUTED}"/></g>`;
  });
  h += T(OD.x[0] + OD.w + 9, OD.y + 12, 26, ',', FG);
  h += T(OD.x[m.place] + OD.w / 2, OD.y + OD.h / 2 + 46, 10, PLACE_NAME[m.place], ORANGE);
  // comparison
  const rel = m.cmp < 0 ? '<' : m.cmp > 0 ? '>' : '=';
  h += T(272, 258, 13, `x² = ${x2s(m.xi)}`, FG, 'start', 'font-weight="500"');
  h += T(272, 280, 13, `x² ${rel} ${m.N}`, m.cmp === 0 ? GREEN : m.cmp < 0 ? BLUE : RED, 'start', 'font-weight="500"') + T(350, 280, 11, m.cmp === 0 ? `точно: √${m.N} — рациональное` : m.cmp < 0 ? 'мало' : 'много', MUTED, 'start');
  if (m.cmp < 0) h += T(272, 302, 11.5, `(x + 0,001)² = ${x2s(m.xi + 1)} ${m.nextAbove ? '> ' + m.N + ' ✓' : '< ' + m.N}`, m.nextAbove ? ORANGE : MUTED, 'start');
  // number line
  h += L(NL.x0 - 6, NL.y, NL.x0 + 4 * NL.k + 6, NL.y, '#6b7690', 1.4);
  for (let i = 0; i <= 40; i++) { const x = NL.x0 + i * NL.k / 10; h += L(x, NL.y - (i % 10 ? 3 : 6), x, NL.y + (i % 10 ? 3 : 6), '#6b7690', 1); if (!(i % 10)) h += T(x, NL.y + 18, 10, i / 10, '#6b7690'); }
  const gx = NL.x0 + m.root * NL.k, ox = NL.x0 + m.x * NL.k;
  h += `<path d="M${gx.toFixed(1)} ${NL.y - 8}l-5 -8h10z" fill="${GREEN}"/>` + T(gx, NL.y - 20, 10, '√' + m.N, GREEN);
  h += `<circle cx="${ox.toFixed(1)}" cy="${NL.y}" r="4.5" fill="${ORANGE}" stroke="${INK}" stroke-width="1.2"/>`;
  h += T(260, 396, 11.5, m.exact ? `√${m.N} = ${Math.round(m.root)} — рациональное число` : m.bracket ? `${xs(m.xi)} < √${m.N} < ${xs(m.xi + 1)} · а дальше: √${m.N} = ${dec(Math.floor(m.root * 1e8) / 1e8, 8)}…` : 'оранжевая точка — ваше x, зелёный флажок — √N', m.bracket ? col : MUTED);
  return h;
}

// ---------- lesson 2: properties ----------
const BX = 40, BW = 440;
function propsSVG(m) {
  let h = '';
  MODES.forEach((md, i) => { h += chip(24 + i * 120, 88, 112, MODE_LBL[md], m.mode === md, 'mode-' + md); });
  const title = { mul: '√(ab) = √a · √b', div: '√(a : b) = √a : √b', sq: '√(a²) = |a|', sum: '√(a + b)  ?  √a + √b' }[m.mode];
  h += T(260, 134, 18, title, m.mode === 'sum' ? ORANGE : FG, 'middle', 'font-weight="500"');
  h += T(260, 154, 11, m.mode === 'sq' ? `a = ${ns(m.a)}` : `a = ${m.a}, b = ${m.b}`, MUTED);
  const sc = BW / MODE_MAX[m.mode], col = m.eq ? GREEN : RED;
  const bar = (y, lbl, v, c) => {
    const w = Math.min(BW, v * sc), inside = w > BW - 70;
    return T(BX, y - 8, 12, lbl, FG, 'start') + R(BX, y, BW, 22, '#141c2b', 'rx="5" stroke="#26324a"') + (w > 0 ? R(BX, y, w, 22, c, `rx="5" opacity=".9" stroke="${INK}"`) : '') +
      T(inside ? BX + w - 6 : BX + w + 6, y + 15.5, 12, approx(v), inside ? INK : FG, inside ? 'end' : 'start', 'font-weight="500"');
  };
  h += bar(186, `левая часть: ${m.lt}`, m.L, BLUE);
  h += bar(240, `правая часть: ${m.rt}`, m.R, m.eq ? BLUE : ORANGE);
  let det = [];
  if (m.mode === 'mul') det = [`√${m.a} ${approx(Math.sqrt(m.a))}, √${m.b} ${approx(Math.sqrt(m.b))}`, `их произведение ${approx(m.R)}, и √${m.a * m.b} ${approx(m.L)}`];
  if (m.mode === 'div') det = [`${m.a} : ${m.b} = ${sd(m.a / m.b, 4)}${isInt(m.a / m.b) ? '' : '…'}, корень из частного ${approx(m.L)}`, `√${m.a} : √${m.b} ${approx(m.R)}`];
  if (m.mode === 'sq') det = [`a² = ${m.a < 0 ? '(' + ns(m.a) + ')' : m.a}² = ${m.a * m.a}, √${m.a * m.a} = ${Math.abs(m.a)}`, m.a < 0 ? `ответ ${Math.abs(m.a)}, а не ${ns(m.a)}: арифметический корень не бывает отрицательным` : 'при a ≥ 0 модуль |a| просто равен a'];
  if (m.mode === 'sum') det = [`√a + √b − √(a + b) = ${m.eq ? '0' : dec(m.R - m.L, 3)}`, m.eq ? 'разницы нет — подумайте, почему' : 'сумма корней больше корня суммы'];
  det.forEach((s, i) => { h += T(BX, 296 + i * 20, 11.5, s, i === 1 && m.mode === 'sq' && m.a < 0 ? ORANGE : MUTED, 'start'); });
  h += T(260, 368, 15, m.eq ? `равны: ${approx(m.L)} = ${approx(m.R).replace('≈ ', '')}` : `не равны: ${dec(m.L, 3)} ≠ ${dec(m.R, 3)}`, col, 'middle', 'font-weight="500"');
  if (m.mode === 'sq' || m.negSeen) h += T(260, 392, 10.5, m.negSeen ? '√((−5)²) = 5 проверено ✓' : 'установите a = −5', m.negSeen ? GREEN : MUTED);
  return h;
}

// ---------- lesson 3: square split into k × k cells ----------
const GX = 30, GY = 120, GS = 206;
function simpSVG(m) {
  let h = '';
  NUMS.forEach((n, i) => { const dn = S.simp[n]; h += chip(26 + i * 67, 88, 60, '√' + n, m.n === n, 'n-' + n, dn && m.n === n ? GREEN : null); if (dn && m.n !== n) h += T(26 + i * 67 + 53, 80, 9, '✓', GREEN); });
  const k = m.k, c = GS / k, gcol = m.ok ? (m.full ? GREEN : BLUE) : RED;
  h += R(GX, GY, GS, GS, m.ok ? 'rgba(95,180,217,.16)' : 'rgba(255,138,115,.08)', `stroke="${gcol}" stroke-width="2"`);
  for (let i = 1; i < k; i++) h += L(GX + i * c, GY, GX + i * c, GY + GS, gcol, 1.1, m.ok ? '' : 'stroke-dasharray="4 4"') + L(GX, GY + i * c, GX + GS, GY + i * c, gcol, 1.1, m.ok ? '' : 'stroke-dasharray="4 4"');
  if (m.ok) {
    const fs = Math.min(15, c / 2.4);
    if (c >= 20) for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) h += T(GX + i * c + c / 2, GY + j * c + c / 2 + fs * 0.35, fs, m.m, FG);
    h += T(GX + GS / 2, GY + GS + 18, 11.5, k === 1 ? `площадь ${m.n}, сторона √${m.n}` : `сторона = ${k} · √${m.m} = ${kroot(k, m.m)}`, gcol);
  } else {
    h += T(GX + GS / 2, GY + GS / 2 + 5, 13, `${m.n} : ${k * k} = ${sd(m.n / (k * k), 3)}${isInt(m.n / (k * k) * 1000) ? '' : '…'}`, RED, 'middle', 'font-weight="500"');
    h += T(GX + GS / 2, GY + GS + 18, 11.5, 'не целое — клетки не получаются', RED);
  }
  // k² chips
  h += T(262, 118, 11, 'Квадрат-делитель k²:', MUTED, 'start');
  KS.forEach((kk, i) => {
    const x = 262 + (i % 4) * 60, y = 146 + Math.floor(i / 4) * 36;
    h += chip(x, y, 54, String(kk * kk), k === kk, 'k-' + kk, k === kk ? (m.ok ? (m.full ? GREEN : BLUE) : RED) : null);
  });
  // working
  const ly = 232;
  if (k === 1) h += T(262, ly, 12.5, `√${m.n}: выберите квадрат,`, FG, 'start') + T(262, ly + 20, 12.5, `на который делится ${m.n}`, FG, 'start');
  else if (!m.ok) h += T(262, ly, 12.5, `${m.n} не делится на ${k * k}`, RED, 'start') + T(262, ly + 20, 12, 'попробуйте другой квадрат', MUTED, 'start');
  else {
    h += T(262, ly, 13, `√${m.n} = √(${k * k} · ${m.m})`, FG, 'start', 'font-weight="500"');
    h += T(262, ly + 22, 13, `= √${k * k} · √${m.m} = ${kroot(k, m.m)}`, m.full ? GREEN : FG, 'start', 'font-weight="500"');
    h += T(262, ly + 46, 11.5, m.full ? (m.m === 1 ? 'корень извлёкся целиком' : `в ${m.m} квадратов-делителей нет ✓`) : `в ${m.m} ещё есть квадрат — выносите дальше`, m.full ? GREEN : ORANGE, 'start');
  }
  const both = m.simp72 && m.simp50;
  h += T(260, 368, 14, both ? '√72 + √50 = 6√2 + 5√2 = 11√2' : `упрощено до конца: √72 ${m.simp72 ? '✓' : '…'} · √50 ${m.simp50 ? '✓' : '…'}`, both ? GREEN : MUTED, 'middle', 'font-weight="500"');
  if (both) h += T(260, 390, 11, 'подобные корни складывают, как 6x + 5x = 11x', MUTED);
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'irr') { const m = model(); const s = Math.max(m.root, m.x) * SQ.u; return { chips: [40, 70, 444, 36], squares: [SQ.x0 - 6, SQ.y0 - s - 22, Math.max(s, 150) + 14, s + 30], odo: [256, 112, 248, 116], cmp: [264, 242, 244, 68], line: [30, NL.y - 34, 460, 58] }[id]; }
  if (lid === 'props') return { modes: [18, 70, 484, 36], formula: [40, 112, 440, 50], left: [BX - 6, 168, BW + 12, 46], right: [BX - 6, 222, BW + 12, 46], verdict: [30, 280, 460, 98] }[id];
  return { nums: [20, 68, 480, 38], grid: [GX - 6, GY - 6, GS + 12, GS + 32], ks: [256, 104, 248, 98], work: [256, 214, 248, 66], sum: [30, 350, 460, 46] }[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  if (id === 'irr') h += irrSVG(m);
  else if (id === 'props') h += propsSVG(m);
  else h += simpSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let dirty = true;
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 410, 1.45);
  const vw = w / s, vh = hh / s, vx = 260 - vw / 2, vy = 404 - vh;
  scene.setAttribute('viewBox', `${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- actions ----------
function setN(N) { S.N = N; update(); }
function stepX(p, dir) {
  S.place = p;
  if (dir) S.xi = clamp(S.xi + dir * PLACE[p], 0, 3999);
  renderTools(); update();
}
function setMode(md) {
  S.mode = md;
  S.a = md === 'sq' ? clamp(S.a, -10, 10) : clamp(S.a, 0, 25);
  if (md === 'div') S.b = Math.max(1, S.b);
  update(); if (S.tab === 'scheme') { buildScheme(); updateScheme(model()); }
}
function setA(v) { S.a = S.mode === 'sq' ? clamp(v, -10, 10) : clamp(v, 0, 25); update(); }
function setB(v) { S.b = clamp(v, S.mode === 'div' ? 1 : 0, 25); update(); }
function setNum(n) { S.n = n; S.k = 1; update(); }
function setK(k) {
  S.k = k;
  const m = model();
  if (!m.ok) toast(`${m.n} не делится на ${k * k} нацело.`);
  else if (m.full && !S.simp[m.n]) { S.simp[m.n] = true; toast(`√${m.n} = ${kroot(k, m.m)} — упрощено до конца.`); }
  else if (!m.full) toast(`Можно и дальше: в ${m.m} есть квадрат-делитель.`);
  update();
}
function pick(p) {
  if (p.startsWith('N-')) setN(+p.slice(2));
  else if (p.startsWith('mode-')) setMode(p.slice(5));
  else if (p.startsWith('n-')) setNum(+p.slice(2));
  else if (p.startsWith('k-')) setK(+p.slice(2));
}

// ---------- pointer ----------
scene.addEventListener('pointerdown', e => {
  const pk = e.target.closest('[data-pick]'); if (pk) { e.preventDefault(); pick(pk.dataset.pick); return; }
  const od = e.target.closest('[data-od]'); if (od) { e.preventDefault(); const [p, d] = od.dataset.od.split(':'); stepX(+p, +d); }
});

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pr) => `<button data-a="${k}"${pr === undefined ? '' : ` aria-pressed="${pr}"`}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    irr: ['1', '0,1', '0,01', '0,001'].map((l, p) => B('pl' + p, l, S.place === p)).join('') + sep + B('x-', '−') + B('x+', '+'),
    props: B('a-', 'a −1') + B('a+', 'a +1') + sep + B('b-', 'b −1') + B('b+', 'b +1'),
    simp: B('k1', 'Без деления') + sep + B('khint', 'Как найти k²?'),
  }[id];
}
function act(a) {
  if (a.startsWith('pl')) { S.place = +a.slice(2); renderTools(); update(); return; }
  if (a === 'x-' || a === 'x+') return stepX(S.place, a === 'x-' ? -1 : 1);
  if (a === 'a-' || a === 'a+') return setA(S.a + (a === 'a-' ? -1 : 1));
  if (a === 'b-' || a === 'b+') return setB(S.b + (a === 'b-' ? -1 : 1));
  if (a === 'k1') { S.k = 1; update(); return; }
  if (a === 'khint') toast('Перебирайте квадраты от большего к меньшему: первый, на который число делится нацело, — самый большой.');
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

// ---------- icons ----------
const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;
const TXT = (s, col = 'var(--fg)', fs = 10) => IC(`<text x="17" y="21" font-size="${fs}" fill="${col}" text-anchor="middle" font-family="monospace">${s}</text>`);

  modes: IC('<rect x="2" y="11" width="14" height="12" rx="3" fill="var(--fg)"/><rect x="18" y="11" width="14" height="12" rx="3" fill="none" stroke="var(--fg)" stroke-width="1.2"/>'),
  formula: TXT('√ab', 'var(--fg)', 10),

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'irr') return `N = ${m.N} · x = ${xs(m.xi)} · x² ${m.cmp < 0 ? '<' : m.cmp > 0 ? '>' : '='} ${m.N}${m.bracket && !m.exact ? ' · вилка до тысячных найдена' : ''}`;
  if (Ls.id === 'props') return `√((−5)²): ${m.negSeen ? 'проверено ✓' : 'не проверено'} · √(a+b) = √a + √b: ${m.mode === 'sum' && m.eq ? 'найдено' : 'ещё ищем'}`;
  return `√72 ${m.simp72 ? 'упрощён ✓' : 'не упрощён'} · √50 ${m.simp50 ? 'упрощён ✓' : 'не упрощён'}`;
}

// ---------- Scheme tab ----------
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const pbtn = (data, label, on) => `<button data-p="${data}" aria-pressed="${!!on}">${label}</button>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'irr') h = `<h2>Подбор корня</h2><div class="chips">${NS.map(N => pbtn('N-' + N, '√' + N, S.N === N)).join('')}</div>` +
    `<dl class="reads"><div><dt>x</dt><dd id="r1"></dd></div><div><dt>x²</dt><dd id="r2"></dd></div><div><dt>√N точно</dt><dd id="r3"></dd></div></dl>` +
    slider('inX', 'x (грубо, шаг 0,01)', 0, 3990, 10, S.xi) + `<p class="note" style="margin-top:8px">Тысячные подбирайте кнопками на поле.</p><div id="sDiag"></div>`;
  if (id === 'props') h = `<h2>Свойства корней</h2><div class="chips">${MODES.map(md => pbtn('mode-' + md, MODE_LBL[md], S.mode === md)).join('')}</div>` +
    `<dl class="reads"><div><dt>Левая</dt><dd id="r1"></dd></div><div><dt>Правая</dt><dd id="r2"></dd></div><div><dt>Равны?</dt><dd id="r3"></dd></div></dl>` +
    slider('inA', 'a', S.mode === 'sq' ? -10 : 0, S.mode === 'sq' ? 10 : 25, 1, S.a) + (S.mode === 'sq' ? '' : slider('inB', 'b', S.mode === 'div' ? 1 : 0, 25, 1, S.b)) + '<div id="sDiag"></div>';
  if (id === 'simp') h = `<h2>Вынесение множителя</h2><div class="chips">${NUMS.map(n => pbtn('n-' + n, '√' + n, S.n === n)).join('')}</div>` +
    `<dl class="reads"><div><dt>k²</dt><dd id="r1"></dd></div><div><dt>Под корнем</dt><dd id="r2"></dd></div><div><dt>Итог</dt><dd id="r3"></dd></div></dl>` +
    `<h3>Квадрат-делитель</h3><div class="chips">${KS.map(k => pbtn('k-' + k, k * k, S.k === k)).join('')}</div><div id="sDiag"></div>`;
  el.innerHTML = h;
  const on = (sel, ev, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener(ev, fn); };
  on('#inX', 'input', e => { S.xi = +e.target.value; update(); });
  on('#inA', 'input', e => setA(+e.target.value));
  on('#inB', 'input', e => setB(+e.target.value));
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pick(b.dataset.p); updateScheme(model()); });
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (!el.querySelector('#sDiag')) return;
  const press = pre => el.querySelectorAll(`[data-p^="${pre}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.p === pre + ({ 'N-': S.N, 'mode-': S.mode, 'n-': S.n, 'k-': S.k })[pre]));
  if (m.kind === 'irr') {
    set('#r1', xs(m.xi)); set('#r2', dec(m.sq / 1e6, 4)); set('#r3', m.rational ? String(Math.round(m.root)) : dec(m.root, 4) + '…');
    set('#inXO', xs(m.xi)); val('#inX', m.xi); press('N-');
  } else if (m.kind === 'props') {
    set('#r1', dec(m.L, 3)); set('#r2', dec(m.R, 3)); set('#r3', m.eq ? 'да' : 'нет');
    set('#inAO', ns(m.a)); set('#inBO', m.b); val('#inA', m.a); val('#inB', m.b); press('mode-');
  } else {
    set('#r1', m.k === 1 ? '—' : m.k * m.k); set('#r2', m.ok ? m.m : '—'); set('#r3', m.ok ? kroot(m.k, m.m) : 'не делится');
    press('n-'); press('k-');
  }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'irr') {
    const N = m.N;
    let h = `<h2>Подбираем √${N}</h2><div class="formula">x = ${xs(m.xi)} → x² = ${x2s(m.xi)}</div><h3>Метод вилки</h3><div class="steps">`;
    let lo = 0;
    for (let p = 0; p < 4; p++) {
      const st = PLACE[p];
      while ((lo + st) * (lo + st) <= N * 1e6 && lo + st < 4000) lo += st;
      if (p <= m.place || S.done.irr) h += step(PLACE_NAME[p], `${xs(lo)}² = ${x2s(lo)} ≤ ${N} < ${x2s(lo + st)} = ${xs(lo + st)}²`, p === 3 ? 'sum' : '');
    }
    if (m.place < 3 && !S.done.irr) h += step('дальше', 'выберите следующий разряд — появится ещё шаг');
    h += `</div><h3>Сейчас</h3><div class="steps">` + step('x²', `${xs(m.xi)} · ${xs(m.xi)} = ${x2s(m.xi)}`) + step('сравнение с N', m.cmp < 0 ? `${x2s(m.xi)} < ${N} — мало` : m.cmp > 0 ? `${x2s(m.xi)} > ${N} — много` : `ровно ${N}`, 'sum') + `</div>`;
    h += `<h3>Почему √2 не дробь</h3><div class="steps">` + step('пусть', '√2 = m/n, дробь несократима') + step('тогда', 'm² = 2n², значит m чётно: m = 2k') + step('подставим', '4k² = 2n², n² = 2k², n тоже чётно') + step('противоречие', 'дробь сокращается на 2 — значит √2 иррационально', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Корень из натурального числа либо целый (√4 = 2, √9 = 3), либо иррациональный.</p>`;
  }
  if (id === 'props') {
    const a = m.a, b = m.b;
    let h = `<h2>Проверяем свойство</h2><div class="formula">${{ mul: '√(ab) = √a · √b', div: '√(a : b) = √a : √b', sq: '√(a²) = |a|', sum: '√(a + b) ≠ √a + √b' }[m.mode]}</div><h3>При ${m.mode === 'sq' ? `a = ${ns(a)}` : `a = ${a}, b = ${b}`}</h3><div class="steps">`;
    if (m.mode === 'mul') h += step('a · b', `${a} · ${b} = ${a * b}`) + step(`√${a * b}`, approx(m.L)) + step(`√${a} · √${b}`, `${approx(Math.sqrt(a))} · ${approx(Math.sqrt(b)).replace('≈ ', '')} ${approx(m.R)}`) + step('вывод', m.eq ? 'равны ✓' : 'не равны', 'sum');
    if (m.mode === 'div') h += step('a : b', `${a} : ${b} = ${sd(a / b, 4)}`) + step('√(a : b)', approx(m.L)) + step(`√${a} : √${b}`, approx(m.R)) + step('вывод', m.eq ? 'равны ✓' : 'не равны', 'sum');
    if (m.mode === 'sq') h += step('a²', `${a < 0 ? '(' + ns(a) + ')' : a}² = ${a * a}`) + step(`√${a * a}`, `${Math.abs(a)}, ведь ${Math.abs(a)}² = ${a * a} и ${Math.abs(a)} ≥ 0`) + step('|a|', `|${ns(a)}| = ${Math.abs(a)}`) + step('вывод', a < 0 ? `√(a²) = −a = ${Math.abs(a)}, а не a` : '√(a²) = a', 'sum');
    if (m.mode === 'sum') h += step('√(a + b)', `√${a + b} ${approx(m.L)}`) + step('√a + √b', `${approx(Math.sqrt(a))} + ${approx(Math.sqrt(b)).replace('≈ ', '')} ${approx(m.R)}`) + step('квадрат правой части', `(√a + √b)² = a + b + 2√(ab) = ${a + b} + ${dec(2 * Math.sqrt(a * b), 3)}`) + step('вывод', m.eq ? 'равны — лишнее слагаемое 2√(ab) пропало' : 'правая часть больше на «лишний» кусок', 'sum');
    h += `</div><h3>Пример на счёт в уме</h3><div class="steps">` + step('√2 · √8', '√16 = 4') + step('√50 : √2', '√25 = 5') + step('√(9 · 16)', '3 · 4 = 12') + step('(√7)²', '7', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Условия важны: √a и √b определены только при a ≥ 0, b ≥ 0, а делить на √0 нельзя.</p>`;
  }
  let h = `<h2>Упрощаем √${m.n}</h2><div class="formula">√${m.n} = ${kroot(m.km, m.mm)}</div>`;
  if (!S.simp[m.n]) h = `<h2>Упрощаем √${m.n}</h2><div class="formula">√${m.n} = ?</div>`;
  h += `<h3>Ваш шаг</h3><div class="steps">`;
  if (m.k === 1) h += step('k²', 'ещё не выбран');
  else if (!m.ok) h += step(`${m.n} : ${m.k * m.k}`, `${sd(m.n / (m.k * m.k), 3)} — не целое`, 'sum');
  else h += step('разложили', `${m.n} = ${m.k * m.k} · ${m.m}`) + step('корень из произведения', `√${m.k * m.k} · √${m.m}`) + step('вынесли', kroot(m.k, m.m), 'sum');
  h += `</div><h3>Квадраты-делители ${m.n}</h3><div class="steps">`;
  const divs = KS.filter(k => m.n % (k * k) === 0);
  h += step('делится на', divs.length ? (S.simp[m.n] ? divs.map(k => k * k).join(', ') : `${divs.length} ${plural(divs.length, 'квадрат', 'квадрата', 'квадратов')} из списка`) : 'ни на один') + `</div>`;
  h += `<h3>Другие преобразования</h3><div class="steps">` + step('внесение под корень', '3√2 = √(9 · 2) = √18') + step('подобные корни', '√8 + √18 = 2√2 + 3√2 = 5√2') + step('знаменатель без корня', '1/√2 = √2/(√2 · √2) = √2/2') + step('сравнение', '3√5 = √45 > √40 = 2√10', 'sum') + `</div>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'irr') el.innerHTML = `<div class="k">x² и N</div><div class="v ${ok || m.bracket ? 'ok' : ''}">${dec(m.sq / 1e6, 4)}</div><div class="lr"><span>N</span><span>${m.N}</span></div><div class="lr"><span>x</span><span>${xs(m.xi)}</span></div><div class="gauge"><b style="width:${clamp(m.sq / 1e6 / m.N * 80, 0, 100).toFixed(1)}%;background:${m.cmp > 0 ? 'var(--warn)' : 'var(--liq)'}"></b><i style="left:80%"></i></div>`;
  else if (id === 'props') el.innerHTML = `<div class="k">Левая / правая</div><div class="v ${m.eq ? 'ok' : ''}" style="${m.eq ? '' : 'color:var(--warn)'}">${dec(m.L, 2)} / ${dec(m.R, 2)}</div><div class="lr"><span>a</span><span>${ns(m.a)}</span></div><div class="lr"><span>b</span><span>${m.mode === 'sq' ? '—' : m.b}</span></div>`;
  else el.innerHTML = `<div class="k">Результат</div><div class="v ${m.full ? 'ok' : ''}">${m.ok ? kroot(m.k, m.m) : '√' + m.n}</div><div class="lr"><span>k²</span><span>${m.k === 1 ? '—' : m.k * m.k}</span></div><div class="lr"><span>упрощено</span><span>${(m.simp72 ? 1 : 0) + (m.simp50 ? 1 : 0)}/2</span></div>`;
}

function update() {
  if (LID() === 'props' && S.mode === 'sq' && S.a === -5 && !S.negSeen) { S.negSeen = true; toast('√((−5)²) = √25 = 5 = |−5|. Корень вернул модуль.'); }
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Корни приручены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  irr: '<rect x="8" y="9" width="18" height="18" fill="rgba(95,180,217,.35)" stroke="#5fb4d9"/><rect x="8" y="6" width="21" height="21" fill="none" stroke="#86e0a8" stroke-dasharray="3 2"/><text x="47" y="21" font-size="10" fill="#ffb547" text-anchor="middle" font-family="monospace">1,41</text>',
  props: '<rect x="6" y="7" width="40" height="6" rx="2" fill="#5fb4d9"/><rect x="6" y="17" width="54" height="6" rx="2" fill="#ffb547"/>',
  simp: '<rect x="20" y="2" width="26" height="26" fill="rgba(95,180,217,.2)" stroke="#86e0a8"/><path d="M28.7 2V28M37.3 2V28M20 10.7H46M20 19.3H46" stroke="#86e0a8" stroke-width=".8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  S.N = LESSONS[0].N; S.xi = LESSONS[0].x; S.place = 0;
  S.mode = LESSONS[1].mode; S.a = LESSONS[1].a; S.b = LESSONS[1].b; S.negSeen = false;
  S.n = LESSONS[2].n; S.k = 1; S.simp = {};
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'irr') now = `Ученик подбирает √${m.N} по цифрам. Слева два квадрата: площадью ${m.N} (сторона √${m.N}) и со стороной x. Сейчас x = ${xs(m.xi)}, x² = ${x2s(m.xi)}, это ${m.cmp < 0 ? 'меньше' : m.cmp > 0 ? 'больше' : 'ровно'} ${m.N}. ` +
    `Выбран разряд: ${PLACE_NAME[m.place]}. ${m.bracket && !m.exact ? `Найдена вилка ${xs(m.xi)} < √${m.N} < ${xs(m.xi + 1)}.` : ''}${m.exact ? `√${m.N} извлекается точно.` : ''} Для задания нужно N = 2 и вилка до тысячных.`;
  if (id === 'props') now = `Режим «${MODE_LBL[m.mode]}», a = ${ns(m.a)}${m.mode === 'sq' ? '' : `, b = ${m.b}`}. Левая часть ${m.lt} ≈ ${dec(m.L, 3)}, правая ${m.rt} ≈ ${dec(m.R, 3)} — ${m.eq ? 'равны' : 'не равны'}. ` +
    `Проверка √((−5)²): ${m.negSeen ? 'сделана' : 'не сделана'}. Вторая часть: в режиме √(a+b) найти a, b, при которых √(a+b) = √a + √b — ${m.mode === 'sum' && m.eq ? 'найдено' : 'не найдено'}.`;
  if (id === 'simp') now = `Упрощаем √${m.n}. Квадрат площадью ${m.n} разрезан на ${m.k}×${m.k} клеток (k² = ${m.k * m.k}); ${m.ok ? `площадь клетки ${m.m}, запись ${kroot(m.k, m.m)}, ${m.full ? 'упрощено до конца' : 'можно выносить дальше'}` : `${m.n} не делится на ${m.k * m.k}`}. ` +
    `√72 ${m.simp72 ? 'упрощён' : 'не упрощён'}, √50 ${m.simp50 ? 'упрощён' : 'не упрощён'}.`;
  return [
    `Раздел: математика, 8 класс, алгебра, тема «Квадратные корни». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (цифры √2, нужные a и b, самый большой квадрат-делитель): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    irr: 'Почему √2 нельзя записать обыкновенной дробью?', props: 'Почему √(a + b) обычно не равно √a + √b?',
    simp: 'Как быстро найти самый большой квадрат-делитель?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
