<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 8 класс: степень с нулевым и отрицательным показателем, свойства степеней с целым показателем, стандартный вид числа и вычисления в стандартном виде.">
<title>Степень с целым показателем</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.termbtns{display:grid;gap:6px;margin-top:8px}
.termbtns div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 8px}
.termbtns b{font:500 14px/1 var(--font-mono);min-width:44px}
.termbtns span{font-size:12.5px;color:var(--muted);flex:1}
.termbtns button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.termbtns button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">

      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: лестница степеней, числовая ось показателей, шкала масштабов от атома до Вселенной и задачи-оценки. Варианты ответа можно нажимать, бегунок шкалы — перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff', DIM = '#6b7690';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const big = v => { const s = String(Math.abs(v)); const g = s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s; return (v < 0 ? '−' : '') + g; };
const sd = (v, d = 3) => { if (Math.abs(v - Math.round(v)) < 1e-9) return big(Math.round(v)); let s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && s !== '0' ? '−' : '') + s; };
const SUPC = { '−': '⁻', '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = v => String(v).split('').map(ch => SUPC[ch] || ch).join('');
const pw = (b, n) => b + sup(ns(n));
const sci = (a, e) => `${sd(a, 4)} · 10${sup(ns(e))}`;
const par = v => v < 0 ? '(' + ns(v) + ')' : ns(v);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

// ---------- lesson 1: ladder of powers ----------
const TOP = 4, BOT = -4;
const frac = (b, n) => n >= 0 ? big(b ** n) : '1/' + big(b ** -n);
const dec = (b, n) => n >= 0 ? big(b ** n) : (b ** n).toFixed(-n).replace('.', ',');
function ladderQ(b, n) {
  if (n === 0) return { o: ['0', '1', String(b)], ok: 1 };
  const k = -n, c = '1/' + big(b ** k), w1 = '−' + big(b ** k);
  let w2 = '−' + big(b * k); if (w2 === w1) w2 = '0';
  const arr = [c, w1, w2], r = (k + (b === 10 ? 1 : 0)) % 3;
  const o = arr.slice(r).concat(arr.slice(0, r));
  return { o, ok: o.indexOf(c) };
}

// ---------- lesson 2: properties, step by step ----------
const RULES = [
  { id: 'mul', f: 'aᵐ · aⁿ = aᵐ⁺ⁿ' }, { id: 'div', f: 'aᵐ : aⁿ = aᵐ⁻ⁿ' }, { id: 'pow', f: '(aᵐ)ⁿ = aᵐⁿ' },
  { id: 'prod', f: '(ab)ⁿ = aⁿbⁿ' }, { id: 'neg', f: 'a⁻ⁿ = 1/aⁿ' }, { id: 'zero', f: 'a⁰ = 1' }];

    h += T(260, 398, 10.5, 'записано: ' + Q3IDS.map(i => (m.got[i] ? '✓ ' : '○ ') + OB[i].name.split(' (')[0]).join('   '), m.nGot === Q3IDS.length ? GREEN : DIM);
  }
  return h;
}

// ---------- lesson 4: estimates ----------
const PX = { x0: 44, x1: 476, y: 318, min: -15, max: 27 };
const pX = e => PX.x0 + (e - PX.min) / (PX.max - PX.min) * (PX.x1 - PX.x0);
function calcSVG(m) {
  let h = '';
  PR.forEach((P, i) => { const ok = !!m.solved[i]; h += chip(180 + (i % 2) * 160, 102 + Math.floor(i / 2) * 32, 152, (ok ? '✓ ' : '') + P.name, m.pi === i, 'pr-' + i, ok ? GREEN : null, 11.5); });
  h += T(498, 158, 10, `решено: ${m.nSolved} из ${PR.length}`, m.nSolved === PR.length ? GREEN : DIM, 'end');
  const P = m.P, [ma, ea] = P.A, [mb, eb] = P.B;
  h += T(260, 182, 12, P.l1, FG) + T(260, 199, 12, P.l2, FG);
  h += R(84, 210, 150, 34, '#141c2b', `rx="8" stroke="${BLUE}" stroke-width="1.3"`) + T(159, 232, 16, sci(ma, ea), BLUE, 'middle', 'font-weight="500"');
  h += T(260, 234, 22, P.op === '·' ? '×' : ':', FG, 'middle', 'font-weight="500"');
  h += R(286, 210, 150, 34, '#141c2b', `rx="8" stroke="${VIOL}" stroke-width="1.3"`) + T(361, 232, 16, sci(mb, eb), VIOL, 'middle', 'font-weight="500"');
  const mr = P.op === '·' ? ma * mb : ma / mb, er = P.op === '·' ? ea + eb : ea - eb, s1 = m.st >= 1;
  h += T(150, 266, 12, 'множители:', MUTED, 'end') + T(158, 266, 12, `${sd(ma)} ${P.op} ${sd(mb)} = ${s1 ? sd(mr) : '?'}`, s1 ? GREEN : FG, 'start', 'font-weight="500"');
  h += T(150, 285, 12, 'степени:', MUTED, 'end') + T(158, 285, 12, `10${sup(ns(ea))} ${P.op} 10${sup(ns(eb))} = 10${s1 ? sup(ns(er)) : '?'}`, s1 ? GREEN : FG, 'start', 'font-weight="500"');
  if (s1) h += T(372, 285, 10.5, P.op === '·' ? `(${ns(ea)} + ${par(eb)} = ${ns(er)})` : `(${ns(ea)} − ${par(eb)} = ${ns(er)})`, DIM, 'start');
  // order ruler
  h += L(PX.x0, PX.y, PX.x1, PX.y, DIM, 1.3);
  for (let e = PX.min; e <= PX.max; e++) h += L(pX(e), PX.y - (e % 3 ? 2 : 4), pX(e), PX.y + (e % 3 ? 2 : 4), e === 0 ? FG : DIM, 1);
  PREF.forEach(([e, p]) => { h += T(pX(e), PX.y + 14, 9, p, DIM); });
  h += T(pX(0), PX.y + 14, 9, '10⁰', FG) + T(PX.x0 - 4, PX.y + 4, 9, 'порядок', DIM, 'end');
  h += C(pX(ea), PX.y - 6, 3.5, BLUE) + C(pX(eb), PX.y - 6, 3.5, VIOL);
  if (m.fin) { const [rm, re] = P.R; h += C(pX(re), PX.y, 6, GREEN, `stroke="${INK}" stroke-width="1.4"`) + T(pX(re), PX.y - 11, 10.5, sci(rm, re), GREEN, re > 20 ? 'end' : 'middle', 'font-weight="500" ' + HALO); }
  else h += T(PX.x1, PX.y - 10, 9.5, 'порядок ответа появится после решения', DIM, 'end');
  if (!m.fin) {
    const s = P.steps[m.st];
    h += T(260, 352, 12, `Шаг ${m.st + 1} из ${P.steps.length}: ${s.t}`, FG, 'middle', 'font-weight="500"');
    s.o.forEach((o, j) => { h += chip(30 + j * 156, 375, 148, o, false, 'op-' + j, null, 12.5, 26); });
  } else {
    h += T(260, 354, 13, `Ответ: ${P.steps[P.steps.length - 1].o[P.steps[P.steps.length - 1].ok]}`, GREEN, 'middle', 'font-weight="500"');
    h += T(260, 375, 11, m.nSolved < PR.length ? 'Задача решена. Выберите следующую сверху.' : 'Все задачи решены!', MUTED);
  }
  if (m.msg) h += T(260, 403, 11, m.msg.t, m.msg.ok ? GREEN : RED, 'middle', 'font-weight="500"');
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'zero') return { bases: [240, 84, 256, 32], cols: [34, 170, 458, 14], ladder: [30, 182, 464, 196], bars: [328, 182, 166, 196], rule: [40, 376, 440, 34] }[id];
  if (lid === 'props') return { cards: [172, 84, 326, 68], chain: [20, 176, 480, 28], rules: [28, 204, 464, 54], axis: [36, 262, 448, 76], steps: [24, 330, 472, 56] }[id];
  if (lid === 'sci') return { box: [ZB.x, ZB.y, ZB.w, ZB.h], scalebar: [176, 92, 316, 66], ruler: [28, 318, 464, 40], qs: [24, 360, 472, 48] }[id];
  return { probs: [174, 84, 324, 68], text: [24, 168, 472, 38], cards: [80, 206, 360, 42], lanes: [40, 252, 440, 40], order: [36, 298, 448, 32], steps: [24, 338, 472, 54] }[id];
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  if (id === 'zero') h += zeroSVG(m);
  else if (id === 'props') h += propsSVG(m);
  else if (id === 'sci') h += sciSVG(m);
  else h += calcSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
let drag = null, dirty = true;
// The shared task card (with the lab-shell «how to» button and lesson formulas) covers the
// top-left of the stage. Scenes keep x < 170 empty above y ≈ 170; if the card still reaches the
// content, the content is shrunk a little and moved to the right of the card.
const taskCard = $('#stage .task');
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 520, hh / 410, 1.45);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 408 - VB.h;
  const cr = taskCard && taskCard.getBoundingClientRect();
  if (cr && cr.width && w > 600) {
    const R0 = cr.right - rc.left + 8, B0 = cr.bottom - rc.top + 6;
    const ru = VB.x + R0 / s, bu = VB.y + B0 / s;
    if ((bu > 168 && ru > 22) || (bu > 86 && ru > 172)) {
      const s1 = Math.min((w - R0) / 486, hh / 410, 1.45);
      if (s1 >= s * 0.66) { s = s1; VB = { w: w / s, h: hh / s }; VB.x = 20 - R0 / s; VB.y = 408 - VB.h; }
    }
  }
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);
if (taskCard) new ResizeObserver(fit).observe(taskCard);

// ---------- actions ----------
function setBase(b) { S.b1 = b; S.n1 = Math.max(S.low1[b], Math.min(S.n1, TOP)); S.q1 = false; update(); if (S.tab === 'scheme') buildScheme(); }
function stepDown() {
  const b = S.b1, low = S.low1[b];
  if (S.n1 > low) { S.n1--; S.q1 = false; update(); return; }
  if (low - 1 < BOT) { toast('Ниже ' + pw(b, BOT) + ' на этой лестнице не спускаемся.'); return; }
  S.q1 = true; update();
}
function stepUp() { S.q1 = false; S.n1 = Math.min(TOP, S.n1 + 1); update(); }
function tapRung(n) {
  const low = S.low1[S.b1];
  if (n >= low) { S.n1 = n; S.q1 = false; update(); }
  else if (n === low - 1) { S.n1 = low; S.q1 = true; update(); }
  else toast('Спускайтесь по одной ступеньке: каждый шаг — деление на ' + S.b1 + '.');
}
function answerLadder(j) {
  const m = model(); if (m.q === null) return;
  const b = m.b, n = m.q, Q = ladderQ(b, n);
  if (j === Q.ok) {
    S.low1[b] = n; S.n1 = n; S.q1 = false;
    toast(n === 0 ? `${b}¹ : ${b} = 1, значит ${pw(b, 0)} = 1.` : `${dec(b, n + 1)} : ${b} = ${frac(b, n)}, значит ${pw(b, n)} = 1/${pw(b, -n)}.`);
  } else toast(`Шаг вниз — это деление на ${b}: ${frac(b, n + 1)} : ${b}. Минус в показателе не делает число отрицательным.`);
  update(); if (S.tab === 'scheme') buildScheme();
}
function setEx(i) { S.ei = i; S.msg2 = null; update(); if (S.tab === 'scheme') buildScheme(); }
function answerStep(j) {
  const id = LID();
  if (id === 'props') {
    const E = EX[S.ei], st = S.st2[S.ei]; if (st >= E.steps.length) return;
    const s = E.steps[st];
    if (j === s.ok) {
      S.st2[S.ei]++; S.msg2 = { ok: true, t: 'Верно: ' + RULES.find(r => r.id === s.rule).f };
      if (S.st2[S.ei] === E.steps.length) { S.solved2[S.ei] = true; toast(`${E.s} = ${s.res.split(' = ').pop()}`); }
    } else S.msg2 = { ok: false, t: s.tip };
  } else {
    const P = PR[S.pi], st = S.st4[S.pi]; if (st >= P.steps.length) return;
    const s = P.steps[st];
    if (j === s.ok) {
      S.st4[S.pi]++; S.msg4 = { ok: true, t: 'Верно: ' + s.tip };
      if (S.st4[S.pi] === P.steps.length) { S.solved4[S.pi] = true; toast(`${P.name}: ${s.o[s.ok]}.`); }
    } else S.msg4 = { ok: false, t: 'Не сходится. ' + s.tip };
  }
  update(); if (S.tab === 'scheme') buildScheme();
}
function setK(k) { k = clamp(Math.round(k), KMIN, KMAX); if (k === S.k3) return; S.k3 = k; if (S.q3 && !vis(OB[S.q3], k)) S.q3 = null; update(); }
function tapObj(id) {
  const o = OB[id];
  if (Q3[id] && !S.got3[id]) { S.q3 = id; update(); if (S.tab === 'scheme') buildScheme(); return; }
  toast(`${o.name}: ≈ ${sci(o.a, o.e)} м`);
}
function answerSci(j) {
  const id = S.q3; if (!id) return;
  const Q = Q3[id];
  if (j === Q.ok) {
    S.got3[id] = true; S.q3 = null; S.order3 = S.order3.filter(x => x !== id).concat(id);
    toast(`${OB[id].name}: ${Q.o[Q.ok]}`);
  } else toast(Q.tip);
  update(); if (S.tab === 'scheme') buildScheme();
}
function setPr(i) { S.pi = i; S.msg4 = null; update(); if (S.tab === 'scheme') buildScheme(); }
function pick(p) {
  if (p.startsWith('b-')) setBase(+p.slice(2));
  else if (p.startsWith('rung-')) tapRung(+p.slice(5));
  else if (p.startsWith('q-')) answerLadder(+p.slice(2));
  else if (p.startsWith('ex-')) setEx(+p.slice(3));
  else if (p.startsWith('op-')) answerStep(+p.slice(3));
  else if (p.startsWith('obj-')) tapObj(p.slice(4));
  else if (p.startsWith('qa-')) answerSci(+p.slice(3));
  else if (p.startsWith('pr-')) setPr(+p.slice(3));
}

// ---------- pointer ----------
const toSvg = e => { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const c = scene.getScreenCTM(); return c ? p.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    // the answer chips on a rung lie inside the rung group: the innermost pick wins
    e.preventDefault(); pick(pk.dataset.pick); return;
  }
  if (LID() !== 'sci') return;
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {} scene.classList.add('grabbing');
  drag = { kind: 'k' }; setK(rK(toSvg(e).x));
});
scene.addEventListener('pointermove', e => { if (!drag) return; setK(rK(toSvg(e).x)); });
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label) => `<button data-a="${k}">${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    zero: B('up', '× a — вверх') + B('down', '÷ a — вниз') + sep + B('base', 'Сменить основание') + B('zreset', 'Сначала'),
    props: B('prevE', '‹ Выражение') + B('nextE', 'Выражение ›') + sep + B('eReset', 'Заново'),
    sci: B('k-3', '÷ 1000') + B('k-1', '÷ 10') + B('k+1', '× 10') + B('k+3', '× 1000') + sep + B('kNext', 'К следующему «?»'),
    calc: B('prevP', '‹ Задача') + B('nextP', 'Задача ›') + sep + B('pReset', 'Заново'),
  }[id];
}
function act(a) {
  if (a === 'up') return stepUp();
  if (a === 'down') return stepDown();
  if (a === 'base') return setBase(S.b1 === 2 ? 10 : 2);
  if (a === 'zreset') { S.low1[S.b1] = 1; S.n1 = TOP; S.q1 = false; update(); return; }
  if (a === 'prevE' || a === 'nextE') return setEx((S.ei + (a === 'nextE' ? 1 : EX.length - 1)) % EX.length);
  if (a === 'eReset') { S.st2[S.ei] = 0; S.msg2 = null; update(); return; }
  if (a.startsWith('k+') || a.startsWith('k-')) return setK(S.k3 + (+a.slice(1)));
  if (a === 'kNext') {
    const left = Q3IDS.filter(i => !S.got3[i]);
    if (!left.length) { toast('Все четыре объекта записаны.'); return; }
    const o = OB[left.find(i => OB[i].e > S.k3) || left[0]];
    setK(o.e); S.q3 = o.id; update(); return;
  }
  if (a === 'prevP' || a === 'nextP') return setPr((S.pi + (a === 'nextP' ? 1 : PR.length - 1)) % PR.length);
  if (a === 'pReset') { S.st4[S.pi] = 0; S.msg4 = null; update(); }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'zero') return `Основание 2: до ${pw(2, m.low2)} · основание 10: до ${pw(10, m.low10)} · цель: ступенька −3`;

}

// ---------- Scheme tab ----------
const pbtn = (data, label, on) => `<button data-p="${data}" aria-pressed="${!!on}">${label}</button>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme'), m = model();
  let h = '';
  if (id === 'zero') {
    h = `<h2>Лестница степеней</h2><div class="chips">${pbtn('b-2', 'a = 2', S.b1 === 2)}${pbtn('b-10', 'a = 10', S.b1 === 10)}</div>` +
      `<dl class="reads"><div><dt>Ступенька</dt><dd id="r1"></dd></div><div><dt>Дробь</dt><dd id="r2"></dd></div><div><dt>Десятичная</dt><dd id="r3"></dd></div></dl>` +
      `<div class="row"><button class="ghostbtn" data-a="up">× a — вверх</button><button class="ghostbtn" data-a="down">÷ a — вниз</button></div>`;
    if (m.q !== null) { const Q = ladderQ(m.b, m.q); h += `<h3>${pw(m.b, m.q)} = ?</h3><div class="chips">${Q.o.map((o, j) => pbtn('q-' + j, o, false)).join('')}</div>`; }
  }
  if (id === 'props') {
    h = `<h2>Упрощение по шагам</h2><div class="chips">${EX.map((E, i) => pbtn('ex-' + i, (S.solved2[i] ? '✓ ' : '') + E.s, S.ei === i)).join('')}</div>` +
      `<dl class="reads"><div><dt>Шаг</dt><dd id="r1"></dd></div><div><dt>Готово</dt><dd id="r2"></dd></div><div><dt>Свойство</dt><dd id="r3"></dd></div></dl>`;
    if (!m.fin) h += `<h3>${m.E.steps[m.st].t}</h3><div class="chips">${m.E.steps[m.st].o.map((o, j) => pbtn('op-' + j, o, false)).join('')}</div>`;
  }
  if (id === 'sci') {
    h = `<h2>Масштаб</h2><dl class="reads"><div><dt>Порядок</dt><dd id="r1"></dd></div><div><dt>Видно</dt><dd id="r2"></dd></div><div><dt>Записано</dt><dd id="r3"></dd></div></dl>` +
      `<div class="ctl"><label for="inK">Масштаб рамки, 10ᵏ м <output id="inKO"></output></label><input type="range" id="inK" min="${KMIN}" max="${KMAX}" step="1" value="${S.k3}"></div>` +
      `<h3>Объекты задания</h3><div class="chips">${Q3IDS.map(i => pbtn('obj-' + i, (S.got3[i] ? '✓ ' : '') + OB[i].name, S.q3 === i)).join('')}</div>`;
    if (S.q3) h += `<h3>${OB[S.q3].name}: ${Q3[S.q3].full}</h3><div class="chips">${Q3[S.q3].o.map((o, j) => pbtn('qa-' + j, o, false)).join('')}</div>`;
  }
  if (id === 'calc') {

function updateScheme(m) {

  if (m.kind === 'zero') { set('#r1', pw(m.b, m.n)); set('#r2', frac(m.b, m.n)); set('#r3', dec(m.b, m.n)); }
  else if (m.kind === 'props') { set('#r1', m.fin ? 'готово' : `${m.st + 1} / ${m.E.steps.length}`); set('#r2', `${m.nSolved} / ${EX.length}`); set('#r3', m.st ? RULES.find(r => r.id === m.E.steps[m.st - 1].rule).f : '—'); }
  else if (m.kind === 'sci') { set('#r1', '10' + sup(ns(m.k)) + ' м'); set('#r2', m.shown.length); set('#r3', `${m.nGot} / ${Q3IDS.length}`); set('#inKO', ns(m.k)); val('#inK', m.k); }
  else { const P = m.P, mr = P.op === '·' ? P.A[0] * P.B[0] : P.A[0] / P.B[0], er = P.op === '·' ? P.A[1] + P.B[1] : P.A[1] - P.B[1]; set('#r1', m.fin ? 'готово' : `${m.st + 1} / ${P.steps.length}`); set('#r2', m.st ? sd(mr) : '?'); set('#r3', m.st ? '10' + sup(ns(er)) : '?'); }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'zero') {
    const b = m.b, n = m.n;
    let h = `<h2>${pw(b, n)} = ${frac(b, n)}</h2><div class="formula">a⁰ = 1,  a⁻ⁿ = 1/aⁿ  (a ≠ 0)</div><h3>Спуск по лестнице</h3><div class="steps">`;
    for (let k = TOP; k >= Math.max(m.low, BOT); k--) h += step(pw(b, k), k === TOP ? big(b ** TOP) : `${dec(b, k + 1)} : ${b} = ${frac(b, k)}`, k === m.low ? 'sum' : '');
    h += `</div><h3>Почему именно так</h3><div class="steps">` + step('свойство деления', `${pw(b, 3)} : ${pw(b, 3)} = ${pw(b, 0)}`) + step('и в то же время', `${big(b ** 3)} : ${big(b ** 3)} = 1`) + step('значит', `${pw(b, 0)} = 1`, 'sum') +
      step('аналогично', `${pw(b, 2)} : ${pw(b, 5)} = ${pw(b, -3)}`) + step('в числах', `${big(b ** 2)} : ${big(b ** 5)} = 1/${big(b ** 3)}`) + step('значит', `${pw(b, -3)} = 1/${pw(b, 3)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Внимание: 2⁻³ = 1/8, а не −8 и не −6. Отрицательный показатель даёт положительное число меньше 1 (при a > 1).</p>`;
  }
  if (id === 'props') {
    const E = m.E;
    let h = `<h2>${E.s}</h2><div class="formula" style="font-size:15px">aᵐ·aⁿ = aᵐ⁺ⁿ   aᵐ:aⁿ = aᵐ⁻ⁿ   (aᵐ)ⁿ = aᵐⁿ</div><h3>Ход решения</h3><div class="steps">`;
    E.steps.forEach((s, k) => { h += step(`${k + 1}. ${s.t}`, k < m.st ? s.res : k === m.st ? 'сейчас' : '…', k === E.steps.length - 1 && m.fin ? 'sum' : ''); });
    h += `</div><h3>Все свойства (a ≠ 0, b ≠ 0)</h3><div class="steps">` + RULES.map(r => step(r.f, { mul: '2⁵ · 2⁻³ = 2² = 4', div: '10⁻² : 10⁻⁵ = 10³', pow: '(3⁻¹)² = 3⁻² = 1/9', prod: '(2x)⁻¹ = 1/(2x)', neg: '5⁻² = 1/25', zero: '(−7)⁰ = 1' }[r.id])).join('') + step('(a/b)ⁿ = aⁿ/bⁿ', '(2/3)⁻² = (3/2)² = 9/4', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Полезный приём: (a/b)⁻ⁿ = (b/a)ⁿ — отрицательный показатель «переворачивает» дробь.</p>`;
  }
  if (id === 'sci') {
    let h = `<h2>Масштаб 10${sup(ns(m.k))} м</h2><div class="formula">a · 10ⁿ,  1 ≤ a < 10</div><h3>Одно деление</h3><div class="steps">` +
      step('степень', '10' + sup(ns(m.k)) + ' м') + step('десятичная запись', m.k >= -10 && m.k <= 12 ? decK(m.k) + ' м' : 'слишком много нулей', 'sum') + `</div><h3>Видно в окне</h3><div class="steps">`;
    h += m.shown.length ? m.shown.map(x => step(x.o.name, sci(x.o.a, x.o.e) + ' м')).join('') : step('—', 'пусто');
    h += `</div><h3>Как перевести</h3><div class="steps">` + step('12 742 000', 'запятая влево на 7 → 1,2742 · 10⁷') + step('0,0000001', 'запятая вправо на 7 → 1 · 10⁻⁷') + step('12,742 · 10⁶', 'не стандартный вид: 12,742 ≥ 10', 'sum') + `</div>`;
    h += `<h3>Сравнение порядков</h3><div class="steps">` + step('Солнце : Земля', '1,39 · 10⁹ : 1,27 · 10⁷ ≈ 1,1 · 10² — примерно в 110 раз') + step('бактерия : вирус', '2 · 10⁻⁶ : 1 · 10⁻⁷ = 20 — в 20 раз') + step('Вселенная : атом', '≈ 10²⁷ : 10⁻¹⁰ = 10³⁷', 'sum') + `</div>`;
    return h;
  }
  const P = m.P, [ma, ea] = P.A, [mb, eb] = P.B, mr = P.op === '·' ? ma * mb : ma / mb, er = P.op === '·' ? ea + eb : ea - eb;
  let h = `<h2>${P.name}</h2><div class="formula" style="font-size:15px">${sci(ma, ea)} ${P.op} ${sci(mb, eb)}</div><h3>Прикидка порядком</h3><div class="steps">` +
    step('степени', `10${sup(ns(ea))} ${P.op} 10${sup(ns(eb))} = 10${sup(ns(er))}`) + step('множители', `${sd(ma)} ${P.op} ${sd(mb)} = ${sd(mr)}`) + step('итого', `≈ ${sd(mr)} · 10${sup(ns(er))}`, 'sum') + `</div><h3>Ход решения</h3><div class="steps">`;
  P.steps.forEach((s, k) => { h += step(`${k + 1}. ${s.t}`, k < m.st ? s.o[s.ok] : k === m.st ? 'сейчас' : '…', k === P.steps.length - 1 && m.fin ? 'sum' : ''); });
  h += `</div><h3>Приставки</h3><div class="steps">` + step('кило / мега / гига', '10³ / 10⁶ / 10⁹') + step('тера / пета / экса', '10¹² / 10¹⁵ / 10¹⁸') + step('милли / микро / нано', '10⁻³ / 10⁻⁶ / 10⁻⁹', 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Если ответ ИИ или калькулятора расходится с прикидкой на несколько порядков — ищите ошибку: потерянный минус в показателе или лишний ноль.</p>`;
}

  else el.innerHTML = `<div class="k">Шаг решения</div><div class="v ${m.fin ? 'ok' : ''}">${m.fin ? 'решено' : (m.st + 1) + ' из ' + m.P.steps.length}</div><div class="lr"><span>задача</span><span>${m.pi + 1}/${PR.length}</span></div><div class="lr"><span>решено</span><span>${m.nSolved}/${PR.length}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Степени с целым показателем освоены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.b1 = 2; S.low1 = { 2: 1, 10: 1 }; S.n1 = TOP; S.q1 = false;
  S.ei = 0; S.st2 = EX.map(() => 0); S.solved2 = {}; S.msg2 = null;
  S.k3 = 0; S.q3 = null; S.got3 = {}; S.order3 = [];
  S.pi = 0; S.st4 = PR.map(() => 0); S.solved4 = {}; S.msg4 = null;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

    `Записано: ${Q3IDS.map(i => OB[i].name + (m.got[i] ? ' — да' : ' — нет')).join('; ')}.`;
  if (id === 'calc') now = `Задача ${m.pi + 1} из ${PR.length} «${m.P.name}»: ${m.P.l1} ${m.P.l2} ${m.fin ? 'Решена.' : `Сейчас шаг ${m.st + 1} из ${m.P.steps.length}: «${m.P.steps[m.st].t}», варианты: ${m.P.steps[m.st].o.join('; ')}.`} ` +
    `Принятые шаги: ${m.st ? m.P.steps.slice(0, m.st).map(s => s.o[s.ok]).join(' → ') : 'пока нет'}. Решено ${m.nSolved} из ${PR.length}.`;
  return [
    `Раздел: математика, 8 класс, алгебра, тема «Степень с целым показателем». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (значения степеней на ступеньках, верный шаг, запись в стандартном виде, ответы задач): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    zero: 'Почему a⁰ = 1, а не 0?', props: 'Почему при умножении степеней показатели складываются?',
    sci: 'Как быстро найти порядок числа?', calc: 'Как проверить ответ ИИ прикидкой по порядку?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где степени десяти нужны в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
