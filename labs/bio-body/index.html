<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 9 класс: скелет человека, мышцы и рычаги, осанка, травмы и первая помощь.">
<title>Опора и движение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="20" cy="9" r="4.2" fill="none" stroke="#e8dcc0" stroke-width="1.6"/><path d="M20 14v12M13 17h14M14 17l-2 9M26 17l2 9M20 26l-4 9M20 26l4 9" stroke="#e8dcc0" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="20" cy="26" r="1.8" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Движение</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const fr = x => f(x).replace('.', ','), fx = (x, n) => x.toFixed(n).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-body';
const DEG = Math.PI / 180;
const wrap = (s, n) => { const out = []; let cur = ''; for (const w of s.split(' ')) { if (cur && (cur + ' ' + w).length > n) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; } if (cur) out.push(cur); return out; };

// ---------- lesson 1: skeleton departments and bones ----------
const DEPT = {
  head: { name: 'Скелет головы', short: 'Череп', c: '#c9a8ef', parts: 'череп', job: 'защищает головной мозг и органы чувств' },
  trunk: { name: 'Скелет туловища', short: 'Туловище', c: '#72d4e8', parts: 'позвоночник и грудная клетка (рёбра, грудина)', job: 'главная опора тела, защита сердца, лёгких и спинного мозга' },
  ugird: { name: 'Пояс верхних конечностей', short: 'Плечевой пояс', c: '#86e0a8', parts: 'ключицы и лопатки', job: 'соединяет руки с туловищем' },
  uarm: { name: 'Свободная верхняя конечность', short: 'Рука', c: '#ffb547', parts: 'плечевая кость, кости предплечья и кисти', job: 'точные и разнообразные движения, работа руками' },
  lgird: { name: 'Пояс нижних конечностей', short: 'Тазовый пояс', c: '#ff8a73', parts: 'тазовые кости', job: 'держит вес туловища и передаёт его на ноги' },
  lleg: { name: 'Свободная нижняя конечность', short: 'Нога', c: '#e9d84f', parts: 'бедренная кость, кости голени и стопы', job: 'опора и передвижение' },
};
const DK = ['head', 'trunk', 'ugird', 'uarm', 'lgird', 'lleg'];
const BONES = [
  { id: 'skull', name: 'Череп', dept: 'head', type: 'в основном плоские кости', join: 'швы — неподвижно; нижняя челюсть — сустав', fact: 'Подвижна только нижняя челюсть: ею мы жуём и говорим.' },
  { id: 'spine', name: 'Позвоночник', dept: 'trunk', type: '33–34 позвонка — короткие губчатые кости', join: 'хрящевые диски — полуподвижно', fact: 'Четыре изгиба работают как пружина при ходьбе и прыжках.' },
  { id: 'ribs', name: 'Рёбра', dept: 'trunk', type: '12 пар изогнутых губчатых костей', join: 'с позвонками — суставы, с грудиной — хрящи', fact: 'С грудиной и позвонками образуют грудную клетку — щит для сердца и лёгких.' },
  { id: 'sternum', name: 'Грудина', dept: 'trunk', type: 'плоская губчатая кость', join: 'с рёбрами — через хрящи', fact: 'Внутри всю жизнь есть красный костный мозг — он делает клетки крови.' },
  { id: 'clavicle', name: 'Ключицы', dept: 'ugird', type: 'длинные изогнутые кости', join: 'суставы с грудиной и лопаткой', fact: 'Отодвигают плечо от груди. Часто ломаются при падении на руку.' },
  { id: 'scapula', name: 'Лопатки', dept: 'ugird', type: 'плоские треугольные кости', join: 'к туловищу держатся мышцами', fact: 'Лежат на спине поверх рёбер и двигаются вместе с рукой.' },
  { id: 'humerus', name: 'Плечевые кости', dept: 'uarm', type: 'длинные трубчатые кости', join: 'плечевой и локтевой суставы', fact: 'Плечевой сустав шаровидный — самый подвижный в теле.' },

function armModel() {
  const a = S.angle * DEG, u = [Math.sin(a), Math.cos(a)];
  const cr = (p, q) => p[0] * q[1] - p[1] * q[0];
  const I = [ARM.ins * u[0], ARM.ins * u[1]], O = ARM.O;
  const rb = Math.abs(cr(I, O)) / Math.hypot(O[0] - I[0], O[1] - I[1]);
  const P = [-0.025 * u[0] - 0.008, -0.025 * u[1]], T = ARM.T0;
  const rt = Math.abs(cr(P, T)) / Math.hypot(T[0] - P[0], T[1] - P[1]);
  const sn = Math.sin(a), g = ARM.g;
  const Mload = g * S.mass * ARM.L * sn, Mfore = g * ARM.mf * ARM.Lf * sn;
  // positive M pulls the forearm towards a straight arm — the flexor (biceps) has to hold it
  const M = S.mode === 'hold' ? Mload + Mfore : Mfore - Mload;
  const Fb = M > 0 ? M / rb : 0, Ft = M < 0 ? -M / rt : 0;
  return { u, I, O, P, T, rb, rt, sn, Mload, Mfore, M, Fb, Ft, W: S.mass * g };
}

}

function hlBox(id) {
  const L = LID();
  if (L === 'skeleton') return { head: [[320, 40, 50, 62]], trunk: [[296, 96, 98, 144]], ugird: [[347, 104, 50, 62], [293, 104, 50, 62]], uarm: [[381, 112, 34, 156], [275, 112, 34, 156]], lgird: [[306, 198, 78, 58]], lleg: [[350, 234, 40, 166], [300, 234, 40, 166]] }[id] || null;

    const m = armModel(), sv = p => [ax(p), ay(p)], box = (pts, pad) => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad; return [[x0, y0, Math.max(...xs) + pad - x0, Math.max(...ys) + pad - y0]]; };
    const at = k => [k * m.u[0], k * m.u[1]];
    return { humerus: box([sv([0, .32]), sv([0, 0])], 12), forearm: box([sv(at(-.03)), sv(at(.28))], 12), biceps: box([sv(m.O), sv(m.I)], 12), triceps: box([sv(m.T), sv(m.P)], 12), elbow: box([[EX, EY]], 18), hand: box([sv(at(.27)), sv(at(.38))], 14) }[id] || null;

// fit the scene: 520 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {

// ---------- pointer: taps and dragging ----------

function dragTo(p) {
  const d = drag;
  if (d.k === 'hand') {
    const vx = (p.x - EX) / AK, vy = (EY - p.y) / AK, l = Math.hypot(vx, vy);
    if (l < 0.03) return;

  else if (d.k === 'desk') { S.desk = clamp(Math.round(d.v0 - (p.y - d.p0.y) / K3), 55, 85); update(); }

}

  if (id === 'skeleton') return DK.map(k => ({ id: k, icon: dot(DEPT[k].c), name: DEPT[k].name, spec: `${DEPT[k].parts[0].toUpperCase() + DEPT[k].parts.slice(1)}. Работа: ${DEPT[k].job}.` }));
  if (id === 'muscles') return [
    { id: 'humerus', icon: ICON.humerus, name: 'Плечевая кость', spec: 'Неподвижное плечо рычага. Сверху — плечевой сустав, снизу — локтевой.' },
    { id: 'forearm', icon: ICON.forearm, name: 'Предплечье', spec: 'Лучевая и локтевая кости — сам рычаг. Поворачивается вокруг локтя.' },
    { id: 'elbow', icon: ICON.elbow, name: 'Локтевой сустав', spec: 'Точка опоры рычага. Хрящ и суставная жидкость уменьшают трение.' },
    { id: 'biceps', icon: ICON.biceps, name: 'Двуглавая мышца (бицепс)', spec: 'Сгибатель. Сухожилием крепится к лучевой кости в 4 см от локтя.' },
    { id: 'triceps', icon: ICON.triceps, name: 'Трёхглавая мышца (трицепс)', spec: 'Разгибатель, антагонист бицепса. Крепится к локтевому отростку.' },
    { id: 'hand', icon: ICON.hand, name: 'Кисть и груз', spec: 'Груз в 33 см от локтя. Чем дальше груз, тем больше нужна сила мышцы.' }];
  return [
    { id: 'chair', icon: ICON.chair, name: 'Стул', spec: 'Правильная высота — колени под прямым углом, ступни на полу.' },
    { id: 'desk', icon: ICON.desk, name: 'Стол', spec: 'Локоть лежит на столе, плечи не подняты, спина не сгибается.' },
    { id: 'spine', icon: ICON.spine, name: 'Позвоночник', spec: 'Четыре естественных изгиба. При сутулой посадке грудной изгиб растёт.' },
    { id: 'eyes', icon: ICON.eyes, name: 'Глаза и тетрадь', spec: 'Расстояние 30–35 см. Ближе — устают глаза и наклоняется спина.' },
    { id: 'inj', icon: ICON.inj, name: 'Травмы', spec: 'Ушиб, растяжение, вывих, закрытый и открытый перелом.' },
    { id: 'aid', icon: ICON.aid, name: 'Первая помощь', spec: 'Покой, холод, повязка или шина — и обязательно к врачу.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') + (L.safe ? `<div class="safe"><b>Осторожно</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${L.id === 'skeleton' ? 'Отделы скелета' : L.id === 'muscles' ? 'Рука как рычаг' : 'Что на столе'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'skeleton') h += `<h3>Строение трубчатой кости</h3><div class="feat">` + [
      ['#86e0a8', 'Надкостница', 'Тонкая плёнка снаружи. За счёт её клеток кость растёт в толщину и срастается после перелома.'],
      ['#e8dcc0', 'Компактное вещество', 'Плотный слой в стенке кости. Даёт прочность.'],
      ['#ffb547', 'Губчатое вещество', 'Тонкие перекладины на концах кости, лежат по линиям нагрузки. Между ними — красный костный мозг.'],
      ['#e9d84f', 'Полость с жёлтым костным мозгом', 'Внутри тела трубчатой кости. Жёлтый мозг — в основном жировая ткань.'],
      ['#72d4e8', 'Хрящ', 'Покрывает суставные поверхности. У детей хрящевые зоны роста удлиняют кость.']].map(([c, b, s]) => `<div style="border-left-color:${c}"><b>${b}</b>${s}</div>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      const pid = b.dataset.id;
      if (L.id === 'posture') { const want = pid === 'inj' || pid === 'aid' ? 'inj' : 'desk'; if (S.view !== want) { S.view = want; renderTools(); update(); } }
      S.hl = { id: pid, t: performance.now() }; dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'skeleton') {
    const all = m.placed === NB;
    let h = `<h2>Как определить отдел</h2><div class="formula">скелет = голова + туловище + пояса конечностей + свободные конечности</div><div class="steps">` +
      step('1. Защищает мозг?', 'голова') + step('2. Ось тела и грудная клетка?', 'туловище') +
      step('3. Крепит конечность к туловищу?', 'пояс') + step('4. Сама двигается — плечо, бедро, кисть?', 'свободная конечность') + `</div>`;
    h += `<h3>Раскрашено по отделам</h3><div class="steps">` + DK.map(k => step(DEPT[k].name, `${BONES.filter(b => S.paint[b.id] === k).length} кост.`)).join('') +
      step('итого', all ? `верно ${m.right} из ${NB}` : `раскрашено ${m.placed} из ${NB}`, 'sum') + `</div>`;
    if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда все ${NB} костей будут раскрашены.</p>`;
    h += `<h3>Состав кости</h3><div class="steps">` + step('минеральные соли (кальций, фосфор)', '≈ 2/3 массы') + step('органическое вещество', '≈ 1/3 массы') +
      step('кость в кислоте (соли растворились)', 'гнётся') + step('кость после обжига (органика сгорела)', 'крошится') + step('у взрослого всего костей', '≈ 206', 'sum') + `</div>`;
    return h;
  }
  if (id === 'muscles') {
    const a = m.a, cm = x => fr(x * 100);
    let h = `<h2>Правило рычага</h2><div class="formula">F · r = M&nbsp;&nbsp;→&nbsp;&nbsp;F = M / r</div><div class="steps">` +
      step('угол в локте α', `${S.angle}°, sin α = ${fx(a.sn, 2)}`) +
      step('груз: m·g·0,33 м·sin α', `${S.mass}·9,8·0,33·${fx(a.sn, 2)} = ${fr(a.Mload)} Н·м`) +
      step('предплечье: 1,5·9,8·0,15 м·sin α', `${fr(a.Mfore)} Н·м`) +
      step(S.mode === 'hold' ? 'момент, разгибающий руку' : 'момент: предплечье − давление', `M = ${fr(Math.abs(a.M))} Н·м`) +
      (a.M >= 0 ? step('плечо силы бицепса r', `${cm(a.rb)} см`) + step('сила бицепса F = M / r', `${fr(Math.abs(a.M))} / ${fx(a.rb, 3)} = ${Math.round(a.Fb)} Н`, 'sum')
        : step('плечо силы трицепса r', `${cm(a.rt)} см`) + step('сила трицепса F = M / r', `${fr(-a.M)} / ${fx(a.rt, 3)} = ${Math.round(a.Ft)} Н`, 'sum')) + `</div>`;
    if (a.W > 0) h += `<h3>Сравнение</h3><div class="steps">` + step('вес груза m·g', `${fr(a.W)} Н`) + step('мышца тянет сильнее в', `${fr((a.Fb + a.Ft) / a.W)} раза`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Модель упрощённая: одна мышца, вес предплечья с кистью 1,5 кг. Настоящие числа у каждого свои, но порядок тот же — сотни ньютонов.</p>`;
    return h;
  }
  const d = m.d, all = m.injPlaced === 4;
  let h = `<h2>Парта под рост</h2><div class="formula">стул ≈ 0,27·рост &nbsp; стол ≈ стул + 0,18·рост</div><div class="steps">` +
    step('рост ученика', `${S.H} см`) +
    step(`стул: 0,27·${S.H}`, `≈ ${d.cN} см (у вас ${S.chair}) ${d.chairOk ? '✓' : '✗'}`) +
    step(`стол: ${S.chair} + 0,18·${S.H}`, `≈ ${d.dN} см (у вас ${S.desk}) ${d.deskOk ? '✓' : '✗'}`) +
    step('от глаз до тетради', `${S.eye} см, норма 30–35 ${d.eyeOk ? '✓' : '✗'}`) + `</div>`;
  h += `<p class="note" style="margin-top:8px">Так близко к нормам школьной мебели: рост 145–160 — стул 42 и стол 70 см, рост 160–175 — стул 46 и стол 76 см.</p>`;
  h += `<h3>Первая помощь: как рассуждать</h3><div class="steps">` +
    step('1. Кожа повреждена, идёт кровь?', 'сначала кровь и рана') + step('2. Кость сломана?', 'обездвижить два сустава') +
    step('3. Сустав изменил форму?', 'не вправлять') + step('4. Форма обычная, отёк?', 'холод и покой') + `</div>`;
  h += `<h3>Ваш выбор</h3><div class="steps">` + INJ.map((q, i) => step(q.name, S.ia[i] < 0 ? '—' : LET[AID_ORDER.indexOf(S.ia[i])] + (all ? (S.ia[i] === q.ans ? ' ✓' : ' ✗') : ''))).join('') +
    step('итого', all ? `верно ${m.injRight} из 4` : `выбрано ${m.injPlaced} из 4`, 'sum') + `</div>`;
  if (!all) h += `<p class="note" style="margin-top:10px">Проверка появится, когда помощь будет выбрана для всех 4 травм.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'sk') {
    el.innerHTML = `<div class="k">Раскрашено</div><div class="v ${S.done.skeleton ? 'ok' : ''}">${m.placed} / ${NB}</div>
      <div class="gauge"><b style="width:${(m.placed / NB * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>верно</span><span>${m.placed === NB ? m.right + ' из ' + NB : '—'}</span></div>`;
  } else if (m.kind === 'arm') {
    const a = m.a, F = a.Fb + a.Ft, who = a.Fb > 0 ? 'Бицепс' : a.Ft > 0 ? 'Трицепс' : 'Мышцы';
    el.innerHTML = `<div class="k">${who} тянет</div><div class="v ${S.done.muscles ? 'ok' : ''}">${Math.round(F)} Н</div>
      <div class="gauge"><b style="width:${clamp(F / 1200 * 100, 0, 100).toFixed(1)}%;background:#ff8a73"></b></div>
      <div class="lr"><span>≈ как груз</span><span>${fr(F / 9.8)} кг</span></div><div class="lr"><span>груз</span><span>${S.mass} кг</span></div>
      <div class="lr"><span>во ск. раз</span><span>${a.W > 0 && F > 0 ? '×' + fr(F / a.W) : '—'}</span></div>`;
  } else if (S.view === 'desk') {
    const d = m.d, row = (k, ok, v) => `<div class="lr"><span>${k}</span><span class="${ok ? 'ok' : 'bad'}">${v}</span></div>`;
    el.innerHTML = `<div class="k">Посадка</div><div class="v ${d.all ? 'ok' : 'bad'}">${d.all ? 'правильная' : 'надо исправить'}</div>` +
      row('стул', d.chairOk, d.chairOk ? '✓' : S.chair < d.cN ? 'низко' : 'высоко') + row('стол', d.deskOk, d.deskOk ? '✓' : S.desk < d.dN ? 'низко' : 'высоко') + row('глаза', d.eyeOk, `${S.eye} см`);
  } else {
    el.innerHTML = `<div class="k">Травмы</div><div class="v ${m.injRight === 4 ? 'ok' : ''}">${m.injPlaced} / 4</div>
      <div class="gauge"><b style="width:${(m.injPlaced / 4 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>верно</span><span>${m.injPlaced === 4 ? m.injRight + ' из 4' : '—'}</span></div><div class="lr"><span>парта</span><span class="${m.deskOk ? 'ok' : 'bad'}">${m.deskOk ? '✓' : 'не готова'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Берегите спину и суставы!');
  }
  if (L.id === 'posture' && !S.done[L.id] && S.view === 'desk' && m.deskOk && !S.deskToast) { S.deskToast = true; toast('Посадка правильная. Теперь откройте «Травмы».'); }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  muscles: '<path d="M24 4V18L44 14" stroke="#e8dcc0" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M26 6Q34 10 30 17" stroke="#ff6b6b" stroke-width="3" fill="none"/><circle cx="46" cy="14" r="4" fill="#56627d"/>',
  posture: '<path d="M14 26V16H26V26M14 16V6" stroke="#6b7894" stroke-width="1.6" fill="none"/><path d="M34 13H60M56 13V28" stroke="#8a7458" stroke-width="2" fill="none"/><path d="M20 15L23 6" stroke="#34507a" stroke-width="4" stroke-linecap="round"/><circle cx="25" cy="4" r="2.6" fill="#d9b99a"/><path d="M24 5L40 12" stroke="#86e0a8" stroke-width=".8" stroke-dasharray="1.5 1.5"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.deskToast = false;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'skeleton') {
    now = `Скелет человека спереди, 13 костей для раскраски по отделам (голова, туловище, пояс верхних конечностей, свободная верхняя конечность, пояс нижних конечностей, свободная нижняя конечность): ${BONES.map(b => `${b.name} — ${S.paint[b.id] ? 'раскрашена как «' + DEPT[S.paint[b.id]].name + '»' : 'не раскрашена'}`).join('; ')}. Кисть: ${S.brush ? (S.brush === 'erase' ? 'ластик' : DEPT[S.brush].name) : 'не выбрана'}. ` +
      (S.bone >= 0 ? `Выбрана кость «${BONES[S.bone].name}»: ${BONES[S.bone].type}; соединение: ${BONES[S.bone].join}. ` : '') +
      (m.placed === NB ? `Все кости раскрашены, верно ${m.right} из ${NB}.` : `Раскрашено ${m.placed} из ${NB}.`);
    guide = 'Не называй отдел для каждой кости. Спрашивай: защищает ли кость мозг, лежит ли она на оси тела, крепит ли конечность к туловищу или сама двигается.';
  }
  if (id === 'muscles') {
    const a = m.a;
    now = `Рука сбоку: плечевая кость вертикально, предплечье согнуто в локте на ${S.angle}°. Режим: ${S.mode === 'hold' ? 'рука держит гантель' : 'кисть давит вниз на весы'} ${S.mass} кг. Модель рычага: груз в 0,33 м от локтя, бицепс крепится в 0,04 м, предплечье 1,5 кг. ` +
      `Момент ${f(Math.abs(a.M))} Н·м, плечо бицепса ${f(a.rb * 100)} см, сила бицепса ${Math.round(a.Fb)} Н, сила трицепса ${Math.round(a.Ft)} Н` + (a.W > 0 ? `, это в ${f((a.Fb + a.Ft) / a.W)} раза больше веса груза.` : '.');
    guide = 'Помогай рассуждать через правило рычага F·r = M: почему мышца тянет сильнее груза, зачем мышцы работают парами. Подсказывай, что нужно сделать, но не решай за ученика.';
  }
  if (id === 'posture') {
    const d = m.d;
    now = `Часть «${S.view === 'desk' ? 'Парта' : 'Травмы'}». Ученик ростом ${S.H} см сидит за партой: стул ${S.chair} см (${d.chairOk ? 'подходит' : S.chair < d.cN ? 'низкий' : 'высокий'}), стол ${S.desk} см (${d.deskOk ? 'подходит к стулу' : S.desk < d.dN ? 'низкий' : 'высокий'}), от глаз до тетради ${S.eye} см (${d.eyeOk ? 'норма' : 'не норма, нужно 30–35'}). ` +
      `Травмы и выбранная помощь: ${INJ.map((q, i) => `${q.name} — ${S.ia[i] < 0 ? 'не выбрано' : '«' + AID[S.ia[i]].t + '»'}`).join('; ')}. ` +
      (m.injPlaced === 4 ? `Помощь выбрана для всех, верно ${m.injRight} из 4.` : `Выбрано ${m.injPlaced} из 4.`);
    guide = 'Не говори, какая помощь подходит к какой травме, и не называй нужные высоты числами. Спрашивай про признаки: цела ли кожа, изменилась ли форма сустава, где колени и локти. Напоминай про безопасность: 103 или 112, не вправлять.';
  }
  return [
    `Раздел: биология, 9 класс, тема «Опора и движение». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    skeleton: 'Чем пояс конечности отличается от свободной конечности?', muscles: 'Почему бицепс тянет сильнее, чем весит гантель?',
    posture: 'Почему при переломе шина должна захватывать два сустава?',
  }[L.id];
