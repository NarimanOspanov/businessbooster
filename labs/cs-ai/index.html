<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 10 класс: машинное обучение, нейросети, как работают чат-боты, этика искусственного интеллекта.">
<link rel="icon" href="data:,">
<title>Искусственный интеллект</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="hd"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.grp{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--arm);margin:20px 0 -6px}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:66vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 300px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M11 13L20 20M11 27L20 20M20 20L29 13M20 20L29 27M11 13L29 27M11 27L29 13" stroke="var(--muted)" stroke-width="1.3"/><circle cx="11" cy="13" r="3" fill="var(--arm)"/><circle cx="11" cy="27" r="3" fill="var(--arm)"/><circle cx="20" cy="20" r="3.4" fill="var(--force)"/><circle cx="29" cy="13" r="3" fill="var(--fg)"/><circle cx="29" cy="27" r="3" fill="var(--fg)"/></svg>
      <div><h1>ЛУЧ</h1><small>Опыты · Информатика · Искусственный интеллект</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>ИИ</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: модель машинного обучения, нейросеть, чат-бот или набор данных"></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Команды" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const pc = (x, n = 1) => fmt(x * 100, n) + ' %';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

// ---------- lesson 1 data: fruits, features «масса» and «жёлтость кожуры» (0 — красная, 1 — жёлтая) ----------
const TRAIN = [
  [150, .15, 'a'], [170, .25, 'a'], [190, .10, 'a'], [210, .30, 'a'], [230, .20, 'a'], [160, .45, 'a'],
  [200, .55, 'a'], [240, .40, 'a'], [180, .35, 'a'], [145, .30, 'a'], [220, .60, 'a'], [175, .05, 'a'],
  [100, .85, 'l'], [120, .90, 'l'], [130, .70, 'l'], [110, .65, 'l'], [140, .80, 'l'], [150, .92, 'l'],
  [95, .75, 'l'], [125, .55, 'l'], [160, .85, 'l'], [105, .95, 'l'], [135, .62, 'l'], [115, .78, 'l'],
].map(([m, y, c]) => ({ m, y, c }));
const TEST = [
  [165, .20, 'a'], [205, .45, 'a'], [185, .50, 'a'], [225, .15, 'a'], [155, .35, 'a'],
  [118, .72, 'l'], [142, .88, 'l'], [98, .60, 'l'], [155, .75, 'l'], [128, .68, 'l'],
].map(([m, y, c]) => ({ m, y, c }));
const U = m => (m - 80) / 180;           // масса 80…260 г → 0…1
const LR = 0.25;                          // шаг обучения перцептрона
const zOf = (w, p) => w[0] * U(p.m) + w[1] * p.y + w[2];
const predict = (w, p) => zOf(w, p) > 0 ? 'l' : 'a';
const FN = { a: 'яблоко', l: 'лимон' };

// ---------- lesson 2: network 2 → 2 → 1, step activation ----------
const NEU = ['h1', 'h2', 'y'];
const NNAME = { h1: 'H1', h2: 'H2', y: 'Y' };
const PNAME = { w1: 'w₁', w2: 'w₂', b: 'b' };
const ROWS4 = [[0, 0], [0, 1], [1, 0], [1, 1]];
const xor = (a, b) => (a ^ b);
function net(P, x1, x2) {
  const s1 = P.h1.w1 * x1 + P.h1.w2 * x2 + P.h1.b, o1 = s1 > 0 ? 1 : 0;
  const s2 = P.h2.w1 * x1 + P.h2.w2 * x2 + P.h2.b, o2 = s2 > 0 ? 1 : 0;
  const s3 = P.y.w1 * o1 + P.y.w2 * o2 + P.y.b, o3 = s3 > 0 ? 1 : 0;
  return { s1, o1, s2, o2, s3, o3 };
}

// ---------- lesson 3: a tiny bigram language model («сколько раз слово B шло после слова A» в учебном корпусе) ----------
const BIGRAM = {
  '^': { 'Казахстан': 5, 'Астана': 3, 'В': 2 },
  'Казахстан': { '—': 6, 'богат': 2 },
  '—': { 'большая': 4, 'страна': 3, 'столица': 3 },
  'большая': { 'страна': 5, 'степь': 2 },
  'степь': { '.': 3, 'и': 1 },
  'страна': { 'в': 3, '.': 3, 'степей': 2 },
  'в': { 'центре': 4, 'Евразии': 2 },
  'центре': { 'Евразии': 5 },
  'Евразии': { '.': 6 },
  'степей': { 'и': 4, '.': 2 },
  'и': { 'гор': 4, 'озёр': 2 },
  'гор': { '.': 5 },
  'озёр': { '.': 4 },
  'Астана': { '—': 5 },
  'столица': { 'Казахстана': 5, '.': 1 },
  'Казахстана': { '.': 5 },
  'В': { 'Казахстане': 5 },
  'Казахстане': { 'много': 4, 'живут': 2 },
  'много': { 'степей': 3, 'гор': 2, 'озёр': 2 },
  'живут': { '20': 3, 'люди': 2 },
  '20': { 'миллионов': 5 },
  'миллионов': { 'человек': 5 },
  'человек': { '.': 5 },
  'люди': { '.': 3 },
  'богат': { 'нефтью': 3, 'и': 1 },
  'нефтью': { 'и': 3, '.': 2 },
};
const HOT = 1.2;
function dist(ctx, T) {
  const row = BIGRAM[ctx] || { '.': 1 };
  const ent = Object.entries(row);
  let mx = Math.max(...ent.map(e => e[1])), first = ent.findIndex(e => e[1] === mx);
  const pw = ent.map(([, c]) => T === 0 ? 0 : Math.pow(c, 1 / T)), Z = pw.reduce((a, b) => a + b, 0);

}

// ---------- models ----------
function model() {
  const id = LID();
  if (id === 'ml') {
    const wrong = TRAIN.map(p => predict(S.w, p) !== p.c), errs = wrong.filter(Boolean).length;
    const twrong = TEST.map(p => predict(S.w, p) !== p.c), terrs = twrong.filter(Boolean).length;
    return { kind: 'ml', wrong, errs, acc: (TRAIN.length - errs) / TRAIN.length, twrong, terrs, testAcc: (TEST.length - terrs) / TEST.length, tested: S.tested };
  }
  if (id === 'nn') {
    const rows = ROWS4.map(([a, b]) => { const r = net(S.P, a, b); return { a, b, out: r.o3, want: xor(a, b), r }; });
    return { kind: 'nn', rows, correct: rows.filter(r => r.out === r.want).length, cur: net(S.P, S.x1, S.x2) };
  }
  if (id === 'chat') {
    const ended = S.words.length > 0 && S.words[S.words.length - 1] === '.';
    const ctx = S.words.length ? S.words[S.words.length - 1] : '^';
    return { kind: 'chat', ended, ctx, d: ended ? [] : dist(ctx, S.T), greedyOK: S.greedyOK, hotOK: S.hotOK,
             pAll: S.probs.reduce((a, b) => a * b, 1) };
  }
  const acc = GROUPS.map((g, i) => accOf(g, S.tn[i])), tot = S.tn.reduce((a, b) => a + b, 0);
  const avg = tot ? acc.reduce((s, a, i) => s + a * S.tn[i] / tot, 0) : 0;
  const min = Math.min(...acc), max = Math.max(...acc);
  return { kind: 'eth', acc, avg, min, max, gap: max - min, used: S.n.reduce((a, b) => a + b, 0), stale: S.n.some((v, i) => v !== S.tn[i]) };
}

const PX = { x0: 50, x1: 316, y0: 128, y1: 378 };
const gx = u => PX.x0 + u * (PX.x1 - PX.x0), gy = v => PX.y1 - v * (PX.y1 - PX.y0);
const ux = x => (x - PX.x0) / (PX.x1 - PX.x0), vy = y => (PX.y1 - y) / (PX.y1 - PX.y0);
function syncHandles() {
  const [a, b, c] = S.w, nn = a * a + b * b; if (nn < 1e-9) { S.hand = [[0.2, 0.5], [0.8, 0.5]]; return; }
  const k = (a * 0.5 + b * 0.5 + c) / nn, p0 = [0.5 - k * a, 0.5 - k * b], L0 = Math.sqrt(nn), d = [-b / L0, a / L0];
  // clip the line to the box [0.06, 0.94]²
  let t0 = -Infinity, t1 = Infinity;
  for (let i = 0; i < 2; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (p0[i] < 0.06 || p0[i] > 0.94) { t0 = 1; t1 = 0; } continue; }
    let ta = (0.06 - p0[i]) / d[i], tb = (0.94 - p0[i]) / d[i]; if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
  }
  if (t0 > t1) { S.hand = [[p0[0] - 0.3 * d[0], p0[1] - 0.3 * d[1]], [p0[0] + 0.3 * d[0], p0[1] + 0.3 * d[1]]]; return; }
  const s = (t1 - t0) * 0.12;
  S.hand = [[p0[0] + (t0 + s) * d[0], p0[1] + (t0 + s) * d[1]], [p0[0] + (t1 - s) * d[0], p0[1] + (t1 - s) * d[1]]];
}
function wFromHandles() {
  const [p, q] = S.hand, dx = q[0] - p[0], dy = q[1] - p[1];
  let nx = -dy, ny = dx;
  if (ny < -1e-9 || (Math.abs(ny) <= 1e-9 && nx > 0)) { nx = -nx; ny = -ny; }   // «лимонная» сторона — где кожура желтее
  const l = Math.hypot(nx, ny) || 1; nx = nx / l * 4; ny = ny / l * 4;
  S.w = [nx, ny, -(nx * p[0] + ny * p[1])];
}
function clipPoly(poly, f) {        // keep the part of poly where f(p) ≥ 0
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const A = poly[i], B = poly[(i + 1) % poly.length], fa = f(A), fb = f(B);
    if (fa >= 0) out.push(A);
    if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
  }
  return out;
}
function epoch() {
  for (const p of TRAIN) {
    const x = [U(p.m), p.y, 1], t = p.c === 'l' ? 1 : 0, o = predict(S.w, p) === 'l' ? 1 : 0;
    if (t !== o) for (let i = 0; i < 3; i++) S.w[i] += LR * (t - o) * x[i];
  }
  S.epochs++; syncHandles();
}

function lineInBox() {
  const [a, b, c] = S.w, nn = a * a + b * b; if (nn < 1e-9) return null;

  for (let i = 0; i < 2; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (p0[i] < 0 || p0[i] > 1) return null; continue; }
    let ta = (0 - p0[i]) / d[i], tb = (1 - p0[i]) / d[i]; if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);

  if (t0 > t1) return null;
  return [[p0[0] + t0 * d[0], p0[1] + t0 * d[1]], [p0[0] + t1 * d[0], p0[1] + t1 * d[1]]];
}

    else if (id.startsWith('tp')) { S.pick = { test: true, i: +id.slice(2) }; const p = TEST[S.pick.i]; toast(`тест, ${FN[p.c]}: ${p.m} г → модель: ${FN[predict(S.w, p)]}`); update(); }
    return;

  GROUPS.forEach((g, i) => {

    { id: 'output', icon: ICON.output, name: 'Выходной нейрон Y', spec: 'Получает ответы H1 и H2, взвешивает их и выдаёт итог 0 или 1.' },
    { id: 'weights', icon: ICON.weights, name: 'Веса и смещения', spec: 'Числа на связях — веса, у нейронов — смещения b. Всё «знание» сети хранится в этих числах.' },
    { id: 'table', icon: ICON.table, name: 'Таблица истинности XOR', spec: 'Все 4 комбинации входов. Зелёный — сеть отвечает верно, красный — ошибается.' }];
  if (id === 'chat') return [
    { id: 'user', icon: ICON.user, name: 'Запрос пользователя', spec: 'То, что вы написали боту. В настоящей LLM запрос и весь диалог — часть контекста.' },
    { id: 'bot', icon: ICON.bot, name: 'Ответ бота', spec: 'Растёт по одному слову. Бот не «знает» ответ заранее: каждое слово выбирается заново.' },
    { id: 'ctx', icon: ICON.ctx, name: 'Контекст', spec: 'На что модель смотрит, выбирая следующее слово. У нас — одно последнее слово, у GPT-подобных моделей — тысячи токенов.' },
    { id: 'bars', icon: ICON.bars, name: 'Распределение вероятностей', spec: 'Сколько раз каждое слово шло после контекста в учебных текстах, пересчитанное в вероятности с учётом температуры.' }];
  return [
    { id: 'budget', icon: ICON.budget, name: 'Бюджет данных', spec: `Записать и разметить можно ${BUDGET} фраз: разметка стоит денег и времени.` },
    { id: 'data', icon: ICON.data, name: 'Записи по группам', spec: 'Каждая полоска — 50 записанных голосовых команд. Взрослых найти легко, детей и пожилых — труднее.' },
    { id: 'buttons', icon: ICON.buttons, name: 'Кнопки − и +', spec: 'Перераспределяют записи между группами шагом 50.' },
    { id: 'acc', icon: ICON.acc, name: 'Точность по группам', spec: 'Доля верно распознанных команд у обученной модели. Оранжевая черта — порог 90 %.' }];
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Из чего состоит модель</h2><p class="note">Нажмите на деталь, чтобы найти её на сцене.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'ml') {
    const pk = S.pick || { test: false, i: m.wrong.indexOf(true) >= 0 ? m.wrong.indexOf(true) : 0 };
    const p = (pk.test ? TEST : TRAIN)[pk.i], u = U(p.m), z = zOf(S.w, p);
    let h = `<h2>Как модель решает</h2><div class="formula">z = w₁·u + w₂·v + b</div><p class="note">u = (масса − 80) / 180 — масса, сжатая в отрезок 0…1; v — жёлтость. z &gt; 0 → «лимон», иначе «яблоко».</p>
      <h3>${pk.test ? 'Тестовый' : 'Обучающий'} пример: ${FN[p.c]}, ${p.m} г</h3><div class="steps">` +
      step('u', `(${p.m} − 80) / 180 = ${fmt(u, 3)}`) + step('v', fmt(p.y, 2)) +
      step('z', `${fmt(S.w[0], 2)}·${fmt(u, 3)} + ${fmt(S.w[1], 2)}·${fmt(p.y, 2)} ${S.w[2] < 0 ? '−' : '+'} ${fmt(Math.abs(S.w[2]), 2)} = ${fmt(z, 3)}`) +
      step('ответ модели', `${z > 0 ? 'z > 0 → лимон' : 'z ≤ 0 → яблоко'} ${predict(S.w, p) === p.c ? '✓' : '✗ ошибка'}`, 'sum') + `</div>
      <p class="note" style="margin-top:8px">Нажмите на любую точку графика, чтобы разобрать её.</p>
      <h3>Качество</h3><div class="steps">` +
      step('точность на обучении', `(${TRAIN.length} − ${m.errs}) / ${TRAIN.length} = ${pc(m.acc, 0)}`) +
      step('точность на тесте', S.tested ? `(${TEST.length} − ${m.terrs}) / ${TEST.length} = ${pc(m.testAcc, 0)}` : 'ещё не проверяли', 'sum') + `</div>
      <h3>Правило перцептрона</h3><div class="formula">w ← w + η·(t − y)·x</div><p class="note">t — правильный ответ (лимон = 1, яблоко = 0), y — ответ модели, x = (u, v, 1), η = ${fmt(LR, 2)}. Если модель права, t − y = 0 и веса не меняются. Эпоха — один проход по всем ${TRAIN.length} примерам. Пройдено эпох: ${S.epochs}.</p>`;
    return h;
  }
  if (id === 'nn') {
    const r = m.cur, P = S.P, sg = v => (v < 0 ? '− ' : '+ ') + fmt(Math.abs(v), 1);
    const line = (k, a, b, s, o, na, nb) => step(`${NNAME[k]}: Σ`, `${fmt(P[k].w1, 1)}·${a} ${sg(P[k].w2)}·${b} ${sg(P[k].b)} = ${fmt(s, 1)} → ${o}`);
    return `<h2>Прямой проход</h2><div class="formula">выход = 1, если Σ > 0</div><p class="note">Σ = w₁·вход₁ + w₂·вход₂ + b. Ровно 0 — это ещё не «больше нуля», выход 0.</p><h3>Входы x₁ = ${S.x1}, x₂ = ${S.x2}</h3><div class="steps">` +
      line('h1', S.x1, S.x2, r.s1, r.o1) + line('h2', S.x1, S.x2, r.s2, r.o2) +
      step('Y: Σ', `${fmt(P.y.w1, 1)}·${r.o1} ${sg(P.y.w2)}·${r.o2} ${sg(P.y.b)} = ${fmt(r.s3, 1)} → ${r.o3}`, 'sum') + `</div>
      <h3>Все входы</h3><div class="steps">` + m.rows.map(rw => step(`x₁ = ${rw.a}, x₂ = ${rw.b}`, `H1 ${rw.r.o1}, H2 ${rw.r.o2} → Y = ${rw.out} ${rw.out === rw.want ? '✓' : `✗ (надо ${rw.want})`}`)).join('') + `</div>
      <p class="note" style="margin-top:10px">Весов и смещений здесь 9. В языковых моделях их миллиарды, но каждый нейрон считает такую же сумму.</p>`;
  }
  if (id === 'chat') {
    let h = `<h2>Как выбирается слово</h2><div class="formula">pᵢ = cᵢ<sup>1/T</sup> / Σ c<sup>1/T</sup></div><p class="note">cᵢ — сколько раз слово шло после контекста в учебных текстах. При T = 1 вероятность пропорциональна частоте. T &lt; 1 усиливает лидера, T &gt; 1 выравнивает шансы. T = 0 — всегда самое частое слово.</p>`;
    if (m.ended) h += `<h3>Ответ готов</h3><p class="note">Нажмите «Новый ответ» или «Слово», чтобы начать заново.</p>`;
    else {
      const Z = m.d.reduce((a, c) => a + c.pw, 0);
      h += `<h3>Контекст: ${m.ctx === '^' ? 'начало ответа' : '«' + m.ctx + '»'} · T = ${fmt(S.T, 1)}</h3><div class="steps">` +
        m.d.map(c => step(c.w === '.' ? '. (конец)' : c.w, S.T === 0 ? `c = ${c.c} → ${pc(c.p, 0)}` : `${c.c}<sup>${fmt(1 / S.T, 2)}</sup> = ${fmt(c.pw, 2)} → ${fmt(c.pw, 2)} / ${fmt(Z, 2)} = ${pc(c.p, 1)}`)).join('') + `</div>`;
    }
    if (S.probs.length) h += `<h3>Вероятность фразы</h3><div class="steps">` + step('перемножаем шаги', S.probs.map(p => fmt(p, 2)).join(' × ')) + step('итого', fmtP(m.pAll), 'sum') + `</div>`;
    return h;
  }
  const tot = S.tn.reduce((a, b) => a + b, 0);
  let h = `<h2>Точность по группам</h2><div class="formula">точность = верно / всего</div><p class="note">В нашей модели точность группы растёт с числом её записей n и упирается в потолок: a − k·e<sup>−n/s</sup>. Дети и пожилые говорят иначе, чем взрослые, поэтому им нужно больше примеров.</p><h3>Обученная модель</h3><div class="steps">`;
  GROUPS.forEach((g, i) => h += step(`${g.name}: n = ${S.tn[i]}`, `${fmt(g.a, 2)} − ${fmt(g.k, 2)}·e<sup>−${S.tn[i]}/${g.s}</sup> = ${pc(m.acc[i])}`));
  h += step('худшая группа', pc(m.min)) + step('разница лучшей и худшей', `${pc(m.max)} − ${pc(m.min)} = ${fmt(m.gap * 100, 1)} п. п.`, 'sum') + `</div>
    <h3>Обманчивое среднее</h3><p class="note">Если тестовые записи взять в той же пропорции, что обучающие, общая точность — это среднее с весами-долями:</p><div class="steps">` +
    step('Σ доля · точность', GROUPS.map((g, i) => `${fmt(S.tn[i] / (tot || 1), 2)}·${fmt(m.acc[i], 3)}`).join(' + ')) + step('в среднем', pc(m.avg), 'sum') + `</div>
    <p class="note" style="margin-top:10px">Высокое среднее легко получить, если почти все записи от взрослых. Поэтому смотрят на каждую группу отдельно.</p>`;
  if (m.stale) h += `<p class="note">Вы изменили данные: расчёт для новых чисел появится после «Обучить».</p>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'ml') el.innerHTML = `<div class="k">Ошибок на обучении</div><div class="v ${m.errs <= 2 ? 'ok' : ''}">${m.errs} из ${TRAIN.length}</div>
      <div class="gauge"><b style="width:${(m.acc * 100).toFixed(1)}%"></b><i style="left:${(22 / 24 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>тест</span><span>${S.tested ? pc(m.testAcc, 0) : '—'}</span></div>`;
  if (id === 'nn') el.innerHTML = `<div class="k">Таблица XOR</div><div class="v ${m.correct === 4 ? 'ok' : ''}">${m.correct} из 4 верно</div>
      <div class="lr"><span>x₁ x₂ = ${S.x1} ${S.x2}</span><span>Y = ${m.cur.o3}</span></div>`;
  if (id === 'chat') el.innerHTML = `<div class="k">Температура</div><div class="v">T = ${fmt(S.T, 1)}</div>
      <div class="gauge"><b style="width:${(S.T / 2 * 100).toFixed(1)}%"></b><i style="left:${(HOT / 2 * 100).toFixed(1)}%"></i></div>
      <div class="lr"><span>слов</span><span>${S.words.filter(w => w !== '.').length}</span></div>`;
  if (id === 'ethics') el.innerHTML = `<div class="k">Средняя точность</div><div class="v">${pc(m.avg)}</div>
      <div class="lr"><span>худшая</span><span style="color:${m.min >= 0.9 ? 'var(--ok)' : 'var(--warn)'}">${pc(m.min)}</span></div>
      <div class="lr"><span>разница</span><span>${fmt(m.gap * 100, 1)} п. п.</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как устроен ИИ!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  stopTimers();
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.w = LESSONS[0].w0.slice(); S.epochs = 0; S.tested = false; S.pick = null; syncHandles();
  S.P = cloneP(LESSONS[1].p0); S.x1 = 1; S.x2 = 0; S.sel = 'h2.b';
  S.T = LESSONS[2].T0; newAnswer(); S.answers = []; S.greedyOK = false; S.hotOK = false;
  S.n = LESSONS[3].n0.slice(); S.tn = LESSONS[3].n0.slice();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons');
  if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'ml') now = `График: ${TRAIN.length} обучающих фруктов (12 яблок, 12 лимонов), признаки — масса 95–240 г и жёлтость кожуры 0–1. Модель — прямая z = w₁·u + w₂·v + b (u = (масса − 80)/180); сейчас w₁ = ${fmt(S.w[0], 2)}, w₂ = ${fmt(S.w[1], 2)}, b = ${fmt(S.w[2], 2)}. Ошибок на обучении ${m.errs} из ${TRAIN.length}. Пройдено эпох перцептрона: ${S.epochs} (η = ${fmt(LR, 2)}). ${S.tested ? `Тест (${TEST.length} новых фруктов): верно ${TEST.length - m.terrs}, точность ${pc(m.testAcc, 0)}.` : 'На тестовой выборке ещё не проверяли.'} Ученик может тащить ручки прямой или нажимать «Эпоха»/«Обучать до конца», затем «Проверить на тесте».`;
  if (id === 'nn') now = `Сеть 2 → 2 → 1 с пороговой активацией (выход 1, если Σ > 0). Параметры: H1 w₁ = ${fmt(S.P.h1.w1, 1)}, w₂ = ${fmt(S.P.h1.w2, 1)}, b = ${fmt(S.P.h1.b, 1)}; H2 w₁ = ${fmt(S.P.h2.w1, 1)}, w₂ = ${fmt(S.P.h2.w2, 1)}, b = ${fmt(S.P.h2.b, 1)}; Y (входы H1, H2) w₁ = ${fmt(S.P.y.w1, 1)}, w₂ = ${fmt(S.P.y.w2, 1)}, b = ${fmt(S.P.y.b, 1)}. Таблица: ${m.rows.map(r => `${r.a}${r.b} → H1 ${r.r.o1}, H2 ${r.r.o2}, Y ${r.out} (надо ${r.want})`).join('; ')}. Верно ${m.correct} из 4. Не называй готовые значения весов — наводи вопросами: «какую логическую функцию сейчас считает H1, а какую H2?», «когда XOR отличается от ИЛИ?».`;
  if (id === 'chat') now = `Игрушечная биграммная модель: следующее слово выбирается по частоте после последнего слова. Запрос: «Расскажи про Казахстан.» Текущий ответ: «${joinTok(S.words) || '(пусто)'}». Температура T = ${fmt(S.T, 1)}. ${m.ended ? 'Ответ закончен.' : `Контекст «${m.ctx === '^' ? 'начало' : m.ctx}», варианты: ${m.d.map(c => `${c.w} ${pc(c.p, 0)} (${c.c} раз)`).join(', ')}.`} Готовые ответы: ${S.answers.map(a => `«${a.txt}» при T = ${a.T}${a.manual ? ' (с ручным выбором)' : ''}`).join('; ') || 'нет'}. Задание: ответ при T = 0 ${S.greedyOK ? 'есть' : 'нет'}, ответ при T ≥ 1,2 ${S.hotOK ? 'есть' : 'нет'}. Объясняй разницу настоящей LLM (трансформер, весь контекст, токены) и этой игрушки.`;
  if (id === 'ethics') now = `Голосовой помощник для госуслуг. Бюджет ${BUDGET} записей. Сейчас выбрано: ${GROUPS.map((g, i) => `${g.name} ${S.n[i]}`).join(', ')}; модель обучена на: ${GROUPS.map((g, i) => `${g.name} ${S.tn[i]}`).join(', ')}${m.stale ? ' (данные изменены, но «Обучить» не нажато)' : ''}. Точность обученной модели: ${GROUPS.map((g, i) => `${g.name} ${pc(m.acc[i])}`).join(', ')}; средняя ${pc(m.avg)}, худшая ${pc(m.min)}, разница ${fmt(m.gap * 100, 1)} п. п. Условие: каждая группа ≥ 90 %, разница ≤ 5 п. п. Не называй готовое распределение — спрашивай, какой группе модель даётся труднее и почему поровну может не хватить.`;
  return [
    `Раздел: информатика, 10 класс, тема «Искусственный интеллект». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { ml: 'Зачем проверять модель на тестовой выборке?', nn: 'Почему один нейрон не может решить XOR?', chat: 'Почему чат-бот иногда выдумывает факты?', ethics: 'Откуда у ИИ берётся предвзятость?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
