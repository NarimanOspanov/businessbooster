<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 9 класс: базы данных — таблицы, ключи и связи, запросы SQL, проектирование базы.">
<title>Базы данных</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene.grabbing{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--force)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools input{width:330px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 13px/1.2 var(--font-mono);color:var(--fg)}
.tools input:focus{border-color:var(--force);outline:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.pbody code{font:500 13px var(--font-mono);color:var(--force)}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:14px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ctl .row input,.ctl select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:500 13px var(--font-mono)}
.ctl > select{width:100%;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--force)}
.chips button.mono{font-family:var(--font-mono)}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing .cur{color:var(--force)}
.listing .bad{color:var(--warn)}
.listing .good{color:var(--ok)}
.listing .dim{color:var(--muted)}
.listing .lk{display:flex;justify-content:space-between;align-items:center;gap:8px}
.listing .lk button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--muted)}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1760px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:600px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .tools input{width:170px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 480px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><ellipse cx="20" cy="11" rx="10" ry="4" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M10 11v18c0 2.2 4.5 4 10 4s10-1.8 10-4V11" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M10 20c0 2.2 4.5 4 10 4s10-1.8 10-4" fill="none" stroke="var(--arm)" stroke-width="1.6"/><circle cx="25" cy="28" r="2.2" fill="var(--force)"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Информатика · Базы данных</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Базы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Схема базы данных: таблицы, ключи и связи"></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Команды" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LESSONS = [
  { id: 'relations', title: 'Таблицы и связи',
    text: ['База данных хранит сведения в таблицах. Каждая строка — запись об одном объекте: одном читателе, одной книге. Каждый столбец — поле: имя, класс, автор. В реляционной базе таблиц несколько, и они связаны между собой.',
           'Чтобы точно найти нужную строку, у таблицы есть первичный ключ — поле, значения которого никогда не повторяются. Имя для этого не годится: в школе вполне может быть две Айгерим. Поэтому каждой записи дают номер — id.',
           'В таблице «Выдачи» не пишут имя читателя и название книги — там хранят их номера: reader_id и book_id. Такое поле называют внешним ключом: оно ссылается на первичный ключ другой таблицы. Один читатель может взять много книг — это связь «один-ко-многим».'],
    why: 'Так устроены базы библиотеки, электронного журнала Kundelik, интернет-магазина, банка, eGov: клиенты в одной таблице, заказы или платежи — в другой, а связаны они по номеру. Ключи и связи должен понимать каждый бэкенд-разработчик, аналитик данных и тестировщик — это одни из самых востребованных IT-профессий. Даже функция ВПР в Excel делает то же самое: ищет строку по ключу.',
    task: 'Назначьте первичный ключ в каждой таблице и свяжите «Выдачи» с «Читателями» и «Книгами», чтобы внизу появились имена и названия.',
    hint: 'Нажмите на столбец — он станет ключом, если значения в нём не повторяются. Протяните от столбца одной таблицы к столбцу другой — появится связь. Число на связи показывает, сколько значений нашлось. Нажмите на него, чтобы удалить связь.',
    stage: 'Нажмите на столбец — ключ. Протяните к другому столбцу — связь.',
    check: m => m.relOk },
  { id: 'sql', title: 'Запросы SQL',
    text: ['SQL — язык запросов к базам данных. Запрос не меняет таблицу, а выбирает из неё нужное. Самый простой запрос: SELECT * FROM olymp — «выбери все столбцы из таблицы olymp».',
           'После SELECT через запятую перечисляют нужные столбцы. WHERE задаёт условие отбора строк: score > 70, subject = \'физика\'. Текст пишут в кавычках, числа — без. Условия соединяют словами AND (и) и OR (или).',
           'ORDER BY сортирует результат: по возрастанию (ASC, так по умолчанию) или по убыванию (DESC). LIMIT оставляет только первые строки. Порядок частей всегда такой: SELECT … FROM … WHERE … ORDER BY … LIMIT.'],
    why: 'SQL спрашивают у аналитиков данных, бэкенд-разработчиков, тестировщиков и даже маркетологов — это один из самых полезных навыков в IT. Аналитик банка одним запросом находит клиентов, которые давно не пользуются картой; сотрудник управления образования — школы района без спортзала. Когда ты ставишь фильтр «сначала дешёвые» на Kaspi или Krisha.kz, сервер выполняет похожий запрос с WHERE и ORDER BY.',

    const keys = T1.filter(t => S.pk[t] === 'id').length, pkSet = T1.filter(t => S.pk[t]).length;
    const good = GOOD.filter(g => infos.some(x => x.key === g && x.valid)).length;
    const extraL = infos.filter(x => !GOOD.includes(x.key) || !x.valid).length;
    return { kind: id, infos, keys, pkSet, good, extraL, relOk: keys === 3 && good === 2 && extraL === 0 };
  }
  if (id === 'sql') {
    const r = S.res, ok = !!(r && r.ok);
    const sqlOk = ok && r.cols.join(',') === 'name,score' && r.rows.length === WANT.length && r.rows.every((x, k) => x[0] === WANT[k][0] && x[1] === WANT[k][1]);
    return { kind: id, r, ok, sqlOk, n: ok ? r.rows.length : 0, stale: S.sqlText.trim() !== S.sqlRun.trim() };
  }
  const st = FIELDS.map(f => Object.assign({ f }, fStatus(f)));
  const copies = st.reduce((p, x) => p + x.n, 0), bad = st.filter(x => x.st === 'bad').length, placed = st.filter(x => x.st !== 'none').length;

function updateScheme(m) {

    if (lst) {
      lst.innerHTML = S.links.length ? S.links.map((l, i) => { const inf = linkInfo(l); return `<div class="lk"><span class="${inf.valid ? 'good' : inf.pk ? 'bad' : 'dim'}">${l.a} — ${l.b}: ${inf.pk ? `${inf.found}/${inf.total}` : 'нет PK'}</span><button data-del="${i}" aria-label="Удалить связь">✕</button></div>`; }).join('') : '<span class="note">Связей пока нет.</span>';
      lst.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delLink(+b.dataset.del));
    }
  } else if (m.kind === 'sql') {

  } else {
    set('#r1', `${m.placed}/6`); set('#r2', String(m.copies)); set('#r3', String(m.bad));

function calcHTML(m) {
  if (m.kind === 'relations') {
    let h = `<h2>Может ли поле быть ключом?</h2><div class="formula">ключ ⇔ все значения разные</div><div class="steps">`;
    for (const t of T1) DB1[t].cols.forEach(c => {
      const v = colVals(t + '.' + c), d = new Set(v.map(String)).size, ok = d === v.length;
      h += step(`${t}.${c}${S.pk[t] === c ? ' · PK' : ''}`, `${v.length} знач., разных ${d} → ${ok ? 'можно' : 'нельзя'}`, ok ? 'okk' : '');
    });
    h += `</div><h3>Проверка связей</h3><p class="note">Связь верна, когда каждое значение внешнего ключа есть среди значений первичного ключа. Это называют ссылочной целостностью.</p><div class="steps">`;
    if (!S.links.length) h += step('связей нет', '—');
    S.links.forEach(l => {
      const inf = linkInfo(l);
      if (!inf.pk) { h += step(`${l.a} — ${l.b}`, 'ни один конец не PK', 'badd'); return; }
      const miss = colVals(inf.fk).filter(v => !new Set(colVals(inf.pk).map(String)).has(String(v)));
      h += step(`${inf.fk} → ${inf.pk}`, `найдено ${inf.found} из ${inf.total}${miss.length ? `; нет: ${[...new Set(miss)].slice(0, 4).join(', ')}` : ''}`, inf.valid ? 'okk' : 'badd');
    });
    h += step('итог', `ключей ${m.pkSet}/3, верных связей ${m.good}/2`, m.relOk ? 'okk sum' : 'sum') + '</div>';
    return h;
  }
  if (m.kind === 'sql') {
    const r = m.r;
    if (!r) return `<h2>Как выполняется запрос</h2><p class="note">Выполните запрос — здесь появятся шаги.</p>`;
    if (!r.ok) return `<h2>Запрос с ошибкой</h2><div class="formula">${esc(S.sqlRun || '—')}</div><div class="steps">${step('ошибка', esc(r.err), 'badd')}</div><p class="note" style="margin-top:10px">Порядок частей: SELECT … FROM … WHERE … ORDER BY … LIMIT. Текст — в кавычках, столбцы — без кавычек.</p>`;
    const q = r.q;
    let h = `<h2>Как СУБД выполняет запрос</h2><div class="formula">${esc(S.sqlRun)}</div><p class="note">База выполняет части не в том порядке, как они написаны: сначала FROM, потом WHERE, ORDER BY, LIMIT и только в конце SELECT.</p><div class="steps">`;
    h += step('1. FROM olymp', `${OLYMP.length} строк`);
    if (q.where) {
      h += step('2. WHERE ' + esc(descW(q.where)), `осталось ${r.pass.length}`) + '</div><h3>Проверка условия для каждой строки</h3><div class="steps">';
      OLYMP.forEach(row => { const ok = evalW(q.where, row); h += step(esc(row[1]), `${esc(descW(q.where, row))} → ${ok ? 'да' : 'нет'}`, ok ? 'okk' : ''); });
      h += '</div><div class="steps" style="margin-top:6px">';
    } else h += step('2. WHERE', 'нет — берём все строки');
    h += step('3. ORDER BY', q.order.length ? q.order.map(o => `${o.c} ${o.d < 0 ? 'DESC (9→1)' : 'ASC (1→9)'}`).join(', ') : 'нет — порядок как в таблице');
    h += step('4. LIMIT', q.limit != null ? `первые ${q.limit}` : 'нет');
    h += step('5. SELECT', esc(q.cols.join(', ')));
    h += step('ответ', `${r.rows.length} ${plural(r.rows.length, 'строка', 'строки', 'строк')}: ${esc(r.rows.slice(0, 5).map(x => x.join(' ')).join('; '))}${r.rows.length > 5 ? '…' : ''}`, m.sqlOk ? 'okk sum' : 'sum') + '</div>';
    return h;
  }
  let h = `<h2>Считаем лишние копии</h2><div class="formula">копий = строк в таблице − разных объектов</div><p class="note">В большой таблице ${FLAT.length} записей, но учеников всего 5, а кружков 3. Поле ученика повторяется 8 − 5 = 3 лишних раза, поле кружка — 8 − 3 = 5 раз.</p><div class="steps">`;
  m.st.forEach(x => {
    const t = S.place[x.f.id], tn = t ? TB3.find(q => q.id === t).ru : 'не разложено';
    const v = x.st === 'ok' ? `${tn}: 0` : x.st === 'rep' ? `${tn}: 8 − ${8 - x.n} = ${x.n}` : x.st === 'bad' ? `${tn}: конфликт` : tn;
    h += step(`${x.f.ru} (свойство ${ENT[x.f.e]})`, v, x.st === 'ok' ? 'okk' : x.st === 'none' ? '' : 'badd');
  });
  h += step('было в одной таблице', `${FLAT_COPIES} копий`) + step('стало', `${m.copies} копий, ${m.bad} конфликтов`, m.designOk ? 'okk sum' : 'sum') + '</div>';
  const ts = fStatus(FIELDS[3]).st;
  h += `<h3>Сменился руководитель кружка</h3><div class="steps">` + step('одна таблица', '3 ячейки') + step('ваша база', ts === 'ok' ? '1 ячейка' : ts === 'rep' ? '3 ячейки' : ts === 'bad' ? 'некуда записать' : 'поле не разложено', ts === 'ok' ? 'okk' : '') + '</div>';
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'relations') el.innerHTML = `<div class="k">Верных связей</div><div class="v ${ok ? 'ok' : ''}">${m.good} / 2</div><div class="gauge"><b style="width:${m.good * 50}%"></b></div><div class="lr"><span>ключей</span><span>${m.pkSet}/3</span></div><div class="lr"><span>лишних</span><span>${m.extraL}</span></div>`;
  else if (m.kind === 'sql') el.innerHTML = `<div class="k">Результат</div><div class="v ${ok ? 'ok' : m.r && !m.ok ? 'bad' : ''}">${!m.r ? '—' : m.ok ? `${m.n} ${plural(m.n, 'строка', 'строки', 'строк')}` : 'ошибка'}</div><div class="lr"><span>столбцов</span><span>${m.ok ? m.r.cols.length : '—'}</span></div><div class="lr"><span>WHERE</span><span>${m.ok && m.r.q.where ? m.r.pass.length + '/10' : '—'}</span></div>`;
  else el.innerHTML = `<div class="k">Лишних копий</div><div class="v ${ok ? 'ok' : m.bad ? 'bad' : ''}">${m.copies} <span style="font-size:11px;color:var(--muted)">было ${FLAT_COPIES}</span></div><div class="gauge"><b style="width:${m.placed / 6 * 100}%"></b></div><div class="lr"><span>разложено</span><span>${m.placed}/6</span></div><div class="lr"><span>конфликтов</span><span>${m.bad}</span></div>`;
}

function lite() { const m = model(); renderMeter(m); if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m); if (S.tab === 'scheme') updateScheme(m); $('#taskState').textContent = taskState(m); dirty = true; }
function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы спроектировали настоящую базу данных!'), 1400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  relations: '<rect x="4" y="6" width="20" height="18" rx="3" fill="none" stroke="#e8ecf4"/><rect x="42" y="6" width="20" height="18" rx="3" fill="none" stroke="#e8ecf4"/><path d="M24 12C33 12 33 18 42 18" fill="none" stroke="#86e0a8" stroke-width="1.6"/><circle cx="9" cy="12" r="2" fill="none" stroke="#ffb547"/>',
  sql: '<text x="4" y="13" font-size="8" fill="#ffb547" font-family="monospace">SELECT</text><text x="4" y="24" font-size="8" fill="#72d4e8" font-family="monospace">WHERE &gt;</text>',
  design: '<rect x="4" y="4" width="58" height="8" fill="none" stroke="#ffb547"/><path d="M33 13v4" stroke="#8b96ad"/><rect x="4" y="18" width="16" height="9" rx="2" fill="none" stroke="#86e0a8"/><rect x="25" y="18" width="16" height="9" rx="2" fill="none" stroke="#72d4e8"/><rect x="46" y="18" width="16" height="9" rx="2" fill="none" stroke="#86e0a8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  scene.setAttribute('aria-label', { relations: 'Схема базы библиотеки: три таблицы, ключи и связи', sql: 'Запрос SQL, таблица olymp и результат запроса', design: 'Большая таблица кружков и три новые таблицы, куда раскладывают поля' }[Ls.id]);
  renderTools(); renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}
window.addEventListener('resize', () => requestAnimationFrame(fit));

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'relations') {
    const ls = m.infos.length ? m.infos.map(x => `${x.key.replace('|', ' — ')} (${x.pk ? `найдено ${x.found} из ${x.total}${x.valid ? ', верная' : ', неверная'}` : 'ни один конец не первичный ключ'})`).join('; ') : 'нет';
    now = `База школьной библиотеки. readers(id, name, class): 5 читателей, среди них две Айгерим из разных классов. books(id, title, author): 5 книг с номерами 101–105, у Абая две книги. loans(id, reader_id, book_id, date): 8 выдач с номерами 11–18. Первичные ключи: readers — ${S.pk.readers || 'не назначен'}, loans — ${S.pk.loans || 'не назначен'}, books — ${S.pk.books || 'не назначен'}. Связи: ${ls}. Внизу таблица выдач, где по связям подставляются имена читателей и названия книг. Не называй прямо, какие столбцы связать, — спрашивай: почему имя не годится в ключ, где в «Выдачах» записан номер читателя и в каком столбце «Читателей» этот номер искать.`;
  }
  if (id === 'sql') {
    const r = m.r;
    now = `Таблица olymp(id, name, grade, subject, score) — результаты школьной олимпиады, 10 строк: ${OLYMP.map(x => `${x[1]} ${x[2]} кл. ${x[3]} ${x[4]}`).join('; ')}. В строке ввода: «${S.sqlText}». Последний выполненный запрос: «${S.sqlRun || 'нет'}». ${!r ? 'Результата нет.' : r.ok ? `Результат: ${r.rows.length} строк, столбцы ${r.cols.join(', ')}: ${r.rows.map(x => x.join(' ')).join('; ')}.` : `Ошибка: ${r.err}`} Задание ${m.sqlOk ? 'выполнено' : 'не выполнено'}. Не пиши готовый запрос целиком — наводи вопросами: какие столбцы нужны, какие два условия и чем их соединить, «больше 70» включает ли 70, в какую сторону сортировать.`;
  }
  if (id === 'design') {
    now = `Большая таблица записей в кружки: 8 строк, поля: имя ученика, класс, название кружка, руководитель, кабинет, дата записи; учеников 5, кружков 3. Новые таблицы: Ученики(id), Кружки(id), Записи(ученик_id, кружок_id). Раскладка полей: ${m.st.map(x => `${x.f.ru} → ${S.place[x.f.id] ? TB3.find(t => t.id === S.place[x.f.id]).ru : 'не разложено'} (${{ ok: 'на месте', rep: `повторов ${x.n}`, bad: 'конфликт', none: '—' }[x.st]})`).join('; ')}. Лишних копий: ${m.copies} (было ${FLAT_COPIES}), конфликтов: ${m.bad}. Не говори, куда класть каждое поле, — спрашивай: это свойство ученика, кружка или самой записи? сколько раз оно повторится?`;
  }
  return [
    `Раздел: информатика, 9 класс, тема «Базы данных». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { relations: 'Почему имя нельзя сделать первичным ключом?', sql: 'Чем WHERE отличается от ORDER BY?', design: 'Зачем нужна таблица «Записи»?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
