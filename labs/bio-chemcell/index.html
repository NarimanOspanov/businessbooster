<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: химия клетки — вода и минеральные вещества, белки, углеводы и липиды, ДНК и РНК.">
<title>Химия клетки</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M14 8C26 12 14 20 26 24S14 32 26 34" fill="none" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><path d="M26 8C14 12 26 20 14 24S26 32 14 34" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round"/><path d="M16 13h8M17 20h6M16 27h8" stroke="var(--fg)" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>

      <div class="prog" aria-label="Прогресс"><b>Молекулы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>

  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f3 = x => (Math.round(x * 1000) / 1000).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const big = x => Math.round(x).toLocaleString('ru-RU');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-chemcell';
const OX = '#ff8a73', HY = '#e8ecf4', FAT = '#e8c45a';
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ---------- lesson 1: water ----------
const SUB = [
  { k: 'nacl', t: 'Поваренная соль', f: 'NaCl', ph: true, ion: ['Na⁺', 'Cl⁻'], res: ['Растворилась:', 'Na⁺ и Cl⁻ в «шубах»', 'из молекул воды'] },
  { k: 'oil', t: 'Растительное масло', f: 'жир', ph: false, res: ['Не растворилось:', 'масло всплыло плёнкой,', 'вода его не держит'] },
  { k: 'glu', t: 'Глюкоза', f: 'C₆H₁₂O₆', ph: true, res: ['Растворилась:', 'группы –OH дают', 'водородные связи'] },
  { k: 'chol', t: 'Холестерин', f: 'стероид', ph: false, res: ['Не растворился:', 'неполярные кольца', 'не притягивают воду'] },
  { k: 'kp', t: 'Фосфат калия', f: 'K₂HPO₄', ph: true, ion: ['K⁺', 'HPO₄²⁻'], res: ['Растворился:', 'ионы K⁺ и HPO₄²⁻', 'окружены водой'] },
  { k: 'wax', t: 'Пчелиный воск', f: 'воск', ph: false, res: ['Не растворился:', 'длинные цепи C–H', 'без зарядов'] },
  { k: 'gly', t: 'Глицин', f: 'аминокислота', ph: true, res: ['Растворился:', 'группы –NH₂ и –COOH', 'притягивают воду'] },
  { k: 'car', t: 'Каротин', f: 'пигмент', ph: false, res: ['Не растворился:', 'оранжевый пигмент', 'растворим в жирах'] },
];
const WBINS = [{ k: 'ph', name: 'Гидрофильные', sub: 'растворяются в воде', c: '#72d4e8', x0: 8, x1: 256 }, { k: 'pb', name: 'Гидрофобные', sub: 'не растворяются', c: FAT, x0: 264, x1: 512 }];
const BY0 = 298, BY1 = 410, CW = 118, CH = 20;
const BEAK = { x0: 170, x1: 350, y0: 92, y1: 238, wy: 112 };
const WP = (() => { const a = []; for (let i = 0; i < 20; i++) a.push([182 + rnd() * 156, 124 + rnd() * 104, rnd() * 6.28]); return a; })();

// ---------- lesson 2: proteins ----------
const AA = {
  gly: { n: 'Гли', full: 'глицин', c: '#86e0a8', M: 75, r: 'радикал — просто H' },
  ala: { n: 'Ала', full: 'аланин', c: '#72d4e8', M: 89, r: 'радикал –CH₃, неполярный' },
  ser: { n: 'Сер', full: 'серин', c: '#ffb547', M: 105, r: 'радикал с группой –OH, полярный' },
  cys: { n: 'Цис', full: 'цистеин', c: '#f2e06b', M: 121, r: 'радикал с группой –SH: два цистеина дают мостик S–S' },
  lys: { n: 'Лиз', full: 'лизин', c: '#6aa8ff', M: 146, r: 'радикал с –NH₂, заряжен «+»' },
  glu: { n: 'Глу', full: 'глутаминовая кислота', c: '#ff8a73', M: 147, r: 'радикал с –COOH, заряжен «−»' },
};
const AAK = ['gly', 'ala', 'ser', 'cys', 'lys', 'glu'];
const LVN = ['', 'первичная', 'вторичная', 'третичная', 'четвертичная'];
const DEN = (() => { const a = []; for (let i = 0; i < 12; i++) a.push(rnd() * 2 - 1); return a; })();
const PC = { x: 240, y: 222 };
const TY = T => 322 - T * 2;

// ---------- lesson 3: carbohydrates and lipids ----------
const QG = 17.6, QF = 38.9, E0 = 2000, E1 = 2200;
const JG = { x0: 90, x1: 210 }, JF = { x0: 310, x1: 430 };
const JY = m => 300 - m * 1.2;
const EB = { x0: 90, x1: 430, max: 3000 };

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetLesson() {
  const L = LESSONS[S.lesson];
  S.cards = Array(SUB.length).fill(null); S.ord = []; S.sel = -1; S.test = -1; S.testT = 0; S.tested = {}; S.mass = L.mass || 55; S.dragP = null;
  S.chain = []; S.pc = []; S.level = 1; S.maxLv = 1; S.T = L.T || 37; S.den = false; S.denFrom = 0; S.warn1 = false;
  S.gly = 0; S.fat = 0; S.wet = true;
  S.seqI = 0; S.d2 = Array(8).fill(null); S.rn = Array(8).fill(null); S.slot = { r: 'd', i: 0 }; S.chA = 30;
}

// ---------- models ----------
const seqNow = () => SEQS[S.seqI];
function model() {
  const id = LID();
  if (id === 'water') { let n = 0, r = 0; S.cards.forEach((b, i) => { if (b) { n++; if ((b === 'ph') === SUB[i].ph) r++; } }); return { kind: 'water', placed: n, right: r, tested: Object.keys(S.tested).length }; }
  if (id === 'protein') {
    const n = S.chain.length, cys = S.chain.filter(k => k === 'cys').length;
    const mass = S.chain.reduce((s, k) => s + AA[k].M, 0) - 18 * Math.max(0, n - 1);
    return { kind: 'protein', n, cys, mass, bonds: Math.max(0, n - 1), level: S.level, den: S.den, denFrom: S.denFrom, T: S.T };
  }
  if (id === 'carbs') { const Eg = S.gly * QG, Ef = S.fat * QF; return { kind: 'carbs', Eg, Ef, okG: Eg >= E0 && Eg <= E1, okF: Ef >= E0 && Ef <= E1 }; }
  const s = seqNow(); let dn = 0, dr = 0, rn = 0, rr = 0;
  s.forEach((b, i) => { if (S.d2[i]) { dn++; if (S.d2[i] === DC[b]) dr++; } if (S.rn[i]) { rn++; if (S.rn[i] === RC[b]) rr++; } });
  return { kind: 'dna', dn, dr, rn, rr, dOK: dr === 8, rOK: rr === 8 };
}

// ---------- lesson 1 actions ----------
function testSub(i) {
  S.test = i; S.testT = performance.now(); S.tested[SUB[i].k] = true;
  const s = SUB[i];
  toast(s.ph ? `${s.t} растворяется: ${s.ion ? `ионы ${s.ion.join(' и ')} окружены молекулами воды.` : 'молекулы связываются с водой водородными связями.'}` : `${s.t} не растворяется: неполярные молекулы собираются вместе и всплывают.`);
  update();
}
function moveCard(i, bin) {
  S.cards[i] = bin; S.ord = S.ord.filter(j => j !== i); if (bin) S.ord.push(i);
  S.sel = -1;
  const m = model();
  if (m.placed === SUB.length && m.right < SUB.length) toast(`Все карточки разложены. Верно ${m.right} из 8 — переложите отмеченные ✗.`);
  renderTools(); update();
}
function cardPos(i) {
  const b = S.cards[i];
  if (!b) return [66 + (i % 4) * 126, 257 + Math.floor(i / 4) * 24];
  const B = WBINS.find(x => x.k === b), list = S.ord.filter(j => S.cards[j] === b), idx = list.indexOf(i);
  return [B.x0 + (idx % 2 ? 186 : 62), 330 + Math.floor(idx / 2) * 22];
}
const inBeaker = (x, y) => x > BEAK.x0 - 6 && x < BEAK.x1 + 6 && y > BEAK.y0 - 14 && y < BEAK.y1 + 4;

// ---------- lesson 2 actions ----------
function addAA(k) {
  if (S.den) { toast('Этот белок уже денатурирован. Нажмите «Новый белок».'); return; }
  if (S.chain.length >= 12) { toast('В модели хватит 12 аминокислот. В настоящих белках их сотни.'); return; }
  const i = AAK.indexOf(k);
  S.chain.push(k); S.pc.push([70 + i * 76, 386]);
  if (S.level > 1) { S.level = 1; S.maxLv = 1; toast('Цепь стала длиннее — сверните её заново.'); }
  else if (S.chain.length > 1) toast(`Пептидная связь –CO–NH–: связей ${S.chain.length - 1}, выделилось ${S.chain.length - 1} молекул воды.`);
  renderTools(); update();
}
function popAA() {
  if (S.den) { toast('Денатурированный белок не разобрать. Нажмите «Новый белок».'); return; }
  if (!S.chain.length) return;
  S.chain.pop(); S.pc.pop();
  if (S.level > 1 && S.chain.length < 6) { S.level = 1; S.maxLv = 1; }
  renderTools(); update();
}
function setLevel(L) {
  if (S.den) { toast('Белок денатурирован: свернуть его обратно не получится. Нажмите «Новый белок».'); return; }
  if (L > 1 && S.chain.length < 6) { toast('Для спирали нужна цепь хотя бы из 6 аминокислот.'); return; }
  if (L > S.maxLv + 1) { toast(`Сначала ${LVN[S.maxLv + 1]} структура: уровни идут по порядку.`); return; }
  S.level = L; S.maxLv = Math.max(S.maxLv, L);
  const cys = S.chain.filter(k => k === 'cys').length;
  if (L === 2) toast('α-спираль: витки держат водородные связи между группами C=O и N–H.');
  if (L === 3) toast(cys >= 2 ? 'Глобула! Два цистеина сшиты мостиком S–S.' : 'Глобула свернулась, но без двух цистеинов мостика S–S нет.');
  if (L === 4) toast('Четвертичная структура: 4 цепи вместе, как в гемоглобине.');
  renderTools(); update();
}
function setT(T) {
  S.T = Math.round(clamp(T, 0, 100));
  if (S.T >= 60 && !S.den) {
    if (S.level >= 2) { S.den = true; S.denFrom = S.level; toast(`Денатурация при ${S.T} °C: слабые связи разорвались, белок развернулся. Пептидные связи целы — первичная структура осталась.`); renderTools(); }
    else if (!S.warn1 && S.chain.length) { S.warn1 = true; toast('Цепь и так развёрнута: первичную структуру нагрев не разрушает. Сначала сверните белок.'); }
  }
  if (S.T < 60) S.warn1 = false;
  update();
}
function posTarget() {
  const n = S.chain.length, out = [];
  if (!n) return out;
  if (S.den) { const sp = n > 1 ? Math.min(40, 360 / (n - 1)) : 0; for (let i = 0; i < n; i++) out.push([PC.x - sp * (n - 1) / 2 + i * sp, PC.y + DEN[i] * 60]); return out; }
  if (S.level === 1) { const sp = n > 1 ? Math.min(44, 370 / (n - 1)) : 0; for (let i = 0; i < n; i++) out.push([PC.x - sp * (n - 1) / 2 + i * sp, PC.y + (i % 2 ? 9 : -9)]); return out; }
  if (S.level === 2) { const sp = Math.min(30, 330 / (n - 1)); for (let i = 0; i < n; i++) out.push([PC.x - sp * (n - 1) / 2 + i * sp, PC.y + 34 * Math.sin(i * 100 * Math.PI / 180)]); return out; }
  for (let i = 0; i < n; i++) { const s = n > 1 ? i / (n - 1) : 0, th = 0.6 + s * 3.4 * Math.PI, r = 24 + 44 * s; out.push([PC.x + r * Math.cos(th) * 1.1, PC.y + r * Math.sin(th) * 0.92]); }
  return out;
}

// ---------- lesson 3 actions ----------
function setStore(k, v) { S[k] = Math.round(clamp(v, 0, 150)); update(); }

function nextEmpty() {
  const row = S.slot.r === 'd' ? S.d2 : S.rn;
  for (let d = 1; d <= 8; d++) { const j = (S.slot.i + d) % 8; if (!row[j]) { S.slot = { r: S.slot.r, i: j }; return; } }
  const other = S.slot.r === 'd' ? S.rn : S.d2, j = other.findIndex(x => !x);
  if (j >= 0) S.slot = { r: S.slot.r === 'd' ? 'r' : 'd', i: j };
}
function putBase(b) {
  if (!S.slot) { toast('Сначала нажмите на ячейку.'); return; }
  if (S.slot.r === 'd' && b === 'У') { toast('В ДНК урацила нет — только А, Т, Г, Ц.'); return; }
  if (S.slot.r === 'r' && b === 'Т') { toast('В РНК нет тимина: вместо него урацил У.'); return; }
  const row = S.slot.r === 'd' ? S.d2 : S.rn;
  row[S.slot.i] = b;
  const m = model();
  if (S.slot.r === 'd' && m.dn === 8 && !m.dOK) toast(`Вторая цепь ДНК заполнена. Верно ${m.dr} из 8 — исправьте ✗.`);
  else if (S.slot.r === 'r' && m.rn === 8 && !m.rOK) toast(`иРНК заполнена. Верно ${m.rr} из 8 — исправьте ✗.`);
  else if (S.slot.r === 'd' && m.dOK && !m.rOK) toast('Вторая цепь ДНК верна. Теперь иРНК.');
  nextEmpty();
  renderTools(); update();
}

// ---------- lesson 1 scene ----------
function wmol(x, y, a, s = 1) {
  const h1x = x + Math.cos(a - 0.91) * 7 * s, h1y = y + Math.sin(a - 0.91) * 7 * s, h2x = x + Math.cos(a + 0.91) * 7 * s, h2y = y + Math.sin(a + 0.91) * 7 * s;
  return `<path d="M${f(h1x)} ${f(h1y)}L${f(x)} ${f(y)}L${f(h2x)} ${f(h2y)}" stroke="#8b96ad" stroke-width="${f(1.2 * s)}" fill="none"/><circle cx="${f(h1x)}" cy="${f(h1y)}" r="${f(2.5 * s)}" fill="${HY}"/><circle cx="${f(h2x)}" cy="${f(h2y)}" r="${f(2.5 * s)}" fill="${HY}"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(4.3 * s)}" fill="${OX}"/>`;
}
function waterScene(t) {
  let h = bench();
  const B = BEAK, tt = reduce ? 0 : t / 1000, sub = S.test >= 0 ? SUB[S.test] : null;
  h += `<g data-hit="beaker"><rect x="${B.x0 + 2}" y="${B.wy}" width="${B.x1 - B.x0 - 4}" height="${B.y1 - B.wy - 2}" fill="rgba(95,180,217,.16)"/>`;
  const busy = [];
  if (sub && sub.ph) {
    if (sub.ion) {
      const C = [[222, 176, '#72d4e8', sub.ion[0], 9, 0], [298, 176, '#b48cff', sub.ion[1], 11, Math.PI]];

  S.rn.forEach((b, i) => { const st = S.slot && S.slot.r === 'r' && S.slot.i === i ? 'sel' : rAll ? (b === RC[s[i]] ? 'ok' : 'bad') : ''; h += `<g data-hit="n-r-${i}">${nucl(NX(i), R3, b, false, st)}<rect x="${NX(i) - 22}" y="${R3 - 18}" width="44" height="36" fill="transparent"/></g>`; });
  h += lbl(NX(0) - 34, R3 + 26, '3′', 11, '#8b96ad') + lbl(NX(7) + 34, R3 + 26, '5′', 11, '#8b96ad');

}

function hlBox(id) {
  const L = LID();
  if (L === 'water') return { beaker: [BEAK.x0 - 8, BEAK.y0 - 8, BEAK.x1 - BEAK.x0 + 16, BEAK.y1 - BEAK.y0 + 16], wmol: [356, 100, 158, 70], cards: [4, 244, 512, 48], bins: [4, BY0 - 4, 512, BY1 - BY0 + 8], info: [6, 90, 160, 96] }[id] || null;
  if (L === 'protein') {
    if (id === 'bond') { if (S.chain.length >= 2 && S.level === 1 && !S.den) { const a = S.pc[0], b = S.pc[1]; return [Math.min(a[0], b[0]) - 18, Math.min(a[1], b[1]) - 32, Math.abs(a[0] - b[0]) + 36, 64]; } return [30, 120, 420, 206]; }
    if (id === 'sss') { const ci = []; S.chain.forEach((k, i) => { if (k === 'cys') ci.push(i); }); if (ci.length >= 2 && S.level === 3) { const a = S.pc[ci[0]], b = S.pc[ci[1]]; return [Math.min(a[0], b[0]) - 18, Math.min(a[1], b[1]) - 18, Math.abs(a[0] - b[0]) + 36, Math.abs(a[1] - b[1]) + 36]; } return [30, 120, 420, 206]; }
    return { chain: [30, 120, 420, 230], pool: [36, 366, 408, 42], thermo: [458, 94, 56, 256] }[id] || null;
  }
  if (L === 'carbs') return { jarG: [JG.x0 - 30, 70, JG.x1 - JG.x0 + 60, 256], jarF: [JF.x0 - 30, 70, JF.x1 - JF.x0 + 60, 256], bars: [EB.x0 - 6, 326, EB.x1 - EB.x0 + 12, 72] }[id] || null;
  return { s1: [NX(0) - 26, 94, NX(7) - NX(0) + 52, 72], d2: [NX(0) - 26, R2 - 20, NX(7) - NX(0) + 52, 72], hb: [NX(0) - 26, R1 + 10, NX(7) - NX(0) + 52, R2 - R1 - 20], rna: [NX(0) - 26, R3 - 34, NX(7) - NX(0) + 52, 84] }[id] || null;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = id === 'water' ? waterScene(t) : id === 'protein' ? proteinScene() : id === 'carbs' ? carbsScene() : dnaScene();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${f(b[0])}" y="${f(b[1])}" width="${f(b[2])}" height="${f(b[3])}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }

}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 524, hh / 420, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 412 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(k, p) {
  if (k === 'temp') setT((322 - p.y) / 2);
  else if (k === 'gly' || k === 'fat') setStore(k, (300 - p.y) / 1.2);
}
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag) {
    const k = el.dataset.drag;
    drag = { key: k, x: e.clientX, y: e.clientY, moved: false };
    if (k[0] === 'c') { const i = +k.slice(1), [cx, cy] = cardPos(i); drag.card = i; drag.ox = cx - p.x; drag.oy = cy - p.y; S.dragP = p; }
    else { drag.moved = true; dragTo(k, p); }
    scene.classList.add('grabbing');
  } else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.key || !drag.moved) return;
  const p = toSvg(e);
  if (drag.card !== undefined) S.dragP = p; else dragTo(drag.key, p);
  dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) { S.dragP = null; return; }
  if (d.card !== undefined) {
    if (d.moved && S.dragP) {
      const cx = S.dragP.x + d.ox, cy = S.dragP.y + d.oy;
      S.dragP = null;
      if (inBeaker(cx, cy)) { testSub(d.card); return; }
      const B = cy >= BY0 - 6 ? WBINS.find(b => cx >= b.x0 - 10 && cx <= b.x1 + 10) : null;
      moveCard(d.card, B ? B.k : null);
    } else { S.dragP = null; S.sel = S.sel === d.card ? -1 : d.card; renderTools(); update(); }
    return;
  }
  if (d.moved || !d.hit) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'water') {
    if (id === 'beaker') { if (S.sel >= 0) { const i = S.sel; S.sel = -1; renderTools(); testSub(i); } else toast('Перетащите карточку в стакан или выберите её и нажмите на стакан.'); }
    if (id.startsWith('bin-')) { if (S.sel >= 0) moveCard(S.sel, id.slice(4)); else toast('Сначала выберите карточку — нажмите на неё или перетащите.'); }
    if (id === 'wmol') toast('Угол H–O–H около 105°. Кислород сильнее тянет электроны, поэтому молекула воды — диполь.');
  }
  if (L === 'protein') {
    if (id.startsWith('aa-')) addAA(id.slice(3));
    if (id === 'chain' && S.chain.length) toast(`Цепь: ${S.chain.map(k => AA[k].n).join('–')}. Это и есть первичная структура.`);
  }
  if (L === 'carbs') {
    if (id === 'iconG') toast('Гликоген — ветвистая цепь из остатков глюкозы. Хранится в печени и мышцах.');
    if (id === 'iconF') toast('Жир (триглицерид): глицерин + три остатка жирных кислот.');
  }
  if (L === 'dna') {
    if (id.startsWith('n-')) { const [, r, i] = id.split('-'); S.slot = { r, i: +i }; renderTools(); update(); }
    if (id.startsWith('s1-')) { const b = seqNow()[+id.slice(3)]; toast(`${b} — ${NB[b].n}. Найдите, с каким основанием он образует пару.`); }
  }
}

function loop(t) {
  requestAnimationFrame(loop);
  let anim = false;
  const id = LID();
  if (id === 'water' && !reduce) anim = true;
  if (id === 'protein') {
    const T = posTarget();
    for (let i = 0; i < T.length; i++) {
      const p = S.pc[i] || (S.pc[i] = T[i].slice());
      if (reduce) { p[0] = T[i][0]; p[1] = T[i][1]; continue; }
      const dx = T[i][0] - p[0], dy = T[i][1] - p[1];
      if (Math.abs(dx) + Math.abs(dy) > 0.3) { p[0] += dx * 0.16; p[1] += dy * 0.16; anim = true; } else { p[0] = T[i][0]; p[1] = T[i][1]; }
    }
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function act(a) {
  if (a === 'test') { if (S.sel < 0) { toast('Сначала нажмите на карточку.'); return; } const i = S.sel; S.sel = -1; renderTools(); return testSub(i); }
  if (a.startsWith('bin-')) { if (S.sel < 0) { toast('Сначала нажмите на карточку.'); return; } return moveCard(S.sel, a.slice(4)); }
  if (a.startsWith('lv')) return setLevel(+a.slice(2));
  if (a === 'pop') return popAA();
  if (a === 't+') return setT(S.T < 60 ? 70 : Math.min(100, S.T + 10));
  if (a === 'g-' || a === 'g+') return setStore('gly', S.gly + (a === 'g+' ? 10 : -10));

    { id: 'bins', icon: dot('#72d4e8'), name: 'Коробки', spec: 'Гидрофильные и гидрофобные. Ответы проверяются, когда разложены все 8 карточек.' }];
  if (id === 'protein') return [
    { id: 'pool', icon: dot('#86e0a8'), name: 'Аминокислоты', spec: '6 из 20 аминокислот белков. ' + AAK.map(k => `${AA[k].n} — ${AA[k].full}: ${AA[k].r}`).join('; ') + '.' },
    { id: 'chain', icon: dot('#c9d3e6'), name: 'Полипептидная цепь', spec: 'Бусины — остатки аминокислот, линия — пептидные связи. Форма зависит от уровня структуры.' },
    { id: 'bond', icon: dot('#ffb547'), name: 'Пептидная связь', spec: 'Связь –CO–NH– между карбоксильной группой одной аминокислоты и аминогруппой другой. Прочная, ковалентная.' },
    { id: 'sss', icon: dot('#f2e06b'), name: 'Мостик S–S', spec: 'Ковалентная связь между атомами серы двух цистеинов. Скрепляет третичную структуру.' },
    { id: 'thermo', icon: dot('#e8544a'), name: 'Термометр', spec: '37 °C — температура тела. Около 60 °C большинство белков денатурирует.' }];
  if (id === 'carbs') return [
    { id: 'jarG', icon: dot('#86e0a8'), name: 'Склад гликогена', spec: 'Печень (до 100–120 г) и мышцы (300–400 г). Быстрый запас: распадается до глюкозы за минуты.' },
    { id: 'jarF', icon: dot(FAT), name: 'Склад жира', spec: 'Жировая ткань. Почти без воды, энергии на 1 г в 2,2 раза больше, но расходуется медленнее.' },
    { id: 'bars', icon: dot('#ffb547'), name: 'Шкалы энергии', spec: 'Сколько кДж выделится при полном окислении запаса. Зелёная рамка — цель 2000–2200 кДж.' }];
  return [
    { id: 's1', icon: dot('#9fb2d0'), name: 'Цепь 1 ДНК', spec: 'Дана. Сахарно-фосфатный остов (сахар — дезоксирибоза, жёлтые точки — фосфаты) и основания.' },
    { id: 'hb', icon: dot('#86e0a8'), name: 'Водородные связи', spec: 'Между основаниями двух цепей: А–Т — две, Г–Ц — три. Появляются, когда цепь 2 заполнена.' },
    { id: 'd2', icon: dot('#ffb547'), name: 'Цепь 2 ДНК', spec: 'Комплементарна цепи 1 и антипараллельна ей: 3′ напротив 5′.' },
    { id: 'rna', icon: dot('#b48cff'), name: 'иРНК', spec: 'Одна цепь, сахар — рибоза. Строится по цепи 1, вместо Т — урацил У.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    let h = `<h2>${{ water: 'Что на столе', protein: 'Модель белка', carbs: 'Склады энергии', dna: 'Нуклеиновые кислоты' }[L.id]}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'water') h += `<h3>Элементы клетки</h3><div class="feat"><div style="border-left-color:#86e0a8"><b>Макроэлементы</b>O, C, H, N — около 98 %; ещё P, S, K, Ca, Na, Cl, Mg, Fe — доли процента.</div><div style="border-left-color:#72d4e8"><b>Микроэлементы</b>Zn, Cu, I, F, Mn, Co и другие — тысячные доли процента, но без них не работают ферменты и гормоны.</div><div style="border-left-color:#b48cff"><b>Ультрамикроэлементы</b>Se, Au, U, Hg и другие — меньше миллионной доли процента.</div></div>
      <h3>Ионы и их работа</h3><div class="feat"><div style="border-left-color:#72d4e8"><b>K⁺ и Na⁺</b>Разница концентраций внутри и снаружи клетки — основа нервного импульса.</div><div style="border-left-color:#ffb547"><b>Ca²⁺</b>Сокращение мышц, свёртывание крови, прочность костей.</div><div style="border-left-color:#ff8a73"><b>Fe²⁺, I⁻, Mg²⁺</b>Гемоглобин, гормоны щитовидной железы, хлорофилл.</div><div style="border-left-color:#86e0a8"><b>Фосфаты и HCO₃⁻</b>Буферы: держат pH клетки и крови постоянным.</div></div>`;
    if (L.id === 'protein') h += `<h3>Функции белков</h3><div class="feat"><div style="border-left-color:#86e0a8"><b>Ферментативная</b>Амилаза, пепсин, каталаза ускоряют реакции.</div><div style="border-left-color:#72d4e8"><b>Строительная</b>Коллаген, кератин волос и ногтей.</div><div style="border-left-color:#ff8a73"><b>Транспортная</b>Гемоглобин переносит кислород.</div><div style="border-left-color:#ffb547"><b>Двигательная</b>Актин и миозин сокращают мышцы.</div><div style="border-left-color:#b48cff"><b>Защитная и сигнальная</b>Антитела; инсулин и другие белковые гормоны.</div></div>`;
    if (L.id === 'carbs') h += `<h3>Углеводы</h3><div class="feat"><div style="border-left-color:#ffb547"><b>Моносахариды</b>Глюкоза, фруктоза, рибоза, дезоксирибоза. Сладкие, растворимы в воде.</div><div style="border-left-color:#ff8fb8"><b>Дисахариды</b>Сахароза (свёкла, тростник), лактоза (молоко), мальтоза.</div><div style="border-left-color:#86e0a8"><b>Полисахариды</b>Крахмал, гликоген, целлюлоза, хитин. Не сладкие, почти не растворимы.</div></div>
      <h3>Липиды</h3><div class="feat"><div style="border-left-color:${FAT}"><b>Жиры</b>Запас энергии, теплоизоляция, защита органов.</div><div style="border-left-color:#72d4e8"><b>Фосфолипиды</b>Двойной слой клеточных мембран.</div><div style="border-left-color:#b48cff"><b>Стероиды</b>Холестерин, половые гормоны, витамин D.</div></div>`;
    if (L.id === 'dna') h += `<h3>ДНК и РНК</h3><div class="feat"><div style="border-left-color:#9fb2d0"><b>ДНК</b>Две цепи, дезоксирибоза, А Т Г Ц. В ядре, митохондриях, хлоропластах. Хранит наследственную информацию, способна к удвоению.</div><div style="border-left-color:#b48cff"><b>РНК</b>Одна цепь, рибоза, А У Г Ц. Виды: иРНК, тРНК, рРНК. Участвует в синтезе белка.</div></div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'water') {
    const W = bodyW();
    let h = `<h2>Вода в теле</h2><div class="formula">m(воды) ≈ 0,6 × m(тела)</div><div class="steps">` +
      step('Масса тела', S.mass + ' кг') + step('Вода (≈ 60 %)', `0,6 × ${S.mass} = ${ru(W.w)} кг`) +
      step('Пить в день (≈ 30 мл на 1 кг)', `30 × ${S.mass} = ${big(W.drink)} мл`, 'sum') + `</div>`;
    h += `<h3>Почему пот охлаждает</h3><div class="formula">Q = c · m · Δt</div><div class="steps">` +
      step('Теплоёмкость воды c', '4,2 кДж/(кг·°C)') + step('Нагреть воду тела на 1 °C', `4,2 × ${ru(W.w)} × 1 = ${big(W.Q)} кДж`) +
      step('Испарение 1 г пота забирает', '≈ 2,4 кДж') + step('Пота, чтобы остыть на 1 °C', `${big(W.Q)} ÷ 2,4 ≈ ${Math.round(W.Q / 2.4)} г`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">В теле взрослого 55–65 % воды, у детей больше. Высокая теплоёмкость воды не даёт телу быстро перегреться.</p>`;
    h += `<h3>Ваша сортировка</h3><div class="steps">` + SUB.map((s, i) => step(s.t, (S.tested[s.k] ? (s.ph ? 'в воде: растворилось' : 'в воде: не растворилось') : 'не проверено') + ' · ' + (S.cards[i] ? WBINS.find(b => b.k === S.cards[i]).name.toLowerCase() + (m.placed === 8 ? ((S.cards[i] === 'ph') === s.ph ? ' ✓' : ' ✗') : '') : '—'))).join('') +
      step('Итого', m.placed === 8 ? `верно ${m.right} из 8` : `разложено ${m.placed} из 8`, 'sum') + `</div>`;
    return h;
  }
  if (id === 'protein') {
    const n = m.n, sum = S.chain.reduce((s, k) => s + AA[k].M, 0);
    let h = `<h2>Пептид из ${n} аминокислот</h2><div class="formula">связей = n − 1 · M = ΣM − 18 × (n − 1)</div><div class="steps">` +
      step('Цепь', n ? S.chain.map(k => AA[k].n).join('–') : '—') +
      step('Пептидных связей', `${n} − 1 = ${m.bonds}`) + step('Выделилось воды', `${m.bonds} молекул H₂O`) +
      step('Сумма масс аминокислот', n ? S.chain.map(k => AA[k].M).join(' + ') + ` = ${sum}` : '0') +
      step('Масса пептида', n ? `${sum} − 18 × ${m.bonds} = ${m.mass} Да` : '—', 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Да (дальтон) — атомная единица массы. Средний остаток аминокислоты в белке весит около 110 Да, поэтому белок из 300 аминокислот — примерно 33 000 Да.</p>`;
    h += `<h3>Состояние белка</h3><div class="steps">` + step('Уровень структуры', m.den ? `денатурирован (был: ${LVN[m.denFrom]})` : LVN[m.level]) + step('Цистеинов', `${m.cys} ${m.cys >= 2 ? '→ возможен мостик S–S' : ''}`) +
      step('Температура', `${m.T} °C ${m.T >= 60 ? '≥ 60 °C — денатурация' : m.T > 40 ? '— опасный жар для организма' : '— белок стабилен'}`) +
      step('Что разрушает нагрев', 'водородные, ионные связи, гидрофобные взаимодействия') + step('Что остаётся', 'пептидные связи = первичная структура', 'sum') + `</div>`;
    return h;
  }
  if (id === 'carbs') {
    const ratio = S.fat ? S.gly / S.fat : 0;
    let h = `<h2>Энергия запасов</h2><div class="formula">E = m × q</div><div class="steps">` +
      step('Гликоген', `${S.gly} г × 17,6 кДж/г = ${big(m.Eg)} кДж`) + step('Жир', `${S.fat} г × 38,9 кДж/г = ${big(m.Ef)} кДж`) +
      step('Сколько нужно на 2000 кДж', `${Math.ceil(2000 / QG)} г гликогена или ${Math.ceil(2000 / QF)} г жира`) +
      step('Энергия на 1 г', `38,9 ÷ 17,6 ≈ ${ru(QF / QG, 1)} раза больше у жира`, 'sum') + `</div>`;
    h += `<h3>С учётом воды</h3><div class="steps">` + step('Гликоген в клетке держит воду', '≈ 3 г на 1 г') +
      step('Масса склада гликогена', S.wet ? `${S.gly} × 4 = ${S.gly * 4} г` : `${S.gly} г (без воды)`) + step('Масса склада жира', `${S.fat} г`) +
      step('Жир легче', S.fat ? `${ru((S.wet ? 4 : 1) * S.gly / S.fat, 1)} раза` : '—', 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">${S.fat ? `Без воды разница ${ru(ratio, 1)} раза, а с водой гликогена — около 9 раз.` : 'Наполните оба склада, чтобы сравнить.'} Поэтому птицы перед перелётом и звери перед спячкой запасают именно жир.</p>`;
    h += `<h3>Вода из жира</h3><div class="steps">` + step('При окислении 1 г жира', '≈ 1,1 г воды') + step(`Из ${S.fat} г жира`, `≈ ${ru(S.fat * 1.1, 0)} г воды`, 'sum') + `</div>`;
    return h;
  }
  const s = seqNow();
  const at = s.filter(b => b === 'А' || b === 'Т').length, gc = 8 - at;
  let h = `<h2>Двойная цепь</h2><div class="steps">` + step('Цепь 1', s.join(' ')) + step('Пар А–Т', `${at} × 2 = ${at * 2} H-связей`) + step('Пар Г–Ц', `${gc} × 3 = ${gc * 3} H-связей`) +
    step('Всего водородных связей', `${at * 2} + ${gc * 3} = ${at * 2 + gc * 3}`, 'sum') + step('Длина участка', `8 × 0,34 нм = 2,72 нм`) + `</div>` +
    `<p class="note" style="margin-top:8px">Чем больше пар Г–Ц, тем прочнее ДНК и тем выше температура, при которой цепи расходятся.</p>`;
  h += `<h3>Правило Чаргаффа</h3><div class="formula">А = Т, Г = Ц, А + Т + Г + Ц = 100 %</div><div class="steps">` +
    step('Аденин', `${S.chA} %`) + step('Тимин = аденин', `${S.chA} %`) + step('Г + Ц', `100 − 2 × ${S.chA} = ${100 - 2 * S.chA} %`) +
    step('Гуанин = цитозин', `${100 - 2 * S.chA} ÷ 2 = ${50 - S.chA} %`, 'sum') + `</div>`;
  h += `<h3>Ваши цепи</h3><div class="steps">` + step('Цепь 2 ДНК', S.d2.map(b => b || '·').join(' ') + (m.dn === 8 ? ` · верно ${m.dr}/8` : '')) +
    step('иРНК', S.rn.map(b => b || '·').join(' ') + (m.rn === 8 ? ` · верно ${m.rr}/8` : ''), 'sum') + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'water') {
    el.innerHTML = `<div class="k">Сортировка</div><div class="v ${S.done.water ? 'ok' : ''}">${m.placed} / 8</div>
      <div class="gauge"><b style="width:${(m.placed / 8 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>проверено</span><span>${m.tested} из 8</span></div><div class="lr"><span>верно</span><span>${m.placed === 8 ? m.right + ' из 8' : '—'}</span></div>`;
  } else if (m.kind === 'protein') {
    el.innerHTML = `<div class="k">Белок</div><div class="v ${S.done.protein ? 'ok' : m.den ? 'bad' : ''}">${m.den ? 'денатур.' : m.level + '° структура'}</div>
      <div class="lr"><span>аминок.</span><span>${m.n}</span></div><div class="lr"><span>связей</span><span>${m.bonds}</span></div><div class="lr"><span>t</span><span>${m.T} °C</span></div>`;
  } else if (m.kind === 'carbs') {
    el.innerHTML = `<div class="k">Энергия, кДж</div><div class="v ${S.done.carbs ? 'ok' : ''}">${big(m.Eg + m.Ef)}</div>
      <div class="lr"><span style="color:#86e0a8">гликоген</span><span>${big(m.Eg)}</span></div><div class="lr"><span style="color:${FAT}">жир</span><span>${big(m.Ef)}</span></div>
      <div class="lr"><span>масса</span><span>${S.gly}/${S.fat} г</span></div>`;
  } else {
    el.innerHTML = `<div class="k">Нуклеотиды</div><div class="v ${S.done.dna ? 'ok' : ''}">${m.dn + m.rn} / 16</div>
      <div class="gauge"><b style="width:${((m.dn + m.rn) / 16 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>ДНК</span><span>${m.dn === 8 ? m.dr + ' верно' : m.dn + '/8'}</span></div><div class="lr"><span>иРНК</span><span>${m.rn === 8 ? m.rr + ' верно' : m.rn + '/8'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались в химии клетки!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  carbs: '<rect x="12" y="6" width="16" height="20" rx="2" fill="none" stroke="#9fb2d0"/><rect x="13" y="14" width="14" height="11" fill="rgba(134,224,168,.45)"/><rect x="38" y="6" width="16" height="20" rx="2" fill="none" stroke="#9fb2d0"/><rect x="39" y="19" width="14" height="6" fill="rgba(232,196,90,.7)"/>',

};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'water') {
    now = `Стакан воды с моделью молекул-диполей. Последний опыт: ${S.test >= 0 ? `${SUB[S.test].t} — ${SUB[S.test].ph ? 'растворилось' : 'не растворилось'}` : 'ещё не было'}. Проверено в воде: ${Object.keys(S.tested).map(k => SUB.find(s => s.k === k).t).join(', ') || 'ничего'}. Раскладка ученика по коробкам «Гидрофильные» / «Гидрофобные»: ` +
      SUB.map((s, i) => `«${s.t}» → ${S.cards[i] ? WBINS.find(b => b.k === S.cards[i]).name : 'не разложена'}`).join('; ') + '. ' + (m.placed === 8 ? `Все разложены, верно ${m.right} из 8.` : `Разложено ${m.placed} из 8.`) +
      ` На вкладке расчётов: масса тела ${S.mass} кг, воды в теле ≈ ${ru(S.mass * 0.6)} кг.`;
    guide = 'Не говори, куда класть непроверенную карточку. Предложи проверить её в стакане и спроси, есть ли у вещества заряды или группы –OH, –NH₂, –COOH.';
  }
  if (id === 'protein') {
    now = `Модель белка. Цепь: ${S.chain.length ? S.chain.map(k => AA[k].full).join(' – ') : 'пустая'} (${m.n} аминокислот, ${m.cys} цистеинов, ${m.bonds} пептидных связей, масса ≈ ${m.mass} Да). Уровень структуры: ${m.den ? `денатурирован при нагреве, до этого была ${LVN[m.denFrom]}` : LVN[m.level]}. Температура ${m.T} °C (денатурация в модели с 60 °C).`;
    guide = 'Веди вопросами: сколько ещё аминокислот и цистеинов нужно, какие связи держат каждый уровень структуры, что разрушается при денатурации и что остаётся.';
  }
  if (id === 'carbs') {
    now = `Два склада энергии: гликоген ${S.gly} г (${big(m.Eg)} кДж, ${m.okG ? 'в цели' : 'не в цели'}), жир ${S.fat} г (${big(m.Ef)} кДж, ${m.okF ? 'в цели' : 'не в цели'}). Цель: 2000–2200 кДж в каждом. Гликоген хранится ${S.wet ? 'с водой (×4 к массе)' : 'сухим'}.`;
    guide = 'Не называй готовые массы. Попроси ученика посчитать m = E ÷ q для каждого склада и сравнить. Спроси, почему животные запасают на зиму жир.';
  }
  if (id === 'dna') {
    now = `Цепь 1 ДНК (дана, 5′→3′): ${seqNow().join(' ')}. Цепь 2 ученика: ${S.d2.map(b => b || '_').join(' ')} (${m.dn === 8 ? `верно ${m.dr} из 8` : `заполнено ${m.dn} из 8`}). иРНК ученика: ${S.rn.map(b => b || '_').join(' ')} (${m.rn === 8 ? `верно ${m.rr} из 8` : `заполнено ${m.rn} из 8`}). Выбрана ячейка: ${S.slot ? (S.slot.r === 'd' ? 'цепь 2' : 'иРНК') + ', позиция ' + (S.slot.i + 1) : 'нет'}. Правило Чаргаффа: А = ${S.chA} %.`;
    guide = 'Не заполняй цепи за ученика и не называй ответ целиком. Спрашивай, с каким основанием образует пару данное, и чем РНК отличается от ДНК.';
  }
  return [
    `Раздел: биология, 10 класс, тема «Химия клетки» (Клетка и молекулы). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { water: 'Почему соль растворяется в воде, а масло нет?', protein: 'Почему при варке яйца белок становится белым?', carbs: 'Почему жир — более выгодный запас энергии, чем гликоген?', dna: 'Чем РНК отличается от ДНК?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
