<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 9 класс: движения плоскости — осевая и центральная симметрия, поворот, параллельный перенос, паркеты и гомотетия.">
<title>Движения</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as the other math labs. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 380px);min-height:0}   /* the task card is tall on phones: the plane goes under it */
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Движения</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: координатная плоскость с фигурой, её образом при движении и фигурой-целью. Оси, центры и векторы можно перетаскивать."></svg>
    <div class="task" id="taskCard" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>

    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const pt = (x, y) => `(${num(x)}; ${num(y)})`;
const ptp = p => pt(p[0], p[1]);
const pn = v => v < 0 ? `(${num(v)})` : num(v);
const deg = a => `${num(a)}°`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CA_ = '#72d4e8', CB_ = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', RD = '#ff8a73';
const same = (p, q) => Math.abs(p[0] - q[0]) < 1e-9 && Math.abs(p[1] - q[1]) < 1e-9;
const close = (p, q) => Math.abs(p[0] - q[0]) < 1e-6 && Math.abs(p[1] - q[1]) < 1e-6;
const match = (A, B) => A.length === B.length && A.every((p, i) => close(p, B[i]));
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const rnd = v => Math.round(v * 1e9) / 1e9;

// ---------- the moves ----------
function refl(p, P, Q) {               // symmetry in the line PQ
  const dx = Q[0] - P[0], dy = Q[1] - P[1], t = ((p[0] - P[0]) * dx + (p[1] - P[1]) * dy) / (dx * dx + dy * dy);
  const fx = P[0] + t * dx, fy = P[1] + t * dy;
  return [rnd(2 * fx - p[0]), rnd(2 * fy - p[1])];
}
function rot(p, c, a) {                // rotation about c by a degrees (counterclockwise is positive)
  const r = a * Math.PI / 180, co = Math.round(Math.cos(r) * 1e12) / 1e12, si = Math.round(Math.sin(r) * 1e12) / 1e12;
  const x = p[0] - c[0], y = p[1] - c[1];
  return [rnd(c[0] + x * co - y * si), rnd(c[1] + x * si + y * co)];
}
const sh = (pts, d) => pts.map(p => [p[0] + d[0], p[1] + d[1]]);
const area2 = pts => pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0);
const orient = pts => area2(pts) > 0 ? 'против часовой' : 'по часовой';
const angAt = (pts, i) => {           // interior angle at vertex i (degrees)
  const n = pts.length, a = pts[(i + n - 1) % n], b = pts[i], c = pts[(i + 1) % n];
  const v1 = [a[0] - b[0], a[1] - b[1]], v2 = [c[0] - b[0], c[1] - b[1]];
  return Math.acos(clamp((v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2)), -1, 1)) * 180 / Math.PI;
};
const normA = a => { a = ((a % 360) + 360) % 360; return a > 180 ? a - 360 : a; };

// the flag F: A = pole foot (vertex 0), B = pennant tip (vertex 3)
const F0 = [[0, 0], [1, 0], [1, 2], [3, 3], [1, 4], [0, 4]];
const FIG1 = sh(F0, [-5, 1]), AX1 = [[-1, -2], [2, 1]], TG1 = FIG1.map(p => refl(p, AX1[0], AX1[1]));
const FIG2 = sh(F0, [-5, -2]), C2A = [-1, 4], C2B = [0, -2], TA2 = FIG2.map(p => rot(p, C2A, 90)), TB2 = FIG2.map(p => rot(p, C2B, 180));
const FIG3 = sh(F0, [-5, -4]), V3A = [6, 3], V3B = [8, 0], TA3 = sh(FIG3, V3A), TB3 = sh(FIG3, V3B);
// lesson 4: tile on the lattice e1(3; 0), e2(1; 2); its area is 6 cells
const E1 = [3, 0], E2 = [1, 2], TAREA = 6;
const TILE = {
  wave: [[0, 0], [1, 0], [1.5, -0.5], [2, 0], [3, 0], [2.5, 0.5], [3.5, 1.5], [4, 2], [3, 2], [2.5, 1.5], [2, 2], [1, 2], [0.5, 1.5], [-0.5, 0.5]],
  flat: [[0, 0], [3, 0], [4, 2], [1, 2]],
};
const A4 = [-1, -1], A4H = [-3, -2];
const KS = [-3, -2.5, -2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2, 2.5, 3];

const LESSONS = [
  { id: 'axis', title: 'Осевая симметрия',
    text: ['Точки A и A′ симметричны относительно прямой a, если прямая a — серединный перпендикуляр к отрезку AA′. Осевая симметрия переводит каждую точку плоскости в симметричную ей, а точки самой оси оставляет на месте.',

const KEY = 'luch-math-moves';

try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const savedIdx = Math.max(0, LESSONS.findIndex(l => l.id === saved.lesson));
const S = { lesson: savedIdx, done: saved.done || {}, tab: 'overview', hl: null, mode: 'main', hits: {}, ex: {},
            P: [0, -3], Q: [0, 3], O: [1, 1], ang: 45, H3: [-3, -3], p1: -1, p2: 1, u: [2, 0], v: [0, 3], Hc: [-1, -1], k: 1, edge: 'wave' };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: LESSONS[S.lesson].id, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const HITS = () => (S.hits[LID()] = S.hits[LID()] || {});

// ---------- lesson 4 helpers ----------
const inLat = w => { const b = w[1] / 2, a = (w[0] - b) / 3; return Number.isInteger(b) && Number.isInteger(a); };
const det = (u, v) => u[0] * v[1] - u[1] * v[0];
function segCross(a, b, c, d) {
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  const d1 = o(a, b, c), d2 = o(a, b, d), d3 = o(c, d, a), d4 = o(c, d, b), e = 1e-9;
  return ((d1 > e && d2 < -e) || (d1 < -e && d2 > e)) && ((d3 > e && d4 < -e) || (d3 < -e && d4 > e));
}
function onSeg(p, a, b) {
  const cr = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
  if (Math.abs(cr) > 1e-9) return false;
  return Math.min(a[0], b[0]) - 1e-9 <= p[0] && p[0] <= Math.max(a[0], b[0]) + 1e-9 && Math.min(a[1], b[1]) - 1e-9 <= p[1] && p[1] <= Math.max(a[1], b[1]) + 1e-9;
}
function inside(p, poly) {
  for (let i = 0; i < poly.length; i++) if (onSeg(p, poly[i], poly[(i + 1) % poly.length])) return false;
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function overlap(A, B) {
  for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++)
    if (segCross(A[i], A[(i + 1) % A.length], B[j], B[(j + 1) % B.length])) return true;
  if (A.some(p => inside(p, B)) || B.some(p => inside(p, A))) return true;
  // equal polygons, or one sits on the other with shared edges only: test edge midpoints
  const mids = P => P.map((p, i) => { const q = P[(i + 1) % P.length]; return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; });
  return mids(A).some(p => inside(p, B)) || mids(B).some(p => inside(p, A)) || (A.length === B.length && A.every((p, i) => close(p, B[i])));
}
const inPlane = pts => pts.every(p => p[0] >= -G - 1e-9 && p[0] <= G + 1e-9 && p[1] >= -G - 1e-9 && p[1] <= G + 1e-9);

function model() {
  const id = LID();
  if (id === 'axis') {
    const img = FIG1.map(p => refl(p, S.P, S.Q));
    const n = img.filter((p, i) => close(p, TG1[i])).length;
    return { kind: id, mode: S.mode, P: S.P, Q: S.Q, img, n, ok: n === FIG1.length, A: FIG1[0], A1: img[0], B: FIG1[3], B1: img[3] };
  }
  if (id === 'rot') {
    const img = FIG2.map(p => rot(p, S.O, S.ang));
    return { kind: id, mode: S.mode, O: S.O, ang: S.ang, img, A: FIG2[0], A1: img[0], hitA: match(img, TA2), hitB: match(img, TB2) };
  }
  if (id === 'shift') {
    const a = [S.H3[0] - FIG3[0][0], S.H3[1] - FIG3[0][1]], img = sh(FIG3, a);
    const img1 = FIG3.map(p => [2 * S.p1 - p[0], p[1]]), img2 = img1.map(p => [2 * S.p2 - p[0], p[1]]);
    return { kind: id, mode: S.mode, a, img, img1, img2, p1: S.p1, p2: S.p2, s: 2 * (S.p2 - S.p1),
             hitA: S.mode === 'vec' && match(img, TA3), hitB: S.mode === 'two' && match(img2, TB3) };
  }
  const T = TILE[S.edge], u = S.u, v = S.v, D = det(u, v), latOk = inLat(u) && inLat(v);
  const okT = latOk && Math.abs(D) === TAREA;
  const base = sh(T, A4H), himg = base.map(p => [rnd(S.Hc[0] + S.k * (p[0] - S.Hc[0])), rnd(S.Hc[1] + S.k * (p[1] - S.Hc[1]))]);
  const fits = inPlane(himg), ov = overlap(base, himg);
  return { kind: id, mode: S.mode, u: u.slice(), v: v.slice(), D, latOk, okT, edge: S.edge, Hc: S.Hc, k: S.k, base, himg, fits, ov,
           okH: Math.abs(S.k) === 2 && fits && !ov, hitA: S.mode === 'tile' && okT, hitB: S.mode === 'homo' && Math.abs(S.k) === 2 && fits && !ov };
}
function tileStatus(m) {
  if (m.D === 0) return 'u и v на одной прямой — полоса';
  if (m.okT) return 'встык: без щелей и наложений';
  if (Math.abs(m.D) < TAREA) return 'наложения';
  if (m.latOk) return 'щели';
  return 'щели и наложения';
}

// ---------- geometry (SVG units, 520 × 405) ----------
const U = 20, OX = 260, OY = 205, G = 7;
const X = x => OX + x * U, Y = y => OY - y * U;
const P2 = p => `${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`;
const polyD = pts => 'M' + pts.map(P2).join('L') + 'Z';
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const Ln = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const LnP = (p, q, col, w = 1, extra = '') => Ln(X(p[0]), Y(p[1]), X(q[0]), Y(q[1]), col, w, extra);
const arrowHead = (x, y, dir) => dir === 'r' ? `<path d="M${x} ${y}l-8 -4.5v9z" fill="#a9b4c9"/>` : `<path d="M${x} ${y}l-4.5 8h9z" fill="#a9b4c9"/>`;
const tag = (x, y, txt, col) => { const w = txt.length * 6.7 + 12; return `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - 12).toFixed(1)}" width="${w.toFixed(1)}" height="18" rx="6" fill="${col}" stroke="${INK}" stroke-width="1.4"/>` + T(x, y + 1, 11, txt, '#0b1019', 'middle', 'font-weight="500"'); };
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <clipPath id="pl"><rect x="${X(-G)}" y="${Y(G)}" width="${2 * G * U}" height="${2 * G * U}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function planeSVG() {
  let h = `<rect x="${X(-G)}" y="${Y(G)}" width="${2 * G * U}" height="${2 * G * U}" fill="rgba(18,26,40,.55)"/>`;
  for (let v = -G; v <= G; v++) h += Ln(X(v), Y(G), X(v), Y(-G), 'rgba(160,185,230,.12)') + Ln(X(-G), Y(v), X(G), Y(v), 'rgba(160,185,230,.12)');
  h += Ln(X(-G - 0.4), Y(0), X(G + 0.5), Y(0), '#a9b4c9', 1.6) + arrowHead(X(G + 0.5) + 6, Y(0), 'r');
  h += Ln(X(0), Y(-G - 0.4), X(0), Y(G + 0.5), '#a9b4c9', 1.6) + arrowHead(X(0), Y(G + 0.5) - 6, 'u');
  for (let v = -G; v <= G; v++) {
    if (!v) continue;
    if (v % 2 === 0) h += T(X(v), Y(0) + 13, 8.5, num(v)) + T(X(0) - 5, Y(v) + 3, 8.5, num(v), MU, 'end');
  }
  h += T(X(0) - 5, Y(0) + 12, 9.5, 'O', FG, 'end') + T(X(G + 0.5) + 2, Y(0) - 8, 12, 'x', FG) + T(X(0) + 11, Y(G + 0.5) - 2, 12, 'y', FG);
  return h;
}
function arrow(p, q, col, w = 3, dash = false) {
  const ax = X(p[0]), ay = Y(p[1]), bx = X(q[0]), by = Y(q[1]);
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.5), hw = hl * 0.45;
  const ex = bx - ux * hl, ey = by - uy * hl;
  const head = `<path d="M${bx.toFixed(1)} ${by.toFixed(1)}L${(ex - uy * hw).toFixed(1)} ${(ey + ux * hw).toFixed(1)}L${(ex + uy * hw).toFixed(1)} ${(ey - ux * hw).toFixed(1)}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  if (dash) return Ln(ax, ay, ex, ey, col, w - 0.6, 'stroke-dasharray="5 4" stroke-linecap="round"') + head;
  return Ln(ax, ay, ex, ey, INK, w + 2.6, 'stroke-linecap="round"') + Ln(ax, ay, ex, ey, col, w, 'stroke-linecap="round"') + head;

// Fit the drawing (plane + caption: x 108…432, y 52…392) into the part of the stage
// that the task card (top left) and the meter (top right) do not cover.
let VBOX = { x: 0, y: 0, w: 520, h: 405 };
const CX0 = 108, CY0 = 52, CW = 324, CH = 340;
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const tr = $('#taskCard').getBoundingClientRect(), mr = $('#meter').getBoundingClientRect();
  const cardR = tr.right - rc.left, cardB = tr.bottom - rc.top, metL = mr.left - rc.left, metB = mr.bottom - rc.top;
  const opts = [];
  // beside the cards: between the task card and the meter, full height
  { const L = cardR + 8, R = metL - 8; if (R - L > 120) opts.push({ L, Tp: 8, W: R - L, H: hh - 16 }); }
  // under the cards: full width
  { const Tp = Math.max(cardB, metB) + 8; if (hh - Tp > 120) opts.push({ L: 8, Tp, W: w - 16, H: hh - Tp - 8 }); }
  // right of the task card only (the meter is small): from the card to the right edge, below the meter
  { const L = cardR + 8, Tp = metB + 8; if (w - L > 120 && hh - Tp > 120) opts.push({ L, Tp, W: w - L - 8, H: hh - Tp - 8 }); }
  let best = null;
  for (const o of opts) { o.s = Math.min(o.W / CW, o.H / CH, 1.7); if (!best || o.s > best.s) best = o; }
  const sAll = Math.min(w / (CW + 30), hh / (CH + 20), 1.7);
  if (!best || best.s < sAll * 0.62) best = { L: (w - CW * sAll) / 2, Tp: (hh - CH * sAll) / 2, W: CW * sAll, H: CH * sAll, s: sAll };
  const s = best.s, offX = best.L + (best.W - CW * s) / 2, offY = best.Tp + (best.H - CH * s) / 2;
  VBOX = { x: CX0 - offX / s, y: CY0 - offY / s, w: w / s, h: hh / s };
  scene.setAttribute('viewBox', `${VBOX.x.toFixed(1)} ${VBOX.y.toFixed(1)} ${VBOX.w.toFixed(1)} ${VBOX.h.toFixed(1)}`);
  dirty = true;
}
const ro = new ResizeObserver(fit);

}

  if (id === 'rot') return S.mode === 'ex' ? [] : [['ang', angHandle()], ['O', S.O]];

  else { set('#r1', num(m.k)); set('#r2', '×' + num(Math.abs(m.k))); set('#r3', '×' + num(m.k * m.k)); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +

  }

function calcHTML(m) {
  if (m.kind === 'axis') {
    const f = [(m.A[0] + m.A1[0]) / 2, (m.A[1] + m.A1[1]) / 2];
    let h = `<h2>Осевая симметрия</h2><div class="formula">ось ⟂ AA′ и делит AA′ пополам</div><h3>Точка A и её образ</h3><div class="steps">` +
      step('A', ptp(m.A)) + step('A′', ptp(m.A1)) + step('середина AA′', ptp(f) + ' — на оси') +
      step('A цели', ptp(TG1[0]), 'sum') + `</div>`;
    h += `<h3>Что сохраняется</h3><div class="steps">` +
      step('AB', fmt(dist(m.A, m.B), 2)) + step('A′B′', fmt(dist(m.A1, m.B1), 2)) +
      step('угол при B', `${fmt(angAt(FIG1, 3), 1)}° → ${fmt(angAt(m.img, 3), 1)}°`) +
      step('обход вершин', `${orient(FIG1)} → ${orient(m.img)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Длины и углы те же — это движение. Меняется только ориентация: отражение «выворачивает» фигуру, как зеркало.</p>`;
  }
  if (m.kind === 'rot') {
    const h0 = HITS();
    let h = `<h2>Поворот</h2><div class="formula">OA′ = OA, ∠AOA′ = α</div><h3>Ваш поворот</h3><div class="steps">` +
      step('центр O', ptp(m.O)) + step('угол α', deg(m.ang)) + step('A → A′', `${ptp(m.A)} → ${ptp(m.A1)}`) +
      step('OA', fmt(dist(m.O, m.A), 2)) + step('OA′', fmt(dist(m.O, m.A1), 2), 'sum') + `</div>`;
    if (Math.abs(m.ang) === 180) h += `<h3>Центральная симметрия</h3><div class="steps">` +
      step('середина AA′', ptp([(m.A[0] + m.A1[0]) / 2, (m.A[1] + m.A1[1]) / 2])) + step('совпадает с O', 'да ✓', 'sum') + `</div>`;
    h += `<h3>Цели</h3><div class="steps">` + step('цель 1: A', ptp(TA2[0]) + (h0.a ? ' ✓' : '')) + step('цель 2: A', ptp(TB2[0]) + (h0.b ? ' ✓' : ''), 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">При α = 90° против часовой стрелки вектор (x; y) от центра превращается в (−y; x). Обход вершин после поворота не меняется: ${orient(FIG2)} → ${orient(m.img)}.</p>`;
  }
  if (m.kind === 'shift') {
    if (m.mode === 'vec') {
      let h = `<h2>Параллельный перенос</h2><div class="formula">(x; y) → (x + a₁; y + a₂)</div><h3>Ваш вектор</h3><div class="steps">` +
        step('a', ptp(m.a)) + step('A → A′', `${ptp(FIG3[0])} → ${ptp(m.img[0])}`) + step('B → B′', `${ptp(FIG3[3])} → ${ptp(m.img[3])}`) +
        step('AA′ = BB′ = |a|', fmt(Math.hypot(...m.a), 2), 'sum') + `</div>`;
      h += `<h3>Цель 1</h3><div class="steps">` + step('A цели', ptp(TA3[0])) + step('нужный a', 'A цели − A') + step('ваш A′', ptp(m.img[0]) + (m.hitA ? ' ✓' : ''), 'sum') + `</div>`;
      return h + `<p class="note" style="margin-top:10px">AB = A′B′ = ${fmt(dist(FIG3[0], FIG3[3]), 2)}, угол при B ${fmt(angAt(FIG3, 3), 1)}° = ${fmt(angAt(m.img, 3), 1)}°. Ориентация: ${orient(m.img)}, как у исходного флажка.</p>`;
    }
    let h = `<h2>Две симметрии = перенос</h2><div class="formula">x → 2l₁ − x → 2l₂ − (2l₁ − x) = x + 2(l₂ − l₁)</div><h3>Точка A</h3><div class="steps">` +
      step('A', ptp(FIG3[0])) + step(`отражение в l₁ (x = ${num(m.p1)})`, ptp(m.img1[0])) + step(`отражение в l₂ (x = ${num(m.p2)})`, ptp(m.img2[0])) +
      step('сдвиг 2·(l₂ − l₁)', `2·(${num(m.p2)} − ${pn(m.p1)}) = ${num(m.s)}`, 'sum') + `</div>`;
    h += `<h3>Ориентация</h3><div class="steps">` + step('флажок', orient(FIG3)) + step('после l₁', orient(m.img1)) + step('после l₂', orient(m.img2), 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Цель 2 сдвинута на 8 вправо: нужно l₂ − l₁ = 4. Само положение осей может быть любым.</p>`;
  }
  if (m.mode === 'tile') {
    let h = `<h2>Паркет из переносов</h2><div class="formula">площадь(u, v) = |u₁·v₂ − u₂·v₁|</div><h3>Ваши векторы</h3><div class="steps">` +
      step('u', ptp(m.u)) + step('v', ptp(m.v)) +
      step('площадь параллелограмма', `|${pn(m.u[0])}·${pn(m.v[1])} − ${pn(m.u[1])}·${pn(m.v[0])}| = ${Math.abs(m.D)}`) +
      step('площадь плитки', TAREA) + step('итог', tileStatus(m), 'sum') + `</div>`;
    h += `<h3>Сдвиги на соседние плитки</h3><div class="steps">` + step('вправо', '(3; 0)') + step('вдоль наклонной стороны', '(1; 2)') +
      step('u — из таких шагов?', inLat(m.u) ? 'да' : 'нет') + step('v — из таких шагов?', inLat(m.v) ? 'да' : 'нет', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Плитки встают встык, когда u и v собраны из шагов (3; 0) и (1; 2), а параллелограмм на u и v по площади равен плитке. Форма краёв не важна: выступ на одной стороне перенесён на противоположную.</p>`;
  }
  let h = `<h2>Гомотетия</h2><div class="formula">OA′ = |k|·OA, площадь ×k²</div><h3>Ваша гомотетия</h3><div class="steps">` +
    step('центр O', ptp(m.Hc)) + step('k', num(m.k)) +
    step('сторона (3) →', fmt(3 * Math.abs(m.k), 2)) + step('площадь 6 →', `6·${pn(m.k)}² = ${num(6 * m.k * m.k)}`) +
    step('углы', 'не меняются') + `</div><h3>Условия задания</h3><div class="steps">` +
    step('площадь ×4', Math.abs(m.k) === 2 ? 'да ✓' : 'нет') + step('целиком на поле', m.fits ? 'да ✓' : 'нет') + step('не задевает исходную', m.ov ? 'нет' : 'да ✓', 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Гомотетия не движение: при |k| ≠ 1 расстояния меняются. Но фигура остаётся подобной — как логотип на значке и на билборде.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()], h = HITS();
  const lr = (a, b, c) => `<div class="lr"><span>${a}</span><span class="${c ? 'ok' : ''}">${b}</span></div>`;
  if (m.kind === 'axis') el.innerHTML = m.mode === 'ex' ? `<div class="k">Оси симметрии</div><div class="v">${Object.values(S.ex).filter(Boolean).length} из 6</div>${lr('фигур открыто', '')}` :
    `<div class="k">Совпало вершин</div><div class="v ${m.ok || ok ? 'ok' : ''}">${m.n} из 6</div>${lr('AB = A′B′', fmt(dist(m.A1, m.B1), 2))}${lr('обход F′', orient(m.img).replace('по часовой', 'по ч. с.').replace('против часовой', 'против ч. с.'))}`;
  else if (m.kind === 'rot') el.innerHTML = m.mode === 'ex' ? `<div class="k">Поворотная симметрия</div><div class="v">n = 6, 3, 2, 4</div>${lr('шаг', '360° : n')}` :
    `<div class="k">Угол α</div><div class="v ${m.hitA || m.hitB ? 'ok' : ''}">${deg(m.ang)}</div>${lr('OA = OA′', fmt(dist(m.O, m.A), 2))}${lr('цели 1 · 2', `${mk(h.a)} · ${mk(h.b)}`, h.a && h.b)}`;
  else if (m.kind === 'shift') el.innerHTML = m.mode === 'vec' ? `<div class="k">Вектор a</div><div class="v ${m.hitA ? 'ok' : ''}">${ptp(m.a)}</div>${lr('|a|', fmt(Math.hypot(...m.a), 2))}${lr('цели 1 · 2', `${mk(h.a)} · ${mk(h.b)}`, h.a && h.b)}` :
    `<div class="k">Сдвиг 2·(l₂ − l₁)</div><div class="v ${m.hitB ? 'ok' : ''}">${num(m.s)}</div>${lr('l₁ · l₂', `${num(m.p1)} · ${num(m.p2)}`)}${lr('цели 1 · 2', `${mk(h.a)} · ${mk(h.b)}`, h.a && h.b)}`;
  else el.innerHTML = m.mode === 'tile' ? `<div class="k">Площадь (u, v)</div><div class="v ${m.okT ? 'ok' : ''}">${Math.abs(m.D)} из 6</div>${lr('узор', m.okT ? 'встык' : m.D === 0 ? 'полоса' : 'нет', m.okT)}${lr('части 1 · 2', `${mk(h.a)} · ${mk(h.b)}`, h.a && h.b)}` :
    `<div class="k">Коэффициент k</div><div class="v ${m.okH ? 'ok' : ''}">${num(m.k)}</div>${lr('площадь', `6 → ${num(6 * m.k * m.k)}`, Math.abs(m.k) === 2)}${lr('части 1 · 2', `${mk(h.a)} · ${mk(h.b)}`, h.a && h.b)}`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson], h = HITS();
  let newHit = false;
  if (m.hitA && !h.a) { h.a = true; newHit = true; }
  if (m.hitB && !h.b) { h.b = true; newHit = true; }
  if (!S.done[Ls.id] && Ls.check(m, h)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Движения плоскости освоены!'), 700);
  } else if (newHit && !S.done[Ls.id]) setTimeout(() => toast('Совпало! Осталась вторая часть задания.'), 300);
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  shift: '<path d="M8 25V8L18 12L10 16" fill="none" stroke="#72d4e8" stroke-width="1.6"/><path d="M40 21V4L50 8L42 12" fill="none" stroke="#ffb547" stroke-width="1.6"/><path d="M10 26L38 22" stroke="#ffb547" stroke-width="1.2"/>',
  tile: '<path d="M2 26H12L14 22L18 26H26L22 18L26 12H18L14 8L12 12H4L8 18Z" fill="rgba(114,212,232,.4)" stroke="#72d4e8" stroke-width="1"/><path d="M26 26H36L38 22L42 26H50L46 18L50 12H42L38 8L36 12H28L32 18Z" fill="rgba(183,156,255,.4)" stroke="#b79cff" stroke-width="1"/><path d="M50 26H60L62 22L64 24" fill="none" stroke="#ffb547" stroke-width="1"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));

}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.mode = Ls.mode;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id, h = HITS();
  let now = '';
  if (id === 'axis') now = S.mode === 'ex'
    ? `Открыты примеры: буквы А, Н, Я, лист, квадратный логотип с плюсом, окружность; ученик открыл оси у ${Object.values(S.ex).filter(Boolean).length} фигур из 6.`
    : `Координатная плоскость −7…7. Флажок F с вершинами ${FIG1.map(ptp).join(', ')} (A — первая, B — четвёртая). Цель — контур с вершинами ${TG1.map(ptp).join(', ')}. Ось ученика проходит через P${ptp(m.P)} и Q${ptp(m.Q)}; отражение A′${ptp(m.A1)}, B′${ptp(m.B1)}; совпало вершин ${m.n} из 6.`;
  if (id === 'rot') now = S.mode === 'ex'
    ? 'Открыты примеры поворотной симметрии: снежинка (порядок 6), пропеллер (3), параллелограмм (2, центральная симметрия), вертушка (4).'
    : `Флажок F с вершинами ${FIG2.map(ptp).join(', ')}. Цель 1 (поворот): ${TA2.map(ptp).join(', ')}. Цель 2 (центральная симметрия): ${TB2.map(ptp).join(', ')}. Ученик выбрал центр O${ptp(m.O)} и угол α = ${deg(m.ang)}; образ A′${ptp(m.A1)}. Цель 1 ${h.a ? 'уже достигнута' : 'ещё не достигнута'}, цель 2 ${h.b ? 'уже достигнута' : 'ещё не достигнута'}.`;
  if (id === 'shift') now = (S.mode === 'vec'
    ? `Режим «Перенос». Флажок F с вершиной A${ptp(FIG3[0])}, цель 1 с вершиной A в ${ptp(TA3[0])}. Вектор ученика a${ptp(m.a)}, образ A′${ptp(m.img[0])}.`
    : `Режим «Две симметрии»: оси l₁: x = ${num(m.p1)}, l₂: x = ${num(m.p2)}; итоговый сдвиг ${num(m.s)} по x. Цель 2 — флажок, сдвинутый на (8; 0).`) + ` Цель 1 ${h.a ? 'достигнута' : 'не достигнута'}, цель 2 ${h.b ? 'достигнута' : 'не достигнута'}.`;
  if (id === 'tile') now = (S.mode === 'tile'
    ? `Режим «Паркет». Плитка — параллелограмм на сторонах (3; 0) и (1; 2) с ${m.edge === 'wave' ? 'фигурными' : 'прямыми'} краями, площадь 6. Векторы ученика u${ptp(m.u)}, v${ptp(m.v)}, площадь параллелограмма на них ${Math.abs(m.D)}; итог: ${tileStatus(m)}.`
    : `Режим «Гомотетия». Плитка площади 6 у точки ${ptp(A4H)}; центр O${ptp(m.Hc)}, k = ${num(m.k)}; образ ${m.fits ? 'помещается' : 'не помещается'} на поле и ${m.ov ? 'задевает' : 'не задевает'} исходную плитку.`) + ` Паркет ${h.a ? 'построен' : 'не построен'}, гомотетия ${h.b ? 'выполнена' : 'не выполнена'}.`;
  return [
    `Раздел: математика, 9 класс, геометрия, тема «Движения: симметрия, поворот, перенос». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (положение оси, центр и угол поворота, координаты вектора или осей, векторы паркета, центр гомотетии): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    axis: 'Почему в зеркале правое становится левым?', rot: 'Чем центральная симметрия отличается от осевой?',
    shift: 'Почему две симметрии дают перенос?', tile: 'Почему гомотетия — не движение?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
