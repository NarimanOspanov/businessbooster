<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 9 класс: щелочные металлы, кальций и магний, жёсткость воды, амфотерность алюминия, ионы железа, сплавы.">
<title>Металлы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-drag^="tap:"]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 16px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.labrow{display:grid;grid-template-columns:28px 1fr;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px}
.labrow .lt{font:600 15px/1 var(--font-mono)}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M16 8h8M17 8v9l-8 13q-1.5 3 2 3h18q3.5 0 2-3l-8-13V8" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M12.5 25h15l2.3 4q.8 1.6-1 1.6H11.2q-1.8 0-1-1.6z" fill="var(--arm)"/><circle cx="20" cy="21" r="1.4" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Опыты · Химия · Металлы</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Металлы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/5</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол. Банки и склянки можно перетаскивать к посуде или нажимать на них."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const r2 = x => Math.round(x * 100) / 100;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-metals';
const GLASS = 'rgba(200,225,255,.08)', GLASS_S = '#9fb3d1';

// ---------- lesson 1: alkali metals ----------
const ALK = {
  Li: { name: 'Литий', gen: 'лития', M: 7, hyd: 'LiOH', hydn: 'гидроксид лития', dur: 7000, shell: '2, 1', how: 'плавает и спокойно шипит', flame: 'малиновый', piece: '#cfd5de' },
  Na: { name: 'Натрий', gen: 'натрия', M: 23, hyd: 'NaOH', hydn: 'гидроксид натрия', dur: 4000, shell: '2, 8, 1', how: 'плавится в шарик и бегает по воде', flame: 'жёлтый', piece: '#e8ecf4' },
  K: { name: 'Калий', gen: 'калия', M: 39, hyd: 'KOH', hydn: 'гидроксид калия', dur: 2500, shell: '2, 8, 8, 1', how: 'носится по воде и вспыхивает фиолетовым пламенем', flame: 'фиолетовый', piece: '#d8dce6' },
};
const ALKS = ['Li', 'Na', 'K'];
const JX1 = { Li: 56, Na: 126, K: 196 };

// ---------- lesson 2: water hardness, 1 л воды ----------
// Ca(HCO3)2 2 ммоль (временная), CaCl2 1 ммоль + MgSO4 1 ммоль (постоянная). Карбонат-ионы: от соды + от разложения HCO3⁻ при кипячении (2HCO3⁻ → CO3²⁻ + CO2 + H2O).
const HW = { temp: 2, ca: 3, mg: 1, total: 4, step: 0.5, max: 4, boil: 4 };

// ---------- lesson 3: aluminium amphoterism, 1 ммоль AlCl3 в пробирке ----------
const AL = { n: 1, step: 0.5, max: 6 };
const TX3 = [215, 305];

// ---------- lesson 4: iron ions ----------
const ION = {
  fe2: { name: 'Fe²⁺', salt: 'FeSO₄', sol: '#bfe0b0', solOp: .42, pr: '#9fb486', solTxt: 'бледно-зелёный раствор', prTxt: 'серо-зелёный осадок, сверху понемногу буреет' },
  fe3: { name: 'Fe³⁺', salt: 'FeCl₃', sol: '#e0a84a', solOp: .5, pr: '#8b4513', solTxt: 'жёлто-бурый раствор', prTxt: 'бурый осадок' },
  al: { name: 'Al³⁺', salt: 'AlCl₃', sol: '#dfe8f2', solOp: .16, pr: '#f2f5f8', solTxt: 'бесцветный раствор', prTxt: 'белый студенистый осадок' },
};
const IONS = ['fe2', 'fe3', 'al'];
const TX4 = [236, 306, 376], TL4 = ['А', 'Б', 'В'];
const OXT = 30000; // мс, за которые Fe(OH)2 сверху заметно буреет

// ---------- lesson 5: alloys ----------
const ADD = {
  C: { name: 'Углерод (графит)', s: 'C', step: 0.5, max: 5, col: '#3c414c' },
  Cr: { name: 'Хром', s: 'Cr', step: 2, max: 20, col: '#b8c4d6' },
  Ni: { name: 'Никель', s: 'Ni', step: 2, max: 12, col: '#d8d2bc' },
  Zn: { name: 'Цинк', s: 'Zn', step: 5, max: 45, col: '#aab6c4' },
  Sn: { name: 'Олово', s: 'Sn', step: 2, max: 20, col: '#e2e6ec' },
  Cu: { name: 'Медь', s: 'Cu', step: 1, max: 6, col: '#d9824a' },
  Mg: { name: 'Магний', s: 'Mg', step: 0.5, max: 3, col: '#cfd6de' },
};
const BASES = {
  Fe: { name: 'Железо', adds: ['C', 'Cr', 'Ni'], melt: '#ffd27a' },
  Cu: { name: 'Медь', adds: ['Zn', 'Sn'], melt: '#ff9d5c' },
  Al: { name: 'Алюминий', adds: ['Cu', 'Mg'], melt: '#ffe6bd' },
};
const ALLOYS = {

function alloyClass(base, a) {
  if (base === 'Fe') {
    if (a.C >= 2.14) return 'castiron';
    if (a.Cr >= 12) return 'stainless';
    if (a.C < 0.05) return 'iron';
    return a.Cr > 0 || a.Ni > 0 ? 'lsteel' : 'steel';
  }
  if (base === 'Cu') return a.Sn >= 3 ? 'bronze' : a.Zn >= 5 ? 'brass' : 'copper';
  return a.Cu >= 2 && a.Mg >= 0.5 ? 'dural' : a.Cu + a.Mg > 0 ? 'alalloy' : 'al';
}

  S.order = o; S.dose = [0, 0, 0]; S.t0 = [0, 0, 0]; S.labels = [null, null, null];

function alTube(tb) {
  const b = r2(tb.naoh - tb.hcl);
  const precip = b <= 0 ? 0 : b <= 3 ? b / 3 : b < 4 ? 4 - b : 0;
  const alum = b <= 3 ? 0 : Math.min(1, b - 3), free = b <= 0 ? 1 : b <= 3 ? 1 - b / 3 : 0;
  return { naoh: tb.naoh, hcl: tb.hcl, peak: tb.peak, b, precip, alum, free, exA: Math.max(0, -b), exB: Math.max(0, b - 4) };
}
function feTube(i, now) {
  const ion = S.order[i], dose = S.dose[i];
  const dissolved = ion === 'al' && dose >= 2;
  const ox = ion === 'fe2' && dose > 0 ? clamp((now - S.t0[i]) / OXT, 0, 1) : 0;
  let obs = ION[ion].solTxt;
  if (dose > 0) obs = dissolved ? 'белый осадок выпал и растворился в лишней щёлочи' : ION[ion].prTxt;
  return { ion, dose, label: S.labels[i], dissolved, ox, obs, precip: dose > 0 && !dissolved };
}

function model() {
  const id = LID();
  if (id === 'alkali') {
    const k = S.rx ? S.rx.k : S.last, n = k ? S.mass / ALK[k].M : 0;
    return { kind: id, k, nMol: n, nH2: n / 2, V: n / 2 * 22.4 * 1000, n: Object.keys(S.tested).length, busy: !!S.rx };
  }
  if (id === 'hard') {
    const H = r2(Math.max(0, HW.total - S.soda - HW.temp * S.f));
    const Mg = Math.min(HW.mg, H), Ca = r2(H - Mg), ex = Math.max(0, r2(S.soda + HW.temp * S.f - HW.total));
    return { kind: id, H, Ca, Mg, ex, soda: S.soda, f: S.f, removed: HW.total - H };
  }
  if (id === 'al') return { kind: id, t: S.tubes.map(alTube), sel: S.sel };
  if (id === 'fe') { const now = performance.now(); return { kind: id, t: [0, 1, 2].map(i => feTube(i, now)) }; }
  const sum = Object.values(S.add).reduce((a, b) => a + b, 0);
  const cls = alloyClass(S.base, S.add);
  return { kind: id, base: S.base, add: S.add, main: r2(100 - sum), cls, al: ALLOYS[cls], ndone: ORDERS.filter(o => S.cast[o.id]).length };
}

function drawScene(t) {

  if (drag && drag.moved && !drag.src.startsWith('tap:')) h += ghost(drag);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);

    else if (b) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }

}

let VB = { x: 0, y: 0, w: 520, h: 405 };

}
const hit = (p, b) => p.x >= b[0] && p.x <= b[0] + b[2] && p.y >= b[1] && p.y <= b[1] + b[3];
function defaultTarget() { const id = LID(); return id === 'alkali' ? 'dish' : id === 'hard' ? 'beaker' : id === 'alloy' ? 'cru' : 'tube' + S.sel; }

function apply(src, tgt) {
  const id = LID(), now = performance.now();
  if (id === 'alkali') {
    if (S.rx) { toast('Дождитесь, пока кусочек прореагирует.'); return false; }
    S.rx = { k: src, t0: now, dur: reduce ? 0 : ALK[src].dur, x: 365 };
    update(); return true;
  }
  if (id === 'hard') {
    if (src === 'soap') { S.soap = true; S.fx.push({ t: now, x: 260, y0: 140, y1: 190, c: '#e9d27a' }); update(); return true; }
    if (S.soda + HW.step > HW.max + 1e-9) { toast('Хватит соды: больше 4 ммоль в этот опыт не сыплем.'); return false; }
    S.soda = r2(S.soda + HW.step); S.fx.push({ t: now, x: 260, y0: 140, y1: 190, c: '#f1f4f8', sq: true }); update(); return true;
  }
  if (id === 'al') {
    const i = +tgt.slice(4), tb = S.tubes[i];
    if (tb[src] + AL.step > AL.max + 1e-9) { toast('Пробирка почти полная. Нажмите «Заново».'); return false; }
    tb[src] = r2(tb[src] + AL.step);
    if (Math.abs(tb.naoh - tb.hcl - 3) < 1e-9) tb.peak = true;
    S.sel = i; S.fx.push({ t: now, x: TX3[i], y0: 150, y1: 280, c: src === 'naoh' ? '#cfe4f5' : '#e8eef5' });
    update(); return true;

    if (S.dose[i] === 0) S.t0[i] = now;
    S.dose[i]++; S.sel = i; S.fx.push({ t: now, x: TX4[i], y0: 150, y1: 250, c: '#cfe4f5' });
    update(); return true;
  }

  S.add[src] = r2(S.add[src] + a.step); S.ingot = null; S.fx.push({ t: now, x: 270, y0: 150, y1: 262, c: a.col, sq: true });
  update(); return true;

  if (k.startsWith('tube')) { S.sel = +k.slice(4); update(); return; }
  if (k.startsWith('lab')) { const i = +k.slice(3), cyc = [null].concat(IONS), j = cyc.indexOf(S.labels[i]); setLabel(i, cyc[(j + 1) % cyc.length]); }
}
function setLabel(i, v) { S.labels[i] = v; update(); }
function castIngot() {
  const m = model(); S.ingot = m.cls;

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e), k = el.dataset.drag;
  drag = { src: k.startsWith('src:') ? k.slice(4) : k, x: e.clientX, y: e.clientY, gx: p.x, gy: p.y, moved: false, over: null, dw: 0, count: 0 };
  if (!k.startsWith('tap:')) scene.classList.add('grabbing');
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (!drag.moved || drag.src.startsWith('tap:')) return;
  const p = toSvg(e); drag.gx = p.x; drag.gy = p.y;
  const tg = targets().find(x => hit(p, x.b)), ov = tg ? tg.id : null;
  if (ov !== drag.over) { drag.over = ov; drag.dw = 0; }
  dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.src.startsWith('tap:')) { if (!d.moved) tapAction(d.src.slice(4)); return; }
  if (!d.moved) { apply(d.src, defaultTarget()); return; }
  if (d.over && d.count === 0) apply(d.src, d.over);
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

let last = performance.now(), lastDraw = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  const id = LID();
  if (drag && drag.moved && drag.over && L().repeat && !drag.src.startsWith('tap:')) {
    drag.dw += dt;
    if (drag.dw >= (drag.count ? 0.45 : 0.35)) { drag.dw = 0; if (apply(drag.src, drag.over)) drag.count++; else drag.over = null; }
  }
  if (id === 'alkali' && S.rx) {
    anim = true;
    if (t - S.rx.t0 >= S.rx.dur) {
      const k = S.rx.k; S.tested[k] = true; S.times[k] = ALK[k].dur / 1000; S.last = k; S.pink = Math.min(1, S.pink + 0.34); S.rx = null;
      toast(`${ALK[k].name}: ${ALK[k].how}. Вода покраснела — получилась щёлочь ${ALK[k].hyd}.`);
      update();
    }
  }
  if (id === 'hard' && S.heat) {
    anim = true;
    S.f = reduce ? 1 : Math.min(1, S.f + dt / HW.boil);
    if (S.f >= 1) { S.heat = false; toast('Вода прокипела: гидрокарбонаты разложились, на дне накипь CaCO₃.'); }
    update();
  }
  if (id === 'fe' && S.order.some((ion, i) => ion === 'fe2' && S.dose[i] > 0 && t - S.t0[i] < OXT + 100)) anim = true;
  if (S.fx.length || S.hl) anim = true;
  // slow ambient motion (furnace glow, drifting ions) at ~20 fps
  const ambient = !reduce && (id === 'alloy' || id === 'hard') && t - lastDraw > 50;
  if (dirty || anim || ambient) { drawScene(t); dirty = false; lastDraw = t; }
}

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const d = el.querySelector('#sDiag'); if (!d) return;
  if (id === 'alkali') {
    d.innerHTML = alkBars();
    set('#r1', m.k ? m.k : '—'); set('#r2', m.k ? fmt(m.nMol * 1000, 2) + ' ммоль' : '—'); set('#r3', m.k ? fmt(m.V, 1) + ' мл' : '—');
    set('#inMassO', fmt(S.mass, 2) + ' г'); val('#inMass', S.mass);
  }
  if (id === 'hard') {
    d.innerHTML = hardBar(m);
    set('#r1', fmt(m.H, 1) + ' ммоль/л'); set('#r2', fmt(m.soda, 1) + ' ммоль'); set('#r3', Math.round(m.f * 100) + ' %');
    set('#inSodaO', fmt(S.soda, 1)); val('#inSoda', S.soda);
  }
  if (id === 'al') {
    d.innerHTML = alPlot(m); const x = m.t[S.sel];
    set('#r1', fmt(x.naoh, 1) + ' ммоль'); set('#r2', fmt(x.hcl, 1) + ' ммоль'); set('#r3', fmt(x.precip, 2) + ' ммоль');
    el.querySelectorAll('#selChips button').forEach((b, i) => b.setAttribute('aria-pressed', i === S.sel));
  }
  if (id === 'fe') {
    d.innerHTML = m.t.map((x, i) => `<div class="labrow"><span class="lt" style="color:${i === S.sel ? 'var(--force)' : 'var(--fg)'}">${TL4[i]}</span><span>${x.obs}${x.dose ? ` <span class="note">(NaOH ×${x.dose})</span>` : ''}</span>
      <span></span><div class="chips" style="margin-top:0">${IONS.map(k => `<button data-l="${i}:${k}" aria-pressed="${x.label === k}">${ION[k].name}</button>`).join('')}</div></div>`).join('');
    d.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const [i, k] = b.dataset.l.split(':'); setLabel(+i, k); });
  }
  if (id === 'alloy') {
    d.innerHTML = compBar(m);
    set('#r1', m.al.name); set('#r2', m.al.dens); set('#r3', m.al.tm.replace('около ', '≈'));
    BASES[S.base].adds.forEach(k => { set('#in' + k + 'O', fmt(S.add[k], S.add[k] % 1 ? 1 : 0) + ' %'); val('#in' + k, S.add[k]); });
  }
}

    { id: 'dish', icon: ICON.dish, name: 'Кристаллизатор', spec: 'Широкая низкая чаша с водой. Все три металла легче воды, поэтому плавают.' },
    { id: 'water', icon: ICON.drop, name: 'Фенолфталеин', spec: 'Индикатор: в нейтральной воде бесцветный, в щёлочи — малиновый.' }];
  if (id === 'hard') return [
    { id: 'beaker', icon: ICON.beaker, name: 'Стакан с 1 л воды', spec: 'Природная вода: 2 ммоль Ca(HCO₃)₂, 1 ммоль CaCl₂ и 1 ммоль MgSO₄. Всего 4 ммоль ионов Ca²⁺ и Mg²⁺.' },

    { id: 'plate', icon: ICON.plate, name: 'Электроплитка', spec: 'Нажмите, чтобы кипятить. При кипячении разлагаются только гидрокарбонаты.' },
    { id: 'soda', icon: ICON.jar, name: 'Сода Na₂CO₃', spec: 'Кальцинированная сода. Одна ложка — 0,5 ммоль (53 мг). Её карбонат-ионы осаждают Ca²⁺ и Mg²⁺.' },
    { id: 'soap', icon: ICON.bottle, name: 'Мыльный раствор', spec: 'Проба на жёсткость: в мягкой воде много пены, в жёсткой — серые хлопья.' }];

    { id: 'naoh3', icon: ICON.bottle, name: 'Склянка с NaOH', spec: 'Раствор щёлочи с пипеткой. Одна порция — 0,5 ммоль NaOH.' },
    { id: 'hcl3', icon: ICON.bottle, name: 'Склянка с HCl', spec: 'Соляная кислота с пипеткой. Одна порция — 0,5 ммоль HCl.' },
    { id: 'rack', icon: ICON.rack, name: 'Штатив для пробирок', spec: 'Держит пробирки вертикально. Звёздочка над пробиркой — в ней уже был наибольший осадок.' }];
  if (id === 'fe') return [
    { id: 'tubes4', icon: ICON.tube, name: 'Пробирки А, Б, В', spec: 'Растворы солей Fe²⁺, Fe³⁺ и Al³⁺ в случайном порядке. Цвет раствора — тоже подсказка.' },
    { id: 'naoh4', icon: ICON.bottle, name: 'NaOH с пипеткой', spec: 'Реактив на ионы металлов: многие гидроксиды выпадают в осадок своего цвета.' },
    { id: 'tags', icon: ICON.tag, name: 'Таблички', spec: 'Нажимайте, чтобы сменить подпись: ? → Fe²⁺ → Fe³⁺ → Al³⁺.' }];
  return [
    { id: 'furnace', icon: ICON.furnace, name: 'Плавильная печь', spec: 'Держит металл расплавленным. Железу нужно больше 1500 °C, алюминию — около 700 °C.' },
    { id: 'crucible', icon: ICON.crucible, name: 'Тигель', spec: 'Огнеупорный сосуд с расплавом основного металла. Сюда бросают добавки.' },
    { id: 'jars5', icon: ICON.jar, name: 'Добавки', spec: 'Для железа — углерод, хром, никель; для меди — цинк и олово; для алюминия — медь и магний. Одно добавление — шаг, подписанный на банке.' },

function calcHTML(m) {
  const id = LID();
  if (id === 'alkali') {
    const k = m.k || 'Na', A = ALK[k], n = S.mass / A.M;
    let h = `<h2>Сколько выделится водорода</h2><div class="formula">2${k} + 2H₂O → 2${A.hyd} + H₂↑</div><p class="note">По уравнению водорода в 2 раза меньше по молям, чем металла. 1 моль газа при н. у. — 22,4 л.</p><h3>${A.name}${m.k ? '' : ' (для примера)'}, кусочек ${fmt(S.mass, 2)} г</h3><div class="steps">` +
      step(`n(${k}) = m / M`, `${fmt(S.mass, 2)} / ${A.M} = ${fmt(n * 1000, 2)} ммоль`) +
      step('n(H₂) = n / 2', `${fmt(n * 500, 2)} ммоль`) +
      step('V(H₂) = n · 22,4', `${fmt(n * 500, 2)} × 22,4 = ${fmt(n * 0.5 * 22400, 1)} мл`, 'sum') + `</div>`;
    h += `<h3>Почему активность растёт</h3><div class="steps">` + ALKS.map(x => step(`${ALK[x].name}: электроны по слоям`, ALK[x].shell)).join('') + `</div>
      <p class="note" style="margin-top:10px">Чем больше слоёв, тем дальше внешний электрон от ядра и тем легче атом его отдаёт. Поэтому K активнее Na, а Na активнее Li. Ионы окрашивают пламя: Li — ${ALK.Li.flame}, Na — ${ALK.Na.flame}, K — ${ALK.K.flame}.</p>`;
    return h;
  }
  if (id === 'hard') {
    return `<h2>Считаем жёсткость</h2><div class="formula">Ж = (n(Ca²⁺) + n(Mg²⁺)) / V</div><p class="note">В ммоль на литр. В воде было 3 ммоль Ca²⁺ и 1 ммоль Mg²⁺, из них 2 ммоль Ca²⁺ — в виде гидрокарбоната.</p><h3>Сейчас</h3><div class="steps">` +
      step('было', '4 ммоль/л') +
      step('ушло при кипячении', `2 × ${fmt(m.f, 2)} = ${fmt(2 * m.f, 1)} ммоль`) +
      step('связала сода', `до ${fmt(m.soda, 1)} ммоль`) +
      step('Ж', `4 − ${fmt(2 * m.f, 1)} − ${fmt(m.soda, 1)} → ${fmt(m.H, 1)} ммоль/л`, 'sum') +
      step('масса соды', `${fmt(m.soda, 1)} ммоль × 106 мг/ммоль = ${fmt(m.soda * 106, 0)} мг`) +
      (m.ex > 0 ? step('лишняя сода в воде', fmt(m.ex, 1) + ' ммоль') : '') + `</div>
      <h3>Реакции</h3><div class="steps">` + step('кипячение', 'Ca(HCO₃)₂ → CaCO₃↓ + CO₂↑ + H₂O') + step('сода и CaCl₂', 'CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2NaCl') + step('сода и MgSO₄', 'MgSO₄ + Na₂CO₃ → MgCO₃↓ + Na₂SO₄') + `</div>
      <h3>План с минимумом соды</h3><div class="steps">` + step('1. прокипятить', 'Ж: 4 → 2 ммоль/л') + step('2. сода', '2 ммоль = 212 мг', 'sum') + `</div>`;
  }
  if (id === 'al') {
    const x = m.t[S.sel];
    let h = `<h2>Пробирка ${S.sel + 1}</h2><div class="formula">Al³⁺ + 3OH⁻ → Al(OH)₃↓<br>Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻</div><div class="steps">` +
      step('n(AlCl₃)', '1 ммоль') + step('добавлено NaOH', fmt(x.naoh, 1) + ' ммоль') + step('добавлено HCl', fmt(x.hcl, 1) + ' ммоль') +
      step('щёлочи на алюминий', `${fmt(x.naoh, 1)} − ${fmt(x.hcl, 1)} = ${fmt(x.b, 1)} ммоль`);
    if (x.b <= 0) h += step('осадка нет', x.hcl > 0 ? 'кислота держит алюминий в виде Al³⁺' : 'щёлочи ещё нет', 'sum');
    else if (x.b <= 3) h += step('n(Al(OH)₃) = b / 3', `${fmt(x.b, 1)} / 3 = ${fmt(x.precip, 2)} ммоль`) + step('m(осадка)', `${fmt(x.precip, 2)} × 78 = ${fmt(x.precip * 78, 0)} мг`, 'sum');
    else if (x.b < 4) h += step('лишняя щёлочь растворяет', `${fmt(x.b - 3, 1)} ммоль Al(OH)₃`) + step('осталось осадка', `${fmt(x.precip, 2)} ммоль = ${fmt(x.precip * 78, 0)} мг`, 'sum');
    else h += step('весь алюминий', 'в растворе как Na[Al(OH)₄]', 'sum');
    h += `</div><h3>Ключевые числа</h3><div class="steps">` + step('наибольший осадок', 'NaOH : AlCl₃ = 3 : 1 → 3 ммоль') + step('осадок исчез в щёлочи', 'ещё 1 ммоль NaOH → всего 4') + step('растворить кислотой', 'Al(OH)₃ + 3HCl → 3 ммоль HCl') + `</div>`;
    return h;
  }
  if (id === 'fe') {
    let h = `<h2>Как рассуждать</h2><div class="steps">` + step('1. цвет раствора', 'Fe²⁺ — бледно-зелёный, Fe³⁺ — жёлто-бурый, Al³⁺ — бесцветный') +
      step('2. Fe²⁺ + 2OH⁻', 'Fe(OH)₂↓ серо-зелёный') + step('на воздухе', '4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃') +
      step('3. Fe³⁺ + 3OH⁻', 'Fe(OH)₃↓ бурый') + step('4. Al³⁺ + 3OH⁻', 'Al(OH)₃↓ белый, в избытке NaOH растворяется') + `</div><h3>Ваши наблюдения</h3><div class="steps">`;
    h += m.t.map((x, i) => step(`Пробирка ${TL4[i]}`, x.obs + (x.label ? ` → ${ION[x.label].name}` : ''))).join('') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Если осадок белый, капните ещё щёлочи: растворился — это амфотерный Al(OH)₃.</p>`;
  }
  const B = BASES[S.base];
  let h = `<h2>${m.al.name}</h2><div class="formula">m(элемента) = m(слитка) · ω</div><h3>Слиток 1 кг</h3><div class="steps">` +
    step(B.name, `1000 × ${fmt(m.main / 100, 3)} = ${fmt(m.main * 10, 0)} г`) +
    B.adds.map(k => step(ADD[k].name, `1000 × ${fmt(S.add[k] / 100, 3)} = ${fmt(S.add[k] * 10, 0)} г`)).join('') + `</div><h3>Почему это ${m.al.name.toLowerCase()}</h3><div class="steps">`;
  if (S.base === 'Fe') h += step('углерод', `${fmt(S.add.C, 1)} % ${S.add.C >= 2.14 ? '≥' : '<'} 2,14 % → ${S.add.C >= 2.14 ? 'чугун' : S.add.C < 0.05 ? 'почти чистое железо' : 'сталь'}`) + (S.add.C < 2.14 ? step('хром', `${fmt(S.add.Cr, 0)} % ${S.add.Cr >= 12 ? '≥' : '<'} 12 % → ${S.add.Cr >= 12 ? 'не ржавеет' : 'ржавеет'}`) : '');
  if (S.base === 'Cu') h += step('олово', `${fmt(S.add.Sn, 0)} % ${S.add.Sn >= 3 ? '→ бронза' : '— мало для бронзы'}`) + step('цинк', `${fmt(S.add.Zn, 0)} % ${S.add.Zn >= 5 && S.add.Sn < 3 ? '→ латунь' : ''}`);
  if (S.base === 'Al') h += step('медь', `${fmt(S.add.Cu, 0)} % ${S.add.Cu >= 2 ? '(нужно 2–5 %) ✓' : '(нужно 2–5 %)'}`) + step('магний', `${fmt(S.add.Mg, 1)} % ${S.add.Mg >= 0.5 ? '(нужно 0,5–2 %) ✓' : '(нужно 0,5–2 %)'}`);
  h += step('свойства', m.al.prop, 'sum') + step('где применяют', m.al.use) + `</div>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  if (id === 'alkali') {
    el.innerHTML = `<div class="k">Реакция с водой</div><div class="v">${m.k ? ALK[m.k].name : '—'}</div><div class="swatch" style="background:${S.pink > 0 || S.rx ? '#d0478f' : '#cfe6f5'}"></div>
      <div class="lr"><span>V(H₂)</span><span>${m.k ? fmt(m.V, 1) + ' мл' : '—'}</span></div><div class="lr"><span>проверено</span><span>${m.n}/3</span></div>`;
  } else if (id === 'hard') {
    el.innerHTML = `<div class="k">Жёсткость</div><div class="v ${m.H < 1e-9 ? 'ok' : ''}">${fmt(m.H, 1)} ммоль/л</div>
      <div class="gauge"><b style="width:${(m.H / HW.total * 100).toFixed(1)}%"></b><i style="left:0%"></i></div>
      <div class="lr"><span>сода</span><span>${fmt(m.soda, 1)} ммоль</span></div><div class="lr"><span>кипячение</span><span>${Math.round(m.f * 100)} %</span></div>`;
  } else if (id === 'al') {
    const x = m.t[S.sel];
    el.innerHTML = `<div class="k">Пробирка ${S.sel + 1}</div><div class="v ${x.peak ? 'ok' : ''}">Al(OH)₃ ${fmt(x.precip, 2)}</div>
      <div class="gauge"><b style="width:${(x.precip * 100).toFixed(1)}%"></b><i style="left:100%"></i></div>
      <div class="lr"><span>NaOH</span><span>${fmt(x.naoh, 1)} ммоль</span></div><div class="lr"><span>HCl</span><span>${fmt(x.hcl, 1)} ммоль</span></div>`;
  } else if (id === 'fe') {
    el.innerHTML = `<div class="k">Распознавание</div><div class="v">подписано ${m.t.filter(x => x.label).length}/3</div>
      <div class="lr"><span>пробы NaOH</span><span>${m.t.filter(x => x.dose > 0).length}/3</span></div><div class="lr"><span>выбрана</span><span>${TL4[S.sel]}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">В тигле</div><div class="v">${m.al.name}</div>${compBar(m).replace('class="diag"', '')}<div class="lr"><span>заказы</span><span>${m.ndone}/${ORDERS.length}</span></div>`;
  }
}

function renderPanes(m) {
  const Lx = L(), done = !!S.done[Lx.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Lx.title}</h2>` +
      Lx.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Lx.why}</div>` +
      `<div class="safe"><b>Безопасность</b>${Lx.safe}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Lx.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Lx.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Оборудование</h2><p class="note">Что стоит на столе. Нажмите на предмет, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

let lastSel = -1;
function update() {
  const m = model(), Lx = L();
  if (!S.done[Lx.id] && Lx.check(m)) {
    S.done[Lx.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы настоящий металлург!');
  }
  if ((Lx.id === 'al' || Lx.id === 'fe' || Lx.id === 'hard') && lastSel !== S.sel + (S.heat ? 10 : 0)) { lastSel = S.sel + (S.heat ? 10 : 0); renderTools(); }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Lx.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; resetState(); drag = null; lastSel = -1;
  save();
  const Lx = L();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Lx.task;
  $('#hint').textContent = Lx.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// ---------- AI tutor ----------
window.LUCH_CONTEXT = () => {
  const m = model(), Lx = L(), id = Lx.id;
  let now = '';
  if (id === 'alkali') now = `Кристаллизатор с водой и фенолфталеином. Масса кусочка ${fmt(S.mass, 2)} г. Брошены в воду: ${ALKS.filter(k => S.tested[k]).map(k => ALK[k].name).join(', ') || 'пока ничего'}. ${S.rx ? `Сейчас реагирует ${ALK[S.rx.k].name}.` : ''} ${m.k ? `Для ${ALK[m.k].gen}: n = ${fmt(m.nMol * 1000, 2)} ммоль, выделится ${fmt(m.V, 1)} мл H₂ (н. у.).` : ''} В модели Li реагирует ~7 с, Na ~4 с, K ~2,5 с и вспыхивает фиолетовым.`;
  if (id === 'hard') now = `1 л воды: исходно Ca(HCO₃)₂ 2 ммоль, CaCl₂ 1 ммоль, MgSO₄ 1 ммоль (жёсткость 4 ммоль/л). Прокипячено на ${Math.round(m.f * 100)} %${S.heat ? ', плитка включена' : ''}. Добавлено соды ${fmt(m.soda, 1)} ммоль (${fmt(m.soda * 106, 0)} мг). Сейчас жёсткость ${fmt(m.H, 1)} ммоль/л (Ca²⁺ ${fmt(m.Ca, 1)}, Mg²⁺ ${fmt(m.Mg, 1)}). ${S.soap ? 'Мыльная проба добавлена.' : ''} Ограничение задания: не больше 2 ммоль соды.`;
  if (id === 'al') now = m.t.map((x, i) => `Пробирка ${i + 1}: 1 ммоль AlCl₃, добавлено NaOH ${fmt(x.naoh, 1)} ммоль и HCl ${fmt(x.hcl, 1)} ммоль; осадок Al(OH)₃ ${fmt(x.precip, 2)} ммоль; наибольший осадок ${x.peak ? 'уже был' : 'ещё не получали'}.`).join(' ') + ` Выбрана пробирка ${S.sel + 1}. Порция реактива 0,5 ммоль.`;
  if (id === 'fe') now = m.t.map((x, i) => `Пробирка ${TL4[i]}: наблюдение — ${x.obs}; щёлочи добавлено ${x.dose} порц.; ученик подписал: ${x.label ? ION[x.label].name : 'не подписано'}.`).join(' ') + ' Это задание на распознавание: не называй, в какой пробирке какой ион, и не говори, верны ли подписи. Помогай наводящими вопросами о цвете растворов и осадков.';
  if (id === 'alloy') now = `Основа ${BASES[S.base].name} ${fmt(m.main, 1)} %, добавки: ${BASES[S.base].adds.map(k => `${ADD[k].s} ${fmt(S.add[k], 1)} %`).join(', ')}. По составу это: ${m.al.name}. Последний слиток: ${S.ingot ? ALLOYS[S.ingot].name : 'ещё не отливали'}. Заказы: ${ORDERS.map(o => `${o.what} — ${S.cast[o.id] ? 'выполнен' : 'не выполнен'}`).join('; ')}.`;
  return [
    `Раздел: химия, 9 класс, тема «Металлы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Lx.title}».`,
    `Объяснение урока: ${Lx.text.join(' ')}`,
    `Задание: ${Lx.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на столе: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Объясняй коротко, на уровне 9 класса, и наводи вопросами, а не давай готовый ответ.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Lx = L(), done = S.done[Lx.id];
  const q = {
    alkali: 'Почему калий активнее натрия?', hard: 'Почему кипячение убирает не всю жёсткость?', al: 'Что такое амфотерность простыми словами?',
    fe: 'Как отличить Fe²⁺ от Fe³⁺?', alloy: 'Чем сталь отличается от чугуна?',
  }[Lx.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, с чего начать задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
