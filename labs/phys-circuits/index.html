<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 8 класс: последовательное и параллельное соединение, работа и мощность тока, закон Джоуля — Ленца.">
<title>Электрические цепи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.scene [data-click]{cursor:pointer}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}
.hist{width:100%;border-collapse:collapse;font:500 12.5px/1.3 var(--font-mono);font-variant-numeric:tabular-nums}
.hist th{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.hist td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.hist tr.hi td{color:var(--ok)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M8 13h6M22 13h10V29H8V13" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><rect x="14" y="9.5" width="8" height="7" rx="1" fill="var(--surface)" stroke="var(--arm)" stroke-width="2"/><path d="M17 25.5v7M21 27v4" stroke="var(--force)" stroke-width="2.2"/><circle cx="32" cy="21" r="2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Цепи</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Электрическая цепь. Ключи, резисторы и приборы можно нажимать, ручки — перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = (x, n = 2) => { const r = Math.round(x * 10 ** n) / 10 ** n; return fmt(r, Math.abs(r - Math.round(r)) < 1e-9 ? 0 : Math.abs(r * 10 - Math.round(r * 10)) < 1e-9 ? 1 : n); };
const big = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'series', title: 'Последовательное соединение',
    text: ['При последовательном соединении проводники включают друг за другом, без разветвлений. У тока один путь, поэтому сила тока во всех проводниках одинакова: I = I₁ = I₂.',
           'Напряжение источника делится между проводниками: U = U₁ + U₂. Больше достаётся тому, у кого больше сопротивление, ведь U₁ = I·R₁. А общее сопротивление равно сумме: R = R₁ + R₂.',
           'Минус такой схемы: разорвался один проводник — ток пропал во всей цепи. Так раньше гасла вся ёлочная гирлянда из-за одной перегоревшей лампочки.'],
    why: 'Электронщики ставят резистор последовательно со светодиодом: на резисторе «гасится» лишнее напряжение, и светодиод не сгорает. Так собраны светодиодные ленты и подсветка витрин. Предохранитель в зарядке и автомат в щитке тоже стоят последовательно с приборами: при беде они разрывают всю цепь. Мастер по ремонту гирлянд и вывесок ищет поломку именно по этому правилу.',
    safe: 'Схемы собирают только с батарейками или школьным источником до 12 В. Напряжение в розетке, 220 В, опасно для жизни: никаких самодельных опытов с ней.',
    task: 'Источник даёт 12 В. Подберите резисторы так, чтобы ток в цепи был 1 А, а на R₁ было 8 В. Потом вольтметром измерьте U₁, U₂ и напряжение на всём участке.',
    hint: 'Нажмите на ключ, чтобы замкнуть цепь, и на резистор, чтобы сменить его сопротивление. Вольтметр подключается нажатием на пунктирный кружок «V». Какое общее сопротивление даст 1 А при 12 В?',
    stage: 'Нажмите на ключ, на резистор или на кружок «V».',
    U: 12, Rset: [2, 4, 6, 8, 10, 12], R1: 4, R2: 4, Ineed: 1, U1need: 8,
    check: m => m.closed && Math.abs(m.I - 1) < 1e-9 && Math.abs(m.U1 - 8) < 1e-9 && m.nMeas === 3 },
  { id: 'parallel', title: 'Параллельное соединение',
    text: ['При параллельном соединении проводники подключают к одной паре точек — узлов. В узле ток разветвляется, а потом снова собирается: I = I₁ + I₂ + I₃.',
           'Напряжение на всех ветвях одинаковое и равно напряжению источника. Поэтому ток в каждой ветви свой: I₁ = U / R₁. Где сопротивление меньше, там ток больше.',
           'Общее сопротивление находят так: 1/R = 1/R₁ + 1/R₂ + … Оно меньше самого маленького сопротивления ветвей. Включили ещё одну ветвь — общий ток вырос.'],
    why: 'Вся проводка в квартире параллельная: каждый прибор получает свои 220 В, и выключенная лампа не мешает работать холодильнику. Электромонтажник складывает токи всех приборов на линии и по сумме выбирает сечение провода и автомат. Поэтому мастер, который правильно считает токи, не получает звонков о сгоревшей проводке.',
    safe: 'Тройник и удлинитель — это тоже параллельное соединение. Чем больше приборов в них включено, тем больше общий ток в шнуре. Перегруженный шнур греется и может загореться.',

const LS_KEY = 'luch-phys-circuits';

const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };

const APP = [
  { id: 'kettle', name: 'Чайник', P: 2000 },
  { id: 'dryer', name: 'Фен', P: 1200 },

  { id: 'lamp', name: 'LED-лампа', P: 10 },
];
const APX = [60, 140, 220, 300, 380, 460];
const VM_NAMES = { r1: 'на R₁', r2: 'на R₂', all: 'на всём участке' };

function resetState() {
  const Ls = L();
  S.closed = false; S.R1 = 4; S.R2 = 4; S.vm = null; S.meas = {};
  S.R = [6, 12, 4]; S.on = [true, false, false];
  S.plug = {}; S.trip = false; S.t = 10;
  S.I = 1; S.Rs = 2; S.run = false; S.jt = 0; S.q0 = 0; S.lastQ = 0; S.runs = [];
  if (Ls.id === 'series') { S.R1 = Ls.R1; S.R2 = Ls.R2; }
  if (Ls.id === 'parallel') { S.R = Ls.R.slice(); S.on = Ls.on.slice(); }
  if (Ls.id === 'power') S.t = Ls.t0;
  if (Ls.id === 'joule') { S.I = Ls.I0; S.Rs = Ls.R0; }
  PH = {};
}

function model() {
  const Ls = L(), id = Ls.id;
  if (id === 'series') {
    const R = S.R1 + S.R2, I = S.closed ? Ls.U / R : 0, U1 = I * S.R1, U2 = I * S.R2;
    const vr = S.vm === 'r1' ? U1 : S.vm === 'r2' ? U2 : S.vm === 'all' ? U1 + U2 : null;
    return { kind: id, U: Ls.U, R1: S.R1, R2: S.R2, R, I, U1, U2, closed: S.closed, vm: S.vm, vr, nMeas: Object.keys(S.meas).length };
  }
  if (id === 'parallel') {
    const Ik = S.R.map((r, k) => S.on[k] ? Ls.U / r : 0), I = Ik.reduce((a, b) => a + b, 0), nOn = S.on.filter(Boolean).length;
    return { kind: id, U: Ls.U, R: S.R.slice(), on: S.on.slice(), Ik, I, nOn, Rt: I > 0 ? Ls.U / I : Infinity };
  }
  if (id === 'power') {
    const Pp = APP.reduce((a, p) => a + (S.plug[p.id] ? p.P : 0), 0), P = S.trip ? 0 : Pp;
    const I = P / Ls.U, E = P * S.t / 60 / 1000;
    return { kind: id, U: Ls.U, Pp, P, I, t: S.t, E, J: P * S.t * 60, cost: E * Ls.tariff, trip: S.trip, n: APP.filter(p => S.plug[p.id]).length };
  }
  const P = S.I * S.I * S.Rs, Q = S.q0 + (S.run ? P * S.jt : 0), T = Ls.T0 + Q / (Ls.c * Ls.m);
  return { kind: id, I: S.I, R: S.Rs, U: S.I * S.Rs, P, run: S.run, jt: S.jt, Q, T, lastQ: S.lastQ, runs: S.runs };
}

// ---------- drawing helpers ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const WIRE = '#9fb3d1';
const wire = pts => ol('M' + pts.map(p => p.join(' ')).join('L'), 'none', WIRE, 2.6);
const node = (x, y) => `<circle cx="${x}" cy="${y}" r="4.2" fill="${WIRE}" stroke="${INK}" stroke-width="1.5"/>`;
function resistor(cx, cy, R, key, hot) {
  return `<g data-click="${key}"><rect x="${cx - 38}" y="${cy - 22}" width="76" height="44" fill="transparent"/>` +
    ol(`M${cx - 30} ${cy - 11}h60v22h-60z`, hot ? '#3a2a1e' : '#232d42', hot ? '#ffb547' : '#e8ecf4', 2) +
    `<text x="${cx}" y="${cy + 4.5}" font-size="12" fill="#e8ecf4" text-anchor="middle" font-weight="500">${R} Ом</text></g>`;
}
function battery(x, cy, label) {
  return `<rect x="${x - 20}" y="${cy - 8}" width="40" height="16" fill="#0e1520"/>` +
    `<path d="M${x - 18} ${cy - 6}h36" stroke="${INK}" stroke-width="5.5"/><path d="M${x - 18} ${cy - 6}h36" stroke="#e8ecf4" stroke-width="2.6"/>` +
    `<path d="M${x - 9} ${cy + 6}h18" stroke="${INK}" stroke-width="9"/><path d="M${x - 9} ${cy + 6}h18" stroke="#e8ecf4" stroke-width="6"/>` +
    `<text x="${x + 24}" y="${cy - 9}" font-size="12" fill="#ff8a73">+</text><text x="${x + 16}" y="${cy + 15}" font-size="12" fill="#72d4e8">−</text>` +
    `<text x="${x - 24}" y="${cy + 4}" font-size="12" fill="#ffb547" text-anchor="end">${label}</text>`;
}
function dial(cx, cy, r, letter, val, key) {
  return `<g${key ? ` data-click="${key}"` : ''}>` + ol(`M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`, '#121a28', '#e8ecf4', 2) +
    `<text x="${cx}" y="${cy + r * 0.3}" font-size="${(r * 0.85).toFixed(1)}" fill="#e8ecf4" text-anchor="middle" font-weight="500">${letter}</text></g>` +
    (val ? `<text x="${cx}" y="${cy + r + 14}" font-size="11.5" fill="#86e0a8" text-anchor="middle">${val}</text>` : '');
}
function keySw(cx, cy, closed, key, vertical) {
  const a = closed ? 0 : -28, r = (a * Math.PI) / 180, x2 = cx - 17 + 34 * Math.cos(r), y2 = cy + 34 * Math.sin(r);
  return `<g data-click="${key}"><rect x="${cx - 26}" y="${cy - 30}" width="52" height="44" fill="transparent"/>` +
    `<rect x="${cx - 19}" y="${cy - 4}" width="38" height="8" fill="#0e1520"/>` +
    ol(`M${cx - 17} ${cy}L${x2.toFixed(1)} ${y2.toFixed(1)}`, 'none', closed ? '#86e0a8' : '#ffb547', 3) +
    `<circle cx="${cx - 17}" cy="${cy}" r="4" fill="#e8ecf4" stroke="${INK}" stroke-width="1.5"/><circle cx="${cx + 17}" cy="${cy}" r="4" fill="#e8ecf4" stroke="${INK}" stroke-width="1.5"/></g>`;
}
// current dots along a polyline; phase in SVG units
function dots(pts, phase, gap = 22) {
  let segs = [], tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
  let h = '';
  for (let s = ((phase % gap) + gap) % gap; s < tot; s += gap) {
    let d = s, i = 0; while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const k = segs[i] ? d / segs[i] : 0, x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k;
    h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#ffd08a"/>`;
  }
  return h;
}
let PH = {};
const ph = k => PH[k] || 0;

function backdrop(bench) {
  let h = `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
  if (bench !== undefined) h += `<rect x="-2000" y="${bench}" width="4520" height="1200" fill="#1a2232"/><rect x="-2000" y="${bench - 2}" width="4520" height="4" fill="#2c3954"/><rect x="-2000" y="${bench + 2}" width="4520" height="2" fill="${INK}" opacity=".6"/>`;
  else h += `<rect x="22" y="128" width="476" height="272" rx="14" fill="#101827" stroke="#26324a" stroke-width="1.5"/>`;
  return h;
}

// ---- lesson 1: series ----
const SER = { l: 70, r: 450, top: 250, bot: 370, by: 310, r1: 190, r2: 330, key: 190, am: 330 };
const VMPOS = { r1: [190, 192, 160, 220], r2: [330, 192, 300, 360], all: [260, 150, 160, 360] };
function seriesSVG(m) {
  const g = SER;
  let h = backdrop();
  h += wire([[g.l, g.by - 6], [g.l, g.top], [g.r, g.top], [g.r, g.bot], [g.key + 17, g.bot]]) + wire([[g.key - 17, g.bot], [g.l, g.bot], [g.l, g.by + 6]]);
  if (m.I > 0) h += dots([[g.l, g.by - 6], [g.l, g.top], [g.r, g.top], [g.r, g.bot], [g.l, g.bot], [g.l, g.by + 6]], ph('s'));
  h += battery(g.l, g.by, '12 В');
  h += resistor(g.r1, g.top, m.R1, 'r1', m.I > 0) + resistor(g.r2, g.top, m.R2, 'r2', m.I > 0);
  h += `<text x="${g.r1}" y="${g.top + 34}" font-size="11" fill="#8b96ad" text-anchor="middle">R₁</text><text x="${g.r2}" y="${g.top + 34}" font-size="11" fill="#8b96ad" text-anchor="middle">R₂</text>`;
  h += keySw(g.key, g.bot, m.closed, 'key');
  h += dial(g.am, g.bot, 16, 'A', '') + `<text x="${g.am + 24}" y="${g.bot - 8}" font-size="12" fill="#86e0a8">${fmt(m.I, 2)} А</text>`;
  // voltmeter sockets and the connected voltmeter
  for (const k of ['r1', 'r2', 'all']) {

    if (act) {
      h += `<path d="M${cx - 10} ${cy + 14}Q${x1} ${cy + 20} ${x1} ${g.top}" fill="none" stroke="#ff8a73" stroke-width="1.8"/><path d="M${cx + 10} ${cy + 14}Q${x2} ${cy + 20} ${x2} ${g.top}" fill="none" stroke="#72d4e8" stroke-width="1.8"/>`;
      h += node(x1, g.top) + node(x2, g.top);
      h += dial(cx, cy, 17, 'V', '', 'vm-' + k) + `<text x="${cx + 24}" y="${cy + 4}" font-size="12" fill="#86e0a8">${fmt(m.vr, 1)} В</text>`;
    } else {
      h += `<g data-click="vm-${k}"><circle cx="${cx}" cy="${cy}" r="20" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="13" fill="none" stroke="${S.meas[k] ? '#86e0a8' : '#8b96ad'}" stroke-width="1.4" stroke-dasharray="3 3"/><text x="${cx}" y="${cy + 4}" font-size="11" fill="${S.meas[k] ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">V</text></g>`;
    }
  }
  return h;
}

// ---- lesson 2: parallel ----
const PAR = { l: 60, by: 282, top: 180, ys: [180, 255, 330], bl: 170, br: 450, ret: 385, sw: 215, res: 300, am: 392, mam: 255 };
function parallelSVG(m) {
  const g = PAR;
  let h = backdrop();
  h += wire([[g.l, g.by - 6], [g.l, g.top], [g.bl, g.top]]) + wire([[g.bl, g.ys[0]], [g.bl, g.ys[2]]]) + wire([[g.br, g.ys[0]], [g.br, g.ret], [g.l, g.ret], [g.l, g.by + 6]]);
  g.ys.forEach(y => { h += wire([[g.bl, y], [g.sw - 17, y]]) + wire([[g.sw + 17, y], [g.br, y]]); });
  if (m.I > 0) {
    const I = m.Ik;
    h += dots([[g.l, g.by - 6], [g.l, g.top], [g.bl, g.top]], ph('m0'));
    if (I[1] + I[2] > 0) h += dots([[g.bl, g.ys[0]], [g.bl, g.ys[1]]], ph('l1'));
    if (I[2] > 0) h += dots([[g.bl, g.ys[1]], [g.bl, g.ys[2]]], ph('l2'));
    g.ys.forEach((y, k) => { if (I[k] > 0) h += dots([[g.bl, y], [g.br, y]], ph('b' + k)); });
    if (I[0] > 0) h += dots([[g.br, g.ys[0]], [g.br, g.ys[1]]], ph('r1'));
    if (I[0] + I[1] > 0) h += dots([[g.br, g.ys[1]], [g.br, g.ys[2]]], ph('r2'));
    h += dots([[g.br, g.ys[2]], [g.br, g.ret], [g.l, g.ret], [g.l, g.by + 6]], ph('m1'));
  }
  h += battery(g.l, g.by, '6 В');
  h += node(g.bl, g.ys[0]) + node(g.bl, g.ys[1]) + node(g.bl, g.ys[2]) + node(g.br, g.ys[0]) + node(g.br, g.ys[1]) + node(g.br, g.ys[2]);
  g.ys.forEach((y, k) => {
    h += keySw(g.sw, y, m.on[k], 'sw' + k) + resistor(g.res, y, m.R[k], 'pr' + k, m.Ik[k] > 0);
    h += dial(g.am, y, 12, 'A', '') + `<text x="${g.am + 17}" y="${y - 12}" font-size="10.5" fill="${m.Ik[k] > 0 ? '#86e0a8' : '#8b96ad'}">${nf(m.Ik[k])} А</text>`;
    h += `<text x="${g.bl - 8}" y="${y - 8}" font-size="10" fill="#8b96ad" text-anchor="end">${k + 1}</text>`;
  });
  h += dial(g.mam, g.ret, 15, 'A', '') + `<text x="${g.mam + 22}" y="${g.ret - 8}" font-size="12" fill="#86e0a8">I = ${nf(m.I)} А</text>`;
  return h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 }, dirty = true;

// ---------- pointer: taps and drags ----------
let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

});
function dragMove(e) {

    const v = 0.5 + Math.round(clamp((p.x - JL.trackX0) / (JL.trackX1 - JL.trackX0), 0, 1) * 7) * 0.5;
    if (v !== S.I) { S.I = v; S.q0 = 0; S.lastQ = 0; update(); }
  }

    let dlt = raw - (((drag.tRaw % 60) + 60) % 60); if (dlt > 30) dlt -= 60; if (dlt < -30) dlt += 60;

const nextOf = (arr, v) => arr[(arr.indexOf(v) + 1) % arr.length];
function tap(k) {

  else if (k === 'r1' || k === 'r2') setSeriesR(k, nextOf(Ls.Rset, S[k.toUpperCase()]));

  else if (/^pr\d$/.test(k)) S.R[+k[2]] = nextOf(Ls.Rset, S.R[+k[2]]);
  else if (/^app\d$/.test(k)) return togglePlug(+k[3]);

let last = performance.now(), lastUi = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const m = model(), id = m.kind;
  let anim = !!S.hl;
  if (!reduce) {
    const V = 26;
    if (id === 'series' && m.I > 0) { PH.s = ph('s') + dt * V * m.I * 1.2; anim = true; }
    if (id === 'parallel' && m.I > 0) {
      const I = m.Ik, adv = (k, i) => { PH[k] = ph(k) + dt * V * i * 0.8; };
      adv('m0', m.I); adv('m1', m.I); adv('l1', I[1] + I[2]); adv('l2', I[2]); adv('b0', I[0]); adv('b1', I[1]); adv('b2', I[2]); adv('r1', I[0]); adv('r2', I[0] + I[1]);
      anim = true;
    }
    if (id === 'power' && m.P > 0) { PH.disk = (PH.disk || 0) + dt * m.P / 300; anim = true; }
    if (id === 'joule' && m.run) { PH.j = ph('j') + dt * V * m.I; }
  }
  if (id === 'joule' && S.run) {
    anim = true;

    if (S.jt >= L().tRun) {

      const dT = Q / (L().c * L().m);

}

function act(a) {

  if (a === 'off') { S.plug = {}; S.trip = false; return update(); }
  if (a === 'im') return setCurrent(S.I - 0.5);
  if (a === 'ip') return setCurrent(S.I + 0.5);
  if (a === 'run') return startRun();
  if (a === 'fresh') return freshWater();
  tap(a);
}

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {

}

function barsSVG(rows, max, unit) {
  const H = rows.length * 15 + 6;

  rows.forEach((r, i) => {

    h += `<text x="2" y="${y + 6.5}" font-size="4" fill="#8b96ad">${r.label}</text><rect x="30" y="${y + 1.5}" width="70" height="6.5" rx="1" fill="#1a2438"/>`;
    if (W > 0) h += `<rect x="30" y="${y + 1.5}" width="${W.toFixed(2)}" height="6.5" rx="1" fill="${r.c || 'var(--liq)'}"/>`;
    h += `<text x="118" y="${y + 6.5}" font-size="4" fill="#e8ecf4" text-anchor="end">${nf(r.v)} ${unit}</text>`;
  });
  return h + `</svg>`;
}

    [0, 1, 2].map(k => `<div class="ctl"><div class="lbl">Ветвь ${k + 1}<button class="ghostbtn" data-a="sw${k}" id="swb${k}" style="padding:4px 10px"></button></div>${chips('R' + k, Ls.Rset, S.R[k], v => v + ' Ом')}</div>`).join('');

    <div class="ctl"><div class="lbl">Включены в удлинитель</div><div class="chips" id="appChips">${APP.map((a, i) => `<button data-i="${i}">${a.name}</button>`).join('')}</div></div>

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (name, cur) => el.querySelectorAll(`[data-chips="${name}"] button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === String(cur)));
  const d = el.querySelector('#sDiag'); if (!d) return;
  if (m.kind === 'series') {
    d.innerHTML = barsSVG([{ label: 'U₁ (R₁)', v: m.U1, c: '#ffb547' }, { label: 'U₂ (R₂)', v: m.U2, c: '#72d4e8' }, { label: 'U участка', v: m.U1 + m.U2, c: '#86e0a8' }], 12, 'В');
    set('#r1', fmt(m.I, 2) + ' А'); set('#r2', m.R + ' Ом'); set('#r3', m.vm ? fmt(m.vr, 1) + ' В' : '—');
    press('R1', S.R1); press('R2', S.R2); press('vm', S.vm); set('#keyBtn', S.closed ? 'Разомкнуть ключ' : 'Замкнуть ключ');
  } else if (m.kind === 'parallel') {
    d.innerHTML = barsSVG([0, 1, 2].map(k => ({ label: 'I' + '₁₂₃'[k], v: m.Ik[k] })).concat([{ label: 'I общ', v: m.I, c: '#86e0a8' }]), 9, 'А');
    set('#r1', nf(m.I) + ' А'); set('#r2', isFinite(m.Rt) ? nf(m.Rt) + ' Ом' : '∞'); set('#r3', m.U + ' В');
    [0, 1, 2].forEach(k => { press('R' + k, S.R[k]); set('#swb' + k, S.on[k] ? 'включена' : 'выключена'); });
  } else if (m.kind === 'power') {
    d.innerHTML = barsSVG(APP.map(a => ({ label: a.name, v: S.plug[a.id] && !S.trip ? a.P : 0, c: '#ffb547' })), 2000, 'Вт');
    set('#r1', m.P + ' Вт'); set('#r2', fmt(m.I, 1) + ' А'); set('#r3', fmt(m.E, 3) + ' кВт·ч');
    el.querySelectorAll('#appChips button').forEach(b => b.setAttribute('aria-pressed', !!S.plug[APP[+b.dataset.i].id]));
    set('#inTO', S.t + ' мин'); val('#inT', S.t);
  } else {
    d.innerHTML = m.runs.length ? `<table class="hist"><tr><th>I, А</th><th>R, Ом</th><th>Q, Дж</th><th>ΔT, °C</th></tr>${m.runs.map(r => `<tr class="${Math.abs(r.Q - 3000) < 1e-6 ? 'hi' : ''}"><td>${fmt(r.I, 1)}</td><td>${r.R}</td><td>${big(r.Q)}</td><td>${fmt(r.dT, 1)}</td></tr>`).join('')}</table>` : '<p class="note">Здесь появится таблица ваших опытов. Сравните: что будет с Q, если ток увеличить в 2 раза?</p>';
    set('#r1', nf(m.P) + ' Вт'); set('#r2', nf(m.U) + ' В'); set('#r3', fmt(m.T, 1) + ' °C');
    press('Rs', S.Rs); set('#inIO', fmt(S.I, 1) + ' А'); val('#inI', S.I);
  }
}

function calcHTML(m) {
  const id = LID();
  if (id === 'series') {
    let h = `<h2>Последовательное соединение</h2><div class="formula">I = U / (R₁ + R₂)</div><p class="note">Ток один на всех, напряжения складываются: U = U₁ + U₂.</p><h3>Сейчас</h3><div class="steps">` +
      step('R = R₁ + R₂', `${m.R1} + ${m.R2} = ${m.R} Ом`);
    if (!m.closed) h += step('ключ', 'разомкнут, I = 0', 'sum') + `</div>`;
    else h += step('I = U / R', `12 / ${m.R} = ${nf(m.I, 3)} А`) + step('U₁ = I·R₁', `${nf(m.I, 3)} × ${m.R1} = ${nf(m.U1)} В`) + step('U₂ = I·R₂', `${nf(m.I, 3)} × ${m.R2} = ${nf(m.U2)} В`) + step('U₁ + U₂', `${nf(m.U1)} + ${nf(m.U2)} = ${nf(m.U1 + m.U2)} В`, 'sum') + `</div>`;
    h += `<h3>Как рассуждать в задании</h3><div class="steps">` + step('нужное R общ', 'R = U / I') + step('нужное R₁', 'R₁ = U₁ / I') + step('остаток', 'R₂ = R − R₁', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Обратите внимание: U₁ / U₂ = R₁ / R₂. Напряжение делится пропорционально сопротивлениям.</p>`;
  }
  if (id === 'parallel') {
    const on = [0, 1, 2].filter(k => m.on[k]);
    let h = `<h2>Параллельное соединение</h2><div class="formula">I = I₁ + I₂ + I₃</div><p class="note">На каждой ветви одно и то же U = 6 В, поэтому Iₖ = U / Rₖ. Выключенная ветвь даёт 0.</p><h3>Сейчас</h3><div class="steps">` +
      [0, 1, 2].map(k => step(`I${'₁₂₃'[k]} = U / R${'₁₂₃'[k]}`, m.on[k] ? `6 / ${m.R[k]} = ${nf(m.Ik[k])} А` : 'ветвь выключена')).join('') +
      step('I общ', `${on.map(k => nf(m.Ik[k])).join(' + ') || '0'} = ${nf(m.I)} А`, 'sum') + `</div>`;
    if (on.length) h += `<h3>Общее сопротивление</h3><div class="steps">` + step('1/R', on.map(k => `1/${m.R[k]}`).join(' + ') + ` = ${nf(1 / m.Rt, 3)} 1/Ом`) + step('R = U / I', `6 / ${nf(m.I)} = ${nf(m.Rt)} Ом`, 'sum') + `</div><p class="note" style="margin-top:10px">R общ меньше самого маленького сопротивления включённых ветвей.</p>`;
    return h;
  }
  if (id === 'power') {
    return `<h2>Работа и мощность</h2><div class="formula">P = U·I &nbsp;·&nbsp; A = P·t</div><h3>Сейчас</h3><div class="steps">` +
      step('P', m.n ? APP.filter(a => S.plug[a.id]).map(a => a.P).join(' + ') + ` = ${m.Pp} Вт` + (m.trip ? ' (отключено)' : '') : 'ничего не включено') +
      step('I = P / U', `${m.P} / 220 = ${nf(m.I)} А`) + step('t', `${m.t} мин = ${nf(m.t / 60, 3)} ч = ${m.t * 60} с`) +
      step('A = P·t', `${nf(m.P / 1000, 3)} кВт × ${nf(m.t / 60, 3)} ч = ${nf(m.E, 3)} кВт·ч`) + step('в джоулях', `${m.P} × ${m.t * 60} = ${big(m.J)} Дж`) +
      step('стоимость', `${nf(m.E, 3)} × 25 ₸ ≈ ${nf(m.cost, 1)} ₸`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">1 кВт·ч = 3 600 000 Дж. Предел удлинителя: 16 А × 220 В = 3520 Вт.</p>`;
  }
  const Ls = L();
  let h = `<h2>Закон Джоуля — Ленца</h2><div class="formula">Q = I²·R·t</div><h3>Сейчас</h3><div class="steps">` +
    step('P = I²·R', `${fmt(m.I, 1)}² × ${m.R} = ${nf(m.P)} Вт`) + step('Q за 60 с', `${nf(m.P)} × 60 = ${big(m.P * 60)} Дж`) +
    step('ΔT = Q / (c·m)', `${big(m.P * 60)} / (4200 × 0,1) = ${fmt(m.P * 60 / 420, 1)} °C`, 'sum') + `</div>
    <h3>Ток вдвое больше</h3><div class="steps">` + (m.I * 2 <= 4 ? step(`I = ${fmt(m.I * 2, 1)} А`, `Q = ${big(4 * m.P * 60)} Дж — в 4 раза больше`) : step(`I = ${nf(m.I / 2)} А (вдвое меньше)`, `Q = ${big(m.P * 60 / 4)} Дж — в 4 раза меньше`)) + `</div>
    <h3>Для задания</h3><div class="steps">` + step('нужная мощность', `P = Q / t = ${Ls.Qneed} / 60 = ${nf(Ls.Qneed / 60)} Вт`) + step('условие', 'I²·R = эта мощность', 'sum') + `</div>
    <p class="note" style="margin-top:10px">Мы считаем, что вся теплота уходит в воду. На деле часть уходит на нагрев стакана и воздуха, и вода нагреется чуть меньше.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'series') el.innerHTML = `<div class="k">Приборы</div><div class="v ${S.done.series ? 'ok' : ''}">I = ${fmt(m.I, 2)} А</div><div class="lr"><span>${m.vm ? 'V ' + VM_NAMES[m.vm].replace('на всём участке', 'участок').replace('на ', '') : 'вольтметр'}</span><span>${m.vm ? fmt(m.vr, 1) + ' В' : '—'}</span></div><div class="lr"><span>R общ</span><span>${m.R} Ом</span></div>`;
  else if (m.kind === 'parallel') el.innerHTML = `<div class="k">Общий ток</div><div class="v ${S.done.parallel ? 'ok' : ''}">I = ${nf(m.I)} А</div><div class="lr"><span>ветвей</span><span>${m.nOn}</span></div><div class="lr"><span>R общ</span><span>${isFinite(m.Rt) ? nf(m.Rt) + ' Ом' : '∞'}</span></div>`;
  else if (m.kind === 'power') el.innerHTML = `<div class="k">Удлинитель</div><div class="v ${S.done.power ? 'ok' : ''}">P = ${m.P} Вт</div><div class="lr"><span>I</span><span class="${m.Pp / 220 > 16 ? 'bad' : ''}">${fmt(m.I, 1)} А</span></div><div class="lr"><span>A за ${m.t} мин</span><span>${fmt(m.E, 2)} кВт·ч</span></div>`;
  else el.innerHTML = `<div class="k">Нагрев</div><div class="v ${S.done.joule ? 'ok' : ''}">Q = ${big(m.Q)} Дж</div><div class="lr"><span>P</span><span>${nf(m.P)} Вт</span></div><div class="lr"><span>вода</span><span>${fmt(m.T, 1)} °C</span></div>`;
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали опыта</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы понимаете, как устроена проводка!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  renderToolsState();
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}
function renderToolsState() {
  const pr = { key: S.closed, 'vm-r1': S.vm === 'r1', 'vm-r2': S.vm === 'r2', 'vm-all': S.vm === 'all', sw0: S.on[0], sw1: S.on[1], sw2: S.on[2] };
  $('#tools').querySelectorAll('button[aria-pressed]').forEach(b => { if (b.dataset.a in pr) b.setAttribute('aria-pressed', pr[b.dataset.a]); });
}

const MINI = {
  series: '<path d="M6 22V8h54v14H6" fill="none" stroke="#8b96ad" stroke-width="1.2"/><rect x="16" y="4" width="14" height="8" fill="#0b1019" stroke="#e8ecf4" stroke-width="1.2"/><rect x="38" y="4" width="14" height="8" fill="#0b1019" stroke="#e8ecf4" stroke-width="1.2"/><circle cx="24" cy="22" r="1.6" fill="#ffd08a"/><circle cx="44" cy="22" r="1.6" fill="#ffd08a"/>',
  parallel: '<path d="M6 27V3h12M18 3v18M48 3v18M18 3h30M18 12h30M18 21h30M48 21v6H6" fill="none" stroke="#8b96ad" stroke-width="1.1"/><rect x="27" y="0.5" width="12" height="5" fill="#0b1019" stroke="#e8ecf4"/><rect x="27" y="9.5" width="12" height="5" fill="#0b1019" stroke="#e8ecf4"/><rect x="27" y="18.5" width="12" height="5" fill="#0b1019" stroke="#e8ecf4"/>',
  power: '<rect x="6" y="18" width="54" height="8" rx="1.5" fill="#dfe6f0"/><circle cx="16" cy="22" r="2" fill="#8b96ad"/><circle cx="33" cy="22" r="2" fill="#8b96ad"/><circle cx="50" cy="22" r="2" fill="#8b96ad"/><path d="M35 2l-7 9h6l-4 7 9-10h-6z" fill="#ffb547"/>',
  joule: '<path d="M18 6v18q0 3 3 3h24q3 0 3-3V6" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><rect x="19" y="12" width="28" height="14" fill="#5fb4d9" opacity=".35"/><path d="M23 20q2.5-5 5 0t5 0t5 0t5 0" fill="none" stroke="#ff8a73" stroke-width="1.4"/><path d="M56 26V6" stroke="#ff5a4a" stroke-width="2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; S.hl = null; drag = null;
  resetState(); save();
  const Ls = L();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// ---------- AI tutor ----------
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'series') now = `Последовательная цепь: источник 12 В, ключ ${m.closed ? 'замкнут' : 'разомкнут'}, R₁ = ${m.R1} Ом, R₂ = ${m.R2} Ом, R общ = ${m.R} Ом. Амперметр: ${fmt(m.I, 2)} А. U₁ = ${nf(m.U1)} В, U₂ = ${nf(m.U2)} В. Вольтметр ${m.vm ? `подключён ${VM_NAMES[m.vm]} и показывает ${fmt(m.vr, 1)} В` : 'не подключён'}. Измерено при текущих резисторах: ${Object.keys(S.meas).map(k => VM_NAMES[k]).join(', ') || 'ничего'}. Доступные сопротивления: ${Ls.Rset.join(', ')} Ом.`;
  if (id === 'parallel') now = `Параллельная цепь: источник 6 В, три ветви. ${[0, 1, 2].map(k => `Ветвь ${k + 1}: ${m.on[k] ? 'включена' : 'выключена'}, R = ${m.R[k]} Ом, ток ${nf(m.Ik[k])} А`).join('; ')}. Общий ток ${nf(m.I)} А, общее сопротивление ${isFinite(m.Rt) ? nf(m.Rt) + ' Ом' : 'бесконечно (цепь разомкнута)'}. Доступные сопротивления: ${Ls.Rset.join(', ')} Ом.`;
  if (id === 'power') now = `Удлинитель 220 В, предел 16 А. Приборы: ${APP.map(a => `${a.name} ${a.P} Вт — ${S.plug[a.id] ? 'включён' : 'не включён'}`).join('; ')}. ${m.trip ? 'Автомат удлинителя отключился из-за перегрузки, ток 0.' : `Общая мощность ${m.P} Вт, ток в шнуре ${fmt(m.I, 2)} А.`} На часах ${m.t} мин, энергия за это время ${fmt(m.E, 3)} кВт·ч (${big(m.J)} Дж), стоимость примерно ${fmt(m.cost, 1)} ₸ по тарифу 25 ₸ за кВт·ч.`;
  if (id === 'joule') now = `Спираль ${m.R} Ом в стакане со 100 г воды, источник даёт ток ${fmt(m.I, 1)} А (можно 0,5–4 А шагом 0,5; спирали 2, 4, 8 Ом). Мощность нагрева P = I²R = ${nf(m.P)} Вт, напряжение на спирали ${nf(m.U)} В. ${m.run ? `Идёт нагрев, прошло ${fmt(m.jt, 0)} с из 60.` : 'Нагрев выключен.'} Температура воды ${fmt(m.T, 1)} °C (начальная 20 °C). Опыты: ${m.runs.map(r => `I=${fmt(r.I, 1)} А, R=${r.R} Ом → Q=${big(r.Q)} Дж, ΔT=${fmt(r.dT, 1)} °C`).join('; ') || 'ещё не было'}.`;
  return [
    `Предмет: физика, 8 класс. Тема: электрические цепи. Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Если задание не выполнено, не называй готовые значения: веди ученика вопросами и формулами, пусть посчитает сам.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = {
    series: 'Почему на большем резисторе напряжение больше?', parallel: 'Почему общее сопротивление меньше, чем у любой ветви?',
    power: 'Сколько стоит вскипятить чайник?', joule: 'Почему провода к чайнику не нагреваются?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
