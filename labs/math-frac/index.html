<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 5 класс: обыкновенные дроби, десятичные дроби, проценты, отношения и пропорции.">
<title>Дроби и проценты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.meter .v .fr{font-size:1.15em}
.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:4px 0 0;text-align:center}
.pv div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.pv small{display:block;font:600 9.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pv b{display:block;font:500 22px/1 var(--font-mono);margin-top:6px}
.pv .on b{color:var(--force)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Дроби</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле с моделью дроби. Её можно закрашивать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const FR = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;

// ---------- number words for reading decimals ----------
const W1 = ['ноль', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
const W10 = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
const WT = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
const words = n => n < 10 ? W1[n] : n < 20 ? W10[n - 10] : WT[Math.floor(n / 10)] + (n % 10 ? ' ' + W1[n % 10] : '');
const decStr = k => k === 100 ? '1' : k === 0 ? '0' : k % 10 === 0 ? '0,' + k / 10 : '0,' + String(k).padStart(2, '0');
const readDec = k => {
  if (k === 100) return 'одна целая';
  if (k === 0) return 'ноль';
  if (k % 10 === 0) { const t = k / 10; return `ноль целых ${words(t)} ${plural(t, 'десятая', 'десятых', 'десятых')}`; }
  return `ноль целых ${words(k)} ${plural(k, 'сотая', 'сотых', 'сотых')}`;
};

// ---------- paint mixing: share of blue → colour (yellow → green → blue) ----------
const MIX = [[0, '#f2cc1a'], [0.2, '#c3d12a'], [0.33, '#86c43a'], [0.4, '#5db446'], [0.5, '#2ea05a'], [0.62, '#1f8c7e'], [0.8, '#2a6fbf'], [1, '#2f56c9']];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mixColor(f) {
  f = clamp(f, 0, 1); let i = 0; while (i < MIX.length - 2 && f > MIX[i + 1][0]) i++;
  const [f0, c0] = MIX[i], [f1, c1] = MIX[i + 1], k = (f - f0) / (f1 - f0), a = hex(c0), b = hex(c1);
  return '#' + a.map((v, j) => Math.round(v + (b[j] - v) * k).toString(16).padStart(2, '0')).join('');
}
const REF = { b: 2, y: 3 };

const LESSONS = [
  { id: 'common', title: 'Обыкновенные дроби',
    text: ['Разрежем плитку шоколада на равные дольки. Одна долька — это доля целого. Если долек 8, каждая из них — одна восьмая, 1/8.',
           'Дробь записывают двумя числами через черту. Нижнее — знаменатель: на сколько равных долей разделили целое. Верхнее — числитель: сколько таких долей взяли.',
           'Одну и ту же часть можно записать разными дробями: 1/2 = 2/4 = 4/8. Если числитель и знаменатель умножить на одно и то же число, дробь не изменится.'],
    why: 'Повар и кондитер режут торт на 8 или 12 равных кусков и считают, сколько порций продать. Музыкант читает ноты: половинная, четвертная, восьмая — это дроби такта. Портной и столяр отмеряют части метра. А дома дроби помогают честно поделить пиццу на всю семью.',
    task: 'Закрасьте 3/4 плитки, но так, чтобы долек было больше четырёх: например, 8 или 12.',

const KEY = 'luch-math-frac';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview',
            d: 4, shade: [], cells: [], total: 24000, p: 10, b: 0, y: 9, hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID();
  if (id === 'common') { const n = S.shade.filter(Boolean).length; return { kind: id, n, d: S.d, v: n / S.d }; }
  if (id === 'decimal') { const k = S.cells.filter(Boolean).length; return { kind: id, k, v: k / 100 }; }
  if (id === 'percent') { const part = S.total * S.p / 100; return { kind: id, total: S.total, p: S.p, part, rest: S.total - part }; }
  const t = S.b + S.y;
  return { kind: id, b: S.b, y: S.y, t, f: t ? S.b / t : 0, same: t > 0 && S.b * REF.y === S.y * REF.b };
}

const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const T = (x, y, s, txt, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const svgFrac = (x, y, n, d, s, fill) => T(x, y - s * 0.25, s, n, fill, 'middle', 'font-weight="500"') + `<path d="M${(x - s * 0.55).toFixed(1)} ${(y).toFixed(1)}h${(s * 1.1).toFixed(1)}" stroke="${fill}" stroke-width="1.4"/>` + T(x, y + s * 0.95, s, d, fill, 'middle', 'font-weight="500"');

function backdrop() {

}

function commonSVG() {
  const d = S.d, w = BAR.w / d, m = model();
  let h = T(BAR.x, 134, 12, 'образец: 3/4 плитки', '#72d4e8', 'start');
  for (let i = 0; i < 4; i++) h += `<rect x="${BAR.x + i * 110 + 1}" y="143" width="108" height="26" rx="3" fill="${i < 3 ? 'rgba(114,212,232,.5)' : '#1a2438'}" stroke="#0b1019" stroke-width="1.5"/>`;
  h += `<rect x="${BAR.x}" y="143" width="${BAR.w}" height="26" rx="4" fill="none" stroke="#72d4e8" stroke-width="1.2" opacity=".6"/>`;
  // the bar
  h += `<rect x="${BAR.x - 4}" y="${BAR.y - 4}" width="${BAR.w + 8}" height="${BAR.h + 8}" rx="9" fill="#2b1a10" stroke="${INK}" stroke-width="2.5"/>`;
  for (let i = 0; i < d; i++) {
    const x = BAR.x + i * w, on = S.shade[i];
    h += `<g data-piece="${i}"><rect x="${(x + 1.5).toFixed(1)}" y="${BAR.y + 1.5}" width="${(w - 3).toFixed(1)}" height="${BAR.h - 3}" rx="5" fill="${on ? '#ffb547' : '#6b4429'}"/>`;
    h += `<rect x="${(x + 7).toFixed(1)}" y="${BAR.y + 7}" width="${Math.max(2, w - 14).toFixed(1)}" height="${BAR.h - 14}" rx="3" fill="none" stroke="${on ? '#ffd08a' : '#87573a'}" stroke-width="1.6"/></g>`;
  }
  h += T(BAR.x + BAR.w / 2, BAR.y + BAR.h + 22, 11.5, `целое разрезано на ${d} ${plural(d, 'равную дольку', 'равные дольки', 'равных долек')}`, '#8b96ad');
  // number line 0…1
  const X = v => BAR.x + v * BAR.w, y = NL1.y;
  h += `<path d="M${BAR.x - 8} ${y}H${BAR.x + BAR.w + 14}" stroke="#a9b4c9" stroke-width="2"/><path d="M${BAR.x + BAR.w + 14} ${y}l-7 -4v8z" fill="#a9b4c9"/>`;
  for (let i = 0; i <= d; i++) h += `<path d="M${X(i / d).toFixed(1)} ${y - 6}v12" stroke="#a9b4c9" stroke-width="1.4"/>`;
  h += T(X(0), y + 22, 12, '0', '#e8ecf4') + T(X(1), y + 22, 12, '1', '#e8ecf4');

  return h;
}

const cellXY = idx => { const c = Math.floor(idx / 10), r = idx % 10; return [GR.x + c * GR.c, GR.y + (9 - r) * GR.c]; };

  h += `<rect x="${GR.x}" y="${GR.y}" width="${S10}" height="${S10}" fill="none" stroke="#a9b4c9" stroke-width="1.6"/>`;

  h += T(GR.x + S10 + 16, GR.y + 112, 30, decStr(m.k), '#ffb547', 'start', 'font-weight="500"');
  h += T(GR.x + S10 + 16, GR.y + 136, 12, `${m.k}/100`, '#e8ecf4', 'start');

  // number line 0…1
  const X0 = 40, X1 = 480, y = 378, X = v => X0 + v * (X1 - X0);

  for (let i = 0; i <= 100; i++) { const L = i % 10 === 0 ? 7 : 2.5; h += `<path d="M${X(i / 100).toFixed(1)} ${y - L}v${2 * L}" stroke="#a9b4c9" stroke-width="${i % 10 === 0 ? 1.4 : .8}" opacity="${i % 10 === 0 ? 1 : .55}"/>`; }
  for (let i = 0; i <= 10; i++) h += T(X(i / 10), y + 20, 9.5, i === 10 ? '1' : i === 0 ? '0' : '0,' + i, '#8b96ad');

  return h;

function canSVG(k, o) {
  const blue = k === 'blue', col = blue ? '#2f62d0' : '#f2c919', tilt = o.tilt * (blue ? 1 : -1);
  let h = `<g transform="translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) rotate(${tilt.toFixed(1)})" data-drag="${k}">`;
  h += `<rect x="-44" y="-112" width="88" height="118" fill="transparent"/>`;
  h += ol('M-26 -82Q0 -112 26 -82', 'none', '#a9b4c9', 2.4);
  h += ol('M-32 -82h64v76q0 6-6 6h-52q-6 0-6-6z', '#c9d3e3', '#e8ecf4', 2);
  h += `<rect x="-32" y="-82" width="64" height="12" fill="${col}"/><path d="M-20 -70v8q0 4 3 4t3-4v-8M8 -70v5q0 3 3 3t3-3v-5" fill="${col}"/>`;
  h += `<rect x="-24" y="-48" width="48" height="30" rx="3" fill="${col}" stroke="${INK}" stroke-width="1.4"/>`;
  h += T(0, -29, 10, blue ? 'синяя' : 'жёлтая', blue ? '#fff' : '#0b1019', 'middle', 'font-weight="500"');
  h += ol('M-34 -84h68v5h-68z', '#56627d', '#8a96b0', 1.2);
  return h + `</g>`;
}

function ratioSVG(m) {
  let h = `<rect x="-2000" y="360" width="4520" height="1200" fill="#1a2232"/><rect x="-2000" y="358" width="4520" height="4" fill="#2c3954"/>`;
  // reference jar
  h += T(260, 118, 11.5, 'эталон 2 : 3', '#e8ecf4');
  h += ol('M238 128h44v40q0 4-4 4h-36q-4 0-4-4z', mixColor(REF.b / (REF.b + REF.y)), '#e8ecf4', 1.6);

  const lv = BUCKET.bot - 4 - Math.min(1, m.t / 34) * (BUCKET.bot - BUCKET.top - 14);

  if (m.t > 0) h += `<rect x="150" y="${lv.toFixed(1)}" width="220" height="${(BUCKET.bot - lv + 4).toFixed(1)}" fill="${mixColor(m.f)}"/><rect x="150" y="${lv.toFixed(1)}" width="220" height="3" fill="#fff" opacity=".25"/>`;
  h += `</g>`;
  const bd = `M${BUCKET.xt0} ${BUCKET.top}L${BUCKET.xb0} ${BUCKET.bot}H${BUCKET.xb1}L${BUCKET.xt1} ${BUCKET.top}`;
  h += ol(bd, 'none', '#a9b4c9', 2.6);
  h += ol(`M${BUCKET.xt0 - 4} ${BUCKET.top}H${BUCKET.xt1 + 4}`, 'none', '#c9d3e3', 3);
  h += ol(`M${BUCKET.xt0 + 4} ${BUCKET.top + 6}Q260 ${BUCKET.top - 50} ${BUCKET.xt1 - 4} ${BUCKET.top + 6}`, 'none', '#8a96b0', 2);
  h += `<rect x="226" y="${BUCKET.top + 12}" width="68" height="26" rx="5" fill="#e8ecf4" stroke="${INK}" stroke-width="1.5"/>` + T(260, BUCKET.top + 30, 13, `${m.b} : ${m.y}`, '#0b1019', 'middle', 'font-weight="500"');
  // cans
  for (const k of ['blue', 'yellow']) if (!(drag && drag.id === k)) h += canSVG(k, P[k]);
  if (drag && drag.kind === 'can') h += canSVG(drag.id, P[drag.id]);
  // tally of cups
  const n = m.t, sz = n > 36 ? 8 : 10, gap = sz + 2, x0 = 260 - (n * gap) / 2;
  for (let i = 0; i < n; i++) h += `<rect x="${(x0 + i * gap).toFixed(1)}" y="374" width="${sz}" height="${sz}" rx="2" fill="${i < m.b ? '#2f62d0' : '#f2c919'}"/>`;
  if (n) h += T(260, 400, 10, `стаканов: синей ${m.b}, жёлтой ${m.y}`, '#8b96ad');
  return h;
}

  return {

  } else {
    const g = gcd(m.b, m.y);
    d.innerHTML = cmpBars([{ label: 'эталон 2 : 3', v: 0.4, col: '#2f62d0', bg: '#f2c919', d: 5, txt: '2 из 5' }, { label: `ведро ${m.b} : ${m.y}`, v: m.f, col: '#2f62d0', bg: m.t ? '#f2c919' : '#1a2438', d: m.t <= 40 ? m.t : 0, txt: m.t ? `${m.b} из ${m.t}` : 'пусто', hi: m.same }]);
    set('#r1', `${m.b} : ${m.y}`); set('#r2', m.b && m.y ? `${m.b / g} : ${m.y / g}` : '—'); set('#r3', m.t === 0 ? '—' : m.same ? 'как эталон' : m.f > 0.4 ? 'синее' : 'желтее');
    set('#inBO', m.b); set('#inYO', m.y); val('#inB', m.b); val('#inY', m.y);
  }
}

function partsList() {
  const id = LID();
  if (id === 'common') return [
    { id: 'ref', icon: ICON.ref, name: 'Образец 3/4', spec: 'Такая же плитка, разрезанная на 4 дольки, три из них закрашены. С ним сравниваем свою дробь.' },
    { id: 'bar', icon: ICON.bar, name: 'Плитка — это целое', spec: 'Число долек — знаменатель дроби. Закрашенные дольки — числитель. Дольки всегда равные, иначе это уже не дробь.' },
    { id: 'line', icon: ICON.line, name: 'Числовой луч', spec: 'Отрезок от 0 до 1 тоже целое. Оранжевая отметка — ваша дробь, голубой пунктир — 3/4. Равные дроби попадают в одну точку.' }];
  if (id === 'decimal') return [
    { id: 'grid', icon: ICON.grid, name: 'Квадрат 10 × 10', spec: 'Это целое, то есть 1. В нём 100 клеток.' },
    { id: 'col', icon: ICON.col, name: 'Столбец — одна десятая', spec: '10 клеток из 100: 10/100 = 1/10 = 0,1. Первая цифра после запятой считает столбцы.' },
    { id: 'cell', icon: ICON.cell, name: 'Клетка — одна сотая', spec: '1/100 = 0,01. Вторая цифра после запятой считает отдельные клетки.' },
    { id: 'nline', icon: ICON.line, name: 'Числовой луч', spec: 'От 0 до 1 с шагом 0,1. Мелкие штрихи — сотые. Отметка показывает, где стоит ваше число.' }];
  if (id === 'percent') return [
    { id: 'pct', icon: ICON.pct, name: 'Шкала процентов', spec: 'От 0 до 100 %. 100 % — вся цена куртки.' },
    { id: 'pbar', icon: ICON.pbar, name: 'Полоса цены', spec: 'Оранжевая часть — скидка, голубая — сколько остаётся заплатить. Вместе всегда 100 %.' },
    { id: 'money', icon: ICON.money, name: 'Шкала тенге', spec: 'От 0 до полной цены. Каждая точка стоит под своим процентом: 50 % — ровно под половиной цены.' },
    { id: 'handle', icon: ICON.handle, name: 'Маркер', spec: 'Тащите его: сверху читаете проценты, снизу — сумму в тенге.' }];
  return [
    { id: 'refjar', icon: ICON.refjar, name: 'Эталон', spec: 'Краска, смешанная 2 : 3 — два стакана синей на три стакана жёлтой.' },
    { id: 'blue', icon: ICON.blue, name: 'Банка синей краски', spec: 'Одно перетаскивание к ведру или нажатие — один стакан.' },
    { id: 'yellow', icon: ICON.yellow, name: 'Банка жёлтой краски', spec: 'Тоже по стакану. В ведро уже налито 9 стаканов жёлтой.' },
    { id: 'bucket', icon: ICON.bucket, name: 'Ведро', spec: 'Цвет зависит не от количества краски, а от отношения синей к жёлтой.' },
    { id: 'tally', icon: ICON.tally, name: 'Счёт стаканов', spec: 'Каждый квадратик — стакан краски. Так легко увидеть отношение.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'common') {
    const g = gcd(m.n, m.d), a = m.n * 4, b = 3 * m.d;
    let h = `<h2>Обыкновенная дробь</h2><div class="formula">${FR('числитель', 'знаменатель')}</div><p class="note">Знаменатель — на сколько равных долей разделили целое. Числитель — сколько долей взяли.</p><h3>Сейчас на плитке</h3><div class="steps">` +
      step('знаменатель', `${m.d} ${plural(m.d, 'долька', 'дольки', 'долек')}`) + step('числитель', `закрашено ${m.n}`) + step('дробь', `${m.n}/${m.d}`, 'sum');
    if (m.n > 0 && g > 1) h += step('сократим на ' + g, `${m.n}/${m.d} = ${m.n / g}/${m.d / g}`);
    h += `</div><h3>Сравним с 3/4</h3><div class="steps">` +
      step('приведём к знаменателю 4·' + m.d, `${m.n}/${m.d} = ${a}/${4 * m.d}, 3/4 = ${b}/${4 * m.d}`) +
      step('сравним числители', `${a} ${cmpSign(a, b)} ${b}`) + step('вывод', `${m.n}/${m.d} ${cmpSign(a, b)} 3/4`, 'sum') + `</div>
      <h3>Основное свойство дроби</h3><p class="note">Числитель и знаменатель можно умножить или разделить на одно и то же число — дробь не изменится: 1/2 = 2/4 = 3/6 = 6/12.</p>`;
    return h;
  }
  if (id === 'decimal') {
    const k = m.k, g = gcd(k, 100);
    return `<h2>Десятичная дробь</h2><div class="formula">${FR(k, 100)} = ${decStr(k)}</div><p class="note">Знаменатель 100 — значит, после запятой две цифры: десятые и сотые.</p><h3>Сейчас в квадрате</h3><div class="steps">` +
      step('закрашено клеток', `${k} из 100`) + step('полных столбцов (десятые)', String(k === 100 ? 10 : Math.floor(k / 10))) + step('отдельных клеток (сотые)', String(k === 100 ? 0 : k % 10)) +
      step('записываем', decStr(k), 'sum') + step('читаем', readDec(k)) +
      (k > 0 && k < 100 && g > 1 ? step('как обыкновенная', `${k}/100 = ${k / g}/${100 / g}`) : '') + `</div>
      <h3>Как перевести дробь в десятичную</h3><p class="note">Ищем, на что умножить знаменатель, чтобы получилось 10 или 100. Например, 1/5 = 2/10 = 0,2 и 1/2 = 50/100 = 0,5. Нули в конце не меняют число: 0,5 = 0,50.</p>`;
  }
  if (id === 'percent') {
    const one = m.total / 100;
    return `<h2>Проценты</h2><div class="formula">1 % = целое : 100</div><h3>Сейчас</h3><div class="steps">` +
      step('целое', `${money(m.total)} = 100 %`) + step('1 %', `${money(m.total)} : 100 = ${money(one)}`) +
      step(`${m.p} %`, `${m.p} × ${money(one)} = ${money(m.part)}`, 'sum') + step(`остаток ${100 - m.p} %`, `${money(m.total)} − ${money(m.part)} = ${money(m.rest)}`) + `</div>
      <h3>Какой это процент?</h3><p class="note">Чтобы узнать, сколько процентов одно число составляет от другого, делим часть на целое и умножаем на 100 %.</p><div class="steps">` +
      step('часть : целое × 100 %', `${money(m.part)} : ${money(m.total)} × 100 % = ${m.p} %`) + `</div>`;
  }
  const g = gcd(m.b, m.y), a = m.b * REF.y, b = m.y * REF.b;
  return `<h2>Пропорция</h2><div class="formula" style="font-size:15px">a : b = c : d<br>a · d = b · c</div><p class="note">Крайние члены — a и d, средние — b и c.</p><h3>Сейчас в ведре</h3><div class="steps">` +
    step('синей : жёлтой', `${m.b} : ${m.y}`) + (m.b && m.y && g > 1 ? step('сократим на ' + g, `${m.b / g} : ${m.y / g}`) : '') +
    step('доля синей', m.t ? `${m.b} из ${m.t} = ${trim(m.f * 100, 1)} %` : 'ведро пустое') + `</div>
    <h3>Проверим пропорцию ${m.b} : ${m.y} = 2 : 3</h3><div class="steps">` +
    step('крайние', `${m.b} · 3 = ${a}`) + step('средние', `${m.y} · 2 = ${b}`) +
    step('вывод', a === b && m.t ? 'равны — цвет как у эталона' : `${a} ≠ ${b} — цвет другой`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Эталон: синей 2 из 5 стаканов, это 40 %.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'common') el.innerHTML = `<div class="k">Дробь</div><div class="v ${ok ? 'ok' : ''}">${FR(m.n, m.d)}</div><div class="lr"><span>с 3/4</span><span>${cmpSign(m.n * 4, 3 * m.d)}</span></div><div class="gauge"><b style="width:${(m.v * 100).toFixed(1)}%;background:var(--force)"></b><i style="left:75%;background:var(--arm)"></i></div>`;
  else if (id === 'decimal') el.innerHTML = `<div class="k">Десятичная</div><div class="v ${ok ? 'ok' : ''}">${decStr(m.k)}</div><div class="lr"><span>дробь</span><span>${m.k}/100</span></div><div class="gauge"><b style="width:${m.k}%;background:var(--force)"></b></div>`;
  else if (id === 'percent') el.innerHTML = `<div class="k">Скидка</div><div class="v ${ok ? 'ok' : ''}">${m.p} %</div><div class="lr"><span>часть</span><span>${money(m.part)}</span></div><div class="lr"><span>к оплате</span><span>${money(m.rest)}</span></div>`;
  else el.innerHTML = `<div class="k">Синяя : жёлтая</div><div class="v ${ok ? 'ok' : ''}">${m.b} : ${m.y}</div><div class="swatch" style="background:${m.t ? mixColor(m.f) : 'transparent'}"></div><div class="lr"><span>эталон</span><span>2 : 3</span></div><div class="swatch" style="background:${mixColor(0.4)}"></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Дроби вам по зубам!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  common: '<rect x="8" y="8" width="50" height="14" rx="2" fill="#6b4429"/><rect x="8" y="8" width="37.5" height="14" rx="2" fill="#ffb547"/><path d="M20.5 8v14M33 8v14M45.5 8v14" stroke="#2b1a10" stroke-width="1.2"/>',
  decimal: Array.from({ length: 10 }, (_, c) => `<rect x="${18 + c * 3}" y="0" width="2.6" height="30" fill="${c < 7 ? '#ffb547' : '#1f2a40'}"/>`).join('') + '<rect x="39" y="22" width="2.6" height="8" fill="#ffb547"/>',
  percent: '<path d="M8 12h50M8 20h50" stroke="#a9b4c9" stroke-width="1"/><rect x="8" y="13" width="12.5" height="6" fill="#ffb547"/><rect x="20.5" y="13" width="37.5" height="6" fill="rgba(114,212,232,.4)"/><path d="M20.5 6v18" stroke="#e8ecf4" stroke-width="1.2"/>',
  ratio: '<rect x="8" y="10" width="10" height="14" fill="#2f62d0"/><rect x="48" y="10" width="10" height="14" fill="#f2c919"/><path d="M26 9l2 16h10l2-16z" fill="#5db446" stroke="#e8ecf4" stroke-width="1"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.d = L.d || 4; S.shade = Array(S.d).fill(false); S.cells = [];
  S.total = L.total || 24000; S.p = L.p === undefined ? 10 : L.p; S.b = L.b || 0; S.y = L.y === undefined ? 9 : L.y;
  save(); resetProps();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'common') now = `Плитка разрезана на ${m.d} равных долек, закрашено ${m.n}: дробь ${m.n}/${m.d}${gcd(m.n, m.d) > 1 && m.n ? ` (после сокращения ${m.n / gcd(m.n, m.d)}/${m.d / gcd(m.n, m.d)})` : ''}. Сверху образец 3/4. Сравнение с 3/4: ${m.n}/${m.d} ${cmpSign(m.n * 4, 3 * m.d)} 3/4.`;
  if (id === 'decimal') now = `Квадрат 10 × 10 (100 клеток). Закрашено ${m.k} клеток: ${m.k}/100 = ${decStr(m.k)} (${Math.floor(m.k / 10)} полных столбцов-десятых и ${m.k % 10} клеток-сотых, если закрашивать по порядку).`;
  if (id === 'percent') now = `Двойная шкала: целое ${money(m.total)} = 100 %. Маркер стоит на ${m.p} %, это ${money(m.part)}; остаток ${100 - m.p} % = ${money(m.rest)}. В задании цена была 24 000 ₸, стала 18 000 ₸.`;
  if (id === 'ratio') now = `Эталон: синей и жёлтой краски 2 : 3. В ведре синей ${m.b} стак., жёлтой ${m.y} стак., отношение ${m.b} : ${m.y}; цвет ${m.t === 0 ? 'пустое ведро' : m.same ? 'совпадает с эталоном' : m.f > 0.4 ? 'синее эталона' : 'желтее эталона'}.`;
  return [
    `Раздел: математика, 5 класс, «Дроби и проценты». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ к заданию: веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    common: 'Почему 2/4 и 1/2 — одна и та же дробь?', decimal: 'Чем 0,5 отличается от 0,05?',
    percent: 'Как быстро найти 10 % и 25 % от числа?', ratio: 'Почему от отношения зависит цвет, а не от количества краски?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
