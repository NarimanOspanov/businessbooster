<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8–9 и 11 класс: безусловные и условные рефлексы, инстинкты и научение, память и привычки, сон, внимание и стресс.">
<title>Поведение и высшая нервная деятельность</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Поведение</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const f3 = x => (Math.round(x * 1000) / 1000).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-behavior';
const pct = x => Math.round(x * 100) + ' %';
const clock = h => { const x = ((h % 24) + 24) % 24, hh = Math.floor(x + 1e-9), mm = Math.round((x - hh) * 60); return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
const hm = h => { const t = Math.max(0, Math.round(h * 60)); return `${Math.floor(t / 60)} ч ${String(t % 60).padStart(2, '0')} мин`; };
const C_BELL = '#72d4e8', C_FOOD = '#86e0a8', C_LINK = '#b48cff', C_ORANGE = '#ffb547', C_RED = '#ff8a73';

// ---------- lesson 1: Pavlov's conditioned reflex ----------
// one trial = 4 s of experiment time, played in 1,8 s
const TR = {
  pair: { name: 'Звонок + еда', sh: 'з+е', bell: [0, 2], food: [1, 4] },
  bell: { name: 'Только звонок', sh: 'з', bell: [0, 2.4], food: null },
  food: { name: 'Только еда', sh: 'е', bell: null, food: [1, 4] },
  back: { name: 'Еда, потом звонок', sh: 'е→з', bell: [2.6, 4], food: [0, 2.2] },
};
const TRK = ['pair', 'bell', 'food', 'back'];
const VOL = { q: { name: 'Тихий', a: 0.12 }, n: { name: 'Обычный', a: 0.25 }, l: { name: 'Громкий', a: 0.4 } };
const VOLK = ['q', 'n', 'l'];
const EXT = 0.3, TMS = 1800, TSEC = 4;
const GX0 = 304, GX1 = 504, GB = 226, GPD = 10;
const TLX0 = 74, TLX1 = 500, tlx = s => TLX0 + s / TSEC * (TLX1 - TLX0);

// ---------- lesson 2: instinct and learning ----------
const CARDS = [
  { a: 'Паук плетёт паутину', b: 'с первого раза, без примера', inn: true, why: 'паутину плетёт даже паучок, выросший в одиночку: программа поведения врождённая' },
  { a: 'Молодая птица осенью', b: 'впервые летит на юг', inn: true, why: 'время и направление первого перелёта у многих птиц заложены наследственно — молодые летят даже без взрослых' },
  { a: 'Детёныш млекопитающего', b: 'сразу ищет сосок и сосёт', inn: true, why: 'сосательный рефлекс врождённый — учиться ему некогда' },
  { a: 'Птенец кукушки', b: 'выталкивает яйца хозяев', inn: true, why: 'слепой птенец делает это в первые дни жизни, его никто не учил' },
  { a: 'Гусята ходят за Лоренцем,', b: 'которого увидели первым', inn: false, why: 'это импринтинг — научение: за кем ходить, гусёнок узнаёт из опыта в первые часы жизни' },

function memRun(reps) {
  const seg = [{ t0: 0, S: MEM_S0 }], steps = [];
  for (const d of [...reps].sort((a, b) => a - b)) {

    steps.push({ d, R, S0: c.S, S: Sn }); seg.push({ t0: d, S: Sn });
  }
  const R = t => { let c = seg[0]; for (const s of seg) if (s.t0 <= t + 1e-9) c = s; return Math.exp(-(t - c.t0) / c.S); };
  return { seg, steps, R, R30: R(30) };
}
const massedReps = n => Array.from({ length: n }, (_, i) => 0.02 * (i + 1));
function habRun() {
  const k = CUE[S.cue].k; let A = 0; const pts = [0];
  for (const d of S.habit) { A = d ? A + k * (1 - A) : Math.max(0, A - 0.01); pts.push(A); }
  return { A, pts, k, days: S.habit.length, miss: S.habit.filter(x => !x).length, done: S.habit.filter(x => x).length, need: Math.ceil(Math.log(0.2) / Math.log(1 - k)) };
}
function evening() {
  const segs = []; let t = 0, left = 90;
  while (left > 0) { const w = S.brk ? Math.min(25, left) : left; segs.push({ t0: t, t1: t + w, w: true }); t += w; left -= w; if (left > 0 && S.brk) { segs.push({ t0: t, t1: t + 5, w: false }); t += 5; } }
  const end = t, pings = S.notif ? PINGS.filter(p => p < end) : [];
  const pts = []; let sum = 0, n = 0;
  for (let m = 0; m <= end + 1e-9; m += 0.5) {
    const sg = segs.find(s => m >= s.t0 && m < s.t1) || segs[segs.length - 1];
    if (!sg.w) { pts.push([m, null]); continue; }
    let v = 0.95 - 0.006 * (m - sg.t0);
    for (const p of pings) if (p <= m) v *= 1 - 0.6 * Math.exp(-(m - p) / 4);

  }

}

}

const scene = $('#scene');

// The shared task card (lab-shell adds a «how to» button to it) covers the top-left of the stage.
// Scenes keep x < 180 empty above y ≈ 125 and everything empty above y ≈ 56; if the card still
// reaches the content, the content is shrunk a little and moved to the right of the card.
let VB = { x: 0, y: 0, w: 520, h: 405 };
let drag = null, dirty = true;
const taskCard = $('#stage .task');
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 520, hh / 412, 1.45);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 406 - VB.h;
  const cr = taskCard && taskCard.getBoundingClientRect();
  if (cr && cr.width && w > 600) {
    const R0 = cr.right - rc.left + 8, B0 = cr.bottom - rc.top + 6;
    const ru2 = VB.x + R0 / s, bu = VB.y + B0 / s;
    if ((bu > 124 && ru2 > 24) || (bu > 56 && ru2 > 180)) {
      // either beside the card (s1) or below it (s2) — whichever keeps the scene bigger
      const s1 = Math.min((w - R0) / 486, hh / 412, 1.45), s2 = Math.min(w / 520, (hh - B0) / 350, 1.45);
      if (s1 >= s2 && s1 >= s * 0.66) { s = s1; VB = { w: w / s, h: hh / s }; VB.x = 22 - R0 / s; VB.y = 406 - VB.h; }
      else if (s2 > 0) { s = s2; VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 406 - VB.h; }
    }
  }
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);
if (taskCard) new ResizeObserver(fit).observe(taskCard);

// ---------- pointer ----------
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (el.dataset.drag) { drag = { key: el.dataset.drag, x: e.clientX, y: e.clientY, moved: false }; scene.classList.add('grabbing'); }
  else drag = { hit: el.dataset.hit, x: e.clientX, y: e.clientY, moved: false };
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.key || !drag.moved) return;
  const p = toSvg(e), i = +drag.key.slice(3);
  const day = clamp(Math.round((p.x - RX0) / (RX1 - RX0) * 30), 1, 29);
  if (S.reps[i] !== day) { S.reps[i] = day; update(); }
  dirty = true;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (d.key && d.moved) update();
  if (cancel || d.moved || !d.hit) return;
  tap(d.hit);

scene.addEventListener('pointerup', () => endDrag(false));

function tap(id) {
  const L = LID();
  if (L === 'reflex') {
    const T = { bell: 'Звонок — условный раздражитель. Сам по себе он слюну не вызывает, пока не станет сигналом еды.', bowl: 'Миска с едой — безусловный раздражитель: слюна на еду во рту выделяется всегда.', cyl: 'В опытах Павлова слюну собирали по трубке и считали капли — так силу рефлекса можно измерить.', cortex: 'Временная связь в коре между слуховым и пищевым центрами. Её толщина — сила условного рефлекса.', graph: 'Каждый столбик — одна проба. Голубая часть — слюна на звонок до еды, зелёная — на еду.', timeline: 'Шкала времени одной пробы: когда звучит звонок, когда дают еду и когда капает слюна.', dog: 'Собака стоит в станке, чтобы опыт проходил спокойно и одинаково. Сегодня такие опыты проходят этическую проверку.', stand: 'Станок для опыта. Павлов добивался, чтобы ничто постороннее не отвлекало собаку.' }[id];
    if (T) toast(T);
  }
  if (L === 'instinct') {
    if (id.startsWith('card')) pickCard(+id.slice(4));
    else if (id === 'bin-inn') dropCard(true);
    else if (id === 'bin-lrn') dropCard(false);
    else if (id === 'obj') toast(`${IOBJ[S.obj].name}: первый движущийся объект, который увидят гусята.`);
    else if (id === 'icurve') toast('Готовность к импринтингу выше всего в первые сутки после вылупления, потом гусята начинают бояться незнакомого.');
    else if (id === 'nest') toast('Гнездо: здесь вылупились гусята.');
    else if (id === 'maze') runMouse();
    else if (id === 'cheese') toast(S.rew ? 'Сыр — награда. Она закрепляет верные повороты (закон эффекта Торндайка).' : 'Награды нет — мыши незачем запоминать путь.');
    else if (id === 'mgraph') toast('Кривая научения: время попытки падает, потому что мышь реже заходит в тупики.');
  }
  if (L === 'memory') {
    const T = { sens: 'Органы чувств приносят очень много информации, но в память попадает только то, на что обратили внимание.', stm: 'Кратковременная память: несколько элементов на секунды и минуты.', ltm: 'Долговременная память: годы. Туда переносит повторение, осмысление и сон.', curve: 'Кривая забывания: какая доля выученного ещё помнится.', hgraph: 'Автоматизм растёт быстро в начале и медленно потом — как кривая научения.', cal: 'Календарь: зелёные — выполнено, красные — пропуск.', cue: 'Подсказка — ситуация, после которой вы выполняете действие. Постоянная подсказка помогает привычке закрепиться.' }[id];
    if (T) toast(T);
  }
  if (L === 'sleep') {
    const T = { tl: 'Расписание вечера: уроки, экран в кровати, засыпание и сон до 7:00.', att: 'Внимание за уроками. Красные метки — уведомления, серые полосы — перерывы.', hyp: 'Гипнограмма: циклы сна по 90 минут, красным — быстрый сон.', person: 'При стрессе адреналин учащает пульс и дыхание: организм готовится действовать.', heart: 'Сердце бьётся с частотой пульса на графике.', hrg: 'Пульс быстро растёт и спадает, кортизол поднимается медленнее и держится дольше.' }[id];

function loop(t) {
  requestAnimationFrame(loop);
  let anim = false;
  const id = LID();
  if (id === 'reflex' && S.trial && S.trial.run) { anim = true; if (t - S.trial.t0 >= TMS) finishTrial(); }
  if (id === 'instinct') {
    if (S.imp && S.imp.run) { anim = true; if (t - S.imp.t0 >= IMS) finishImp(); }
    if (S.mrun && S.mrun.run) { anim = true; if (t - S.mrun.t0 >= S.mrun.dur) finishMouse(); }
  }
  if (id === 'sleep' && S.m4 === 'str') { if (!reduce) anim = true; if (S.str && S.str.run && t - S.str.t0 >= SMS) finishStress(); }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function act(a) {
  if (!a) return;
  if (a.startsWith('t-')) return runTrial(a.slice(2));
  if (a === 'rest') return restDay();
  if (a === 'reset') { resetLesson(); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('m2-')) return setMode('m2', a.slice(3));
  if (a === 's-inn') return dropCard(true);
  if (a === 's-lrn') return dropCard(false);
  if (a.startsWith('o-')) return setObj(a.slice(2));
  if (a === 'h-') return setHrs(S.hrs - 6);
  if (a === 'h+') return setHrs(S.hrs + 6);
  if (a === 'show') return showImp();
  if (a === 'run') return runMouse();
  if (a === 'rew') { S.rew = !S.rew; renderTools(); update(); return; }
  if (a === 'mnew') { S.mL = 0; S.runs = []; S.mrun = null; toast('Новая мышь ещё не знает лабиринта.'); update(); return; }
  if (a.startsWith('m3-')) return setMode('m3', a.slice(3));
  if (a === 'rep+') return addRep();
  if (a === 'rep-') return delRep();
  if (a === 'hd') return habAdd(1, true);
  if (a === 'hw') return habAdd(7, true);
  if (a === 'hs') return habAdd(1, false);
  if (a === 'cue-on' || a === 'cue-off') return setCue(a.slice(4));
  if (a === 'hclr') { S.habit = []; update(); return; }
  if (a.startsWith('m4-')) return setMode('m4', a.slice(3));
  if (a === 'bed-') return setBed(S.bed - 0.5);
  if (a === 'bed+') return setBed(S.bed + 0.5);
  if (a === 'scr') return setScr(SCR[(SCR.indexOf(S.scr) + 1) % SCR.length]);
  if (a === 'notif') { S.notif = !S.notif; renderTools(); update(); return; }
  if (a === 'brk') { S.brk = !S.brk; renderTools(); update(); return; }
  if (a.startsWith('c-')) { S.cope = a.slice(2); renderTools(); update(); return; }
  if (a === 'go') return goStress();
}

  }
  if (S.tab === 'parts') {
    const ttl = { reflex: 'Опыт Павлова', instinct: { sort: 'Формы поведения', imp: 'Импринтинг', maze: 'Проба и ошибка' }[S.m2], memory: S.m3 === 'curve' ? 'Память' : 'Привычка', sleep: S.m4 === 'eve' ? 'Сон и внимание' : 'Стресс' }[L.id];
    let h = `<h2>${ttl}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'reflex') h += `<h3>Два вида рефлексов</h3><div class="feat"><div style="border-left-color:${C_FOOD}"><b>Безусловные</b>Врождённые, есть у всех особей вида, постоянные, дуги через спинной мозг и ствол мозга.</div><div style="border-left-color:${C_BELL}"><b>Условные</b>Приобретённые, у каждого свои, могут угасать, вырабатываются при участии коры больших полушарий.</div></div>`;
    if (L.id === 'instinct') h += `<h3>Формы научения</h3><div class="feat"><div style="border-left-color:${C_ORANGE}"><b>Импринтинг</b>Быстрое запечатление в чувствительный период.</div><div style="border-left-color:${C_BELL}"><b>Условный рефлекс</b>Сигнал связывается с важным событием.</div><div style="border-left-color:${C_FOOD}"><b>Проба и ошибка</b>Закрепляется действие, после которого была награда.</div><div style="border-left-color:${C_LINK}"><b>Подражание</b>Перенимают поведение других особей.</div></div>`;
    if (L.id === 'memory') h += `<h3>Как учиться с пользой</h3><div class="feat"><div style="border-left-color:${C_ORANGE}"><b>Вспоминайте сами</b>Отвечать на вопросы и пересказывать полезнее, чем перечитывать.</div><div style="border-left-color:${C_FOOD}"><b>Повторяйте с растущими промежутками</b>Через день, через 3 дня, через неделю, через 2–3 недели.</div><div style="border-left-color:${C_BELL}"><b>Спите</b>Во сне выученное переходит в долговременную память.</div></div>`;
    if (L.id === 'sleep') h += `<h3>Спокойные экранные привычки</h3><div class="feat"><div style="border-left-color:${C_LINK}"><b>Час без экрана перед сном</b>Телефон заряжается не у кровати — так проще уснуть вовремя.</div><div style="border-left-color:${C_ORANGE}"><b>Режим «не беспокоить» за уроками</b>Проверяйте сообщения в перерывах, а не по каждому сигналу.</div><div style="border-left-color:${C_FOOD}"><b>Перерывы с движением</b>5 минут пройтись или размяться возвращают внимание лучше, чем ролики.</div></div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'reflex') {
    const a = VOL[S.vol].a;
    let h = `<h2>Как растёт временная связь</h2><div class="formula">V ← V + α · (1 − V)</div><p class="note">Модель Рескорлы — Вагнера (упрощённо). V — сила связи от 0 до 1, α — заметность сигнала (громкость звонка). Каждое подкрепление прибавляет часть того, что ещё осталось выучить.</p><div class="steps">` +
      step('Громкость звонка', `${VOL[S.vol].name}: α = ${ru(a, 2)}`) + step('Угасание без еды', `V ← V − ${ru(EXT, 1)} · V`) + step('Капли на звонок', `10 · V = ${m.drops}`, 'sum') + `</div>`;
    const n8 = Math.ceil(Math.log(1 - 0.75) / Math.log(1 - a));
    h += `<h3>Сколько сочетаний нужно</h3><div class="steps">` + step('Нужно V ≥ 0,75 (8 капель)', `1 − (1 − ${ru(a, 2)})ⁿ ≥ 0,75`) + step('Отсюда n', `≥ ${n8} сочетаний`, 'sum') + `</div>`;
    const rows = S.hist.filter(e => e.k !== 'rest').slice(-8);
    if (rows.length) h += `<h3>Последние пробы</h3><div class="steps">` + rows.map(e => step(TR[e.k].name, `на звонок ${e.pre} · V ${ru(e.V0, 2)} → ${ru(e.V, 2)}`)).join('') + `</div>`;
    h += `<p class="note" style="margin-top:8px">ИИ, обучаемый с подкреплением, обновляет свои оценки похожим правилом: новая оценка = старая + шаг × (что получили − что ожидали).</p>`;
    return h;
  }
  if (id === 'instinct') {
    if (S.m2 === 'sort') return `<h2>Ваши ответы</h2><div class="steps">` + CORDER.map(k => step(CARDS[k].a.replace(/,$/, '') + ' ' + CARDS[k].b, S.place[k] === undefined ? '?' : S.place[k] ? 'врождённое' : 'научение')).join('') + step('Ошибок', String(S.miss2), 'sum') + `</div>`;
    if (S.m2 === 'imp') return `<h2>Готовность к импринтингу</h2><div class="formula">g(t) = e^(−((t − 12) / 20)²)</div><p class="note">Упрощённая модель для гусят: t — часы после вылупления. Импринтинг удаётся, если g ≥ 0,5, то есть примерно до ${Math.round(IMP_END)} ч.</p><div class="steps">` +
      [0, 6, 12, 18, 24, 30, 36, 48, 72].map(hh => step(`${hh} ч`, `${ru(impS(hh), 2)} ${impS(hh) >= 0.5 ? '✓' : ''}`)).join('') + step('Сейчас', `${S.hrs} ч → ${ru(impS(S.hrs), 2)}`, 'sum') + `</div>`;
    const errs = Math.round(5 * (1 - S.mL));
    return `<h2>Кривая научения</h2><div class="formula">L ← L + k · (1 − L)</div><p class="note">L — насколько мышь выучила путь. С наградой k = 0,45, без награды k = 0,06. Тупиков в попытке: round(5 · (1 − L)).</p><div class="steps">` +
      step('Выучено L', ru(S.mL, 2)) + step('Тупиков в следующей попытке', String(errs)) + step('Путь без тупиков', `12 клеток × ${ru(MSTEP, 1)} с = 18 с`) + step('Каждый тупик', 'туда и обратно: +2–6 клеток') + `</div>` +
      (S.runs.length ? `<h3>Попытки</h3><div class="steps">` + S.runs.map((r, i) => step(`${i + 1}${r.rew ? '' : ' (без награды)'}`, `${ru(r.time, 0)} с, тупиков ${r.errs}`)).join('') + `</div>` : '');
  }
  if (id === 'memory') {
    if (S.m3 === 'curve') {
      const sp = m.sp;
      let h = `<h2>Кривая забывания</h2><div class="formula">R = e^(−t / S)</div><p class="note">R — доля, которую ещё помним, t — дни после повторения, S — прочность следа. После повторения S умножается на (1,6 + 3 · (1 − R)): чем больше успели забыть, тем сильнее растёт прочность.</p><div class="steps">` + step('Начальная прочность', `S = ${MEM_S0} сут`);
      sp.steps.forEach((s, i) => { h += step(`Повтор ${i + 1}, день ${s.d}`, `помнили ${pct(s.R)} → S = ${ru(s.S0, 1)} × ${ru(1.6 + 3 * (1 - s.R), 2)} = ${ru(s.S, 1)}`); });
      const last = sp.seg[sp.seg.length - 1];
      h += step('Через 30 дней', `e^(−${30 - last.t0} / ${ru(last.S, 1)}) = ${pct(sp.R30)}`, 'sum') + `</div>`;
      h += `<h3>Зубрёжка за один вечер</h3><div class="steps">` + step('Те же повторения подряд', `помнили ≈ 98 % → S × 1,66`) + step('Через 30 дней', pct(m.ms.R30), 'sum') + `</div>`;
      h += `<p class="note" style="margin-top:8px">Модель упрощённая, но главное в ней подтверждают исследования: распределённые повторения запоминаются прочнее, чем массированные.</p>`;
      return h;
    }
    const H = m.H;
    return `<h2>Как растёт автоматизм</h2><div class="formula">A ← A + k · (1 − A)</div><p class="note">Каждый выполненный день добавляет часть оставшегося пути. Пропуск отнимает совсем немного (−0,01). Похожую кривую получили Лалли и коллеги.</p><div class="steps">` +
      step('Подсказка', CUE[S.cue].name) + step('Скорость k', ru(H.k, 3)) + step('Дней до 80 %', `ln 0,2 ÷ ln(1 − ${ru(H.k, 3)}) ≈ ${H.need}`) + step('Отмечено дней', `${H.days} (пропусков ${H.miss})`) + step('Автоматизм сейчас', pct(H.A), 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">У реальных людей сроки очень разные — от 18 до 254 дней. Сложные привычки (спорт) формируются дольше простых (стакан воды за завтраком).</p>`;
  }
  const E = m.E;
  if (S.m4 === 'eve') return `<h2>Сколько сна остаётся</h2><div class="steps">` + step('Отбой', clock(S.bed)) + step('Экран в кровати', S.scr + ' мин') + step('Засыпание', `${E.lat} мин${S.scr ? ' (после экрана дольше)' : ''}`) + step('Уснул', clock(E.onset)) + step('Сон до 07:00', hm(E.sleep), 'sum') + step('Циклов по 90 мин', ru(E.sleep / 1.5, 1)) + `</div>` +
    `<h3>Внимание</h3><div class="formula">f = (0,95 − 0,006 · τ) · Π(1 − 0,6 · e^(−Δt / 4))</div><p class="note">τ — минуты без перерыва, Δt — минуты после уведомления. Модель упрощённая: показывает направление эффектов, а не точные числа.</p><div class="steps">` +
    step('Уроки', `90 мин работы${S.brk ? ' + 3 перерыва по 5 мин' : ''}`) + step('Уведомлений', String(E.pings.length)) + step('Среднее внимание', pct(E.att), 'sum') + `</div>`;
  const rec = recov(S.cope);
  return `<h2>Пульс после стресса</h2><div class="formula">P(t) = 75 + 40 · e^(−t / τ)</div><p class="note">После пика пульс спадает с постоянной времени τ. Медленное дыхание (вдох 4 с, выдох 6 с) усиливает парасимпатическую регуляцию, и τ меньше.</p><div class="steps">` +
    COPK.map(k => step(COPE[k].name, `τ = ${ru(COPE[k].tau, 1)} мин → до 85: ${ru(recov(k), 1)} мин`)).join('') + step('Сейчас выбрано', `${ru(rec, 1)} мин`, 'sum') + `</div>` +
    `<h3>Немного волнения — полезно</h3><p class="note">Умеренное возбуждение помогает собраться (закон Йеркса — Додсона: продуктивность сначала растёт с возбуждением, потом падает). Опасен не короткий стресс, а долгий, без сна и отдыха. Если тревога мешает жить неделями, стоит поговорить со взрослым, школьным психологом или врачом.</p>`;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'reflex') {
    el.innerHTML = `<div class="k">Временная связь</div><div class="v ${S.done.reflex ? 'ok' : ''}">${pct(m.V)}</div><div class="gauge"><b style="width:${(m.V * 100).toFixed(1)}%;background:${C_LINK}"></b></div>
      <div class="lr"><span>на звонок</span><span>${m.drops} кап.</span></div><div class="lr"><span>проб</span><span>${m.n}</span></div><div class="lr"><span>рефлекс / угас</span><span>${m.cr ? '✓' : '·'} ${m.ext ? '✓' : '·'}</span></div>`;
  } else if (m.kind === 'instinct') {
    el.innerHTML = `<div class="k">Три опыта</div><div class="v ${S.done.instinct ? 'ok' : ''}">${(m.sorted === 8) + m.imp + m.maze} / 3</div><div class="gauge"><b style="width:${((m.sorted === 8) + m.imp + m.maze) / 3 * 100}%"></b></div>
      <div class="lr"><span>разложено</span><span>${m.sorted}/8</span></div><div class="lr"><span>импринтинг</span><span>${m.imp ? '✓' : '·'}</span></div><div class="lr"><span>лабиринт</span><span>${m.maze ? '✓' : '·'}</span></div>`;
  } else if (m.kind === 'memory') {
    el.innerHTML = S.m3 === 'curve' ? `<div class="k">Через 30 дней</div><div class="v ${m.memOk ? 'ok' : 'bad'}">${pct(m.sp.R30)}</div><div class="gauge"><b style="width:${(m.sp.R30 * 100).toFixed(1)}%"></b></div><div class="lr"><span>за вечер</span><span>${pct(m.ms.R30)}</span></div><div class="lr"><span>повторений</span><span>${S.reps.length}</span></div><div class="lr"><span>привычка</span><span>${m.habOk ? '✓' : '·'}</span></div>`
      : `<div class="k">Автоматизм</div><div class="v ${m.habOk ? 'ok' : ''}">${pct(m.H.A)}</div><div class="gauge"><b style="width:${(m.H.A * 100).toFixed(1)}%"></b></div><div class="lr"><span>дней</span><span>${m.H.days}</span></div><div class="lr"><span>пропусков</span><span>${m.H.miss}</span></div><div class="lr"><span>память</span><span>${m.memOk ? '✓' : '·'}</span></div>`;
  } else {
    const n = m.sleepOk + m.attOk + m.strOk;
    el.innerHTML = `<div class="k">Цели вечера</div><div class="v ${S.done.sleep ? 'ok' : ''}">${n} / 3</div><div class="gauge"><b style="width:${(n / 3 * 100).toFixed(1)}%"></b></div>
      <div class="lr"><span>сон</span><span>${hm(m.E.sleep)}</span></div><div class="lr"><span>внимание</span><span>${pct(m.E.att)}</span></div><div class="lr"><span>стресс</span><span>${m.strOk ? '✓' : '·'}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, как устроено поведение!'), 1200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  reflex: '<path d="M6 24Q8 14 16 14L22 10Q28 10 28 16Q28 22 20 22L10 26Z" fill="#c8955f"/><path d="M38 6Q38 2 42 2Q46 2 46 6L48 9H36Z" fill="#ffb547"/><rect x="50" y="10" width="6" height="18" rx="1" fill="none" stroke="#9fd8ea"/><rect x="51" y="20" width="4" height="7" fill="#e8ecf4"/>',
  instinct: '<path d="M4 26H62" stroke="#3a4762" stroke-width="2"/><rect x="40" y="6" width="8" height="14" rx="2" fill="#5b7fd6"/><circle cx="44" cy="4" r="3" fill="#e0b48f"/><ellipse cx="14" cy="22" rx="4" ry="3" fill="#f2d45c"/><ellipse cx="24" cy="22" rx="4" ry="3" fill="#f2d45c"/><ellipse cx="32" cy="22" rx="4" ry="3" fill="#f2d45c"/>',
  memory: '<path d="M4 4Q10 20 20 22T62 26" stroke="#8b96ad" stroke-width="1.2" stroke-dasharray="3 2" fill="none"/><path d="M4 4Q8 12 12 14V4Q18 10 24 11V4Q34 7 42 8V4Q52 5 62 6" stroke="#ffb547" stroke-width="1.6" fill="none"/>',
  sleep: '<path d="M4 8H10V14H14V22H24V14H30V8H34V16H40V22H48V10H56V8" stroke="#72d4e8" stroke-width="1.4" fill="none"/><path d="M4 26L20 26L23 16L26 24L30 26H62" stroke="#e0555d" stroke-width="1.4" fill="none"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'reflex') {
    const last = S.hist.filter(e => e.k !== 'rest').slice(-5);
    now = `Опыт Павлова: собака в станке, над ней звонок, перед мордой миска, слюна по трубке капает в мерный цилиндр. Справа график капель по пробам (голубое — слюна на звонок, зелёное — на еду), фиолетовая линия — сила временной связи в коре. Снизу шкала времени одной пробы. Громкость звонка: ${VOL[S.vol].name.toLowerCase()}. Проб: ${m.n}, сила связи ${pct(m.V)}, на звонок без еды сейчас было бы ${m.drops} капель. Последние пробы: ${last.length ? last.map(e => `${TR[e.k].name.toLowerCase()} (на звонок ${e.pre})`).join(', ') : 'нет'}. Рефлекс выработан: ${m.cr ? 'да' : 'нет'}, угашен: ${m.ext ? 'да' : 'нет'}.`;
    guide = 'Не говори, сколько именно проб нужно. Спрашивай, в каком порядке должны идти звонок и еда, что будет, если звонить без еды, чем угасание отличается от забывания.';
  }
  if (id === 'instinct') {
    const mode = { sort: 'сортировка примеров поведения', imp: 'опыт с импринтингом', maze: 'мышь в лабиринте' }[S.m2];
    now = `Опыт на экране: ${mode}. Разложено ${m.sorted} из 8 карточек (ошибок ${S.miss2})${S.sel >= 0 && S.place[S.sel] === undefined ? `, выбрана карточка «${CARDS[S.sel].a} ${CARDS[S.sel].b}»` : ''}. Импринтинг: первым гусята увидят «${IOBJ[S.obj].name}», возраст гусят ${S.hrs} ч, готовность ${pct(m.ready)}; гусята за Лоренцем ${m.imp ? 'пошли' : 'пока не пошли'}. Лабиринт: попыток ${S.runs.length}, награда ${S.rew ? 'есть' : 'нет'}, в следующей попытке тупиков ${m.errs}; цель (быстрее 20 с) ${m.maze ? 'достигнута' : 'не достигнута'}.`;
    guide = 'Не называй ответ для карточки и нужные часы. Спрашивай: умеет ли животное это без примера с первого раза? Когда у гусят чувствительный период? Зачем мыши награда?';
  }
  if (id === 'memory') {
    now = S.m3 === 'curve' ? `Режим «Кривая забывания»: вверху схема памяти (органы чувств → кратковременная → долговременная), ниже кривые забывания на 30 дней. Повторения ученика: ${S.reps.length ? S.reps.map(r => 'день ' + r).join(', ') : 'нет'}. Через 30 дней помнит ${pct(m.sp.R30)} (нужно ≥ 80 %), если бы повторил столько же раз за один вечер — ${pct(m.ms.R30)}.`
      : `Режим «Привычка»: 10 минут чтения, подсказка ${CUE[S.cue].name}. Отмечено ${m.H.days} дней, пропусков ${m.H.miss}, автоматизм ${pct(m.H.A)} (нужно ≥ 80 % и хотя бы один пропуск). До 80 % без пропусков нужно около ${m.H.need} дней.`;
    now += ` Опыт с повторениями: ${m.memOk ? 'выполнен' : 'нет'}; привычка: ${m.habOk ? 'выполнена' : 'нет'}.`;
    guide = 'Не называй готовые дни повторений. Спрашивай, когда забывание самое быстрое, почему промежутки должны расти и что даёт постоянная подсказка привычке.';
  }
  if (id === 'sleep') {
    const E = m.E;
    now = `Режим «${S.m4 === 'eve' ? 'Вечер' : 'Стресс'}». План: уроки с 18:00 (90 мин${S.brk ? ', перерывы 25/5' : ', без перерывов'}), уведомления ${S.notif ? 'включены' : 'выключены'}, отбой ${clock(S.bed)}, экран в кровати ${S.scr} мин, уснул в ${clock(E.onset)}, сон ${hm(E.sleep)} (нужно ≥ 8 ч), среднее внимание ${pct(E.att)} (нужно ≥ 70 %). Стресс: выбран способ «${COPE[S.cope].name.toLowerCase()}»${S.strLast ? `, в последнем опыте пульс успокоился за ${ru(S.strLast.rec, 1)} мин` : ', опыт ещё не запускали'} (нужно меньше 3 мин).`;
    guide = 'Отвечай спокойно и без запугивания. Не называй сразу все настройки: спрашивай, что отнимает время сна, что мешает вниманию и какой способ быстрее всего успокаивает пульс. Если ученик пишет о сильной тревоге, мягко посоветуй поговорить со взрослым или школьным психологом.';
  }
  return [
    `Раздел: биология, 8–9 класс («Высшая нервная деятельность»), 11 класс («Поведение животных»). Тема «Поведение и высшая нервная деятельность». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { reflex: 'Почему звонок должен звучать раньше еды?', instinct: 'Чем инстинкт отличается от импринтинга?', memory: 'Почему повторять лучше с растущими промежутками?', sleep: 'Почему телефон в кровати отнимает сон?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
