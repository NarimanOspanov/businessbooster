<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10–11 класс: численность и плотность популяции, кривые роста J и S, r- и K-стратегии, хищник и жертва, закон Харди–Вайнберга.">
<title>Популяции</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* touch targets ≥ 40 px and ENT quiz in «Расчёты» */
.tools button{min-height:40px}
.chips button,.ghostbtn{min-height:40px}
.qz{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 13px;margin:0 0 10px}
.qz.ok{border-color:var(--ok)}
.qz .qn{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:8px}
.qz.ok .qn{color:var(--ok)}
.qz p{margin:0 0 10px;font-size:14px;line-height:1.5}
.qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qz .opts button{min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:500 13.5px/1.3 var(--font-body);color:var(--fg);cursor:pointer;text-align:left}
.qz .opts button[aria-pressed="true"].bad{border-color:var(--warn);color:var(--warn)}
.qz .opts button[aria-pressed="true"].good{border-color:var(--ok);color:var(--ok)}
.qz .fb{margin-top:8px;font-size:13px;line-height:1.45;color:var(--muted)}
.qz.ok .fb{color:var(--fg)}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 8px;font-size:12px}
  .qz .opts{grid-template-columns:1fr}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Популяции</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-pop';
const T = (x, y, s, size, fill, extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const fmtN = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const dec = (x, d = 2) => x.toFixed(d).replace('.', ',');

// ---------- biology data ----------
// Lesson 1: voles on an island of 50 ha, growth with and without limits
const AREA = 50, N0 = 10, TMAX = 40, GOAL_D = 4;
// Lesson 2: r- and K-strategists
const SPEC = [
  { id: 'sar', name: 'Саранча', s: 'r', sh: 'сотни яиц, без заботы', d: 'сотни яиц за лето, о потомстве не заботится, живёт несколько месяцев' },
  { id: 'pol', name: 'Полёвка', s: 'r', sh: '5–7 помётов в год', d: 'до 5–7 помётов в год по 5–8 детёнышей, живёт около года' },
  { id: 'odu', name: 'Одуванчик', s: 'r', sh: 'тысячи семян', d: 'тысячи лёгких семян, быстро занимает пустые места' },
  { id: 'kom', name: 'Комар', s: 'r', sh: 'сотни яиц, живёт недели', d: 'сотни яиц, личинки растут сами, взрослый живёт недели' },
  { id: 'slon', name: 'Слон', s: 'K', sh: '1 детёныш раз в 4–5 лет', d: 'один детёныш раз в 4–5 лет, мать кормит его годами, живёт 60–70 лет' },
  { id: 'berk', name: 'Беркут', s: 'K', sh: '1–2 птенца, долгая забота', d: '1–2 птенца в год, родители долго их выкармливают, живёт 20–30 лет' },
  { id: 'bars', name: 'Снежный барс', s: 'K', sh: '2–3 котёнка раз в 2 года', d: '2–3 котёнка раз в 2 года, мать учит их охоте почти 2 года' },

// ---------- lesson 1 model ----------
const lastN = () => S.hist[S.hist.length - 1];
function growStep() {
  const N = lastN();
  const n2 = S.lim ? N + S.r * N * (1 - N / S.K) : Math.min(N * (1 + S.r), 1e7);
  S.hist.push(n2);
}
function simReset() { S.hist = [N0]; S.run = false; S.ended = false; }
function startRun() {
  if (S.hist.length - 1 >= TMAX) simReset();

  if (reduce) { while (S.hist.length - 1 < TMAX) growStep(); endRun(); }

}
function endRun() {
  S.run = false; S.ended = true;

  if (!S.lim) toast(`J-образная кривая: без ограничений полёвок стало ${N > 1e6 ? 'больше миллиона' : fmtN(N)}. Столько остров не прокормит — в природе после такого взлёта начинается резкий спад.`);
  else if (S.K !== AREA * GOAL_D) toast(`S-образная кривая: рост остановился на N ≈ K = ${S.K}. Плотность ${dec(S.K / AREA, 1)} особи/га, а нужно ${GOAL_D}.`);

}

// ---------- lesson 2 model ----------
function lvReset() { S.lv = { t: 0, H: LV.H0, L: LV.L0, hist: [[0, LV.H0, LV.L0]], run: false, hunt: false, Hh: 0, seen: false, last: 0 }; }
function lvDeriv(H, L, hunt) {
  return [LV.a * H * (1 - H / LV.Kh) - LV.b * H * L, LV.d * H * L - (LV.g + (hunt ? LV.hunt : 0)) * L];
}
function lvAdvance(dt) {
  const v = S.lv, h = 0.02;
  let n = Math.max(1, Math.round(dt / h));
  while (n-- > 0 && v.t < LV.TEND) {
    const k1 = lvDeriv(v.H, v.L, v.hunt), k2 = lvDeriv(v.H + h / 2 * k1[0], v.L + h / 2 * k1[1], v.hunt);
    const k3 = lvDeriv(v.H + h / 2 * k2[0], v.L + h / 2 * k2[1], v.hunt), k4 = lvDeriv(v.H + h * k3[0], v.L + h * k3[1], v.hunt);
    v.H = Math.max(0, v.H + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]));
    v.L = Math.max(0, v.L + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]));
    v.t += h;
    const lp = v.hist[v.hist.length - 1];
    if (v.t - lp[0] >= 0.25) v.hist.push([v.t, v.H, v.L]);
  }
  if (v.hunt && !v.seen && v.H >= Math.max(v.Hh * 1.5, v.Hh + 40)) {
    v.seen = true;
    toast(`Рысей почти не осталось — зайцев стало ${Math.round(v.H)} вместо ${Math.round(v.Hh)}. Их рост теперь сдерживает только корм.`);
    update();
  }
  if (v.t >= LV.TEND) { v.run = false; renderTools(); update(); }
}
function lvPlay() {
  const v = S.lv;
  if (v.t >= LV.TEND) lvReset();
  S.lv.run = !S.lv.run; S.lv.last = performance.now();
  if (reduce && S.lv.run) { lvAdvance(LV.TEND); }
  renderTools(); update();
}
function lvHunt() {
  const v = S.lv;
  v.hunt = !v.hunt;
  if (v.hunt) {
    v.L = Math.max(0.5, v.L * 0.1); v.Hh = v.H; v.huntT = v.t;
    if (!v.run && v.t < LV.TEND) { v.run = true; v.last = performance.now(); }
    toast('Охотники отстреляли 90% рысей и продолжают охоту. Следите за зайцами.');
  } else { v.L = Math.max(v.L, 2); toast('Охота остановлена. Из соседнего леса пришли несколько рысей — они снова начнут размножаться.'); }

}
function setMode(md) { S.mode = md; S.sel = -1; if (md === 'lv' && !S.lv.run && S.lv.t === 0) toast('Нажмите «▶», чтобы запустить модель, а потом «Охота».'); renderTools(); buildScheme(); update(); }
function placeSp(i, where) {
  S.bin[i] = where; S.sel = -1; S.look = i;
  const all = S.bin.every(b => b), ok = SPEC.filter((s, k) => S.bin[k] === s.s).length;

  update();
}

// ---------- lesson 3 model ----------
const hwCounts = q => { const p = 1 - q, aa = Math.round(q * q * HERD), AA = Math.round(p * p * HERD); return { AA, Aa: HERD - AA - aa, aa }; };
function genotypeOf(k) { // k = sheep index on the grid
  const c = hwCounts(S.q), r = PERM.indexOf(k);
  return r < c.aa ? 'aa' : r < c.aa + c.Aa ? 'Aa' : 'AA';
}
function setQ(v) {
  S.q = clamp(Math.round(v * 20) / 20, 0.05, 0.95); S.qStart = S.q; S.gens = [S.q]; S.idealGens = 0; S.brokenGens = 0; S.pick = -1;
  const c = hwCounts(S.q);
  if (Math.abs(S.q - GOAL_Q) < 1e-9) toast(`В модели ${c.aa} чёрных — как в стаде. Теперь выведите поколения.`);
  renderTools(); update();
}
function binom(n, p) { let k = 0; for (let i = 0; i < n; i++) if (Math.random() < p) k++; return k; }
function nextQ(q, c) {
  if (c === 'small') return binom(20, q) / 20;

  if (d.kind[0] === 'c') {
    const i = +d.kind.slice(1);
    if (!d.moved) { S.sel = S.sel === i ? -1 : i; S.look = i; update(); return; }
    const z = zoneAt({ x: d.px + d.dx + CW / 2, y: d.py + d.dy + CH / 2 });
    if (z === 'r' || z === 'K') placeSp(i, z); else if (z === 'pool') { S.bin[i] = null; S.sel = -1; update(); } else dirty = true;
    return;
  }
  if (d.moved) return;
  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function tap(id) {
  const L = LID();
  if (L === 'growth') {
    if (id === 'cell') toast(`Одна клетка — 1 гектар. Сейчас в среднем ${dec(model().D, 1)} полёвки на клетку — это и есть плотность.`);
    if (id === 'graph') toast(S.lim ? 'S-кривая: медленный старт, быстрый рост, потом плато у ёмкости среды K.' : 'Без ограничений рост ускоряется — J-образная кривая.');
  }
  if (L === 'strat') {
    if (id.startsWith('bin-')) { if (S.sel >= 0) placeSp(S.sel, id.slice(4)); else toast('Сначала нажмите на вид, потом на колонку.'); }
    if (id === 'lvgraph') toast('Пик рысей наступает позже пика зайцев: хищникам нужно время, чтобы размножиться на обильной добыче.');
  }
  if (L === 'hw') {
    if (id.startsWith('sh-')) {
      const k = +id.slice(3), g = genotypeOf(k); S.pick = k;
      toast(g === 'aa' ? 'Чёрная овца: генотип точно aa — рецессивный признак проявляется только у гомозигот.' : S.showG ? `Белая овца с генотипом ${g}${g === 'Aa' ? ' — скрытый носитель аллеля a' : ''}.` : 'Белая овца: генотип AA или Aa — по шерсти не различить. Носителей считают по формуле 2pq.');
      dirty = true;
    }
    if (id === 'punnett') toast('Площадь клетки — вероятность генотипа: гамета A встречается с вероятностью p, гамета a — с вероятностью q.');
  }
}

function loop(t) {
  requestAnimationFrame(loop);
  const id = LID();
  if (id === 'growth' && S.run && t - S.tStep >= 160) { S.tStep = t; growStep(); if (S.hist.length - 1 >= TMAX) endRun(); else { renderMeter(model()); refreshLive(); } dirty = true; }
  if (id === 'strat' && S.lv.run) { const dt = Math.min(0.2, (t - S.lv.last) / 1000) * 4; S.lv.last = t; lvAdvance(dt); renderMeter(model()); dirty = true; }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

  }
  if (id === 'strat') {
    return `<h2>Две стратегии</h2><div class="feat"><div style="border-left-color:#ffb547"><b>r-стратегия</b>Много мелкого потомства, нет заботы, ранняя зрелость, короткая жизнь. Численность скачет: J-кривая, взлёты и спады. Бактерии, насекомые, грызуны, однолетние сорняки.</div>` +
      `<div style="border-left-color:#72d4e8"><b>K-стратегия</b>Мало крупного потомства, долгая забота, поздняя зрелость, долгая жизнь. Численность держится около ёмкости среды: S-кривая. Крупные млекопитающие, хищные птицы, человек.</div></div>` +
      `<h3>Хищник и жертва сейчас</h3><div class="steps">` + step('Год', dec(S.lv.t, 0)) + step('Зайцы', String(Math.round(S.lv.H))) + step('Рыси', String(Math.round(S.lv.L))) +
      step('Охота на рысей', S.lv.hunt ? 'идёт' : 'нет') + step('Сортировка видов', `верно ${m.right} из ${SPEC.length}`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:10px">Модель Лотки — Вольтерры: прирост зайцев падает, когда рысей много, а прирост рысей растёт, когда много зайцев. Поэтому графики колеблются со сдвигом.</p>`;
  }
  return `<h2>Расчёт по Харди–Вайнбергу</h2><div class="formula">p + q = 1<br>p² + 2pq + q² = 1</div><div class="steps">` +
    step('Доля чёрных (aa) = q²', `${m.c.aa} / ${HERD} = ${dec(m.c.aa / HERD)}`) + step('q = √(доля aa)', `√${dec(m.q * m.q)} = ${dec(m.q)}`) + step('p = 1 − q', dec(m.p)) +
    step('AA = p²', `${dec(m.p * m.p)} → ${m.c.AA} овец`) + step('Aa = 2pq (носители)', `${dec(2 * m.p * m.q)} → ${m.c.Aa} овец`) + step('aa = q²', `${dec(m.q * m.q)} → ${m.c.aa} овец`, 'sum') + `</div>` +
    `<p class="note" style="margin-top:10px">Условия идеальной популяции: очень много особей, свободное скрещивание, нет мутаций, отбора и миграций.</p>`;
}
function refreshLive() { const el = $('#calcLive'); if (el && !$('#pane-calc').hidden) el.innerHTML = liveCalc(model()); }
function buildCalc() { $('#pane-calc').innerHTML = `<div id="calcLive"></div><div id="calcQuiz"></div>`; bindQuiz(); }

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    const h = `<h2>${L.id === 'growth' ? 'Что на столе' : L.id === 'strat' ? 'Виды и модель' : 'Стадо и генофонд'}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').innerHTML = h;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      if (LID() === 'strat') { const want = ['hare', 'lynx'].includes(id) ? 'lv' : 'sort'; if (S.mode !== want) setMode(want); }
      S.hl = { id, t: performance.now() }; dirty = true;
    });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') { if (!$('#calcQuiz')) buildCalc(); $('#calcLive').innerHTML = liveCalc(m); }
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'growth') {
    const ok = m.lim && m.K === AREA * GOAL_D && m.finished;
    el.innerHTML = `<div class="k">Плотность</div><div class="v ${ok ? 'ok' : m.N > 1e6 ? 'bad' : ''}">${m.N > 1e6 ? '> 20 000' : dec(m.D, 1)} /га</div>
      <div class="gauge"><b style="width:${(m.t / TMAX * 100).toFixed(0)}%"></b></div>
      <div class="lr"><span>N</span><span>${m.N > 1e6 ? '> 10⁶' : fmtN(m.N)}</span></div><div class="lr"><span>K</span><span>${m.lim ? S.K : '∞'}</span></div>`;
  } else if (m.kind === 'strat') {
    if (S.mode === 'sort') {
      const lk = S.look >= 0 ? SPEC[S.look] : null;
      el.innerHTML = `<div class="k">Сортировка</div><div class="v ${m.sortOk ? 'ok' : ''}">${m.placed} / ${SPEC.length}</div>
        <div class="gauge"><b style="width:${(m.placed / SPEC.length * 100).toFixed(0)}%"></b></div>` + (lk ? `<div class="lr"><span>${lk.sh}</span></div>` : `<div class="lr"><span>нажмите вид</span></div>`);
    } else {
      el.innerHTML = `<div class="k">Год ${dec(S.lv.t, 0)}</div><div class="v" style="color:#ffb547">зайцы ${Math.round(S.lv.H)}</div><div class="v" style="color:#c99ae8;margin-top:4px">рыси ${Math.round(S.lv.L)}</div>
        <div class="lr"><span>охота</span><span>${S.lv.hunt ? 'идёт' : 'нет'}</span></div>`;
    }
  } else {
    el.innerHTML = `<div class="k">Частота a (q)</div><div class="v ${m.matched ? 'ok' : ''}">${dec(m.q)}</div>
      <div class="gauge"><b style="width:${(m.q * 100).toFixed(0)}%;background:#ffb547"></b></div>
      <div class="lr"><span>чёрных</span><span>${m.c.aa} / ${BLACK}</span></div><div class="lr"><span>поколений</span><span>${m.gens}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались в популяциях!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  growth: '<path d="M4 26H62" stroke="#56627d" stroke-width="1.2"/><path d="M6 25Q22 24 30 14T60 6" stroke="#72d4e8" stroke-width="2" fill="none"/><path d="M6 25Q30 24 38 3" stroke="#ffb547" stroke-width="1.6" fill="none" opacity=".8"/><path d="M6 6H62" stroke="#86e0a8" stroke-dasharray="3 3" stroke-width="1"/>',
  strat: '<path d="M4 18Q12 4 20 18T36 18T52 18T64 16" stroke="#ffb547" stroke-width="2" fill="none"/><path d="M4 24Q14 24 20 16T36 20T52 14T64 18" stroke="#c99ae8" stroke-width="2" fill="none"/>',
  hw: '<rect x="18" y="3" width="16" height="16" fill="#3d6a4a"/><rect x="34" y="3" width="12" height="16" fill="#7a5a2a"/><rect x="18" y="19" width="16" height="9" fill="#7a5a2a"/><rect x="34" y="19" width="12" height="9" fill="#3a3f4a"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  buildCalc();
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += cr.left - sr.left - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'growth') {
    now = `Остров площадью ${AREA} га (50 клеток по 1 га), на нём полёвки, в начале ${N0} особей. Справа график численности N по поколениям (0–${TMAX}). ` +
      `Ограничения среды: ${S.lim ? `включены, ёмкость среды K = ${S.K} (плато при плотности ${dec(S.K / AREA, 1)} особи/га), рост по формуле ΔN = r·N·(1 − N/K) — S-образная кривая` : 'выключены, рост ΔN = r·N — J-образная кривая'}. Скорость роста r = ${dec(S.r, 1)}. ` +
      `Сейчас поколение ${m.t} из ${TMAX}, численность ${m.N > 1e6 ? 'больше миллиона' : Math.round(m.N)}, плотность ${m.N > 1e6 ? 'огромная' : dec(m.D, 1) + ' особи/га'}${m.finished ? ', рост завершён' : m.run ? ', рост идёт' : ''}. ` +
      `Цель: включить ограничения, подобрать K так, чтобы плато было при плотности ${GOAL_D} особи/га, и довести рост до конца. Кнопки: «Ограничения», «K −», «K +» (шаг 25), «▶ Рост».`;
    guide = `Не называй нужное значение K. Спроси, как связаны плотность, численность и площадь, и чему равна численность на плато S-кривой. Если ученик путает кривые — попроси сравнить график с ограничениями и без. Для метода мечения напомни пропорцию R/C = M/N.`;
  }
  if (id === 'strat') {
    now = `Два режима. Сортировка: восемь видов (${SPEC.map(s => `${s.name} — ${s.d}`).join('; ')}) нужно разложить в колонки r-стратегов и K-стратегов. ` +
      `Сейчас ученик разложил: ${SPEC.map((s, i) => `${s.name} — ${S.bin[i] ? S.bin[i] : 'не разложен'}`).join('; ')}. Верно ${m.right} из ${SPEC.length}. ` +
      `Модель «Заяц и рысь» (Лотка — Вольтерра с пределом корма для зайцев ${LV.Kh}): год ${dec(S.lv.t, 0)}, зайцев ${Math.round(S.lv.H)}, рысей ${Math.round(S.lv.L)}, охота на рысей ${S.lv.hunt ? 'идёт' : 'не идёт'}, модель ${S.lv.run ? 'работает' : 'на паузе'}. На экране режим «${S.mode === 'sort' ? 'Виды' : 'Заяц и рысь'}». ` +
      `Опыт с охотой и ростом зайцев ${S.lv.seen ? 'проведён' : 'ещё не проведён'}. Цель: всё разложить верно и увидеть в модели, что после отстрела рысей зайцев становится больше.`;
    guide = 'Не говори, в какую колонку класть конкретный вид. Спрашивай, сколько потомства у вида, заботятся ли о нём, сколько вид живёт. Для модели спроси, кто ограничивает численность зайцев и что будет, если этот фактор убрать; почему пик рысей запаздывает за пиком зайцев.';
  }
  if (id === 'hw') {
    now = `Стадо из ${HERD} овец, чёрная шерсть — рецессивный признак aa, белые овцы — AA или Aa (по виду не различить${S.showG ? ', сейчас генотипы показаны подписями' : ''}). В реальном стаде ${BLACK} чёрных. ` +
      `Ученик задал частоту аллеля a q = ${dec(S.qStart)}; сейчас q = ${dec(m.q)}, p = ${dec(m.p)}; в модели AA ${m.c.AA}, Aa ${m.c.Aa}, aa ${m.c.aa}. Справа решётка генофонда с площадями p², 2pq, q². ` +
      `Условия: ${COND[S.cond].short}. Выведено поколений: ${m.gens}, из них в идеальных условиях при подобранном q: ${S.idealGens}, с нарушением после этого: ${S.brokenGens}. Частоты q по поколениям: ${S.gens.map(g => dec(g)).join(', ')}. ` +
      `Цель: подобрать q так, чтобы чёрных было ${BLACK}, вывести 3 поколения в идеальных условиях (частоты не меняются), затем нарушить любое условие (мало особей, отбор, мутации, миграция) и вывести поколение.`;
    guide = 'Не называй нужное значение q. Спроси, какая доля стада чёрная и какой формулой эта доля выражается через q. Если ученик не понимает, почему частоты не меняются, попроси посмотреть на решётку: гаметы встречаются случайно. Объясни, какое условие идеальной популяции нарушает каждый режим.';
  }
  return [
    `Раздел: биология, 10–11 класс, раздел «Экология», тема «Популяции». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Задачи ЕНТ в разделе «Расчёты»: ${QUIZ[id].map((z, i) => `${i + 1}) ${z.q} ${S.qz[id] && S.qz[id][i] === z.a ? '(решена)' : '(не решена)'}`).join(' ')}`,
    `Для тьютора: ${guide} Не называй ответы задач из «Расчётов» — веди вопросами.`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    growth: 'Почему в природе J-образный рост не длится долго?', strat: 'Почему у снежного барса так мало детёнышей, а он не вымирает?',
    hw: 'Как посчитать носителей, если больных 1 на 10 000?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
