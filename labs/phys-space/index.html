<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 9 класс: первая и вторая космические скорости, орбиты спутников, невесомость и перегрузки, как взлетает ракета.">
<title>Космос: спутники и невесомость</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">

      <div class="prog" aria-label="Прогресс"><b>Космос</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов о космосе: пушка на горе, спутник на орбите, лифт с весами, ракета. Детали можно нажимать, спутник — тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>

      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>

      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const big = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');   // 20 200
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', TAU = Math.PI * 2;

const LESSONS = [
  { id: 'cosmic', title: 'Первая космическая скорость',
    text: ['Ньютон придумал мысленный опыт: на вершине очень высокой горы, выше воздуха, стоит пушка и стреляет горизонтально. Чем больше скорость ядра, тем дальше оно улетает, прежде чем упасть. Но Земля круглая: пока ядро летит, поверхность под ним тоже «уходит вниз».',
           'При некоторой скорости ядро опускается ровно настолько, насколько изгибается поверхность, и летит вокруг Земли, не приближаясь к ней. Это первая космическая скорость. Тяготение сообщает ядру центростремительное ускорение: g = v² / R, отсюда v₁ = √(gR) = √(9,8 м/с² · 6 400 000 м) ≈ 7,9 км/с. Один виток у самой Земли занимает около 85 минут.',
           'Если скорость больше, ядро летит по вытянутому эллипсу, уходит выше горы, но всё равно возвращается. При скорости ≈ 11,2 км/с — второй космической, v₂ = √2 · v₁ — тяготение уже не может вернуть тело, и оно навсегда уходит от Земли. До такой скорости разгоняют аппараты, летящие к Луне, Марсу и другим планетам.'],
    why: 'Каждый спутник связи, навигации и наблюдения Земли летит со скоростью около первой космической — иначе он упал бы. Межпланетные зонды и корабли к Луне и Марсу разгоняют почти до второй космической. Скорости и траектории рассчитывают специалисты по орбитальной механике и аналитики космических миссий. В ближайшие годы программы с ИИ будут перебирать тысячи вариантов траекторий за минуты, но выбрать надёжный, проверить расчёт и решить, сколько топлива оставить в запасе, по-прежнему будет человек, который понимает, откуда берутся 7,9 и 11,2 км/с.',
    task: 'Выстрелите из пушки так, чтобы ядро упало на Землю. Затем найдите скорость, при которой ядро облетит Землю по окружности на одной высоте и вернётся к горе. Наконец, разгоните ядро так, чтобы оно навсегда улетело от Земли.',
    hint: 'Скорость меняется кнопками внизу или ползунком на вкладке «Схема», выстрел — «Огонь» или нажатие на пушку. Воздуха нет. Гора нарисована намного выше настоящей: ядро стартует с её вершины, на которой v₁ = 7,9 км/с.',
    stage: 'Нажмите на пушку — выстрел.',
    check: m => m.fell && m.orbit && m.esc },

const LS_KEY = 'luch-phys-space';
let saved = {};

const idx0 = typeof saved.lesson === 'string' ? LESSONS.findIndex(l => l.id === saved.lesson) : (saved.lesson | 0);

// ---------- physics data ----------
const G0 = 9.8, RKM = 6400, GM = 4e14, CL = 3e5;          // g, радиус Земли (км), GM (м³/с²), скорость света (км/с)
const V1 = 7.9, V2 = 11.2, T1MIN = TAU * RKM / V1 / 60;    // 7,9 км/с; виток у Земли ≈ 85 мин
const orb = h => { const r = (RKM + h) * 1000, v = Math.sqrt(GM / r); return { r, v, T: TAU * r / v }; };   // м, м/с, с

const U = 3.3, DV_ORB = 9.4;
// ракета: массы в тоннах

}

// ---------- lesson 1: Newton's cannon (normalized units: GM = 1, вершина горы r = 1, v₁ = 1) ----------
const C1 = { cx: 260, cy: 262, S: 116, RE: 0.9 };
const p1 = (x, y) => [C1.cx + x * C1.S, C1.cy - y * C1.S];
function fire() {
  if (S.cur) return;
  const vn = S.v / V1;
  S.cur = { v: S.v, x: 0, y: 1, vx: vn, vy: 0, t: 0, th: 0, aPrev: 0, acc: 0, pts: [[0, 1]] };
  update();
}
function step1(dt) {
  const c = S.cur; if (!c) return;
  const r0 = Math.hypot(c.x, c.y);
  let rem = dt * 1.5 * Math.max(1, r0 * r0 * 1.2);
  const H = 0.0025;
  while (rem > 1e-9) {
    const hh = Math.min(H, rem); rem -= hh;
    let r3 = Math.pow(c.x * c.x + c.y * c.y, 1.5);
    c.vx -= c.x / r3 * hh / 2; c.vy -= c.y / r3 * hh / 2;
    c.x += c.vx * hh; c.y += c.vy * hh;
    r3 = Math.pow(c.x * c.x + c.y * c.y, 1.5);
    c.vx -= c.x / r3 * hh / 2; c.vy -= c.y / r3 * hh / 2;
    c.t += hh;
    const a = Math.atan2(c.x, c.y); let da = a - c.aPrev; if (da < -Math.PI) da += TAU; if (da > Math.PI) da -= TAU; c.th += da; c.aPrev = a;
    c.acc += hh; if (c.acc >= 0.02) { c.acc = 0; c.pts.push([c.x, c.y]); }
    const r = Math.hypot(c.x, c.y);
    if (r < C1.RE) { const k = C1.RE / r; c.x *= k; c.y *= k; c.pts.push([c.x, c.y]); return finish1('fell'); }
    if (c.th >= TAU - 1e-3) { c.pts.push([0, Math.hypot(c.x, c.y)]); return finish1(Math.abs(c.v - V1) < 0.051 ? 'orbit' : 'ellipse'); }
    if (r > 3.1) { const E = (c.vx * c.vx + c.vy * c.vy) / 2 - 1 / r; c.pts.push([c.x, c.y]); return finish1(E >= 0 ? 'esc' : 'far'); }
  }
}
const ellA = vn => 1 / (2 - vn * vn);                     // большая полуось при старте с r = 1
function finish1(res) {
  const c = S.cur; S.cur = null;

  const shot = { v: c.v, res, pts: c.pts, th: c.th, min };
  S.shots.push(shot); if (S.shots.length > 6) S.shots.shift();
  const vs = fmt(c.v, 1);
  if (res === 'fell') { const km = c.th * RKM; if (!S.fell) S.fell = shot; toast(`${vs} км/с: ядро упало в ${big(Math.round(km / 10) * 10)} км от горы через ${nf(Math.round(min))} мин.` + (c.v < 7 ? ' Чем больше скорость, тем дальше оно улетает.' : '')); }
  if (res === 'orbit') { S.orbit = shot; toast(`${vs} км/с: ядро облетело Землю на одной высоте за ${Math.round(min)} мин и вернулось к горе. Это первая космическая скорость!`); }
  if (res === 'ellipse') toast(c.v > V1 ? `${vs} км/с: ядро ушло выше горы по эллипсу и вернулось через ${Math.round(min)} мин. По окружности оно летит только при одной скорости.` : `${vs} км/с: ядро облетело Землю, опустившись ниже вершины, — тоже эллипс. Для окружности нужна чуть большая скорость.`);
  if (res === 'far') { const a = ellA(c.v / V1), hrs = TAU * Math.pow(a, 1.5) * T1MIN / TAU / 60; toast(`${vs} км/с: ядро ушло далеко по вытянутому эллипсу и вернётся только через ≈ ${hrs > 48 ? Math.round(hrs / 24) + ' сут' : Math.round(hrs) + ' ч'}. Ещё чуть быстрее — и не вернётся совсем.`); }
  if (res === 'esc') { S.esc = shot; toast(`${vs} км/с: тяготение не может вернуть ядро — оно уходит от Земли навсегда. Это вторая космическая скорость (≈ 11,2 км/с).`); }
  buildScheme(); update();
}
const RES_COL = { fell: '#ff8a73', orbit: '#86e0a8', ellipse: '#72d4e8', far: '#c9a2ff', esc: '#ffd166' };

const C2 = { cx: 260, cy: 238, RE: 40, K: 112 };

             : `h = ${big(h)} км: сигнал туда и обратно идёт ${fmt(ms, 0)} мс — для видеозвонков и игр это заметная задержка. Нужна низкая орбита.`;

             : h < 18000 ? `h = ${big(h)} км: каждый спутник видно лишь с небольшого участка Земли — для навигации их понадобились бы сотни. Поднимите орбиту.`
                         : `h = ${big(h)} км: слишком высоко — сигнал слабее, а геостационарные спутники висят над экватором и плохо видны у полюсов. Навигации нужна средняя орбита.`;

// ---------- lesson 3: elevator with a scale ----------
const C3 = { x: 330, w: 108, ch: 98, base: 378, px: 12.4, top: 20 };
function plan(to) {
  const d = to - S.y, s = Math.sign(d), D = Math.abs(d), A = 2, VM = 4;
  if (D < 0.3) return null;
  if (D >= VM * VM / A) return [{ a: s * A, dur: VM / A }, { a: 0, dur: (D - VM * VM / A) / VM }, { a: -s * A, dur: VM / A }];
  const t = Math.sqrt(D / A); return [{ a: s * A, dur: t }, { a: -s * A, dur: t }];
}
function startProg(kind) {

  if (kind === 'up') { ph = plan(C3.top); if (!ph) return toast('Кабина уже наверху. Попробуйте «Вниз» или «Свободное падение».'); }
  if (kind === 'down') { ph = plan(0); if (!ph) return toast('Кабина уже внизу. Сначала поднимитесь.'); }
  if (kind === 'drop') { if (S.y < C3.top - 0.5) return toast('Свободное падение начинают сверху — поднимите кабину кнопкой «Вверх».'); ph = [{ a: -G0, dur: 1.2 }, { a: 3 * G0, dur: 0.4 }]; }

}
function step3(dt) {

      if (P.t >= f.dur - 1e-9) { P.i++; P.t = 0; if (P.i >= P.ph.length) { S.prog = null; S.vy = 0; S.a = 0; S.y = Math.abs(S.y - C3.top) < 0.05 ? C3.top : Math.abs(S.y) < 0.05 ? 0 : S.y; renderTools(); update(); } }

    if (a === 'fire') return fire();
    if (a === 'clear') { if (S.cur) return; S.shots = []; return re(); }
    const m = a.match(/^v([+-])(1|01)$/); if (m) { setV(S.v + (m[1] === '+' ? 1 : -1) * (m[2] === '1' ? 1 : 0.1)); return; }
    if (a.startsWith('vset-')) return setV(+a.slice(5));
  }
  if (id === 'orbits') {
    if (a.startsWith('mis-')) { S.mission = a.slice(4); return re(); }
    if (a === 'h+' || a === 'h-') { const s = a === 'h+' ? 1 : -1, st = S.h < 2000 ? 100 : 1000; let h = S.h + s * st; if (s > 0 && S.h < 2000 && h > 2000) h = 2000; setH(S.h >= 2000 && s < 0 && h < 2000 ? 1900 : h); return; }
    if (a.startsWith('hset-')) return setH(+a.slice(5));
    if (a === 'launch2' || a === 'sat') return launch2();
  }
  if (id === 'weight') {
    if (a === 'up' || a === 'down' || a === 'drop') return startProg(a);
    if (a === 'cab') return startProg(S.y < C3.top - 0.5 ? 'up' : 'down');
    if (a.startsWith('ans-')) {
      if (!S.zero) { toast('Сначала добейтесь, чтобы весы показали ноль.'); return; }
      if (a === 'ans-fall') { S.ans = true; toast('Верно: станция и космонавты вместе падают вокруг Земли с ускорением ≈ 8,7 м/с² и не давят друг на друга. Притяжение на высоте 400 км почти такое же, как у поверхности.'); re(); }
      else if (a === 'ans-nog') toast('Притяжение на высоте 400 км всего на 11% слабее, чем у Земли: g ≈ 8,7 м/с². Без него станция улетела бы по прямой. Подумайте, что делали весы в свободном падении.');
      else toast('Воздух в станции такой же, как дома, — он людей не держит. Вспомните, что было с весами при свободном падении.');
      return;
    }
  }
  if (id === 'rocket') {
    if (a === 'launch') return launch4();
    if (S.fl) { toast('Ракета в полёте — дождитесь конца.'); return; }
    if (a.startsWith('st-')) { S.st = +a.slice(3); if (S.st === 1) S.land = false; S.lastF = null; S.last = null; return re(); }
    if (a.startsWith('pay-')) { S.pay = +a.slice(4); S.lastF = null; S.last = null; return re(); }
    if (a === 'land') { if (S.st === 1) { toast('Сажать можно только первую ступень двухступенчатой ракеты — одноступенчатой пришлось бы вернуть всю ракету.'); return; } S.land = !S.land; S.lastF = null; S.last = null; return re(); }
  }
}

function model() {
  const id = LID();
  if (id === 'cosmic') return { kind: id, v: S.v, fly: !!S.cur, fell: !!S.fell, orbit: !!S.orbit, esc: !!S.esc };
  if (id === 'orbits') { const o = orb(S.h); return { kind: id, h: S.h, v: o.v, T: o.T / 3600, ms: delayMs(S.h), net: !!S.ok.net, tv: !!S.ok.tv, nav: !!S.ok.nav }; }
  if (id === 'weight') return { kind: id, y: S.y, a: S.a, kg: kg3(), P: MASS * (G0 + S.a), n: (G0 + S.a) / G0, more: S.more, less: S.less, zero: S.zero, ans: S.ans };
  const c = rocketCfg(S.st, S.pay, S.land);
  return { kind: id, c, fly: !!S.fl, one: !!S.one, two: !!S.two, land: !!S.landOk };
}

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'cosmic') return [t(m.fell, 'Упало'), t(m.orbit, 'Окружность'), t(m.esc, 'Улетело')].join(' · ');
  if (id === 'orbits') return [t(m.net, 'Интернет'), t(m.tv, 'ТВ'), t(m.nav, 'Навигация')].join(' · ');
  if (id === 'weight') return [t(m.more, '> 50 кг'), t(m.less, '< 50 кг'), t(m.zero, '0'), t(m.ans, 'МКС')].join(' · ');
  return [t(m.one, '1 ступень'), t(m.two, '2 ступени'), t(m.land, 'Посадка')].join(' · ');
}

  const id = LID();
  if (id === 'cosmic') {
    const vn = S.v / V1, kind = S.v < V1 - 0.05 ? 'меньше v₁ — ядро упадёт (с высокой горы может пролететь по эллипсу ниже вершины)' : S.v < V1 + 0.05 ? 'равна v₁ — окружность' : S.v < V2 - 0.05 ? 'между v₁ и v₂ — вытянутый эллипс, ядро вернётся' : 'не меньше v₂ — ядро улетит';
    return `<h2>Космические скорости</h2><div class="formula">v₁ = √(gR)    v₂ = √2 · v₁</div><p class="note">Ядро летит по окружности, если тяготение сообщает ему как раз центростремительное ускорение: g = v² / R.</p>
      <h3>Первая космическая</h3><div class="steps">` + step('g', '9,8 м/с²') + step('R', '6 400 000 м') + step('g · R', '≈ 6,27·10⁷ м²/с²') + step('v₁ = √(gR)', '≈ 7 920 м/с ≈ 7,9 км/с', 'sum') + `</div>
      <h3>Вторая космическая и виток</h3><div class="steps">` + step('v₂ = 1,41 · 7,9', '≈ 11,2 км/с', 'sum') + step('виток T = 2πR / v₁', '2 · 3,14 · 6400 / 7,9 ≈ 5090 с') + step('', '≈ 85 мин') + `</div>
      <h3>Сейчас</h3><div class="steps">` + step('скорость ядра', fmt(S.v, 1) + ' км/с') + step('v / v₁', fmt(vn, 2)) + `</div><p class="note" style="margin-top:10px">Скорость ${kind}.</p>`;
  }
  if (id === 'orbits') {
    const o = orb(S.h), r = o.r / 1000;
    return `<h2>Скорость и период спутника</h2><div class="formula">v = √(GM / r)    T = 2πr / v</div><p class="note">GM ≈ 4·10¹⁴ м³/с², r = R + h, R = 6400 км. Задержка сигнала: он идёт со скоростью света c = 300 000 км/с до спутника и обратно, t = 2h / c.</p>
      <h3>Высота ${big(S.h)} км</h3><div class="steps">` + step('r = 6400 + h', `${big(r)} км`) + step('v = √(4·10¹⁴ / r)', `${big(o.v)} м/с ≈ ${fmt(o.v / 1000, 2)} км/с`) + step('T = 2πr / v', `${big(o.T)} с ≈ ${fmtT(o.T / 3600)}`, 'sum') + step('сигнал 2h / c', `${m.ms < 10 ? fmt(m.ms, 1) : Math.round(m.ms)} мс`) + step('витков за сутки', fmt(86400 / o.T, 1)) + `</div>
      <h3>Для сравнения</h3><div class="steps">` + step('МКС, 400 км', `7,67 км/с · 93 мин`) + step('GPS, 20 200 км', `3,88 км/с · 12 ч`) + step('ГСО, 35 800 км', `3,08 км/с · 24 ч`) + `</div>`;
  }
  if (id === 'weight') {
    const a = S.a, P = MASS * (G0 + a);
    return `<h2>Вес в лифте</h2><div class="formula">P = m (g + a)    n = P / (mg)</div><p class="note">a берём со знаком: вверх — «+», вниз — «−». m = 50 кг, g = 9,8 м/с². Весы показывают P / g.</p>
      <h3>Сейчас</h3><div class="steps">` + step('ускорение a', fmt(a, 1) + ' м/с²') + step('P = 50 · (9,8 ' + (a < 0 ? '− ' + fmt(-a, 1) : '+ ' + fmt(a, 1)) + ')', `${Math.round(Math.max(0, P))} Н`) + step('весы P / g', `${Math.round(Math.max(0, P) / G0)} кг`, 'sum') + step('перегрузка n', fmt(Math.max(0, P) / (MASS * G0), 1) + ' g') + `</div>
      <h3>Поездки</h3><div class="steps">` + step('разгон вверх, a = +2', '50 · 11,8 / 9,8 ≈ 60 кг') + step('торможение вверху, a = −2', '50 · 7,8 / 9,8 ≈ 40 кг') + step('свободное падение, a = −g', '0 кг · невесомость') + step('торможение после падения, +3g', '200 кг · 4 g') + `</div>
      <h3>МКС</h3><div class="steps">` + step('g на высоте 400 км', '9,8 · (6400 / 6800)² ≈ 8,7 м/с²') + step('ускорение станции', '≈ 8,7 м/с² — падает', 'sum') + `</div><p class="note" style="margin-top:10px">При старте ракеты перегрузка доходит до 3–4 g: космонавт массой 70 кг «весит» 210–280 кг.</p>`;
  }
  const c = m.c;
  const dvs = c.st === 1 ? step('Δv = 3,3 · ln(' + nf(c.m0) + ' / ' + nf(c.mk1) + ')', fmt(c.dv, 2) + ' км/с', 'sum')
    : step('1-я: 3,3 · ln(' + nf(c.m0) + ' / ' + nf(c.mk1) + ')', fmt(c.dv1, 2) + ' км/с') + step('2-я: 3,3 · ln(' + nf(c.m20) + ' / ' + nf(2 + c.pay) + ')', fmt(c.dv2, 2) + ' км/с') + step('всего Δv', fmt(c.dv, 2) + ' км/с', 'sum');
  return `<h2>Формула Циолковского</h2><div class="formula">Δv = u · ln(m₀ / mк)</div><p class="note">u = 3,3 км/с — скорость истечения газов, m₀ — масса до работы ступени, mк — после. Сброшенная ступень дальше не разгоняется. Для орбиты нужно Δv ≈ 9,4 км/с.</p>
    <h3>${c.st === 1 ? 'Одна ступень' : 'Две ступени'}, груз ${c.pay} т${c.land ? ', с посадкой' : ''}</h3><div class="steps">` + dvs + step('хватит для орбиты?', c.dv >= DV_ORB ? 'да' : 'нет', c.dv >= DV_ORB ? '' : '') + `</div>
    <h3>Стоимость пуска (условно)</h3><div class="steps">` + step('1-я ступень', c.land ? '60 / 10 полётов + ремонт 8 ≈ 14' : '60') + step('2-я ступень', '25') + step('топливо и подготовка', '15') + step('итого', c.land ? '≈ 54' : '100', 'sum') + `</div>
    <p class="note" style="margin-top:10px">Многоразовая ступень платит частью груза (запас топлива на посадку), но её не строят заново — пуск выходит почти вдвое дешевле.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const row = (a, b, cls) => `<div class="lr"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`;
  if (id === 'cosmic') {
    const c = S.cur, last = S.shots[S.shots.length - 1];
    el.innerHTML = `<div class="k">Ядро</div><div class="v ${Math.abs(S.v - V1) < 0.051 ? 'ok' : ''}">${fmt(S.v, 1)} км/с</div>` + row('v / v₁', fmt(S.v / V1, 2)) +
      (c ? row('полёт', Math.round(c.t * T1MIN / TAU) + ' мин') + row('высота', big(Math.max(0, (Math.hypot(c.x, c.y) - C1.RE) * RKM / C1.RE)) + ' км') : row('прошлый', last ? RES_NAME[last.res] : '—', last && last.res === 'orbit' ? 'ok' : ''));
  } else if (id === 'orbits') {
    el.innerHTML = `<div class="k">Спутник</div><div class="v">${big(m.h)} км</div>` + row('v', fmt(m.v / 1000, 2) + ' км/с') + row('T', fmtT(m.T), Math.abs(m.T - 24) <= 0.3 ? 'ok' : '') + row('сигнал', (m.ms < 10 ? fmt(m.ms, 1) : Math.round(m.ms)) + ' мс') + row('время', fmt(S.th, 1) + ' ч') + row('город', cityVisible() ? 'видит' : 'не видит', cityVisible() ? 'ok' : '');
  } else if (id === 'weight') {
    el.innerHTML = `<div class="k">Весы</div><div class="v ${m.kg < 0.5 ? 'ok' : ''}">${Math.round(m.kg)} кг</div>` + row('масса', '50 кг') + row('P', Math.round(Math.max(0, m.P)) + ' Н') + row('a', fmt(m.a, 1) + ' м/с²') + row('n', fmt(m.n, 1) + ' g', m.n > 1.5 ? 'bad' : '');
  } else {
    const fs = S.fl ? flight() : null, v = fs ? fs.v : S.last ? S.last.dv : 0;
    el.innerHTML = `<div class="k">Ракета</div><div class="v ${v >= DV_ORB ? 'ok' : ''}">Δv ${fmt(v, 1)} км/с</div>` + row('ступени', S.st) + row('m₀', nf(m.c.m0) + ' т') + row('груз', S.pay + ' т') + row('итог', S.fl ? 'в полёте' : S.last ? (S.last.orbit ? 'орбита' : 'не хватило') : '—', S.last && !S.fl ? (S.last.orbit ? 'ok' : 'bad') : '');
  }
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как спутники держатся на орбите и как до неё добраться!'), 2600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  cosmic: '<circle cx="33" cy="40" r="26" fill="#2f6fb0"/><path d="M28 15l5-6 5 6z" fill="#7a6a58"/><path d="M33 9Q60 12 58 30" fill="none" stroke="#ff8a73" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M33 9A30 30 0 0 1 63 40" fill="none" stroke="#86e0a8" stroke-width="1.4"/>',
  orbits: '<circle cx="33" cy="15" r="6" fill="#2f6fb0"/><circle cx="33" cy="15" r="11" fill="none" stroke="#72d4e8" stroke-width="1.2"/><circle cx="33" cy="15" r="13.5" fill="none" stroke="#8b96ad" stroke-width=".8" stroke-dasharray="2 2"/><rect x="42" y="5" width="4" height="4" fill="#d9c08a"/><rect x="38" y="6" width="3" height="2" fill="#3b6fd8"/><rect x="47" y="6" width="3" height="2" fill="#3b6fd8"/>',
  weight: '<rect x="18" y="3" width="22" height="25" rx="2" fill="#1d2a40" stroke="#4a5875"/><circle cx="29" cy="9" r="2.6" fill="#f0c9a0"/><path d="M29 12v7" stroke="#3b6fd8" stroke-width="3.4"/><rect x="23" y="23" width="12" height="2.4" fill="#e8ecf4"/><circle cx="52" cy="15" r="9" fill="#f7f3ea"/><path d="M52 15l5-4" stroke="#d62828" stroke-width="1.6"/>',
  rocket: '<path d="M3 28h60" stroke="#3a5a46" stroke-width="2"/><path d="M20 4c3 3 3.5 6 3.5 9v12h-7V13c0-3 .5-6 3.5-9z" fill="#eef1f6"/><path d="M17.5 25l2.5 5 2.5-5z" fill="#ffb547"/><path d="M28 24Q40 6 62 4" fill="none" stroke="#86e0a8" stroke-width="1.2" stroke-dasharray="2 2"/><rect x="44" y="25" width="12" height="3" fill="#4a5875"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); S.lastF = null; save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'cosmic') now = `Мысленный опыт Ньютона: пушка на вершине горы (воздуха нет, гора нарисована преувеличенно, на её вершине v₁ = 7,9 км/с). Выбрана скорость ${fmt(S.v, 1)} км/с${S.cur ? ', ядро летит' : ''}. Выстрелы: ${S.shots.map(s => `${fmt(s.v, 1)} км/с — ${RES_NAME[s.res]}`).join('; ') || 'нет'}. Подзадачи: упало — ${S.fell ? 'да' : 'нет'}, окружность — ${S.orbit ? 'да' : 'нет'}, улетело — ${S.esc ? 'да' : 'нет'}. Нужную скорость не называй сразу — наводи к g = v²/R и v = √(gR).`;
  if (id === 'orbits') now = `Спутник на круговой орбите над экватором, высота ${big(S.h)} км, скорость ${fmt(m.v / 1000, 2)} км/с, период ${fmtT(m.T)}, задержка сигнала туда-обратно ${m.ms < 10 ? fmt(m.ms, 1) : Math.round(m.ms)} мс. Текущая задача: «${MISSIONS[S.mission]}». Подобрано: ${Object.keys(MISSIONS).map(k => `${MISSIONS[k]} — ${S.ok[k] ? big(S.ok[k].h) + ' км' : 'нет'}`).join('; ')}. Высоты не называй — наводи: задержка 2h/c, период 24 ч, видимость с большой части Земли.`;
  if (id === 'weight') now = `Лифт-тренажёр, человек 50 кг на весах. Кабина на высоте ${fmt(S.y, 1)} м, ускорение ${fmt(S.a, 1)} м/с²${S.prog ? ` (поездка: ${{ up: 'вверх', down: 'вниз', drop: 'свободное падение' }[S.prog.kind]})` : ''}, весы показывают ${Math.round(m.kg)} кг, перегрузка ${fmt(m.n, 1)} g. Наблюдения: больше 50 кг — ${S.more ? 'да' : 'нет'}, меньше — ${S.less ? 'да' : 'нет'}, ноль — ${S.zero ? 'да' : 'нет'}; ответ про МКС — ${S.ans ? 'верный' : 'не дан'}. Наводи к P = m(g + a) и к тому, что на орбите всё падает вместе.`;
  if (id === 'rocket') { const c = m.c; now = `Ракета: ${c.st === 1 ? 'одна ступень (топливо 90 т, конструкция 8 т)' : `две ступени (72 + 6 т и 18 + 2 т)${c.land ? ', первая ступень садится, запас 6 т топлива' : ''}`}, груз ${c.pay} т, стартовая масса ${nf(c.m0)} т, u = 3,3 км/с, для орбиты нужно 9,4 км/с. ${S.fl ? 'Ракета в полёте.' : S.last ? `Последний пуск: Δv = ${fmt(S.last.dv, 1)} км/с, ${S.last.orbit ? 'орбита' : 'не хватило'}.` : 'Пусков не было.'} Подзадачи: 1 ступень — ${S.one ? 'да' : 'нет'}, 2 ступени — ${S.two ? 'да' : 'нет'}, с посадкой — ${S.landOk ? 'да' : 'нет'}. Результаты Δv заранее не называй — наводи к формуле Циолковского.`; }
  return [
    `Раздел: физика, 9 класс, тема «Космос: спутники и невесомость» (искусственные спутники Земли). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { cosmic: 'Почему спутник не падает на Землю?', orbits: 'Почему телевизионные спутники висят над одной точкой?', weight: 'Почему на МКС невесомость, если там есть притяжение?', rocket: 'Зачем ракете несколько ступеней?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-space.js): настольные модели тех же опытов
const thin = pts => { const n = pts.length, k = Math.max(1, Math.ceil(n / 70)), out = []; for (let i = 0; i < n; i += k) out.push([+pts[i][0].toFixed(3), +pts[i][1].toFixed(3)]); const e = pts[n - 1]; out.push([+e[0].toFixed(3), +e[1].toFixed(3)]); return out; };
window.LUCH_REAL = () => {
  const id = LID(), M = { module: 'space' };
  if (id === 'cosmic') return { ...M, scene: 'space-cannon', help: 'Пушка — огонь, кнопки пульта — скорость', v: S.v, vtxt: fmt(S.v, 1) + ' км/с', fly: !!S.cur, RE: C1.RE,
    shots: S.shots.map(s => ({ v: fmt(s.v, 1), res: s.res, p: thin(s.pts) })) };
  if (id === 'orbits') return { ...M, scene: 'space-orbits', help: 'Пульт — высота и запуск, задачи — на табличках', h: S.h, rd: (rdOf(S.h) - C2.RE) / C2.K, htxt: big(S.h) + ' км', Ttxt: fmtT(Th(S.h)), mission: S.mission, ok: Object.keys(S.ok).filter(k => S.ok[k]),
    rings: RINGS.map(([n, hh]) => ({ n, f: (rdOf(hh) - C2.RE) / C2.K })) };
  if (id === 'weight') return { ...M, scene: 'space-lift', help: 'Кнопки пульта — вверх, вниз, свободное падение', top: C3.top, run: S.prog ? S.prog.kind : '' };
  return { ...M, scene: 'space-rocket', help: 'Ракета или «Пуск» — запуск, кнопки — ступени, груз, посадка', st: S.st, pay: S.pay, land: S.land, fly: !!S.fl, res: S.last ? (S.last.orbit ? 'orbit' : 'fail') : '' };
};
// live values for smooth motion in 3D
window.LUCH_REAL.live = () => {
  const id = LID();
  if (id === 'cosmic') return S.cur ? { on: true, x: S.cur.x, y: S.cur.y } : { on: false };
  if (id === 'orbits') return { aS: S.aS, aE: TAU * S.th / 24, vis: cityVisible() };
  if (id === 'weight') return { y: S.y, kg: kg3(), n: (G0 + S.a) / G0, a: S.a, free: !!(S.prog && S.prog.kind === 'drop') };
  const st = S.fl ? flight() : S.lastF ? flightAt(S.lastF) : flight();
  return { v: S.fl ? st.v : S.last ? S.last.dv : 0, main: st.main, s1: st.s1, landed: st.landed, splash1: st.splash1, splash2: st.splash2, t: performance.now() };
};
window.LUCH_REAL.click = k => act(k);

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
