<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 11 класс: сила Ампера, сила Лоренца, движение заряда в магнитном поле и масс-спектрометр, магнитное поле Земли и полярное сияние.">
<title>Силы Ампера и Лоренца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">

      <div class="prog" aria-label="Прогресс"><b>Лоренц</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с магнитным полем: рельсы со стержнем, трубка с электронным лучом, масс-спектрометр, Земля и солнечный ветер. Детали можно нажимать и тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sci = (x, d = 1) => {
  if (!x) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))), m = +(x / 10 ** e).toFixed(d);
  if (Math.abs(m) >= 10) { m /= 10; e++; }
  return `${fmt(m, d)}·10${String(e).split('').map(c => SUP[c]).join('')}`;
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const D2R = Math.PI / 180;

const LESSONS = [
  { id: 'ampere', title: 'Сила Ампера',
    text: ['На проводник с током в магнитном поле действует сила Ампера. Её модуль F = B·I·l·sin α, где B — индукция поля (в теслах), I — сила тока, l — длина проводника в поле, α — угол между направлением тока и вектором B.',
           'Направление силы находят по правилу левой руки: линии B входят в ладонь, четыре пальца — по току, отогнутый на 90° большой палец показывает силу. Поменяли направление тока или полюса магнита — сила развернулась.',
           'Сила наибольшая, когда ток перпендикулярен полю (sin 90° = 1), и равна нулю, когда ток идёт вдоль линий поля. Опыт с рельсами: лёгкий стержень лежит на двух медных рельсах между полюсами магнита; замыкаем цепь — и стержень катится.'],
    why: 'Сила Ампера крутит любой электродвигатель: в электромобиле, электросамокате, дроне, лифте, роботе-манипуляторе. Инженер тяговых двигателей электромобилей и квадрокоптеров считает именно B·I·l: как сделать магнит сильнее, а обмотку компактнее, чтобы мотор был лёгким и мощным. На ней же работают динамики наушников и магнитные подшипники. Через десять лет электромоторов будет ещё больше — электротранспорт, роботы, электросамолёты. ИИ уже перебирает тысячи вариантов конструкции, но понять, почему мотор греется, теряет мощность или ломается, и поставить машине правильную задачу сможет инженер, который понимает физику поля и тока.',
    task: 'Замкните ключ так, чтобы стержень покатился вправо, к флажку. Потом подберите ток, поле и угол, чтобы сила Ампера была 0,03 Н, и прокатите стержень. Наконец, поверните поле вдоль стержня (α = 0°) и замкните цепь.',
    hint: 'Ключ, ток, поле и угол — кнопки внизу; на источник и магнит можно нажимать. Стержень возвращайте мышью или кнопкой «Вернуть». l = 10 см, стержень 12 г, движение замедлено в 5 раз.',
    stage: 'Нажмите на источник — сменить направление тока, на магнит — перевернуть его. Стержень можно тянуть.',
    safe: 'Ток в опыте до 5 А: рельсы и провода толстые, источник с защитой — тонкий провод при таком токе сильно греется. Сильный магнит держат подальше от телефонов, банковских карт и кардиостимуляторов.',

// physics step; returns true when something moves

  if (a === 'src') { S.src = !S.src; return re(); }
  if (a.startsWith('u3-')) { S.U3 = +a.slice(3); S.cnt = { 20: 0, 22: 0 }; S.ions = []; S.wall = 0; return re(); }
  if (a.startsWith('b3-')) { S.B3 = +a.slice(3); S.cnt = { 20: 0, 22: 0 }; S.ions = []; S.wall = 0; return re(); }
  if (a === 'bcycle3') { S.B3 = BS3[(BS3.indexOf(S.B3) + 1) % BS3.length]; S.cnt = { 20: 0, 22: 0 }; S.ions = []; S.wall = 0; return re(); }
  if (a === 'ucycle3') { S.U3 = US3[(US3.indexOf(S.U3) + 1) % US3.length]; S.cnt = { 20: 0, 22: 0 }; S.ions = []; S.wall = 0; return re(); }
  if (a === 'clear') { S.cnt = { 20: 0, 22: 0 }; S.wall = 0; return re(); }
  if (a.startsWith('ans-') && id === 'circle') {
    if (!(S.s20 && S.s22)) { toast('Сначала измерьте оба пятна.'); return; }
    if (a === 'ans-2022') { S.ans3 = true; toast('Верно: в природном неоне 90,5% неона-20 и 9,3% неона-22 (и 0,3% неона-21 — его пятно слишком слабое). В 1913 году Дж. Дж. Томсон, отклоняя полями пучок ионов неона, впервые увидел два таких пятна — так были открыты изотопы у нерадиоактивных элементов.'); re(); }
    else toast('Посчитайте m = q·B²·d² / (8U) для каждого пятна и разделите на 1,66·10⁻²⁷ кг.');
    return;
  }
  // lesson 4
  if (a === 'wind') { windBurst(); dirty = true; return; }
  if (a === 'field') { if (id !== 'aurora') return; S.field = !S.field; S.parts = []; return re(); }
  if (a === 'storm') { S.storm = !S.storm; S.parts = []; return re(); }
  if (a.startsWith('ans-') && id === 'aurora') {
    if (a === 'ans-S') { S.ans4 = true; toast('Верно: в Арктике — южный магнитный полюс. Северный конец стрелки компаса тянется к нему, потому что разноимённые полюсы притягиваются.'); re(); }
    else toast('Подсказка: северный (красный) конец стрелки показывает на север. Какие полюсы притягиваются — одноимённые или разноимённые?');
    return;
  }
}

    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'ampere') {
    const F = F1(), s = sinA(S.al);
    return `<h2>Сила Ампера</h2><div class="formula">F = B · I · l · sin α</div><p class="note">B — индукция поля, I — ток, l = 0,1 м — длина стержня между рельсами, α — угол между током и B.</p>
      <h3>Сейчас</h3><div class="steps">` + step0('B', `${fmt(S.B, 2)} Тл`) + step0('I', `${fmt(S.I, 1)} А`) + step0('l', '0,1 м') + step0('sin α', `sin ${S.al}° = ${fmt(s, 3)}`) +
      step0('F', `${fmt(S.B, 2)} × ${fmt(S.I, 1)} × 0,1 × ${fmt(s, 3)} = ${fmt(F, 4)} Н`, 'sum') + `</div>
      <h3>Поедет ли стержень</h3><div class="steps">` + step0('трение качения Fтр = μmg', `0,02 × 0,012 × 9,8 ≈ ${fmt(FFR, 4)} Н`) +
      step0('a = (F − Fтр) / m', F > FFR ? `(${fmt(F, 4)} − ${fmt(FFR, 4)}) / 0,012 ≈ ${fmt((F - FFR) / A1.m, 2)} м/с²` : 'F ≤ Fтр — стоит', 'sum') + `</div>
      <h3>Правило левой руки</h3><p class="note">Линии B ${S.pol > 0 ? 'идут сверху вниз (от нас)' : 'идут снизу вверх (к нам)'} и входят в ладонь; четыре пальца — по току в стержне (${S.dirI > 0 ? 'от верхнего рельса к нижнему' : 'от нижнего рельса к верхнему'}); большой палец — сила. Поменять направление силы можно двумя способами: перевернуть источник или магнит. Если сделать и то и другое — сила останется прежней.</p>`;
  }
  if (id === 'lorentz') {
    const v = v2(), B = B2(), r = r2();
    return `<h2>Сила Лоренца</h2><div class="formula">F = |q| · v · B · sin α</div><p class="note">|q| = e = 1,6·10⁻¹⁹ Кл, масса электрона m = 9,1·10⁻³¹ кг. Скорость после пушки: eU = mv²/2.</p>
      <h3>Сейчас</h3><div class="steps">` + step0('v = √(2eU/m)', `√(2 × 1,6·10⁻¹⁹ × ${S.U} / 9,1·10⁻³¹) ≈ ${sci(v)} м/с`) + step0('B = 0,75 мТл/А × I', `${fmt(B * 1000, 2)} мТл`) +
      step0('sin α', S.al2 === 90 ? 'луч ⟂ B: sin 90° = 1' : 'луч вдоль B: sin 0° = 0') + step0('F', S.al2 === 90 && B > 0 ? `1,6·10⁻¹⁹ × ${sci(v)} × ${sci(B)} ≈ ${sci(F2())} Н` : '0', 'sum') +
      step0('радиус r = mv / (eB)', isFinite(r) ? `≈ ${fmt(r * 100, 1)} см` : '∞ — луч прямой') + `</div>
      <h3>Почему скорость не меняется</h3><p class="note">Работа силы A = F·s·cos 90° = 0. Кинетическая энергия mv²/2 остаётся прежней, поэтому |v| постоянна — сила меняет только направление скорости. Сила тяжести электрона ${sci(ME * 9.8)} Н${F2() > 0 ? ` — в ${sci(F2() / (ME * 9.8), 0)} раз меньше силы Лоренца` : ''}, её можно не учитывать.</p>
      <h3>Направление</h3><p class="note">Для положительного заряда — правило левой руки: B в ладонь, пальцы по v. Электрон заряжен отрицательно — пальцы ставят против его скорости. Поле ${S.bdir > 0 ? 'к нам ⊙' : 'от нас ⊗'} → луч ${S.Ic > 0 && S.al2 === 90 ? (S.bdir > 0 ? 'вверх' : 'вниз') : 'прямой'}.</p>`;
  }
  if (id === 'circle') {
    const d = S.dm / 100, mm = mOf(S.dm);
    return `<h2>Ионы по окружности</h2><div class="formula">r = mv / (qB)    T = 2πm / (qB)</div><p class="note">Ион разгоняется: qU = mv²/2 → v = √(2qU/m). Подставляя: r = √(2mU/q) / B, d = 2r. Отсюда масса по измеренному d:</p>
      <div class="formula">m = q · B² · d² / (8U)</div>
      <h3>По метке детектора</h3><div class="steps">` + step0('d', `${fmt(S.dm, 1)} см = ${fmt(d, 3)} м`) + step0('m = qB²d² / (8U)', `1,6·10⁻¹⁹ × ${fmt(S.B3, 2)}² × ${fmt(d, 3)}² / (8 × ${S.U3}) ≈ ${sci(mm * AMU, 2)} кг`) +
      step0('в а. е. м. (÷ 1,66·10⁻²⁷)', `≈ ${fmt(mm, 1)}`, 'sum') + `</div>
      <h3>Записи</h3><div class="steps">` + step0('яркое пятно', S.s20 ? `d = ${fmt(S.s20.d, 1)} см → m ≈ ${fmt(QE * S.s20.B ** 2 * (S.s20.d / 100) ** 2 / (8 * S.s20.U) / AMU, 1)} а. е. м.` : '—') +
      step0('слабое пятно', S.s22 ? `d = ${fmt(S.s22.d, 1)} см → m ≈ ${fmt(QE * S.s22.B ** 2 * (S.s22.d / 100) ** 2 / (8 * S.s22.U) / AMU, 1)} а. е. м.` : '—') + `</div>
      <h3>Период и циклотрон</h3><div class="steps">` + step0('T для иона массой 20 а. е. м.', `2π × 20 × 1,66·10⁻²⁷ / (1,6·10⁻¹⁹ × ${fmt(S.B3, 2)}) ≈ ${fmt(2 * Math.PI * 20 * AMU / (QE * S.B3) * 1e6, 1)} мкс`) + `</div>
      <p class="note" style="margin-top:10px">Период не зависит от скорости — поэтому в циклотроне можно подталкивать частицы переменным полем с постоянной частотой.</p>`;
  }
  const lat = latOf(S.cb), vp = S.storm ? 8e5 : 4e5;
  return `<h2>Частицы в поле Земли</h2><div class="formula">r = m·v / (|q|·B)</div><p class="note">Радиус спирали протона солнечного ветра (m = 1,67·10⁻²⁷ кг, v = ${S.storm ? 800 : 400} км/с, частица летит поперёк поля):</p>
    <div class="steps">` + step0('в магнитосфере, B ≈ 50 нТл', `≈ ${nf(Math.round(1.67e-27 * vp / (QE * 5e-8) / 1000))} км`) + step0('у поверхности, B ≈ 50 мкТл', `≈ ${nf(Math.round(1.67e-27 * vp / (QE * 5e-5)))} м`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Чем ближе к Земле, тем сильнее поле и тем туже спираль — частица «наматывается» на линию поля и скользит вдоль неё к полюсу.</p>
    <h3>Компас</h3><div class="steps">` + step0('широта', `${Math.round(Math.abs(lat))}° ${lat >= 0 ? 'с. ш.' : 'ю. ш.'}`) + step0('поле у поверхности B ≈ 30·√(1 + 3 sin²φ)', `≈ ${Math.round(Bsurf(lat))} мкТл`) + step0('наклонение: tg I = 2 tg φ', `I ≈ ${Math.round(Math.abs(dipOf(lat)))}°`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">На экваторе стрелка лежит горизонтально, у магнитных полюсов встаёт почти вертикально. Модель — идеальный диполь; настоящее поле неоднородно, а магнитные полюсы медленно дрейфуют.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const row = (a, b, cls) => `<div class="lr"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`;
  if (id === 'ampere') el.innerHTML = `<div class="k">Сила Ампера</div><div class="v ${m.F > FFR ? 'ok' : ''}">${fmt(m.F, 3)} Н</div>` + row('I', S.on ? fmt(S.I, 1) + ' А' : '0 А') + row('B', fmt(S.B, 2) + ' Тл') + row('α', S.al + '°') + row('x', fmt(S.x, 1) + ' см', S.x >= A1.LEN - 0.5 ? 'ok' : '');
  else if (id === 'lorentz') el.innerHTML = `<div class="k">Сила Лоренца</div><div class="v ${m.F > 0 ? 'ok' : ''}">${m.F > 0 ? sci(m.F) + ' Н' : '0 Н'}</div>` + row('v', sci(m.v)) + row('B', fmt(m.B * 1000, 2) + ' мТл') + row('r', isFinite(m.r) ? fmt(m.r * 100, 1) + ' см' : '∞');
  else if (id === 'circle') el.innerHTML = `<div class="k">Детектор</div><div class="v">d = ${fmt(S.dm, 1)} см</div>` + row('ионов', S.cnt[20] + S.cnt[22]) + row('U', S.U3 + ' В') + row('B', fmt(S.B3, 2) + ' Тл');
  else { const lat = latOf(S.cb); el.innerHTML = `<div class="k">Компас</div><div class="v">${Math.round(Math.abs(lat))}° ${lat >= 0 ? 'с. ш.' : 'ю. ш.'}</div>` + row('наклон', Math.round(Math.abs(dipOf(lat))) + '°') + row('B', Math.round(Bsurf(lat)) + ' мкТл') + row('поле', S.field ? 'вкл' : 'выкл', S.field ? 'ok' : 'bad'); }
}

function update() {
  latch();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как магнитное поле действует на токи и заряды!'), 2000);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  ampere: '<rect x="6" y="4" width="54" height="22" rx="3" fill="#e0473a" fill-opacity=".25" stroke="#e0473a"/><path d="M4 9h58M4 21h58" stroke="#d98a4e" stroke-width="2.4"/><rect x="31" y="6" width="4" height="18" rx="2" fill="#c6ccd6"/><path d="M36 15h12" stroke="#ffb547" stroke-width="2"/><path d="M46 12l4 3-4 3" fill="none" stroke="#ffb547" stroke-width="1.6"/>',
  lorentz: '<circle cx="33" cy="15" r="12" fill="#cfe6f2" fill-opacity=".15" stroke="#9fc3d8"/><circle cx="33" cy="15" r="14" fill="none" stroke="#b8743f" stroke-width="2"/><path d="M23 18c6 0 14-2 16-10" fill="none" stroke="#5cf2c9" stroke-width="1.8"/>',
  circle: '<path d="M10 26a14 14 0 0 1 28 0M10 26a16 16 0 0 1 32 0" fill="none" stroke="#d68cff" stroke-width="1.6"/><rect x="10" y="25" width="50" height="3" fill="#e9d9a8"/><circle cx="38" cy="26" r="2" fill="#d68cff"/><circle cx="42" cy="26" r="1.6" fill="#d68cff" opacity=".6"/>',
  aurora: '<circle cx="8" cy="15" r="7" fill="#ffd27a"/><path d="M46 3C30 5 30 25 46 27" fill="none" stroke="#86e0a8" stroke-dasharray="3 2"/><circle cx="50" cy="15" r="7" fill="#2f78c4"/><path d="M44 9a8 8 0 0 1 12 0M44 21a8 8 0 0 0 12 0" fill="none" stroke="#7dff9b" stroke-width="2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'ampere') now = `Вид сверху: два медных рельса (между ними l = 10 см), поперёк лежит алюминиевый стержень 12 г (трение качения ≈ ${fmt(FFR, 4)} Н). Над рельсами полюс ${S.pol > 0 ? 'N (поле направлено вниз, от нас)' : 'S (поле направлено вверх, к нам)'}, B = ${fmt(S.B, 2)} Тл, угол между током и B α = ${S.al}°. Ключ ${S.on ? 'замкнут' : 'разомкнут'}, ток ${fmt(S.I, 1)} А, в стержне ток идёт ${S.dirI > 0 ? 'от верхнего рельса к нижнему (вниз по экрану)' : 'от нижнего рельса к верхнему (вверх по экрану)'}. Стержень на ${fmt(S.x, 1)} см из 30 (флажок справа). Сила Ампера сейчас ${fmt(m.F, 4)} Н. Подзадачи: вправо — ${S.right ? 'да' : 'нет'}; F = 0,03 Н — ${S.f3 ? 'да' : 'нет'}; α = 0° — ${S.a0 ? 'да' : 'нет'}. Как получить нужное направление и 0,03 Н, не говори — наводи на правило левой руки и F = B·I·l·sin α.`;
  if (id === 'lorentz') now = `Трубка с электронным лучом между катушками Гельмгольца, вид спереди. Напряжение пушки ${S.U} В (v ≈ ${sci(v2())} м/с), ток катушек ${fmt(S.Ic, 2)} А (B = ${fmt(B2() * 1000, 2)} мТл), поле ${S.bdir > 0 ? 'к зрителю' : 'от зрителя'}, трубка ${S.al2 === 90 ? 'стоит так, что луч перпендикулярен полю' : 'повёрнута: луч вдоль поля'}. Луч ${s2() > 0 ? 'изогнут вверх' : s2() < 0 ? 'изогнут вниз' : 'прямой'}${isFinite(r2()) ? `, радиус ${fmt(r2() * 100, 1)} см` : ''}. Подзадачи: вверх — ${S.up ? 'да' : 'нет'}, вниз — ${S.down ? 'да' : 'нет'}, ответ про скорость — ${S.ans2 ? 'верный' : 'нет'}, вдоль поля — ${S.along ? 'да' : 'нет'}. Ответов не называй: наводи на правило левой руки для отрицательного заряда и на то, что сила перпендикулярна скорости.`;
  if (id === 'circle') now = `Масс-спектрометр: ионы неона Ne⁺ разгоняются напряжением ${S.U3} В и летят в поле ${fmt(S.B3, 2)} Тл по полуокружностям на пластинку. Источник ${S.src ? 'включён' : 'выключен'}, пятен на пластинке: ${[20, 22].filter(A => S.cnt[A] > 0 && d3(A) <= M3.LEN).length}. Метка детектора на d = ${fmt(S.dm, 1)} см (по формуле это масса ${fmt(mOf(S.dm), 1)} а. е. м.). Измерено: яркое пятно — ${S.s20 ? `d = ${fmt(S.s20.d, 1)} см` : 'нет'}, слабое — ${S.s22 ? `d = ${fmt(S.s22.d, 1)} см` : 'нет'}. Ответ про изотопы ${S.ans3 ? 'дан верно' : 'не дан'}. Массовые числа не называй — наводи на m = qB²d²/(8U).`;
  if (id === 'aurora') now = `Земля в разрезе, Солнце слева, поле Земли ${S.field ? 'включено' : 'выключено'}, ${S.storm ? 'идёт магнитная буря (ветер 800 км/с, магнитосфера прижата, овал сияний на 57°)' : 'спокойно (ветер 400 км/с, овал на 68°)'}. Компас на ${Math.round(Math.abs(latOf(S.cb)))}° ${latOf(S.cb) >= 0 ? 'северной' : 'южной'} широты, наклонение ${Math.round(Math.abs(dipOf(latOf(S.cb))))}°. Подзадачи: сияние на севере — ${S.aN ? 'да' : 'нет'}, на юге — ${S.aS ? 'да' : 'нет'}, без поля — ${S.off ? 'да' : 'нет'}, буря — ${S.stormOk ? 'да' : 'нет'}, полюс в Арктике — ${S.ans4 ? 'ответ верный' : 'нет ответа'}. Модель упрощённая, не в масштабе. Какой полюс в Арктике, не говори — наводи на притяжение разноимённых полюсов.`;
  return [
    `Раздел: физика, 11 класс, тема «Силы Ампера и Лоренца» (Мякишев, 11 класс, «Магнитное поле»). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { ampere: 'Как работает правило левой руки?', lorentz: 'Почему сила Лоренца не меняет скорость?', circle: 'Почему период обращения не зависит от скорости?', aurora: 'Почему полярные сияния бывают только у полюсов?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-lorentz.js): the same set-up as real lab equipment
window.LUCH_REAL = () => {
  const id = LID(), M = { module: 'lorentz' };
  if (id === 'ampere') return { ...M, scene: 'lorentz-ampere', help: 'Ключ — замкнуть, источник — сменить ток, магнит — перевернуть, стержень — вернуть', on: S.on, I: S.I, B: S.B, al: S.al, dirI: S.dirI, pol: S.pol, F: Math.round(F1() * 1e4) / 1e4 };
  if (id === 'lorentz') { const r = r2(); return { ...M, scene: 'lorentz-tube', help: 'Катушка — направление поля, левый блок — ток катушек, правый — напряжение пушки', U: S.U, Ic: S.Ic, bdir: S.bdir, al: S.al2, r: isFinite(r) ? Math.round(r * 1000) / 10 : 0, s: s2(), B: Math.round(B2() * 1e6) / 1e3 }; }
  if (id === 'circle') return { ...M, scene: 'lorentz-spec', help: 'Источник — вкл/выкл, блок питания — U, электромагнит — B', U: S.U3, B: S.B3, src: S.src, d20: Math.round(d3(20) * 10) / 10, d22: Math.round(d3(22) * 10) / 10, len: M3.LEN };
  return { ...M, scene: 'lorentz-earth', help: 'Солнце — ветер, Земля — поле вкл/выкл, пульт — магнитная буря', field: S.field, storm: S.storm, lat: latA() };
};
// live values for smooth motion in 3D
window.LUCH_REAL.live = () => ({ x: S.x, on: S.on && S.I > 0, dm: S.dm, c20: S.cnt[20], c22: S.cnt[22], gN: S.gN, gS: S.gS, wind: performance.now() - S.wind < 2500 ? 1 : 0, ph: S.ph2 });
window.LUCH_REAL.click = k => {
  const id = LID();
  if (id === 'lorentz' && k === 'icycle') { S.Ic = S.Ic >= 2.5 ? 0.5 : Math.min(2.5, S.Ic + 0.5); renderTools(); buildScheme(); update(); return; }
  if (id === 'circle' && k === 'bcycle') return act('bcycle3');
  if (id === 'circle' && k === 'ucycle') return act('ucycle3');
  act(k);
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
