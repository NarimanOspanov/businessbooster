<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по физике, 10 класс: поверхностное натяжение, капилляры и смачивание, кристаллы и аморфные тела, деформации и прочность.">
<title>Жидкости и твёрдые тела</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /labs/phys-machines. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rec{display:grid;gap:4px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/'" onkeydown="if(event.key==='Enter')location.href='/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">

      <div class="prog" aria-label="Прогресс"><b>Твёрдые тела</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Опытная площадка">
    <svg class="scene" id="scene" role="img" aria-label="Площадка для опытов с жидкостями и твёрдыми телами. Кольцо динамометра и рукоятку разрывной машины можно тянуть, детали — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const LESSONS = [
  { id: 'tension', title: 'Поверхностное натяжение',
    text: ['Молекулу внутри жидкости соседи притягивают со всех сторон одинаково, а молекулу на поверхности — только снизу и с боков. Поэтому поверхность ведёт себя как растянутая плёнка и стремится сократиться: капли круглые, мыльные пузыри — шары.',
           'Сила поверхностного натяжения направлена вдоль поверхности и перпендикулярно её границе: F = σ·l, где l — длина границы, σ — коэффициент поверхностного натяжения, Н/м. У воды при 20 °C σ ≈ 0,073 Н/м, у мыльного раствора — около 0,04 Н/м.',
           'У мыльной плёнки две поверхности, поэтому перекладину рамки тянет сила F = 2σl. В отличие от пружины, плёнка тянет одинаково, как сильно её ни растягивай: на новую поверхность просто выходят молекулы из толщи плёнки.',
           'Скрепку и водомерку держит поверхность воды: она прогибается под ними, как батут. Мыло уменьшает σ — и та же скрепка тонет.'],
    why: 'Струйный принтер выстреливает капли объёмом в несколько пиколитров, и то, как капля отрывается от сопла и ложится на бумагу, задаёт поверхностное натяжение. Так же печатают 3D-принтеры жидкой смолой и биопринтеры — живыми клетками. В микрофлюидике капли в каналах тоньше волоса работают как пробирки: «лаборатория на чипе» делает анализ по одной капле крови. Краски, моющие средства, спреи с лекарствами подбирают по σ. С этим работают инженеры-технологи печати, химики-технологи и разработчики микрофлюидных чипов. Через десять лет ИИ будет подбирать составы чернил и растворов быстрее людей, но понять, почему капля в реальном приборе ведёт себя не так, как в модели, сможет специалист, который знает физику поверхности.',
    task: 'Растяните мыльную плёнку до отметки 6 см перекладиной 3 см и перекладиной 8 см, сравните силы. Потом положите скрепку на чистую воду и капните в воду мыло.',
    hint: 'Тяните оранжевое кольцо динамометра. Перекладина и опыт меняются кнопками внизу. Динамометр показывает миллиньютоны: 1 мН = 0,001 Н.',
    stage: 'Тяните кольцо динамометра вправо. Нажмите на перекладину — сменить длину.',
    check: m => m.f3 && m.f8 && m.fl && m.sk },
  { id: 'capil', title: 'Капилляры и смачивание',
    text: ['Если молекулы жидкости притягиваются к твёрдому телу сильнее, чем друг к другу, жидкость смачивает его: капля воды растекается по чистому стеклу, а у стенки поверхность загибается вверх — мениск вогнутый. Ртуть стекло не смачивает: собирается в шарик, мениск выпуклый.',

const LS_KEY = 'luch-phys-solids';

// ---------- physics data ----------
const g = 9.8;

const SIG = { water: 0.073, soap: 0.040 };

const CLIP = { P: 9.8, L: 22 };                                  // clip 1 г → 9,8 мН; contact line 2 × 11 см
const clipMax = liq => SIG[liq] * CLIP.L / 100 * 1000;           // мН
// lesson 2: capillaries
const RS = [1, 0.5, 0.25];                                       // радиус, мм
const rs = r => String(r).replace('.', ',');
const LIQ = { water: { n: 'Вода', s: 0.073, rho: 1000, th: 0 }, hg: { n: 'Ртуть', s: 0.47, rho: 13600, th: 140 } };
const capH = (liq, r) => { const q = LIQ[liq]; return 2 * q.s * Math.cos(q.th * Math.PI / 180) / (q.rho * g * r / 1000) * 1000; };   // мм
// lesson 3: heating curves (heat per gram, Дж/г; P — Дж/г за минуту)
const SAMP = {
  ice:    { n: 'Лёд', kind: 'cr', T0: -20, Tm: 0, T1: 30, cs: 2.1, cl: 4.2, lam: 334, P: 42, gmin: -30, gmax: 40, tick: 10, hot: false },
  salt:   { n: 'Соль', kind: 'cr', T0: 700, Tm: 801, T1: 860, cs: 1.1, cl: 1.4, lam: 482, P: 60, gmin: 680, gmax: 880, tick: 50, hot: true },
  rosin:  { n: 'Канифоль', kind: 'am', T0: 20, Ts1: 55, Ts2: 100, T1: 140, c: 1.3, P: 21, gmin: 0, gmax: 160, tick: 40, hot: false },
  glass:  { n: 'Стекло', kind: 'am', T0: 400, Ts1: 550, Ts2: 750, T1: 900, c: 0.9, P: 54, gmin: 380, gmax: 920, tick: 100, hot: true },
};
const SAMPLES = ['ice', 'salt', 'rosin', 'glass'];
const TMAX = 14, SIM = 1.25;                                     // минут на графике, минут опыта в секунду
// lesson 4: tensile test of a wire, L0 = 1 м
const MAT = {
  steel: { n: 'Сталь', gen: 'стали', adj: 'стальная', E: 200000, yt: 250, ut: 400, eu: 0.20, col: '#a9b4c9' },

};
const MATS = ['steel', 'copper', 'al'], DS = [1, 2, 3], FMAX = 3000, FT = 400, L0 = 1000;
const area = d => Math.PI * d * d / 4;                           // мм²
const epl = (M, smax) => smax <= M.yt ? 0 : M.eu * ((smax - M.yt) / (M.ut - M.yt)) ** 2;

function resetState() {
  Object.assign(S, {
    setup: 'frame', bar: 3, x: 1, rec1: {}, liq1: 'water', clip: 'hand', clipY: 0, fl: null, sk: null,
    liq: 'water', dip: [false, false, false], lev: [0, 0, 0], recW: {}, recHg: {}, ans: false,

    warn: false, hl: null });

function resetSample() {
  const s = SAMP[S.samp];
  Object.assign(S, { heat: false, tm: 0, Q: 0, Qa: 0, T: s.T0, f: 0, pts: [[0, s.T0]], fin: false });
}
resetState();

// lesson 3: temperature from the heat taken in
function heatTo(Q) {
  const s = SAMP[S.samp];
  if (s.kind === 'cr') {
    const q1 = s.cs * (s.Tm - s.T0);
    if (Q < q1) { S.T = s.T0 + Q / s.cs; S.f = 0; }
    else if (Q < q1 + s.lam) { S.T = s.Tm; S.f = (Q - q1) / s.lam; }
    else { S.T = s.Tm + (Q - q1 - s.lam) / s.cl; S.f = 1; }
  } else {
    // no latent heat: the heat capacity rises smoothly while the body softens
    let T = S.T, q = S.Qa || 0;
    if (Q < q) { T = s.T0; q = 0; }
    while (q < Q) { const dq = Math.min(0.5, Q - q); T += dq / (s.c * (1 + 0.45 * Math.exp(-(((T - (s.Ts1 + s.Ts2) / 2) / ((s.Ts2 - s.Ts1) / 2)) ** 2)))); q += dq; }
    S.T = T; S.Qa = q; S.f = smooth(s.Ts1, s.Ts2, T);
  }
  S.Q = Q;
}
const softState = () => {
  const s = SAMP[S.samp];
  if (s.kind === 'cr') return S.f <= 0 ? 'твёрдое' : S.f < 1 ? `плавится · жидкого ${Math.round(S.f * 100)}%` : 'жидкость';
  return S.T < s.Ts1 ? 'твёрдое' : S.T < (s.Ts1 + s.Ts2) / 2 ? 'размягчается' : S.T < s.Ts2 ? 'вязкое' : 'текучее';
};

// lesson 4: stress now
const sig4 = () => S.broken ? 0 : S.F / area(S.d);
const eps4 = () => { const M = MAT[S.mat]; return S.ep + sig4() / M.E; };

function model() {
  const id = LID();
  if (id === 'tension') return { kind: id, F: filmF(S.bar), l: S.bar, x: S.x, f3: S.rec1[3] != null, f8: S.rec1[8] != null, fl: !!S.fl, sk: !!S.sk, Fmax: clipMax(S.liq1) };
  if (id === 'capil') return { kind: id, h: RS.map(r => capH(S.liq, r)), w3: RS.every(r => S.recW[r] != null), hg: Object.keys(S.recHg).length > 0, ans: S.ans };
  if (id === 'cryst') return { kind: id, T: S.T, f: S.f, crys: !!S.crys, amor: !!S.amor, ans: S.ans, carbon: S.seenD && S.seenG };
  const M = MAT[S.mat], s = sig4();
  return { kind: id, F: S.F, sig: s, eps: eps4(), dl: eps4() * L0, n: s > 0 ? M.ut / s : Infinity, el: !!S.el, pl: !!S.pl, pick: !!S.pick };
}

// ---------- drawing helpers ----------

const Y = 380;

const WATER = '#5fb4d9', HG = '#c9d1dc', AIR = '#101826';
const DLEN = 84, DRING = 114;
// dynamometer: hook at (hx, hy), body along (ux, uy) towards the hand; ring at hook + u·DRING
function dyno(hx, hy, ux, uy, F, max, side, unit) {
  const th = Math.atan2(ux, -uy) * 180 / Math.PI, z0 = -90, z1 = -24, py = z0 + clamp(F / max, 0, 1.06) * (z1 - z0);
  const W = (lx, ly) => { const a = th * Math.PI / 180; return [hx + lx * Math.cos(a) - ly * Math.sin(a), hy + lx * Math.sin(a) + ly * Math.cos(a)]; };
  let s = `<g transform="translate(${hx.toFixed(1)} ${hy.toFixed(1)}) rotate(${th.toFixed(1)})">`;
  s += `<path d="M0 -14V-6a4 4 0 1 1 -4 4" fill="none" stroke="#c8d2e3" stroke-width="2"/>`;
  s += `<rect x="-14" y="${-14 - DLEN}" width="28" height="${DLEN}" rx="6" fill="#2b6d7c" stroke="${INK}" stroke-width="1.6"/>`;
  s += `<rect x="-4" y="${z0 - 6}" width="12" height="${z1 - z0 + 12}" rx="2" fill="#e8ecf4"/>`;
  for (let i = 0; i <= 10; i++) { const y = z0 + i / 10 * (z1 - z0); s += `<path d="M2 ${y.toFixed(1)}h${i % 2 ? 4 : 6}" stroke="#1b2537" stroke-width="${i % 2 ? 0.8 : 1.2}"/>`; }

function stepSim(dt) {

      if (S.T >= s.T1 || S.tm >= TMAX) {
        S.fin = true; S.heat = false; S.pts.push([S.tm, S.T]);
        if (s.kind === 'cr' && !S.crys) { S.crys = S.samp; toast(`${s.n}: пока шло плавление, температура стояла на ${s.Tm} °C — на графике площадка.`); }

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const id = LID();
  if (S.done[id]) return '✓ Выполнено';
  const t = (ok, s) => `${s} ${ok ? '✓' : '—'}`;
  if (id === 'tension') return [t(m.f3, '3 см'), t(m.f8, '8 см'), t(m.fl, 'Плавает'), t(m.sk, 'Утонула')].join(' · ');
  if (id === 'capil') return [t(m.w3, 'Вода ×3'), t(m.ans, 'Вывод'), t(m.hg, 'Ртуть')].join(' · ');
  if (id === 'cryst') return [t(m.crys, 'Кристалл'), t(m.amor, 'Аморфное'), t(m.ans, 'Вывод'), t(m.carbon, 'Углерод')].join(' · ');
  return [t(m.el, 'Упруго'), t(m.pl, 'Пластично'), t(m.pick, '400 Н, n ≥ 2')].join(' · ');
}

// Scheme tab: built once per change, then values refreshed (sliders keep focus while dragging)
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const chips = (lbl, items) => `<div class="ctl"><div class="lbl">${lbl}</div><div class="chips">${items.map(([a, n, on]) => `<button data-a="${a}" aria-pressed="${!!on}">${n}</button>`).join('')}</div></div>`;
const reads = (a, b, c) => `<dl class="reads"><div><dt>${a}</dt><dd id="r1"></dd></div><div><dt>${b}</dt><dd id="r2"></dd></div><div><dt>${c}</dt><dd id="r3"></dd></div></dl>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'tension') {
    h = `<h2>${S.setup === 'frame' ? 'Рамка с мыльной плёнкой' : 'Скрепка на воде'}</h2>` + chips('Опыт', [['st-frame', 'Рамка с плёнкой', S.setup === 'frame'], ['st-clip', 'Скрепка на воде', S.setup === 'clip']]);
    if (S.setup === 'frame') h += chips('Длина перекладины l', BARS.map(l => ['bar-' + l, l + ' см', S.bar === l])) + slider('inX', 'Перекладина на отметке', 1, 9, 0.5, S.x) + reads('сила F', 'l', 'σ = F/2l') +
      `<h3>Записи (растянуть до 6 см)</h3><div class="rec">` + BARS.map(l => step(`перекладина ${l} см`, S.rec1[l] != null ? `F = ${fmt(S.rec1[l], 1)} мН` : '—')).join('') + `</div>`;
    else h += chips('Вода', [['fresh', 'Чистая', S.liq1 === 'water'], ['soap', 'С мылом', S.liq1 === 'soap']]) + chips('Скрепка', [['clip', S.clip === 'hand' ? 'Положить на воду' : 'Достать', false]]) + reads('вес P', 'держит до', 'σ') +
      `<h3>Записи</h3><div class="rec">` + step('на чистой воде', S.fl ? 'плавает ✓' : '—') + step('после мыла', S.sk ? 'утонула ✓' : '—') + `</div>`;
  }
  if (id === 'capil') {
    h = `<h2>Капилляры в ванночке</h2>` + chips('Жидкость', [['lq-water', 'Вода', S.liq === 'water'], ['lq-hg', 'Ртуть', S.liq === 'hg']]) +
      chips('Капилляры в жидкости (нажмите)', RS.map((r, i) => ['tube-' + i, `r = ${rs(r)} мм`, S.dip[i]])) + reads('r = 1 мм', 'r = 0,5 мм', 'r = 0,25 мм') +
      `<h3>Записи</h3><div class="rec">` + RS.map(r => step(`вода, r = ${rs(r)} мм`, S.recW[r] != null ? `h = ${fmt(S.recW[r], 0)} мм` : '—')).join('') + RS.filter(r => S.recHg[r] != null).map(r => step(`ртуть, r = ${rs(r)} мм`, `h = ${fmt(S.recHg[r], 0)} мм`)).join('') + `</div>`;
    if (Object.keys(S.recW).length >= 2) h += chips('Во сколько раз выше поднимается вода в трубке вдвое тоньше?', [['ans-2', 'В 2 раза', S.ans], ['ans-4', 'В 4 раза', false], ['ans-1', 'Так же', false]]);
  }
  if (id === 'cryst') {
    h = `<h2>${S.view === 'heat' ? 'Нагреваем образец' : 'Решётки углерода'}</h2>` + chips('Образец', SAMPLES.map(k => ['s-' + k, `${SAMP[k].n} · ${SAMP[k].kind === 'cr' ? 'кристалл' : 'аморфное'}`, S.view === 'heat' && S.samp === k])) +
      chips('Углерод', [['v-diamond', 'Алмаз', S.view === 'diamond'], ['v-graphite', 'Графит', S.view === 'graphite']]);
    if (S.view === 'heat') h += `<div class="row"><button class="ghostbtn" data-a="heat">${S.heat ? 'Пауза' : 'Нагреть'}</button><button class="ghostbtn" data-a="restart">Сначала</button></div>` + reads('T', 'время', 'состояние');
    h += `<h3>Записи</h3><div class="rec">` + step('кристалл', S.crys ? `${SAMP[S.crys].n}: площадка при ${SAMP[S.crys].Tm} °C` : '—') + step('аморфное', S.amor ? `${SAMP[S.amor].n}: площадки нет` : '—') + step('алмаз / графит', `${S.seenD ? '✓' : '—'} / ${S.seenG ? '✓' : '—'}`) + `</div>`;
    if (S.crys && S.amor) h += chips('У какого тела на графике есть площадка?', [['ans-cr', 'У кристалла', S.ans], ['ans-am', 'У аморфного', false], ['ans-both', 'У обоих', false]]);
  }
  if (id === 'strength') {
    h = `<h2>Разрывная машина</h2>` + chips('Материал', MATS.map(k => ['m-' + k, MAT[k].n, S.mat === k])) + chips('Диаметр проволоки', DS.map(d => ['d-' + d, d + ' мм', S.d === d])) +
      slider('inF', 'Нагрузка F', 0, FMAX, 10, S.F) + `<div class="row"><button class="ghostbtn" data-a="f400">400 Н</button><button class="ghostbtn" data-a="f0">Снять нагрузку</button><button class="ghostbtn" data-a="new">Новая проволока</button></div>` + reads('σ, МПа', 'ΔL, мм', 'запас n') +
      `<h3>Записи</h3><div class="rec">` + step('упругая', S.el ? `${MAT[S.el.mat].n}: σ = ${Math.round(S.el.s)} МПа, вернулась` : '—') + step('пластическая', S.pl ? `${MAT[S.pl.mat].n}: осталось ${fmt(S.pl.dl, 1)} мм` : '—') +
      step('400 Н, n ≥ 2', S.pick ? `${MAT[S.pick.mat].n}, ${S.pick.d} мм: n = ${fmt(S.pick.n, 1)}` : '—') + `</div>`;
  }
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inX', e => setPos(+e.target.value));
  on('#inF', e => setF(+e.target.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'tension') {
    if (S.setup === 'frame') { set('#inXO', nf(S.x) + ' см'); val('#inX', S.x); set('#r1', fmt(m.F, 1) + ' мН'); set('#r2', S.bar + ' см'); set('#r3', fmt(m.F / 1000 / (2 * S.bar / 100), 3) + ' Н/м'); }
    else { set('#r1', fmt(CLIP.P, 1) + ' мН'); set('#r2', fmt(m.Fmax, 1) + ' мН'); set('#r3', fmt(SIG[S.liq1], 3) + ' Н/м'); }
  }
  if (id === 'capil') RS.forEach((r, i) => set('#r' + (i + 1), S.dip[i] ? fmt(S.lev[i], 0) + ' мм' : '—'));
  if (id === 'cryst' && S.view === 'heat') { set('#r1', Math.round(S.T) + ' °C'); set('#r2', fmt(S.tm, 1) + ' мин'); set('#r3', softState()); }
  if (id === 'strength') { val('#inF', S.F); set('#inFO', S.F + ' Н'); set('#r1', S.broken ? 'разрыв' : fmt(m.sig, 0)); set('#r2', fmt(m.dl, m.dl < 10 ? 2 : 1)); set('#r3', S.broken ? '—' : m.sig > 0 ? fmt(m.n, 1) : '∞'); }
}

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];

      (Ls.safe ? `<div class="safe"><b>Безопасность</b>${Ls.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

function calcHTML(m) {

        <h3>Перекладина ${S.bar} см</h3><div class="steps">` + step('l', `${S.bar} см = ${fmt(l, 2)} м`) + step('F = 2σl', `2 × 0,04 × ${fmt(l, 2)} = ${fmt(F / 1000, 4)} Н`) + step('в миллиньютонах', `${fmt(F, 1)} мН`, 'sum') + `</div>
        <h3>Найти σ из опыта</h3><div class="steps">` + step('σ = F / (2l)', `${fmt(F / 1000, 4)} / (2 × ${fmt(l, 2)}) = ${fmt(F / 1000 / (2 * l), 3)} Н/м`, 'sum') + `</div>

      <h3>Сравниваем с весом</h3><div class="steps">` + step('вес P = mg', `0,001 кг × 9,8 = ${fmt(CLIP.P, 1)} мН`) + step('чистая вода', `0,073 × 0,22 = ${fmt(Fw, 1)} мН > P`) + step('с мылом', `0,04 × 0,22 = ${fmt(Fs, 1)} мН < P`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">У водомерки ноги покрыты водоотталкивающими волосками, и общая длина их границы с водой велика: насекомое весит около 0,1 мН, а поверхность могла бы держать в несколько раз больше.</p>`;
  }

      <h3>Три капилляра</h3><div class="steps">` + RS.map(r => step(`r = ${rs(r)} мм`, `2 × ${fmt(q.s, 3)} × ${fmt(c, 2)} / (${q.rho} × 9,8 × ${fmt(r / 1000, 5)}) = ${fmt(capH(S.liq, r), 1)} мм`)).join('') + `</div>

      <p class="note" style="margin-top:10px">Столб поднимается, пока его вес ρ g h · πr² не сравняется с силой натяжения вдоль края σ · 2πr · cos θ.</p>`;

    const s = SAMP[S.samp];
    if (s.kind === 'cr') return `<h2>${s.n}: плавление кристалла</h2><div class="formula">Q = c m Δt    Q = λ m</div><p class="note">На 1 г образца. Нагреватель даёт ${s.P} Дж каждую минуту.</p><div class="steps">` +
      step('нагреть твёрдое', `${fmt(s.cs, 1)} × ${s.Tm - s.T0} = ${Math.round(s.cs * (s.Tm - s.T0))} Дж → ${fmt(s.cs * (s.Tm - s.T0) / s.P, 1)} мин`) +
      step('расплавить', `λ = ${s.lam} Дж/г → ${fmt(s.lam / s.P, 1)} мин при ${s.Tm} °C`, 'sum') + step('нагреть жидкость', `${fmt(s.cl, 1)} × ${s.T1 - s.Tm} = ${Math.round(s.cl * (s.T1 - s.Tm))} Дж → ${fmt(s.cl * (s.T1 - s.Tm) / s.P, 1)} мин`) +
      `</div><p class="note" style="margin-top:10px">Всё время плавления теплота уходит на разрушение решётки, а не на рост температуры. Сейчас: ${Math.round(S.T)} °C, ${softState()}.</p>`;
    return `<h2>${s.n}: аморфное тело</h2><div class="formula">tпл нет — только интервал размягчения</div><div class="steps">` + step('начало размягчения', `≈ ${s.Ts1} °C`) + step('становится текучим', `≈ ${s.Ts2} °C`) + step('сейчас', `${Math.round(S.T)} °C · ${softState()}`, 'sum') +
      `</div><p class="note" style="margin-top:10px">Скрытой теплоты плавления нет: решётки нет, разрушать нечего. Температура растёт всё время, лишь чуть медленнее в интервале размягчения. Поэтому стекло выдувают и вытягивают — оно мягкое в широком интервале температур.</p>`;
  }
  const M = MAT[S.mat], A = area(S.d), s = m.sig, s4 = FT / A;
  return `<h2>Напряжение и удлинение</h2><div class="formula">σ = F / S    σ = E·ε</div><p class="note">S = πd²/4. Не путайте: σ здесь — механическое напряжение, а не поверхностное натяжение. 1 МПа = 1 Н/мм².</p>
    <h3>Сейчас: ${M.n.toLowerCase()}, d = ${S.d} мм</h3><div class="steps">` + step('S', `3,14 × ${S.d}² / 4 = ${fmt(A, 2)} мм²`) + step('σ = F / S', `${S.F} / ${fmt(A, 2)} = ${fmt(s, 0)} МПа`) +
    step('ε', S.smax <= M.yt ? `σ / E = ${fmt(s, 0)} / ${M.E} = ${fmt(s / M.E * 100, 3)} %` : `${fmt(m.eps * 100, 2)} % (за пределом текучести)`) + step('ΔL = ε·L₀', `${fmt(m.dl, m.dl < 10 ? 2 : 1)} мм`, 'sum') + `</div>
    <h3>Проверка на 400 Н</h3><div class="steps">` + step('σ при 400 Н', `400 / ${fmt(A, 2)} = ${fmt(s4, 0)} МПа`) + step('ниже σт?', `${M.yt} МПа — ${s4 <= M.yt ? 'да' : 'нет'}`) + step('n = σпч / σ', `${M.ut} / ${fmt(s4, 0)} = ${fmt(M.ut / s4, 1)}`, 'sum') + `</div>
    <p class="note" style="margin-top:10px">Нужна проволока, у которой при 400 Н σ ≤ σт и n ≥ 2.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter');
  const row = (a, b, cls) => `<div class="lr"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`;
  if (id === 'tension') {
    if (S.setup === 'frame') el.innerHTML = `<div class="k">Динамометр</div><div class="v">${fmt(m.F, 1)} мН</div>` + row('l', S.bar + ' см') + row('отметка', nf(S.x) + ' см', S.x >= XT ? 'ok' : '') + row('σ', '0,04 Н/м');
    else el.innerHTML = `<div class="k">Скрепка</div><div class="v ${S.clip === 'float' ? 'ok' : ''}">${S.clip === 'hand' ? 'в пинцете' : S.clip === 'float' ? 'плавает' : 'утонула'}</div>` + row('P', fmt(CLIP.P, 1) + ' мН') + row('держит', fmt(m.Fmax, 1) + ' мН', m.Fmax > CLIP.P ? 'ok' : 'bad') + row('σ', fmt(SIG[S.liq1], 3) + ' Н/м');
  } else if (id === 'capil') {
    el.innerHTML = `<div class="k">${LIQ[S.liq].n} · подъём h</div>` + RS.map((r, i) => row(`r ${rs(r)} мм`, S.dip[i] ? fmt(S.lev[i], 0) + ' мм' : '—', S.dip[i] ? (S.lev[i] >= 0 ? 'ok' : 'bad') : '')).join('');
  } else if (id === 'cryst') {
    if (S.view === 'heat') el.innerHTML = `<div class="k">Термопара</div><div class="v">${Math.round(S.T)} °C</div>` + row('t', fmt(S.tm, 1) + ' мин') + row('', softState(), S.f > 0 ? 'ok' : '');
    else el.innerHTML = `<div class="k">Углерод</div><div class="v">${S.view === 'diamond' ? 'Алмаз' : 'Графит'}</div>` + row('Моос', S.view === 'diamond' ? '10' : '1–2') + row('ток', S.view === 'diamond' ? 'нет' : 'есть', S.view === 'diamond' ? 'bad' : 'ok');
  } else {
    const M = MAT[S.mat];
    el.innerHTML = `<div class="k">Датчик силы</div><div class="v">${S.broken ? 'разрыв' : S.F + ' Н'}</div>` + row('σ', fmt(m.sig, 0) + ' МПа', m.sig > M.yt ? 'bad' : '') + row('ΔL', fmt(m.dl, m.dl < 10 ? 2 : 1) + ' мм') + row('n', S.broken ? '—' : m.sig > 0 ? fmt(m.n, 1) : '∞', m.sig > 0 && m.n >= 2 && m.sig <= M.yt ? 'ok' : m.sig > 0 ? 'bad' : '');
  }
}

function update() {
  latch();
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Теперь вы знаете, как устроены жидкости и твёрдые тела!'), 2200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  tension: '<path d="M44 6H10v18h34" fill="none" stroke="#c8d2e3" stroke-width="1.6"/><rect x="11" y="7" width="20" height="16" fill="#c79bff" opacity=".45"/><rect x="30" y="4" width="2.4" height="22" fill="#c9a24a"/><rect x="38" y="12" width="16" height="6" rx="2" fill="#2b6d7c"/>',
  capil: '<rect x="6" y="18" width="54" height="11" fill="#5fb4d9" opacity=".55"/><rect x="18" y="4" width="5" height="24" fill="#101826" stroke="#cfe8f5"/><rect x="19" y="13" width="3" height="15" fill="#5fb4d9"/><rect x="38" y="2" width="3" height="26" fill="#101826" stroke="#cfe8f5" stroke-width=".8"/><rect x="38.8" y="5" width="1.4" height="23" fill="#5fb4d9"/>',
  cryst: '<g fill="#9fd8f0"><circle cx="8" cy="8" r="2.4"/><circle cx="15" cy="8" r="2.4"/><circle cx="22" cy="8" r="2.4"/><circle cx="8" cy="15" r="2.4"/><circle cx="15" cy="15" r="2.4"/><circle cx="22" cy="15" r="2.4"/><circle cx="8" cy="22" r="2.4"/><circle cx="15" cy="22" r="2.4"/><circle cx="22" cy="22" r="2.4"/></g><path d="M32 26l8-10h10l8-12" fill="none" stroke="#ffb547" stroke-width="2"/>',
  strength: '<rect x="8" y="3" width="3" height="25" fill="#6c7a96"/><rect x="24" y="3" width="3" height="25" fill="#6c7a96"/><rect x="6" y="2" width="23" height="3" fill="#3a4762"/><rect x="16.5" y="6" width="2" height="16" fill="#a9b4c9"/><path d="M36 27l3-17q6-4 10-2l9 4" fill="none" stroke="#ffb547" stroke-width="1.8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'tension') now = S.setup === 'frame'
    ? `П-образная проволочная рамка с мыльной плёнкой (σ ≈ 0,04 Н/м, две поверхности). Перекладина длиной ${S.bar} см стоит на отметке ${nf(S.x)} см, динамометр показывает ${fmt(m.F, 1)} мН. Записи (растянуть до 6 см): ${BARS.filter(l => S.rec1[l] != null).map(l => `${l} см — ${fmt(S.rec1[l], 1)} мН`).join('; ') || 'нет'}. Значения не называй заранее — наводи к F = 2σl и к тому, что сила не зависит от растяжения.`
    : `Стеклянная ванночка с ${S.liq1 === 'water' ? 'чистой водой (σ = 0,073 Н/м)' : 'мыльной водой (σ ≈ 0,04 Н/м)'}. Стальная скрепка 1 г (вес 9,8 мН), граница с водой 22 см: ${S.clip === 'hand' ? 'в пинцете' : S.clip === 'float' ? 'лежит на поверхности' : 'утонула'}. Плавала на чистой воде — ${S.fl ? 'да' : 'нет'}; утонула после мыла — ${S.sk ? 'да' : 'нет'}. Наводи к сравнению σ·L с весом.`;
  if (id === 'capil') now = `Ванночка с ${S.liq === 'water' ? 'водой (σ = 0,073 Н/м, θ ≈ 0°)' : 'ртутью (σ ≈ 0,47 Н/м, ρ = 13 600 кг/м³, θ ≈ 140°)'}. Капилляры радиусом 1; 0,5; 0,25 мм: ${RS.map((r, i) => `${rs(r)} мм — ${S.dip[i] ? `в жидкости, h = ${fmt(S.lev[i], 0)} мм` : 'поднят'}`).join('; ')}. Записи воды: ${RS.filter(r => S.recW[r] != null).map(r => `${rs(r)} мм — ${fmt(S.recW[r], 0)} мм`).join('; ') || 'нет'}; ртуть: ${RS.filter(r => S.recHg[r] != null).map(r => `${rs(r)} мм — ${fmt(S.recHg[r], 0)} мм`).join('; ') || 'нет'}. Вывод про «вдвое тоньше» ${S.ans ? 'сделан' : 'не сделан'}. Ответ не называй — наводи к h = 2σ/(ρgr).`;
  if (id === 'cryst') now = S.view === 'heat'
    ? `В тигле ${SAMP[S.samp].n.toLowerCase()} (${SAMP[S.samp].kind === 'cr' ? 'кристалл' : 'аморфное тело'}), нагрев ${S.heat ? 'идёт' : 'выключен'}: прошло ${fmt(S.tm, 1)} мин, T = ${Math.round(S.T)} °C, состояние — ${softState()}. Записи: кристалл — ${S.crys ? SAMP[S.crys].n : 'нет'}; аморфное — ${S.amor ? SAMP[S.amor].n : 'нет'}; алмаз ${S.seenD ? 'смотрели' : 'не смотрели'}, графит ${S.seenG ? 'смотрели' : 'не смотрели'}. Вывод про площадку ${S.ans ? 'сделан' : 'не сделан'}. Наводи вопросами, где температура переставала расти.`
    : `На экране решётки углерода, выбран ${S.view === 'diamond' ? 'алмаз' : 'графит'}. Наводи к тому, что свойства зависят от расположения атомов, а не только от состава.`;
  if (id === 'strength') { const M = MAT[S.mat]; now = `Разрывная машина: ${M.adj} проволока d = ${S.d} мм, L₀ = 1 м (E = ${M.E / 1000} ГПа, σт = ${M.yt} МПа, σпч = ${M.ut} МПа). Нагрузка ${S.F} Н, σ = ${fmt(m.sig, 0)} МПа, ΔL = ${fmt(m.dl, 2)} мм, ${S.broken ? 'образец разорван' : S.ep > 0 ? `остаточное удлинение ${fmt(S.ep * L0, 1)} мм` : 'остаточного удлинения нет'}. Подзадачи: упругая разгрузка — ${S.el ? 'есть' : 'нет'}; пластическая — ${S.pl ? 'есть' : 'нет'}; проволока на 400 Н с n ≥ 2 — ${S.pick ? `${MAT[S.pick.mat].n}, ${S.pick.d} мм` : 'не найдена'}. Подходящую проволоку не называй — наводи к σ = F/S, сравнению с σт и n = σпч/σ.`; }
  return [
    `Раздел: физика, 10 класс, тема «Свойства жидкостей и твёрдых тел». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { tension: 'Почему мыльный пузырь круглый?', capil: 'Как вода поднимается в дереве?', cryst: 'Почему алмаз твёрдый, а графит мягкий?', strength: 'Зачем мостам запас прочности?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-solids.js): the same set-up as real lab equipment
window.LUCH_REAL = () => {
  const id = LID(), M = { module: 'solids' };
  if (id === 'tension') return S.setup === 'frame'
    ? { ...M, scene: 'solids-frame', help: 'Перекладина — сменить длину, кольцо динамометра — тянуть', bar: S.bar, xT: XT }
    : { ...M, scene: 'solids-clip', help: 'Скрепка — положить или достать, флакон — капнуть мыло', clip: S.clip, soap: S.liq1 === 'soap' };
  if (id === 'capil') return { ...M, scene: 'solids-capil', help: 'Капилляр — опустить или поднять, ванночка — сменить жидкость', liq: S.liq, dip: S.dip.slice() };
  if (id === 'cryst') return S.view === 'heat'
    ? { ...M, scene: 'solids-heat', help: 'Печь — нагрев, тигель — сменить образец, модель решётки — алмаз', samp: S.samp, kind: SAMP[S.samp].kind, name: SAMP[S.samp].n, hot: SAMP[S.samp].hot }
    : { ...M, scene: 'solids-carbon', help: 'Модель — выбрать алмаз или графит, подставка — вернуться к нагреву', view: S.view };
  return { ...M, scene: 'solids-tensile', help: 'Рукоятка — нагрузить на 100 Н, датчик — снять нагрузку, катушки — материал', mat: S.mat, d: S.d, col: MAT[S.mat].col, name: MAT[S.mat].n, broken: S.broken };
};
// live values for smooth motion in 3D
window.LUCH_REAL.live = () => ({ x: S.x, F: LID() === 'tension' ? filmF(S.bar) : S.F, clipY: S.clip === 'sink' ? (S.clipY - DISH.s) / (DISH.bot - 8 - DISH.s) : 0,
  lev: S.lev.slice(), T: S.T, f: S.f, heat: S.heat, eps: LID() === 'strength' ? (S.broken ? S.ep : eps4()) : 0, sig: LID() === 'strength' ? sig4() : 0 });
window.LUCH_REAL.click = k => {
  const id = LID();
  if (k === 'pull') { if (id === 'tension') return setPos(S.x >= 9 ? 1 : S.x + 1); return setF(S.F + 100); }
  if (k === 'liq') return act('lq-' + (S.liq === 'water' ? 'hg' : 'water'));
  if (k === 'samp') return act('s-' + SAMPLES[(SAMPLES.indexOf(S.samp) + 1) % SAMPLES.length]);
  if (k === 'mat') return act('m-' + MATS[(MATS.indexOf(S.mat) + 1) % MATS.length]);
  if (k === 'back') return act('s-' + S.samp);
  act(k);
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
