<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 10 класс: алканы, алкены и алкины, арены (бензол), нефть и природный газ.">
<title>Углеводороды</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Lab table (SVG) on the left, lesson notebook on the right, lesson strip under the board. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene.rot{cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.goals{display:grid;gap:6px;margin-top:10px}
.goals div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 11px;font-size:13.5px}
.goals span{font:500 13px var(--font-mono);color:var(--muted)}
.goals .on span{color:var(--ok)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 8l10 6v12l-10 6-10-6V14z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 8V3M30 14l4-2.5M30 26l4 2.5M10 14l-4-2.5" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Углеводороды</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол: углеводороды">
    <svg class="scene" id="scene" role="img" aria-label="Опыты с углеводородами: модели молекул, пробирки с бромной водой, ректификационная колонна."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-hydro';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fml = (c, h, x) => low('C' + (c > 1 ? c : '') + 'H' + (h > 1 ? h : '')) + (x || '');
const C_COL = '#4f586d', H_COL = '#eef2f8', CL_COL = '#7bd88f', BR_COL = '#c0542f';

// ---------- lesson 1: alkanes ----------
const ROOT = ['', 'метан', 'этан', 'пропан', 'бутан', 'пентан', 'гексан', 'гептан', 'октан', 'нонан', 'декан'];
const BP = [0, -161.5, -88.6, -42.1, -0.5, 36.1, 68.7, 98.4, 125.7, 150.8, 174.1];   // °C, normal boiling points
const ROOM = 20;
const clName = n => n === 1 ? 'хлорметан' : n === 2 ? 'хлорэтан' : '1-хлор' + ROOT[n];

// ---------- lesson 2: three unlabeled gas cylinders and bromine water ----------
const GAS = {
  ethane: { name: 'этан', f: 'C₂H₆', k: 0, cond: 'CH₃–CH₃' },
  ethene: { name: 'этилен', f: 'C₂H₄', k: 1, cond: 'CH₂=CH₂' },
  ethyne: { name: 'ацетилен', f: 'C₂H₂', k: 2, cond: 'HC≡CH' },
};
const CYL = ['A', 'B', 'C'];
const SECRET = { A: 'ethene', B: 'ethane', C: 'ethyne' };   // hidden from the student and from the tutor
const PORTION = 10, VM = 22.4, BR0 = 1.0;                    // мл газа за раз, л/моль, ммоль Br₂ в пробирке

// ---------- lesson 3: benzene ----------
const BCX = 260, BCY = 235, BR = 66;
const bAng = i => -Math.PI / 2 + i * Math.PI / 3;
const bPos = (i, r = BR) => [BCX + r * Math.cos(bAng(i)), BCY + r * Math.sin(bAng(i))];

// ---------- lesson 4: oil refining ----------
const ZONES = [
  { n: 'Газ', t: 'до 40 °C', c: 'C₁–C₄', lo: -300, hi: 40, use: 'топливо для плит и ТЭЦ, сырьё для полипропилена' },
  { n: 'Бензин', t: '40–180 °C', c: 'C₅–C₁₀', lo: 40, hi: 180, use: 'топливо для легковых машин, растворители' },
  { n: 'Керосин', t: '180–270 °C', c: 'C₁₁–C₁₆', lo: 180, hi: 270, use: 'топливо для самолётов' },
  { n: 'Дизельное топливо', t: '270–360 °C', c: 'C₁₆–C₂₀', lo: 270, hi: 360, use: 'грузовики, тракторы, тепловозы' },
  { n: 'Мазут', t: 'выше 360 °C', c: 'C₂₀ и больше', lo: 360, hi: 900, use: 'котельные, смазочные масла, гудрон и асфальт' },
];
const SAMPLES = [
  { f: 'C₇H₁₆', name: 'гептан', bp: 98.4 },
  { f: 'C₃H₈', name: 'пропан', bp: -42.1 },
  { f: 'C₁₂H₂₆', name: 'додекан', bp: 216 },
  { f: 'C₂₆H₅₄', name: 'гексакозан', bp: 412 },
  { f: 'C₁₇H₃₆', name: 'гептадекан', bp: 302 },
  { f: 'C₉H₂₀', name: 'нонан', bp: 151 },
  { f: 'C₄H₁₀', name: 'бутан', bp: -0.5 },
];
const zoneOf = bp => ZONES.findIndex(z => bp < z.hi);
const ZX = 128, ZY = 100, ZW = 352, ZH = 44, ZG = 4;
const zY = i => ZY + i * (ZH + ZG);
const CARD = { x: 170, y: 352, w: 220, h: 36 };

const LESSONS = [
  { id: 'alkanes', title: 'Алканы',
    text: ['Алканы — предельные углеводороды: все связи между атомами углерода одинарные, углерод в состоянии sp³. Общая формула CₙH₂ₙ₊₂. Метан CH₄, этан C₂H₆, пропан C₃H₈ и дальше — каждый следующий длиннее на группу CH₂. Такой ряд называют гомологическим.',
           'С ростом цепи растёт молярная масса и сильнее притяжение между молекулами. Поэтому C₁–C₄ при комнатной температуре — газы, с C₅ — жидкости, а примерно с C₁₈ — твёрдые вещества (парафин).',
           'Алканы малоактивны: с бромной водой и марганцовкой не реагируют. Типичные реакции — горение и замещение. На свету хлор замещает атом водорода: CH₄ + Cl₂ → CH₃Cl + HCl. Это цепная радикальная реакция.'],
    why: 'Метан — главная часть природного газа, которым в Казахстане топят ТЭЦ и котлы и готовят еду дома. Пропан-бутан везут в баллонах и заправляют в машины на АГЗС. Инженеры газовых компаний («QazaqGaz», Карачаганак) следят за составом газа и давлением в трубах; оператор газовой котельной — рабочая профессия, которая нужна в каждом городе.',
    safe: 'Метан и пропан-бутан горят, а с воздухом дают взрывчатую смесь. Пахнет газом — не включайте свет и огонь, откройте окна, выйдите и звоните 104. Хлор ядовит: опыт с ним ставят только под тягой.',
    task: 'Найдите самый лёгкий алкан, который при 20 °C — жидкость, и проведите с ним хлорирование на свету.',
    hint: 'Меняйте длину цепи кнопками «−» и «+» и смотрите на шкалу: зелёная линия — комнатная температура, метка — температура кипения. Потом нажмите «Cl₂ + свет».',
    stage: '«−» и «+» меняют длину цепи. «Cl₂ + свет» — реакция замещения.',
    init: { n: 1 },
    check: m => m.n === 5 && m.sub },
  { id: 'unsat', title: 'Алкены и алкины',
    text: ['Алкены (CₙH₂ₙ) содержат одну двойную связь C=C, первый в ряду — этилен CH₂=CH₂. Алкины (CₙH₂ₙ₋₂) — тройную связь C≡C, первый — ацетилен HC≡CH. Это непредельные углеводороды.',
           'π-связи непрочные, поэтому для алкенов и алкинов типичны реакции присоединения. Бромная вода (жёлто-оранжевая) обесцвечивается: CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br. По двойной связи присоединяется одна молекула Br₂, по тройной — две: HC≡CH + 2Br₂ → CHBr₂–CHBr₂. Раствор KMnO₄ тоже обесцвечивается.',
           'Алканы так не умеют: этан бромную воду не обесцвечивает. Это качественная реакция на кратную связь.'],
    why: 'Из этилена делают полиэтилен — пакеты, плёнку для теплиц, трубы. В Атырау строят газохимический комплекс, где из этана будут получать этилен и полиэтилен; там нужны операторы установок, лаборанты и инженеры-химики. Ацетиленом сварщики режут и сваривают металл — с хорошим разрядом это одна из самых востребованных рабочих профессий.',
    safe: 'Бром ядовит и обжигает кожу — бромную воду наливают в перчатках под тягой. Ацетилен и этилен горючи, баллон с ацетиленом нельзя нагревать и ронять.',
    task: 'В баллонах A, B и C — этан, этилен и ацетилен, но этикетки потеряны. Определите опытом с бромной водой, где какой газ, и подпишите все три.',
    hint: 'Выберите баллон, нажмите «Пропустить 10 мл» и посмотрите, какая доля брома прореагировала. Сравните баллоны: по тройной связи брома уходит вдвое больше. «Новая пробирка» — свежая бромная вода.',
    stage: 'Нажмите на баллон — он подключится к пробирке.',
    init: { sel: 'A' },
    check: m => m.right === 3 },
  { id: 'arenes', title: 'Арены: бензол',
    text: ['Арены — углеводороды с бензольным кольцом. Простейший — бензол C₆H₆, общая формула гомологов CₙH₂ₙ₋₆. Кекуле в 1865 году нарисовал бензол как кольцо с чередующимися одинарными и двойными связями.',
           'Но измерения показали: все шесть связей C–C в бензоле одинаковые — 0,139 нм. Это меньше одинарной (0,154 нм) и больше двойной (0,134 нм). Шесть π-электронов не сидят на отдельных связях, а образуют общее облако над и под кольцом. Его рисуют кружком внутри шестиугольника.',
           'Общее π-облако устойчиво, поэтому бензол, в отличие от алкенов, не обесцвечивает бромную воду. Для него типично замещение: с бромом при катализаторе FeBr₃ получается бромбензол — C₆H₆ + Br₂ → C₆H₅Br + HBr. Кольцо при этом сохраняется.'],
    why: 'Из бензола и его гомологов получают пластмассы (полистирол — одноразовая посуда, пенопласт), капрон, красители, лекарства. В Казахстане ароматические углеводороды выпускает комплекс на Атырауском НПЗ — там работают технологи и лаборанты. Химики-аналитики санэпидемслужбы следят, чтобы бензола не было в воздухе и воде: он ядовит.',
    safe: 'Бензол ядовит и вызывает болезни крови: в школе с ним опыты не ставят, только смотрят видео и модели. Ароматические растворители (толуол, ксилол) открывают только при проветривании.',
    task: 'Измерьте длину трёх связей кольца, выберите модель, которая с ними согласуется, и проведите реакцию, характерную для бензола.',
    hint: 'Нажимайте на связи кольца — прибор покажет их длину. Сравните с тем, что обещает модель Кекуле. Потом попробуйте оба реагента внизу.',
    stage: 'Нажмите на связь, чтобы измерить её длину.',
    init: { view: 'kek' },
    check: m => m.meas >= 3 && m.view === 'ring' && m.react === 'fe' },
  { id: 'oil', title: 'Нефть и газ',
    text: ['Нефть — смесь сотен углеводородов, в основном алканов, циклоалканов и аренов. Природный газ — почти чистый метан (до 98 %), а попутный газ, который выходит вместе с нефтью, содержит ещё этан, пропан и бутан.',
           'На НПЗ нефть нагревают до 350–400 °C и подают в ректификационную колонну. Внизу горячо, наверху холодно. Лёгкие молекулы с низкой температурой кипения поднимаются выше и конденсируются наверху, тяжёлые — внизу. Так нефть делят на фракции: газ, бензин, керосин, дизельное топливо, мазут.',
           'Тяжёлых фракций много, а бензина нужно больше. Поэтому длинные молекулы расщепляют крекингом: C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆ — получаются алкан и алкен покороче.'],
    why: 'Нефть и газ дают Казахстану большую часть экспорта. Тенгиз, Кашаган, Карачаганак — крупнейшие месторождения, а НПЗ работают в Атырау, Павлодаре и Шымкенте. Инженер-технолог НПЗ, оператор установки, геолог, буровик, лаборант по качеству топлива — профессии с одной из самых высоких зарплат в стране. Даже водителю полезно знать, чем АИ-92 отличается от дизеля.',
    safe: 'Пары бензина и керосина легко вспыхивают. Не храните топливо в квартире и не разжигайте им костёр. На АЗС нельзя курить и пользоваться открытым огнём.',
    task: 'Разложите все 7 образцов по фракциям колонны и проведите крекинг тяжёлой молекулы.',
    hint: 'Перетащите карточку с образцом на нужную полку (или просто нажмите на полку). Смотрите на температуру кипения образца. Потом нажмите «Крекинг».',
    stage: 'Тащите карточку на полку колонны. Наверху — самые лёгкие фракции.',

    check: m => m.placed === SAMPLES.length && m.cracked },

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            n: 1, sub: false, seen: {},
            sel: 'A', tube: null, res: {}, lab: {}, wrong: 0,
            view: 'kek', meas: {}, react: null, lastBond: -1,
            cur: 0, placed: {}, cracked: false, card: null, T: 20, miss: 0 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

// ---------- model ----------
function model() {
  const id = LID();
  if (id === 'alkanes') {
    const n = S.n, h = 2 * n + 2;
    return { kind: 'alk', n, h, M: 12 * n + h, bp: BP[n], gas: BP[n] < ROOM, sub: S.sub, f: fml(n, h) };
  }
  if (id === 'unsat') {
    const t = S.tube, gas = t ? GAS[SECRET[t.cyl]] : null;
    const nGas = t ? t.vol / VM : 0, nBr = gas ? Math.min(BR0, nGas * gas.k) : 0;
    return { kind: 'br', t, nGas, nBr, frac: nBr / BR0, tested: Object.keys(S.res).length,
             right: CYL.filter(c => S.lab[c] === SECRET[c]).length, labeled: Object.keys(S.lab).length };
  }
  if (id === 'arenes') return { kind: 'benz', meas: Object.keys(S.meas).length, view: S.view, react: S.react };
  const placed = Object.keys(S.placed).length, s = SAMPLES[S.cur];
  return { kind: 'oil', placed, cracked: S.cracked, s: placed < SAMPLES.length ? s : null };
}

// ---------- drawing helpers ----------
const scene = $('#scene');
const atomSVG = (x, y, r, fill, label, fs, tc, ring) =>
  `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r + 1.6).toFixed(1)}" fill="${INK}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="${ring || 'rgba(255,255,255,.18)'}" stroke-width="${ring ? 2.6 : 1.2}"/>` +
  `<ellipse cx="${(x - r * 0.33).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" rx="${(r * 0.32).toFixed(1)}" ry="${(r * 0.2).toFixed(1)}" fill="#fff" opacity=".14"/>` +
  `<text x="${x.toFixed(1)}" y="${(y + fs * 0.36).toFixed(1)}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="500">${label}</text>`;
const line = (p, q, col, w) => `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.4}" stroke-linecap="round"/><path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
const boardBg = () => `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs><rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
const label = (txt, col) => `<text x="260" y="396" font-size="13" fill="${col || '#8b96ad'}" text-anchor="middle">${txt}</text>`;

// lesson 1: zigzag chain + boiling scale
const chainXY = n => { const sp = n > 1 ? Math.min(46, 380 / (n - 1)) : 0, x0 = 260 - (n - 1) * sp / 2; return Array.from({ length: n }, (x, i) => [x0 + i * sp, 205 + (i % 2 ? 16 : -16) * (n > 1 ? 1 : 0)]); };
const TX = t => 50 + (t + 180) / 380 * 420;
function drawAlk(m) {
  let h = boardBg();
  const P = chainXY(m.n), r = m.n > 7 ? 15 : 17;
  for (let i = 1; i < P.length; i++) h += line(P[i - 1], P[i], '#c8d1e2', 3.2);
  if (m.sub) { const p = P[0], q = [p[0] - 30, p[1] - 30]; h += line(p, q, '#c8d1e2', 2.4) + atomSVG(q[0], q[1], 12, CL_COL, 'Cl', 10, INK); }
  P.forEach((p, i) => {
    let hh = m.n === 1 ? 4 : (i === 0 || i === m.n - 1) ? 3 : 2;
    if (m.sub && i === 0) hh--;
    h += atomSVG(p[0], p[1], r, C_COL, 'CH' + (hh > 1 ? SUBD[hh] : ''), m.n > 7 ? 9.5 : 10.5, '#fff');
  });
  h += `<text x="260" y="150" font-size="15" fill="#e8ecf4" text-anchor="middle">${m.sub ? clName(m.n) + ' · ' + fml(m.n, m.h - 1, 'Cl') : ROOT[m.n] + ' · ' + m.f}</text>`;
  // boiling scale
  const y = 300;
  h += `<rect x="50" y="${y - 4}" width="420" height="8" rx="4" fill="#26324a"/><rect x="50" y="${y - 4}" width="${(TX(ROOM) - 50).toFixed(1)}" height="8" rx="4" fill="rgba(95,180,217,.35)"/>`;
  for (const t of [-150, -100, -50, 0, 50, 100, 150, 200]) h += `<path d="M${TX(t)} ${y + 6}v6" stroke="#56627d"/><text x="${TX(t)}" y="${y + 24}" font-size="10" fill="#8b96ad" text-anchor="middle">${t > 0 ? '+' : ''}${String(t).replace('-', '−')}</text>`;
  h += `<path d="M${TX(ROOM)} ${y - 22}V${y + 10}" stroke="#86e0a8" stroke-width="2" stroke-dasharray="3 3"/><text x="${TX(ROOM)}" y="${y - 27}" font-size="10" fill="#86e0a8" text-anchor="middle">20 °C</text>`;
  for (let k = 1; k <= 10; k++) if (S.seen[k] && k !== m.n) h += `<circle cx="${TX(BP[k]).toFixed(1)}" cy="${y}" r="3.5" fill="#8b96ad"/>`;
  const bx = TX(m.bp);
  h += `<path d="M${bx.toFixed(1)} ${y - 10}V${y + 10}" stroke="#ffb547" stroke-width="3"/><text x="${bx.toFixed(1)}" y="${y + 42}" font-size="11.5" fill="#ffb547" text-anchor="middle">t кип ${fmt(m.bp, 1)} °C</text>`;
  h += `<text x="50" y="${y - 14}" font-size="10.5" fill="#5fb4d9">кипит ниже 20 °C → газ</text><text x="470" y="${y - 14}" font-size="10.5" fill="#8b96ad" text-anchor="end">жидкость при 20 °C</text>`;
  h += label(`${m.f} · M = ${m.M} г/моль · при 20 °C ${m.gas ? 'газ' : 'жидкость'}`, m.gas ? '#5fb4d9' : '#86e0a8');
  return h;
}

// lesson 2: cylinders and a test tube
const CYLX = { A: 140, B: 260, C: 380 };
function drawBr(m, t) {
  let h = boardBg();
  for (const c of CYL) {
    const x = CYLX[c], sel = S.sel === c;
    h += `<rect x="${x - 24}" y="112" width="48" height="96" rx="20" fill="#2a3550" stroke="${sel ? '#ffb547' : '#3a4762'}" stroke-width="${sel ? 2.6 : 1.4}"/><rect x="${x - 8}" y="100" width="16" height="14" rx="3" fill="#56627d"/>` +
      `<text x="${x}" y="168" font-size="22" fill="${sel ? '#ffb547' : '#e8ecf4'}" text-anchor="middle" font-weight="500">${c}</text>`;
    const lab = S.lab[c] ? GAS[S.lab[c]].name : S.res[c] !== undefined ? 'опыт сделан' : 'без этикетки';
    h += `<text x="${x}" y="226" font-size="11" fill="${S.lab[c] ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">${lab}</text>`;
  }
  // pipe from the selected cylinder to the tube
  const sx = CYLX[S.sel];
  h += `<path d="M${sx} 100V88H${sx === 260 ? 260 : sx}" fill="none" stroke="#56627d" stroke-width="3"/>`;
  h += `<path d="M${sx} 88H470V250H272V352" fill="none" stroke="#56627d" stroke-width="3" stroke-linejoin="round"/>`;
  // tube
  const tx = 260, top = 262, bot = 372, w = 40, shown = S.tube ? S.tube.shown : 0;
  const alpha = (1 - shown) * 0.92;
  h += `<path d="M${tx - w / 2} ${top}V${bot - 20}A${w / 2} ${w / 2} 0 0 0 ${tx + w / 2} ${bot - 20}V${top}" fill="rgba(200,215,240,.06)" stroke="#8b96ad" stroke-width="1.6"/>`;
  h += `<path d="M${tx - w / 2 + 2} ${top + 30}V${bot - 20}A${w / 2 - 2} ${w / 2 - 2} 0 0 0 ${tx + w / 2 - 2} ${bot - 20}V${top + 30}Z" fill="rgba(240,150,40,${alpha.toFixed(3)})" stroke="rgba(255,255,255,.12)"/>`;
  h += `<path d="M${tx - w / 2 + 2} ${top + 30}H${tx + w / 2 - 2}" stroke="rgba(255,255,255,.25)"/>`;
  if (S.tube && S.tube.bub > t) for (let i = 0; i < 6; i++) {
    const ph = ((t / 700) + i / 6) % 1;
    h += `<circle cx="${(tx + Math.sin(i * 2.1 + t / 300) * 6).toFixed(1)}" cy="${(bot - 8 - ph * 70).toFixed(1)}" r="${(2 + (i % 3)).toFixed(1)}" fill="none" stroke="#e8ecf4" stroke-opacity=".7"/>`;
  }
  h += `<text x="${tx + 34}" y="${top + 40}" font-size="11" fill="#8b96ad">бромная вода</text><text x="${tx + 34}" y="${top + 55}" font-size="11" fill="#8b96ad">Br₂ ${fmt(BR0, 1)} ммоль</text>`;
  h += `<text x="${tx - 34}" y="${top + 40}" font-size="11" fill="#8b96ad" text-anchor="end">газ ${S.tube ? S.tube.vol : 0} мл</text><text x="${tx - 34}" y="${top + 55}" font-size="11" fill="#8b96ad" text-anchor="end">из баллона ${S.tube ? S.tube.cyl : S.sel}</text>`;
  h += label(S.tube ? `Прореагировало брома: ${Math.round(m.frac * 100)} %` + (m.frac === 0 ? ' — окраска не изменилась' : m.frac >= 1 ? ' — раствор бесцветный' : '') : 'Нажмите «Пропустить 10 мл»', m.frac > 0 ? '#ffb547' : '#8b96ad');
  return h;
}

// lesson 3: benzene ring
function drawBenz(m) {
  let h = boardBg();
  for (let i = 0; i < 6; i++) {
    const p = bPos(i), q = bPos((i + 1) % 6), hit = S.lastBond === i, on = S.meas[i];
    const col = hit ? '#ffb547' : on ? '#86e0a8' : '#c8d1e2';
    h += line(p, q, col, 3.4);
    if (S.view === 'kek' && i % 2 === 0) {
      const a = bPos(i, BR - 12), b = bPos((i + 1) % 6, BR - 12), dx = b[0] - a[0], dy = b[1] - a[1];
      h += line([a[0] + dx * 0.12, a[1] + dy * 0.12], [b[0] - dx * 0.12, b[1] - dy * 0.12], '#72d4e8', 3);
    }
    if (on) { const mm = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], o = [BCX + (mm[0] - BCX) * 1.45, BCY + (mm[1] - BCY) * 1.45];
      h += `<text x="${o[0].toFixed(1)}" y="${(o[1] + 4).toFixed(1)}" font-size="10.5" fill="${hit ? '#ffb547' : '#86e0a8'}" text-anchor="middle">0,139</text>`; }
  }
  if (S.view === 'ring') h += `<circle cx="${BCX}" cy="${BCY}" r="40" fill="none" stroke="#72d4e8" stroke-width="3"/>`;
  for (let i = 0; i < 6; i++) {
    const p = bPos(i), q = bPos(i, BR + 44), br = i === 0 && S.react === 'fe';
    h += line(p, q, '#c8d1e2', 2.2) + atomSVG(q[0], q[1], br ? 13 : 9.5, br ? BR_COL : H_COL, br ? 'Br' : 'H', br ? 11 : 9.5, br ? '#fff' : '#0b1019');
    h += atomSVG(p[0], p[1], 15, C_COL, 'C', 12, '#fff');
  }
  const txt = S.react === 'fe' ? 'C₆H₆ + Br₂ → C₆H₅Br + HBr (FeBr₃) · бромбензол' : S.react === 'water' ? 'Бромная вода: окраска не исчезла — присоединения нет'
    : S.lastBond >= 0 ? `Связь ${S.lastBond + 1}–${(S.lastBond + 1) % 6 + 1}: 0,139 нм${S.view === 'kek' ? ` (модель Кекуле обещает ${S.lastBond % 2 === 0 ? '0,134' : '0,154'})` : ''}` : 'Нажмите на связь кольца';
  h += label(txt, S.react === 'fe' ? '#86e0a8' : S.react === 'water' ? '#ffb547' : '#8b96ad');
  return h;
}

// lesson 4: column and shelves
function drawOil(m) {
  let h = boardBg();
  // column
  h += `<defs><linearGradient id="col" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7a3b22"/><stop offset="1" stop-color="#22324d"/></linearGradient></defs>`;
  h += `<rect x="52" y="${ZY - 8}" width="56" height="${5 * (ZH + ZG) + 12}" rx="14" fill="url(#col)" stroke="#56627d" stroke-width="1.6"/>`;
  const by = ZY + 5 * (ZH + ZG) + 4;
  h += `<path d="M64 ${by + 4}q6 -12 0 -18q12 6 8 18M86 ${by + 4}q6 -12 0 -18q12 6 8 18" fill="#ffb547" opacity=".85"/>`;
  h += `<text x="80" y="${ZY - 14}" font-size="10" fill="#8b96ad" text-anchor="middle">холоднее</text><text x="80" y="${by + 18}" font-size="10" fill="#ffb547" text-anchor="middle">нефть ~380 °C</text>`;
  ZONES.forEach((z, i) => {
    const y = zY(i), boil = S.T > z.lo, hl = S.card && S.card.zone === i;
    h += `<path d="M58 ${y + ZH / 2}h44" stroke="#8b96ad" stroke-width="1.4"/><path d="M108 ${y + ZH / 2}H${ZX}" stroke="#56627d" stroke-width="2"/>`;
    h += `<rect x="${ZX}" y="${y}" width="${ZW}" height="${ZH}" rx="9" fill="${hl ? 'rgba(255,181,71,.12)' : boil ? 'rgba(114,212,232,.08)' : 'rgba(26,36,56,.85)'}" stroke="${hl ? '#ffb547' : boil ? '#3d6b80' : '#26324a'}" stroke-width="${hl ? 2 : 1.2}"/>`;
    h += `<text x="${ZX + 10}" y="${y + 18}" font-size="12" fill="#e8ecf4" font-weight="500">${z.n}</text><text x="${ZX + 10}" y="${y + 34}" font-size="10" fill="#8b96ad">${z.t} · ${z.c}</text>`;
    const here = SAMPLES.map((s, k) => ({ s, k })).filter(o => S.placed[o.k] === i);
    here.forEach((o, j) => { const x = ZX + ZW - 8 - (here.length - j) * 62; h += `<rect x="${x}" y="${y + 11}" width="58" height="22" rx="6" fill="#2a3550" stroke="#86e0a8"/><text x="${x + 29}" y="${y + 26}" font-size="10.5" fill="#86e0a8" text-anchor="middle">${o.s.f}</text>`; });
  });
  if (m.s) {
    const c = S.card || { x: CARD.x, y: CARD.y };
    h += `<g><rect x="${c.x}" y="${c.y}" width="${CARD.w}" height="${CARD.h}" rx="10" fill="#1a2438" stroke="#ffb547" stroke-width="1.8"/>` +
      `<text x="${c.x + 12}" y="${c.y + 23}" font-size="13" fill="#e8ecf4" font-weight="500">${m.s.f}</text><text x="${c.x + CARD.w - 12}" y="${c.y + 23}" font-size="11" fill="#ffb547" text-anchor="end">${m.s.name} · t кип ${fmt(m.s.bp, 0)} °C</text></g>`;
  } else {
    h += `<text x="260" y="370" font-size="13" fill="${S.cracked ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">${S.cracked ? 'Крекинг: C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆' : 'Все образцы на полках. Теперь — крекинг.'}</text>`;
  }
  return h;
}

function hlBox(id) {
  const L = LID(), one = (p, r) => [p[0] - r, p[1] - r, 2 * r, 2 * r];
  if (L === 'alkanes') {
    const P = chainXY(S.n);
    if (id === 'chain') return [P[0][0] - 24, 168, P[P.length - 1][0] - P[0][0] + 48, 74];
    if (id === 'end') return one(P[0], 24);
    if (id === 'scale') return [40, 270, 440, 80];
    if (id === 'room') return [TX(ROOM) - 20, 266, 40, 52];
    if (id === 'cl') return S.sub ? one([P[0][0] - 30, P[0][1] - 30], 20) : one(P[0], 24);
  }
  if (L === 'unsat') {
    if (id === 'cyl') return [CYLX.A - 34, 92, CYLX.C - CYLX.A + 68, 142];
    if (id === 'tube') return [228, 254, 64, 126];
    if (id === 'pipe') return [250, 76, 230, 180];
    if (id === 'label') return [80, 380, 360, 24];
  }
  if (L === 'arenes') {
    if (id === 'c') return one(bPos(0), 22);
    if (id === 'h') return one(bPos(3, BR + 44), 18);
    if (id === 'bond') { const p = bPos(1), q = bPos(2); return one([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], 20); }
    if (id === 'pi') return one([BCX, BCY], 50);
  }
  if (L === 'oil') {
    if (id === 'column') return [44, ZY - 16, 72, 5 * (ZH + ZG) + 50];
    if (id === 'top') return [ZX - 4, zY(0) - 4, ZW + 8, ZH + 8];
    if (id === 'bottom') return [ZX - 4, zY(4) - 4, ZW + 8, ZH + 8];
    if (id === 'card') return [CARD.x - 6, CARD.y - 6, CARD.w + 12, CARD.h + 12];
  }
  return null;
}

function drawScene(t) {
  const m = model(), id = LID();
  let h = id === 'alkanes' ? drawAlk(m) : id === 'unsat' ? drawBr(m, t) : id === 'arenes' ? drawBenz(m) : drawOil(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 490, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- actions ----------
function setN(n) { n = clamp(n, 1, 10); if (n === S.n) { toast(n === 1 ? 'Метан — самый короткий алкан.' : 'Дальше декана в этом опыте не идём.'); return; } S.n = n; S.sub = false; S.seen[n] = true; renderTools(); update(); }
function chlorinate() {
  if (S.sub) { toast(`Уже есть: ${clName(S.n)}. Хлор может заместить и следующий атом H, но здесь хватит одного.`); return; }
  S.sub = true; toast(`${fml(S.n, 2 * S.n + 2)} + Cl₂ → ${fml(S.n, 2 * S.n + 1, 'Cl')} + HCl`); update();
}
function selCyl(c) { if (S.sel === c) return; S.sel = c; S.tube = null; renderTools(); update(); }
function bubble() {
  if (!S.tube || S.tube.cyl !== S.sel) S.tube = { cyl: S.sel, vol: 0, shown: 0 };
  if (S.tube.vol >= 20) { toast('Хватит газа: возьмите новую пробирку, чтобы сравнивать честно.'); return; }
  S.tube.vol += PORTION; S.tube.bub = performance.now() + (reduce ? 0 : 1300);
  const m = model(); S.tube.target = m.frac; if (reduce) S.tube.shown = m.frac;
  if (S.tube.vol === PORTION) S.res[S.sel] = m.nBr / m.nGas;
  update();
}
function newTube() { S.tube = null; update(); }
function labelCyl(g) {
  const c = S.sel;
  if (S.res[c] === undefined) { toast(`Сначала проведите опыт с баллоном ${c}: пропустите газ через бромную воду.`); return; }
  if (S.lab[c] === g) return;
  if (SECRET[c] === g) { const prev = CYL.find(x => x !== c && S.lab[x] === g); if (prev) delete S.lab[prev]; S.lab[c] = g; toast(`Верно: в баллоне ${c} — ${GAS[g].name}.`); }
  else { S.wrong++; toast(GAS[g].k === 0 ? 'Не сходится: этан не обесцвечивает бромную воду, а тут бром реагировал.' : `Не сходится с опытом. Сколько молекул Br₂ пришлось на одну молекулу газа?`); }
  renderTools(); update();
}
function measure(i) { S.lastBond = i; S.meas[i] = true; if (S.view === 'kek') toast(`Связь ${i + 1}–${(i + 1) % 6 + 1}: 0,139 нм. По Кекуле она должна быть ${i % 2 === 0 ? 'двойной, 0,134 нм' : 'одинарной, 0,154 нм'}.`); update(); }
function setView(v) { S.view = v; renderTools(); update(); }
function reactB(r) {
  if (r === 'water') { S.react = 'water'; toast('Бромная вода не обесцветилась: общее π-облако не отдаёт электроны на присоединение.'); }
  else { S.react = 'fe'; toast('Замещение: атом H заменён на Br, кольцо цело.'); }
  update();
}
function place(zone) {
  const m = model(); if (!m.s) return;
  const ok = zoneOf(m.s.bp);
  if (zone === ok) {
    S.placed[S.cur] = zone; toast(`${m.s.f} → ${ZONES[zone].n}`);
    const next = SAMPLES.findIndex((s, k) => S.placed[k] === undefined); S.cur = next < 0 ? 0 : next;
  } else {
    S.miss++;
    toast(m.s.bp < ZONES[zone].lo ? `${m.s.name} кипит при ${fmt(m.s.bp, 0)} °C — пар поднимется выше этой полки.` : `${m.s.name} кипит при ${fmt(m.s.bp, 0)} °C — здесь слишком холодно, он сконденсируется ниже.`);
  }
  S.card = null; update();
}
function crack() {
  if (S.cracked) { toast('Крекинг уже проведён.'); return; }
  S.cracked = true; toast('C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆: из тяжёлой молекулы — бензиновая фракция.'); update();
}

function zoneAt(p) { for (let i = 0; i < ZONES.length; i++) { const y = zY(i); if (p.x >= 40 && p.x <= ZX + ZW && p.y >= y - 2 && p.y <= y + ZH + 2) return i; } return -1; }
function tap(p) {
  const id = LID();
  if (id === 'alkanes') { const P = chainXY(S.n); if (P.some(q => Math.hypot(p.x - q[0], p.y - q[1]) < 22)) chlorinate(); return; }
  if (id === 'unsat') { for (const c of CYL) if (Math.abs(p.x - CYLX[c]) < 32 && p.y > 92 && p.y < 232) return selCyl(c); if (Math.abs(p.x - 260) < 30 && p.y > 255) return bubble(); return; }
  if (id === 'arenes') {
    let best = -1, bd = 24;
    for (let i = 0; i < 6; i++) { const a = bPos(i), b = bPos((i + 1) % 6), d = Math.hypot(p.x - (a[0] + b[0]) / 2, p.y - (a[1] + b[1]) / 2); if (d < bd) { bd = d; best = i; } }
    if (best >= 0) measure(best); return;
  }
  const z = zoneAt(p); if (z >= 0) place(z);
}

let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const inCard = p => p.x >= CARD.x && p.x <= CARD.x + CARD.w && p.y >= CARD.y && p.y <= CARD.y + CARD.h;
scene.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  drag = { x: e.clientX, y: e.clientY, moved: false, card: LID() === 'oil' && model().s && inCard(p) ? { dx: p.x - CARD.x, dy: p.y - CARD.y } : null };
  if (drag.card) scene.classList.add('grabbing');
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.card && drag.moved) { const p = toSvg(e); S.card = { x: p.x - drag.card.dx, y: p.y - drag.card.dy, zone: zoneAt(p) }; dirty = true; }
});
scene.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (d.card && d.moved) { const z = zoneAt(toSvg(e)); if (z >= 0) place(z); else { S.card = null; dirty = true; } return; }
  if (!d.moved) tap(toSvg(e));
});
scene.addEventListener('pointercancel', () => { drag = null; S.card = null; scene.classList.remove('grabbing'); dirty = true; });

function loop(t) {
  requestAnimationFrame(loop);
  let anim = false;
  if (LID() === 'unsat' && S.tube) {
    if (S.tube.bub > t) anim = true;
    const tg = S.tube.target || 0;
    if (Math.abs(S.tube.shown - tg) > 0.002) { S.tube.shown += (tg - S.tube.shown) * 0.06; anim = true; } else S.tube.shown = tg;
  }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, lbl, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${lbl}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    alkanes: B('nm', '−') + `<button disabled>${ROOT[S.n]}</button>` + B('np', '+') + sep + B('cl', 'Cl₂ + свет'),
    unsat: CYL.map(c => B('cyl' + c, c, S.sel === c)).join('') + sep + B('bub', 'Пропустить 10 мл') + B('tube', 'Новая пробирка') + sep +
      Object.keys(GAS).map(g => B('lab-' + g, GAS[g].name, S.lab[S.sel] === g)).join(''),
    arenes: B('kek', 'Кекуле', S.view === 'kek') + B('ring', 'π-облако', S.view === 'ring') + sep + B('water', 'Бромная вода') + B('fe', 'Br₂ + FeBr₃') + B('reset', 'Сброс'),
    oil: B('crack', 'Крекинг C₁₆H₃₄') + B('reset', 'Сначала'),
  }[id];
}
function act(a) {
  if (a === 'nm') return setN(S.n - 1);
  if (a === 'np') return setN(S.n + 1);
  if (a === 'cl') return chlorinate();
  if (/^cyl[ABC]$/.test(a)) return selCyl(a.slice(3));
  if (a === 'bub') return bubble();
  if (a === 'tube') return newTube();
  if (a.startsWith('lab-')) return labelCyl(a.slice(4));
  if (a === 'kek' || a === 'ring') return setView(a);
  if (a === 'water' || a === 'fe') return reactB(a);
  if (a === 'crack') return crack();
  if (a === 'reset') {
    if (LID() === 'arenes') { S.meas = {}; S.react = null; S.lastBond = -1; S.view = 'kek'; renderTools(); update(); }
    else { S.placed = {}; S.cur = 0; S.cracked = false; S.card = null; update(); }
  }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];

  card: IC('<rect x="3" y="10" width="28" height="14" rx="4" fill="#1a2438" stroke="#ffb547"/><path d="M8 17h12" stroke="#e8ecf4"/>'),
};
const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'alkanes') return `Сейчас: ${ROOT[m.n]}, при 20 °C ${m.gas ? 'газ' : 'жидкость'}${m.sub ? ' · хлорирован' : ''}`;
  if (L.id === 'unsat') return `Опытов: ${m.tested} из 3 · подписано верно: ${m.right} из 3`;
  if (L.id === 'arenes') return `Измерено связей: ${Math.min(m.meas, 6)} (нужно 3) · модель: ${m.view === 'ring' ? 'π-облако' : 'Кекуле'} · реакция: ${m.react === 'fe' ? 'замещение ✓' : m.react === 'water' ? 'бромная вода — нет' : 'не проведена'}`;
  return `На полках: ${m.placed} из ${SAMPLES.length} · крекинг: ${m.cracked ? 'есть' : 'нет'}`;
}

function slider(id, lbl, min, max, stepv, val) {

}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'alkanes') h = `<h2>Гомологический ряд</h2>` + slider('inN', 'Атомов углерода n', 1, 10, 1, S.n) +
    `<dl class="reads"><div><dt>Формула</dt><dd id="r1"></dd></div><div><dt>M, г/моль</dt><dd id="r2"></dd></div><div><dt>t кип</dt><dd id="r3"></dd></div></dl>
     <dl class="reads"><div><dt>При 20 °C</dt><dd id="r4"></dd></div><div><dt>Связей C–H</dt><dd id="r5"></dd></div><div><dt>Связей C–C</dt><dd id="r6"></dd></div></dl>

function updateScheme(m) {

}

function combustion(n) {
  // CₙH₂ₙ₊₂ + (3n+1)/2 O₂ → n CO₂ + (n+1) H₂O; doubled when the O₂ coefficient is fractional
  const o = 3 * n + 1, d = o % 2 ? 2 : 1, k = x => x === 1 ? '' : x;
  return `${k(d)}${fml(n, 2 * n + 2)} + ${k(o * d / 2)}O₂ → ${k(n * d)}CO₂ + ${k((n + 1) * d)}H₂O`;
}
function calcHTML(m) {
  const id = LID();
  if (id === 'alkanes') {
    return `<h2>${ROOT[m.n]}: ${m.f}</h2><div class="formula">CₙH₂ₙ₊₂</div>
      <h3>Формула и масса</h3><div class="steps">${step('n (атомов C)', String(m.n))}${step('атомов H = 2n + 2', `2 · ${m.n} + 2 = ${m.h}`)}${step('M = 12n + 1 · (2n + 2)', `12 · ${m.n} + ${m.h} = ${m.M} г/моль`)}${step('t кип', fmt(m.bp, 1) + ' °C')}${step('при 20 °C', m.bp < ROOM ? `${fmt(m.bp, 1)} < 20 → газ` : `${fmt(m.bp, 1)} > 20 → жидкость`, 'sum')}</div>
      <h3>Замещение на свету</h3><div class="steps">${step('уравнение', `${m.f} + Cl₂ → ${fml(m.n, m.h - 1, 'Cl')} + HCl`)}${step('продукт', clName(m.n), 'sum')}</div>
      <h3>Горение</h3><div class="steps">${step('уравнение', combustion(m.n))}</div>
      <p class="note" style="margin-top:10px">Каждое звено CH₂ добавляет 14 г/моль. Чем тяжелее молекулы, тем сильнее они притягиваются — и тем выше температура кипения.</p>`;
  }
  if (id === 'unsat') {
    const t = m.t;
    let h = `<h2>Считаем бром</h2><div class="formula">n = V / Vₘ</div><div class="steps">`;
    if (!t) h += step('пропустите газ', '—') + '</div>';
    else h += step('объём газа V', `${t.vol} мл = ${fmt(t.vol / 1000, 3)} л`) + step('n(газа) = V / 22,4 л/моль', `${fmt(m.nGas, 3)} ммоль`) +
      step('n(Br₂) в пробирке', `${fmt(BR0, 1)} ммоль`) + step('n(Br₂) прореагировало', `${fmt(m.nBr, 3)} ммоль`) +
      step('Br₂ : газ', m.nGas ? `${fmt(m.nBr, 3)} : ${fmt(m.nGas, 3)} = ${fmt(m.nBr / m.nGas, 1)} : 1` : '—') + step('доля брома', `${Math.round(m.frac * 100)} %`, 'sum') + '</div>';
    h += `<h3>Что значит отношение</h3><div class="steps">${step('0 : 1', 'нет кратной связи')}${step('1 : 1', 'одна двойная C=C')}${step('2 : 1', 'одна тройная C≡C')}</div>
      <p class="note" style="margin-top:10px">Если брома не хватило на весь газ, отношение покажется меньше. Поэтому каждый баллон испытывают одинаковой порцией в свежей пробирке.</p>`;
    return h;
  }
  if (id === 'arenes') {
    return `<h2>Бензол C₆H₆</h2><div class="formula">CₙH₂ₙ₋₆</div>
      <h3>Проверим формулу</h3><div class="steps">${step('n = 6: H = 2n − 6', '2 · 6 − 6 = 6')}${step('M(C₆H₆)', '12 · 6 + 6 = 78 г/моль')}</div>
      <h3>Модель Кекуле против опыта</h3><div class="steps">${step('Кекуле: 3 связи C=C', '0,134 нм')}${step('Кекуле: 3 связи C–C', '0,154 нм')}${step('измерено у вас', `${m.meas} связ${m.meas === 1 ? 'ь' : m.meas > 1 && m.meas < 5 ? 'и' : 'ей'}, все 0,139 нм`)}${step('вывод', m.meas >= 2 ? 'связи равны — π-облако' : 'измерьте ещё', 'sum')}</div>
      <h3>Реакции</h3><div class="steps">${step('бромная вода', 'не обесцвечивается')}${step('замещение (FeBr₃)', 'C₆H₆ + Br₂ → C₆H₅Br + HBr')}${step('присоединение (Ni, t)', 'C₆H₆ + 3H₂ → C₆H₁₂')}${step('горение', '2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O')}</div>
      <p class="note" style="margin-top:10px">Бензол горит коптящим пламенем: углерода в молекуле много, и он не успевает сгореть полностью.</p>`;
  }
  const s = m.s;
  let h = `<h2>Куда ставить образец</h2><div class="formula">t кип → интервал фракции</div><div class="steps">`;
  if (s) { const z = zoneOf(s.bp); h += step('образец', `${s.f} (${s.name})`) + step('t кип', fmt(s.bp, 1) + ' °C') + step('сравниваем с границами', '40 · 180 · 270 · 360 °C') + step('вывод', S.placed[S.cur] !== undefined ? ZONES[z].n : 'решите сами', 'sum'); }

    <h3>Крекинг</h3><div class="steps">${step('уравнение', 'C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆')}${step('проверка C', '16 = 8 + 8')}${step('проверка H', '34 = 18 + 16')}${step('продукты', 'октан (алкан) + октен (алкен)', 'sum')}</div>
    <p class="note" style="margin-top:10px">Границы фракций условные: на разных заводах и в разных учебниках они немного отличаются.</p>`;
  return h;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Углеводороды освоены!'), 1500);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.n = 1; S.sub = false; S.seen = { 1: true };
  S.sel = 'A'; S.tube = null; S.res = {}; S.lab = {}; S.wrong = 0;
  S.view = 'kek'; S.meas = {}; S.react = null; S.lastBond = -1;
  S.cur = 0; S.placed = {}; S.cracked = false; S.card = null; S.T = 20; S.miss = 0;
  Object.assign(S, init);
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'alkanes') now = `Модель цепи алкана: ${ROOT[m.n]} ${m.f}, M = ${m.M} г/моль, t кип ${fmt(m.bp, 1)} °C, при 20 °C — ${m.gas ? 'газ' : 'жидкость'}. ${m.sub ? `Проведено хлорирование на свету, получен ${clName(m.n)}.` : 'Хлорирование ещё не проведено.'} Ученик листает гомологический ряд от метана до декана. Не называй сразу нужный алкан — спроси, как сравнить температуру кипения с 20 °C.`;
  if (id === 'unsat') now = `Опыт: три баллона без этикеток (A, B, C) с этаном, этиленом и ацетиленом; газ пропускают порциями по 10 мл (н. у.) через бромную воду с 1 ммоль Br₂. Выбран баллон ${S.sel}. ${m.t ? `В пробирке ${m.t.vol} мл газа из баллона ${m.t.cyl}: ${fmt(m.nGas, 3)} ммоль газа, прореагировало ${fmt(m.nBr, 3)} ммоль Br₂ (${Math.round(m.frac * 100)} %).` : 'Пробирка свежая.'} Результаты опытов (Br₂ : газ): ${CYL.map(c => `${c} — ${S.res[c] === undefined ? 'нет опыта' : fmt(S.res[c], 0) + ' : 1'}`).join('; ')}. Подписано верно ${m.right} из 3, ошибок ${S.wrong}. Не говори, какой газ в каком баллоне, — помоги связать отношение Br₂ : газ с числом π-связей.`;
  if (id === 'arenes') now = `Модель бензола C₆H₆, вид: ${S.view === 'ring' ? 'кольцо с π-облаком' : 'формула Кекуле с чередующимися связями'}. Измерено связей: ${m.meas}, все по 0,139 нм${S.lastBond >= 0 ? `, последняя ${S.lastBond + 1}–${(S.lastBond + 1) % 6 + 1}` : ''}. Реакция: ${S.react === 'fe' ? 'бромирование с FeBr₃ — получен бромбензол (замещение)' : S.react === 'water' ? 'бромная вода — не обесцветилась' : 'ещё не проводилась'}.`;
  if (id === 'oil') now = `Ректификационная колонна с полками: ${ZONES.map(z => `${z.n} (${z.t}, ${z.c})`).join(', ')}. ${m.s ? `Текущий образец: ${m.s.f} (${m.s.name}), t кип ${fmt(m.s.bp, 1)} °C.` : 'Все образцы разложены.'} На полках ${m.placed} из ${SAMPLES.length}, промахов ${S.miss}. Крекинг C₁₆H₃₄: ${m.cracked ? 'проведён' : 'не проведён'}. Ползунок температуры пара: ${S.T} °C. Не называй полку для образца — спроси, в какой интервал попадает его температура кипения.`;
  return [
    `Предмет: химия, 10 класс. Тема «Углеводороды». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    alkanes: 'Почему метан газ, а октан жидкость?', unsat: 'Почему этилен обесцвечивает бромную воду, а этан нет?',
    arenes: 'Почему бензол не обесцвечивает бромную воду, хотя в нём есть π-связи?', oil: 'Зачем нужен крекинг, если бензин и так есть в нефти?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
