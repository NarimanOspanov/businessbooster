<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 9 класс: числовые последовательности, арифметическая и геометрическая прогрессии, сложные проценты и вклады.">
<title>Прогрессии</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Математика · Прогрессии</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: график членов последовательности, столбики арифметической и геометрической прогрессий, рост вклада по годам. Ручки на столбиках можно перетаскивать, кнопки — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', VIOL = '#b59cff', CYAN = '#72d4e8';
const ns = v => (v < 0 ? '−' : '') + Math.abs(v);
const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
// short decimal: up to d digits, trailing zeros removed, comma separator
const sd = (v, d = 3) => { if (isInt(v)) return ns(Math.round(v)); const s = Math.abs(v).toFixed(d).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); return (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + s; };
const big = v => { const r = Math.round(Math.abs(v)); return (v < 0 && r ? '−' : '') + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };
const tg = v => big(v) + ' ₸';
const SUB = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).split('').map(c => SUB[+c]).join('');
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(c => SUP[+c]).join('');

// lesson 1: five sequences
const SEQS = [
  { id: 'lin', chip: '3n − 1', full: 'aₙ = 3n − 1', how: 'формулой n-го члена' },
  { id: 'hyp', chip: '12 / n', full: 'aₙ = 12 / n', how: 'формулой n-го члена' },
  { id: 'alt', chip: '(−1)ⁿ·n', full: 'aₙ = (−1)ⁿ · n', how: 'формулой n-го члена' },
  { id: 'rec', chip: '2aₙ + 1', full: 'a₁ = 1, aₙ₊₁ = 2aₙ + 1', how: 'рекуррентно: через предыдущий член' },
  { id: 'sq', chip: '20 − n²', full: 'aₙ = 20 − n²', how: 'формулой n-го члена' },
];
const KIND = { lin: 'inc', hyp: 'dec', alt: 'none', rec: 'inc', sq: 'dec' };
const KIND_LBL = { inc: 'возрастающая', dec: 'убывающая', none: 'ни возрастающая, ни убывающая' };
const NT = 8;
function seqVal(id, n) {
  if (id === 'lin') return 3 * n - 1;
  if (id === 'hyp') return 12 / n;
  if (id === 'alt') return (n % 2 ? -1 : 1) * n;
  if (id === 'rec') return Math.pow(2, n) - 1;
  return 20 - n * n;
}
function seqWork(id, n) {
  const v = seqVal(id, n);
  if (id === 'lin') return `3 · ${n} − 1 = ${v}`;
  if (id === 'hyp') return `12 : ${n} = ${sd(v)}${isInt(v * 1000) ? '' : '…'}`;
  if (id === 'alt') return `(−1)${sup(n)} · ${n} = ${ns(v)}`;
  if (id === 'rec') return n === 1 ? 'задан: 1' : `2 · a${sub(n - 1)} + 1 = 2 · ${seqVal(id, n - 1)} + 1 = ${v}`;
  return `20 − ${n}² = ${ns(v)}`;
}
// lesson 3
const QS = [-2, -1, -0.5, 0.5, 1, 2, 3];
const QL = { '-2': '−2', '-1': '−1', '-0.5': '−½', '0.5': '½', '1': '1', '2': '2', '3': '3' };
const ql = q => QL[String(q)];
// lesson 4
const PS = [100000, 500000, 1000000, 5000000];
const PL = { 100000: '100 тыс', 500000: '500 тыс', 1000000: '1 млн', 5000000: '5 млн' };

const LESSONS = [
  { id: 'seqs', title: 'Последовательности: номер → член',
    text: ['Числовая последовательность — это числа, пронумерованные по порядку: a₁, a₂, a₃, … Каждому номеру n соответствует член aₙ. Номер — всегда натуральное число, а член может быть любым: дробным, отрицательным.',
           'Последовательность задают формулой n-го члена (aₙ = 3n − 1: подставили n = 5 — получили a₅ = 14) или рекуррентно: дают первый член и правило, как получить следующий из предыдущего (a₁ = 1, aₙ₊₁ = 2aₙ + 1). По рекуррентной формуле, чтобы найти a₈, надо пройти все члены до него.',
           'Если каждый член больше предыдущего (aₙ₊₁ > aₙ), последовательность возрастающая, если меньше — убывающая. Бывает и ни то ни другое: члены то растут, то падают. На графике это точки, которые идут вверх, вниз или прыгают.'],

    hint: 'Ставку и срок меняйте кнопками внизу или ползунками на вкладке «Схема». Пунктирная линия — двойная сумма. Сравните с простыми процентами (голубые столбики).',

const KEY = 'luch-math-seq';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            seq: 'lin', cur: 4, cls: {},
            a1: 1, d: 2, N: 6, gauss: false, frozen: null,
            b1: 1, q: 2, gN: 5, gA: false,
            P: 500000, r: 10, Y: 5, cap: 'year' };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function bankVals(P, r, Y, cap) {
  const cmp = [], smp = [];
  for (let y = 0; y <= Y; y++) {
    cmp.push(cap === 'year' ? P * Math.pow(1 + r / 100, y) : P * Math.pow(1 + r / 1200, 12 * y));
    smp.push(P * (1 + r * y / 100));
  }
  return { cmp, smp };
}

function model() {
  const id = LID();
  if (id === 'seqs') {
    const vals = []; for (let n = 1; n <= NT; n++) vals.push(seqVal(S.seq, n));
    return { kind: id, seq: S.seq, cur: S.cur, vals, v: seqVal(S.seq, S.cur), cls: S.cls, ncls: Object.keys(S.cls).length };
  }
  if (id === 'arith') {
    const a1 = S.a1, d = S.d, N = S.N, vals = [];
    for (let n = 1; n <= N; n++) vals.push(a1 + (n - 1) * d);
    const aN = vals[N - 1], sum = (a1 + aN) * N / 2;
    return { kind: id, a1, d, N, vals, aN, sum, gauss: S.gauss, pos: vals.every(v => v >= 0), a10: a1 + 9 * d };
  }
  if (id === 'geom') {
    const b1 = S.b1, q = S.q, N = S.gN, vals = [];
    for (let n = 1; n <= N; n++) vals.push(b1 * Math.pow(q, n - 1));
    const sum = q === 1 ? b1 * N : b1 * (Math.pow(q, N) - 1) / (q - 1);
    const inf = Math.abs(q) < 1 ? b1 / (1 - q) : null;
    return { kind: id, b1, q, N, vals, bN: vals[N - 1], sum, inf, gA: S.gA, b5: b1 * Math.pow(q, 4) };
  }
  const P = S.P, r = S.r, Y = S.Y, cap = S.cap, bv = bankVals(P, r, Y, cap);
  const A = bv.cmp[Y], Sm = bv.smp[Y];
  let dbl = null; for (let y = 1; y <= 60; y++) { const v = cap === 'year' ? Math.pow(1 + r / 100, y) : Math.pow(1 + r / 1200, 12 * y); if (v >= 2) { dbl = y; break; } }
  const eff = (cap === 'year' ? r / 100 : Math.pow(1 + r / 1200, 12) - 1) * 100;
  return { kind: 'bank', P, r, Y, cap, cmp: bv.cmp, smp: bv.smp, A, Sm, ratio: A / P, doubled: A >= 2 * P, dbl, eff };
}

// ---------- svg helpers (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0, +w).toFixed(1)}" height="${Math.max(0, +h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function chip(x, y, w, label, on, data, col) {
  return `<g data-pick="${data}" style="cursor:pointer">${R(x, y - 14, w, 28, on ? (col || FG) : '#1a2438', `rx="8" stroke="${on ? (col || FG) : '#33405c'}" stroke-width="1.3"`)}${T(x + w / 2, y + 4.5, 12, label, on ? '#0b1019' : FG, 'middle', 'font-weight="500"')}</g>`;
}
// a value axis: returns mapping and the grid
const PX0 = 60, PX1 = 494, PY0 = 120, PY1 = 318;
function nice(span) { const p = Math.pow(10, Math.floor(Math.log10(span))), f = span / p; return (f <= 1.5 ? 0.2 : f <= 3 ? 0.5 : f <= 7 ? 1 : 2) * p; }
function scaleOf(values) {
  let lo = Math.min(0, ...values), hi = Math.max(0, ...values);
  if (hi - lo < 1e-9) hi = lo + 1;
  const st = nice(hi - lo);
  lo = Math.floor(lo / st + 1e-9) * st; hi = Math.ceil(hi / st - 1e-9) * st;
  if (hi === lo) hi = lo + st;
  return { lo, hi, st };
}
const Yof = (sc, v) => PY1 - (v - sc.lo) / (sc.hi - sc.lo) * (PY1 - PY0);
const Vof = (sc, y) => sc.lo + (PY1 - y) / (PY1 - PY0) * (sc.hi - sc.lo);
function axis(sc, fmt) {
  let h = '';
  for (let v = sc.lo; v <= sc.hi + sc.st / 2; v += sc.st) {
    const y = Yof(sc, v), z = Math.abs(v) < sc.st / 2;
    h += L(PX0, y, PX1, y, z ? '#6b7690' : 'rgba(139,150,173,.16)', z ? 1.3 : 1) + T(PX0 - 6, y + 3.5, 9.5, (fmt || sd)(z ? 0 : v), '#6b7690', 'end');
  }
  return h;
}

// ---------- lesson 1: sequences ----------
const S1 = { x: n => PX0 + 22 + (n - 1) * (PX1 - PX0 - 44) / (NT - 1) };
function seqsSVG(m) {
  let h = '';
  SEQS.forEach((sq, i) => {
    const c = m.cls[sq.id];
    h += chip(18 + i * 98, 88, 92, sq.chip, m.seq === sq.id, 'seq-' + sq.id, c ? GREEN : null);
    if (c && m.seq !== sq.id) h += T(18 + i * 98 + 86, 80, 9, '✓', GREEN);
  });
  const sc = scaleOf(m.vals);
  h += axis(sc);
  // plot area for dragging the cursor
  h += R(PX0, PY0 - 6, PX1 - PX0, PY1 - PY0 + 30, 'transparent', 'data-drag="cur"');
  const cx = S1.x(m.cur);
  h += L(cx, PY0 - 4, cx, PY1 + 6, ORANGE, 1.4, 'stroke-dasharray="5 4" pointer-events="none"');
  let pts = '';
  m.vals.forEach((v, i) => { pts += (i ? 'L' : 'M') + S1.x(i + 1).toFixed(1) + ' ' + Yof(sc, v).toFixed(1); });
  h += `<path d="${pts}" fill="none" stroke="rgba(95,180,217,.35)" stroke-width="1.2" pointer-events="none"/>`;
  m.vals.forEach((v, i) => {
    const n = i + 1, x = S1.x(n), y = Yof(sc, v), on = n === m.cur;
    h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on ? 7 : 5}" fill="${on ? ORANGE : BLUE}" stroke="${INK}" stroke-width="1.4" pointer-events="none"/>`;
    h += T(x, y + (v >= 0 ? -12 : 20), 10, sd(v, 2), on ? ORANGE : FG, 'middle', 'pointer-events="none"');
    h += T(x, PY1 + 20, 10.5, 'n=' + n, on ? ORANGE : '#6b7690', 'middle', 'pointer-events="none"');
  });
  // handle on the cursor
  h += `<circle cx="${cx.toFixed(1)}" cy="${PY1 + 32}" r="8" fill="${ORANGE}" stroke="${INK}" stroke-width="1.4" pointer-events="none"/>`;
  const sq = SEQS.find(s => s.id === m.seq);
  h += T(260, 368, 13, `${sq.full}`, FG, 'middle', 'font-weight="500"');
  h += T(260, 390, 12, `a${sub(m.cur)} = ${seqWork(m.seq, m.cur)}`, ORANGE);
  return h;
}

// ---------- lesson 2: arithmetic ----------
let barX = [];
function barsGeom(N) {
  const w = (PX1 - PX0) / N, bw = Math.min(30, w * 0.66);
  barX = []; for (let i = 0; i < N; i++) barX.push(PX0 + w * i + w / 2);
  return bw;
}
function arithScale(m) {
  if (S.frozen) return S.frozen;
  const v = m.vals.slice(); if (m.gauss && m.pos) v.push(m.a1 + m.aN);
  return scaleOf(v);
}
function arithSVG(m) {
  let h = '';
  const sc = arithScale(m), bw = barsGeom(m.N), y0 = Yof(sc, 0);
  h += axis(sc);
  const showG = m.gauss && m.pos;
  m.vals.forEach((v, i) => {
    const x = barX[i], y = Yof(sc, v), col = i === 0 ? ORANGE : i === 1 ? CYAN : BLUE;
    h += R(x - bw / 2, Math.min(y, y0), bw, Math.abs(y - y0), col, `rx="3" opacity=".88" stroke="${INK}"`);
    if (showG) {
      const w2 = m.vals[m.N - 1 - i], yt = Yof(sc, v + w2);
      h += R(x - bw / 2, yt, bw, y - yt, 'rgba(181,156,255,.35)', `rx="3" stroke="${VIOL}" stroke-dasharray="3 2"`);
      if (bw > 16) h += T(x, yt + 12, 9, sd(w2), VIOL);
    }
    if (!showG || bw <= 16) h += T(x, v >= 0 ? y - 6 : y + 14, 10, ns(v), i < 2 ? col : FG);
    else h += T(x, y - 4, 9, ns(v), FG);
    h += T(x, PY1 + 16, 10, 'a' + sub(i + 1), '#6b7690');
  });
  // step arrows d between first bars
  if (m.N >= 2 && !showG) {
    const ya = Yof(sc, m.vals[0]), yb = Yof(sc, m.vals[1]);
    h += L(barX[0] + bw / 2 + 2, ya, barX[1] - bw / 2 - 2, ya, MUTED, 1, 'stroke-dasharray="2 3"') + T((barX[0] + barX[1]) / 2, (ya + yb) / 2 + 4, 10, (m.d >= 0 ? '+' : '') + ns(m.d), CYAN, 'middle', 'font-weight="500"');
  }
  if (showG) h += L(PX0, Yof(sc, m.a1 + m.aN), PX1, Yof(sc, m.a1 + m.aN), VIOL, 1.2, 'stroke-dasharray="6 4"') + T(PX1, Yof(sc, m.a1 + m.aN) - 6, 10.5, `a₁ + a${sub(m.N)} = ${ns(m.a1 + m.aN)}`, VIOL, 'end');
  // handles
  const hdl = (i, key, col) => { const y = Yof(sc, m.vals[i]); return `<g data-drag="${key}" style="cursor:grab">${R(barX[i] - 20, y - 20, 40, 40, 'transparent')}<circle cx="${barX[i].toFixed(1)}" cy="${y.toFixed(1)}" r="8.5" fill="${col}" stroke="${INK}" stroke-width="1.6"/><path d="M${(barX[i] - 3).toFixed(1)} ${(y - 2).toFixed(1)}l3 -3 3 3M${(barX[i] - 3).toFixed(1)} ${(y + 2).toFixed(1)}l3 3 3 -3" stroke="${INK}" stroke-width="1.3" fill="none"/></g>`; };
  h += hdl(0, 'a1', ORANGE);
  if (m.N >= 2) h += hdl(1, 'a2', CYAN);
  h += T(260, 362, 13, `aₙ = ${ns(m.a1)} + (n − 1) · ${m.d < 0 ? '(' + ns(m.d) + ')' : m.d}    a${sub(m.N)} = ${ns(m.aN)}`, FG, 'middle', 'font-weight="500"');
  h += T(260, 386, 12.5, m.gauss ? (m.pos ? `2S${sub(m.N)} = ${m.N} · ${ns(m.a1 + m.aN)} → S${sub(m.N)} = ${sd(m.sum)}` : `S${sub(m.N)} = (a₁ + a${sub(m.N)}) · n / 2 = ${sd(m.sum)} · картинка — для членов ≥ 0`) : `S${sub(m.N)} = ?   включите «Гаусс», чтобы сложить парами`, m.gauss ? VIOL : MUTED);
  return h;
}

// ---------- lesson 3: geometric ----------
const GX0 = PX0, GX1 = PX1;
function geomSVG(m) {
  let h = T(18, 92, 11, 'q =', MUTED, 'start');
  QS.forEach((q, i) => { h += chip(46 + i * 64, 88, 58, ql(q), m.q === q, 'q-' + q); });
  const sc = scaleOf(m.vals), bw = barsGeom(m.N), y0 = Yof(sc, 0);
  h += axis(sc, v => Math.abs(v) >= 10000 ? sd(v / 1000, 1) + 'k' : sd(v, 2));
  m.vals.forEach((v, i) => {
    const x = barX[i], y = Yof(sc, v);
    h += R(x - bw / 2, Math.min(y, y0), bw, Math.max(Math.abs(y - y0), 0.8), v < 0 ? RED : i === 0 ? ORANGE : BLUE, `rx="3" opacity=".88" stroke="${INK}"`);
    const lbl = sd(v, 3);
    h += T(x, v >= 0 ? y - 6 : y + 14, lbl.length > 5 ? 8.5 : 10, lbl, i === 0 ? ORANGE : i === 4 ? GREEN : FG);
    h += T(x, PY1 + 16, 10, 'b' + sub(i + 1), '#6b7690');
    if (i > 0 && m.N <= 8) h += T((barX[i - 1] + x) / 2, PY0 - 6, 9.5, '·' + ql(m.q), VIOL);
  });
  // sum gauge
  const gy = 366;
  if (m.inf !== null) {
    const W = 440, k = clamp(m.sum / m.inf, 0, 1.5) / 1.5;
    h += R(40, gy - 8, W, 14, '#141c2b', 'rx="5" stroke="#26324a"') + R(40, gy - 8, W * k, 14, VIOL, 'rx="5" opacity=".85"');
    const xi = 40 + W / 1.5;

function bankSVG(m) {

  const n = m.Y + 1, w = (PX1 - PX0) / n, bw = Math.min(14, w * 0.36), y0 = Yof(sc, 0);

}

  if (id === 'seqs') return [
    { id: 'chips', icon: ICON.chips, name: 'Пять последовательностей', spec: 'Четыре заданы формулой n-го члена, одна — рекуррентно. Галочка — уже разобрана.' },
    { id: 'plot', icon: ICON.plot, name: 'График', spec: 'По горизонтали номер n, по вертикали значение aₙ. У последовательности график — отдельные точки, а не сплошная линия.' },
    { id: 'cursor', icon: ICON.cursor, name: 'Курсор n', spec: 'Оранжевый пунктир: какой член сейчас считаем. Тяните его вдоль оси.' },
    { id: 'formula', icon: ICON.formula, name: 'Формула и подстановка', spec: 'Как получен выбранный член: подставили n или взяли предыдущий член.' }];
  if (id === 'arith') return [
    { id: 'bars', icon: ICON.bars, name: 'Столбики aₙ', spec: 'Высота столбика — член прогрессии. Соседние отличаются ровно на d.' },
    { id: 'h1', icon: ICON.h1, name: 'Ручка a₁', spec: 'Оранжевая: двигает первый член, второй остаётся на месте.' },
    { id: 'h2', icon: ICON.h2, name: 'Ручка a₂', spec: 'Голубая: задаёт второй член, а значит и разность d = a₂ − a₁.' },
    { id: 'formula', icon: ICON.formula, name: 'Формула n-го члена', spec: 'aₙ = a₁ + (n − 1)d для текущих чисел.' },
    { id: 'sum', icon: ICON.sum, name: 'Сумма по Гауссу', spec: 'Фиолетовая копия вверх ногами: каждая пара столбиков даёт a₁ + aₙ.' }];
  if (id === 'geom') return [
    { id: 'qs', icon: ICON.qs, name: 'Знаменатель q', spec: 'Во сколько раз каждый член больше предыдущего. При q < 0 знаки чередуются.' },
    { id: 'bars', icon: GBARS, name: 'Столбики bₙ', spec: 'Каждый следующий — предыдущий, умноженный на q. Красные — отрицательные члены.' },
    { id: 'gauge', icon: ICON.gauge, name: 'Шкала суммы', spec: 'При |q| < 1: фиолетовая полоса — Sₙ, зелёная черта — предел S = b₁ / (1 − q).' },
    { id: 'b5', icon: ICON.b5, name: 'Проверка b₅', spec: 'b₅ = b₁ · q⁴ для текущих b₁ и q.' }];
  return [
    { id: 'opts', icon: ICON.opts, name: 'Сумма и капитализация', spec: 'Сколько положили (P) и как часто проценты прибавляются к вкладу.' },
    { id: 'bars', icon: KBARS, name: 'Столбики по годам', spec: 'Голубые — простые проценты (арифметическая прогрессия), оранжевые — сложные (геометрическая).' },
    { id: 'dbl', icon: ICON.dbl, name: 'Линия 2P', spec: 'Двойная сумма вклада. Столбик, достигший её, становится зелёным.' },
    { id: 'res', icon: ICON.res, name: 'Итог', spec: 'Сумма в конце срока, во сколько раз выросла и насколько больше простых процентов.' }];
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'seqs') {
    const sq = SEQS.find(s => s.id === m.seq);
    let h = `<h2>Считаем члены</h2><div class="formula">${sq.full}</div><p class="note">Задана ${sq.how}.</p><h3>Члены до n = ${m.cur}</h3><div class="steps">`;
    for (let n = 1; n <= m.cur; n++) h += step('a' + sub(n), seqWork(m.seq, n), n === m.cur ? 'sum' : '');
    h += `</div><h3>Соседние члены</h3><div class="steps">`;
    for (let n = 1; n <= 3; n++) h += step(`a${sub(n + 1)} − a${sub(n)}`, sd(m.vals[n] - m.vals[n - 1], 3));
    h += `</div><p class="note" style="margin-top:10px">Если разность aₙ₊₁ − aₙ положительна при любом n — последовательность возрастает, если всегда отрицательна — убывает. Трёх пар мало для вывода: посмотрите на весь график или на формулу.</p>`;
    return h;
  }
  if (id === 'arith') {
    const d = m.d, dd = d < 0 ? '(' + ns(d) + ')' : d;
    let h = `<h2>Считаем прогрессию</h2><div class="formula">aₙ = a₁ + (n − 1)d</div><h3>При a₁ = ${ns(m.a1)}, d = ${ns(d)}, n = ${m.N}</h3><div class="steps">`;
    h += step('разность', `d = a₂ − a₁ = ${ns(m.a1 + d)} − ${m.a1 < 0 ? '(' + ns(m.a1) + ')' : m.a1} = ${ns(d)}`);
    h += step('n-й член', `a${sub(m.N)} = ${ns(m.a1)} + ${m.N - 1} · ${dd} = ${ns(m.aN)}`);
    h += step('сумма', `S${sub(m.N)} = (${ns(m.a1)} + ${m.aN < 0 ? '(' + ns(m.aN) + ')' : m.aN}) · ${m.N} / 2 = ${sd(m.sum)}`, 'sum');
    h += step('другая формула', `S${sub(m.N)} = (2a₁ + (n − 1)d) · n / 2 = (${2 * m.a1} + ${m.N - 1} · ${dd}) · ${m.N} / 2 = ${sd(m.sum)}`);
    h += `</div><h3>Члены</h3><div class="steps">` + step('ряд', m.vals.map(ns).join('; ')) + `</div>`;
    h += `<h3>Задача Гаусса</h3><div class="steps">` + step('1 + 2 + … + 100', '(1 + 100) · 100 / 2 = 5050') + step('пары', '1 + 100 = 2 + 99 = 3 + 98 = … = 101', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Найти d по двум членам: aₖ − aₘ = (k − m)d, то есть делим разность членов на число шагов между ними.</p>`;
  }
  if (id === 'geom') {
    const q = m.q, qs = q < 0 ? '(' + ql(q) + ')' : ql(q);
    let h = `<h2>Считаем прогрессию</h2><div class="formula">bₙ = b₁ · qⁿ⁻¹</div><h3>При b₁ = ${m.b1}, q = ${ql(q)}, n = ${m.N}</h3><div class="steps">`;
    h += step('n-й член', `b${sub(m.N)} = ${m.b1} · ${qs}${sup(m.N - 1)} = ${sd(m.bN, 4)}`);
    if (q === 1) h += step('сумма (q = 1)', `S${sub(m.N)} = n · b₁ = ${m.N} · ${m.b1} = ${m.N * m.b1}`, 'sum');
    else h += step('сумма', `S${sub(m.N)} = ${m.b1} · (${qs}${sup(m.N)} − 1) / (${ql(q)} − 1) = ${sd(m.sum, 4)}`, 'sum');
    if (m.inf !== null) h += step('бесконечная сумма', `S = b₁ / (1 − q) = ${m.b1} / (1 − ${qs}) = ${sd(m.inf, 4)}`) + step('недостаёт до S', sd(m.inf - m.sum, 5));
    h += `</div><h3>Члены</h3><div class="steps">` + step('ряд', m.vals.map(v => sd(v, 4)).join('; ')) + `</div>`;
    h += `<h3>Найти q по двум членам</h3><div class="steps">` + step('связь', 'bₖ = bₘ · qᵏ⁻ᵐ') + step('пример', 'b₁ = 5, b₄ = 40 → q³ = 8 → q = 2', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Формула суммы бесконечной прогрессии верна только при |q| &lt; 1. При q = 2 сумма растёт без предела.</p>`;
  }
  const g = m.cap === 'year' ? 1 + m.r / 100 : Math.pow(1 + m.r / 1200, 12);
  let h = `<h2>Считаем вклад</h2><div class="formula">${m.cap === 'year' ? 'Aₙ = P · (1 + r/100)ⁿ' : 'Aₙ = P · (1 + r/1200)¹²ⁿ'}</div><h3>По годам: q = ${sd(g, 5)}</h3><div class="steps">`;
  for (let y = 1; y <= m.Y; y++) h += step(`${y} ${plural(y, 'год', 'года', 'лет')}`, `${tg(m.cmp[y - 1])} · ${sd(g, 4)} = ${tg(m.cmp[y])}`, y === m.Y ? 'sum' : '');
  h += `</div><h3>Сравнение</h3><div class="steps">`;
  h += step('простые проценты', `${tg(m.P)} · (1 + ${m.r} · ${m.Y} / 100) = ${tg(m.Sm)}`);
  h += step('выгода капитализации', tg(m.A - m.Sm));
  h += step('эффективная ставка', `${sd(m.eff, 2)} % в год`);
  h += step('правило 72', `72 / ${m.r} ≈ ${sd(72 / m.r, 1)} года — грубая оценка удвоения`, 'sum');
  h += `</div><p class="note" style="margin-top:10px">Проценты по вкладу облагаются по правилам налогового кодекса, а инфляция «съедает» часть дохода. Здесь считаем без них.</p>`;
  return h;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'seqs') el.innerHTML = `<div class="k">Член a${sub(m.cur)}</div><div class="v">${sd(m.v, 3)}</div><div class="lr"><span>разобрано</span><span>${m.ncls}/5</span></div><div class="gauge"><b style="width:${m.ncls / 5 * 100}%"></b></div>`;
  else if (id === 'arith') el.innerHTML = `<div class="k">Сумма S${sub(m.N)}</div><div class="v ${ok ? 'ok' : ''}">${m.gauss ? sd(m.sum) : '?'}</div><div class="lr"><span>d</span><span>${ns(m.d)}</span></div><div class="lr"><span>a${sub(m.N)}</span><span>${ns(m.aN)}</span></div>`;
  else if (id === 'geom') el.innerHTML = `<div class="k">Сумма S${sub(m.N)}</div><div class="v ${ok ? 'ok' : ''}">${sd(m.sum, 3)}</div><div class="lr"><span>q</span><span>${ql(m.q)}</span></div><div class="lr"><span>b${sub(m.N)}</span><span>${sd(m.bN, 3)}</span></div>`;
  else el.innerHTML = `<div class="k">Вклад / P</div><div class="v ${m.doubled ? 'ok' : ''}">×${sd(m.ratio, 3)}</div><div class="lr"><span>ставка</span><span>${m.r} %</span></div><div class="lr"><span>срок</span><span>${m.Y} ${plural(m.Y, 'год', 'года', 'лет')}</span></div><div class="gauge"><b style="width:${clamp(m.ratio / 2 * 80, 0, 100).toFixed(1)}%;background:${m.doubled ? 'var(--ok)' : 'var(--force)'}"></b><i style="left:80%"></i></div>`;
}

function update() {
  if (LID() === 'geom' && !S.gA && S.b1 === 2 && S.q === 3) { S.gA = true; toast('b₁ = 2, q = 3: 2 · 3⁴ = 162. Теперь q = ½ и n = 10.'); }
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Прогрессии освоены!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  seqs: '<path d="M8 24L20 14L32 20L44 8L56 16" stroke="#5fb4d9" stroke-width="1" fill="none"/><circle cx="8" cy="24" r="2.5" fill="#5fb4d9"/><circle cx="20" cy="14" r="2.5" fill="#5fb4d9"/><circle cx="32" cy="20" r="2.5" fill="#ffb547"/><circle cx="44" cy="8" r="2.5" fill="#5fb4d9"/><circle cx="56" cy="16" r="2.5" fill="#5fb4d9"/>',
  arith: '<rect x="8" y="20" width="7" height="8" fill="#ffb547"/><rect x="19" y="16" width="7" height="12" fill="#72d4e8"/><rect x="30" y="12" width="7" height="16" fill="#5fb4d9"/><rect x="41" y="8" width="7" height="20" fill="#5fb4d9"/><rect x="52" y="4" width="7" height="24" fill="#5fb4d9"/>',
  geom: '<rect x="8" y="27" width="7" height="1.5" fill="#ffb547"/><rect x="19" y="26" width="7" height="2.5" fill="#5fb4d9"/><rect x="30" y="23" width="7" height="5.5" fill="#5fb4d9"/><rect x="41" y="17" width="7" height="11.5" fill="#5fb4d9"/><rect x="52" y="4" width="7" height="24.5" fill="#5fb4d9"/>',
  bank: '<rect x="8" y="20" width="4" height="8" fill="#5fb4d9"/><rect x="13" y="20" width="4" height="8" fill="#ffb547"/><rect x="24" y="16" width="4" height="12" fill="#5fb4d9"/><rect x="29" y="15" width="4" height="13" fill="#ffb547"/><rect x="40" y="12" width="4" height="16" fill="#5fb4d9"/><rect x="45" y="9" width="4" height="19" fill="#86e0a8"/><path d="M4 10H62" stroke="#86e0a8" stroke-dasharray="3 2"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.frozen = null;
  S.seq = LESSONS[0].seq; S.cur = LESSONS[0].cur; S.cls = {};
  S.a1 = LESSONS[1].a1; S.d = LESSONS[1].d; S.N = LESSONS[1].N; S.gauss = false;
  S.b1 = LESSONS[2].b1; S.q = LESSONS[2].q; S.gN = LESSONS[2].N; S.gA = false;
  S.P = LESSONS[3].P; S.r = LESSONS[3].r; S.Y = LESSONS[3].Y; S.cap = LESSONS[3].cap;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons');
  if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'seqs') {
    const sq = SEQS.find(s => s.id === m.seq);
    now = `Выбрана последовательность ${sq.full} (задана ${sq.how}). На графике точки (n; aₙ) для n = 1…8: ${m.vals.map(v => sd(v, 3)).join('; ')}. Курсор на n = ${m.cur}, a${sub(m.cur)} = ${sd(m.v, 3)}. ` +
      `Разобрано ${m.ncls} из 5: ${SEQS.filter(s => m.cls[s.id]).map(s => s.full + ' — ' + KIND_LBL[m.cls[s.id]]).join('; ') || 'пока ни одной'}. Ученик отвечает кнопками «возрастает / убывает / ни то ни другое».`;
  }
  if (id === 'arith') now = `Столбики арифметической прогрессии: a₁ = ${ns(m.a1)}, d = ${ns(m.d)}, показано n = ${m.N} членов: ${m.vals.map(ns).join('; ')}. a${sub(m.N)} = ${ns(m.aN)}. ` +
    `Сложение по Гауссу ${m.gauss ? `включено, S${sub(m.N)} = ${sd(m.sum)}` : 'выключено'}. Для задания нужны a₁ = 3, a₁₀ = 30, 10 членов и включённый Гаусс; d ученик должен найти сам.`;
  if (id === 'geom') now = `Столбики геометрической прогрессии: b₁ = ${m.b1}, q = ${ql(m.q)}, n = ${m.N}: ${m.vals.map(v => sd(v, 4)).join('; ')}. b₅ = ${sd(m.b5, 4)}, S${sub(m.N)} = ${sd(m.sum, 4)}${m.inf !== null ? `, сумма бесконечной прогрессии ${sd(m.inf, 4)}` : ''}. ` +
    `Шаг 1 (b₁ = 2, b₅ = 162) ${m.gA ? 'выполнен' : 'не выполнен'}; шаг 2 — q = ½ и n ≥ 10.`;
  if (id === 'bank') now = `Вклад ${tg(m.P)} под ${m.r} % годовых, капитализация ${m.cap === 'year' ? 'раз в год' : 'ежемесячно'}, срок ${m.Y} ${plural(m.Y, 'год', 'года', 'лет')}. Сложные проценты: ${tg(m.A)} (×${sd(m.ratio, 3)}), простые: ${tg(m.Sm)}. ` +
    `Эффективная ставка ${sd(m.eff, 2)} %. ${m.doubled ? 'Вклад уже удвоился к концу срока.' : 'Вклад ещё не удвоился.'} Для задания нужно 500 000 ₸, 14 %, капитализация раз в год и первый год удвоения.`;
  return [
    `Раздел: математика, 9 класс, алгебра, тема «Прогрессии». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (вид монотонности неразобранных последовательностей, разность d, знаменатель q, год удвоения): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    seqs: 'Чем рекуррентная формула отличается от формулы n-го члена?', arith: 'Почему в формуле aₙ стоит n − 1, а не n?',
    geom: 'Как сумма бесконечного числа слагаемых может быть конечной?', bank: 'Чем сложные проценты отличаются от простых?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
