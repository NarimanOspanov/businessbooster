<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 8 класс: параллелограмм, прямоугольник, ромб и квадрат, трапеция, площади многоугольников.">
<title>Четырёхугольники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG grid) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag="v"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 30L13 10H34L27 30Z" fill="rgba(114,212,232,.12)" stroke="var(--arm)" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 30L34 10M13 10L27 30" stroke="var(--force)" stroke-width="1.4" stroke-dasharray="3 2"/><circle cx="6" cy="30" r="2" fill="var(--fg)"/><circle cx="13" cy="10" r="2" fill="var(--fg)"/><circle cx="34" cy="10" r="2" fill="var(--fg)"/><circle cx="27" cy="30" r="2" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж на клетчатой сетке. Вершины четырёхугольника можно перетаскивать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-math-quadr';
const fmt = v => String(Math.round(v * 100) / 100).replace('.', ',');
const f1c = v => String(Math.round(v * 10) / 10).replace('.', ',');
const RAD = Math.PI / 180;

const LESSONS = [
  { id: 'par', title: 'Параллелограмм',
    text: ['Параллелограмм — четырёхугольник, у которого противолежащие стороны попарно параллельны: AB ∥ CD и AD ∥ BC.',
           'Свойства: противолежащие стороны равны, противолежащие углы равны, а углы, прилежащие к одной стороне, в сумме дают 180°. Диагонали точкой пересечения делятся пополам.',
           'Признаки: четырёхугольник — параллелограмм, если две его противолежащие стороны равны и параллельны; или противолежащие стороны попарно равны; или диагонали делятся точкой пересечения пополам.'],
    why: 'На параллелограмме держатся механизмы, которые двигаются, но не перекашиваются: настольная лампа на шарнирах, дворники автобуса, раздвижные ворота, ножничный подъёмник на стройке. Как ни двигай звенья, противоположные стороны остаются параллельными. Инженер-конструктор и механик рассчитывают такие узлы, а чертёжник и плиточник постоянно работают с параллельными линиями.',
    task: 'Постройте параллелограмм ABCD со сторонами AD = 6 см и AB = 5 см, у которого угол A не прямой. Включите диагонали и посмотрите, где они пересекаются.',
    hint: 'Наклонный отрезок длиной ровно 5 см: 3 клетки вбок и 4 вверх. Потом сдвиньте C так, чтобы BC шла точно так же, как AD.',
    stage: 'Тащите вершины — они встают на узлы сетки. 1 клетка = 1 см.',
    pts: { A: [1, 1], B: [3, 4], C: [8, 5], D: [7, 1] },
    check: m => m.par && m.AD2 === 36 && m.AB2 === 25 && !m.right && m.diag },
  { id: 'rect', title: 'Прямоугольник, ромб, квадрат',
    text: ['Прямоугольник — параллелограмм, у которого все углы прямые. Его особое свойство: диагонали равны. И наоборот: параллелограмм с равными диагоналями — прямоугольник.',
           'Ромб — параллелограмм, у которого все стороны равны. Диагонали ромба перпендикулярны и делят его углы пополам.',
           'Квадрат — прямоугольник, у которого все стороны равны. Он одновременно и прямоугольник, и ромб, поэтому у него есть все их свойства.'],
    why: 'Строитель проверяет, что фундамент или комната — прямоугольник, двумя замерами рулеткой: меряет диагонали. Равны — углы прямые, можно ставить стены и класть плитку. Так же мебельщик проверяет раму шкафа, а столяр — дверную коробку. Ромбы и квадраты — основа казахского орнамента на коврах, кошмах и текстиле: дизайнер узоров строит их по этим свойствам.',
    task: 'Соберите по очереди три фигуры: прямоугольник (не квадрат), ромб (не квадрат) и квадрат. Включите диагонали и сравните их свойства.',
    hint: 'Ромб без прямых углов: сторона 5 клеток по горизонтали и наклонная сторона «3 вбок, 4 вверх». Квадрат можно повернуть: «2 вправо, 1 вверх», потом «1 влево, 2 вверх».',
    stage: 'Тащите вершины. Внизу поля — название фигуры, которая сейчас получилась.',
    pts: { A: [2, 1], B: [3, 4], C: [8, 4], D: [7, 1] },
    check: m => m.found >= 3 },
  { id: 'trap', title: 'Трапеция',
    text: ['Трапеция — четырёхугольник, у которого две стороны параллельны, а две другие нет. Параллельные стороны — основания (у нас AD и BC), две другие — боковые стороны.',
           'Высота трапеции — перпендикуляр между основаниями. Углы, прилежащие к боковой стороне, в сумме дают 180°. Если боковые стороны равны, трапеция равнобедренная: у неё равны углы при основании и равны диагонали.',
           'Средняя линия MN соединяет середины боковых сторон. Она параллельна основаниям и равна их полусумме: MN = (AD + BC) : 2.'],
    why: 'Поперечный профиль дорожной насыпи, плотины и оросительного канала — трапеция. Инженер-дорожник по средней линии и высоте считает, сколько грунта нужно, а значит, сколько рейсов самосвалов и сколько это стоит. Из трапеций кроят юбки, сумки и абажуры, а кровельщик режет из них листы для вальмовых крыш.',

    stage: 'Тащите вершины B, C и D. Кнопка «Разрезать» делит фигуру диагональю на два треугольника.',

const TN = { bad: 'не четырёхугольник', concave: 'невыпуклый четырёхугольник', quad: 'четырёхугольник', trap: 'трапеция', par: 'параллелограмм', rect: 'прямоугольник', rhomb: 'ромб', sq: 'квадрат', tri: 'треугольник' };
const TC = { bad: '#ff8a73', concave: '#8b96ad', quad: '#e8ecf4', trap: '#c39bff', par: '#72d4e8', rect: '#ffb547', rhomb: '#86e0a8', sq: '#f2d36b', tri: '#ff9fc4' };
const KS = ['A', 'B', 'C', 'D'];
const SIDES = [['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A']];

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            P: {}, selV: 'B', show: { diag: false, ang: true, mid: false, hgt: false, split: false }, found: new Set(),
            a: 8, b: 3, h: 3, s: 2, found4: new Set() };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const PT = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * RAD), y: c.y - r * Math.sin(deg * RAD) });
const degOf = (c, p) => Math.atan2(c.y - p.y, p.x - c.x) / RAD;
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

// ---------- grid geometry (1 cell = 1 cm, y up) ----------
const GX = 11, GY = 6, SC = 40, OX = 40, OY = 270;
const sp = p => ({ x: OX + p[0] * SC, y: OY - p[1] * SC });
const vec = (p, q) => [q[0] - p[0], q[1] - p[1]];
const cr = (u, w) => u[0] * w[1] - u[1] * w[0];
const dt = (u, w) => u[0] * w[0] + u[1] * w[1];
const n2 = u => u[0] * u[0] + u[1] * u[1];
const len = u => Math.sqrt(n2(u));
const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
const sh = u => `(${u[0]}; ${u[1]})`;
const sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
function crosses(p1, p2, p3, p4) {
  const o1 = sgn(cr(vec(p1, p2), vec(p1, p3))), o2 = sgn(cr(vec(p1, p2), vec(p1, p4)));
  const o3 = sgn(cr(vec(p3, p4), vec(p3, p1))), o4 = sgn(cr(vec(p3, p4), vec(p3, p2)));
  return o1 * o2 < 0 && o3 * o4 < 0;
}

function quadModel() {
  const P = S.P, A = P.A, B = P.B, C = P.C, D = P.D;
  const AB = vec(A, B), BC = vec(B, C), CD = vec(C, D), DA = vec(D, A), AD = vec(A, D), DC = vec(D, C), AC = vec(A, C), BD = vec(B, D);
  const E = [AB, BC, CD, DA], turn = E.map((e, i) => cr(E[(i + 3) % 4], e));
  const selfX = crosses(A, B, C, D) || crosses(B, C, D, A);
  const flat = turn.some(t => t === 0);
  const valid = !selfX && !flat;
  const convex = valid && (turn.every(t => t > 0) || turn.every(t => t < 0));
  const p1 = cr(AB, DC) === 0, p2 = cr(AD, BC) === 0;
  const par = convex && p1 && p2;
  const right = par && dt(AB, AD) === 0, rh = par && n2(AB) === n2(AD);
  const trapAD = convex && p2 && !p1, trapAB = convex && p1 && !p2;
  const type = !valid ? 'bad' : !convex ? 'concave' : par ? (right && rh ? 'sq' : right ? 'rect' : rh ? 'rhomb' : 'par') : (trapAD || trapAB) ? 'trap' : 'quad';
  // interior angles
  const area2 = cr(A, B) + cr(B, C) + cr(C, D) + cr(D, A), o = area2 >= 0 ? 1 : -1;
  const ang = {}; KS.forEach((k, i) => { const e0 = E[(i + 3) % 4], e1 = E[i]; ang[k] = 180 - o * Math.atan2(cr(e0, e1), dt(e0, e1)) / RAD; });
  let O = null;
  if (convex) { const t = cr(vec(A, B), BD) / cr(AC, BD); O = [A[0] + AC[0] * t, A[1] + AC[1] * t]; }
  const h = n2(AD) ? Math.abs(cr(AD, AB)) / len(AD) : 0;
  const M = mid(A, B), N = mid(C, D);
  return { kind: 'quad', A, B, C, D, AB, BC, CD, DA, AD, DC, AC, BD, valid, convex, selfX, flat, p1, p2, par, right, trapAD, trapAB, type,
    AB2: n2(AB), BC2: n2(BC), CD2: n2(CD), AD2: n2(AD), AC2: n2(AC), BD2: n2(BD), ang, O, h, M, N, MN: len(vec(M, N)),
    iso: trapAD && n2(AB) === n2(CD), perpD: dt(AC, BD) === 0, area: Math.abs(area2) / 2,
    diag: S.show.diag, mid: S.show.mid, found: S.found.size };
}

// ---------- lesson 4: one family a, b, h, s ----------
function famPts() { const a = S.a, b = S.b, h = S.h, s = S.s; return { A: [1, 1], B: [1 + s, 1 + h], C: [1 + s + b, 1 + h], D: [1 + a, 1] }; }
function famModel() {
  const a = S.a, b = S.b, h = S.h, s = S.s, P = famPts();
  const type = b === 0 ? 'tri' : b === a ? (s === 0 ? (a === h ? 'sq' : 'rect') : 'par') : 'trap';
  return { kind: 'area', a, b, h, s, P, type, S: (a + b) * h / 2, S1: a * h / 2, S2: b * h / 2, leg: Math.hypot(s, h), split: S.show.split, hgt: S.show.hgt, found: S.found4.size };
}
function setFam(a, b, h, s) {
  a = clamp(Math.round(a), 1, 10); h = clamp(Math.round(h), 1, 5);
  s = clamp(Math.round(s), -1, 10); b = clamp(Math.round(b), 0, 10 - s); s = clamp(s, -1, 10 - b);
  if (a === S.a && b === S.b && h === S.h && s === S.s) return;
  S.a = a; S.b = b; S.h = h; S.s = s;
  const m = famModel();
  if (m.S === 12 && ['tri', 'par', 'trap'].includes(m.type) && !S.found4.has(m.type)) { S.found4.add(m.type); toast(`Есть: ${TN[m.type]} площадью 12 см²!`); }
  else if (m.S === 12 && (m.type === 'rect' || m.type === 'sq')) toast(`${m.type === 'sq' ? 'Квадрат' : 'Прямоугольник'} тоже 12 см², но нужен параллелограмм с наклоном.`);
  update();
}

function setV(k, x, y) {
  x = clamp(Math.round(x), 0, GX); y = clamp(Math.round(y), 0, GY);
  const p = S.P[k]; if (p[0] === x && p[1] === y) return false;
  if (KS.some(q => q !== k && S.P[q][0] === x && S.P[q][1] === y)) return false;
  S.P[k] = [x, y];
  if (LID() === 'rect') {
    const m = quadModel();
    if (['rect', 'rhomb', 'sq'].includes(m.type) && !S.found.has(m.type)) { S.found.add(m.type); toast(`Собран ${TN[m.type]}!`); }
  }
  update(); return true;
}

// ---------- model ----------
function model() { return LID() === 'area' ? famModel() : quadModel(); }

// ---------- drawing ----------
const DIM = [520, 312];
const scene = $('#scene');
const f1 = v => v.toFixed(1);
const txt = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" ${extra}>${s}</text>`;
const say = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" font-family="Golos Text,sans-serif" ${extra}>${s}</text>`;
const line = (p, q, st, w, extra = '') => `<path d="M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
const sector = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(c.x)} ${f1(c.y)}L${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}Z`; };
const knob = (k, p, col) => `<g data-drag="v" data-k="${k}" data-part="verts"><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="20" fill="transparent"/><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="8" fill="${col}" stroke="${INK}" stroke-width="2"/></g>`;
function angSpan(V, U, W) { let a0 = degOf(V, U), d = (((degOf(V, W) - a0) % 360) + 360) % 360; if (d > 180) { a0 = degOf(V, W); d = 360 - d; } return [a0, d]; }
const unit = (p, q) => { const L = dist(p, q) || 1; return { ux: (q.x - p.x) / L, uy: (q.y - p.y) / L }; };
function ticks(p, q, n, col) {
  let h = ''; const { ux, uy } = unit(p, q), m = { x: (p.x + q.x) / 2 - ux * 10, y: (p.y + q.y) / 2 - uy * 10 };
  for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 5, c = { x: m.x + ux * o, y: m.y + uy * o }; h += line({ x: c.x - uy * 6, y: c.y + ux * 6 }, { x: c.x + uy * 6, y: c.y - ux * 6 }, col, 1.6); }
  return h;
}
function chev(p, q, n, col) {
  let h = ''; const { ux, uy } = unit(p, q);
  for (let i = 0; i < n; i++) { const c = { x: (p.x + q.x) / 2 + ux * (8 + i * 6), y: (p.y + q.y) / 2 + uy * (8 + i * 6) };
    h += `<path d="M${f1(c.x - ux * 6 - uy * 5)} ${f1(c.y - uy * 6 + ux * 5)}L${f1(c.x)} ${f1(c.y)}L${f1(c.x - ux * 6 + uy * 5)} ${f1(c.y - uy * 6 - ux * 5)}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`; }
  return h;
}
function gridSVG() {
  let h = '<g data-part="grid" pointer-events="none">';
  for (let i = 0; i <= GX; i++) h += line(sp([i, 0]), sp([i, GY]), '#1c2740', 1);
  for (let j = 0; j <= GY; j++) h += line(sp([0, j]), sp([GX, j]), '#1c2740', 1);
  h += `<text x="${OX}" y="${OY + 20}" font-size="10.5" fill="#6b7690" font-family="Golos Text,sans-serif">1 клетка = 1 см</text></g>`;
  return h;
}
const vlab = (V, G, k, col) => { const d = dist(V, G) || 1; return txt(V.x + (V.x - G.x) / d * 17, V.y + (V.y - G.y) / d * 17 + 5, k, 14, col || '#e8ecf4', 'font-weight="600" pointer-events="none"'); };
function rightMark(V, U, W, col) {
  const a = unit(V, U), b = unit(V, W), r = 10, p1 = { x: V.x + a.ux * r, y: V.y + a.uy * r }, p2 = { x: V.x + b.ux * r, y: V.y + b.uy * r }, p3 = { x: p1.x + b.ux * r, y: p1.y + b.uy * r };
  return `<path d="M${f1(p1.x)} ${f1(p1.y)}L${f1(p3.x)} ${f1(p3.y)}L${f1(p2.x)} ${f1(p2.y)}" fill="none" stroke="${col}" stroke-width="1.3"/>`;
}

function drawQuad() {
  const m = model(), id = LID(), V = {}; KS.forEach(k => V[k] = sp(S.P[k]));
  const G = { x: (V.A.x + V.B.x + V.C.x + V.D.x) / 4, y: (V.A.y + V.B.y + V.C.y + V.D.y) / 4 };
  const col = TC[m.type];
  let h = gridSVG();
  h += `<g data-part="quad" pointer-events="none"><path d="M${KS.map(k => f1(V[k].x) + ' ' + f1(V[k].y)).join('L')}Z" fill="${m.valid ? col : 'none'}" fill-opacity=".08" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
  SIDES.forEach(([p, q]) => {
    const a = V[p], b = V[q], md = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, dx = md.x - G.x, dy = md.y - G.y, L = Math.hypot(dx, dy) || 1;
    h += txt(md.x + dx / L * 15, md.y + dy / L * 15 + 4, f1c(len(vec(S.P[p], S.P[q]))), 11.5, '#8b96ad');
  });
  h += '</g>';
  if (m.valid) {
    // parallel chevrons + equal ticks
    let pm = '';
    if (m.p1) pm += chev(V.A, V.B, 1, '#72d4e8') + chev(V.D, V.C, 1, '#72d4e8');
    if (m.p2) pm += chev(V.A, V.D, 2, '#c39bff') + chev(V.B, V.C, 2, '#c39bff');
    h += `<g data-part="par" pointer-events="none">${pm}</g>`;
    const L2 = SIDES.map(([p, q]) => n2(vec(S.P[p], S.P[q]))), groups = [];
    L2.forEach(v => { if (!groups.includes(v) && L2.filter(x => x === v).length > 1) groups.push(v); });
    h += '<g data-part="quad" pointer-events="none">' + SIDES.map(([p, q], i) => { const g = groups.indexOf(L2[i]); return g < 0 ? '' : ticks(V[p], V[q], g + 1, '#ffb547'); }).join('') + '</g>';
  }
  if (S.show.ang && m.convex) {
    h += '<g data-part="angs" pointer-events="none">';
    KS.forEach((k, i) => {
      const U = V[KS[(i + 3) % 4]], W = V[KS[(i + 1) % 4]], [a0, d] = angSpan(V[k], U, W), deg = m.ang[k];
      if (Math.abs(deg - 90) < 1e-9) h += rightMark(V[k], U, W, '#ffb547');
      else h += `<path d="${sector(V[k], 18, a0, a0 + d)}" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-width="1.2"/>`;
      const lp = PT(V[k], d < 50 ? 44 : 34, a0 + d / 2);
      h += txt(lp.x, lp.y + 4, Math.round(deg) + '°', 11, '#ffb547', 'font-weight="500"');
    });
    h += '</g>';
  }
  if (S.show.diag) {
    h += `<g data-part="diag" pointer-events="none">${line(V.A, V.C, '#86e0a8', 1.6, 'stroke-dasharray="6 4"')}${line(V.B, V.D, '#86e0a8', 1.6, 'stroke-dasharray="6 4"')}`;
    if (m.O) {
      const Os = sp(m.O);
      h += `<circle cx="${f1(Os.x)}" cy="${f1(Os.y)}" r="4" fill="#86e0a8"/>` + txt(Os.x + 12, Os.y - 8, 'O', 12, '#86e0a8', 'font-weight="600"');
      if (m.par) { const same = m.AC2 === m.BD2; h += ticks(V.A, Os, 1, '#86e0a8') + ticks(Os, V.C, 1, '#86e0a8') + ticks(V.B, Os, same ? 1 : 2, '#86e0a8') + ticks(Os, V.D, same ? 1 : 2, '#86e0a8'); }
      if (m.perpD) h += rightMark(Os, V.C, V.D, '#86e0a8');
    }
    h += '</g>';
  }
  if (id === 'trap') {
    if (S.show.hgt && m.AD2) {
      const t = dt(m.AB, m.AD) / m.AD2, H = [m.A[0] + m.AD[0] * t, m.A[1] + m.AD[1] * t], Hs = sp(H);
      h += `<g data-part="hgt" pointer-events="none">`;
      if (t < 0 || t > 1) h += line(t < 0 ? V.A : V.D, Hs, '#3a4762', 1.4, 'stroke-dasharray="5 4"');
      h += line(V.B, Hs, '#f2d36b', 1.8) + (m.h > 0.3 ? rightMark(Hs, V.B, t < 1 ? V.D : V.A, '#f2d36b') : '') + txt(V.B.x - 24, V.B.y * 0.25 + Hs.y * 0.75 + 4, 'h = ' + f1c(m.h), 11.5, '#f2d36b', 'paint-order="stroke" stroke="#0e1520" stroke-width="4"') + `<circle cx="${f1(Hs.x)}" cy="${f1(Hs.y)}" r="3" fill="#f2d36b"/>` + txt(Hs.x, Hs.y + 18, 'H', 12, '#f2d36b', 'font-weight="600"') + '</g>';
    }
    if (S.show.mid) {
      const Ms = sp(m.M), Ns = sp(m.N);
      h += `<g data-part="mid" pointer-events="none">${line(Ms, Ns, '#ff9fc4', 2.4, 'stroke-linecap="round"')}<circle cx="${f1(Ms.x)}" cy="${f1(Ms.y)}" r="4" fill="#ff9fc4"/><circle cx="${f1(Ns.x)}" cy="${f1(Ns.y)}" r="4" fill="#ff9fc4"/>` +
        txt(Ms.x + 14, Ms.y + 17, 'M', 12, '#ff9fc4', 'font-weight="600" paint-order="stroke" stroke="#0e1520" stroke-width="4"') + txt(Ns.x - 14, Ns.y + 17, 'N', 12, '#ff9fc4', 'font-weight="600" paint-order="stroke" stroke="#0e1520" stroke-width="4"') + txt((Ms.x + Ns.x) / 2 + 30, (Ms.y + Ns.y) / 2 + 17, 'MN = ' + f1c(m.MN), 11.5, '#ff9fc4', 'font-weight="600" paint-order="stroke" stroke="#0e1520" stroke-width="4"') + '</g>';
    }
  }
  h += KS.map(k => vlab(V[k], G, k)).join('');
  h += KS.map(k => knob(k, V[k], S.selV === k ? '#ffb547' : '#e8ecf4')).join('');
  let lab = TN[m.type];
  if (m.type === 'trap') lab = (m.iso ? 'равнобедренная ' : (Math.abs(m.ang.A - 90) < 1e-9 || Math.abs(m.ang.D - 90) < 1e-9 || Math.abs(m.ang.B - 90) < 1e-9) ? 'прямоугольная ' : '') + 'трапеция' + (m.trapAB ? ' (основания AB и CD)' : '');
  if (m.type === 'bad') lab = m.selfX ? 'стороны пересекаются — это не четырёхугольник' : 'три вершины на одной прямой';
  h += `<g data-part="type" pointer-events="none">${say(260, 304, lab, 13.5, col, 'font-weight="600"')}</g>`;
  return h;
}

function drawArea() {
  const m = model(), P = m.P, V = {}; KS.forEach(k => V[k] = sp(P[k]));
  const col = TC[m.type];
  let h = gridSVG();
  const poly = (ks, fill, op, st) => `<path d="M${ks.map(k => f1(V[k].x) + ' ' + f1(V[k].y)).join('L')}Z" fill="${fill}" fill-opacity="${op}" stroke="${st || 'none'}" stroke-width="2.4" stroke-linejoin="round"/>`;
  if (m.split) {
    const cA = { x: (V.A.x + V.B.x + V.D.x) / 3, y: (V.A.y + V.B.y + V.D.y) / 3 };

    h += line(V.B, Hs, '#f2d36b', 1.8) + rightMark(Hs, V.B, P.B[0] < 1 + m.a ? V.D : V.A, '#f2d36b') + txt(V.B.x - 24, (V.B.y + Hs.y) / 2 + 4, 'h = ' + m.h, 11.5, '#f2d36b', 'font-weight="600" paint-order="stroke" stroke="#0e1520" stroke-width="4"') + '</g>';
  }
  h += `<g data-part="sides" pointer-events="none">${txt((V.A.x + V.D.x) / 2, V.A.y + 20, 'a = ' + m.a, 12, '#e8ecf4', 'font-weight="600"')}${m.b ? txt((V.B.x + V.C.x) / 2, V.B.y - 12, 'b = ' + m.b, 12, '#e8ecf4', 'font-weight="600"') : ''}</g>`;
  h += `<g pointer-events="none">${txt(V.A.x - 12, V.A.y + 5, 'A', 14, '#e8ecf4', 'font-weight="600"')}${txt(V.D.x + 12, V.D.y + 5, 'D', 14, '#e8ecf4', 'font-weight="600"')}${m.b ? txt(V.B.x - 12, V.B.y - 6, 'B', 14, '#e8ecf4', 'font-weight="600"') + txt(V.C.x + 12, V.C.y - 6, 'C', 14, '#e8ecf4', 'font-weight="600"') : txt(V.B.x, V.B.y - 14, 'B = C', 13, '#e8ecf4', 'font-weight="600"')}</g>`;

function areaLine(m) {

function drawScene(t) {
  scene.innerHTML = LID() === 'area' ? drawArea() : drawQuad();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);
      scene.insertAdjacentHTML('beforeend', `<rect x="${f1(bb.x0 - 6)}" y="${f1(bb.y0 - 6)}" width="${f1(bb.x1 - bb.x0 + 12)}" height="${f1(bb.y1 - bb.y0 + 12)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`); }
    else { S.hl = null; toast('Сейчас этого нет на поле — включите его кнопкой внизу.'); }
  }
}

let drag = null;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
function dragTo(k, p) {
  const gx = (p.x - OX) / SC, gy = (OY - p.y) / SC;

  const x = Math.round(gx) - 1, y = Math.round(gy) - 1;

});

      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на поле</h2><p class="note">Нажмите на пункт, чтобы найти его на поле.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'area') {
    let h = `<h2>Площадь фигуры</h2><div class="formula">S = (a + b) : 2 · h</div><div class="steps">` +
      step('a = AD', m.a + ' см') + step('b = BC', m.b + ' см') + step('h', m.h + ' см') +
      step('S = (a + b) : 2 · h', `(${m.a} + ${m.b}) : 2 · ${m.h} = ${fmt(m.S)} см²`, 'sum') + `</div>`;
    h += `<h3>Своя формула: ${TN[m.type]}</h3><div class="steps">` + step(TN[m.type], areaLine(m).replace(/^S = /, 'S = ')) + `</div>`;
    h += `<h3>Разрез диагональю BD</h3><div class="steps">` + step('△ABD = ½ · a · h', `½ · ${m.a} · ${m.h} = ${fmt(m.S1)} см²`) +
      step('△BCD = ½ · b · h', `½ · ${m.b} · ${m.h} = ${fmt(m.S2)} см²`) + step('сумма', `${fmt(m.S1)} + ${fmt(m.S2)} = ${fmt(m.S)} см²`, 'sum') + `</div>`;
    if (m.type !== 'rect' && m.type !== 'sq' && m.s !== 0) h += `<p class="note" style="margin-top:10px">Боковая сторона AB ≈ ${f1c(m.leg)} см, но в формулу она не входит: площадь зависит от высоты h = ${m.h} см.</p>`;
    h += `<h3>Задание: S = 12 см²</h3><div class="steps">` + ['tri', 'par', 'trap'].map(k => step(TN[k], yn(S.found4.has(k)))).join('') + `</div>`;
    return h;
  }
  if (!m.valid) return `<h2>Это не четырёхугольник</h2><p>${m.selfX ? 'Стороны пересекаются между собой. У четырёхугольника стороны встречаются только в вершинах.' : 'Три вершины стоят на одной прямой — получился треугольник с лишней точкой.'}</p><p class="note">Сдвиньте одну из вершин.</p>`;
  const angs = m.convex ? step('∠A + ∠B + ∠C + ∠D', `${dg(m.ang.A)} + ${dg(m.ang.B)} + ${dg(m.ang.C)} + ${dg(m.ang.D)} ≈ 360°`, 'sum') : '';
  const note = '<p class="note" style="margin-top:10px">Сдвиг стороны — на сколько клеток она идёт вправо и вверх. Стороны параллельны, когда их сдвиги пропорциональны. Длины наклонных отрезков программа меряет как линейка; вычислять их по клеткам научит теорема Пифагора.</p>';
  if (id === 'par') {
    let h = `<h2>Параллелограмм?</h2><div class="formula">AB ∥ DC и AD ∥ BC</div><div class="steps">` +
      step('сдвиг AB', sh(m.AB)) + step('сдвиг DC', sh(m.DC)) + step('AB ∥ DC?', yn(m.p1), 'sum') +
      step('сдвиг AD', sh(m.AD)) + step('сдвиг BC', sh(m.BC)) + step('AD ∥ BC?', yn(m.p2), 'sum') + `</div>`;
    h += `<h3>Свойства</h3><div class="steps">` + step('AB и CD', `${lenS(m.AB2)} и ${lenS(m.CD2)}`) + step('AD и BC', `${lenS(m.AD2)} и ${lenS(m.BC2)}`);
    if (m.convex) h += step('∠A и ∠C', `${dg(m.ang.A)} и ${dg(m.ang.C)}`) + step('∠B и ∠D', `${dg(m.ang.B)} и ${dg(m.ang.D)}`) + step('∠A + ∠B', `${dg(m.ang.A)} + ${dg(m.ang.B)} = ${dg(m.ang.A + m.ang.B)}`) + angs;
    h += `</div>`;
    if (m.O) { const AO = len(vec(m.A, m.O)), OC = len(vec(m.O, m.C)), BO = len(vec(m.B, m.O)), OD = len(vec(m.O, m.D));
      h += `<h3>Диагонали</h3><div class="steps">` + step('AO и OC', `${f1c(AO)} и ${f1c(OC)} см`) + step('BO и OD', `${f1c(BO)} и ${f1c(OD)} см`) + step('O — середина обеих?', yn(Math.abs(AO - OC) < 1e-9 && Math.abs(BO - OD) < 1e-9), 'sum') + `</div>`; }
    return h + note;
  }
  if (id === 'rect') {
    let h = `<h2>Какая это фигура?</h2><div class="formula">${TN[m.type]}</div><div class="steps">` +
      step('1. Параллелограмм?', yn(m.par)) +
      step('2. Угол A прямой?', m.convex ? `${dg(m.ang.A)} — ${m.right ? '<span class="yes">да</span>' : '<span class="no">нет</span>'}` : '—') +
      step('3. AB = AD?', `${lenS(m.AB2)} и ${lenS(m.AD2)} — ${yn(m.AB2 === m.AD2)}`) +
      step('Итог', m.par ? (m.type === 'sq' ? 'прямой угол + равные стороны → квадрат' : m.type === 'rect' ? 'прямой угол → прямоугольник' : m.type === 'rhomb' ? 'равные стороны → ромб' : 'просто параллелограмм') : 'не параллелограмм', 'sum') + `</div>`;
    h += `<h3>Диагонали</h3><div class="steps">` + step('AC', lenS(m.AC2)) + step('BD', lenS(m.BD2)) + step('AC = BD?', yn(m.AC2 === m.BD2)) + step('AC ⟂ BD?', yn(m.perpD));
    if (m.type === 'rhomb' || m.type === 'sq') { const a1 = angSpan(sp(m.A), sp(m.B), sp(m.C))[1]; h += step('∠BAC и ∠CAD', `${dg(a1)} и ${dg(m.ang.A - a1)}`); }
    h += `</div><p class="note" style="margin-top:10px">Прямоугольник: диагонали равны. Ромб: перпендикулярны и делят углы пополам. Квадрат: всё сразу.</p>`;
    h += `<h3>Собрано</h3><div class="steps">` + ['rect', 'rhomb', 'sq'].map(k => step(TN[k], yn(S.found.has(k)))).join('') + `</div>`;
    return h;
  }
  let h = `<h2>Трапеция?</h2><div class="formula">MN = (AD + BC) : 2</div><div class="steps">` +
    step('сдвиг AD и BC', `${sh(m.AD)} и ${sh(m.BC)}`) + step('AD ∥ BC?', yn(m.p2)) + step('AB ∥ CD?', yn(m.p1)) +
    step('трапеция с основаниями AD, BC?', yn(m.trapAD), 'sum') + `</div>`;
  if (m.trapAD) {
    const AD = len(m.AD), BC = len(m.BC);
    h += `<h3>Средняя линия</h3><div class="steps">` + step('AD', lenS(m.AD2)) + step('BC', lenS(m.BC2)) +
      step('(AD + BC) : 2', `(${f1c(AD)} + ${f1c(BC)}) : 2 = ${f1c((AD + BC) / 2)} см`) + step('MN на чертеже', f1c(m.MN) + ' см', 'sum') + `</div>`;
    h += `<h3>Боковые стороны и углы</h3><div class="steps">` + step('AB и CD', `${lenS(m.AB2)} и ${lenS(m.CD2)}`) + step('равнобедренная?', yn(m.iso)) +
      step('∠A и ∠D', `${dg(m.ang.A)} и ${dg(m.ang.D)}`) + step('∠A + ∠B', `${dg(m.ang.A)} + ${dg(m.ang.B)} = ${dg(m.ang.A + m.ang.B)}`) +
      step('AC и BD', `${lenS(m.AC2)} и ${lenS(m.BD2)}`) + `</div>`;
    h += `<h3>Высота</h3><div class="steps">` + step('h = BH', fmt(m.h) + ' см') + step('S = (AD + BC) : 2 · h', `${f1c((AD + BC) / 2)} · ${fmt(m.h)} = ${fmt((AD + BC) / 2 * m.h)} см²`, 'sum') + `</div>`;
  }
  return h + note;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()], id = LID();
  if (id === 'area') { el.innerHTML = `<div class="k">Площадь</div><div class="v ${m.S === 12 ? 'ok' : ''}">${fmt(m.S)} см²</div><div class="lr"><span>вид</span><span>${TN[m.type]}</span></div><div class="lr"><span>найдено</span><span>${m.found} из 3</span></div>`; return; }
  const v = `<div class="v ${ok ? 'ok' : ''}" style="color:${ok ? '' : TC[m.type]};font-size:13px;line-height:1.3">${TN[m.type]}</div>`;
  if (id === 'par') el.innerHTML = `<div class="k">Фигура</div>${v}<div class="lr"><span>AB ∥ DC</span><span>${m.p1 ? '✓' : '·'}</span></div><div class="lr"><span>AD ∥ BC</span><span>${m.p2 ? '✓' : '·'}</span></div>`;
  else if (id === 'rect') el.innerHTML = `<div class="k">Собрано ${m.found} из 3</div>${v}${['rect', 'rhomb', 'sq'].map(k => `<div class="lr"><span>${TN[k]}</span><span>${S.found.has(k) ? '✓' : '·'}</span></div>`).join('')}`;
  else el.innerHTML = `<div class="k">Средняя линия</div><div class="v ${ok ? 'ok' : ''}">MN = ${f1c(m.MN)}</div><div class="lr"><span>AD · BC</span><span>${f1c(len(m.AD))} · ${f1c(len(m.BC))}</span></div><div class="lr"><span>h</span><span>${fmt(m.h)}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  par: '<path d="M10 26L20 5H56L46 26Z" fill="rgba(114,212,232,.12)" stroke="#72d4e8" stroke-width="1.4"/><path d="M10 26L56 5M20 5L46 26" stroke="#86e0a8" stroke-dasharray="2 2"/>',
  rect: '<rect x="6" y="7" width="22" height="17" fill="none" stroke="#ffb547" stroke-width="1.4"/><path d="M46 3L57 15L46 27L35 15Z" fill="none" stroke="#86e0a8" stroke-width="1.4"/>',
  trap: '<path d="M6 26L20 5H44L58 26Z" fill="rgba(195,155,255,.12)" stroke="#c39bff" stroke-width="1.4"/><path d="M13 15.5H51" stroke="#ff9fc4" stroke-width="1.6"/>',
  area: '<path d="M6 26L18 6H40L56 26Z" fill="none" stroke="#e8ecf4" stroke-width="1.3"/><path d="M6 26L18 6L56 26Z" fill="rgba(255,181,71,.35)"/><path d="M18 6H40L56 26Z" fill="rgba(114,212,232,.35)"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.show = { diag: false, ang: true, mid: false, hgt: L.id === 'area', split: false };
  if (L.id === 'rect') S.found = new Set();
  if (L.id === 'area') S.found4 = new Set();
  S.selV = L.id === 'area' ? 'C' : 'B';
  resetShape();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id !== 'area') {
    const pts = KS.map(k => `${k}(${S.P[k].join('; ')})`).join(', ');
    const base = `Клетчатая сетка, 1 клетка = 1 см, вершины на узлах: ${pts}. Стороны: AB ${lenS(m.AB2)}, BC ${lenS(m.BC2)}, CD ${lenS(m.CD2)}, DA ${lenS(m.AD2)}. Сейчас фигура: ${TN[m.type]}. AB ∥ DC: ${m.p1 ? 'да' : 'нет'}, AD ∥ BC: ${m.p2 ? 'да' : 'нет'}.` +
      (m.convex ? ` Углы: A ${dg(m.ang.A)}, B ${dg(m.ang.B)}, C ${dg(m.ang.C)}, D ${dg(m.ang.D)}.` : '') + ` Диагонали AC ${lenS(m.AC2)}, BD ${lenS(m.BD2)}, ${S.show.diag ? 'показаны' : 'скрыты'}.`;
    if (id === 'par') now = base + ' Задание: параллелограмм с AD = 6 см, AB = 5 см, угол A не прямой, диагонали включены. Не называй готовые координаты — наводи вопросами (какой сдвиг у AD, каким должен быть сдвиг BC).';
    if (id === 'rect') now = base + ` Собрано: ${['rect', 'rhomb', 'sq'].map(k => TN[k] + (S.found.has(k) ? ' — да' : ' — нет')).join(', ')}. Ученик должен по очереди собрать прямоугольник (не квадрат), ромб (не квадрат) и квадрат. Наводи вопросами про определения и свойства диагоналей.`;
    if (id === 'trap') now = base + ` Высота к AD: ${fmt(m.h)} см (${S.show.hgt ? 'показана' : 'скрыта'}). Средняя линия MN = ${f1c(m.MN)} см (${S.show.mid ? 'показана' : 'скрыта'}). Равнобедренная: ${m.iso ? 'да' : 'нет'}. Задание: равнобедренная трапеция AD = 8, BC = 4, h = 3, включить среднюю линию. Помогай вопросами, не называй координаты.`;
  } else now = `Фигура ABCD: основание AD = a = ${m.a} см на линии сетки, верхнее основание BC = b = ${m.b} см, высота h = ${m.h} см, сдвиг верхнего основания ${m.s} см. Вид: ${TN[m.type]}. Площадь S = (a + b) : 2 · h = ${fmt(m.S)} см². Разрез диагональю ${m.split ? 'показан' : 'скрыт'}. Найдено фигур площадью 12 см²: ${['tri', 'par', 'trap'].map(k => TN[k] + (S.found4.has(k) ? ' — да' : ' — нет')).join(', ')}. Не давай готовые размеры — помоги подобрать a, b, h через формулу.`;
  return [
    `Раздел: математика, 8 класс, геометрия, тема «Четырёхугольники». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    par: 'Почему у параллелограмма противоположные углы равны?', rect: 'Почему квадрат — это и ромб, и прямоугольник?',
    trap: 'Почему средняя линия трапеции равна полусумме оснований?', area: 'Почему площадь параллелограмма — основание на высоту, а не на боковую сторону?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
