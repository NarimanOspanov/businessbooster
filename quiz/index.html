<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квизрум — викторина с друзьями · Open School AI</title>
<meta name="description" content="Квизрум: создай комнату, кинь ссылку друзьям — и играйте в викторину с ведущим, голосовым чатом и пьедесталом. Кино, музыка, наука, флаги, глобус и школьные темы.">
<meta property="og:title" content="Квизрум — сыграем в викторину?">
<meta property="og:description" content="Вопросы читает ИИ-ведущий, отвечаем на скорость, в конце — пьедестал. Заходи по ссылке, нужно только имя.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{--bg:#0b1019;--surface:#121a28;--surface-2:#1a2438;--line:#26324a;--fg:#e8ecf4;--muted:#8b96ad;--ok:#86e0a8;--bad:#ff8a73;--accent:#ffb547;
  --a:#ff8a73;--b:#72d4e8;--c:#ffb547;--d:#a99cff;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;--font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2540 0%,var(--bg) 60%);color:var(--fg);font:15.5px/1.5 var(--font-body)}
a{color:var(--accent)}button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand b{font:700 18px/1 var(--font-display);letter-spacing:.06em}.brand small{display:block;font:500 10px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
h1{font:700 clamp(30px,6vw,46px)/1.05 var(--font-display);margin:28px 0 10px;letter-spacing:-.01em}
h2{font:700 22px/1.2 var(--font-display);margin:0 0 6px}
.lead{color:#cfd6e4;font-size:17px;margin:0 0 22px;max-width:620px}
.lbl{font:600 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
input.f{width:100%;height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:17px}
input.f:focus{outline:2px solid var(--accent);border-color:transparent}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:12px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.cat i{font-style:normal;font-size:20px}.cat[aria-pressed="true"]{border-color:var(--accent);background:#3a2c12}
.cat:focus-visible{outline:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:9px 16px;font-weight:600}.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}.btn.big{width:100%;padding:16px;font-size:17px;box-sizing:border-box}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}.btn[disabled]{opacity:.5;pointer-events:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.share{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg);border:1px dashed #3a4866;border-radius:16px;padding:12px 12px 12px 16px;margin:14px 0}
.share code{font:600 16px var(--font-mono);color:var(--accent);word-break:break-all}
.shbtns{display:flex;gap:8px;flex-wrap:wrap}.shbtns .btn{padding:10px 14px;font-size:14px}
.roomcode{font:700 13px var(--font-mono);letter-spacing:.2em;color:var(--muted)}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pl{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px}
.pl .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-display);color:#0b1019}
.pl.off{opacity:.45}.pl .tag{font-size:11px;color:var(--muted);font-weight:500}.pl.ans{border-color:var(--ok)}
.pl button{all:unset;cursor:pointer;color:var(--muted);font-size:13px;margin-left:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.top .sp{flex:1}.prog{font:600 13px var(--font-mono);color:var(--muted)}
.timer{position:relative;width:54px;height:54px}.timer svg{transform:rotate(-90deg)}.timer b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px var(--font-display)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.media{position:relative;background:#070b12;display:grid;place-items:center;width:100%;height:min(42vh,380px)}
.media{overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.media img.flag{inset:10% 15%;width:70%;height:80%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.media svg{width:100%;height:100%}
.qtext{font:700 clamp(19px,3.6vw,26px)/1.3 var(--font-display);padding:18px 20px 6px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px 20px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;font-weight:600;font-size:16px;min-height:30px;position:relative;overflow:hidden}
.opt .k{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font:700 15px var(--font-display);color:#0b1019}
.opt:nth-child(1) .k{background:var(--a)}.opt:nth-child(2) .k{background:var(--b)}.opt:nth-child(3) .k{background:var(--c)}.opt:nth-child(4) .k{background:var(--d)}
.opt:hover{border-color:#3a4866}.opt.mine{border-color:var(--fg)}.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:#173a28}.opt.wrong{border-color:var(--bad);background:#3d1d17}
.opt .bar{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}.opt .cnt{margin-left:auto;font:600 13px var(--font-mono);color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--accent)}
.rev{padding:0 20px 20px;display:grid;gap:8px}
.rev .fact{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px}
.rev .gain{font:700 18px var(--font-display)}.rev .gain.ok{color:var(--ok)}.rev .gain.no{color:var(--bad)}
.wait{color:var(--muted);text-align:center;padding:4px 20px 18px;font-size:14px}
.loading{text-align:center;padding:60px 20px}.loading .spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--accent);margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:22px 0 10px}
.pod{text-align:center;width:min(30%,170px)}.pod .av{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 22px var(--font-display);color:#0b1019}
.pod .nm{font-weight:700}.pod .sc{font:600 13px var(--font-mono);color:var(--muted)}
.pod .st{margin-top:8px;border-radius:14px 14px 0 0;display:grid;place-items:center;font:700 30px var(--font-display);color:#0b1019}
.pod.p1 .st{height:120px;background:linear-gradient(#ffd166,#ffb547)}.pod.p2 .st{height:88px;background:linear-gradient(#e2e8f0,#b8c2d4)}.pod.p3 .st{height:64px;background:linear-gradient(#f0b27a,#d98c4f)}
.rank{display:grid;gap:6px}.rank div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface-2)}.rank b{width:26px;color:var(--muted)}.rank .nm{flex:1}.rank em{font:600 13px var(--font-mono);font-style:normal}
.rank .av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font-display);color:#0b1019}
.rank .me{outline:1px solid var(--accent)}
.vbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;gap:8px;align-items:center;background:rgba(18,26,40,.94);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.vbar .who{font-size:13px;color:var(--muted);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar button{all:unset;cursor:pointer;padding:9px 14px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px}.vbar button.on{background:var(--ok);color:#0b1019}
.vbar button:focus-visible{outline:2px solid var(--accent)}
.mute{all:unset;cursor:pointer;font-size:18px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.volw{position:relative}
.vol{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.vol label{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}.vol label b{color:var(--fg);font-weight:600}
.vol input[type=range]{width:100%;accent-color:var(--accent);margin:0 0 12px}
.vol input[type=range]:last-child{margin-bottom:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;color:#cfd6e4}.feat b{display:block;color:var(--fg);margin-bottom:2px}
.cta{margin-top:16px;display:grid;gap:8px}.cta a{text-decoration:none}
.note{color:var(--muted);font-size:13px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.feat{grid-template-columns:1fr}.share{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.loading .spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="/"><span style="font-size:28px">🦉</span><div><b>OPEN SCHOOL AI</b><small>Квизрум</small></div></a><div class="volw"><button class="mute" id="mute" type="button" aria-label="Громкость" aria-expanded="false" aria-controls="vol">🔊</button>
    <div class="vol" id="vol" hidden><label for="vHost">Голос ведущего <b id="vHostN"></b></label><input type="range" id="vHost" min="0" max="100" step="5">
      <label for="vPeers">Голоса игроков <b id="vPeersN"></b></label><input type="range" id="vPeers" min="0" max="100" step="5"></div></div></header>
  <main id="app"></main>
</div>
<div class="vbar" id="vbar" hidden><span class="who" id="vwho">Голосовой чат</span><button type="button" id="vbtn">🎤 Включить микрофон</button></div>
<script>
(() => {
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const COLORS = ['#ff8a73', '#72d4e8', '#ffb547', '#a99cff', '#86e0a8', '#f5a3d1', '#9ad0ff', '#ffd166'];
const colorOf = pid => COLORS[(parseInt(String(pid).slice(1), 10) || 0) % COLORS.length];
const av = (p, cls = 'av') => `<span class="${cls}" style="background:${colorOf(p.pid)}">${esc((p.name || '•')[0].toUpperCase())}</span>`;
const LET = ['А', 'Б', 'В', 'Г'];
const api = async (path, body) => { const r = await fetch('/api/quizroom/' + path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({ ok: false, error: 'нет связи' })); return j; };
const NAME_KEY = 'qr-name', sessKey = c => 'qr:' + c;
const getName = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
const setName = n => { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} };
const sess = c => { try { return JSON.parse(localStorage.getItem(sessKey(c)) || 'null'); } catch (e) { return null; } };
const setSess = (c, v) => { try { localStorage.setItem(sessKey(c), JSON.stringify(v)); } catch (e) {} };
let cats = [];

// ---------- голос ведущего ----------
// громкость: ведущий и голоса игроков — у каждого своя, запоминается
const vols = (() => { try { return JSON.parse(localStorage.getItem('qr-vol') || 'null') || { host: 80, peers: 100 }; } catch (e) { return { host: 80, peers: 100 }; } })();
let muted = false;
const audio = new Audio(); const said = new Set();
const paintMute = () => {
  muted = vols.host === 0; audio.volume = vols.host / 100;
  $('#mute').textContent = vols.host === 0 && vols.peers === 0 ? '🔇' : vols.host < 40 ? '🔉' : '🔊';
  $('#vHost').value = vols.host; $('#vPeers').value = vols.peers; $('#vHostN').textContent = vols.host + '%'; $('#vPeersN').textContent = vols.peers + '%';
  document.querySelectorAll('audio[data-peer]').forEach(a => { a.volume = vols.peers / 100; });
};
const saveVols = () => { try { localStorage.setItem('qr-vol', JSON.stringify(vols)); } catch (e) {} paintMute(); };
$('#vHost').oninput = e => { vols.host = +e.target.value; saveVols(); if (vols.host === 0) audio.pause(); };
$('#vPeers').oninput = e => { vols.peers = +e.target.value; saveVols(); };
$('#mute').onclick = e => { e.stopPropagation(); const v = $('#vol'); v.hidden = !v.hidden; $('#mute').setAttribute('aria-expanded', String(!v.hidden)); };
document.addEventListener('click', e => { if (!e.target.closest('.volw')) { $('#vol').hidden = true; $('#mute').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#vol').hidden = true; });
paintMute();
const unlock = () => { audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; audio.play().catch(() => {}); };
async function say(key, text) {
  if (said.has(key)) return; said.add(key); if (muted || !text) return;
  try { const r = await fetch('/api/tutor/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }); if (!r.ok) return; const b = await r.blob(); audio.pause(); audio.src = URL.createObjectURL(b); audio.volume = vols.host / 100; audio.play().catch(() => {}); } catch (e) {}
}

// ---------- главная: создать комнату ----------
async function landing() {
  if (!cats.length) { const j = await api('categories'); cats = j.categories || []; }
  let cat = 'mix', count = 10;
  const group = (g, title) => `<div class="lbl">${title}</div><div class="cats">${cats.filter(c => c.group === g).map(c => `<button type="button" class="cat" data-c="${c.id}" aria-pressed="${c.id === cat}"><i>${c.emoji}</i>${esc(c.name)}</button>`).join('')}</div>`;
  app.innerHTML = `<h1>Квизрум 🎯</h1><p class="lead">Создай комнату, кинь ссылку друзьям в Telegram — и играйте в викторину: вопросы читает ИИ-ведущий, отвечаете на скорость, можно болтать голосом, в конце — пьедестал.</p>
    <div class="card"><div class="lbl" style="margin-top:0">Как тебя зовут</div><input class="f" id="nm" maxlength="24" placeholder="Имя" value="${esc(getName())}" autocomplete="nickname">
      ${group('fun', 'Тема игры')}${group('geo', 'География')}${group('school', 'Школьные темы')}
      <div class="lbl">Вопросов</div><div class="seg" role="group" aria-label="Сколько вопросов">${[5, 10, 15].map(n => `<button type="button" data-n="${n}" aria-pressed="${n === count}">${n}</button>`).join('')}</div>
      <div style="margin-top:20px"><button class="btn pri big" id="mk" type="button">Создать комнату</button></div><div class="err" id="err"></div></div>
    <div class="feat"><div><b>Без регистрации</b>Друзьям нужно только имя — заходят по ссылке за пару секунд.</div><div><b>Ведущий и голос</b>ИИ читает вопросы, а вы общаетесь в голосовом чате.</div><div><b>Пьедестал</b>Очки за правильный и быстрый ответ, в конце — кто какое место занял.</div></div>`;
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; app.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { count = +b.dataset.n; app.querySelectorAll('[data-n]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#mk').onclick = async () => {
    const name = $('#nm').value.trim(); if (!name) { $('#err').textContent = 'Напиши имя — так тебя увидят в комнате.'; $('#nm').focus(); return; }
    unlock(); setName(name); $('#mk').disabled = true;
    const j = await api('create', { name, category: cat, count, ref: document.referrer.slice(0, 200) });
    if (!j.ok) { $('#err').textContent = j.error; $('#mk').disabled = false; return; }
    setSess(j.code, { pid: j.pid, token: j.token }); location.hash = j.code;
  };
}

// ---------- вход по ссылке ----------
function joinForm(code, msg) {
  app.innerHTML = `<h1>Тебя позвали в квиз 🎯</h1><p class="lead">Комната <span class="roomcode">${esc(code)}</span>. Напиши имя — и поехали.</p>
    <div class="card"><input class="f" id="nm" maxlength="24" placeholder="Твоё имя" value="${esc(getName())}" autocomplete="nickname"><div style="margin-top:12px"><button class="btn pri big" id="jn" type="button">Войти в комнату</button></div><div class="err" id="err">${esc(msg || '')}</div></div>`;
  const go = async () => {
    const name = $('#nm').value.trim(); if (!name) { $('#err').textContent = 'Как тебя зовут?'; return; }
    unlock(); setName(name); $('#jn').disabled = true;
    const j = await api(code + '/join', { name });
    if (!j.ok) { $('#err').textContent = j.error; $('#jn').disabled = false; return; }
    setSess(code, { pid: j.pid, token: j.token }); room(code);
  };
  $('#jn').onclick = go; $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#nm').focus();
}

// ---------- комната ----------
let poll = 0, S = null, cur = { code: null }, lastKey = '', clockRaf = 0, globeLib = null;
function stop() { clearTimeout(poll); cancelAnimationFrame(clockRaf); }
async function room(code) {
  stop(); cur = { code, s: sess(code) }; lastKey = '';
  if (!cur.s) return joinForm(code);
  const tickFn = async () => {
    const j = await api(`${code}/state?pid=${cur.s.pid}&token=${cur.s.token}`);
    if (!j.ok) { stop(); voice.off(); if (j.gone) { setSess(code, null); return joinForm(code, j.error); } app.innerHTML = `<h1>Упс</h1><p class="lead">${esc(j.error)}</p><a class="btn pri" href="#">Создать свою комнату</a>`; return; }
    S = j; S.got = performance.now(); render(); voice.sync(j);
    poll = setTimeout(tickFn, j.phase === 'q' ? 700 : 1000);
  };
  tickFn();
}
const shareText = () => `Залетай в квиз «${S.catName}» ${S.emoji} — вопросы читает ИИ-ведущий, в конце пьедестал!`;
const roomUrl = () => location.origin + '/quiz/#' + S.code;
function shareBlock(text, url) {
  return `<div class="share"><code>${esc(url)}</code><div class="shbtns"><a class="btn pri" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}">Telegram</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}">WhatsApp</a><button class="btn" type="button" data-copy="${esc(url)}">Копировать</button></div></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (!b) return; (navigator.share && /Mobi/.test(navigator.userAgent) ? navigator.share({ url: b.dataset.copy, text: shareText() }) : navigator.clipboard.writeText(b.dataset.copy)).catch(() => {}); b.textContent = 'Скопировано ✓'; });

function playersHtml(withKick) {
  return `<div class="players">${S.players.map(p => `<span class="pl${p.online ? '' : ' off'}${p.answered ? ' ans' : ''}">${av(p)}${esc(p.name)}${p.host ? ' <span class="tag">ведущий</span>' : ''}${p.voice ? ' 🎤' : ''}${p.pid === S.me.pid ? ' <span class="tag">(ты)</span>' : ''}${withKick && S.me.host && !p.host ? `<button type="button" data-kick="${p.pid}" aria-label="Убрать ${esc(p.name)}">✕</button>` : ''}</span>`).join('')}</div>`;
}
function render() {
  const key = [S.phase, S.qi, S.v].join('|');
  $('#vbar').hidden = false;
  if (key === lastKey) { if (S.phase === 'q' || S.phase === 'reveal') clock(); return; }
  const phaseChanged = !lastKey.startsWith(S.phase + '|' + S.qi); lastKey = key;
  if (S.phase === 'lobby') lobby();
  else if (S.phase === 'loading') app.innerHTML = `<div class="loading"><div class="spin"></div><h2>Ведущий готовит вопросы…</h2><p class="note">${S.emoji} ${esc(S.catName)} · ${S.total} ${plural(S.total, 'вопрос', 'вопроса', 'вопросов')} · обычно до минуты</p></div>
    <div class="card"><b>Пока ждём — позови ещё друзей, они успеют зайти:</b>${shareBlock(shareText(), roomUrl())}${playersHtml(false)}</div>`;
  else if (S.phase === 'q' || S.phase === 'reveal') { question(phaseChanged); clock(); }
  else if (S.phase === 'final') final();
}
function lobby() {
  const n = S.players.length;
  app.innerHTML = `<div class="top"><h2 style="margin:0">${S.emoji} ${esc(S.catName)}</h2><span class="sp"></span><span class="roomcode">КОМНАТА ${esc(S.code)}</span></div>
    <div class="card"><b>Позови друзей — кинь ссылку:</b>${shareBlock(shareText(), roomUrl())}
      <div class="lbl">В комнате ${n} ${plural(n, 'игрок', 'игрока', 'игроков')}</div>${playersHtml(true)}
      ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
      <div style="margin-top:20px">${S.me.host ? `<button class="btn pri big" id="go" type="button">Начать игру${n < 2 ? ' (можно и одному)' : ''}</button><p class="note" style="text-align:center;margin:8px 0 0">${S.total} ${plural(S.total, 'вопрос', 'вопроса', 'вопросов')} · 20 секунд на ответ · очки за скорость</p>` : '<p class="note" style="text-align:center;font-size:15px">Ждём, пока ведущий начнёт игру… Можно включить микрофон и поболтать 🎤</p>'}</div></div>`;
  const go = $('#go'); if (go) go.onclick = async () => { unlock(); go.disabled = true; await api(S.code + '/start', auth()); };
  app.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => api(S.code + '/kick', { ...auth(), target: b.dataset.kick }));
  say('lobby', S.me.host ? '' : '');
}
const auth = () => ({ pid: cur.s.pid, token: cur.s.token });
function media(q) {
  if (q.kind === 'globe') return `<div class="media" id="globe" aria-label="Глобус с подсвеченной страной"></div>`;
  if (q.image) return `<div class="media"><img ${q.kind === 'flag' ? 'class="flag"' : ''} src="${esc(q.image)}" alt="${q.kind === 'flag' ? 'Флаг' : 'Иллюстрация к вопросу'}" referrerpolicy="no-referrer"></div>`;
  return '';
}
function question(fresh) {
  const q = S.question, R = S.reveal, mine = S.myAnswer;
  const opts = q.options.map((o, i) => {
    let cls = 'opt'; if (mine === i) cls += ' mine';
    if (R) cls += i === R.correct ? ' right' : mine === i ? ' wrong' : '';
    const tot = R ? R.counts.reduce((a, b) => a + b, 0) || 1 : 1;
    return `<button type="button" class="${cls}" data-o="${i}" ${mine !== null || R ? 'disabled' : ''}><span class="k">${LET[i]}</span><span>${esc(o)}</span>${R ? `<span class="cnt">${R.counts[i]}</span><span class="bar" style="width:${Math.round(R.counts[i] / tot * 100)}%"></span>` : ''}</button>`;
  }).join('');
  const answered = S.players.filter(p => p.answered).length;
  app.innerHTML = `<div class="top"><span class="prog">ВОПРОС ${S.qi + 1} ИЗ ${S.total}</span><span class="sp"></span><span class="note">${S.emoji} ${esc(S.catName)}</span><div class="timer" id="tm"><svg width="54" height="54"><circle cx="27" cy="27" r="23" stroke="#26324a" stroke-width="5" fill="none"/><circle id="tmc" cx="27" cy="27" r="23" stroke="#ffb547" stroke-width="5" fill="none" stroke-dasharray="144.5" stroke-linecap="round"/></svg><b id="tmn">20</b></div></div>
    <div class="qcard">${media(q)}<div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div>
      ${R ? `<div class="rev">${mine !== null ? `<div class="gain ${R.gain ? 'ok' : 'no'}">${R.gain ? '+' + R.gain + ' очков' : 'Мимо 😅'}</div>` : '<div class="gain no">Не успел(а) ответить</div>'}
        <div class="fact">✅ ${esc(q.options[R.correct])}. ${esc(R.fact || '')}${R.fastest ? `<br><span class="note">⚡ Быстрее всех — ${esc(R.fastest.name)} (${String(R.fastest.sec).replace('.', ',')} с). Верно ответили: ${R.right} из ${S.players.length}.</span>` : `<br><span class="note">Никто не угадал 🙈</span>`}</div>
        ${R.lesson ? `<a href="${esc(R.lesson.url)}" target="_blank" rel="noopener" class="note">📘 Разобраться в теме: «${esc(R.lesson.title)}» →</a>` : ''}</div>`
      : `<div class="wait">${mine !== null ? 'Ответ принят ✓ ' : ''}Ответили ${answered} из ${S.players.length}</div>`}</div>
    <div style="margin-top:12px">${playersHtml(false)}</div>`;
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = async () => {
    app.querySelectorAll('[data-o]').forEach(x => x.disabled = true); b.classList.add('mine');
    const j = await api(S.code + '/answer', { ...auth(), qi: S.qi, choice: +b.dataset.o }); if (j.ok) { S = Object.assign(j, { got: performance.now() }); lastKey = ''; render(); }
  });
  if (q.kind === 'globe') drawGlobe(q.geo, fresh);
  // ведущий читает вопрос, на ответе — правильный ответ и пояснение
  if (!R) say('q' + S.qi, `Вопрос ${S.qi + 1}. ${q.q}`);
  else say('r' + S.qi, `Правильный ответ — ${q.options[R.correct]}. ${R.fact || ''}`);
}
function clock() {
  cancelAnimationFrame(clockRaf);
  const f = () => {
    const el = $('#tmn'), c = $('#tmc'); if (!el || !S) return;
    const left = S.phase === 'q' ? Math.max(0, S.left - (performance.now() - S.got)) : 0;
    el.textContent = Math.ceil(left / 1000); c.setAttribute('stroke-dashoffset', String(144.5 * (1 - left / 20000)));
    c.setAttribute('stroke', left < 5000 ? '#ff8a73' : '#ffb547');
    if (S.phase === 'q') clockRaf = requestAnimationFrame(f);
  };
  f();
}
function final() {
  const rk = S.players.slice().sort((a, b) => b.score - a.score), myPlace = rk.findIndex(p => p.pid === S.me.pid) + 1;
  const pod = (p, i) => p ? `<div class="pod p${i}">${av(p)}<div class="nm">${esc(p.name)}</div><div class="sc">${p.score}</div><div class="st">${i}</div></div>` : '';
  const brag = myPlace ? `Я занял(а) ${myPlace} место из ${rk.length} в квизе «${S.catName}» ${S.emoji}! Сыграем? 🎯` : shareText();
  const quizUrl = location.origin + '/quiz/';
  app.innerHTML = `<h1 style="text-align:center;margin-top:18px">🏆 ${esc(rk[0] ? rk[0].name : '')}</h1><p class="lead" style="text-align:center;margin:0 auto">Победитель квиза «${esc(S.catName)}»</p>
    <div class="podium">${pod(rk[1], 2)}${pod(rk[0], 1)}${pod(rk[2], 3)}</div>
    <div class="card"><div class="rank">${rk.map((p, i) => `<div class="${p.pid === S.me.pid ? 'me' : ''}"><b>${i + 1}</b>${av(p)}<span class="nm">${esc(p.name)}${p.pid === S.me.pid ? ' (ты)' : ''}</span><em>${p.score}</em></div>`).join('')}</div>
      <div class="lbl">Похвастайся и позови ещё друзей</div>${shareBlock(brag, S.me.host ? roomUrl() : quizUrl)}
      ${S.me.host ? `<button class="btn pri big" id="again" type="button">Сыграть ещё раз в этой комнате</button>` : `<a class="btn pri big" href="#">Создать свою комнату</a>`}
      <div class="cta">${(S.lessons || []).map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">📘 Разобраться: «${esc(l.title)}»</a>`).join('')}
        <a class="btn" href="/" target="_blank" rel="noopener">🦉 Open School AI — опыты, 3D и наставник бесплатно</a></div></div>`;
  const ag = $('#again'); if (ag) ag.onclick = async () => { said.clear(); ag.disabled = true; await api(S.code + '/again', auth()); };
  say('final' + S.v, rk[0] ? `Игра окончена! Победитель — ${rk[0].name}. ${myPlace === 1 ? 'Поздравляю!' : 'Твоё место — ' + myPlace + '.'}` : '');
}

// ---------- глобус: d3-geo, вращается к стране и подсвечивает её ----------
async function drawGlobe(num, fresh) {
  const box = $('#globe'); if (!box) return;
  if (!globeLib) globeLib = (async () => {
    const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    await load('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js'); await load('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
    const w = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
    return topojson.feature(w, w.objects.countries).features;
  })();
  const feats = await globeLib; if (!document.body.contains(box)) return;
  const target = feats.find(f => String(f.id).padStart(3, '0') === num);
  const W = box.clientWidth || 640, H = box.clientHeight || 320, R = Math.min(W, H) * .46;
  const proj = d3.geoOrthographic().scale(R).translate([W / 2, H / 2]).clipAngle(90), path = d3.geoPath(proj);
  box.innerHTML = ''; const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`);
  svg.append('circle').attr('cx', W / 2).attr('cy', H / 2).attr('r', R).attr('fill', '#16314f');
  const g = svg.append('g');
  const lands = g.selectAll('path').data(feats).enter().append('path').attr('fill', d => d === target ? '#ff8a73' : '#3b5b46').attr('stroke', '#0b1019').attr('stroke-width', .5);
  const c = target ? d3.geoCentroid(target) : [68, 48], end = [-c[0], -c[1] * .8], start = fresh ? [end[0] + 120, 0] : end;
  const t0 = performance.now(), D = fresh && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 1800 : 0;
  (function step(now) { const k = D ? Math.min(1, (now - t0) / D) : 1, e = 1 - Math.pow(1 - k, 3); proj.rotate([start[0] + (end[0] - start[0]) * e, start[1] + (end[1] - start[1]) * e]); lands.attr('d', path); if (k < 1 && document.body.contains(box)) requestAnimationFrame(step); })(t0);
}

// ---------- голосовой чат: WebRTC «каждый с каждым», сигналы через сервер ----------
// Слышат все игроки комнаты сразу после входа; говорят те, кто включил микрофон.
// У каждой пары одна аудиодорожка в обе стороны: микрофон включили — подставляем звук без пересогласования.
const voice = (() => {
  let stream = null, on = false, ICE = null, blocked = false; const peers = new Map(); // pid → { pc, el, tr }
  const num = pid => parseInt(String(pid).slice(1), 10) || 0;
  const signal = (to, data) => api(S.code + '/signal', { ...auth(), to, data });
  const iceCfg = async () => ICE || (ICE = await api('ice').then(j => ({ iceServers: j.iceServers })).catch(() => ({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })));
  const micTrack = () => (stream && stream.getAudioTracks()[0]) || null;
  async function peer(pid, initiator) {
    if (peers.has(pid)) return peers.get(pid);
    const pc = new RTCPeerConnection(await iceCfg()), el = document.createElement('audio'); el.autoplay = true; el.setAttribute('playsinline', ''); el.dataset.peer = pid; el.volume = vols.peers / 100; el.hidden = true; document.body.appendChild(el);
    const p = { pc, el, tr: null }; peers.set(pid, p);
    if (initiator) { p.tr = pc.addTransceiver('audio', { direction: 'sendrecv' }); if (micTrack()) p.tr.sender.replaceTrack(micTrack()); }
    pc.ontrack = e => { el.srcObject = e.streams[0] || new MediaStream([e.track]); el.play().then(() => { blocked = false; }).catch(() => { blocked = true; if (S) paint(S); }); };
    pc.onicecandidate = e => { if (e.candidate) signal(pid, { ice: e.candidate }); };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { close(pid); } if (S) paint(S); };
    return p;
  }
  function close(pid) { const p = peers.get(pid); if (!p) return; try { p.pc.close(); } catch (e) {} p.el.srcObject = null; p.el.remove(); peers.delete(pid); }
  async function sync(st) {
    paint(st);
    for (const s of st.signals || []) {
      const d = s.data;
      try {
        if (d.sdp && d.sdp.type === 'offer') {
          close(s.from); const p = await peer(s.from, false);
          await p.pc.setRemoteDescription(d.sdp);
          p.tr = p.pc.getTransceivers()[0]; if (p.tr) { p.tr.direction = 'sendrecv'; if (micTrack()) await p.tr.sender.replaceTrack(micTrack()); }
          const a = await p.pc.createAnswer(); await p.pc.setLocalDescription(a); signal(s.from, { sdp: p.pc.localDescription });
        } else if (d.sdp) { const p = peers.get(s.from); if (p) await p.pc.setRemoteDescription(d.sdp); }
        else if (d.ice) { const p = peers.get(s.from); if (p) await p.pc.addIceCandidate(d.ice); }
      } catch (e) {}
    }
    // соединяемся со всеми, кто в комнате онлайн; начинает тот, у кого номер меньше
    const others = st.players.filter(x => x.pid !== st.me.pid && x.online).map(x => x.pid);
    for (const pid of [...peers.keys()]) if (!others.includes(pid)) close(pid);
    for (const pid of others) if (!peers.has(pid) && num(st.me.pid) < num(pid)) {
      const p = await peer(pid, true); try { const o = await p.pc.createOffer(); await p.pc.setLocalDescription(o); signal(pid, { sdp: p.pc.localDescription }); } catch (e) {}
    }
  }
  function paint(st) {
    const talk = st.players.filter(x => x.voice), btn = $('#vbtn');
    const live = [...peers.values()].filter(p => p.pc.connectionState === 'connected').length;
    $('#vwho').textContent = blocked ? '🔈 Нажмите, чтобы слышать голоса' : talk.length ? `🎙 Говорят: ${talk.map(x => x.name).join(', ')}` : live ? '🔈 Голосовой чат: включите микрофон, чтобы вас слышали' : 'Голосовой чат комнаты';
    btn.textContent = on ? '🎤 Микрофон включён' : '🎤 Включить микрофон'; btn.classList.toggle('on', on);
  }
  // браузер не дал проиграть звук без нажатия — первое же нажатие включает все голоса
  document.addEventListener('click', () => { if (!blocked) return; blocked = false; peers.forEach(p => p.el.play().catch(() => { blocked = true; })); if (S) paint(S); });
  $('#vwho').onclick = () => {};
  $('#vbtn').onclick = async () => {
    if (on) return mic(false);
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { alert('Нет доступа к микрофону — разреши его в настройках браузера (значок слева от адреса сайта).'); return; }
    mic(true);
  };
  function mic(v) {
    on = v; if (!v && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    peers.forEach(p => { if (p.tr) p.tr.sender.replaceTrack(v ? micTrack() : null).catch(() => {}); });
    if (S && cur.s) api(S.code + '/voice', { ...auth(), on: v }); if (S) paint(S);
  }
  function off() { mic(false); for (const pid of [...peers.keys()]) close(pid); }
  return { sync, off };
})();

// ---------- маршрут ----------
function route() { stop(); const code = (location.hash.slice(1).match(/^[A-Z0-9]{6}$/i) || [])[0]; if (code) room(code.toUpperCase()); else { voice.off(); $('#vbar').hidden = true; landing(); } }
addEventListener('hashchange', route);
route();
})();
</script>
