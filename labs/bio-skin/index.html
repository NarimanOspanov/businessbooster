<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 8–9 класс: строение кожи, терморегуляция, защита от солнца и первая помощь при ожогах и обморожениях, электронная кожа и носимые датчики.">
<title>Кожа и терморегуляция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Кожа</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>

    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-skin';
const G = 9.8;
const wrap = (s, n) => { const out = []; let cur = ''; for (const w of s.split(' ')) { if (cur && (cur + ' ' + w).length > n) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; } if (cur) out.push(cur); return out; };
const mix = (a, b, k) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b); k = clamp(k, 0, 1); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const sgn = x => (x < 0 ? '−' : '+') + Math.abs(Math.round(x));

// ---------- lesson 1: parts of the skin (cross-section x 196…416, labels on the right) ----------
const PARTS = [

  { id: 'derm', name: 'Дерма (собственно кожа)', short: 'Дерма', c: '#d98f86', ax: 404, ay: 222, ly: 242, hint: 'толстый средний слой, в котором лежат железы и корни волос',

  { id: 'fat', name: 'Подкожная жировая клетчатка', short: 'Подкожный жир', c: '#e8c86a', ax: 404, ay: 344, ly: 344, hint: 'нижний слой из жёлтых долек',

  { id: 'hair', name: 'Волос и волосяная луковица', short: 'Волос', c: '#6b4a2f', ax: 268, ay: 236, ly: 222, hint: 'тёмный стержень, уходящий глубоко в кожу',

  { id: 'seb', name: 'Сальная железа', short: 'Сальная железа', c: '#f5c070', ax: 290, ay: 200, ly: 201, hint: 'гроздь пузырьков рядом с волосом',

const TH = { C: 245000, base: 100, run: 450, SPD: 4 };
const PRESET = [['cold', 'Мороз −10°', -10], ['cool', 'Прохладно +10°', 10], ['comf', 'Комфорт +22°', 22], ['hot', 'Жара +38°', 38]];

  { k: 'c-vessel', env: 'cold', hit: 'vessel', t: 'сосуды кожи сужены' },
  { k: 'c-shiver', env: 'cold', hit: 'shiver', t: 'мышечная дрожь' },
  { k: 'c-goose', env: 'cold', hit: 'goose', t: '«мурашки» — волосы поднялись' },
  { k: 'h-vessel', env: 'hot', hit: 'vessel', t: 'сосуды кожи расширены' },
  { k: 'h-sweat', env: 'hot', hit: 'sweat', t: 'потоотделение' },
];
function thermoResp(T) {
  const e = T - 36.6, c = clamp((22 - S.Ta) / 30, 0, 1), hs = clamp((S.Ta - 28) / 10, 0, 1);
  const v = clamp(0.5 + 0.8 * e + 0.5 * hs - 0.5 * c, 0.1, 1);
  const s = clamp(3 * (e - 0.15) + 0.9 * hs - 0.1, 0, 1);
  const sh = clamp((c - 0.6) * 1.2 - 4 * e, 0, 1);
  const goose = S.Ta < 12 || e < -0.2;
  const P = (S.run ? TH.run : TH.base) + 250 * sh;
  const Gs = (2 + 8 * v) / (1 + 1.5 * S.clo), eff = 1 - 0.8 * S.hum;
  const Ldry = (T - S.Ta) * Gs, Le = 10 + 600 * s * eff;
  return { e, v, s, sh, goose, P, Gs, eff, Ldry, Le, L: Ldry + Le, sweat: s * 600 / 2430 * 3600 };
}
function thermoStep(dtMin) {
  const n = Math.max(1, Math.ceil(dtMin * 60 / 5)), h = dtMin * 60 / n;
  for (let i = 0; i < n; i++) {
    const r = thermoResp(S.T);
    S.T = clamp(S.T + (r.P - r.L) * h / TH.C, 33, 41.5);
    S.water += r.sweat * h / 3600;
  }
  S.tmin += dtMin;
  if (S.T > S.maxT) S.maxT = S.T;
}

// content of every scene spans x 10…512, y 94…405
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  let s = Math.min(w / 504, hh / 410, 1.7), vx = null;
  // the shared task card (it grows with «Формулы урока» and «Как выполнить») must not cover the bench:
  // place the scene to the right of the card or below it, whichever leaves it larger
  const tk = document.querySelector('#stage .task');
  if (tk && tk.offsetParent) {
    const tb = tk.getBoundingClientRect(), right = tb.right - rc.left + 8, bot = tb.bottom - rc.top + 8;
    if (right > w / 2 - 251 * s && bot > hh - 311 * s) {
      const sSide = Math.min(s, (w - right - 8) / 504), sDown = Math.min(s, (hh - bot) / 311);
      if (sSide >= sDown) { s = Math.max(0.3, sSide); vx = 10 - (right + (w - 8 - right - 504 * s) / 2) / s; }
      else s = Math.max(0.3, sDown);
    }
  }
  const vw = w / s, vh = hh / s;
  if (vx === null) vx = 261 - vw / 2;
  scene.setAttribute('viewBox', `${vx.toFixed(1)} ${(405 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

const forceAt = p => { if (!S.eskin) return; S.F = clamp(Math.round((p.x - 26) / 148 * 15 * 2) / 2, 0, 15); S.last = null; update(); };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag],[data-hit]'); if (!el) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toSvg(e);
  if (el.dataset.drag) {
    const k = el.dataset.drag;
    if (k === 'force' && !S.eskin) { toast(`Без электронной кожи робот не знает, как сильно сжимать: всегда ${BLIND} Н.`); return; }
    if (k === 'force' && S.lift) return;
    drag = { key: k, x: e.clientX, y: e.clientY, moved: false };
    if (k === 'time' || k === 'sun') timeAt(p);

}

function tap(id) {

let lastT = 0, tickT = 0;

  let anim = false;

    if (!was && S.maxT >= 38 && !S.hotToast) { S.hotToast = true; toast('Перегрев выше 38 °C! В жизни: прекратить нагрузку, в тень, пить воду, охлаждать кожу; при спутанном сознании — вызвать скорую помощь.'); update(); }

    set('#inHO', S.height + ' см'); set('#inMO', S.mass + ' кг');
    set('#r1', ru(area(), 2) + ' м²'); set('#r2', `≈ ${ru(area() * 1.5, 1)} млн`); set('#r3', `${m.right} / ${NP}`);
    press('#brChips button', b => b.dataset.k === S.brush);
  } else if (m.kind === 'th') {
    set('#inTaO', sgn(S.Ta) + ' °C'); val('#inTa', S.Ta); set('#inHumO', Math.round(S.hum * 100) + ' %'); val('#inHum', Math.round(S.hum * 100));
    set('#r1', ru(S.T) + ' °C'); set('#r2', Math.round(m.r.sweat) + ' мл/ч'); set('#r3', Math.round(S.water) + ' мл');
    press('#thChips button', b => b.dataset.a === 'run' ? S.run : !!S.clo);
  } else if (m.kind === 'pr') {
    if (S.view === 'sun') {
      set('#inUvO', String(S.uvi)); val('#inUv', S.uvi); set('#inTimeO', S.time + ' мин'); val('#inTime', S.time);
      set('#r1', ru(m.d, 2) + ' МЭД'); const tb = SKIN[S.stype].base / S.uvi * spfEff() * (S.shade ? 2 : 1); set('#r2', tb > 600 ? '> 10 ч' : Math.round(tb) + ' мин'); set('#r3', '× ' + ru(spfEff() * (S.shade ? 2 : 1), 0));
      press('#skChips button', b => +b.dataset.k === S.stype); press('#spfChips button', b => +b.dataset.k === S.spf);
      press('#moreChips button', b => b.dataset.a === 'thick' ? S.thick : S.shade);
    } else {
      press('#caseChips button', b => +b.dataset.k === S.inj); press('#aidChips button', b => S.inj >= 0 && S.ia[S.inj] === +b.dataset.k);
      set('#aidNote', S.inj >= 0 ? `${CASES[S.inj].name}: ${CASES[S.inj].sign}` : '');
    }
  } else {
    set('#inFO', ru(Fnow()) + ' Н'); val('#inF', S.F);
    set('#r1', Math.round(OBJ[S.obj].m * 1000) + ' г'); set('#r2', Math.round(m.p) + ' кПа'); set('#r3', `${m.gotN} / 3`);
    press('#objChips button', b => b.dataset.k === S.obj);
  }
}

function renderPanes(m) {

  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }

    let h = `<h2>${{ structure: 'Части кожи', thermo: 'Что на столе', protect: 'Что на столе', tech: 'Что на столе' }[L.id]}</h2><p class="note">Нажмите на строку, чтобы найти это на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    if (L.id === 'structure') h += `<h3>Функции кожи</h3><div class="feat"><div style="border-left-color:#e9c6a8"><b>Защитная</b>От ударов, микробов, ультрафиолета и потери воды.</div><div style="border-left-color:#ff5a5a"><b>Терморегуляция</b>Сосуды и потовые железы управляют отдачей тепла.</div><div style="border-left-color:#72d4e8"><b>Выделительная</b>С потом выходят вода, соли и немного мочевины.</div><div style="border-left-color:#c9a8ef"><b>Чувствительная</b>Рецепторы прикосновения, давления, боли, тепла и холода.</div><div style="border-left-color:#ffd34d"><b>Обмен веществ</b>Под ультрафиолетом в коже образуется витамин D.</div></div>`;
    if (L.id === 'thermo') h += `<h3>Как тело отдаёт тепло</h3><div class="feat"><div style="border-left-color:#ff8a73"><b>Излучение и конвекция</b>Тёплая кожа греет воздух. Работает, только если воздух холоднее кожи.</div><div style="border-left-color:#72d4e8"><b>Испарение пота</b>Единственный способ остыть, когда воздух теплее тела. Во влажном воздухе работает плохо.</div><div style="border-left-color:#86e0a8"><b>Поведение</b>Тень, лёгкая или тёплая одежда, вода, отдых — то, что человек делает сам.</div></div>`;
    if (L.id === 'protect') h += `<h3>Признаки, при которых нужен врач</h3><div class="feat"><div style="border-left-color:#ff8a73"><b>Ожог</b>Больше ладони пострадавшего, на лице, шее, кистях или в паху, тёмная или белая нечувствительная кожа, ожог током или химикатами.</div><div style="border-left-color:#72b8ff"><b>Обморожение</b>Кожа после согревания остаётся бледной или синеватой, появились пузыри, чувствительность не вернулась.</div><div style="border-left-color:#ffb547"><b>Рана</b>Глубокая, грязная, от укуса животного, края расходятся, кровь не останавливается.</div><div style="border-left-color:#c9a8ef"><b>Родинка</b>Правило ABCDE: несимметричная, неровный край, разный цвет, диаметр больше 6 мм, меняется со временем.</div></div>`;
    if (L.id === 'tech') h += `<h3>Что носимые датчики читают через кожу</h3><div class="feat"><div style="border-left-color:#ff5a5a"><b>Пульс</b>Зелёный свет просвечивает капилляры: при каждом ударе сердца крови больше и света отражается меньше.</div><div style="border-left-color:#ffb547"><b>Температура кожи</b>Меняется во сне, при болезни и при нагрузке.</div><div style="border-left-color:#72d4e8"><b>Проводимость кожи</b>Растёт, когда открываются потовые железы: при волнении и жаре.</div><div style="border-left-color:#86e0a8"><b>Состав пота</b>Пластыри с химическими датчиками меряют соль и молочную кислоту — сколько воды и соли вернуть спортсмену.</div></div>`;

function calcHTML(m) {
  const id = LID();
  if (id === 'structure') {
    const A = area();
    return `<h2>Сколько у вас кожи</h2><div class="formula">S = √(рост × масса ÷ 3600)</div><div class="steps">` +
      step('Рост и масса', `${S.height} см, ${S.mass} кг`) + step('Произведение ÷ 3600', `${S.height} × ${S.mass} ÷ 3600 = ${ru(S.height * S.mass / 3600, 2)}`) +
      step('Площадь кожи', `√${ru(S.height * S.mass / 3600, 2)} ≈ ${ru(A, 2)} м²`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Это формула Мостеллера — так врачи оценивают площадь тела, например, чтобы рассчитать дозу лекарства. Рост и массу меняйте на вкладке «Схема».</p>` +
      `<h3>Что на этой площади</h3><div class="steps">` + step('Потовые железы (≈ 150 на 1 см²)', `${ru(A, 2)} м² × 1 500 000 ≈ ${ru(A * 1.5, 1)} млн`) + step('Пота в жару при нагрузке', 'до 1–1,5 л в час') + step('Эпидермис обновляется', 'примерно за 4 недели') + step('Толщина эпидермиса', '0,05–1,5 мм (больше всего на ладонях и пятках)', 'sum') + `</div>` +
      `<h3>Подписи</h3><div class="steps">` + PARTS.map(p => step(p.short, S.lab[p.id] ? '✓' : '—')).join('') + step('Ошибок', String(S.err), 'sum') + `</div>`;
  }
  if (id === 'thermo') {
    const r = m.r, net = r.P - r.L;
    return `<h2>Тепловой баланс</h2><div class="formula">ΔT = (выработка − отдача) × время ÷ теплоёмкость</div><div class="steps">` +
      step('Выработка тепла', `${S.run ? 'бег 450' : 'покой 100'}${r.sh > 0.01 ? ` + дрожь ${Math.round(250 * r.sh)}` : ''} = ${Math.round(r.P)} Вт`) +
      step('Отдача от кожи', `(${ru(S.T)} − (${S.Ta})) × ${ru(r.Gs, 1)} = ${Math.round(r.Ldry)} Вт`) +
      step('Испарение пота и дыхание', `${Math.round(r.Le)} Вт (влажность ${Math.round(S.hum * 100)} %: испаряется ${Math.round(r.eff * 100)} %)`) +
      step('Баланс', `${net >= 0 ? '+' : '−'}${Math.abs(Math.round(net))} Вт → ${net > 5 ? 'тело нагревается' : net < -5 ? 'тело остывает' : 'температура держится'}`, 'sum') + `</div>` +
      `<h3>Скорость нагрева</h3><div class="steps">` + step('Теплоёмкость тела 70 кг', '70 × 3,5 = 245 кДж/°C') + step('За 1 минуту', `${Math.round(net)} × 60 ÷ 245 000 ≈ ${ru(net * 60 / 245000, 3)} °C`, 'sum') + `</div>` +
      `<h3>Вода</h3><div class="steps">` + step('Пот сейчас', `${Math.round(r.sweat)} мл/ч`) + step('Потеряно за модельное время', `${Math.round(S.water)} мл за ${Math.round(S.tmin)} мин`) + step('Опасно для выносливости', '2 % массы тела: у 70 кг — 1,4 л', 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Модель упрощена: числа реакций подобраны, чтобы показать идею. Время в модели идёт в 4 раза быстрее (1 с = 4 мин).</p>`;
  }
  if (id === 'protect') {
    const base = SKIN[S.stype].base, d = m.d, k = spfEff() * (S.shade ? 2 : 1);
    return `<h2>Доза ультрафиолета</h2><div class="formula">доза = время × УФ-индекс ÷ (T₁ × защита)</div><div class="steps">` +
      step('T₁ — до ожога при УФ 1', `${base} мин (тип ${SKIN[S.stype].n})`) + step('Без защиты при УФ ' + S.uvi, `${base} ÷ ${S.uvi} ≈ ${Math.round(base / S.uvi)} мин`) +
      step('Крем', S.spf ? `SPF ${S.spf}${S.thick ? '' : ' ÷ 3 (тонкий слой)'} = × ${ru(spfEff(), 0)}` : 'нет: × 1') + step('Тень и шляпа', S.shade ? '× 2' : 'нет: × 1') +
      step(`Доза за ${S.time} мин`, `${S.time} × ${S.uvi} ÷ (${base} × ${ru(k, 0)}) = ${ru(d, 2)} МЭД`, 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Обычно крема наносят в 3–4 раза меньше нужного (2 мг/см² — это около 1/2 чайной ложки на лицо и шею), поэтому настоящая защита меньше числа на тюбике. Тень и шляпа тоже не спасают полностью: ультрафиолет отражается от песка, воды и снега.</p>` +
      `<h3>Первая помощь</h3><div class="steps">` + CASES.map((c, i) => step(`${i + 1}. ${c.name}`, S.ia[i] < 0 ? '—' : `${LET[AID_ORDER.indexOf(S.ia[i])]}${S.ia.every(v => v >= 0) ? (S.ia[i] === c.ans ? ' ✓' : ' ✗') : ''}`)).join('') + step('Верно', `${m.injRight} из ${CASES.length}`, 'sum') + `</div>`;
  }
  const o = OBJ[S.obj], nf = needF(S.obj);
  return `<h2>Сколько сжимать</h2><div class="formula">2 × μ × F ≥ m × g</div><div class="steps">` +
    step('Вес предмета', `${ru(o.m, 2)} × 9,8 = ${ru(o.m * G, 2)} Н`) + step('Трение μ', `${ru(o.mu, 2)} (${o.mu >= 0.5 ? 'шершавый' : 'гладкий'})`) +
    step('Нужно не меньше', `${ru(o.m * G, 2)} ÷ (2 × ${ru(o.mu, 2)}) = ${ru(nf, 2)} Н`) + step('Сейчас', `${ru(Fnow())} Н`, 'sum') + `</div>` +
    `<h3>Давление на подушечку</h3><div class="steps">` + step('Площадь контакта', `${PAD} см² = 0,0002 м²`) + step('p = F ÷ S', `${ru(Fnow())} ÷ 0,0002 = ${Math.round(m.p)} кПа`, 'sum') + `</div>` +
    `<p class="note" style="margin-top:8px">Предел прочности предмета в модели вы не знаете заранее — как и робот. Его находят опытом: электронная кожа подсказывает, когда предмет выскальзывает, а сжимать нужно с небольшим запасом.</p>` +
    `<h3>Предметы</h3><div class="steps">` + OK3.map(k => step(OBJ[k].short, S.got[k] ? 'поднят ✓' : '—')).join('') + `</div>`;
}

function renderMeter(m) {
  const el = $('#meter');
  if (m.kind === 'st') el.innerHTML = `<div class="k">Подписано</div><div class="v ${m.right === NP ? 'ok' : ''}">${m.right} / ${NP}</div><div class="gauge"><b style="width:${(m.right / NP * 100).toFixed(1)}%"></b></div><div class="lr"><span>ошибок</span><span>${S.err}</span></div>`;
  else if (m.kind === 'th') el.innerHTML = `<div class="k">Температура тела</div><div class="v ${S.T >= 38 || S.T < 35.5 ? 'bad' : 'ok'}">${ru(S.T)} °C</div><div class="lr"><span>воздух</span><span>${sgn(S.Ta)} °C</span></div><div class="lr"><span>пот</span><span>${Math.round(m.r.sweat)} мл/ч</span></div><div class="lr"><span>время</span><span>${Math.round(S.tmin)} мин</span></div>`;
  else if (m.kind === 'pr') el.innerHTML = S.view === 'sun' ? `<div class="k">Доза УФ</div><div class="v ${m.d < 1 ? 'ok' : 'bad'}">${ru(m.d, 2)} МЭД</div><div class="gauge"><b style="width:${Math.min(100, m.d / 3 * 100).toFixed(1)}%;background:${m.d < 1 ? 'var(--ok)' : 'var(--warn)'}"></b></div><div class="lr"><span>УФ-индекс</span><span>${S.uvi}</span></div><div class="lr"><span>время</span><span>${S.time} мин</span></div>`
    : `<div class="k">Первая помощь</div><div class="v ${m.injRight === CASES.length ? 'ok' : ''}">${m.injPlaced} / ${CASES.length}</div><div class="gauge"><b style="width:${(m.injPlaced / CASES.length * 100).toFixed(1)}%"></b></div><div class="lr"><span>случай</span><span>${S.inj + 1}</span></div>`;
  else el.innerHTML = `<div class="k">Сила сжатия</div><div class="v">${ru(m.F)} Н</div><div class="gauge"><b style="width:${(m.F / 15 * 100).toFixed(1)}%"></b></div><div class="lr"><span>давление</span><span>${Math.round(m.p)} кПа</span></div><div class="lr"><span>поднято</span><span>${m.gotN} / 3</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы знаете, как устроена кожа и как её беречь!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  thermo: '<circle cx="18" cy="9" r="5" fill="#d8a483"/><path d="M18 14V24M12 18h12" stroke="#46a07a" stroke-width="4" stroke-linecap="round"/><rect x="40" y="4" width="5" height="18" rx="2.5" fill="#121a28" stroke="#56627d"/><rect x="41" y="11" width="3" height="11" fill="#86e0a8"/><circle cx="42.5" cy="24" r="4" fill="#86e0a8"/><circle cx="56" cy="10" r="4" fill="#ffd34d"/>',
  protect: '<circle cx="14" cy="10" r="6" fill="#ffd34d"/><path d="M20 14L34 22M14 17L22 24" stroke="#c9a8ef" stroke-dasharray="2 2"/><rect x="6" y="23" width="40" height="4" fill="#e4b896"/><path d="M54 8v14M47 15h14" stroke="#ff8a73" stroke-width="3"/>',
  tech: '<path d="M30 2V9" stroke="#8b96ad" stroke-width="4"/><rect x="18" y="8" width="24" height="5" rx="2" fill="#8b96ad"/><path d="M20 13L16 20V26M40 13L44 20V26" stroke="#56627d" stroke-width="3" fill="none"/><rect x="15" y="20" width="3" height="7" fill="#c9a8ef"/><rect x="42" y="20" width="3" height="7" fill="#c9a8ef"/><path d="M22 27Q30 16 38 27Z" fill="#e8454f"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'structure') {
    now = `Разрез кожи: эпидермис, дерма, подкожная жировая клетчатка; в дерме волос с луковицей, сальная железа, мышца волоса, потовая железа с протоком и порой, капилляры, артерия и вена, нервы с рецепторами. ` +
      `Подписано верно: ${PARTS.filter(p => S.lab[p.id]).map(p => p.short.toLowerCase()).join(', ') || 'пока ничего'}. Не подписано: ${PARTS.filter(p => !S.lab[p.id]).map(p => p.short.toLowerCase()).join(', ') || 'ничего'}. ` +
      `Выбранная подпись: ${S.brush ? PARTS[PI(S.brush)].short.toLowerCase() : 'нет'}. Ошибок: ${S.err}.`;
    guide = 'Не показывай, где какая часть: спроси, в каком слое она должна лежать и как выглядит (клубочек, гроздь, ленточка). Объясняй, зачем часть нужна коже.';
  }
  if (id === 'thermo') {
    const r = m.r;
    now = `Человек ${S.run ? 'бежит' : 'стоит'}${S.clo ? ' в куртке' : ' в футболке'}, воздух ${sgn(S.Ta)} °C, влажность ${Math.round(S.hum * 100)} %. Температура тела ${ru(S.T)} °C (максимум за опыт ${ru(S.maxT)} °C). ` +
      `Сосуды кожи ${vesselWord(r.v)}, пот ${Math.round(r.sweat)} мл/ч, дрожь ${r.sh > 0.08 ? 'есть' : 'нет'}, «мурашки» ${r.goose ? 'есть' : 'нет'}. Выработка тепла ${Math.round(r.P)} Вт, отдача ${Math.round(r.L)} Вт. ` +
      `Отмечено реакций: ${OBS.filter(o => S.obs[o.k]).map(o => (o.env === 'cold' ? 'холод — ' : 'жара — ') + o.t).join('; ') || 'пока нет'}. Перегрев выше 38 °C ${m.hot ? 'получен' : 'ещё не получен'}.`;
    guide = 'Не перечисляй реакции заранее: спроси, что делает тело, чтобы сохранить тепло или избавиться от него. Для перегрева спроси, почему во влажной жаре пот плохо охлаждает. Говори о безопасности в жару спокойно.';
  }
  if (id === 'protect') {
    now = S.view === 'sun'
      ? `Солнце: УФ-индекс ${S.uvi} (${uvCat(S.uvi)[0]}), ${S.time} мин на солнце, тип кожи ${SKIN[S.stype].n}, ${S.spf ? `крем SPF ${S.spf}, ${S.thick ? 'толстый слой' : 'тонкий слой'}` : 'без крема'}, тень и шляпа — ${S.shade ? 'да' : 'нет'}. Доза ${ru(m.d, 2)} МЭД (порог ожога 1 МЭД). Часть «солнце» ${m.uvOk ? 'выполнена' : 'не выполнена'}.`
      : `Первая помощь: случаи ${CASES.map((c, i) => `${i + 1}) ${c.name}: ${c.sign} Выбрано: ${S.ia[i] < 0 ? 'ничего' : AID[S.ia[i]].t}`).join('; ')}. Верно ${m.injRight} из ${CASES.length}.`;
    guide = 'Не называй правильные ответы: спроси, что важнее всего сделать сразу (охладить, согреть, вызвать скорую помощь) и почему масло, снег и вскрытие пузырей вредят. Говори спокойно и фактами, без запугивания.';
  }
  if (id === 'tech') {
    now = `Робот-рука, предмет: ${OBJ[S.obj].name} (${Math.round(OBJ[S.obj].m * 1000)} г). Электронная кожа ${S.eskin ? 'включена' : 'выключена (робот всегда сжимает 12 Н)'}. Сила сжатия ${ru(Fnow())} Н, давление ${Math.round(m.p)} кПа. ` +
      `Последняя попытка: ${S.last ? (S.last.out === 'ok' ? 'поднял' : S.last.out === 'slip' ? 'выскользнул' : 'сломал') + ` при ${ru(S.last.F)} Н` : 'не было'}. Поднято бережно: ${OK3.filter(k => S.got[k]).map(k => OBJ[k].short.toLowerCase()).join(', ') || 'ничего'}.`;
    guide = 'Не называй нужную силу: подскажи, что тяжёлое и гладкое нужно сжимать сильнее, и попроси оценить по формуле на вкладке «Расчёты». Свяжи с тем, как наши пальцы чувствуют проскальзывание.';
  }
  return [
    `Раздел: биология, 8–9 класс, тема «Кожа и терморегуляция» (Человек). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { structure: 'Почему стричь волосы не больно, а выдёргивать больно?', thermo: 'Почему во влажную жару тяжелее, чем в сухую?', protect: 'Почему ожог нельзя мазать маслом?', tech: 'Как умные часы измеряют пульс через кожу?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
