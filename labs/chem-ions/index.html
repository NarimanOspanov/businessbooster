<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии: электролитическая диссоциация и прибор для проверки электропроводности, сильные и слабые электролиты, ионные уравнения реакций обмена, гидролиз солей и pH.">
<link rel="icon" href="data:,">
<title>Электролиты и ионы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /labs/chem-electro. Lab bench (SVG) on the left, lesson notebook on the right, lesson strip under the bench. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.grid{width:100%;border-collapse:separate;border-spacing:3px;margin-top:10px;font:500 12px/1.2 var(--font-mono)}
.grid th{font-weight:500;color:var(--muted);padding:4px 2px;text-align:center}
.grid td{background:var(--surface-2);border-radius:6px;text-align:center;padding:7px 3px;color:var(--muted)}
.grid td.y{color:var(--ok)}
.grid td.n{color:var(--warn)}
.grid td.l{text-align:left;color:var(--fg)}
.grid td.cur{outline:2px solid var(--force)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.solt{width:100%;border-collapse:separate;border-spacing:2px;margin-top:8px;font:500 11.5px/1 var(--font-mono)}
.solt th{font-weight:500;color:var(--muted);padding:5px 1px;text-align:center;white-space:nowrap}
.solt td{text-align:center;padding:6px 1px;border-radius:5px;background:var(--surface-2);color:var(--fg)}
.solt td.R{background:rgba(134,224,168,.16);color:var(--ok)}
.solt td.M{background:rgba(255,181,71,.16);color:var(--force)}
.solt td.N{background:rgba(255,138,115,.2);color:var(--warn)}
.solt td.X{color:var(--muted)}
.solt td.cur{outline:2px solid var(--arm)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span b{font:600 11.5px var(--font-mono);padding:2px 5px;border-radius:4px;margin-right:4px}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Электролиты и ионы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол: прибор для проверки электропроводности с лампочкой, бутылки с растворами, пробирки, доска с ионными уравнениями, банки с солями и индикатор. Предметы можно перетаскивать и нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const SUPD = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sci = x => { if (x >= 0.01) return fmt(x, x >= 1 ? 2 : 3); const e = Math.floor(Math.log10(x)), m = x / 10 ** e; return fmt(m, 1) + '·10' + String(e).split('').map(c => SUPD[c] || c).join(''); };
const pct = a => a >= 0.995 ? '≈ 100 %' : a >= 0.1 ? fmt(a * 100, 0) + ' %' : fmt(a * 100, a >= 0.01 ? 1 : 2) + ' %';
const aEq = a => a >= 0.995 ? 'α ≈ 100 %' : 'α = ' + pct(a);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-ions';

// ---------- chemistry data ----------
// Universal indicator, pH 0…14: red → orange → yellow → green → blue → violet (as in /chemistry)
const PAL = ['#c9151e', '#e0262a', '#ec4527', '#f37526', '#f8a11f', '#fbc81b', '#e9e21f', '#7cc443', '#33a84f', '#1b9c8c', '#2179bb', '#2f55a3', '#4a3c97', '#5e2c89', '#4a1d6e'];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
function uiColor(pH) { const x = clamp(pH, 0, 14), i = Math.min(13, Math.floor(x)); return mix(PAL[i], PAL[i + 1], x - i); }
const lum = c => { const [r, g, b] = hex(c); return 0.299 * r + 0.587 * g + 0.114 * b; };
const envOf = pH => pH < 6.5 ? 'кислая' : pH > 7.5 ? 'щелочная' : 'нейтральная';

// Molar conductivities of ion pairs, См·см²/моль (H⁺ 350, OH⁻ 198, Na⁺ 50, Cl⁻ 76, CH₃COO⁻ 41, NH₄⁺ 73) — only to compare lamps
const C0 = 0.1;
// lesson 1: six samples

    if (d) d.innerHTML = alphaSVG(m);
    set('#r1', m.s ? pct(m.alpha) : '—'); set('#r2', m.s ? (m.I >= 10 ? fmt(m.I, 0) : fmt(m.I, 1)) + ' мА' : '—'); set('#r3', m.s ? fmt(m.b * 100, 0) + ' %' : '—');
    if (g) g.innerHTML = `<table class="grid"><tr><th>раствор</th><th>α</th><th>лампа</th><th>поднос</th></tr>` + S2.map((s, i) => { const t = S.tested[i], b = brightOf(condOf(s, S.c)), z = S.sorted[s.id]; return `<tr><td class="l${S.at === i ? ' cur' : ''}">${s.f}</td><td>${t ? pct(alphaOf(s, S.c)) : '·'}</td><td class="${t ? (b > 0.5 ? 'y' : '') : ''}">${t ? (b > 0.5 ? 'ярко' : b > 0.01 ? 'тускло' : 'нет') : '·'}</td><td class="${z ? 'y' : ''}">${z ? (z === 'strong' ? 'сильные' : 'слабые') : '·'}</td></tr>`; }).join('') + `</table>`;
    press('c', String(S.c)); press('pour', S.at === null ? '' : String(S.at));
  } else if (m.kind === 'rx') {
    press('rx', S.rx);
  } else {
    if (g) g.innerHTML = `<table class="grid"><tr><th>соль</th><th>основание</th><th>кислота</th><th>pH</th></tr>` + SALTS.map(s => { const hy = hydro(s), used = S.tubes.includes(s.id); return `<tr><td class="l${used ? ' cur' : ''}">${s.f}</td><td class="${s.bs ? 'y' : 'n'}">${s.bs ? 'сильное' : 'слабое'}</td><td class="${s.as ? 'y' : 'n'}">${s.as ? 'сильная' : 'слабая'}</td><td>${used ? fmt(hy.pH, 1) : '?'}</td></tr>`; }).join('') + `</table><p class="note" style="margin-top:8px">pH появляется, когда соль побывала в пробирке.</p>`;
    press('tube', String(S.act)); press('salt', S.tubes[S.act] || '');
  }
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="safe"><b>Безопасность</b>${L.safe}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Оборудование</h2><p class="note">Что стоит на столе. Нажмите на предмет, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'dissoc') {
    let h = `<h2>Что распадается на ионы</h2><div class="formula">электролит → катион⁺ + анион⁻</div><p class="note">Сумма зарядов ионов равна нулю: раствор в целом нейтрален.</p><h3>Уравнения диссоциации</h3><div class="steps">`;
    h += step('соль', 'NaCl → Na⁺ + Cl⁻') + step('кислота', 'HCl → H⁺ + Cl⁻') + step('щёлочь', 'NaOH → Na⁺ + OH⁻') + step('ещё примеры', 'H₂SO₄ → 2H⁺ + SO₄²⁻;  Ba(OH)₂ → Ba²⁺ + 2OH⁻', 'sum') + `</div>`;
    h += `<h3>Сейчас в стакане</h3>`;
    if (!m.s) return h + `<p class="note">Налейте образец — здесь появится разбор.</p>`;
    const s = m.s;
    h += `<div class="steps">` + step('образец', s.name) + step('частицы', s.kind === 'strong' ? `ионы ${s.cat} и ${s.an}` : s.kind === 'dry' ? `ионы ${s.cat} и ${s.an} в кристалле` : 'молекулы') +
      step('ток', !m.on ? 'прибор выключен' : m.G > 0 ? `${fmt(m.I, 0)} мА` : '≈ 0') + step('вывод', s.kind === 'strong' ? `электролит: ${s.eq}` : s.kind === 'dry' ? 'в твёрдом виде ток не проводит; раствор или расплав — проводит' : 'неэлектролит', 'sum') + `</div>`;
    if (s.kind === 'strong') h += `<p class="note" style="margin-top:8px">${s.cat === 'H⁺' ? 'Кислота — электролит, который даёт катионы водорода H⁺.' : s.an === 'OH⁻' ? 'Щёлочь — электролит, который даёт гидроксид-ионы OH⁻.' : 'Соль даёт катионы металла и анионы кислотного остатка.'} Катионы ${s.cat} движутся к катоду (−), анионы ${s.an} — к аноду (+).</p>`;
    return h;
  }
  if (id === 'strong') {
    let h = `<h2>Степень диссоциации</h2><div class="formula">α = n(распавш.) / n(общ.)</div><p class="note">Для слабого электролита HA ⇄ H⁺ + A⁻ с константой K: K = α²c / (1 − α), отсюда α ≈ √(K / c) (закон разбавления Оствальда).</p>`;
    if (!m.s) return h + `<p class="note">Налейте раствор — здесь появится расчёт.</p>`;
    const s = m.s, c = m.c;
    h += `<h3>${s.name}, c = ${fmt(c, c < 0.01 ? 3 : c < 0.1 ? 2 : 1)} моль/л</h3><div class="steps">` + step('уравнение', s.eq);
    if (s.kind === 'weak') h += step('K', sci(s.K)) + step('α ≈ √(K / c)', `√(${sci(s.K)} / ${fmt(c, c < 0.01 ? 3 : c < 0.1 ? 2 : 1)}) = ${pct(Math.sqrt(s.K / c))}`) + step('точно', pct(m.alpha));
    else h += step('α', '≈ 100 % — распадается почти весь');
    h += step('ионов на 1000 молекул', `${fmt(m.alpha * 1000, m.alpha < 0.01 ? 1 : 0)} пар`) + step('ток прибора', `${m.I >= 10 ? fmt(m.I, 0) : fmt(m.I, 1)} мА`, 'sum') + `</div>`;
    if (s.kind === 'weak') { const hcl = condOf(S2[0], c), mine = condOf(s, c); h += `<p class="note" style="margin-top:8px">Ионов меньше, чем в HCl той же концентрации, примерно в ${fmt(1 / m.alpha, 0)} раз, а ток меньше в ${fmt(hcl / Math.max(mine, 1e-9), 0)} раз (ионы ещё и движутся с разной скоростью).</p>`; }
    return h + `<h3>Сильные и слабые</h3><div class="steps">` + step('сильные', 'HCl, HNO₃, H₂SO₄, NaOH, KOH, Ba(OH)₂, почти все соли') + step('слабые', 'CH₃COOH, H₂CO₃, H₂S, HF, NH₃·H₂O, H₂O') + `</div>`;
  }
  if (id === 'ionic') {
    const r = m.r, st = m.st;
    let h = `<h2>Ионное уравнение по шагам</h2><div class="formula" style="font-size:15px">${r.mol}</div>`;
    h += `<div class="steps">` + step('признак реакции', r.sign === 'нет' ? 'нет ни осадка, ни газа, ни воды' : r.sign === 'осадок' ? 'выпадает осадок ↓' : r.sign === 'газ' ? 'выделяется газ ↑ (и вода)' : 'образуется вода');
    r.terms.forEach(tm => { if (typeof tm === 'string') return; h += step(tm.f, tm.ions ? (st.split[r.terms.indexOf(tm)] ? tm.ions.map(([k, ion]) => (k > 1 ? k : '') + ion).join(' + ') : 'растворим, сильный — распишите') : 'молекулой: ' + (tm.f.includes('↓') ? 'осадок' : tm.f.includes('↑') ? 'газ' : 'слабый электролит')); });
    h += `</div><h3>Правила</h3><p class="note">Ионами пишут сильные растворимые электролиты: сильные кислоты, щёлочи, растворимые соли. Молекулами — осадки (Н в таблице), газы, воду, слабые кислоты и основания, оксиды. Одинаковые ионы в обеих частях вычёркивают.</p>`;
    if (S.done.ionic || rxSolved(r.id)) h += `<h3>Сокращённое</h3><div class="steps">` + (r.short ? step('итог', r.short.map(([k, x]) => (k > 1 ? k : '') + x).join(' + ') + ' → ' + r.prod, 'sum') : step('итог', 'все ионы — «зрители», реакция не идёт', 'sum')) + `</div>`;
    return h;
  }
  let h = `<h2>Какая будет среда</h2><div class="formula" style="font-size:15px">соль = основание + кислота</div><p class="note">Определите, из какого основания и какой кислоты «собрана» соль. Сильнее основание — среда щелочная, сильнее кислота — кислая, оба сильные — нейтральная.</p>`;
  const s = m.last;
  if (!s) return h + `<p class="note">Насыпьте соль в пробирку — здесь появится разбор.</p>`;
  const hy = hydro(s);
  h += `<h3>${s.f} — ${s.name}</h3><div class="steps">` + step('основание', `${s.base} — ${s.bs ? 'сильное' : 'слабое'}`) + step('кислота', `${s.acid} — ${s.as ? 'сильная' : 'слабая'}`);
  if (hy.type === 'n') h += step('гидролиз', 'не идёт: оба «родителя» сильные') + step('среда', 'нейтральная, pH = 7', 'sum');
  else {
    h += step('гидролиз по', s.bs ? 'аниону ' + s.ion : 'катиону ' + s.ion) + step('уравнение', s.hyd) + step('K гидролиза', sci(s.Kh));
    h += step(hy.type === 'b' ? '[OH⁻] ≈ √(K · c)' : '[H⁺] ≈ √(K · c)', `√(${sci(s.Kh)} · 0,1) = ${sci(hy.x)} моль/л`);
    h += step(hy.type === 'b' ? 'pH = 14 + lg[OH⁻]' : 'pH = −lg[H⁺]', fmt(hy.pH, 1) + ' — среда ' + envOf(hy.pH), 'sum');
  }
  h += `</div><p class="note" style="margin-top:8px">Константа гидролиза K = Kw / K(слабой кислоты или основания), Kw = 10⁻¹⁴. Чем слабее «родитель», тем сильнее гидролиз: H₂CO₃ (по второй ступени) слабее уксусной кислоты, поэтому сода щелочнее ацетата.</p>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID(), ok = !!S.done[id];
  if (m.kind === 'tester') {
    const name = m.s ? m.s.f + (m.s.kind === 'dry' ? ' тв.' : '') : 'пусто';
    if (id === 'dissoc') el.innerHTML = `<div class="k">Лампа · ток</div><div class="v ${m.b > 0.01 ? 'ok' : ''}">${!m.on ? 'выключено' : m.s ? (m.G > 0 ? fmt(m.I, 0) + ' мА' : '0 мА') : '—'}</div><div class="gauge"><b style="width:${(m.b * 100).toFixed(1)}%;background:#ffd36b"></b></div><div class="lr"><span>${name}</span><span>${m.n}/${S1.length}</span></div>`;
    else el.innerHTML = `<div class="k">Степень диссоциации</div><div class="v ${m.s && m.alpha > 0.5 ? 'ok' : ''}">${m.s ? aEq(m.alpha) : 'α = —'}</div><div class="gauge"><b style="width:${(m.b * 100).toFixed(1)}%;background:#ffd36b"></b></div><div class="lr"><span>${name}</span><span>${fmt(m.c, m.c < 0.01 ? 3 : m.c < 0.1 ? 2 : 1)} M</span></div>`;
  } else if (m.kind === 'rx') {
    el.innerHTML = `<div class="k">Признак реакции</div><div class="v ${m.st.mixed && m.r.id !== 'no' ? 'ok' : ''}">${m.st.mixed ? (m.r.id === 'no' ? 'нет' : m.r.sign + ' ' + (m.r.mark === 'H₂O' ? '' : m.r.mark)) : 'не слито'}</div><div class="gauge"><b style="width:${(m.solved / 3 * 100).toFixed(1)}%;background:var(--ok)"></b></div><div class="lr"><span>${m.r.title}</span><span>${m.solved}/3</span></div>`;
  } else {
    const tb = m.tubes[S.act], c = tb ? uiColor(tb.pH) : '#26324a';
    el.innerHTML = `<div class="k">Пробирка ${S.act + 1} · ${TUBES[S.act].lab}</div><div class="v ${tb && tb.ok ? 'ok' : ''}">${tb ? 'pH ' + fmt(tb.pH, 1) : 'пусто'}</div><div class="swatch" style="background:${c}"></div><div class="lr"><span>${tb ? tb.s.f : '—'}</span><span>${m.ok}/3${ok ? ' ✓' : ''}</span></div>`;
  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Электролиты и ионы пройдены!'), 1400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  Object.assign(S, JSON.parse(JSON.stringify(L.init)));
  save(); resetProps();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// for the «Как в жизни» 3D view (/luch/real3d.js → /luch/real3d-chem-ions.js): glassware and the conductivity tester on a lab tray
window.LUCH_REAL = () => {
  const id = LID(), m = model(), base = { module: 'chem-ions' }, hx = s => parseInt(s.slice(1), 16);
  if (id === 'dissoc' || id === 'strong') {
    const L = SAMP();
    return { ...base, scene: 'ions-tester', lesson: id, help: 'Бутылка — налить в стакан, выключатель — ток, стакан — промыть',
      on: S.on, at: S.at, b: Math.round(m.b * 50) / 50, I: m.s && S.on ? (m.I >= 10 ? fmt(m.I, 0) : fmt(m.I, 1)) + ' мА' : '0 мА', alpha: m.s ? pct(m.alpha) : '', c: id === 'strong' ? fmt(S.c, S.c < 0.01 ? 3 : S.c < 0.1 ? 2 : 1) : '',
      s: m.s ? { f: m.s.f, name: m.s.name, kind: m.s.kind, cat: m.s.cat || '', an: m.s.an || '', mol: m.s.mol || '', col: hx(m.s.col), eq: m.s.eq } : null,
      pairs: m.s ? (m.s.kind === 'strong' ? 7 : m.s.kind === 'weak' ? Math.max(1, Math.round(m.alpha * 7)) : 0) : 0,
      bottles: L.map((s, i) => ({ f: s.f, sub: s.sub, col: hx(s.col), dry: s.kind === 'dry', tested: !!S.tested[i], zone: id === 'strong' ? (S.sorted[s.id] || null) : null, bright: S.tested[i] ? Math.round(brightOf(condOf(s, id === 'strong' ? S.c : C0)) * 20) / 20 : null })) };
  }
  if (id === 'ionic') { const r = m.r, st = m.st;
    return { ...base, scene: 'ions-mix', help: 'Пробирки — слить, стакан — заново, табличка — другая реакция',
      rx: r.id, A: r.A, B: r.B, title: r.title, mixed: st.mixed, sign: r.sign, mol: r.mol, solved: m.solved, ok: m.ok,
      short: m.ok && r.short ? r.short.map(([k, x]) => (k > 1 ? k : '') + x).join(' + ') + ' → ' + r.prod : '' }; }
  return { ...base, scene: 'ions-hyd', help: 'Пробирка — выбрать, банка — насыпать соль в выбранную пробирку',
    act: S.act, tubes: m.tubes.map((tb, i) => tb ? { f: tb.s.f, pH: fmt(tb.pH, 1), col: hx(uiColor(tb.pH)), ok: tb.ok, lab: TUBES[i].lab } : { lab: TUBES[i].lab }),
    salts: SALTS.map(s => ({ id: s.id, f: s.f, col: hx(s.col) })), last: S.last };
};
window.LUCH_REAL.click = k => {
  if (/^b\d$/.test(k)) return pour(+k.slice(1));
  if (/^tube\d$/.test(k)) { S.act = +k.slice(4); renderTools(); update(); return; }
  if (/^salt-/.test(k)) return fillTube(S.act, k.slice(5));
  if (k === 'beaker') return act('rinse');
  act(k);
};

// ---------- for the AI tutor ----------
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'dissoc') now = `Прибор для проверки электропроводности (батарейка 4,5 В, лампочка, графитовые электроды) ${S.on ? 'включён' : 'выключен'}. Образцы: ${S1.map(s => s.name).join(', ')}. В стакане: ${m.s ? m.s.name : 'ничего'}${m.s ? `, лампа ${m.b > 0.01 ? 'горит, ток ' + fmt(m.I, 0) + ' мА' : 'не горит'}` : ''}. Проверено ${m.n} из ${S1.length}: ${S1.filter((s, i) => S.tested[i]).map(s => `${s.name} — ${brightOf(condOf(s, C0)) > 0.01 ? 'горит' : 'не горит'}`).join('; ') || 'пока ничего'}. Не перечисляй заранее, какие из непроверенных образцов — электролиты: пусть ученик предскажет.`;
  if (id === 'strong') now = `Концентрация всех растворов ${fmt(S.c, 3)} моль/л. В стакане: ${m.s ? `${m.s.name}, ${aEq(m.alpha)}, ток ${fmt(m.I, 1)} мА, яркость лампы ${fmt(m.b * 100, 0)} %` : 'ничего'}. Проверено ${m.n} из ${S2.length}, на подносах ${m.sorted} из ${S2.length}: ${S2.filter(s => S.sorted[s.id]).map(s => `${s.f} — ${S.sorted[s.id] === 'strong' ? 'сильные' : 'слабые'}`).join('; ') || 'пусто'}. Не называй, куда ставить непроверенные растворы.`;
  if (id === 'ionic') { const r = m.r, st = m.st; now = `Реакция ${r.title}: ${r.mol}. Растворы ${st.mixed ? 'слиты, признак: ' + r.sign : 'ещё не слиты'}. Полное ионное ${m.full ? 'составлено' : 'не закончено (расписано ' + r.terms.filter((t, i) => typeof t !== 'string' && t.ions && st.split[i]).map(t => t.f).join(', ') + ')'}. ${r.short ? `Сокращённое: в клетках ${st.slots.filter(Boolean).join(', ') || 'пусто'}, ${m.shortOk ? 'верно' : 'пока не верно'}.` : 'Сокращённого нет — все ионы зрители.'} Решено реакций ${m.solved} из 3 (осадок, вода, газ). Не называй готовое сокращённое уравнение — наводи вопросами по таблице растворимости.`; }
  if (id === 'hydro') now = `Пробирки с универсальным индикатором, соли 0,1 моль/л: ${m.tubes.map((tb, i) => `пробирка ${i + 1} (нужно ${TUBES[i].lab}) — ${tb ? `${tb.s.f}, pH ${fmt(tb.pH, 1)}${tb.ok ? ', подходит' : ', не подходит'}` : 'пусто'}`).join('; ')}. Выбрана пробирка ${S.act + 1}. Доступные соли: ${SALTS.map(s => s.f).join(', ')}. Не называй прямо, какую соль куда класть — помоги рассуждать через силу основания и кислоты.`;
  return [
    `Раздел: химия, 9 класс (гидролиз — 11 класс), «Электролиты и ионы». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на столе: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Направляй ученика вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    dissoc: 'Почему сухая соль не проводит ток, а её раствор проводит?', strong: 'Почему уксусная кислота проводит ток хуже соляной?',
    ionic: 'Как понять, какие ионы — «зрители»?', hydro: 'Почему раствор соды щелочной, если это соль?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
