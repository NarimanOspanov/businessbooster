<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по химии, 10 класс: почему углерод особенный, строение органических молекул и гибридизация, изомерия алканов, названия по ИЮПАК.">
<title>Основы органики</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /mechanics and /chemistry. Molecule board (SVG) on the left, lesson notebook on the right, lesson strip under the board. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene.rot{cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.goals{display:grid;gap:6px;margin-top:10px}
.goals div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 11px;font-size:13.5px}
.goals span{font:500 13px var(--font-mono);color:var(--muted)}
.goals .on span{color:var(--ok)}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#chem'" onkeydown="if(event.key==='Enter')location.href='/#chem'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 8l10 6v12l-10 6-10-6V14z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 8V3M30 14l4-2.5M30 26l4 2.5M10 14l-4-2.5" stroke="var(--arm)" stroke-width="1.8" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Органика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Стол с моделями молекул">
    <svg class="scene" id="scene" role="img" aria-label="Модели органических молекул. Атомы можно добавлять и убирать нажатием, объёмную модель — вращать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-chem-orgbase';
const SUBD = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
const low = s => String(s).replace(/\d/g, d => SUBD[d]);
const fml = (c, h) => low('C' + (c > 1 ? c : '') + (h > 0 ? 'H' + (h > 1 ? h : '') : ''));
const ROOT = ['', 'метан', 'этан', 'пропан', 'бутан', 'пентан', 'гексан', 'гептан', 'октан', 'нонан', 'декан'];
const MULT = ['', '', 'ди', 'три', 'тетра'];
const HYBN = { sp3: 'sp³', sp2: 'sp²', sp: 'sp' };
const C_COL = '#4f586d', H_COL = '#eef2f8';

// ---------- the molecule board: a 7 × 4 grid of places for carbon atoms ----------
const COLS = 7, ROWS = 4, SP = 64, GX = 68, GY = 150, START = 10;
const nodeXY = id => [GX + (id % COLS) * SP, GY + Math.floor(id / COLS) * SP];
const nbrNodes = id => { const c = id % COLS, r = (id / COLS) | 0, o = []; if (c > 0) o.push(id - 1); if (c < COLS - 1) o.push(id + 1); if (r > 0) o.push(id - COLS); if (r < ROWS - 1) o.push(id + COLS); return o; };
const bk = (a, b) => a < b ? a + '-' + b : b + '-' + a;

// ---------- lesson 2: 3D models (coordinates in ångströms, idealised angles) ----------
const T = 0.629;   // 1,09 Å / √3 — the C–H bond towards a cube corner
const MOL3 = [
  { id: 'methane', name: 'Метан', f: 'CH₄', cond: 'CH₄', hyb: 'sp3', sig: 4, pi: 0, sigAll: 4, piAll: 0,
    atoms: [['C', 0, 0, 0], ['H', T, T, T], ['H', T, -T, -T], ['H', -T, T, -T], ['H', -T, -T, T]],
    bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]], arc: [1, 0, 2], pair: 'H–C–H' },
  { id: 'ethene', name: 'Этилен', f: 'C₂H₄', cond: 'CH₂=CH₂', hyb: 'sp2', sig: 3, pi: 1, sigAll: 5, piAll: 1,
    atoms: [['C', -0.67, 0, 0], ['C', 0.67, 0, 0], ['H', -1.215, 0.944, 0], ['H', -1.215, -0.944, 0], ['H', 1.215, 0.944, 0], ['H', 1.215, -0.944, 0]],
    bonds: [[0, 1, 2], [0, 2, 1], [0, 3, 1], [1, 4, 1], [1, 5, 1]], arc: [4, 1, 5], pair: 'H–C–H' },
  { id: 'ethyne', name: 'Ацетилен', f: 'C₂H₂', cond: 'HC≡CH', hyb: 'sp', sig: 2, pi: 2, sigAll: 3, piAll: 2,
    atoms: [['C', -0.6, 0, 0], ['C', 0.6, 0, 0], ['H', -1.66, 0, 0], ['H', 1.66, 0, 0]],
    bonds: [[0, 1, 3], [0, 2, 1], [1, 3, 1]], arc: [3, 1, 0], pair: 'H–C≡C' },
];

// ---------- lesson 3: isomers ----------
const ISO_N = { 4: 2, 5: 3, 6: 5 };
const BP = { 'бутан': -0.5, '2-метилпропан': -11.7, 'пентан': 36.1, '2-метилбутан': 27.8, '2,2-диметилпропан': 9.5,
             'гексан': 68.7, '2-метилпентан': 60.3, '3-метилпентан': 63.3, '2,2-диметилбутан': 49.7, '2,3-диметилбутан': 58.0 };

// ---------- lesson 4: molecules to name. Each atom: [column, row, parent atom] ----------
const NM = [
  [[1, 2, -1], [2, 2, 0], [3, 2, 1], [3, 1, 2], [2, 3, 1]],
  [[1, 1, -1], [2, 1, 0], [3, 1, 1], [4, 1, 2], [4, 2, 3], [3, 0, 2]],
  [[1, 2, -1], [2, 2, 0], [3, 2, 1], [4, 2, 2], [4, 1, 3], [2, 1, 1], [3, 3, 2]],
  [[1, 1, -1], [2, 1, 0], [3, 1, 1], [4, 1, 2], [5, 1, 3], [2, 0, 1], [2, 2, 1], [4, 2, 3]],
  [[0, 2, -1], [1, 2, 0], [2, 2, 1], [3, 2, 2], [4, 2, 3], [1, 3, 1], [2, 1, 2], [2, 0, 6]],
];

            at: [START], bd: {}, hist: [], got: {}, mol: 0, yaw: 0.6, pitch: 0.35, spin: true, ans: {}, wrong: 0,
            n: 5, iso: { 4: {}, 5: {}, 6: {} }, lastCanon: null, nm: 0, chain: [], named: {} };

// ---------- graph helpers ----------
function bAdj() {
  const adj = {}; for (const a of S.at) adj[a] = [];
  for (const k of Object.keys(S.bd)) { const [a, b] = k.split('-').map(Number); adj[a].push(b); adj[b].push(a); }
  return adj;
}
const used = a => { let s = 0; for (const [k, o] of Object.entries(S.bd)) { const [x, y] = k.split('-').map(Number); if (x === a || y === a) s += o; } return s; };
function connected(V, adj) {
  if (!V.length) return true;
  const set = new Set(V), seen = new Set([V[0]]), st = [V[0]];
  while (st.length) { const v = st.pop(); for (const w of adj[v]) if (set.has(w) && !seen.has(w)) { seen.add(w); st.push(w); } }
  return seen.size === V.length;
}
function longest(V, adj) {
  let best = 0, paths = [];
  const dfs = (p, seen) => {
    const last = p[p.length - 1];
    for (const w of adj[last]) if (!seen.has(w)) { seen.add(w); p.push(w); dfs(p, seen); p.pop(); seen.delete(w); }
    if (p.length > best) { best = p.length; paths = [p.slice()]; } else if (p.length === best) paths.push(p.slice());
  };
  for (const v of V) dfs([v], new Set([v]));
  return { len: best, paths };
}
function canon(V, adj) {
  const enc = (v, p) => '(' + adj[v].filter(w => w !== p).map(w => enc(w, v)).sort().join('') + ')';
  let best = null; for (const v of V) { const s = enc(v, -1); if (best === null || s < best) best = s; }
  return best;
}
function branchName(w, from, adj) {
  const seen = new Set([from, w]), st = [w];
  while (st.length) { const v = st.pop(); for (const u of adj[v]) if (!seen.has(u)) { seen.add(u); st.push(u); } }
  const n = seen.size - 1;
  if (n === 1) return 'метил';
  if (n === 2) return 'этил';
  if (n === 3) return adj[w].length === 3 ? 'изопропил' : 'пропил';
  return 'бутил';
}
function subsOf(path, adj) {
  const inC = new Set(path), subs = [];
  path.forEach((v, i) => { for (const w of adj[v]) if (!inC.has(w)) subs.push({ loc: i + 1, name: branchName(w, v, adj) }); });
  return subs;
}
const lexCmp = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return a.length - b.length; };
function score(path, adj) {
  const subs = subsOf(path, adj);
  return { path, subs, locs: subs.map(s => s.loc).sort((x, y) => x - y),
           alpha: subs.slice().sort((x, y) => x.name.localeCompare(y.name, 'ru') || x.loc - y.loc).map(s => s.loc) };
}
const better = (a, b) => (b.subs.length - a.subs.length) || lexCmp(a.locs, b.locs) || lexCmp(a.alpha, b.alpha);
function nameOf(len, subs) {
  const g = {}; for (const s of subs) (g[s.name] = g[s.name] || []).push(s.loc);
  const parts = Object.keys(g).sort((a, b) => a.localeCompare(b, 'ru')).map(n => g[n].sort((a, b) => a - b).join(',') + '-' + MULT[g[n].length] + n);
  return parts.join('-') + ROOT[len];
}
function bestName(V, adj) {
  const L = longest(V, adj); let best = null;
  for (const p of L.paths) { const s = score(p, adj); if (!best || better(s, best) < 0) best = s; }
  return { len: L.len, name: nameOf(L.len, best.subs), best };
}

// molecules of lesson 4 as graphs
const NMG = NM.map(list => {
  const V = list.map((a, i) => i), adj = {}, pos = list.map(a => nodeXY(a[1] * COLS + a[0]));
  V.forEach(i => adj[i] = []);
  list.forEach((a, i) => { if (a[2] >= 0) { adj[i].push(a[2]); adj[a[2]].push(i); } });
  return { V, adj, pos, best: bestName(V, adj) };
});

// ---------- model ----------
const GOALS = [['chain', 'цепь из 5 атомов'], ['branch', 'разветвление'], ['ring', 'кольцо'], ['multi', 'кратная связь']];
function model() {
  const id = LID();
  if (id === 'carbon' || id === 'isomers') {
    const adj = bAdj(), n = S.at.length, H = S.at.reduce((s, a) => s + 4 - used(a), 0), nb = Object.keys(S.bd).length;
    const pi = Object.values(S.bd).reduce((s, o) => s + o - 1, 0), rings = nb - n + 1;
    const L = longest(S.at, adj);
    const g = { chain: L.len >= 5, branch: S.at.some(a => adj[a].length >= 3), ring: rings > 0, multi: pi > 0 };
    const m = { kind: 'build', adj, n, H, nb, pi, rings, chainLen: L.len, g, got: GOALS.filter(([k]) => S.got[k]).length };
    if (id === 'isomers') {
      m.found = Object.keys(S.iso[S.n]).length; m.found5 = Object.keys(S.iso[5]).length;
      if (n === S.n && rings === 0 && pi === 0) { m.canon = canon(S.at, adj); m.name = bestName(S.at, adj).name; }
    }
    return m;
  }
  if (id === 'structure') {
    const M = MOL3[S.mol], P = M.atoms.map(a => proj([a[1], a[2], a[3]])), [ia, ic, ib] = M.arc;
    const v = (i, j) => [M.atoms[j][1] - M.atoms[i][1], M.atoms[j][2] - M.atoms[i][2], M.atoms[j][3] - M.atoms[i][3]];
    const A = v(ic, ia), B = v(ic, ib), dot = A[0] * B[0] + A[1] * B[1] + A[2] * B[2], na = Math.hypot(...A), nb = Math.hypot(...B);
    const real = Math.acos(clamp(dot / na / nb, -1, 1)) * 180 / Math.PI;
    const a2 = [P[ia].x - P[ic].x, P[ia].y - P[ic].y], b2 = [P[ib].x - P[ic].x, P[ib].y - P[ic].y];
    const l1 = Math.hypot(...a2), l2 = Math.hypot(...b2);
    const seen = l1 > 1 && l2 > 1 ? Math.acos(clamp((a2[0] * b2[0] + a2[1] * b2[1]) / l1 / l2, -1, 1)) * 180 / Math.PI : NaN;
    return { kind: 'mol3', M, P, real, seen, right: MOL3.filter((x, i) => S.ans[i]).length };
  }
  const G = NMG[S.nm], ch = S.chain, k = ch.length, best = G.best;
  let user = null, status = k ? '' : 'empty';
  if (k) {
    if (k === best.len) {
      user = nameOf(k, score(ch, G.adj).subs);
      status = user === best.name ? 'ok' : nameOf(k, score(ch.slice().reverse(), G.adj).subs) === best.name ? 'flip' : 'other';
    } else {
      const ext = G.adj[ch[k - 1]].some(w => !ch.includes(w)) || G.adj[ch[0]].some(w => !ch.includes(w));
      status = ext ? 'grow' : 'short';
    }
  }
  return { kind: 'name', G, k, user, status, nC: G.V.length, named: Object.keys(S.named).length };
}

// ---------- 3D projection (lesson 2) ----------
const C3 = { x: 260, y: 255 }, K3 = 72;
function proj(p) {
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  const y2 = p[1] * cp - z1 * sp, z2 = p[1] * sp + z1 * cp, k = 1 + z2 * 0.08;
  return { x: C3.x + x1 * K3 * k, y: C3.y - y2 * K3 * k, z: z2, k };
}

// ---------- drawing ----------
const scene = $('#scene');
const atomSVG = (x, y, r, fill, label, fs, tc, ring) =>
  `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r + 1.6).toFixed(1)}" fill="${INK}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="${ring || 'rgba(255,255,255,.18)'}" stroke-width="${ring ? 2.6 : 1.2}"/>` +
  `<ellipse cx="${(x - r * 0.33).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" rx="${(r * 0.32).toFixed(1)}" ry="${(r * 0.2).toFixed(1)}" fill="#fff" opacity=".14"/>` +
  `<text x="${x.toFixed(1)}" y="${(y + fs * 0.36).toFixed(1)}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="500">${label}</text>`;
function bondSVG(p, q, o, col, w, piCol) {
  const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const offs = o === 1 ? [0] : o === 2 ? [-4, 4] : [0, -7, 7];
  return offs.map((d, i) => {
    const c = piCol && (o === 2 ? i === 1 : i > 0) ? piCol : col;
    return `<path d="M${(p[0] + nx * d).toFixed(1)} ${(p[1] + ny * d).toFixed(1)}L${(q[0] + nx * d).toFixed(1)} ${(q[1] + ny * d).toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.4}" stroke-linecap="round"/><path d="M${(p[0] + nx * d).toFixed(1)} ${(p[1] + ny * d).toFixed(1)}L${(q[0] + nx * d).toFixed(1)} ${(q[1] + ny * d).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join('');
}
const hLabel = h => h === 0 ? 'C' : h === 1 ? 'CH' : 'CH' + SUBD[h];
const limit = () => LID() === 'carbon' ? 10 : S.n;

function boardBg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}

function drawBuilder(m) {
  const L1 = LID() === 'carbon', has = new Set(S.at);
  let h = boardBg();
  for (let id = 0; id < COLS * ROWS; id++) {
    if (has.has(id)) continue;
    const [x, y] = nodeXY(id);
    const open = S.at.length < limit() && nbrNodes(id).some(a => has.has(a) && used(a) < 4);
    h += open ? `<circle cx="${x}" cy="${y}" r="10" fill="rgba(114,212,232,.05)" stroke="#3a4762" stroke-width="1.3" stroke-dasharray="3 3"/><path d="M${x - 4} ${y}h8M${x} ${y - 4}v8" stroke="#72d4e8" stroke-opacity=".7" stroke-width="1.5"/>`
              : `<circle cx="${x}" cy="${y}" r="2.4" fill="#2c3954"/>`;
  }
  // unbonded neighbours in lesson 1: a faint hint that a bond (ring) can be made
  if (L1) for (const a of S.at) for (const b of nbrNodes(a)) if (b > a && has.has(b) && !S.bd[bk(a, b)]) {
    const [x1, y1] = nodeXY(a), [x2, y2] = nodeXY(b);
    h += `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#56627d" stroke-width="1.5" stroke-dasharray="2 5"/>`;
  }
  for (const [k, o] of Object.entries(S.bd)) { const [a, b] = k.split('-').map(Number); h += bondSVG(nodeXY(a), nodeXY(b), o, '#c8d1e2', 3.2); }
  if (L1) {
    for (const a of S.at) {
      const free = 4 - used(a); if (free <= 0) continue;
      const c = a % COLS, r = (a / COLS) | 0, [x, y] = nodeXY(a), occ = (dc, dr) => { const cc = c + dc, rr = r + dr; return cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS && has.has(rr * COLS + cc); };
      const orth = [[1, 0], [-1, 0], [0, -1], [0, 1]], diag = [[1, -1], [-1, -1], [1, 1], [-1, 1]];
      const bonded = (dc, dr) => occ(dc, dr) && !!S.bd[bk(a, (r + dr) * COLS + c + dc)];
      const cand = orth.filter(([dc, dr]) => !occ(dc, dr)).concat(diag.filter(([dc, dr]) => !occ(dc, dr)), orth.filter(([dc, dr]) => occ(dc, dr) && !bonded(dc, dr)));
      cand.slice(0, free).forEach(([dc, dr]) => {
        const L = Math.hypot(dc, dr), hx = x + dc / L * 28, hy = y + dr / L * 28;
        h += `<path d="M${x} ${y}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="#c8d1e2" stroke-width="2"/>` + atomSVG(hx, hy, 8.5, H_COL, 'H', 9.5, '#0b1019');
      });
    }
    for (const a of S.at) { const [x, y] = nodeXY(a); h += atomSVG(x, y, 16, C_COL, 'C', 14, '#fff'); }
  } else {
    for (const a of S.at) { const [x, y] = nodeXY(a); h += atomSVG(x, y, 19, C_COL, hLabel(4 - used(a)), 11.5, '#fff'); }
    const txt = m.canon ? `${fml(S.n, 2 * S.n + 2)} · ${m.name}` : `Атомов углерода: ${m.n} из ${S.n}`;
    h += `<text x="260" y="396" font-size="13" fill="${m.canon ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">${txt}</text>`;
  }
  return h;
}

function drawMol3(m) {
  const M = m.M, P = m.P, arcSet = new Set([bk(M.arc[0], M.arc[1]), bk(M.arc[2], M.arc[1])]);
  let h = boardBg();
  const bonds = M.bonds.map(([i, j, o]) => ({ i, j, o, z: (P[i].z + P[j].z) / 2 })).sort((a, b) => a.z - b.z);
  for (const b of bonds) h += bondSVG([P[b.i].x, P[b.i].y], [P[b.j].x, P[b.j].y], b.o, arcSet.has(bk(b.i, b.j)) ? '#ffb547' : '#c8d1e2', 4, '#72d4e8');
  // the protractor arc at the central atom
  const c = P[M.arc[1]], a = P[M.arc[0]], b = P[M.arc[2]];
  const ta = Math.atan2(a.y - c.y, a.x - c.x), tb = Math.atan2(b.y - c.y, b.x - c.x);
  let d = tb - ta; while (d > Math.PI) d -= 2 * Math.PI; while (d <= -Math.PI) d += 2 * Math.PI;
  const R = 36, p1 = [c.x + R * Math.cos(ta), c.y + R * Math.sin(ta)], p2 = [c.x + R * Math.cos(tb), c.y + R * Math.sin(tb)], tm = ta + d / 2;
  const atomsZ = P.map((p, i) => ({ p, i })).sort((u, v) => u.p.z - v.p.z);
  for (const { p, i } of atomsZ) {
    const C = M.atoms[i][0] === 'C';
    h += atomSVG(p.x, p.y, (C ? 20 : 13) * p.k, C ? C_COL : H_COL, M.atoms[i][0], C ? 14 : 11, C ? '#fff' : '#0b1019');
  }
  h += `<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}A${R} ${R} 0 0 ${d > 0 ? 1 : 0} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" fill="none" stroke="#ffb547" stroke-width="2.2" stroke-dasharray="4 3"/>`;
  const lx = c.x + 62 * Math.cos(tm), ly = c.y + 62 * Math.sin(tm);
  h += `<rect x="${(lx - 30).toFixed(1)}" y="${(ly - 11).toFixed(1)}" width="60" height="20" rx="6" fill="rgba(11,16,25,.85)" stroke="#ffb547" stroke-width="1"/><text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" font-size="12" fill="#ffb547" text-anchor="middle">${fmt(m.real, 1)}°</text>`;
  h += `<text x="260" y="396" font-size="13" fill="#8b96ad" text-anchor="middle">${M.name} · ${M.cond}${S.ans[S.mol] ? ' · ' + HYBN[M.hyb] + ' ✓' : ''}</text>`;
  return h;
}

function drawNames(m) {
  const G = m.G, ch = S.chain, inC = new Set(ch);
  let h = boardBg();
  for (let id = 0; id < COLS * ROWS; id++) { const [x, y] = nodeXY(id); h += `<circle cx="${x}" cy="${y}" r="2.4" fill="#2c3954"/>`; }
  G.V.forEach(i => G.adj[i].forEach(j => {
    if (j < i) return;
    const ia = ch.indexOf(i), ja = ch.indexOf(j), on = ia >= 0 && ja >= 0 && Math.abs(ia - ja) === 1;
    h += bondSVG(G.pos[i], G.pos[j], 1, on ? '#ffb547' : '#c8d1e2', on ? 4.4 : 3.2);
  }));
  G.V.forEach(i => { const [x, y] = G.pos[i]; h += atomSVG(x, y, 19, C_COL, hLabel(4 - G.adj[i].length), 11.5, '#fff', inC.has(i) ? '#ffb547' : null); });
  ch.forEach((i, n) => { const [x, y] = G.pos[i]; h += `<circle cx="${x - 17}" cy="${y - 18}" r="8.5" fill="#ffb547" stroke="${INK}" stroke-width="1.5"/><text x="${x - 17}" y="${y - 14.5}" font-size="10" fill="#0b1019" text-anchor="middle" font-weight="600">${n + 1}</text>`; });
  const txt = {
    empty: S.named[S.nm] ? '✓ Эта молекула уже названа' : 'Нажмите на крайний атом самой длинной цепи',
    grow: `Цепь: ${m.k} C — продолжайте`, short: `Цепь: ${m.k} C — есть цепь длиннее`,
    ok: '✓ ' + m.user, flip: `${m.user} — номера можно сделать меньше`, other: `${m.user} — есть цепь с бо́льшим числом заместителей`,
  }[m.status];
  h += `<text x="260" y="396" font-size="13" fill="${m.status === 'ok' || (m.status === 'empty' && S.named[S.nm]) ? '#86e0a8' : m.status === 'flip' || m.status === 'other' || m.status === 'short' ? '#ffb547' : '#8b96ad'}" text-anchor="middle">${txt}</text>`;
  return h;
}

function hlBox(id) {
  const L = LID();
  const around = pts => { if (!pts.length) return null; const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = 26; return [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + 2 * pad, Math.max(...ys) - Math.min(...ys) + 2 * pad]; };
  const one = (p, r) => [p[0] - r, p[1] - r, 2 * r, 2 * r];
  const grid = [GX - 30, GY - 30, (COLS - 1) * SP + 60, (ROWS - 1) * SP + 60];
  if (L === 'carbon' || L === 'isomers') {
    if (id === 'c') return one(nodeXY(S.at[0]), 24);
    if (id === 'h' || id === 'atoms') return around(S.at.map(nodeXY));
    if (id === 'bond') { const k = Object.keys(S.bd)[0]; if (!k) return null; const [a, b] = k.split('-').map(Number), p = nodeXY(a), q = nodeXY(b); return one([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], 18); }
    if (id === 'grid') return grid;
    if (id === 'label') return [100, 380, 320, 24];
  }
  if (L === 'structure') {
    const M = MOL3[S.mol], P = M.atoms.map(a => proj([a[1], a[2], a[3]]));
    if (id === 'c') return one([P[0].x, P[0].y], 26);
    if (id === 'h') { const i = M.atoms.findIndex(a => a[0] === 'H'); return one([P[i].x, P[i].y], 18); }
    if (id === 'sigma') { const [i, j] = [M.arc[0], M.arc[1]]; return one([(P[i].x + P[j].x) / 2, (P[i].y + P[j].y) / 2], 20); }
    if (id === 'pi') { const b = M.bonds.find(x => x[2] > 1) || M.bonds[0]; return one([(P[b[0]].x + P[b[1]].x) / 2, (P[b[0]].y + P[b[1]].y) / 2], 22); }
    if (id === 'arc') return one([P[M.arc[1]].x, P[M.arc[1]].y], 64);
  }
  if (L === 'names') {
    const G = NMG[S.nm];
    if (id === 'chain') return around((S.chain.length ? S.chain : G.best.best.path).map(i => G.pos[i]));
    if (id === 'num') return S.chain.length ? one([G.pos[S.chain[0]][0] - 17, G.pos[S.chain[0]][1] - 18], 16) : null;
    if (id === 'sub') { const inC = new Set(S.chain.length ? S.chain : G.best.best.path); const pts = G.V.filter(i => !inC.has(i)).map(i => G.pos[i]); return around(pts); }
    if (id === 'name') return [80, 380, 360, 24];
  }
  return null;
}

function drawScene(t) {
  const m = model(), id = LID();
  let h = id === 'structure' ? drawMol3(m) : id === 'names' ? drawNames(m) : drawBuilder(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

// fit the scene: 520 × 405 units, centred, board at the bottom
let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 490, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- actions on the board ----------
const snap = () => { S.hist.push(JSON.stringify({ at: S.at, bd: S.bd })); if (S.hist.length > 60) S.hist.shift(); };
function addAtom(node) {
  if (S.at.length >= limit()) {
    toast(LID() === 'carbon' ? 'Хватит: на этом поле до 10 атомов углерода.' : `В ${fml(S.n, 2 * S.n + 2)} ровно ${S.n} атомов углерода. Уберите крайний и прикрепите в другое место.`);
    return;
  }
  const nb = nbrNodes(node).filter(x => S.at.includes(x));
  if (!nb.length) { toast('Новый атом ставят рядом с уже имеющимся.'); return; }
  const free = nb.filter(x => used(x) < 4).sort((a, b) => S.at.indexOf(b) - S.at.indexOf(a));
  if (!free.length) { toast('У соседнего атома уже 4 связи — больше углерод не может.'); return; }
  snap(); S.at.push(node); S.bd[bk(node, free[0])] = 1; update();
}
function removeAtom(a) {
  if (S.at.length === 1) { toast('Последний атом не убрать — с него начинается молекула.'); return; }
  const rest = S.at.filter(x => x !== a), adj = {};
  rest.forEach(x => adj[x] = []);
  for (const k of Object.keys(S.bd)) { const [x, y] = k.split('-').map(Number); if (x !== a && y !== a) { adj[x].push(y); adj[y].push(x); } }
  if (!connected(rest, adj)) { toast('Этот атом держит молекулу вместе. Сначала уберите крайние.'); return; }
  snap(); S.at = rest;
  for (const k of Object.keys(S.bd)) { const [x, y] = k.split('-').map(Number); if (x === a || y === a) delete S.bd[k]; }
  update();
}
function tapGap(a, b) {
  const k = bk(a, b), o = S.bd[k];
  if (LID() === 'isomers') {
    toast(o ? 'В алканах все связи одинарные.' : `Так замкнётся кольцо. У цикла на 2 атома H меньше — это уже не ${fml(S.n, 2 * S.n + 2)}.`);
    return;
  }
  const freeBoth = used(a) < 4 && used(b) < 4;
  if (!o) { if (freeBoth) { snap(); S.bd[k] = 1; toast('Связь замкнула кольцо.'); update(); } else toast('У одного из атомов уже 4 связи.'); return; }
  if (o < 3 && freeBoth) { snap(); S.bd[k] = o + 1; update(); return; }
  if (o > 1) { snap(); S.bd[k] = 1; update(); return; }
  toast('У одного из атомов уже 4 связи — кратную связь не сделать.');
}
function hitBuilder(p) {
  for (const a of S.at) { const [x, y] = nodeXY(a); if (Math.hypot(p.x - x, p.y - y) < 20) return { type: 'atom', id: a }; }
  for (const a of S.at) for (const b of nbrNodes(a)) if (b > a && S.at.includes(b)) {
    const [x1, y1] = nodeXY(a), [x2, y2] = nodeXY(b);
    if (Math.hypot(p.x - (x1 + x2) / 2, p.y - (y1 + y2) / 2) < 15) return { type: 'gap', a, b };
  }
  let best = null, bd = 30;
  for (let id = 0; id < COLS * ROWS; id++) { if (S.at.includes(id)) continue; const [x, y] = nodeXY(id), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = id; } }
  return best === null ? null : { type: 'node', id: best };
}
function tapName(p) {
  const G = NMG[S.nm];
  const j = G.V.find(i => Math.hypot(p.x - G.pos[i][0], p.y - G.pos[i][1]) < 22);
  if (j === undefined) return;
  const ch = S.chain, k = ch.length;
  if (!k) S.chain = [j];
  else if (ch.includes(j)) { const i = ch.indexOf(j); S.chain = i === k - 1 ? ch.slice(0, -1) : ch.slice(0, i + 1); }
  else if (G.adj[ch[k - 1]].includes(j)) ch.push(j);
  else if (G.adj[ch[0]].includes(j)) ch.unshift(j);
  else S.chain = [j];
  update();
}
function tap(p) {
  const id = LID();
  if (id === 'names') return tapName(p);
  if (id === 'structure') return;
  const h = hitBuilder(p); if (!h) return;
  if (h.type === 'atom') removeAtom(h.id);
  else if (h.type === 'gap') tapGap(h.a, h.b);
  else addAtom(h.id);
}

let drag = null, dirty = true, liveT = 0;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  drag = { x: e.clientX, y: e.clientY, moved: false, yaw: S.yaw, pitch: S.pitch };
  if (LID() === 'structure') scene.classList.add('grabbing');
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 6) drag.moved = true;
  if (LID() === 'structure' && drag.moved) {
    S.spin = false; S.yaw = drag.yaw + dx * 0.012; S.pitch = clamp(drag.pitch + dy * 0.012, -1.5, 1.5);
    dirty = true; live();
  }
});
scene.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (!d.moved) tap(toSvg(e)); else if (LID() === 'structure') update();
});
scene.addEventListener('pointercancel', () => { drag = null; scene.classList.remove('grabbing'); });

function live() { const t = performance.now(); if (t - liveT < 90) return; liveT = t; const m = model(); renderMeter(m); updateScheme(m); }

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  if (LID() === 'structure' && S.spin && !reduce && !drag) { S.yaw += dt * 0.45; if (S.yaw > Math.PI) S.yaw -= 2 * Math.PI; anim = true; live(); }
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    carbon: B('undo', 'Отменить') + B('clear', 'Очистить'),
    structure: MOL3.map((M, i) => B('mol' + i, M.name, S.mol === i)).join('') + sep + ['sp3', 'sp2', 'sp'].map(k => B('hyb-' + k, HYBN[k], !!S.ans[S.mol] && MOL3[S.mol].hyb === k)).join(''),
    isomers: [4, 5, 6].map(n => B('n' + n, fml(n, 2 * n + 2), S.n === n)).join('') + sep + B('undo', 'Отменить') + B('clear', 'Очистить'),
    names: B('prev', '‹') + `<button disabled>${S.nm + 1} / ${NM.length}${S.named[S.nm] ? ' ✓' : ''}</button>` + B('next', '›') + sep + B('flip', 'Перевернуть') + B('reset', 'Сбросить'),
  }[id];
}
function answer(k) {
  const M = MOL3[S.mol];
  if (S.ans[S.mol]) { toast(`Уже отвечено: ${M.name} — ${HYBN[M.hyb]}.`); return; }
  if (k === M.hyb) { S.ans[S.mol] = true; toast(`Верно: в молекуле «${M.name}» углерод в состоянии ${HYBN[k]}.`); }
  else { S.wrong++; toast('Не то. Посчитайте σ-связи у атома углерода и посмотрите на угол.'); }
  renderTools(); update();
}
function act(a) {
  const id = LID();
  if (a === 'undo') { if (!S.hist.length) { toast('Отменять нечего.'); return; } const s = JSON.parse(S.hist.pop()); S.at = s.at; S.bd = s.bd; update(); return; }
  if (a === 'clear') { snap(); S.at = [START]; S.bd = {}; update(); return; }
  if (/^mol\d$/.test(a)) { S.mol = +a.slice(3); S.spin = true; renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('hyb-')) return answer(a.slice(4));
  if (/^n\d$/.test(a)) { S.n = +a.slice(1); S.at = [START]; S.bd = {}; S.hist = []; S.lastCanon = null; renderTools(); buildScheme(); update(); return; }
  if (a === 'prev' || a === 'next') { S.nm = (S.nm + (a === 'next' ? 1 : -1) + NM.length) % NM.length; S.chain = []; renderTools(); buildScheme(); update(); return; }
  if (a === 'flip') { if (S.chain.length < 2) { toast('Сначала отметьте цепь.'); return; } S.chain.reverse(); update(); return; }
  if (a === 'reset') { S.chain = []; update(); return; }
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];

}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const L = LESSONS[S.lesson];
  if (S.done[L.id]) return '✓ Выполнено';
  if (L.id === 'carbon') return GOALS.map(([k, n]) => (S.got[k] ? '✓ ' : '· ') + n).join('  ');
  if (L.id === 'structure') return `Верно определено: ${m.right} из 3`;
  if (L.id === 'isomers') return `Изомеров C₅H₁₂ найдено: ${m.found5} из 3` + (S.n !== 5 ? ` · сейчас собираем ${fml(S.n, 2 * S.n + 2)}` : '');
  return `Названо верно: ${m.named} из 3 · молекула ${S.nm + 1} из ${NM.length}`;
}

// Scheme tab: built once per lesson, then values refreshed (sliders keep focus while dragging)
function slider(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;
}
const deg = r => { let d = Math.round(r * 180 / Math.PI); while (d > 180) d -= 360; while (d < -180) d += 360; return d; };
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'carbon') h = `<h2>Счёт атомов</h2><dl class="reads"><div><dt>C</dt><dd id="r1"></dd></div><div><dt>H</dt><dd id="r2"></dd></div><div><dt>Формула</dt><dd id="r3"></dd></div></dl>
      <dl class="reads"><div><dt>C–C связей</dt><dd id="r4"></dd></div><div><dt>π-связей</dt><dd id="r5"></dd></div><div><dt>Колец</dt><dd id="r6"></dd></div></dl>
      <h3>Цели</h3><div class="goals" id="goals"></div>
      <div class="row"><button class="ghostbtn" data-a="undo">Отменить</button><button class="ghostbtn" data-a="clear">Очистить</button></div>`;
  if (id === 'structure') h = `<h2>${MOL3[S.mol].name} ${MOL3[S.mol].f}</h2>
      <div class="ctl"><div class="lbl">Молекула</div><div class="chips" id="molChips">${MOL3.map((M, i) => `<button data-i="${i}" aria-pressed="${S.mol === i}">${M.name}</button>`).join('')}</div></div>` +
      slider('inYaw', 'Поворот вокруг вертикали', -180, 180, 1, deg(S.yaw)) + slider('inPitch', 'Наклон', -85, 85, 1, deg(S.pitch)) +
      `<dl class="reads"><div><dt>Угол ${MOL3[S.mol].pair}</dt><dd id="r1"></dd></div><div><dt>На экране</dt><dd id="r2"></dd></div><div><dt>σ / π у C</dt><dd id="r3"></dd></div></dl>
      <p class="note">Настоящий угол не зависит от поворота, а видимый на экране — меняется. Поэтому молекулу смотрят с разных сторон.</p>
      <div class="ctl"><div class="lbl">Гибридизация углерода</div><div class="chips" id="hybChips">${['sp3', 'sp2', 'sp'].map(k => `<button data-k="${k}">${HYBN[k]}</button>`).join('')}</div></div>`;
  if (id === 'isomers') h = `<h2>Изомеры ${fml(S.n, 2 * S.n + 2)}</h2>
      <div class="ctl"><div class="lbl">Формула</div><div class="chips" id="nChips">${[4, 5, 6].map(n => `<button data-n="${n}" aria-pressed="${S.n === n}">${fml(n, 2 * n + 2)}</button>`).join('')}</div></div>
      <dl class="reads"><div><dt>Атомов C</dt><dd id="r1"></dd></div><div><dt>Формула</dt><dd id="r2"></dd></div><div><dt>Найдено</dt><dd id="r3"></dd></div></dl>
      <h3>Найденные изомеры</h3><div class="goals" id="isoList"></div>
      <div class="row"><button class="ghostbtn" data-a="undo">Отменить</button><button class="ghostbtn" data-a="clear">Очистить</button></div>`;
  if (id === 'names') h = `<h2>Молекула ${S.nm + 1}</h2>
      <div class="ctl"><div class="lbl">Выбрать молекулу</div><div class="chips" id="nmChips">${NM.map((x, i) => `<button data-i="${i}" aria-pressed="${S.nm === i}">${i + 1}${S.named[i] ? ' ✓' : ''}</button>`).join('')}</div></div>
      <dl class="reads"><div><dt>Атомов C</dt><dd id="r1"></dd></div><div><dt>Цепь</dt><dd id="r2"></dd></div><div><dt>Названо</dt><dd id="r3"></dd></div></dl>
      <h3>Ваше название</h3><div class="formula" id="nmOut" style="font-size:15px"></div>
      <div class="row"><button class="ghostbtn" data-a="flip">Перевернуть нумерацию</button><button class="ghostbtn" data-a="reset">Сбросить цепь</button></div>`;
  el.innerHTML = h;
  const on = (sel, fn) => { const x = el.querySelector(sel); if (x) x.addEventListener('input', fn); };
  on('#inYaw', e => { S.spin = false; S.yaw = +e.target.value * Math.PI / 180; dirty = true; live(); });
  on('#inPitch', e => { S.spin = false; S.pitch = +e.target.value * Math.PI / 180; dirty = true; live(); });
  el.querySelectorAll('#molChips button').forEach(b => b.onclick = () => act('mol' + b.dataset.i));
  el.querySelectorAll('#hybChips button').forEach(b => b.onclick = () => answer(b.dataset.k));
  el.querySelectorAll('#nChips button').forEach(b => b.onclick = () => act('n' + b.dataset.n));
  el.querySelectorAll('#nmChips button').forEach(b => b.onclick = () => { S.nm = +b.dataset.i; S.chain = []; renderTools(); buildScheme(); update(); });
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const id = LID(), set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (id === 'carbon') {
    set('#r1', m.n); set('#r2', m.H); set('#r3', fml(m.n, m.H)); set('#r4', m.nb); set('#r5', m.pi); set('#r6', m.rings);
    const g = el.querySelector('#goals'); if (g) g.innerHTML = GOALS.map(([k, n]) => `<div class="${S.got[k] ? 'on' : ''}">${n[0].toUpperCase() + n.slice(1)}<span>${S.got[k] ? '✓ есть' : m.g[k] ? 'есть' : 'нет'}</span></div>`).join('');
  }
  if (id === 'structure') {
    set('#r1', fmt(m.real, 1) + '°'); set('#r2', isFinite(m.seen) ? Math.round(m.seen) + '°' : '—'); set('#r3', `${m.M.sig} / ${m.M.pi}`);
    set('#inYawO', deg(S.yaw) + '°'); set('#inPitchO', deg(S.pitch) + '°'); val('#inYaw', deg(S.yaw)); val('#inPitch', deg(S.pitch));
    el.querySelectorAll('#hybChips button').forEach(b => b.setAttribute('aria-pressed', !!S.ans[S.mol] && b.dataset.k === m.M.hyb));
  }
  if (id === 'isomers') {
    set('#r1', `${m.n} / ${S.n}`); set('#r2', fml(m.n, m.H)); set('#r3', `${m.found} / ${ISO_N[S.n]}`);
    const names = Object.values(S.iso[S.n]), li = el.querySelector('#isoList');
    if (li) li.innerHTML = Array.from({ length: ISO_N[S.n] }, (x, i) => names[i] ? `<div class="on">${names[i]}<span>t кип ${fmt(BP[names[i]], 1)} °C</span></div>` : `<div>изомер ${i + 1}<span>?</span></div>`).join('');
  }
  if (id === 'names') {
    set('#r1', m.nC); set('#r2', m.k ? m.k + ' C' : '—'); set('#r3', `${m.named} / 3`);
    set('#nmOut', m.user || (m.k ? `цепь из ${m.k} C` : 'отметьте цепь'));
  }
}

    { id: 'bond', icon: ICON.bond, name: 'Связь C–C', spec: 'Одна черта — одинарная связь, две — двойная, три — тройная. Каждая черта забирает у обоих атомов по единице валентности.' },

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      (L.safe ? `<div class="safe"><b>Безопасность</b>${L.safe}</div>` : '') +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Детали модели</h2><p class="note">Нажмите на деталь, чтобы найти её на столе.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID();
  if (id === 'carbon') {
    const per = S.at.map((a, i) => { const u = used(a); return step(`C${i + 1}: связей с углеродом ${u}`, `H: 4 − ${u} = ${4 - u}`); }).join('');
    const sat = 2 * m.n + 2, lack = sat - m.H;
    return `<h2>Считаем водород</h2><div class="formula">H = Σ (4 − связей с C)</div><p class="note">Двойная связь считается за две, тройная — за три.</p>
      <h3>Сейчас</h3><div class="steps">${per}${step('всего H', String(m.H))}${step('формула', fml(m.n, m.H), 'sum')}</div>
      <h3>Сравним с алканом</h3><div class="steps">${step('цепь без колец и кратных связей: H = 2n + 2', `2 · ${m.n} + 2 = ${sat}`)}${step('не хватает H', `${sat} − ${m.H} = ${lack}`)}${step('колец + π-связей = нехватка / 2', `${lack} / 2 = ${lack / 2}`)}${step('у вас', `колец ${m.rings}, π-связей ${m.pi}`, 'sum')}</div>
      <p class="note" style="margin-top:10px">Каждое кольцо и каждая лишняя черта кратной связи отнимают у молекулы 2 атома водорода. Поэтому этилен C₂H₄ и циклопропан C₃H₆ «беднее» водородом, чем этан C₂H₆ и пропан C₃H₈.</p>`;
  }
  if (id === 'structure') {
    const M = m.M, ok = !!S.ans[S.mol];
    return `<h2>${M.name}: ${M.cond}</h2><div class="formula">σ-связей у C = число гибридных орбиталей</div>
      <h3>Разбор атома углерода</h3><div class="steps">${step('соседей у атома C (σ-связей)', String(M.sig))}${step('π-связей у атома C', String(M.pi))}${step('гибридных орбиталей', `${M.sig}: s + ${M.sig - 1} p`)}${step(`угол ${M.pair}`, fmt(m.real, 1) + '°')}${step('гибридизация', ok ? HYBN[M.hyb] + ' ✓' : 'выберите сами', 'sum')}</div>
      <h3>Вся молекула</h3><div class="steps">${step('молекулярная формула', M.f)}${step('структурная (сокращённая)', M.cond)}${step('σ-связей / π-связей', `${M.sigAll} / ${M.piAll}`)}</div>
      <p class="note" style="margin-top:10px">Видимый угол сейчас ${isFinite(m.seen) ? Math.round(m.seen) + '°' : '—'}: это проекция на экран. Настоящий угол между связями считают в пространстве — он не меняется, как ни крути модель.</p>`;
  }
  if (id === 'isomers') {
    const list = Object.values(S.iso[S.n]);
    return `<h2>Изомеры ${fml(S.n, 2 * S.n + 2)}</h2><div class="formula">CₙH₂ₙ₊₂</div>
      <h3>Сейчас на поле</h3><div class="steps">${step('атомов C', `${m.n} из ${S.n}`)}${step('H = 2n + 2', m.n === S.n ? `2 · ${S.n} + 2 = ${2 * S.n + 2}` : `пока ${m.H}`)}${step('скелет', m.canon ? m.name : 'не достроен', 'sum')}</div>
      <h3>Найдено ${list.length} из ${ISO_N[S.n]}</h3><div class="steps">${list.map(n => step(n, `t кип ${fmt(BP[n], 1)} °C`)).join('') || step('пока ни одного', '—')}</div>
      <p class="note" style="margin-top:10px">Формула у всех одна, а температура кипения разная: чем разветвлённее молекула, тем она «круглее», тем меньше площадь контакта между молекулами — и тем легче вещество закипает.</p>`;
  }
  const G = m.G;
  let h = `<h2>Шаги названия</h2><div class="formula">номера-заместители + корень</div><div class="steps">` +
    step('1. Длина вашей цепи', m.k ? `${m.k} C → «${ROOT[m.k]}»` : 'цепь не выбрана');
  if (m.k >= 2 && (m.status === 'ok' || m.status === 'flip' || m.status === 'other')) {
    const a = score(S.chain, G.adj), b = score(S.chain.slice().reverse(), G.adj);
    h += step('2. Номера заместителей от C1', a.locs.join(', ') || 'нет') + step('   если с другого конца', b.locs.join(', ') || 'нет') +
      step('3. Заместители', a.subs.map(s => `${s.loc}-${s.name}`).join(', ') || 'нет') + step('Ваше название', m.user, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">${m.status === 'ok' ? 'Цепь самая длинная, номера наименьшие — название верное.' : m.status === 'flip' ? 'Цепь выбрана хорошо, но с другого конца номера заместителей получаются меньше.' : 'Цепь нужной длины, но есть другая такая же длинная цепь, где заместителей больше — её и берут.'}</p>`;
  } else {
    h += `</div><p class="note" style="margin-top:10px">${m.status === 'short' ? 'Эта цепь упёрлась в концы, но в молекуле есть путь длиннее. Попробуйте начать с другого CH₃.' : 'Достройте цепь — пошаговый разбор появится, когда она станет самой длинной.'}</p>`;
  }
  h += `<h3>Корни по числу атомов C</h3><div class="steps">${[4, 5, 6].map(n => step(`${n} C`, ROOT[n])).join('')}</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), id = LID();
  if (id === 'carbon') {
    el.innerHTML = `<div class="k">Формула</div><div class="v ${m.got === 4 ? 'ok' : ''}">${fml(m.n, m.H)}</div><div class="lr"><span>атомов C</span><span>${m.n}</span></div><div class="lr"><span>целей</span><span>${m.got}/4</span></div><div class="gauge"><b style="width:${m.got * 25}%"></b></div>`;
  } else if (id === 'structure') {
    el.innerHTML = `<div class="k">${m.M.name} · угол</div><div class="v ${S.ans[S.mol] ? 'ok' : ''}">${fmt(m.real, 1)}°</div><div class="lr"><span>на экране</span><span>${isFinite(m.seen) ? Math.round(m.seen) + '°' : '—'}</span></div><div class="lr"><span>σ / π у C</span><span>${m.M.sig} / ${m.M.pi}</span></div>`;
  } else if (id === 'isomers') {
    el.innerHTML = `<div class="k">Изомеры ${fml(S.n, 2 * S.n + 2)}</div><div class="v ${m.found === ISO_N[S.n] ? 'ok' : ''}">${m.found} из ${ISO_N[S.n]}</div><div class="lr"><span>атомов C</span><span>${m.n}/${S.n}</span></div><div class="gauge"><b style="width:${(m.found / ISO_N[S.n] * 100).toFixed(1)}%"></b></div>`;
  } else {
    el.innerHTML = `<div class="k">Молекула ${S.nm + 1} из ${NM.length}</div><div class="v ${S.named[S.nm] ? 'ok' : ''}">${S.named[S.nm] ? '✓ названа' : 'цепь: ' + (m.k || '—')}</div><div class="lr"><span>атомов C</span><span>${m.nC}</span></div><div class="lr"><span>названо</span><span>${m.named}/3</span></div>`;
  }
}

function update() {
  let m = model(); const L = LESSONS[S.lesson];
  if (L.id === 'carbon') for (const [k, n] of GOALS) if (m.g[k] && !S.got[k]) { S.got[k] = true; toast(`Есть: ${n}!`); }
  if (L.id === 'isomers') {
    if (m.canon && !S.iso[S.n][m.canon]) { S.iso[S.n][m.canon] = m.name; toast(`Новый изомер: ${m.name}`); }
    else if (m.canon && m.canon !== S.lastCanon) toast(`Этот изомер уже найден: ${m.name}. Та же молекула, просто нарисована иначе.`);
    S.lastCanon = m.canon || null;
  }
  if (L.id === 'names' && m.status === 'ok' && !S.named[S.nm]) { S.named[S.nm] = true; toast(`Верно: ${m.user}`); renderTools(); if (!$('#pane-scheme').hidden) buildScheme(); }
  m = model();
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Основы органики освоены!');
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  carbon: '<path d="M9 18H45M27 18V6M45 18l10-7" stroke="#c8d1e2" stroke-width="1.6"/><circle cx="9" cy="18" r="4" fill="#4f586d"/><circle cx="18" cy="18" r="4" fill="#4f586d"/><circle cx="27" cy="18" r="4" fill="#4f586d"/><circle cx="36" cy="18" r="4" fill="#4f586d"/><circle cx="45" cy="18" r="4" fill="#4f586d"/><circle cx="27" cy="6" r="3.4" fill="#4f586d"/><circle cx="55" cy="11" r="3" fill="#eef2f8"/><circle cx="18" cy="26" r="2.4" fill="#eef2f8"/>',
  structure: '<path d="M33 16L33 4M33 16L22 23M33 16L44 23M33 16L38 11" stroke="#c8d1e2" stroke-width="1.5"/><circle cx="38" cy="11" r="3" fill="#eef2f8" opacity=".6"/><circle cx="33" cy="16" r="5" fill="#4f586d"/><circle cx="33" cy="4" r="3.2" fill="#eef2f8"/><circle cx="22" cy="23" r="3.2" fill="#eef2f8"/><circle cx="44" cy="23" r="3.2" fill="#eef2f8"/><path d="M27 19.5A7 7 0 0 1 33 9" fill="none" stroke="#ffb547" stroke-dasharray="2 1.5"/>',
  isomers: '<path d="M5 20h22" stroke="#c8d1e2" stroke-width="1.4"/><g fill="#4f586d"><circle cx="5" cy="20" r="3"/><circle cx="10.5" cy="20" r="3"/><circle cx="16" cy="20" r="3"/><circle cx="21.5" cy="20" r="3"/><circle cx="27" cy="20" r="3"/></g><path d="M38 20h20M48 20V9M48 20v0" stroke="#c8d1e2" stroke-width="1.4"/><g fill="#4f586d"><circle cx="38" cy="20" r="3"/><circle cx="48" cy="20" r="3"/><circle cx="58" cy="20" r="3"/><circle cx="48" cy="9" r="3"/></g><circle cx="48" cy="27" r="3" fill="#72d4e8"/><path d="M48 23v1" stroke="#c8d1e2"/>',
  names: '<path d="M8 20h40M24 20V8" stroke="#ffb547" stroke-width="1.6"/><g fill="#4f586d" stroke="#ffb547"><circle cx="8" cy="20" r="3.4"/><circle cx="24" cy="20" r="3.4"/><circle cx="40" cy="20" r="3.4"/></g><circle cx="24" cy="8" r="3.4" fill="#4f586d"/><text x="58" y="23" font-size="9" fill="#e8ecf4" text-anchor="middle" font-family="monospace">2-</text>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i], init = JSON.parse(JSON.stringify(L.init || {}));
  S.lesson = i; S.hl = null; drag = null;
  S.at = [START]; S.bd = {}; S.hist = []; S.got = {};
  S.mol = 0; S.yaw = 0.6; S.pitch = 0.35; S.spin = true; S.ans = {}; S.wrong = 0;
  S.n = 5; S.iso = { 4: {}, 5: {}, 6: {} }; S.lastCanon = null;
  S.nm = 0; S.chain = []; S.named = {};
  Object.assign(S, init);
  save();
  scene.classList.toggle('rot', L.id === 'structure');
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'carbon') now = `Конструктор углеродного скелета на плоском поле. Атомов C: ${m.n}, водород расставляется автоматически: H = ${m.H}, формула ${fml(m.n, m.H)}. Связей C–C: ${m.nb}, π-связей (лишних черт кратных связей): ${m.pi}, колец: ${m.rings}, самая длинная цепь: ${m.chainLen} атомов. Цели (цепь из 5, разветвление, кольцо, кратная связь) достигнуты: ${GOALS.filter(([k]) => S.got[k]).map(([, n]) => n).join(', ') || 'пока ни одной'}.`;
  if (id === 'structure') now = `Объёмная модель молекулы «${m.M.name}» (${m.M.cond}), её можно вращать. Транспортир показывает угол ${m.M.pair}: настоящий ${fmt(m.real, 1)}°, видимый на экране ${isFinite(m.seen) ? Math.round(m.seen) : '—'}°. У атома углерода σ-связей ${m.M.sig}, π-связей ${m.M.pi}. Ученик выбирает тип гибридизации (sp³, sp², sp) для метана, этилена и ацетилена. Верно определены: ${MOL3.filter((x, i) => S.ans[i]).map(x => x.name).join(', ') || 'пока ни одна'}; ошибок: ${S.wrong}. Не называй гибридизацию для ещё не отвеченных молекул — спрашивай про число σ-связей и угол.`;
  if (id === 'isomers') now = `Конструктор изомеров алканов, выбрана формула ${fml(S.n, 2 * S.n + 2)} (всего изомеров ${ISO_N[S.n]}). На поле ${m.n} атомов C${m.canon ? `, собран скелет «${m.name}»` : ''}. Найдено: ${Object.values(S.iso[S.n]).join(', ') || 'пока ни одного'}. Для задания нужны все 3 изомера C₅H₁₂, найдено ${m.found5}. Не называй ненайденные изомеры — подскажи вопросом, куда ещё можно прикрепить атом углерода.`;
  if (id === 'names') {
    const G = m.G, bonds = []; G.V.forEach(i => G.adj[i].forEach(j => { if (j > i) bonds.push(`a${i + 1}–a${j + 1}`); }));
    now = `Молекула ${S.nm + 1} из ${NM.length}: алкан из ${m.nC} атомов углерода, атомы a1…a${m.nC}, связи ${bonds.join(', ')}. Ученик отметил цепь: ${S.chain.length ? S.chain.map(i => 'a' + (i + 1)).join(' → ') + ' (первый — C1)' : 'пока нет'}. ${m.user ? `Его название: «${m.user}», ` : ''}статус: ${{ empty: 'цепь не выбрана', grow: 'цепь можно продолжить', short: 'цепь не самая длинная', ok: 'название верное', flip: 'цепь верная, но нумерация не с того конца', other: 'есть другая такая же длинная цепь с большим числом заместителей' }[m.status]}. Названо верно ${m.named} из 3 нужных. Не называй правильное название сам — веди по шагам: самая длинная цепь, нумерация, заместители.`;
  }
  return [
    `Предмет: химия, 10 класс. Тема «Основы органики». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Веди ученика наводящими вопросами, а не готовыми ответами.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    carbon: 'Почему углерод образует цепи, а кремний почти нет?', structure: 'Почему у метана угол 109,5°, а не 90°?',
    isomers: 'Почему разветвлённые изомеры кипят при более низкой температуре?', names: 'Как выбрать главную цепь, если длинных цепей несколько?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
