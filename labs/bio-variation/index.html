<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по биологии, 10 класс: изменчивость — мутации, модификации и норма реакции, наследственные болезни.">
<title>Изменчивость</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --leaf:#5fbf6a;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .lbl{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:19%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 15px/1.4 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feat{display:grid;gap:6px}
.feat div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;border-left:4px solid var(--line)}
.feat b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#bio'" onkeydown="if(event.key==='Enter')location.href='/#bio'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M14 7C26 13 14 27 26 33M26 7C14 13 26 27 14 33" fill="none" stroke="var(--ok)" stroke-width="1.6" stroke-linecap="round"/><path d="M16 12h8M15 20h10M16 28h8" stroke="var(--fg)" stroke-width="1.3" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="var(--force)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Изменчивость</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Лабораторный стол">
    <svg class="scene" id="scene" role="img" aria-label="Лабораторный стол с опытом. Предметы можно нажимать и перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = x => (Math.round(x * 10) / 10).toString();
const ru = (x, d = 1) => x.toFixed(d).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-bio-variation';
const OK = '#86e0a8', WARN = '#ff8a73', ORA = '#ffb547', CY = '#72d4e8', VIO = '#b48cff';

// ---------- lesson 1: mutations (start of the human β-globin gene, HBB) ----------
const ORIG = 'ATGGTGCACCTGACTCCTGAGGAGAAG';
const CODE = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const NI = { T: 0, C: 1, A: 2, G: 3 };
const AAN = { F: 'Фен', L: 'Лей', S: 'Сер', Y: 'Тир', C: 'Цис', W: 'Три', P: 'Про', H: 'Гис', Q: 'Глн', R: 'Арг', I: 'Иле', M: 'Мет', T: 'Тре', N: 'Асн', K: 'Лиз', V: 'Вал', A: 'Ала', D: 'Асп', E: 'Глу', G: 'Гли', '*': 'Стоп' };
const NC = { A: '#86e0a8', T: '#ff8a73', G: '#ffb547', C: '#72d4e8' };
const COMP = { A: 'T', T: 'A', G: 'C', C: 'G' };
const aaOf = c => CODE[NI[c[0]] * 16 + NI[c[1]] * 4 + NI[c[2]]];
function translate(s) { const aa = []; let stop = -1; for (let i = 0; i + 3 <= s.length; i += 3) { const a = aaOf(s.substr(i, 3)); aa.push(a); if (a === '*') { stop = aa.length - 1; break; } } return { aa, stop }; }
const P0 = translate(ORIG).aa;
const TY = {
  none: { n: 'Исходный ген', s: 'мутаций нет', c: '#8b96ad' },
  silent: { n: 'Молчащая', s: 'кодон другой, а аминокислота та же', c: OK },
  missense: { n: 'Замена аминокислоты', s: 'в белке другой «кирпичик»', c: ORA },
  nonsense: { n: 'Преждевременный стоп', s: 'белок оборвался', c: WARN },
  frameshift: { n: 'Сдвиг рамки', s: 'все следующие кодоны читаются иначе', c: VIO },
  inframe: { n: 'Целый кодон', s: 'выпал или вставлен целый триплет', c: CY },
};
const TYK = ['silent', 'missense', 'nonsense', 'frameshift'];
function classify(s) {
  if (s === ORIG) return 'none';
  const d = s.length - ORIG.length;
  if (d % 3 !== 0) return 'frameshift';
  if (d !== 0) return 'inframe';
  const t = translate(s);
  if (t.stop >= 0 && t.stop < P0.length) return 'nonsense';
  return t.aa.some((a, i) => a !== P0[i]) ? 'missense' : 'silent';
}

// ---------- lesson 2: modifications (leaf length, one tree) ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const COND = { sun: { name: 'Солнце', side: 'солнечная сторона', mu: 6, sd: 1.1, seed: 11, c: '#b9e06a' }, shade: { name: 'Тень', side: 'теневая сторона', mu: 9, sd: 1.2, seed: 29, c: '#3f9e60' } };
const POOL = {};
for (const k in COND) { const r = rng(COND[k].seed), a = []; while (a.length < 60) { const u = r() || 1e-9, v = r(); a.push(clamp(Math.round(COND[k].mu + COND[k].sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)), 3, 13)); } POOL[k] = a; }
const HX0 = 200, BW = 27, HB = 350, HT = 158;
const vx = v => HX0 + (v - 2.5) * BW;

// ---------- lesson 3: hereditary diseases ----------
const MODES = { pku: 'Фенилкетонурия', hemo: 'Гемофилия', down: 'Синдром Дауна' };
const GOPT = { pku: { m: ['AA', 'Aa', 'aa'], f: ['AA', 'Aa', 'aa'] }, hemo: { m: ['HH', 'Hh', 'hh'], f: ['H', 'h'] } };
const MB = [249, 242, 198, 190, 181, 171, 159, 145, 138, 134, 135, 133, 114, 107, 102, 90, 83, 80, 59, 64, 47, 51, 156];
const ACRO = [12, 13, 14, 20, 21];
const RISK = [[20, 1500], [25, 1350], [30, 940], [35, 350], [40, 100], [45, 30]];

const LESSONS = [
  { id: 'mutations', title: 'Мутации: опечатки в ДНК',

    why: 'Агроном знает норму реакции сорта: сколько центнеров пшеницы с гектара даст поле при хорошем увлажнении и сколько в засуху. В Северном Казахстане от этого зависит, окупится ли посев. Зоотехник поднимает удой кормами, но не выше предела породы. Тренер и диетолог работают с модификациями человека: сила и выносливость растут от тренировок, но в границах генов. А вариационный ряд и среднее значение — основа контроля качества на любом заводе.',

    stage: 'Нажимайте на мать и отца, чтобы менять генотипы. Случай выбирается кнопками внизу.',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function resetSeq() { S.seq = (LESSONS[0].gene || ORIG).split('').map((b, i) => ({ b, o: i })); S.sel = -1; }
function resetLesson() {
  const L = LESSONS[S.lesson];
  resetSeq(); S.found = {};
  S.cond = L.cond || 'sun'; S.n = { sun: 0, shade: 0 }; S.mark = { sun: null, shade: null }; S.okc = { sun: false, shade: false }; S.fresh = -1e9;
  S.mode = L.mode || 'pku'; S.g = { pku: { m: 'AA', f: 'AA' }, hemo: { m: 'HH', f: 'H' } }; S.got = { pku: false, hemo: false, down: false }; S.kSel = -1; S.age = 30;
}

// ---------- models ----------
const seqStr = () => S.seq.map(x => x.b).join('');
function stats(c) {
  const n = S.n[c], vals = POOL[c].slice(0, n), cnt = {};
  for (let v = 3; v <= 13; v++) cnt[v] = 0;
  vals.forEach(v => cnt[v]++);
  const sum = vals.reduce((a, b) => a + b, 0), M = n ? sum / n : 0;
  const sd = n ? Math.sqrt(vals.reduce((a, v) => a + (v - M) * (v - M), 0) / n) : 0;
  return { n, cnt, sum, M, sd, min: n ? Math.min(...vals) : 0, max: n ? Math.max(...vals) : 0 };
}
const pStatus = (mode, who) => { const g = S.g[mode][who]; if (mode === 'pku') return g === 'aa' ? 'sick' : g.includes('a') ? 'car' : 'ok'; if (who === 'f') return g === 'h' ? 'sick' : 'ok'; return g === 'hh' ? 'sick' : g.includes('h') ? 'car' : 'ok'; };
function kids(mode) {
  const g = S.g[mode], out = [], mg = g.m.split(''), fg = mode === 'pku' ? g.f.split('') : [g.f, 'Y'];
  for (const a of mg) for (const b of fg) {
    if (mode === 'pku') { const gt = [a, b].sort().join(''); out.push({ a, b, gt, fem: null, st: gt === 'aa' ? 'sick' : gt.includes('a') ? 'car' : 'ok' }); }
    else if (b === 'Y') out.push({ a, b, gt: a + 'Y', fem: false, st: a === 'h' ? 'sick' : 'ok' });
    else { const gt = [a, b].sort().join(''); out.push({ a, b, gt, fem: true, st: gt === 'hh' ? 'sick' : gt.includes('h') ? 'car' : 'ok' }); }
  }
  return out;
}
function downRisk(age) {
  const a = clamp(age, 18, 47); let i = 0; while (i < RISK.length - 2 && a > RISK[i + 1][0]) i++;
  const [a0, n0] = RISK[i], [a1, n1] = RISK[i + 1], t = (a - a0) / (a1 - a0);
  return Math.exp(Math.log(n0) + t * (Math.log(n1) - Math.log(n0)));
}
function model() {
  const id = LID();
  if (id === 'mutations') {
    const s = seqStr(), type = classify(s);
    return { kind: 'mut', s, len: s.length, type, tr: translate(s), foundN: TYK.filter(k => S.found[k]).length };
  }
  if (id === 'mods') {
    const st = stats(S.cond), mk = S.mark[S.cond];
    return { kind: 'mods', cond: S.cond, st, mark: mk, ok: st.n >= 30 && mk !== null && Math.abs(mk - st.M) <= 0.3, okc: S.okc };
  }
  const m = { kind: 'dis', mode: S.mode, got: S.got };
  if (S.mode !== 'down') {
    const k = kids(S.mode); m.kids = k; m.sick = k.filter(x => x.st === 'sick').length; m.car = k.filter(x => x.st === 'car').length;
    m.ms = pStatus(S.mode, 'm'); m.fs = pStatus(S.mode, 'f');
    const sons = k.filter(x => x.fem === false); m.sons = sons.length; m.sickSons = sons.filter(x => x.st === 'sick').length;
    m.goal = S.mode === 'pku' ? (S.g.pku.m === 'Aa' && S.g.pku.f === 'Aa') : (S.g.hemo.m === 'Hh' && S.g.hemo.f === 'H');
  }
  m.risk = downRisk(S.age);
  return m;
}

// ---------- lesson 1 actions ----------
function afterEdit() {
  const s = seqStr(), t = classify(s);
  if (TYK.includes(t) && !S.found[t]) {
    S.found[t] = true;
    const sickle = s.length === ORIG.length && s[19] === 'T' && s.split('').every((b, i) => i === 19 || b === ORIG[i]);
    toast(sickle ? 'Найдено: замена аминокислоты. Глу → Вал в 7-м кодоне — та самая мутация серповидноклеточной анемии!' : `Найден тип: ${TY[t].n.toLowerCase()} — ${TY[t].s}.`);
  } else if (t === 'inframe') toast('Выпал или вставлен целый кодон: рамка не сдвинулась, белок стал на одну аминокислоту короче или длиннее.');
  renderTools(); update();
}
function subst(b) {
  if (S.sel < 0) { toast('Сначала нажмите на нуклеотид в гене.'); return; }
  if (S.seq[S.sel].b === b) { toast(`Здесь уже ${b}. Выберите другую букву.`); return; }
  S.seq[S.sel].b = b; afterEdit();
}
function insertN() {
  if (S.sel < 0) { toast('Нажмите на нуклеотид: новый встанет после него.'); return; }
  if (S.seq.length >= 30) { toast('Хватит вставок: удалите лишнее или сбросьте ген.'); return; }
  S.seq.splice(S.sel + 1, 0, { b: 'A', o: null }); S.sel++; afterEdit();
}
function deleteN() {
  if (S.sel < 0) { toast('Сначала нажмите на нуклеотид, который нужно удалить.'); return; }
  if (S.seq.length <= 24) { toast('Ген стал слишком коротким. Сбросьте его.'); return; }
  S.seq.splice(S.sel, 1); S.sel = Math.min(S.sel, S.seq.length - 1); afterEdit();
}

// ---------- lesson 2 actions ----------
function pick() {
  const c = S.cond;
  if (S.n[c] >= 60) { toast('В выборке уже 60 листьев — этого с запасом хватит.'); return; }
  S.n[c] = Math.min(60, S.n[c] + 10); S.fresh = performance.now();
  if (S.n[c] === 30) toast('30 листьев собрано. Найдите среднюю длину и поставьте маркер.');
  update();
}
function setCond(c) { S.cond = c; renderTools(); buildScheme(); update(); }

// ---------- lesson 3 actions ----------
function cycle(who) {
  if (S.mode === 'down') return;
  const o = GOPT[S.mode][who], g = S.g[S.mode];
  g[who] = o[(o.indexOf(g[who]) + 1) % o.length]; update();
}
function setMode(md) { S.mode = md; S.kSel = -1; renderTools(); buildScheme(); update(); }
function tapKaryo(i) {
  S.kSel = i;
  if (i === 20) {
    if (!S.got.down) { S.got.down = true; toast('Верно! В 21-й паре три хромосомы — трисомия по 21-й хромосоме.'); }
    else toast('21-я пара: три хромосомы вместо двух.');
  } else toast(i === 22 ? 'Половые хромосомы XX — это девочка. Их две, всё в норме.' : `Пара ${i + 1}: две хромосомы — норма.`);
  update();
}

// ---------- drawing helpers ----------
function bench() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4000" fill="url(#tile)"/>`;
}
const lbl = (x, y, s, size = 10.5, fill = '#8b96ad', anchor = 'middle', extra = '') => `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const gtM = (mode, gt, svg) => mode === 'pku' ? gt : gt.split('').map(ch => ch === 'Y' ? 'Y' : 'X' + (svg ? `<tspan baseline-shift="super" font-size="70%">${ch}</tspan>` : `<sup>${ch}</sup>`)).join('');

// ---------- lesson 1 scene ----------
function mutScene() {
  let h = bench();
  const s = seqStr(), tr = translate(s), n = Math.ceil(s.length / 3), t = classify(s);
  h += lbl(12, 112, 'ДНК, кодирующая цепь · начало гена β-глобина', 10.5, '#c9d3e6', 'start', 'font-weight="600"');
  for (let c = 0; c < n; c++) {
    const x = 12 + (c % 3) * 168, y = 126 + Math.floor(c / 3) * 64, cod = s.substr(c * 3, 3);
    h += `<g>`;
    for (let j = 0; j < 3 && c * 3 + j < s.length; j++) {
      const i = c * 3 + j, nb = S.seq[i], b = nb.b, sel = S.sel === i, mut = nb.o === null || b !== ORIG[nb.o];
      h += `<g data-hit="n${i}"><rect x="${x + j * 35}" y="${y}" width="33" height="30" rx="6" fill="${NC[b]}" fill-opacity=".18" stroke="${sel ? '#ffffff' : NC[b]}" stroke-width="${sel ? 2.6 : 1.2}"/>`;
      h += `<text x="${x + j * 35 + 16.5}" y="${y + 20}" font-size="15" font-weight="600" fill="${NC[b]}" text-anchor="middle">${b}</text>`;
      if (mut) h += `<circle cx="${x + j * 35 + 28}" cy="${y + 5}" r="3" fill="#ffffff"/>`;
      h += `</g>`;
    }
    if (cod.length === 3) h += `<text x="${x + 52}" y="${y + 44}" font-size="9.5" fill="#8b96ad" text-anchor="middle">мРНК ${cod.replace(/T/g, 'U')}</text>`;
    const px = x + 110, a = c < tr.aa.length ? tr.aa[c] : null;
    let fill = '#1a2438', stroke = '#3a4866', tc = '#e8ecf4';
    const txt = a ? AAN[a] : (cod.length < 3 ? '…' : '—');
    if (a === '*') { fill = WARN; stroke = WARN; tc = INK; }
    else if (a && a !== P0[c]) { stroke = ORA; tc = ORA; }
    else if (!a) { tc = '#56627d'; stroke = '#26324a'; }
    h += `<rect x="${px}" y="${y + 3}" width="48" height="24" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>` + lbl(px + 24, y + 19, txt, 11, tc, 'middle', 'font-weight="600"');
    h += `</g>`;
  }
  const prot = tr.aa.map(a => AAN[a]).join('–');
  h += `<g data-hit="prot">` + lbl(12, 396, 'Белок:', 10.5, '#8b96ad', 'start') + `<text x="58" y="396" font-size="10.5" fill="${TY[t].c}">${prot}</text></g>`;
  return h;
}

// ---------- lesson 2 scene ----------
function leafPath(x, y, L, ang, fill) {
  const w = L * 0.42;
  return `<path transform="translate(${f(x)} ${f(y)}) rotate(${ang})" d="M0 0Q${f(w)} ${f(-L * 0.45)} 0 ${f(-L)}Q${f(-w)} ${f(-L * 0.45)} 0 0Z" fill="${fill}" fill-opacity=".9" stroke="#0e1520" stroke-width=".8"/>`;
}
const LEAFS = [[60, 190, -40], [80, 165, -15], [110, 160, 15], [135, 185, 40], [70, 220, -60], [95, 200, 0], [125, 215, 55], [55, 250, -80], [140, 250, 80], [100, 240, 10], [80, 260, -30], [120, 265, 35]];
function modsScene(t) {
  let h = bench();
  const c = S.cond, C = COND[c], st = stats(c), other = c === 'sun' ? 'shade' : 'sun', so = stats(other);
  // tree
  h += `<g data-hit="tree"><rect x="20" y="110" width="160" height="285" fill="transparent"/>`;
  if (c === 'sun') h += `<circle cx="44" cy="124" r="13" fill="#ffd166"/>` + Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<path d="M${f(44 + Math.cos(a) * 17)} ${f(124 + Math.sin(a) * 17)}L${f(44 + Math.cos(a) * 23)} ${f(124 + Math.sin(a) * 23)}" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>`; }).join('');
  else h += `<rect x="156" y="112" width="34" height="240" fill="#0a0f18" stroke="#26324a"/><path d="M156 112L30 352H156Z" fill="rgba(4,7,13,.35)"/>` + lbl(173, 128, 'дом', 9, '#56627d');
  h += `<rect x="92" y="250" width="14" height="102" rx="3" fill="#6b4f36"/><path d="M99 300L72 262M99 285L128 252" stroke="#6b4f36" stroke-width="5" stroke-linecap="round"/>`;
  h += `<ellipse cx="99" cy="215" rx="72" ry="70" fill="${c === 'sun' ? 'rgba(120,180,90,.16)' : 'rgba(60,120,80,.14)'}" stroke="rgba(134,224,168,.25)"/>`;
  LEAFS.forEach(([x, y, a], i) => { const L = (C.mu + ((i * 7) % 5 - 2) * 0.5) * 3; h += leafPath(x, y, L, a, C.c); });
  h += `<path d="M30 352H170" stroke="#3a4866" stroke-width="2"/>` + lbl(99, 372, C.side, 10.5, '#c9d3e6', 'middle', 'font-weight="600"') + lbl(99, 386, 'нажмите — сорвать 10', 9, '#56627d');
  h += `</g>`;
  // histogram
  const mx = Math.max(4, ...Object.values(st.cnt), ...Object.values(so.cnt)), hh = Math.min(14, (HB - HT - 4) / mx);
  h += `<g data-drag="mk"><rect x="${HX0 - 8}" y="${HT - 30}" width="${vx(13.5) - HX0 + 16}" height="${HB - HT + 80}" fill="transparent"/>`;
  h += `<rect x="${HX0}" y="${HT}" width="${vx(13.5) - HX0}" height="${HB - HT}" fill="rgba(18,26,40,.6)" stroke="#26324a"/>`;
  for (let k = 0; k <= mx; k += mx > 10 ? 5 : 2) h += `<path d="M${HX0} ${f(HB - k * hh)}h${vx(13.5) - HX0}" stroke="rgba(139,150,173,.12)"/><text x="${HX0 - 4}" y="${f(HB - k * hh + 3)}" font-size="8.5" fill="#8b96ad" text-anchor="end">${k}</text>`;

const slotXY = i => [46 + (i % 6) * 86, 180 + Math.floor(i / 6) * 66];

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };

  tap(d.hit);
}
scene.addEventListener('pointerup', () => endDrag(false));

function tap(id) {

  if (L === 'mods') {

  }

    if (id === 'mom') cycle('m');
    if (id === 'dad') cycle('f');
    if (/^k\d+$/.test(id)) tapKaryo(+id.slice(1));
  }
}

  el.querySelectorAll('#bChips button').forEach(b => b.onclick = () => subst(b.dataset.b));
  el.querySelectorAll('#cChips button').forEach(b => b.onclick = () => setCond(b.dataset.c));
  el.querySelectorAll('#mChips button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  el.querySelectorAll('#gmChips button').forEach(b => b.onclick = () => { S.g[S.mode].m = b.dataset.g; update(); });
  el.querySelectorAll('#gfChips button').forEach(b => b.onclick = () => { S.g[S.mode].f = b.dataset.g; update(); });
  el.querySelectorAll('.row [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.innerHTML = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  const press = (s, fn) => el.querySelectorAll(s).forEach(b => b.setAttribute('aria-pressed', fn(b)));
  if (m.kind === 'mut') {
    set('#r1', S.sel >= 0 ? `${S.sel + 1} (${S.seq[S.sel].b})` : '—'); set('#r2', m.len + ' нукл.'); set('#r3', ru(m.len / 3, m.len % 3 ? 1 : 0));
    press('#bChips button', b => S.sel >= 0 && S.seq[S.sel].b === b.dataset.b);
    set('#fList', TYK.map(k => step(TY[k].n, S.found[k] ? '✓ найдена' : '—')).join(''));
  } else if (m.kind === 'mods') {
    const st = m.st;
    set('#inMarkO', m.mark === null ? 'не поставлен' : ru(m.mark) + ' см'); val('#inMark', m.mark === null ? 8 : m.mark);
    set('#r1', st.n); set('#r2', st.n ? `${st.min}–${st.max} см` : '—'); set('#r3', S.okc[m.cond] ? ru(st.M, 2) + ' см' : '?');
    press('#cChips button', b => b.dataset.c === S.cond);
  } else {
    press('#mChips button', b => b.dataset.m === S.mode);
    if (S.mode !== 'down') {
      press('#gmChips button', b => b.dataset.g === S.g[S.mode].m); press('#gfChips button', b => b.dataset.g === S.g[S.mode].f);
      set('#r1', `${m.sick * 25} %`); set('#r2', `${m.car * 25} %`); set('#r3', S.mode === 'hemo' ? `${m.sickSons} из ${m.sons}` : `${(4 - m.sick - m.car) * 25} %`);
    } else {
      set('#inAgeO', S.age + ' лет'); val('#inAge', S.age);
      set('#r1', `1 из ${Math.round(m.risk)}`); set('#r2', ru(100 / m.risk, 2) + ' %'); set('#r3', S.got.down ? 'да ✓' : 'нет');
    }
  }
}

    { id: 'res', icon: dot(WARN), name: 'Итог', spec: 'Вероятность родить больного ребёнка или носителя. Каждая клетка решётки — 1/4 = 25 %.' }];

function calcHTML(m) {
  const id = LID();
  if (id === 'mutations') {
    let h = `<h2>Как ген читается в белок</h2><div class="formula">ДНК → мРНК → белок</div>`;
    const c = S.sel >= 0 ? Math.floor(S.sel / 3) : -1, cod = c >= 0 ? m.s.substr(c * 3, 3) : '';
    if (cod.length === 3) {
      const tpl = cod.split('').map(b => COMP[b]).join('');
      h += `<div class="steps">` + step('Кодон №', c + 1) + step('Кодирующая цепь ДНК', cod) + step('Матричная цепь (комплементарна)', tpl) +
        step('мРНК (комплементарна матричной)', cod.replace(/T/g, 'U')) + step('Аминокислота', AAN[aaOf(cod)], 'sum') +
        (c < 9 ? step('В исходном гене', `${ORIG.substr(c * 3, 3).replace(/T/g, 'U')} → ${AAN[P0[c]]}`) : '') + `</div>`;
    } else h += `<p class="note">${c >= 0 ? 'Этот кодон неполный: в нём меньше трёх нуклеотидов, рибосома его не прочитает.' : 'Нажмите на нуклеотид — здесь появится разбор его кодона.'}</p>`;
    h += `<h3>Белок до и после</h3><div class="steps">` + step('Исходный', P0.map(a => AAN[a]).join('-')) + step('Сейчас', m.tr.aa.map(a => AAN[a]).join('-')) +
      step('Длина ДНК', `${m.len} = 3 × ${Math.floor(m.len / 3)}${m.len % 3 ? ' + ' + (m.len % 3) : ''}`) + step('Тип мутации', TY[m.type].n, 'sum') + `</div>`;
    h += `<h3>Сколько новых мутаций у каждого</h3><div class="formula">μ × N</div><div class="steps">` + step('Частота замены μ', '≈ 1·10⁻⁸ на нуклеотид') +
      step('Нуклеотидов в клетке N', '≈ 6·10⁹ (два набора)') + step('Новых мутаций', '6·10⁹ × 1·10⁻⁸ ≈ 60', 'sum') + `</div>` +
      `<p class="note" style="margin-top:8px">Около 60 новых мутаций получает каждый человек от родителей. Почти все попадают в участки ДНК, которые не кодируют белки (кодирующих всего около 1,5 %), и ничем себя не проявляют.</p>`;
    return h;
  }
  if (id === 'mods') {
    const st = m.st, c = m.cond, okc = S.okc[c];
    let h = `<h2>Вариационный ряд: ${COND[c].side}</h2><div class="formula">M = Σ(v · p) ÷ n</div>`;
    if (!st.n) return h + `<p class="note">Соберите листья — здесь появится таблица.</p>`;
    h += `<div class="steps">` + step('Длина v → число p', 'v · p');
    for (let v = 3; v <= 13; v++) if (st.cnt[v]) h += step(`${v} см → ${st.cnt[v]} шт.`, `${v} × ${st.cnt[v]} = ${v * st.cnt[v]}`);
    h += step('Σ(v · p)', st.sum) + step('n', st.n) + step('M', okc ? `${st.sum} ÷ ${st.n} = ${ru(st.M, 2)} см` : `${st.sum} ÷ ${st.n} = ? (посчитайте и поставьте маркер)`, 'sum') + `</div>`;
    if (okc) h += `<h3>Разброс</h3><div class="steps">` + step('Размах', `${st.min}–${st.max} см`) + step('Стандартное отклонение σ', `≈ ${ru(st.sd, 2)} см`) + step('M ± 2σ (около 95 % листьев)', `${ru(st.M - 2 * st.sd)}–${ru(st.M + 2 * st.sd)} см`) + `</div>`;
    if (S.okc.sun && S.okc.shade) { const a = stats('sun'), b = stats('shade'); h += `<h3>Солнце и тень</h3><div class="steps">` + step('Средняя на солнце', ru(a.M, 2) + ' см') + step('Средняя в тени', ru(b.M, 2) + ' см') + step('Разница', ru(b.M - a.M, 2) + ' см', 'sum') + `</div><p class="note" style="margin-top:8px">Генотип у всех листьев один — разницу дала среда. Это модификационная изменчивость.</p>`; }
    return h;
  }
  if (S.mode === 'down') {
    const r = m.risk;
    return `<h2>Синдром Дауна</h2><div class="formula">46 + 1 = 47 хромосом</div><div class="steps">` +
      step('1. Мейоз у матери', 'пара 21 не разошлась') + step('2. Яйцеклетка', '24 хромосомы (две 21-х)') + step('3. Сперматозоид', '23 хромосомы') + step('4. Зигота', '24 + 23 = 47', 'sum') + `</div>` +
      `<h3>Риск при возрасте матери ${S.age} лет</h3><div class="steps">` + step('Примерно', `1 из ${Math.round(r)}`) + step('В процентах', `100 ÷ ${Math.round(r)} ≈ ${ru(100 / r, 2)} %`, 'sum') +
      RISK.map(([a, n]) => step(`${a} лет`, `≈ 1 из ${n}`)).join('') + `</div><p class="note" style="margin-top:8px">Приближённые данные для живорождённых. Яйцеклетки закладываются ещё до рождения девочки и долго «ждут» в мейозе, поэтому с возрастом нерасхождение случается чаще.</p>`;
  }
  const md = S.mode, g = S.g[md], mg = g.m.split(''), fg = md === 'pku' ? g.f.split('') : [g.f, 'Y'];
  let h = `<h2>${MODES[md]}: решётка Пеннета</h2><div class="formula">P(ребёнок) = ½ × ½ = ¼</div><div class="steps">` +
    step('Мать', `${gtM(md, g.m, false)} → гаметы ${mg.map(a => gtM(md, a, false)).join(' и ')}`) + step('Отец', `${gtM(md, md === 'hemo' ? g.f + 'Y' : g.f, false)} → гаметы ${fg.map(a => gtM(md, a, false)).join(' и ')}`);
  m.kids.forEach(k => { h += step(`${gtM(md, k.a, false)} + ${gtM(md, k.b, false)}`, `${gtM(md, k.gt, false)} · ${ST_W[k.st][k.fem === true ? 0 : 1]} · ¼`); });
  h += step('Больных', `${m.sick} × ¼ = ${m.sick * 25} %`, 'sum');
  if (md === 'hemo') h += step('Среди сыновей больных', `${m.sickSons} из ${m.sons} = ${m.sons ? m.sickSons / m.sons * 100 : 0} %`);
  h += `</div><p class="note" style="margin-top:8px">${md === 'pku' ? 'A — нормальный аллель, a — мутантный. Болезнь проявляется только у aa.' : 'X<sup>H</sup> — нормальный аллель, X<sup>h</sup> — аллель гемофилии. В Y-хромосоме этого гена нет.'} Вероятность считается для каждого ребёнка отдельно: если первый ребёнок болен, риск для второго такой же.</p>`;
  return h;
}

    el.innerHTML = `<div class="k">Тип мутации</div><div class="v" style="color:${TY[m.type].c}">${TY[m.type].n}</div>
      <div class="lr"><span>длина ДНК</span><span>${m.len}</span></div><div class="lr"><span>найдено</span><span>${m.foundN} из 4</span></div>

  } else if (m.kind === 'mods') {
    el.innerHTML = `<div class="k">${COND[m.cond].name}</div><div class="v ${dn ? 'ok' : ''}">n = ${m.st.n}</div>
      <div class="lr"><span>маркер</span><span>${m.mark === null ? '—' : ru(m.mark) + ' см'}</span></div><div class="lr"><span>солнце</span><span>${S.okc.sun ? '✓' : S.n.sun + '/30'}</span></div><div class="lr"><span>тень</span><span>${S.okc.shade ? '✓' : S.n.shade + '/30'}</span></div>`;
  } else if (S.mode === 'down') {
    el.innerHTML = `<div class="k">Кариотип</div><div class="v ${dn ? 'ok' : ''}">47 хромосом</div><div class="lr"><span>норма</span><span>46</span></div><div class="lr"><span>найдено</span><span>${S.got.down ? 'да ✓' : 'нет'}</span></div>`;
  } else {
    el.innerHTML = `<div class="k">${MODES[S.mode]}</div><div class="v ${m.sick ? 'bad' : 'ok'}">больных ${m.sick * 25} %</div>

  }
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  if (m.kind === 'mods' && m.ok && !S.okc[m.cond]) { S.okc[m.cond] = true; toast(`Верно! Средняя длина листа (${COND[m.cond].side}) — ${ru(m.st.M, 2)} см.`); }
  if (m.kind === 'dis' && m.goal && !S.got[S.mode]) {
    S.got[S.mode] = true;
    toast(S.mode === 'pku' ? 'Оба родителя здоровы, но оба носители (Aa). Риск больного ребёнка — ¼, то есть 25 %.' : 'Мать — здоровая носительница, отец здоров. Половина их сыновей будет болеть гемофилией.');
  }
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Вы разобрались, откуда берётся изменчивость!'), 1800);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  mutations: '<rect x="4" y="9" width="11" height="12" rx="2" fill="#86e0a8" fill-opacity=".3" stroke="#86e0a8"/><rect x="17" y="9" width="11" height="12" rx="2" fill="#ff8a73" fill-opacity=".3" stroke="#ff8a73"/><rect x="30" y="9" width="11" height="12" rx="2" fill="#ffb547" fill-opacity=".3" stroke="#ffffff" stroke-width="1.5"/><rect x="45" y="10" width="17" height="10" rx="5" fill="#1a2438" stroke="#ffb547"/>',
  mods: '<path d="M6 26H62" stroke="#56627d"/><rect x="10" y="20" width="6" height="6" fill="#b9e06a"/><rect x="17" y="12" width="6" height="14" fill="#b9e06a"/><rect x="24" y="17" width="6" height="9" fill="#b9e06a"/><rect x="36" y="18" width="6" height="8" fill="#3f9e60"/><rect x="43" y="8" width="6" height="18" fill="#3f9e60"/><rect x="50" y="16" width="6" height="10" fill="#3f9e60"/>',
  disease: '<circle cx="14" cy="9" r="5" fill="#1a2438" stroke="#c9d3e6"/><circle cx="14" cy="9" r="1.6" fill="#ffb547"/><rect x="45" y="4" width="10" height="10" fill="#1a2438" stroke="#c9d3e6"/><path d="M19 9H45M34 9V17M22 17H46M22 17V20M46 17V20" stroke="#56627d"/><rect x="17" y="20" width="9" height="9" fill="#ff8a73"/><circle cx="46" cy="25" r="4.5" fill="#1a2438" stroke="#c9d3e6"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const ls = $('#lessons'), cur = ls.querySelector('.lesson[aria-current="true"]');
  if (cur) { const a = ls.getBoundingClientRect(), b = cur.getBoundingClientRect(); ls.scrollLeft += b.left - a.left - (a.width - b.width) / 2; }
}

window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '', guide = '';
  if (id === 'mutations') {
    const cods = m.s.match(/.{1,3}/g) || [];
    now = `Редактор гена: начало гена β-глобина человека, кодирующая цепь ДНК. Исходно ${ORIG.match(/.../g).join(' ')} → ${P0.map(a => AAN[a]).join('-')}. Сейчас ДНК (${m.len} нуклеотидов): ${cods.join(' ')} → белок ${m.tr.aa.map(a => AAN[a]).join('-')}. Тип текущего изменения: ${TY[m.type].n.toLowerCase()}. Выбран нуклеотид: ${S.sel >= 0 ? `№${S.sel + 1} (${S.seq[S.sel].b})` : 'нет'}. Найденные типы: ${TYK.filter(k => S.found[k]).map(k => TY[k].n.toLowerCase()).join(', ') || 'пока ни одного'}; не найдены: ${TYK.filter(k => !S.found[k]).map(k => TY[k].n.toLowerCase()).join(', ') || 'нет'}.`;
    guide = 'Не называй конкретную позицию и букву для замены. Спрашивай: что такое вырожденность кода, какие кодоны означают «стоп», что будет с остальными кодонами, если один нуклеотид выпадет.';
  }
  if (id === 'mods') {
    const st = m.st;
    now = `Дерево: ${COND[m.cond].side}. Собрано листьев: солнце ${S.n.sun}, тень ${S.n.shade}. Текущая выборка: n = ${st.n}, распределение по длине (см: штук) ${Object.keys(st.cnt).filter(v => st.cnt[v]).map(v => v + ': ' + st.cnt[v]).join(', ') || 'пусто'}. Маркер средней: ${m.mark === null ? 'не поставлен' : ru(m.mark) + ' см'}. Средняя найдена: солнце ${S.okc.sun ? 'да' : 'нет'}, тень ${S.okc.shade ? 'да' : 'нет'}.`;
    guide = 'Не называй готовое значение средней. Помоги посчитать Σ(v·p) и разделить на n, спроси, почему в тени листья крупнее и почему эта разница не передастся семенам.';
  }
  if (id === 'disease') {
    if (S.mode === 'down') now = `Случай «Синдром Дауна»: на столе кариотип девочки из 23 групп хромосом, ученик ищет пару с лишней хромосомой. Выбрана группа: ${S.kSel >= 0 ? (S.kSel < 22 ? S.kSel + 1 : 'половые XX') : 'нет'}. Найдено: ${S.got.down ? 'да' : 'нет'}. Возраст матери на ползунке ${S.age} лет, риск ≈ 1 из ${Math.round(m.risk)}.`;
    else now = `Случай «${MODES[S.mode]}». Генотип матери ${S.mode === 'pku' ? S.g.pku.m : S.g.hemo.m.split('').map(x => 'X' + x).join('')} (${ST_W[m.ms][0]}), отца ${S.mode === 'pku' ? S.g.pku.f : 'X' + S.g.hemo.f + 'Y'} (${ST_W[m.fs][1]}). Дети по решётке Пеннета: ${m.kids.map(k => (S.mode === 'pku' ? k.gt : k.gt.split('').map(x => x === 'Y' ? 'Y' : 'X' + x).join('')) + ' ' + ST_W[k.st][k.fem === true ? 0 : 1]).join(', ')}. Больных ${m.sick * 25} %, носителей ${m.car * 25} %.`;
    now += ` Решено: ФКУ ${S.got.pku ? 'да' : 'нет'}, гемофилия ${S.got.hemo ? 'да' : 'нет'}, синдром Дауна ${S.got.down ? 'да' : 'нет'}.`;
    guide = 'Не называй нужные генотипы и номер пары. Спрашивай: может ли здоровый человек передать рецессивную болезнь, сколько X-хромосом у мужчины, сколько хромосом должно быть в каждой паре. Говори бережно: тема может касаться семьи ученика.';
  }
  return [
    `Раздел: биология, 10 класс, тема «Изменчивость» (Наследственность и эволюция). Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Для тьютора: ${guide}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = { mutations: 'Почему некоторые мутации ничего не меняют в белке?', mods: 'Чем модификация отличается от мутации?', disease: 'Как здоровые родители могут родить больного ребёнка?' }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
