<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по алгебре, 7 класс: буквенные выражения и подобные слагаемые, линейные уравнения на весах, задачи на составление уравнений.">
<title>Выражения и уравнения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 210px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.termbtns{display:grid;gap:6px;margin-top:8px}
.termbtns div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 8px}
.termbtns b{font:500 14px/1 var(--font-mono);min-width:44px}
.termbtns span{font-size:12.5px;color:var(--muted);flex:1}
.termbtns button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.termbtns button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Алгебра</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: плитки выражения, весы уравнения и схема из отрезков. Карточки и ползунок можно перетаскивать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4';

// lesson 1: 2x + 5 − x + 3x − 2
const TERMS = [{ c: 2, k: 'x', s: '2x' }, { c: 5, k: '1', s: '+ 5' }, { c: -1, k: 'x', s: '− x' }, { c: 3, k: 'x', s: '+ 3x' }, { c: -2, k: '1', s: '− 2' }];
const EXPR = '2x + 5 − x + 3x − 2';
const val1 = x => 2 * x + 5 - x + 3 * x - 2;
// lesson 2: equations on the balance (x is the hidden weight of a box)
const EQS = [{ L: { x: 5, u: 2 }, R: { x: 2, u: 14 }, X: 4 }, { L: { x: 3, u: 4 }, R: { x: 1, u: 10 }, X: 3 }, { L: { x: 2, u: 7 }, R: { x: 0, u: 13 }, X: 3 }];
// lesson 3: 3 notebooks + 2 pens = 1450 ₸, notebook is 150 ₸ dearer
const TOTAL = 1450;
const OPTS = {
  pen: { other: 'тетрадь', list: ['x + 150', 'x − 150', '150x'], fn: [x => x + 150, x => x - 150, x => 150 * x], good: 0 },
  nb: { other: 'ручка', list: ['x + 150', 'x − 150', 'x : 150'], fn: [x => x + 150, x => x - 150, x => x / 150], good: 1 },
};

const LESSONS = [
  { id: 'letters', title: 'Буквенные выражения',
    text: ['Буквенное выражение — запись из чисел, букв и знаков действий: 2x + 5, 3(a − b), 150n. Буква здесь — переменная: вместо неё можно подставить любое число. Подставили и посчитали — нашли значение выражения.',
           'Слагаемые с одинаковой буквенной частью называют подобными: 2x, −x и 3x подобны, числа 5 и −2 тоже подобны между собой. Привести подобные слагаемые — значит сложить их коэффициенты: 2x − x + 3x = (2 − 1 + 3)x = 4x.',
           'На поле x — синяя полоска, 1 — оранжевый квадратик, минус — красная плитка. Плитки «плюс» и «минус» одного вида вместе дают ноль. Упрощённое выражение тождественно равно исходному: при любом x их значения совпадают.'],
    why: 'Продавец на базаре считает 450n ₸ за n кг яблок и не пересчитывает всё заново для каждого покупателя. Бухгалтер пишет формулу зарплаты: оклад плюс 2000 ₸ за каждый час переработки. Любая формула в Excel или Google Таблицах вроде =B2*3+C2 — это буквенное выражение, а программисты каждый день работают с переменными. Упрощённая формула считается быстрее и реже даёт ошибки.',
    task: 'Приведите подобные слагаемые в выражении 2x + 5 − x + 3x − 2: разложите карточки по корзинам. Затем найдите x, при котором значение выражения равно 15.',
    hint: 'Карточки с x — в левую корзину, числа — в правую. Красная плитка гасит одну такую же синюю или оранжевую. Потом подбирайте x кнопками и следите за значением.',
    stage: 'Тащите карточки в корзины. x меняйте кнопками внизу.',
    x: 0,
    check: m => m.all && m.x === 3 },
  { id: 'linear', title: 'Линейные уравнения',
    text: ['Уравнение — равенство с неизвестным. Корень уравнения — число, при подстановке которого получается верное равенство. Решить уравнение — найти все его корни или показать, что корней нет.',

const KEY = 'luch-math-expr';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            put: [], x1: 0, eq: 0, L: { x: 5, u: 2 }, R: { x: 2, u: 14 }, log: [], p1: null, p2: null, x3: 100 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

const coefStr = c => c === 1 ? 'x' : c === -1 ? '−x' : num(c) + 'x';
const sideStr = s => { const xs = s.x ? coefStr(s.x) : ''; return xs && s.u ? `${xs} + ${s.u}` : xs || (s.u ? String(s.u) : '0'); };
const joinTerms = idx => idx.map((i, j) => { const t = TERMS[i]; return j === 0 ? t.s.replace('+ ', '').replace('− ', '−') : t.s; }).join(' ');

function model() {
  const id = LID();
  if (id === 'letters') {
    const xs = S.put.filter(i => TERMS[i].k === 'x'), us = S.put.filter(i => TERMS[i].k === '1');
    const cx = xs.reduce((a, i) => a + TERMS[i].c, 0), cu = us.reduce((a, i) => a + TERMS[i].c, 0);
    return { kind: id, xs, us, cx, cu, placed: S.put.length, all: S.put.length === TERMS.length, x: S.x1, v: val1(S.x1) };
  }
  if (id === 'linear') {
    const E = EQS[S.eq], X = E.X, L = { ...S.L }, R = { ...S.R };
    const lv = L.x * X + L.u, rv = R.x * X + R.u, bal = lv === rv;
    const solved = bal && ((L.x === 1 && L.u === 0 && R.x === 0) || (R.x === 1 && R.u === 0 && L.x === 0));
    return { kind: id, eq: S.eq, L, R, lv, rv, bal, solved, root: solved ? (L.x ? R.u : L.u) : null, steps: S.log.length };
  }
  const o = S.p1 ? OPTS[S.p1] : null, x = S.x3;
  let other = null, lhs = null, eq = null, good = false;
  if (o && S.p2 !== null) {
    other = o.fn[S.p2](x); good = S.p2 === o.good;
    lhs = S.p1 === 'pen' ? 3 * other + 2 * x : 3 * x + 2 * other;
    eq = S.p1 === 'pen' ? `3·(${o.list[S.p2]}) + 2x = ${TOTAL}` : `3x + 2·(${o.list[S.p2]}) = ${TOTAL}`;
  }
  const pen = S.p1 === 'pen' ? x : other, nb = S.p1 === 'pen' ? other : x;
  return { kind: 'word', p1: S.p1, p2: S.p2, x, other, lhs, eq, good, pen, nb, ok: good && lhs === TOTAL };
}

// ---------- geometry (SVG units, 520 × 405) ----------
const T = (x, y, s, txt, fill = MUTED, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const L = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const R = (x, y, w, h, fill, extra = '') => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${(+w).toFixed(1)}" height="${(+h).toFixed(1)}" fill="${fill}" ${extra}/>`;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;

// ---------- lesson 1: tiles ----------
const CARD = i => [29 + i * 94 + 43, 149];           // card centre
const XBIN = [29, 210, 226, 125], UBIN = [265, 210, 226, 125];
const inBox = (b, x, y) => x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3];
const xt = (x, y, neg, op = 1) => `<g opacity="${op}">${R(x, y, 12, 40, neg ? RED : BLUE, `rx="3" stroke="${INK}" stroke-width="1.4"`)}${T(x + 6, y + 24, 8.5, neg ? '−x' : 'x', INK, 'middle', 'font-weight="500"')}</g>`;
const ut = (x, y, neg, op = 1) => `<g opacity="${op}">${R(x, y, 12, 12, neg ? RED : ORANGE, `rx="2.5" stroke="${INK}" stroke-width="1.4"`)}</g>`;
function cardSVG(i, cx, cy, lifted) {
  const t = TERMS[i], n = Math.abs(t.c), neg = t.c < 0;
  let h = `<g data-drag="c${i}">` + R(cx - 43, cy - 41, 86, 82, lifted ? '#22304a' : '#1a2438', `rx="10" stroke="${lifted ? FG : '#33405c'}" stroke-width="${lifted ? 1.8 : 1.3}"`);
  h += T(cx, cy - 20, 14, t.s, FG, 'middle', 'font-weight="500"');
  if (t.k === 'x') { const x0 = cx - (n * 18 - 6) / 2; for (let j = 0; j < n; j++) h += xt(x0 + j * 18, cy - 10, neg); }
  else { const x0 = cx - (n * 15 - 3) / 2; for (let j = 0; j < n; j++) h += ut(x0 + j * 15, cy + 4, neg); }
  return h + '</g>';
}
function binSVG(m) {
  let h = '';
  const box = (b, title, col) => R(b[0], b[1], b[2], b[3], 'rgba(26,36,56,.5)', `rx="12" stroke="${col}" stroke-width="1.3" stroke-dasharray="6 4"`) + T(b[0] + 12, b[1] + 18, 11, title, MUTED, 'start');
  h += box(XBIN, 'слагаемые с x', BLUE) + box(UBIN, 'числа', ORANGE);
  // x bin: positive bars on top row, negative under them; aligned pairs give zero
  const pX = m.xs.filter(i => TERMS[i].c > 0).reduce((a, i) => a + TERMS[i].c, 0), nX = -m.xs.filter(i => TERMS[i].c < 0).reduce((a, i) => a + TERMS[i].c, 0);
  const pU = m.us.filter(i => TERMS[i].c > 0).reduce((a, i) => a + TERMS[i].c, 0), nU = -m.us.filter(i => TERMS[i].c < 0).reduce((a, i) => a + TERMS[i].c, 0);
  const zx = Math.min(pX, nX), zu = Math.min(pU, nU);
  for (let j = 0; j < pX; j++) h += xt(XBIN[0] + 16 + j * 20, 230, false, j < zx ? .35 : 1);
  for (let j = 0; j < nX; j++) h += xt(XBIN[0] + 16 + j * 20, 276, true, j < zx ? .35 : 1);
  for (let j = 0; j < zx; j++) h += T(XBIN[0] + 22 + j * 20, 330, 10, '0', GREEN);
  for (let j = 0; j < pU; j++) h += ut(UBIN[0] + 16 + j * 18, 236, false, j < zu ? .35 : 1);
  for (let j = 0; j < nU; j++) h += ut(UBIN[0] + 16 + j * 18, 258, true, j < zu ? .35 : 1);
  for (let j = 0; j < zu; j++) h += T(UBIN[0] + 22 + j * 18, 284, 10, '0', GREEN);
  if (m.xs.length) h += T(XBIN[0] + XBIN[2] - 12, XBIN[1] + 18, 13, coefStr(m.cx), BLUE, 'end', 'font-weight="500"');
  if (m.us.length) h += T(UBIN[0] + UBIN[2] - 12, UBIN[1] + 18, 13, num(m.cu), ORANGE, 'end', 'font-weight="500"');
  if (m.xs.length) h += T(XBIN[0] + XBIN[2] - 12, XBIN[1] + XBIN[3] - 12, 11, `${joinTerms(m.xs)} = ${coefStr(m.cx)}`, FG, 'end');
  if (m.us.length) h += T(UBIN[0] + UBIN[2] - 12, UBIN[1] + UBIN[3] - 12, 11, `${joinTerms(m.us)} = ${num(m.cu)}`, FG, 'end');
  if (!m.xs.length) h += T(XBIN[0] + XBIN[2] / 2, XBIN[1] + 70, 11, 'перетащите сюда карточки с x', '#5d6880');
  if (!m.us.length) h += T(UBIN[0] + UBIN[2] / 2, UBIN[1] + 70, 11, 'перетащите сюда числа', '#5d6880');
  return h;
}
function lettersSVG(m) {
  let h = binSVG(m);
  for (let i = 0; i < TERMS.length; i++) {
    if (S.put.includes(i) || (drag && drag.i === i)) {
      if (!S.put.includes(i)) { const [cx, cy] = CARD(i); h += R(cx - 43, cy - 41, 86, 82, 'none', 'rx="10" stroke="#26324a" stroke-dasharray="4 4"'); }
      continue;
    }
    const [cx, cy] = CARD(i); h += cardSVG(i, cx, cy);
  }
  if (S.put.length) for (let i = 0; i < TERMS.length; i++) if (S.put.includes(i)) { const [cx, cy] = CARD(i); h += R(cx - 43, cy - 41, 86, 82, 'none', 'rx="10" stroke="#1f2a40" stroke-dasharray="3 5"'); }
  const res = m.all ? `${EXPR} = ${coefStr(m.cx)} + ${num(m.cu)}` : `${EXPR} = … (в корзинах ${m.placed} из ${TERMS.length})`;
  h += T(260, 362, 13.5, res, m.all ? GREEN : MUTED, 'middle', 'font-weight="500"');
  h += T(260, 384, 12, m.all ? `при x = ${num(m.x)}: ${coefStr(m.cx).replace('x', '·' + (m.x < 0 ? '(' + num(m.x) + ')' : num(m.x)))} + ${num(m.cu)} = ${num(m.v)}` : `при x = ${num(m.x)} значение выражения: ${num(m.v)}`, m.v === 15 ? ORANGE : MUTED);
  if (drag && drag.kind === 'card') {

    if (over) h += R(over[0], over[1], over[2], over[3], 'rgba(114,212,232,.07)', 'rx="12" stroke="#72d4e8" stroke-width="2"');
    h += cardSVG(drag.i, drag.x, drag.y, true);

// ---------- lesson 2: balance ----------
const PIV = [260, 178], ARM = 165, HANG = 88;
const angle = m => m.bal ? 0 : clamp((m.rv - m.lv) * 2.2, -13, 13) * (Math.abs(m.rv - m.lv) < 2 ? 1 : 1);
function ends(a) { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return { L: [PIV[0] - ARM * c, PIV[1] - ARM * s], R: [PIV[0] + ARM * c, PIV[1] + ARM * s] }; }
function panItems(side, cnt, cx, py) {
  let h = '', y = py;
  for (let r = 0; r < Math.ceil(cnt.x / 4); r++) {
    const n = Math.min(4, cnt.x - r * 4), x0 = cx - (n * 30 - 4) / 2; y -= 28;
    for (let j = 0; j < n; j++) h += `<g data-rm="${side}-x">${R(x0 + j * 30, y, 26, 26, BLUE, `rx="4" stroke="${INK}" stroke-width="1.6"`)}${T(x0 + j * 30 + 13, y + 17.5, 12, 'x', INK, 'middle', 'font-weight="500"')}</g>`;
  }
  for (let r = 0; r < Math.ceil(cnt.u / 8); r++) {
    const n = Math.min(8, cnt.u - r * 8), x0 = cx - (n * 17 - 2) / 2; y -= 19;
    for (let j = 0; j < n; j++) h += `<g data-rm="${side}-u"><path d="M${(x0 + j * 17 + 2).toFixed(1)} ${(y + 17).toFixed(1)}h11l-2 -12h-7z" fill="${ORANGE}" stroke="${INK}" stroke-width="1.3"/><rect x="${(x0 + j * 17 + 5).toFixed(1)}" y="${(y + 2).toFixed(1)}" width="5" height="4" rx="1" fill="${ORANGE}" stroke="${INK}" stroke-width="1"/>${T(x0 + j * 17 + 7.5, y + 15, 7.5, '1', INK, 'middle', 'font-weight="500"')}</g>`;
  }
  return h;
}
function linearSVG(m) {
  const a = angle(m), E = ends(a);
  const eqTxt = `${sideStr(m.L)} ${m.bal ? '=' : '≠'} ${sideStr(m.R)}`;
  let h = T(260, 100, 22, eqTxt, m.solved ? GREEN : m.bal ? FG : RED, 'middle', 'font-weight="500"');
  h += T(260, 124, 11.5, m.solved ? 'x найден: весы в равновесии, коробка одна' : m.bal ? 'весы в равновесии — равенство верно' : 'равновесие нарушено: части не равны', m.solved ? GREEN : m.bal ? MUTED : RED);
  // stand
  h += `<path d="M200 372h120l-14 -12h-92z" fill="#26324a" stroke="${INK}" stroke-width="1.4"/>` + R(254, PIV[1], 12, 182, '#33405c', `stroke="${INK}" stroke-width="1.4"`);
  h += `<path d="M236 ${PIV[1] - 34}A40 40 0 0 1 284 ${PIV[1] - 34}" fill="none" stroke="#33405c" stroke-width="2"/>` + L(260, PIV[1] - 44, 260, PIV[1] - 36, '#a9b4c9', 1.5);

  }

  h += `<circle cx="260" cy="${PIV[1]}" r="7" fill="${ORANGE}" stroke="${INK}" stroke-width="2"/>`;
  return h;
}

function wordSVG(m) {

  h += L(XB(TOTAL), 236, XB(TOTAL), 300, FG, 1, 'stroke-dasharray="3 3"');
  if (m.lhs === null) h += R(XB(0), 256, XB(TOTAL) - XB(0), 30, 'none', `rx="5" stroke="#33405c" stroke-dasharray="5 4"`) + T((XB(0) + XB(TOTAL)) / 2, 275, 11, 'здесь появится схема из отрезков', '#5d6880');

function hlBox(id) {

}

const scene = $('#scene');
function drawScene(t) {

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 410, 1.45);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 404 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- actions ----------
function putTerm(i, bin) {
  if (S.put.includes(i)) return false;
  const t = TERMS[i];
  if (bin !== t.k) {
    toast(t.k === 'x' ? `«${t.s}» содержит x — ему место в корзине «слагаемые с x».` : `«${t.s}» — просто число, ему место в корзине «числа».`);
    return false;
  }
  S.put.push(i); update(); return true;
}
function balOp(op) {
  const Lc = S.L, Rc = S.R;
  if (op === 'mx') {
    if (!Lc.x || !Rc.x) { toast('Коробка x есть только на одной чаше — с обеих снять не получится.'); return; }
    Lc.x--; Rc.x--; S.log.push({ d: 'снять x с обеих чаш', e: `${sideStr(Lc)} = ${sideStr(Rc)}` });
  } else if (op === 'mu') {
    if (!Lc.u || !Rc.u) { toast('Гири по 1 есть только на одной чаше.'); return; }
    Lc.u--; Rc.u--; S.log.push({ d: 'снять 1 с обеих чаш', e: `${sideStr(Lc)} = ${sideStr(Rc)}` });
  } else if (op === 'd2' || op === 'd3') {
    const n = op === 'd2' ? 2 : 3, all = [Lc.x, Lc.u, Rc.x, Rc.u];
    if (all.every(v => v === 0)) return;
    if (all.some(v => v % n)) { toast(`Не каждую группу на чашах можно разделить на ${n} поровну.`); return; }
    Lc.x /= n; Lc.u /= n; Rc.x /= n; Rc.u /= n; S.log.push({ d: `разделить обе части на ${n}`, e: `${sideStr(Lc)} = ${sideStr(Rc)}` });
  }
  update();
}
function removeOne(side, k) {
  const c = S[side]; if (!c[k]) return;
  c[k]--; S.log.push({ d: `убрать ${k === 'x' ? 'x' : '1'} только ${side === 'L' ? 'слева' : 'справа'}`, e: `${sideStr(S.L)} ? ${sideStr(S.R)}`, bad: true });
  const m = model();
  toast(m.bal ? 'Равновесие восстановлено: с обеих чаш снято одно и то же.' : 'Сняли только с одной чаши — равенство нарушено. Снимите то же самое с другой.');
  update();
}
function resetBal() { const E = EQS[S.eq]; S.L = { ...E.L }; S.R = { ...E.R }; S.log = []; }
function pick(p) {
  if (p.startsWith('p1-')) { const v = p.slice(3); if (S.p1 !== v) { S.p1 = v; S.p2 = null; } }
  else if (S.p1) S.p2 = +p.slice(3);
  update(); if (S.tab === 'scheme') buildScheme(), updateScheme(model());
}

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const c = scene.getScreenCTM(); return c ? p.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const setX3 = x => { const v = clamp(Math.round((x - 60) * 600 / 400 / 10) * 10, 0, 600); if (v !== S.x3) { S.x3 = v; update(); } };

scene.addEventListener('pointerdown', e => {
  const id = LID(), p = toSvg(e);
  const grab = () => { e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {} scene.classList.add('grabbing'); };
  if (id === 'linear') { const el = e.target.closest('[data-rm]'); if (el) { e.preventDefault(); const [sd, k] = el.dataset.rm.split('-'); removeOne(sd, k); } return; }
  if (id === 'word') {
    const el = e.target.closest('[data-pick]'); if (el) { e.preventDefault(); pick(el.dataset.pick); return; }
    if (p.y > SY - 24 && p.y < SY + 30 && p.x > XS(0) - 20 && p.x < XS(600) + 20) { grab(); drag = { kind: 'knob' }; setX3(p.x); }
    return;
  }
  const el = e.target.closest('[data-drag]'); if (!el || !/^c\d$/.test(el.dataset.drag)) return;
  const i = +el.dataset.drag.slice(1), [cx, cy] = CARD(i);
  grab(); drag = { kind: 'card', i, dx: cx - p.x, dy: cy - p.y, x: cx, y: cy, moved: false }; dirty = true;
});
scene.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSvg(e);
  if (drag.kind === 'knob') return setX3(p.x);
  drag.x = clamp(p.x + drag.dx, VB.x + 20, VB.x + VB.w - 20); drag.y = clamp(p.y + drag.dy, VB.y + 20, 395); drag.moved = true; dirty = true;
});
const endDrag = cancel => {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing');
  if (d.kind === 'card' && !cancel) {
    const bin = inBox(XBIN, d.x, d.y) ? 'x' : inBox(UBIN, d.x, d.y) ? '1' : null;
    if (bin) putTerm(d.i, bin);
  }
  dirty = true;
};
scene.addEventListener('pointerup', () => endDrag(false));
scene.addEventListener('pointercancel', () => endDrag(true));

function loop(t) {

  if (id === 'letters') return [
    { id: 'cards', icon: ICON.cards, name: 'Карточки-слагаемые', spec: 'Выражение 2x + 5 − x + 3x − 2, разрезанное на пять слагаемых. Знак едет вместе со слагаемым.' },
    { id: 'xbin', icon: ICON.xtile, name: 'Плитки x и −x', spec: 'Синяя полоска — x, красная — −x. Длина у них одна, знак разный.' },
    { id: 'ubin', icon: ICON.utile, name: 'Плитки 1 и −1', spec: 'Оранжевый квадрат — +1, красный — −1.' },
    { id: 'zero', icon: ICON.zero, name: 'Нулевые пары', spec: 'x и −x (или 1 и −1) вместе дают 0, поэтому бледнеют.' },
    { id: 'result', icon: ICON.result, name: 'Итог и значение', spec: 'Упрощённое выражение и его значение при выбранном x.' }];
  if (id === 'linear') return [
    { id: 'eqtext', icon: ICON.eqtext, name: 'Запись уравнения', spec: 'Левая чаша = левая часть, правая чаша = правая часть.' },
    { id: 'panL', icon: ICON.panL, name: 'Левая чаша', spec: 'Коробки x (масса скрыта) и гири по 1.' },
    { id: 'panR', icon: ICON.panR, name: 'Правая чаша', spec: 'Тап по предмету снимает его только с этой чаши.' },
    { id: 'beam', icon: ICON.beam, name: 'Коромысло', spec: 'Горизонтально — части равны. Наклон — равенство нарушено.' },
    { id: 'ptr', icon: ICON.ptr, name: 'Стрелка', spec: 'Зелёная — равновесие, красная — перевес.' },
    { id: 'stand', icon: ICON.stand, name: 'Стойка', spec: 'Опора весов, ось вращения коромысла.' }];
  return [
    { id: 'problem', icon: ICON.problem, name: 'Условие', spec: 'Что известно: 3 тетради + 2 ручки = 1450 ₸, тетрадь дороже на 150 ₸.' },
    { id: 'choose', icon: ICON.choose, name: 'Выбор неизвестного', spec: 'Что обозначить через x и как выразить вторую цену.' },
    { id: 'eq', icon: ICON.eq, name: 'Уравнение', spec: 'Собирается само из вашего выбора.' },
    { id: 'bars', icon: ICON.bars, name: 'Схема из отрезков', spec: 'Синие — тетради, оранжевые — ручки. Вместе должны дать 1450.' },
    { id: 'sum', icon: ICON.sum, name: 'Сравнение', spec: 'Сумма отрезков против 1450 ₸.' },
    { id: 'slider', icon: ICON.slider, name: 'Ползунок x', spec: 'Подставляет в уравнение значения от 0 до 600 ₸ с шагом 10.' }];
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

const par = v => v < 0 ? `(${num(v)})` : num(v);
function calcHTML(m) {
  const id = LID();
  if (id === 'letters') {
    let h = `<h2>Приводим подобные</h2><div class="formula">${EXPR}</div><h3>Группируем</h3><div class="steps">` +
      step('слагаемые с x', '2x − x + 3x') + step('коэффициенты', '2 − 1 + 3 = 4 → 4x') + step('числа', '5 − 2 = 3') + step('итог', '4x + 3', 'sum') + `</div>`;
    h += `<h3>Значение при x = ${num(m.x)}</h3><div class="steps">` +
      step('исходное', `2·${par(m.x)} + 5 − ${par(m.x)} + 3·${par(m.x)} − 2 = ${num(m.v)}`) +
      step('упрощённое', `4·${par(m.x)} + 3 = ${num(4 * m.x + 3)}`) + step('совпадают?', val1(m.x) === 4 * m.x + 3 ? 'да — выражения тождественно равны' : 'нет', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Знак принадлежит слагаемому, которое стоит за ним: в «− x» коэффициент равен −1.</p>`;
  }
  if (id === 'linear') {
    const E = EQS[m.eq];
    let h = `<h2>Решение на весах</h2><div class="formula">${sideStr(m.L)} ${m.bal ? '=' : '≠'} ${sideStr(m.R)}</div><h3>Шаги</h3><div class="steps">` + step('начало', `${sideStr(E.L)} = ${sideStr(E.R)}`);
    if (!S.log.length) h += step('дальше', 'снимите одинаковое с обеих чаш');
    S.log.forEach((s, i) => { h += step(`${i + 1}. ${s.d}`, s.bad ? `<span style="color:var(--warn)">${s.e}</span>` : s.e); });
    if (m.solved) h += step('корень', `x = ${m.root}`, 'sum') + `</div><h3>Проверка</h3><div class="steps">` +
      step('левая часть', `${E.L.x}·${m.root} + ${E.L.u} = ${E.L.x * m.root + E.L.u}`) + step('правая часть', `${E.R.x ? E.R.x + '·' + m.root + ' + ' : ''}${E.R.u} = ${E.R.x * m.root + E.R.u}`) + step('вывод', 'равенство верное ✓', 'sum');
    h += `</div>`;
    return h + `<p class="note" style="margin-top:10px">В тетради «снять 2x с обеих частей» записывают как перенос: 5x − 2x = 14 − 2. Слагаемое меняет знак, когда переходит в другую часть.</p>`;
  }
  if (!m.eq) return `<h2>Составляем уравнение</h2><div class="formula">…</div><div class="steps">` + step('1', 'выберите, что обозначить через x') + step('2', 'выразите вторую цену через x') + step('3', 'запишите: 3·тетрадь + 2·ручка = 1450') + `</div>`;
  const o = OPTS[m.p1], e = o.list[m.p2];
  let h = `<h2>Уравнение задачи</h2><div class="formula">${m.eq}</div><h3>Подстановка x = ${m.x}</h3><div class="steps">` +
    step(m.p1 === 'pen' ? 'ручка' : 'тетрадь', `x = ${m.x} ₸`) + step(o.other, `${e.replace(/(\d)x/, '$1·x').replace('x', m.x)} = ${num(m.other)} ₸`) +
    step('3 тетради + 2 ручки', `3·${par(m.nb)} + 2·${par(m.pen)} = ${num(m.lhs)}`) + step('сравнение', m.lhs === TOTAL ? '= 1450 ✓' : m.lhs < TOTAL ? '< 1450' : '> 1450', 'sum') + `</div>`;
  if (!m.good) return h + `<p class="note" style="margin-top:10px">Проверьте выражение: по условию тетрадь дороже ручки на 150 ₸.</p>`;
  const lines = m.p1 === 'pen' ? ['3x + 450 + 2x = 1450', '5x + 450 = 1450', '5x = 1000', 'x = 200'] : ['3x + 2x − 300 = 1450', '5x − 300 = 1450', '5x = 1750', 'x = 350'];
  const show = S.done.word ? lines.length : 2;
  h += `<h3>Решаем</h3><div class="steps">` + lines.slice(0, show).map((s, i) => step(['раскрыли скобки', 'привели подобные', 'перенесли число', 'разделили на 5'][i], s, i === 3 ? 'sum' : '')).join('') +
    (show < lines.length ? step('дальше', 'перенесите число и разделите — или найдите x ползунком') : '') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Ответ записывают на вопрос задачи: спрашивали цену ручки.</p>`;
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'letters') el.innerHTML = `<div class="k">Значение</div><div class="v ${ok ? 'ok' : ''}">${num(m.v)}</div><div class="lr"><span>x</span><span>${num(m.x)}</span></div><div class="lr"><span>карточек</span><span>${m.placed}/${TERMS.length}</span></div><div class="gauge"><b style="width:${(m.placed / TERMS.length * 100).toFixed(1)}%;background:var(--ok)"></b></div>`;
  else if (id === 'linear') el.innerHTML = `<div class="k">Весы</div><div class="v ${m.bal ? 'ok' : ''}" style="${m.bal ? '' : 'color:var(--warn)'}">${m.bal ? 'равновесие' : 'перевес'}</div><div class="lr"><span>x слева</span><span>${m.L.x}</span></div><div class="lr"><span>x справа</span><span>${m.R.x}</span></div>`;
  else el.innerHTML = `<div class="k">Сумма, ₸</div><div class="v ${ok ? 'ok' : ''}">${m.lhs === null ? '—' : num(m.lhs)}</div><div class="lr"><span>x</span><span>${m.x}</span></div><div class="gauge"><b style="width:${m.lhs === null ? 0 : clamp(m.lhs / 2000 * 100, 0, 100).toFixed(1)}%"></b><i style="left:${(TOTAL / 2000 * 100).toFixed(1)}%"></i></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Уравнения вам по плечу!'), 900);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  letters: '<rect x="8" y="6" width="5" height="18" rx="1" fill="#5fb4d9"/><rect x="15" y="6" width="5" height="18" rx="1" fill="#5fb4d9"/><rect x="22" y="6" width="5" height="18" rx="1" fill="#ff8a73"/><rect x="34" y="12" width="6" height="6" rx="1" fill="#ffb547"/><rect x="42" y="12" width="6" height="6" rx="1" fill="#ffb547"/><rect x="50" y="12" width="6" height="6" rx="1" fill="#ff8a73"/>',
  linear: '<path d="M33 27V9" stroke="#a9b4c9" stroke-width="1.4"/><path d="M10 9H56" stroke="#a9b4c9" stroke-width="2"/><circle cx="33" cy="9" r="2" fill="#ffb547"/><path d="M4 20Q12 26 20 20Z M46 20Q54 26 62 20Z" fill="#2a3550" stroke="#a9b4c9" stroke-width=".8"/><rect x="9" y="13" width="6" height="6" fill="#5fb4d9"/><rect x="51" y="14" width="5" height="5" fill="#ffb547"/>',
  word: '<path d="M6 9V6H54V9" fill="none" stroke="#e8ecf4" stroke-width="1"/><rect x="6" y="13" width="11" height="9" fill="#5fb4d9" stroke="#04070d" stroke-width=".8"/><rect x="17" y="13" width="11" height="9" fill="#5fb4d9" stroke="#04070d" stroke-width=".8"/><rect x="28" y="13" width="11" height="9" fill="#5fb4d9" stroke="#04070d" stroke-width=".8"/><rect x="39" y="13" width="7.5" height="9" fill="#ffb547" stroke="#04070d" stroke-width=".8"/><rect x="46.5" y="13" width="7.5" height="9" fill="#ffb547" stroke="#04070d" stroke-width=".8"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.put = []; S.x1 = Ls.id === 'letters' ? Ls.x : 0;
  S.eq = Ls.eq === undefined ? 0 : Ls.eq; resetBal();
  S.p1 = null; S.p2 = null; S.x3 = Ls.id === 'word' ? Ls.x : 100;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'letters') now = `Выражение ${EXPR} в виде алгебраических плиток (x — синяя полоска, 1 — оранжевый квадрат, отрицательные — красные). Ученик раскладывает карточки-слагаемые по корзинам «слагаемые с x» и «числа». В корзинах ${m.placed} из ${TERMS.length}: ` +
    `с x — ${m.xs.length ? joinTerms(m.xs) + ' = ' + coefStr(m.cx) : 'пусто'}; числа — ${m.us.length ? joinTerms(m.us) + ' = ' + num(m.cu) : 'пусто'}. Сейчас x = ${num(m.x)}, значение выражения ${num(m.v)} (нужно найти x, при котором оно равно 15).`;
  if (id === 'linear') now = `Чашечные весы-уравнение. Исходное уравнение ${sideStr(EQS[m.eq].L)} = ${sideStr(EQS[m.eq].R)}${m.eq ? ' (тренировочное, задание — 5x + 2 = 2x + 14)' : ''}. Сейчас на левой чаше ${sideStr(m.L)}, на правой ${sideStr(m.R)}; весы ${m.bal ? 'в равновесии' : 'не в равновесии — ученик снял что-то только с одной чаши'}. ` +
    `Сделанные шаги: ${S.log.length ? S.log.map(s => s.d).join('; ') : 'пока нет'}. Доступно: снять x или 1 с обеих чаш, разделить обе части на 2 или 3.`;
  if (id === 'word') now = `Задача: 3 тетради и 2 ручки стоят 1450 ₸, тетрадь на 150 ₸ дороже ручки, спрашивают цену ручки. Ученик выбрал: x — ${m.p1 === 'pen' ? 'цена ручки' : m.p1 === 'nb' ? 'цена тетради' : 'ещё не выбрал'}` +
    `${m.p1 && m.p2 !== null ? `, ${OPTS[m.p1].other} = ${OPTS[m.p1].list[m.p2]} (${m.good ? 'верно по условию' : 'не соответствует условию'})` : ''}. ${m.eq ? `Уравнение: ${m.eq}. Ползунок x = ${m.x} ₸, сумма отрезков ${num(m.lhs)} ₸.` : 'Уравнение ещё не составлено.'}`;
  return [
    `Раздел: математика, 7 класс, алгебра, тема «Выражения и уравнения». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовые ответы (корень уравнения, нужное x, цены): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    letters: 'Почему 2x и 5 нельзя сложить в 7x?', linear: 'Почему с обеих чаш нужно снимать одно и то же?',
    word: 'Как понять, что обозначить через x?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
