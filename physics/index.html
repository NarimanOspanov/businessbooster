<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Open Edu AI объясняет сложные темы просто: физика, математика, химия, биология и информатика в интерактивных опытах. ИИ-наставник говорит голосом, рисует на доске и ведёт по шагам — для школьников и взрослых.">
<title>Open Edu AI — сложные темы просто: опыты и ИИ-наставник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the lab shell again. A subway-style tree: one trunk of basics, five branches as rails, topics as stations ordered by grade from top to bottom; details in a side panel. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --ok:#86e0a8;
  --accent:#ffb547;
  --c-mech:#ffb547;
  --c-heat:#ff8a73;
  --c-elec:#a99cff;
  --c-opt:#72d4e8;
  --c-mod:#86e0a8;
  --c-base:#c8d1e2;
  --band:rgba(255,255,255,.018);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--c-opt);outline-offset:2px}

.wrap{max-width:1480px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}

.subjects{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.subj{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.subj:hover{border-color:var(--muted);color:var(--fg)}
.subj[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subj em{font:500 10.5px/1 var(--font-mono);font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 5px}

.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin:26px 0 18px}
.intro h2{font:500 clamp(22px,3vw,32px)/1.15 var(--font-display);margin:0 0 10px;text-wrap:balance;max-width:20ch}
.ag-play{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:10px 16px;font:600 14px var(--font-body);cursor:pointer}
.ag-play:hover{opacity:.9}
.ag-play.on{background:var(--accent);color:var(--bg)}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
.stat b{display:block;font:500 22px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:6px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.treebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto;min-width:0}
.tree{position:relative;display:grid;grid-template-columns:70px repeat(5,minmax(186px,1fr));column-gap:12px;min-width:1080px;padding:18px 18px 22px 8px}
.tree svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.band{grid-column:1/-1;background:var(--band);border-radius:10px}
.band.alt{background:none}
.lvl{grid-column:1;align-self:start;padding:16px 0 0 10px;font:500 11px/1.3 var(--font-mono);color:var(--muted);position:relative;z-index:1}
.lvl b{display:block;font:500 20px/1 var(--font-display);color:var(--fg);margin-bottom:4px}
.trunk{grid-column:2/-1;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1;padding:4px 0 34px}
.trunk .node{width:230px}
.bh{position:relative;z-index:1;padding:0 0 6px 2px;display:flex;align-items:center;gap:8px;font:600 11.5px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase}
.bh i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px var(--surface)}
.cell{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:12px 0 12px 22px;min-width:0}

.node{position:relative;display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px 10px;cursor:pointer;transition:opacity .2s,border-color .2s,transform .2s}
.node:hover{border-color:var(--muted)}
.node .nt{display:block;font-weight:600;font-size:13.5px;line-height:1.25;text-wrap:balance}
.node .nm{display:flex;align-items:center;gap:6px;margin-top:5px;font:500 11px/1.2 var(--font-mono);color:var(--muted)}
.st{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.node.done{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface-2))}
.node.done .st,.node.part .st{background:var(--ok);border-color:var(--ok)}
.node.part{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.node.part .st{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.node.soon .nt{color:#c3cada}
.node[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px -6px var(--c)}
.tree.focus .node:not(.rel){opacity:.32}
.tree.focus .bh{opacity:.6}

.side{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-height:calc(100vh - 28px);overflow:auto}
.side h3{font:500 18px/1.3 var(--font-display);margin:6px 0 10px;text-wrap:balance}
.side h4{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.side p{margin:0 0 10px;font-size:14px;line-height:1.55}
.kicker{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--font-mono);color:var(--muted)}
.kicker i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.items li{display:flex;gap:9px;align-items:baseline;font-size:14px}
.items li:before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted);flex:none;transform:translateY(-1px)}
.items li.ok:before{background:var(--ok);border-color:var(--ok)}
.items li.ok span{color:var(--fg)}
.items li em{font:500 11px var(--font-mono);font-style:normal;color:var(--ok);margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--fg);color:var(--bg);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none}
.soonbox{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:9px}
.legend .st{width:10px;height:10px}
.legend .st.ok{background:var(--ok);border-color:var(--ok)}
.legend .st.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.plans{display:grid;gap:8px}
.plan{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.plan b{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.plan b em{font:500 10.5px var(--font-mono);font-style:normal;color:var(--muted)}
.plan span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.close{float:right;background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted)}

/* list view for phones */
.list{display:none}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lb>h3{display:flex;align-items:center;gap:9px;margin:0;padding:13px 14px;font:600 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.lb>h3 i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.lb details{border-top:1px solid var(--line)}
.lb details:first-of-type{border-top:0}
.lb summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
.lb summary::-webkit-details-marker{display:none}
.lb summary .g{font:500 11px var(--font-mono);color:var(--muted);width:44px;flex:none}
.lb summary .t{flex:1;font-weight:500;font-size:14px}
.lb .body{padding:0 14px 14px 68px}
.lb .body .cta{margin-top:10px}

@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
@media (max-width:760px){
  .treebox{display:none}
  .list{display:block}
  .side{display:none}
  .side.plansonly{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script src="/luch/splash.js"></script>
<div class="wrap">
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 32V18M20 18L11 9M20 18l9-9M20 24l-6-4M20 24l6-4" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="11" cy="9" r="2.6" fill="var(--c-opt)"/><circle cx="29" cy="9" r="2.6" fill="var(--c-mech)"/><circle cx="14" cy="20" r="2" fill="var(--c-elec)"/><circle cx="26" cy="20" r="2" fill="var(--c-heat)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </a>
  </header>

  <div class="subjects" id="subjects" role="group" aria-label="Предметы"></div>

  <div class="intro">
    <div>
      <h2>Физика от простого к сложному</h2>
      <p>Вся школьная физика с 7 по 11 класс на одной карте. Сверху основы, ниже ветки разделов: чем ниже тема, тем она сложнее. Нажмите на тему, чтобы увидеть, что в ней и что стоит пройти до неё.</p>
      <button class="ag-play" id="agPlay" type="button">▶ Аудиогид по странице</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="layout">
    <div class="treebox"><div class="tree" id="tree"></div></div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
  <div class="list" id="list"></div>
</div>

<script src="/physics/subjects-data.js"></script>
<script>
(() => {

  { id: 'estatic', b: 'elec', g: 10, t: 'Электростатика', items: ['Закон Кулона', 'Напряжённость и потенциал', 'Конденсаторы'], req: ['charge'], status: 'done', href: '/labs/phys-estatic/', lessons: 3, doneItems: 3 },

// ---------- tree ----------
const tree = $('#tree');
const nodeHTML = t => {
  const meta = t.status === 'soon' ? `${t.g} класс · ${SUBJ.live ? 'скоро' : t.items.length + ' ' + plural(t.items.length, 'подтема', 'подтемы', 'подтем')}` : `${t.g} класс · ${lessonWord(t.lessons)}`;
  return `<button class="node ${t.status}" data-id="${t.id}" style="--c:${color(t.b)}" aria-pressed="false"><span class="nt">${esc(t.t)}</span><span class="nm"><i class="st"></i>${meta}</span></button>`;
};
let edges;
function buildTree() {
  tree.style.gridTemplateColumns = `70px repeat(${BRANCHES.length},minmax(186px,1fr))`;
  tree.style.minWidth = (100 + BRANCHES.length * 198) + 'px';
  let html = `<div class="trunk" style="grid-row:1">${TOPICS.filter(t => t.b === 'base').map(nodeHTML).join('')}</div>`;
  BRANCHES.forEach((b, i) => { html += `<div class="bh" data-b="${b.id}" style="grid-row:2;grid-column:${i + 2};--c:${b.c}"><i></i>${b.name}</div>`; });
  GRADES.forEach((g, r) => {
    const row = r + 3;
    html += `<div class="band ${r % 2 ? 'alt' : ''}" style="grid-row:${row}"></div>`;
    html += `<div class="lvl" style="grid-row:${row}"><b>${g}</b>класс</div>`;
    BRANCHES.forEach((b, i) => {
      const list = TOPICS.filter(t => t.b === b.id && t.g === g);
      html += `<div class="cell" data-b="${b.id}" style="grid-row:${row};grid-column:${i + 2}">${list.map(nodeHTML).join('')}</div>`;
    });
  });
  tree.innerHTML = html + '<svg class="edges" id="edges" aria-hidden="true"></svg>';
  edges = $('#edges');
}

let selected = null;
function draw() {
  if (!edges) return;
  const box = tree.getBoundingClientRect();
  const W = tree.scrollWidth, H = tree.scrollHeight;
  edges.setAttribute('width', W); edges.setAttribute('height', H); edges.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const r = el => { const q = el.getBoundingClientRect(); return { l: q.left - box.left, t: q.top - box.top, r: q.right - box.left, bt: q.bottom - box.top, cx: (q.left + q.right) / 2 - box.left, cy: (q.top + q.bottom) / 2 - box.top }; };
  let s = '';
  const trunkNodes = [...tree.querySelectorAll('.trunk .node')].map(r);
  const heads = [...tree.querySelectorAll('.bh')].map(h => ({ b: h.dataset.b, ...r(h) }));
  if (!trunkNodes.length || !heads.length) return;
  const busY = Math.max(...trunkNodes.map(n => n.bt)) + 16;
  const railX = h => h.l + 8;
  // trunk → bus → branch heads
  trunkNodes.forEach(n => { s += `<path d="M${n.cx} ${n.bt} V${busY}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`; });
  s += `<path d="M${railX(heads[0])} ${busY} H${railX(heads[heads.length - 1])}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`;
  heads.forEach(h => { s += `<path d="M${railX(h)} ${busY} V${h.cy - 7}" stroke="var(--c-base)" stroke-width="2" fill="none" opacity=".55"/>`; });
  // rails with stations
  heads.forEach(h => {
    const c = BRANCHES.find(x => x.id === h.b).c;
    const nodes = [...tree.querySelectorAll(`.cell[data-b="${h.b}"] .node`)].map(n => ({ id: n.dataset.id, ...r(n) }));
    if (!nodes.length) return;
    const cellL = r(tree.querySelector(`.cell[data-b="${h.b}"]`)).l + 9;
    s += `<path d="M${cellL} ${h.cy + 7} V${nodes[nodes.length - 1].cy}" stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85"/>`;
    nodes.forEach(n => {
      const st = T[n.id].status;
      s += `<path d="M${cellL} ${n.cy} H${n.l}" stroke="${c}" stroke-width="2" opacity=".7"/>`;
      s += `<circle cx="${cellL}" cy="${n.cy}" r="${st === 'soon' ? 4 : 5.5}" fill="${st === 'soon' ? 'var(--surface)' : c}" stroke="${c}" stroke-width="2"/>`;
    });
  });
  // links of the selected topic
  if (selected) {
    const S = r(tree.querySelector(`.node[data-id="${selected}"]`));
    const curve = (P, D) => Math.abs(P.cx - D.cx) < 20 ? (x => `M${P.r} ${P.cy} C${x} ${P.cy} ${x} ${D.cy} ${D.r} ${D.cy}`)(Math.max(P.r, D.r) + 34)
      : D.cx > P.cx ? `M${P.r} ${P.cy} C${P.r + 70} ${P.cy} ${D.l - 70} ${D.cy} ${D.l} ${D.cy}` : `M${P.l} ${P.cy} C${P.l - 70} ${P.cy} ${D.r + 70} ${D.cy} ${D.r} ${D.cy}`;
    T[selected].req.forEach(p => { const el = tree.querySelector(`.node[data-id="${p}"]`); if (el) s += `<path d="${curve(r(el), S)}" stroke="${color(T[p].b)}" stroke-width="2.2" fill="none"/>`; });
    deps(selected).forEach(d => { const el = tree.querySelector(`.node[data-id="${d}"]`); if (el) s += `<path d="${curve(S, r(el))}" stroke="${color(T[selected].b)}" stroke-width="1.8" fill="none" stroke-dasharray="5 5" opacity=".75"/>`; });
  }
  edges.innerHTML = s;
}

tree.addEventListener('click', e => { const n = e.target.closest('.node'); if (n) select(n.dataset.id === selected ? null : n.dataset.id); });

    ${ready.length ? `<h4>Уже можно открыть</h4><div class="chips">${ready.map(t => chip(t.id)).join('')}</div>` : `<h4>Программа по классам</h4><div class="plans">${GRADES.map(g => { const l = TOPICS.filter(t => t.g === g && t.b !== 'base'); return l.length ? `<div class="plan"><b>${g} класс<em>${l.length} ${plural(l.length, 'тема', 'темы', 'тем')}</em></b><span>${l.map(t => esc(t.t)).join(' · ')}</span></div>` : ''; }).join('')}</div>`}`;

function topicSide(t) {

function related(id) {
  const set = new Set([id]);
  T[id].req.forEach(x => set.add(x)); deps(id).forEach(x => set.add(x));
  return set;
}
function select(id) {
  selected = id;
  tree.classList.toggle('focus', !!id);
  const rel = id ? related(id) : new Set();
  tree.querySelectorAll('.node').forEach(n => { n.setAttribute('aria-pressed', n.dataset.id === id); n.classList.toggle('rel', rel.has(n.dataset.id)); });
  id ? topicSide(T[id]) : defaultSide();

}

  };
  const tts = text => fetch('/api/tutor/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.ok ? r.blob() : null).catch(() => null);
  const setBtn = on => { btn.classList.toggle('on', on); btn.textContent = on ? '❚❚ Остановить' : '▶ Аудиогид по странице'; };
  async function play() {
    const my = ++run; setBtn(true);
    if (window.LuchTutor && window.LuchTutor.hideTip) window.LuchTutor.hideTip();
    if (!audio) audio = new Audio();
    audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; audio.play().catch(() => {}); // разрешить звук жестом
    const st = steps(), texts = await tr(st.map(s => s[0]));
    let next = tts(texts[0]);
    for (let i = 0; i < st.length; i++) {
      if (my !== run) return;
      const blob = await next; if (i + 1 < st.length) next = tts(texts[i + 1]);
      if (my !== run) return;
      const el = document.querySelector(st[i][1]);
      if (el && window.LuchTutor && window.LuchTutor.highlight) window.LuchTutor.highlight(el);
      if (blob && blob.size > 100) { const u = URL.createObjectURL(blob); await new Promise(res => { audio.onended = audio.onerror = res; audio.src = u; audio.play().catch(res); }); URL.revokeObjectURL(u); }
      else await new Promise(r => setTimeout(r, 3000));
    }
    if (my === run) setBtn(false);
  }
  function stop() { run++; try { audio && audio.pause(); } catch (e) {} setBtn(false); }
  btn.addEventListener('click', () => (btn.classList.contains('on') ? stop() : play()));
  $('#subjects').addEventListener('click', stop);
  return { stop };
})();

useSubject(location.hash.slice(1));
addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'phys'; if (!SUBJ || SUBJ.id !== id) useSubject(id); });
new ResizeObserver(() => draw()).observe(tree);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
