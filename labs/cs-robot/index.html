<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 7 класс: робототехника — датчики света, расстояния и касания, моторы и обороты колёс, программа езды по линии.">
<title>Робототехника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage (top view of a robot field) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene.drag{touch-action:none}
.scene [data-t]{cursor:pointer}
.scene [data-t="robot"]{cursor:grab}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button.on{background:var(--surface-2);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .val{font:500 12px var(--font-mono);color:var(--fg);padding:0 4px;white-space:nowrap}
.hint{position:absolute;left:16px;bottom:60px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing .cur{color:var(--force)}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 440px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="11" y="12" width="18" height="16" rx="3" fill="none" stroke="var(--arm)" stroke-width="2"/><rect x="7" y="13" width="4" height="14" rx="1.5" fill="var(--fg)"/><rect x="29" y="13" width="4" height="14" rx="1.5" fill="var(--fg)"/><circle cx="17" cy="9" r="2" fill="var(--force)"/><circle cx="23" cy="9" r="2" fill="var(--force)"/><rect x="15" y="17" width="10" height="6" rx="1" fill="var(--arm)" opacity=".5"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Роботы</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Поле робота, вид сверху">
    <svg class="scene" id="scene" role="img" aria-label="Поле для робота, вид сверху, и пульт управления"></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Управление роботом" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';

const LESSONS = [
  { id: 'sensors', title: 'Датчики: органы чувств робота',
    text: ['Датчик — это «орган чувств» робота. Он превращает то, что происходит вокруг, в число, которое понимает контроллер. Без датчиков робот слеп: он просто крутит моторы.',
           'Датчик света светит вниз и измеряет, сколько света отразилось. Белый пол отражает много — около 84 %, чёрная линия мало — около 8 %. Чтобы робот сам решал «линия или пол», задают порог: меньше порога — чёрное, больше — белое. Надёжнее всего порог посередине.',
           'Ультразвуковой дальномер посылает неслышный нам писк и ждёт эхо. Звук летит до препятствия и обратно, поэтому расстояние = скорость звука × время : 2. Датчик касания проще всех: кнопка нажата — 1, отпущена — 0.'],
    why: 'Датчики стоят везде, где техника работает сама. Парктроник в машине — это ультразвуковой дальномер. Автоматическая дверь в магазине и турникет «видят» человека датчиками. На заводах, рудниках и складах Казахстана датчики следят за конвейерами, а наладчики автоматики и мехатроники настраивают их пороги — это нужная и хорошо оплачиваемая работа. На соревнованиях роботов (например, WRO) часто побеждает тот, кто лучше настроил датчики.',
    task: 'Покажите датчику света белый пол и чёрную линию, упритесь бампером в ящик и поставьте порог, который различает чёрное и белое.',
    hint: 'Тяните робота: красная точка спереди — датчик света. Запишите оба показания. Порог должен быть между ними — лучше посередине.',
    stage: 'Тяните робота пальцем или мышью. Порог меняйте кнопками − и + на пульте датчиков.',
    start: [30, 60, 0], thr0: 95,
    check: m => m.seenWhite && m.seenBlack && m.seenTouch && m.thrOk },
  { id: 'motors', title: 'Моторы: точно в гараж',
    text: ['Мотор превращает электричество во вращение. У нашего робота два мотора — левый и правый, у каждого своё колесо. Мощность задают в процентах: 100 % — полный вперёд, −100 % — полный назад, 0 — стоп.',
           'За один оборот колесо проезжает длину своей окружности: C = π · d. Колесо диаметром 5,6 см за оборот проходит около 17,6 см. Встроенный в мотор датчик — энкодер — считает градусы поворота (360° на оборот). Поэтому робот может проехать точно заданное расстояние.',
           'Поворот получается, когда колёса крутятся по-разному. Если левое крутится вперёд, а правое назад с той же мощностью, робот разворачивается на месте вправо. При повороте на 90° каждое колесо проходит четверть круга диаметром 11,2 см — это расстояние между колёсами.'],
    why: 'Точное управление моторами — основа станков с ЧПУ, 3D-принтеров, лифтов, роботов-манипуляторов и складских тележек. Мехатроник и наладчик оборудования считают обороты, скорость и передаточные числа — такие специалисты нужны на любом производстве. Даже в электросамокате контроллер мотора решает похожие задачи.',
    safe: 'Не держите пальцы у колёс и шестерёнок, когда мотор включён. Не замыкайте контакты аккумулятора и не оставляйте его заряжаться без присмотра.',
    task: 'Заведите робота в гараж: он должен встать в центре гаража передом внутрь. Стена посреди поля не даст проехать наискосок.',
    hint: 'Сколько сантиметров до гаража вверх и сколько вправо? Поделите на 17,6 см — получите обороты. Для разворота на месте мощности моторов должны быть противоположными.',
    stage: 'Задайте мощность моторов и обороты на пульте, затем «Поехать». Каждая команда — один ход.',
    start: [30, 100, -90], garage: [135.6, 29.6],
    check: m => m.inGarage },

const L = () => LESSONS[S.lesson];
const LID = () => L().id;
const KEY = 'luch-cs-robot';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            rb: { x: 0, y: 0, h: 0 }, thr: 95, seen: {}, P: { L: 50, R: 50, n: 1 }, hist: [], moves: [], Q: {},
            run: null, trail: [], laps: 0, lapAcc: 0, lastS: 0, simT: 0, lost: null, fast: false, branch: null, lastMsg: '' };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };

// ---------- robot & world constants (centimetres) ----------
const DW = 5.6, CW = Math.PI * DW, BW = 11.2, VMAX = 2 * CW;      // wheel diameter, circumference, track width, speed at 100 %
const FW = 200, FH = 120;
const WHITE = 84, BLACK = 8, SPOT = 0.75;
const LINE1 = [60, 63], BOX1 = { x0: 150, y0: 40, x1: 180, y1: 80 };
const WALL2 = { x0: 55, y0: 52, x1: 115, y1: 120 };
const SR = 35, SL = 200 + 2 * Math.PI * SR;                           // stadium track
const f1 = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const f2 = v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
const fnum = v => String(Math.round(v * 100) / 100).replace('.', ',').replace('-', '−');
const sgn = v => (v > 0 ? '+' : '') + fnum(v);
const rad = d => d * Math.PI / 180;
const normA = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
const course = h => normA(-h);   // for pupils: 0° = вправо, 90° = вверх
const courseTxt = h => { const c = Math.round(course(h)); const n = { 0: 'вправо', 90: 'вверх', 180: 'влево', '-90': 'вниз' }[c]; return fnum(c) + '°' + (n ? ' (' + n + ')' : ''); };

// lesson 1: sensors
function resolve1(x, y) {
  x = clamp(x, 6, FW - 7); y = clamp(y, 6.4, FH - 6.4);
  const b = BOX1;
  if (x + 7 > b.x0 && x - 6 < b.x1 && y + 6.4 > b.y0 && y - 6.4 < b.y1) {
    const c = [[b.x0 - 7, y], [b.x1 + 6, y], [x, b.y0 - 6.4], [x, b.y1 + 6.4]].filter(p => p[0] <= FW - 7 && p[1] >= 6.4 && p[1] <= FH - 6.4);
    c.sort((p, q) => Math.hypot(p[0] - x, p[1] - y) - Math.hypot(q[0] - x, q[1] - y));
    x = c[0][0]; y = c[0][1];
  }
  return { x, y };
}
function cover(d, w) { return clamp((w + SPOT - d) / (2 * SPOT), 0, 1); }
function sens1() {
  const fx = S.rb.x + 7, y = S.rb.y;
  const ov = Math.max(0, Math.min(fx + SPOT, LINE1[1]) - Math.max(fx - SPOT, LINE1[0]));
  const light = Math.round(WHITE - (WHITE - BLACK) * ov / (2 * SPOT));
  const hitBox = y >= BOX1.y0 && y <= BOX1.y1 && fx <= BOX1.x0 + 0.01;
  const dist = Math.max(0, (hitBox ? BOX1.x0 : FW) - fx);
  const touch = (y + 6 > BOX1.y0 && y - 6 < BOX1.y1 && fx >= BOX1.x0 - 0.5 && S.rb.x - 6 < BOX1.x1) || fx >= FW - 0.5;
  return { light, dist, touch, hitBox, fx };
}
function noteSeen() {
  if (LID() !== 'sensors') return;
  const s = sens1();
  if (s.light >= 80) S.seen.white = s.light;
  if (s.light <= 12) S.seen.black = s.light;
  if (s.touch) S.seen.touch = true;
}

// lesson 2: motors
function collide2(x, y) {
  const r = 7.5;
  if (x < r || x > FW - r || y < r || y > FH - r) return 'борт поля';
  const w = WALL2, dx = Math.max(w.x0 - x, 0, x - w.x1), dy = Math.max(w.y0 - y, 0, y - w.y1);
  return Math.hypot(dx, dy) < r ? 'стену' : null;
}
function plan2() {
  const p = S.P, pf = Math.max(Math.abs(p.L), Math.abs(p.R));
  if (!pf) return null;
  const rotL = p.n * p.L / pf, rotR = p.n * p.R / pf, sL = rotL * CW, sR = rotR * CW;
  const T = p.n / (pf / 100 * 2);
  return { pf, rotL, rotR, sL, sR, T, vL: sL / T, vR: sR / T, dh: (sL - sR) / BW, s: (sL + sR) / 2 };
}
function inGarage() {
  const g = L().garage; if (!g) return false;
  return Math.hypot(S.rb.x - g[0], S.rb.y - g[1]) <= 5 && Math.abs(normA(S.rb.h)) <= 12;
}
// exact differential-drive step: constant wheel speeds for dt seconds
function drive(vL, vR, dt) {
  const v = (vL + vR) / 2, w = (vL - vR) / BW, h = rad(S.rb.h);
  if (Math.abs(w) < 1e-9) { S.rb.x += v * Math.cos(h) * dt; S.rb.y += v * Math.sin(h) * dt; }
  else { S.rb.x += v / w * (Math.sin(h + w * dt) - Math.sin(h)); S.rb.y -= v / w * (Math.cos(h + w * dt) - Math.cos(h)); S.rb.h += w * dt * 180 / Math.PI; }
}

// lesson 3: line following on a stadium track
function trackNear(x, y) {
  if (x >= 50 && x <= 150) { const bot = y >= 60; return { d: Math.abs(y - (bot ? 95 : 25)), s: bot ? x - 50 : 100 + Math.PI * SR + (150 - x) }; }
  if (x > 150) { const a = Math.atan2(y - 60, x - 150); return { d: Math.abs(Math.hypot(x - 150, y - 60) - SR), s: 100 + (Math.PI / 2 - a) * SR }; }
  let a = Math.atan2(y - 60, x - 50); if (a > 0) a -= 2 * Math.PI;
  return { d: Math.abs(Math.hypot(x - 50, y - 60) - SR), s: 200 + Math.PI * SR + (-Math.PI / 2 - a) * SR };
}
function sens3() {
  const h = rad(S.rb.h), sx = S.rb.x + 7 * Math.cos(h), sy = S.rb.y + 7 * Math.sin(h);
  const t = trackNear(sx, sy);
  return { light: Math.round(WHITE - (WHITE - BLACK) * cover(t.d, 1.5)), d: t.d, sx, sy };
}
function decide3(light) {
  const q = S.Q, black = light < q.thr;
  return { black, L: black ? q.bL : q.wL, R: black ? q.bR : q.wR };
}
function simStep(dt) {
  const s = sens3(), dcs = decide3(s.light);
  S.branch = dcs;
  drive(dcs.L / 100 * VMAX, dcs.R / 100 * VMAX, dt);
  S.simT += dt;
  const ns = trackNear(S.rb.x, S.rb.y).s;
  let ds = ns - S.lastS; if (ds > SL / 2) ds -= SL; if (ds < -SL / 2) ds += SL;
  S.lapAcc += ds; S.lastS = ns;
  const s2 = sens3();
  if (s2.d > 9) return 'lost';
  if (S.rb.x < 6 || S.rb.x > FW - 6 || S.rb.y < 6 || S.rb.y > FH - 6) return 'edge';
  if (Math.abs(S.lapAcc) >= SL) return 'lap';
  if (S.simT > 150) return 'time';
  return null;
}

function model() {
  const id = LID(), m = { kind: id, running: !!S.run };
  if (id === 'sensors') {
    const s = sens1(), lo = (S.seen.black ?? BLACK) + 10, hi = (S.seen.white ?? WHITE) - 10;
    Object.assign(m, s, { thr: S.thr, seenWhite: S.seen.white !== undefined, seenBlack: S.seen.black !== undefined, seenTouch: !!S.seen.touch,
      thrOk: S.thr >= lo && S.thr <= hi, isBlack: s.light < S.thr });
  } else if (id === 'motors') {
    Object.assign(m, { inGarage: !S.run && inGarage(), moves: S.moves.length, plan: plan2() });
  } else {
    const s = sens3();
    Object.assign(m, { light: s.light, laps: S.laps, prog: clamp(Math.abs(S.lapAcc) / SL, 0, 1), t: S.simT, lost: S.lost, dcs: decide3(s.light) });
  }
  return m;
}

// ---------- geometry ----------
let NAR = false;
const BOUNDS = () => NAR ? { x0: 0, x1: 302, y1: 512 } : { x0: 0, x1: 590, y1: 352 };
const FLD = () => NAR ? { x: 4, y: 100, s: 1.47 } : { x: 8, y: 100, s: 1.9 };
const BOX = () => NAR ? { x: 2, y: 304, w: 298, h: 206 } : { x: 398, y: 100, w: 190, h: 228 };
const P = (x, y) => { const f = FLD(); return { x: f.x + x * f.s, y: f.y + y * f.s }; };

// ---------- drawing ----------
const scene = $('#scene');
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function robotSvg(x, y, h, s, o) {
  o = o || {};
  const p = P(x, y);
  let g = `<g transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${h.toFixed(2)}) scale(${s})">`;
  g += `<rect x="-2.8" y="-7.2" width="5.6" height="2" rx=".6" fill="#1b2232" stroke="${INK}" stroke-width=".3"/><rect x="-2.8" y="5.2" width="5.6" height="2" rx=".6" fill="#1b2232" stroke="${INK}" stroke-width=".3"/>`;
  g += `<path d="M-2.4 -6.6h4.8M-2.4 6.6h4.8" stroke="#56627d" stroke-width=".3" stroke-dasharray=".6 .6"/>`;
  g += `<rect x="-6" y="-5" width="13" height="10" rx="1.8" fill="#e8ecf4" stroke="${INK}" stroke-width=".4"/>`;
  g += `<rect x="-4.6" y="-3.4" width="7" height="6.8" rx="1" fill="#26324a"/><rect x="-3.8" y="-2.5" width="5.4" height="3" rx=".4" fill="#72d4e8" opacity=".85"/><circle cx="-1.1" cy="2" r=".6" fill="#ffb547"/>`;
  g += `<path d="M-5 0h-1.6" stroke="#ffb547" stroke-width=".5"/>`;
  if (o.us) g += `<rect x="5.2" y="-3.6" width="1.6" height="7.2" rx=".5" fill="#56627d"/><circle cx="6.4" cy="-1.9" r="1.2" fill="#b9c3d6" stroke="${INK}" stroke-width=".25"/><circle cx="6.4" cy="1.9" r="1.2" fill="#b9c3d6" stroke="${INK}" stroke-width=".25"/>`;
  if (o.bump) g += `<rect x="7.1" y="-6" width="1" height="12" rx=".5" fill="${o.pressed ? '#86e0a8' : '#ffb547'}" stroke="${INK}" stroke-width=".25"/>`;
  if (o.light) g += `<path d="M5 0h2" stroke="#56627d" stroke-width="1"/><circle cx="7" cy="0" r="1.05" fill="#ff5a3c" stroke="#fff" stroke-width=".3"/>`;
  g += `</g>`;
  return g;
}
function fieldBase() {
  const f = FLD(), W = FW * f.s, H = FH * f.s;
  let h = `<g data-part="field"><rect x="${f.x}" y="${f.y}" width="${W}" height="${H}" rx="5" fill="#eef1f6"/>`;
  for (let i = 10; i < FW; i += 10) h += `<path d="M${(f.x + i * f.s).toFixed(1)} ${f.y}v${H.toFixed(1)}" stroke="${i % 50 ? '#e0e5ee' : '#cfd6e2'}" stroke-width="${i % 50 ? 0.7 : 1}"/>`;
  for (let j = 10; j < FH; j += 10) h += `<path d="M${f.x} ${(f.y + j * f.s).toFixed(1)}h${W.toFixed(1)}" stroke="${j % 50 ? '#e0e5ee' : '#cfd6e2'}" stroke-width="${j % 50 ? 0.7 : 1}"/>`;
  h += `</g>`;
  return h;
}
function fieldFrame() {
  const f = FLD();
  return `<rect x="${f.x}" y="${f.y}" width="${FW * f.s}" height="${FH * f.s}" rx="5" fill="none" stroke="#56627d" stroke-width="2.2" pointer-events="none"/>`;
}
function drawField(t) {
  const id = LID(), f = FLD(), k = f.s;
  let h = `<text x="${f.x}" y="91" font-size="9" fill="#8b96ad" letter-spacing="1">ПОЛЕ 200 × 120 СМ · КЛЕТКА 10 СМ · ВИД СВЕРХУ</text>`;
  h += fieldBase();
  if (id === 'sensors') {
    const a = P(LINE1[0], 0), b = P(BOX1.x0, BOX1.y0);
    h += `<rect x="${a.x}" y="${f.y}" width="${(LINE1[1] - LINE1[0]) * k}" height="${FH * k}" fill="#11141b"/>`;
    h += `<g><rect x="${b.x}" y="${b.y}" width="${(BOX1.x1 - BOX1.x0) * k}" height="${(BOX1.y1 - BOX1.y0) * k}" rx="3" fill="#b07a3c" stroke="#6b4a22" stroke-width="1.4"/><path d="M${b.x} ${b.y}l${(BOX1.x1 - BOX1.x0) * k} ${(BOX1.y1 - BOX1.y0) * k}M${b.x + (BOX1.x1 - BOX1.x0) * k} ${b.y}l${-(BOX1.x1 - BOX1.x0) * k} ${(BOX1.y1 - BOX1.y0) * k}" stroke="#6b4a22" stroke-width=".8" opacity=".6"/><text x="${b.x + (BOX1.x1 - BOX1.x0) * k / 2}" y="${b.y + (BOX1.y1 - BOX1.y0) * k / 2 + 3}" font-size="8" fill="#fff" text-anchor="middle">ящик</text></g>`;
    const s = sens1(), p0 = P(s.fx, S.rb.y), p1 = P(s.fx + s.dist, S.rb.y);
    const ph = reduce ? 0.5 : (t / 900) % 1;
    h += `<path d="M${p0.x} ${p0.y}H${p1.x}" stroke="#72d4e8" stroke-width="1.4" stroke-dasharray="4 3" opacity=".9"/>`;
    for (let i = 0; i < 2; i++) { const q = (ph + i * 0.5) % 1, xx = p0.x + (p1.x - p0.x) * q; h += `<path d="M${xx.toFixed(1)} ${p0.y - 6}q4 6 0 12" fill="none" stroke="#72d4e8" stroke-width="1.2" opacity="${(1 - q * 0.7).toFixed(2)}"/>`; }
    h += `<circle cx="${p1.x}" cy="${p1.y}" r="2.5" fill="#72d4e8"/>`;
    h += fieldFrame();
    h += `<g data-t="robot">` + robotSvg(S.rb.x, S.rb.y, 0, k, { us: true, bump: true, light: true, pressed: s.touch }) + `<rect x="${P(S.rb.x - 9, 0).x}" y="${P(0, S.rb.y - 9).y}" width="${18 * k}" height="${18 * k}" fill="transparent"/></g>`;
    const ry = f.y + FH * k + 16;
    h += `<text x="${f.x}" y="${ry}" font-size="10" fill="#e8ecf4">свет ${s.light}% · дальномер ${Math.round(s.dist)} см · касание ${s.touch ? 1 : 0}</text>`;
  } else if (id === 'motors') {
    const w = WALL2, a = P(w.x0, w.y0);
    h += `<rect x="${a.x}" y="${a.y}" width="${(w.x1 - w.x0) * k}" height="${(w.y1 - w.y0) * k}" fill="#56627d"/><path d="M${a.x} ${a.y}h${(w.x1 - w.x0) * k}" stroke="#46516a" stroke-width="2"/><text x="${a.x + (w.x1 - w.x0) * k / 2}" y="${a.y + (w.y1 - w.y0) * k / 2}" font-size="8" fill="#c7cfdd" text-anchor="middle">стена</text>`;
    const g = L().garage, gp = P(g[0] - 13.5, g[1] - 11.5), gw = 27 * k, gh = 23 * k;
    h += `<g data-part="garage"><rect x="${gp.x}" y="${gp.y}" width="${gw}" height="${gh}" fill="rgba(134,224,168,.16)"/><path d="M${gp.x} ${gp.y}h${gw}v${gh}h${-gw}" fill="none" stroke="#2f8a57" stroke-width="2.4"/>`;
    const gc = P(g[0], g[1]);
    h += `<circle cx="${gc.x}" cy="${gc.y}" r="${5 * k}" fill="none" stroke="#2f8a57" stroke-width="1" stroke-dasharray="2 2"/><path d="M${gc.x - 3} ${gc.y}h6M${gc.x} ${gc.y - 3}v6" stroke="#2f8a57" stroke-width="1"/><text x="${gp.x + gw / 2}" y="${gp.y - 4}" font-size="8" fill="#2f8a57" text-anchor="middle">гараж</text></g>`;
    const st = L().start, sp = P(st[0], st[1]);
    h += `<rect x="${sp.x - 8 * k}" y="${sp.y - 8 * k}" width="${16 * k}" height="${16 * k}" rx="3" fill="none" stroke="#4c97ff" stroke-opacity=".6" stroke-dasharray="3 3"/><text x="${sp.x}" y="${sp.y + 8 * k + 9}" font-size="8" fill="#4c97ff" text-anchor="middle">старт</text>`;
    if (S.trail.length > 1) h += `<path d="${S.trail.map((q, i) => { const pp = P(q[0], q[1]); return (i ? 'L' : 'M') + pp.x.toFixed(1) + ' ' + pp.y.toFixed(1); }).join('')}" fill="none" stroke="#ffb547" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>`;
    h += fieldFrame();
    h += robotSvg(S.rb.x, S.rb.y, S.rb.h, k, { us: true });
    const ry = f.y + FH * k + 16;
    h += `<text x="${f.x}" y="${ry}" font-size="10" fill="#e8ecf4">x ${f1(S.rb.x)} · y ${f1(FH - S.rb.y)} см · курс ${courseTxt(S.rb.h)}</text>`;
  } else {
    const c1 = P(50, 60), c2 = P(150, 60), r = SR * k, top = P(0, 25).y, bot = P(0, 95).y;
    h += `<path d="M${c1.x} ${bot}H${c2.x}A${r} ${r} 0 0 0 ${c2.x} ${top}H${c1.x}A${r} ${r} 0 0 0 ${c1.x} ${bot}z" fill="none" stroke="#11141b" stroke-width="${3 * k}"/>`;
    const st = L().start, sp = P(st[0] - 4, 95);
    h += `<path d="M${sp.x} ${sp.y - 6 * k}v${12 * k}" stroke="#4c97ff" stroke-width="1.6" stroke-dasharray="3 2"/><text x="${sp.x}" y="${sp.y + 6 * k + 9}" font-size="8" fill="#4c97ff" text-anchor="middle">старт</text>`;
    if (S.trail.length > 1) h += `<path d="${S.trail.map((q, i) => { const pp = P(q[0], q[1]); return (i ? 'L' : 'M') + pp.x.toFixed(1) + ' ' + pp.y.toFixed(1); }).join('')}" fill="none" stroke="#ffb547" stroke-width="1.3" stroke-linejoin="round" opacity=".8"/>`;
    h += fieldFrame();
    const s = sens3();
    h += robotSvg(S.rb.x, S.rb.y, S.rb.h, k, { light: true });
    const sp2 = P(s.sx, s.sy);
    h += `<circle cx="${sp2.x}" cy="${sp2.y}" r="${2.6 * k}" fill="none" stroke="${s.light < S.Q.thr ? '#ff5a3c' : '#4c97ff'}" stroke-width="1.2"/>`;
    if (S.lost) h += `<circle cx="${P(S.rb.x, 0).x}" cy="${P(0, S.rb.y).y}" r="${11 * k}" fill="none" stroke="#ff5a3c" stroke-width="2"/>`;
    const ry = f.y + FH * k + 16;
    h += `<text x="${f.x}" y="${ry}" font-size="10" fill="#e8ecf4">свет ${s.light}% → ${s.light < S.Q.thr ? 'чёрное' : 'белое'} · круг ${Math.round(clamp(Math.abs(S.lapAcc) / SL, 0, 1) * 100)}% · ${f1(S.simT)} с</text>`;
  }
  return h;
}

function getP(k) { const id = LID(); if (id === 'sensors') return k === 'rx' ? S.rb.x : k === 'ry' ? S.rb.y : S.thr; if (id === 'motors') return S.P[k]; return S.Q[k]; }

function drawBox() {

function hlBoxes(id) {
  const f = FLD(), k = f.s, B = BOX();
  const rect = (x0, y0, x1, y1) => { const a = P(x0, y0), b = P(x1, y1); return [a.x - 3, a.y - 3, b.x - a.x + 6, b.y - a.y + 6]; };
  const around = (cx, cy, r) => rect(cx - r, cy - r, cx + r, cy + r);
  const local = (dx, dy) => { const hh = rad(S.rb.h); return [S.rb.x + dx * Math.cos(hh) - dy * Math.sin(hh), S.rb.y + dx * Math.sin(hh) + dy * Math.cos(hh)]; };
  if (id === 'field') return [rect(0, 0, FW, FH)];
  if (id === 'box') return [[B.x, B.y, B.w, B.h]];
  if (id === 'robot' || id === 'hub') return [around(S.rb.x + 0.5, S.rb.y, 9)];
  if (id === 'light') { const q = local(7, 0); return [around(q[0], q[1], 3)]; }
  if (id === 'us') { const q = local(6.4, 0); return [around(q[0], q[1], 4)]; }
  if (id === 'bump') return [rect(S.rb.x + 6, S.rb.y - 7, S.rb.x + 9, S.rb.y + 7)];
  if (id === 'line1') return [rect(LINE1[0] - 1, 0, LINE1[1] + 1, FH)];
  if (id === 'box1') return [rect(BOX1.x0, BOX1.y0, BOX1.x1, BOX1.y1)];
  if (id === 'wheels') { const a = local(0, -6.2), b = local(0, 6.2); return [around(a[0], a[1], 3.5), around(b[0], b[1], 3.5)]; }
  if (id === 'garage') { const g = L().garage; return [rect(g[0] - 14, g[1] - 12, g[0] + 14, g[1] + 12)]; }
  if (id === 'wall') return [rect(WALL2.x0, WALL2.y0, WALL2.x1, WALL2.y1)];
  if (id === 'track') return [rect(13, 23, 187, 97)];
  if (id === 'ctl') return BROWS.length ? BROWS.map(r => r.box) : [[B.x, B.y, B.w, B.h]];
  return [];
}

function drawScene(t) {
  let h = bg() + drawField(t) + drawBox();
  if (S.hl) {
    const q = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (q === 0) S.hl = null;

let VB = { x: 0, y: 0, w: 590, h: 352 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  NAR = w < 560;
  const B = BOUNDS(), cw = B.x1 - B.x0 + 8, ch = B.y1 - 80 + 4;
  const tb = $('#taskBox').getBoundingClientRect(), mt = $('#meter').getBoundingClientRect();
  const topPx = Math.max(tb.bottom, mt.bottom) - rc.top + 8;
  const s = Math.min(w / cw, Math.max((hh - topPx) / ch, hh / (ch * 1.6)), 1.6);
  VB = { w: w / s, h: hh / s }; VB.x = (B.x0 + B.x1) / 2 - VB.w / 2;
  VB.y = 80 - topPx / s;
  const slack = VB.y + VB.h - (B.y1 + 2);
  VB.y = slack < 0 ? B.y1 + 2 - VB.h : VB.y - slack / 2;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);

}

// ---------- pointer: drag robot (lesson 1), taps on the pult ----------
let dirty = true, tap = null, drag = null;
function svgPt(e) { const m = scene.getScreenCTM(); if (!m) return null; const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()); const f = FLD(); return { x: (p.x - f.x) / f.s, y: (p.y - f.y) / f.s }; }
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-t]');
  if (el && el.dataset.t === 'robot' && LID() === 'sensors') {
    const p = svgPt(e); if (!p) return;
    drag = { dx: S.rb.x - p.x, dy: S.rb.y - p.y, id: e.pointerId };
    try { scene.setPointerCapture(e.pointerId); } catch (er) {}
    e.preventDefault(); return;

scene.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = svgPt(e); if (!p) return;
  const r = resolve1(p.x + drag.dx, p.y + drag.dy); S.rb.x = r.x; S.rb.y = r.y; noteSeen(); scheduleUpdate();
});
const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; update(); } };

  if (drag) { endDrag(e); return; }

function onTap(t) {
  const m = /^(dec|inc)-(\w+)$/.exec(t); if (!m) return;
  const d = PARAMS[LID()][m[2]]; setParam(m[2], getP(m[2]) + (m[1] === 'inc' ? d.step : -d.step));
}
let upT = 0;
function scheduleUpdate() { const n = performance.now(); if (n - upT > 90) { upT = n; update(); } else dirty = true; }

// ---------- running ----------
function go2() {
  if (S.run) return;
  const pl = plan2();
  if (!pl) { toast('Оба мотора на 0% — робот не поедет.'); return; }
  S.hist.push({ ...S.rb, trail: S.trail.length });
  S.run = { kind: 'move', pl, left: pl.T, hit: null };
  S.moves.push({ L: S.P.L, R: S.P.R, n: S.P.n });
  if (reduce) { while (S.run && advance2(0.5)) {} }
  update();
}
function advance2(dt) {
  const r = S.run; let left = Math.min(dt, r.left);
  while (left > 1e-9) {
    const st = Math.min(0.01, left), prev = { ...S.rb };
    drive(r.pl.vL, r.pl.vR, st);
    const hit = collide2(S.rb.x, S.rb.y);
    if (hit) { S.rb = prev; r.hit = hit; break; }
    left -= st; r.left -= st;
  }
  const last = S.trail[S.trail.length - 1];
  if (!last || Math.hypot(last[0] - S.rb.x, last[1] - S.rb.y) > 0.8) S.trail.push([S.rb.x, S.rb.y]);
  if (r.hit || r.left <= 1e-9) { finish2(); return false; }
  return true;
}
function finish2() {
  const r = S.run; S.run = null;
  S.trail.push([S.rb.x, S.rb.y]);
  if (r.hit) toast(`Робот упёрся в ${r.hit} и остановился.`);
  else if (inGarage()) toast('Робот в гараже!');
  else toast(`Ход ${S.moves.length} выполнен. Курс ${courseTxt(S.rb.h)}.`);
  S.moves[S.moves.length - 1].hit = r.hit;
  update();
}
function undo2() {
  if (S.run || !S.hist.length) return;
  const p = S.hist.pop(); S.rb = { x: p.x, y: p.y, h: p.h }; S.trail.length = p.trail; S.moves.pop(); update();
}
function reset() {
  const st = L().start; S.rb = { x: st[0], y: st[1], h: st[2] };
  S.run = null; S.trail = []; S.hist = []; S.moves = []; S.lost = null; S.laps = 0; S.lapAcc = 0; S.simT = 0; S.branch = null;
  S.lastS = trackNear(S.rb.x, S.rb.y).s;
}
function go3() {
  if (S.run) return;
  if (S.lost || Math.abs(S.lapAcc) > 0 || S.simT > 0) { const q = S.laps; reset(); S.laps = q; }
  S.trail = [[S.rb.x, S.rb.y]];
  S.run = { kind: 'sim', acc: 0 };
  update();
}
function stop3(why) {
  S.run = null;
  const msg = { lost: 'Робот потерял линию!', edge: 'Робот выехал к борту поля.', time: 'Время вышло: за 150 с круг не пройден.', lap: `Круг пройден за ${f1(S.simT)} с!`, stop: 'Остановлено.' }[why];
  if (why === 'lap') S.laps++;
  S.lost = why === 'lost' || why === 'edge' || why === 'time' ? msg.replace(/[!.]$/, '').toLowerCase() : null;
  toast(msg); update();
}
function tick3(dt) {
  const r = S.run; let left = dt * (S.fast ? 8 : 2.5) * (reduce ? 2 : 1);
  while (left > 1e-9) {
    const st = Math.min(0.01, left); left -= st;
    const res = simStep(st);
    const last = S.trail[S.trail.length - 1];
    if (Math.hypot(last[0] - S.rb.x, last[1] - S.rb.y) > 1.2) { S.trail.push([S.rb.x, S.rb.y]); if (S.trail.length > 1500) S.trail.shift(); }
    if (res) { stop3(res); return; }
  }
  r.acc += dt; if (r.acc > 0.15) { r.acc = 0; update(); }
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  if (S.run && S.run.kind === 'move') { if (advance2(dt * 1.5)) scheduleUpdate(); anim = true; }
  else if (S.run && S.run.kind === 'sim') { tick3(dt); anim = true; }
  if (LID() === 'sensors' && !reduce) anim = true;
  if (S.hl) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function act(a) {
  const id = LID();
  if (/^(dec|inc)-/.test(a)) { onTap(a); return; }
  if (a[0] === 'm' && a.length === 2 && id === 'sensors') { const d = { L: [-3, 0], R: [3, 0], U: [0, -3], D: [0, 3] }[a[1]]; const p = resolve1(S.rb.x + d[0], S.rb.y + d[1]); S.rb.x = p.x; S.rb.y = p.y; noteSeen(); update(); return; }

    h = `<h2>Пульт моторов</h2><p class="note">Мотор с большей мощностью делает заданное число оборотов, второй — во столько же раз меньше, во сколько меньше его мощность.</p>
      <dl class="reads"><div><dt>x, см</dt><dd id="r1"></dd></div><div><dt>y, см</dt><dd id="r2"></dd></div><div><dt>Курс</dt><dd id="r3"></dd></div></dl>` +
      sl('L', 'Левый мотор, %', -100, 100, 10) + sl('R', 'Правый мотор, %', -100, 100, 10) + sl('n', 'Обороты колеса', 0.25, 8, 0.25) +
      `<div class="ctl"><div class="chips"><button data-a="go">▶ Поехать</button><button data-a="undo">↶ Отменить</button><button data-a="reset">Сброс</button></div></div><h3>Ходы робота</h3><div class="listing" id="lst"></div>`;
  } else {
    h = `<h2>Пульт программы</h2><p class="note">Ползунки меняют числа в программе. Скорость при 100 % — 2 оборота колеса в секунду, это ${f1(VMAX)} см/с.</p>
      <dl class="reads"><div><dt>Свет</dt><dd id="r1"></dd></div><div><dt>Ветка</dt><dd id="r2"></dd></div><div><dt>Круг</dt><dd id="r3"></dd></div></dl>` +
      sl('thr', 'Порог: если свет меньше, %', 0, 100, 5) + sl('bL', 'Чёрное → левый мотор, %', -100, 100, 10) + sl('bR', 'Чёрное → правый мотор, %', -100, 100, 10) +
      sl('wL', 'Белое → левый мотор, %', -100, 100, 10) + sl('wR', 'Белое → правый мотор, %', -100, 100, 10) +
      `<div class="ctl"><div class="chips"><button data-a="run">▶ Пуск</button><button data-a="stop">■ Стоп</button><button data-a="reset">Сброс</button><button data-a="fast">⏩ Ускорение</button></div></div><h3>Текст программы</h3><div class="listing" id="lst"></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
  el.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('input', e => setParam(e.target.dataset.k, +e.target.value)));
}
const progText = () => { const q = S.Q; return `повторять всегда<br>&nbsp;&nbsp;если свет &lt; ${q.thr}, то<br>&nbsp;&nbsp;&nbsp;&nbsp;моторы: левый ${sgn(q.bL)}%, правый ${sgn(q.bR)}%<br>&nbsp;&nbsp;иначе<br>&nbsp;&nbsp;&nbsp;&nbsp;моторы: левый ${sgn(q.wL)}%, правый ${sgn(q.wR)}%<br>&nbsp;&nbsp;конец<br>конец`; };
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  el.querySelectorAll('input[type=range]').forEach(i => {
    const k = i.dataset.k, v = k === 'ry' ? FH - S.rb.y : getP(k);
    if (document.activeElement !== i) i.value = v;
    i.disabled = !!S.run;
    set('#out-' + k, k === 'rx' || k === 'ry' ? f1(v) : k === 'n' ? fnum(v) : (PARAMS[LID()][k] && PARAMS[LID()][k].min < 0 ? sgn(v) : v) + '%');
  });
  el.querySelectorAll('[data-a]').forEach(b => { b.disabled = b.dataset.a === 'stop' ? !S.run : (b.dataset.a !== 'fast' && !!S.run); });
  const lst = el.querySelector('#lst');
  if (m.kind === 'sensors') {
    set('#r1', m.light + '%'); set('#r2', Math.round(m.dist) + ' см'); set('#r3', m.touch ? '1' : '0');
    if (lst) lst.innerHTML = `белый пол: ${S.seen.white !== undefined ? S.seen.white + '%' : '—'}<br>чёрная линия: ${S.seen.black !== undefined ? S.seen.black + '%' : '—'}<br>касание: ${S.seen.touch ? 'было' : '—'}<br>порог: ${S.thr}% → свет ${m.light}% = ${m.isBlack ? 'чёрное' : 'белое'}`;
  } else if (m.kind === 'motors') {
    set('#r1', f1(S.rb.x)); set('#r2', f1(FH - S.rb.y)); set('#r3', fnum(Math.round(course(S.rb.h))) + '°');
    if (lst) lst.innerHTML = S.moves.length ? S.moves.map((q, i) => `<div>${i + 1}. левый ${sgn(q.L)}%, правый ${sgn(q.R)}%, ${fnum(q.n)} об${q.hit ? ' — упёрся' : ''}</div>`).join('') : '<span class="note">Ходов пока нет.</span>';
  } else {
    set('#r1', m.light + '%'); set('#r2', m.dcs.black ? 'чёрное' : 'белое'); set('#r3', Math.round(m.prog * 100) + '%');
    if (lst) lst.innerHTML = progText();
  }
}

function calcHTML(m) {
  if (m.kind === 'sensors') {
    const d = m.dist, tms = 2 * d / 34300 * 1000;
    const lo = m.seenBlack ? S.seen.black : null, hi = m.seenWhite ? S.seen.white : null;
    let h = `<h2>Дальномер: время эха</h2><div class="formula">s = v · t / 2<br>t = 2 · s / v</div><div class="steps">` +
      step('расстояние s', `${Math.round(d)} см = ${f2(d / 100)} м`) + step('скорость звука v', '343 м/с') +
      step('путь звука туда и обратно', `2 · ${f2(d / 100)} = ${f2(2 * d / 100)} м`) +
      step('время эха t', `${f2(2 * d / 100)} / 343 = ${f2(tms)} мс`, 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Делим на 2, потому что звук летит до препятствия и обратно.</p>`;
    h += `<h2 style="margin-top:22px">Датчик света: порог</h2><div class="formula">порог = (белое + чёрное) / 2</div><div class="steps">` +
      step('сейчас свет', `${m.light}%`) + step('порог', `${S.thr}%`) + step('решение', `${m.light} ${m.isBlack ? '<' : '≥'} ${S.thr} → ${m.isBlack ? 'чёрное' : 'белое'}`, 'sum');
    if (lo !== null && hi !== null) h += step('лучший порог', `(${hi} + ${lo}) / 2 = ${(hi + lo) / 2}%`) + step('допустимо', `от ${lo + 10} до ${hi - 10}%`, m.thrOk ? 'okk' : 'badd');
    else h += step('лучший порог', 'запишите белое и чёрное');
    h += `</div><h3>Касание</h3><div class="steps">` + step('бампер', m.touch ? 'нажат → 1' : 'отпущен → 0', m.touch ? 'okk' : '') + `</div>`;
    return h;
  }
  if (m.kind === 'motors') {
    const pl = m.plan, g = L().garage, st = L().start;
    let h = `<h2>Обороты → сантиметры</h2><div class="formula">C = π · d = 3,14 · ${f1(DW)} ≈ ${f1(CW)} см<br>s = n · C</div>`;
    if (pl) {
      h += `<div class="steps">` + step('мощности', `L ${sgn(S.P.L)}%, R ${sgn(S.P.R)}%`) +
        step('обороты левого', `${fnum(S.P.n)} · ${sgn(S.P.L)} / ${pl.pf} = ${fnum(pl.rotL)}`) + step('обороты правого', `${fnum(S.P.n)} · ${sgn(S.P.R)} / ${pl.pf} = ${fnum(pl.rotR)}`) +
        step('путь левого колеса', `${fnum(pl.rotL)} · ${f1(CW)} = ${f1(pl.sL)} см`) + step('путь правого колеса', `${fnum(pl.rotR)} · ${f1(CW)} = ${f1(pl.sR)} см`) +
        step('ход центра робота', `(${f1(pl.sL)} + ${f1(pl.sR)}) / 2 = ${f1(pl.s)} см`) +
        step('поворот', `(${f1(pl.sL)} − ${f1(pl.sR)}) / ${f1(BW)} = ${f2(pl.dh)} рад ≈ ${Math.round(Math.abs(pl.dh) * 180 / Math.PI)}° ${Math.abs(pl.dh) < 1e-6 ? '' : pl.dh > 0 ? 'вправо' : 'влево'}`, 'sum') +
        step('время хода', `${fnum(S.P.n)} об / ${fnum(pl.pf / 100 * 2)} об/с = ${f2(pl.T)} с`) + `</div>`;
    } else h += '<p class="note">Оба мотора на нуле — колёса не крутятся.</p>';
    h += `<h3>Поворот на месте</h3><div class="steps">` + step('круг под колёсами', `π · ${f1(BW)} = ${f1(Math.PI * BW)} см`) + step('на 90° — четверть', `${f1(Math.PI * BW)} / 4 = ${f1(Math.PI * BW / 4)} см`) + step('в оборотах', `${f1(Math.PI * BW / 4)} / ${f1(CW)} = ${f2(BW / 4 / DW)} об`) + `</div>`;
    h += `<h3>Где гараж</h3><div class="steps">` + step('старт', `x ${f1(st[0])}, y ${f1(FH - st[1])} см`) + step('центр гаража', `x ${f1(g[0])}, y ${f1(FH - g[1])} см`) +
      step('вверх', `${f1(FH - g[1])} − ${f1(FH - st[1])} = ${f1(st[1] - g[1])} см`) + step('вправо', `${f1(g[0])} − ${f1(st[0])} = ${f1(g[0] - st[0])} см`) +
      step('робот до гаража', `${f1(Math.hypot(S.rb.x - g[0], S.rb.y - g[1]))} см, курс ${fnum(Math.round(course(S.rb.h)))}°`, m.inGarage ? 'okk' : '') + `</div>`;
    return h;
  }
  const d = m.dcs, vL = d.L / 100 * VMAX, vR = d.R / 100 * VMAX, v = (vL + vR) / 2, w = (vL - vR) / BW;
  let h = `<h2>Один шаг программы</h2><div class="steps">` + step('1. читаем датчик', `свет = ${m.light}%`) +
    step('2. проверяем условие', `${m.light} < ${S.Q.thr}? → ${d.black ? 'да (чёрное)' : 'нет (белое)'}`) +
    step('3. включаем моторы', `левый ${sgn(d.L)}%, правый ${sgn(d.R)}%`) + step('4. повторяем', 'через 0,01 с снова с шага 1', 'sum') + `</div>`;
  h += `<h3>Что сделают моторы</h3><div class="formula">v = (vл + vп) / 2<br>ω = (vл − vп) / ${f1(BW)}</div><div class="steps">` +
    step('скорость левого', `${sgn(d.L)}% · ${f1(VMAX)} = ${f1(vL)} см/с`) + step('скорость правого', `${sgn(d.R)}% · ${f1(VMAX)} = ${f1(vR)} см/с`) +
    step('скорость робота v', `${f1(v)} см/с`) + step('поворот ω', Math.abs(w) < 1e-9 ? '0 — едет прямо' : `${f2(Math.abs(w))} рад/с ${w > 0 ? 'вправо' : 'влево'}`, 'sum');
  if (Math.abs(w) > 1e-9 && Math.abs(v) > 1e-9) h += step('радиус поворота', `${f1(Math.abs(v / w))} см`);
  h += `</div><h3>Заезд</h3><div class="steps">` + step('пройдено круга', `${Math.round(m.prog * 100)}% из ${Math.round(SL)} см`) + step('время', `${f1(m.t)} с`) + step('кругов', String(m.laps), m.laps ? 'okk' : '') + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'sensors') { el.innerHTML = `<div class="k">Датчики</div><div class="v ${ok ? 'ok' : ''}">свет ${m.light}%</div><div class="lr"><span>→</span><span>${m.isBlack ? 'чёрное' : 'белое'}</span></div><div class="lr"><span>дальн.</span><span>${Math.round(m.dist)} см</span></div><div class="lr"><span>касание</span><span>${m.touch ? 1 : 0}</span></div>`; return; }
  if (m.kind === 'motors') { el.innerHTML = `<div class="k">Робот</div><div class="v ${m.inGarage || ok ? 'ok' : ''}">${f1(S.rb.x)} · ${f1(FH - S.rb.y)}</div><div class="lr"><span>курс</span><span>${fnum(Math.round(course(S.rb.h)))}°</span></div><div class="lr"><span>ходов</span><span>${m.moves}</span></div>`; return; }
  el.innerHTML = `<div class="k">Круг</div><div class="v ${ok ? 'ok' : S.lost ? 'bad' : ''}">${Math.round(m.prog * 100)}%</div><div class="gauge"><b style="width:${(m.prog * 100).toFixed(1)}%"></b></div><div class="lr"><span>свет</span><span>${m.light}%</span></div><div class="lr"><span>время</span><span>${f1(m.t)} с</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  upT = performance.now();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Ваш робот ездит по линии сам!'), 1200);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderTools();
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

  $('#lessons').innerHTML = LESSONS.map((Lx, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Lx.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Lx.title}</span></span>
      ${S.done[Lx.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; tap = null; drag = null;
  S.seen = {}; S.thr = Ls.thr0 || 50; S.P = { L: 50, R: 50, n: 1 }; S.Q = { ...(Ls.prog0 || {}) }; S.fast = false;
  reset(); S.laps = 0;
  scene.classList.toggle('drag', Ls.id === 'sensors');
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderStrip(); buildScheme(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons'); if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}
window.addEventListener('resize', () => requestAnimationFrame(fit));

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
  let now = '';
  if (id === 'sensors') now = `Вид сверху на поле 200×120 см: белый пол, вертикальная чёрная линия шириной 3 см (x от ${LINE1[0]} до ${LINE1[1]} см), ящик-препятствие справа. Робот смотрит вправо, у него датчик света (белое ≈ ${WHITE} %, чёрное ≈ ${BLACK} %), ультразвуковой дальномер и бампер-датчик касания. Робот в точке x ${f1(S.rb.x)}, y ${f1(FH - S.rb.y)} см. Показания: свет ${m.light} %, дальномер ${Math.round(m.dist)} см, касание ${m.touch ? 1 : 0}. Порог ${S.thr} % → сейчас робот считает поверхность ${m.isBlack ? 'чёрной' : 'белой'}. Записано: белое ${m.seenWhite ? S.seen.white + ' %' : 'нет'}, чёрное ${m.seenBlack ? S.seen.black + ' %' : 'нет'}, касание ${m.seenTouch ? 'было' : 'не было'}; порог ${m.thrOk ? 'подходит' : 'пока не подходит'}. Не называй готовое число порога — спроси, между какими показаниями он должен лежать.`;
  if (id === 'motors') { const g = Ls.garage, pl = m.plan; now = `Вид сверху на поле 200×120 см. Робот с двумя моторами, колёса диаметром ${f1(DW)} см (${f1(CW)} см за оборот), между колёсами ${f1(BW)} см. Старт x 30, y 20 см (от нижнего левого угла), курс 90° (вверх). Гараж с центром x ${f1(g[0])}, y ${f1(FH - g[1])} см, въезд слева; стена посреди поля мешает ехать наискосок. Сейчас робот в x ${f1(S.rb.x)}, y ${f1(FH - S.rb.y)} см, курс ${fnum(Math.round(course(S.rb.h)))}°, до центра гаража ${f1(Math.hypot(S.rb.x - g[0], S.rb.y - g[1]))} см. Команда на пульте: левый ${S.P.L} %, правый ${S.P.R} %, ${fnum(S.P.n)} об${pl ? ` (ход ${f1(pl.s)} см, поворот ${Math.round(Math.abs(pl.dh) * 180 / Math.PI)}°)` : ''}. Сделано ходов: ${S.moves.length}${S.moves.length ? ' — ' + S.moves.map(q => `L${q.L} R${q.R} ${q.n}об${q.hit ? ' (упёрся)' : ''}`).join('; ') : ''}. В гараже: ${m.inGarage ? 'да' : 'нет'}. Не говори готовые числа оборотов — помоги посчитать: расстояние делить на длину окружности колеса, разворот на месте — моторы в разные стороны.`; }
  if (id === 'program') { const q = S.Q; now = `Робот-линейщик на замкнутой трассе (овал, чёрная линия 3 см, круг ${Math.round(SL)} см), датчик света в 7 см перед осью колёс. Программа ученика: повторять всегда: если свет < ${q.thr} %, то левый ${q.bL} %, правый ${q.bR} %; иначе левый ${q.wL} %, правый ${q.wR} %. Робот стартует на нижней прямой и едет вправо, значит трасса поворачивает влево (против часовой стрелки). Сейчас свет ${m.light} %, ветка «${m.dcs.black ? 'чёрное' : 'белое'}», пройдено ${Math.round(m.prog * 100)} % круга, время ${f1(m.t)} с, ${S.run ? 'робот едет' : 'робот стоит'}${S.lost ? ', последний заезд: ' + S.lost : ''}. Кругов пройдено: ${S.laps}. Не давай готовые числа — спрашивай, в какую сторону робот должен подворачивать на чёрном и на белом и какое колесо должно крутиться быстрее.`; }
  return [
    `Раздел: информатика, 7 класс, тема «Робототехника». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { sensors: 'Как ультразвуковой датчик измеряет расстояние?', motors: 'Как посчитать обороты колеса для нужного расстояния?', program: 'Почему робот едет по линии «змейкой»?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
