<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Вводный интерактивный курс о профессии Forward Deployed Engineer (FDE): кто это, откуда взялась профессия, сколько платят в 2026 году, плюсы и минусы, один день FDE, первый код у клиента и перспективы.">
<title>Forward Deployed Engineer — вводный курс</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /labs/cs-career and /labs/cs-aiwork. Stage (HTML + SVG screen) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --vio:#a99cff;
  --ink:#04070d;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.sections .sm{display:none}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,185,230,.04) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(160,185,230,.04) 1.5px,transparent 1.5px);background-size:40px 40px;pointer-events:none}

.task{position:absolute;top:14px;left:14px;width:300px;max-width:min(300px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .3s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;min-height:36px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;font-size:12px;line-height:1.45;color:var(--muted);pointer-events:none;z-index:2}

/* ---------- the screen ---------- */
.screen{position:absolute;left:14px;right:14px;top:120px;bottom:60px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;z-index:1;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.bh{font:600 10.5px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bh em{font-style:normal;color:var(--force);letter-spacing:.06em}
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--font-body)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}
.small{font-size:12.5px;color:var(--muted);margin:0}
.src{font:400 11px/1.4 var(--font-body);color:var(--muted);margin:8px 0 0}

/* cards, zones, drag */
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool:empty::after{content:"Все карточки разложены.";font-size:12.5px;color:var(--muted)}
.tcard{display:flex;align-items:center;gap:8px;min-height:42px;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:8px 11px;font:500 13px/1.3 var(--font-body);color:var(--fg);text-align:left;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:1 1 200px;max-width:100%}
.tcard::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--arm);flex:none}
.tcard:hover{border-color:var(--muted)}
.tcard.sel{border-color:var(--force);background:#2a3a56;box-shadow:0 0 0 2px rgba(255,181,71,.25)}
.tcard.sel::before{background:var(--force)}
.tcard.lift{opacity:.35}
.tcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.dghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;opacity:.95;transform:rotate(-1.5deg);box-shadow:0 14px 30px -8px rgba(0,0,0,.7);margin:0}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zone{min-height:110px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:rgba(20,29,46,.6);transition:border-color .2s,background .2s}
.zone.armed{border-color:var(--arm)}
.zone.over{border-color:var(--force);background:rgba(255,181,71,.08)}
.zone.bad{border-color:var(--warn);background:rgba(255,138,115,.1)}
.zone .zh{font:600 11px/1.25 var(--font-body);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.zone .zh small{display:block;font:400 11px/1.3 var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.placed{font-size:12px;line-height:1.3;padding:6px 8px;background:#1f3a2f;border:1px solid var(--ok);border-radius:8px;animation:pop .35s ease-out}
.placed.minus{background:#3a2220;border-color:var(--warn)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;font:600 13.5px/1.2 var(--font-body);cursor:pointer}
.btn.gh{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;background:none;border:0;border-radius:7px;min-height:38px;padding:7px 10px;font:600 12.5px/1.1 var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.opt{display:block;width:100%;text-align:left;min-height:44px;background:var(--surface-2);border:1px solid #3a4762;border-radius:10px;padding:10px 12px;font:500 13.5px/1.35 var(--font-body);color:var(--fg);cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt.ok{border-color:var(--ok);background:#1f3a2f}
.opt.no{border-color:var(--warn);background:#3a2220}
.opts{display:flex;flex-direction:column;gap:6px}
.fb{font-size:13px;line-height:1.45;margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.fb.ok{border-color:rgba(134,224,168,.5)}
.fb.no{border-color:rgba(255,138,115,.5)}

/* lesson 2: timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:8px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--vio),var(--arm),var(--force))}
.slot{position:relative;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-size:13px;color:var(--muted)}
.slot::before{content:"";position:absolute;left:-20px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.slot.next{border-color:var(--arm);color:var(--fg);cursor:pointer}
.slot.next::before{border-color:var(--arm)}
.slot.over{border-color:var(--force);background:rgba(255,181,71,.08)}
.slot.fill{border-style:solid;border-color:#3a4762;background:var(--surface-2);color:var(--fg)}
.slot.fill::before{background:var(--force);border-color:var(--force)}
.slot.fresh{animation:pop .4s ease-out}
.slot .yr{font:500 11.5px/1 var(--font-mono);color:var(--force);margin-bottom:4px}
.slot b{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.slot p{margin:5px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}
.duo div{background:var(--bg);border-radius:8px;padding:7px 8px;font-size:12px;line-height:1.35;color:var(--muted)}
.duo b{font-size:12.5px;color:var(--fg)}
.jbars{margin-top:8px;display:grid;gap:5px}
.jb{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;gap:6px;align-items:center;font:500 11.5px/1 var(--font-mono);color:var(--muted)}
.jb i{display:block;height:12px;border-radius:4px;background:var(--arm);transform-origin:left;animation:grow 1.2s ease-out both}
.jb.big i{background:var(--force);animation-delay:.3s}
@keyframes grow{from{transform:scaleX(0)}}

/* lesson 3: salaries */
.ctlrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.rate{flex:1 1 220px;min-width:0}
.rate label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.rate output{font:500 13px var(--font-mono);color:var(--fg)}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force);min-height:28px}
.chart{display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 10px;align-items:center;width:100%;background:none;border:1px solid transparent;border-radius:9px;padding:6px 6px;text-align:left;cursor:pointer;color:var(--fg)}
.crow:hover{border-color:var(--line)}
.crow.pick{border-color:var(--force);background:rgba(255,181,71,.07)}
.crow.okpick{border-color:var(--ok);background:rgba(134,224,168,.07)}
.crow .nm{font:600 12.5px/1.25 var(--font-body)}
.crow .nm small{display:block;font:400 11px/1.3 var(--font-body);color:var(--muted)}
.trk{position:relative;height:30px}
.trk .ax{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--line)}
.trk .rg{position:absolute;top:5px;height:14px;border-radius:5px;transition:left .45s,width .45s}
.trk .md{position:absolute;top:2px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--fg);transition:left .45s}
.trk .vl{position:absolute;left:0;top:21px;font:500 10.5px/1 var(--font-mono);color:var(--muted);white-space:nowrap}
.co .rg{background:var(--arm)}
.us .rg{background:rgba(169,156,255,.55)}
.kz .rg{background:var(--ok)}
.ticks{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px;padding:0 6px;font:500 10px/1 var(--font-mono);color:var(--muted)}
.ticks div{position:relative;height:12px}.ticks div span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}.ticks div span:first-child{transform:none}
.calc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.calc input{flex:1 1 160px;min-width:0;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--fg);font:500 15px var(--font-mono)}
.honest{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.honest li{font-size:12.5px;line-height:1.45;color:var(--muted);padding-left:14px;position:relative}
.honest li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--force)}

/* lesson 4: radar + sliders */
.selfgrid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:center}
.sl{margin-bottom:4px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.sl output{font:500 12px var(--font-mono);color:var(--muted)}
.verdict{font-size:13.5px;line-height:1.45;margin-top:8px}

/* lesson 5: day */
.mtrs{display:grid;gap:7px}
.mt{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:12.5px;position:relative}
.mt .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mt .tr b{display:block;height:100%;border-radius:5px;transition:width .7s cubic-bezier(.3,1.4,.5,1),background .4s}
.mt span{font:500 12.5px var(--font-mono);text-align:right}
.mt .need{position:absolute;top:-2px;width:2px;height:14px;background:var(--force)}
.dl{position:absolute;right:0;top:-6px;font:600 12px var(--font-mono);animation:floatup 1.6s ease-out forwards;pointer-events:none}
.dl.p{color:var(--ok)}.dl.m{color:var(--warn)}
@keyframes floatup{from{transform:translateY(6px);opacity:0}25%{opacity:1}to{transform:translateY(-16px);opacity:0}}
.scn .clock{font:500 12px/1 var(--font-mono);color:var(--force)}
.scn h3{font:600 15px/1.35 var(--font-body);margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{font:500 12px/1 var(--font-mono);border-radius:7px;padding:6px 8px;background:var(--bg);border:1px solid var(--line)}
.chips span.p{color:var(--ok);border-color:rgba(134,224,168,.4)}
.chips span.m{color:var(--warn);border-color:rgba(255,138,115,.4)}

/* lesson 6: code */
.csv{width:100%;border-collapse:collapse;font:400 12px/1.3 var(--font-mono)}
.csv td,.csv th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.csv th{font:600 10.5px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.csv tr.drop td{color:var(--warn);text-decoration:line-through}
.csv tr.drop td:last-child{text-decoration:none}
.csv .cat{color:var(--ok)}
.code{display:flex;flex-direction:column;gap:5px;counter-reset:ln}
.ln{display:flex;align-items:stretch;gap:6px;background:#0d1420;border:1px solid #2b3650;border-radius:9px;min-height:44px}
.ln.sel{border-color:var(--force)}
.ln.bad{border-color:var(--warn);background:#24161a}
.ln.good{border-color:rgba(134,224,168,.6)}
.ln.over{border-color:var(--force);background:rgba(255,181,71,.08)}
.ln .tx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ln .tx::before{counter-increment:ln;content:counter(ln);font:500 10.5px var(--font-mono);color:#56627d;min-width:12px;flex:none}
.ln code{font:500 12.5px/1.4 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#dfe6f3}
.ln code .kw{color:#c792ea}.ln code .fn{color:var(--arm)}.ln code .st{color:var(--ok)}.ln code .cm{color:#56627d}
.ln .mv{display:flex;flex:none}
.ln .mv button{width:40px;min-height:42px;background:none;border:0;border-left:1px solid #2b3650;color:var(--muted);cursor:pointer;font:500 14px/1 var(--font-mono)}
.ln .mv button:hover{color:var(--fg)}
.ln .mv button:disabled{opacity:.25;cursor:default}
pre.snip{margin:0;background:#0d1420;border:1px solid #2b3650;border-radius:9px;padding:9px 10px;font:500 12px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#dfe6f3}
pre.snip .hl{background:rgba(255,138,115,.18);border-radius:3px}
pre.snip .gd{background:rgba(134,224,168,.16);border-radius:3px}

/* lesson 7: future */
.shares{display:grid;gap:6px;margin-top:8px}
.sh{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:12.5px}
.sh .sb{display:flex;height:12px;border-radius:5px;overflow:hidden;background:var(--line)}
.sh .sb i{display:block;height:100%;transition:width .4s}
.sh .sb .ai{background:var(--arm)}.sh .sb .hu{background:var(--force)}
.sh .lg{display:flex;justify-content:space-between;font:500 11px/1 var(--font-mono);color:var(--muted)}
.yr{font:600 22px/1 var(--font-display);color:var(--fg)}
.ladinfo{font-size:13px;line-height:1.45;margin-top:6px;min-height:58px}
.ladinfo b{color:var(--force)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;background:var(--force);color:#1a1300;border-radius:12px;padding:12px 14px;text-decoration:none;font:600 14px/1.3 var(--font-body)}
.cta:hover{filter:brightness(1.07)}

/* svg animation helpers */
.mv-t{transition:transform .8s cubic-bezier(.4,1.3,.5,1)}
.beam{transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.car.go{animation:drive 2.4s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
.puff{opacity:0}
.car.go .puff{animation:puff 1.2s ease-out infinite}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(14px,-6px) scale(1.4)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.walk{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:80vh;min-height:620px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  /* phone: no overlay — task, meter, screen and tools simply stack, the page scrolls */
  .stage{height:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
  .task,.meter,.tools,.screen{position:static!important;transform:none;max-width:none}
  .task{width:auto;padding:9px 11px}
  .task p{font-size:13px}
  .meter{width:auto;padding:8px 10px}
  .screen{overflow:visible}
  .tools{align-self:center;max-width:100%}
  .tools button{padding:6px 8px;font-size:12px}
  .hint{display:none}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .sections .lg{display:none}.sections .sm{display:inline}
  .crow,.ticks{grid-template-columns:minmax(0,1fr)}
  .ticks>span{display:none}
  .selfgrid{grid-template-columns:minmax(0,1fr)}
  .selfgrid svg{max-width:220px;margin:0 auto}
  .mt{grid-template-columns:96px minmax(0,1fr) 32px}
  .tcard{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Профессии" style="cursor:pointer" onclick="location.href='/prof/'" onkeydown="if(event.key==='Enter')location.href='/prof/'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27h12v10.5H12z" fill="#c8803e"/><path d="M10.5 31.5Q18 35.2 25.5 31.5" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="33.6" r="1.6" fill="#ffd896"/><ellipse cx="18" cy="19.5" rx="11" ry="10" fill="#c8803e"/><path d="M19 15.5Q27 14.8 33.5 17.2Q38 19 37.6 23.2Q37 27.6 31.5 28Q24 28.4 19 26Z" fill="#c8803e"/><path d="M21 24.6Q27 27.4 32.5 26.9Q35.6 26.5 36.6 24.6Q32 25.8 27 24.6Q24 23.9 21 24.6Z" fill="#e7b37c"/><ellipse cx="35.6" cy="20.6" rx="2.5" ry="2.1" fill="#1b1206"/><circle cx="36.2" cy="19.9" r=".7" fill="#fff" opacity=".7"/><path d="M27.5 27.2Q30.5 28.8 33.6 27.3" fill="none" stroke="#5a3214" stroke-width="1" stroke-linecap="round"/><circle cx="22.4" cy="17.2" r="2.4" fill="#1b1206"/><circle cx="23.2" cy="16.4" r=".85" fill="#fff"/><path d="M19.8 13.6Q22.4 12.2 25 13.4" fill="none" stroke="#8a4f20" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 10.5Q4 11.5 4.2 21Q4.4 29.5 10.2 30.2Q13.4 30.4 14.2 26Q15.4 18 14.6 11.6Q13.6 10.2 11.5 10.5Z" fill="#8a4f20"/><path d="M7.4 16Q6.6 22 8.4 27" fill="none" stroke="#a8622b" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Профессии · Forward Deployed Engineer</small></div>

    <div class="headr">
      <nav class="sections" aria-label="Разделы"><a href="/prof/">Профессии</a><a href="/prof/fde/"><span class="lg">Forward Deployed Engineer</span><span class="sm">FDE</span></a><a href="/labs/prof-fde/" aria-current="page">Вводный курс</a></nav>
      <div class="prog" aria-label="Прогресс"><b>FDE: вводный</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/7</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Экран лаборатории: интерактивные задания о профессии FDE">

    <div class="hint" id="hint"></div>

    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>

  <nav class="strip" aria-label="Уроки">

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const big = n => Math.round(n).toLocaleString('ru-RU');
const fmt = (x, n = 1) => (Math.round(x * 10 ** n) / 10 ** n).toFixed(n).replace('.', ',');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const LESSONS = [
  { id: 'who', title: 'Кто такой FDE — на пальцах',
    text: ['Представь: компания сделала мощный новый мотор — ИИ-модель. А у клиента своя старая машина: свои процессы, данные и программы. Сам мотор в машину не запрыгнет.',
           'Forward Deployed Engineer (FDE) — инженер, которого «выдвигают вперёд», прямо к клиенту. Он разбирается, как устроена машина клиента, встраивает мотор и добивается, чтобы она поехала.'],
    why: 'Компании покупают ИИ быстрее, чем умеют им пользоваться. Тот, кто умеет довезти ИИ до настоящей работы, нужен почти везде.',
    task: 'Разложи 8 рабочих задач: это делает обычный разработчик продукта или FDE?',
    hint: 'Спроси себя: задача решается для всех клиентов сразу или для одного клиента — у него на месте? Тяни карточку в колонку или нажми карточку, а потом колонку.',
    stage: 'С каждой верной карточкой FDE проходит дальше по мосту к клиенту.',
    check: m => m.placed === m.total },
  { id: 'history', title: 'Откуда взялась профессия',
    text: ['Профессию придумала американская компания Palantir в конце двухтысячных. Её инженеры работали прямо у заказчиков — в госструктурах — и собирали программу под их задачу.',
           'После выхода ChatGPT в конце 2022 года компании начали массово покупать ИИ, но встроить его в работу сами не смогли. Так FDE стала одной из самых быстрорастущих профессий.'],
    why: 'Зная историю, легче понять, за что здесь платят: за умение довести технологию до результата у клиента.',
    task: 'Расставь 5 событий по порядку — от самого раннего к самому новому.',
    hint: 'Тяни карточку на следующее свободное место линии времени или просто нажми на неё. Подумай, что должно было случиться раньше.',
    stage: 'Линия времени заполняется сверху вниз. Под каждым событием — короткий факт.',
    check: m => m.placed === m.total },
  { id: 'pay', title: 'Сколько платят',
    text: ['FDE — одна из самых высокооплачиваемых инженерных ролей 2026 года. По вакансиям, медианная зарплата FDE заметно выше, чем у обычного программиста.',
           'Но цифры из США — не то, что ты получишь, живя в Казахстане. Реальный путь — удалённая работа на зарубежную компанию или переезд. Акции и налоги здесь не учтены.'],
    why: 'Умение быстро перевести «вилку» из вакансии в тенге в месяц спасает от розовых очков и помогает торговаться о зарплате.',
    task: '1) Нажми на компанию с самой высокой нижней границей вилки. 2) Посчитай, сколько тенге в месяц дают $188 000 в год при курсе 500.',
    hint: 'Нижняя граница — левый край полосы. В месяц = в год ÷ 12. В тенге = доллары × курс.',
    stage: 'Переключи «в год, $» и «в месяц, ₸», подвигай курс.',
    check: m => m.pickOk && m.calcOk },
  { id: 'pros', title: 'Сильные и слабые стороны',
    text: ['У любой профессии есть цена. FDE много зарабатывает и быстро растёт, но живёт в командировках, дедлайнах и постоянном общении.',
           'Положи плюсы и минусы на весы, а потом честно оцени, насколько это про тебя.'],
    why: 'Профессию выбирают не только по зарплате, но и по тому, какие минусы ты готов терпеть каждый день.',
    task: 'Разложи 11 карточек на «плюс» и «минус», потом пройди самопроверку и нажми «Показать вывод».',
    hint: 'Плюс — то, что делает работу привлекательной. Минус — то, за что приходится платить нервами и временем.',
    stage: 'Весы наклоняются туда, где больше карточек.',
    check: m => m.placed === m.total && m.selfDone },
  { id: 'day', title: 'Один день FDE',
    text: ['Ты FDE в проекте у крупного банка. Вы внедряете ИИ-ассистента для операторов колл-центра. Сегодня день будет непростым.',
           'В каждой ситуации выбери, что сделать. Следи за тремя шкалами: доверие клиента, качество и запас времени.'],
    why: 'Именно такие решения — спросить, измерить, предупредить заранее — отличают сильного FDE от просто хорошего программиста.',
    task: 'Проживи день и закончи его с доверием клиента не меньше 70.',
    hint: 'Быстро — не всегда хорошо. Клиент доверяет тому, кто задаёт вопросы, меряет результат цифрами и не прячет проблемы.',
    stage: 'Солнце движется по небу: с утра до вечера пять решений.',
    check: m => m.end && m.trust >= 70 },
  { id: 'code', title: 'Первый код у клиента',
    text: ['Клиент — служба поддержки. У неё таблица (CSV) с тысячами обращений, и их надо разложить по темам. Твой код читает таблицу, чистит её, спрашивает модель и сохраняет тему в CRM.',
           'Собери функцию из перемешанных строк. Отступы уже стоят: в Python они показывают, какие строки находятся внутри цикла.'],
    why: 'Такие маленькие конвейеры данных — ежедневная работа FDE: из хаоса у клиента сделать поток, который работает сам.',
    task: 'Собери строки функции в правильном порядке, нажми «Запустить» и найди ошибку в коде запроса к модели.',
    hint: 'Порядок как на кухне: сначала достать продукты, потом помыть, потом готовить. Строки двигай стрелками ▲▼ или перетаскивай.',
    stage: 'Когда порядок верный, данные побегут по конвейеру CSV → чистка → модель → CRM.',
    check: m => m.orderOk && m.bugOk },
  { id: 'future', title: 'Что дальше: перспективы',
    text: ['ИИ-агенты всё лучше пишут типовой код. Значит ли это, что FDE не нужен? Скорее наоборот: рутина уходит к машине, а человеку остаётся понять клиента, договориться и отвечать за результат.',
           'Разложи задачи, двигай ползунок от 2026 к 2030 году и посмотри на лестницу карьеры.'],
    why: 'Выбирая профессию на годы вперёд, полезно понимать, какая часть работы останется за человеком.',
    task: 'Разложи 6 задач: что к 2030 году в основном сможет делать ИИ-агент, а что останется за человеком.',
    hint: 'Спроси: здесь нужен типовой результат по шаблону — или доверие, переговоры и ответственность?',
    stage: 'Ползунок лет показывает условный прогноз доли ИИ в каждой задаче.',
    check: m => m.placed === m.total },
];

const KEY = 'luch-prof-fde';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- data ----------
const C1 = [
  { id: 'gen', t: 'Пишет общую функцию для тысяч клиентов', g: 'prod' },
  { id: 'bank', t: 'Сидит в офисе банка и ищет, где теряются заявки', g: 'fde' },
  { id: 'btn', t: 'Улучшает кнопку в приложении для всех пользователей', g: 'prod' },
  { id: 'crm', t: 'Подключает ИИ-модель к CRM клиента', g: 'fde' },
  { id: 'plan', t: 'Планирует новую версию продукта на полгода вперёд', g: 'prod' },
  { id: 'demo', t: 'Показывает демо руководителю клиента', g: 'fde' },
  { id: 'speed', t: 'Ускоряет общий код продукта сразу для всех', g: 'prod' },
  { id: 'clinic', t: 'За две недели собирает прототип под задачу клиники', g: 'fde' },
];
const Z1 = [{ id: 'prod', name: 'Разработчик продукта', sub: 'делает одно для всех' }, { id: 'fde', name: 'FDE', sub: 'встраивает у одного клиента' }];
const GQ1 = {
  gen: 'Для тысяч клиентов сразу — это у клиента на месте или в общем продукте?',
  bank: 'Где сидит этот человек — в своём офисе или у конкретного клиента?',
  btn: 'Кнопку увидят все пользователи. Это работа для одного клиента?',
  crm: 'CRM — система конкретного клиента. Кто встраивает в неё модель?',
  plan: 'План версии на полгода касается всех клиентов. Кто отвечает за общий продукт?',
  demo: 'Руководитель клиента хочет увидеть результат у себя. Кто к нему едет?',
  speed: 'Ускорение получат все клиенты сразу. Это общий продукт или один клиент?',
  clinic: 'Прототип под задачу одной клиники — кто собирает такое у клиента?',

  S.tl = []; S.fresh = null;
  S.mode = 'year'; S.rate = 500; S.pick = null; S.pickOk = false; S.calcIn = ''; S.calcOk = false; S.calcTry = 0;
  S.self = [5, 5, 5, 5, 5, 5]; S.selfDone = false;
  S.d = { step: 0, phase: 'ask', trust: 45, quality: 50, time: 60, log: [], last: null, choice: null };
  S.order = CODE_START.slice(); S.codeSel = null; S.orderOk = false; S.runs = 0; S.badLine = null; S.bug = null;
  S.year = 2026; S.lad = null;

function model() {
  const id = LID();
  if (id === 'who') return { placed: C1.filter(c => S.place[c.id]).length, total: C1.length, miss: S.miss };
  if (id === 'history') return { placed: S.tl.length, total: EV.length, miss: S.miss };
  if (id === 'pay') return { pickOk: S.pickOk, calcOk: S.calcOk };
  if (id === 'pros') {
    const plus = C4.filter(c => S.place[c.id] === 'plus').length, minus = C4.filter(c => S.place[c.id] === 'minus').length;
    return { placed: plus + minus, total: C4.length, plus, minus, miss: S.miss, selfDone: S.selfDone };
  }
  if (id === 'day') return { trust: S.d.trust, quality: S.d.quality, time: S.d.time, step: S.d.step, end: S.d.phase === 'end' };
  if (id === 'code') return { orderOk: S.orderOk, bugOk: S.bug === BUG_OK, runs: S.runs };
  return { placed: C7.filter(c => S.place[c.id]).length, total: C7.length, miss: S.miss };
}

$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i;
  resetState();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  build();
  screen.scrollTop = 0;
  renderTools(); renderStrip(); update();
  requestAnimationFrame(fit);
  const cur = $('#lessons .lesson[aria-current="true"]'), ls = $('#lessons');
  if (cur) { const dx = cur.getBoundingClientRect().left - ls.getBoundingClientRect().left; if (dx < 0 || dx + cur.offsetWidth > ls.clientWidth) ls.scrollLeft += dx - 8; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = L(), id = Ls.id;
