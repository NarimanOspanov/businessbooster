<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по геометрии, 8 класс: касательная к окружности, вписанные углы, вписанная и описанная окружность треугольника.">
<title>Окружность</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG grid) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:120px;width:100%;height:calc(100% - 174px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag="v"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.yes{color:var(--ok)}.no{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:70vh;min-height:520px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 250px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="20" cy="22" r="11" fill="rgba(114,212,232,.12)" stroke="var(--arm)" stroke-width="1.8"/><path d="M5 11H35" stroke="var(--force)" stroke-width="1.6"/><path d="M20 22V11" stroke="var(--force)" stroke-width="1.3" stroke-dasharray="3 2"/><circle cx="20" cy="22" r="2" fill="var(--fg)"/><circle cx="20" cy="11" r="2" fill="var(--fg)"/></svg>
      <div><h1>OPEN EDU</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Геометрия</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивный чертёж: окружность на клетчатой сетке. Точки и вершины можно перетаскивать."></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const KEY = 'luch-math-circ';
const f1c = v => String(Math.round(v * 10) / 10).replace('.', ',');
const f2c = v => String(Math.round(v * 100) / 100).replace('.', ',');
const RAD = Math.PI / 180;
const R0 = 3;

const LESSONS = [
  { id: 'tan', title: 'Касательная',
    text: ['Прямая и окружность могут иметь две общие точки, одну или ни одной. Всё решает расстояние d от центра O до прямой: d < r — прямая секущая, d = r — касательная, d > r — общих точек нет.',
           'Касательная касается окружности ровно в одной точке K. Главное свойство: касательная перпендикулярна радиусу OK, проведённому в точку касания. И наоборот: прямая, перпендикулярная радиусу в его конце на окружности, — касательная.',
           'Из точки P вне окружности можно провести две касательные. Их отрезки от P до точек касания равны: PK₁ = PK₂, а центр O лежит на биссектрисе угла между ними.'],
    why: 'Касательные — это плавные переходы. Инженер-дорожник рассчитывает съезд с трассы Алматы — Астана так, чтобы прямой участок переходил в дугу по касательной: иначе машину резко дёрнет на повороте. Конструктор ремённой передачи (генератор в машине, конвейер на элеваторе, станок в цехе) знает, что ремень сходит со шкива по касательной, и по ней считает длину ремня. Токарь и оператор станка с ЧПУ задают сопряжения дуг и прямых в программе детали.',
    task: 'Из точки P проведите обе касательные к окружности: поворачивайте прямую, пока у неё с окружностью не останется одна общая точка. Затем сравните отрезки PK₁ и PK₂.',
    hint: 'Тяните оранжевую ручку на прямой. Когда прямая почти касается окружности, она «прилипает» к касательной. Вторая касательная — с другой стороны от центра.',
    stage: 'Тяните точку P (встаёт на узлы сетки) и оранжевую ручку — она поворачивает прямую. 1 клетка = 1 см.',
    P: [5, 0], phi: 170,
    check: m => m.found >= 2 },
  { id: 'insc', title: 'Вписанные углы',
    text: ['Центральный угол — угол с вершиной в центре окружности. Он равен дуге, на которую опирается: если ∠AOB = 120°, то и дуга AB = 120°.',
           'Вписанный угол — вершина на окружности, а стороны пересекают окружность. Теорема: вписанный угол равен половине дуги, на которую он опирается. Поэтому все вписанные углы, опирающиеся на одну дугу, равны.',
           'Следствие: вписанный угол, опирающийся на диаметр (дуга 180°), — прямой.'],
    why: 'Архитектор зрительного зала или стадиона пользуется этой теоремой: из всех точек одной дуги, проходящей через края сцены, сцена видна под одним и тем же углом — значит, зрителям на этой дуге она кажется одинаково широкой. Футбольный тренер объясняет, с какой точки ворота «видны» под большим углом. Столяр находит центр круглой заготовки угольником: прямой угол, вписанный в окружность, опирается на диаметр — два таких диаметра пересекаются в центре.',
    task: 'Сделайте дугу AB, на которую опирается угол ACB, равной 120°. Поставьте C в три разные точки так, чтобы ∠ACB каждый раз был 60°. Потом сделайте AB диаметром и посмотрите, каким станет ∠ACB.',
    hint: 'Точки двигаются по окружности шагами по 5°. Вписанный угол опирается на дугу, которая не содержит точку C. Для диаметра A и B должны стоять друг напротив друга.',
    stage: 'Тяните точки A, B и C по окружности. Подсвечена дуга, на которую опирается угол ACB.',
    A: 200, B: 340, C: 90,
    check: m => m.found >= 3 && m.diam },
  { id: 'circum', title: 'Вписанная и описанная окружность',
    text: ['Описанная окружность проходит через все три вершины треугольника. Её центр — точка пересечения серединных перпендикуляров к сторонам: она одинаково удалена от A, B и C. Радиус R = abc : 4S.',
           'Вписанная окружность касается всех трёх сторон. Её центр — точка пересечения биссектрис углов: она одинаково удалена от сторон. Радиус r = S : p, где p — полупериметр.',

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
  P1: [5, 0], phi: 170, tside: 0, tf: new Set(), showD: true,
  A: 200, B: 340, C: 90, c2: [], diam: false, showCen: true, showChord: true,
  P3: {}, selV: 'B', out: false, inn: false, build: true, f3: new Set() };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;
const mod = (v, n) => ((v % n) + n) % n;
const cdiff = (a, b) => { const d = mod(a - b, 360); return Math.min(d, 360 - d); };
const KS = ['A', 'B', 'C'];

// ---------- frame: 1 cm = SC px, origin in the middle, y up ----------
const GX = 6, GY = 4, SC = 40, OX = 260, OY = 182;
const sp = p => ({ x: OX + p[0] * SC, y: OY - p[1] * SC });
const vec = (p, q) => [q[0] - p[0], q[1] - p[1]];
const cr = (u, w) => u[0] * w[1] - u[1] * w[0];
const dt = (u, w) => u[0] * w[0] + u[1] * w[1];
const n2 = u => u[0] * u[0] + u[1] * u[1];
const len = u => Math.sqrt(n2(u));
const add = (p, u, k = 1) => [p[0] + u[0] * k, p[1] + u[1] * k];
const dirOf = deg => [Math.cos(deg * RAD), Math.sin(deg * RAD)];
const angOf = u => Math.atan2(u[1], u[0]) / RAD;
const onC = deg => [R0 * Math.cos(deg * RAD), R0 * Math.sin(deg * RAD)];
const angAt = (V, U, W) => { const a = vec(V, U), b = vec(V, W); return Math.acos(clamp(dt(a, b) / (len(a) * len(b) || 1), -1, 1)) / RAD; };

// ---------- lesson 1: tangent ----------
function tanAngles(P) {
  const D = len(P), a = angOf([-P[0], -P[1]]), b = Math.asin(clamp(R0 / D, -1, 1)) / RAD;
  return [[a + b, 1], [a - b, -1]];
}
function setPhi(phi) {
  phi = mod(phi, 180); S.tside = 0;
  for (const [t, side] of tanAngles(S.P1)) {
    const tm = mod(t, 180), d = Math.abs(phi - tm);
    if (Math.min(d, 180 - d) < 2.5) { phi = tm; S.tside = side; }
  }
  S.phi = phi; update();
}
function setP1(x, y) {
  x = clamp(Math.round(x), -GX, GX); y = clamp(Math.round(y), -GY, GY);
  if (x * x + y * y < 12.25) return false;
  if (S.P1[0] === x && S.P1[1] === y) return true;
  S.P1 = [x, y]; S.tf = new Set(); setPhi(S.phi); return true;
}
function tanPoint(P, deg) { const u = dirOf(deg); return add(P, u, dt([-P[0], -P[1]], u)); }
function tanModel() {
  const P = S.P1, D = len(P), u = dirOf(S.phi), d = Math.abs(cr(u, [-P[0], -P[1]]));
  const H = add(P, u, dt([-P[0], -P[1]], u)), tangent = S.tside !== 0;
  const count = tangent ? 1 : d < R0 ? 2 : 0;
  const X = count === 2 ? [add(H, u, Math.sqrt(R0 * R0 - d * d)), add(H, u, -Math.sqrt(R0 * R0 - d * d))] : [];
  const Ks = {}; tanAngles(P).forEach(([t, side]) => { if (S.tf.has(side)) Ks[side] = tanPoint(P, t); });
  return { kind: 'tan', r: R0, P, D, phi: S.phi, u, d: tangent ? R0 : d, H, tangent, count, X, Ks, PK: Math.sqrt(Math.max(0, D * D - R0 * R0)), side: S.tside, found: S.tf.size };
}

// ---------- lesson 2: inscribed angles ----------
function setAng(k, deg) {
  deg = mod(Math.round(deg / 5) * 5, 360);
  if (deg === S[k]) return;
  if (KS.some(q => q !== k && cdiff(S[q], deg) < 10)) return;
  S[k] = deg; update();
}
function inscModel() {
  const span = mod(S.B - S.A, 360), cIn = mod(S.C - S.A, 360) < span;
  const arc = cIn ? 360 - span : span, from = cIn ? S.B : S.A;
  const A = onC(S.A), B = onC(S.B), C = onC(S.C);
  const ang = angAt(C, A, B);
  return { kind: 'insc', A, B, C, a: S.A, b: S.B, c: S.C, arc, from, ang, angA: angAt(A, C, B), angB: angAt(B, A, C), diam: S.diam, found: S.c2.length, isDiam: arc === 180 };
}

// ---------- lesson 3: circles of a triangle ----------
function setV(k, x, y) {
  x = clamp(Math.round(x), -GX, GX); y = clamp(Math.round(y), -GY, GY);
  const p = S.P3[k]; if (p[0] === x && p[1] === y) return true;
  if (KS.some(q => q !== k && S.P3[q][0] === x && S.P3[q][1] === y)) return false;
  S.P3[k] = [x, y]; update(); return true;
}
const TT = { acute: 'остроугольный', right: 'прямоугольный', obtuse: 'тупоугольный', bad: 'вырожденный' };
const TC = { acute: '#86e0a8', right: '#ffb547', obtuse: '#ff9fc4', bad: '#ff8a73' };
function triModel() {
  const { A, B, C } = S.P3;
  const a = len(vec(B, C)), b = len(vec(C, A)), c = len(vec(A, B));
  const ar2 = cr(vec(A, B), vec(A, C)), valid = ar2 !== 0, Sq = Math.abs(ar2) / 2, p = (a + b + c) / 2;
  const dA = dt(vec(A, B), vec(A, C)), dB = dt(vec(B, A), vec(B, C)), dC = dt(vec(C, A), vec(C, B));
  const type = !valid ? 'bad' : (dA < 0 || dB < 0 || dC < 0) ? 'obtuse' : (dA === 0 || dB === 0 || dC === 0) ? 'right' : 'acute';
  const rv = dA === 0 ? 'A' : dB === 0 ? 'B' : dC === 0 ? 'C' : null;
  let O = null, I = null, R = 0, r = 0;
  if (valid) {
    const D = 2 * (A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
    const q = P => P[0] * P[0] + P[1] * P[1];
    O = [(q(A) * (B[1] - C[1]) + q(B) * (C[1] - A[1]) + q(C) * (A[1] - B[1])) / D, (q(A) * (C[0] - B[0]) + q(B) * (A[0] - C[0]) + q(C) * (B[0] - A[0])) / D];
    R = a * b * c / (4 * Sq); r = Sq / p;
    I = [(a * A[0] + b * B[0] + c * C[0]) / (2 * p), (a * A[1] + b * B[1] + c * C[1]) / (2 * p)];
  }
  const ang = valid ? { A: angAt(A, B, C), B: angAt(B, A, C), C: angAt(C, A, B) } : { A: 0, B: 0, C: 0 };
  return { kind: 'tri', A, B, C, a, b, c, valid, Sq, p, type, rv, O, I, R, r, ang, out: S.out, inn: S.inn, found: S.f3.size };
}

function model() { const id = LID(); return id === 'tan' ? tanModel() : id === 'insc' ? inscModel() : triModel(); }

function harvest(m) {
  const id = LID();
  if (id === 'tan' && m.tangent && !S.tf.has(m.side)) {
    S.tf.add(m.side); m.found = S.tf.size; m.Ks[m.side] = tanPoint(m.P, S.phi);
    toast(S.tf.size === 1 ? 'Есть касательная! Одна общая точка, радиус OK ⟂ прямой. Теперь вторая.' : 'Обе касательные! Сравните PK₁ и PK₂.');
  }
  if (id === 'insc') {
    if (m.arc === 120 && !S.c2.some(c => cdiff(c, S.C) < 30)) {
      S.c2.push(S.C); m.found = S.c2.length;
      if (S.c2.length <= 3) toast(`∠ACB = ${Math.round(m.ang)}° — положение ${S.c2.length} из 3`);
    }
    if (m.isDiam && !S.diam) { S.diam = true; m.diam = true; toast('AB — диаметр: ∠ACB = 90°!'); }
  }
  if (id === 'circum' && m.valid) {
    const add1 = (k, msg) => { if (!S.f3.has(k)) { S.f3.add(k); toast(msg); } };
    if (S.out) add1(m.type, { acute: 'Остроугольный: центр описанной окружности внутри.', right: 'Прямоугольный: центр — на середине гипотенузы!', obtuse: 'Тупоугольный: центр описанной окружности снаружи.' }[m.type]);
    if (S.inn) add1('in', 'Вписанная окружность касается всех трёх сторон.');
    m.found = S.f3.size;
  }
}

// ---------- drawing ----------
const DIM = [520, 372];
const scene = $('#scene');
const f1 = v => v.toFixed(1);
const txt = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" ${extra}>${s}</text>`;
const say = (x, y, s, fs, fill, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" font-size="${fs}" fill="${fill}" text-anchor="middle" font-family="Golos Text,sans-serif" ${extra}>${s}</text>`;
const line = (p, q, st, w, extra = '') => `<path d="M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
const PT = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * RAD), y: c.y - r * Math.sin(deg * RAD) });
const sector = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(c.x)} ${f1(c.y)}L${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}Z`; };
const arcPath = (c, r, a0, a1) => { const p = PT(c, r, a0), q = PT(c, r, a1); return `M${f1(p.x)} ${f1(p.y)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${f1(q.x)} ${f1(q.y)}`; };
const knob = (k, p, col, r = 8) => `<g data-drag="v" data-k="${k}" data-part="knobs"><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="20" fill="transparent"/><circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/></g>`;
const halo = 'paint-order="stroke" stroke="#0e1520" stroke-width="4"';
const dot = (p, col, r = 4) => `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" fill="${col}"/>`;
const unit = (p, q) => { const L = Math.hypot(q.x - p.x, q.y - p.y) || 1; return { ux: (q.x - p.x) / L, uy: (q.y - p.y) / L }; };
function rightMark(V, U, W, col) {
  const a = unit(V, U), b = unit(V, W), r = 10, p1 = { x: V.x + a.ux * r, y: V.y + a.uy * r }, p2 = { x: V.x + b.ux * r, y: V.y + b.uy * r }, p3 = { x: p1.x + b.ux * r, y: p1.y + b.uy * r };
  return `<path d="M${f1(p1.x)} ${f1(p1.y)}L${f1(p3.x)} ${f1(p3.y)}L${f1(p2.x)} ${f1(p2.y)}" fill="none" stroke="${col}" stroke-width="1.4"/>`;
}
function ticks(p, q, n, col) {
  let h = ''; const { ux, uy } = unit(p, q), m = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
  for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 5, c = { x: m.x + ux * o, y: m.y + uy * o }; h += line({ x: c.x - uy * 6, y: c.y + ux * 6 }, { x: c.x + uy * 6, y: c.y - ux * 6 }, col, 1.6); }
  return h;
}
function gridSVG(dim) {
  let h = `<g data-part="grid" pointer-events="none" opacity="${dim ? 0.55 : 1}">`;
  for (let i = -GX; i <= GX; i++) h += line(sp([i, -GY]), sp([i, GY]), '#1c2740', 1);
  for (let j = -GY; j <= GY; j++) h += line(sp([-GX, j]), sp([GX, j]), '#1c2740', 1);
  h += `<text x="${f1(sp([-GX, 0]).x)}" y="${f1(sp([0, GY]).y - 6)}" font-size="10.5" fill="#6b7690" font-family="Golos Text,sans-serif">1 клетка = 1 см</text></g>`;
  return h;
}
const circ = (c, r, col, w, extra = '') => `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="${f1(r)}" fill="none" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const O0 = sp([0, 0]);
const centerO = () => `<g data-part="center" pointer-events="none">${dot(O0, '#e8ecf4', 4)}${txt(O0.x - 12, O0.y - 8, 'O', 13, '#e8ecf4', 'font-weight="600"')}</g>`;
const bottom = (s, col) => `<g data-part="type" pointer-events="none">${say(260, 364, s, 13.5, col, 'font-weight="600"')}</g>`;

function drawTan() {
  const m = model(), P = sp(m.P), col = m.tangent ? '#86e0a8' : m.count === 2 ? '#ff9fc4' : '#8b96ad';
  let h = gridSVG(true);
  h += `<g data-part="circle" pointer-events="none">${circ(O0, R0 * SC, '#72d4e8', 2.4, 'fill-opacity="0"')}${txt(O0.x - R0 * SC * 0.72 - 22, O0.y + R0 * SC * 0.72 + 14, 'r = 3', 11.5, '#72d4e8', halo)}</g>`;
  // found tangents
  let tg = '';
  [1, -1].forEach((side, i) => {
    const K = m.Ks[side]; if (!K) return; const Ks = sp(K);
    tg += line(P, Ks, '#86e0a8', 2.6, 'stroke-linecap="round"') + line(O0, Ks, '#86e0a8', 1.4, 'stroke-dasharray="5 4"') + rightMark(Ks, O0, P, '#86e0a8') + dot(Ks, '#86e0a8', 4.5);
    const off = unit(O0, Ks); tg += txt(Ks.x + off.ux * 16, Ks.y + off.uy * 16 + 4, 'K' + (i === 0 ? '₁' : '₂'), 12.5, '#86e0a8', 'font-weight="600" ' + halo);
    if (m.found === 2) tg += ticks(P, Ks, 1, '#ffb547');
  });
  h += `<g data-part="tans" pointer-events="none">${tg}</g>`;
  // the moving line
  const a = sp(add(m.P, m.u, -30)), b = sp(add(m.P, m.u, 30));
  h += `<g data-part="line" pointer-events="none">${line(a, b, col, 2.2)}</g>`;
  if (m.X.length) h += `<g data-part="pts" pointer-events="none">${m.X.map(x => dot(sp(x), '#ff9fc4', 5)).join('')}</g>`;
  if (S.showD) {
    const Hs = sp(m.H);
    h += `<g data-part="dist" pointer-events="none">${line(O0, Hs, '#f2d36b', 1.8)}${m.d > 0.25 ? rightMark(Hs, O0, P, '#f2d36b') : ''}${dot(Hs, '#f2d36b', 3)}${txt((O0.x + Hs.x) / 2 + 14, (O0.y + Hs.y) / 2 - 6, 'd = ' + f1c(m.d), 11.5, '#f2d36b', 'font-weight="600" ' + halo)}</g>`;
  }
  h += centerO();
  // handle sits on the circle side of P
  let u = m.u; if (dt(u, [-m.P[0], -m.P[1]]) < 0) u = [-u[0], -u[1]];
  const Q = sp(add(m.P, u, 2.2));
  h += txt(P.x + 14, P.y - 12, 'P', 14, '#e8ecf4', 'font-weight="600" pointer-events="none" ' + halo);
  h += knob('Q', Q, '#ffb547', 7) + knob('P', P, '#e8ecf4');
  h += bottom(m.tangent ? 'касательная: 1 общая точка, d = r' : m.count === 2 ? 'секущая: 2 общие точки, d < r' : 'общих точек нет, d > r', col);
  return h;
}

function drawInsc() {
  const m = model(), A = sp(m.A), B = sp(m.B), C = sp(m.C), r = R0 * SC;
  let h = gridSVG(true);
  h += `<g data-part="circle" pointer-events="none">${circ(O0, r, '#3c5a7a', 2)}</g>`;
  h += `<g data-part="arc" pointer-events="none"><path d="${arcPath(O0, r, m.from, m.from + m.arc)}" fill="none" stroke="#72d4e8" stroke-width="5" stroke-linecap="round"/>`;
  const am = PT(O0, r + 22, m.from + m.arc / 2);
  h += txt(am.x, am.y + 4, '∪AB = ' + m.arc + '°', 12, '#72d4e8', 'font-weight="600" ' + halo) + '</g>';
  if (S.showChord) h += `<g data-part="chord" pointer-events="none">${line(A, B, '#5b6784', 1.4)}</g>`;
  if (S.showCen) {
    h += `<g data-part="central" pointer-events="none"><path d="${sector(O0, 24, m.from, m.from + m.arc)}" fill="#c39bff" fill-opacity=".16" stroke="#c39bff" stroke-width="1.2"/>${line(O0, A, '#c39bff', 1.6)}${line(O0, B, '#c39bff', 1.6)}`;
    const lp = PT(O0, 40, m.from + m.arc / 2);
    h += txt(lp.x, lp.y + 4, m.arc + '°', 11.5, '#c39bff', 'font-weight="600" ' + halo) + '</g>';
  }
  const ca = angOf(vec(m.C, m.A)), cb = angOf(vec(m.C, m.B));
  let a0 = ca, d = mod(cb - ca, 360); if (d > 180) { a0 = cb; d = 360 - d; }
  h += `<g data-part="insc" pointer-events="none">${line(C, A, '#ffb547', 2.2)}${line(C, B, '#ffb547', 2.2)}`;
  h += m.isDiam ? rightMark(C, A, B, '#ffb547') : `<path d="${sector(C, 26, a0, a0 + d)}" fill="#ffb547" fill-opacity=".16" stroke="#ffb547" stroke-width="1.2"/>`;
  const lp = PT(C, 46, a0 + d / 2);
  h += txt(lp.x, lp.y + 4, Math.round(m.ang) + '°', 12, '#ffb547', 'font-weight="600" ' + halo) + '</g>';
  h += centerO();
  [['A', A, m.a], ['B', B, m.b], ['C', C, m.c]].forEach(([k, p, deg]) => { const q = PT(O0, r + 20, deg); h += txt(q.x, q.y + 5, k, 14, '#e8ecf4', 'font-weight="600" pointer-events="none" ' + halo); });
  h += knob('A', A, '#e8ecf4') + knob('B', B, '#e8ecf4') + knob('C', C, '#ffb547');
  h += bottom(`∠ACB = ${Math.round(m.ang)}° = ${m.arc}° : 2${m.isDiam ? ' — опирается на диаметр' : ''}`, '#ffb547');
  return h;
}

function drawTri() {
  const m = model(), V = {}; KS.forEach(k => V[k] = sp(m[k]));
  const G = { x: (V.A.x + V.B.x + V.C.x) / 3, y: (V.A.y + V.B.y + V.C.y) / 3 }, col = TC[m.type];
  let h = gridSVG(false);
  h += `<g data-part="tri" pointer-events="none"><path d="M${KS.map(k => f1(V[k].x) + ' ' + f1(V[k].y)).join('L')}Z" fill="${col}" fill-opacity=".07" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/></g>`;
  if (m.valid) {
    h += '<g data-part="angs" pointer-events="none">';
    KS.forEach(k => {
      const o = KS.filter(q => q !== k), deg = m.ang[k];
      if (Math.abs(deg - 90) < 1e-7) h += rightMark(V[k], V[o[0]], V[o[1]], '#ffb547');
      const g = unit(V[k], G); h += txt(V[k].x + g.ux * 30, V[k].y + g.uy * 30 + 4, Math.round(deg) + '°', 10.5, '#8b96ad');
    });
    h += '</g>';
  }
  if (m.valid && S.out) {
    const Os = sp(m.O);
    if (S.build) {
      h += '<g data-part="perp" pointer-events="none">';
      [['A', 'B'], ['B', 'C'], ['C', 'A']].forEach(([p, q]) => {
        const M = [(m[p][0] + m[q][0]) / 2, (m[p][1] + m[q][1]) / 2], e = vec(m[p], m[q]), L = len(e), n = [-e[1] / L, e[0] / L], t = dt(vec(M, m.O), n);
        h += line(sp(add(M, n, Math.min(0, t) - 1)), sp(add(M, n, Math.max(0, t) + 1)), '#c39bff', 1.3, 'stroke-dasharray="5 4"') + rightMark(sp(M), sp(m[q]), sp(add(M, n, t >= 0 ? 1 : -1)), '#c39bff') + ticks(sp(m[p]), sp(M), 1, '#c39bff') + ticks(sp(M), sp(m[q]), 1, '#c39bff');
      });
      h += '</g>';
    }
    h += `<g data-part="outc" pointer-events="none">${circ(Os, m.R * SC, '#72d4e8', 2.2)}${line(Os, V.A, '#72d4e8', 1.4)}${dot(Os, '#72d4e8', 4.5)}${txt(Os.x + 12, Os.y - 9, 'O', 13, '#72d4e8', 'font-weight="600" ' + halo)}${txt((Os.x + V.A.x) / 2, (Os.y + V.A.y) / 2 - 7, 'R', 12, '#72d4e8', 'font-weight="600" ' + halo)}</g>`;
  }
  if (m.valid && S.inn) {
    const Is = sp(m.I);
    if (S.build) {
      h += '<g data-part="bis" pointer-events="none">';
      KS.forEach((k, i) => {
        const p = KS[(i + 1) % 3], q = KS[(i + 2) % 3], lp = len(vec(m[k], m[p])), lq = len(vec(m[k], m[q]));
        const D = [(lq * m[p][0] + lp * m[q][0]) / (lp + lq), (lq * m[p][1] + lp * m[q][1]) / (lp + lq)];
        h += line(V[k], sp(D), '#ffb547', 1.3, 'stroke-dasharray="5 4"');
      });
      h += '</g>';
    }
    // touching point on side AC (bottom side by default)
    const e = vec(m.A, m.C), t = dt(vec(m.A, m.I), e) / n2(e), T = sp(add(m.A, e, t));
    h += `<g data-part="inc" pointer-events="none">${circ(Is, m.r * SC, '#86e0a8', 2.2)}${line(Is, T, '#86e0a8', 1.4)}${m.r * SC > 14 ? rightMark(T, Is, V.C, '#86e0a8') : ''}${dot(Is, '#86e0a8', 4.5)}${txt(Is.x + 11, Is.y - 8, 'I', 13, '#86e0a8', 'font-weight="600" ' + halo)}</g>`;
  }
  KS.forEach(k => { const g = unit(G, V[k]); h += txt(V[k].x + g.ux * 18, V[k].y + g.uy * 18 + 5, k, 14, '#e8ecf4', 'font-weight="600" pointer-events="none" ' + halo); });
  h += KS.map(k => knob(k, V[k], S.selV === k ? '#ffb547' : '#e8ecf4')).join('');
  let lab = m.valid ? TT[m.type] + ' треугольник' : 'три точки на одной прямой — это не треугольник';
  if (m.valid && S.out) lab += m.type === 'acute' ? ' · центр O внутри' : m.type === 'right' ? ' · O на середине гипотенузы' : ' · центр O снаружи';
  h += bottom(lab, col);
  return h;
}

function drawScene(t) {
  const id = LID();
  scene.innerHTML = id === 'tan' ? drawTan() : id === 'insc' ? drawInsc() : drawTri();
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) { S.hl = null; return; }
    let bb = null;
    scene.querySelectorAll(`[data-part~="${S.hl.id}"]`).forEach(el => {
      const b = el.getBBox(); if (!b.width && !b.height) return;
      bb = bb ? { x0: Math.min(bb.x0, b.x), y0: Math.min(bb.y0, b.y), x1: Math.max(bb.x1, b.x + b.width), y1: Math.max(bb.y1, b.y + b.height) } : { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
    });
    if (bb) { bb.x0 = Math.max(bb.x0, VB.x + 4); bb.x1 = Math.min(bb.x1, VB.x + VB.w - 4); bb.y0 = Math.max(bb.y0, VB.y + 4); bb.y1 = Math.min(bb.y1, VB.y + VB.h - 4);
      scene.insertAdjacentHTML('beforeend', `<rect x="${f1(bb.x0 - 6)}" y="${f1(bb.y0 - 6)}" width="${f1(bb.x1 - bb.x0 + 12)}" height="${f1(bb.y1 - bb.y0 + 12)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`); }
    else { S.hl = null; toast('Сейчас этого нет на поле — включите его кнопкой внизу.'); }
  }
}

    { id: 'angs', name: 'Углы', spec: 'Около каждой вершины — её угол.' },
    { id: 'perp', name: 'Серединные перпендикуляры', spec: 'Через середины сторон под прямым углом. Встречаются в O.' },
    { id: 'outc', name: 'Описанная окружность', spec: 'Центр O, радиус R = OA = OB = OC.' },
    { id: 'bis', name: 'Биссектрисы', spec: 'Делят углы пополам. Встречаются в I.' },
    { id: 'inc', name: 'Вписанная окружность', spec: 'Центр I, радиус r — перпендикуляр к стороне.' },
    { id: 'type', name: 'Подпись внизу', spec: 'Вид треугольника и где центр O.' }];
}

function renderPanes(m) {
  const L = LESSONS[S.lesson], done = !!S.done[L.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${L.title}</h2>` +
      L.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${L.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${L.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${L.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на поле</h2><p class="note">Нажмите на пункт, чтобы найти его на поле.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${ICON[p.id]}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'tan') {
    let h = `<h2>Сколько общих точек?</h2><div class="formula">сравниваем d и r</div><div class="steps">` +
      step('радиус r', '3 см') + step('расстояние d от O до прямой', f2c(m.d) + ' см') +
      step('вывод', m.tangent ? 'd = r → касательная, 1 точка' : m.count === 2 ? 'd < r → секущая, 2 точки' : 'd > r → общих точек нет', 'sum') + `</div>`;
    h += `<h3>Отрезок касательной PK</h3><div class="steps">` +
      step('P', `(${m.P.join('; ')})`) + step('OP² = x² + y²', `${m.P[0]}² + ${m.P[1]}² = ${n2(m.P)}`) +
      step('△OKP прямоугольный: ∠K = 90°', 'OK ⟂ PK') +
      step('PK² = OP² − r²', `${n2(m.P)} − 9 = ${n2(m.P) - 9}`) + step('PK = √' + (n2(m.P) - 9), cm(m.PK), 'sum') + `</div>`;
    if (m.found === 2) {
      const K1 = m.Ks[1], K2 = m.Ks[-1];
      h += `<h3>Две касательные из P</h3><div class="steps">` + step('PK₁ на чертеже', cm(len(vec(m.P, K1)))) + step('PK₂ на чертеже', cm(len(vec(m.P, K2)))) +
        step('PK₁ = PK₂?', yn(Math.abs(len(vec(m.P, K1)) - len(vec(m.P, K2))) < 1e-6), 'sum') + `</div><p class="note" style="margin-top:10px">Почему равны: треугольники OK₁P и OK₂P прямоугольные, у них общая гипотенуза OP и равные катеты OK₁ = OK₂ = r.</p>`;
    }
    return h;
  }
  if (m.kind === 'insc') {
    let h = `<h2>Вписанный угол</h2><div class="formula">∠ACB = ∪AB : 2</div><div class="steps">` +
      step('дуга AB без точки C', m.arc + '°') + step('центральный ∠AOB', m.arc + '°') +
      step('по теореме ∠ACB', `${m.arc}° : 2 = ${f1c(m.arc / 2)}°`) + step('∠ACB на чертеже', dg(m.ang), 'sum') + `</div>`;
    h += `<h3>Проверка через треугольник ABC</h3><div class="steps">` + step('∠CAB', `${f1c(m.angA)}° = ∪BC : 2`) + step('∠CBA', `${f1c(m.angB)}° = ∪AC : 2`) +
      step('∠A + ∠B + ∠C', `${f1c(m.angA)} + ${f1c(m.angB)} + ${f1c(m.ang)} = 180°`, 'sum') + `</div>`;
    h += `<h3>Задание</h3><div class="steps">` + step('положений C при дуге 120°', `${Math.min(m.found, 3)} из 3`) + step('AB — диаметр (∠ACB = 90°)', yn(m.diam)) + `</div>`;
    return h;
  }
  if (!m.valid) return `<h2>Это не треугольник</h2><p>Все три вершины стоят на одной прямой. Ни описать, ни вписать окружность нельзя.</p><p class="note">Сдвиньте одну вершину.</p>`;
  const P = m.p, Sq = m.Sq;
  let h = `<h2>Радиусы окружностей</h2><div class="formula">R = abc : 4S   r = S : p</div><div class="steps">` +
    step('a = BC, b = CA, c = AB', `${f2c(m.a)}; ${f2c(m.b)}; ${f2c(m.c)} см`) +
    step('S (по клеткам)', `${f2c(Sq)} см²`) + step('p = (a + b + c) : 2', `${f2c(P)} см`) +
    step('R = abc : 4S', `${f2c(m.a * m.b * m.c)} : ${f2c(4 * Sq)} ≈ ${f2c(m.R)} см`, 'sum') +
    step('r = S : p', `${f2c(Sq)} : ${f2c(P)} ≈ ${f2c(m.r)} см`, 'sum') + `</div>`;
  h += `<h3>Где центр описанной окружности</h3><div class="steps">` + step('углы A, B, C', `${dg(m.ang.A)}, ${dg(m.ang.B)}, ${dg(m.ang.C)}`) + step('вид', TT[m.type]) +
    step('центр O', `(${f2c(m.O[0])}; ${f2c(m.O[1])})`) +
    step('итог', m.type === 'acute' ? 'все углы острые → O внутри' : m.type === 'right' ? `∠${m.rv} = 90° → O — середина гипотенузы, R = гипотенуза : 2` : 'есть тупой угол → O снаружи', 'sum') + `</div>`;
  const OA = len(vec(m.O, m.A)), OB = len(vec(m.O, m.B)), OC = len(vec(m.O, m.C));
  h += `<h3>Проверка: O одинаково далёк от вершин</h3><div class="steps">` + step('OA, OB, OC', `${f2c(OA)}; ${f2c(OB)}; ${f2c(OC)} см`) + `</div>`;
  h += `<h3>Задание</h3><div class="steps">` + ['acute', 'right', 'obtuse'].map(k => step('описана: ' + TT[k], yn(S.f3.has(k)))).join('') + step('вписана окружность', yn(S.f3.has('in'))) + `</div>`;
  return h;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'tan') { el.innerHTML = `<div class="k">Общих точек</div><div class="v ${m.tangent ? 'ok' : ''}">${m.count} · ${m.tangent ? 'касательная' : m.count === 2 ? 'секущая' : 'мимо'}</div><div class="lr"><span>d</span><span>${f2c(m.d)} см</span></div><div class="lr"><span>r</span><span>3 см</span></div><div class="lr"><span>найдено</span><span>${m.found} из 2</span></div>`; return; }
  if (m.kind === 'insc') { el.innerHTML = `<div class="k">Вписанный угол</div><div class="v ${ok ? 'ok' : ''}">∠ACB = ${dg(m.ang)}</div><div class="lr"><span>дуга AB</span><span>${m.arc}°</span></div><div class="lr"><span>60° · 90°</span><span>${Math.min(m.found, 3)}/3 · ${m.diam ? '✓' : '·'}</span></div>`; return; }
  el.innerHTML = `<div class="k">Окружности</div><div class="v ${ok ? 'ok' : ''}" style="color:${ok ? '' : TC[m.type]};font-size:13px;line-height:1.3">${TT[m.type]}</div><div class="lr"><span>R</span><span>${m.valid ? f2c(m.R) : '—'}</span></div><div class="lr"><span>r</span><span>${m.valid ? f2c(m.r) : '—'}</span></div>`;
}

function update() {
  const m = model(), L = LESSONS[S.lesson];
  harvest(m);
  if (!S.done[L.id] && L.check(m)) {
    S.done[L.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Отличная работа!'), 1400);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[L.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  tan: '<circle cx="28" cy="17" r="10" fill="none" stroke="#72d4e8" stroke-width="1.4"/><path d="M4 7H62" stroke="#86e0a8" stroke-width="1.6"/><path d="M28 17V7" stroke="#86e0a8" stroke-dasharray="2 2"/>',
  insc: '<circle cx="33" cy="15" r="12" fill="none" stroke="#3c5a7a" stroke-width="1.3"/><path d="M23 21.5A12 12 0 0 0 43 21.5" fill="none" stroke="#72d4e8" stroke-width="2.4"/><path d="M23 21.5L33 3L43 21.5" fill="none" stroke="#ffb547" stroke-width="1.4"/>',
  circum: '<circle cx="33" cy="15" r="13" fill="none" stroke="#72d4e8" stroke-width="1.3"/><path d="M21 21L28 3L45 21Z" fill="none" stroke="#e8ecf4" stroke-width="1.2"/><circle cx="32" cy="15.5" r="4.6" fill="none" stroke="#86e0a8" stroke-width="1.3"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((L, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[L.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${L.title}</span></span>
      ${S.done[L.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const L = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null;
  S.tf = new Set(); S.c2 = []; S.diam = false; S.f3 = new Set();
  S.showD = true; S.showCen = true; S.showChord = true; S.out = false; S.inn = false; S.build = true; S.selV = 'B';
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L.task;
  $('#hint').textContent = L.stage;
  renderTools(); renderStrip(); buildScheme();
  resetShape(); fit();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), L = LESSONS[S.lesson], id = L.id;
  let now = '';
  if (id === 'tan') now = `Окружность с центром O(0; 0) и радиусом r = 3 см на клетчатой сетке. Точка P(${m.P.join('; ')}), OP ≈ ${f2c(m.D)} см. Прямая через P с наклоном ${Math.round(m.phi)}°, расстояние от O до неё d ≈ ${f2c(m.d)} см, общих точек: ${m.count} (${m.tangent ? 'касательная' : m.count === 2 ? 'секущая' : 'не пересекает'}). Найдено касательных из P: ${m.found} из 2. Длина отрезка касательной из P: √(OP² − r²) ≈ ${f2c(m.PK)} см. Наводи вопросами: как связаны d и r у касательной, какой угол между радиусом OK и касательной.`;
  else if (id === 'insc') now = `Окружность радиусом 3 см, центр O. Точки на окружности (угол от оси x): A ${S.A}°, B ${S.B}°, C ${S.C}°. Дуга AB, на которую опирается ∠ACB (без точки C): ${m.arc}°. Центральный угол AOB = ${m.arc}°, вписанный ∠ACB = ${dg(m.ang)}. Положений C с ∠ACB = 60° при дуге 120° найдено: ${Math.min(m.found, 3)} из 3. Диаметр AB сделан: ${m.diam ? 'да' : 'нет'}. Не называй готовые положения точек — наводи вопросами про связь вписанного угла и дуги.`;
  else now = `Клетчатая сетка, 1 клетка = 1 см. Треугольник A(${m.A.join('; ')}), B(${m.B.join('; ')}), C(${m.C.join('; ')}), ${TT[m.type]}${m.valid ? `, углы A ${dg(m.ang.A)}, B ${dg(m.ang.B)}, C ${dg(m.ang.C)}, стороны a = ${f2c(m.a)}, b = ${f2c(m.b)}, c = ${f2c(m.c)} см, площадь ${f2c(m.Sq)} см², R ≈ ${f2c(m.R)} см, r ≈ ${f2c(m.r)} см, центр описанной O(${f2c(m.O[0])}; ${f2c(m.O[1])})` : ''}. Описанная окружность ${S.out ? 'показана' : 'скрыта'}, вписанная ${S.inn ? 'показана' : 'скрыта'}, построение ${S.build ? 'показано' : 'скрыто'}. Описаны: ${['acute', 'right', 'obtuse'].map(k => TT[k] + (S.f3.has(k) ? ' — да' : ' — нет')).join(', ')}; вписана: ${S.f3.has('in') ? 'да' : 'нет'}. Не называй координаты — помогай вопросами.`;
  return [
    `Раздел: математика, 8 класс, геометрия, тема «Окружность». Урок ${S.lesson + 1} из ${LESSONS.length}: «${L.title}».`,
    `Объяснение урока: ${L.text.join(' ')}`,
    `Задание: ${L.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const L = LESSONS[S.lesson], done = S.done[L.id];
  const q = {
    tan: 'Почему касательная перпендикулярна радиусу?',
    insc: 'Почему вписанный угол равен половине дуги?',
    circum: 'Почему центр описанной окружности лежит на серединных перпендикулярах?',
  }[L.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
</body>
</html>
