<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 10 класс: сбор и очистка данных, визуализация, Python для анализа данных.">
<link rel="icon" href="data:,">
<title>Анализ данных</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. SVG stage on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:pointer}
.scene [data-drag^="c-"]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none;z-index:3}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none;z-index:3}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .v.bad{color:var(--warn)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--arm)}100%{box-shadow:0 0 0 0 transparent}}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px);z-index:3}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tools button:hover{color:var(--fg)}
.tools button.go{background:var(--fg);color:var(--bg);font-weight:600}
.tools button:disabled{opacity:.35;cursor:default}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tools .val{font:500 12px var(--font-mono);color:var(--fg);padding:0 4px;white-space:nowrap}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--fg)}
.chips button:hover{border-color:var(--muted)}
.chips button:disabled{opacity:.35;cursor:default}
.listing{font:500 13px/1.6 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;overflow-wrap:anywhere}
.listing .cur{color:var(--force)}
.listing .bad{color:var(--warn)}

.formula{font:500 16px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}
.step.okk span{color:var(--ok)}
.step.badd span{color:var(--warn)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 340px);min-height:0}
  .stage.tall{height:calc(80vw + 430px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M8 31h24M8 31V9" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/><rect x="12" y="20" width="5" height="11" rx="1" fill="var(--arm)"/><rect x="19" y="14" width="5" height="17" rx="1" fill="var(--force)"/><rect x="26" y="23" width="5" height="8" rx="1" fill="var(--arm)"/></svg>
      <div><h1>OPEN EDU AI</h1><small>Открытое образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Данные</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/3</span></div>
    </div>
  </header>

  <section class="stage tall" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: таблица, диаграмма или блокнот Python"></svg>
    <div class="task" id="taskBox" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Команды" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SANS = 'Golos Text, system-ui, sans-serif';

const LESSONS = [
  { id: 'clean', title: 'Сбор и очистка данных',
    text: ['Анализ начинается со сбора данных: опрос в Google Forms, датчики, касса магазина, открытые данные на data.egov.kz. Результат — таблица: строка — одна запись (объект), столбец — один признак.',
           'Сырые данные почти всегда «грязные». Человек отправил форму дважды — появился дубликат. Не ответил — пропуск. Написал «1 ч» вместо числа — неверный формат. Опечатался и получил 350 минут на дорогу — выброс, невозможное значение.',
           'Очистка — это решение по каждой проблемной строке: удалить, исправить или оставить. Исправлять можно, только если правильное значение известно точно. Иначе строку убирают. Грязные данные дают ложный ответ, даже если формула верная.'],
    why: 'Аналитики данных в банках, у Kaspi, в телеком-компаниях и в маркетплейсах тратят на очистку до половины рабочего времени — и это хорошо оплачиваемая работа: junior-аналитик в Алматы и Астане начинает примерно с 300–500 тыс. ₸. Социологи чистят анкеты опросов, врачи-исследователи — карты пациентов. А в жизни это привычка проверять цифры, прежде чем им верить.',
    task: 'Очистите таблицу опроса: каждая ученица и каждый ученик должны остаться ровно один раз, с числом минут. Ошибочные строки уберите, а то, что можно точно исправить, исправьте.',
    hint: 'Нажимайте на строку: «оставить» → «удалить» → «исправить» (только для текста). Сравните время отправки и имена. Подумайте, какое значение невозможно.',
    stage: 'Нажмите на строку таблицы, чтобы сменить действие.',
    rows: [
      { t: '08:02', n: 'Айгерим', c: '10 А', v: '15', key: 'aig', val: 15 },
      { t: '08:05', n: 'Данияр', c: '10 А', v: '25 мин', key: 'dan', val: 25, fix: 25 },
      { t: '08:07', n: 'Алина', c: '10 Б', v: '20', key: 'ali', val: 20 },
      { t: '08:11', n: 'Ерлан', c: '10 Б', v: '', key: 'erl', val: null },
      { t: '08:05', n: 'Данияр', c: '10 А', v: '25 мин', key: 'dan', val: 25, fix: 25 },
      { t: '08:16', n: 'Мадина', c: '10 А', v: '1 ч', key: 'mad', val: 60, fix: 60 },
      { t: '08:19', n: 'Тимур', c: '10 Б', v: '350', key: 'tim', val: null },
      { t: '08:23', n: 'Аружан', c: '10 Б', v: '30', key: 'aru', val: 30 },
      { t: '08:24', n: 'Иван', c: '10 А', v: '12', key: 'iva', val: 12 },
      { t: '08:30', n: 'Сауле', c: '10 Б', v: '40', key: 'sau', val: 40 },
      { t: '08:31', n: 'Арман', c: '10 А', v: '18', key: 'arm', val: 18 },
      { t: '08:07', n: 'Алина', c: '10 Б', v: '20', key: 'ali', val: 20 }],
    check: m => m.errors === 0 },
  { id: 'viz', title: 'Визуализация: какой график выбрать',
    text: ['Таблицу из сотни чисел глаз не читает. Диаграмма показывает главное за секунду. Но тип диаграммы зависит от вопроса, на который мы отвечаем.',

const ROWS = () => LESSONS[0].rows;

function cleanResult() {
  // what goes into the cleaned table and how far it is from a correct one
  const rows = ROWS(), kept = [], invalid = [];
  rows.forEach((r, i) => {
    const a = S.act[i] || 'keep';
    if (a === 'drop') return;
    if (a === 'fix') { kept.push({ i, key: r.key, v: r.fix }); return; }
    if (!isNum(r.v)) { invalid.push({ i, why: r.v === '' ? 'пропуск' : 'не число' }); return; }
    if (r.val === null) { kept.push({ i, key: r.key, v: +r.v, bad: true }); return; }
    kept.push({ i, key: r.key, v: +r.v });
  });
  const need = [...new Set(rows.filter(r => r.val !== null).map(r => r.key))];
  const cnt = {}; kept.forEach(k => { cnt[k.key] = (cnt[k.key] || 0) + 1; });
  const dup = Object.values(cnt).reduce((s, c) => s + Math.max(0, c - 1), 0);
  const missing = need.filter(k => !cnt[k]).length;
  const outl = kept.filter(k => k.bad).length;

const OPS = ['>', '>=', '<', '<=', '=='];
const FUNCS = ['sum', 'len', 'max', 'min'];
const TT = () => LESSONS[2].t;
const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const cmp = (x, op, c) => op === '>' ? x > c : op === '>=' ? x >= c : op === '<' ? x < c : op === '<=' ? x <= c : x === c;
const warmList = () => TT().filter(x => cmp(x, S.op, S.thr));
const pyf = v => Number.isInteger(v) ? v.toFixed(1) : String(v);
const pyList = a => '[' + a.map(pyf).join(', ') + ']';
const FN = { sum: a => a.reduce((s, x) => s + x, 0), len: a => a.length, max: a => Math.max(...a), min: a => Math.min(...a) };
function evalPy() {
  const w = warmList();
  const call = f => { if ((f === 'max' || f === 'min') && !w.length) throw new Error(`ValueError: ${f}() arg is an empty sequence`); return FN[f](w); };
  try {
    const a = call(S.f1), b = call(S.f2);
    if (b === 0) throw new Error('ZeroDivisionError: division by zero');
    const r = Math.round(a / b * 10) / 10;
    return { w, a, b, raw: a / b, r, text: pyf(r) };
  } catch (e) { return { w, err: e.message }; }
}
const target = () => { const p = TT().filter(x => x > 0); return { w: p, r: Math.round(FN.sum(p) / p.length * 10) / 10 }; };
const sameList = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
function runPy() {
  const e = evalPy();
  S.out = { ...e, sig: sig() };
  toast(e.err ? `Ошибка: ${e.err}` : `Вывод: ${e.text}`);
  update();
}
const sig = () => [S.op, S.thr, S.f1, S.f2].join('|');
function setPy(k, v) { S[k] = v; if (S.out && S.out.sig !== sig()) S.out = null; update(); }

             drops: S.act.filter(a => a === 'drop').length, fixes: S.act.filter(a => a === 'fix').length };
  }
  if (id === 'viz') return { kind: 'viz', q: S.q, ans: S.ans.slice(), correct: correctCount(), tries: S.tries };
  const e = evalPy(), tg = target(), o = S.out;
  const solved = !!o && !o.err && o.sig === sig() && sameList(o.w, tg.w) && S.f1 === 'sum' && S.f2 === 'len';

  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function drawClean() {
  const C = COLS(), rows = ROWS(), fs = NAR ? 9.5 : 10.5, ty = RY0 - 8;
  let h = `<text x="${NAR ? 0 : 8}" y="91" font-size="9" fill="#8b96ad" letter-spacing="1">${NAR ? `ОПРОС «МИНУТ ДО ШКОЛЫ» · ${rows.length} ОТВЕТОВ` : `ОПРОС «СКОЛЬКО МИНУТ ТЫ ЕДЕШЬ ДО ШКОЛЫ?» · ${rows.length} ОТВЕТОВ`}</text>`;
  h += `<g data-part="head"><text x="${C.no}" y="${ty}" font-size="8.5" fill="#56627d">№</text><text x="${C.t}" y="${ty}" font-size="8.5" fill="#56627d">ВРЕМЯ</text><text x="${C.n}" y="${ty}" font-size="8.5" fill="#56627d">ИМЯ</text>` +
    (C.c ? `<text x="${C.c}" y="${ty}" font-size="8.5" fill="#56627d">КЛАСС</text>` : '') + `<text x="${C.v}" y="${ty}" font-size="8.5" fill="#56627d">МИНУТЫ</text><text x="${C.a}" y="${ty}" font-size="8.5" fill="#56627d">ДЕЙСТВИЕ</text></g>`;
  rows.forEach((r, i) => {
    const R = ROWR(i), a = S.act[i] || 'keep', yb = R.y + R.h / 2 + 4, dropped = a === 'drop';
    const col = a === 'drop' ? '#ff8a73' : a === 'fix' ? '#ffb547' : '#86e0a8', dim = dropped ? ' opacity=".4"' : '';
    h += `<g data-drag="r-${i}"><rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" rx="6" fill="${i % 2 ? 'rgba(26,36,56,.75)' : 'rgba(22,32,50,.75)'}" stroke="#2f3b55"/>`;
    h += `<g${dim}><text x="${C.no}" y="${yb}" font-size="${fs - 1}" fill="#56627d">${i + 1}</text><text x="${C.t}" y="${yb}" font-size="${fs}" fill="#8b96ad">${r.t}</text>` +
      `<text x="${C.n}" y="${yb}" font-size="${fs}" fill="#e8ecf4" style="font-family:${SANS}">${esc(r.n)}</text>` + (C.c ? `<text x="${C.c}" y="${yb}" font-size="${fs}" fill="#8b96ad" style="font-family:${SANS}">${esc(r.c)}</text>` : '') +
      (r.v === '' ? `<text x="${C.v}" y="${yb}" font-size="${fs - 1}" fill="#56627d" font-style="italic">пусто</text>` : `<text x="${C.v}" y="${yb}" font-size="${fs}" fill="${isNum(r.v) ? '#e8ecf4' : '#c3a6ff'}">${esc(r.v)}</text>`) + `</g>`;
    if (dropped) h += `<path d="M${C.t - 2} ${R.y + R.h / 2}H${C.a - 10}" stroke="#ff8a73" stroke-width="1.2" opacity=".7"/>`;
    const pw = a === 'fix' ? (NAR ? 120 : 134) : 74;
    h += `<rect x="${C.a}" y="${R.y + 3}" width="${pw}" height="${R.h - 6}" rx="${(R.h - 6) / 2}" fill="${a === 'keep' ? 'none' : col}" fill-opacity="${a === 'keep' ? 0 : 0.16}" stroke="${col}" stroke-width="1.2"/>`;
    h += `<text x="${C.a + 9}" y="${yb - 0.5}" font-size="${fs - 1}" fill="${col}">${ACTN[a]}${a === 'fix' ? ' → ' + r.fix : ''}</text></g>`;
  });
  return h;
}
function drawViz() {
  const qs = QS(), q = qs[S.q], T = QTXT();
  let h = '';
  qs.forEach((x, i) => {
    const r = QTAB(i), cur = i === S.q, ok = S.ans[i] === x.right;
    h += `<g data-drag="q-${i}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="7" fill="${cur ? '#26324a' : 'rgba(26,36,56,.7)'}" stroke="${cur ? '#ffb547' : ok ? '#86e0a8' : '#3a4762'}" stroke-width="${cur ? 1.8 : 1.2}"/>` +
      `<text x="${r.x + r.w / 2}" y="${r.y + 15}" font-size="${NAR ? 9 : 10}" fill="${ok ? '#86e0a8' : cur ? '#e8ecf4' : '#8b96ad'}" text-anchor="middle">Вопрос ${i + 1}${ok ? ' ✓' : ''}</text></g>`;
  });
  const lines = wrap(q.q, T.max);
  h += `<g data-part="title">` + lines.map((l, k) => `<text x="${T.x}" y="${T.y + k * T.lh}" font-size="${NAR ? 11.5 : 12.5}" fill="#e8ecf4" style="font-family:${SANS}" font-weight="500">${esc(l)}</text>`).join('') + `</g>`;
  const a = S.ans[S.q];
  if (a) h += `<text x="${T.x}" y="${T.y + lines.length * T.lh + 2}" font-size="9" fill="${a === q.right ? '#86e0a8' : '#ff8a73'}">${a === q.right ? '✓ ' : '✗ '}${TYPEW[a]} диаграмма</text>`;
  h += drawChart(q, a, CBOX());
  return h;
}
function codeLine(parts, x, y) {
  // parts: strings or {b:key, v:text}; returns svg; monospace layout by character count
  const cw = CW(), fs = CFS();
  let h = '', cx = x;
  for (const p of parts) {
    if (typeof p === 'string') { h += `<text x="${cx.toFixed(1)}" y="${y}" font-size="${fs}" fill="#e8ecf4" xml:space="preserve">${esc(p)}</text>`; cx += p.length * cw; continue; }
    const w = p.v.length * cw + 10;
    h += `<g data-drag="b-${p.b}"><rect x="${(cx + 1).toFixed(1)}" y="${y - fs - 1}" width="${(w - 2).toFixed(1)}" height="${fs + 7}" rx="4" fill="rgba(255,181,71,.14)" stroke="#ffb547" stroke-width="1.2"/>` +
      `<text x="${(cx + 5).toFixed(1)}" y="${y}" font-size="${fs}" fill="#ffb547" font-weight="500">${esc(p.v)}</text></g>`;
    cx += w;
  }
  return h;
}
function cellBox(label, y, nLines, part) {
  const x = CODEX(), w = CODEW(), lh = CFS() + 5;
  return `<text x="${x}" y="${y - 4}" font-size="8.5" fill="#56627d">${label}</text><rect data-part="${part}" x="${x}" y="${y}" width="${w}" height="${nLines * lh + 10}" rx="8" fill="rgba(11,16,25,.75)" stroke="#3a4762"/>`;
}
let PYL = null; // layout for highlights
function drawPy() {
  const x = CODEX() + 8, lh = CFS() + 5, maxc = Math.floor((CODEW() - 16) / CW());
  let h = `<text x="${CODEX()}" y="91" font-size="9" fill="#8b96ad" letter-spacing="1">БЛОКНОТ PYTHON</text>`;
  const t = TT(), tl = wrapList('t = ' + pyList(t), maxc);
  let y = 112;
  PYL = {};
  // cell 1
  h += cellBox('In [1]:', y, tl.length + 1, 'c1'); PYL.c1 = [CODEX(), y, CODEW(), (tl.length + 1) * lh + 10];
  h += `<text x="${x}" y="${y + lh + 1}" font-size="${CFS()}" fill="#56627d">${esc('# средняя t по месяцам, Астана, °C')}</text>`;
  tl.forEach((l, k) => { h += `<text x="${x}" y="${y + (k + 2) * lh + 1}" font-size="${CFS()}" fill="#e8ecf4" xml:space="preserve">${esc(l)}</text>`; });
  y += (tl.length + 1) * lh + 10 + 22;
  // cell 2
  h += cellBox('In [2]:', y, 2, 'c2'); PYL.c2 = [CODEX(), y, CODEW(), 2 * lh + 10];
  h += codeLine(['warm = [x for x in t if x ', { b: 'op', v: S.op }, ' ', { b: 'thr', v: String(S.thr) }, ']'], x, y + lh + 1);
  h += codeLine(['warm'], x, y + 2 * lh + 1);
  y += 2 * lh + 10;
  const o = S.out && S.out.sig === sig() ? S.out : null;
  const outY = y + 14;
  h += `<text x="${CODEX()}" y="${outY}" font-size="8.5" fill="#56627d">Out[2]:</text>`;
  const wl = o ? wrapList(pyList(o.w), maxc - 8) : ['—'];
  wl.forEach((l, k) => { h += `<text x="${CODEX() + 46}" y="${outY + k * lh}" font-size="${CFS()}" fill="${o ? '#72d4e8' : '#56627d'}" xml:space="preserve">${esc(l)}</text>`; });
  PYL.o2 = [CODEX(), outY - 12, CODEW(), wl.length * lh + 4];
  y = outY + (wl.length - 1) * lh + 22;
  // cell 3
  h += cellBox('In [3]:', y, 1, 'c3'); PYL.c3 = [CODEX(), y, CODEW(), lh + 10];
  h += codeLine(['print(round(', { b: 'f1', v: S.f1 }, '(warm) / ', { b: 'f2', v: S.f2 }, '(warm), 1))'], x, y + lh + 1);
  y += lh + 10 + 14;
  h += `<text x="${CODEX()}" y="${y}" font-size="8.5" fill="#56627d">вывод:</text>`;
  if (o) h += `<text x="${CODEX() + 46}" y="${y}" font-size="${CFS() + 1}" fill="${o.err ? '#ff8a73' : '#86e0a8'}" font-weight="500">${esc(o.err || o.text)}</text>`;
  else h += `<text x="${CODEX() + 46}" y="${y}" font-size="${CFS()}" fill="#56627d">нажмите «Выполнить»</text>`;
  PYL.o3 = [CODEX(), y - 13, CODEW(), 18];
  // plot of t with the filter
  const P = PLOT(), lo = -20, hi = 25, Y = v => P.y + P.h - (v - lo) / (hi - lo) * P.h, bw = P.w / 12;
  h += `<g data-part="plot"><text x="${P.x - (NAR ? 22 : 8)}" y="${P.y - 8}" font-size="9" fill="#8b96ad" letter-spacing="1">ГРАФИК t, °C</text>`;
  for (const v of [-20, -10, 0, 10, 20]) h += `<path d="M${P.x} ${Y(v).toFixed(1)}H${P.x + P.w}" stroke="${v === 0 ? '#56627d' : 'rgba(139,150,173,.16)'}" stroke-width="${v === 0 ? 1.4 : 1}"/><text x="${P.x - 4}" y="${(Y(v) + 3).toFixed(1)}" font-size="8" fill="#8b96ad" text-anchor="end">${v}</text>`;
  t.forEach((v, i) => {
    const inn = cmp(v, S.op, S.thr), y0 = Y(0), y1 = Y(v);
    h += `<rect x="${(P.x + i * bw + bw * 0.16).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${(bw * 0.68).toFixed(1)}" height="${Math.abs(y1 - y0).toFixed(1)}" rx="1.5" fill="${inn ? '#ffb547' : '#3a4762'}"/>`;
    if (!NAR || i % 1 === 0) h += `<text x="${(P.x + (i + 0.5) * bw).toFixed(1)}" y="${P.y + P.h + 11}" font-size="7.5" fill="#8b96ad" text-anchor="middle">${NAR ? MON[i][0].toUpperCase() : MON[i].slice(0, 1).toUpperCase()}</text>`;
  });
  const yt = Y(clamp(S.thr, lo, hi));
  h += `<path d="M${P.x - 2} ${yt.toFixed(1)}H${P.x + P.w + 2}" stroke="#ffb547" stroke-width="1.4" stroke-dasharray="4 3"/><text x="${P.x + P.w}" y="${(yt - 4).toFixed(1)}" font-size="8" fill="#ffb547" text-anchor="end">x ${esc(S.op)} ${S.thr}</text></g>`;
  return h;
}

function hlBoxes(id) {
  const id0 = LID(), C = COLS();
  if (id0 === 'clean') {
    const top = RY0, all = ROWS().length * RH();
    if (id === 'row') { const R = ROWR(0); return [[R.x - 3, R.y - 3, R.w + 6, R.h + 6]]; }
    if (id === 'col') return [[C.v - 6, top - 22, 64, all + 24]];
    if (id === 'time') return [[C.t - 5, top - 22, 46, all + 24]];
    if (id === 'act') return [[C.a - 5, top - 22, (NAR ? 128 : 186), all + 24]];
    if (id === 'head') return [[NAR ? 0 : 8, top - 22, NAR ? 302 : 508, 18]];
    return [];
  }
  if (id0 === 'viz') {
    const B = CBOX(), P = CH && CH.plot;
    if (id === 'tabs') { const a = QTAB(0), b = QTAB(3); return [[a.x - 3, a.y - 3, b.x + b.w - a.x + 6, a.h + 6]]; }
    if (id === 'title') { const T = QTXT(); return [[T.x - 4, T.y - 14, NAR ? 304 : 512, 3 * T.lh + 4]]; }
    if (!P) return [[B.x, B.y, B.w, B.h]];
    if (id === 'yaxis') return [[B.x - 2, P.y - 16, 38, P.h + 20]];
    if (id === 'xaxis') return [[P.x - 4, P.y + P.h - 4, P.w + 8, 22]];
    if (id === 'marks') return [[P.x - 4, P.y - 4, P.w + 8, P.h + 8]];
    return [];
  }
  if (!PYL) return [];
  if (id === 'plot') { const P = PLOT(); return [[P.x - 26, P.y - 20, P.w + 32, P.h + 36]]; }
  return PYL[id] ? [PYL[id].map((v, k) => k < 2 ? v - 3 : v + 6)] : [];
}

function drawScene(t) {
  const id = LID();
  let h = bg() + (id === 'clean' ? drawClean() : id === 'viz' ? drawViz() : drawPy());
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1);
    if (k === 0) S.hl = null;
    else for (const b of hlBoxes(S.hl.id)) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  NAR = w < 560;
  const B = BOUNDS(), cw = B.x1 - B.x0 + 8, ch = B.y1 - 80 + 4;
  const tb = $('#taskBox').getBoundingClientRect(), mt = $('#meter').getBoundingClientRect();
  const topPx = Math.max(tb.bottom, mt.bottom) - rc.top + 8;
  const s = Math.min(w / cw, Math.max((hh - topPx) / ch, hh / (ch * 1.6)), 1.5);
  VB = { w: w / s, h: hh / s }; VB.x = (B.x0 + B.x1) / 2 - VB.w / 2;
  VB.y = 80 - topPx / s;
  const slack = VB.y + VB.h - (B.y1 + 2);
  VB.y = slack < 0 ? B.y1 + 2 - VB.h : VB.y - slack / 2;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- pointer: taps on rows, question tabs and code blanks ----------
let dirty = true, tap = null;
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  tap = { tag: el.dataset.drag, x: e.clientX, y: e.clientY };
});
scene.addEventListener('pointerup', e => {
  if (!tap) return;
  const d = tap; tap = null;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12) return;
  const kind = d.tag.slice(0, 2), arg = d.tag.slice(2);
  if (kind === 'r-') cycleRow(+arg);
  if (kind === 'q-') { S.q = +arg; update(); }
  if (kind === 'b-') {
    if (arg === 'op') setPy('op', nextIn(OPS, S.op));
    if (arg === 'f1') setPy('f1', nextIn(FUNCS, S.f1));
    if (arg === 'f2') setPy('f2', nextIn(FUNCS, S.f2));
    if (arg === 'thr') { flashEl('#tools'); toast('Порог меняйте кнопками «−» и «+» внизу или ползунком во вкладке «Схема».'); }
  }
});
scene.addEventListener('pointercancel', () => { tap = null; });

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  last = t;
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

// ---------- UI ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, aria, cls, dis) => `<button data-a="${k}"${aria ? ` aria-label="${aria}"` : ''}${cls ? ` class="${cls}"` : ''}${dis ? ' disabled' : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  if (id === 'clean') tb.innerHTML = B('check', 'Проверить', '', 'go') + sep + B('reset', 'Заново');
  else if (id === 'viz') tb.innerHTML = B('prevq', '‹', 'Предыдущий вопрос') + Object.keys(TYPES).map(k => B('t-' + k, TYPES[k], 'Диаграмма: ' + TYPEW[k], S.ans[S.q] === k ? 'go' : '')).join('') + B('nextq', '›', 'Следующий вопрос');
  else tb.innerHTML = B('op', esc(S.op), 'Сменить знак сравнения') + B('thr-', '−', 'Уменьшить порог') + `<span class="val">${S.thr}</span>` + B('thr+', '+', 'Увеличить порог') + sep + B('run', '▶ Выполнить', '', 'go');
}
function act(a) {
  const id = LID();
  if (id === 'clean') {
    if (a === 'check') checkClean();
    if (a === 'reset') { S.act = []; S.checks = 0; update(); }
    return;
  }
  if (id === 'viz') {
    if (a.startsWith('t-')) choose(a.slice(2));
    if (a === 'prevq' || a === 'nextq') { S.q = (S.q + (a === 'nextq' ? 1 : 3)) % 4; update(); }
    if (a.startsWith('q-')) { S.q = +a.slice(2); update(); }
    return;
  }
  if (a === 'op') setPy('op', nextIn(OPS, S.op));
  if (a === 'thr-' || a === 'thr+') setPy('thr', clamp(S.thr + (a === 'thr+' ? 1 : -1), -20, 25));
  if (a.startsWith('o-')) setPy('op', a.slice(2));
  if (a.startsWith('f1-')) setPy('f1', a.slice(3));
  if (a.startsWith('f2-')) setPy('f2', a.slice(3));
  if (a === 'run') runPy();
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) act(b.dataset.a); });

const TABS = ['overview', 'parts', 'scheme', 'calc'];
function setTab(t) {
  S.tab = t;
  for (const x of TABS) { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#pane-' + x).hidden = x !== t; }
  if (t === 'scheme') buildScheme();
  renderPanes(model());
}
TABS.forEach(x => $('#tab-' + x).addEventListener('click', () => setTab(x)));

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;
const IC = inner => `<svg viewBox="0 0 34 34" aria-hidden="true">${inner}</svg>`;

function taskState(m) {
  if (S.done[LID()]) return '✓ Выполнено';
  if (m.kind === 'clean') return `Осталось строк: ${m.kept.length + m.invalid.length} из 12` + (S.checks ? ` · проблем: ${m.errors}` : ' · нажмите «Проверить»');
  if (m.kind === 'viz') return `Верно: ${m.correct} из 4 · попыток ${m.tries}`;
  if (m.out && m.out.sig === sig()) return m.out.err ? 'Код упал с ошибкой' : `Вывод: ${m.out.text} — это то, что нужно?`;
  return 'Код ещё не запущен после изменений';
}

function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'clean') h = `<h2>Пульт очистки</h2><p class="note">Нажимайте на строки на сцене или на номера ниже. Действие меняется по кругу.</p>
    <dl class="reads"><div><dt>Строк</dt><dd id="r1"></dd></div><div><dt>Среднее</dt><dd id="r2"></dd></div><div><dt>Медиана</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Строки</div><div class="chips" id="rowChips"></div></div>
    <div class="ctl"><div class="chips"><button data-a="check">Проверить</button><button data-a="reset">Заново</button></div></div>
    <h3>Чистые значения, мин</h3><div class="listing" id="lst"></div>`;
  if (id === 'viz') h = `<h2>Конструктор диаграммы</h2><p class="note">Выберите вопрос, затем тип диаграммы.</p>
    <dl class="reads"><div><dt>Вопрос</dt><dd id="r1"></dd></div><div><dt>Тип</dt><dd id="r2"></dd></div><div><dt>Верно</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Вопрос</div><div class="chips">${[0, 1, 2, 3].map(i => `<button data-a="q-${i}">${i + 1}</button>`).join('')}</div></div>
    <div class="ctl"><div class="lbl">Тип диаграммы</div><div class="chips">${Object.keys(TYPES).map(k => `<button data-a="t-${k}">${TYPES[k]}</button>`).join('')}</div></div>
    <h3>Данные вопроса</h3><div class="listing" id="lst"></div>`;
  if (id === 'py') h = `<h2>Параметры кода</h2><p class="note">Те же места, что подсвечены в коде на сцене.</p>
    <dl class="reads"><div><dt>len(warm)</dt><dd id="r1"></dd></div><div><dt>sum(warm)</dt><dd id="r2"></dd></div><div><dt>Вывод</dt><dd id="r3"></dd></div></dl>
    <div class="ctl"><div class="lbl">Условие: x … порог</div><div class="chips">${OPS.map(o => `<button data-a="o-${o}">${esc(o)}</button>`).join('')}</div></div>
    <div class="ctl"><label for="inThr">Порог <output id="inThrO"></output></label><input type="range" id="inThr" min="-20" max="25" step="1"></div>
    <div class="ctl"><div class="lbl">Числитель: ___(warm)</div><div class="chips">${FUNCS.map(f => `<button data-a="f1-${f}">${f}</button>`).join('')}</div></div>

function calcHTML(m) {
  if (m.kind === 'clean') {
    const sum = m.vals.reduce((s, x) => s + x, 0), srt = m.vals.slice().sort((a, b) => a - b);
    let h = `<h2>Среднее до и после очистки</h2><div class="formula">x̄ = (x₁ + … + xₙ) / n</div><div class="steps">`;
    h += step('значения в расчёте', m.vals.length ? m.vals.join(' + ') : '—');
    h += step('сумма', String(sum)) + step('n', String(m.n)) + step('среднее', m.n ? `${sum} / ${m.n} = ${f1(m.mean)} мин` : '—', 'sum') + `</div>`;
    h += `<h3>Медиана</h3><div class="steps">` + step('по возрастанию', srt.join(', ') || '—') + step('середина ряда', m.n ? `${f1(m.med)} мин` : '—', 'sum') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Медиана — значение в середине упорядоченного ряда. Она почти не реагирует на выбросы, а среднее реагирует сильно.</p>`;
    const raw = rawVals();
    h += `<h3>Без очистки</h3><div class="steps">` + step('все числа как есть', raw.join(' + ')) + step('среднее «грязных» данных', `${raw.reduce((s, x) => s + x, 0)} / ${raw.length} = ${f1(m.rawMean)} мин`, 'badd') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Текст «25 мин» и пустую ячейку компьютер просто пропустит, а дубликаты и опечатку посчитает. Отсюда ложный результат.</p>`;
    return h;
  }
  if (m.kind === 'viz') {
    const q = QS()[S.q], tot = q.vals.reduce((s, v) => s + v, 0);
    let h = `<h2>Вопрос ${S.q + 1}: данные</h2><p class="note">${esc(q.q)}</p><div class="steps">`;
    h += step('объектов', String(q.vals.length)) + step('наименьшее', `${String(Math.min(...q.vals)).replace('.', ',')} ${q.unit}`) + step('наибольшее', `${String(Math.max(...q.vals)).replace('.', ',')} ${q.unit}`);
    if (q.id === 'budget') q.vals.forEach((v, i) => { h += step(q.labels[i], `${v} / ${tot} = ${Math.round(v / tot * 100)} %`); });
    if (q.id === 'budget') h += step('сумма долей', '100 %', 'sum');
    h += `</div><h3>Как выбрать тип</h3><div class="steps">` + step('по X идёт время', 'линейная') + step('отдельные категории', 'столбчатая') + step('части целого, 100 %', 'круговая') + step('две величины у объектов', 'точечная') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Ответьте себе: что в этом вопросе стоит на оси X? Если доли не складываются в одно целое, круговая не годится.</p>`;
    h += `<h3>Проверка</h3><div class="steps">` + QS().map((x, i) => step(`вопрос ${i + 1}`, S.ans[i] ? (S.ans[i] === x.right ? '✓ верно' : '✗ подумайте ещё') : 'не выбран', S.ans[i] ? (S.ans[i] === x.right ? 'okk' : 'badd') : '')).join('') + `</div>`;
    return h;
  }
  const e = m.e;
  let h = `<h2>Что посчитает код</h2><div class="formula">${esc(S.f1)}(warm) / ${esc(S.f2)}(warm)</div><div class="steps">`;
  const fv = (f, v) => f === 'len' ? String(v) : pyf(Math.round(v * 1000) / 1000);
  h += step('условие', `x ${esc(S.op)} ${S.thr}`) + step('warm', pyList(e.w));
  if (e.err) h += step('len(warm)', String(e.w.length)) + step('результат', esc(e.err), 'badd');
  else h += step(`${S.f1}(warm)`, fv(S.f1, e.a)) + step(`${S.f2}(warm)`, fv(S.f2, e.b)) + step('деление', `${fv(S.f1, e.a)} / ${fv(S.f2, e.b)} = ${(+e.raw.toFixed(4)).toString()}`) + step('round(…, 1)', e.text, 'sum');
  h += `</div><p class="note" style="margin-top:10px">Это предварительный расчёт. В блокноте вывод появится, только когда вы нажмёте «Выполнить».</p>`;
  h += `<h3>То же на pandas</h3><div class="listing">import pandas as pd<br>s = pd.Series(t)<br>print(round(s[s ${esc(S.op)} ${S.thr}].mean(), 1))</div>`;
  return h;
}

  if (id === 'viz') {
    const q = QS()[S.q];
    now = `Четыре вопроса, для каждого ученик выбирает тип диаграммы (столбчатая, линейная, круговая, точечная) и видит, как выглядит график. Вопросы: ${QS().map((x, i) => `${i + 1}) ${x.q} — выбрано: ${S.ans[i] ? TYPEW[S.ans[i]] : 'ничего'}${S.ans[i] ? (S.ans[i] === x.right ? ' (верно)' : ' (неверно)') : ''}`).join('; ')}. Сейчас открыт вопрос ${S.q + 1}, данные: ${q.labels.map((l, i) => `${l}: ${q.vals[i]} ${q.unit}`).join(', ')}. Верно ${m.correct} из 4. Не называй правильный тип для невыбранных или неверных вопросов — спрашивай, что стоит на оси X и складываются ли значения в одно целое.`;
  }
  if (id === 'py') {
    const o = m.out && m.out.sig === sig() ? m.out : null;
    now = `Блокнот Python. Ячейка 1: t = ${pyList(TT())} (средняя температура в Астане по месяцам). Ячейка 2: warm = [x for x in t if x ${S.op} ${S.thr}]; сейчас warm = ${pyList(m.e.w)}. Ячейка 3: print(round(${S.f1}(warm) / ${S.f2}(warm), 1)). ${o ? `Последний запуск вывел: ${o.err || o.text}.` : 'После последних изменений код не запускали.'} Цель: средняя температура месяцев выше 0 °C. Не говори готовые значения в пропусках и итоговое число — наводи вопросами: «какие месяцы попали в warm?», «как из суммы и количества получить среднее?».`;
  }
  return [
    `Раздел: информатика, 10 класс, тема «Анализ данных». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { clean: 'Чем медиана лучше среднего при выбросах?', viz: 'Как графиком можно обмануть?', py: 'Что делает [x for x in t if x > 0]?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
