<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по информатике, 8 класс: высказывания, операции И, ИЛИ, НЕ, таблицы истинности и логические схемы.">
<title>Логика</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag],.scene [data-hit]{cursor:pointer}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}
.scene .sans{font-family:var(--font-body)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--arm);transition:width .2s}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.big{font:600 15px/1 var(--font-mono);color:var(--fg);min-width:34px}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mtab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.mtab span{background:var(--surface-2);border-radius:7px;padding:6px 7px;font:500 12.5px/1.2 var(--font-mono);display:flex;justify-content:space-between;gap:4px;min-width:0}
.mtab span b{font-weight:600;color:var(--fg)}
.mtab span i{font-style:normal;color:var(--force);letter-spacing:.06em}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:470px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mtab{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 180px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#cs'" onkeydown="if(event.key==='Enter')location.href='/#cs'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="11" cy="20" r="3" fill="var(--force)"/><rect x="17" y="18" width="12" height="4" rx="2" fill="var(--arm)"/><circle cx="34" cy="20" r="1.6" fill="var(--fg)"/><path d="M8 11h24M8 29h24" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Информатика · Логика</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Логика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочий стол лаборатории">
    <svg class="scene" id="scene" role="img" aria-label="Интерактивная сцена: карточки можно перетаскивать, кнопки, клетки таблицы и вентили — нажимать."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const INK = '#04070d';
const ON = '#ffb547', OFF = '#3a4762';

const LESSONS = [
  { id: 'stmt', title: 'Высказывания: правда или ложь',
    text: ['Высказывание — это повествовательное предложение, про которое можно точно сказать: оно истинно или ложно. «Астана — столица Казахстана» — истинное высказывание. «2 + 2 = 5» — ложное.',
           'Вопросы, просьбы и восклицания — не высказывания: «Который час?» не бывает ни правдой, ни ложью. «x + 3 = 7» — тоже не высказывание: пока неизвестно, чему равен x, нельзя сказать, верно ли это.',
           'В логике истину обозначают 1, а ложь — 0. Так компьютер, который умеет работать только с 0 и 1, может «рассуждать».'],
    why: 'Программист пишет условия вида «пароль верный», «на счёте больше 1000 ₸» — это высказывания, и программа проверяет их тысячи раз в секунду. Юрист и журналист отделяют факты, которые можно проверить, от мнений и вопросов. А в жизни это помогает спорить по делу и не верить фейкам: сначала спроси себя, можно ли вообще проверить это утверждение.',
    task: 'Разложите 8 карточек: истинное высказывание, ложное или вовсе не высказывание.',
    hint: 'Про каждую карточку спросите: можно ли ответить на неё «правда» или «ложь»? Если можно — проверьте, что именно. Перетащите карточку в ящик или нажмите на неё, а потом на ящик.',
    stage: 'Тащите карточку в ящик. Неверно — карточка вернётся.',
    cards: [
      { id: 'astana', name: 'Астана — столица Казахстана', short: 'Астана', g: 't' },
      { id: 'sun', name: 'Солнце — звезда', short: 'Солнце', g: 't' },
      { id: 'prime', name: 'Число 7 — простое', short: '7 простое', g: 't' },
      { id: 'four', name: '2 + 2 = 5', short: '2 + 2 = 5', g: 'f' },
      { id: 'div', name: 'Число 15 делится на 4', short: '15 на 4', g: 'f' },
      { id: 'close', name: 'Закрой окно, пожалуйста!', short: 'Закрой окно!', g: 'n' },
      { id: 'time', name: 'Который час?', short: 'Который час?', g: 'n' },
      { id: 'eq', name: 'x + 3 = 7', short: 'x + 3 = 7', g: 'n' }],
    check: m => m.placed === m.total },
  { id: 'ops', title: 'И, ИЛИ, НЕ на кнопках',
    text: ['Из простых высказываний собирают сложные с помощью логических операций. И (конъюнкция, логическое умножение, A ∧ B) истинно, только когда истинны оба высказывания.',
           'ИЛИ (дизъюнкция, логическое сложение, A ∨ B) истинно, когда истинно хотя бы одно из них. НЕ (инверсия, ¬A) меняет значение на противоположное: 1 становится 0, а 0 — 1.',
           'Это видно на электрической цепи. Кнопка нажата — 1, отпущена — 0; лампа горит — 1. Две кнопки друг за другом (последовательно) — это И. Две кнопки рядом (параллельно) — это ИЛИ. Размыкающая кнопка — это НЕ: нажал — лампа погасла.'],
    why: 'Электрики и инженеры-автоматчики собирают такие цепи каждый день. Пресс на заводе включается, только если рабочий нажал две кнопки обеими руками (И) — так руки точно не попадут под пресс. Эскалатор в метро Алматы можно остановить аварийной кнопкой внизу ИЛИ наверху. А в поиске на hh.kz или в интернет-магазине фильтры «и», «или», «не» помогают быстро найти нужную вакансию или товар.',
    task: 'Проверьте все положения кнопок для И, ИЛИ и НЕ — и узнайте, когда горит лампа.',
    hint: 'Выберите операцию и переберите кнопки по порядку: 00, 01, 10, 11. Для НЕ нужна только кнопка A. Результаты сами запишутся в таблички под цепью.',
    stage: 'Нажимайте на кнопки A и B. Операцию меняйте внизу.',

const KEY = 'luch-cs-logic';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview',
            place: {}, miss: 0, sel: null, lastBad: null,
            op: 'and', A: 0, B: 0, tried: {},
            ex: 0, cells: [{}, {}], wrong: {}, lastCheck: [null, null], solved: {},
            inp: { D: 0, W: 0, H: 0 }, g1: 'and', g2: 'wire', g3: 'or', hl: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- lesson 1: statements ----------
const BOXES = [
  { id: 't', name: 'Истинное', sub: 'высказывание · 1', col: '#86e0a8' },
  { id: 'f', name: 'Ложное', sub: 'высказывание · 0', col: '#ff8a73' },
  { id: 'n', name: 'Не высказывание', sub: 'нельзя сказать', col: '#8b96ad' },
];
const GQ = { // guiding questions after a wrong drop (no answers)
  astana: 'Это утверждение можно проверить? Вспомни, какой город — столица нашей страны.',
  sun: 'Тут что-то утверждают про Солнце. Чем Солнце является на самом деле — планетой или звездой?',
  prime: 'Простое число делится только на 1 и на себя. На что делится 7?',
  four: 'Это утверждение можно проверить. Посчитай: сколько будет 2 + 2?',
  div: 'Утверждение проверяется делением. Сколько получится 15 : 4 — ровно или с остатком?',
  close: 'Можно ли про просьбу сказать «это правда» или «это ложь»?',
  time: 'Бывает ли вопрос истинным или ложным?',
  eq: 'Верно ли это, если x = 1? А если x = 4? Можно ли ответить, не зная x?',
};
const CARD = { w: 168, h: 30 };
const cardHome = i => ({ x: 8 + (i % 2) * 176, y: 92 + (i >> 1) * 36 });
const ZONE = { y: 250, w: 112, h: 148 };
const zoneX = i => 6 + i * 118;

// ---------- lesson 2: switches ----------
const OPS = { and: { name: 'И', sym: '∧', f: (a, b) => a & b }, or: { name: 'ИЛИ', sym: '∨', f: (a, b) => a | b }, not: { name: 'НЕ', sym: '¬', f: a => 1 - a } };
const COMBOS = { and: ['00', '01', '10', '11'], or: ['00', '01', '10', '11'], not: ['0', '1'] };
const tryKey = () => S.op === 'not' ? `not:${S.A}` : `${S.op}:${S.A}${S.B}`;
const lamp = () => S.op === 'not' ? 1 - S.A : OPS[S.op].f(S.A, S.B);

// ---------- lesson 3: truth tables ----------
const EXPR = [
  { name: 'НЕ A ИЛИ B', vars: ['A', 'B'], cols: [
      { h: 'НЕ A', f: v => 1 - v.A, how: v => `НЕ ${v.A} = ${1 - v.A}` },
      { h: 'F', f: v => (1 - v.A) | v.B, how: v => `${1 - v.A} ИЛИ ${v.B} = ${(1 - v.A) | v.B}` }] },
  { name: '(A ИЛИ B) И НЕ C', vars: ['A', 'B', 'C'], cols: [
      { h: 'A ИЛИ B', f: v => v.A | v.B },
      { h: 'НЕ C', f: v => 1 - v.C },
      { h: 'F', f: v => (v.A | v.B) & (1 - v.C) }] },
];
const rowVals = (e, r) => { const n = e.vars.length, v = {}; e.vars.forEach((k, i) => { v[k] = (r >> (n - 1 - i)) & 1; }); return v; };
const TB = { x: 6, w: 348, y: 100, hh: 26 };
const tGeom = e => { const nc = e.vars.length + e.cols.length, rows = 2 ** e.vars.length; return { nc, rows, cw: TB.w / nc, rh: rows > 4 ? 30 : 36 }; };

// ---------- lesson 4: gates ----------
const gf = (t, a, b) => t === 'and' ? a & b : a | b;
const circuit = (D, W, H) => { const v1 = gf(S.g1, D, W), v2 = S.g2 === 'not' ? 1 - H : H; return { v1, v2, F: gf(S.g3, v1, v2) }; };
const target = (D, W, H) => (D | W) & (1 - H);
const GNAME = { and: 'И', or: 'ИЛИ', not: 'НЕ', wire: 'провод' };
const formula4 = () => `(D ${GNAME[S.g1]} W) ${GNAME[S.g3]} ${S.g2 === 'not' ? 'НЕ H' : 'H'}`;

function model() {
  const id = LID();
  if (id === 'stmt') {
    const cards = L().cards, placed = cards.filter(c => S.place[c.id]).length;
    return { kind: 'sort', placed, total: cards.length, miss: S.miss };
  }
  if (id === 'ops') {
    const need = COMBOS.and.length + COMBOS.or.length + COMBOS.not.length;
    return { kind: 'ops', op: S.op, A: S.A, B: S.B, lamp: lamp(), tried: Object.keys(S.tried).length, need };
  }
  if (id === 'table') {
    const e = EXPR[S.ex], g = tGeom(e), total = g.rows * e.cols.length, filled = Object.keys(S.cells[S.ex]).length;
    return { kind: 'table', ex: S.ex, filled, total, solved: Object.keys(S.solved).length, last: S.lastCheck[S.ex] };
  }
  const { D, W, H } = S.inp, c = circuit(D, W, H);
  let match = 0;
  for (let r = 0; r < 8; r++) { const d = r >> 2 & 1, w = r >> 1 & 1, h = r & 1; if (circuit(d, w, h).F === target(d, w, h)) match++; }
  return { kind: 'gates', D, W, H, v1: c.v1, v2: c.v2, F: c.F, match, formula: formula4() };
}

// ---------- drawing ----------
const ol = (d, fill, stroke, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const wire = (d, on, w = 3) => `<path d="${d}" fill="none" stroke="${on ? ON : OFF}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

function drawSort(t) {
  const Ls = L();
  let h = '';
  BOXES.forEach((z, i) => {
    const x = zoneX(i), sel = S.sel !== null;
    const bad = S.lastBad && S.lastBad.z === z.id && t - S.lastBad.t < 700;
    h += `<g data-hit="zone:${z.id}"><rect x="${x}" y="${ZONE.y}" width="${ZONE.w}" height="${ZONE.h}" rx="10" fill="${bad ? 'rgba(255,138,115,.14)' : '#141d2e'}" stroke="${bad ? '#ff8a73' : sel ? '#72d4e8' : '#26324a'}" stroke-width="1.6" ${sel && !bad ? 'stroke-dasharray="5 4"' : ''}/>`;
    h += `<circle cx="${x + 14}" cy="${ZONE.y + 16}" r="5" fill="${z.col}"/><text x="${x + 24}" y="${ZONE.y + 20}" font-size="${z.name.length > 10 ? 9.5 : 10.5}" fill="#e8ecf4" class="sans" font-weight="600">${z.name}</text>`;
    h += `<text x="${x + 10}" y="${ZONE.y + 34}" font-size="8.5" fill="#8b96ad">${z.sub}</text>`;
    let k = 0;
    for (const c of Ls.cards) if (S.place[c.id] === z.id) {
      const y = ZONE.y + 44 + k * 26; k++;
      h += `<rect x="${x + 6}" y="${y}" width="${ZONE.w - 12}" height="22" rx="6" fill="#1f3a2f" stroke="#86e0a8" stroke-width="1.2"/><text x="${x + ZONE.w / 2}" y="${y + 14.5}" font-size="9.5" fill="#e8ecf4" text-anchor="middle" class="sans">${c.short}</text>`;
    }
    h += `</g>`;
  });
  Ls.cards.forEach((c, i) => {
    if (S.place[c.id]) return;
    const home = cardHome(i);
    h += `<rect x="${home.x}" y="${home.y}" width="${CARD.w}" height="${CARD.h}" rx="8" fill="none" stroke="#26324a" stroke-dasharray="4 4"/>`;
  });
  const order = Ls.cards.filter(c => !S.place[c.id]).sort((a, b) => (drag && drag.id === a.id ? 1 : 0) - (drag && drag.id === b.id ? 1 : 0));
  for (const c of order) {
    const o = P[c.id], sel = S.sel === c.id;
    h += `<g transform="translate(${o.x.toFixed(1)} ${o.y.toFixed(1)})" data-drag="${c.id}">`;
    h += ol(`M8 0H${CARD.w - 8}Q${CARD.w} 0 ${CARD.w} 8V${CARD.h - 8}Q${CARD.w} ${CARD.h} ${CARD.w - 8} ${CARD.h}H8Q0 ${CARD.h} 0 ${CARD.h - 8}V8Q0 0 8 0Z`, sel ? '#2a3a56' : '#1d2940', sel ? '#ffb547' : '#56627d', 1.6);
    h += `<circle cx="14" cy="${CARD.h / 2}" r="3" fill="${sel ? '#ffb547' : '#72d4e8'}"/>`;
    h += `<text x="24" y="${CARD.h / 2 + 4}" font-size="11" fill="#e8ecf4" class="sans"${c.name.length > 21 ? ` textLength="${CARD.w - 32}" lengthAdjust="spacingAndGlyphs"` : ""}>${c.name}</text></g>`;
  }
  h += `<text x="180" y="82" font-size="9" fill="#8b96ad" text-anchor="middle">предложения</text>`;
  h += `<text x="180" y="244" font-size="9" fill="#8b96ad" text-anchor="middle">ящики</text>`;
  return h;
}

// switch: contacts at x±18; closed lever rests on the right contact
function switchSVG(x, y, val, label, closed, nc) {
  let h = `<g data-hit="sw:${label}"><rect x="${x - 28}" y="${y - 30}" width="56" height="62" fill="transparent"/>`;
  h += `<circle cx="${x - 18}" cy="${y}" r="3.5" fill="#e8ecf4" stroke="${INK}" stroke-width="1.2"/><circle cx="${x + 18}" cy="${y}" r="3.5" fill="#e8ecf4" stroke="${INK}" stroke-width="1.2"/>`;
  const ex = closed ? x + 17 : x + 12, ey = closed ? y - 2 : y - 20;
  h += ol(`M${x - 18} ${y}L${ex} ${ey}`, 'none', closed ? ON : '#8b96ad', 3);
  // push button above the lever: pressed = 1
  const by = val ? y - 13 : y - 26;
  h += `<path d="M${x} ${(closed ? y - 1 : y - 11)}V${by}" stroke="#56627d" stroke-width="2"/><rect x="${x - 9}" y="${by - 7}" width="18" height="7" rx="2" fill="${val ? '#ffb547' : '#2a3348'}" stroke="${INK}" stroke-width="1.2"/>`;
  h += `<text x="${x}" y="${y + 22}" font-size="11" fill="#e8ecf4" text-anchor="middle" font-weight="600">${label} = ${val}</text>`;
  if (nc) h += `<text x="${x}" y="${y + 34}" font-size="8" fill="#8b96ad" text-anchor="middle">размыкающая</text>`;
  return h + `</g>`;
}

function drawOps(t) {
  const m = model(), on = !!m.lamp, op = S.op;
  let h = '';
  // left side with battery, right side with lamp, bottom wire
  h += wire('M34 182V118', on) + wire('M34 198V262H326V206', on) + wire('M326 174V118', on);
  h += `<g><path d="M20 182H48" stroke="#e8ecf4" stroke-width="2.6"/><path d="M27 198H41" stroke="#e8ecf4" stroke-width="5"/><text x="54" y="186" font-size="10" fill="#8b96ad">+</text><text x="56" y="206" font-size="8.5" fill="#8b96ad">батарейка</text></g>`;
  if (on) h += `<circle cx="326" cy="190" r="26" fill="#ffd27a" opacity=".2"/>`;
  h += `<circle cx="326" cy="190" r="16" fill="${on ? '#ffd27a' : '#2a3348'}" stroke="${INK}" stroke-width="2"/><path d="M315 179L337 201M337 179L315 201" stroke="${on ? '#a8660f' : '#56627d'}" stroke-width="1.6"/>`;
  h += `<text x="300" y="226" font-size="9" fill="#8b96ad" text-anchor="end">лампа = ${m.lamp}</text>`;
  if (op === 'and') {
    h += wire('M34 118H102', on) + wire('M138 118H212', on) + wire('M248 118H326', on);
    h += switchSVG(120, 118, S.A, 'A', !!S.A) + switchSVG(230, 118, S.B, 'B', !!S.B);
    h += `<text x="180" y="248" font-size="9" fill="#8b96ad" text-anchor="middle">кнопки подряд — последовательное соединение</text>`;
  } else if (op === 'or') {
    h += wire('M34 118H90', on) + wire('M90 92V150', on) + wire('M270 92V150', on) + wire('M270 118H326', on);
    h += wire('M90 92H162', on && S.A) + wire('M198 92H270', on && S.A) + wire('M90 150H162', on && S.B) + wire('M198 150H270', on && S.B);
    h += switchSVG(180, 92, S.A, 'A', !!S.A) + switchSVG(180, 150, S.B, 'B', !!S.B);
    h += `<text x="180" y="248" font-size="9" fill="#8b96ad" text-anchor="middle">кнопки рядом — параллельное соединение</text>`;
  } else {
    h += wire('M34 118H162', on) + wire('M198 118H326', on);
    h += switchSVG(180, 118, S.A, 'A', !S.A, true);
    h += `<text x="180" y="248" font-size="9" fill="#8b96ad" text-anchor="middle">кнопка B не нужна: у НЕ один вход</text>`;
  }
  // formula
  const o = OPS[op];
  const f = op === 'not' ? `НЕ A = НЕ ${S.A} = ${m.lamp}` : `A ${o.name} B = ${S.A} ${o.name} ${S.B} = ${m.lamp}`;
  h += `<text x="180" y="292" font-size="14" fill="${on ? '#ffd27a' : '#e8ecf4'}" text-anchor="middle" font-weight="500">${f}</text>`;
  // mini truth tables filled while exploring
  ['and', 'or', 'not'].forEach((k, i) => {
    const x = 6 + i * 118, y = 304, cur = k === op;
    h += `<g data-hit="op:${k}"><rect x="${x}" y="${y}" width="112" height="${k === 'not' ? 58 : 92}" rx="8" fill="#141d2e" stroke="${cur ? '#ffb547' : '#26324a'}" stroke-width="1.4"/>`;
    h += `<text x="${x + 56}" y="${y + 14}" font-size="9.5" fill="#e8ecf4" text-anchor="middle" font-weight="600">${k === 'not' ? 'A │ НЕ A' : `A B │ A ${OPS[k].name} B`}</text>`;
    COMBOS[k].forEach((c, r) => {
      const ry = y + 30 + r * 16, key = `${k}:${c}`, val = S.tried[key], here = cur && key === tryKey();
      if (here) h += `<rect x="${x + 4}" y="${ry - 11}" width="104" height="15" rx="4" fill="rgba(255,181,71,.14)"/>`;
      h += `<text x="${x + 30}" y="${ry}" font-size="10.5" fill="#8b96ad" text-anchor="middle">${c.split('').join(' ')}</text><text x="${x + 54}" y="${ry}" font-size="10.5" fill="#56627d">│</text>`;
      h += `<text x="${x + 80}" y="${ry}" font-size="10.5" fill="${val === undefined ? '#56627d' : val ? '#ffd27a' : '#e8ecf4'}" text-anchor="middle" font-weight="600">${val === undefined ? '?' : val}</text>`;
    });
    h += `</g>`;
  });
  return h;
}

function drawTable(t) {
  const e = EXPR[S.ex], g = tGeom(e), cells = S.cells[S.ex];
  let h = `<text x="180" y="90" font-size="12" fill="#e8ecf4" text-anchor="middle" font-weight="600">F = ${e.name}${S.solved[S.ex] ? '  ✓' : ''}</text>`;
  const heads = e.vars.concat(e.cols.map(c => c.h));
  heads.forEach((hd, c) => {
    const x = TB.x + c * g.cw, inp = c < e.vars.length;
    h += `<rect x="${x + 1}" y="${TB.y}" width="${g.cw - 2}" height="${TB.hh - 2}" rx="5" fill="${inp ? '#1a2438' : hd === 'F' ? '#3a2f1a' : '#1d2940'}"/>`;
    h += `<text x="${x + g.cw / 2}" y="${TB.y + 16}" font-size="${hd.length > 6 ? 9 : 11}" fill="${hd === 'F' ? '#ffb547' : '#e8ecf4'}" text-anchor="middle" font-weight="600">${hd}</text>`;
  });
  for (let r = 0; r < g.rows; r++) {
    const v = rowVals(e, r), y = TB.y + TB.hh + r * g.rh;
    e.vars.forEach((k, c) => {
      const x = TB.x + c * g.cw;
      h += `<rect x="${x + 1}" y="${y + 1}" width="${g.cw - 2}" height="${g.rh - 2}" rx="5" fill="#121a28" stroke="#26324a"/><text x="${x + g.cw / 2}" y="${y + g.rh / 2 + 5}" font-size="13" fill="#8b96ad" text-anchor="middle">${v[k]}</text>`;
    });
    e.cols.forEach((col, j) => {
      const c = e.vars.length + j, x = TB.x + c * g.cw, key = `${r}:${j}`, val = cells[key], bad = S.wrong[`${S.ex}:${key}`];
      h += `<g data-hit="cell:${r}:${j}"><rect x="${x + 1}" y="${y + 1}" width="${g.cw - 2}" height="${g.rh - 2}" rx="5" fill="${bad ? 'rgba(255,138,115,.14)' : '#1d2940'}" stroke="${bad ? '#ff8a73' : S.solved[S.ex] ? '#86e0a8' : '#56627d'}" stroke-width="1.3"/>`;
      h += `<text x="${x + g.cw / 2}" y="${y + g.rh / 2 + 5}" font-size="14" fill="${val === undefined ? '#56627d' : val ? '#ffd27a' : '#e8ecf4'}" text-anchor="middle" font-weight="600">${val === undefined ? '?' : val}</text></g>`;
    });
  }
  const yEnd = TB.y + TB.hh + g.rows * g.rh;
  h += `<path d="M${TB.x + e.vars.length * g.cw} ${TB.y - 2}V${yEnd + 2}" stroke="#72d4e8" stroke-width="1.4" opacity=".6"/>`;
  h += `<text x="180" y="${yEnd + 18}" font-size="9" fill="#8b96ad" text-anchor="middle">${e.vars.length} ${plural(e.vars.length, 'переменная', 'переменные', 'переменных')} → 2^${e.vars.length} = ${g.rows} строк · клетка: ? → 0 → 1</text>`;
  return h;
}

function gateSVG(slot, x, y, w, hh, type, outVal) {
  let h = `<g data-hit="g:${slot}"><rect x="${x - 6}" y="${y - 6}" width="${w + 12 + (type === 'not' ? 8 : 0)}" height="${hh + 12}" fill="transparent"/>`;
  if (type === 'wire') {
    h += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="4" fill="none" stroke="#56627d" stroke-dasharray="4 3" stroke-width="1.4"/>`;
    h += wire(`M${x} ${y + hh / 2}H${x + w}`, outVal, 2.6);

function drawGates(t) {
  const m = model();
  let h = '';
  const IN = [{ k: 'D', y: 158, name: 'дверь', st: ['закрыта', 'открыта'] }, { k: 'W', y: 192, name: 'окно', st: ['закрыто', 'открыто'] }, { k: 'H', y: 300, name: 'хозяин', st: ['не дома', 'дома'] }];
  // wires first
  h += wire('M40 158H110', m.D) + wire('M40 192H110', m.W) + wire('M40 300H110', m.H);
  const g2out = S.g2 === 'not' ? 162 : 154;
  h += wire('M154 175H190V215H230', m.v1) + wire(`M${g2out} 300H200V285H230`, m.v2) + wire('M274 250H300', m.F);
  // inputs (sensors)

    h += `<text x="8" y="${s.y - 14}" font-size="8" fill="#8b96ad">${s.name}: ${s.st[v]}</text></g>`;
  }
  h += gateSVG(1, 110, 140, 44, 70, S.g1, m.v1);
  h += gateSVG(2, 110, 278, 44, 44, S.g2, m.v2);
  h += gateSVG(3, 230, 195, 44, 110, S.g3, m.F);
  // signal values on wires
  h += `<text x="196" y="170" font-size="9" fill="${m.v1 ? ON : '#8b96ad'}">${m.v1}</text><text x="206" y="312" font-size="9" fill="${m.v2 ? ON : '#8b96ad'}">${m.v2}</text>`;
  // siren
  const on = !!m.F;
  if (on) {
    const k = reduce ? 0.5 : 0.5 + 0.5 * Math.sin(t / 120);
    h += `<circle cx="322" cy="250" r="${24 + 4 * k}" fill="#ff8a73" opacity="${(0.18 + 0.12 * k).toFixed(2)}"/>`;
    h += `<path d="M342 236q8 14 0 28M348 230q12 20 0 40" fill="none" stroke="#ff8a73" stroke-width="2" stroke-linecap="round"/>`;
  }
  h += ol('M306 262h32v6h-32zM309 262q0-26 13-26q13 0 13 26', on ? '#ff8a73' : '#2a3348', on ? '#ffd2c6' : '#56627d', 1.6);
  h += `<text x="322" y="286" font-size="9" fill="${on ? '#ff8a73' : '#8b96ad'}" text-anchor="middle">сирена = ${m.F}</text>`;
  h += `<text x="180" y="362" font-size="12" fill="#e8ecf4" text-anchor="middle">F = ${m.formula}</text>`;
  h += `<text x="180" y="384" font-size="10" fill="${m.match === 8 ? '#86e0a8' : '#8b96ad'}" text-anchor="middle">совпадает с условием в ${m.match} из 8 случаев</text>`;
  return h;
}

function hlBox(id) {
  const lid = LID();
  if (lid === 'stmt') {
    const i = BOXES.findIndex(z => z.id === id);
    if (i >= 0) return [zoneX(i) - 3, ZONE.y - 3, ZONE.w + 6, ZONE.h + 6];
    if (id === 'cards') return [2, 86, 356, 150];
  }
  if (lid === 'ops') return { battery: [12, 172, 70, 40], sw: [70, 66, 240, 112], lamp: [302, 166, 48, 64], wires: [24, 90, 316, 180], tables: [2, 300, 356, 100], formula: [40, 276, 280, 22] }[id];
  if (lid === 'table') {
    const e = EXPR[S.ex], g = tGeom(e), nv = e.vars.length, y = TB.y - 3, hh = TB.hh + g.rows * g.rh + 6;
    if (id === 'vars') return [TB.x - 2, y, nv * g.cw + 4, hh];
    if (id === 'steps') return [TB.x + nv * g.cw - 2, y, (e.cols.length - 1) * g.cw + 4, hh];
    if (id === 'res') return [TB.x + (g.nc - 1) * g.cw - 2, y, g.cw + 4, hh];
    if (id === 'title') return [30, 76, 300, 20];
  }
  if (lid === 'gates') return { inputs: [2, 128, 64, 186], g1: [104, 134, 56, 92], g2: [104, 268, 66, 64], g3: [224, 189, 56, 130], siren: [298, 224, 60, 70], formula: [30, 346, 300, 44] }[id];
  return null;
}

const scene = $('#scene');
function drawScene(t) {
  const id = LID();
  let h = `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4360" height="4405" fill="url(#tile)"/>`;
  if (id === 'stmt') h += drawSort(t);
  else if (id === 'ops') h += drawOps(t);
  else if (id === 'table') h += drawTable(t);
  else h += drawGates(t);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b) h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

// fit the scene: 360 × 405 units, centred, content at the bottom
let VB = { x: 0, y: 0, w: 360, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 372, hh / 412, 1.8);
  VB = { w: w / s, h: hh / s }; VB.x = 180 - VB.w / 2; VB.y = 404 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- interaction ----------
let P = {}, drag = null, dirty = true;
const resetProps = () => { P = {}; if (LID() === 'stmt') L().cards.forEach((c, i) => { const p = cardHome(i); P[c.id] = { x: p.x, y: p.y, rx: p.x, ry: p.y }; }); };
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
const zoneAt = p => { if (p.y < ZONE.y - 10 || p.y > ZONE.y + ZONE.h + 6) return null; const i = BOXES.findIndex((z, k) => p.x >= zoneX(k) - 3 && p.x <= zoneX(k) + ZONE.w + 3); return i >= 0 ? BOXES[i].id : null; };

scene.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-drag]'), hit = e.target.closest('[data-hit]');
  if (!d && !hit) return;
  e.preventDefault();
  try { scene.setPointerCapture(e.pointerId); } catch (er) {}
  if (d) {
    const id = d.dataset.drag, o = P[id], p = toSvg(e);
    drag = { id, dx: o.x - p.x, dy: o.y - p.y, x: e.clientX, y: e.clientY, moved: false };
    scene.classList.add('grabbing'); dirty = true; return;
  }
  drag = { id: 'hit', h: hit.dataset.hit };
});
scene.addEventListener('pointermove', e => {
  if (!drag || !P[drag.id]) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (!drag.moved) return;
  const p = toSvg(e), o = P[drag.id];
  o.x = clamp(p.x + drag.dx, VB.x - CARD.w / 2, VB.x + VB.w - CARD.w / 2); o.y = clamp(p.y + drag.dy, VB.y, 390);
  dirty = true;
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null; scene.classList.remove('grabbing'); dirty = true;
  if (cancel) return;
  if (d.id === 'hit') { onHit(d.h); return; }
  if (!d.moved) { S.sel = S.sel === d.id ? null : d.id; update(); return; }
  const z = zoneAt(toSvg(e));
  if (z) tryPlace(d.id, z);
}
scene.addEventListener('pointerup', e => endDrag(e, false));
scene.addEventListener('pointercancel', e => endDrag(e, true));

function onHit(h) {
  const [k, v, w] = h.split(':');
  if (k === 'zone') { if (S.sel) tryPlace(S.sel, v); else toast('Сначала выберите карточку.'); }
  if (k === 'sw') { if (v === 'A') S.A = 1 - S.A; else S.B = 1 - S.B; update(); }
  if (k === 'op') act('op-' + v);
  if (k === 'cell') cycleCell(+v, +w);
  if (k === 'in') { S.inp[v] = 1 - S.inp[v]; update(); }
  if (k === 'g') { cycleGate(+v); }
}

function tryPlace(cid, zid) {
  const c = L().cards.find(x => x.id === cid); if (!c || S.place[cid]) return;
  if (c.g === zid) { S.place[cid] = zid; S.sel = null; toast(`«${c.name}» — ${zid === 'n' ? 'не высказывание' : zid === 't' ? 'истинное высказывание' : 'ложное высказывание'}.`); }
  else { S.miss++; S.lastBad = { z: zid, t: performance.now() }; toast(GQ[cid]); }
  update();
}

function cycleCell(r, j) {
  const c = S.cells[S.ex], key = `${r}:${j}`;
  if (S.solved[S.ex]) { toast('Эта таблица уже решена. Переключитесь на другую.'); return; }
  c[key] = c[key] === undefined ? 0 : 1 - c[key];
  delete S.wrong[`${S.ex}:${key}`];
  update();
}
function checkTable() {
  const e = EXPR[S.ex], g = tGeom(e), c = S.cells[S.ex];
  let empty = 0, bad = 0;
  for (let r = 0; r < g.rows; r++) e.cols.forEach((col, j) => {
    const key = `${r}:${j}`, val = c[key];
    if (val === undefined) { empty++; return; }
    if (val !== col.f(rowVals(e, r))) { bad++; S.wrong[`${S.ex}:${key}`] = true; }
  });
  S.lastCheck[S.ex] = { empty, bad };
  if (!empty && !bad) { S.solved[S.ex] = true; toast(`Таблица для ${e.name} заполнена верно!`); }
  else if (bad) toast(`${bad} ${plural(bad, 'ошибка', 'ошибки', 'ошибок')} — клетки обведены красным.${empty ? ` И ещё пустых: ${empty}.` : ''}`);
  else toast(`Ошибок нет, но пустых клеток: ${empty}.`);
  update();
}
function cycleGate(slot) {
  if (slot === 2) S.g2 = S.g2 === 'wire' ? 'not' : 'wire';
  else { const k = 'g' + slot; S[k] = S[k] === 'and' ? 'or' : 'and'; }
  update();
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  let anim = false;
  for (const [k, o] of Object.entries(P)) {
    if (drag && drag.id === k) continue;
    const nx = reduce ? o.rx : o.x + (o.rx - o.x) * Math.min(1, dt * 12), ny = reduce ? o.ry : o.y + (o.ry - o.y) * Math.min(1, dt * 12);
    if (Math.abs(o.rx - nx) + Math.abs(o.ry - ny) > 0.3) { o.x = nx; o.y = ny; anim = true; } else if (o.x !== o.rx || o.y !== o.ry) { o.x = o.rx; o.y = o.ry; anim = true; }
  }
  if (S.hl || (S.lastBad && t - S.lastBad.t < 800)) anim = true;
  if (LID() === 'gates' && model().F && !reduce) anim = true;
  if (dirty || anim) { drawScene(t); dirty = false; }
}

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed, cls) => `<button data-a="${k}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}${cls ? ` class="${cls}"` : ''}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    stmt: B('reshuffle', 'Начать заново'),
    ops: B('op-and', 'И', S.op === 'and') + B('op-or', 'ИЛИ', S.op === 'or') + B('op-not', 'НЕ', S.op === 'not') + sep + B('swA', `A = ${S.A}`, !!S.A) + B('swB', `B = ${S.B}`, !!S.B),
    table: B('ex-0', 'Таблица 1', S.ex === 0) + B('ex-1', 'Таблица 2', S.ex === 1) + sep + B('check', 'Проверить') + B('clear', 'Очистить'),
    gates: B('in-D', `Дверь ${S.inp.D}`, !!S.inp.D) + B('in-W', `Окно ${S.inp.W}`, !!S.inp.W) + B('in-H', `Дома ${S.inp.H}`, !!S.inp.H) + sep + B('g-1', 'Вентиль 1') + B('g-2', 'Вентиль 2') + B('g-3', 'Вентиль 3'),
  }[id];
}
function act(a) {
  if (a === 'reshuffle') { S.place = {}; S.miss = 0; S.sel = null; resetProps(); update(); return; }
  if (a.startsWith('op-')) { S.op = a.slice(3); update(); return; }
  if (a === 'swA') { S.A = 1 - S.A; update(); return; }
  if (a === 'swB') { if (S.op === 'not') { toast('У НЕ один вход — кнопка B здесь ни на что не влияет.'); return; } S.B = 1 - S.B; update(); return; }
  if (a.startsWith('ex-')) { S.ex = +a.slice(3); update(); return; }
  if (a === 'check') return checkTable();
  if (a === 'clear') { if (S.solved[S.ex]) { toast('Эта таблица уже решена.'); return; } S.cells[S.ex] = {}; S.lastCheck[S.ex] = null; for (const k of Object.keys(S.wrong)) if (k.startsWith(S.ex + ':')) delete S.wrong[k]; update(); return; }
  if (a.startsWith('in-')) { const k = a.slice(3); S.inp[k] = 1 - S.inp[k]; update(); return; }
  if (a.startsWith('g-')) { cycleGate(+a.slice(2)); return; }
}

  } else if (id === 'table') {

function calcHTML(m) {
  const id = LID();
  if (id === 'stmt') {
    let h = `<h2>Как рассуждать</h2><div class="formula">можно ответить «да/нет»? → проверь</div>
      <div class="steps">${step('1. Это утверждение?', 'вопрос, просьба → нет')}${step('2. Значение известно?', 'есть неизвестное x → нет')}${step('3. Верно ли оно?', 'да → 1, нет → 0', 'sum')}</div><h3>Разложено</h3>`;
    const placed = L().cards.filter(c => S.place[c.id]);
    h += placed.length ? `<div class="steps">` + placed.map(c => step(c.name, c.g === 'n' ? 'не высказывание' : c.g === 't' ? 'истина → 1' : 'ложь → 0')).join('') + `</div>` : `<p class="note">Пока ничего. Разложите первую карточку — здесь появится рассуждение.</p>`;
    h += `<h3>Итог</h3><div class="steps">` + step('разложено', `${m.placed} из ${m.total}`) + step('промахов', String(m.miss)) +
      step('точность', m.placed + m.miss ? `${m.placed} / ${m.placed + m.miss} = ${Math.round(m.placed / (m.placed + m.miss) * 100)} %` : '—', 'sum') + `</div>`;
    return h;
  }
  if (id === 'ops') {
    const o = OPS[S.op];
    let h = `<h2>Операция ${o.name}</h2><div class="formula">${S.op === 'not' ? `¬A = НЕ ${S.A} = ${m.lamp}` : `A ${o.sym} B = ${S.A} ${o.name} ${S.B} = ${m.lamp}`}</div>`;
    h += `<p class="note">${S.op === 'and' ? 'Цепь замкнута, только если замкнуты обе кнопки: ток идёт через A, а потом через B.' : S.op === 'or' ? 'Ток может пройти по верхней ветке через A или по нижней через B — хватит любой.' : 'Размыкающая кнопка: отпущена — контакт замкнут, нажата — разомкнут.'}</p>`;
    h += `<h3>Проверено для ${o.name}</h3>`;
    const rows = COMBOS[S.op].filter(c => S.tried[`${S.op}:${c}`] !== undefined);
    h += rows.length ? `<div class="steps">` + rows.map(c => step(S.op === 'not' ? `A = ${c}` : `A = ${c[0]}, B = ${c[1]}`, `лампа ${S.tried[`${S.op}:${c}`]}`)).join('') + `</div>` : `<p class="note">Пока ничего. Нажимайте кнопки.</p>`;
    h += `<h3>Сколько положений</h3><div class="steps">` + step('И, ИЛИ: 2 кнопки', '2² = 4') + step('НЕ: 1 кнопка', '2¹ = 2') + step('всего', `4 + 4 + 2 = ${m.need}`, 'sum') + step('проверено', `${m.tried} из ${m.need}`) + `</div>`;
    return h;
  }
  if (id === 'table') {
    const e = EXPR[S.ex], g = tGeom(e);
    let h = `<h2>Как заполнять таблицу</h2><div class="formula">F = ${e.name}</div>`;
    h += `<div class="steps">` + step('переменных', `${e.vars.length} → 2^${e.vars.length} = ${g.rows} строк`) +
      e.cols.map((c, j) => step(`шаг ${j + 1}`, c.h === 'F' ? `F = ${e.name}` : c.h)).join('') + `</div>`;
    h += `<p class="note" style="margin-top:10px">Порядок действий: скобки → НЕ → И → ИЛИ.</p>`;
    h += `<h3>Правила</h3><div class="steps">` + step('НЕ', 'НЕ 0 = 1, НЕ 1 = 0') + step('И', '1 только если оба 1') + step('ИЛИ', '0 только если оба 0') + `</div>`;
    h += `<h3>Пример на другом выражении</h3><div class="steps">` + step('НЕ A И B при A = 1, B = 1', '') + step('1) НЕ A', 'НЕ 1 = 0') + step('2) 0 И B', '0 И 1 = 0', 'sum') + `</div>`;
    h += `<h3>Проверка</h3><div class="steps">` + step('заполнено', `${m.filled} из ${m.total}`) + step('последняя проверка', m.last ? `ошибок ${m.last.bad}, пустых ${m.last.empty}` : '—') + step('решено таблиц', `${m.solved} из 2`, 'sum') + `</div>`;
    return h;
  }
  let h = `<h2>Таблица схемы</h2><div class="formula" style="font-size:15px">F = ${m.formula}</div><p class="note">Столбец «нужно» — как должна вести себя сирена по условию задачи.</p>`;
  h += `<div class="steps">` + step('D W H', `в1 · в2 · F → нужно`);
  for (let r = 0; r < 8; r++) {
    const d = r >> 2 & 1, w = r >> 1 & 1, hh = r & 1, c = circuit(d, w, hh), tg = target(d, w, hh), cur = d === m.D && w === m.W && hh === m.H;
    h += step(`${cur ? '▸ ' : ''}${d} ${w} ${hh}`, `${c.v1} · ${c.v2} · ${c.F} → ${tg} ${c.F === tg ? '✓' : '✗'}`);
  }
  h += step('совпадений', `${m.match} из 8`, 'sum') + `</div>`;
  h += `<p class="note" style="margin-top:10px">в1 — выход вентиля 1, в2 — выход вентиля 2. ▸ — текущее положение датчиков.</p>`;
  return h;
}

  const Ls = LESSONS[i];
  S.lesson = i; S.place = {}; S.miss = 0; S.sel = null; S.lastBad = null; S.hl = null;
  S.op = 'and'; S.A = 0; S.B = 0; S.tried = {};
  S.ex = 0; S.cells = [{}, {}]; S.wrong = {}; S.lastCheck = [null, null]; S.solved = {};

  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

    const placed = Ls.cards.filter(c => S.place[c.id]).map(c => `«${c.name}» → ${name(S.place[c.id])}`);
    const left = Ls.cards.filter(c => !S.place[c.id]).map(c => `«${c.name}»`);
    now = `Ученик раскладывает предложения по трём ящикам: «истинное высказывание», «ложное высказывание», «не высказывание». Разложено верно ${m.placed} из ${m.total}: ${placed.join('; ') || 'пока ничего'}. Осталось: ${left.join(', ') || 'ничего'}. Промахов: ${m.miss}.${S.sel ? ` Сейчас выбрана карточка «${Ls.cards.find(c => c.id === S.sel).name}».` : ''}`;
    guide = 'Не называй, в какой ящик класть оставшиеся карточки: наводящими вопросами помоги понять, можно ли сказать про предложение «правда» или «ложь» и верно ли оно.';
  }
  if (id === 'ops') {
    const tried = Object.entries(S.tried).map(([k, v]) => { const [o, c] = k.split(':'); return `${OPS[o].name} при ${o === 'not' ? 'A=' + c : 'A=' + c[0] + ', B=' + c[1]} → лампа ${v}`; });
    now = `Электрическая цепь моделирует операцию ${OPS[S.op].name} (${S.op === 'and' ? 'две кнопки последовательно' : S.op === 'or' ? 'две кнопки параллельно' : 'одна размыкающая кнопка'}). Кнопки: A = ${S.A}${S.op === 'not' ? '' : `, B = ${S.B}`}. Лампа ${m.lamp ? 'горит (1)' : 'не горит (0)'}. Проверено положений ${m.tried} из ${m.need}: ${tried.join('; ') || 'пока ни одного'}.`;
    guide = 'Помоги ученику систематически перебрать положения кнопок (00, 01, 10, 11) для каждой операции; попроси сначала предсказать, загорится ли лампа, а потом проверить.';
  }
  if (id === 'table') {
    const e = EXPR[S.ex], filled = Object.entries(S.cells[S.ex]).map(([k, v]) => { const [r, j] = k.split(':').map(Number); const rv = rowVals(e, r); return `строка ${e.vars.map(x => x + '=' + rv[x]).join(',')}, столбец «${e.cols[j].h}» = ${v}`; });
    now = `Ученик заполняет таблицу истинности для F = ${e.name} (таблица ${S.ex + 1} из 2). Столбцы: ${e.vars.concat(e.cols.map(c => c.h)).join(' | ')}. Заполнено ${m.filled} из ${m.total} клеток: ${filled.join('; ') || 'пока ничего'}. ${m.last ? `Последняя проверка: ошибок ${m.last.bad}, пустых ${m.last.empty}.` : 'Проверки ещё не было.'} Решено таблиц: ${m.solved} из 2${S.solved[0] ? ' (первая решена)' : ''}${S.solved[1] ? ' (вторая решена)' : ''}.`;
    guide = 'Не называй значения клеток: помоги разобрать порядок действий и посчитать одну строку вместе, задавая вопросы; если ученик ошибся, спроси, какое правило (НЕ, И, ИЛИ) он применил.';
  }
  if (id === 'gates') {
    now = `Логическая схема сигнализации из трёх вентилей. Входы: D (дверь открыта) = ${m.D}, W (окно открыто) = ${m.W}, H (хозяин дома) = ${m.H}. Вентиль 1 (D и W): ${GNAME[S.g1]}, выход ${m.v1}. Вентиль 2 (H): ${GNAME[S.g2]}, выход ${m.v2}. Вентиль 3 (выходы 1 и 2): ${GNAME[S.g3]}. Сирена F = ${m.F}. Формула текущей схемы: F = ${m.formula}. Схема совпадает с условием в ${m.match} из 8 наборов входов. Условие задачи: сирена воет, если открыта дверь или окно и при этом хозяина нет дома.`;
    guide = 'Не говори сразу, какие вентили поставить: попроси перевести условие в формулу по словам «или», «и», «нет», а потом сравнить её с формулой схемы.';
  }
  return [
    `Раздел: информатика, 8 класс, тема «Логика». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    S.done[id] ? 'Задание уже выполнено — можно обсуждать свободно.' : guide,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = {
    stmt: 'Почему «x + 3 = 7» — не высказывание?',
    ops: 'Почему И называют логическим умножением, а ИЛИ — сложением?',
    table: 'Почему для трёх переменных в таблице 8 строк?',
    gates: 'Как по формуле нарисовать логическую схему?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
