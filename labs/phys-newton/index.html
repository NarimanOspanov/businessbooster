<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene [data-click]{cursor:pointer}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}
.meter .lr .bad{color:var(--warn)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools button.rec{color:var(--force)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}


@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 230px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>

      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="20" cy="20" r="3" fill="var(--fg)"/><path d="M20 20L31 20" stroke="var(--arm)" stroke-width="1.6"/><circle cx="31" cy="20" r="3.6" fill="var(--force)"/><path d="M31 20v-9" stroke="var(--arm)" stroke-width="2"/><path d="M28 13l3 -5 3 5z" fill="var(--arm)"/></svg>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const nf = x => fmt(x, Math.abs(x - Math.round(x)) < 1e-9 ? 0 : Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? 1 : 2);
const SUPD = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sci = (x, n = 2) => {
  if (!x) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))), m = x / 10 ** e;
  if (Math.abs(Math.round(m * 10 ** n) / 10 ** n) >= 10) { m /= 10; e++; }
  return fmt(m, n) + '·10' + String(e).replace(/[-\d]/g, c => SUPD[c]);
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const G = 6.67e-11, ME = 5.97e24, RE = 6.371e6, GN = 9.8;

const LESSONS = [
  { id: 'inertia', title: 'Инерция и первый закон',
    text: ['Инерция — свойство тел сохранять свою скорость, пока на них не подействуют другие тела. Когда автобус резко тормозит, пассажиры продолжают двигаться вперёд — по инерции.',
           'Первый закон Ньютона: существуют такие системы отсчёта, называемые инерциальными, в которых тело движется равномерно и прямолинейно или покоится, если на него не действуют другие тела или их действия скомпенсированы (ΣF = 0).',
           'Шайба на ковре быстро останавливается не «сама собой»: её тормозит сила трения. Чем меньше трение, тем дольше она едет. Без трения скорость не меняется вовсе.'],
    why: 'Ремни безопасности и подголовники спасают жизнь именно из-за инерции: при ударе машина останавливается, а тело продолжает лететь вперёд. Инженеры-автомобилисты и сотрудники дорожной полиции считают тормозной путь, а машинисты грузовых поездов Қазақстан темір жолы начинают тормозить за километр до станции. Хоккеисты и кёрлингисты используют инерцию шайбы и камня на льду.',
    task: 'Запустите шайбу на воздушной подушке и убедитесь: без трения скорость не меняется (3 с пути). Затем ответьте: какая сила нужна, чтобы шайба дальше ехала с той же скоростью?',
    hint: 'Оттяните шайбу влево на пусковой пружине и отпустите (или нажмите «Толкнуть»). Поверхность меняйте кнопками внизу. Смотрите на график скорости.',
    stage: 'Оттяните шайбу влево и отпустите.',
    surfs: [{ id: 'carpet', name: 'ковёр', mu: 0.25 }, { id: 'ice', name: 'лёд', mu: 0.03 }, { id: 'air', name: 'воздушная подушка', mu: 0 }],
    check: m => m.airRun && m.ans },
  { id: 'second', title: 'Второй закон: F = ma',
    text: ['Сила меняет скорость тела — сообщает ему ускорение. Второй закон Ньютона: ускорение тела прямо пропорционально равнодействующей всех сил и обратно пропорционально массе: a = F / m, или F = m · a.',
           'Ускорение направлено так же, как равнодействующая сила. Сила 1 Н — это сила, которая телу массой 1 кг сообщает ускорение 1 м/с².',
           'Удвоили силу — ускорение выросло вдвое. Удвоили массу при той же силе — ускорение стало вдвое меньше. Масса — мера инертности тела.'],
    why: 'Конструкторы автомобилей и электросамокатов по F = ma подбирают мощность мотора: груженая машина разгоняется медленнее пустой. Логисты и водители фур на трассе Алматы — Астана знают, что тяжёлый прицеп дольше разгоняется и тормозит. Инженеры лифтов в жилых комплексах рассчитывают силу натяжения троса при разгоне кабины.',
    task: 'Разгоните тележку массой 2 кг с ускорением 1,5 м/с². Затем догрузите её до 3 кг и подберите силу, чтобы ускорение осталось тем же.',
    hint: 'Тяните оранжевую стрелку силы или жмите F − / F +, массу меняйте кнопками m − / m +. Жмите «Пуск»: секундомер измерит время на 1 м. a = F / m.',
    stage: 'Тяните стрелку силы. «Пуск» — заезд на 1 м.',
    s: 1,
    check: m => m.ok1 && m.ok2 },
  { id: 'third', title: 'Третий закон: действие и противодействие',
    text: ['Тела действуют друг на друга с силами, равными по величине и противоположными по направлению: F₁₂ = −F₂₁. Это третий закон Ньютона.',
           'Эти силы приложены к разным телам, поэтому они не уравновешивают друг друга. Они одной природы и появляются и исчезают одновременно.',

    why: 'На третьем законе летают ракеты с Байконура: газы выталкиваются назад, а ракету толкает вперёд. Пловец отталкивается от воды, лодочник — веслом, а при выстреле ружьё бьёт стрелка отдачей в плечо. Инженеры-проектировщики мостов знают: с какой силой машина давит на мост, с такой же силой мост давит на машину.',
    task: 'Поставьте тележки разной массы, сожмите между ними пружину и отпустите. Сравните показания датчиков силы и скорости. С какой силой лёгкая тележка толкает тяжёлую?',
    hint: 'Тяните правую тележку влево — пружина сожмётся, отпустите — тележки разъедутся. Массы меняйте кнопками внизу. Движение показано замедленно.',
    stage: 'Тяните правую тележку влево и отпустите.',
    k: 500, nat: 0.12,
    check: m => m.runDiff && m.ans },
  { id: 'gravity', title: 'Всемирное тяготение',
    text: ['Все тела притягиваются друг к другу. Закон всемирного тяготения: F = G · m₁ · m₂ / r². Сила пропорциональна произведению масс и обратно пропорциональна квадрату расстояния между центрами тел.',
           'G = 6,67·10⁻¹¹ Н·м²/кг² — гравитационная постоянная. Она очень мала, поэтому притяжение двух людей незаметно. А масса Земли огромна, и её притяжение мы чувствуем всегда — это сила тяжести.',
           'У поверхности Земли r = R ≈ 6400 км и g = G·M / R² ≈ 9,8 м/с². Удалимся на расстояние 2R от центра — сила станет в 4 раза меньше, на 3R — в 9 раз.'],
    why: 'Баллистики и инженеры космической отрасли рассчитывают по закону тяготения орбиты спутников связи KazSat и спутников дистанционного зондирования, которые снимают поля и паводки. Геофизики по крошечным отличиям g ищут под землёй плотные руды и пустоты — гравиразведка помогает находить месторождения. Морские приливы тоже объясняются притяжением Луны.',
    task: 'Измерьте силу притяжения корабля у поверхности Земли (r = R) и на расстоянии r = 2R. Затем ответьте: во сколько раз слабее притяжение на r = 3R, чем у поверхности?',
    hint: 'Тяните корабль вдоль оси от Земли. Расстояние r считается от центра Земли. Сравните силу на графике справа.',
    stage: 'Тяните корабль вдоль оси r.',
    masses: [500, 1000, 2000],
    check: m => m.v1 && m.v2 && m.ans },
  { id: 'circle', title: 'Движение по окружности',
    text: ['При равномерном движении по окружности модуль скорости постоянен, но её направление всё время меняется. Скорость направлена по касательной к окружности.',
           'Значит, у тела есть ускорение. Оно направлено к центру и называется центростремительным: a = v² / r. Чтобы его создать, нужна сила к центру: F = m · v² / r. Здесь её создаёт натяжение нити.',
           'Если нить оборвётся, сила исчезнет — и мяч по инерции полетит по касательной, а не «наружу от центра».'],
    why: 'Дорожные инженеры рассчитывают радиус поворотов и наклон полотна, чтобы машину не вынесло с дороги на скорости. Стиральная машина при отжиме и центрифуга в медлаборатории используют ту же физику: вода и тяжёлые частицы уходят по касательной. Метатели молота и пилоты самолётов на вираже чувствуют силу к центру на себе.',
    task: 'Мяч 0,2 кг на нити длиной 1 м, нить выдерживает 5 Н. Найдите наибольшую скорость, при которой нить цела, и сделайте с ней полный оборот. Потом порвите нить и посмотрите, куда полетит мяч.',
    hint: 'Скорость меняйте кнопками v − / v +, длину нити — перетаскивая мяч. Сила натяжения F = m · v² / r. Чуть больше 5 Н — и нить рвётся.',
    stage: 'Тяните мяч, чтобы изменить длину нити.',
    m: 0.2, Fmax: 5,
    check: m => m.spunMax && m.brokeSeen },
];

const LS_KEY = 'luch-phys-newton';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null };
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const L = () => LESSONS[S.lesson];
const LID = () => L().id;

// ---------- geometry (SVG units; the scene is 520 × 405) ----------
const D1 = { gy: 330, x0: 110, ppm: 70, pr: 17, gx0: 300, gy0: 236, gw: 200, gh: 92 };
const D2 = { ty: 312, x0: 120, ppm: 340, cw: 72, fpx: 16 };
const D3 = { ty: 312, cx: 260, ppm: 250, cw: 64, left: 18, right: 502, slow: 3 };
const D4 = { ex: -10, ey: 268, R: 74, gx0: 262, gy0: 222, gw: 230, gh: 92 };
const D5 = { cx: 190, cy: 258, ppm: 86 };

function resetState() {
  Object.assign(S, {
    hl: null,
    // 1
    surf: 'carpet', x: 0, v: 0, cam: 0, pull: 0, simT: 0, hist: [], sampT: 0, tRun: 0, airRun: false, ans: false,
    // 2
    F: 2, m2: 1, s2: 0, t2: 0, run2: false, strobe2: [], runs: [], ok1: false, ok2: false,
    // 3
    mL: 1, mR: 2, xL: -0.06, xR: 0.06, vL: 0, vR: 0, run3: false, t3: 0, sep: null, peak: 0, strobe3: [], st3: 0, runDiff: false, ans3: false,
    // 4
    r4: 3, mc: 1000, seen: {}, ans4: false,
    // 5
    v5: 3, r5: 1, ang: 0, broke: false, fly: null, spinT: 0, spunMax: false, brokeSeen: false,
  });
}
resetState();

// ---------- model ----------
const surf = () => L().surfs ? L().surfs.find(s => s.id === S.surf) : { mu: 0 };
const a2 = () => S.F / S.m2;
const comp3 = () => Math.max(0, L().nat - (S.xR - S.xL));
const F3 = () => (L().k || 0) * comp3();
const F4 = (r = S.r4) => G * S.mc * ME / (r * RE) ** 2;
const g4 = (r = S.r4) => G * ME / (r * RE) ** 2;
const F5 = () => L().m * S.v5 * S.v5 / S.r5;

function model() {
  const id = LID();
  if (id === 'inertia') return { kind: id, v: S.v, mu: surf().mu, airRun: S.airRun, ans: S.ans };
  if (id === 'second') return { kind: id, F: S.F, m: S.m2, a: a2(), ok1: S.ok1, ok2: S.ok2 };
  if (id === 'third') return { kind: id, F: F3(), peak: S.peak, sep: S.sep, runDiff: S.runDiff, ans: S.ans3 };
  if (id === 'gravity') return { kind: id, r: S.r4, F: F4(), g: g4(), v1: !!S.seen[10], v2: !!S.seen[20], ans: S.ans4 };
  return { kind: id, v: S.v5, r: S.r5, a: S.v5 * S.v5 / S.r5, F: F5(), broke: S.broke, spunMax: S.spunMax, brokeSeen: S.brokeSeen };
}

// ---------- drawing helpers ----------
const T = (x, y, s, fill, txt, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const halo = `paint-order="stroke" stroke="${INK}" stroke-width="3"`;
function arrow(x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L2 = Math.hypot(x2 - x1, y2 - y1); if (L2 < 2) return '';
  const hl = Math.min(12, L2 * 0.6), hx = x2 - hl * Math.cos(a), hy = y2 - hl * Math.sin(a);
  const p1 = `${(hx + 6 * Math.sin(a)).toFixed(1)} ${(hy - 6 * Math.cos(a)).toFixed(1)}`, p2 = `${(hx - 6 * Math.sin(a)).toFixed(1)} ${(hy + 6 * Math.cos(a)).toFixed(1)}`;
  return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linecap="round"/><path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1}L${p2}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
}
function bg() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.06)" stroke-width="1.5"/></pattern>
    <radialGradient id="earthG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3f8fd0"/><stop offset=".7" stop-color="#1f5b94"/><stop offset="1" stop-color="#143a63"/></radialGradient></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
function hzig(x1, x2, y, coils, h) {
  const n = coils * 2, dx = (x2 - x1 - 8) / n;
  let d = `M${x1.toFixed(1)} ${y}h4`;
  for (let i = 0; i < n; i++) d += `L${(x1 + 4 + dx * (i + 0.5)).toFixed(1)} ${(y + (i % 2 ? -h : h)).toFixed(1)}`;
  return d + `L${(x2 - 4).toFixed(1)} ${y}H${x2.toFixed(1)}`;
}
function cart(x, y, w, col, lab, n) {   // x = left, y = rail top
  let h = `<rect x="${x.toFixed(1)}" y="${y - 34}" width="${w}" height="26" rx="4" fill="${col}" stroke="${INK}" stroke-width="1.8"/>`;
  h += `<circle cx="${(x + 14).toFixed(1)}" cy="${y - 6}" r="6" fill="#2b3346" stroke="#a9b4c9" stroke-width="1.6"/><circle cx="${(x + w - 14).toFixed(1)}" cy="${y - 6}" r="6" fill="#2b3346" stroke="#a9b4c9" stroke-width="1.6"/>`;
  for (let i = 0; i < n; i++) { const r = Math.floor(i / 4), c = i % 4; h += `<rect x="${(x + 6 + c * 15).toFixed(1)}" y="${y - 45 - r * 11}" width="13" height="10" rx="2" fill="#9aa4b6" stroke="${INK}" stroke-width="1.1"/>`; }
  return h + T(x + w / 2, y - 17, 10.5, INK, lab, 'middle', 'font-weight="600"');
}

// ---------- lesson 1: puck and launcher ----------
const sx1 = x => D1.x0 + (x - S.cam) * D1.ppm;
function inertiaScene() {
  const sf = surf(), gy = D1.gy, px = sx1(S.x) - S.pull, py = gy - 9;
  const col = { carpet: '#7a3b4a', ice: '#bfe6f5', air: '#3a4f7a' }[sf.id];
  let h = `<rect x="-2000" y="${gy}" width="4520" height="1200" fill="#151e2e"/><rect x="-2000" y="${gy}" width="4520" height="14" fill="${col}" stroke="${INK}" stroke-width="1.2"/>`;
  const k0 = Math.floor(S.cam) - 3;
  for (let i = 0; i < 26; i++) {
    const xx = -100 + i * 28 - (S.cam * D1.ppm) % 28;
    if (sf.id === 'carpet') h += `<path d="M${xx.toFixed(1)} ${gy + 3}l6 8" stroke="#5c2a37" stroke-width="2"/>`;
    if (sf.id === 'air') h += `<circle cx="${xx.toFixed(1)}" cy="${gy + 7}" r="2" fill="#0e1520"/>`;
    if (sf.id === 'ice' && i % 3 === 0) h += `<path d="M${xx.toFixed(1)} ${gy + 4}l22 5" stroke="#fff" stroke-width="1" opacity=".7"/>`;
  }
  for (let k = k0; k < k0 + 14; k++) {
    if (k < 0) continue;
    const x = sx1(k);
    h += `<path d="M${x.toFixed(1)} ${gy + 14}v8" stroke="#8b96ad" stroke-width="1.2"/>` + T(x, gy + 34, 9, '#8b96ad', `${k} м`);
  }
  // launcher at x = 0
  const lx = sx1(0);
  if (lx > -200) {
    h += `<rect x="${(lx - 92).toFixed(1)}" y="${gy - 44}" width="14" height="44" rx="2" fill="#4a5875" stroke="${INK}" stroke-width="1.4"/>`;
    const pe = (S.x === 0 ? px : lx) - D1.pr - 4;
    h += `<path d="${hzig(lx - 78, pe, py, 6, 7)}" fill="none" stroke="#72d4e8" stroke-width="2" stroke-linejoin="round"/><rect x="${(pe - 2).toFixed(1)}" y="${py - 12}" width="5" height="24" rx="2" fill="#a9b4c9" stroke="${INK}"/>`;
    h += T(lx - 60, gy - 52, 9, '#8b96ad', 'пусковая пружина');
  }
  // puck (side view: flat cylinder)
  const canDrag = S.v === 0 && S.x === 0;
  h += `<g ${canDrag ? 'data-drag="puck"' : ''}><rect x="${(px - 34).toFixed(1)}" y="${py - 34}" width="68" height="56" fill="transparent"/>
    <ellipse cx="${px.toFixed(1)}" cy="${py + 4}" rx="${D1.pr}" ry="5" fill="#0d0f14" stroke="${INK}"/><rect x="${(px - D1.pr).toFixed(1)}" y="${py - 6}" width="${D1.pr * 2}" height="10" fill="#1d2230"/><ellipse cx="${px.toFixed(1)}" cy="${py - 6}" rx="${D1.pr}" ry="5" fill="#ffb547" stroke="${INK}" stroke-width="1.4"/></g>`;
  if (canDrag && S.pull === 0) h += T(px, py - 22, 9, '#ffb547', '← тяни', 'middle', halo);
  // forces
  if (S.v > 0) {
    h += arrow(px, py - 30, px + 14 + S.v * 12, py - 30, '#72d4e8', 2.4) + T(px + 18 + S.v * 12, py - 26, 10, '#72d4e8', `v = ${fmt(S.v, 2)} м/с`, 'start', halo);
    if (sf.mu > 0) h += arrow(px - 4, gy - 1, px - 50, gy - 1, '#ff8a73', 2.6) + T(px - 54, gy - 6, 10, '#ff8a73', 'Fтр', 'end', halo);
    else h += T(px, py - 48, 10, '#86e0a8', 'ΣF = 0', 'middle', halo);
  }
  h += arrow(px + D1.pr + 8, py - 2, px + D1.pr + 8, py + 22, '#ffb547', 1.8) + arrow(px + D1.pr + 14, py + 2, px + D1.pr + 14, py - 22, '#86e0a8', 1.8);
  h += T(px + D1.pr + 19, py + 20, 8.5, '#ffb547', 'mg', 'start', halo) + T(px + D1.pr + 19, py - 14, 8.5, '#86e0a8', 'N', 'start', halo);
  // v(t) graph
  const { gx0, gy0, gw, gh } = D1;
  h += `<rect x="${gx0 - 30}" y="${gy0 - gh - 22}" width="${gw + 42}" height="${gh + 44}" rx="10" fill="rgba(18,26,40,.78)" stroke="#26324a"/>`;
  for (let v = 0; v <= 4; v++) { const y = gy0 - gh * v / 4; h += `<path d="M${gx0} ${y}H${gx0 + gw}" stroke="#26324a"/>` + T(gx0 - 5, y + 3, 8.5, '#8b96ad', v, 'end'); }
  h += `<path d="M${gx0} ${gy0}H${gx0 + gw + 4}M${gx0} ${gy0}V${gy0 - gh - 6}" stroke="#a9b4c9" stroke-width="1.4"/>`;
  h += T(gx0 + gw, gy0 + 13, 8.5, '#a9b4c9', 't, последние 6 с', 'end') + T(gx0 + 4, gy0 - gh - 8, 8.5, '#a9b4c9', 'v, м/с', 'start');
  if (S.hist.length > 1) {
    const t1 = S.simT, d = S.hist.map((p, i) => `${i ? 'L' : 'M'}${(gx0 + gw * (1 - (t1 - p.t) / 6)).toFixed(1)} ${(gy0 - gh * Math.min(p.v, 4) / 4).toFixed(1)}`).join('');
    h += `<path d="${d}" fill="none" stroke="#72d4e8" stroke-width="2"/>`;
  }
  return h;
}

// ---------- lesson 2: cart pulled by a winch ----------
const front2 = () => D2.x0 + S.s2 * D2.ppm;
function secondScene() {
  const ty = D2.ty, fx = front2(), x = fx - D2.cw, n = Math.round((S.m2 - 0.5) / 0.5);
  let h = `<rect x="-2000" y="${ty}" width="4520" height="1200" fill="#151e2e"/><rect x="20" y="${ty}" width="500" height="8" fill="#4a5875" stroke="${INK}"/>`;
  // gates
  for (const [gx, lab] of [[D2.x0, 'старт'], [D2.x0 + D2.ppm, '1 м']]) {
    h += `<path d="M${gx} ${ty}V${ty - 92}" stroke="#a9b4c9" stroke-width="2.4"/><circle cx="${gx}" cy="${ty - 92}" r="5" fill="${S.run2 ? '#86e0a8' : '#5a6680'}" stroke="${INK}"/>` + T(gx, ty + 22, 9.5, '#8b96ad', lab);
  }
  for (let i = 1; i < 10; i++) h += `<path d="M${D2.x0 + i * D2.ppm / 10} ${ty + 8}v5" stroke="#5a6680"/>`;
  // strobe marks
  for (const s of S.strobe2) h += `<circle cx="${(D2.x0 + s * D2.ppm).toFixed(1)}" cy="${ty + 4}" r="3" fill="#ffb547" opacity=".85"/>`;
  // winch, rope, dynamometer
  h += `<rect x="496" y="${ty - 60}" width="16" height="60" fill="#4a5875" stroke="${INK}"/><circle cx="504" cy="${ty - 22}" r="11" fill="#2a3a58" stroke="#a9b4c9" stroke-width="2"/>`;
  h += `<path d="M${(fx + 34).toFixed(1)} ${ty - 22}H493" stroke="#c8d2e3" stroke-width="1.6"/>`;
  h += `<rect x="${fx.toFixed(1)}" y="${ty - 28}" width="34" height="12" rx="3" fill="#e8ecf4" stroke="${INK}"/>` + T(fx + 17, ty - 19, 8, INK, `${nf(S.F)} Н`, 'middle', 'font-weight="600"');
  h += cart(x, ty, D2.cw, '#4c7fd1', `${nf(S.m2)} кг`, n);
  // force arrow (draggable tip)
  const ay = ty - 74, ax = x + D2.cw / 2, tip = ax + Math.max(S.F, 0) * D2.fpx;
  if (S.F > 0) h += arrow(ax, ay, tip, ay, '#ffb547', 3.2);
  h += T(ax, ay - 12, 11, '#ffb547', `F = ${nf(S.F)} Н`, 'start', halo);
  if (!S.run2 && S.s2 === 0) h += `<g data-drag="ftip"><circle cx="${tip.toFixed(1)}" cy="${ay}" r="16" fill="transparent"/><circle cx="${tip.toFixed(1)}" cy="${ay}" r="7" fill="none" stroke="#ffb547" stroke-width="1.6" stroke-dasharray="3 2"/></g>`;
  // timer
  h += `<rect x="300" y="150" width="150" height="40" rx="8" fill="#0c1a14" stroke="#3a4762"/>` + T(375, 177, 18, '#86e0a8', `t = ${fmt(S.t2, 2)} с`, 'middle', 'font-weight="500"') + T(375, 142, 9, '#8b96ad', 'секундомер на 1 м');
  // runs log
  h += T(30, 150, 10, '#8b96ad', 'Заезды (m, F → a):', 'start');
  if (!S.runs.length) h += T(30, 166, 10, '#5a6680', 'пока нет', 'start');
  S.runs.slice(0, 4).forEach((r, i) => { h += T(30, 166 + i * 15, 10.5, '#e8ecf4', `${nf(r.m)} кг, ${nf(r.F)} Н → ${fmt(r.a, 2)} м/с²`, 'start'); });
  return h;
}

// ---------- lesson 3: two carts with a spring ----------
const pxL3 = () => D3.cx + S.xL * D3.ppm, pxR3 = () => D3.cx + S.xR * D3.ppm;
function thirdScene() {
  const ty = D3.ty, lr = pxL3(), rl = pxR3(), F = F3(), Ls = L();
  let h = `<rect x="-2000" y="${ty}" width="4520" height="1200" fill="#151e2e"/><rect x="${D3.left - 6}" y="${ty}" width="${D3.right - D3.left + 12}" height="8" fill="#4a5875" stroke="${INK}"/>`;
  h += `<rect x="${D3.left - 10}" y="${ty - 30}" width="6" height="30" fill="#6c7a96"/><rect x="${D3.right + 4}" y="${ty - 30}" width="6" height="30" fill="#6c7a96"/>`;
  for (const p of S.strobe3) h += `<circle cx="${p[0].toFixed(1)}" cy="${ty + 4}" r="2.6" fill="#72d4e8" opacity=".8"/><circle cx="${p[1].toFixed(1)}" cy="${ty + 4}" r="2.6" fill="#ffb547" opacity=".8"/>`;
  // spring on the left cart
  const se = Math.min(lr + Ls.nat * D3.ppm, rl);
  h += `<path d="${hzig(lr, se - 4, ty - 21, 5, 6)}" fill="none" stroke="#c8d2e3" stroke-width="2" stroke-linejoin="round"/><rect x="${(se - 5).toFixed(1)}" y="${ty - 32}" width="5" height="22" rx="2" fill="#a9b4c9" stroke="${INK}"/>`;
  h += cart(lr - D3.cw, ty, D3.cw, '#2f8aa0', `${S.mL} кг`, S.mL - 1);
  const canDrag = !S.run3 && !S.sep;

// ---------- lesson 4: Earth and a spacecraft ----------
const sx4 = r => D4.ex + r * D4.R;

  h += `<circle cx="${ex}" cy="${ey}" r="2.5" fill="#e8ecf4"/>`;

// ---------- lesson 5: ball on a string ----------
const ballPos = () => ({ x: D5.cx + S.r5 * D5.ppm * Math.cos(S.ang), y: D5.cy + S.r5 * D5.ppm * Math.sin(S.ang) });

function hlBox(id) {

const scene = $('#scene');
function drawScene(t) {

let VB = { x: 0, y: 0, w: 520, h: 405 };
function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 520, hh / 410, 1.7);
  VB = { w: w / s, h: hh / s }; VB.x = 260 - VB.w / 2; VB.y = 405 - VB.h;
  scene.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);

}
new ResizeObserver(fit).observe(scene);

// ---------- pointer ----------
let drag = null, dirty = true;
const toSvg = e => { const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = scene.getScreenCTM(); return c ? pt.matrixTransform(c.inverse()) : { x: 0, y: 0 }; };
scene.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();

  if (id === 'cartR') { const Ls = L(); S.xR = clamp(drag.xR0 + (p.x - drag.x0) / D3.ppm, S.xL + Ls.nat - 0.08, S.xL + Ls.nat); dirty = true; update(); }

function endDrag() {

  if (id === 'cartR') { if (comp3() > 0.005) release3(); else { S.xR = S.xL + L().nat; } }

}
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

// lesson 1
function launch1(v) { S.v = clamp(v, 0.5, 4); S.tRun = 0; renderTools(); update(); }
function home1() { S.x = 0; S.v = 0; S.cam = 0; S.tRun = 0; S.pull = 0; renderTools(); update(); }
function setSurf(id) { if (id === S.surf) return; S.surf = id; S.tRun = 0; renderTools(); buildScheme(); update(); }
// lesson 2
function setF(F) { if (S.run2) return; F = clamp(Math.round(F * 2) / 2, 0, 10); if (F === S.F) return; S.F = F; renderTools(); update(); }
function setM2(m) { if (S.run2) return; m = clamp(Math.round(m * 2) / 2, 0.5, 4); if (m === S.m2) return; S.m2 = m; S.s2 = 0; S.t2 = 0; S.strobe2 = []; renderTools(); update(); }
function start2() {
  if (S.run2) return;
  if (S.F <= 0) { toast('Без силы тележка не поедет: F = 0.'); return; }
  S.s2 = 0; S.t2 = 0; S.strobe2 = [0]; S.run2 = true;
  if (reduce) finish2(); else { renderTools(); update(); }
}
function finish2() {
  const a = a2(), t = Math.sqrt(2 * L().s / a);
  S.run2 = false; S.s2 = 1; S.t2 = t;
  if (reduce) { S.strobe2 = []; for (let k = 0; k * 0.1 <= t; k++) S.strobe2.push(a * (k * 0.1) ** 2 / 2); }
  S.runs.unshift({ m: S.m2, F: S.F, t, a }); S.runs = S.runs.slice(0, 6);
  if (S.m2 === 2 && S.F === 3 && !S.ok1) S.ok1 = true;
  if (S.m2 === 3 && S.F === 4.5 && !S.ok2) S.ok2 = true;
  toast(`Заезд: 1 м за ${fmt(t, 2)} с → a = ${fmt(a, 2)} м/с².`);
  renderTools(); buildScheme(); update();
}
function back2() { if (S.run2) return; S.s2 = 0; S.t2 = 0; S.strobe2 = []; renderTools(); update(); }
// lesson 3
function home3() { S.xL = -0.06; S.xR = 0.06; S.vL = 0; S.vR = 0; S.run3 = false; S.sep = null; S.peak = 0; S.strobe3 = []; renderTools(); update(); }
function release3() {
  S.peak = F3(); S.vL = 0; S.vR = 0; S.t3 = 0; S.st3 = 0; S.strobe3 = []; S.sep = null; S.run3 = true;
  if (reduce) { while (S.run3) step3(0.01); }
  renderTools(); update();
}
function step3(dt) {
  const Ls = L(), n = 12, h = dt / n;
  for (let i = 0; i < n; i++) {
    const F = Ls.k * comp3();
    S.vL -= F / S.mL * h; S.vR += F / S.mR * h;
    S.xL += S.vL * h; S.xR += S.vR * h;
    if (!S.sep && comp3() === 0 && S.t3 > 0) {
      S.sep = { vL: S.vL, vR: S.vR, mL: S.mL, mR: S.mR, F: S.peak };
      if (S.mL !== S.mR && !S.runDiff) S.runDiff = true;
    }
    const lmin = (D3.left + D3.cw - D3.cx) / D3.ppm, rmax = (D3.right - D3.cw - D3.cx) / D3.ppm;
    if (S.xL < lmin) { S.xL = lmin; S.vL = 0; }
    if (S.xR > rmax) { S.xR = rmax; S.vR = 0; }
    S.t3 += h; S.st3 += h;
    if (S.st3 >= 0.03) { S.st3 = 0; S.strobe3.push([pxL3() - D3.cw / 2, pxR3() + D3.cw / 2]); }
  }
  if (S.sep && ((S.vL === 0 && S.vR === 0) || S.t3 > 2.5)) {
    S.run3 = false;
    toast(`Силы на датчиках равны: ${fmt(S.sep.F, 1)} Н. Скорости: ${fmt(Math.abs(S.sep.vL), 2)} и ${fmt(S.sep.vR, 2)} м/с.`);
    renderTools(); buildScheme(); update();
  }
}
function setM3(side, m) { if (S.run3) return; if (side === 'L') S.mL = m; else S.mR = m; home3(); buildScheme(); }
// lesson 4
function setR4(r) {
  r = clamp(Math.round(r * 10) / 10, 1, 6); if (r === S.r4) return; S.r4 = r;
  const k = Math.round(r * 10);
  if ((k === 10 || k === 20) && !S.seen[k]) { S.seen[k] = true; toast(k === 10 ? `У поверхности: F₀ = ${fF(F4())}.` : `На 2R: ${fF(F4())} — сравните с F₀.`); renderTools(); buildScheme(); }
  update();
}
// lesson 5
function setV5(v) { v = clamp(Math.round(v * 2) / 2, 1, 8); if (v === S.v5) return; S.v5 = v; S.spinT = 0; checkBreak(); renderTools(); update(); }
function setR5(r) { r = clamp(r, 0.5, 1.5); if (r === S.r5 || S.broke) return; S.r5 = r; S.spinT = 0; checkBreak(); renderTools(); update(); }
function checkBreak() {
  const Ls = L();
  if (S.broke || F5() <= Ls.Fmax + 1e-9) return;
  const b = ballPos(), ux = -Math.sin(S.ang), uy = Math.cos(S.ang);
  S.broke = true; S.fly = { x: b.x, y: b.y, bx: b.x, by: b.y, ux, uy, t: 0 };
  if (!S.brokeSeen) S.brokeSeen = true;
  toast(`Нить порвалась: нужно ${fmt(F5(), 2)} Н, а она держит ${Ls.Fmax} Н. Мяч летит по касательной.`);
  buildScheme();
}
function home5() { S.broke = false; S.fly = null; S.spinT = 0; if (F5() > L().Fmax) S.v5 = 3; renderTools(); buildScheme(); update(); }

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const id = LID();
  if (id === 'inertia') {
    S.simT += dt;
    if (S.v > 0) {
      const mu = surf().mu;
      S.v = Math.max(0, S.v - mu * GN * dt); S.x += S.v * dt; S.cam = Math.max(0, S.x - 1.5);
      if (S.surf === 'air') { S.tRun += dt; if (S.tRun >= 3 && !S.airRun) { S.airRun = true; toast('Трения нет — скорость за 3 с не изменилась. Это и есть инерция.'); renderTools(); buildScheme(); update(); } }
      if (S.v === 0) { renderTools(); update(); }
    }
    S.sampT += dt;
    if (S.sampT >= 0.05) { S.sampT = 0; S.hist.push({ t: S.simT, v: S.v }); while (S.hist.length && S.simT - S.hist[0].t > 6) S.hist.shift(); }
    dirty = true;
  }
  if (id === 'second' && S.run2) {
    const a = a2(); S.t2 += dt;
    const k = Math.floor(S.t2 / 0.1); while (S.strobe2.length <= k) { const tt = S.strobe2.length * 0.1; S.strobe2.push(Math.min(1, a * tt * tt / 2)); }
    S.s2 = a * S.t2 * S.t2 / 2;
    if (S.s2 >= L().s) finish2();
    dirty = true;
  }
  if (id === 'third' && S.run3) { step3(dt / D3.slow); dirty = true; }
  if (id === 'circle') {
    if (!S.broke) {
      S.ang += S.v5 / S.r5 * dt;
      if (S.v5 === 5 && S.r5 === 1) { S.spinT += dt; if (S.spinT >= 2 * Math.PI / 5 && !S.spunMax) { S.spunMax = true; toast('Полный оборот при 5 м/с: F = 5 Н — ровно предел нити.'); renderTools(); update(); } }
    } else if (S.fly) { const sp = S.v5 * D5.ppm; S.fly.x += S.fly.ux * sp * dt; S.fly.y += S.fly.uy * sp * dt; S.fly.t += dt; }
    dirty = true;
  }
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

  }
  if (id === 'gravity') {
    h = B('r-', 'r −') + B('r+', 'r +') + B('r1', 'r = R') + sep + Ls.masses.map(m => B('mc-' + m, `${m} кг`, S.mc === m)).join('');
    if (S.seen[10] && S.seen[20] && !S.ans4) h += sep + '<span style="font-size:12px;color:var(--muted);padding:0 4px;white-space:nowrap">на 3R слабее</span>' + Q4.map(([k, l]) => B('q4-' + k, l, undefined, 'rec')).join('');

  tb.innerHTML = h;
}

function act(a) {
  if (a.startsWith('sf-')) return setSurf(a.slice(3));
  if (a === 'push') return launch1(2.5);
  if (a === 'home') return home1();
  if (a.startsWith('q1-')) {
    if (a === 'q1-zero') { S.ans = true; toast('Верно: если силы скомпенсированы, скорость сохраняется сама.'); renderTools(); buildScheme(); update(); }
    else toast('Посмотрите на график: на подушке сил по горизонтали нет, а скорость не падает.');
    return;
  }
  if (a === 'f-' || a === 'f+') return setF(S.F + (a === 'f-' ? -0.5 : 0.5));
  if (a === 'm-' || a === 'm+') return setM2(S.m2 + (a === 'm-' ? -0.5 : 0.5));
  if (a === 'go') return start2();
  if (a === 'back') return back2();
  if (a.startsWith('ml-')) return setM3('L', +a.slice(3));
  if (a.startsWith('mr-')) return setM3('R', +a.slice(3));
  if (a.startsWith('pr-')) { if (S.run3) return; const [, x, y] = a.split('-'); S.mL = +x; S.mR = +y; home3(); buildScheme(); return; }
  if (a === 'fire') { if (S.run3) return; if (S.sep) home3(); S.xR = S.xL + L().nat - 0.06; return release3(); }
  if (a === 'home3') { if (!S.run3) home3(); return; }
  if (a.startsWith('q3-')) {
    if (a === 'q3-eq') { S.ans3 = true; toast('Верно: силы взаимодействия равны. Разные только ускорения.'); renderTools(); buildScheme(); update(); }
    else toast('Сравните два датчика силы — что они показывали во время толчка?');
    return;
  }
  if (a === 'r-' || a === 'r+') return setR4(S.r4 + (a === 'r-' ? -0.5 : 0.5));
  if (a === 'r1') return setR4(1);
  if (a.startsWith('mc-')) { S.mc = +a.slice(3); renderTools(); buildScheme(); update(); return; }
  if (a.startsWith('q4-')) {
    if (a === 'q4-9') { S.ans4 = true; toast('Верно: r больше в 3 раза → сила меньше в 3² = 9 раз.'); renderTools(); buildScheme(); update(); }
    else toast('Расстояние выросло в 2 раза, а сила упала в 4. Какая связь?');
    return;
  }
  if (a === 'v-' || a === 'v+') { if (S.broke) return toast('Сначала верните мяч.'); return setV5(S.v5 + (a === 'v-' ? -0.5 : 0.5)); }
  if (a.startsWith('r5-')) { if (S.broke) return toast('Сначала верните мяч.'); return setR5(+a.slice(3)); }
  if (a === 'home5') return home5();
}

  if (id === 'inertia') return [t(m.airRun, `подушка: ${fmt(Math.min(S.tRun, 3), 1)}/3 с`), t(m.ans, 'вывод')].join(' · ');
  if (id === 'second') return [t(m.ok1, '2 кг, a = 1,5'), t(m.ok2, '3 кг, a = 1,5')].join(' · ');

function renderPanes(m) {
  const Ls = L(), done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Что на площадке</h2><p class="note">Нажмите на деталь, чтобы найти её на площадке.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  const id = LID(), Ls = L();
  if (id === 'inertia') {
    const mu = surf().mu, a = mu * GN;
    return `<h2>Почему шайба тормозит</h2><div class="formula">a = Fтр / m = μ · g</div><p class="note">Трение скольжения Fтр = μ · N, а на горизонтали N = m · g. Масса сокращается, поэтому торможение не зависит от массы шайбы.</p>
      <h3>Сейчас: ${surf().name}</h3><div class="steps">` + step('μ', fmt(mu, 2)) + step('торможение a', `${fmt(mu, 2)} × 9,8 = ${fmt(a, 2)} м/с²`) +
      step('скорость v', `${fmt(S.v, 2)} м/с`) +
      step('остановится через', mu > 0 ? `t = v / a = ${fmt(S.v, 2)} / ${fmt(a, 2)} = ${fmt(S.v / a, 1)} с` : 'никогда: a = 0') +
      step('тормозной путь', mu > 0 ? `s = v² / (2a) = ${fmt(S.v * S.v / (2 * a), 2)} м` : '∞ — едет, пока что-то не помешает', 'sum') + `</div>
      <p class="note" style="margin-top:10px">Первый закон: если ΣF = 0, то v = const. Сила нужна, чтобы изменить скорость, а не чтобы её поддерживать.</p>`;
  }
  if (id === 'second') {
    const a = a2(), t = Math.sqrt(2 / a);
    return `<h2>Второй закон Ньютона</h2><div class="formula">a = F / m</div><div class="formula">s = a·t² / 2 → a = 2s / t²</div>
      <h3>Сейчас</h3><div class="steps">` + step('F', `${nf(S.F)} Н`) + step('m', `0,5 + ${Math.round((S.m2 - 0.5) / 0.5)} × 0,5 = ${nf(S.m2)} кг`) +
      step('a = F / m', S.F > 0 ? `${nf(S.F)} / ${nf(S.m2)} = ${fmt(a, 2)} м/с²` : '0 — тележка стоит') +
      step('время на 1 м', S.F > 0 ? `t = √(2 · 1 / ${fmt(a, 2)}) = ${fmt(t, 2)} с` : '—', 'sum') + `</div>
      <h3>Проверка по секундомеру</h3><div class="steps">` + (S.runs.length ? S.runs.slice(0, 4).map(r => step(`${nf(r.m)} кг, ${nf(r.F)} Н`, `2 · 1 / ${fmt(r.t, 2)}² = ${fmt(r.a, 2)} м/с²`)).join('') : step('заездов нет', '—')) + `</div>
      <h3>К заданию</h3><div class="steps">` + step('нужно', 'a = 1,5 м/с²') + step('m = 2 кг', 'F = m · a = ?') + step('m = 3 кг', 'F = m · a = ?', 'sum') + `</div>`;
  }
  if (id === 'third') {
    const sp = S.sep;
    let h = `<h2>Третий закон Ньютона</h2><div class="formula">F₁₂ = −F₂₁</div><div class="formula">a = F / m</div><p class="note">Пружина жёсткостью 500 Н/м давит на обе тележки одинаково: F = k · x. Ускорения разные, потому что разные массы.</p>
      <h3>Сейчас</h3><div class="steps">` + step('сжатие x', `${fmt(comp3() * 100, 1)} см`) + step('F = k · x', `500 × ${fmt(comp3(), 3)} = ${fmt(F3(), 1)} Н`) +
      step('a левой', `${fmt(F3(), 1)} / ${S.mL} = ${fmt(F3() / S.mL, 1)} м/с²`) + step('a правой', `${fmt(F3(), 1)} / ${S.mR} = ${fmt(F3() / S.mR, 1)} м/с²`, 'sum') + `</div>`;
    if (sp) h += `<h3>Последний опыт</h3><div class="steps">` + step('сила в начале', `${fmt(sp.F, 1)} Н на каждую`) + step('v левой', `${fmt(Math.abs(sp.vL), 2)} м/с`) + step('v правой', `${fmt(sp.vR, 2)} м/с`) +
      step('m · v левой', `${sp.mL} × ${fmt(Math.abs(sp.vL), 2)} = ${fmt(sp.mL * Math.abs(sp.vL), 2)}`) + step('m · v правой', `${sp.mR} × ${fmt(sp.vR, 2)} = ${fmt(sp.mR * sp.vR, 2)}`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Силы действовали одинаковое время и были равны, поэтому произведения m · v получились одинаковыми.</p>`;
    return h;
  }
  if (id === 'gravity') {
    const r = S.r4 * RE;
    return `<h2>Закон всемирного тяготения</h2><div class="formula">F = G · m · M / r²</div><p class="note">G = 6,67·10⁻¹¹ Н·м²/кг², M = 5,97·10²⁴ кг (Земля), R = 6371 км.</p>
      <h3>Сейчас</h3><div class="steps">` + step('r', `${fmt(S.r4, 1)} × 6371 км = ${sci(r)} м`) + step('r²', `${sci(r * r)} м²`) +
      step('F', `6,67·10⁻¹¹ × ${S.mc} × 5,97·10²⁴ / ${sci(r * r)}`) + step('', `= ${fF(m.F)}`, 'sum') +
      step('g = G·M / r²', `${fmt(m.g, 2)} м/с²`) + `</div>
      <h3>Сравнение с поверхностью</h3><div class="steps">` + step('r / R', fmt(S.r4, 1)) + step('F / F₀ = (R / r)²', `1 / ${fmt(S.r4, 1)}² = ${fmt(1 / S.r4 ** 2, 3)}`, 'sum') + `</div>
      <p class="note" style="margin-top:10px">Расстояние больше в n раз — сила меньше в n² раз.</p>`;
  }
  const a = S.v5 * S.v5 / S.r5;
  return `<h2>Движение по окружности</h2><div class="formula">a = v² / r</div><div class="formula">F = m · v² / r</div>
    <h3>Сейчас</h3><div class="steps">` + step('v', `${nf(S.v5)} м/с`) + step('r', `${nf(S.r5)} м`) + step('a', `${nf(S.v5)}² / ${nf(S.r5)} = ${fmt(a, 1)} м/с²`) +
    step('F нити', `0,2 × ${fmt(a, 1)} = ${fmt(F5(), 2)} Н`, 'sum') + step('период T = 2πr / v', `${fmt(2 * Math.PI * S.r5 / S.v5, 2)} с`) + `</div>
    <h3>К заданию</h3><div class="steps">` + step('условие', 'F ≤ 5 Н, r = 1 м, m = 0,2 кг') + step('из F = m·v²/r', 'v² = F · r / m') +
    step('наибольшая v', S.spunMax ? '√(5 · 1 / 0,2) = √25 = 5 м/с' : '√(5 · 1 / 0,2) = ?', 'sum') + `</div>
    <p class="note" style="margin-top:10px">Скорость больше в 2 раза — сила нужна в 4 раза больше.</p>`;
}

  else if (id === 'second') el.innerHTML = `<div class="k">Тележка</div><div class="v ${S.ok1 && S.ok2 ? 'ok' : ''}">a = ${fmt(m.a, 2)} м/с²</div><div class="lr"><span>F</span><span>${nf(S.F)} Н</span></div><div class="lr"><span>m</span><span>${nf(S.m2)} кг</span></div>`;
  else if (id === 'third') el.innerHTML = `<div class="k">Датчики силы</div><div class="v ${S.ans3 ? 'ok' : ''}">${fmt(S.sep ? S.sep.F : F3(), 1)} Н</div><div class="lr"><span>v лев.</span><span>${S.sep ? fmt(Math.abs(S.sep.vL), 2) : '—'}</span></div><div class="lr"><span>v прав.</span><span>${S.sep ? fmt(S.sep.vR, 2) : '—'}</span></div>`;

  else el.innerHTML = `<div class="k">Нить</div><div class="v ${S.broke ? '' : 'ok'}">${S.broke ? 'порвана' : fmt(m.F, 2) + ' Н'}</div><div class="lr"><span>v</span><span>${nf(S.v5)} м/с</span></div><div class="lr"><span>r</span><span>${nf(S.r5)} м</span></div>`;
}

function update() {
  const m = model(), Ls = L();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Три закона Ньютона — в ваших руках!'), 1600);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  S.lesson = i; drag = null;
  resetState(); save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = L().task;
  $('#hint').textContent = L().stage;
  renderTools(); renderStrip(); buildScheme(); update();
  // centre the active card by scrolling only the strip (never the page)
  const strip = $('#lessons'), cur = strip.querySelector('.lesson[aria-current="true"]');
  if (cur) { const br = strip.getBoundingClientRect(), cr = cur.getBoundingClientRect(); strip.scrollLeft = Math.max(0, strip.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2); }
}

window.LUCH_CONTEXT = () => {

  if (id === 'inertia') now = `Шайба на поверхности «${surf().name}» (μ = ${fmt(surf().mu, 2)}), запускается пусковой пружиной. Скорость сейчас ${fmt(S.v, 2)} м/с, пройдено ${fmt(S.x, 1)} м. На графике v(t) видно, как меняется скорость. Езда на воздушной подушке без изменения скорости ${S.airRun ? 'получена (3 с)' : `ещё не получена (${fmt(Math.min(S.tRun, 3), 1)} из 3 с)`}. Вопрос «какая сила нужна, чтобы шайба ехала дальше с той же скоростью» ${S.ans ? 'решён верно' : 'не решён'}. Ответ не называй — наводи: что показывает график на подушке, какие силы там есть.`;
  if (id === 'second') now = `Тележка массой ${nf(S.m2)} кг на рельсах без трения, лебёдка тянет её с силой ${nf(S.F)} Н. Расчётное ускорение ${fmt(m.a, 2)} м/с². Заезды на 1 м: ${S.runs.map(r => `${nf(r.m)} кг, ${nf(r.F)} Н → t = ${fmt(r.t, 2)} с, a = ${fmt(r.a, 2)} м/с²`).join('; ') || 'нет'}. Цель: a = 1,5 м/с² при m = 2 кг (${S.ok1 ? 'сделано' : 'не сделано'}) и при m = 3 кг (${S.ok2 ? 'сделано' : 'не сделано'}). Нужные силы не называй — наводи к F = m · a.`;
  if (id === 'third') now = `Две тележки на рельсах: левая ${S.mL} кг с пружиной (k = 500 Н/м), правая ${S.mR} кг. На каждой датчик силы. Сейчас сжатие ${fmt(comp3() * 100, 1)} см, сила ${fmt(F3(), 1)} Н. ${S.sep ? `Последний опыт: оба датчика показали ${fmt(S.sep.F, 1)} Н, скорости после толчка ${fmt(Math.abs(S.sep.vL), 2)} м/с (левая, ${S.sep.mL} кг) и ${fmt(S.sep.vR, 2)} м/с (правая, ${S.sep.mR} кг).` : 'Опыта ещё не было.'} Опыт с разными массами ${S.runDiff ? 'сделан' : 'не сделан'}, вывод о силах ${S.ans3 ? 'сделан верно' : 'не сделан'}. Ответ не называй — наводи сравнить датчики и объяснить, почему скорости разные.`;
  if (id === 'gravity') now = `Корабль массой ${S.mc} кг на расстоянии r = ${fmt(S.r4, 1)} R от центра Земли (высота ${fmt((S.r4 - 1) * RE / 1000, 0)} км). Сила притяжения ${fF(m.F)}, g = ${fmt(m.g, 2)} м/с². Замер у поверхности ${S.seen[10] ? 'есть' : 'нет'}, на 2R ${S.seen[20] ? 'есть' : 'нет'}. Вопрос «во сколько раз слабее притяжение на 3R» ${S.ans4 ? 'решён верно' : 'не решён'}. Число не называй — наводи сравнить F на R и 2R и найти связь с квадратом расстояния.`;
  if (id === 'circle') now = `Мяч 0,2 кг на нити длиной ${nf(S.r5)} м вращается со скоростью ${nf(S.v5)} м/с. Центростремительное ускорение ${fmt(m.a, 1)} м/с², натяжение нити ${fmt(m.F, 2)} Н, нить выдерживает 5 Н. Нить ${S.broke ? 'порвана, мяч улетел по касательной' : 'цела'}. Полный оборот на наибольшей допустимой скорости при r = 1 м ${S.spunMax ? 'сделан' : 'не сделан'}; разрыв нити ${S.brokeSeen ? 'наблюдали' : 'ещё не наблюдали'}. Наибольшую скорость не называй — наводи к v² = F·r / m.`;
  return [
    `Раздел: физика, 9 класс, тема «Законы Ньютона» (механика). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'} (${taskState(m)}).`,
    `Сейчас на площадке: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}. Помогай наводящими вопросами, готовые ответы не выдавай.`,
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = L(), done = S.done[Ls.id];
  const q = { inertia: 'Почему пассажиров бросает вперёд, когда автобус тормозит?', second: 'Почему гружёная машина разгоняется медленнее?', third: 'Если силы равны, почему они не уравновешивают друг друга?', gravity: 'Почему мы не чувствуем, как притягиваемся друг к другу?', circle: 'Почему мяч летит по касательной, а не от центра?' }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
