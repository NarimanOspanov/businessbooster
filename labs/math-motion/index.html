<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 5–6 класс: скорость, время и расстояние, движение навстречу и вдогонку, движение по реке, средняя скорость на участках пути.">
<title>Задачи на движение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:10px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--liq);transition:width .2s}
.gauge i{position:absolute;top:-4px;width:2px;height:14px;background:var(--force);transform:translateX(-50%)}
.swatch{height:12px;border-radius:4px;margin-top:9px;border:1px solid rgba(255,255,255,.15)}
.meter svg{display:block;width:100%;height:auto;margin-top:8px}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:24%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.safe{border:1px solid rgba(255,138,115,.38);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin:0 0 12px}
.safe b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghostbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.ghostbtn:hover{border-color:var(--muted)}

.diag{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.diag text{font-family:var(--font-mono)}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 13px/1 var(--font-body);cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.formula{font:500 18px/1.3 var(--font-mono);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted)}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 130px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.probs{display:grid;gap:10px}
.prob{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px}
.prob.ok{border-color:var(--ok)}
.prob .lv{font:600 10.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--force);margin-bottom:7px}
.prob.ok .lv{color:var(--ok)}
.prob p{margin:0 0 9px;font-size:14px;line-height:1.5}
.ansrow{display:flex;gap:6px;align-items:center}
.ansrow input{flex:1;min-width:0;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--fg);font:500 16px var(--font-mono)}
.ansrow .u{font-size:13px;color:var(--muted);white-space:nowrap}
.ansrow button{min-height:42px}
.prob .fb{margin-top:8px;font-size:13.5px;line-height:1.45}
.prob .fb.bad{color:var(--warn)}
.prob .fb.good{color:var(--ok)}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Движение</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: дорога, река и машины. Ползунки скорости и времени можно тянуть."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const eq = (a, b) => Math.abs(a - b) < 1e-9;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d';
const BLUE = '#5fb4d9', ORANGE = '#ffb547', RED = '#ff8a73', GREEN = '#86e0a8', MUTED = '#8b96ad', FG = '#e8ecf4', DIM = '#5d6880';
// hours → «4 ч 30 мин»; minutes of the day → «11:00»
const fmtH = h => { const mm = Math.round(h * 60), H = Math.floor(mm / 60), M = mm % 60; return H && M ? `${H} ч ${M} мин` : H ? `${H} ч` : `${M} мин`; };
const clock = min => { const m = ((Math.round(min) % 1440) + 1440) % 1440; return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };

// ---------- lesson data ----------
// 1: Aktobe → city 240 km (80 km/h · 3 h); task: 60 km/h → 4 h
const CITY = 240, KM1 = 320, DEP1 = 8 * 60;
// 2: three scenarios, the first is the task
const SCN = [
  { id: 'chase', name: 'Вдогонку', title: 'Из Астаны в одну сторону', sub: 'автобус в 8:00, 60 км/ч · автомобиль в 9:00, 90 км/ч',
    km: [0, 300], tick: 60, start: 8 * 60, tmMax: 300, step: 10, ans: 180, what: 'сближения', origin: 'Астана',
    A: { name: 'автобус', v: 60, x0: 0, dir: 1, t0: 0, kind: 'bus', col: ORANGE }, B: { name: 'автомобиль', v: 90, x0: 0, dir: 1, t0: 60, kind: 'car', col: BLUE },
    chips: [150, 30, 90], good: 1,
    why: ['150 = 60 + 90 — так сближаются, только когда едут навстречу. А тут оба едут в одну сторону.', '', '90 км/ч — скорость самого автомобиля. Но автобус тоже не стоит: за час он уезжает на 60 км.'] },

const KEY = 'luch-math-motion';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, cs: saved.cs || {}, tab: 'overview', hl: null, anim: null,
            v1: 80, t1: 3, p1: 0, ran1: null,
            sc: 0, close: null, tm: 0,
            u: 1, v3: 18, t3: 0,
            w: 50, a1: 60, a2: 40, tau: 0, ran4: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done, cs: S.cs })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID();
  if (id === 'svt') {
    const s = S.v1 * S.t1, now = s * S.p1;
    return { kind: id, v: S.v1, t: S.t1, s, now, p: S.p1, ran: S.ran1, arr: DEP1 + S.t1 * 60, miss: s - CITY };
  }
  if (id === 'meet') {
    const sc = SCN[S.sc], a = posOf(sc.A, S.tm), b = posOf(sc.B, S.tm);
    return { kind: id, sc: S.sc, SC: sc, tm: S.tm, a, b, gap: Math.abs(a - b), close: S.close, closeOk: S.close === sc.good, hit: S.tm === sc.ans };
  }
  if (id === 'river') {
    const v = S.v3, u = S.u, t = S.t3, dn = (v + u) * t, up = Math.max(0, v - u) * t;
    return { kind: id, v, u, t, vd: v + u, vu: v - u, dn, up, raft: u * t, dd: dn - up };
  }
  const T1 = D4 / S.a1, T2 = D4 / S.a2, TR = T1 + T2, TG = 2 * D4 / S.w, vavg = 2 * D4 / TR;
  const tau = S.tau;
  const real = tau < T1 ? { d: S.a1 * tau, back: false } : tau < TR ? { d: D4 - S.a2 * (tau - T1), back: true } : { d: 0, back: true, home: true };
  const gd = Math.min(S.w * tau, 2 * D4), ghost = gd < D4 ? { d: gd, back: false } : { d: 2 * D4 - gd, back: true, home: gd >= 2 * D4 };
  return { kind: 'avg', w: S.w, v1: S.a1, v2: S.a2, T1, T2, TR, TG, vavg, tau, real, ghost, ran: S.ran4 };
}

  let key = null; const el = e.target.closest('[data-sl]');
  if (el) key = el.dataset.sl;
  else for (const k in SL) { const s = SL[k]; if (Math.abs(p.y - s.y) < 22 && p.x > s.x0 - 18 && p.x < s.x1 + 18) { key = k; break; } }
  if (!key) return;
  e.preventDefault(); try { scene.setPointerCapture(e.pointerId); } catch (er) {} scene.classList.add('grabbing');
  drag = { key }; slAt(key, p.x);
});
scene.addEventListener('pointermove', e => { if (!drag) return; slAt(drag.key, toSvg(e).x); });
const endDrag = () => { if (!drag) return; drag = null; scene.classList.remove('grabbing'); dirty = true; };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

function loop(t) {
  requestAnimationFrame(loop);
  const an = stepAnim(t);
  if (dirty || S.hl || an || (LID() === 'river' && !reduce && S.u > 0)) { drawScene(t); dirty = false; }
}

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  if (Ls.id === 'svt') return `v = ${m.v} км/ч · t = ${fmtH(m.t)} · s = ${num(m.s)} км`;
  if (Ls.id === 'meet') return S.sc !== 0 ? `Тренировка «${m.SC.name}» · задание — «Вдогонку»` : `Сближение: ${m.close === null ? 'не выбрано' : m.SC.chips[m.close] + ' км/ч'} · часы ${clock(m.SC.start + m.tm)} · между ними ${num(m.gap)} км`;

// ---------- Scheme tab ----------
function rng(id, label, min, max, stepv, val) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}O"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}" value="${val}"></div>`;

const reads = (a, b, c) => `<dl class="reads"><div><dt>${a}</dt><dd id="r1"></dd></div><div><dt>${b}</dt><dd id="r2"></dd></div><div><dt>${c}</dt><dd id="r3"></dd></div></dl>`;
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  let h = '';
  if (id === 'svt') h = `<h2>Поездка</h2>` + reads('Путь s', 'Скорость v', 'Время t') + rng('inV1', 'Скорость v, км/ч', 10, 120, 10, S.v1) + rng('inT1', 'Время в пути t', 0.5, 8, 0.5, S.t1) +
    `<div class="row"><button class="ghostbtn" data-a="play">▶ Поехали</button></div><p class="note" style="margin-top:10px">До города 240 км — но на схеме это не подписано: найдите путь сами по условию «80 км/ч, 3 ч».</p><div id="sDiag"></div>`;
  if (id === 'meet') h = `<h2>Двое на дороге</h2><div class="chips" id="scChips">${SCN.map((s, i) => `<button data-s="${i}" aria-pressed="${S.sc === i}">${s.name}</button>`).join('')}</div>

    reads('Между ними', 'Время', 'Сближение') + rng('inTm', SCN[S.sc].start !== null ? 'Часы' : 'Прошло времени', 0, SCN[S.sc].tmMax, SCN[S.sc].step, S.tm) +

  if (id === 'avg') h = `<h2>Туда и обратно</h2>` + reads('Машина', 'Ровная', 'Путь') + rng('inW', 'Скорость ровной машины, км/ч', 30, 70, 1, S.w) +
    `<h3>Для тренировки</h3>` + rng('inA1', 'Машина туда, км/ч', 20, 90, 10, S.a1) + rng('inA2', 'Машина обратно, км/ч', 20, 90, 10, S.a2) +
    `<div class="row"><button class="ghostbtn" data-a="play">▶ Поехали</button><button class="ghostbtn" data-a="reset4">Сброс</button></div><p class="note" style="margin-top:10px">Задание — при 60 и 40 км/ч. Другие скорости — чтобы проверить себя: попробуйте 30 и 90.</p><div id="sDiag"></div>`;

function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; }, val = (s, v) => { const x = el.querySelector(s); if (x && document.activeElement !== x) x.value = v; };
  if (!el.querySelector('#sDiag')) return;
  if (m.kind === 'svt') { set('#r1', num(m.s) + ' км'); set('#r2', m.v + ' км/ч'); set('#r3', fmtH(m.t)); set('#inV1O', m.v + ' км/ч'); set('#inT1O', fmtH(m.t)); val('#inV1', m.v); val('#inT1', m.t); }
  else if (m.kind === 'meet') { set('#r1', num(m.gap) + ' км'); set('#r2', m.SC.start !== null ? clock(m.SC.start + m.tm) : fmtH(m.tm / 60)); set('#r3', m.close === null ? '—' : m.SC.chips[m.close] + ' км/ч'); set('#inTmO', m.SC.start !== null ? clock(m.SC.start + m.tm) : fmtH(m.tm / 60)); val('#inTm', m.tm); }
  else if (m.kind === 'river') { set('#r1', num(m.vd) + ' км/ч'); set('#r2', num(m.vu) + ' км/ч'); set('#r3', num(m.dd) + ' км'); set('#inUO', num(m.u) + ' км/ч'); set('#inV3O', m.v + ' км/ч'); set('#inT3O', fmtH(m.t)); val('#inU', m.u); val('#inV3', m.v); val('#inT3', m.t); }
  else { set('#r1', num(m.TR) + ' ч'); set('#r2', num(m.TG) + ' ч'); set('#r3', 2 * D4 + ' км'); set('#inWO', m.w + ' км/ч'); set('#inA1O', m.v1 + ' км/ч'); set('#inA2O', m.v2 + ' км/ч'); val('#inW', m.w); val('#inA1', m.v1); val('#inA2', m.v2); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];

    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;

// ---------- «Расчёты»: live computation + ЕНТ-style problems ----------
function calcLive(m) {
  const id = LID();
  if (id === 'svt') return `<h2>Путь, скорость, время</h2><div class="formula">s = v · t</div><div class="steps">` +
    step('путь до города', '80 · 3 = ? км') + step('сейчас: путь', `${m.v} · ${num(m.t)} = ${num(m.s)} км`) + step('скорость v = s : t', `${num(m.s)} : ${num(m.t)} = ${m.v} км/ч`) +
    step('время t = s : v', `${num(m.s)} : ${m.v} = ${num(m.t)} ч`) + step('прибытие', `${clock(DEP1)} + ${fmtH(m.t)} = ${clock(m.arr)}`, 'sum') + `</div>`;
  if (id === 'meet') {
    const sc = m.SC; let h = `<h2>${sc.name}</h2><div class="formula">${sc.id === 'chase' ? 't = d : (v₂ − v₁)' : sc.id === 'meet' ? 't = s : (v₁ + v₂)' : 's = (v₁ + v₂) · t'}</div><div class="steps">`;
    if (sc.id === 'chase') h += step('отрыв к 9:00, d', '60 · 1 = ? км') + step('скорость сближения', m.closeOk ? '90 − 60 = 30 км/ч' : 'выберите на схеме') + step('погоня', m.closeOk ? 'd : 30 = ? ч' : '—') + step('сейчас', `${clock(sc.start + m.tm)}, между ними ${num(m.gap)} км`, 'sum');
    else if (sc.id === 'meet') h += step('расстояние', '24 км') + step('скорость сближения', m.closeOk ? '15 + 5 = 20 км/ч' : 'выберите на схеме') + step('сейчас', `через ${fmtH(m.tm / 60) || '0 мин'} между ними ${num(m.gap)} км`, 'sum');
    else h += step('скорость удаления', m.closeOk ? '12 + 16 = 28 км/ч' : 'выберите на схеме') + step('сейчас', `через ${fmtH(m.tm / 60) || '0 мин'} между ними ${num(m.gap)} км`, 'sum');
    return h + `</div>`;
  }
  if (id === 'river') return `<h2>Скорости на реке</h2><div class="formula">vпо = v + u · vпр = v − u</div><div class="steps">` +
    step('по течению', `${m.v} + ${num(m.u)} = ${num(m.vd)} км/ч`) + step('против течения', `${m.v} − ${num(m.u)} = ${num(m.vu)} км/ч`) + step('разность', `${num(m.vd)} − ${num(m.vu)} = ${num(m.vd - m.vu)} = 2 · ${num(m.u)}`) +
    step('собственная', `(${num(m.vd)} + ${num(m.vu)}) : 2 = ${m.v} км/ч`) + step(`пути за ${fmtH(m.t) || '0 ч'}`, `${num(m.dn)} и ${num(m.up)} км`, 'sum') + `</div>`;
  return `<h2>Средняя скорость</h2><div class="formula">vср = весь путь : всё время</div><div class="steps">` +
    step('туда', `${D4} : ${m.v1} = ${num(m.T1)} ч`) + step('обратно', `${D4} : ${m.v2} = ${num(m.T2)} ч`) + step('всё время', `${num(m.T1)} + ${num(m.T2)} = ${num(m.TR)} ч`) +
    step('весь путь', `${D4} · 2 = ${2 * D4} км`) + step('среднее арифметическое', `(${m.v1} + ${m.v2}) : 2 = ${num((m.v1 + m.v2) / 2)} — не то!`) +
    step('ровная машина', `${2 * D4} : ${m.w} = ${num(m.TG)} ч`, 'sum') + `</div>`;
}
const parseAns = s => { const t = String(s).trim().replace(/\s+/g, '').replace(',', '.').replace(/[^\d.\-−:]/g, '').replace('−', '-'); return t; };
function buildCalc() {
  const id = LID(), el = $('#pane-calc'), list = PROBS[id];
  el.dataset.l = id;
  el.innerHTML = `<div id="calcLive"></div><h3>Задачи как на ЕНТ</h3><div class="probs">` + list.map((p, i) => {
    const ok = !!S.cs[id + i];
    return `<div class="prob${ok ? ' ok' : ''}" data-i="${i}"><div class="lv">Задача ${i + 1}${ok ? ' · решена ✓' : ''}</div><p>${p.q}</p>
      <div class="ansrow"><input type="text" inputmode="${p.clock ? 'text' : 'decimal'}" autocomplete="off" aria-label="Ответ к задаче ${i + 1}" placeholder="${p.clock ? 'чч:мм' : 'ответ'}"><span class="u">${p.u}</span><button class="ghostbtn" type="button">Проверить</button></div>
      <div class="fb ${ok ? 'good' : ''}">${ok ? 'Верно. ' + p.fact : ''}</div></div>`;
  }).join('') + `</div><p class="note" style="margin-top:10px">Дробный ответ пишите через запятую, например 9,5.</p>`;
  el.querySelectorAll('.prob').forEach(box => {
    const i = +box.dataset.i, p = list[i], inp = box.querySelector('input'), fb = box.querySelector('.fb');
    const check = () => {
      const s = parseAns(inp.value);
      if (!s) { fb.className = 'fb bad'; fb.textContent = 'Введите ответ.'; return; }
      let ok = false;
      if (p.clock !== undefined) { const mm = s.replace('.', ':').match(/^(\d{1,2}):(\d{2})$/); ok = !!mm && (+mm[1] * 60 + +mm[2]) % 1440 === p.clock; if (!mm) { fb.className = 'fb bad'; fb.textContent = 'Запишите время как чч:мм, например 14:05.'; return; } }
      else { const v = parseFloat(s); if (!isFinite(v)) { fb.className = 'fb bad'; fb.textContent = 'Нужно число.'; return; } ok = Math.abs(v - p.ans) < 1e-6; }
      if (ok) { S.cs[id + i] = true; save(); box.classList.add('ok'); box.querySelector('.lv').textContent = `Задача ${i + 1} · решена ✓`; fb.className = 'fb good'; fb.textContent = 'Верно. ' + p.fact; }
      else { fb.className = 'fb bad'; fb.textContent = 'Пока не так. ' + p.hint; }
    };
    box.querySelector('button').onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  });
}

function renderMeter(m) {
  const id = LID(), el = $('#meter'), ok = !!S.done[id];
  if (id === 'svt') el.innerHTML = `<div class="k">Путь s = v·t</div><div class="v ${ok ? 'ok' : ''}">${num(m.s)} км</div><div class="lr"><span>v</span><span>${m.v} км/ч</span></div><div class="lr"><span>t</span><span>${num(m.t)} ч</span></div><div class="gauge"><b style="width:${clamp(m.now / KM1 * 100, 0, 100).toFixed(1)}%"></b><i style="left:${(CITY / KM1 * 100).toFixed(1)}%"></i></div>`;
  else if (id === 'meet') el.innerHTML = `<div class="k">Между ними</div><div class="v ${ok ? 'ok' : ''}">${num(m.gap)} км</div><div class="lr"><span>${m.SC.start !== null ? 'часы' : 'время'}</span><span>${m.SC.start !== null ? clock(m.SC.start + m.tm) : (fmtH(m.tm / 60) || '0')}</span></div><div class="lr"><span>${m.SC.what === 'сближения' ? 'сближ.' : 'удал.'}</span><span>${m.close === null ? '—' : m.SC.chips[m.close]}</span></div>`;
  else if (id === 'river') el.innerHTML = `<div class="k">Разница путей</div><div class="v ${ok ? 'ok' : ''}">${num(m.dd)} км</div><div class="lr"><span>по теч.</span><span>${num(m.vd)}</span></div><div class="lr"><span>против</span><span>${num(m.vu)}</span></div>`;
  else el.innerHTML = `<div class="k">Время в пути</div><div class="v ${ok ? 'ok' : ''}">${num(m.TR)} ч</div><div class="lr"><span>ровная</span><span>${num(m.TG)} ч</span></div><div class="lr"><span>v ровной</span><span>${m.w}</span></div>`;
}

// light refresh during animation (no pane rebuild)
function light() { const m = model(); renderMeter(m); $('#taskState').textContent = taskState(m); dirty = true; }
function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Задачи на движение вам по плечу!'), 900);
  }
  // training scenarios of lesson 2: praise without marking the task
  if (Ls.id === 'meet' && S.sc !== 0 && m.closeOk && m.tm === m.SC.ans) {
    const k = 'tr' + S.sc; if (trainMsg !== k) { trainMsg = k; toast(S.sc === 1 ? 'Верно: встретились через 1 ч 12 мин. Это тренировка — задание во «Вдогонку».' : 'Верно: через 2 ч 30 мин между ними 70 км. Это тренировка — задание во «Вдогонку».'); }
  } else if (Ls.id === 'meet') trainMsg = '';
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  svt: '<rect x="2" y="17" width="62" height="8" fill="#252e40"/><path d="M4 21h58" stroke="#6b7690" stroke-dasharray="4 3"/><path d="M8 17v-4q0-2 2-2h3l2-3h6l3 3h2q1 0 1 2v4z" fill="#5fb4d9"/><path d="M50 17v-9h5v-4h5v13z" fill="#33405c"/>',
  meet: '<rect x="2" y="17" width="62" height="8" fill="#252e40"/><rect x="10" y="9" width="16" height="8" rx="2" fill="#ffb547"/><path d="M36 17v-4q0-2 2-2h3l2-3h6l3 3h2q1 0 1 2v4z" fill="#5fb4d9"/><path d="M26 5h10" stroke="#e8ecf4" stroke-width="1"/>',
  river: '<rect x="0" y="6" width="66" height="20" fill="#1d4a66"/><path d="M6 10h10m-3-2l3 2-3 2M40 22h10m-3-2l3 2-3 2" fill="none" stroke="#a8d4ec"/><path d="M22 18h20l-4 5H26z" fill="#86e0a8"/>',
  avg: '<rect x="4" y="5" width="22" height="7" fill="#ffb547"/><rect x="26" y="5" width="33" height="7" fill="#c98a2a"/><rect x="4" y="17" width="53" height="7" fill="#5fb4d9"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.anim = null;
  S.v1 = 80; S.t1 = 3; S.p1 = 0; S.ran1 = null;
  S.sc = 0; S.close = null; S.tm = 0; trainMsg = '';
  S.u = 1; S.v3 = 18; S.t3 = 0;
  S.w = 50; S.a1 = 60; S.a2 = 40; S.tau = 0; S.ran4 = null;
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const cur = $('#lessons .lesson[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let scheme = '', now = '';
  if (id === 'svt') {
    scheme = 'Дорога со шкалой от 0 до 320 км (деления через 40 км), слева Актобе, на 240 км — соседний город (число 240 на схеме не подписано, ученик должен найти его сам: 80 км/ч · 3 ч). Синяя машина, пунктиром — место, где она остановится (v · t км от старта). Ползунки: скорость v от 10 до 120 км/ч (шаг 10) и время в пути t от 0,5 до 8 ч (шаг 0,5). Кнопка «Поехали» запускает машину; после поездки видно, доехала ли она ровно до города, не доехала или проехала. Внизу формула s = v · t и время прибытия при выезде в 8:00.';
    now = `v = ${m.v} км/ч, t = ${num(m.t)} ч, s = ${num(m.s)} км; ${m.ran ? `последняя поездка: ${m.ran.v} км/ч, ${num(m.ran.t)} ч — ${m.ran.v * m.ran.t === CITY ? 'ровно до города' : m.ran.v * m.ran.t < CITY ? 'не доехала' : 'проехала город'}` : 'машина ещё не ездила с этими значениями'}.`;
  } else if (id === 'meet') {
    scheme = 'Дорога со шкалой в километрах и два участника движения. Три сценария (кнопки): «Вдогонку» — задание: автобус из Астаны в 8:00, 60 км/ч, автомобиль следом в 9:00, 90 км/ч (до 9:00 автомобиль стоит в Астане); «Навстречу» — тренировка: велосипедист 15 км/ч и пешеход 5 км/ч из сёл в 24 км друг от друга; «В разные стороны» — тренировка: два велосипедиста 12 и 16 км/ч из одного пункта. Над дорогой скобка и число «между ними N км». Три кнопки-варианта «скорость сближения/удаления» (для вдогонку: 150, 30, 90 км/ч). Ползунок «часы» двигает время (для вдогонку от 8:00 до 13:00 с шагом 10 мин).';
    now = `сценарий «${m.SC.name}»; выбранная скорость ${m.SC.what}: ${m.close === null ? 'не выбрана' : m.SC.chips[m.close] + ' км/ч (' + (m.closeOk ? 'верно' : 'неверно') + ')'}; время: ${m.SC.start !== null ? clock(m.SC.start + m.tm) : fmtH(m.tm / 60) || '0 мин'}; ${m.SC.A.name} в ${num(Math.abs(m.a))} км от старта, ${m.SC.B.name} — ${num(Math.abs(m.b - m.SC.B.x0))} км от своего старта, между ними ${num(m.gap)} км.`;
  } else if (id === 'river') {
    scheme = 'Река течёт слева направо (стрелки течения), посередине пристань. От неё одновременно отплывают зелёный катер по течению (вправо), оранжевый катер против течения (влево) и плот без мотора (плывёт со скоростью течения). Сверху записаны скорости: по течению v + u и против течения v − u. Ползунки: скорость течения u от 0 до 6 км/ч (шаг 0,5), собственная скорость катера v от 10 до 24 км/ч и часы от 0 до 3 ч (шаг 15 мин); кнопка «1 час» пускает часы с нуля до 1 ч. Под рекой — на сколько километров катер по течению ушёл дальше, чем катер против течения.';
    now = `u = ${num(m.u)} км/ч, v = ${m.v} км/ч, по течению ${num(m.vd)} км/ч, против ${num(m.vu)} км/ч; часы ${fmtH(m.t) || '0'}; пути ${num(m.dn)} и ${num(m.up)} км, разница ${num(m.dd)} км.`;
  } else {
    scheme = 'Две дороги из Костаная (A) в соседний город (B, 120 км). На верхней — оранжевая машина: туда 60 км/ч, обратно 40 км/ч. На нижней — синяя «ровная» машина, которая и туда, и обратно едет с одной скоростью (ползунок от 30 до 70 км/ч, шаг 1). Ниже полосы времени: у оранжевой — время туда и время обратно, у синей — 240 : v. «Поехали» запускает обе машины, после финиша видно, кто вернулся раньше. Во вкладке «Опыт» можно для тренировки менять скорости оранжевой машины.';
    now = `оранжевая: туда ${m.v1}, обратно ${m.v2} км/ч, всего ${num(m.TR)} ч; ровная ${m.w} км/ч, ${num(m.TG)} ч; ${m.ran ? 'поездка завершена' : 'поездку ещё не запускали с этими значениями'}.`;
  }
  return [
    `Раздел: математика, 5–6 класс, тема «Задачи на движение» (подготовка к ЕНТ). Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `На схеме: ${scheme}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Во вкладке «Расчёты» — задачи как на ЕНТ: ${PROBS[id].map((p, i) => `${i + 1}) ${p.q}${S.cs[id + i] ? ' (решена)' : ''}`).join(' ')}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Для тьютора: не называй ответ задания и задач (время в пути, момент встречи, скорость течения, среднюю скорость): веди ученика наводящими вопросами — что известно, какая формула связывает величины, в каких единицах — и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    svt: 'Как перевести м/с в км/ч?', meet: 'Когда скорости складывать, а когда вычитать?',
    river: 'Почему плот плывёт со скоростью течения?', avg: 'Почему средняя скорость не равна (60 + 40) : 2?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
<script src="/luch/tutor.js" defer></script>
