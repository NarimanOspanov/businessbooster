<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 11 класс (профильный уровень): мнимая единица и комплексная плоскость, действия с комплексными числами, модуль и аргумент, умножение как поворот, комплексные корни квадратного уравнения, формула Муавра и корни из единицы.">
<title>Комплексные числа</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as the other math labs. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene [data-drag]{cursor:grab}
.scene.grabbing,.scene.grabbing [data-drag]{cursor:grabbing}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(100vw + 380px);min-height:0}   /* the task card is tall on phones: the plane goes under it */
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/luch/splash.js"></script>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9.6 14.6 9.2 6.2 15 10.6Q20 9.4 25 10.6L30.8 6.2 30.4 14.6Q34.6 22 31.6 29Q27.6 36 20 36Q12.4 36 8.4 29Q5.4 22 9.6 14.6Z" fill="#ffb547"/><path d="M20 14Q15.2 10.8 10.9 13.4Q7.6 17.2 9.4 21.8Q11.6 25.8 15.9 25.4Q18.5 25.1 20 27.1Q21.5 25.1 24.1 25.4Q28.4 25.8 30.6 21.8Q32.4 17.2 29.1 13.4Q24.8 10.8 20 14Z" fill="#ffd896"/><circle cx="15" cy="18.8" r="5" fill="#fffaf0"/><circle cx="25" cy="18.8" r="5" fill="#fffaf0"/><circle cx="15.6" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="24.4" cy="19.2" r="2.9" fill="#0b1019"/><circle cx="16.6" cy="18.1" r="1" fill="#fff"/><circle cx="25.4" cy="18.1" r="1" fill="#fff"/><path d="M18.6 23.4h2.8L20 26.6z" fill="#ff8a73"/><path d="M10.5 29.6Q15.3 27.4 20 29.7Q24.7 27.4 29.5 29.6V34.6Q24.7 32.6 20 34.8Q15.3 32.6 10.5 34.6Z" fill="#72d4e8"/><path d="M20 29.7V34.8" stroke="#0b1019" stroke-width="1.1"/><path d="M8.2 23.5Q5.6 28.6 9.4 32.6Q11.6 33.2 12.4 31Q10.4 28.4 8.2 23.5Z" fill="#e8962a"/><path d="M31.8 23.5Q34.4 28.6 30.6 32.6Q28.4 33.2 27.6 31Q29.6 28.4 31.8 23.5Z" fill="#e8962a"/><path d="M35 3.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#86e0a8"/></svg>
      <div><h1>OPEN SCHOOL AI</h1><small>Доступное образование для всех</small></div>
    </div>
    <div class="headr">
      <div class="prog" aria-label="Прогресс"><b>Комплексные</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: комплексная плоскость с действительной и мнимой осями. Точки-числа можно перетаскивать, результат действий строится сразу."></svg>
    <div class="task" id="taskCard" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (x, n = 1) => {
  if (!isFinite(x)) return '∞';
  let s = (Math.round(x * 10 ** n) / 10 ** n).toFixed(n);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
};
const trim = (x, n = 3) => fmt(x, n).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') || '0';
const num = v => trim(v, 2);
const pn = v => v < 0 ? `(${num(v)})` : num(v);
const deg = a => `${num(a)}°`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CA_ = '#72d4e8', CB_ = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', RD = '#ff8a73';
const SUP = n => String(n).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join('');

// ---------- complex numbers: [re, im] ----------
const r2 = v => { const x = Math.round(v * 100) / 100; return Math.abs(x) < 0.005 ? 0 : x; };
const cadd = (p, q) => [p[0] + q[0], p[1] + q[1]];
const csub = (p, q) => [p[0] - q[0], p[1] - q[1]];
const cmul = (p, q) => [p[0] * q[0] - p[1] * q[1], p[0] * q[1] + p[1] * q[0]];
const cconj = p => [p[0], -p[1]];
const cabs = p => Math.hypot(p[0], p[1]);
const cdiv = (p, q) => { const d = q[0] * q[0] + q[1] * q[1]; return [(p[0] * q[0] + p[1] * q[1]) / d, (p[1] * q[0] - p[0] * q[1]) / d]; };
const normA = a => { a = ((a % 360) + 360) % 360; if (a > 180 + 1e-9) a -= 360; return Math.abs(a) < 1e-9 ? 0 : a; };
const carg = p => normA(Math.atan2(p[1], p[0]) * 180 / Math.PI);
const pol = (r, a) => [r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180)];
const cpow = (z, n) => { let w = [1, 0]; for (let k = 0; k < n; k++) w = cmul(w, z); return w; };
const ceq = (p, q, e = 1e-6) => Math.abs(p[0] - q[0]) < e && Math.abs(p[1] - q[1]) < e;
// a + bi written the school way
function cf(p) {
  const a = r2(p[0]), b = r2(p[1]);
  const bi = v => (Math.abs(v) === 1 ? '' : num(Math.abs(v))) + 'i';
  if (!b) return num(a);
  if (!a) return (b < 0 ? '−' : '') + bi(b);
  return `${num(a)} ${b < 0 ? '−' : '+'} ${bi(b)}`;
}
const cfp = p => (r2(p[0]) && r2(p[1])) || r2(p[0]) < 0 || (!r2(p[0]) && r2(p[1]) < 0) ? `(${cf(p)})` : cf(p);   // in brackets when needed
const trig = (r, a) => `${num(r)}(cos ${deg(a)} + i·sin ${deg(a)})`;

// ---------- task data ----------
const A1 = [3, -2], ROOTS1 = [[0, 2], [0, -2]];
const Z2 = [2, 1];
const MODES2 = { add: { t: [-1, 4], sym: '+', name: 'сумма' }, mul: { t: [5, 0], sym: '·', name: 'произведение' }, div: { t: [0, 1], sym: ':', name: 'частное' } };
const Q4 = { b: 2, c: 5 }, ROOTS4 = [[-1, 2], [-1, -2]], N4 = 5;
const f4 = p => cadd(cadd(cmul(p, p), [Q4.b * p[0], Q4.b * p[1]]), [Q4.c, 0]);

const LESSONS = [
  { id: 'imag', title: 'Зачем нужно i',
    text: ['Уравнение x² = −1 не имеет действительных корней: квадрат любого действительного числа неотрицателен. Поэтому вводят новое число i, у которого i² = −1. Его называют мнимой единицей.',
           'Комплексное число — это z = a + bi, где a и b — действительные числа. a = Re z — действительная часть, b = Im z — мнимая часть. Действительные числа — частный случай (b = 0), числа вида bi называют чисто мнимыми.',
           'Каждое комплексное число — точка (a; b) комплексной плоскости: по горизонтальной оси Re откладывают действительную часть, по вертикальной оси Im — мнимую. Теперь у уравнения x² + 9 = 0 есть корни: x² = −9 = 9i², x = ±3i. Проверка: (3i)² = 9i² = −9.'],
    why: 'Инженеры-электрики считают переменный ток в комплексных числах: напряжение и ток в розетке колеблются, а комплексное число хранит сразу и размах колебания, и его сдвиг во времени (у электриков мнимая единица обозначается j, чтобы не путать с током i). В квантовой механике состояние частицы описывается комплексными амплитудами — на этом работают квантовые компьютеры. В ближайшие 10 лет расчёты будет делать ИИ, но инженер-электроэнергетик и квантовый инженер должны понимать, что означает мнимая часть, чтобы проверить результат.',

  { id: 'ops', title: 'Действия с комплексными числами',
    text: ['Складывают по частям: (a + bi) + (c + di) = (a + c) + (b + d)i. На плоскости это сложение векторов по правилу параллелограмма. Вычитание — сложение с противоположным числом.',

           'Сопряжённое к z = a + bi — число z̄ = a − bi, отражение z относительно оси Re. Произведение z · z̄ = a² + b² всегда действительное. Поэтому, чтобы разделить, числитель и знаменатель домножают на число, сопряжённое знаменателю: (a + bi) : (c + di) = (a + bi)(c − di) : (c² + d²).'],

const KEY = 'luch-math-complex';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const lessonIdx0 = () => { const i = LESSONS.findIndex(l => l.id === saved.lesson); return i >= 0 ? i : clamp(saved.lesson | 0, 0, LESSONS.length - 1); };
const S = { lesson: lessonIdx0(), done: saved.done || {}, tab: 'overview', hl: null, hit: {},
            z1: [1, 1], powI: false,
            w2: [1, -1], mode2: 'add',
            z3: { r: 2, a: 30 }, w3: { r: 1.5, a: -120 }, angs: true,
            mode4: 'quad', p1: [-3, 1], p2: [3, -1], n: 5, z4: { r: 0.9, a: 30 } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: LESSONS[S.lesson].id, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

function model() {
  const id = LID(), hit = S.hit;
  if (id === 'imag') {
    const z = S.z1, z2 = cmul(z, z), f = cadd(z2, [4, 0]);
    return { kind: id, z, z2, f, isA: ceq(z, A1), isRoot: ceq(f, [0, 0]), hit };
  }
  if (id === 'ops') {
    const w = S.w2, M = MODES2[S.mode2], zero = !w[0] && !w[1];
    const r = S.mode2 === 'add' ? cadd(Z2, w) : S.mode2 === 'mul' ? cmul(Z2, w) : zero ? null : cdiv(Z2, w);
    return { kind: id, mode: S.mode2, M, z: Z2, w, r, zero, ok: !!r && ceq(r, M.t), hit };
  }
  if (id === 'polar') {
    const z = pol(S.z3.r, S.z3.a), w = pol(S.w3.r, S.w3.a), p = cmul(z, w);
    return { kind: id, zp: S.z3, wp: S.w3, z, w, p, pr: S.z3.r * S.w3.r, sum: S.z3.a + S.w3.a, isRot: S.w3.r === 1 && S.w3.a === 90,
             isNeg: S.z3.r === S.w3.r && ceq(p, [-4, 0]), hit, angs: S.angs };
  }
  if (S.mode4 === 'quad') {
    const f1 = f4(S.p1), f2 = f4(S.p2);
    return { kind: 'quad', p1: S.p1, p2: S.p2, f1, f2, ok1: ceq(f1, [0, 0]), ok2: ceq(f2, [0, 0]), hit };
  }
  const z = pol(S.z4.r, S.z4.a), pw = [];
  for (let k = 0; k <= S.n; k++) pw.push(cpow(z, k));
  const zn = pw[S.n];
  return { kind: 'moivre', zp: S.z4, z, n: S.n, pw, zn, closed: ceq(zn, [1, 0], 1e-6), isMv: S.n === N4 && S.z4.r === 1 && S.z4.a !== 0 && ceq(zn, [1, 0], 1e-6), hit };
}

// ---------- plane (SVG units): 300 × 300 square centred at (260; 200) ----------
const OX = 260, OY = 200, HALF = 150;
function cfg() {
  const id = LID();
  if (id === 'ops') return { G: 6, st: 1, lab: 2 };
  if (id === 'roots' && S.mode4 === 'moivre') return { G: 1.5, st: 0.5, lab: 0.5 };
  return { G: 5, st: 1, lab: 1 };
}
const UU = () => HALF / cfg().G;
const X = x => OX + x * UU(), Y = y => OY - y * UU();
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const Ln = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const LnP = (p, q, col, w = 1, extra = '') => Ln(X(p[0]), Y(p[1]), X(q[0]), Y(q[1]), col, w, extra);
const tag = (x, y, txt, col) => { const w = txt.length * 6.7 + 12; return `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - 12).toFixed(1)}" width="${w.toFixed(1)}" height="18" rx="6" fill="${col}" stroke="${INK}" stroke-width="1.4"/>` + T(x, y + 1, 11, txt, '#0b1019', 'middle', 'font-weight="500"'); };
const inPlane = p => Math.abs(p[0]) <= cfg().G + 1e-9 && Math.abs(p[1]) <= cfg().G + 1e-9;
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern>
    <clipPath id="pl"><rect x="${OX - HALF}" y="${OY - HALF}" width="${2 * HALF}" height="${2 * HALF}"/></clipPath></defs>
    <rect x="-2000" y="-2000" width="4520" height="4520" fill="url(#tile)"/>`;
}
const imLbl = v => Math.abs(v) === 1 ? (v < 0 ? '−i' : 'i') : num(v) + 'i';
function planeSVG(polar = false) {
  const { G, st, lab } = cfg();
  let h = `<rect x="${OX - HALF}" y="${OY - HALF}" width="${2 * HALF}" height="${2 * HALF}" fill="rgba(18,26,40,.55)"/>`;
  for (let k = -Math.round(G / st); k <= Math.round(G / st); k++) { const v = k * st; h += Ln(X(v), Y(G), X(v), Y(-G), 'rgba(160,185,230,.12)') + Ln(X(-G), Y(v), X(G), Y(v), 'rgba(160,185,230,.12)'); }
  if (polar) {
    h += '<g clip-path="url(#pl)">';
    for (let r = 1; r <= 7; r++) h += `<circle cx="${OX}" cy="${OY}" r="${(r * UU()).toFixed(1)}" fill="none" stroke="rgba(183,156,255,.13)" stroke-width="1"/>`;
    for (let a = 0; a < 180; a += 30) { const d = pol(G * 1.5, a); h += LnP([-d[0], -d[1]], d, 'rgba(183,156,255,.09)'); }
    h += '</g>';
  }
  const ax0 = OX - HALF - 8, ax1 = OX + HALF + 14, ay0 = OY + HALF + 8, ay1 = OY - HALF - 14;
  h += Ln(ax0, OY, ax1, OY, '#a9b4c9', 1.6) + `<path d="M${ax1 + 6} ${OY}l-8 -4.5v9z" fill="#a9b4c9"/>`;
  h += Ln(OX, ay0, OX, ay1, '#a9b4c9', 1.6) + `<path d="M${OX} ${ay1 - 6}l-4.5 8h9z" fill="#a9b4c9"/>`;
  for (let k = -Math.round(G / lab); k <= Math.round(G / lab); k++) {
    const v = r2(k * lab); if (!v) continue;
    h += T(X(v), OY + 13, 8.5, num(v)) + T(OX - 5, Y(v) + 3, 8.5, imLbl(v), MU, 'end');
  }
  h += T(OX - 5, OY + 12, 9.5, '0', FG, 'end') + T(ax1 + 4, OY - 9, 12, 'Re', FG) + T(OX + 9, ay1 - 2, 12, 'Im', FG, 'start');
  return h;
}
function arrow(p, q, col, w = 3, dash = false) {
  const ax = X(p[0]), ay = Y(p[1]), bx = X(q[0]), by = Y(q[1]);
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
  if (L < 1) return '';
  const ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.5), hw = hl * 0.45;
  const ex = bx - ux * hl, ey = by - uy * hl;
  const head = `<path d="M${bx.toFixed(1)} ${by.toFixed(1)}L${(ex - uy * hw).toFixed(1)} ${(ey + ux * hw).toFixed(1)}L${(ex + uy * hw).toFixed(1)} ${(ey - ux * hw).toFixed(1)}Z" fill="${col}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  if (dash) return Ln(ax, ay, ex, ey, col, w - 0.6, 'stroke-dasharray="5 4" stroke-linecap="round"') + head;
  return Ln(ax, ay, ex, ey, INK, w + 2.6, 'stroke-linecap="round"') + Ln(ax, ay, ex, ey, col, w, 'stroke-linecap="round"') + head;
}
const dot = (p, col, r = 5) => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/>`;
const ring = (p, col, r = 9, dash = '') => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${r}" fill="none" stroke="${col}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`;
const handle = (k, p, col, r = 7) => `<g data-drag="${k}"><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="17" fill="transparent"/><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="2"/><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${r + 4}" fill="none" stroke="${col}" stroke-width="1" opacity=".55"/></g>`;
// label next to a point, pushed away from the origin so it does not sit on the arrow
function lblAt(p, txt, col, size = 11.5, dy = 0) {
  const x = X(p[0]), y = Y(p[1]), L = Math.hypot(x - OX, y - OY) || 1;
  const ux = (x - OX) / L, uy = (y - OY) / L, tx = x + ux * 16 + (L < 1.5 ? 12 : 0), ty = y + uy * 16 + 4 - (L < 1.5 ? 12 : 0) + dy;
  const anchor = ux > 0.35 ? 'start' : ux < -0.35 ? 'end' : 'middle';
  return T(clamp(tx, OX - HALF - 70, OX + HALF + 70), clamp(ty, OY - HALF - 4, OY + HALF + 14), size, txt, col, anchor, 'font-weight="500" paint-order="stroke" stroke="#0e1520" stroke-width="3"');
}
const cap = (y, txt, col = FG, s = 12) => T(OX, y, s, txt, col, 'middle', 'font-weight="500"');
function arc(a0, a1, rpx, col, w = 1.6) {     // angle arc around the origin, from a0 to a1 degrees
  const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 4));
  let d = '';
  for (let k = 0; k <= n; k++) { const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180; d += (k ? 'L' : 'M') + (OX + rpx * Math.cos(a)).toFixed(1) + ' ' + (OY - rpx * Math.sin(a)).toFixed(1); }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
}
const arcLbl = (a, rpx, txt, col) => { const r = a * Math.PI / 180; return T(OX + rpx * Math.cos(r), OY - rpx * Math.sin(r) + 4, 10.5, txt, col, 'middle', 'font-weight="500" paint-order="stroke" stroke="#0e1520" stroke-width="3"'); };
const offNote = (p, txt, col) => {  // result outside the plane: arrow to the edge and a note
  const G = cfg().G, k = G / Math.max(Math.abs(p[0]), Math.abs(p[1]));
  const e = [p[0] * k, p[1] * k];
  return lblAt(e, txt + ' — за полем', col, 10.5);
};

// ---------- lesson 1: i and the complex plane ----------
function imagSVG(m) {
  let h = planeSVG();
  if (S.powI) {
    h += `<circle cx="${OX}" cy="${OY}" r="${UU()}" fill="none" stroke="${CB_}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    // short labels between the axes (diagonally off each point), the full values go to the caption
    [[[1, 0], 'i⁰', 1, 1], [[0, 1], 'i¹', 1, 1], [[-1, 0], 'i²', -1, 1], [[0, -1], 'i³', 1, -1]].forEach(([p, t, sx, sy]) => {
      h += dot(p, CB_, 4) + T(X(p[0]) + sx * 10, Y(p[1]) - sy * 8 + 4, 10.5, t, CB_, sx > 0 ? 'start' : 'end', 'font-weight="500" paint-order="stroke" stroke="#0e1520" stroke-width="3"');
    });
    for (let k = 0; k < 4; k++) h += arc(k * 90 + 14, k * 90 + 76, UU() * 1.5, CB_, 1.2);
    h += T(OX - HALF + 6, OY - HALF + 16, 10.5, 'i⁰ = 1, i¹ = i, i² = −1, i³ = −i, i⁴ = 1', CB_, 'start', 'font-weight="500" paint-order="stroke" stroke="#0e1520" stroke-width="3"');
  }
  // z² must reach −4
  h += ring([-4, 0], RD, 9, true) + T(X(-4), Y(0) + 24, 10, 'нужно z² = −4', RD, 'middle', 'font-weight="500"');
  ROOTS1.forEach((p, k) => { if (m.hit['r' + k]) h += ring(p, GR, 11) + lblAt([p[0] - 1.4, p[1]], cf(p) + ' ✓', GR, 10.5); });
  if (m.hit.a && !ceq(m.z, A1)) h += ring(A1, GR, 11);
  const col = m.isA || m.isRoot ? GR : OR, z = m.z;
  if (z[0] || z[1]) {
    h += Ln(X(z[0]), Y(z[1]), X(z[0]), OY, col, 1.1, 'stroke-dasharray="3 3" opacity=".7"') + Ln(X(z[0]), Y(z[1]), OX, Y(z[1]), col, 1.1, 'stroke-dasharray="3 3" opacity=".7"');
    h += arrow([0, 0], z, CA_, 2.4);
  }

  { const Tp = Math.max(cardB, metB) + 8; if (hh - Tp > 120) opts.push({ L: 8, Tp, W: w - 16, H: hh - Tp - 8 }); }

  powers: IC('<path d="M27 17L22 9L12 8L6 15L9 25L20 27" fill="none" stroke="var(--force)" stroke-width="1.6"/><circle cx="27" cy="17" r="2.2" fill="var(--fg)"/>'),
};

const step = (a, b, cls) => `<div class="step ${cls || ''}"><b>${a}</b><span>${b}</span></div>`;

function taskState(m) {
  const Ls = LESSONS[S.lesson];
  if (S.done[Ls.id]) return '✓ Выполнено';
  const h = m.hit, mk = v => v ? '✓' : '…';
  if (Ls.id === 'imag') return `z = ${cf(m.z)} · 3 − 2i ${mk(h.a)} · корни: ${(h.r0 ? 1 : 0) + (h.r1 ? 1 : 0)} из 2`;
  if (Ls.id === 'ops') return `сумма ${mk(h.add)} · произведение ${mk(h.mul)} · частное ${mk(h.div)}`;
  if (Ls.id === 'polar') return `поворот на 90° ${mk(h.rot)} · z·w = −4 ${mk(h.neg)}`;
  return `корни: ${(h.q0 ? 1 : 0) + (h.q1 ? 1 : 0)} из 2 · z⁵ = 1 ${mk(h.mv)}`;
}

// ---------- Scheme tab ----------
function ctlSpec() {
  const id = LID();
  if (id === 'imag') return [
    ['sA', 'Re z = a', -5, 5, 1, () => S.z1[0], v => setZ1([v, S.z1[1]])],
    ['sB', 'Im z = b', -5, 5, 1, () => S.z1[1], v => setZ1([S.z1[0], v])]];
  if (id === 'ops') return [
    ['sC', 'Re w', -6, 6, 1, () => S.w2[0], v => setW2([v, S.w2[1]])],
    ['sD', 'Im w', -6, 6, 1, () => S.w2[1], v => setW2([S.w2[0], v])]];
  if (id === 'polar') return [
    ['sZr', '|z|', 0.5, 4, 0.5, () => S.z3.r, v => setP('z3', v, S.z3.a)],
    ['sZa', 'arg z, °', -165, 180, 15, () => S.z3.a, v => setP('z3', S.z3.r, v)],
    ['sWr', '|w|', 0.5, 4, 0.5, () => S.w3.r, v => setP('w3', v, S.w3.a)],
    ['sWa', 'arg w, °', -165, 180, 15, () => S.w3.a, v => setP('w3', S.w3.r, v)]];
  if (S.mode4 === 'quad') return [
    ['s1a', 'x₁: Re', -5, 5, 1, () => S.p1[0], v => setPt4('p1', [v, S.p1[1]])],
    ['s1b', 'x₁: Im', -5, 5, 1, () => S.p1[1], v => setPt4('p1', [S.p1[0], v])],
    ['s2a', 'x₂: Re', -5, 5, 1, () => S.p2[0], v => setPt4('p2', [v, S.p2[1]])],
    ['s2b', 'x₂: Im', -5, 5, 1, () => S.p2[1], v => setPt4('p2', [S.p2[0], v])]];
  return [
    ['sN', 'Степень n', 3, 8, 1, () => S.n, v => setN(v)],
    ['sMr', '|z|', 0.5, 1.4, 0.1, () => S.z4.r, v => setP('z4', v, S.z4.a)],
    ['sMa', 'arg z, °', -177, 180, 3, () => S.z4.a, v => setP('z4', S.z4.r, v)]];
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme'), q = S.mode4 === 'quad';
  const title = { imag: 'Число z на плоскости', ops: 'Число w', polar: 'Модули и углы', roots: q ? 'Корни уравнения' : 'Степени z' }[id];
  const heads = { imag: ['z', 'z²', 'z² + 4'], ops: ['w', 'Результат', 'Цель'], polar: ['|z·w|', 'arg(z·w)', 'z·w'], roots: q ? ['f(x₁)', 'f(x₂)', 'Найдено'] : ['n', 'z' + SUP(S.n), 'Замкнулось'] }[id];
  el.innerHTML = `<h2>${title}</h2><dl class="reads">${heads.map((t, i) => `<div><dt>${t}</dt><dd id="r${i + 1}"></dd></div>`).join('')}</dl>` +
    ctlSpec().map(([sid, label, mn, mx, st, get]) => `<div class="ctl"><label for="${sid}">${label} <output id="${sid}O"></output></label><input type="range" id="${sid}" min="${mn}" max="${mx}" step="${st}" value="${get()}"></div>`).join('') +
    `<p class="note" style="margin-top:12px">Ползунки делают то же, что перетаскивание точек на рабочем поле.</p>`;
  ctlSpec().forEach(([sid, , , , , , set]) => el.querySelector('#' + sid).addEventListener('input', e => set(+e.target.value)));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  ctlSpec().forEach(([sid, , , , , get]) => { const x = el.querySelector('#' + sid); if (!x) return; set('#' + sid + 'O', num(get())); if (document.activeElement !== x) x.value = get(); });
  if (m.kind === 'imag') { set('#r1', cf(m.z)); set('#r2', cf(m.z2)); set('#r3', cf(m.f)); }
  else if (m.kind === 'ops') { set('#r1', cf(m.w)); set('#r2', m.r ? cf(m.r) : '—'); set('#r3', cf(m.M.t)); }
  else if (m.kind === 'polar') { set('#r1', num(m.pr)); set('#r2', deg(normA(m.sum))); set('#r3', cf(m.p)); }
  else if (m.kind === 'quad') { set('#r1', cf(m.f1)); set('#r2', cf(m.f2)); set('#r3', `${(m.hit.q0 ? 1 : 0) + (m.hit.q1 ? 1 : 0)}/2`); }
  else { set('#r1', m.n); set('#r2', cf(m.zn)); set('#r3', m.closed ? 'да' : 'нет'); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);
}

function calcHTML(m) {
  if (m.kind === 'imag') {
    const [a, b] = m.z;
    let h = `<h2>Число z = ${cf(m.z)}</h2><div class="formula">i² = −1</div><h3>Части числа</h3><div class="steps">` +
      step('Re z = a', num(a)) + step('Im z = b', num(b)) + step('точка на плоскости', `(${num(a)}; ${num(b)})`, 'sum') + `</div>`;
    h += `<h3>Квадрат</h3><div class="steps">` +
      step('(a + bi)²', 'a² + 2abi + b²i²') + step('= (a² − b²) + 2ab·i', `(${pn(a)}² − ${pn(b)}²) + 2·${pn(a)}·${pn(b)}·i`) +
      step('z²', cf(m.z2)) + step('z² + 4', cf(m.f) + (m.isRoot ? ' — корень ✓' : ''), 'sum') + `</div>`;
    h += `<h3>Степени i</h3><div class="steps">` + step('i¹, i²', 'i, −1') + step('i³ = i²·i', '−i') + step('i⁴ = i²·i²', '(−1)·(−1) = 1', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Квадрат действительного числа (b = 0) равен a² ≥ 0, поэтому на оси Re корней у x² + 4 = 0 нет.</p>`;
  }
  if (m.kind === 'ops') {
    const [c, d] = m.w;
    let h = `<h2>${MODES2[m.mode].name[0].toUpperCase() + MODES2[m.mode].name.slice(1)}: (2 + i) ${m.M.sym} ${cfp(m.w)}</h2>`;
    if (m.mode === 'add') h += `<div class="formula">(a + bi) + (c + di) = (a + c) + (b + d)i</div><div class="steps">` +
      step('Re', `2 + ${pn(c)} = ${num(2 + c)}`) + step('Im', `1 + ${pn(d)} = ${num(1 + d)}`) + step('z + w', cf(m.r), 'sum') + `</div>`;
    if (m.mode === 'mul') h += `<div class="formula">(a + bi)(c + di) = (ac − bd) + (ad + bc)i</div><div class="steps">` +
      step('раскрываем скобки', `2·${pn(c)} + 2·${pn(d)}i + ${pn(c)}i + ${pn(d)}i²`) + step('i² = −1', `Re: 2·${pn(c)} − ${pn(d)} = ${num(2 * c - d)}`) +
      step('', `Im: 2·${pn(d)} + ${pn(c)} = ${num(2 * d + c)}`) + step('z · w', cf(m.r), 'sum') + `</div>`;
    if (m.mode === 'div') {
      const D = c * c + d * d;
      h += `<div class="formula">z : w = z · w̄ : (w · w̄)</div><div class="steps">`;
      if (m.zero) h += step('w = 0', 'на нуль делить нельзя', 'sum');
      else h += step('w̄', cf(cconj(m.w))) + step('w · w̄ = c² + d²', `${pn(c)}² + ${pn(d)}² = ${D}`) +
        step('z · w̄', `(2 + i)·${cfp(cconj(m.w))} = ${cf(cmul(Z2, cconj(m.w)))}`) + step('z : w', `${cfp(cmul(Z2, cconj(m.w)))} : ${D} = ${cf(m.r)}`, 'sum');
      h += `</div>`;
    }
    h += `<h3>Цели</h3><div class="steps">` + ['add', 'mul', 'div'].map(k => step(`z ${MODES2[k].sym} w = ${cf(MODES2[k].t)}`, m.hit[k] ? 'найдено ✓' : 'ещё нет')).join('') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Проверка деления умножением: если z : w = q, то q · w = z.</p>`;
  }
  if (m.kind === 'polar') {
    let h = `<h2>Произведение в тригонометрической форме</h2><div class="formula">z·w = |z||w|(cos(φz + φw) + i·sin(φz + φw))</div><h3>Ваши числа</h3><div class="steps">` +
      step('z', `${trig(m.zp.r, m.zp.a)} = ${cf(m.z)}`) + step('w', `${trig(m.wp.r, m.wp.a)} = ${cf(m.w)}`) + `</div>`;
    h += `<h3>Умножаем</h3><div class="steps">` + step('модули перемножаются', `${num(m.zp.r)} · ${num(m.wp.r)} = ${num(m.pr)}`) +
      step('аргументы складываются', `${deg(m.zp.a)} + ${pn(m.wp.a)}° = ${deg(m.sum)}` + (normA(m.sum) !== m.sum ? ` → ${deg(normA(m.sum))}` : '')) +
      step('z · w', `${trig(m.pr, normA(m.sum))} = ${cf(m.p)}`, 'sum') + `</div>`;
    h += `<h3>Модуль по координатам</h3><div class="steps">` + step('|z| = √(a² + b²)', `√(${num(r2(m.z[0]))}² + ${num(r2(m.z[1]))}²) ≈ ${num(cabs(m.z))}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Умножение на i = cos 90° + i·sin 90°: модуль ×1, угол +90°.</p>`;
  }
  if (m.kind === 'quad') {
    const row = (nm, p, f) => { const [a, b] = p; return step(`f(${nm}) при ${nm} = ${cf(p)}`, `x² = ${cf(cmul(p, p))}, 2x = ${cf([2 * a, 2 * b])}`) + step('', `f = ${cf(cmul(p, p))} + ${cfp([2 * a, 2 * b])} + 5 = ${cf(f)}`, 'sum'); };
    let h = `<h2>x² + 2x + 5 = 0</h2><div class="formula">x = (−b ± i√(−D)) : (2a)</div><h3>Дискриминант</h3><div class="steps">` +
      step('D = b² − 4ac', '2² − 4·1·5 = −16') + step('D < 0', 'действительных корней нет', 'sum') + `</div>`;
    h += `<h3>Проверка подстановкой</h3><div class="steps">` + row('x₁', m.p1, m.f1) + row('x₂', m.p2, m.f2) + `</div>`;
    if (m.hit.q0 && m.hit.q1) h += `<h3>По формуле</h3><div class="steps">` + step('√D', '√(−16) = 4i') + step('x', '(−2 ± 4i) : 2 = −1 ± 2i') + step('Виет', 'x₁ + x₂ = −2, x₁·x₂ = 1 + 4 = 5', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">У уравнения с действительными коэффициентами комплексные корни сопряжены: если a + bi — корень, то и a − bi.</p>`;
  }
  let h = `<h2>Формула Муавра, n = ${m.n}</h2><div class="formula">zⁿ = rⁿ(cos nφ + i·sin nφ)</div><h3>Ваше z</h3><div class="steps">` +
    step('z', `${trig(m.zp.r, m.zp.a)}`) + step('r' + SUP(m.n), `${num(m.zp.r)}${SUP(m.n)} ≈ ${num(Math.pow(m.zp.r, m.n))}`) + step('nφ', `${m.n} · ${pn(m.zp.a)}° = ${deg(m.n * m.zp.a)}`) +
    step('z' + SUP(m.n), cf(m.zn), 'sum') + `</div><h3>Когда zⁿ = 1</h3><div class="steps">` + step('модуль', 'rⁿ = 1 → r = 1') + step('угол', 'nφ = 360°·k') + step('корней', `ровно ${m.n}: угол 360°·k : ${m.n}`, 'sum') + `</div>`;
  if (m.hit.mv) h += `<h3>Все корни z${SUP(m.n)} = 1</h3><div class="steps">` + Array.from({ length: m.n }, (_, k) => step(`k = ${k}`, `${deg(r2(normA(360 * k / m.n)))}: ${cf(pol(1, 360 * k / m.n))}`)).join('') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Сумма всех корней n-й степени из 1 равна 0 — правильный многоугольник уравновешен в центре.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'imag') el.innerHTML = `<div class="k">Число z</div><div class="v ${ok || m.isA || m.isRoot ? 'ok' : ''}">${cf(m.z)}</div><div class="lr"><span>z²</span><span>${cf(m.z2)}</span></div><div class="lr"><span>z² + 4</span><span class="${m.isRoot ? 'ok' : ''}">${cf(m.f)}</span></div>`;
  else if (m.kind === 'ops') el.innerHTML = `<div class="k">z ${m.M.sym} w</div><div class="v ${m.ok ? 'ok' : ''}">${m.r ? cf(m.r) : '—'}</div><div class="lr"><span>цель</span><span>${cf(m.M.t)}</span></div><div class="lr"><span>w</span><span>${cf(m.w)}</span></div>`;
  else if (m.kind === 'polar') el.innerHTML = `<div class="k">z · w</div><div class="v ${m.isRot || m.isNeg ? 'ok' : ''}">${cf(m.p)}</div><div class="lr"><span>|z·w|</span><span>${num(m.pr)}</span></div><div class="lr"><span>arg</span><span>${deg(normA(m.sum))}</span></div>`;
  else if (m.kind === 'quad') el.innerHTML = `<div class="k">Корни найдены</div><div class="v ${m.hit.q0 && m.hit.q1 ? 'ok' : ''}">${(m.hit.q0 ? 1 : 0) + (m.hit.q1 ? 1 : 0)} из 2</div><div class="lr"><span>f(x₁)</span><span class="${m.ok1 ? 'ok' : ''}">${cf(m.f1)}</span></div><div class="lr"><span>f(x₂)</span><span class="${m.ok2 ? 'ok' : ''}">${cf(m.f2)}</span></div>`;
  else el.innerHTML = `<div class="k">z${SUP(m.n)}</div><div class="v ${m.closed ? 'ok' : ''}">${cf(m.zn)}</div><div class="lr"><span>|z|</span><span>${num(m.zp.r)}</span></div><div class="lr"><span>arg z</span><span>${deg(m.zp.a)}</span></div>`;
}

const HITMSG = {
  a: 'Верно: 3 − 2i — это 3 по оси Re и −2 по оси Im.', r0: 'Корень найден: (2i)² = 4i² = −4.', r1: 'Корень найден: (−2i)² = 4i² = −4.',
  add: 'Сумма совпала: складываются отдельно Re и Im.', mul: 'z · z̄ = 2² + 1² = 5 — произведение сопряжённых чисел действительное.', div: 'Частное совпало: проверка (1 − 2i)·i = 2 + i.',
  rot: 'Умножение на i: модуль ×1, угол +90°.', neg: 'z · w = −4: модули 2 · 2 = 4, углы в сумме дают 180°.',
  q0: 'Корень найден: f(x) = 0.', q1: 'Корень найден: f(x) = 0.', mv: 'z⁵ = 1: модуль 1, угол ×5 даёт полный оборот. Все пять корней — вершины правильного пятиугольника.',
};
function collectHits(m) {
  const h = S.hit, nw = [];
  const set = (k, v) => { if (v && !h[k]) { h[k] = true; nw.push(k); } };
  if (m.kind === 'imag') { set('a', m.isA); ROOTS1.forEach((p, k) => set('r' + k, ceq(m.z, p))); }
  if (m.kind === 'ops') set(m.mode, m.ok);
  if (m.kind === 'polar') { set('rot', m.isRot); set('neg', m.isNeg); }
  if (m.kind === 'quad') ROOTS4.forEach((p, k) => set('q' + k, (m.ok1 && ceq(m.p1, p)) || (m.ok2 && ceq(m.p2, p))));
  if (m.kind === 'moivre') set('mv', m.isMv);
  return nw;
}
function update() {
  let m = model();
  const nw = collectHits(m), Ls = LESSONS[S.lesson];
  m = model();
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Комплексные числа освоены!'), 700);
  } else if (nw.length) toast(HITMSG[nw[nw.length - 1]]);
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  imag: '<path d="M4 18H62M33 2V29" stroke="#8b96ad" stroke-width="1"/><path d="M33 18L48 7" stroke="#72d4e8" stroke-width="1.6"/><circle cx="48" cy="7" r="2.6" fill="#ffb547"/><text x="22" y="11" font-size="9" fill="#e8ecf4" text-anchor="middle" font-family="monospace">i²</text>',
  ops: '<path d="M8 25L30 18" stroke="#72d4e8" stroke-width="1.6"/><path d="M8 25L20 8" stroke="#b79cff" stroke-width="1.6"/><path d="M30 18L42 1M20 8L42 1" stroke="#8b96ad" stroke-width="1" stroke-dasharray="2 2"/><path d="M8 25L42 1" stroke="#ffb547" stroke-width="1.6"/>',
  polar: '<circle cx="33" cy="20" r="9" fill="none" stroke="#e8ecf4" stroke-width="1" stroke-dasharray="2 2"/><path d="M33 20L45 15" stroke="#72d4e8" stroke-width="1.6"/><path d="M33 20L28 4" stroke="#ffb547" stroke-width="1.6"/><path d="M41 20A8 8 0 0 0 40 16" fill="none" stroke="#b79cff"/>',
  roots: '<circle cx="33" cy="15" r="11" fill="none" stroke="#8b96ad" stroke-width="1"/><path d="M44 15L36.4 25.5L24.1 21.5L24.1 8.5L36.4 4.5Z" fill="none" stroke="#86e0a8" stroke-width="1.5"/><circle cx="44" cy="15" r="2" fill="#e8ecf4"/>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null; drag = null; S.hit = {}; S.powI = false; S.angs = true;
  if (Ls.mode) { if (Ls.id === 'ops') S.mode2 = Ls.mode; else S.mode4 = Ls.mode; }
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id, h = m.hit;
  let now = '';
  if (m.kind === 'imag') now = `Комплексная плоскость −5…5 (ось Re — действительная часть, ось Im — мнимая). Точка ученика z = ${cf(m.z)}, z² = ${cf(m.z2)}, z² + 4 = ${cf(m.f)}. Отмечена цель для z²: −4. Степени i на экране: ${S.powI ? 'показаны' : 'скрыты'}. Число 3 − 2i ${h.a ? 'уже отмечено' : 'ещё не отмечено'}; корней x² + 4 = 0 найдено ${(h.r0 ? 1 : 0) + (h.r1 ? 1 : 0)} из 2.`;
  if (m.kind === 'ops') now = `Плоскость −6…6. Закреплено z = 2 + i, ученик двигает w = ${cf(m.w)}. Режим: ${m.M.name} (z ${m.M.sym} w), результат ${m.r ? cf(m.r) : 'не определён (w = 0)'}, цель ${cf(m.M.t)}. Найдено: сумма ${h.add ? 'да' : 'нет'}, произведение ${h.mul ? 'да' : 'нет'}, частное ${h.div ? 'да' : 'нет'}.`;
  if (m.kind === 'polar') now = `Плоскость −5…5 с круговой сеткой (модуль шагом 0,5, угол шагом 15°). z: |z| = ${num(m.zp.r)}, arg z = ${deg(m.zp.a)} (${cf(m.z)}); w: |w| = ${num(m.wp.r)}, arg w = ${deg(m.wp.a)} (${cf(m.w)}); z·w = ${cf(m.p)}, |z·w| = ${num(m.pr)}, arg = ${deg(normA(m.sum))}. Поворот на 90° (w = i) ${h.rot ? 'найден' : 'не найден'}; z·w = −4 при |z| = |w| ${h.neg ? 'получено' : 'не получено'}.`;
  if (m.kind === 'quad') now = `Режим «Уравнение»: x² + 2x + 5 = 0, D = −16. Точки ученика x₁ = ${cf(m.p1)} (f = ${cf(m.f1)}), x₂ = ${cf(m.p2)} (f = ${cf(m.f2)}). Найдено корней: ${(h.q0 ? 1 : 0) + (h.q1 ? 1 : 0)} из 2; корень z⁵ = 1 ${h.mv ? 'найден' : 'не найден'}.`;
  if (m.kind === 'moivre') now = `Режим «Муавр», n = ${m.n}. z: |z| = ${num(m.zp.r)}, arg = ${deg(m.zp.a)}; z${SUP(m.n)} = ${cf(m.zn)} (ломаная степеней ${m.closed ? 'замкнулась в 1' : 'не замкнулась'}). Корни квадратного уравнения: ${(h.q0 ? 1 : 0) + (h.q1 ? 1 : 0)} из 2; корень z⁵ = 1, отличный от 1, ${h.mv ? 'найден' : 'не найден'}.`;
  return [
    `Раздел: математика, 11 класс (профильный уровень), алгебра, тема «Комплексные числа». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (корни уравнений, нужное число w, модули и углы, корень z⁵ = 1): веди ученика наводящими вопросами и проверяй его вычисления.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    imag: 'Почему i не бывает на числовой прямой?', ops: 'Зачем при делении умножают на сопряжённое?',
    polar: 'Почему умножение на i — это поворот на 90°?', roots: 'Почему корней z⁵ = 1 ровно пять?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
