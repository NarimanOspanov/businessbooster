<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивная лаборатория по математике, 9 класс: комбинаторика — правило умножения, перестановки, сочетания и треугольник Паскаля.">
<title>Комбинаторика</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the same lab shell as /chemistry and /mechanics. Stage (SVG) on the left, lesson notebook on the right, lesson strip under the stage. */
:root{
  --bg:#0b1019;
  --surface:#121a28;
  --surface-2:#1a2438;
  --line:#26324a;
  --fg:#e8ecf4;
  --muted:#8b96ad;
  --force:#ffb547;
  --arm:#72d4e8;
  --ok:#86e0a8;
  --warn:#ff8a73;
  --liq:#5fb4d9;
  --violet:#b79cff;
  --tag-bg:rgba(11,16,25,.84);
  --stage-hi:#1a2539;
  --stage-lo:#0e1520;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arm);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 22px/1 var(--font-display);letter-spacing:.16em;margin:0}
.brand small{display:block;font:500 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.sections{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.sections a{color:var(--muted);text-decoration:none;font:600 11.5px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;padding:9px 12px;border-radius:7px}
.sections a:hover{color:var(--fg)}
.sections a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.prog b{font:600 11.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.bar{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--arm);transition:width .4s}
.prog .num{font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.headr{display:flex;gap:10px;flex-wrap:wrap}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 50% 35%,var(--stage-hi) 0%,var(--stage-lo) 62%,var(--bg) 100%)}
.scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - 54px);display:block;overflow:visible;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.scene [data-hit]{cursor:pointer}
.scene text{font-family:var(--font-mono)}

.task{position:absolute;top:14px;left:14px;max-width:min(340px,calc(100% - 200px));background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px 12px;pointer-events:none}
.task .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force)}
.task p{margin:7px 0 8px;font-size:14px;line-height:1.4;text-wrap:pretty}
.state{font:500 12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.state.done{color:var(--ok)}

.meter{position:absolute;top:14px;right:14px;width:170px;background:var(--tag-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:none}
.meter .k{font:600 10px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:500 15px/1.15 var(--font-mono);margin-top:8px;font-variant-numeric:tabular-nums}
.meter .v.ok{color:var(--ok)}
.meter .lr{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:500 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter .lr .ok{color:var(--ok)}

.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;align-items:center;background:var(--tag-bg);border:1px solid var(--line);border-radius:11px;padding:4px;max-width:calc(100% - 20px)}
.tools button{background:none;border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:22%;pointer-events:none}

.panel{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px 12px;font:600 11px/1 var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--force)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px 18px 22px}
.pbody h2{font:500 17px/1.3 var(--font-display);margin:0 0 12px;text-wrap:balance}
.pbody h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pbody p{margin:0 0 12px;line-height:1.55;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.lesson-k{font:500 11px/1 var(--font-mono);color:var(--muted);margin-bottom:8px}
.life{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;margin:4px 0 12px}
.life b{display:block;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.taskbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.taskbox .k{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--force);margin-bottom:6px}
.taskbox p{margin:0 0 8px}
.taskbox .note{margin:8px 0 0}
.primary{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--fg);color:var(--bg);border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}

.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.reads div{background:var(--surface-2);border-radius:9px;padding:8px 9px;min-width:0}
.reads dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reads dd{margin:6px 0 0;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.ctl output{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--force)}

.formula{font:500 17px/1.35 var(--font-mono);text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;overflow-wrap:anywhere}
.steps{display:grid;gap:6px}
.step{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px}
.step b{font-weight:500;color:var(--muted);flex:none;max-width:45%}
.step span{font:500 13px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.step.sum{background:none;border:1px solid var(--line)}
.step.sum b{color:var(--fg)}

.parts{display:grid;gap:8px}
.part{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.part:hover{border-color:var(--muted)}
.part svg{width:34px;height:34px;flex:none}
.part b{display:block;font-weight:600;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

.strip{grid-column:1;display:flex;gap:8px;min-width:0}
.lessons{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.lesson{flex:0 0 212px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.lesson:hover{border-color:var(--muted)}
.lesson[aria-current="true"]{border-color:var(--force);color:var(--fg)}
.lesson svg{width:66px;height:30px;flex:none;background:var(--bg);border-radius:6px}
.lesson .n{display:block;font:500 10.5px/1 var(--font-mono);margin-bottom:4px}
.lesson .t{display:block;font:600 12.5px/1.25 var(--font-body)}
.lesson .chk{position:absolute;top:6px;right:8px;font:600 12px/1 var(--font-mono);color:var(--ok)}
.navbtn{flex:none;width:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:500 18px/1 var(--font-mono)}
.navbtn.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navbtn:disabled{opacity:.3;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1280px){.hint{display:none}}
@media (max-width:980px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:64vh;min-height:430px}
  .panel{grid-column:auto;grid-row:auto}
  .strip{grid-column:auto}
  .pbody{overflow:visible}
}
@media (max-width:600px){
  .meter{width:118px;padding:8px}
  .meter .v{font-size:13px}
  .task{max-width:calc(100% - 146px);padding:9px 11px}
  .task p{font-size:13px}
  .tools button{padding:6px 7px;font-size:12px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .sections a{padding:9px 8px;letter-spacing:.05em}
  .stage{height:calc(80vw + 400px);min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" role="link" tabindex="0" title="Карта предметов" style="cursor:pointer" onclick="location.href='/#math'" onkeydown="if(event.key==='Enter')location.href='/#math'">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M20 20V7A13 13 0 0 1 33 20Z" fill="var(--force)"/><path d="M20 20H33A13 13 0 1 1 20 7Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/><path d="M20 20L10.8 29.2" stroke="var(--fg)" stroke-width="2"/><path d="M20 20V33" stroke="var(--arm)" stroke-width="2"/></svg>
      <div><h1>LABIQ</h1><small>Опыты · Математика · Комбинаторика</small></div>
    </div>
    <div class="headr">
      
      <div class="prog" aria-label="Прогресс"><b>Комбинаторика</b><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/4</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Рабочее поле">
    <svg class="scene" id="scene" role="img" aria-label="Рабочее поле: меню, буквы, турнир команд или треугольник Паскаля. Нажимайте на элементы."></svg>
    <div class="task" aria-live="polite">
      <div class="k" id="taskK">Задание</div>
      <p id="taskText"></p>
      <div class="state" id="taskState"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint"></div>
    <div class="tools" role="toolbar" aria-label="Действия" id="tools"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true">Обзор</button>
      <button role="tab" id="tab-parts" aria-selected="false">Детали</button>
      <button role="tab" id="tab-scheme" aria-selected="false">Схема</button>
      <button role="tab" id="tab-calc" aria-selected="false">Расчёты</button>
    </div>
    <div class="pbody" id="pane-overview" role="tabpanel"></div>
    <div class="pbody" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-scheme" role="tabpanel" hidden></div>
    <div class="pbody" id="pane-calc" role="tabpanel" hidden></div>
  </aside>

  <nav class="strip" aria-label="Уроки">
    <div class="lessons" id="lessons"></div>
    <button class="navbtn" id="prevL" aria-label="Предыдущий урок">‹</button>
    <button class="navbtn next" id="nextL" aria-label="Следующий урок">›</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>


<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#04070d', CA_ = '#72d4e8', CB_ = '#b79cff', OR = '#ffb547', GR = '#86e0a8', FG = '#e8ecf4', MU = '#8b96ad', SF = '#1a2438', LN = '#26324a';
const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const Cnk = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
const SUB = '₀₁₂₃₄₅₆₇₈₉', SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sub = n => String(n).split('').map(d => SUB[d]).join('');
const sup = n => String(n).split('').map(d => SUP[d]).join('');
const C = (n, k) => `C${sub(n)}${sup(k)}`;
const big = x => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const chain = n => n <= 1 ? '1' : Array.from({ length: n }, (_, i) => n - i).join('·');

// menu for lesson 1
const NAMES = [['Оливье', 'Цезарь', 'Винегрет', 'Мимоза', 'Греческий', 'Овощной'], ['Плов', 'Бешбармак', 'Манты', 'Лагман', 'Котлета', 'Паста'], ['Чай', 'Компот', 'Айран', 'Сок', 'Вода', 'Морс']];
const GROUP = ['Салаты', 'Горячее', 'Напитки'];
const GCOL = [CA_, CB_, OR];
const LET = ['К', 'О', 'Т', 'А'];

const LESSONS = [
  { id: 'mult', title: 'Правило умножения',
    text: ['Если первый выбор можно сделать a способами, а второй — b способами при любом первом, то пару выборов можно сделать a · b способами. Это правило умножения.',
           'Для трёх шагов вариантов a · b · c, для большего числа шагов — так же. Варианты удобно показывать деревом или таблицей: строки — первый выбор, столбцы — второй.',
           'Не путайте с правилом сложения. «Салат И горячее» — умножаем. «Салат ИЛИ горячее» — складываем: a + b.'],
    why: 'Технолог кафе и ресторатор считают, сколько комбо-обедов даст меню, и не раздувают склад лишними блюдами. Специалист по кибербезопасности знает: 4-значный PIN — это 10 · 10 · 10 · 10 = 10 000 вариантов, а пароль из 8 букв и цифр — триллионы, поэтому длинный пароль надёжнее. Так же считают, сколько автомобильных номеров хватит на регион и сколько артикулов (размер × цвет × модель) держать в магазине.',
    task: 'Настройте меню так, чтобы разных обедов «салат + горячее + напиток» было ровно 24, а в каждой группе — не меньше 2 блюд. Потом выберите по блюду в каждой группе.',
    hint: 'Число обедов = a · b · c. Разложите 24 на три множителя, каждый от 2 до 6. Кнопки − и + меняют число блюд в группе. Нажмите на блюдо или на клетку таблицы.',
    stage: 'Нажимайте − и + над группами и на сами блюда.',
    cnt: [2, 3, 1],
    check: m => m.ok },
  { id: 'perm', title: 'Перестановки',
    text: ['Перестановка — это расстановка n разных предметов по n местам в каком-то порядке. КОТ, КТО и ТОК — разные перестановки одних и тех же букв.',
           'На первое место годится любой из n предметов, на второе — любой из оставшихся n − 1, и так до последнего места, где выбора уже нет. По правилу умножения Pₙ = n · (n − 1) · … · 2 · 1 = n! (читают «эн факториал»).',
           'Факториал растёт очень быстро: 5! = 120, а 10! = 3 628 800. Чтобы не пропустить ни одной перестановки, перебирайте их по порядку: сначала все, что начинаются на первую букву, потом на вторую.'],
    why: 'Завуч составляет расписание: 6 уроков в день можно расставить 720 способами, и нужен лучший. Логист службы доставки в Алматы ищет порядок объезда адресов: 10 адресов — это 3 628 800 маршрутов, поэтому программисты пишут умные алгоритмы, а не перебирают всё подряд. Перестановки лежат в основе шифров и жеребьёвок турниров.',
    task: 'Соберите все перестановки букв К, О, Т: каждое слово из этих трёх букв, каждая буква ровно один раз.',
    hint: 'Нажимайте буквы по очереди — они встают на свободные места. Нажатие на занятое место убирает букву. Перебирайте по порядку: сначала слова на К, потом на О, потом на Т.',
    stage: 'Нажимайте буквы. Готовое слово записывается в таблицу.',
    n2: 3,
    check: m => m.ok },
  { id: 'comb', title: 'Сочетания',
    text: ['Сочетание из n по k — это выбор k предметов из n, когда порядок не важен. Команда «Аян и Бота» — та же, что «Бота и Аян».',
           'Если порядок важен, это размещения: Aₙᵏ = n · (n − 1) · … · (n − k + 1). Каждую группу из k предметов можно упорядочить k! способами, поэтому Cₙᵏ = Aₙᵏ : k! = n! : (k! · (n − k)!).',
           'Матч — это пара команд, и порядок в паре не важен. Поэтому в турнире «каждый с каждым» матчей Cₙ² = n · (n − 1) : 2.'],

const KEY = 'luch-math-comb';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { lesson: clamp(saved.lesson | 0, 0, LESSONS.length - 1), done: saved.done || {}, tab: 'overview', hl: null,
            cnt: [2, 3, 1], pick: [null, null, null], n2: 3, slots: [], found: new Set(), n3: 4, k3: 3, E: new Set(), first: null, R: 4, rev: new Set(), sel: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lesson: S.lesson, done: S.done })); } catch (e) {} };
const LID = () => LESSONS[S.lesson].id;

// ---------- helpers ----------
function permsOf(n) {   // all permutations of indices 0..n-1 in lexicographic order
  const out = [], used = [], cur = [];
  (function go() {
    if (cur.length === n) { out.push(cur.slice()); return; }
    for (let i = 0; i < n; i++) if (!used[i]) { used[i] = 1; cur.push(i); go(); cur.pop(); used[i] = 0; }
  })();
  return out;
}
const word = arr => arr.map(i => LET[i]).join('');
const eKey = (i, j) => i < j ? `${i}-${j}` : `${j}-${i}`;
const isRev = (n, k) => S.rev.has(`${n}-${k}`);
function revealBase(R) { S.rev = new Set(); for (let n = 0; n <= R; n++) for (let k = 0; k <= n; k++) S.rev.add(`${n}-${k}`); }
function rowsOpenTo(r) { for (let n = 0; n <= r; n++) for (let k = 0; k <= n; k++) if (!isRev(n, k)) return false; return true; }

function model() {
  const id = LID();
  if (id === 'mult') {
    const [a, b, c] = S.cnt, N = a * b * c;
    const okN = N === 24 && S.cnt.every(x => x >= 2), okPick = S.pick.every(p => p !== null);
    return { kind: id, a, b, c, N, pick: S.pick.slice(), okN, okPick, ok: okN && okPick };
  }
  if (id === 'perm') {
    const n = S.n2, total = fact(n);
    return { kind: id, n, total, got: S.found.size, slots: S.slots.slice(), ok: n === 3 && S.found.size === 6 };
  }
  if (id === 'comb') {
    const n = S.n3, need = Cnk(n, 2), deg = Array(n).fill(0);
    S.E.forEach(e => { const [i, j] = e.split('-').map(Number); deg[i]++; deg[j]++; });
    return { kind: id, n, m: S.E.size, need, deg, k: S.k3, first: S.first, ok: n === 5 && S.E.size === 10 };
  }
  const full = S.R >= 7 && rowsOpenTo(7), sel = S.sel;
  const okSel = !!sel && sel[0] === 7 && (sel[1] === 3 || sel[1] === 4);
  let hidden = 0; for (let n = 0; n <= S.R; n++) for (let k = 0; k <= n; k++) if (!isRev(n, k)) hidden++;
  return { kind: id, R: S.R, sel: sel ? sel.slice() : null, full, okSel, hidden, ok: full && okSel };
}

// ---------- drawing (content box 370 × 430) ----------
const T = (x, y, s, txt, fill = MU, anchor = 'middle', extra = '') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const Ln = (x1, y1, x2, y2, col, w = 1, extra = '') => `<path d="M${(+x1).toFixed(1)} ${(+y1).toFixed(1)}L${(+x2).toFixed(1)} ${(+y2).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
const B5 = 'font-weight="500"';
function backdrop() {
  return `<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(160,185,230,.05)" stroke-width="1.5"/></pattern></defs>
    <rect x="-2000" y="-2000" width="4400" height="4400" fill="url(#tile)"/>`;
}
const pmBtn = (x, y, sign, hit, on = true) => `<g data-hit="${hit}" opacity="${on ? 1 : .3}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="11" fill="${SF}" stroke="${LN}" stroke-width="1.5"/>${T(x, y + 5, 15, sign, FG, 'middle', B5)}</g>`;

// lesson 1: menu + table of combinations
const COLX = [62, 185, 308];
function gridGeom(m) {
  const cs = Math.min(290 / m.b, 140 / m.a, 46), w = cs * m.b, h = cs * m.a;
  return { cs, x0: 185 - w / 2 + 8, y0: 252, w, h };
}
function multSVG(m) {
  let h = '';
  for (let g = 0; g < 3; g++) {
    const cx = COLX[g], col = GCOL[g], n = S.cnt[g];
    h += T(cx, 12, 11.5, GROUP[g], col, 'middle', B5);
    h += pmBtn(cx - 34, 33, '−', `dec:${g}`, n > 1) + T(cx, 38, 14, n, FG, 'middle', B5) + pmBtn(cx + 34, 33, '+', `inc:${g}`, n < 6);
    for (let i = 0; i < 6; i++) {
      const y = 54 + i * 28;
      if (i >= n) { h += `<rect x="${cx - 52}" y="${y}" width="104" height="24" rx="7" fill="none" stroke="${LN}" stroke-dasharray="3 4"/>`; continue; }
      const on = S.pick[g] === i;
      h += `<g data-hit="p:${g}:${i}"><rect x="${cx - 52}" y="${y}" width="104" height="24" rx="7" fill="${on ? col : SF}" stroke="${on ? INK : col}" stroke-width="1.4"/>` +
        T(cx - 44, y + 16, 10, i + 1, on ? '#0b1019' : col, 'start', B5) + T(cx + 5, y + 16, 11, NAMES[g][i], on ? '#0b1019' : FG, 'middle', B5) + `</g>`;
    }
  }
  // table: rows — salads, columns — hot dishes, dots in a cell — drinks
  const G = gridGeom(m), { cs, x0, y0 } = G;
  h += T(x0 - 6, y0 - 7, 9.5, 'салат ↓  горячее →', MU, 'end');
  for (let j = 0; j < m.b; j++) h += T(x0 + (j + .5) * cs, y0 - 5, 9.5, j + 1, CB_, 'middle', B5);
  for (let i = 0; i < m.a; i++) {
    h += T(x0 - 6, y0 + (i + .5) * cs + 3.5, 9.5, i + 1, CA_, 'end', B5);
    for (let j = 0; j < m.b; j++) {
      const x = x0 + j * cs, y = y0 + i * cs, onR = S.pick[0] === i, onC = S.pick[1] === j, both = onR && onC;
      h += `<g data-hit="cell:${i}:${j}"><rect x="${(x + 1).toFixed(1)}" y="${(y + 1).toFixed(1)}" width="${(cs - 2).toFixed(1)}" height="${(cs - 2).toFixed(1)}" rx="4" fill="${both ? 'rgba(134,224,168,.22)' : onR || onC ? 'rgba(114,212,232,.10)' : 'rgba(18,26,40,.8)'}" stroke="${both ? GR : LN}" stroke-width="${both ? 1.8 : 1}"/>`;
      const cols = Math.min(m.c, 3), rows = Math.ceil(m.c / 3), r = Math.max(1.6, Math.min(cs * 0.11, 4));
      for (let d = 0; d < m.c; d++) {
        const px = x + cs * ((d % 3) + .5) / cols, cy = y + cs * (Math.floor(d / 3) + .5) / rows;
        const hot = both && S.pick[2] === d;
        h += `<circle cx="${px.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(hot ? r * 1.6 : r).toFixed(1)}" fill="${hot ? GR : OR}" ${hot ? `stroke="${INK}" stroke-width="1.2"` : ''}/>`;
      }
      h += `</g>`;
    }
  }
  const col = m.okN ? GR : FG;
  h += T(185, 418, 14, `${m.a} · ${m.b} · ${m.c} = ${m.N} ${m.N % 10 === 1 && m.N % 100 !== 11 ? 'обед' : [2, 3, 4].includes(m.N % 10) && ![12, 13, 14].includes(m.N % 100) ? 'обеда' : 'обедов'}`, col, 'middle', B5);
  return h;
}

// lesson 2: permutations of letters
function permSVG(m) {
  let h = '';
  const n = m.n, sw = 56, sx = 185 - (n - 1) * sw / 2, full = S.slots.length === n;
  h += T(185, 12, 11, 'места', MU);
  for (let i = 0; i < n; i++) {
    const x = sx + i * sw, has = i < S.slots.length;
    h += `<g data-hit="S:${i}"><rect x="${x - 23}" y="20" width="46" height="50" rx="9" fill="${has ? (full ? 'rgba(134,224,168,.16)' : SF) : 'none'}" stroke="${has ? (full ? GR : OR) : LN}" stroke-width="1.6" ${has ? '' : 'stroke-dasharray="4 4"'}/>` +
      (has ? T(x, 54, 26, LET[S.slots[i]], FG, 'middle', B5) : T(x, 52, 13, i + 1, LN)) + `</g>`;
  }
  const cw = 64, cx0 = 185 - (n - 1) * cw / 2;
  for (let i = 0; i < n; i++) {
    const x = cx0 + i * cw, used = !full && S.slots.includes(i);
    h += `<g data-hit="L:${i}" opacity="${used ? .3 : 1}"><circle cx="${x}" cy="114" r="25" fill="transparent"/><circle cx="${x}" cy="114" r="21" fill="${SF}" stroke="${CA_}" stroke-width="1.8"/>${T(x, 122, 21, LET[i], CA_, 'middle', B5)}</g>`;
  }
  h += T(185, 160, 10.5, 'буквы — нажимайте по очереди', MU);
  // table grouped by the first letter
  const all = permsOf(n), per = fact(n - 1), cw2 = Math.min(56, 300 / per), ch = Math.min(34, 200 / n), tx0 = 185 - per * cw2 / 2 + 12;
  for (let r = 0; r < n; r++) {
    const y = 182 + r * ch;
    h += T(tx0 - 8, y + ch / 2 + 4, 10.5, LET[r] + '…', CA_, 'end', B5);
    for (let j = 0; j < per; j++) {
      const w = word(all[r * per + j]), got = S.found.has(w), x = tx0 + j * cw2;
      h += `<rect x="${(x + 2).toFixed(1)}" y="${(y + 2).toFixed(1)}" width="${(cw2 - 4).toFixed(1)}" height="${(ch - 4).toFixed(1)}" rx="5" fill="${got ? 'rgba(134,224,168,.14)' : 'rgba(18,26,40,.8)'}" stroke="${got ? GR : LN}"/>`;
      h += got ? T(x + cw2 / 2, y + ch / 2 + 4, n === 4 ? 10 : 12.5, w, GR, 'middle', B5) : T(x + cw2 / 2, y + ch / 2 + 4, 10, '· · ·', LN);
    }
  }
  h += T(185, 418, 14, `собрано ${m.got} из ${n}! = ${m.total}`, m.got === m.total ? GR : FG, 'middle', B5);
  return h;
}

// lesson 3: round-robin tournament on a circle
const CC = [185, 208], CR = 145;
const nodeP = (i, n) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [CC[0] + CR * Math.cos(a), CC[1] + CR * Math.sin(a)]; };
function combSVG(m) {
  let h = `<circle cx="${CC[0]}" cy="${CC[1]}" r="${CR}" fill="none" stroke="${LN}" stroke-dasharray="3 6"/>`;
  S.E.forEach(e => { const [i, j] = e.split('-').map(Number); const p = nodeP(i, m.n), q = nodeP(j, m.n); h += Ln(p[0], p[1], q[0], q[1], CB_, 2.2, 'stroke-linecap="round" opacity=".85"'); });
  for (let i = 0; i < m.n; i++) {
    const [x, y] = nodeP(i, m.n), full = m.deg[i] === m.n - 1, sel = m.first === i;
    const col = full ? GR : sel ? OR : CA_;
    h += `<g data-hit="N:${i}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="24" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="${sel ? OR : SF}" stroke="${col}" stroke-width="2.2"/>` +
      T(x, y + 5, 14, i + 1, sel ? '#0b1019' : col, 'middle', B5) + `</g>`;
    if (sel) h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="23" fill="none" stroke="${OR}" stroke-width="1.2" opacity=".6"/>`;
    const ang = -Math.PI / 2 + 2 * Math.PI * i / m.n, ca = Math.cos(ang), sa = Math.sin(ang);
    const lx = x + ca * 27, ly = y + sa * 27 + (Math.abs(ca) > .35 ? 0 : sa < 0 ? -4 : 8), d = m.deg[i];
    const word = d % 10 === 1 && d % 100 !== 11 ? 'игра' : [2, 3, 4].includes(d % 10) && ![12, 13, 14].includes(d % 100) ? 'игры' : 'игр';
    h += T(lx, ly + 4, 9.5, `${d} ${word}`, full ? GR : MU, ca > .35 ? 'start' : ca < -.35 ? 'end' : 'middle');
  }
  h += T(185, 418, 14, `команд: ${m.n} · матчей проведено: ${m.m}`, m.m === m.need ? GR : FG, 'middle', B5);
  return h;
}

// lesson 4: Pascal's triangle
const PX = (n, k) => 185 + (k - n / 2) * 33, PY = n => 18 + n * 32;
function pascalSVG(m) {
  let h = '';
  const sel = m.sel, par = sel ? [[sel[0] - 1, sel[1] - 1], [sel[0] - 1, sel[1]]].filter(([n, k]) => n >= 0 && k >= 0 && k <= n) : [];
  for (const [n, k] of par) h += Ln(PX(n, k), PY(n) + 12, PX(sel[0], sel[1]), PY(sel[0]) - 12, CA_, 1.6);
  for (let n = 0; n <= m.R; n++) for (let k = 0; k <= n; k++) {
    const x = PX(n, k), y = PY(n), rv = isRev(n, k), isSel = sel && sel[0] === n && sel[1] === k, isPar = par.some(p => p[0] === n && p[1] === k);
    const fill = isSel ? OR : isPar ? 'rgba(114,212,232,.22)' : rv ? SF : 'none';
    const st = isSel ? INK : isPar ? CA_ : rv ? LN : MU;
    h += `<g data-hit="C:${n}:${k}"><rect x="${x - 15.5}" y="${y - 12}" width="31" height="24" rx="6" fill="${fill}" stroke="${st}" stroke-width="${isPar ? 1.8 : 1.2}" ${rv ? '' : 'stroke-dasharray="3 3"'}/>` +
      T(x, y + 4, Cnk(n, k) >= 100 ? 10.5 : 12, rv ? Cnk(n, k) : '?', isSel ? '#0b1019' : rv ? (k === 0 || k === n ? CB_ : FG) : MU, 'middle', B5) + `</g>`;
  }
  let msg = 'нажмите на число, чтобы разобрать его';
  if (sel) {
    const [n, k] = sel, v = Cnk(n, k);
    msg = (k === 0 || k === n) ? `${C(n, k)} = 1 — край треугольника` : `${C(n, k)} = ${Cnk(n - 1, k - 1)} + ${Cnk(n - 1, k)} = ${v}`;
  }
  h += T(185, 384, 10.5, sel ? `строка ${sel[0]}, место ${sel[1]} (счёт с нуля)` : `строки 0…${m.R}${m.hidden ? ` · закрыто: ${m.hidden}` : ''}`, MU);
  h += T(185, 410, 14, msg, sel ? (m.ok ? GR : FG) : MU, 'middle', B5);
  return h;
}

function bbox(x, y, w, h) { return [x, y, w, h]; }
function hlBox(id) {
  const m = model();
  const B = {
    col0: bbox(6, 0, 112, 222), col1: bbox(129, 0, 112, 222), col2: bbox(252, 0, 112, 222),
    btns: bbox(10, 18, 350, 30), total: bbox(70, 400, 230, 26),
    slots: bbox(185 - S.n2 * 28 - 4, 16, S.n2 * 56 + 8, 58), letters: bbox(185 - S.n2 * 32, 86, S.n2 * 64, 56), table: bbox(20, 176, 330, 210),
    ring: bbox(CC[0] - CR - 26, CC[1] - CR - 26, 2 * CR + 52, 2 * CR + 52), deg: bbox(CC[0] - 30, CC[1] - CR - 58, 60, 30),
    apex: bbox(PX(0, 0) - 22, PY(0) - 17, 44, 34), edges: bbox(PX(m.R || 4, 0) - 20, PY(0) - 16, (m.R || 4) * 33 + 40, (m.R || 4) * 32 + 32), last: bbox(PX(S.R, 0) - 20, PY(S.R) - 16, S.R * 33 + 40, 32),
  };
  if (id === 'grid' && m.kind === 'mult') { const G = gridGeom(m); return [G.x0 - 20, G.y0 - 18, G.w + 26, G.h + 24]; }
  if (id === 'match' && m.kind === 'comb') { const e = [...S.E][0]; if (e) { const [i, j] = e.split('-').map(Number), p = nodeP(i, m.n), q = nodeP(j, m.n); return [Math.min(p[0], q[0]) - 22, Math.min(p[1], q[1]) - 22, Math.abs(p[0] - q[0]) + 44, Math.abs(p[1] - q[1]) + 44]; } return B.ring; }
  if (id === 'team') { const p = nodeP(0, S.n3); return [p[0] - 24, p[1] - 24, 48, 48]; }
  if (id === 'selc') { const s = S.sel || [Math.min(S.R, 4), 2]; return [PX(s[0], s[1]) - 54, PY(s[0] - 1) - 17, 108, 66]; }
  return B[id];
}

const scene = $('#scene');
let dirty = true;
function drawScene(t) {
  const id = LID(), m = model();
  let h = backdrop();
  h += id === 'mult' ? multSVG(m) : id === 'perm' ? permSVG(m) : id === 'comb' ? combSVG(m) : pascalSVG(m);
  if (S.hl) {
    const k = clamp(1 - (t - S.hl.t) / 1800, 0, 1), b = hlBox(S.hl.id);
    if (k === 0) S.hl = null;
    else if (b && b[2] > 0) h += `<rect x="${b[0].toFixed(1)}" y="${b[1].toFixed(1)}" width="${b[2].toFixed(1)}" height="${b[3].toFixed(1)}" rx="8" fill="rgba(114,212,232,.07)" stroke="#72d4e8" stroke-width="2" stroke-dasharray="6 5" pointer-events="none" opacity="${reduce ? 1 : (0.5 + 0.5 * Math.abs(Math.sin((t - S.hl.t) / 220))).toFixed(2)}"/>`;
  }
  scene.innerHTML = h;
}

function fit() {
  const rc = scene.getBoundingClientRect(), w = rc.width, hh = rc.height; if (!w || !hh) return;
  const s = Math.min(w / 372, hh / 600, 1.6);
  const vw = w / s, vh = hh / s;
  scene.setAttribute('viewBox', `${(185 - vw / 2).toFixed(1)} ${(432 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
  dirty = true;
}
new ResizeObserver(fit).observe(scene);

// ---------- state changes ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function setCnt(g, v) {
  v = clamp(v | 0, 1, 6); if (v === S.cnt[g]) return;
  S.cnt[g] = v; if (S.pick[g] !== null && S.pick[g] >= v) S.pick[g] = null; update();
}
function pickDish(g, i) { S.pick[g] = S.pick[g] === i ? null : i; update(); }
function setN2(n) {
  n = clamp(n | 0, 2, 4); if (n === S.n2) return;
  S.n2 = n; S.slots = []; S.found = new Set(); update();
}
function tapLetter(i) {
  if (S.slots.length === S.n2) S.slots = [];
  if (S.slots.includes(i)) return;
  S.slots.push(i);
  if (S.slots.length === S.n2) {
    const w = word(S.slots);
    if (S.found.has(w)) toast(`«${w}» уже есть в таблице.`);
    else { S.found.add(w); if (S.found.size < fact(S.n2)) toast(`Новая перестановка: ${w}`); }
  }
  update();
}
function tapSlot(i) {
  if (i >= S.slots.length) return;
  S.slots.splice(i, 1); update();
}
function setN3(n) {
  n = clamp(n | 0, 3, 8); if (n === S.n3) return;
  S.n3 = n; S.first = null;
  S.E = new Set([...S.E].filter(e => e.split('-').every(x => +x < n)));
  S.k3 = clamp(S.k3, 1, n); update();
}
function setK3(k) { k = clamp(k | 0, 1, S.n3); if (k !== S.k3) { S.k3 = k; update(); } }
function tapNode(i) {
  if (S.first === null) S.first = i;
  else if (S.first === i) S.first = null;
  else { const e = eKey(S.first, i); if (S.E.has(e)) S.E.delete(e); else S.E.add(e); S.first = null; }
  update();
}
function setRows(R) {
  R = clamp(R | 0, 4, 10); if (R === S.R) return;
  if (R < S.R) { S.rev = new Set([...S.rev].filter(c => +c.split('-')[0] <= R)); if (S.sel && S.sel[0] > R) S.sel = null; }
  S.R = R; update();
}
function tapCell(n, k) {
  if (isRev(n, k)) { S.sel = S.sel && S.sel[0] === n && S.sel[1] === k ? null : [n, k]; update(); return; }
  const par = [[n - 1, k - 1], [n - 1, k]].filter(([a, b]) => b >= 0 && b <= a);
  if (!par.every(([a, b]) => isRev(a, b))) { toast('Сначала откройте числа над этим «?».'); return; }
  S.rev.add(`${n}-${k}`); update();
}

scene.addEventListener('click', e => {
  const g = e.target.closest('[data-hit]'); if (!g) return;
  const [a, b, c] = g.dataset.hit.split(':');
  if (a === 'inc') setCnt(+b, S.cnt[+b] + 1);
  else if (a === 'dec') setCnt(+b, S.cnt[+b] - 1);
  else if (a === 'p') pickDish(+b, +c);
  else if (a === 'cell') { S.pick[0] = +b; S.pick[1] = +c; update(); }
  else if (a === 'L') tapLetter(+b);
  else if (a === 'S') tapSlot(+b);
  else if (a === 'N') tapNode(+b);
  else if (a === 'C') tapCell(+b, +c);
});

function loop(t) {
  requestAnimationFrame(loop);
  if (dirty || S.hl) { drawScene(t); dirty = false; }
}

function renderTools() {
  const id = LID(), tb = $('#tools');
  const B = (k, label, pressed) => `<button data-a="${k}"${pressed === undefined ? '' : ` aria-pressed="${pressed}"`}>${label}</button>`;
  const sep = '<span class="sep"></span>';
  tb.innerHTML = {
    mult: B('clearpick', 'Снять выбор') + sep + B('reset', 'Сброс'),
    perm: B('n2', '2 буквы', S.n2 === 2) + B('n3', '3 буквы', S.n2 === 3) + B('n4', '4 буквы', S.n2 === 4) + sep + B('reset', 'Сброс'),
    comb: B('t-1', 'Команд −') + B('t+1', 'Команд +') + sep + B('reset', 'Сброс'),
    pascal: B('r-1', 'Строка −') + B('r+1', 'Строка +') + sep + B('reset', 'Сброс'),
  }[id];
}
function resetLesson() {
  const Ls = LESSONS[S.lesson];
  if (Ls.cnt) { S.cnt = Ls.cnt.slice(); S.pick = [null, null, null]; }
  if (Ls.n2) { S.n2 = Ls.n2; S.slots = []; S.found = new Set(); }
  if (Ls.n3) { S.n3 = Ls.n3; S.k3 = Ls.k3; S.E = new Set(); S.first = null; }
  if (Ls.R) { S.R = Ls.R; revealBase(Ls.R); S.sel = null; }
}
function act(a) {
  if (a === 'reset') { resetLesson(); renderTools(); buildScheme(); update(); return; }
  if (a === 'clearpick') { S.pick = [null, null, null]; update(); return; }
  if (/^n\d$/.test(a)) { setN2(+a[1]); renderTools(); buildScheme(); return; }
  if (a === 't-1' || a === 't+1') { setN3(S.n3 + (a === 't-1' ? -1 : 1)); buildScheme(); return; }
  if (a === 'r-1' || a === 'r+1') setRows(S.R + (a === 'r-1' ? -1 : 1));
}
$('#tools').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });

}

function taskState(m) {
  const Ls = LESSONS[S.lesson];

// ---------- Scheme tab ----------
function ctlSpec() {
  const id = LID();
  if (id === 'mult') return [0, 1, 2].map(g => [`sG${g}`, `${GROUP[g]}: блюд`, 1, 6, () => S.cnt[g], v => setCnt(g, v)]);
  if (id === 'perm') return [['sN2', 'Букв n (меняет набор и очищает таблицу)', 2, 4, () => S.n2, v => { setN2(v); renderTools(); }]];
  if (id === 'comb') return [['sN3', 'Команд n', 3, 8, () => S.n3, v => setN3(v)], ['sK3', 'Размер группы k (для расчёта Cₙᵏ)', 1, 8, () => S.k3, v => setK3(v)]];
  return [['sR', 'Строк в треугольнике (последняя)', 4, 10, () => S.R, v => setRows(v)]];
}
function buildScheme() {
  const id = LID(), el = $('#pane-scheme');
  const title = { mult: 'Меню и число обедов', perm: 'Перестановки букв', comb: 'Турнир и сочетания', pascal: 'Строки треугольника' }[id];
  const heads = { mult: ['a · b', 'c', 'Обедов'], perm: ['n', 'n!', 'Собрано'], comb: ['Матчей', 'Cₙ²', 'Cₙᵏ'], pascal: ['Число', 'Сумма строки', 'Закрыто'] }[id];
  el.innerHTML = `<h2>${title}</h2><dl class="reads">${heads.map((t, i) => `<div><dt>${t}</dt><dd id="r${i + 1}"></dd></div>`).join('')}</dl>` +
    ctlSpec().map(([sid, label, mn, mx, get]) => `<div class="ctl"><label for="${sid}">${label} <output id="${sid}O"></output></label><input type="range" id="${sid}" min="${mn}" max="${mx}" step="1" value="${get()}"></div>`).join('') +
    `<p class="note" style="margin-top:12px">Ползунки делают то же, что кнопки на рабочем поле.</p>`;
  ctlSpec().forEach(([sid, , , , , set]) => el.querySelector('#' + sid).addEventListener('input', e => set(+e.target.value)));
}
function updateScheme(m) {
  const el = $('#pane-scheme'); if (el.hidden) return;
  const set = (s, v) => { const x = el.querySelector(s); if (x) x.textContent = v; };
  ctlSpec().forEach(([sid, , , , get]) => { const x = el.querySelector('#' + sid); if (!x) return; set('#' + sid + 'O', get()); if (document.activeElement !== x) x.value = get(); });
  if (m.kind === 'mult') { set('#r1', m.a * m.b); set('#r2', m.c); set('#r3', m.N); }
  else if (m.kind === 'perm') { set('#r1', m.n); set('#r2', m.total); set('#r3', m.got); }
  else if (m.kind === 'comb') { set('#r1', m.m); set('#r2', m.need); set('#r3', `${C(m.n, m.k)} = ${Cnk(m.n, m.k)}`); }
  else { set('#r1', m.sel ? `${C(m.sel[0], m.sel[1])} = ${Cnk(m.sel[0], m.sel[1])}` : '—'); set('#r2', m.sel ? 2 ** m.sel[0] : '—'); set('#r3', m.hidden); }
}

function renderPanes(m) {
  const Ls = LESSONS[S.lesson], done = !!S.done[Ls.id];
  if (S.tab === 'overview') {
    $('#pane-overview').innerHTML = `<div class="lesson-k">Урок ${S.lesson + 1} из ${LESSONS.length}</div><h2>${Ls.title}</h2>` +
      Ls.text.map(p => `<p>${p}</p>`).join('') +
      `<div class="life"><b>Зачем это в жизни</b>${Ls.why}</div>` +
      `<div class="taskbox"><div class="k">Задание</div><p>${Ls.task}</p><div class="state ${done ? 'done' : ''}">${taskState(m)}</div><p class="note">${Ls.hint}</p></div>` +
      `<button class="primary" id="goNext" ${S.lesson === LESSONS.length - 1 ? 'disabled' : ''}>Следующий урок ›</button>`;
    const n = $('#goNext'); if (n) n.onclick = () => setLesson(S.lesson + 1);
  }
  if (S.tab === 'parts') {
    $('#pane-parts').innerHTML = `<h2>Модель</h2><p class="note">Из чего состоит рабочее поле. Нажмите на пункт, чтобы найти его.</p><div class="parts">` +
      partsList().map(p => `<button class="part" data-id="${p.id}">${p.icon}<div><b>${p.name}</b><span>${p.spec}</span></div></button>`).join('') + `</div>`;
    $('#pane-parts').querySelectorAll('.part').forEach(b => b.onclick = () => { S.hl = { id: b.dataset.id, t: performance.now() }; dirty = true; });
  }
  if (S.tab === 'scheme') updateScheme(m);
  if (S.tab === 'calc') $('#pane-calc').innerHTML = calcHTML(m);

function calcHTML(m) {
  if (m.kind === 'mult') {
    const ab = m.a * m.b;
    let h = `<h2>Считаем обеды</h2><div class="formula">N = a · b · c</div><h3>По шагам</h3><div class="steps">` +
      step('салатов a', m.a) + step('к каждому салату горячее', `${m.a} · ${m.b} = ${ab} пар`) +
      step('к каждой паре напиток', `${ab} · ${m.c} = ${m.N}`) + step('всего обедов', m.N, 'sum') + `</div>`;
    h += `<h3>Проверка задания</h3><div class="steps">` +
      step('нужно', '24 обеда, в группах ≥ 2') + step('сейчас', `${m.N} ${m.okN ? '✓' : m.N === 24 ? '— но есть группа с 1 блюдом' : ''}`) +
      step('собранный обед', m.okPick ? `${NAMES[0][m.pick[0]]} + ${NAMES[1][m.pick[1]]} + ${NAMES[2][m.pick[2]]}` : 'выберите по блюду в каждой группе', 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Правило сложения для сравнения: только салат ИЛИ только горячее — это ${m.a} + ${m.b} = ${m.a + m.b} вариантов, а не ${ab}.</p>`;
  }
  if (m.kind === 'perm') {
    let h = `<h2>Число перестановок</h2><div class="formula">Pₙ = n! = n · (n − 1) · … · 1</div><h3>${m.n} буквы на ${m.n} места</h3><div class="steps">`;
    for (let i = 0; i < m.n; i++) h += step(`${i + 1}-е место`, `${m.n - i} ${m.n - i === 1 ? 'вариант' : 'варианта'}`);
    h += step(`P${sub(m.n)} = ${m.n}!`, `${chain(m.n)} = ${m.total}`, 'sum') + `</div>`;
    h += `<h3>Ваша таблица</h3><div class="steps">` + step('собрано', m.got) + step('осталось', m.total - m.got) +
      step('слов на каждую букву', `(${m.n} − 1)! = ${fact(m.n - 1)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Дальше растёт быстро: 5! = 120, 6! = 720, 7! = 5 040, 10! = 3 628 800.</p>`;
  }
  if (m.kind === 'comb') {
    const n = m.n, k = m.k;
    let h = `<h2>Сколько матчей</h2><div class="formula">Cₙᵏ = n! : (k! · (n − k)!)</div><h3>Пары команд при n = ${n}</h3><div class="steps">` +
      step('первая команда', `${n} вариантов`) + step('соперник', `${n - 1} вариантов`) +
      step('упорядоченных пар A' + sub(n) + '²', `${n} · ${n - 1} = ${n * (n - 1)}`) +
      step('каждый матч посчитан дважды', `${n * (n - 1)} : 2 = ${m.need}`) + step(C(n, 2), m.need, 'sum') + `</div>`;
    h += `<h3>Проверка</h3><div class="steps">` + step('проведено матчей', m.m) + step('нужно для n = 5', `${C(5, 2)} матчей ${m.ok ? '✓' : ''}`, 'sum') + `</div>`;
    h += `<h3>Группа из k = ${k} (ползунок в «Схеме»)</h3><div class="steps">` +
      step('с порядком A' + sub(n) + sup(k), `${Array.from({ length: k }, (_, i) => n - i).join(' · ')} = ${fact(n) / fact(n - k)}`) +
      step('порядков в группе k!', `${k}! = ${fact(k)}`) +
      step(C(n, k), `${fact(n) / fact(n - k)} : ${fact(k)} = ${Cnk(n, k)}`, 'sum') + `</div>`;
    return h + `<p class="note" style="margin-top:10px">Через факториалы: ${n}! : (${k}! · ${n - k}!) = ${fact(n)} : (${fact(k)} · ${fact(n - k)}) = ${Cnk(n, k)}.</p>`;
  }
  let h = `<h2>Треугольник Паскаля</h2><div class="formula">Cₙᵏ = Cₙ₋₁ᵏ⁻¹ + Cₙ₋₁ᵏ</div>`;
  if (!m.sel) h += `<p class="note">Нажмите на открытое число на рабочем поле — здесь появится его разбор.</p>`;
  else {
    const [n, k] = m.sel, v = Cnk(n, k);
    h += `<h3>${C(n, k)}: строка ${n}, место ${k}</h3><div class="steps">`;
    if (k === 0 || k === n) h += step('край', `${C(n, k)} = 1`);
    else h += step('два числа над ним', `${C(n - 1, k - 1)} = ${Cnk(n - 1, k - 1)}, ${C(n - 1, k)} = ${Cnk(n - 1, k)}`) + step('сумма', `${Cnk(n - 1, k - 1)} + ${Cnk(n - 1, k)} = ${v}`);
    h += step('по формуле', `${n}! : (${k}! · ${n - k}!) = ${big(fact(n))} : ${big(fact(k) * fact(n - k))} = ${v}`) +
      step('симметрия', `${C(n, n - k)} = ${v}`) + step(`сумма строки ${n}`, `2${sup(n)} = ${2 ** n}`, 'sum') + `</div>`;
  }
  h += `<h3>Задание</h3><div class="steps">` + step('строки 0…7 открыты', m.full ? 'да ✓' : `пока нет (последняя строка ${m.R}, закрыто ${m.hidden})`) +
    step('выбрано число', m.sel ? `${C(m.sel[0], m.sel[1])} = ${Cnk(m.sel[0], m.sel[1])}` : '—', 'sum') + `</div>`;
  return h + `<p class="note" style="margin-top:10px">Строки — это коэффициенты степени суммы: (a + b)² = a² + 2ab + b², коэффициенты 1, 2, 1 — строка 2.</p>`;
}

function renderMeter(m) {
  const el = $('#meter'), ok = !!S.done[LID()];
  if (m.kind === 'mult') el.innerHTML = `<div class="k">Обедов</div><div class="v ${m.okN ? 'ok' : ''}">${m.N}</div><div class="lr"><span>a·b·c</span><span>${m.a}·${m.b}·${m.c}</span></div><div class="lr"><span>выбрано</span><span class="${m.okPick ? 'ok' : ''}">${m.pick.filter(p => p !== null).length}/3</span></div>`;
  else if (m.kind === 'perm') el.innerHTML = `<div class="k">Перестановок</div><div class="v ${ok ? 'ok' : ''}">${m.got} / ${m.total}</div><div class="lr"><span>n</span><span>${m.n}</span></div><div class="lr"><span>n!</span><span>${chain(m.n)}</span></div>`;
  else if (m.kind === 'comb') el.innerHTML = `<div class="k">Матчей</div><div class="v ${ok ? 'ok' : ''}">${m.m}</div><div class="lr"><span>команд</span><span>${m.n}</span></div><div class="lr"><span>${C(m.n, m.k)}</span><span>${Cnk(m.n, m.k)}</span></div>`;
  else el.innerHTML = `<div class="k">Выбрано</div><div class="v ${ok ? 'ok' : ''}">${m.sel ? `${C(m.sel[0], m.sel[1])} = ${Cnk(m.sel[0], m.sel[1])}` : '—'}</div><div class="lr"><span>строк</span><span>0…${m.R}</span></div><div class="lr"><span>закрыто</span><span class="${m.hidden ? '' : 'ok'}">${m.hidden}</span></div>`;
}

function update() {
  const m = model(), Ls = LESSONS[S.lesson];
  if (!S.done[Ls.id] && Ls.check(m)) {
    S.done[Ls.id] = true; save(); renderStrip();
    setTimeout(() => toast(S.lesson < LESSONS.length - 1 ? 'Задание выполнено. Можно переходить к следующему уроку.' : 'Все задания выполнены. Комбинаторика покорена!'), 700);
  }
  renderMeter(m);
  $('#taskState').textContent = taskState(m);
  $('#taskState').classList.toggle('done', !!S.done[Ls.id]);
  renderPanes(m);
  const n = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  $('#progNum').textContent = `${n}/${LESSONS.length}`; $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  dirty = true;
}

const MINI = {
  mult: '<rect x="8" y="5" width="20" height="20" fill="none" stroke="#26324a"/><path d="M8 15h20M18 5v20" stroke="#26324a"/><circle cx="13" cy="10" r="2" fill="#ffb547"/><circle cx="23" cy="10" r="2" fill="#ffb547"/><circle cx="13" cy="20" r="2" fill="#ffb547"/><circle cx="23" cy="20" r="2" fill="#86e0a8"/><text x="46" y="20" font-size="10" fill="#e8ecf4" text-anchor="middle" font-family="monospace">a·b</text>',
  perm: '<text x="33" y="20" font-size="12" fill="#72d4e8" text-anchor="middle" font-family="monospace">КОТ·ТОК</text>',
  comb: '<circle cx="33" cy="4" r="3" fill="#72d4e8"/><circle cx="20" cy="26" r="3" fill="#72d4e8"/><circle cx="46" cy="26" r="3" fill="#86e0a8"/><path d="M33 4L20 26L46 26Z" fill="none" stroke="#b79cff" stroke-width="1.4"/>',
  pascal: '<text x="33" y="10" font-size="7" fill="#b79cff" text-anchor="middle" font-family="monospace">1</text><text x="33" y="18" font-size="7" fill="#e8ecf4" text-anchor="middle" font-family="monospace">1 2 1</text><text x="33" y="27" font-size="7" fill="#ffb547" text-anchor="middle" font-family="monospace">1 3 3 1</text>',
};
function renderStrip() {
  $('#lessons').innerHTML = LESSONS.map((Ls, i) => `<button class="lesson" data-i="${i}" aria-current="${i === S.lesson}">
      <svg viewBox="0 0 66 30" aria-hidden="true">${MINI[Ls.id]}</svg>
      <span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${Ls.title}</span></span>
      ${S.done[Ls.id] ? '<span class="chk" aria-label="выполнено">✓</span>' : ''}</button>`).join('');
  $('#lessons').querySelectorAll('.lesson').forEach(b => b.onclick = () => setLesson(+b.dataset.i));
  $('#prevL').disabled = S.lesson === 0; $('#nextL').disabled = S.lesson === LESSONS.length - 1;
}
$('#prevL').addEventListener('click', () => setLesson(S.lesson - 1));
$('#nextL').addEventListener('click', () => setLesson(S.lesson + 1));

function setLesson(i) {
  i = clamp(i, 0, LESSONS.length - 1);
  const Ls = LESSONS[i];
  S.lesson = i; S.hl = null;
  resetLesson();
  save();
  $('#taskK').textContent = `Задание · урок ${i + 1}`;
  $('#taskText').textContent = Ls.task;
  $('#hint').textContent = Ls.stage;
  renderTools(); renderStrip(); buildScheme(); update();
  const st = $('#lessons'), cur = st.querySelector('.lesson[aria-current="true"]');
  if (cur) { const sr = st.getBoundingClientRect(), cr = cur.getBoundingClientRect(); st.scrollLeft += (cr.left - sr.left) - (sr.width - cr.width) / 2; }
}

// for the AI tutor: what is on the screen right now
window.LUCH_CONTEXT = () => {
  const m = model(), Ls = LESSONS[S.lesson], id = Ls.id;
  let now = '';
  if (id === 'mult') now = `Меню из трёх групп. Салатов a = ${m.a} (${NAMES[0].slice(0, m.a).join(', ')}), горячих b = ${m.b} (${NAMES[1].slice(0, m.b).join(', ')}), напитков c = ${m.c} (${NAMES[2].slice(0, m.c).join(', ')}). Таблица вариантов: ${m.a} строк × ${m.b} столбцов, в каждой клетке ${m.c} точек; всего обедов a·b·c = ${m.N}. Условие «24 обеда, в каждой группе ≥ 2» ${m.okN ? 'выполнено' : 'пока не выполнено'}. Выбранный обед: ${m.pick.map((p, g) => p === null ? `${GROUP[g].toLowerCase()} — не выбрано` : NAMES[g][p]).join('; ')}.`;
  if (id === 'perm') now = `Буквы: ${LET.slice(0, m.n).join(', ')} (n = ${m.n}, всего n! = ${m.total} перестановок). На местах сейчас: ${m.slots.length ? word(m.slots) : 'пусто'}. Собрано разных перестановок: ${m.got} (${[...S.found].join(', ') || 'ни одной'}). Для задания нужно n = 3 и все 6 перестановок букв К, О, Т.`;
  if (id === 'comb') now = `Турнир «каждый с каждым»: ${m.n} команд по кругу (номера 1…${m.n}). Проведено матчей (линий): ${m.m}${m.m ? ` — пары ${[...S.E].map(e => e.split('-').map(x => +x + 1).join('–')).join(', ')}` : ''}. Число игр у команд: ${m.deg.map((d, i) => `${i + 1}: ${d}`).join(', ')}. ${m.first !== null ? `Выделена команда ${m.first + 1} (ждёт вторую).` : ''} В «Схеме» выбран размер группы k = ${m.k}, Cₙᵏ = ${Cnk(m.n, m.k)}. Для задания нужно 5 команд и все матчи между ними.`;
  if (id === 'pascal') now = `Треугольник Паскаля, строки 0…${m.R}; закрытых «?» чисел: ${m.hidden}. Строки 0…7 ${m.full ? 'полностью открыты' : 'ещё не все открыты'}. Выбрано число: ${m.sel ? `${C(m.sel[0], m.sel[1])} = ${Cnk(m.sel[0], m.sel[1])} (строка ${m.sel[0]}, место ${m.sel[1]})` : 'нет'}.`;
  return [
    `Раздел: математика, 9 класс, вероятность и статистика, тема «Комбинаторика». Урок ${S.lesson + 1} из ${LESSONS.length}: «${Ls.title}».`,
    `Объяснение урока: ${Ls.text.join(' ')}`,
    `Задание: ${Ls.task} Статус: ${S.done[id] ? 'выполнено' : 'не выполнено'}.`,
    `Сейчас на экране: ${now}`,
    `Пройдено уроков: ${Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length} из ${LESSONS.length}.`,
    'Не называй готовый ответ (нужные числа блюд, недостающие перестановки или пары, нужную клетку треугольника): веди ученика наводящими вопросами и проверяй его рассуждения.',
  ].join('\n');
};
window.LUCH_SUGGEST = () => {
  const Ls = LESSONS[S.lesson], done = S.done[Ls.id];
  const q = {
    mult: 'Чем правило умножения отличается от правила сложения?', perm: 'Почему перестановок именно n!?',
    comb: 'Чем сочетания отличаются от размещений?', pascal: 'Почему каждое число равно сумме двух над ним?',
  }[Ls.id];
  return [done ? 'Что я узнал в этом уроке?' : 'Подскажи, как выполнить задание', q, 'Где это пригодится в профессии?'];
};

revealBase(4);
setLesson(S.lesson);
fit();
requestAnimationFrame(loop);
})();
</script>
